entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN BËSCHKRÄIZ
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to beschkraiz.social — the community Mastodon instance for
      the Müllerthal town of Bëschkräiz, Luxembourg.

      The local feed is uneasy today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice one name flooding every
      thread: @marc_kayser.

      A finance blogger. Investigative journalist. He dug into where
      Luxembourg's money really goes. People are worried. He hasn't
      posted in six days.
    choices:
      - Look at his profile -> marc_profile

  marc_profile:
    type: tweet
    from: marc
    text: "GoldenStone Holdings owns 14 properties in Bëschkräiz through 6 shell companies. The bourgmestre approved every permit. Follow the money."
    choices:
      - That's his last real post... -> dead_signal

  dead_signal:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurry photo of sandstone rocks at night. No caption. Posted at
      2:47am. The metadata was stripped.

      His friends say Marc was meticulous — every post had context, every
      claim had receipts. This isn't him. The police say he probably went
      travelling. Nobody believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: commissaire
    text: >
      D'Police Grand-Ducale huet eng Vermësstmeldung kritt betreffend
      en Awunner vu Bëschkräiz. Am Moment gëtt et keng Hiwäiser op eng
      Stroftat. All nëtzlech Informatiounen kënnen un den 113 oder un
      de Commissariat gemellt ginn.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @anais_kayser is losing it
      on the feed. His best friend @luc_hoffmann is organising search
      parties in the Müllerthal gorges. His flatmate @tom_weber says
      Marc's laptop and external drives are gone.

      The journalist @nora_lopes, who Marc was feeding information to,
      has gone completely silent.

      And the real estate people — GoldenStone Holdings — are posting
      cheerful property listings like nothing happened.

      Nobody buys the police line. Nobody thinks Marc just "went
      travelling."
    effects: { trust_anais: "+5", trust_luc: "+5" }
    choices:
      - Start following Marc's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Bëschkräiz. Follow Marc's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Martine (café owner, knows everyone) -> martine_intro
      - Talk to Roger (forestier, knows the trails) -> roger_intro
      - Talk to Léonie (teen trail runner, seems shaken) -> leonie_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Marc with the rhythms of a small
      Müllerthal town: trail conditions, the bakery's quetschetaart,
      weather alerts for the gorges.

      Key names surface: Anaïs (sister, law student), Luc (best friend,
      photographer, visibly angry), Tom (flatmate, rattled), and the
      teens — Léonie, Félix, Sara — who admired Marc's blog.

      Also prominent: GoldenStone Holdings S.à r.l., the investment
      company buying up half the commune. Their posts are corporate PR.
      Marc's posts were the sledgehammer cracking them open.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Martine -> martine_intro
      - Talk to Roger -> roger_intro
      - Talk to Léonie -> leonie_intro

  # --- Martine (social map) ---

  martine_intro:
    type: tweet
    from: martine
    text: >
      De Café ass op mee d'Häerz ass schwéier. @marc_kayser, däin
      Dësch waart op dech. Komm séier zréck.
    effects: { trust_martine: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Martine -> martine_talk

  martine_talk:
    type: message
    text: >
      MARTINE: Moien! You're new? Bienvenue. Bad timing to arrive, though.
      Everyone's on edge about Marc.

      Let me tell you who's who. Anaïs is his little sister — she's
      studying law at uni.lu, sharp girl, completely devastated. Luc
      Hoffmann is his best friend since childhood — photographer, does the
      trail guides. He's furious right now, won't stop posting about the
      police doing nothing.

      Tom is Marc's flatmate. Quiet guy, programmer. But he's been weird
      since Marc vanished — nervous, checking his phone constantly.

      And then there's that Ben Stein character. He started showing up at
      the café a few months ago. Always reading Marc's blog on his laptop.
      Left comments on every post. He tried to buy Marc a drink once and
      Marc told him to schäisst off. Not like Marc to be rude. Something
      about Ben made him uncomfortable.
    effects: { trust_martine: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Ben -> martine_ben
      - Ask about GoldenStone -> martine_goldenstone
      - Thank her and move on -> quest1_hub

  martine_ben:
    type: message
    text: >
      MARTINE: Ben? He calls himself a financial analyst. Freelance,
      whatever that means. He showed up in Bëschkräiz about six months
      ago, rented a room above the pharmacie. Said he was working on
      "research."

      But all he researched was Marc. He'd sit in the corner with his
      laptop open on Marc's blog, taking notes. He followed Marc on
      every platform. He'd show up wherever Marc was — the gorges, the
      market, even at Luc's photo exhibitions.

      Marc called it "putain de weird" and I agreed with him. There's
      admiration and then there's whatever that was.
    effects: { trust_martine: "+5" }
    choices:
      - Ask about GoldenStone -> martine_goldenstone
      - Move on -> quest1_hub

  martine_goldenstone:
    type: message
    text: >
      MARTINE: GoldenStone Holdings. Merde, don't get me started. They
      started buying properties here three years ago. Old farmhouses,
      plots of land, even the old gendarmerie building. Always through
      different company names — you'd never know it was the same buyer.

      Marc figured it out. He traced the shell companies back to one
      guy: Claude Mersch. And Mersch's companies kept getting building
      permits approved by the commune. Every single one. Fast-tracked.

      Marc said on his blog that the bourgmestre was getting kickbacks.
      That's when things got serious.
    effects: { trust_martine: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Roger (the forestier, trails witness tease) ---

  roger_intro:
    type: tweet
    from: roger
    text: >
      35 joer am Bësch. ech kennen all Pad, all Fiels. @marc_kayser
      war ëmmer op de Weeër. hien ass net einfach ewech.
    effects: { trust_roger: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Roger -> roger_talk

  roger_talk:
    type: message
    text: >
      ROGER: I've walked every trail in the Müllerthal for thirty-five
      years. I know when a tree falls, when a path shifts. And I know
      when something isn't right.

      Marc hiked here every week. He said the gorges were where he
      thought best. He'd sit on the Schéissendëmpel bridge and write
      his blog posts on his phone. I'd see him out there at dawn
      sometimes.

      The morning after his last post, I found fresh tyre tracks on the
      forest road near Heringer Millen. That road is gated — only
      forestry vehicles use it. Someone drove up there at night. There
      were two sets of tracks. One vehicle going in. One coming out.
    effects: { trust_roger: "+10" }
    choices:
      - Did you tell the police? -> roger_police
      - Move on -> quest1_hub

  roger_police:
    type: message
    text: >
      ROGER: I called the commissariat. They wrote it down. That was it.
      Nobody came to look at the tracks. By the time it rained, they
      were gone.

      But I took photos. I'm a forestier — I document everything. Two
      sets of tyre tracks, one heavier than the other. The heavy one
      was a large vehicle — SUV or van. The lighter one could be Marc's
      Renault Clio.

      Something happened on that forest road.
    effects: { trust_roger: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Léonie (teen trail runner, witness tease) ---

  leonie_intro:
    type: tweet
    from: leonie
    text: >
      ech sinn komplett schockéiert @marc_kayser huet eis all inspiréiert
      mat sengem blog. hien huet gewisen datt d'Wahrheet wichteg ass.
      wann ee eppes weess sot et svp
    effects: { trust_leonie: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Léonie -> leonie_talk_early

  leonie_talk_early:
    type: message
    text: >
      LÉONIE: moien, t'es nouveau? c'est un timing de schäisst. marc
      c'est genre le mec le plus courageux de cette ville. il a écrit
      des trucs que personne d'autre osait dire sur les magouilles
      immobilières.

      et la jsuis flippée pcq félix il a vu un truc chelou l'autre
      soir au parking du trail mais il veut pas en parler. il dit que
      c rien mais genre... c'est clairement pas rien putain
    effects: { trust_leonie: "+10" }
    choices:
      - What did Félix see? -> leonie_felix_hint
      - Move on -> quest1_hub

  leonie_felix_hint:
    type: message
    text: >
      LÉONIE: jsp exactement. il était en session urbex genre vers les
      ruines du moulin et il a vu qqn qui fouillait dans la voiture de
      marc?? ou qqch comme ça. il flippe trop il veut pas en parler.
      faut lui demander direct mais il est méfiant avec les gens qu'il
      connaît pas. essaie d'abord de lui parler de skate ou d'urbex
      mdr
    effects: { trust_leonie: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Bëschkräiz. A small Luxembourg town
      in the Müllerthal gorges. A finance blogger who was exposing shell
      company corruption. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Anaïs (Marc's sister) -> anais_q1
      - Talk to Luc (Marc's best friend) -> luc_q1
      - Check what Tom (Marc's flatmate) is saying -> tom_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Anaïs Q1 ---

  anais_q1:
    type: tweet
    from: anais
    text: >
      mon frère a DISPARU et la police me dit qu'il est peut-être
      parti en voyage??? IL NE PART PAS SANS PRÉVENIR. jsuis en route
      de luxembourg-ville. quelqu'un va m'expliquer putain.
    effects: { trust_anais: "+5", contacts_followed: "+1" }
    choices:
      - DM Anaïs -> anais_q1_talk

  anais_q1_talk:
    type: message
    text: >
      ANAÏS: Who the fuck are you? Another person from this town who's
      going to tell me to calm down? My brother called me the night
      before he disappeared. He said he had everything — bank transfers,
      company registrations, the whole chain from the shell companies to
      the bourgmestre's accounts.

      He said "if anything happens to me, look at GoldenStone Holdings."
      Then he said something weird — "and tell that guy to stop following
      me." He hung up.

      That's the last I heard from him.
    effects: { trust_anais: "+10" }
    choices:
      - What guy? -> anais_theory
      - Move on -> quest1_hub

  anais_theory:
    type: message
    text: >
      ANAÏS: I don't know exactly. Marc told me a few weeks ago that
      someone was obsessed with his blog. Not just a fan — someone who
      was showing up in person, trying to "collaborate," sending him
      long DMs analysing his work. Marc said the guy knew shit about
      finance that wasn't public. Like he had access to the same
      documents Marc was investigating.

      Marc blocked him online. The guy started showing up at the café.
      Marc was genuinely creeped out. And that's not easy — my brother
      wasn't scared of anything. Not the corporations, not the
      politicians. But this guy got under his skin.
    effects: { trust_anais: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Luc Q1 ---

  luc_q1:
    type: tweet
    from: luc
    text: >
      JOUR 6 SANS NOUVELLES DE MARC. la police fait RIEN. le bourgmestre
      dit RIEN. GoldenStone poste des annonces immobilières comme si de
      rien n'était. C'EST UNE BLAGUE PUTAIN??
    effects: { trust_luc: "+5", contacts_followed: "+1" }
    choices:
      - DM Luc -> luc_q1_talk

  luc_q1_talk:
    type: message
    text: >
      LUC: Moien. Yeah, I'm angry. My best friend vanished and this
      whole fucking town acts like it's normal. It's not normal.

      Marc was about to blow the whole GoldenStone thing wide open. He
      had documents showing that Claude Mersch was laundering money
      through real estate purchases here — buying properties through
      chains of shell companies, inflating the prices, then selling
      them to "investors" who were just more shell companies. Classic
      money laundering. And the bourgmestre was rubber-stamping every
      building permit.

      Marc had it all. The company registrations from the RCS, the
      bank transfers, the permit approvals. Everything.

      Now he's gone and his laptop is gone with him.
    effects: { trust_luc: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Tom Q1 ---

  tom_q1:
    type: tweet
    from: tom
    text: >
      marc si tu lis ça stp réponds. tes affaires sont la. ton vélo est
      la. t'es pas parti de ton plein gré. je sais que t'es pas parti.
    effects: { trust_tom: "+5", contacts_followed: "+1" }
    choices:
      - DM Tom -> tom_q1_talk

  tom_q1_talk:
    type: message
    text: >
      TOM: I appreciate you reaching out but I don't really know you.
      Marc has a lot of contacts. People are reaching out from
      everywhere.

      ...I keep telling myself he'll walk through the door. It's been
      six days.

      [Tom is guarded. You'll need to build more trust before he
      opens up.]
    effects: { trust_tom: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Marc went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Félix (was doing urbex near the old mill) -> felix_interview
      - Find Roger (forestier, found tyre tracks) -> roger_interview
      - Find Pit (baker, starts at 4am) -> pit_interview
      - Find Romain (estate agent, works late) -> romain_interview

  # --- Félix (saw someone at Marc's car) ---

  felix_interview:
    type: tweet
    from: felix
    text: >
      session urbex tranquille aux ruines du moulin mais l'ambiance
      dans le village c chelou en ce moment. genre y a un truc qui va
      pas. jsp comment expliquer
    effects: { trust_felix: "+5" }
    choices:
      - Ask Félix about that evening -> felix_talk

  felix_talk:
    type: message
    text: >
      FÉLIX: wsh frr ok mais tu le dis à personne hein. j'étais aux
      ruines vers 19h pour des photos et j'ai vu le mec — ben stein,
      le gars chelou qui traîne au café — à côté de la voiture de marc
      au parking du trail. il avait l'air de fouiller dans le coffre.
      quand il m'a vu il s'est barré trop vite.

      genre moi j'ai rien dit pcq je voulais pas d'embrouilles mais
      la c'est chaud. c'est pas normal putain. un mec random qui
      fouille dans la caisse d'un autre à la tombée de la nuit? schäisst
    effects:
      trust_felix: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Roger (forestier, tyre tracks at night) ---

  roger_interview:
    type: tweet
    from: roger
    text: >
      D'Bëschweeër si fir Forstfuerwierker. Ech hunn frësch
      Reimspueren fonnt um Waldwee bäi Heringer Millen. Dat ass
      net normal.
    effects: { trust_roger: "+5" }
    choices:
      - Ask Roger what he found -> roger_talk_night

  roger_talk_night:
    type: message
    text: >
      ROGER: The forest road to Heringer Millen is gated. Only my
      service vehicle and the commune trucks have keys. But that
      morning — the morning after Marc's last post — I found fresh
      tyre tracks. Two sets.

      One heavy vehicle. SUV class. Deep treads. And one lighter
      car — could be Marc's Clio. The heavy vehicle went in first.
      The lighter one followed.

      Only the heavy vehicle came out. The lighter tracks just...
      stop. In the middle of the forest road. Like the car was
      left there. Or moved off-road.

      I photographed everything before the rain came.
    effects:
      trust_roger: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Pit (baker, saw car at dawn) ---

  pit_interview:
    type: tweet
    from: pit
    text: >
      Backzäit ëm 4 Auer wéi ëmmer. Mee dee Moien war eppes anescht.
      E grousst Gefier op der Strooss am Duerf. Ze séier. Ze fréi.
    effects: { trust_pit: "+5" }
    choices:
      - Ask Pit what he saw -> pit_talk

  pit_talk:
    type: message
    text: >
      PIT: I start the ovens at 4am. Every morning. That morning I
      was pulling the bréidel out and I heard a car. Not unusual — we
      get early deliveries. But this was a big vehicle, dark coloured,
