      "I have the shell company chain from the RCS. I have the
      inflated purchase prices. I have the Cyprus and Dubai transfers.
      I have the facilitation fee emails. I have the accounting
      records showing circular transactions."
    choices:
      - Send -> mersch_response

  mersch_response:
    type: message
    text: >
      MERSCH: This conversation is being forwarded to my legal
      counsel. Any publication of defamatory material will result in
      immediate proceedings. GoldenStone Holdings operates fully
      within Luxembourg law.

      But it's too late. You've sent the evidence to Nora, to the
      Frënn vum Müllerthal, and to the Parquet.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The money laundering story breaks. GoldenStone Holdings is
      placed under judicial investigation. Fourteen property
      transactions are frozen. The bourgmestre faces questions. The
      commune is in turmoil.

      But Marc?

      Without the stalking evidence, Ben Stein is never investigated.
      He leaves Bëschkräiz but creates new accounts. He continues to
      monitor Marc's blog. He follows Marc's sister online. He moves
      to another small town and finds another subject.

      Three months later, Marc reads about GoldenStone online. He
      returns quietly. He changes his routes. He locks his car
      obsessively. He checks for trackers every morning. He stops
      hiking alone.

      The corporation is exposed. But the person who terrorised
      Marc Kayser walks free to do it again.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: marc
    text: "i'm back. the money trail is public. the rest... we'll see."
    choices:
      - The End -> game_complete

  # --- ENDING C: Bourgmestre (Wrong Ending) ---

  confront_thierry:
    type: message
    text: >
      You confront Bourgmestre Schmit with your evidence.

      Within the hour, you receive a message from his lawyer:
    choices:
