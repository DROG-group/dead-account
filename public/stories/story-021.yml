  thierry_response:
    type: tweet
    from: joao
    text: >
      Mon client prend note de vos allégations. Toute diffusion
      publique de propos diffamatoires fera l'objet de poursuites
      immédiates devant les juridictions luxembourgeoises. — Cabinet
      Ferreira & Associés, Luxembourg
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The bourgmestre's lawyer buries your accusation. Without a
      direct link between Schmit and the money laundering itself —
      and the kickbacks are hard to prove without Marc's documents —
      your evidence is insufficient.

      GoldenStone continues to operate. The shell companies multiply.
      Ben Stein continues to watch. Marc stays hidden in the gorges.

      Six months later, @alex_reding creates a new account. It
      follows Marc's sister. Then his best friend. Then his flatmate.

      The bourgmestre wins re-election. GoldenStone breaks ground on
      three new projects. The money keeps washing through.
    choices:
      - The End -> game_complete

