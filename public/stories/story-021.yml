      GoldenStone Holdings S.à r.l. → owns BëschImmo S.A. → owns
      Müllerthal Properties S.à r.l. → owns LuxStone Invest S.A.
      → owns Kräiz Developments S.C.S. → owns Valley Real S.à r.l.

      Six companies. Same registered agent: Cabinet Ferreira &
      Associés. Same beneficial owner buried four layers deep:
      Claude Mersch.

      Together they've purchased 14 properties in Bëschkräiz in
      three years. Total declared value: €23 million. Estimated
      market value: €9 million. The properties were bought at
      2.5x their worth.

      That's not investment. That's money laundering.
