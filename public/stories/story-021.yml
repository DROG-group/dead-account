      transactions are voided.

      And Marc Kayser, reading the story from a hiking shelter deep
      in the Müllerthal gorges where he's been hiding for eight days
      with nothing but his laptop and a sleeping bag, calls his sister
      for the first time since he vanished.

      "Ech kommen heem."
