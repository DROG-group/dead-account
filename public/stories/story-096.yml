      have photographs of your surveillance board. I have witnesses."
    choices:
      - Send -> vigga_response

  vigga_response:
    type: message
    text: >
      Vigga doesn't respond for hours. Then:

      VIGGA: You don't understand. His craft is dying. Nobody else
      sees what he's doing — the last living connection to 500 years
      of marshland building tradition. I'm preserving him. His
      techniques, his movements, his process. Everything.

      If the world loses Kasper Nørgaard's thatching, it loses
      something irreplaceable. I'm the only one who understands that.
      Everything I did was to protect the craft.

      That's not preservation. That's obsession. And theft. And
      stalking. And breaking and entering.

      You've already sent everything to Betjent Frandsen. And to
      Hanne Skou.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Betjent Frandsen arrests Vigga Stein — real name Vibeke
      Stensgaard, no university affiliation, a history of fixation
      on traditional craftspeople in three other Danish villages. She
      had Kasper's work bag, his backup camera, his soil samples, and
      a room papered with photographs of his daily life.

      Hanne Skou, armed with the full evidence package — geological
      surveys, groundwater tests, permit irregularities, the
      borgmester's secret fund — publishes in Jyllands-Posten.
      National environmental inspectors arrive within 48 hours. The
      bore holes are sealed. NordsjøEnergi faces criminal charges
      for illegal waste disposal. Borgmester Kjeldsen resigns. The
      4.2 million kroner fund is frozen.

      And Kasper Nørgaard, who has been hiding at a friend's farm
      near Ribe, reads the story on his borrowed phone.

      He calls Oliver first. "Jeg kommer hjem. Der er tag der skal
      lægges."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: kasper
    text: >
      marsken overlever. rørene vokser. tagene holder. tak til jer
      der ikke gav op.
    choices:
      - The End -> game_complete

  # --- ENDING B: Torben (Partial Ending) ---

  confront_torben:
    type: message
    text: >
      You present the drilling evidence to Torben Hedegaard:

      "I have geological surveys proving these aren't oil test wells.
      I have groundwater samples showing industrial contamination. I
      have permit records showing the borgmester's secret royalty fund.
      I have photographs of your trucks operating illegally at night."
    choices:
      - Send -> torben_response

  torben_response:
    type: message
    text: >
      TORBEN: This communication has been forwarded to our legal
      department. NordsjøEnergi A/S operates within all applicable
      regulatory frameworks. Any defamatory publication will result
      in immediate legal action.

      But it's too late. You've sent everything to Hanne, to the
      Naturfond, and to the national environmental agency.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The waste injection story breaks nationally. NordsjøEnergi is
      ordered to halt all operations. The bore holes are sealed. The
      borgmester faces an investigation into corruption. The village
      is shaken — some are relieved, others fear losing the promised
      investment.

      But Kasper?

      Without the stalking evidence, Vigga is never investigated.
      She still has Kasper's work bag, his samples, his photographs.
      She creates a new account and continues her surveillance from
      a distance.

      Kasper returns three months later, when the drilling stops. He
      reopens his workshop. But he installs new locks. He checks
      behind him when he walks to the reed beds. He doesn't work
      alone anymore.

      The marsh is saved. But the person who terrorised Kasper walks
      free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: kasper
    text: "marsken er ren igen. rørene kan vokse. resten... det tager tid."
    choices:
      - The End -> game_complete

  # --- ENDING C: Borgmester (Wrong Ending) ---

  confront_magnus:
    type: message
    text: >
      You confront Borgmester Kjeldsen with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> magnus_response

  magnus_response:
    type: tweet
    from: morten
    text: >
      Min klient tager til efterretning at der er fremsat
      udokumenterede påstande. Enhver offentliggørelse af
      injurierende materiale vil medføre omgående retslige skridt.
      — Gram & Partners, Esbjerg
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The borgmester's lawyer buries your accusation. Without a
      direct link between Kjeldsen and the waste injection — the
      royalty fund alone isn't enough — your evidence stalls in
      legal proceedings.

      NordsjøEnergi continues operating under their existing permits.
      Vigga continues watching. Kasper stays in hiding.

      The reed beds thin. The groundwater darkens. Six months later,
      @marskvansen creates a new account. It follows Kasper's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
