entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN MARSKHØJ
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to marskhøj.social — the community Mastodon instance for
      the North Sea marshland village of Marskhøj, Western Jutland.

      The local feed is uneasy. Something has happened in the marsh.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name dominates everything:
      @kasper_noergaard.

      A young thatched roof craftsman. Twenty-three years old. One of
      the last people in the region who knew the traditional marsh
      thatching technique. He documented his work — the old farmhouses,
      the reed harvesting, the craft dying out across Denmark.

      He hasn't posted in six days. His workshop is locked. His tools
      are still inside.
    choices:
      - Look at his profile -> kasper_profile

  kasper_profile:
    type: tweet
    from: kasper
    text: "De vil bore i marsken. Lige der hvor rørene gror. Hvis de ødelægger rørskovene, er det slut med stråtag i Marskhøj. For altid."
    choices:
      - That was his last real post... -> strange_photo

  strange_photo:
    type: message
    text: >
      Three days after that post, his account uploaded a single photo:
      a muddy field. Flat, grey, blurred. Posted at 4am. No caption.

      His friends say Kasper never posted without a story. He narrated
      every reed he cut, every roof he laid. This isn't him.

      The police say he probably went to Copenhagen for work. Nobody
      believes that. Kasper would never leave during reed harvest season.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: betjent
    text: >
      Vi har modtaget en anmeldelse om en forsvundet person fra
      Marskhøj. Der er på nuværende tidspunkt ingen tegn på en
      kriminel handling. Eventuelle oplysninger bedes rettet til
      Syd- og Sønderjyllands Politi på 114.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The village is small and loud. Oliver, Kasper's best friend, is
      furious. Thea, his sister, is driving down from Esbjerg. Sebastian,
      the farmer who supplies Kasper's reed, says the marshland tells
      the truth.

      And the journalist Hanne Skou has gone quiet. She was writing
      about the drilling. Now she's posting nothing.

      Meanwhile, NordsjøEnergi A/S keeps posting about their
      "sustainable exploration programme." The comments are brutal.

      Nobody thinks Kasper just left for Copenhagen.
    effects: { trust_oliver: "+5", trust_thea: "+5" }
    choices:
      - Start following Kasper's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Marskhøj. Follow Kasper's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Josephine (inn owner, knows everyone) -> josephine_intro
      - Talk to Sebastian (farmer, knows the marsh) -> sebastian_intro
      - Talk to Emil (teen, seems upset) -> emil_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Kasper with the rhythms of marshland
      life: tide warnings, sheep updates, weather alerts, the inn's
      daily menu.

      Key names surface: Oliver (best friend, carpenter, angry), Thea
      (sister, nurse, desperate), Sebastian (farmer, knows the marsh
      better than anyone), and the teens — Emil and Lærke — who helped
      Kasper harvest reeds every autumn.

      Also prominent: NordsjøEnergi A/S and their test drilling
      programme. Their PR is polished. Kasper's last posts were the
      opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Josephine -> josephine_intro
      - Talk to Sebastian -> sebastian_intro
      - Talk to Emil -> emil_intro

  # --- Josephine (social map) ---

  josephine_intro:
    type: tweet
    from: josephine
    text: >
      Kroen er åben men det føles forkert. @kasper_noergaard plejede
      at sidde ved vinduesbordet og tegne tagkonstruktioner på
      servietterne. Bordet står tomt. Kom hjem, dreng.
    effects: { trust_josephine: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Josephine -> josephine_talk

  josephine_talk:
    type: message
    text: >
      JOSEPHINE: Nå, you're new here? Shit timing, I'll say that.
      Everyone's freaking out about Kasper. Let me give you the lay
      of the land.

      Oliver is Kasper's best mate — they grew up together, both
      craftsmen. Oliver's a carpenter. He's losing it right now.
      Thea is Kasper's older sister, nurse in Esbjerg, she's on her
      way. Sebastian Møller — the farmer — he and Kasper work together.
      Sebastian grows the reed, Kasper thatches with it. They've been
      a team for years.

      And then there's that architecture student — Vigga something.
      Been hanging around the village for weeks, photographing every
      roof Kasper ever touched. Kasper said she was getting weird.
      Always showing up at his workshop. Always wanting to "observe
      the craft." He told her to back off. She didn't.

      Oh — and NordsjøEnergi? For helvede. Don't get me started on
      those assholes.
    effects: { trust_josephine: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Vigga -> josephine_vigga
      - Ask about NordsjøEnergi -> josephine_drilling
      - Thank her and move on -> quest1_hub

  josephine_vigga:
    type: message
    text: >
      JOSEPHINE: Vigga Stein. Architecture student from Aarhus, she
      says. Showed up about two months ago. At first it was fine —
      she was researching traditional thatching techniques, wanted to
      interview Kasper, take photos. Fedt, right? Good for the craft.

      But then she didn't leave. She rented a room in the village.
      She started showing up at Kasper's workshop every day. She'd
      sit and watch him work for hours. She followed him to the reed
      beds. She knew his schedule better than Oliver did.

      Kasper told me: "She doesn't blink when she looks at me. It's
      mega sygt." He asked her to give him space. She said she was
      "just doing research." Same shit, different day.
    effects: { trust_josephine: "+5" }
    choices:
      - Ask about the drilling -> josephine_drilling
      - Move on -> quest1_hub

  josephine_drilling:
    type: message
    text: >
      JOSEPHINE: NordsjøEnergi got permission to do test drilling in
      the marshland. Test drilling! In a protected wetland! They say
      it's "preliminary exploration" and won't damage anything.
      Kraftedeme, they've already driven heavy machinery through the
      reed beds.

      The borgmester — Magnus Kjeldsen — signed off on it. Nobody
      voted. No public hearing. And rumour is he's getting royalty
      agreements. His cousin's construction company got the contract
      for the access roads.

      Kasper was the loudest voice against it. He said the drilling
      would destroy the reed beds — and without reeds, there's no
      thatching. A 500-year tradition, dead. Because some oil bastards
      want to poke holes in the marsh.

      Two weeks after his biggest protest post, he vanishes. Connect
      the dots yourself.
    effects: { trust_josephine: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sebastian (the marsh, witness tease) ---

  sebastian_intro:
    type: tweet
    from: sebastian
    text: >
      marsken lyver ikke. der er spor i mudderet ved rørskoven.
      tungere end et menneske. maskiner har været der om natten.
      @kasper_noergaard havde ret. de ødelægger det hele.
    effects: { trust_sebastian: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sebastian -> sebastian_talk

  sebastian_talk:
    type: message
    text: >
      SEBASTIAN: I've farmed this marshland for thirty years. My
      father farmed it before me. The reed beds are everything — they
      hold the ground together, they filter the water, they give us
      material for the roofs. Without them, this village drowns in
      the next storm surge.

      Kasper understood that. He was the only young person who gave
      a shit about the traditional craft. He learned thatching from
      old Henrik — who's dead now — and he was carrying it forward.
      Him and me, we harvested reed together every autumn.

      And now NordsjøEnergi drives trucks through the reed beds at
      night. I've seen the tracks. They're doing more than "test
      drilling." They're clearing land.

      Kasper was documenting everything. GPS coordinates, photos,
      dates. He was building a case. And then he's gone.
    effects: { trust_sebastian: "+10" }
    choices:
      - Did you see anything unusual recently? -> sebastian_night
      - Move on -> quest1_hub

  sebastian_night:
    type: message
    text: >
      SEBASTIAN: The night before Kasper went quiet — I was checking
      on the sheep, around midnight. I saw lights out in the marsh.
      Not headlights. Work lights. The kind they use on drill rigs.

      And voices. Angry voices. I couldn't make out words, but one
      of them was Kasper. I know his voice. He was shouting at
      someone.

      By the time I got closer, everyone was gone. Just tire tracks
      in the mud. Deep ones. And Kasper's bicycle, lying on the dike
      path.

      His bicycle. Just lying there.
    effects: { trust_sebastian: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Emil (teen, witness tease) ---

  emil_intro:
    type: tweet
    from: emil
    text: >
      hold nu kæft det her er fucked. kasper er den fedeste dude i
      hele marskhøj og nu er han bare væk?? politiet siger han er
      taget til kbh?? han HADER kbh for helvede. noget er mega galt
    effects: { trust_emil: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Emil -> emil_talk_early

  emil_talk_early:
    type: message
    text: >
      EMIL: hvem er du?? ok whatever. kasper er bare den sygeste
      type. han lærte mig at skære rør og binde tagbundter. det
      lyder kedeligt men det er faktisk mega fedt når man er derude
      i marsken.

      og den der vigga pige?? satans hun er creepy. hun sidder og
      glor på kasper som en eller anden stalker. lærke og mig vi
      jokede med det men honestly det var ikke sjovt. kasper sagde
      hun fulgte efter ham hjem en aften.

      og så er der borefolkene. lort mand. de kører rundt med store
      maskiner om natten. lærke har billeder.
    effects: { trust_emil: "+10" }
    choices:
      - What did Lærke photograph? -> emil_laerke_hint
      - Move on -> quest1_hub

  emil_laerke_hint:
    type: message
    text: >
      EMIL: lærke er mega god til foto. hun har taget billeder af
      boretårnene om natten — der hvor de ikke burde bore. og hun
      har billeder af vigga. vigga der sidder i sin bil foran
      kaspers værksted klokken lort om aftenen. bare sidder der.
      helt mørkt.

      lærke viser det nok hvis du snakker pænt til hende. hun er
      skrap men hun er sej. bare sig at emil sendte dig lol
    effects: { trust_emil: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Marskhøj. A marshland village built
      on reeds and tradition. A young craftsman who was fighting to
      protect both. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Oliver (Kasper's best friend) -> oliver_q1
      - Talk to Thea (Kasper's sister) -> thea_q1
      - Check what the journalist Hanne is doing -> hanne_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Oliver Q1 ---

  oliver_q1:
    type: tweet
    from: oliver
    text: >
      min bedste ven er forsvundet og ingen gør en skid. politiet
      siger "vent." borgmesteren siger "ro på." HOLD NU KÆFT og
      find ham. kasper ville aldrig bare tage af sted. ALDRIG.
    effects: { trust_oliver: "+5", contacts_followed: "+1" }
    choices:
      - DM Oliver -> oliver_q1_talk

  oliver_q1_talk:
    type: message
    text: >
      OLIVER: Who the hell are you? Another one who's going to tell
      me to calm down? My best friend vanished and nobody's doing
      shit about it.

      Kasper called me that night. He said he'd found something at
      the drill site — something that proved NordsjøEnergi was doing
      way more than test drilling. He said "they're not looking for
      oil, Oliver. It's something else." Then the line went dead.

      That's the last I heard from him.
    effects: { trust_oliver: "+10" }
    choices:
      - What do you think happened? -> oliver_theory
      - Move on -> quest1_hub

  oliver_theory:
    type: message
    text: >
      OLIVER: I think two things happened and they crashed together.
      That Vigga woman had been getting worse — Kasper showed me
      messages she sent him. Dozens of DMs he never answered. She
      photographed his house at night. She knew what time he woke up.
      That's not research, that's stalking.

      And then the drilling company. Kasper had evidence they were
      illegally expanding operations. He was going to the press.

      Either the company shut him up, or that Vigga woman went too
      far, or both. For helvede, I don't know. But someone knows
      where he is.
    effects: { trust_oliver: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Thea Q1 ---

  thea_q1:
    type: tweet
    from: thea
    text: >
      MIN BROR ER FORSVUNDET. Han ringer ikke. Han svarer ikke.
      Hans cykel lå i marsken. Hans dør er låst indefra. HVEM
      LÅSER EN DØR INDEFRA OG FORSVINDER??? Politiet gør INTET.
    effects: { trust_thea: "+5", contacts_followed: "+1" }
    choices:
      - DM Thea -> thea_q1_talk

  thea_q1_talk:
    type: message
    text: >
      THEA: You're new here. I don't know you. But I'll talk to
      anyone who's actually trying to find my brother.

      Kasper is not the type to disappear. He has sheep to feed. He
      has three roofs under contract. He has reed to harvest before
      the frost. He would NEVER just leave.

      He told me last week that someone was following him. He thought
      it was that architecture student but he wasn't sure. And he
      said the borgmester threatened him — told him to "stop making
      noise" about the drilling or there'd be consequences.

      The borgmester. Threatening a 23-year-old craftsman. What kind
      of village is this becoming?
    effects: { trust_thea: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Hanne Q1 ---

  hanne_q1:
    type: tweet
    from: hanne
    text: >
      Arbejder på en sag. Mere snart.
    effects: { trust_hanne: "+5", contacts_followed: "+1" }
    choices:
      - DM Hanne -> hanne_q1_talk

  hanne_q1_talk:
    type: message
    text: >
      HANNE: I can't talk about my sources. Journalistic integrity.

      But I'll say this: the drilling story is bigger than anyone
      in Marskhøj realises. And Kasper knew it.

      [Hanne is guarded. She'll need evidence before she talks.]
    effects: { trust_hanne: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Kasper went silent. The marsh holds
      secrets. People saw things. Piece together the timeline from
      witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Lærke (teen photographer, was in the marsh) -> laerke_interview
      - Find William (fisherman, works the sluice at night) -> william_interview
      - Find Freja (nature photographer, checks camera traps) -> freja_interview
      - Find Clara (vet, was on a night call) -> clara_interview

  # --- Lærke (photographs of the drill site at night) ---

  laerke_interview:
    type: tweet
    from: lærke
    text: >
      jeg har billeder. fra marsken. fra den aften. men jeg er
      bange for at poste dem. folk siger jeg skal slette dem.
      HVILKE folk?? pis af med jeres trusler
    effects: { trust_lærke: "+5" }
    choices:
      - Ask Lærke about that evening -> laerke_talk

  laerke_talk:
    type: message
    text: >
      LÆRKE: ok du kender emil right? han sagde du var chill.
      so basically. jeg var ude i marsken den aften med mit kamera.
      nattebilleder af fuglene, det gør jeg tit.

      og så ser jeg lys ude ved borestedet. store lys. og der er
      folk. og maskiner. klokken er bare 23 om aftenen liksom??
      de skal slet ikke bore om natten.

      og så ser jeg kasper. han kommer cyklende ad diget. han
      råber af dem. og der er en fra selskabet — torben tror jeg —
      der griber hans arm. kasper river sig løs og cykler væk.

      men det er ikke det værste. der var EN TIL. i mørket, bag
      rørene. en person der bare stod og kiggede. på kasper.
      hun havde et kamera med et mega langt objektiv.

      det var vigga. klokken fucking 23 i marsken.
    effects:
      trust_lærke: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      drilling_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Continue investigating -> quest2_hub

  # --- William (fisherman, saw vehicles at the sluice) ---

  william_interview:
    type: tweet
    from: william
    text: >
      slusen var åben i nat. den åbner kun ved stormflod. der var
      ingen stormflod. nogen har åbnet den manuelt. hvorfor?
    effects: { trust_william: "+5" }
    choices:
      - Ask William what he saw -> william_talk

  william_talk:
    type: message
    text: >
      WILLIAM: I check the sluice every night — it's how I keep my
      eel traps maintained. Around midnight I saw two vehicles on
      the marsh road. One was a NordsjøEnergi truck — white with
