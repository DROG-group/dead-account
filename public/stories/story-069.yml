      pipe. I have drone footage of tanker trucks dumping at night. I
      have your compliance officer's original numbers before you
      falsified them."
    choices:
      - Send -> erik_response

  erik_response:
    type: message
    text: >
      ERIK: Denne korrespondance videresendes til vores
      juridiske afdeling. Enhver offentliggørelse af injurierende
      materiale vil medføre øjeblikkelige retlige skridt. DanPork
      overholder alle gældende miljøregler.

      But it's too late. You've sent the evidence to Rikke, to
      Naturbeskyttelsen, and to Miljøstyrelsen.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. DanPork is ordered to halt discharge
      pending investigation. The facility may close. Four hundred jobs
      hang in the balance. The village is divided.

      But Mads?

      Without the stalking evidence, Camilla is never investigated.
      She continues to live two streets from his farm. She continues
      to monitor his accounts. She creates a new anonymous profile.

      Three months later, Mads reads about DanPork online. He returns
      quietly. He installs cameras on his property. He locks his truck
      every night. He checks his mirrors constantly.

      The corporation is exposed. But the person who terrorised Mads
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: mads
    text: "jeg er hjemme. vandet er renere. resten... vi ser."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_henrik:
    type: message
    text: >
      You confront Mayor Dalgaard with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> henrik_response

  henrik_response:
    type: tweet
    from: line
    text: >
      Min klient tager dine påstande til efterretning. Enhver
      offentlig fremsættelse af ærekrænkende udtalelser vil medføre
      øjeblikkelige retlige skridt. — Søgaard & Partners, Aalborg
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Dalgaard and DanPork's dumping — and there isn't
      one beyond political protection — your evidence is insufficient.

      DanPork continues to operate. Camilla continues to watch.
      Mads stays in hiding.

      Six months later, @mikkel_vang creates a new account. It
      follows Mads's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: LYNGHØJ — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Mads's story explores themes of
