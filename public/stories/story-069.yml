    text: >
      Lynghøj Kommune's public environmental database shows water
      quality monitoring for the stream that runs past DanPork. The
      readings are consistently within limits — suspiciously
      consistent. The same numbers, month after month.

      But Mads posted his own independent tests on Lynghoj.social.
      His readings show nitrate levels three times the legal limit
      and ammonia spikes that correspond to DanPork's production
      schedule. Higher on weekdays. Higher at night.

      The official numbers and Mads's numbers can't both be right.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
