entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN LYNGHØJ
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Lynghoj.social — the community Mastodon instance for
      the village of Lynghøj, Jutland.

      The local feed is uneasy today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name everywhere:
      @mads_jensen.

      An organic farmer. Community fixture. He ran the village farm shop
      and spent years fighting against industrial pig farming on the
      heath. People are panicking. He hasn't posted in six days.
    choices:
      - Look at his profile -> mads_profile

  mads_profile:
    type: tweet
    from: mads
    text: "gylle i bækken igen. DanPork-anlægget dumper om natten. jeg har billeder, datoer, prøver. det her stopper NU."
    choices:
      - That's his last real post... -> grey_field

  grey_field:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurred photo of a grey field at dawn. No caption. Posted at
      4am. Grainy, off-angle, like a phone dropped in mud.

      His friends say that's not his style. Mads always wrote long
      captions about soil health and seasons. The police say he
      probably went on holiday. Nobody buys it.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: politiet
    text: >
      Vi har modtaget en anmeldelse vedr. en borger fra Lynghøj.
      Der er på nuværende tidspunkt ikke grundlag for at antage, at
      der er sket noget kriminelt. Oplysninger kan rettes til
      lokalstationen eller 114.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @astrid_krogh is posting
      from Thisted, demanding answers. His best friend @peter_vestergaard
      checked the farm — tools left out, tractor running low on diesel
      in the field. His ex @camilla_bech is strangely active online.

      The vet @niels_skriver says Mads's animals were left unfed. The
      journalist @rikke_holm hasn't written a word.

      And DanPork A/S, the industrial pig operation next door, just
      posted a press release about their "excellent environmental
      record."

      Nobody thinks Mads just went on holiday.
    effects: { trust_astrid: "+5", trust_peter: "+5" }
    choices:
      - Start following Mads's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Lynghøj. Follow Mads's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Karen (kro owner, knows everyone) -> karen_intro
      - Talk to Lars (neighbouring pig farmer) -> lars_intro
      - Talk to Freja (teen, rides her horse past the farm) -> freja_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Mads with the rhythms of a Jutland
      village: weather warnings, cattle auctions, the kro's Friday
      steak special, someone's dog loose on the heath.

      Key names surface: Astrid (sister, nurse in Thisted), Peter
      (best friend, carpenter, furious), Camilla (ex-girlfriend, moved
      back recently), and the teens — Freja, Magnus, Signe — who
      hung out at Mads's farm shop.

      Also prominent: DanPork A/S, the industrial pig facility on the
      edge of town. Their posts are corporate PR. Mads's posts were
      the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Karen -> karen_intro
      - Talk to Lars -> lars_intro
      - Talk to Freja -> freja_intro

  # --- Karen (social map) ---

  karen_intro:
    type: tweet
    from: karen
    text: >
      Kroen er åben men stemningen er tung. @mads_jensen, din plads
      ved baren venter. Kom nu hjem.
    effects: { trust_karen: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Karen -> karen_talk

  karen_talk:
    type: message
    text: >
      KAREN: You're new here? Welcome, though the timing is rotten.
      Everyone's on edge about Mads.

      Let me tell you who's who. Astrid is his big sister — she's a
      nurse in Thisted, drives down every weekend. Peter Vestergaard
      is his best mate, they've been friends since folkeskole. Good
      man, handy with everything.

      Camilla Bech — that's the tricky one. She and Mads were together
      for two years. She moved away, came back six months ago. Nobody
      knows why. Mads told me she wouldn't leave him alone. He said
      "hun forstår ikke et nej."

      And then there's DanPork. That factory stinks — literally and
      figuratively. Mads has been documenting their dumping for months.
      Erik Lund, the plant director, threatened him at a council
      meeting. In public. Everyone heard it.
    effects: { trust_karen: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Camilla -> karen_camilla
      - Ask about DanPork -> karen_danpork
      - Thank her and move on -> quest1_hub

  karen_camilla:
    type: message
    text: >
      KAREN: Camilla? Sgu, that's a story. They dated two years. Mads
      broke it off because she was... intense. Possessive. She'd show
      up at his fields unannounced, check his phone, get angry if he
      talked to other women at the kro.

      He ended it clearly. She moved to Aalborg. Then six months ago
      she just... came back. Rented a house two streets from his farm.
      Started coming to the kro whenever he was there. Commenting on
      all his posts. He told me it was getting creepy.

      "Hun stalker mig, Karen. Hvad fanden skal jeg gøre?"

      Those were his words. Two weeks before he vanished.
    effects: { trust_karen: "+5" }
    choices:
      - Ask about DanPork -> karen_danpork
      - Move on -> quest1_hub

  karen_danpork:
    type: message
    text: >
      KAREN: DanPork has been here five years. Before that it was nice
      farmland. Now it's 800 sows in metal sheds and the smell in
      summer is unbearable. The slurry lagoon is massive — you can see
      it from the road.

      Mads was the first to actually test the water in the stream.
      The one that runs past DanPork and through the village. He found
      nitrates, ammonia, things that shouldn't be there. He said they
      were dumping slurry illegally at night, directly into the stream.

      Two weeks after he went public with the data, he's gone. For
      helvede, you don't need to be a detective.
    effects: { trust_karen: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lars (neighbouring farmer, corporate link) ---

  lars_intro:
    type: tweet
    from: lars
    text: >
      mads jensen er en god nabo. vi er uenige om meget men han er
      hæderlig. håber han dukker op snart.
    effects: { trust_lars: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Lars -> lars_talk

  lars_talk:
    type: message
    text: >
      LARS: Look, I run a conventional pig operation. Mads runs
      organic. We disagreed about everything — pesticides, stocking
      density, the whole thing. But we respected each other. He's a
      decent man.

      DanPork is different. They're not farmers, they're a factory.
      Eight hundred sows, no pasture, slurry everywhere. Even I think
      it's too much. And Mads had proof they were breaking the rules.

      The stream that runs past their place? It used to have fish in
      it. Now it's dead. Mads tested it and the numbers were bad.
      Really bad. He showed me the results. I told him to be careful.
    effects: { trust_lars: "+10" }
    choices:
      - Did anything unusual happen recently? -> lars_night
      - Move on -> quest1_hub

  lars_night:
    type: message
    text: >
      LARS: The week before Mads disappeared, I saw something odd. A
      car parked outside his farm at night. Not a car I recognised —
      it was small, dark blue, and it was just sitting there with the
      lights off. Around 22:00. I thought maybe it was Camilla again.

      She used to do that when they were together. Park outside and
      wait for him. He hated it. Told me about it many times.

      And then the night he vanished — I heard a truck on the road
      past DanPork around 2am. Big vehicle. Going toward the moor.
      That's not normal.
    effects: { trust_lars: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Freja (teen, rides past the farm) ---

  freja_intro:
    type: tweet
    from: freja
    text: >
      sgu mands @mads_jensen er den eneste voksne her der ikke er
      totalt ligegyldig. hans gårdbutik var det bedste sted. hvad
      fanden sker der??
    effects: { trust_freja: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Freja -> freja_talk_early

  freja_talk_early:
    type: message
    text: >
      FREJA: hvem er du?? ok whatever. mads er sgu den fedeste. han
      lod os hænge ud i gårdbutikken efter skole, han lærte signe at
      male landskaber, han gav magnus skaterampen i laden.

      og nu er han bare væk?? det er bare fucked for helvede.

      magnus så noget mærkeligt den aften btw men han tør ikke sige
      det. han siger det er lort men det er det sgu ikke.
    effects: { trust_freja: "+10" }
    choices:
      - What did Magnus see? -> freja_magnus_hint
      - Move on -> quest1_hub

  freja_magnus_hint:
    type: message
    text: >
      FREJA: ved det ikke helt. han var ude at skate ved vejen forbi
      danpork og han så nogen. en kvinde. hun stod ved mads' indkørsel
      og tog billeder af hans hus. i mørket. magnus sagde hun
      lignede camilla men han er ikke sikker.

      han flipper over det sgu. prøv at snakke med ham men han er
      mega mistroisk til folk han ikke kender. start med at snakke
      skate eller noget lol
    effects: { trust_freja: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Lynghøj. A Jutland village where
      the heath meets the fields. An organic farmer who was exposing
      illegal dumping. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Astrid (Mads's sister) -> astrid_q1
      - Talk to Camilla (Mads's ex) -> camilla_q1
      - Check what Peter (Mads's best friend) is saying -> peter_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Astrid Q1 ---

  astrid_q1:
    type: tweet
    from: astrid
    text: >
      min bror er FORSVUNDET og politiet siger han nok er på ferie??
      MADS TAGER IKKE PÅ FERIE. HAN HAR DYR DER SKAL PASSES.
      jeg kører fra thisted. nogen skal forklare mig det her.
    effects: { trust_astrid: "+5", contacts_followed: "+1" }
    choices:
      - DM Astrid -> astrid_q1_talk

  astrid_q1_talk:
    type: message
    text: >
      ASTRID: Who are you? Another stranger who thinks they can help?
      Mads called me the evening before he went silent. He was upset.
      Not scared — angry. He said "de truer mig, Astrid. Både
      firmaet og hende."

      The company and her. That's what he said. I asked who "hende"
      was. He said Camilla. Then he said something about DanPork
      sending people to his farm. And then the line went dead.

      That's the last I heard from my brother.
    effects: { trust_astrid: "+10" }
    choices:
      - What do you think happened? -> astrid_theory
      - Move on -> quest1_hub

  astrid_theory:
    type: message
    text: >
      ASTRID: I think DanPork wanted his evidence destroyed. He had
      water samples, photos, a whole dossier. They threatened him at
      a council meeting — Erik Lund said "vi finder en løsning, Mads,
      den ene eller den anden vej." Everyone heard it.

      But Camilla... that's the other thing. She wouldn't leave him
      alone. He filed a complaint six months ago but the police said
      there wasn't enough evidence. She'd show up at his door, leave
      notes on his tractor, follow him to the kro.

      The night he vanished, both things were happening. DanPork AND
      Camilla. My brother was trapped between a corporation and an
      obsession.
    effects: { trust_astrid: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Camilla Q1 ---

  camilla_q1:
    type: tweet
    from: camilla
    text: >
      folk snakker lort om mig herinde. i kender ikke hele historien.
      mads og jeg havde noget specielt. det forsvinder ikke bare.
    effects: { trust_camilla: "+5", contacts_followed: "+1" }
    choices:
      - DM Camilla -> camilla_q1_talk

  camilla_q1_talk:
    type: message
    text: >
      CAMILLA: Look, I know what people say about me. That I'm
      obsessed, that I can't let go. That's not fair. Mads and I had
      something real. He ended it because of the pressure — the farm,
      the DanPork fight, everything. Not because of us.

      I came back to Lynghøj because this is my home too. I have
      every right to be here. And yes, I worry about him. Is that
      a crime?

      [Camilla is defensive but composed. Her story doesn't match
      what others have said.]
    effects: { trust_camilla: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Peter Q1 ---

  peter_q1:
    type: tweet
    from: peter
    text: >
      var ude på mads' gård i dag. traktoren stod i marken. hundene
      havde ikke fået mad. hans støvler stod i gangen. DET ER IKKE
      EN MAND DER ER TAGET PÅ FERIE FOR HELVEDE
    effects: { trust_peter: "+5", contacts_followed: "+1" }
    choices:
      - DM Peter -> peter_q1_talk

  peter_q1_talk:
    type: message
    text: >
      PETER: I've known Mads since we were six years old. He doesn't
      leave his animals. He doesn't leave his fields. The man sleeps
      in the barn during lambing season. You think he just packed a
      bag and went to Thailand?

      Lort, the police are useless. They took a statement and left.
      I checked the farm myself — nothing stolen, no sign of a
      struggle. But his laptop is gone. And the folder he kept in the
      kitchen drawer — his DanPork evidence file — that's gone too.

      Someone took his proof and someone took him. Or made him run.
    effects: { trust_peter: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Mads went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Magnus (was skating near DanPork road) -> magnus_interview
      - Find Niels (vet, was out on a late call) -> niels_interview
      - Find Thomas (mechanic, heard vehicles) -> thomas_interview
      - Find Anne (librarian, lives on the main road) -> anne_interview

  # --- Magnus (saw woman at Mads's driveway) ---

  magnus_interview:
    type: tweet
    from: magnus
    text: >
      kedelig aften i lynghøj shocker. men seriøst er der nogen der
      har set noget mærkeligt de sidste dage?? bare mig??
    effects: { trust_magnus: "+5" }
    choices:
      - Ask Magnus about that evening -> magnus_talk

  magnus_talk:
    type: message
    text: >
      MAGNUS: ok sgu du siger det ikke videre. jeg var ude at skate
      ved danpork-vejen den aften, det var mørkt men der er lys fra
      anlægget. og jeg så camilla. 100% hende. hun stod ved mads'
      indkørsel med sin telefon og tog billeder af huset.

      hvad fanden laver man det for kl 21 om aftenen?? det er bare
      fucked. og da hun gik tilbage til sin bil parkerede hun ikke
      hjemme. hun kørte hen til den lille vej bag mads' mark og
      slukkede lyset. bare sad der.

      sgu creepy det der for helvede
    effects:
      trust_magnus: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Niels (vet, saw DanPork truck) ---

  niels_interview:
    type: tweet
    from: niels
    text: >
      Sent kald i nat — kalvefødslen hos Petersens gik godt. Men
      trafikken på hedevejen var usædvanlig for kl 2 om natten.
    effects: { trust_niels: "+5" }
    choices:
      - Ask Niels what he saw -> niels_talk

  niels_talk:
    type: message
    text: >
      NIELS: I was driving back from a calving at Petersen's farm
      around 02:00. Two things caught my eye. First, a DanPork tanker
      truck heading toward the stream crossing — at 2am. Those trucks
      run during the day. Never at night. Unless they're dumping.

      Second, when I passed Mads's farm, there was a light on in the
      barn. And a car in the yard I didn't recognise. Not Mads's
      truck. Something smaller.

      By the next morning, Mads was gone and his animals were hungry.
    effects:
      trust_niels: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Thomas (heard confrontation) ---

  thomas_interview:
    type: tweet
    from: thomas
    text: >
      Nogen kørte stærkt på grusvejene kl 3 i nat. Det gør man ikke
      medmindre man har travlt med at slippe væk fra noget.
    effects: { trust_thomas: "+5" }
    choices:
      - Ask Thomas what he heard -> thomas_talk

  thomas_talk:
    type: message
    text: >
