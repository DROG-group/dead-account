      ja Tõnise täielik raport vallavalitsusele — mida nad pole
      kunagi menetlenud.
    effects:
      port_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Komissar Pärn ---

  komissar_interview:
    type: message
    text: >
      KOMISSAR PÄRN: Mitteametlikult — ja ma mõtlen täiesti
      mitteametlikult — ma tahtsin uurida BalticPort'i. Mu ülemus
      ütles et jätaks. Ütles et "maakond tegeleb sellega." See on
      ametikeel "ära puutu."

      Eriku asi on teistmoodi. Sellest ma ei teadnud midagi enne
      praegust. Kui sul on tõendeid jälitamise kohta, siis saan
      tegutseda. See on selgelt minu pädevus.

      Too mulle midagi konkreetset ja ma avan asja uuesti.
    effects:
      trust_komissar: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Tõnis than anyone in Kadakalda. Who is responsible?
    choices:
      - Confront Erik Vainola (the obsessive historian) -> confront_erik
        when:
          state: obsession_evidence
          gte: 5
      - Confront Andres Tammsaare (the port director) -> confront_andres
        when:
          state: port_evidence
          gte: 3
      - Confront Elder Kask (political protection) -> confront_jaan
      - I need more evidence -> investigation_hub

  # --- ENDING A: Erik (Best Ending) ---

  confront_erik:
    type: message
    text: >
      You present your evidence to Erik Vainola:

      "I know @meremees is your account. I know you broke into Tõnis's
      workshop and filmed his techniques. I know you put a tracker on
      his tools. I know you were watching his house. I have witnesses
      and I have the anonymous posts that match your writing style."
    choices:
      - Send -> erik_response

  erik_response:
    type: message
    text: >
      Erik doesn't reply for a long time. Then:

      ERIK: Sa ei mõista. Tõnise teadmised on hindamatu pärand. Ta
      oleks lasknud neil kaduda. Ma pidin neid säilitama. Kõik mida
      ma tegin oli selleks et tema töö elaks igavesti. See on armastus
      pärandi vastu.

      That's not preservation. That's obsession.

      You've already sent the evidence to Komissar Pärn. And to
      Merike Laas.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Komissar Pärn reopens the case. With your evidence — the
      anonymous account, the workshop break-ins, the surveillance,
      the witness testimonies — Erik Vainola is arrested for
      stalking, unlawful entry, and harassment. A hidden camera is
      recovered from Tõnis's workshop ceiling beam.

      Merike Laas, in possession of Tõnis's full evidence package,
      publishes the BalticPort story in Postimees. The
      Keskkonnaamet orders an immediate halt to all construction at
      Kadakalda harbour. Andres Tammsaare faces criminal charges for
      illegal construction on protected coastline.

      And Tõnis Rebane, reading the story from a friend's farmhouse
      on Hiiumaa, calls his wife for the first time in ten days.

      "Ma tulen koju."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Ohvriabi kriisitelefon: 116 006 (tasuta, 24/7)
      Politsei- ja Piirivalveamet: 112
      Lasteabi telefon: 116 111
      Veebipõhine nõustamine: www.palunabi.ee
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: tonis
    text: >
      meri on alles. sadam on alles. ja kadakalda rahvas ka. aitäh
      et te ei loobunud.
    choices:
      - The End -> game_complete

  # --- ENDING B: Andres (Partial Ending) ---

  confront_andres:
    type: message
    text: >
      You present the environmental evidence to Andres Tammsaare:

      "I have photographs of illegal construction on protected
      coastline. I have the marine biology surveys proving ecosystem
      destruction. I have the building permits that don't exist. I
      have your concrete in the sea with your company logo."
    choices:
      - Send -> andres_response

  andres_response:
    type: message
    text: >
      ANDRES: See vestlus edastatakse meie juriidilisele osakonnale.
      Igasugune laimava materjali avaldamine toob kaasa kohesed
      õiguslikud sammud. BalticPort OÜ on alati tegutsenud vastavalt
      kehtivatele seadustele.

      But it's too late. You've sent the evidence to Merike, to the
      Rannakaitse Selts, and to the Keskkonnaamet.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The construction scandal breaks. BalticPort is ordered to halt
      all work pending investigation. The project may be cancelled.
      Fifty promised jobs vanish. The village is divided.

      But Tõnis?

      Without the stalking evidence, Erik is never investigated. He
      continues to live in Kadakalda. He starts a new research project.
      He creates a new anonymous account. He watches.

      Three months later, Tõnis reads about BalticPort online. He
      returns quietly. He moves his workshop inland. He installs
      security cameras. He locks every door.

      The corporation is exposed. But the person who terrorised Tõnis
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: tonis
    text: "ma olen tagasi. sadam on päästetud. ülejäänu... vaatame."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_jaan:
    type: message
    text: >
      You confront vallavanem Kask with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> jaan_response

  jaan_response:
    type: tweet
    from: toomas
    text: >
      Minu klient on teie süüdistustest teadlik. Igasugune
      auhaavavate väidete levitamine toob kaasa viivitamatud
      kohtulikud sammud. — Ilves & Partnerid, Tallinn
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Kask and BalticPort's illegal construction — and
      there isn't one beyond political protection — your evidence is
      insufficient.

      BalticPort continues to build. Erik continues to watch. Tõnis
      stays in hiding.

      Six months later, @meremees creates a new account. It follows
      Tõnis's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: KADAKALDA — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Port evidence: ${port_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Tõnis's story explores themes of
      corporate greed, coastal destruction, obsessive behaviour,
      island community solidarity, and the courage to protect
      tradition and nature.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Ohvriabi kriisitelefon: 116 006 (tasuta, 24/7)
      Politsei- ja Piirivalveamet: 112
      Keskkonnainspektsioon: 1313
