entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN KADAKALDA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Kadakalda.social — the community Mastodon instance for
      the coastal village of Kadakalda on the island of Saaremaa,
      Estonia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @tonis_rebane.

      A boat builder. He crafted traditional wooden boats by hand.
      Taught workshops. Fought to preserve the old harbour. People
      loved him. He hasn't posted in seven days.
    choices:
      - Look at his profile -> tonis_profile

  tonis_profile:
    type: tweet
    from: tonis
    text: "Kadakalda vana sadam on ohus. BalticPort tahab kõik lammutada ja betoonkai ehitada. Mul on dokumendid ja fotod. See ei jää vaikseks."
    choices:
      - That's his last real post... -> grey_sea

  grey_sea:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a blurred photo of grey sea. Overexposed, shot from a strange
      angle. Posted at 4am. No caption.

      His friends say that's not his style. Tõnis always wrote long
      captions about every plank, every joint, every boat. The police
      say he probably went sailing and hasn't returned yet. The
      weather's been fine. His boat is still in the harbour.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: komissar
    text: >
      Seoses Kadakalda elaniku kadumise teatega: hetkel puuduvad
      tõendid kuriteo kohta. Tegemist on tõenäoliselt vabatahtliku
      eemalviibimisega. Vihjed palun 112 või Kadakalda
      politseijaoskonnale.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His wife @marika_rebane is desperate.
      His brother @sten_rebane is driving down from Pärnu. His
      apprentice @liis_tamm is posting worried messages. The fisherman
      @peeter_vosu says Tõnis was right about the harbour.

      And the maritime historian @erik_vainola, who had been commenting
      obsessively on Tõnis's boat-building posts for months, has gone
      completely silent.

      Nobody buys the police line. Nobody thinks Tõnis just "went
      sailing."
    effects: { trust_marika: "+5", trust_sten: "+5" }
    choices:
      - Start following Tõnis's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Kadakalda. Follow Tõnis's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Helgi (pub owner, knows everyone) -> helgi_intro
      - Talk to Peeter (fisherman, knows the harbour) -> peeter_intro
      - Talk to Karl (teen surfer, seems shaken) -> karl_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Tõnis with the rhythms of a small
      island village: weather warnings, fish market prices, ferry
      schedules, the pub's daily specials.

      Key names surface: Marika (wife, teacher), Sten (brother, coming
      from the mainland), Liis (apprentice, scared), and the teens —
      Karl, Maris, Kaia — who spent summers in Tõnis's workshop
      learning to work wood.

      Also prominent: BalticPort OÜ, the port development company.
      Their posts are corporate PR about "sustainable maritime growth."
      Tõnis's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Helgi -> helgi_intro
      - Talk to Peeter -> peeter_intro
      - Talk to Karl -> karl_intro

  # --- Helgi (social map) ---

  helgi_intro:
    type: tweet
    from: helgi
    text: >
      Puhvet on lahti aga tuju on perses. @tonis_rebane, su õlu
      seisab leti peal. Tule tagasi.
    effects: { trust_helgi: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Helgi -> helgi_talk

  helgi_talk:
    type: message
    text: >
      HELGI: Sa oled uus? Tere tulemast. Kehv aeg tulemiseks. Kõik
      on Tõnise pärast närvis.

      Ma räägin sulle kes on kes. Marika on Tõnise naine, õpetaja,
      täiesti läbi praegu. Sten on vend, tuleb Pärnust. Liis on
      õpipoiss, tudeng Tartust, kes suveti Tõnise juures puutööd
      teeb.

      Ja siis on Erik Vainola. Mereajaloolane. Kolis siia kaks aastat
      tagasi, kirjutab raamatut viikingilaevadest. Kleepis Tõnise
      külge nagu puuk. Tahtis koostööd teha, tahtis paadiehitust
      "dokumenteerida." Tõnis oli viisakas, aga mulle ütles ta: "See
      mees ei jäta mind rahule."

      Ja BalticPort — need tahavad vana sadama lammutada ja
      kaubaterminali ehitada. Tõnise töökoda on täpselt seal.
    effects: { trust_helgi: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Erik -> helgi_erik
      - Ask about BalticPort -> helgi_balticport
      - Thank her and move on -> quest1_hub

  helgi_erik:
    type: message
    text: >
      HELGI: Erik? Kurat, see on omaette lugu. Tuli siia kaks aastat
      tagasi. Ütles et kirjutab teaduslikku raamatut Saaremaa
      mereajaloo kohta. Alguses oli normaalne — käis arhiivis, tegi
      märkmeid, küsis küsimusi.

      Siis avastas Tõnise töökoja. Ja perse läks asi. Hakkas käima
      iga päev. Filmis Tõnist tööd tegemas. Tahtis iga tehnikat,
      iga liitmist, iga traditsiooni "dokumenteerida." Tõnis ütles
      lõpuks viisakalt et aitab. Erik ei lõpetanud.

      Hakkas öösel töökoja juures käima. Tõnis leidis oma tööriistu
      liigutatuna. Ja siis hakkas Erik postitama et Tõnis "ei austa
      merenduse ajalugu" ja "varjab tehnikaid maailma eest."

      Täiesti hull.
    effects: { trust_helgi: "+5" }
    choices:
      - Ask about BalticPort -> helgi_balticport
      - Move on -> quest1_hub

  helgi_balticport:
    type: message
    text: >
      HELGI: BalticPort. Suured plaanid, suured investorid, suur
      sõnavara. Tahavad Kadakalda vana sadama ümber ehitada
      kaubaterminaliks. Uus kai, kraanasild, laadimisalad. Viiskümmend
      töökohta, ütlevad. Aga vana sadam — seda on kasutatud sajandeid.
      Tõnise töökoda on seal, kalurite paadid on seal, kogu küla
      meri-elu on seal.

      Tõnis ütles esimesena: see ei lähe nii. Tõnis alustas
      allkirjade kogumist. Tal olid dokumendid mis näitasid, et
      BalticPort'i keskkonnamõju hindamine oli vale. Et ehitamine
      hävitaks ranniku ökosüsteemi.

      Kaks nädalat hiljem on ta kadunud. Mõtle ise.
    effects: { trust_helgi: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Peeter (fisherman, witness tease) ---

  peeter_intro:
    type: tweet
    from: peeter
    text: >
      kolmkümmend aastat merel. kadakalda sadam on mu kodu.
      @tonis_rebane ütles tõtt ja nüüd on ta kadunud. ärge olge
      rumalad.
    effects: { trust_peeter: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Peeter -> peeter_talk

  peeter_talk:
    type: message
    text: >
      PEETER: Ma olen selles sadamas kala püüdnud kolmkümmend aastat.
      Ma tunnen iga kivi, iga tala, iga tuult. Ja ma ütlen sulle —
      see mis BalticPort plaanib, tapab selle koha. Betoonkai hävitab
      ranniku. Laevaliiklus ajab kalad minema. Vana sadam, kus mu
      isa ja tema isa kalatasid — läheb.

      Tõnis oli ainus kes seisis vastu. Tal olid dokumendid. Ta
      sukeldus ja fotografeeris merepõhja, näitas et ehitamine
      hävitaks kaldajoone. Ta kogus allkirju.

      Ja siis — kadunud. Sa arvad et see on juhus? Ma ei usu
      juhustesse merel.
    effects: { trust_peeter: "+10" }
    choices:
      - Did you see anything unusual recently? -> peeter_night
      - Move on -> quest1_hub

  peeter_night:
    type: message
    text: >
      PEETER: Sel ööl — enne kui ta kadus — ma tulin hilja sadamasse,
      umbes kell üks öösel. Kalastasin. Nägin tuled Tõnise töökoja
      juures. Mitte ebatavaline, ta töötab tihti hilja.

      Aga siis nägin teist autot. Must maastur. Tallinna numbrid.
      Kell üks öösel. Kadakalda sadamas.

      Sellele ma mõtlen iga päev.
    effects: { trust_peeter: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Karl (teen surfer, witness tease) ---

  karl_intro:
    type: tweet
    from: karl
    text: >
      vittu @tonis_rebane on ainus inimene kes mulle seletas kuidas
      puitu austada. kui keegi midagi teab siis rääkige perse. see
      pole normaalne et ta lihtsalt kaob
    effects: { trust_karl: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Karl -> karl_talk_early

  karl_talk_early:
    type: message
    text: >
      KARL: sa oled uus vä? kurat sitt aeg tulemiseks. tõnis on nagu
      parim inimene siin külas. ta õpetas meile paadi ehitamist,
      puutööd, meresõlmi. kõike. ja nüüd politsei ütleb "läks
      purjetama"?? mida kuradit. ta paat on sadamas.

      ja kuule, maris nägi midagi imelikku eelmisel nädalal sadamas.
      ta ei taha rääkida. ütleb et pole midagi. aga valetab nii
      halvasti et perse
    effects: { trust_karl: "+10" }
    choices:
      - What did Maris see? -> karl_maris_hint
      - Move on -> quest1_hub

  karl_maris_hint:
    type: message
    text: >
      KARL: täpselt ei tea. ta oli sadamas päikeseloojangul, fotosid
      tegemas, ja nägi kedagi tõnise töökoja juures. keegi soris seal
      asjades. ja kui see inimene teda märkas siis kadus ära kiirest.

      maris ütleb et ta pole kindel kes see oli aga ma arvan et ta
      kardab. proovi temaga kunsti teemadel rääkida, siis ta lõdvestub
      haha
    effects: { trust_karl: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Kadakalda. A Saaremaa island village
      built around its old harbour. A boat builder who was fighting a
      port expansion. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Marika (Tõnis's wife) -> marika_q1
      - Talk to Liis (Tõnis's apprentice) -> liis_q1
      - Check what Sten (Tõnis's brother) is saying -> sten_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Marika Q1 ---

  marika_q1:
    type: tweet
    from: marika
    text: >
      palun kui keegi on näinud @tonis_rebane helistage mulle. tema
      tööriistad on töökojas. tema paat on sadamas. ta ei läinud
      kuhugi.
    effects: { trust_marika: "+5", contacts_followed: "+1" }
    choices:
      - DM Marika -> marika_q1_talk

  marika_q1_talk:
    type: message
    text: >
      MARIKA: Ma ei tunne sind. Ma ei tea miks ma peaksin sinuga
      rääkima. Tõnisel on palju sõpru siin. Ma olen kindel et ta
      tuleb tagasi.

      ...Ma ütlen seda endale iga päev. Ma ei usu enam.

      [Marika is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_marika: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Liis Q1 ---

  liis_q1:
    type: tweet
    from: liis
    text: >
      @tonis_rebane töökoda on tühi. Tema viimane paat on pooleli.
      Tammeplanke on saetud. Ta ei jätaks kunagi tööd pooleli.
    effects: { trust_liis: "+5", contacts_followed: "+1" }
    choices:
      - DM Liis -> liis_q1_talk

  liis_q1_talk:
    type: message
    text: >
      LIIS: Tõnis ja mina oleme koos töötanud kaks suve. Ta on parim
      õpetaja keda ma tean. Traditsiooniline paadiehitus — see pole
      lihtsalt käsitöö, see on ajalugu. Iga liide, iga tehnika.

      Mis mind muretsema paneb: Tõnis ütles eelmisel nädalal et keegi
      käis tema töökojas. Asjad olid nihkunud. Tema märkmed olid lahti,
      kuigi ta paneb need alati kinni. Ja tema arvuti oli sisse
      lülitatud, kuigi ta lülitab selle alati välja.

      [Liis seems genuinely frightened.]
    effects: { trust_liis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sten Q1 ---

  sten_q1:
    type: tweet
    from: sten
    text: >
      mu vend on KADUNUD ja politsei ütleb et ta vist läks
      purjetama??? TEMA PAAT ON SADAMAS. ta ei lähe ilma ütlemata.
      ma sõidan pärnust. keegi hakkab mulle seletama.
    effects: { trust_sten: "+5", contacts_followed: "+1" }
    choices:
      - DM Sten -> sten_q1_talk

  sten_q1_talk:
    type: message
    text: >
      STEN: Kes sa oled? Veel üks inimene sellest külast kes ütleb
      et ma rahuneks? Mu vend helistas mulle ööl enne kadumist. Ta
      ütles et tal on midagi suurt. Ta ütles "kui midagi juhtub,
      vaata BalticPort'i." Siis ta ütles veel midagi — "ja see Erik
      ei jäta mind rahule."

      See on viimane asi mida ma temalt kuulsin.
    effects: { trust_sten: "+10" }
    choices:
      - What do you think happened? -> sten_theory
      - Move on -> quest1_hub

  sten_theory:
    type: message
    text: >
      STEN: Ma arvan et BalticPort sundis ta vaikima. Tal olid
      tõendid et nende keskkonnamõju hindamine on vale. Et ehitamine
      hävitaks ranniku. See oleks projekti peatanud.

      Aga ma arvan et see Erik Vainola on ka selles sees. Mitte
      seepärast et ta on BalticPort'iga seotud — hoopis midagi muud.
      See kuidas ta Tõnisest räägib... see pole normaalne huvi. Tõnis
      ütles mulle kuid tagasi et keegi käib ta töökojas. Et keegi
      jälgib teda. Ta arvas et see oli Eriku tegemine.

      Firmaintress ja hull mees. Tõnis võitles mõlema vastu korraga.
    effects: { trust_sten: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Tõnis went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Maris (was at the harbour at sunset) -> maris_interview
      - Find Tiina (harbour master, works late) -> tiina_interview
      - Find Priit (sea rescue, early morning patrol) -> priit_interview
      - Find Olev (pharmacist, saw headlights) -> olev_interview

  # --- Maris (saw someone at the workshop) ---

  maris_interview:
    type: tweet
    from: maris
    text: >
      tegin fotosid sadamas aga mingi vibe on nii off praegu. kurat
      midagi on valesti siin. ei oska seletada
    effects: { trust_maris: "+5" }
    choices:
      - Ask Maris about that evening -> maris_talk

  maris_talk:
    type: message
    text: >
      MARIS: okei see on perses aga sa ei ütle kellelegi eks. ma olin
      sadamas umbes kell seitse, fotosid tegemas. ja ma nägin kedagi
      tõnise töökoja juures. soris tema asjades. kui ta mind märkas
      siis jooksis ära.

      ja kurat... ma pole sajaprotsendiliselt kindel aga see nägi välja
      nagu erik vainola. sama jope, sama müts. aga oli juba hämar.

      vittu ma oleks pidanud midagi ütlema aga kes usub seitsmeteist-
      aastast tüdrukut
    effects:
      trust_maris: "+10"
