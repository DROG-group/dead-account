      more than double the permit. And the cut area overlaps with a
      Natura 2000 protected zone that should be completely off-limits.

      Her last survey log: "Flew over Section 7. They've crossed into
      the protected zone. Old-growth pine, 400 years old, gone.
      Satellite confirms. This is criminal."
    effects:
