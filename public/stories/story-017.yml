entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SAVUKOSKI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Savukoski.social — the community Mastodon instance for
      the village of Savukoski, Finnish Lapland.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @elina_makinen.

      A reindeer herder. Wilderness photographer. She documented the
      fells and the herds. People are worried. She hasn't posted in
      six days.
    choices:
      - Look at her profile -> elina_profile

  elina_profile:
    type: tweet
    from: elina
    text: "Avohakkuualue laajenee Korvatunturin juurelle. Porojen laidunmaat tuhoutuu. Mulla on todisteet."
    choices:
      - That's her last real post... -> grey_sky

  grey_sky:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a grey sky over snow. Blurred, overexposed, shot from a strange
      angle. Posted at 2am. No caption.

      Her friends say that's not her style. The police say she probably
      went on a hiking trip. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: ylikonstaapeli
    text: >
      Olemme vastaanottaneet ilmoituksen Savukosken asukkaasta. Tässä
      vaiheessa mikään ei viittaa rikokseen. Kaikki hyödylliset tiedot
      voi ilmoittaa numeroon 112 tai poliisiasemalle.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @aino_korhonen is
      desperate. Her brother @mikael_makinen is driving down from
      Rovaniemi. Her photography partner @matias_lehtonen is posting
      frantic messages. The old herder @juhani_heikkinen says she was
      right about the clear-cuts.

      And the journalist @kaisa_torvinen is strangely silent.

      Nobody buys the police line. Nobody thinks Elina just "went
      hiking."
    effects: { trust_aino: "+5", trust_mikael: "+5" }
    choices:
      - Start following Elina's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Savukoski. Follow Elina's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Sirkka (café owner, knows everyone) -> sirkka_intro
      - Talk to Juhani (old herder, saw the clear-cuts) -> juhani_intro
      - Talk to Veera (teen, seems shaken) -> veera_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Elina with the rhythms of a tiny
      Lapland village: aurora forecasts, the café's lunch menu,
      snowmobile trail conditions.

      Key names surface: Aino (best friend, midwife), Matias (photography
      partner, seems rattled), Kaisa (journalist, oddly quiet), and the
      teens — Veera, Niko, Tuulia — who worshipped Elina's wilderness
      photography.

      Also prominent: LapinMetsä Oy, the logging company with clear-cut
      permits at the edge of the reindeer pastures. Their posts are
      corporate PR. Elina's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Sirkka -> sirkka_intro
      - Talk to Juhani -> juhani_intro
      - Talk to Veera -> veera_intro

  # --- Sirkka (social map) ---

  sirkka_intro:
    type: tweet
    from: sirkka
    text: >
      Tupa on auki mut ei oo sama fiilis. @elina_makinen, sun pöytä
      odottaa. Tuu takas.
    effects: { trust_sirkka: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sirkka -> sirkka_talk

  sirkka_talk:
    type: message
    text: >
      SIRKKA: You're new here? Welcome. Bad time to show up. Everyone's
      losing it over Elina.

      Let me give you the lay of the land. Aino is Elina's best friend —
      they share a cabin near the river. Sweet woman, in pieces right
      now. Matias Lehtonen is this wildlife photographer who came to
      Savukoski two years ago. Works with Elina on documenting the
      reindeer. Smart guy but... something about him gives me the
      creeps. Mikael is Elina's brother, coming from Rovaniemi.

      And Kaisa Torvinen — the journalist — she and Elina were working
      on something. An article about the logging. Kaisa hasn't said a
      word since Elina vanished. That's not like her at all.

      Oh, and don't believe a word of LapinMetsä's "sustainable
      forestry" posts. Vittu, those people lie like they breathe.
    effects: { trust_sirkka: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Matias -> sirkka_matias
      - Ask about LapinMetsä -> sirkka_lapinmetsa
      - Thank her and move on -> quest1_hub

  sirkka_matias:
    type: message
    text: >
      SIRKKA: Matias? He showed up two years ago. Said he was a wildlife
      photographer doing a book on Lapland reindeer. Talented, sure. But
      he attached himself to Elina like a tick on a dog. At the café
      every time she was there. Always offering to go with her on the
      fell. She was polite about it but I could see it bothered her.

      After she started documenting the clear-cuts, he got worse.
      Wanted to co-author everything. She told me once, "hän ei tajua
      sanaa ei." She meant professionally. I'm starting to think she
      meant more.
    effects: { trust_sirkka: "+5" }
    choices:
      - Ask about LapinMetsä -> sirkka_lapinmetsa
      - Move on -> quest1_hub

  sirkka_lapinmetsa:
    type: message
    text: >
      SIRKKA: That company's been logging here since the 90s. They
      have permits for "selective cutting" but what they do is
      clear-cut. Whole hillsides stripped bare. The reindeer can't
      find lichen under the stumps. The herders have been fighting
      them for years — it goes to court, LapinMetsä wins, repeat.

      Elina was the first person to fly a drone over their sites and
      photograph what they actually do versus what they report. She
      had satellite images, GPS coordinates, the works. Real proof
      that the permits don't match reality.

      Two weeks later she's gone. Perkele.
    effects: { trust_sirkka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Juhani (the herder, witness tease) ---

  juhani_intro:
    type: tweet
    from: juhani
    text: >
      neljäkymmentäviis vuotta oon poroja hoitanu. mettä ei oo enää
      sama. @elina_makinen oli oikeessa. ja nyt se on kadonnu.
      yhdistäkää pisteet.
    effects: { trust_juhani: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Juhani -> juhani_talk

  juhani_talk:
    type: message
    text: >
      JUHANI: I've herded reindeer on these fells since I was a boy.
      Forty-five years. I know every path, every lichen field, every
      calving ground. And I'm telling you — the forest northwest of
      Korvatunturi is destroyed. LapinMetsä's "selective cutting" is
      a joke. They take everything.

      Elina flew her drone. She mapped every clear-cut against the
      permit boundaries. They're logging outside their permits. They're
      destroying old-growth forest that's supposed to be protected.
      She had the coordinates, the photos, everything.

      You think she just went for a walk in the fell? Saatana. Nobody
      believes that.
    effects: { trust_juhani: "+10" }
    choices:
      - Did you see anything unusual recently? -> juhani_night
      - Move on -> quest1_hub

  juhani_night:
    type: message
    text: >
      JUHANI: The night before she vanished — I was out checking the
      herd, around midnight. The aurora was strong. I saw headlights
      on the logging road. Two vehicles. One was Elina's old Hilux —
      I know that truck, it rattles from 500 meters. The other was a
      company SUV. White, LapinMetsä logo on the door.

      At midnight. On a logging road in the middle of nowhere.

      I didn't think much of it. She goes out at night to photograph
      the aurora with the reindeer. But that company car — that's not
      normal.
    effects: { trust_juhani: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Veera (teen, witness tease) ---

  veera_intro:
    type: tweet
    from: veera
    text: >
      vittu mä en kestä tätä @elina_makinen se opetti mulle kaiken
      luonnosta se ei ois lähteny kertomatta. jos joku tietää jotain
      nii kertokaa nyt
    effects: { trust_veera: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Veera -> veera_talk_early

  veera_talk_early:
    type: message
    text: >
      VEERA: oot uus täällä? aika huono timing lol. mut siis elina
      on niinku paras ihminen tässä kylässä. se opetti meille
      luontokuvaamista, vei meiät tunturiin, näytti porojen jäljet
      lumessa. ihan sairaan siistii.

      ja nyt mua pelottaa koska niko näki jotain outoo sinä iltana
      mut se ei suostu puhuu siitä. sanoo et ei oo mitään mut kyl
      mä nään et se valehtelee vittu
    effects: { trust_veera: "+10" }
    choices:
      - What did Niko see? -> veera_niko_hint
      - Move on -> quest1_hub

  veera_niko_hint:
    type: message
    text: >
      VEERA: en mä tarkkaan tiiä. se oli kelkkailemassa myöhään ja
      näki jonku elinan mökin lähellä?? tai jotain sellasta. se
      flippaa ihan täysin eikä haluu puhuu. sun pitäis jutella sille
      mut se on tosi varovainen tuntemattomien kaa. puhu ensin
      kelkoista tai kalastuksesta ni se rentoutuu lol
    effects: { trust_veera: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Savukoski. A tiny Lapland village
      built around reindeer herding and the fells. A herder who was
      exposing illegal logging. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Aino (Elina's best friend) -> aino_q1
      - Talk to Matias (Elina's photography partner) -> matias_q1
      - Check what Mikael (Elina's brother) is saying -> mikael_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Aino Q1 ---

  aino_q1:
    type: tweet
    from: aino
    text: >
      jos jollain on tietoa @elina_makinen soittakaa mulle. sen
      tavarat on mökillä. sukset on naulakossa. se ei ois lähteny
      ilman suksia. ei ikinä.
    effects: { trust_aino: "+5", contacts_followed: "+1" }
    choices:
      - DM Aino -> aino_q1_talk

  aino_q1_talk:
    type: message
    text: >
      AINO: Thanks for reaching out but I don't know you. Elina has
      plenty of friends here. I'm sure she'll come back.

      ...I keep telling myself that. I don't believe it anymore.

      [Aino is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_aino: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Matias Q1 ---

  matias_q1:
    type: tweet
    from: matias
    text: >
      The fells are empty without @elina_makinen. Her memory cards
      are in the cabin. Her drone batteries are charged. She would
      never leave a project unfinished. Something happened.
    effects: { trust_matias: "+5", contacts_followed: "+1" }
    choices:
      - DM Matias -> matias_q1_talk

  matias_q1_talk:
    type: message
    text: >
      MATIAS: Elina and I have worked together for almost two years.
      She's the most passionate person I know about this land. The
      logging investigation — it was everything to her. She had drone
      footage, satellite comparisons, GPS tracks of illegal cutting
      zones. She was so close to publishing.

      I offered to help. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to be part of it.

      [Matias seems earnest. Or obsessive?]
    effects: { trust_matias: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mikael Q1 ---

  mikael_q1:
    type: tweet
    from: mikael
    text: >
      mun sisko on KADONNU ja poliisi sanoo et se on ehkä vaeltamassa???
      SE EI LÄHDE VAELTAMAAN SANOMATTA. tuun rovaniemeltä nyt. joku
      selittää mulle mitä helvettiä täällä tapahtuu.
    effects: { trust_mikael: "+5", contacts_followed: "+1" }
    choices:
      - DM Mikael -> mikael_q1_talk

  mikael_q1_talk:
    type: message
    text: >
      MIKAEL: Who the hell are you? Another person from that village
      who's going to tell me to calm down? My sister called me the
      night before she disappeared. She said she had something huge.
      She said "jos mulle käy jotain, katso LapinMetsää." Then she
      hung up.

      That's the last I heard from her.
    effects: { trust_mikael: "+10" }
    choices:
      - What do you think happened? -> mikael_theory
      - Move on -> quest1_hub

  mikael_theory:
    type: message
    text: >
      MIKAEL: I think she found proof that LapinMetsä is logging
      illegally on protected land and they shut her up. But I also
      think that creepy photographer — Matias — knows more than he's
      saying. The way he talks about her... it's not professional
      concern. It's something else.

      Elina told me months ago someone was going through her cabin
      when she was out with the herd. Things moved, her laptop opened.
      She thought it was nothing. I don't think it was nothing.
    effects: { trust_mikael: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Elina went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Niko (was out snowmobiling late) -> niko_interview
      - Find Arto (fishing guide, was at the river) -> arto_interview
      - Find Paavo (mechanic, heard engines at night) -> paavo_interview
      - Find Seppo (woodworker, early morning at his workshop) -> seppo_interview

  # --- Niko (saw someone at Elina's cabin) ---

  niko_interview:
    type: tweet
    from: niko
    text: >
      hyvä lenkki kelkalla mut tunnelma kylässä on ihan outo.
      jotain on pielessä. en osaa selittää
    effects: { trust_niko: "+5" }
    choices:
      - Ask Niko about that evening -> niko_talk

  niko_talk:
    type: message
    text: >
      NIKO: okei mut sä et kerro kellekää. mä olin kelkkailemassa
      noin yhdeksältä illalla ja ajoin elinan mökin ohi. ja mä
      näin sen valokuvaajan — matias — elinan pihalla. se tutki
      elinan autoo tai laitto jotain sinne. ku se näki mun
      kelkan valot ni se häipy ihan vitun nopeesti.

      siis mä en sanonu mitään koska ketä uskois teiniä vs joku
      aikuinen tutkija. mut se oli ihan sairaan sketchy jumalauta
    effects:
      trust_niko: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Arto (fishing guide, saw late-night meeting) ---

  arto_interview:
    type: tweet
    from: arto
    text: >
      Muistutus: jokialue on rauhoitettu klo 22-06. Olen havainnut
      luvatonta liikennettä metsätiellä useana yönä.
    effects: { trust_arto: "+5" }
    choices:
      - Ask Arto what he saw -> arto_talk

  arto_talk:
    type: message
    text: >
      ARTO: I was at my fishing cabin on the Tana road, about 23h.
      Cleaning gear for the morning. Two vehicles came down the
      logging road — one was that LapinMetsä company SUV, the white
      one with the logo. The other was a dark sedan I didn't
      recognise.

      They stopped at the gate to the clear-cut zone. Two men got
      out. One of them I recognised: Ville Laaksonen, the LapinMetsä
      director. At 23h. On a logging road.

      I wrote it in my guide log. Nobody's asked to see it.
    effects:
      trust_arto: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Paavo (mechanic, heard chase) ---

  paavo_interview:
    type: tweet
    from: paavo
    text: >
      heräsin kolmelta yöllä ku joku ajo metsätietä ihan helvetin
      lujaa. ei normaalia liikennettä tollaseen aikaan.
