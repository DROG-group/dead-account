  # --- ENDING B: Ville (Partial Ending) ---

  confront_ville:
    type: message
    text: >
      You present the logging evidence to Ville Laaksonen:

      "I have drone footage showing clear-cutting inside a Natura
      2000 protected zone. I have satellite images proving the cut
      area is double the permit. I have your original boundary plans
      showing the data was falsified. I have photos of 400-year-old
      stumps inside the protected area."
    choices:
      - Send -> ville_response

  ville_response:
    type: message
    text: >
      VILLE: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. LapinMetsä Oy has always operated
      within its cutting permits.

      But it's too late. You've sent the evidence to Kaisa, to the
      paliskunta, and to the regional forestry authority.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The logging story breaks. LapinMetsä is ordered to halt all
      cutting in the Savukoski area pending investigation. The
      company may lose its FSC certification. Eighty jobs hang in
      the balance. The village is divided.

      But Elina?

      Without the stalking evidence, Matias is never investigated.
      He continues to roam the fells. He continues to monitor her
      accounts. He creates a new anonymous profile.

      Three months later, Elina reads about LapinMetsä online. She
      returns quietly. She changes her herding routes. She stops
      going out alone. She checks her truck every morning.

      The corporation is exposed. But the person who terrorised
      Elina walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: elina
    text: "mä oon takaisin. metsä toipuu. muu... kattoo ny."
    choices:
      - The End -> game_complete

  # --- ENDING C: Kunnanjohtaja (Wrong Ending) ---

  confront_pentti:
    type: message
    text: >
      You confront Kunnanjohtaja Karjalainen with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> pentti_response

  pentti_response:
    type: tweet
    from: outi
    text: >
      Päämieheni on ottanut vastaan väitteenne. Mikäli julkaisette
      herjaavaa materiaalia, ryhdymme välittömiin oikeustoimiin.
      — Lakiasiaintoimisto Hakala, Rovaniemi
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The kunnanjohtaja's lawyer buries your accusation. Without a
      direct link between Karjalainen and LapinMetsä's illegal
      cutting — and there isn't one beyond political protection —
      your evidence is insufficient.

      LapinMetsä continues to cut. Matias continues to watch. Elina
      stays in hiding in the wilderness.

      Six months later, @konsta_laine creates a new account. It
      follows Elina's brother.
    choices:
      - The End -> game_complete

