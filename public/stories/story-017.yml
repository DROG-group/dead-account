      authority orders an unannounced forestry inspection. All cutting
      permits in the Savukoski area are suspended pending
      investigation. Ville Laaksonen faces criminal charges for
      permit fraud and destruction of a protected Natura 2000 site.

      And Elina Mäkinen, reading the story from a friend's cabin
      in Inari, calls her brother for the first time in nine days.

      "Mä tuun kotiin."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Nollalinja (väkivalta & uhkailu): 080 005 005 (maksuton)
      Rikosuhripäivystys: 116 006
