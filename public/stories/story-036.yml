entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SKALNOPOLE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to skalnopole.social — the community Mastodon instance for
      the Tatra mountain village of Skalnopole.

      The local feed is full of worry. Something has happened in the
      mountains.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling the feed, one name dominates: @wojciech_gazdowicz.

      A young shepherd. Cheese maker. He ran a bacówka — a traditional
      highland hut — on Kośnia Polana, making oscypki the old way. He
      was 22. He hasn't posted in six days. His sheep were found
      wandering the meadow unattended. That never happens.
    choices:
      - Look at his profile -> wojciech_profile

  wojciech_profile:
    type: tweet
    from: wojciech
    text: "Znalazłem coś na hali. Ślady maszyn na terenie parku. Ktoś wjeżdża ciężkim sprzętem nocą na Kośnią Polanę. Nie odpuszczę."
    choices:
      - That's his last real post... -> grey_mountain

  grey_mountain:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurred photo of a mountain ridge in fog. Posted at 2am. No
      caption. No hashtags.

      His friends say Wojtek never posted without a caption. He always
      wrote something about the sheep, the weather, the cheese. This
      isn't him.

      The police say he probably went hiking and got lost. Nobody in
      Skalnopole believes that. Wojtek knew these mountains better than
      anyone alive.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: aspirant
    text: >
      Informujemy, że prowadzone są czynności wyjaśniające w sprawie
      zaginięcia mieszkańca gminy Skalnopole. Na chwilę obecną brak
      podstaw do wszczęcia postępowania karnego. Prosimy o zgłaszanie
      informacji pod nr 47 834 22 10.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are wild. His sister @kasia_gazdowicz is driving
      down from Kraków. His best friend @bartek_kubica — a GOPR mountain
      rescue volunteer — is already searching the trails. His grandma
      @helena_gazdowicz is posting in ALL CAPS.

      @jan_mostowiak, the oldest shepherd in the valley, says Wojtek
      would never leave his sheep. That's all you need to know.

      And there's a name that keeps coming up: the Tatra Summit Resort.
      A luxury ski development that's been clearing land on the edge of
      the national park. Right next to Wojtek's meadow.

      Something stinks worse than week-old bundz.
    effects: { trust_kasia: "+5", trust_bartek: "+5" }
    choices:
      - Start following Wojtek's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Skalnopole. Follow Wojtek's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Marta (runs the mountain shelter, knows everyone) -> marta_intro
      - Talk to Jan (oldest shepherd, saw things at night) -> jan_intro
      - Talk to Piotrek (teen climber, seems angry) -> piotrek_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Wojtek with everyday mountain village
      life: weather warnings, sheep auction notices, mushroom foraging
      tips, someone's babcia making pierogi.

      Key names surface: Kasia (sister, ethnography student), Bartek
      (best friend, GOPR), Ola (ex-girlfriend, still cares), and the
      teens — Piotrek, Kamil, Patrycja — who looked up to Wojtek like
      an older brother.

      Also prominent: Tatra Summit Resort. Their posts are glossy
      renders of a luxury ski complex. The locals' posts are furious
      replies. And one account — @adam_wieloch — posts obsessively about
      "authentic mountain life" and tags Wojtek in everything.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Marta -> marta_intro
      - Talk to Jan -> jan_intro
      - Talk to Piotrek -> piotrek_intro

  # --- Marta (social map) ---

  marta_intro:
    type: tweet
    from: marta
    text: >
      Schronisko otwarte jak zawsze ale cicho tu dzisiaj. @wojciech_gazdowicz,
      twoje miejsce przy piecu czeka. Wracaj ziom.
    effects: { trust_marta: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Marta -> marta_talk

  marta_talk:
    type: message
    text: >
      MARTA: O, nowy w Skalnopolu? Nie najlepszy moment na przeprowadzkę,
      szczerze. Cała wioska stoi na uszach przez Wojtka.

      Słuchaj, powiem ci kto jest kto. Kasia to siostra Wojtka — studiuje
      w Krakowie, ale wraca. Bartek Kubica to jego najlepszy ziom, jest
      w GOPR, szuka go po szlakach. Ola Stachura to jego ex, ale nadal
      się kręcą wokół siebie, wiesz jak to jest.

      Babcia Helena — ja pierdolę, ta kobieta ma 83 lata i więcej energii
      niż my wszyscy. Nie daj się zwieść, ostro gada.

      A ten gość, Adam Wieloch? Z Warszawy, przyjechał tu pół roku temu,
      udaje górala. Non stop łazi za Wojtkiem, robi mu zdjęcia, pisze
      posty o "autentycznym życiu w górach." Wojtek mówił że go to
      wkurwia ale facet nie odpuszczał.

      I jest jeszcze sprawa tego jebantgo resortu. Ale to osobny temat.
    effects: { trust_marta: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Adam Wieloch -> marta_adam
      - Ask about the resort -> marta_resort
      - Thank her and move on -> quest1_hub

  marta_adam:
    type: message
    text: >
      MARTA: Adam? Kurwa, ten typ jest dziwny. Przyjechał z Warszawy,
      mówi że rzucił korpo życie żeby "żyć autentycznie." Wynajął chałupę
      na skraju wsi, kupił sobie ciupagę na allegro i chodzi po górach
      w nowych góralkach z metkę jeszcze na podeszwie.

      Ale najgorsze to jak się przyczepił do Wojtka. Chodził za nim na
      hale, siedział pod bacówką, robił tysiące zdjęć. Wojtek próbował
      być grzeczny ale w końcu mu powiedział żeby spierdolił.

      Adam nie spierdolił. Zaczął przychodzić nocami. Patrycja widziała
      go raz o trzeciej w nocy pod bacówką. Kto normalny robi takie
      rzeczy?
    effects: { trust_marta: "+5" }
    choices:
      - Ask about the resort -> marta_resort
      - Move on -> quest1_hub

  marta_resort:
    type: message
    text: >
      MARTA: Tatra Summit Resort. Jebany koszmar. Jakiś gość z Krakowa
      — Krzysztof Baran — chce postawić luksusowy ośrodek narciarski na
      Kośniej Polanie. W PARKU NARODOWYM. Na terenie chronionym.

      Wójt Hałat mówi że to "szansa rozwojowa dla gminy." Jasne.
      Bo Skalnopole potrzebuje hotelu za dwa tysiące za noc.

      Wojtek odkrył że ktoś już zaczął prace — ślady maszyn budowlanych
      na hali, wycięte drzewa, dziury w ziemi. Na terenie parku. Bez
      pozwolenia. Albo z pozwoleniem którego nie powinno być.

      Tydzień po tym jak to nagłośnił, zniknął.
    effects: { trust_marta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jan (oldest shepherd, witnessed things at night) ---

  jan_intro:
    type: tweet
    from: jan
    text: >
      Siedemdziesiąt lat na hali. Nigdy żaden baca nie zostawił owiec
      samych. NIGDY. @wojciech_gazdowicz nie uciekł. Coś mu się stało.
      Widziałem rzeczy nocami na Kośniej Polanie. Nikt mnie nie słucha.
    effects: { trust_jan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jan -> jan_talk

  jan_talk:
    type: message
    text: >
      JAN: Słuchaj mnie uważnie, młody. Ja mam siedemdziesiąt lat na
      tych halach. Znam tu każdy kamień, każdą owcę, każdy szum wiatru.

      Wojtek to był najlepszy młody baca jakiego widziałem. Owce go
      kochały, psy go słuchały, oscypki robił jak moja babka. Nie
      zostawiłby owiec. Wolałby zdechnąć na hali.

      A ja widziałem coś dwa tygodnie temu. Koparki. W nocy. Na terenie
      parku. Z wyłączonymi światłami. Ktoś rozjeżdża Kośnią Polanę pod
      osłoną ciemności. Powiedziałem policji. Aspirant Nowak napisał
      notatkę i poszedł na obiad.
    effects: { trust_jan: "+10" }
    choices:
      - Did you see anything else? -> jan_night
      - Move on -> quest1_hub

  jan_night:
    type: message
    text: >
      JAN: Noc przed zniknięciem Wojtka. Byłem na mojej hali, sąsiednia
      polana. Słyszałem głosy. Kłótnię. Wojtek i ktoś. Nie rozumiałem
      słów, wiatr niósł, ale ton był jasny — Wojtek krzyczał.

      Potem samochód. Silnik. Na hali. O drugiej w nocy samochód na hali
      gdzie nie wolno wjechać. Wielki, ciemny SUV, pojechał leśną drogą
      w stronę Zakopanego.

      Rano owce Wojtka chodziły same. Bacówka zamknięta. Pies szczekał
      jak szalony.
    effects: { trust_jan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Piotrek (teen climber, angry and scared) ---

  piotrek_intro:
    type: tweet
    from: piotrek
    text: >
      ja pierdolę ziomki @wojciech_gazdowicz to jest najfajniejszy
      człowiek w tej wsi i ktoś mu coś zrobił. policja ma to w dupie.
      sami musimy go szukać. #GdzieJestWojtek
    effects: { trust_piotrek: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Piotrek -> piotrek_talk_early

  piotrek_talk_early:
    type: message
    text: >
      PIOTREK: elo ziom jesteś nowy? spoko. słuchaj, wojtek to jest
      kozak, uczył mnie wspinaczki, pokazywał szlaki których nie ma na
      mapach. jak mówię ci że on nie uciekł to wierz mi.

      i jeszcze jedno — kamil latał dronem nad Kośnią Polaną tydzień
      temu i nagrał coś pojebango. ślady maszyn, wycięte drzewa, coś
      jakby fundamenty. na TERENIE PARKU. wójt twierdzi że nic nie wie
      ale spoko, jasne, kurwa.

      kamil nie chce tego wrzucić w neta bo się boi. ale nagranie jest
      ostre.
    effects: { trust_piotrek: "+10" }
    choices:
      - What did Kamil film? -> piotrek_kamil_hint
      - Move on -> quest1_hub

  piotrek_kamil_hint:
    type: message
    text: >
      PIOTREK: ziom musisz z nim pogadać sam. on jest bardziej ogarnia
      technologicznie niż ja, jest taki trochę cichy ale jak mu pokażesz
      że nie jesteś jakiś random to ci pokaże nagranie.

      i jeszcze — ten warszawiak, adam wieloch? widziałem go jak łaził
      po szlaku do bacówki wojtka nocą. z latarką. sam. kto kurwa tak
      robi? mówię ci, ten gość jest pojebany.
    effects: { trust_piotrek: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Skalnopole. A Tatra mountain village
      built around shepherding and tradition. A young cheese maker who
      exposed illegal construction in a national park. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Kasia (Wojtek's sister) -> kasia_q1
      - Talk to Bartek (Wojtek's best friend) -> bartek_q1
      - Check what Ola (Wojtek's ex) is saying -> ola_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Kasia Q1 ---

  kasia_q1:
    type: tweet
    from: kasia
    text: >
      jadę z Krakowa. 2 godziny. jak ktoś z was widział mojego brata
      to DZWOŃCIE. nie piszcie. DZWOŃCIE. @wojciech_gazdowicz, trzymaj
      się kurwa. jadę.
    effects: { trust_kasia: "+5", contacts_followed: "+1" }
    choices:
      - DM Kasia -> kasia_q1_talk

  kasia_q1_talk:
    type: message
    text: >
      KASIA: Kim jesteś? Jeszcze jeden turysta co chce się poczuć jak
      detektyw? Mój brat zaginął a ludzie robią z tego content.

      ...przepraszam. Jestem na nerwach. Wojtek dzwonił do mnie dwa
      dni przed zniknięciem. Mówił że znalazł coś dużego na hali.
      Że wójt jest w to wplątany. Że ktoś go śledzi.

      [Kasia jest ostrożna. Musisz zdobyć jej zaufanie zanim powie
      więcej.]
    effects: { trust_kasia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Bartek Q1 ---

  bartek_q1:
    type: tweet
    from: bartek
    text: >
      3 dzień poszukiwań. Przeszedłem każdy szlak, każdą grotę, każdy
      żleb od Kośniej Polany po Murowaniec. NIC. @wojciech_gazdowicz
      nie jest w tych górach. Ktoś go zabrał z hali.
    effects: { trust_bartek: "+5", contacts_followed: "+1" }
    choices:
      - DM Bartek -> bartek_q1_talk

  bartek_q1_talk:
    type: message
    text: >
      BARTEK: Jestem ratownik GOPR, ziom. Znam te góry. Szukałem
      trzy dni z psami tropiącymi. Ślad się urywa przy leśnej drodze,
      tej co prowadzi do drogi na Zakopane.

      Psy brały trop, szły do bacówki, potem drogą w dół i na parkingu
      leśnym — KONIEC. Wojtek wsiadł do samochodu. Albo ktoś go
      wsadził.

      I jeszcze jedno — na hali, przy bacówce, znalazłem ślady opon.
      Duży samochód. SUV albo pickup. Wojtek ma starego Fiata Pandę.
      To nie jego ślady.
    effects: { trust_bartek: "+10" }
    choices:
      - What do you think happened? -> bartek_theory
      - Move on -> quest1_hub

  bartek_theory:
    type: message
    text: >
      BARTEK: Dwie opcje. Albo ten jebany resort go zabrał bo im
      przeszkadzał z tym nagłośnieniem nielegalnych prac. Albo ten
      psychiczny stalker turysta — Adam Wieloch — w końcu przesadził.

      Bo widzisz, Wojtek mi mówił że ten Adam to jest pojebany. Łaził
      za nim dosłownie wszędzie. Robił mu zdjęcia, pisał do niego
      codziennie, chciał się "uczyć pasterstwa." Wojtek mu powiedział
      żeby się odpierdolił. Adam zaczął przychodzić nocami.

      Dwa tygodnie przed zniknięciem Wojtek znalazł kamerę ukrytą
      w drzewie naprzeciwko bacówki. Taką myśliwską fotopułapkę. Adam
      się nie przyznał ale kurwa, kto inny?
    effects: { trust_bartek: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ola Q1 ---

  ola_q1:
    type: tweet
    from: ola
    text: >
      nie umiem pisać wierszy kiedy @wojciech_gazdowicz nie jest tutaj.
      te góry bez niego nie mają sensu. proszę, niech ktoś go znajdzie.
