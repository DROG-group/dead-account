# DEAD ACCOUNT — Story 036: Skalnopole (Poland 2)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-036.yml
#
# Player investigates the disappearance of young highland shepherd and
# cheese maker Wojciech Gazdowicz in the fictional Tatra mountain village
# of Skalnopole. Two threads: a stalker tourist obsessed with "mountain
# life" and a luxury ski resort built on protected national park land
# with the wójt bribed to approve it.

