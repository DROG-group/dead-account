entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PUSZCZA WIELKA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to PuszczaWielka.social — the community Mastodon instance
      for the village of Puszcza Wielka, Podlasie, on the edge of
      the primeval forest.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @jakub_wisniewski.

      A forest guide. Bison tracker. He documented the primeval forest
      and its ancient ecosystem. People are worried. He hasn't posted
      in six days.
    choices:
      - Look at his profile -> jakub_profile

  jakub_profile:
    type: tweet
    from: jakub
    text: "Wycinka w strefie ochronnej. Ciężki sprzęt na leśnych duktach. Stare dęby padają. Mam wszystko udokumentowane."
    choices:
      - That's his last real post... -> grey_forest

  grey_forest:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a blurred photo of grey tree bark. Shot from a strange angle.
      Posted at 3am. No caption.

      His friends say that's not him. Jakub always posted carefully
      composed wildlife shots with detailed descriptions. The police
      say he probably went on a hiking trip. Something doesn't add up.
    choices:
      - Read the police statement -> policja_statement
      - Look at what people are saying -> community_reaction

  policja_statement:
    type: tweet
    from: komisarz
    text: >
      Przyjęliśmy zgłoszenie dotyczące zaginięcia mieszkańca Puszczy
      Wielkiej. Na tym etapie brak przesłanek wskazujących na
      przestępstwo. Wszelkie informacje prosimy kierować na posterunek
      lub pod numer 112.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @zofia_kowalska is
      desperate. His brother @marek_wisniewski is driving down from
      Białystok. The nature blogger @renata_nowak who worked with him
      is posting worried messages. The forester @tomek_lesnik says
      Jakub was right about the logging.

      And the journalist @malgorzata_wilk is strangely silent.

      Nobody buys the police's line. Nobody thinks Jakub just
      "went hiking."
    effects: { trust_zofia: "+5", trust_marek: "+5" }
    choices:
      - Start following Jakub's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Puszcza Wielka. Follow Jakub's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Wiesław (inn owner, knows everyone) -> wieslaw_intro
      - Talk to Tomek (forester, knows the logging) -> tomek_intro
      - Talk to Kasia (teen, seems upset) -> kasia_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Jakub with the rhythms of a small
      Podlasie village: forest weather warnings, bakery specials, bison
      sighting reports, mushroom season updates.

      Key names surface: Zofia (girlfriend, nurse), Renata (nature
      blogger, seems fixated on him), Małgorzata (journalist, oddly
      quiet), and the teens — Kasia, Bartek, Ola — who idolised
      Jakub's forest tracking work.

      Also prominent: PodlasDrewno Sp. z o.o., the logging company
      operating at the forest edge. Their posts are corporate PR.
      Jakub's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Wiesław -> wieslaw_intro
      - Talk to Tomek -> tomek_intro
      - Talk to Kasia -> kasia_intro

  # --- Wiesław (social map) ---

  wieslaw_intro:
    type: tweet
    from: wieslaw
    text: >
      Gospoda otwarta, ale smutno tu dziś. @jakub_wisniewski, twoje
      miejsce przy oknie czeka. Wracaj.
    effects: { trust_wieslaw: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Wiesław -> wieslaw_talk

  wieslaw_talk:
    type: message
    text: >
      WIESŁAW: A, nowy jesteś? Witaj. Kiepski moment na przyjazd.
      Wszyscy się trzęsą o Jakuba.

      Powiem ci kto jest kto. Zofia to dziewczyna Jakuba — razem
      mieszkają nad apteką. Kochana dziewczyna, teraz w rozsypce.
      Renata Nowak, ta blogerka, robiła z Jakubem materiały o puszczy.
      Fajna laska, ale... trochę za bardzo się na niego wieszała.
      Marek to brat Jakuba, jedzie z Białegostoku.

      I Małgorzata Wilk — dziennikarka — ona z Jakubem pracowała nad
      czymś. Nad tą aferą z wycinką. Od kiedy Jakub zniknął,
      Małgorzata milczy jak zaklęta. To do niej nie pasuje.

      A, i te brednie PodlasDrewna możesz sobie darować.
      Greenwashing jak z podręcznika.
    effects: { trust_wieslaw: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Renata -> wieslaw_renata
      - Ask about the logging -> wieslaw_drewno
      - Thank him and move on -> quest1_hub

  wieslaw_renata:
    type: message
    text: >
      WIESŁAW: Renata? Przyjechała z Warszawy, chyba z dwa lata temu.
      Blog przyrodniczy, zdjęcia puszczy, takie rzeczy. Poznała Jakuba
      na szlaku i od tamtej pory on był jej jedynym tematem. Każdy
      post, każde zdjęcie — Jakub tu, Jakub tam. Setki fotek z nim,
      z jego tropów, z lasu.

      On na początku był zadowolony z rozgłosu. Potem mu to zaczęło
      przeszkadzać. Powiedział mi kiedyś: "Ona nie rozumie, że nie
      chcę." Myślałem, że chodzi o współpracę. Teraz nie jestem
      pewien.
    effects: { trust_wieslaw: "+5" }
    choices:
      - Ask about the logging -> wieslaw_drewno
      - Move on -> quest1_hub

  wieslaw_drewno:
    type: message
    text: >
      WIESŁAW: PodlasDrewno jest tu od lat dziewięćdziesiątych. Ale
      od kiedy Maj został prezesem, to się robi coraz gorzej. Wycinają
      w strefie ochronnej, ciężkim sprzętem rozjeżdżają leśne dukty,
      stare dęby padają jak zapałki. I teraz chcą się rozszerzyć —
      prosto w rezerwat, gdzie żubry mają przejście.

      Jakub był pierwszy, który to porządnie udokumentował. Zdjęcia,
      nagrania, pomiary. Miał dowody, mówił. Prawdziwe dowody. Dwa
      tygodnie później go nie ma.
    effects: { trust_wieslaw: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tomek (the forest, witness tease) ---

  tomek_intro:
    type: tweet
    from: tomek
    text: >
      dwadzieścia pięć lat chodzę po tej puszczy. las umiera.
      @jakub_wisniewski miał rację. a teraz go nie ma. pomyślcie
      nad tym.
    effects: { trust_tomek: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tomek -> tomek_talk

  tomek_talk:
    type: message
    text: >
      TOMEK: Znam każde drzewo w tej puszczy. I mówię ci — co
      PodlasDrewno tu wyrabia, to jest przestępstwo. Wycinają w
      strefie ochronnej, tam gdzie mają zakaz wjazdu. Stare dęby,
      dwieście lat, trzysta lat — padają za jedną noc. Żubry tracą
      korytarze przejścia.

      Jakub chodził tam z kamerą. Dokumentował wszystko. Nagrania
      z pułapek, zdjęcia GPS, pomiary. Budował akta. A potem — fru
      — nie ma go.

      Zbieg okoliczności? Ja nie wierzę w zbiegi okoliczności w lesie.
    effects: { trust_tomek: "+10" }
    choices:
      - Have you seen anything unusual lately? -> tomek_night
      - Move on -> quest1_hub

  tomek_night:
    type: message
    text: >
      TOMEK: Noc przed zniknięciem — obchodziłem rewir, koło
      północy. Patrol nocny, normalna sprawa. Widziałem światło w
      chatce Jakuba, tej przy szlaku żubrowym. Normalka, on często
      pracuje w nocy. Ale przed chatką stał czarny pickup z logo
      PodlasDrewna.

      O północy. Przed chatką przewodnika leśnego.

      Zanotowałem to w dzienniku obchodu. Nikt mnie o to nie pytał.
    effects: { trust_tomek: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kasia (teen, witness tease) ---

  kasia_intro:
    type: tweet
    from: kasia
    text: >
      ja pierdolę @jakub_wisniewski nauczył mnie tropić żubry, to jest
      jak starszy brat dla mnie. on nie znika tak po prostu. jak ktoś
      coś wie to powiedzcie błagam
    effects: { trust_kasia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kasia -> kasia_talk_early

  kasia_talk_early:
    type: message
    text: >
      KASIA: co, nowy jesteś? kurwa mać ale timing. słuchaj, jakub
      to jest najlepsza osoba w tej wsi. nauczył nas tropić żubry,
      pokazywał dziuple sów, mówił jak las oddycha. spoko gość,
      naprawdę.

      i teraz jestem w totalnej panice bo bartek widział coś dziwnego
      przy szlaku ale nie chce gadać. mówi że nic takiego ale daj
      spokój, to NIE jest nic takiego
    effects: { trust_kasia: "+10" }
    choices:
      - What did Bartek see? -> kasia_bartek_hint
      - Move on -> quest1_hub

  kasia_bartek_hint:
    type: message
    text: >
      KASIA: nie wiem dokładnie. jechał na rowerze koło chatki jakuba
      i widział jak renata — ta blogerka — grzebała w czymś koło
      drzwi. tak jakby zostawiała coś albo sprawdzała. mega creepy.
      bartek ma stracha że nikt mu nie uwierzy. spróbuj z nim
      pogadać najpierw o zdjęciach przyrody czy coś lol
    effects: { trust_kasia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Puszcza Wielka. A Podlasie village
      on the edge of primeval forest. A guide who was exposing illegal
      logging. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Zofia (Jakub's girlfriend) -> zofia_q1
      - Talk to Renata (nature blogger) -> renata_q1
      - Check what Marek (Jakub's brother) is saying -> marek_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Zofia Q1 ---

  zofia_q1:
    type: tweet
    from: zofia
    text: >
      ktoś słyszał coś o @jakub_wisniewski? błagam dzwońcie. jego
      chatka stoi otwarta. plecak jest. sprzęt tropicielski jest. on
      nigdy by nie poszedł w las bez tego.
    effects: { trust_zofia: "+5", contacts_followed: "+1" }
    choices:
      - DM Zofia -> zofia_q1_talk

  zofia_q1_talk:
    type: message
    text: >
      ZOFIA: Dzięki że piszesz, ale cię nie znam. Jakub ma tu dużo
      przyjaciół. Na pewno wróci.

      ...Ciągle to powtarzam. Sama już nie wierzę.

      [Zofia is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_zofia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Renata Q1 ---

  renata_q1:
    type: tweet
    from: renata
    text: >
      Chatka przy szlaku żubrowym jest pusta bez @jakub_wisniewski.
      Jego notatki leżą na biurku. Ostatnie zdjęcia z fotopułapek
      wciąż na karcie. On nigdy by nie zostawił niedokończonej pracy.
      Coś się stało.
    effects: { trust_renata: "+5", contacts_followed: "+1" }
    choices:
      - DM Renata -> renata_q1_talk

  renata_q1_talk:
    type: message
    text: >
      RENATA: Jakub i ja pracujemy razem od ponad roku. On tropił, ja
      pisałam i fotografowałam. Dokumentowanie tego co wyrabia
      PodlasDrewno — to był dla niego priorytet. Miał dane, zdjęcia,
      nagrania GPS. Był o krok od opublikowania.

      Proponowałam mu pomoc. Wiele razy. Mówił, że ma to pod
      kontrolą. Że pracuje z dziennikarką. Ja tylko chciałam go
      wesprzeć.

      [Renata seems earnest. Or obsessive?]
    effects: { trust_renata: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marek Q1 ---

  marek_q1:
    type: tweet
    from: marek
    text: >
      mój brat ZAGINĄŁ a policja mi mówi że może poszedł na
      wycieczkę??? ON NIE IDZIE W LAS BEZ UPRZEDZENIA. jadę z
      białegostoku. ktoś mi to wytłumaczy.
    effects: { trust_marek: "+5", contacts_followed: "+1" }
    choices:
      - DM Marek -> marek_q1_talk

  marek_q1_talk:
    type: message
    text: >
      MAREK: Kim jesteś? Jeszcze jeden z tej wsi, co mi powie żebym
      się uspokoił? Mój brat dzwonił do mnie wieczorem przed
      zniknięciem. Powiedział, że ma coś dużego. Powiedział: "jak
      coś się stanie, patrz na PodlasDrewno." I się rozłączył.

      To ostatnie co od niego słyszałem.
    effects: { trust_marek: "+10" }
    choices:
      - What do you think happened? -> marek_theory
      - Move on -> quest1_hub

  marek_theory:
    type: message
    text: >
      MAREK: Myślę, że znalazł dowody na to, że PodlasDrewno wycina
      nielegalnie i oni go uciszyli. Ale myślę też, że ta blogerka —
      Renata — wie więcej niż mówi. Jak ona o nim gada... to nie jest
      tylko robota. To jest coś innego.

      Jakub mi powiedział miesiące temu, że ktoś grzebał w jego
      rzeczach w chatce. W komputerze. Myślał, że to nic. Ja myślę,
      że to było coś.
    effects: { trust_marek: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Jakub went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Bartek (was cycling near the cabin) -> bartek_interview
      - Find Tomek (forester, patrols at night) -> tomek_interview
      - Find Paweł (woodcarver, early morning at workshop) -> pawel_interview
      - Find Dorota (baker, starts at 5am, saw something) -> dorota_interview

  # --- Bartek (saw Renata at the cabin) ---

  bartek_interview:
    type: tweet
    from: bartek
    text: >
      byłem dzisiaj na rowerze przy szlaku i klimat jest dziwny.
      coś tu nie gra. nie umiem tego wytłumaczyć ale czuję to
    effects: { trust_bartek: "+5" }
    choices:
