  # --- Paweł interview 2 ---

  pawel_interview_2:
    type: message
    text: >
      PAWEŁ: Jakub mi coś zostawił. Wodoodporną torbę. Powiedział:
      "jak ktoś zapyta co się dzieje w lesie, daj mu to."

      Wyglądał na przestraszonego. Powiedział, że zrobił kopie
      wszystkiego, ale jeden zestaw musiał być w miejscu, gdzie
      nikt nie będzie szukać. Warsztat snycerski wydawał się idealny.
    effects: { trust_pawel: "+10" }
    choices:
      - What's happening in the forest? -> pawel_case

  pawel_case:
    type: message
    text: >
      Paweł reaches under his workbench and produces a waterproof
      dry bag.

      PAWEŁ: Mówił, że przyjdziesz. Masz, bierz.

      Inside: a USB drive and a set of printed photographs. The photos
      show the illegal logging zone — not the permitted area, but a
      massive undeclared extension into the protected species corridor —
      and heavy machinery operating at night. The USB drive contains
      camera trap footage, GPS coordinates, and Jakub's detailed report.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Komisarz Nowicki ---

  komisarz_interview:
    type: message
    text: >
      KOMISARZ NOWICKI: Nieoficjalnie — i poważnie, nieoficjalnie —
      chciałem wszcząć postępowanie przeciwko PodlasDrewnu. Mój
      przełożony powiedział żebym dał spokój. RDOŚ ma "kompetencje."
      Czyli: nie ruszaj.

      Sprawa z Nowak to co innego. O tym nie wiedziałem do tej pory.
      Jak pan ma dowody na stalking, mogę działać. To jest wyraźnie
      moja kompetencja.

      Niech mi pan przyniesie coś solidnego i sprawa zostanie
      otwarta na nowo.
    effects:
      trust_komisarz: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Jakub than anyone in Puszcza Wielka. Who is responsible?
    choices:
      - Confront Renata Nowak (the obsessive blogger) -> confront_renata
        when:
          state: obsession_evidence
          gte: 5
      - Confront Henryk Maj (the logging company director) -> confront_henryk
        when:
          state: corporate_evidence
          gte: 3
      - Confront Wójt Grabowski (political protection) -> confront_tadeusz
      - I need more evidence -> investigation_hub

  # --- ENDING A: Renata (Best Ending) ---

  confront_renata:
    type: message
    text: >
      You present your evidence to Renata:

      "I know @kamil_wojcik is your account. I know you put a camera
      on Jakub's cabin door. I know you accessed his cabin at night.
      I know you were watching from your car. I have witnesses and
      I have the access logs."
    choices:
      - Send -> renata_response

  renata_response:
    type: message
    text: >
      Renata doesn't reply for a long time. Then:

      RENATA: Nie rozumiesz. Chroniłam go. Był w niebezpieczeństwie
      przez tartak i nie chciał przyjąć mojej pomocy. Musiałam
      wiedzieć, że jest bezpieczny. Wszystko co robiłam, to dlatego
      że mi na nim zależy.

      That's not care. That's obsession.

      You've already sent the evidence to Komisarz Nowicki. And to
      Małgorzata Wilk.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Komisarz Nowicki reopens the case. With your evidence — the
      anonymous account, the hidden camera, the access logs, the
      witness testimonies — Renata is arrested for stalking and
      harassment. A miniature camera is recovered from Jakub's
      cabin door frame.

      Małgorzata Wilk, finally in possession of Jakub's full evidence
      package, publishes the PodlasDrewno story in Gazeta Wyborcza
      and it's picked up by national media. RDOŚ orders an unannounced
      inspection. The illegal logging zone is shut down and PodlasDrewno
      is ordered to begin reforestation. Henryk Maj faces criminal
      charges for falsifying environmental reports and operating
      without permits in a protected area.

      And Jakub Wiśniewski, reading the story from a friend's house
      in Hajnówka, calls his brother for the first time in ten days.

      "Wracam do domu."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: jakub
    text: >
      las nie kłamie. i ludzie z puszczy wielkiej też nie. dzięki,
      że nie odpuściliście.
    choices:
      - The End -> game_complete

  # --- ENDING B: Henryk (Partial Ending) ---

  confront_henryk:
    type: message
    text: >
      You present the logging evidence to Henryk Maj:

      "I have camera trap footage of heavy equipment in the protected
      zone. I have GPS coordinates of illegal cutting. I have your
      original environmental reports showing the data was falsified.
      I have photographs of destroyed species corridors."
    choices:
      - Send -> henryk_response

  henryk_response:
    type: message
    text: >
      HENRYK: Ta rozmowa jest przekazywana do naszego działu prawnego.
      Każda publikacja materiałów zniesławiających pociągnie za sobą
      natychmiastowe postępowanie prawne. PodlasDrewno zawsze
      działało zgodnie z wymogami regulacyjnymi.

      But it's too late. You've sent the evidence to Małgorzata, to
      Straż Puszczy, and to RDOŚ.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The logging story breaks. PodlasDrewno is ordered to halt all
      operations pending investigation. The company may close entirely.
      One hundred jobs hang in the balance. The village is divided.

      But Jakub?

      Without the stalking evidence, Renata is never investigated. She
      continues to blog about the forest. She continues to monitor his
      accounts. She creates a new anonymous profile.

      Three months later, Jakub reads about PodlasDrewno online. He
      returns quietly. He moves to a different cabin. He installs
      better locks. He checks his surroundings before every patrol.

      The corporation is exposed. But the person who terrorised
      Jakub walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: jakub
    text: "wróciłem. las się odnawia. reszta... zobaczymy."
    choices:
      - The End -> game_complete

  # --- ENDING C: Wójt (Wrong Ending) ---

  confront_tadeusz:
    type: message
    text: >
      You confront Wójt Grabowski with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> tadeusz_response

  tadeusz_response:
    type: tweet
    from: krzysztof
    text: >
      Mój klient przyjmuje do wiadomości Pana/Pani zarzuty. Wszelkie
      publiczne rozpowszechnianie treści zniesławiających będzie
      ścigane z całą surowością prawa. — Kancelaria Duda i Wspólnicy,
      Białystok
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The wójt's lawyer buries your accusation. Without a direct
      link between Grabowski and PodlasDrewno's illegal logging —
      and there isn't one beyond political protection — your evidence
      is insufficient.

      PodlasDrewno continues to operate. Renata continues to watch.
      Jakub stays in hiding.

      Six months later, @kamil_wojcik creates a new account. It
      follows Jakub's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: PUSZCZA WIELKA — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Jakub's story explores themes of
      corporate impunity, environmental destruction, obsessive behaviour,
      community solidarity, and the courage to speak up.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Niebieska Linia (przemoc): 800 120 002 (bezpłatnie, 24/7)
      Telefon Zaufania dla Młodzieży: 116 111
      Policja: 112
      Centrum Ochrony Środowiska: Inspekcja Ochrony Środowiska 22 825 05 05
