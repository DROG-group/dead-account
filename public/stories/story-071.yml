  # --- ENDING A: Tuomas (Best Ending) ---

  confront_tuomas:
    type: message
    text: >
      You present your evidence to Tuomas:

      "I know @ville_karhu is your account. I know you put a GPS tracker
      on Aino's truck. I know you accessed her workshop after hours using
      your old master code. I know you were watching her build sites.
      I have witnesses and I have the access logs."
