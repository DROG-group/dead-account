entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN JÄRVENPOHJA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Jarvenpohja.social — the community Mastodon instance for
      the lakeside village of Järvenpohja, Finnish Lakeland.

      The local feed is unusually tense today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @aino_virtanen.

      A sauna builder. Traditional log construction. Smoke saunas. She
      documented the old ways and fought for the lake. People are worried.
      She hasn't posted in six days.
    choices:
      - Look at her profile -> aino_profile

  aino_profile:
    type: tweet
    from: aino
    text: "BoreaTimber laskee jätevettä järveen yöllä. Mulla on näytteet ja kuvat. Tää ei oo enää mielipide. Tää on fakta."
    choices:
      - That's her last real post... -> grey_lake

  grey_lake:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a grey lake. Foggy, blurred, shot from a strange angle. Posted
      at 4am. No caption.

      Her friends say that's not her style. Aino always wrote something.
      The police say she probably went to visit relatives. Something
      doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: ylikonst
    text: >
      Olemme vastaanottaneet ilmoituksen koskien Järvenpohjan asukasta.
      Tässä vaiheessa ei ole viitteitä rikoksesta. Kaikki tiedot voi
      ilmoittaa numeroon 112 tai Järvenpohjan poliisiasemalle.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @elina_korhonen is
      posting desperate messages. Her brother @mikko_virtanen is driving
      down from Tampere. Her mentor @tuomas_laine is pacing the workshop.
      The fisherman @seppo_jarvinen says she was right about the water.

      And the journalist @kari_salonen is strangely silent.

      Nobody buys the police line. Nobody thinks Aino just went to visit
      relatives.
    effects: { trust_elina: "+5", trust_mikko: "+5" }
    choices:
      - Start following Aino's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Järvenpohja. Follow Aino's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Ritva (café owner, knows everyone) -> ritva_intro
      - Talk to Seppo (fisherman, saw the water) -> seppo_intro
      - Talk to Noora (teen rower, seems shaken) -> noora_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Aino with the rhythms of a small
      lakeside village: ice fishing reports, the bakery's daily specials,
      weather warnings about thin ice in spring.

      Key names surface: Elina (best friend, nurse), Tuomas (mentor
      carpenter, seems rattled), Kari (journalist, oddly quiet), and
      the teens — Noora, Aleksi, Veera — who admired Aino's craft
      and environmental work.

      Also prominent: BoreaTimber Oy, the paper mill at the edge of
      the village. Their posts are corporate PR. Aino's posts were
      the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Ritva -> ritva_intro
      - Talk to Seppo -> seppo_intro
      - Talk to Noora -> noora_intro

  # --- Ritva (social map) ---

  ritva_intro:
    type: tweet
    from: ritva
    text: >
      Rantabaari on auki mutta sydän ei oo mukana. @aino_virtanen,
      sun pöytä odottaa. Tuu takasin.
    effects: { trust_ritva: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ritva -> ritva_talk

  ritva_talk:
    type: message
    text: >
      RITVA: Moikka, oot sä uus täällä? Tervetuloa. Huono aika muuttaa
      tänne. Kaikki on ihan sekasin Ainon takia.

      Let me tell you who's who. Elina is Aino's best friend — they've
      known each other since childhood. Sweet woman, a wreck right now.
      Tuomas Laine is Aino's old mentor, taught her everything about
      wood and saunas. Good man, but... he's been strange about her
      lately. Mikko is Aino's older brother, driving down from Tampere.

      And Kari Salonen — the journalist — he and Aino were working on
      something together. Something about the lake water. Kari hasn't
      said a word since Aino vanished. That's not like him at all.

      Oh, and don't bother reading BoreaTimber's PR posts. Lies wrapped
      in ISO certifications.
    effects: { trust_ritva: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Tuomas -> ritva_tuomas
      - Ask about BoreaTimber -> ritva_borea
      - Thank her and move on -> quest1_hub

  ritva_tuomas:
    type: message
    text: >
      RITVA: Tuomas? He taught Aino when she was just a kid. He's the
      best carpenter in the village, been building saunas for forty years.
      But since Aino set up her own workshop and started getting clients
      on her own... something shifted.

      He'd show up at her build sites uninvited. He'd check her timber
      orders, criticize her methods. She told me once, "He acts like he
      owns me." I thought she meant professionally. Now I'm not so sure.

      And there was this one client — some rich guy from Helsinki — who
      wanted Aino to build an exclusive lakeside sauna. Tuomas got
      furious about it. Said the design was wrong, the location was
      wrong, everything was wrong. But Aino said it was something else.
    effects: { trust_ritva: "+5" }
    choices:
      - Ask about BoreaTimber -> ritva_borea
      - Move on -> quest1_hub

  ritva_borea:
    type: message
    text: >
      RITVA: That mill has been there since the 70s. Paper and pulp.
      The village tolerated it because it brought jobs. But the
      fishermen have been complaining for years — strange foam on the
      lake surface, dead fish near the discharge pipe, the water
      smelling like chemicals at night.

      Aino was the first person to actually take samples and document
      everything. She had proof, she said. Real proof. The lake is
      dying because of that mill. Two weeks later she's gone.

      Vittu, it's not a coincidence.
    effects: { trust_ritva: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Seppo (fisherman, witness tease) ---

  seppo_intro:
    type: tweet
    from: seppo
    text: >
      kolkytviis vuotta kalastanu tällä järvellä. vesi ei oo enää sama.
      @aino_virtanen oli oikeessa. ja nyt se on kadonnu. tehkää omat
      johtopäätökset.
    effects: { trust_seppo: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Seppo -> seppo_talk

  seppo_talk:
    type: message
    text: >
      SEPPO: I've fished this lake since I was a boy. I know every
      current, every depth, every colour the water makes in each season.
      And I'm telling you — the water near the mill outfall is wrong.
      Has been for months. My nets come up with dead pike. The lake
      bottom smells like bleach.

      Aino took water samples. She dove down to the discharge pipe
      with a camera. Photographed everything. She was building a case.
      And then poof — kadonnut.

      You think that's a coincidence? Perkele, I don't believe in
      coincidences on this lake.
    effects: { trust_seppo: "+10" }
    choices:
      - Did you see anything unusual recently? -> seppo_night
      - Move on -> quest1_hub

  seppo_night:
    type: message
    text: >
      SEPPO: The night before she vanished — I was coming back from
      night fishing, around midnight. I saw lights at Aino's workshop
      down by the shore. Not unusual, she works late sometimes. But
      there were two vehicles in the yard. One was Aino's old Hilux.
      The other was a black company SUV with BoreaTimber plates.

      At midnight. At a sauna builder's workshop.

      I wrote it in my fishing log. Nobody's asked to see it.
    effects: { trust_seppo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Noora (teen rower, witness tease) ---

  noora_intro:
    type: tweet
    from: noora
    text: >
      en voi uskoo tätä fr @aino_virtanen opetti mulle kaiken järvestä
      ja puusta. ei se oo vaa lähteny jonneki. jos joku tietää jotai
      pls kertokaa
    effects: { trust_noora: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Noora -> noora_talk_early

  noora_talk_early:
    type: message
    text: >
      NOORA: moi ooksä uus? siis ajoitus on aika paska. mut joo aino
      on niinku paras ihminen tässä kylässä fr. se opetti meille
      soutamaan turvallisesti ja näytti miten sauna rakennetaan
      oikeesti perinteisesti. tosi siistii.

      ja nyt mua pelottaa koska aleksi näki jotain outoo sinä iltana
      satamassa mut se ei haluu puhuu siitä. se sanoo et ei se ollu
      mitään mut siis... kyllähän se oli jotain vittu
    effects: { trust_noora: "+10" }
    choices:
      - What did Aleksi see? -> noora_aleksi_hint
      - Move on -> quest1_hub

  noora_aleksi_hint:
    type: message
    text: >
      NOORA: en mä tiiä tarkkaan. se oli satamassa iltalenkillä ja
      näki jonkun ainon auton luona? tai jotain sellasta. se flippaa
      eikä haluu puhuu. pitää kysyy siltä suoraan mut se on aika
      epäluulonen tuntemattomille. puhu sille ensin jostain kalastuksesta
      tai metsästyksestä nii se rentoutuu lol
    effects: { trust_noora: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Järvenpohja. A Finnish Lakeland
      village built around the water. A sauna builder who was exposing
      pollution. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Elina (Aino's best friend) -> elina_q1
      - Talk to Tuomas (Aino's mentor) -> tuomas_q1
      - Check what Mikko (Aino's brother) is saying -> mikko_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Elina Q1 ---

  elina_q1:
    type: tweet
    from: elina
    text: >
      jos joku on nähny @aino_virtanen soittakaa mulle heti. sen huone
      on koskematon. sukelluskamera on paikallaan. se ei ois ikinä
      lähteny ilman varusteitaan.
    effects: { trust_elina: "+5", contacts_followed: "+1" }
    choices:
      - DM Elina -> elina_q1_talk

  elina_q1_talk:
    type: message
    text: >
      ELINA: Thanks for reaching out but I don't know you. Aino has
      a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Elina is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_elina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tuomas Q1 ---

  tuomas_q1:
    type: tweet
    from: tuomas
    text: >
      Verstas on tyhjä ilman @aino_virtanen. Sen puuvarastot on
      paikallaan. Keskeneräset projektit odottaa. Aino ei jätä
      työtä kesken. Jotain on tapahtunu.
    effects: { trust_tuomas: "+5", contacts_followed: "+1" }
    choices:
      - DM Tuomas -> tuomas_q1_talk

  tuomas_q1_talk:
    type: message
    text: >
      TUOMAS: Aino and I have worked together since she was an
      apprentice. She's the most talented builder I've ever trained.
      This pollution investigation — it consumed her. She had data,
      photos, water samples. She was close to going public.

      I offered to help her. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to support her work.

      [Tuomas seems earnest. Or controlling?]
    effects: { trust_tuomas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mikko Q1 ---

  mikko_q1:
    type: tweet
    from: mikko
    text: >
      mun sisko on KADONNU ja poliisi sanoo et se on ehkä menny
      sukulaisten luo??? SE EI LÄHDE KERTOMATTA. tuun tampereelta.
      joku selittää mulle mitä helvettiä täällä tapahtuu.
    effects: { trust_mikko: "+5", contacts_followed: "+1" }
    choices:
      - DM Mikko -> mikko_q1_talk

  mikko_q1_talk:
    type: message
    text: >
      MIKKO: Who are you? Another person from that village who's going
      to tell me to calm down? My sister called me the night before she
      disappeared. She said she had something big. She said "if anything
      happens, look at BoreaTimber." Then she hung up.

      That's the last I heard from her. Saatana.
    effects: { trust_mikko: "+10" }
    choices:
      - What do you think happened? -> mikko_theory
      - Move on -> quest1_hub

  mikko_theory:
    type: message
    text: >
      MIKKO: I think she found proof that BoreaTimber is dumping toxic
      waste in the lake and they shut her up. But I also think that
      old mentor of hers — Tuomas — knows more than he's saying. The
      way he talks about her... it's not just professional concern.
      It's something else. Se on sairas.

      Aino told me months ago that someone was going through her files
      at the workshop. Tools moved, papers shuffled. She thought it was
      nothing. I don't think it was nothing.
    effects: { trust_mikko: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Aino went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Aleksi (was fishing at the harbour at dusk) -> aleksi_interview
      - Find Pekka (harbour master, works late) -> pekka_interview
      - Find Matti (baker, starts at 4am, saw something) -> matti_interview
      - Find Seppo (fisherman, early morning on the lake) -> seppo_interview_q2

  # --- Aleksi (saw someone at Aino's truck) ---

  aleksi_interview:
    type: tweet
    from: aleksi
    text: >
      hyväsessio tänää mut satamassa on outo fiilis nykyää. joku juttu
      ei oo kohalleen. en osaa selittää
    effects: { trust_aleksi: "+5" }
    choices:
      - Ask Aleksi about that evening -> aleksi_talk

  aleksi_talk:
    type: message
    text: >
      ALEKSI: okei mut älä kerro kellekää. mä olin satamassa siin
      seiskalt illal kalastamas ja näin sen vanhuksen — tuomaksen —
      ainon auton luona. se näytti siltä et se penkoi sieltä jotain
      tai laitto jotain sinne. ku se näki mut nii se häipy vitun
      nopeesti.

      siis mä en sanonu mitää koska en halunnu draamaa mut nyt on
      kyl aika paha tilanne. ei oo normaalia käytöstä saatana
    effects:
      trust_aleksi: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Pekka (harbour master, saw late-night meeting) ---

  pekka_interview:
    type: tweet
    from: pekka
    text: >
      Muistutus: venesatama on suljettu klo 22-06. Viime öinä
      havaittu luvatonta liikennettä satama-alueella.
    effects: { trust_pekka: "+5" }
    choices:
      - Ask Pekka what he saw -> pekka_talk

  pekka_talk:
    type: message
    text: >
      PEKKA: I was locking up the harbour office around 22:30. I saw
      Aino's truck still at her workshop yard. And a black SUV —
      BoreaTimber plates — parked next to it. Two men were standing
      by the workshop door. One of them I recognised: Onni Karjalainen,
      the mill director.

      At 22:30. At a sauna builder's workshop. That's not normal.

      I noted it in my harbour log. Nobody's asked to see it.
    effects:
      trust_pekka: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Matti (baker, saw car chase at dawn) ---

  matti_interview:
    type: tweet
    from: matti
    text: >
      Aamuleipä uunissa neljältä niinku aina. Mut sinä aamuna
      joku ajo rantatiellä aivan liian lujaa.
    effects: { trust_matti: "+5" }
    choices:
      - Ask Matti what he saw -> matti_talk

  matti_talk:
    type: message
    text: >
      MATTI: I start baking at 4am every day. That morning I was
      opening the shutters and a vehicle went past — fast, way too
      fast for the shore road. Dark SUV. Then maybe two minutes later,
