  tuomas_response:
    type: message
    text: >
      Tuomas doesn't reply for a long time. Then:

      TUOMAS: You don't understand. I was protecting her. She was in
      danger from BoreaTimber and she wouldn't let me help. I needed to
      know she was safe. I taught her everything. Everything she knows
      about wood, about saunas, about this craft — it came from me. I
      had a right to be involved.

      That's not mentorship. That's obsession.

      You've already sent the evidence to Ylikonstaapeli Niemi. And
      to Kari Salonen.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Ylikonstaapeli Niemi reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the witness
      testimonies — Tuomas is arrested for stalking and harassment. A
      GPS tracker is recovered from under Aino's truck at the old
      fishing cabins at Honkaniemi.

      Kari Salonen, finally in possession of Aino's full evidence
      package, publishes the BoreaTimber story in Helsingin Sanomat.
      The ELY-centre orders an unannounced inspection. The mill is shut
      down pending environmental remediation. Onni Karjalainen faces
      criminal charges for falsifying discharge reports.

      And Aino Virtanen, reading the story from a friend's cabin in
      Kuopio, calls her brother for the first time in nine days.

      "Mä tuun kotiin."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: aino
    text: >
      puu ei valehtele. eikä järvenpohjan ihmiset. kiitos kun ette
      luovuttanu.
    choices:
      - The End -> game_complete

  # --- ENDING B: Onni (Partial Ending) ---

  confront_onni:
    type: message
    text: >
      You present the pollution evidence to Onni Karjalainen:

      "I have photographs of the undeclared outfall pipe. I have water
      samples showing chemical levels fifteen times the legal limit. I
      have your original lab reports showing the data was falsified. I
