    type: message
    text: >
      ONNI: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. BoreaTimber has always operated within
      regulatory requirements.

      But it's too late. You've sent the evidence to Kari, to the
      vesiensuojeluyhdistys, and to the ELY-centre.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. BoreaTimber is ordered to halt
      discharge pending investigation. The mill may close. One hundred
      and fifty jobs hang in the balance. The village is divided.

      But Aino?

      Without the stalking evidence, Tuomas is never investigated. He
      continues to use the master code. He continues to monitor her
      posts. He creates a new anonymous profile.

      Three months later, Aino reads about BoreaTimber online. She
      returns quietly. She changes her workshop locks. She stops
