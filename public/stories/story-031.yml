              gte: 8
            - state: thread2_evidence
              gte: 8
      - Give up the investigation -> ending_silence

  ending_justice:
    type: message
    text: >
      ENDING 1: JUSTICE FOR IKER

      Working with Aitor, Irati, and the community, you coordinate a
      simultaneous action. Aitor publishes a devastating expose in El Mundo
      with all of Iker's evidence. Irati files a formal complaint with the
      Ertzaintza internal affairs division. Andoni agrees to testify in
      exchange for protection.

      Koldo Zabala is arrested within 48 hours, along with the two men from
      Bilbao who were identified through CCTV footage. Gorka Mendizabal
      confesses to his role in facilitating match-fixing. Joseba Alonso
      resigns from the federation and is charged with corruption.

      The investigation into Iker's disappearance is reopened by a special
      unit. Evidence from the warehouse leads to charges. Three months later,
      Iker's remains are found. His family finally has answers.

      The community of Arrantzale is shattered but united in grief and
      determination. Unai, Nerea, and Mikel establish the Iker Etxebarria
      Foundation for clean sport and youth mentoring. His blog is republished
      in full.

      Iker's last unsent email finally reaches the world. His voice,
      silenced by violence, echoes louder than ever.

      #JusticeForIker was not just a hashtag. It was a promise, kept.
    choices:
      - Read the memorial messages -> memorial_messages
      - View resources -> resources

  ending_partial:
    type: message
    text: >
      ENDING 2: PARTIAL JUSTICE

      You share what you've gathered with Officer Irati, who escalates
      it through back channels. An investigation is opened but without
      media pressure, it moves slowly. Koldo's betting shop is audited
      and eventually shut down for irregularities. Gorka is quietly
      removed from coaching.

      But the syndicate's wider connections are never fully exposed.
      Joseba remains in his position at the federation. The two men
      from Bilbao are never identified. Iker's disappearance is
      reclassified as a missing persons case, never officially solved.

      Amaia continues her campaign for answers. The teens carry Iker's
      memory but the full truth remains buried. Some of the corruption
      is disrupted, but the root system survives.

      Arrantzale returns to a fragile normality. But the questions
      never quite go away, and every time a pelota match produces an
      unexpected result, someone in the crowd remembers Iker's words
      and wonders.

      Sometimes partial justice is all a small town can get.
    choices:
      - Read community reactions -> partial_reactions
      - View resources -> resources

  partial_reactions:
    type: tweet
    from: nerea
    text: >
      At least Koldo's shop is gone but tio we both know this isn't
      over. The people behind the people are still out there. Iker
      deserved better. We all do. I'm going to journalism school
      next year. This story isn't finished. #JusticeForIker
    choices:
      - View resources -> resources

  ending_silence:
    type: message
    text: >
      ENDING 3: SILENCE WINS

      Without enough evidence or courage to act, the investigation stalls.
      Koldo's betting operation continues. Gorka keeps coaching. The
      federation carries on as before. Iker's disappearance becomes just
      another unsolved case in a system that protects the powerful.

      The #JusticeForIker posts gradually slow down. The community moves
      on, or appears to. Maite stops posting altogether. Amaia goes
      quiet. The teens carry a wound that changes how they see the world.

      Unai quits pelota. Mikel retreats back into isolation. Nerea's
      anger hardens into something colder. The adults who could have
      acted didn't, and the young people noticed.

      The old warehouse at the port is demolished six months later.
      Whatever evidence it held is gone. Koldo expands his operation.
      The syndicate grows bolder.

      Silence was always their most powerful weapon. And in the end,
      it won again.

      But somewhere, on a backed-up server, Iker's posts still exist.
      Waiting for someone brave enough to read them. The truth doesn't
      disappear. It just waits.
    choices:
      - View resources -> resources

  memorial_messages:
