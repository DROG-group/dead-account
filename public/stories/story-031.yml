      "Eight months of investigation. Twenty-three suspicious matches. One
      syndicate. The truth about corruption in Basque pelota will come out.
      If not through me, then through the evidence I've left behind. Some
      things are bigger than one person. #PelotaGarbia #CleanSport"

      It was reblogged 47 times before his account was deleted.
    effects: { thread1_evidence: "+1", evidence_total: "+1" }
