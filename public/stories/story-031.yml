  resources:
    type: message
    text: >
      IMPORTANT RESOURCES

      If you or someone you know is experiencing threats, bullying,
      or is in danger because of speaking out about wrongdoing:

      Spain - Telefono de la Esperanza: 717 003 717
      Spain - Anar Foundation (minors): 900 20 20 10
      Spain - National Police: 091
      Spain - Civil Guard: 062

      Whistleblower protection (EU): Directive 2019/1937 protects
      those who report breaches of EU law.

      Corruption can be reported anonymously to the Fiscalia
      Anticorrupcion.

      Remember: speaking up about wrongdoing is brave, not dangerous.
      There are systems and people designed to protect you. You are
      never alone.

      If you are a young person feeling overwhelmed, talk to a
      trusted adult, contact a helpline, or reach out to your local
      youth services. Your voice matters and your safety comes first.
    choices:
      - Return to the beginning -> welcome
