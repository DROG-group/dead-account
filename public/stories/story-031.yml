meta:
  title: "Dead Account"
  state:
    trust_unai: 0
    trust_nerea: 0
    trust_mikel: 0
    trust_amaia: 0
    trust_gorka: 0
    trust_aitor: 0
    trust_begona: 0
    contacts_followed: 0
    night_witnesses: 0
    thread1_evidence: 0
    thread2_evidence: 0
    evidence_total: 0
    confrontation_ready: 0
    talked_to_coach: 0
    talked_to_bookie: 0
    found_doping_list: 0
    found_betting_slips: 0
    iker_phone_unlocked: 0
  player:
    name: New Resident
    bio: "Just moved to Arrantzale. Trying to find my way around this beautiful Basque town."
    avatar: avatars/default_citizen.png
  bot:
    display_name: "Arrantzale.social"
    description: "Ongi etorri! Welcome to the local instance for the coastal town of Arrantzale, Basque Country. Our community is reeling from the sudden disappearance of beloved pelota player and sports blogger Iker Etxebarria. His account went dark three weeks ago. Help us find out what happened."
    avatar_url: /gamepatch/assets/dead-account/bot.png
  npcs:
    unai:
      name: "Unai Zubieta"
      bio: "16. Pelota player. Iker was my coach basically. Still can't believe he's gone. #JusticeForIker"
      avatar: avatars/unai.jpg
    nerea:
      name: "Nerea Agirre"
      bio: "17. Journalism student. If nobody else is going to ask questions about Iker, I will. Photographer. She/her."
      avatar: avatars/nerea.jpg
    mikel:
      name: "Mikel Larrea"
      bio: "15. Gamer. Iker helped me get into pelota when I was having a rough time. He deserved better."
      avatar: avatars/mikel.jpg
    amaia:
      name: "Amaia Etxebarria"
      bio: "Iker's older sister. Nurse at Arrantzale Health Centre. I won't stop until I know what happened to my brother."
      avatar: avatars/amaia.jpg
    gorka:
      name: "Gorka Mendizabal"
      bio: "Head coach, Arrantzale Pelota Club. 30 years coaching champions. Our community is our strength."
      avatar: avatars/gorka.jpg
    aitor:
      name: "Aitor Ibarra"
      bio: "Sports journalist, Diario Vasco freelancer. Covering regional pelota since 2009. The truth matters."
      avatar: avatars/aitor.jpg
    begona:
      name: "Amona Begona"
      bio: "Begona Arregui. Retired schoolteacher. 78 years in Arrantzale. I know everyone and I forget nothing."
      avatar: avatars/begona.jpg
    patxi:
      name: "Patxi Goikoetxea"
      bio: "Owner of Bar Frontoia. Best pintxos in town. Pelota on the big screen every match day."
      avatar: avatars/patxi.jpg
    miren:
      name: "Miren Uribe"
      bio: "Pharmacist. Arrantzale is a small town and small towns talk. Sometimes too much, sometimes not enough."
      avatar: avatars/miren.jpg
    joseba:
      name: "Joseba Alonso"
      bio: "President, Regional Pelota Federation. Dedicated to the growth and integrity of our beloved sport."
      avatar: avatars/joseba.jpg
    leire:
      name: "Leire Gorostiza"
      bio: "17. Nerea's best friend. Student council. I organize things. Currently organizing my grief."
      avatar: avatars/leire.jpg
    txema:
      name: "Txema Aranburu"
      bio: "Retired fisherman. I sit at the port and watch the boats. I also watch the people."
      avatar: avatars/txema.jpg
    koldo:
      name: "Koldo Zabala"
      bio: "Betting shop manager, Apuestas Zabala. Legal, licensed, legitimate. Don't believe rumours."
      avatar: avatars/koldo.jpg
    edurne:
      name: "Edurne Lasa"
      bio: "Town librarian. Iker used to come in to research old pelota records. He was onto something."
      avatar: avatars/edurne.jpg
    andoni:
      name: "Andoni Retegi"
      bio: "Star pelota player. Two-time regional champion. I play clean and I play to win."
      avatar: avatars/andoni.jpg
    ane:
      name: "Ane Bilbao"
      bio: "Social worker, Arrantzale youth services. These kids need support right now. DMs open."
      avatar: avatars/ane.jpg
    igor:
      name: "Igor Perez"
      bio: "IT support, town council. I keep the servers running. I also kept Iker's blog running."
      avatar: avatars/igor.jpg
    maite:
      name: "Maite Etxebarria"
      bio: "Iker and Amaia's ama. I just want my son back. Please."
      avatar: avatars/maite.jpg
    xabi:
      name: "Xabi Dorronsoro"
      bio: "22. University student home for summer. Used to train with Iker. Something was off those last weeks."
      avatar: avatars/xabi.jpg
    irati:
      name: "Irati Azkue"
      bio: "Local police officer. The case is under investigation. Please direct any information through proper channels."
      avatar: avatars/irati.jpg

entry: welcome

nodes:
  welcome:
    type: message
    text: >
      You've just created an account on Arrantzale.social, the local Mastodon instance
      for this small coastal town in the Basque Country. Your feed immediately fills with
      posts about Iker Etxebarria, a 24-year-old pelota player and sports blogger who
      disappeared three weeks ago. His account @iker went silent overnight. The local police
      say they're investigating, but the community is frustrated by the lack of answers.
      Iker's last blog posts were about corruption in regional pelota leagues. Now his
      family and friends are desperate for help.
    choices:
      - Browse the local timeline -> local_timeline
      - Look at Iker's archived posts -> iker_archive
      - Read the welcome guide -> welcome_guide

  welcome_guide:
    type: message
    text: >
      ARRANTZALE.SOCIAL - COMMUNITY GUIDE

      Ongi etorri! This instance serves our beautiful fishing town. Please be respectful
      of our community during this difficult time. Many of us knew Iker personally.

      To get oriented: follow local accounts, check the #JusticeForIker hashtag, and
      visit the fronton (pelota court) area where many gather in the evenings.

      Instance admin: @igor
    choices:
      - Browse the local timeline -> local_timeline
      - Look at Iker's archived posts -> iker_archive

  local_timeline:
    type: tweet
    from: nerea
    text: >
      Bua tio three weeks and NOTHING from the police. Iker didn't just vanish into thin
      air. He was investigating something and someone didn't like it. Open your eyes
      #JusticeForIker
    choices:
      - Reply to Nerea -> reply_nerea_first
      - Keep scrolling -> timeline_scroll_2

  reply_nerea_first:
    type: message
    text: >
      You reply to Nerea's post, introducing yourself and saying you want to help.
    effects: { trust_nerea: "+5", contacts_followed: "+1" }
    choices:
      - Keep scrolling the timeline -> timeline_scroll_2
      - DM Nerea directly -> dm_nerea_intro

  dm_nerea_intro:
    type: tweet
    from: nerea
    text: >
      Oh hey, you're new here. Look I don't want to sound paranoid but Iker was
      getting threats before he disappeared. He showed me some of the messages.
      They were about his blog posts on match-fixing in pelota. Flipa tio, it was
      heavy stuff. If you actually want to help, talk to Unai and Mikel too.
      They trained with Iker.
    effects: { trust_nerea: "+10", thread1_evidence: "+1", evidence_total: "+1" }
    choices:
      - Ask about the threats -> nerea_threats_detail
      - Ask about the blog posts -> nerea_blog_detail
      - Go talk to Unai -> find_unai

  nerea_threats_detail:
    type: tweet
    from: nerea
    text: >
      He got DMs from anonymous accounts. Like proper scary ones. Stuff like
      "stop digging or you'll regret it" and "we know where your ama lives."
      I told him to go to the police but he said the police here wouldn't do
      anything because some of the people involved have connections. Ostia tio
      I should have pushed harder.
    effects: { thread2_evidence: "+1", evidence_total: "+1" }
    choices:
      - Ask who he thought was behind it -> nerea_suspects
      - Go talk to Unai -> find_unai
      - Check the local timeline -> timeline_scroll_2

  nerea_suspects:
    type: tweet
    from: nerea
    text: >
      He never said names directly but he kept mentioning "the betting people"
      and said Gorka the coach was acting weird whenever Iker brought up certain
      players' performance. And Koldo from the betting shop, Iker said he had
      proof Koldo was connected to a bigger syndicate. Bua I'm scared even
      typing this honestly.
    effects: { thread1_evidence: "+1", thread2_evidence: "+1", evidence_total: "+2" }
    choices:
      - Go investigate Koldo -> find_koldo
      - Go talk to Gorka -> find_gorka
      - Find Unai first -> find_unai

  nerea_blog_detail:
    type: tweet
    from: nerea
    text: >
      His blog "Pelota Garbia" (Clean Pelota) started as match reviews but
      then he started noticing patterns. Players underperforming in specific
      sets, weird betting odds before matches, that kind of thing. The last
      post before he disappeared was titled "Following the Money" and it got
      taken down like two days after he vanished. Ama mia someone deleted it.
    effects: { thread1_evidence: "+1", evidence_total: "+1" }
    choices:
      - Ask if anyone saved the blog post -> nerea_saved_post
      - Go talk to Unai -> find_unai
      - Check the timeline -> timeline_scroll_2

  nerea_saved_post:
    type: tweet
    from: nerea
    text: >
      Edurne at the library might have something. Iker used to print stuff
      out there, old school style. And Igor who runs the instance might have
      server logs or cached versions. Worth asking both.
    effects: { thread1_evidence: "+1", evidence_total: "+1" }
    choices:
      - Visit Edurne at the library -> find_edurne
      - Talk to Igor about server logs -> find_igor
      - Find Unai -> find_unai

  timeline_scroll_2:
    type: tweet
    from: unai
    text: >
      Training at the fronton felt wrong today without Iker. He was the one
      who made me believe I could actually be good at this. Gorka barely
      mentioned him. Like bro how can you just pretend everything's normal??
      #JusticeForIker
    choices:
      - Reply to Unai -> reply_unai_first
      - Keep scrolling -> timeline_scroll_3

  reply_unai_first:
    type: message
    text: >
      You reply to Unai's post with support and mention you'd like to help find answers.
    effects: { trust_unai: "+5", contacts_followed: "+1" }
    choices:
      - DM Unai -> dm_unai_intro
      - Keep scrolling -> timeline_scroll_3

  dm_unai_intro:
    type: tweet
    from: unai
    text: >
      Tio for real? Most people here just post hashtags and do nothing.
      Look Iker was my mentor basically. Last time I saw him he was super
      stressed. Said he had evidence that could "blow the whole thing open"
      about match-fixing. He was going to meet someone that night. He
      never came home.
    effects: { trust_unai: "+10", thread1_evidence: "+1", evidence_total: "+1" }
    choices:
      - Ask who he was meeting -> unai_meeting
      - Ask about the evidence -> unai_evidence
      - Ask about Gorka -> unai_on_gorka

  unai_meeting:
    type: tweet
    from: unai
    text: >
      He didn't say exactly but he mentioned the port area. Said someone
      was going to give him documents. Txema the old fisherman hangs around
      the port all day and night. He might have seen something. Bua tio
      I should have gone with him that night.
    effects: { thread1_evidence: "+1", evidence_total: "+1", night_witnesses: "+1" }
    choices:
      - Go find Txema at the port -> find_txema
      - Ask Unai about the evidence -> unai_evidence
      - Check the timeline -> timeline_scroll_3

  unai_evidence:
    type: tweet
    from: unai
    text: >
      He had screenshots of betting patterns, like someone was placing huge
      bets right before matches where the favourite lost. And he said he'd
      found a list of players who were being paid to throw sets. Ostia tio
      he said it went higher than just local leagues. Regional federation
      level stuff.
    effects: { thread1_evidence: "+1", evidence_total: "+1" }
    choices:
      - Ask about the player list -> unai_player_list
      - Go find Txema -> find_txema
      - Check the timeline -> timeline_scroll_3

  unai_player_list:
    type: tweet
    from: unai
    text: >
      I don't know all the names but he mentioned Andoni Retegi for sure.
      Andoni's the star player, two-time regional champion. If he's involved...
      bua that's massive. But careful tio, Andoni has a temper and a lot of
      friends in this town.
    effects: { thread1_evidence: "+1", evidence_total: "+1", found_doping_list: "+1" }
    choices:
      - Go confront Andoni -> find_andoni
      - Talk to Gorka the coach -> find_gorka
      - Go to the port to find Txema -> find_txema

  unai_on_gorka:
    type: tweet
    from: unai
    text: >
      Gorka's been coaching here forever and everyone respects him but tio
      I swear he's been acting different since Iker disappeared. Like
      nervous. He told us not to talk about Iker's blog at training. Said
      it would "create problems for the club." To loco bro what kind of
      coach says that?
    effects: { trust_unai: "+5", thread1_evidence: "+1", evidence_total: "+1", talked_to_coach: "+1" }
    choices:
      - Go confront Gorka -> find_gorka
      - Find Txema at the port -> find_txema
      - Check timeline -> timeline_scroll_3

  timeline_scroll_3:
    type: tweet
    from: mikel
    text: >
      Nobody at school wants to talk about Iker anymore. Like he just stopped
      existing. I was in a bad place last year and he's the one who got me
      out of it. Got me playing pelota, checking in on me every week. And now
      people act like it's just normal that he's gone?? Flipa.
    choices:
      - Reply to Mikel -> reply_mikel_first
      - Keep scrolling -> timeline_scroll_4

  reply_mikel_first:
    type: message
    text: >
      You reply to Mikel acknowledging how important Iker was to him and that you want
      to help find answers.
    effects: { trust_mikel: "+5", contacts_followed: "+1" }
    choices:
      - DM Mikel -> dm_mikel_intro
      - Keep scrolling -> timeline_scroll_4

  dm_mikel_intro:
    type: tweet
    from: mikel
    text: >
      Thanks tio. Most adults just say "the police are handling it" and change
      the subject. Look I know something that might help. Iker gave me a USB
      drive like a week before he disappeared. Said "keep this safe and don't
      tell anyone." I haven't opened it because I'm honestly scared.
    effects: { trust_mikel: "+10", thread1_evidence: "+1", evidence_total: "+1" }
    choices:
      - Ask Mikel to open the USB -> mikel_usb
      - Tell Mikel to keep it safe for now -> mikel_keep_safe
      - Ask what Iker was like those last days -> mikel_last_days

  mikel_usb:
    type: tweet
    from: mikel
    text: >
      Ok I opened it. Tio there's a spreadsheet with dates, match results,
      and amounts of money. And there's a folder called "Syndicate" with
      photos of betting slips and screenshots of encrypted chats. One of
      the chat names is "KZ_Boss." Ostia bro this is real. I'm shaking.
    effects: { thread1_evidence: "+2", thread2_evidence: "+1", evidence_total: "+3", found_betting_slips: "+1" }
    choices:
      - Ask about KZ_Boss -> mikel_kz_boss
      - Tell Mikel to make copies -> mikel_copies
      - Go investigate Koldo -> find_koldo

  mikel_kz_boss:
    type: tweet
    from: mikel
    text: >
      KZ... Koldo Zabala? He runs the betting shop. Bua tio that tracks
      because Iker always said the betting shop was the centre of everything.
      But if Koldo is the boss of some syndicate then this is way bigger
      than Arrantzale. What do we do??
    effects: { thread2_evidence: "+1", evidence_total: "+1", talked_to_bookie: "+1" }
    choices:
      - Go investigate Koldo -> find_koldo
      - Tell Mikel to send you copies -> mikel_copies
      - Check timeline -> timeline_scroll_4

  mikel_copies:
    type: tweet
    from: mikel
    text: >
      Done. Sent you the spreadsheet encrypted. Password is the name of
      Iker's first pelota victory tournament, lowercase, no spaces. Ask
      Amaia or Unai, they'd know. I'm going to hide the USB somewhere
      safe. Flipa tio we're actually doing this.
    effects: { trust_mikel: "+10", thread1_evidence: "+1", evidence_total: "+1" }
    choices:
      - Go ask Amaia about the tournament -> find_amaia
      - Go investigate Koldo -> find_koldo
      - Check timeline -> timeline_scroll_4

  mikel_keep_safe:
    type: tweet
    from: mikel
    text: >
      Yeah ok. I'll keep it hidden. But tio if something happens to me too...
      I don't know. Maybe I should make a copy? Iker trusted me with this
      for a reason. I just wish he'd told me what it was about.
    effects: { trust_mikel: "+5" }
    choices:
      - Ask Mikel to open it when he's ready -> mikel_usb
      - Ask about Iker's last days -> mikel_last_days
      - Check the timeline -> timeline_scroll_4

  mikel_last_days:
    type: tweet
    from: mikel
    text: >
      He was different tio. Normally Iker was super chill, always joking
      around. But those last two weeks he was paranoid. Kept looking over
      his shoulder. He told me once that "not everyone at the club is who
      they seem." And he started going to the port at night which was
      weird. He wasn't a fishing person at all.
    effects: { thread1_evidence: "+1", evidence_total: "+1", night_witnesses: "+1" }
    choices:
      - Ask about the port visits -> mikel_port
      - Open the USB drive -> mikel_usb
      - Check the timeline -> timeline_scroll_4

  mikel_port:
    type: tweet
    from: mikel
    text: >
      I followed him once. Don't judge me tio I was worried. He went to
      the old warehouse at the end of the dock. Met someone there but I
      couldn't see who because it was dark. They talked for like 20 minutes
      and then Iker left looking even more stressed. Bua I should have said
      something.
    effects: { thread2_evidence: "+1", evidence_total: "+1", night_witnesses: "+1" }
    choices:
      - Go investigate the warehouse -> investigate_warehouse
      - Find Txema at the port -> find_txema
      - Check timeline -> timeline_scroll_4

  timeline_scroll_4:
    type: tweet
    from: amaia
    text: >
      My brother didn't just disappear. Someone made him disappear. The police
      found his phone smashed at the port but won't tell us anything else.
      Iker was brave and he was right about the corruption. I will not be
      silenced. #JusticeForIker
    choices:
      - Reply to Amaia -> reply_amaia_first
      - Keep scrolling -> timeline_scroll_5

  reply_amaia_first:
    type: message
    text: >
      You reply to Amaia offering your help and condolences.
    effects: { trust_amaia: "+5", contacts_followed: "+1" }
    choices:
      - DM Amaia -> dm_amaia_intro
      - Keep scrolling -> timeline_scroll_5

  dm_amaia_intro:
    type: tweet
    from: amaia
    text: >
      Thank you. I'm exhausted but I can't stop. Iker was my little brother
      and I was supposed to look after him. He came to me two days before he
      disappeared and said he had proof of a match-fixing ring connected to
      gambling syndicates. He named Koldo Zabala and said there were people
      in the pelota federation involved too. He was going to publish everything.
    effects: { trust_amaia: "+10", thread1_evidence: "+1", thread2_evidence: "+1", evidence_total: "+2" }
    choices:
      - Ask about the federation connection -> amaia_federation
      - Ask about Iker's phone -> amaia_phone
      - Ask about Koldo -> amaia_koldo

  amaia_federation:
    type: tweet
    from: amaia
    text: >
      Joseba Alonso, the federation president. Iker said Joseba was getting
      kickbacks from the syndicate for looking the other way on suspicious
      matches. And Gorka the coach was pressuring certain players to
      underperform in specific sets. It's all connected. The sport we love
      is rotten from the inside.
    effects: { thread1_evidence: "+2", evidence_total: "+2" }
    choices:
      - Ask about Gorka specifically -> amaia_gorka
      - Go talk to Joseba -> find_joseba
      - Ask about Iker's phone -> amaia_phone

  amaia_gorka:
    type: tweet
    from: amaia
    text: >
      Gorka came to our house after Iker disappeared. Told our ama that Iker
      had been "under a lot of stress" and that maybe he just needed time
      away. Like he was trying to make it seem like Iker chose to leave.
      But I saw his face. He was scared, not sympathetic. He knows something.
    effects: { thread1_evidence: "+1", evidence_total: "+1", talked_to_coach: "+1" }
    choices:
      - Go confront Gorka -> find_gorka
      - Ask about Iker's phone -> amaia_phone
      - Go to the federation -> find_joseba

  amaia_phone:
    type: tweet
    from: amaia
    text: >
      The police have it but they told us the screen was smashed and it was
      wiped. But here's what they don't know - Iker backed everything up
      to a cloud drive. I have his login but I can't bring myself to look.
      The password is the name of his first tournament win. "Torneo Arrantzale
      Gaztea" - lowercase, no spaces.
    effects: { thread1_evidence: "+1", thread2_evidence: "+1", evidence_total: "+2", iker_phone_unlocked: "+1" }
    choices:
      - Access Iker's cloud backup -> iker_cloud
      - Go investigate Gorka -> find_gorka
      - Talk to the police officer Irati -> find_irati

  iker_cloud:
    type: message
    text: >
      You access Iker's cloud backup. Inside you find folders meticulously
      organised: "Match Data," "Betting Patterns," "Threats," "Sources."
      The Threats folder contains 47 screenshots of anonymous messages
      warning him to stop investigating. The Match Data folder has detailed
      analysis of 23 suspicious matches over two seasons. There's also an
      unsent email draft to a national newspaper with all the evidence
      attached, dated the day he disappeared.
    effects: { thread1_evidence: "+3", thread2_evidence: "+2", evidence_total: "+5" }
    choices:
      - Read the threatening messages -> iker_threats_folder
      - Examine the match data -> iker_match_data
      - Read the unsent email -> iker_email_draft

  iker_threats_folder:
    type: message
    text: >
      The threats escalated over three months. Early ones were vague warnings.
      Later ones mentioned his family by name - Amaia, Maite, their home
      address. The last message, sent two days before he disappeared, reads:
      "Final warning. Drop everything or we drop you. The port. Midnight.
      Come alone or your ama pays." Several messages came from an account
      linked to a phone number that traces back to Apuestas Zabala.
    effects: { thread2_evidence: "+2", evidence_total: "+2" }
    choices:
      - Go confront Koldo at the betting shop -> find_koldo
      - Share this with Nerea -> share_with_nerea
      - Examine match data -> iker_match_data

  iker_match_data:
    type: message
    text: >
      Iker's analysis is devastating. He tracked betting odds across multiple
      platforms and found that massive bets were placed on underdogs in 23
      matches where favoured players, including Andoni Retegi, inexplicably
      lost specific sets. The pattern is impossible to explain by chance.
      He estimated over 200,000 euros in suspicious winnings funnelled
      through Apuestas Zabala. There are also notes about performance-enhancing
      drug use among players being used as blackmail leverage.
    effects: { thread1_evidence: "+3", evidence_total: "+3" }
    choices:
      - Read the unsent email -> iker_email_draft
      - Confront Andoni about doping -> find_andoni
      - Go to the betting shop -> find_koldo

  iker_email_draft:
    type: message
    text: >
      The email was addressed to the investigative desk at El Diario. Subject
      line: "Match-fixing syndicate in Basque pelota - full evidence package."
      Iker wrote: "I have been investigating systematic match-fixing in regional
      pelota for eight months. I have evidence connecting a local betting
      operation to a wider gambling syndicate, involving the federation president,
      at least one coach, and multiple players. I am sending this because I
      believe I am in danger. If something happens to me, this evidence must
      not disappear." It was never sent.
    effects: { thread1_evidence: "+2", thread2_evidence: "+1", evidence_total: "+3" }
    choices:
      - Share evidence with Aitor the journalist -> find_aitor
      - Confront the federation president -> find_joseba
      - Go to the police -> find_irati

  share_with_nerea:
    type: tweet
    from: nerea
    text: >
      Ostia tio... this is everything. Iker had it all documented. The
      threats trace back to the betting shop?? Koldo always acts so
      respectable in town. Bua we need to be careful. If these people
      made Iker disappear they won't think twice about us. Let me
      talk to Aitor the journalist. He has national contacts.
    effects: { trust_nerea: "+10", thread2_evidence: "+1", evidence_total: "+1" }
    choices:
      - Go with Nerea to see Aitor -> find_aitor
      - Investigate Koldo first -> find_koldo
      - Check the timeline -> timeline_scroll_5

  timeline_scroll_5:
    type: tweet
    from: begona
    text: >
      I have lived in Arrantzale for 78 years. I taught half this town to
      read. And I will say what others are afraid to say: there are powerful
      people in this town who benefit from silence. Iker was not silent.
      That made him dangerous to them.
    choices:
      - Reply to Amona Begona -> reply_begona
      - Keep scrolling -> timeline_scroll_6

  reply_begona:
    type: message
    text: >
      You reply to Amona Begona, asking if she knows more about who these powerful
      people might be.
    effects: { trust_begona: "+5", contacts_followed: "+1" }
    choices:
