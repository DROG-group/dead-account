  jonas_case:
    type: message
    text: >
      Jonas pasiekia po prekystalio ir ištraukia vandeniui atsparią
      Pelican dėžutę.

      JONAS: Sakė, kad ateisi. Imk.

      Inside: a USB drive and a set of printed photographs. The photos
      show industrial water pumps on the beach at night — not the
      official research sampling, but full-scale illegal amber extraction
      washing away the sand and dunes. The USB drive contains erosion
      data, geological surveys, and Rūta's detailed report with
      amber-craft illustrations showing the destruction timeline.
    effects:
      mining_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Viršila Kairys ---

  virsila_interview:
    type: message
    text: >
      VIRŠILA KAIRYS: Ne oficialiai — ir tai visiškai ne oficialiai —
      norėjau tirti BalticMineral. Viršininkas sustabdė. Sakė, kad
      aplinkos inspekcija "turi jurisdikciją." Tai reiškia: neliesti.

      Apie Danutės situaciją net nežinojau iki šiol. Jei turi
      persekiojimo įrodymų, galiu veikti. Tai aiškiai mano
      jurisdikcija.

      Atnešk man kažką solidaus ir aš atnaujinsiu bylą.
    effects:
      trust_virsila: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened to
      Rūta than anyone in Gintarupė. Who is responsible?
    choices:
      - Confront Danutė Vaičiulienė (the obsessive mentor) -> confront_danute
        when:
          state: obsession_evidence
          gte: 5
      - Confront Valdas Norvilas (the site director) -> confront_valdas
        when:
          state: mining_evidence
          gte: 3
      - Confront Elder Paulauskas (political protection) -> confront_vytautas
      - I need more evidence -> investigation_hub

  # --- ENDING A: Danutė (Best Ending) ---

  confront_danute:
    type: message
    text: >
      You present your evidence to Danutė:

      "I know @neringa_juodkaite is your account. I know you put a
      hidden camera in Rūta's workshop. I know you went through her
      files at night. I know you were watching the building. I have
      witnesses and I have the access records."
    choices:
      - Send -> danute_response

  danute_response:
    type: message
    text: >
      Danutė doesn't reply for a long time. Then:

      DANUTĖ: Tu nesupranti. Aš ją saugojau. BalticMineral jai grėsė
      ir ji neleido man padėti. Turėjau žinoti, kad ji saugi. Viską
      dariau, nes man rūpi. Ji mano mokinė. Ji geriausia.

      That's not care. That's obsession.

      You've already sent the evidence to Viršila Kairys. And to
      Aušra Mikalauskienė.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Viršila Kairys reopens the case. With your evidence — the
      anonymous account, the hidden camera, the access records, the
      witness testimonies — Danutė is arrested for stalking and
      harassment. A hidden camera is recovered from Rūta's workbench
      at the workshop.

      Aušra Mikalauskienė, finally in possession of Rūta's full
      evidence package, publishes the BalticMineral story in Delfi.
      The aplinkos apsaugos agentūra orders an unannounced inspection.
      The illegal mining operation is shut down pending environmental
      remediation. Valdas Norvilas faces criminal charges for
      falsifying extraction reports and illegal coastal mining.

      And Rūta Kazlauskienė, reading the story from a friend's house
      in Šiauliai, calls her brother for the first time in nine days.

      "Grįžtu namo."

      If you or someone you know is experiencing stalking or harassment,
      help is available:
      Pagalbos moterims linija: 8 800 66366 (nemokama)
      Vaikų linija: 116 111
      Aplinkos apsaugos pranešimai: 8 800 02024
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: ruta
    text: >
      gintaras nemeluoja. ir gintarupės žmonės irgi. ačiū, kad
      nepasitraukėt.
    choices:
      - The End -> game_complete

  # --- ENDING B: Valdas (Partial Ending) ---

  confront_valdas:
    type: message
    text: >
      You present the mining evidence to Valdas Norvilas:

      "I have photographs of the undeclared extraction site. I have
      erosion measurements proving illegal mining. I have your original
      lab reports showing the data was falsified. I have the pump
      equipment with your batch numbers."
    choices:
      - Send -> valdas_response

  valdas_response:
    type: message
    text: >
      VALDAS: Šis pokalbis perduodamas mūsų teisiniam skyriui. Bet
      kokios šmeižikiškos medžiagos paskelbimas sukels neatidėliotinas
      teisines pasekmes. BalticMineral visada veikė pagal teisės aktų
      reikalavimus.

      But it's too late. You've sent the evidence to Aušra, to
      Pajūrio Sargyba, and to the aplinkos apsaugos agentūra.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The mining story breaks. BalticMineral is ordered to halt
      extraction pending investigation. The illegal operation may be
      dismantled. Two hundred jobs hang in the balance. The village
      is divided.

      But Rūta?

      Without the stalking evidence, Danutė is never investigated.
      She continues to visit the workshop. She continues to monitor
      Rūta's accounts. She creates a new anonymous profile.

      Three months later, Rūta reads about BalticMineral online.
      She returns quietly. She changes workshops. She stops working
      alone at night. She checks her workbench every morning for
      cameras.

      The corporation is exposed. But the person who terrorised Rūta
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: ruta
    text: "grįžau. paplūdimys sveikas. visa kita... pamatysim."
    choices:
      - The End -> game_complete

  # --- ENDING C: Elder (Wrong Ending) ---

  confront_vytautas:
    type: message
    text: >
      You confront Elder Paulauskas with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> vytautas_response

  vytautas_response:
    type: tweet
    from: rokas
    text: >
      Mūsų klientas priima domėn Jūsų teiginius. Bet kokios
      šmeižikiškos medžiagos viešinimas sukels neatidėliotinas teisines
      pasekmes. — Janulio ir partnerių kontora, Vilnius
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The elder's lawyer buries your accusation. Without a direct link
      between Paulauskas and BalticMineral's mining — and there isn't
      one beyond political protection — your evidence is insufficient.

      BalticMineral continues to operate. Danutė continues to watch.
      Rūta stays in hiding.

      Six months later, @neringa_juodkaite creates a new account. It
      follows Rūta's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: GINTARUPĖ — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Mining evidence: ${mining_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Rūta's story explores themes of corporate
      impunity, environmental destruction, obsessive behaviour, coastal
      community solidarity, and the courage to speak up.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Pagalbos moterims linija: 8 800 66366 (nemokama)
      Vaikų linija: 116 111
      Aplinkos apsaugos pranešimai: 8 800 02024
