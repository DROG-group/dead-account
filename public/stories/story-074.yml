entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN GINTARUPĖ
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Gintarupe.social — the community Mastodon instance for
      the Samogitian coastal village of Gintarupė.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @ruta_kazlauskiene.

      An amber jeweler. Traditional Samogitian patterns. She documented
      the old craft and the coastal ecology. People are worried. She
      hasn't posted in six days.
    choices:
      - Look at her profile -> ruta_profile

  ruta_profile:
    type: tweet
    from: ruta
    text: "Paplūdimys prie Gintarupės upelio naikinamas. Kažkas nelegaliai kasa gintarą naktimis. Turiu įrodymų. Tai ne verslas — tai nusikaltimas."
    choices:
      - That's her last real post... -> grey_amber

  grey_amber:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a blurred photo of beach sand, overexposed, shot at a strange
      angle. Posted at 3am. No caption.

      Her friends say that's not her style. Rūta always wrote long
      poetic captions about amber and the sea. The police say she
      probably went to visit relatives in Klaipėda. Something doesn't
      add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: virsila
    text: >
      Gautas pranešimas dėl Gintarupės gyventojos dingimo. Šiuo metu
      nėra duomenų, leidžiančių įtarti nusikalstamą veiką. Visa
      naudinga informacija priimama telefonu 112 arba nuovadoje.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @inga_rimkute is
      desperate. Her brother @dovydas_kazlauskas is driving down from
      Klaipėda. Her amber master @danute_vaiciuliene is posting worried
      messages. The fisherman @marius_stankus says she was right about
      the beach destruction.

      And the journalist @ausra_mikalauskiene is strangely silent.

      Nobody buys the police line. Nobody thinks Rūta just "went to
      visit relatives."
    effects: { trust_inga: "+5", trust_dovydas: "+5" }
    choices:
      - Start following Rūta's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Gintarupė. Follow Rūta's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Aldona (tavern owner, knows everyone) -> aldona_intro
      - Talk to Marius (fisherman, saw the beach damage) -> marius_intro
      - Talk to Gabija (teen photographer, seems shaken) -> gabija_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Rūta with the rhythms of a small
      coastal village: weather warnings, the bakery's šakotis specials,
      fishing conditions, harbour schedules.

      Key names surface: Inga (best friend, nurse), Danutė (amber
      master, rattled), Aušra (journalist, oddly quiet), and the
      teens — Gabija, Lukas, Ugnė — who adored Rūta's amber craft
      and coastal photography.

      Also prominent: BalticMineral UAB, the mining company with a
      facility at the edge of the village. Their posts are corporate
      PR. Rūta's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Aldona -> aldona_intro
      - Talk to Marius -> marius_intro
      - Talk to Gabija -> gabija_intro

  # --- Aldona (social map) ---

  aldona_intro:
    type: tweet
    from: aldona
    text: >
      Užeiga atidaryta, bet širdis sunku. @ruta_kazlauskiene, tavo
      staliukas laukia. Grįžk, mergaite.
    effects: { trust_aldona: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Aldona -> aldona_talk

  aldona_talk:
    type: message
    text: >
      ALDONA: Naujas čia? Sveiki atvykę. Blogu metu atvažiavot.
      Visi nervuojasi dėl Rūtos.

      Papasakosiu, kas yra kas. Inga — geriausia draugė, kartu užaugo
      kaip dvi seserys. Danutė — meistrė, mokė Rūtą gintaro amatui,
      jos dirbtuvėse dirbo. Dovydas — brolis, iš Klaipėdos atvažiuoja.

      Ir Aušra Mikalauskienė — žurnalistė — ji ir Rūta kažką kartu
      tyrė. Apie paplūdimį, apie kasybą. Aušra nė žodžio nepratarė,
      kai Rūta dingo. Tai ne į ją panašu.

      O, ir BalticMineral PR postus pamirškit. Melas, suvyniotas į
      ISO sertifikatus.
    effects: { trust_aldona: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Danutė -> aldona_danute
      - Ask about BalticMineral -> aldona_balticmineral
      - Thank her and move on -> quest1_hub

  aldona_danute:
    type: message
    text: >
      ALDONA: Danutė? Rūtos mokytoja. Trisdešimt metų dirba su gintaru.
      Rūta buvo vienintelė jaunuolė, kuri išmoko. Bet pastaruosius
      mėnesius Danutė keistai elgėsi. Visur kur Rūta — ir ji ten.
      Užeigoje, turguje, paplūdimyje. Nuolat fotografavo Rūtą dirbančią.
      Rūta buvo mandagi, bet mačiau, kad ją nervuoja.

      Rūta man kartą sakė: "Danutė stebi mano darbą, ne mane." Bet
      neskambėjo taip, lyg pati tuo tikėtų.
    effects: { trust_aldona: "+5" }
    choices:
      - Ask about BalticMineral -> aldona_balticmineral
      - Move on -> quest1_hub

  aldona_balticmineral:
    type: message
    text: >
      ALDONA: Ta firma čia trejus metus. Kasybos darbai — gintarą,
      mineralus, nežinau tiksliai. Kaimas pakentė, nes davė darbo.
      Bet žvejai jau seniai skundžiasi — paplūdimys griūva, kopos
      nyksta, gintaro nebėra ten, kur buvo.

      Rūta pirma nuėjo su fotoaparatu ir mėginiais. Sakė, turi
      įrodymų, kad BalticMineral nelegaliai kasa gintarą naktimis,
      naudodami vandens siurblius, naikindami paplūdimį. Po dviejų
      savaičių dingo.
    effects: { trust_aldona: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marius (the beach, witness tease) ---

  marius_intro:
    type: tweet
    from: marius
    text: >
      trisdešimt metų žveju prie šito kranto. paplūdimys nebe toks.
      @ruta_kazlauskiene sakė tiesą. ir dabar ji dingo. pagalvokit.
    effects: { trust_marius: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Marius -> marius_talk

  marius_talk:
    type: message
    text: >
      MARIUS: Nuo penkiolikos žveju prie šito kranto. Pažįstu kiekvieną
      bangą, kiekvieną spalvą. Ir sakau tau — paplūdimys prie Gintarupės
      upelio nebe toks. Jau mėnesiais. Kopos griūva, smėlis dingsta.
      Naktimis girdžiu siurblių garsą.

      Rūta ėmė mėginius. Fotografavo viską. Rinko bylą. Ir tada —
      puf — nebėra.

      Manai, kad atsitiktinumas? Aš netikiu atsitiktinumais prie
      jūros.
    effects: { trust_marius: "+10" }
    choices:
      - Did you see anything unusual recently? -> marius_night
      - Move on -> quest1_hub

  marius_night:
    type: message
    text: >
      MARIUS: Tą naktį, prieš jai dingstant — grįžau iš naktinės
      žvejybos, apie pirmą valandą. Mačiau šviesas prie dirbtuvių.
      Nieko neįprasto, meistrai kartais dirba vėlai. Bet stovėjo du
      automobiliai. Vienas Rūtos mažas Opel. Kitas — juodas
      mikroautobusas su BalticMineral lipdukas.

      Pirmą valandą nakties. Prie gintaro dirbtuvių.

      Tada nesusimąsčiau. Dabar galvoju apie tai nuolat.
    effects: { trust_marius: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Gabija (teen photographer, witness tease) ---

  gabija_intro:
    type: tweet
    from: gabija
    text: >
      blet @ruta_kazlauskiene ji mane išmokė fotografuot paplūdimį
      rimtai negali būt kad ji šiaip dingo. jei kas žinot ką nors
      pls rašykit
    effects: { trust_gabija: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Gabija -> gabija_talk_early

  gabija_talk_early:
    type: message
    text: >
      GABIJA: naujas? po velnių blogu laiku atvažiavai. šiaip rūta
      geriausia žmogus šitam kaime. ji mokė paauglius fotografuot,
      dirbti su gintaru, gerbti jūrą. nx cool buvo.

      ir dabar aš flipinu nes lukas matė kažką keisto prie uosto bet
      nesinori kalbėt. sako kad nieko bet tai ne nieko blet
    effects: { trust_gabija: "+10" }
    choices:
      - What did Lukas see? -> gabija_lukas_hint
      - Move on -> quest1_hub

  gabija_lukas_hint:
    type: message
    text: >
      GABIJA: tiksliai nežinau. jis žvejojo vakare prie uosto ir matė
      kažką kas šnekėjosi prie rūtos dirbtuvių. arba prie jos mašinos.
      šūdas nežinau. lukas bijo, nenori kalbėt. paklausk tiesiogiai
      bet pirma pakalbėk apie žvejybą nes jis nepasitiki nepažįstamais
      lol
    effects: { trust_gabija: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Gintarupė. A small Samogitian coastal
      village built around amber and the sea. A jeweler who was exposing
      illegal beach mining. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Inga (Rūta's best friend) -> inga_q1
      - Talk to Danutė (Rūta's amber master) -> danute_q1
      - Check what Dovydas (Rūta's brother) is saying -> dovydas_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Inga Q1 ---

  inga_q1:
    type: tweet
    from: inga
    text: >
      jei kas nors žinot ką apie @ruta_kazlauskiene, skambikit prašau.
      kambarys nepaliestas. jos įrankiai ant stalo. ji niekada
      nepaliktų nebaigto darbo.
    effects: { trust_inga: "+5", contacts_followed: "+1" }
    choices:
      - DM Inga -> inga_q1_talk

  inga_q1_talk:
    type: message
    text: >
      INGA: Ačiū, kad rašai, bet aš tavęs nepažįstu. Rūta turi daug
      draugų čia. Esu tikra, kad ji grįš.

      ...vis tai kartoju. Pati jau nebetikiu.

      [Inga is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_inga: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Danutė Q1 ---

  danute_q1:
    type: tweet
    from: danute
    text: >
      Dirbtuvės tuščios be @ruta_kazlauskiene. Ant stalo nebaigtas
      gintaro papuošalas. Jos įrankiai sudėti. Niekada nepaliktų
      darbo pusiau. Kažkas atsitiko.
    effects: { trust_danute: "+5", contacts_followed: "+1" }
    choices:
      - DM Danutė -> danute_q1_talk

  danute_q1_talk:
    type: message
    text: >
      DANUTĖ: Rūta buvo geriausia mokinė. Penkerius metus mokiau ją
      gintaro amato. Nepakartojamas talentas. Šis tyrimas dėl kasybos —
      visą save atidavė. Nuotraukas, mėginius, analizes darė. Buvo
      arti viešo paskelbimo.

      Siūliau pagalbą. Daug kartų. Sakė, kad kontroliuoja situaciją.
      Sakė, kad dirba su žurnaliste. Aš tik norėjau padėti.

      [Danutė seems earnest. Or obsessive?]
    effects: { trust_danute: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Dovydas Q1 ---

  dovydas_q1:
    type: tweet
    from: dovydas
    text: >
      MANO SESUO DINGO ir policija sako gal nuvažiavo pas gimines???
      JI NEIŠVAŽIUOJA NEPRANEŠUSI. važiuoju iš klaipėdos. kažkas
      man paaiškinks.
    effects: { trust_dovydas: "+5", contacts_followed: "+1" }
    choices:
      - DM Dovydas -> dovydas_q1_talk

  dovydas_q1_talk:
    type: message
    text: >
      DOVYDAS: Kas tu? Dar vienas žmogus iš to kaimo, kuris sakys
      nusiraminkit? Sesuo skambino man tą naktį, prieš dingstant.
      Sakė, kad turi kažką didelio. Sakė, "jei kas nors atsitiks,
      žiūrėk BalticMineral." Tada padėjo ragelį.

      Tai paskutinis kartas, kai ją girdėjau.
    effects: { trust_dovydas: "+10" }
    choices:
      - What do you think happened? -> dovydas_theory
      - Move on -> quest1_hub

  dovydas_theory:
    type: message
    text: >
      DOVYDAS: Manau, kad ji rado įrodymų, jog BalticMineral nelegaliai
      kasa gintarą, ir jie sunaikino jos įrodymus. Bet taipogi manau,
      kad ta keista meistrė — Danutė — žino daugiau negu sako. Kaip
      ji kalba apie Rūtą... tai ne tik profesinis rūpestis. Tai kažkas
      kita.

      Rūta prieš kelis mėnesius sakė, kad kažkas vaikšto aplink
      dirbtuves naktimis. Fotografuoja ją. Manė, kad nieko tokio. Aš
      manau, kad labai net tokio.
    effects: { trust_dovydas: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Rūta went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Lukas (was fishing at sunset near the harbour) -> lukas_interview
      - Find Petras (harbour master, works late) -> petras_interview
      - Find Marius (fisherman, early morning at the shore) -> marius_interview
      - Find Eglė (baker, starts at 4am, saw something) -> egle_interview

  # --- Lukas (saw someone at Rūta's workshop) ---

  lukas_interview:
    type: tweet
    from: lukas
    text: >
      gera sesija buvo vakarinė žvejyba bet prie uosto kažkaip keistai
      pastaruoju metu. kažkas ne taip. negaliu paaiškint
    effects: { trust_lukas: "+5" }
    choices:
      - Ask Lukas about that evening -> lukas_talk

  lukas_talk:
    type: message
    text: >
      LUKAS: blet ok bet niekam nesakyk. buvau prie uosto apie septintą,
      žvejojau. ir mačiau danutę prie rūtos dirbtuvių. nx keista buvo,
      ji buvo viduj viena, kažką darė prie stalo. kai pamatė mane,
      išbėgo kaip pašėlus.

