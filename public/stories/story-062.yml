  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Polis Gotland reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the
      witness testimonies — Edvin is arrested for stalking and
      harassment. A GPS tracker is recovered from Saga's
      messenger bag at a friend's house in Kalmar.

      Maja Forsberg, finally in possession of Saga's full
      documentation, publishes the NordCruise story in Dagens
      Nyheter. The national heritage board orders an immediate
      site assessment. Strandudden is declared a national
      monument. The port project is cancelled. Kommunalråd
      Söderström's wife's consultancy is investigated for money
      laundering. Viktor Lund faces charges for intimidation
      and destruction of cultural heritage.

      And Saga Lindqvist, reading the story from a friend's
      apartment in Kalmar, calls her brother for the first time
      in nine days.

      "Jag kommer hem."
    choices:
      - See the epilogue -> ending_a_epilogue

