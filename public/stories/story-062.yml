    type: message
    text: >
      ENDING B: THE CORPORATION

      The heritage story breaks. NordCruise is ordered to halt
      all construction pending a full archaeological survey. The
      port project collapses. Four hundred promised jobs vanish.
      The island is divided.

      But Saga?

      Without the stalking evidence, Edvin is never investigated.
      He continues to work at the dig site. He continues to
      monitor her accounts. He creates a new anonymous profile.

      Three months later, Saga reads about NordCruise online.
      She returns quietly. She changes dig sites. She stops
      working alone. She checks her bag every morning.

      The corporation is exposed. But the person who terrorised
      Saga walks free.
    choices:
