entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN VISBY STRAND
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to VisbySocial.se — the community Mastodon instance for
      the village of Visby Strand, on the island of Gotland, Sweden.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @saga_lindqvist.

      An archaeological illustrator. She drew the stones, the ruins,
      the Viking-age finds that Gotland is famous for. People are
      worried. She hasn't posted in six days.
    choices:
      - Look at her profile -> saga_profile

  saga_profile:
    type: tweet
    from: saga
    text: "Vikingagraven vid Strandudden. NordCruise vill bygga sin hamn exakt här. Jag har dokumenterat ALLT. Det här försvinner inte."
    choices:
      - That's her last real post... -> grey_stone

  grey_stone:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a grey stone. Blurry, overexposed, shot from a strange angle.
      Posted at 2am. No caption.

      Her friends say that's not her style. Saga always captioned her
      illustrations with historical context. The police say she
      probably went to the mainland for a break. Something doesn't
      add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: polisen
    text: >
      Vi har mottagit en anmälan om en försvunnen person bosatt i
      Visby Strand. I nuläget finns inga uppgifter som tyder på brott.
      Information kan lämnas via 114 14 eller till närmaste
      polisstation.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @wilma_ekstrom is
      desperate. Her brother @arvid_lindqvist is driving down from
      Visby town. Her colleague @edvin_holm is posting worried
      messages. The fisherman @nils_jakobsson says she was right
      about the Viking grave.

      And the journalist @maja_forsberg is strangely silent.

      Nobody buys the police line. Nobody thinks Saga just
      "went to the mainland."
    effects: { trust_arvid: "+5", trust_wilma: "+5" }
    choices:
      - Start following Saga's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Visby Strand. Follow Saga's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Signe (café owner, knows everyone) -> signe_intro
      - Talk to Nils (fisherman, knows the coast) -> nils_intro
      - Talk to Tuva (teen climber, seems shaken) -> tuva_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Saga with the rhythms of a small
      island village: ferry schedules, the bakery's daily specials,
      weather warnings about Baltic storms.

      Key names surface: Wilma (best friend, museum worker), Edvin
      (field archaeologist, seems rattled), Maja (journalist, oddly
      quiet), and the teens — Tuva, Oskar, Freja — who loved Saga's
      illustration work.

      Also prominent: NordCruise AB, the cruise ship company planning
      a mega-port at Strandudden. Their posts are corporate PR.
      Saga's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Signe -> signe_intro
      - Talk to Nils -> nils_intro
      - Talk to Tuva -> tuva_intro

  # --- Signe (social map) ---

  signe_intro:
    type: tweet
    from: signe
    text: >
      Caféet är öppet men hjärtat är inte med. @saga_lindqvist, din
      plats vid fönstret väntar. Kom tillbaka.
    effects: { trust_signe: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Signe -> signe_talk

  signe_talk:
    type: message
    text: >
      SIGNE: Oh, you're new? Welcome. Terrible timing. Everyone's on
      edge about Saga.

      Let me tell you who's who. Wilma is Saga's best friend — they
      share a flat above the pottery workshop. Sweet girl, devastated
      right now. Edvin Holm is the field archaeologist — he ran the
      dig at Strandudden with Saga. Smart man, but... there's
      something about the way he watches her. Arvid is Saga's older
      brother, he's coming from Visby town.

      And Maja Forsberg — the journalist — she and Saga were working
      on something together. Something about NordCruise and the
      Viking site. Maja hasn't said a word since Saga vanished.
      That's not like her at all.

      Oh, and don't bother reading NordCruise's PR posts. Lies
      wrapped in sustainability reports.
    effects: { trust_signe: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Edvin -> signe_edvin
      - Ask about NordCruise -> signe_nordcruise
      - Thank her and move on -> quest1_hub

  signe_edvin:
    type: message
    text: >
      SIGNE: Edvin? He's been on the dig team three years longer
      than Saga. Brilliant archaeologist. But since she arrived, he's
      been... orbiting her. At the café every time she was there.
      Offered to help with every illustration project. She was polite
      about it but I could tell it bothered her.

      After she started documenting the Viking site for the campaign
      against NordCruise, he got worse. Wanted to be part of
      everything. She told me once, "He doesn't hear no." I thought
      she meant professionally. Now I'm not so sure.
    effects: { trust_signe: "+5" }
    choices:
      - Ask about NordCruise -> signe_nordcruise
      - Move on -> quest1_hub

  signe_nordcruise:
    type: message
    text: >
      SIGNE: NordCruise has been circling Gotland for two years.
      They want to build a cruise terminal at Strandudden — the
      headland south of the village. Deep water access, they say.
      "Sustainable tourism," they say. Hundreds of jobs.

      Problem is, Strandudden has a Viking-age burial site. Not
      officially excavated yet, but Saga found grave goods,
      runestones, ship rivets. Incredible stuff. She documented
      everything — illustrated it beautifully, mapped the site.

      Her documentation was the only thing stopping the port
      construction permit. Two weeks later she's gone.
    effects: { trust_signe: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nils (the coast, witness tease) ---

  nils_intro:
    type: tweet
    from: nils
    text: >
      trettifem år jag fiskat här. strandudden är heligt. vikingarna
      vilar där. @saga_lindqvist visste det. nu är hon borta.
      dra era jävla slutsatser.
    effects: { trust_nils: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Nils -> nils_talk

  nils_talk:
    type: message
    text: >
      NILS: I've fished this coast since I was sixteen. I know every
      rock, every current around Gotland. And I'm telling you —
      Strandudden is sacred ground. The fishermen have always known
      there were graves there. We leave the headland alone.

      Saga was the first person to properly document it. She spent
      months drawing every stone, every artifact. She built a case
      that would stop NordCruise dead in their tracks. She had
      county board approval pending for full protection status.

      And then poof — gone.

      You think that's a coincidence? Fan, I don't believe in
      coincidences on this island.
    effects: { trust_nils: "+10" }
    choices:
      - Did you see anything unusual recently? -> nils_night
      - Move on -> quest1_hub

  nils_night:
    type: message
    text: >
      NILS: The night before she vanished — I was coming back from
      night fishing, around midnight. I saw lights at the dig site
      office. Not unusual, archaeologists work late. But there was a
      black SUV in the car park. Not a local car. Stockholm plates.

      At midnight. At the archaeological field office.

      I noted it in my fishing log. Nobody's asked to see it.
    effects: { trust_nils: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tuva (teen climber, witness tease) ---

  tuva_intro:
    type: tweet
    from: tuva
    text: >
      asså jag e fett ledsen typ @saga_lindqvist hon lärde mig allt
      om gotlands historia. det e inte möjligt att hon bara stack.
      om nån vet nåt snälla skriv
    effects: { trust_tuva: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tuva -> tuva_talk_early

  tuva_talk_early:
    type: message
    text: >
      TUVA: asså du e ny här? fett dålig timing typ. saga e
      bokstavligen den bästa personen i hela byn. hon visade oss
      vikingagrejerna, lärde oss om runstenarna. fett coolt.

      och nu e jag typ livrädd för oskar han såg nåt skumt nere
      vid hamnen men han vill inte snacka om det. han säger att
      det e inget men asså... det e inte inget fan
    effects: { trust_tuva: "+10" }
    choices:
      - What did Oskar see? -> tuva_oskar_hint
      - Move on -> quest1_hub

  tuva_oskar_hint:
    type: message
    text: >
      TUVA: typ jag vet inte exakt. han var nere vid hamnen på
      kvällen och han såg nån som typ gick igenom sagas grejer i
      fältkontoret?? eller nåt. han flippar ur han vill inte
      snacka om det. du måste fråga honom direkt men han e
      misstänksam mot folk han inte känner. snacka om skejt
      med honom först typ haha
    effects: { trust_tuva: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Visby Strand. A Gotland island
      village built around the sea and its Viking heritage. An
      archaeological illustrator who was blocking a corporate port
      project. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Wilma (Saga's best friend) -> wilma_q1
      - Talk to Edvin (Saga's colleague) -> edvin_q1
      - Check what Arvid (Saga's brother) is saying -> arvid_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Wilma Q1 ---

  wilma_q1:
    type: tweet
    from: wilma
    text: >
      om nån har hört nåt från @saga_lindqvist ring mig snälla.
      hennes rum e orört. hennes ritgrejer e kvar. hon hade aldrig
      lämnat utan sina pennor.
    effects: { trust_wilma: "+5", contacts_followed: "+1" }
    choices:
      - DM Wilma -> wilma_q1_talk

  wilma_q1_talk:
    type: message
    text: >
      WILMA: I appreciate you reaching out but I don't know you.
      Saga has a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Wilma is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_wilma: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Edvin Q1 ---

  edvin_q1:
    type: tweet
    from: edvin
    text: >
      Fältkontoret är tomt utan @saga_lindqvist. Hennes
      illustrationer ligger kvar på ritbordet. Hennes fältdagbok
      är öppen. Hon lämnar aldrig pågående dokumentation. Något
      har hänt.
    effects: { trust_edvin: "+5", contacts_followed: "+1" }
    choices:
      - DM Edvin -> edvin_q1_talk

  edvin_q1_talk:
    type: message
    text: >
      EDVIN: Saga and I have worked together for over a year.
      She's the most dedicated illustrator I know. This
      documentation project — mapping the Viking burial site —
      it was everything to her. She had drawings, measurements,
      soil analysis, artefact photos. She was so close to getting
      full protection status for Strandudden.

      I offered to help her. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to support her.

      [Edvin seems earnest. Or obsessive?]
    effects: { trust_edvin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Arvid Q1 ---

  arvid_q1:
    type: tweet
    from: arvid
    text: >
      min syster har FÖRSVUNNIT och polisen säger att hon kanske
      åkte till fastlandet??? HON ÅKER INTE UTAN ATT SÄGA TILL.
      jag kommer från visby. nån ska fan förklara.
    effects: { trust_arvid: "+5", contacts_followed: "+1" }
    choices:
      - DM Arvid -> arvid_q1_talk

  arvid_q1_talk:
    type: message
    text: >
      ARVID: Who the hell are you? Another person from this village
      who's going to tell me to calm down? My sister called me the
      night before she disappeared. She said she had something big.
      She said "if anything happens, look at NordCruise." Then she
      hung up.

      That's the last I heard from her. Fan.
    effects: { trust_arvid: "+10" }
    choices:
      - What do you think happened? -> arvid_theory
      - Move on -> quest1_hub

  arvid_theory:
    type: message
    text: >
      ARVID: I think she found proof that NordCruise bribed the
      kommunalråd to push the port through and they shut her up.
      But I also think that creepy colleague of hers — Edvin —
      knows more than he's saying. The way he talks about her...
      it's not just professional concern. It's something else.
      Jävlar.

      Saga told me months ago that someone at the dig site was
      going through her field notes. She thought it was nothing.
      I don't think it was nothing.
    effects: { trust_arvid: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Saga went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Oskar (was skateboarding near the harbour) -> oskar_interview
      - Find Magnus (harbour master, works late) -> magnus_interview
      - Find Lova (ceramicist, early morning at the workshop) -> lova_interview
      - Find Karl (baker, starts at 4:30am, saw something) -> karl_interview

  # --- Oskar (saw someone at the field office) ---

  oskar_interview:
    type: tweet
    from: oskar
    text: >
      bra session ikväll men stämningen vid hamnen e skum asså.
      typ nåt e fel. vet inte hur jag ska förklara
    effects: { trust_oskar: "+5" }
    choices:
      - Ask Oskar about that evening -> oskar_talk

  oskar_talk:
    type: message
    text: >
      OSKAR: asså ok men du säger inget till nån va. jag var vid
      hamnen typ 19 och skejta. och jag såg snubben från utgrävningen
      — edvin — vid sagas fältkontor. han typ gick igenom hennes
      lådor. hennes ritningar och skit. när han såg mig stack han
      fett snabbt.

      typ jag sa inget för jag ville inte ha drama men nu e det
      fett skumt. inte normalt beteende asså för helvete
    effects:
      trust_oskar: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Magnus (harbour master, saw late-night meeting) ---

  magnus_interview:
    type: tweet
    from: magnus
    text: >
      Påminnelse: hamnområdet är stängt mellan 22 och 06.
      Obehöriga fordon har noterats de senaste nätterna.
    effects: { trust_magnus: "+5" }
    choices:
      - Ask Magnus what he saw -> magnus_talk

  magnus_talk:
    type: message
    text: >
      MAGNUS: I was closing the harbour office around 22:30. I saw
      Saga's bicycle still at the dig site. And a black SUV —
      Stockholm plates — parked next to the field office. Two men
      in suits were standing by the entrance. One of them I
      recognised: Viktor Lund, NordCruise's project director.

      At 22:30. At an archaeological field office. That is not
      normal.

      I noted it in my harbour log. Nobody has asked to see it.
    effects:
      trust_magnus: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Lova (saw Saga fleeing) ---

  lova_interview:
    type: tweet
    from: lova
    text: >
      uppe klockan 4 för att elda ugnen. stranden var inte tom i
      morse. nån sprang på stigen mot klipporna. i mörkret. inte
      en jogger.
    effects: { trust_lova: "+5" }
    choices:
      - Ask Lova what she saw -> lova_talk

  lova_talk:
    type: message
    text: >
      LOVA: I get up at 4am to fire the kiln. That morning — the
      morning after Saga's last post — I saw someone on the coastal
      path. Running. A woman, carrying a bag, heading toward
      Strandudden. It was still dark. She was moving fast, like
      she was frightened.

      I called out but she didn't stop. I figured it was someone
      out early but... who runs at 4am with a messenger bag full
      of drawing tubes?

      When I heard about Saga, I put it together. I think that was
      her. Running from something.
    effects:
      trust_lova: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Karl (saw car chase) ---

  karl_interview:
    type: tweet
    from: karl
    text: >
      Bakade som vanligt klockan halv fem. Men den morgonen körde
      en bil alldeles för fort på kustvägen.
    effects: { trust_karl: "+5" }
    choices:
      - Ask Karl what he saw -> karl_talk

  karl_talk:
    type: message
    text: >
      KARL: I start baking at 4:30 every day. That morning I was
