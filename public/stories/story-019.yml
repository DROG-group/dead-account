      Inga Liepa, finally in possession of Elīna's full evidence
      package, publishes the AgroBaltic story on Latvijas Televīzija.
      The Valsts vides dienests orders an unannounced inspection.
      AgroBaltic's factory is shut down pending environmental
      remediation. Pēteris Vanags faces criminal charges for
      falsifying waste disposal reports. Raimonds Liepiņš resigns
      when his brother's role at AgroBaltic becomes public.

      And Elīna Bērziņa, reading the story from a friend's farmhouse
      in Vidzeme, calls her brother for the first time in nine days.

      "Es braucu mājās."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: elina
    text: >
      bites nepieviļ. un dzintarkrastas cilvēki arī ne.
      paldies ka nepadevāties.
    choices:
      - The End -> game_complete

  # --- ENDING B: Pēteris (Partial Ending) ---

  confront_peteris:
    type: message
    text: >
      You present the pollution evidence to Pēteris Vanags:

      "I have soil samples showing neonicotinoid levels ten times
      the EU maximum. I have your technician's original reports
      showing the data was falsified. I have photographs of your
      barrels in the stream. I have the trail camera footage."
    choices:
      - Send -> peteris_response

  peteris_response:
    type: message
    text: >
      PĒTERIS: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. AgroBaltic has always operated within
      regulatory requirements.

      But it's too late. You've sent the evidence to Inga, to the
      Dabas Sargi, and to the Valsts vides dienests.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. AgroBaltic is ordered to halt
      production pending investigation. The factory may close.
      A hundred and fifty jobs hang in the balance. The village
      is divided.

      But Elīna?

      Without the jealousy evidence, Jānis is never investigated
      for the harassment, the threats, the poisoned hives. He
      continues to farm next to Elīna's meadows. He watches her
      property. He creates a new anonymous account.

      Three months later, Elīna reads about AgroBaltic online.
      She returns quietly. She rebuilds her colonies. She installs
      cameras on every hive. She checks the meadow every morning
      before dawn, looking for tire tracks.

      The corporation is exposed. But the man who terrorised Elīna
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: elina
    text: "esmu mājās. bites atgriežas. pārējais... redzēsim."
    choices:
      - The End -> game_complete

  # --- ENDING C: Raimonds (Wrong Ending) ---

  confront_raimonds:
    type: message
    text: >
      You confront pagasta vadītājs Raimonds Liepiņš with your evidence.

      Within the hour, you receive a message from his office:
    choices:
