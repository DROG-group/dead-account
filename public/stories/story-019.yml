entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN DZINTARKRASTS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to dzintarkrasts.social — the community Mastodon instance for
      the Baltic coast village of Dzintarkrasts, Latvia.

      The local feed feels wrong today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @elina_berzina.

      A young beekeeper. Honey producer. She documented her bees and the
      wildflower meadows along the coast. People are worried. She hasn't
      posted in six days.
    choices:
      - Look at her profile -> elina_profile

  elina_profile:
    type: tweet
    from: elina
    text: "manas bites mirst. kaut kas ir ūdenī, augsnē. AgroBaltic pesticīdi nonāk manās pļavās. man ir pierādījumi."
    choices:
      - That's her last real post... -> grey_field

  grey_field:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a grey, blurred photo of an empty field. Posted at 2am. No caption.

      Her friends say that's not her style. Elīna always wrote long
      captions about her bees, the flowers, the seasons. The police say
      she probably went to visit relatives. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: policija
    text: >
      Saņemts ziņojums par Dzintarkrastas iedzīvotāju. Šobrīd nav
      pamata uzskatīt, ka noticis noziedzīgs nodarījums. Informāciju
      lūdzam sniegt pa tālruni 110 vai iecirknī.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @liga_kalnina is
      desperate. Her brother @arturs_berzins is driving down from Riga.
      The biology teacher @marta_ozolina says Elīna was right about the
      pesticides. The fisherman @andris_kalejs says the water has changed.

      And the journalist @inga_liepa is strangely silent.

      Nobody buys the police line. Nobody thinks Elīna just
      "went to visit relatives."
    effects: { trust_liga: "+5", trust_arturs: "+5" }
    choices:
      - Start following Elīna's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Dzintarkrasts. Follow Elīna's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Zane (cafe owner, knows everyone) -> zane_intro
      - Talk to Andris (fisherman, noticed the water) -> andris_intro
      - Talk to Sandis (teen skater, seems shaken) -> sandis_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Elīna with the rhythms of a small
      coastal village: tide warnings, the bakery's daily bread,
      weather updates, mushroom foraging tips.

      Key names surface: Līga (best friend, vet), Marta (biology
      teacher, alarmed), Inga (journalist, oddly quiet), and the
      teens — Sandis, Edgars, Laima — who loved visiting Elīna's
      beehives.

      Also prominent: AgroBaltic SIA, the agrochemical plant outside
      town. Their posts are corporate PR. Elīna's posts were the
      opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Zane -> zane_intro
      - Talk to Andris -> andris_intro
      - Talk to Sandis -> sandis_intro

  # --- Zane (social map) ---

  zane_intro:
    type: tweet
    from: zane
    text: >
      Kafejnīca ir atvērta, bet sirds nav vietā. @elina_berzina, tavs
      medus tējas galdiņš gaida. Atgriezies.
    effects: { trust_zane: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Zane -> zane_talk

  zane_talk:
    type: message
    text: >
      ZANE: Čau, tu esi jaunais? Laipni lūgti. Slikts laiks ierasties.
      Visi ir nervozi par Elīnu.

      Let me tell you who's who. Līga is Elīna's best friend — vet now.
      Marta Ozoliņa is the biology teacher, helped Elīna test soil samples.
      Artūrs is Elīna's brother, driving down from Riga.

      And Jānis Ozols — farmer next door. Jealous of Elīna's honey
      business for years. She got into the Riga farmers' markets and his
      rapeseed oil got pushed aside. Complained about her bees constantly.

      Oh, and Inga Liepa — the journalist — she and Elīna were working
      on something about the pesticides. Inga hasn't said a word since
      Elīna vanished. Not like her.
    effects: { trust_zane: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Jānis -> zane_janis
      - Ask about AgroBaltic -> zane_agrobaltic
      - Thank her and move on -> quest1_hub

  zane_janis:
    type: message
    text: >
      ZANE: Jānis? Sūds, where do I start. He's farmed that land
      twenty years. When Elīna's grandmother left her the meadows,
      Jānis lost it. Said those fields should be his.

      He filed complaints about the bees — said they were aggressive.
      Total bullshit. Elīna's bees were gentle. She bred them that way.

      Last month he was screaming at her outside the post office
      about how she was "destroying his livelihood" by reporting him.
      He sprays like crazy — whatever AgroBaltic sells him.
      Elīna said his spraying was killing her colonies.
    effects: { trust_zane: "+5" }
    choices:
      - Ask about AgroBaltic -> zane_agrobaltic
      - Move on -> quest1_hub

  zane_agrobaltic:
    type: message
    text: >
      ZANE: That factory has been outside town since the nineties.
      Pesticides, herbicides, fertilizers. Half the farmers use their
      products. Town tolerated them because — jobs.

      But Elīna's bees started dying. Colony collapse. She tested the
      soil, water, pollen. Found AgroBaltic chemicals way over legal
      limits. Said they were dumping waste, not just selling products.

      Two weeks after she went public, she's gone. Bļe, you don't
      need to be a detective.
    effects: { trust_zane: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Andris (fisherman, water observations) ---

  andris_intro:
    type: tweet
    from: andris
    text: >
      divdesmit gadus es zvejoju šeit. ūdens vairs nav tāds pats.
      @elina_berzina bija taisnība. un tagad viņa ir pazudusi.
      savelciet kopā.
    effects: { trust_andris: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Andris -> andris_talk

  andris_talk:
    type: message
    text: >
      ANDRIS: I've fished this coast since I was a kid. The streams
      that feed the bay come through AgroBaltic's land. Last spring
      the water started smelling chemical. My nets — dead fish.
      Not rotten. Freshly dead. Poisoned.

      Elīna connected it. Pesticide runoff killing streams, killing
      bees, killing the whole ecosystem. She was mapping it all.
      Building a case. And then — pazūd. Gone.

      You think that's a coincidence? Ellē, I don't believe in
      coincidences.
    effects: { trust_andris: "+10" }
    choices:
      - Did you see anything unusual recently? -> andris_night
      - Move on -> quest1_hub

  andris_night:
    type: message
    text: >
      ANDRIS: Night before she disappeared — driving back from night
      fishing around midnight. Passed Elīna's meadow. Lights. Not
      cabin lights — car headlights. Two vehicles. One near the
      hives, one on the road. At midnight. In a bee meadow.

      Next morning Elīna's bees were agitated. Gatis the forest
      ranger found fresh tire tracks through the meadow grass.
    effects: { trust_andris: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sandis (teen skater, witness tease) ---

  sandis_intro:
    type: tweet
    from: sandis
    text: >
      čau es esmu pilnīgā šokā @elina_berzina viņa mums mācīja par
      bitēm un dabu un forši bija un tagad viņa ir prom. ja kāds ko
      zina plīz sakiet
    effects: { trust_sandis: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sandis -> sandis_talk_early

  sandis_talk_early:
    type: message
    text: >
      SANDIS: bļe tu esi jaunais? sūds kāds laiks lai atnāktu. forši
      ka tev rūp tho. elīna ir literally labākais cilvēks šajā ciemā.
      viņa mums ļāva nākt pie stropiem un mācīja kā bites strādā.
      tā bija pists interesanti.

      un tagad es esmu noflipojis jo edgars redzēja kaut ko dīvainu
      pie elīnas pļavas bet viņš negrib runāt. viņš saka ka tas ir
      nekas bet bļe tas NAV nekas
    effects: { trust_sandis: "+10" }
    choices:
      - What did Edgars see? -> sandis_edgars_hint
      - Move on -> quest1_hub

  sandis_edgars_hint:
    type: message
    text: >
      SANDIS: bļe nezinu tieši. viņš braukāja ar bmx pa ceļu gar
      pļavu un redzēja kaut ko — kādu cilvēku kas kaut ko lēja?
      vai meta? viņš flipoja un aizbrauca. negrib runāt jo viņš
      domā ka neviens neticēs pusaudzim pret pieaugušu.

      pamēģini parunāt ar viņu bet viņš ir piesardzīgs ar
      svešiniekiem. sāc ar bmx tēmu lol tad viņš atvērsies
    effects: { trust_sandis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Dzintarkrasts. A quiet Baltic coast
      village built around the sea and the forest. A young beekeeper
      exposing pesticide contamination. A disappearance nobody believes
      is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Līga (Elīna's best friend) -> liga_q1
      - Talk to Marta (biology teacher, helped with samples) -> marta_q1
      - Check what Artūrs (Elīna's brother) is saying -> arturs_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Līga Q1 ---

  liga_q1:
    type: tweet
    from: liga
    text: >
      ja kādam ir ziņas par @elina_berzina lūdzu zvaniet man. viņas
      biškopības aprīkojums ir vietā. viņas dienasgrāmata ir uz galda.
      viņa nekad neaizietu bez sava biškopja tērpa.
    effects: { trust_liga: "+5", contacts_followed: "+1" }
    choices:
      - DM Līga -> liga_q1_talk

  liga_q1_talk:
    type: message
    text: >
      LĪGA: I appreciate it but I don't know you. Elīna has a lot of
      friends here. I'm sure she'll come back.

      ...I keep telling myself that. I don't believe it anymore.

      [Līga is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_liga: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marta Q1 ---

  marta_q1:
    type: tweet
    from: marta
    text: >
      @elina_berzina augsnes paraugi ir joprojām manā laboratorijā.
      Viņa nekad nepamestu savu pētniecību. Kaut kas ir noticis.
    effects: { trust_marta: "+5", contacts_followed: "+1" }
    choices:
      - DM Marta -> marta_q1_talk

  marta_q1_talk:
    type: message
    text: >
      MARTA: Elīna and I worked together for eight months. She brought
      me soil and water samples from her meadows. I tested them in the
      school lab — it's basic equipment but sufficient.

      The results were alarming. Neonicotinoid levels far above the
      EU maximum. And something else — industrial solvents that
      shouldn't be in agricultural soil at all. That's not spray
      drift. That's dumping.

      She was building a report. She was so close to sending it to
      the Valsts vides dienests. Then she vanished.

      [Marta seems genuinely concerned. And scientifically precise.]
    effects: { trust_marta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Artūrs Q1 ---

  arturs_q1:
    type: tweet
    from: arturs
    text: >
      mana māsa ir PAZUDUSI un policija man saka ka viņa droši vien
      ir aizbraukusi ciemos??? VIŅA NEAIZBRAUC NEBRĪDINOT. es braucu
      no rīgas. kāds man paskaidros kas notiek.
    effects: { trust_arturs: "+5", contacts_followed: "+1" }
    choices:
      - DM Artūrs -> arturs_q1_talk

  arturs_q1_talk:
    type: message
    text: >
      ARTŪRS: Who the fuck are you? Another person from that village
      who's going to tell me to calm down? My sister called me the
      night before she disappeared. She said she had something big.
      She said "if anything happens, look at AgroBaltic. And look at
      Jānis."

      Then she hung up. That's the last I heard from her.
    effects: { trust_arturs: "+10" }
    choices:
      - What do you think happened? -> arturs_theory
      - Move on -> quest1_hub

  arturs_theory:
    type: message
    text: >
      ARTŪRS: Two things. Either AgroBaltic found out she had proof
      of illegal dumping and shut her up. Or that piece of shit
      neighbour Jānis finally lost it. He's been threatening her for
      months. Everyone in the village knows.

      Sūds, maybe it's both. Jānis uses AgroBaltic products. He's
      their best customer. Maybe he didn't want Elīna exposing
      what's in those products because it would expose what he's
      been spraying on his land too.

      She told me he poisoned one of her hives last autumn. Poured
      something in the entrance at night. Fifty thousand bees dead
      by morning. She couldn't prove it was him.
    effects: { trust_arturs: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Elīna went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Edgars (was cycling near the meadow) -> edgars_interview
      - Find Gatis (forest ranger, patrols at dawn) -> gatis_interview
      - Find Dace (baker, starts at 4am, heard something) -> dace_interview
      - Find Andris (fisherman, saw cars at midnight) -> andris_interview_q2

  # --- Edgars (saw someone dumping near hives) ---

  edgars_interview:
    type: tweet
    from: edgars
    text: >
      laba sesija šodien bet atmosfēra ciemā ir dīvaina. kaut kas nav
      ok. nezinu kā paskaidrot
    effects: { trust_edgars: "+5" }
    choices:
      - Ask Edgars about that evening -> edgars_talk

  edgars_talk:
    type: message
    text: >
      EDGARS: bļe ok bet tu nevienam nesaki jā? es braucu ar bmx pa
      lauku ceļu gar elīnas pļavu ap 20:00. un es redzēju jāni —
      zemnieku no blakus — pie viņas stropiem. viņam bija kaut kāds
      kanniņš rokā. viņš kaut ko lēja uz stropiem.

      bļe viņš mani pamanīja un sāka skriet man pakaļ. es aizbraucu
      tik ātri cik varēju. viņš kliedza ka ja es kādam pateikšu
      viņš man dirsā iedos.

      pists es neesmu par to runājis jo viņš ir liels vīrs un es
      esmu tikai 17 un kas man ticēs
    effects:
      trust_edgars: "+10"
      night_witnesses: "+1"
      jealousy_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Gatis (forest ranger, found evidence at dawn) ---

  gatis_interview:
    type: tweet
    from: gatis
    text: >
      Rīta patrulēšanā konstatēti svaigi riepu nospiedumi meža ceļā
      pie Bērziņu pļavas. Neatļauta braukšana pa meža ceļiem. Lūdzu
      ziņot par neparastu transporta kustību.
    effects: { trust_gatis: "+5" }
    choices:
      - Ask Gatis what he found -> gatis_talk

  gatis_talk:
    type: message
    text: >
      GATIS: I patrol the forest roads every morning at 5am. That
      morning I found fresh tire tracks on the forest road behind
      her meadow. Two vehicles. Tracks went through the meadow gate
      to the stream.

      Empty chemical containers near the stream. AgroBaltic batch
      numbers. Someone was dumping waste directly into the stream.
      Not spray drift. Deliberate.

