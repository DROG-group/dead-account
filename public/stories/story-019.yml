  raimonds_response:
    type: tweet
    from: agita
    text: >
      Mans klients pieņem zināšanai Jūsu apgalvojumus. Jebkāda
      publisku apmelojošu materiālu izplatīšana radīs tūlītējas
      tiesvedības sekas. — Kalēja & Partneri, Rīga
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The pagasta vadītājs' lawyer buries your accusation. Without
      a direct link between Raimonds and the dumping — and there
      isn't one beyond political negligence — your evidence is
      insufficient.

      AgroBaltic continues to operate. Jānis continues to farm.
      Elīna stays in hiding.

      Six months later, another beekeeper in the next parish reports
      colony collapse. The stream still runs dirty. @aivars_meza
      creates a new account. It follows Elīna's brother.
    choices:
      - The End -> game_complete

