      could be two hundred thousand.

      Yiannis Markides isn't just a collector. He's a dealer. He buys
      here and sells abroad. The pieces that "disappeared" from other
      families? I've seen photos of them in a London gallery catalogue.
      Sold through Markides Fine Textiles Ltd. His company.
    effects:
      trust_chrysanthi: "+10"
      collector_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to collector thread -> stalker_hub

  # --- Police ---

  police_interview:
    type: message
    text: >
      POLICE OFFICER: Off the record — and I mean completely off the
      record — I wanted to investigate TroodoStone. My superior told me
      to leave it. He said the district office had "jurisdiction." That's
      code for "the koinotarchis said don't touch it."

      The Markides situation is different. I didn't even know the full
      extent until now. If you have evidence of theft and harassment,
      I can act on that. That's clearly my jurisdiction.

      Bring me something solid and I'll reopen the case.
    effects:
      trust_lefkara_astynomia: "+15"
      evidence_total: "+1"
    choices:
      - Back to collector thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Andreas than anyone in Lefkara Heights. Who is responsible?
    choices:
      - Confront Yiannis Markides (the obsessive collector) -> confront_yiannis
        when:
          state: collector_evidence
          gte: 5
      - Confront Andros Papamichael (the quarry director) -> confront_andros
        when:
          state: quarry_evidence
          gte: 3
      - Confront Koinotarchis Kyriakos (political protection) -> confront_kyriakos
      - I need more evidence -> investigation_hub

  # --- ENDING A: Yiannis (Best Ending) ---

  confront_yiannis:
    type: message
    text: >
      You present your evidence to Yiannis:

      "I know @LaceLover_CY is your account. I know you planted hidden
      cameras near the workshop. I know you stole lace pieces — Marios
      saw you that night. I know you've been selling stolen heirlooms
      through your London gallery. I have witnesses and I have the
      auction records that don't check out."
    choices:
      - Send -> yiannis_response

  yiannis_response:
    type: message
    text: >
      Yiannis doesn't reply for a long time. Then:

      YIANNIS: You don't understand. I was preserving the art. Andreas
      was keeping these masterpieces in a damp workshop where they'd
      rot. I could give them climate-controlled cases, museum-grade
      protection. Everything I did was because I love the craft.

      That's not love. That's obsession. And theft.

      You've already sent the evidence to the police. And to Petros
      Makrides at Phileleftheros.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE COLLECTOR

      Three things happen in quick succession.

      The police reopen the case. With your evidence — the anonymous
      account, the hidden cameras, the theft witnesses, the fake
      auction records — Yiannis Markides is arrested for theft,
      harassment, and trafficking in stolen cultural property. Hidden
      cameras are recovered from outside Andreas's workshop. Seven
      stolen lace pieces are seized from his Limassol villa.

      Petros Makrides, finally in possession of Andreas's full
      evidence package, publishes the TroodoStone story in
      Phileleftheros. The district authority orders an immediate
      halt to blasting. The quarry is shut down pending environmental
      review. Andros Papamichael faces criminal charges for illegal
      expansion and intimidation.

      And Andreas Christou, reading the story from a cousin's house
      in Paphos, calls his sister for the first time in nine days.

      "Γυρνώ σπίτι."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: andreas
    text: >
      η δαντέλα εν πεθαίνει. τζιαι οι Λευκαρίτες εν τα παρατούν.
      ευχαριστώ που εν τα παρατήσετε τζιαι σεις.
    choices:
      - The End -> game_complete

  # --- ENDING B: Andros (Partial Ending) ---

  confront_andros:
    type: message
    text: >
      You present the quarry evidence to Andros Papamichael:

      "I have drone footage of the illegal expansion — seven hectares
      beyond your permit. I have vibration readings that exceed legal
      limits. I have documentation of twelve damaged heritage buildings.
      I have witness testimony of your threats against Andreas Christou
      and his family."
    choices:
      - Send -> andros_response

  andros_response:
    type: message
    text: >
      ANDROS: This correspondence is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. TroodoStone has always operated within
      its permitted parameters.

      But it's too late. You've sent the evidence to Petros, to the
      Lace Preservation Association, and to the district planning
      authority.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE QUARRY

      The quarry story breaks. TroodoStone is ordered to halt all
      blasting pending investigation. The company may lose its licence.
      Forty jobs hang in the balance. The village is divided.

      But Andreas?

      Without the collector evidence, Yiannis is never investigated.
      He continues to visit the village. He continues to monitor the
      workshop. He creates a new anonymous account. He contacts other
      families with old lace.

      Three months later, Andreas reads about TroodoStone online.
      He returns quietly. He reinforces the workshop locks. He installs
      his own cameras. He checks his collection every morning.

      The quarry is stopped. But the man who terrorised Andreas and
      stole his family's heritage walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: andreas
    text: "γύρισα. η σκόνη σταμάτησε. τα υπόλοιπα... θα δούμε."
    choices:
      - The End -> game_complete

  # --- ENDING C: Koinotarchis (Wrong Ending) ---

  confront_kyriakos:
    type: message
    text: >
      You confront Koinotarchis Kyriakos with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> kyriakos_response

  kyriakos_response:
    type: tweet
    from: sofronis
    text: >
      Ο πελάτης μου λαμβάνει γνώση των ισχυρισμών σας. Οποιαδήποτε
      δημόσια διάδοση δυσφημιστικού υλικού θα αντιμετωπιστεί με
      άμεσες νομικές ενέργειες. — Γραφείο Καραγιάννη & Συνεργάτες,
      Λεμεσός
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The koinotarchis's lawyer buries your accusation. Without a
      direct link between Kyriakos and TroodoStone's illegal
      activities — and there isn't one beyond political protection —
      your evidence is insufficient.

      TroodoStone continues to blast. Yiannis Markides continues to
      collect. Andreas stays in hiding.

      Six months later, @LaceLover_CY creates a new account. It
      follows Andreas's mother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: LEFKARA HEIGHTS — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Quarry evidence: ${quarry_evidence}
      Collector evidence: ${collector_evidence}

      Thank you for playing. Andreas's story explores themes of
      cultural heritage theft, environmental destruction, obsessive
      collecting, community solidarity, and the courage to protect
      what matters.

      If you or someone you know is experiencing stalking or
