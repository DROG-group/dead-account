entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN LEFKARA HEIGHTS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to LefkaraHeights.social — the community Mastodon instance
      for the Troodos foothills village of Lefkara Heights, Cyprus.

      The local feed is unsettled today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @andreas_christou.

      A lace maker. Third generation. He documented the art of
      lefkaritiki — the legendary Lefkara lace, UNESCO-recognized. People
      are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> andreas_profile

  andreas_profile:
    type: tweet
    from: andreas
    text: "Η δαντέλα εν απλά κλωστή. Εν η ψυχή του τόπου. Τζιαι κάποιοι θέλουν να την αγοράσουν ολόκληρη. Έσιει πράματα που εν πωλούνται."
    choices:
      - That's his last real post... -> torn_lace

  torn_lace:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a piece of torn lace. Frayed edges, ruined by what looks like
      deliberate cuts. Posted at 2am. No caption.

      His friends say that's not his style. Andreas treated lace like
      sacred art. The police say he probably went to Limassol for work.
      Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: lefkara_astynomia
    text: >
      Λάβαμε αναφορά σχετικά με κάτοικο των Λευκάρων. Σε αυτό το
      στάδιο, δεν υπάρχουν στοιχεία που να υποδεικνύουν εγκληματική
      ενέργεια. Κάθε χρήσιμη πληροφορία μπορεί να κοινοποιηθεί
      στο 199 ή στον τοπικό σταθμό.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @eleni_christou is beside
      herself. His best friend @michalis_pavlou is going door to door.
      His mother @stavroula_andreou hasn't left the church. The
      silversmith @costas_georgiou says Andreas was scared of someone.

      And the journalist @petros_makrides is strangely silent.

      Nobody buys the police line. Nobody thinks Andreas just
      "went to Limassol for work."
    effects: { trust_eleni: "+5", trust_michalis: "+5" }
    choices:
      - Start following Andreas's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Lefkara Heights. Follow Andreas's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Marina (café owner, knows everyone) -> marina_intro
      - Talk to Loukas (farmer, knows the land) -> loukas_intro
      - Talk to Nikos (teen, seems shaken) -> nikos_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Andreas with the rhythms of a small
      mountain village: olive harvest schedules, the bakery's halloumi
      bread, weather warnings from the Troodos peaks.

      Key names surface: Eleni (sister, teacher), Michalis (best friend,
      worried sick), Petros (journalist, oddly quiet), and the teens —
      Nikos, Marios, Artemis — who admired Andreas's craft.

      Also prominent: TroodoStone Quarries Ltd, the extraction company
      at the edge of the valley. Their posts are corporate PR. Andreas's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Marina -> marina_intro
      - Talk to Loukas -> loukas_intro
      - Talk to Nikos -> nikos_intro

  # --- Marina (social map) ---

  marina_intro:
    type: tweet
    from: marina
    text: >
      Το καφενείο ανοιχτό αλλά η καρδιά μου κλειστή. @andreas_christou,
      η θέση σου σε περιμένει. Γύρνα πίσω ρε κούκλα μου.
    effects: { trust_marina: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Marina -> marina_talk

  marina_talk:
    type: message
    text: >
      MARINA: Ah, you're new? Welcome. Terrible time to arrive, my love.
      Everyone's tearing their hair out about Andreas.

      Let me tell you who's who. Eleni is his sister — teaches at the
      primary school. Sweet girl, destroyed right now. Michalis Pavlou
      is his best friend, a woodworker, strong as an ox and twice as
      stubborn. Stavroula is his mother, sixty-seven years old, hasn't
      stopped crying.

      And there's this man from Limassol — Yiannis Markides. Calls
      himself a collector. He's been coming to the village for months,
      trying to buy Andreas's antique lace pieces. The family heirlooms.
      Andreas told him to go to hell. The man wouldn't take no for an
      answer.

      Oh, and don't believe a word TroodoStone posts. They're blasting
      the hillside to dust and calling it "progress."
    effects: { trust_marina: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Yiannis -> marina_yiannis
      - Ask about TroodoStone -> marina_troodostone
      - Thank her and move on -> quest1_hub

  marina_yiannis:
    type: message
    text: >
      MARINA: Yiannis Markides. Rich man, Limassol money. He collects
      lefkaritiki lace — not just any lace, the old pieces. Pre-war
      patterns. Museum-quality. He's been buying from whoever sells,
      but Andreas had the best collection in the village. Pieces his
      grandmother made. His great-grandmother's wedding tablecloth.

      Andreas refused to sell. Told him "ρε κουμπάρε, this isn't a
      shop, it's a family." Yiannis kept coming back. Higher offers.
      Then... different tactics. He started showing up at Andreas's
      workshop uninvited. Photographing the pieces through the window.
      Sending messages at all hours.

      Andreas told me once, "This man doesn't want lace. He wants to
      own everything I am."
    effects: { trust_marina: "+5" }
    choices:
      - Ask about TroodoStone -> marina_troodostone
      - Move on -> quest1_hub

  marina_troodostone:
    type: message
    text: >
      MARINA: That quarry has been there since the 90s. They cut
      limestone for construction. The village tolerated them because
      they brought a few jobs. But the blasting has been getting worse.
      Cracks in the old stone houses. Dust covering everything. The
      vibrations shook a crack right through the wall of the lace museum.

      Andreas was the first person to actually stand up to them. He
      documented the damage, photographed the cracks, measured the
      dust. He was building a case to shut them down. Two weeks later
      he's gone.

      Γαμώ τα, you do the maths.
    effects: { trust_marina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Loukas (the land, witness tease) ---

  loukas_intro:
    type: tweet
    from: loukas
    text: >
      σαράντα χρόνια καλλιεργώ αυτή τη γη. τα αμύγδαλα σκεπάστηκαν
      σκόνη. @andreas_christou είχε δίκαιο. τζιαι τωρά εχάθηκεν.
      βκάλτε τα συμπεράσματά σας.
    effects: { trust_loukas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Loukas -> loukas_talk

  loukas_talk:
    type: message
    text: >
      LOUKAS: I've been farming these terraces since I was a boy.
      Olives and almonds, same as my father. And I'm telling you —
      the land is suffering. The quarry blasting shakes the roots.
      The dust coats the leaves. My yields are down thirty percent
      in three years.

      Andreas was documenting everything. He had a drone — took photos
      of the quarry expansion. They've been cutting beyond their
      permitted boundary. Into the hillside that feeds our water springs.
      He had maps, measurements, everything. He was building a legal case.

      Then poof — gone. You think that's a coincidence? Εν τωρά
      σοβαρά; I don't believe in coincidences in these mountains.
    effects: { trust_loukas: "+10" }
    choices:
      - Did you see anything unusual recently? -> loukas_night
      - Move on -> quest1_hub

  loukas_night:
    type: message
    text: >
      LOUKAS: The night before he vanished — I was up early checking
      the irrigation, around 4am. I saw lights on the road to the
      quarry. Not unusual at that hour, the trucks sometimes run early.
      But there were two vehicles. One was Andreas's old pickup. The
      other was a black SUV I didn't recognise. TroodoStone plates.

      At 4am. Heading toward the quarry.

      I noted it in my head. Nobody's asked me about it until now.
    effects: { trust_loukas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nikos (teen, witness tease) ---

  nikos_intro:
    type: tweet
    from: nikos
    text: >
      ρε κουμπάρε εν τωρά σοβαρά;; @andreas_christou ήταν ο μόνος
      μεγάλος που μας σεβόταν. εν γίνεται απλά να φύει έτσι. αν
      ξέρει κανένας κάτι πέτε ρε
    effects: { trust_nikos: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Nikos -> nikos_talk_early

  nikos_talk_early:
    type: message
    text: >
      NIKOS: ρε συ είσαι νέος εδώ; χαλαρά αλλά κακό timing σιόρ.
      ο Αντρέας ήταν γαμάτος τύπος. μας έδειχνε τη δαντέλα, μας
      εξηγούσε γιατί είναι σημαντική. εν ήταν σαν τους άλλους
      μεγάλους που λαλούν "φύετε ρε κοπέλια."

      τζιαι τωρά εν φοβισμένος γιατί ο Μάριος είδε κάτι περίεργο
      εκείνο το βράδυ κοντά στο εργαστήρι αλλά εν θέλει να μιλήσει.
      λαλεί ότι εν τίποτε αλλά σιόρ... εν τίποτε μαλακίες αυτά
    effects: { trust_nikos: "+10" }
    choices:
      - What did Marios see? -> nikos_marios_hint
      - Move on -> quest1_hub

  nikos_marios_hint:
    type: message
    text: >
      NIKOS: εν ξέρω ακριβώς. ήταν πάνω στο βουνό, gaming session
      στο κινητό πάνω σε κείνο το τοιχάκι που πιάνει σήμα. τζιαι
      είδε κάποιον που μπήκε μέσα στο εργαστήρι του Αντρέα τζιαι
      βγήκε με κάτι τυλιγμένο. ρε γαμώ τα.

      ο Μάριος φοβάται. πες του ότι παίζεις κάτι σε PC τζιαι θα
      σου μιλήσει ίσως lol
    effects: { trust_nikos: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Lefkara Heights. A Troodos foothills
      village built around lace and silver. A craftsman who was exposing
      quarry damage and refusing to sell family heirlooms. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Eleni (Andreas's sister) -> eleni_q1
      - Talk to Michalis (Andreas's best friend) -> michalis_q1
      - Check what Stavroula (Andreas's mother) is saying -> stavroula_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Eleni Q1 ---

  eleni_q1:
    type: tweet
    from: eleni
    text: >
      αν κάποιος έχει νέα του @andreas_christou τηλεφωνήστε μου σας
      παρακαλώ. το εργαστήρι του είναι ανοιχτό. τα εργαλεία του
      εκεί. εν θα έφευγε ποτέ χωρίς τα σταυροβελονιά του.
    effects: { trust_eleni: "+5", contacts_followed: "+1" }
    choices:
      - DM Eleni -> eleni_q1_talk

  eleni_q1_talk:
    type: message
    text: >
      ELENI: I appreciate you reaching out but I don't know you.
      Andreas has many friends here. I'm sure he'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Eleni is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_eleni: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Michalis Q1 ---

  michalis_q1:
    type: tweet
    from: michalis
    text: >
      ρε @andreas_christou που είσαι ρε φίλε; το εργαστήρι σου
      σκοτεινό. η μάνα σου κλαίει. τζιαι εσύ εν λαλείς τίποτε.
      γαμώ τα κάτι εν πάει καλά.
    effects: { trust_michalis: "+5", contacts_followed: "+1" }
    choices:
      - DM Michalis -> michalis_q1_talk

  michalis_q1_talk:
    type: message
    text: >
      MICHALIS: Who are you? Another person who's going to tell me
      he probably went to Limassol? My best friend called me the
      night before he disappeared. He said someone broke into his
      workshop and stole two antique lace pieces. Heirloom stuff,
      irreplaceable. He said "if anything happens, look at the
      collector from Limassol and the quarry people." Then he hung up.

      That's the last I heard from him.
    effects: { trust_michalis: "+10" }
    choices:
      - What do you think happened? -> michalis_theory
      - Move on -> quest1_hub

  michalis_theory:
    type: message
    text: >
      MICHALIS: Two things could have happened. Either that quarry
      company silenced him because he had proof they're destroying the
      hillside illegally. Or that psycho collector — Yiannis Markides —
      finally did something crazy to get his hands on the lace.

      Or both. Ρε κουμπάρε, maybe both.

      Andreas told me months ago that someone was following him. A car
      parked outside his workshop at night. Someone going through his
      Instagram looking at every photo of every lace piece he owned.
      He thought it was nothing. Εν ήταν τίποτε.
    effects: { trust_michalis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Stavroula Q1 ---

  stavroula_q1:
    type: tweet
    from: stavroula
    text: >
      Παναγία μου φύλαξε τον. Ο γιος μου ο Αντρέας. Τα χέρια του
      έκαμαν δαντέλα σαν τη γιαγιά του. Φέρτε τον πίσω. Σας
      παρακαλώ.
    effects: { trust_stavroula: "+5", contacts_followed: "+1" }
    choices:
      - DM Stavroula -> stavroula_q1_talk

  stavroula_q1_talk:
    type: message
    text: >
      STAVROULA: My boy... he kept his grandmother's lace pieces in
      a special chest. Wrapped in muslin. Temperature controlled. He
      treated them like holy relics. The wedding tablecloth from 1923.
      The altar cloth my mother made for the church.

      That man from Limassol offered fifty thousand euros for the
      tablecloth. Andreas laughed. "Γιαγιά would haunt me," he said.

      But two pieces went missing last month. The small doilies. Andreas
      was devastated. He knew who took them but couldn't prove it.
    effects: { trust_stavroula: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Andreas went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Marios (was on the hillside, saw the workshop) -> marios_interview
