  nina_interview:
    type: message
    text: >
      NINA: I run the diving section at the school. Nikola was my
      assistant instructor — amazing with the kids. Patient,
      careful, passionate.

      A few months ago, a new man showed up at the diving club.
      Said his name was Filip. Wanted to join. Nikola certified him.
      But something was off — Filip asked a lot of questions. About
      Nikola's schedule, his favorite dive sites, when he went
      alone.

      And then Filip started showing up at the same times as Nikola.
      Same sites. Always nearby. Nikola noticed. He told me: "That
      new guy is everywhere I go. It's starting to freak me out."

      After Nikola disappeared, Filip stopped coming to the club.
      He hasn't been seen since.
    effects:
      trust_nina: "+10"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to stalker thread -> stalker_hub

  # --- Ante watching ---

  ante_watching:
    type: message
    text: >
      ANTE: Sjeti se što sam ti rekao — Ivana viđa nekog novog.
      E sad — taj tip je dolazio u konobu. Naručivao kavu, sjedio
      satima. Uvijek za stolom s pogledom na rivu. Na Nikolin kombi.

      Jednom sam ga vidio kako fotka Nikolu — telefonom, iz konobe,
      kroz prozor. Kao da ga dokumentira.

      Pitao sam Ivanu: "Tko je taj lik?" Rekla je "Filip, upoznali
      smo se online." Ali kad sam pitao odakle je, što radi — ništa
      konkretno. "Iz Splita. Nešto s kompjuterima." Nitko u
      Kamenici ga ne poznaje osim Ivane.

      Tip je duh. Pojavio se niotkuda i sad je nestao zajedno s
      Nikolom.
    effects:
      trust_ante: "+10"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to stalker thread -> stalker_hub

  # --- Narednik Klarić ---

  narednik_interview:
    type: message
    text: >
      NAREDNIK KLARIĆ: Off the record — i mislim potpuno off the
      record — htio sam istražiti JadranRib. Moj nadređeni mi je
      rekao da odustanem. Rekao je da "Županija ima nadležnost."
      Što na policijskom znači "ne diraj."

      Ova stvar sa stalkerom — to je drugo. Za to nisam ni znao
      do sad. Ako imate dokaze o proganjanju, ja mogu djelovati.
      To je jasno moja nadležnost.

      Donesite mi nešto čvrsto i ponovno otvaram slučaj.
    effects:
      trust_narednik: "+15"
      evidence_total: "+1"
    choices:
      - Back to stalker thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Nikola than anyone in Kamenica. Who is responsible?
    choices:
      - Confront the stalker "Filip Novak" through Ivana -> confront_stalker
        when:
          state: stalker_evidence
          gte: 5
      - Confront Branko Vuković (JadranRib director) -> confront_branko
        when:
          state: trawling_evidence
          gte: 3
      - Confront Načelnik Babić (political protection) -> confront_zoran
      - I need more evidence -> investigation_hub

  # --- ENDING A: Stalker (Best Ending) ---

  confront_stalker:
    type: message
    text: >
      You present your evidence to Ivana and ask her to confront Filip:

      "The anonymous account @dubina_bez_dna is Filip. He joined
      the diving club to track Nikola. He followed Nikola's dive
      schedule. He was at the dock that night watching. He sent
      threatening messages to both of you. His identity is fake —
      the address he gave is a vacant lot. He's been stalking Nikola
      for months because of his obsession with you."
    choices:
      - Send -> stalker_response

  stalker_response:
    type: message
    text: >
      Ivana reads your message. Then writes back:

      IVANA: Jebote... imam mu broj. Zvala sam ga. Nije se javio.
      Onda sam mu poslala sve što si mi pokazao. Rekla sam mu da
      znam.

      Odgovorio je sat vremena kasnije. Jedan jedini message:
      "Sve sam radio za tebe. On ti nije trebao. Dubina ga je
      uzela."

      To nije ljubav. To je bolest.

      You've already sent everything to Narednik Klarić. And to
      Maja Krstić.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Narednik Klarić reopens the case. With your evidence — the
      anonymous account, the fake identity, the diving club records,
      the witness testimonies — "Filip Novak" is identified as Dino
      Babić, 28, from Kaštela. Previous conviction for stalking.
      Restraining order from a previous relationship. He is arrested
      at a rental apartment in Split.

      On his laptop: hundreds of photographs of Nikola and Ivana.
      GPS tracking logs. A burner phone with threatening messages.
      And something else — he had tipped off JadranRib about
      Nikola's dive that night, knowing they would confront him.
      He wanted Nikola to disappear.

      Maja Krstić, with Nikola's full evidence package, publishes
      the JadranRib story in Jutarnji List. The Županija orders
      an immediate investigation. The trawlers are impounded. Branko
      Vuković faces criminal charges for illegal fishing in a
      protected area and witness intimidation. Načelnik Babić
      resigns when his "donations" become public.

      And Nikola Jurić, reading the story from a friend's boat
      in Korčula, calls his sister for the first time in ten days.

      "Ana, dolazim kući."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: nikola
    text: >
      more ne laže. i ljudi kamenice ne lažu. hvala svima koji
      nisu odustali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Branko (Partial Ending) ---

  confront_branko:
    type: message
    text: >
      You present the trawling evidence to Branko Vuković:

      "I have underwater footage of your boats trawling in the
      marine protected area. I have AIS data showing your boats
      going dark every night. I have GPS logs from your own captain.
      I have physical evidence from the seabed with your serial
      numbers. I have soil core samples showing posidonia destruction
      consistent with bottom trawling."
    choices:
      - Send -> branko_response

  branko_response:
    type: message
    text: >
      BRANKO: Ovu komunikaciju prosljeđujem našem pravnom odjelu.
      Svako objavljivanje kleveta bit će predmet trenutnog sudskog
      postupka. JadranRib je uvijek poslovao u skladu s propisima.

      But it's too late. You've sent the evidence to Maja, to
      Plavi Horizont, and to the Županija.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The trawling story breaks. JadranRib's operations are
      suspended. The trawlers sit idle in the harbour. Eighty jobs
      in the balance. The village is divided — fishermen against
      company workers, families against families.

      But Nikola?

      Without the stalking evidence, "Filip" is never identified.
      He deletes his accounts and disappears. Three months later,
      a new anonymous account follows Ivana. Then a new one follows
      Ana.

      Nikola comes back eventually. He dives again. But he checks
      behind him constantly. He never dives alone. He changes his
      schedule every week.

      One night, he finds a note on his van: "Miss you."

      The trawling is stopped. The sea will recover. But the person
      who terrorised Nikola is still out there.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: nikola
    text: "vratio sam se. more se oporavlja. ostalo... vidjet ćemo."
    choices:
      - The End -> game_complete

  # --- ENDING C: Načelnik (Wrong Ending) ---

  confront_zoran:
    type: message
    text: >
      You confront Načelnik Babić with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> zoran_response

  zoran_response:
    type: tweet
    from: tena
    text: >
      Moj klijent prima na znanje Vaše navode. Svako javno
      objavljivanje kleveta bit će predmet trenutnog sudskog
      postupka. — Ured Grgić i partneri, Split
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The načelnik's lawyer buries your accusation. Without a direct
      link between Babić and JadranRib's illegal trawling — and
      there isn't one beyond political donations — your evidence
      is insufficient for a conviction.

      JadranRib continues to operate. The stalker continues to
      watch. Nikola stays in hiding.

      Six months later, the posidonia meadow in uvala Sv. Petra
      is gone. The fish are gone. The tourists stop coming.
      Kamenica becomes quieter.

      @dubina_bez_dna creates a new account. It follows Nikola's
      sister.
    choices:
      - The End -> game_complete

