entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN KAMENICA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to kamenica.social — the community Mastodon instance for
      the Dalmatian coastal village of Kamenica.

      The local feed is restless. The sea around this village is crystal
      clear and the locals are proud of it. But something is wrong.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name keeps appearing:
      @nikola_juric.

      A young freedive instructor. He taught tourists and locals to
      dive the Dalmatian coast. He documented the underwater world
      with cameras. People loved him. He hasn't posted in six days.
    choices:
      - Look at his profile -> nikola_profile

  nikola_profile:
    type: tweet
    from: nikola
    text: "koćarice u uvali sv. Petra. noćni ribolov. mrežama čupaju dno. imam dokaze. ovo se mora zaustaviti."
    choices:
      - That's his last real post... -> grey_sea

  grey_sea:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      murky grey water. No light, no fish, no coral. Shot from
      underwater at a strange angle. Posted at 3am. No caption.

      His friends say that's the opposite of Nikola's style — he only
      posted crystal-clear water, vibrant sea life, the beauty of the
      deep. The police say he probably went travelling. Something
      doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: narednik
    text: >
      Zaprimljena je prijava o nestanku stanovnika Kamenice. U ovom
      trenutku nema elemenata koji upućuju na kazneno djelo. Svaka
      korisna informacija može se dostaviti na broj 192 ili osobno
      na policijsku postaju.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @ana_juric is desperate.
      His best friend @marko_peric is furious. His ex-girlfriend
      @ivana_kovac is posting worried messages. The old fisherman
      @damir_matic says Nikola was right about the trawlers.

      And the journalist @maja_krstic has gone completely silent.

      Nobody buys the police line. Nobody thinks Nikola just "went
      travelling."
    effects: { trust_ana: "+5", trust_marko: "+5" }
    choices:
      - Start following Nikola's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Kamenica. Follow Nikola's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Ante (konoba owner, knows everyone) -> ante_intro
      - Talk to Damir (fisherman, saw the trawlers) -> damir_intro
      - Talk to Luka (teen diver, seems shaken) -> luka_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Nikola with the rhythms of a small
      Dalmatian village: ferry schedules, the konoba's daily catch,
      weather warnings for the Bura wind.

      Key names surface: Ana (sister, biology student in Split),
      Marko (best friend, fisherman), Ivana (ex-girlfriend, works
      at Konoba Morski Vuk), and the teens — Luka, Petra, Josip —
      who worshipped Nikola's diving.

      Also prominent: JadranRib d.o.o., the fishing company that
      operates trawlers out of the village. Their posts are slick
      corporate PR. Nikola's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Ante -> ante_intro
      - Talk to Damir -> damir_intro
      - Talk to Luka -> luka_intro

  # --- Ante (social map) ---

  ante_intro:
    type: tweet
    from: ante
    text: >
      Konoba je otvorena ali srce nije tu. @nikola_juric, tvoj stol
      te čeka. Vrati se doma.
    effects: { trust_ante: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ante -> ante_talk

  ante_talk:
    type: message
    text: >
      ANTE: Ah, novi si? Dobrodošao. Loše vrijeme za dolazak.
      Svi su nervozni zbog Nikole.

      Da ti objasnim tko je tko. Ana je sestra od Nikole — studira
      biologiju u Splitu, proludi od brige. Marko Perić je najbolji
      prijatelj, od djetinjstva, riba s njim svaki dan. Ivana Kovač
      je bivša — ostavila ga prije dva mjeseca ali još uvijek dolazi
      u konobu pitati za njega. Radi kod mene.

      I onda imaš tog nekog — pričam ti to jer nisam lik koji šuti.
      Ivana ima nekog novog, tip se zove... ma ne zna se točno. Ali
      Nikola mi je rekao da ga bivša muči. Da ga netko prati. Da mu
      netko šalje poruke. Nije htio reći više.

      I steer clear of JadranRib. Branko Vuković — the director —
      he eats here sometimes. He and the načelnik are like this.
      Nikola was making them both nervous.
    effects: { trust_ante: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Ivana's situation -> ante_ivana
      - Ask about JadranRib -> ante_jadranrib
      - Thank him and move on -> quest1_hub

  ante_ivana:
    type: message
    text: >
      ANTE: Ivana? Jebote, ta priča je komplicirana. Ona i Nikola
      su bili zajedno godinu i pol. Onda ga je ostavila. Nikola to
      nije dobro podnio ali se pokupio. Normalno, lik je OK.

      Ali onda — Ivana je počela viđati nekog. Ne znam točno koga.
      Ali Nikola mi je rekao nešto čudno. Rekao je: "Ante, neko me
      prati. Stalno je tu. Zna gdje sam. Ostavlja mi poruke."

      Mislio sam da pretjeruje. Sad mislim da je možda imao pravo.

      I Ivana — ona se čudno ponaša. Nervozna je. Izbjegava temu.
      Kao da nešto krije.
    effects: { trust_ante: "+5" }
    choices:
      - Ask about JadranRib -> ante_jadranrib
      - Move on -> quest1_hub

  ante_jadranrib:
    type: message
    text: >
      ANTE: JadranRib. Sranje od firme. Imaju tri koćarice i love
      svaku noć. Službeno, love daleko od obale, u skladu s dozvolama.
      Realnost? Ribari poput Damira godinama govore da koćarice dolaze
      u zabranjene zone noću. Čupaju dno. Uništavaju sve.

      Nikola je ronio tamo. Vidio je dno — mrtvo, počupano, prazan
      pustinja. Snimao je sve. Rekao je da ima dokaze da JadranRib
      lovi u zabranjenim vodama, u zaštićenom području.

      Dva tjedna nakon toga — nestao.
    effects: { trust_ante: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Damir (fisherman, saw the trawlers) ---

  damir_intro:
    type: tweet
    from: damir
    text: >
      trideset pet godina lovim u ovom moru. dno više nije isto.
      @nikola_juric je imao pravo. koćarice uništavaju sve.
      povežite stvari.
    effects: { trust_damir: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Damir -> damir_talk

  damir_talk:
    type: message
    text: >
      DAMIR: Lovim u ovom moru otkad sam bio dečko. Poznajem svaku
      struju, svaki greben, svaku ribu. I kažem ti — more u uvali
      Sv. Petra više nije isto. Mreže mi se vraćaju prazne. Dno je
      razrušeno. Posidonia — trava koja drži sve na okupu — iščupana.

      Nikola je ronio dolje. Snimao je sve. Koćarice JadranRiba
      dolaze noću, gase svjetla, love u zabranjenom pojasu. Nikola
      je imao snimke. Gradio je slučaj.

      I onda — puf. Nestao.

      Misliš da je slučajnost? Ja ne vjerujem u slučajnosti na moru.
    effects: { trust_damir: "+10" }
    choices:
      - Did you see anything unusual recently? -> damir_night
      - Move on -> quest1_hub

  damir_night:
    type: message
    text: >
      DAMIR: Noć prije nego je nestao — vraćao sam se s noćnog
      ribolova, oko 1 ujutro. Vidio sam svjetla u luci. Nikolin
      kombi bio je parkiran kod mola. I pored njega — crni SUV.
      Tablice JadranRib.

      U 1 ujutro. Na molu.

      I vidio sam nekoga na rivi. Sjedio je u autu, ugašenih svjetala.
      Čekao. Nije bio iz JadranRiba — to je bio netko drugi. Manji
      auto. Ali nisam mogao vidjeti tko.

      Nisam razmišljao o tome tada. Sad razmišljam stalno.
    effects: { trust_damir: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Luka (teen diver, witness tease) ---

  luka_intro:
    type: tweet
    from: luka
    text: >
      buraz jebote @nikola_juric ne nestaje ovak. on nas je naučio
      roniti, disati, poštovati more. fakat ako neko zna nešto
      recite jebemu mater
    effects: { trust_luka: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Luka -> luka_talk_early

  luka_talk_early:
    type: message
    text: >
      LUKA: ej lik novi si? sranje timing. uglavnom nikola je fakat
      legenda. naučio nas roniti, mene petru josipa, svih nas. tip
      je razlog zašto volim more.

      i sad sam u totalnoj panici jer petra je vidjela nešto čudno
      kod mol te večeri ali neće pričati. kaže da se boji. buraz
      fakat ne kužim kaj se događa
    effects: { trust_luka: "+10" }
    choices:
      - What did Petra see? -> luka_petra_hint
      - Move on -> quest1_hub

  luka_petra_hint:
    type: message
    text: >
      LUKA: fakat ne znam detalje. bila je na molu kasno, snimala
      nešto za instagram — podvodne snimke u zalazu sunca, tak nekaj.
      i kaže da je vidjela nekog kraj nikolinog kombija. nekog ko je
      stavio nešto u kombi ili uzeo nešto, nešto tak.

      kaže da je prepoznala osobu ali ne želi reći. fakat se boji.
      probaj pričati s njom ali polako, ono — nemoj je pritiskat.
      pričaj joj o ronjenju ili fotki, znaš
    effects: { trust_luka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Kamenica. A Dalmatian coastal village
      built around the sea and fishing. A freedive instructor who was
      exposing illegal trawling. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Ana (Nikola's sister) -> ana_q1
      - Talk to Marko (Nikola's best friend) -> marko_q1
      - Check what Ivana (Nikola's ex) is saying -> ivana_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Ana Q1 ---

  ana_q1:
    type: tweet
    from: ana
    text: >
      moj brat je NESTAO a policija mi kaže da je možda otišao na
      put??? NIKOLA NE IDE NIGDJE BEZ DA JAVI. dolazim iz splita.
      netko će mi objasniti.
    effects: { trust_ana: "+5", contacts_followed: "+1" }
    choices:
      - DM Ana -> ana_q1_talk

  ana_q1_talk:
    type: message
    text: >
      ANA: Tko si ti? Još jedan koji želi tračeve o mom bratu?
      Nikola me nazvao večer prije nego je nestao. Bio je uzbuđen.
      Rekao je da ima nešto veliko. Rekao je "ako mi se nešto dogodi,
      gledaj u JadranRib." Onda je prekinuo.

      To je zadnje što sam čula od njega.
    effects: { trust_ana: "+10" }
    choices:
      - What do you think happened? -> ana_theory
      - Move on -> quest1_hub

  ana_theory:
    type: message
    text: >
      ANA: Mislim da je Nikola našao dokaze da JadranRib ilegalno
      lovi u zaštićenom području i da su ga ušutkali. Ali ima i
      druga stvar.

      Jebote, on mi je rekao da ga neko prati. Mjesecima. Netko
      mu šalje poruke s anonimnog računa. Netko ga čeka ispred
      kuće. Netko zna njegov raspored ronjenja. Mislio je da je
      to u vezi s Ivanom — s bivšom.

      Ne znam što to znači. Ali me plaši.
    effects: { trust_ana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marko Q1 ---

  marko_q1:
    type: tweet
    from: marko
    text: >
      nikola ne odgovara. na ništa. buraz ja i on pričamo SVAKI DAN
      od kad smo mali. nešto se dogodilo. siguran sam.
    effects: { trust_marko: "+5", contacts_followed: "+1" }
    choices:
      - DM Marko -> marko_q1_talk

  marko_q1_talk:
    type: message
    text: >
      MARKO: Nikola i ja se poznajemo od vrtića. Ronimo zajedno,
      lovimo zajedno, sve zajedno. I kažem ti — on ne nestaje ovak.
      Nikad. Ni kad mu je bilo najgore nakon raskida s Ivanom.

      Zadnji put sam ga vidio na rivi. Bio je napet. Imao je
      kameru i laptop u ruksaku. Rekao je da ide snimiti nešto
      "veliko" u uvali Sv. Petra. Rekao sam "idem s tobom" a on
      je rekao ne, preopasno.

      Jebote, trebao sam ići za njim.

      [Marko izgleda iskreno. Slomljen.]
    effects: { trust_marko: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ivana Q1 ---

  ivana_q1:
    type: tweet
    from: ivana
    text: >
      znam da smo se razišli. znam da ne bi trebala ovako brinuti.
      ali @nikola_juric je dobra osoba i zaslužuje da ga netko traži.
      jebote.
    effects: { trust_ivana: "+5", contacts_followed: "+1" }
    choices:
      - DM Ivana -> ivana_q1_talk

  ivana_q1_talk:
    type: message
    text: >
      IVANA: Ja i Nikola smo se razišli prije dva mjeseca. Moji
      razlozi. Ali mu još uvijek želim sve najbolje. I ovo me
      ubija.

      Čudna stvar je da... nakon raskida, netko mi je počeo slati
      poruke. Anonimni račun. "Slobodna si." "On te nije zaslužio."
      "Netko bolji čeka." Mislila sam da je troll ali...

      I Nikola mi je rekao da i njemu dolaze poruke. Tip mu šalje
      poruke o ronjenju. "Jednog dana ćeš zaroniti preduboko."
      "Dubina je tiha. Tiša od tebe." Sranje je to. Gadno sranje.

      [Ivana je potresena. Nešto je muči osim nestanka.]
    effects: { trust_ivana: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Nikola went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Petra (was at the dock taking photos) -> petra_interview
      - Find Ivan (harbour master, works late) -> ivan_interview
      - Find Marina (baker, starts at 5am, saw something) -> marina_interview
      - Find Damir (fisherman, saw the boats that night) -> damir_interview_q2

  # --- Petra (saw someone at Nikola's van) ---

  petra_interview:
    type: tweet
    from: petra
    text: >
      fakat ne mogu spavati. vidjela sam nešto te noći i ne znam
      što da radim. bojim se. jebote sve.
    effects: { trust_petra: "+5" }
    choices:
      - Ask Petra about that evening -> petra_talk

  petra_talk:
    type: message
    text: >
      PETRA: ok ali fakat to ne smiješ nikome reći. bila sam na
      molu oko 20h, snimala podvodni zalazak za projekt. i vidjela
      sam nekog kod nikolinog kombija. lik je otvorio vrata i nešto
      stavio unutra. ili uzeo. nešto malo, tipa uređaj.

      i buraz — prepoznala sam ga. bio je to Karlo Mandić. onaj
      šef broda od JadranRiba. što on radi u nikolinom kombiju?

