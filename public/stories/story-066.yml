entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN HOEVE-AAN-ZEE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to HoeveAanZee.social — the community Mastodon instance
      for the coastal village of Hoeve-aan-Zee, Flanders.

      The local feed is dark today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @jules_vanderberghe.

      A mussel farmer. Third generation. He worked the beds his
      grandfather built. People are in shock. His body was found at
      dawn, washed up on the breakwater near his mussel farm.
    choices:
      - Look at his profile -> jules_profile

  jules_profile:
    type: tweet
    from: jules
    text: "Die bouwproject gaat onze mosselbanken vernietigen. NordKust Vastgoed liegt tegen het gemeentebestuur. Ik heb bewijzen."
    choices:
      - That's his last real post... -> grey_shore

  grey_shore:
    type: message
    text: >
      One day after that post, his account uploaded a single image:
      a grey shore, foggy, overexposed, shot from a strange angle.
      Posted at 3am. No caption.

      His wife Lies says that is not his style. Jules never posted
      without a caption. The police say he fell from the breakwater
      while checking his mussel lines at night. Something does not
      add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: commissaris
    text: >
      We informeren dat het overlijden van een inwoner van Hoeve-aan-Zee
      vermoedelijk het gevolg is van een ongeluk. Het onderzoek loopt.
      Alle nuttige informatie kan worden meegedeeld aan het
      politiekantoor. Tel: 101.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His wife @lies_vanderberghe is
      devastated. The food blogger @wout_claes is posting obsessively
      about Jules's mussels. His colleague @griet_peeters at the
      farm is asking hard questions.

      The old fisherman @bram_willems says Jules was right about the
      construction project. The teens are losing their minds. And the
      journalist @pieter_vermeersch has gone strangely silent.

      Nobody buys the police line. Nobody thinks Jules just "fell off
      the breakwater."
    effects: { trust_lies: "+5", trust_griet: "+5" }
    choices:
      - Start following Jules's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Hoeve-aan-Zee. Follow Jules's contacts and read their
      posts. The more you engage with the community, the more they will
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Jan (café owner, knows everyone) -> jan_intro
      - Talk to Bram (fisherman, saw the construction damage) -> bram_intro
      - Talk to Noor (teen surfer, seems shaken) -> noor_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes grief for Jules with the rhythms of a Flemish
      coastal village: tide schedules, the bakery's daily specials,
      weather warnings for the North Sea.

      Key names surface: Lies (wife, teacher), Wout (food blogger,
      seems obsessed with Jules's mussels), Griet (marine biologist,
      seems rattled), and the teens — Noor, Stef, Fien — who
      practically grew up at Jules's mussel farm.

      Also prominent: NordKust Vastgoed NV, the real estate developer
      that wants to build luxury apartments on the dunes next to the
      mussel beds. Their posts are corporate PR. Jules's posts were
      the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Jan -> jan_intro
      - Talk to Bram -> bram_intro
      - Talk to Noor -> noor_intro

  # --- Jan (social map) ---

  jan_intro:
    type: tweet
    from: jan
    text: >
      Het café is open maar het hart is er niet bij. @jules_vanderberghe,
      uw vaste stoel staat klaar. Rust zacht, vriend.
    effects: { trust_jan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jan -> jan_talk

  jan_talk:
    type: message
    text: >
      JAN: Ah, you are new here? Welcome. Terrible time to arrive.
      Everyone is devastated about Jules.

      Let me tell you who is who. Lies is Jules's wife — she teaches
      at the village school. Wonderful woman, broken right now. Wout
      Claes is that food blogger — "Smaak van de Kust" — he is
      obsessed with Jules's mussels. Not in a healthy way if you ask
      me. He has been filming Jules for months, following him to the
      beds, showing up unannounced. Griet Peeters is the marine
      biologist at the mussel farm.

      And Pieter Vermeersch — the journalist — he and Jules were
      working on something together. Something about the building
      project. Pieter has not said a word since Jules died. That is
      not like him.

      Oh, and do not trust NordKust Vastgoed's PR posts. Lies wrapped
      in sustainability reports. They want to build on the dunes and
      they do not care what they destroy.
    effects: { trust_jan: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Wout -> jan_wout
      - Ask about NordKust Vastgoed -> jan_nordkust
      - Thank him and move on -> quest1_hub

  jan_wout:
    type: message
    text: >
      JAN: Wout? He calls himself a food blogger but amai, that man
      is not well. He arrived in the village a year ago. Started his
      "Smaak van de Kust" blog. Immediately fixated on Jules's mussels.
      Said they were "the purest expression of the North Sea." Poetic,
      sure. But then he was at the mussel beds every day. Filming
      Jules at work. Posting about Jules's techniques, his schedule,
      his routes.

      Jules was polite about it at first. Free publicity. But Wout
      got worse. Wanted to be part of everything. Wanted exclusive
      access. Jules told me once, "Die vent laat me niet met rust."
      That guy does not leave me alone.

      After Jules started fighting NordKust, Wout got angry. He said
      Jules was "ruining the culinary heritage of the coast" by
      making enemies with developers. Godverdomme, what kind of logic
      is that?
    effects: { trust_jan: "+5" }
    choices:
      - Ask about NordKust Vastgoed -> jan_nordkust
      - Move on -> quest1_hub

  jan_nordkust:
    type: message
    text: >
      JAN: NordKust Vastgoed bought the dune plots three years ago.
      They want to build a luxury apartment complex — "Residence
      Zeewind" — right next to the mussel beds. The construction would
      destroy the tidal flats that the mussels need.

      The village tolerated the idea because they promised jobs and
      tourism money. But the fishermen and mussel farmers fought back.
      Jules led the resistance. He had documents showing the
      environmental impact assessment was falsified. He had proof the
      construction would contaminate the water with sediment and
      chemicals.

      Two weeks before he died, he posted those documents. Then
      someone found him on the breakwater. Godverdomme.
    effects: { trust_jan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Bram (the construction, witness tease) ---

  bram_intro:
    type: tweet
    from: bram
    text: >
      35 jaar op zee. het water is niet meer hetzelfde sinds die
      bouwwerken. @jules_vanderberghe had gelijk. en nu is hij dood.
      maak de link.
    effects: { trust_bram: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Bram -> bram_talk

  bram_talk:
    type: message
    text: >
      BRAM: I have been fishing this coast since I was sixteen. I know
      every current, every sandbank. And I am telling you — the water
      near the construction site is wrong. My nets come up with
      concrete dust. The seabed is turning grey.

      Jules took water samples. He documented the sediment runoff from
      NordKust's preliminary works. He photographed the illegal
      dumping of construction waste on the tidal flats. He was building
      a case. And then — gone.

      You think that is a coincidence? Serieus, I do not believe in
      coincidences at sea.
    effects: { trust_bram: "+10" }
    choices:
      - Did you see anything unusual recently? -> bram_night
      - Move on -> quest1_hub

  bram_night:
    type: message
    text: >
      BRAM: The night before they found Jules — I was coming back from
      night fishing, around 1am. I saw lights at the mussel farm
      office. Not unusual, Jules works late sometimes. But there were
      two cars in the car park. One was Jules's old Volvo. The other
      was a black Mercedes with NordKust company plates.

      At 1am. At the mussel farm.

      I noted it in my fishing log. Nobody has asked to see it.
    effects: { trust_bram: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Noor (teen surfer, witness tease) ---

  noor_intro:
    type: tweet
    from: noor
    text: >
      amai dit is niet oké. @jules_vanderberghe leerde ons alles
      over de zee. hij was de beste mens in dit dorp. als iemand
      iets weet zeg het aub. dit klopt niet.
    effects: { trust_noor: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Noor -> noor_talk_early

  noor_talk_early:
    type: message
    text: >
      NOOR: ej ge zijt nieuw hier? kut timing. maar oké, Jules was
      echt de beste. hij leerde ons hoe de mosselen groeien, hoe de
      getijden werken. we mochten altijd op de boerderij komen.

      en nu ben ik bang want Stef heeft iets gezien die avond maar
      hij wilt er niet over praten. hij zegt dat het niks is maar
      amai... het is niet niks eh.
    effects: { trust_noor: "+10" }
    choices:
      - What did Stef see? -> noor_stef_hint
      - Move on -> quest1_hub

  noor_stef_hint:
    type: message
    text: >
      NOOR: ik weet niet exact. hij was aan het skaten bij de dijk
      en hij zag iemand bij Jules zijn boot. serieus alsof die
      persoon iets deed met de boot of zo. en toen die persoon Stef
      zag is die snel weggelopen.

      Stef is bang. hij wilt niet praten met mensen die hij niet kent.
      probeer eerst over surfen of skaten te praten ofzo haha
    effects: { trust_noor: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You are getting a picture of Hoeve-aan-Zee. A Flemish coastal
      village built around mussel farming and the sea. A mussel farmer
      who was exposing construction fraud. A death nobody believes
      was an accident.

      You have made contacts. Now dig deeper.
    choices:
      - Talk to Lies (Jules's wife) -> lies_q1
      - Talk to Wout (the food blogger) -> wout_q1
      - Check what Griet (Jules's colleague) is saying -> griet_q1
      - I'm ready to investigate the night he died -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lies Q1 ---

  lies_q1:
    type: tweet
    from: lies
    text: >
      als iemand weet wat er is gebeurd met @jules_vanderberghe bel
      mij alstublieft. zijn laarzen stonden thuis. zijn jas hing aan
      de kapstok. hij ging niet naar de golfbreker in het donker.
    effects: { trust_lies: "+5", contacts_followed: "+1" }
    choices:
      - DM Lies -> lies_q1_talk

  lies_q1_talk:
    type: message
    text: >
      LIES: I appreciate you reaching out but I do not know you.
      Jules had many friends here. The funeral is Thursday.

      ...I keep telling myself to stay strong for the children. I
      cannot.

      [Lies is guarded. You will need to build more trust before she
      opens up.]
    effects: { trust_lies: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Wout Q1 ---

  wout_q1:
    type: tweet
    from: wout
    text: >
      De mosselen van @jules_vanderberghe waren kunst. Elke schelp een
      verhaal. Ik heb alles gedocumenteerd. Dit culinair erfgoed mag
      niet verloren gaan. Ik zal zijn werk voortzetten. Wat het ook kost.
    effects: { trust_wout: "+5", contacts_followed: "+1" }
    choices:
      - DM Wout -> wout_q1_talk

  wout_q1_talk:
    type: message
    text: >
      WOUT: You are interested in Jules's story? Good. His mussels
      were extraordinary. I have been documenting his methods for a
      year — video, photography, tasting notes. This is the most
      important culinary story on the Belgian coast.

      Jules and I had our disagreements about publicity, sure. I
      wanted the world to know about his mussels. He wanted to be
      left alone. Typical farmer mentality. But at the end of the day,
      his legacy matters more than his preference for privacy.

      I offered to help him fight NordKust. Many times. He said he had
      it under control. He said he was working with a journalist. I
      could have amplified his message to thousands of followers.

      [Wout seems earnest. Or obsessive?]
    effects: { trust_wout: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Griet Q1 ---

  griet_q1:
    type: tweet
    from: griet
    text: >
      de watermonsters van @jules_vanderberghe liggen nog in het labo.
      zijn meetlogboek ligt op zijn bureau. hij zou nooit lopend
      onderzoek achterlaten. er is iets gebeurd.
    effects: { trust_griet: "+5", contacts_followed: "+1" }
    choices:
      - DM Griet -> griet_q1_talk

  griet_q1_talk:
    type: message
    text: >
      GRIET: Jules and I worked together at the mussel farm for three
      years. He was the most dedicated farmer I have ever known. This
      fight against NordKust — it consumed him. He had water quality
      data, sediment samples, environmental reports. He was building
      a case that the construction would destroy the mussel beds.

      He called me the night before he died. He said "they know what
      I have." He said "if anything happens, look at NordKust." Then
      he said something strange — "and keep that blogger away from
      my boats."

      I did not understand the last part then. Now I cannot stop
      thinking about it.
    effects: { trust_griet: "+10" }
    choices:
      - What do you think happened? -> griet_theory
      - Move on -> quest1_hub

  griet_theory:
    type: message
    text: >
      GRIET: I think NordKust killed him because he had proof their
      environmental impact assessment was fabricated. But I also think
      Wout — that blogger — knows more than he admits. The way Wout
      talks about Jules's mussels... it is not admiration. It is
      possession.

      Jules told me months ago that someone was coming to the mussel
      beds at night, filming, taking samples. He thought it was
      NordKust scouting the land. But the footprints he found were
      from expensive hiking shoes, not construction boots. Wout wears
      exactly those shoes. Every single day.
    effects: { trust_griet: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Jules died. Multiple people saw or
      heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Stef (was skating near the dike) -> stef_interview
      - Find Dirk (harbour master, works late) -> dirk_interview
      - Find Hilde (baker, starts at 5am, saw something) -> hilde_interview
      - Find Bram (fisherman, was coming back late) -> bram_interview

  # --- Stef (saw someone at Jules's boat) ---

  stef_interview:
    type: tweet
    from: stef
    text: >
      kut sfeer in het dorp. er klopt iets niet. ik weet niet wat ik
      moet doen. gewoon skaten en proberen niet na te denken
    effects: { trust_stef: "+5" }
    choices:
      - Ask Stef about that evening -> stef_talk

  stef_talk:
    type: message
    text: >
      STEF: ej oké maar ge zegt het tegen niemand hé. ik was bij
      de dijk rond 19u, sunset session. en ik zag die foodblogger —
      Wout — bij de boot van Jules. hij was serieus iets aan het
      doen met de boot. alsof hij iets installeerde of vastmaakte
      onder het dek. toen hij mij zag is hij direct weggelopen.

      amai ik heb niks gezegd want ik wilde geen problemen maar nu
      is het serieus fucked up. dat is niet normaal wa is da nu
    effects:
      trust_stef: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Dirk (harbour master, saw late-night meeting) ---

  dirk_interview:
    type: tweet
    from: dirk
    text: >
      Herinnering: de haven is verboden terrein tussen 22u en 6u.
      De laatste nachten waren er ongeoorloofde bewegingen.
    effects: { trust_dirk: "+5" }
    choices:
      - Ask Dirk what he saw -> dirk_talk

  dirk_talk:
    type: message
    text: >
      DIRK: I was closing up the harbour office around 22h30. I saw
      Jules's Volvo still in the mussel farm car park. And a black
      Mercedes — NordKust company plates — parked next to it. Two
      people were standing by the farm office entrance. One of them
      I recognised: Leen De Ridder, the project director.

      At 22h30. At the mussel farm. That is not normal.

      I noted it in my harbour log. Nobody has asked to see it.
    effects:
      trust_dirk: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

