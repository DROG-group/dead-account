      Commissaris De Graef reopens the case as a homicide investigation.
      With your evidence — the anonymous account, the GPS tracker, the
      blog monetization, the witness testimonies, and the audio
      recording — Wout is arrested for involuntary manslaughter and
      stalking. He confesses fully. Forensic evidence from the
      breakwater confirms the struggle.

      Pieter Vermeersch, finally in possession of Jules's full evidence
      package, publishes the NordKust story in De Standaard. The
      Flemish Environmental Agency orders an emergency inspection. The
      construction permit is revoked. NordKust's environmental impact
      assessment is declared fraudulent. Leen De Ridder faces criminal
      charges for document falsification and environmental crime.

      And Lies Vanderberghe, reading the story at her kitchen table
      after the children have gone to bed, calls Griet at the mussel
      farm.

      "Jules heeft gewonnen. De mosselen blijven."
    choices:
