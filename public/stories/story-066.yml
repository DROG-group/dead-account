    text: >
      ENDING B: THE CORPORATION

      The construction fraud story breaks. NordKust Vastgoed is ordered
      to halt all works. The permit is under review. The tidal flats
      begin to recover. The mussels survive.

      But Jules?

      Without the evidence of Wout's obsession and presence that night,
      the death remains classified as an accident. Wout continues to
      blog. He rebrands — "In Memory of Jules: A Culinary Legacy." He
      has more subscribers than ever. He walks the mussel beds every
      morning, filming, photographing, narrating.

      Lies cannot bear to look at the blog. She sells the farm. She
