      I went to the farm that night to reason with him. NordKust was
      already there, threatening him. After they left, Jules and I
      argued on the breakwater. I pushed him. He fell. The water...
      godverdomme, the water took him.

      I panicked. I took his phone. I posted the photo so it would
      look like he was still active. I moved his boat to make it look
      like he went out alone.

      You have already sent the evidence to Commissaris De Graef. And
      to Pieter Vermeersch.
