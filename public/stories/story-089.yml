  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Kommissarie Lund reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the workshop post, the
      studio break-in, the witness testimonies — Elias is arrested
      for stalking and harassment. A GPS tracker is recovered from
      under Maja's car at the old fishing cabins near Norrbergsudden.

      Hanna Bergqvist, finally in possession of Maja's full evidence
      package, publishes the NordGruve story in Dagens Nyheter. The
      Länsstyrelsen orders an unannounced inspection. The mine is
      shut down pending environmental remediation. Erik Dahlström
      faces criminal charges for falsifying discharge reports and
      illegal dumping of mine tailings.

      And Maja Lindström, reading the story from a friend's house
      in Sundsvall, calls her sister for the first time in nine days.

      "Jag kommer hem."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Kvinnofridslinjen: 020-50 50 50 (gratis, dygnet runt)
      Polisen: 114 14
      Bris (för barn och unga): 116 111
    choices:
      - See the epilogue -> ending_a_epilogue

