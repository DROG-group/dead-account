    type: message
    text: >
      Elias doesn't reply for a long time. Then:

      ELIAS: You don't understand. I was protecting her. She was in
      danger from NordGruve and she wouldn't let me help. I needed
      to know she was safe. Everything I did was because I love her.

      That's not love. That's obsession.

      You've already sent the evidence to Kommissarie Lund. And to
