entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN STORSJÖVIK
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Storsjovik.social — the community Mastodon instance for
      the village of Storsjövik, Jämtland, northern Sweden.

      The local feed is unsettled today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @maja_lindstrom.

      A glass artist. Nature photographer. She captured the light on
      the lake in blown glass. People are worried. She hasn't posted
      in six days.
    choices:
      - Look at her profile -> maja_profile

  maja_profile:
    type: tweet
    from: maja
    text: "Vattnet vid Norrbergsudden har fel färg. Någon dumpar gruvavfall i sjön. Jag har bevis."
    choices:
      - That's her last real post... -> grey_lake

  grey_lake:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a grey lake surface. Blurred, overexposed, shot from a strange
      angle. Posted at 3am. No caption.

      Her friends say that's not her style. The police say she
      probably went hiking. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: kommissarie
    text: >
      Vi har mottagit en anmälan gällande en invånare i Storsjövik.
      I nuläget finns inga uppgifter som tyder på brott. Information
      kan lämnas till 114 14 eller till lokalpolisen.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @linnea_hedlund is
      desperate. Her sister @saga_lindstrom is driving up from
      Östersund. Her ex @elias_berglund is posting frantic messages.
      The fisherman @gunnar_astrom says she was right about the water.

      And the journalist @hanna_bergqvist is strangely silent.

      Nobody buys the police's line. Nobody thinks Maja just
      "went hiking."
    effects: { trust_saga: "+5", trust_linnea: "+5" }
    choices:
      - Start following Maja's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Storsjövik. Follow Maja's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Birgitta (värdshus owner, knows everyone) -> birgitta_intro
      - Talk to Gunnar (fisherman, saw the water) -> gunnar_intro
      - Talk to Wilma (teen, seems shaken) -> wilma_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Maja with the rhythms of a small
      Jämtland village: weather warnings, the bakery's kanelbullar,
      ice reports on the lake, snowmobile trails.

      Key names surface: Linnea (best friend, librarian), Elias (ex,
      mechanic, seems rattled), Hanna (journalist, oddly quiet),
      and the teens — Wilma, Noah, Alice — who worshipped Maja's
      glass art.

      Also prominent: NordGruve AB, the mining company at the edge
      of the village. Their posts are corporate PR. Maja's posts
      were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Birgitta -> birgitta_intro
      - Talk to Gunnar -> gunnar_intro
      - Talk to Wilma -> wilma_intro

  # --- Birgitta (social map) ---

  birgitta_intro:
    type: tweet
    from: birgitta
    text: >
      Värdshuset är öppet men glädjen är borta. @maja_lindstrom,
      ditt bord väntar. Kom tillbaka snart.
    effects: { trust_birgitta: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Birgitta -> birgitta_talk

  birgitta_talk:
    type: message
    text: >
      BIRGITTA: Ah, you're new? Welcome. Awful time to arrive.
      Everyone's on edge about Maja.

      Let me tell you who's who. Linnea is Maja's best friend — they
      practically live at the library together. Elias Berglund is
      her ex-boyfriend. Mechanic. They broke up eight months ago but
      he never accepted it. Sweet man on the surface but... obsessive
      underneath. Saga is Maja's older sister, she's coming up from
      Östersund.

      And Hanna Bergqvist — the journalist — she and Maja were working
      on something together. Something about the lake. Hanna hasn't
      said a word since Maja vanished. That's not like her.

      Oh, and don't bother reading NordGruve's PR posts. Lies
      wrapped in ISO certifications.
    effects: { trust_birgitta: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Elias -> birgitta_elias
      - Ask about NordGruve -> birgitta_nordgruve
      - Thank her and move on -> quest1_hub

  birgitta_elias:
    type: message
    text: >
      BIRGITTA: Elias? Herregud asså. They dated for two years. He
      was charming at first, everyone liked him. But he got
      possessive. Wanted to know where she was at all times. Got
      jealous if she spent time in her studio alone.

      Maja ended it. Clearly. She told him it was over. He said he
      understood. But then he'd show up at the värdshus whenever she
      was here. He'd drive past her studio at night. She told me
      once, "He doesn't understand what 'no' means."

      After she started the pollution investigation, he got worse.
      Said she was "putting herself in danger" and he needed to
      "protect her." She didn't want his protection.
    effects: { trust_birgitta: "+5" }
    choices:
      - Ask about NordGruve -> birgitta_nordgruve
      - Move on -> quest1_hub

  birgitta_nordgruve:
    type: message
    text: >
      BIRGITTA: That mine has been there since the 90s. They extract
      copper and zinc. The village tolerated them because they brought
      jobs. But the fishermen have been complaining for years —
      strange colours in the water near Norrbergsudden, dead fish
      floating up, a chemical smell when the wind blows wrong.

      Maja was the first person to actually take samples. She dove
      into the lake with her camera. She found tailings — mine waste
      — dumped straight into the water through a hidden pipe. She
      had proof. Real proof.

      Two weeks later she's gone.
    effects: { trust_birgitta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Gunnar (the water, witness tease) ---

  gunnar_intro:
    type: tweet
    from: gunnar
    text: >
      fyrtifem år har jag fiskat i storsjön. vattnet är inte sig
      likt. @maja_lindstrom hade rätt. och nu har hon försvunnit.
      dra era slutsatser.
    effects: { trust_gunnar: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Gunnar -> gunnar_talk

  gunnar_talk:
    type: message
    text: >
      GUNNAR: I've been fishing this lake since I was a boy. I know
      every current, every depth, every colour the water makes. And
      I'm telling you — the water near Norrbergsudden is wrong. Has
      been for months. My nets come up with dead perch. The lake
      bottom smells like metal.

      Maja took water samples. She dove down near the old mining
      outfall. She photographed everything. She was building a case.
      And then — poof. Gone.

      You think that's a coincidence? Fan ta, I don't believe in
      coincidences on this lake.
    effects: { trust_gunnar: "+10" }
    choices:
      - Did you see anything unusual recently? -> gunnar_night
      - Move on -> quest1_hub

  gunnar_night:
    type: message
    text: >
      GUNNAR: The night before she vanished — I was out on the lake,
      night fishing for öring, around midnight. I saw lights at
      Maja's glass studio. Not unusual, she works late. But there
      was a car parked on the road that shouldn't have been there.
      A dark SUV. Company plates — NordGruve.

      At midnight. Outside a glass artist's studio.

      I noted it in my fishing log. Nobody has asked to see it.
    effects: { trust_gunnar: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Wilma (teen, witness tease) ---

  wilma_intro:
    type: tweet
    from: wilma
    text: >
      jävlar asså @maja_lindstrom hon lärde mig fota naturen på
      riktigt liksom det går inte att hon bara stack. om nån vet
      nåt skriv snälla
    effects: { trust_wilma: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Wilma -> wilma_talk_early

  wilma_talk_early:
    type: message
    text: >
      WILMA: va fan du är ny här? skitdålig timing. men asså maja
      är typ den bästa personen i hela byn. hon lärde oss att blåsa
      glas, visa oss ljuset på sjön, hur man ser naturen på riktigt.
      skit coolt.

      och nu är jag livrädd för noah han såg nåt konstigt vid hamnen
      den kvällen men han vill inte prata om det. han säger att det
      är inget men herregud asså... det är inte inget
    effects: { trust_wilma: "+10" }
    choices:
      - What did Noah see? -> wilma_noah_hint
      - Move on -> quest1_hub

  wilma_noah_hint:
    type: message
    text: >
      WILMA: jag vet inte exakt. han var ute och fiskade sent vid
      hamnen och han såg typ nån som höll på med majas bil?? eller
      nåt sånt. han flippar helt han vill inte prata. du måste fråga
      honom direkt men han litar inte på folk han inte känner. snacka
      om fiske först lol så kanske han öppnar sig
    effects: { trust_wilma: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Storsjövik. A Jämtland village
      built around the lake. A glass artist who was exposing mining
      pollution. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Linnea (Maja's best friend) -> linnea_q1
      - Talk to Elias (Maja's ex) -> elias_q1
      - Check what Saga (Maja's sister) is saying -> saga_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Linnea Q1 ---

  linnea_q1:
    type: tweet
    from: linnea
    text: >
      om någon har hört nåt om @maja_lindstrom ring mig snälla.
      hennes studio är orörd. hennes glasverktyg ligger kvar. hon
      skulle aldrig lämna sitt arbete.
    effects: { trust_linnea: "+5", contacts_followed: "+1" }
    choices:
      - DM Linnea -> linnea_q1_talk

  linnea_q1_talk:
    type: message
    text: >
      LINNEA: I appreciate you reaching out but I don't know you.
      Maja has a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Linnea is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_linnea: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Elias Q1 ---

  elias_q1:
    type: tweet
    from: elias
    text: >
      @maja_lindstrom svara mig snälla. jag vet att vi inte är
      tillsammans längre men jag bryr mig fortfarande. jag kan
      hjälpa. ring mig.
    effects: { trust_elias: "+5", contacts_followed: "+1" }
    choices:
      - DM Elias -> elias_q1_talk

  elias_q1_talk:
    type: message
    text: >
      ELIAS: Who are you? You don't know Maja. I know Maja. We were
      together for two years. I know her better than anyone in this
      village.

      She's in trouble, I can feel it. Those NordGruve bastards did
      something. She was poking around the mine and they didn't like
      it. I told her a hundred times to stop but she never listens
      to me. She never listened.

      [Elias seems earnest. Or possessive?]
    effects: { trust_elias: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Saga Q1 ---

  saga_q1:
    type: tweet
    from: saga
    text: >
      min syster har FÖRSVUNNIT och polisen säger att hon kanske gick
      ut och vandrade??? HON VANDRAR INTE UTAN ATT SÄGA TILL. jag
      åker upp nu. nån ska fan förklara.
    effects: { trust_saga: "+5", contacts_followed: "+1" }
    choices:
      - DM Saga -> saga_q1_talk

  saga_q1_talk:
    type: message
    text: >
      SAGA: Who are you? Another person from that village who's going
      to tell me to calm down? My sister called me the night before
      she disappeared. She said she had something big. She said "if
      anything happens, look at NordGruve." Then she hung up.

      That's the last I heard from her.
    effects: { trust_saga: "+10" }
    choices:
      - What do you think happened? -> saga_theory
      - Move on -> quest1_hub

  saga_theory:
    type: message
    text: >
      SAGA: I think she found proof that NordGruve is dumping mine
      tailings in the lake and they shut her up. But I also think
      that creepy ex of hers — Elias — knows more than he's saying.
      The way he talks about her... it's not just concern from an
      ex-boyfriend. It's something else.

      Maja told me months ago that someone was following her. She'd
      see the same car parked outside her studio at night. She
      thought it was nothing. I don't think it was nothing.
    effects: { trust_saga: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Maja went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Noah (was fishing at the harbour late) -> noah_interview
      - Find Sven (harbour master, works late) -> sven_interview
      - Find Tommy (dairy farmer, early morning at the barn) -> tommy_interview
      - Find Margareta (baker, starts at 5am, saw something) -> margareta_interview

  # --- Noah (saw someone at Maja's car) ---

  noah_interview:
    type: tweet
    from: noah
    text: >
      bra fiske ikväll men stämningen i byn är skum asså. typ
      nånting är fel. kan inte förklara
    effects: { trust_noah: "+5" }
    choices:
      - Ask Noah about that evening -> noah_talk

  noah_talk:
    type: message
    text: >
      NOAH: va fan ok men du säger det inte till nån va. jag satt
      vid hamnen typ klockan 20 och fiskade. och jag såg elias —
      majas ex — vid majas bil. han höll på och pillade med nåt
      under bilen. när han såg mig drog han skitfort.

      asså jag sa inget för jag ville inte ha bråk men skit också
      det är inte normalt hans beteende. herregud asså
    effects:
      trust_noah: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Sven (harbour master, saw late-night meeting) ---

  sven_interview:
    type: tweet
    from: sven
    text: >
      Påminnelse: hamnen är avstängd mellan 22 och 06.
      Jag har noterat obehöriga besök de senaste nätterna.
    effects: { trust_sven: "+5" }
    choices:
      - Ask Sven what he saw -> sven_talk

  sven_talk:
    type: message
    text: >
      SVEN: I was locking up the harbour office around 23:00. I saw
      Maja's car still parked at her studio. And a black SUV —
      NordGruve plates — parked next to it. Two men were standing by
      the studio entrance. One of them I recognised: Erik Dahlström,
      the mine site manager.

      At 23:00. At a glass artist's studio. That's not normal.

      I noted it in my harbour log. Nobody's asked to see it.
    effects:
      trust_sven: "+10"
      night_witnesses: "+1"
      mine_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Tommy (saw Maja fleeing) ---

  tommy_interview:
    type: tweet
    from: tommy
    text: >
      uppe klockan 4 för mjölkningen. vägen var inte tom idag. nån
      sprang längs sjöstigen. i mörkret. inte en joggare.
    effects: { trust_tommy: "+5" }
    choices:
      - Ask Tommy what he saw -> tommy_talk

  tommy_talk:
    type: message
    text: >
      TOMMY: I get up at 4am for the milking. That morning — the
      morning after Maja's last post — I saw someone on the lake
      path. Running. A woman, carrying a bag, heading toward
      Norrbergsudden. It was still dark. She was moving fast, like
      she was afraid.

      I called out but she didn't stop. I figured it was a jogger
      but... who jogs at 4am carrying a rucksack?

      When I heard about Maja, I put it together. I think that was
      her. Running from something.
    effects:
      trust_tommy: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Margareta (saw car chase) ---

  margareta_interview:
    type: tweet
    from: margareta
    text: >
      Degen jäser klockan 5 som vanligt. Men den morgonen körde
      en bil alldeles för fort på sjövägen.
    effects: { trust_margareta: "+5" }
    choices:
      - Ask Margareta what she saw -> margareta_talk

  margareta_talk:
    type: message
    text: >
