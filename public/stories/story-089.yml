    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. NordGruve is ordered to halt all
      discharge pending investigation. The mine may close. One
      hundred and fifty jobs hang in the balance. The village is
      divided.

      But Maja?

      Without the stalking evidence, Elias is never investigated.
      He continues to work at his workshop. He continues to monitor
      her accounts. He creates a new anonymous profile.

      Three months later, Maja reads about NordGruve online. She
      returns quietly. She moves her studio to Östersund. She stops
      diving alone. She checks her car every morning.

      The corporation is exposed. But the person who terrorised
      Maja walks free.
    choices:
