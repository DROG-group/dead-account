      Il-klijent tiegħi jieħu nota tal-allegazzjonijiet tiegħek.
      Kull pubblikazzjoni ta' materjal libelluż se tirriżulta
      fi proċeduri legali immedjati. — Mifsud & Associates, Valletta
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The kunsillier's lawyer buries your accusation. Without a direct
      link between Grech and Azure Hospitality's destruction — and
      there isn't one beyond political protection — your evidence is
      insufficient.

      Azure Hospitality continues to build. Carmen continues to watch.
      Joseph stays in hiding.

      Six months later, @karmenu creates a new account. It follows
      Joseph's brother.
    choices:
