      Malta. The planning authority orders an unannounced inspection.
      Construction is halted pending heritage assessment. Charles
      Fenech faces criminal charges for falsifying planning
      submissions. The salt pans are secured.

      And Joseph Vella, reading the story from a friend's farmhouse
      near Xagħra, calls his wife for the first time in eight days.

      "Ġej lura d-dar."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Victim Support Malta: 2122 8333
      Appoġġ Helpline: 179
      Commission for Domestic Violence: 2568 9000
    choices:
