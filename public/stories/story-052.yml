entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN GĦARB FIELDS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to GharbFields.social — the community Mastodon instance
      for the coastal village of Għarb Fields, Gozo, built around its
      ancient salt pans.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @joseph_vella.

      A salt harvester. Third generation. He maintained the ancient
      salt pans that have been carved into the limestone for centuries.
      People are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> joseph_profile

  joseph_profile:
    type: tweet
    from: joseph
    text: "Sibt dawn il-pegs tal-Azure Hospitality fil-mitħan tiegħi. Iridu jibnu lukanda fuq il-mitħan ta' missierijietna. Għandi l-provi."
    choices:
      - That's his last real post... -> strange_photo

  strange_photo:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a blurry photo of salt pans at twilight. Posted at 3am. No
      caption. No location tag.

      His friends say that's not his style. Joseph always wrote about
      the harvest, always tagged the pans by their family names. The
      police say he probably took the ferry to Malta for a few days.
      Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: spettur
    text: >
      Rċevejna rapport dwar resident ta' Għarb Fields. Bħalissa
      m'hemmx bażi biex nissuspettaw att kriminali. Kull informazzjoni
      tista' tiġi rrapportata fuq 112 jew fl-għassa.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His wife @maria_vella is desperate.
      His brother @mark_vella is taking the ferry from Valletta. The
      folklore historian @carmen_camilleri is posting frantic messages.
      The fisherman @saviour_galea says Joseph was right about the
      construction pegs.

      And the journalist @sylvana_zammit is strangely silent.

      Nobody buys the police line. Nobody thinks Joseph just "took
      the ferry."
    effects: { trust_maria: "+5", trust_mark: "+5" }
    choices:
      - Start following Joseph's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Għarb Fields. Follow Joseph's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Antonia (bar owner, knows everyone) -> antonia_intro
      - Talk to Saviour (fisherman, saw the pegs) -> saviour_intro
      - Talk to Nathan (teen spearfisher, seems shaken) -> nathan_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Joseph with the rhythms of a small
      Gozitan village: festa preparations, fishing reports, ferry
      schedules, ftira specials at the bar.

      Key names surface: Maria (wife, primary school teacher), Carmen
      (folklore historian, seems rattled), Sylvana (journalist, oddly
      quiet), and the teens — Nathan, Kyra, Luke — who helped Joseph
      at the salt pans every summer.

      Also prominent: Azure Hospitality Group, the development company
      planning a luxury resort on the coastline. Their posts are
      polished investor PR. Joseph's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Antonia -> antonia_intro
      - Talk to Saviour -> saviour_intro
      - Talk to Nathan -> nathan_intro

  # --- Antonia (social map) ---

  antonia_intro:
    type: tweet
    from: antonia
    text: >
      Il-bar miftuħ imma l-qalb mhix hemm. @joseph_vella, il-mejda
      tiegħek qed tistenna. Ejja lura.
    effects: { trust_antonia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Antonia -> antonia_talk

  antonia_talk:
    type: message
    text: >
      ANTONIA: Oh, you're new? Merħba. Welcome to Għarb Fields.
      Terrible time to arrive. The whole village is sick with worry
      about Joseph.

      Let me tell you who's who. Maria is Joseph's wife — they've been
      married fifteen years, she teaches at the primary school. Heart
      of gold, destroyed right now. Carmen Camilleri is the folklore
      society woman, she's been documenting the salt pans for years.
      She was close to Joseph. Too close, mela, some say. Mark is
      Joseph's brother, he's coming from Valletta.

      And Sylvana Zammit — the journalist — she and Joseph were working
      on something together. Something about the hotel development.
      Sylvana hasn't said a word since Joseph vanished. Mela that's
      not like her at all.

      Oh, and don't waste your time reading Azure Hospitality's PR.
      Xi ħmerija — lies wrapped in architectural renders.
    effects: { trust_antonia: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Carmen -> antonia_carmen
      - Ask about Azure Hospitality -> antonia_azure
      - Thank her and move on -> quest1_hub

  antonia_carmen:
    type: message
    text: >
      ANTONIA: Carmen? She's been researching the salt heritage for
      years. PhD from the University of Malta. Brilliant woman. But
      since Joseph started talking publicly about the development
      threat, she's been... orbiting him. At the bar every time he was
      here. Volunteering to help with every campaign. She's a
      historian, he's a salt farmer, but she treated him like...
      mela, I don't know. Not a research subject.

      After he found the survey pegs, she got worse. Wanted access
      to everything he documented. He told me once, "qisha ma
      titlaqnix." I thought he meant professionally. Now I'm not
      so sure.
    effects: { trust_antonia: "+5" }
    choices:
      - Ask about Azure Hospitality -> antonia_azure
      - Move on -> quest1_hub

  antonia_azure:
    type: message
    text: >
      ANTONIA: That development company showed up eighteen months ago.
      Azure Hospitality. Big money from the mainland — Maltese
      developers with foreign investors behind them. They bought
      coastal land next to the salt pans and announced a five-star
      resort. "Għarb Fields Azure" — sounds grand, right?

      Problem is, the salt pans are on the edge of their site. Joseph
      was the first person to go out there and document what they were
      really planning. The survey pegs were IN the salt pans. Not next
      to them — in them. They're going to build over the pans.

      Two weeks later he's gone. Mela, you do the maths.
    effects: { trust_antonia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Saviour (the pegs, witness tease) ---

  saviour_intro:
    type: tweet
    from: saviour
    text: >
      erbgħin sena nisikka hawn. il-baħar mhux l-istess. u issa
      iridu jeqirdu l-mitħan. @joseph_vella kellu raġun. u issa
      sparixa. agħmlu l-konnessjoni.
    effects: { trust_saviour: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Saviour -> saviour_talk

  saviour_talk:
    type: message
    text: >
      SAVIOUR: I've been fishing this coast since I was fifteen. I
      know every rock, every current, every colour the water makes.
      And I'm telling you — those salt pans have been there since the
      Phoenicians. Maybe longer. They're part of Gozo.

      Joseph found the survey pegs. They were hammered into the
      limestone RIGHT IN the ancient pans. Not the edge — the middle.
      He photographed everything. He was building a case for the
      heritage authority. And then — sparixxa. Gone.

      You think that's a coincidence? Fuck sake, I don't believe in
      coincidences at sea.
    effects: { trust_saviour: "+10" }
    choices:
      - Did you see anything unusual recently? -> saviour_night
      - Move on -> quest1_hub

  saviour_night:
    type: message
    text: >
      SAVIOUR: The night before he vanished — I was coming back from
      night fishing, around 1am. I saw lights at the salt pans. Not
      unusual, Joseph sometimes checked the evaporation at night. But
      there was a car parked on the coastal road. A black Mercedes
      with personalised plates. Expensive. Not from Gozo.

      At 1am. Parked by the salt pans.

      I didn't think much of it then. Now I can't stop thinking
      about it.
    effects: { trust_saviour: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nathan (teen spearfisher, witness tease) ---

  nathan_intro:
    type: tweet
    from: nathan
    text: >
      fuck sake @joseph_vella hu li għallimni nisikka u nirrespetta
      l-baħar. mela mhux possibbli li telaq hekk. jekk xi ħadd jaf
      xi ħaġa iktbu please
    effects: { trust_nathan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Nathan -> nathan_talk_early

  nathan_talk_early:
    type: message
    text: >
      NATHAN: mela int ġdid hawn? fuck sake what timing. honestly
      joseph is like the best person in this village. he taught us
      the salt — how to read the pans, when to harvest, the whole
      thing. legend.

      u issa qed nibża għax kyra rat xi ħaġa stramba ħdejn il-mitħan
      imma ma tridx titkellem. she says it's nothing but qisek it's
      not nothing
    effects: { trust_nathan: "+10" }
    choices:
      - What did Kyra see? -> nathan_kyra_hint
      - Move on -> quest1_hub

  nathan_kyra_hint:
    type: message
    text: >
      NATHAN: I don't know exactly. she was walking near the pans in
      the evening taking photos and she saw someone near joseph's
      shed. mela like standing there and watching. she says it was
      that historian woman — carmen. just standing and staring at the
      shed.

      I would have said something but fuck sake who's gonna believe a
      teenager against a PhD. try talking to kyra but she doesn't
      trust people she doesn't know. maybe start with photography
      talk haha
    effects: { trust_nathan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Għarb Fields. A Gozitan coastal
      village built around its ancient salt pans. A salt harvester
      who was exposing destruction of heritage. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Maria (Joseph's wife) -> maria_q1
      - Talk to Carmen (folklore historian) -> carmen_q1
      - Check what Mark (Joseph's brother) is saying -> mark_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Maria Q1 ---

  maria_q1:
    type: tweet
    from: maria
    text: >
      jekk xi ħadd għandu aħbar ta' @joseph_vella ċemplu please.
      il-kamra tiegħu l-istess. l-għodda tal-mitħan hemm. qatt ma
      kien jitlaq mingħajrhom.
    effects: { trust_maria: "+5", contacts_followed: "+1" }
    choices:
      - DM Maria -> maria_q1_talk

  maria_q1_talk:
    type: message
    text: >
      MARIA: I appreciate you writing but I don't know you. Joseph
      has many friends here. I'm sure he'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Maria is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_maria: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Carmen Q1 ---

  carmen_q1:
    type: tweet
    from: carmen
    text: >
      Il-mitħan vojt mingħajr @joseph_vella. In-noti tiegħu fuq
      il-mejda. Il-kampjuni tal-mitħan mhux irreġistrati. Qatt ma
      kien iħalli xogħol mhux lest. Xi ħaġa ġrat.
    effects: { trust_carmen: "+5", contacts_followed: "+1" }
    choices:
      - DM Carmen -> carmen_q1_talk

  carmen_q1_talk:
    type: message
    text: >
      CARMEN: Joseph and I have worked together documenting the salt
      heritage for over three years. He's the most knowledgeable
      person about these pans. This development threat — it was
      everything to him. He had photographs, GPS coordinates, heritage
      impact analysis. He was so close to filing a formal objection
      with the planning authority.

      I offered to help him. Many times. He said he had it under
      control. He said he was working with a journalist. I just wanted
      to support his cause.

      [Carmen seems earnest. Or obsessive?]
    effects: { trust_carmen: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mark Q1 ---

  mark_q1:
    type: tweet
    from: mark
    text: >
      ħija SPARIXA u l-pulizija qed jgħiduli li forsi ħa l-vapur
      lejn malta??? QATT MA JITLAQ MINGĦAJR MA JGĦIDLI. Ġej
      mill-belt. xi ħadd se jispjegali.
    effects: { trust_mark: "+5", contacts_followed: "+1" }
    choices:
      - DM Mark -> mark_q1_talk

  mark_q1_talk:
    type: message
    text: >
      MARK: Who are you? Another person from that village who's going
      to tell me to calm down? My brother called me the night before
      he disappeared. He said he had something big. He said "jekk xi
      ħaġa tiġrili, ħares lejn Azure Hospitality." Then he hung up.

      That's the last I heard from him.
    effects: { trust_mark: "+10" }
    choices:
      - What do you think happened? -> mark_theory
      - Move on -> quest1_hub

  mark_theory:
    type: message
    text: >
      MARK: I think he found proof that Azure Hospitality is planning
      to destroy the salt pans and they shut him up. But mela I also
      think that historian woman — Carmen — knows more than she's
      saying. The way she talks about him... it's not just academic
      interest. It's something else.

      Joseph told me months ago that someone was going through his
      salt shed — his tools moved, his harvest logs photographed. He
      thought it was nothing. I don't think it was nothing.
    effects: { trust_mark: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Joseph went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Kyra (was taking photos near the salt pans) -> kyra_interview
      - Find George (boat tour guide, works late) -> george_interview
      - Find Fredu (winemaker, early morning at the vineyard) -> fredu_interview
      - Find Doris (pharmacist, saw something at dawn) -> doris_interview

  # --- Kyra (saw someone at Joseph's shed) ---

  kyra_interview:
    type: tweet
    from: kyra
    text: >
      ħdimt ritratt ġdid tal-mitħan. but the mood is shit. xi ħaġa
      mhix sew f'dan il-villaġġ. I can't explain it
    effects: { trust_kyra: "+5" }
    choices:
      - Ask Kyra about that evening -> kyra_talk

  kyra_talk:
    type: message
    text: >
      KYRA: ok mela but you don't tell anyone. I was near the salt
      pans around 7pm taking photos and I saw that historian woman —
      carmen — near joseph's storage shed. she was just standing there
      looking through the window. when she saw me she walked off real
      quick toward her car.

      fuck sake I didn't say anything because who's gonna believe a
      teenager against a university researcher but qisek that's not
      normal behaviour
    effects:
      trust_kyra: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- George (boat guide, saw late-night meeting) ---

  george_interview:
    type: tweet
    from: george
    text: >
      Reminder: il-port magħluq bejn 10pm u 6am. Ħassejt movimenti
      mhux awtorizzati dawn l-aħħar iljieli.
    effects: { trust_george: "+5" }
    choices:
      - Ask George what he saw -> george_talk

  george_talk:
    type: message
    text: >
      GEORGE: I was tying up my luzzu around 10:30pm. I saw Joseph's
      old van still parked by the salt pans. And a black Mercedes —
      personalised plates, very flash — parked on the coastal road.
      Two men were standing near the boundary fence of the Azure
      Hospitality site. One of them I recognised: Charles Fenech, the
      project director.

      At 10:30pm. On the coastal road. Mela that's not normal.

      I noted it in my harbour log. Nobody's asked to see it.
    effects:
      trust_george: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Fredu (saw Joseph fleeing) ---

  fredu_interview:
    type: tweet
    from: fredu
    text: >
      inqum fl-4 għad-dwieli. il-mogħdija tal-kosta ma kinitx vojta
      dak il-għodu. kien hemm xi ħadd jiġri. fid-dlam. mhux jogger.
    effects: { trust_fredu: "+5" }
    choices:
      - Ask Fredu what he saw -> fredu_talk

  fredu_talk:
    type: message
    text: >
