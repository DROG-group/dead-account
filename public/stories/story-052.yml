    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The heritage destruction story breaks. Azure Hospitality is
      ordered to halt all construction pending investigation. The
      resort project may be cancelled. Local investment and promised
      jobs hang in the balance. The village is divided.

      But Joseph?

      Without the stalking evidence, Carmen is never investigated. She
      continues to visit the salt pans. She continues to monitor his
      accounts. She creates a new anonymous profile.

      Three months later, Joseph reads about Azure Hospitality online.
      He returns quietly. He changes his phone number. He stops going
      to the pans alone. He checks his van every morning.

      The corporation is exposed. But the person who terrorised Joseph
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: joseph
    text: "erġajt lura. il-mitħan safe. il-bqija... naraw."
    choices:
      - The End -> game_complete

  # --- ENDING C: Kunsillier (Wrong Ending) ---

  confront_pawlu:
    type: message
    text: >
      You confront Kunsillier Grech with your evidence.

      Within the hour, you receive a message from his office:
