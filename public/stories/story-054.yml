entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN DEMANOVSKE JASKYNE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to DemanovskeJaskyne.social — the community Mastodon instance
      for the Low Tatras village of Demanovske Jaskyne, Slovakia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @lukas_novak.

      A cave guide. Underground photographer. He mapped passages nobody
      else dared enter. People are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> lukas_profile

  lukas_profile:
    type: tweet
    from: lukas
    text: "V severnom tuneli su praskliny ktore tam minuly rok neboli. Niekto odstreluje prilis blizko jaskynneho systemu. Mam doklad."
    choices:
      - That's his last real post... -> dark_photo

  dark_photo:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurred photo of darkness. Shot from a strange angle. A smear
      of light across wet limestone. Posted at 2am. No caption.

      His friends say that's not his style. Lukas always captioned his
      cave photos with geological detail. The police say he probably
      went hiking alone and got lost. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: major
    text: >
      Obdrzali sme oznamenie o nezvestnej osobe z obce Demanovske Jaskyne.
      V sucasnosti nie su zistene okolnosti nasvedcujuce trestnemu cinu.
      Akekolvek uzitocne informacie zasielajte na cislo 158 alebo na
      obvodne oddelenie.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @petra_kucerova is
      desperate. His sister @zuzana_novakova is driving from Liptovsky
      Mikulas. His best friend @marek_holan is posting furious messages.
      The forester @jozef_kubik says Lukas was right about the blasting.

      And the photographer @viktor_nemec is strangely silent.

      Nobody buys the police line. Nobody thinks Lukas just
      "went hiking alone."
    effects: { trust_zuzana: "+5", trust_marek: "+5" }
    choices:
      - Start following Lukas's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Demanovske Jaskyne. Follow Lukas's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Simona (koliba owner, knows everyone) -> simona_intro
      - Talk to Jozef (forester, heard the blasting) -> jozef_intro
      - Talk to Nina (teen climber, seems shaken) -> nina_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Lukas with the rhythms of a small
      mountain village: hiking trail conditions, the koliba's daily
      specials, weather warnings for the peaks.

      Key names surface: Petra (girlfriend, vet), Marek (mountain
      rescue, furious), Stefan (journalist, oddly quiet), and the
      teens — Nina, Dominik, Milan — who idolised Lukas's cave work.

      Also prominent: LimeTatra s.r.o., the limestone quarry at the
      edge of the valley. Their posts are corporate PR. Lukas's posts
      were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Simona -> simona_intro
      - Talk to Jozef -> jozef_intro
      - Talk to Nina -> nina_intro

  # --- Simona (social map) ---

  simona_intro:
    type: tweet
    from: simona
    text: >
      Koliba je otvorena ale atmosfera je smutna. @lukas_novak, tvoj stol
      caka. Vrat sa nam cim skor.
    effects: { trust_simona: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Simona -> simona_talk

  simona_talk:
    type: message
    text: >
      SIMONA: Aha, ty si novy? Vitaj. Zle obdobie na prichodza.
      Vsetci su v napati kvoli Lukasovi.

      Poviem ti kto je kto. Petra je Lukasova pritelka — byvaju v byte
      nad veterinou. Dobre dievca, znicena. Marek Holan je jeho najlepsi
      kamarad, pracuje pri horskej zachranke. Zuzana je sestra, ide
      z Liptaku.

      A Stefan Halas — novinar — on a Lukas pracovali na niecom spolu.
      Nieco o tych trhacinach. Stefan nepovedal ani slovo odkedy Lukas
      zmizol. To nie je jeho styl vobec.

      A ty posty od LimeTatry? Klamstva zabalene v ISO certifikatoch.
      Kurva, ludia tu z toho maju dost.
    effects: { trust_simona: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Viktor -> simona_viktor
      - Ask about LimeTatra -> simona_limetatra
      - Thank her and move on -> quest1_hub

  simona_viktor:
    type: message
    text: >
      SIMONA: Viktor Nemec? Ten fotograf? Chodi sem uz dva roky. Fotka
      krajinu, hovorit. Ale hlavne fotka Lukasa. Vsade kde bol Lukas,
      bol aj Viktor. Na jaskyniach, na chodnikoch, v kolibe. Vzdy so
      svojim fotoaparatom.

      Lukas mi raz povedal: "Ten chlap ma nervy. Fotka ma aj ked ho
      prosim aby prestal." Myslela som ze to je normalne — turisti.
      Teraz uz si nie som ista.

      Jebat, ked o tom teraz premyslam, to bolo dost desive.
    effects: { trust_simona: "+5" }
    choices:
      - Ask about LimeTatra -> simona_limetatra
      - Move on -> quest1_hub

  simona_limetatra:
    type: message
    text: >
      SIMONA: Ten lom je tu od osemdesiatych rokov. Taziu vapenec na
      stavebne materialy. Obec to tolerovala kvoli pracovnym miestam.
      Ale jaskyniari sa stazuju uz roky — praskliny v tuneloch,
      vibracne skody, prach v podzemnych vodach.

      Lukas bol prvy kto isiel dole s kamerou a dokumentoval to.
      Mal fotky, mal merania, mal doklady. Ze odstrelovanie poskodzuje
      jaskynny system.

      Dva tyzdne na to zmizol. Do pice, to predsa nemoze byt nahoda.
    effects: { trust_simona: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jozef (forester, heard the blasting) ---

  jozef_intro:
    type: tweet
    from: jozef
    text: >
      tridsiat rokov v tychto lesoch. vibracne od lomu su silnejsie nez
      kedykolvek. @lukas_novak mal pravdu. a teraz je prec. zamyslite sa.
    effects: { trust_jozef: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jozef -> jozef_talk

  jozef_talk:
    type: message
    text: >
      JOZEF: V tychto lesoch som tridsiat rokov. Poznam kazdy strom,
      kazdy potok, kazdu jaskynnu dychavicu. A hovorim ti — tie
      odstrely su silnejsie nez kedykolvek. Lom LimeTatry sa rozsiril.
      Odstreluju blizsie k jaskynnemu systemu nez povoluje zakon.

      Lukas robil merania. Isiel do jaskyni s vibracnym snimacom.
      Dokumentoval praskliny. Zhromazdoval doklady. Bol tesne pred
      tym aby to zverejnil.

      A potom — zmizol. Vole, myslis ze tomu verim? Ze sa len tak
      stratil v horach? Lukas pozna tieto jaskyne lepsie nez
      hocikto zivy.
    effects: { trust_jozef: "+10" }
    choices:
      - Did you see anything unusual recently? -> jozef_night
      - Move on -> quest1_hub

  jozef_night:
    type: message
    text: >
      JOZEF: Noc predtym nez zmizol — obchadzal som les okolo jedenastej.
      Videl som svetla pri vstupe do severneho tunela. Nie cielky,
      dobre som videl. Baterky. Dvaja, mozno traja ludia.

      Jeden z nich mal kluece od prevadzkovej brany lomu LimeTatry.
      Poznam ten zvuk — specificke kovove klucenie. A potom som pocul
      hlas. Lukasov hlas. Povedal nieco ako "nechajte ma na pokoji."

      Nenapadalo mi co s tym. Teraz nad tym premyslam neustale.
    effects: { trust_jozef: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nina (teen climber, witness tease) ---

  nina_intro:
    type: tweet
    from: nina
    text: >
      kurva co sa deje @lukas_novak je ten najlepsi clovek v tejto
      dedine on ma naucil liezst on ma naucil respektovat jaskyne
      nieco sa stalo a nikto nic nerobi do pice
    effects: { trust_nina: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Nina -> nina_talk_early

  nina_talk_early:
    type: message
    text: >
      NINA: ty si tu novy? hrozne nacasovanie vole. fakt lukas je
      najlepsi na svete. naucil nas lezenie po skalach, vodil nas
      do jaskyni, ukazoval nam stalaktity a vsetko. strasne cool.

      a teraz sa bojim lebo dominik videl nieco divne pri vstupe
      do jaskyni ale nechce o tom hovorit. hovori ze to nic nebolo
      ale kurva ja viem ze nieco bolo
    effects: { trust_nina: "+10" }
    choices:
      - What did Dominik see? -> nina_dominik_hint
      - Move on -> quest1_hub

  nina_dominik_hint:
    type: message
    text: >
      NINA: presne neviem. bol na bike pri jaskyniach a videl
      niekoho kto nieco robil pri lukasovom aute?? alebo nieco
      take. flipuje z toho a nechce o tom hovorit. musit sa ho
      spytat priamo ale je podozrievavy voci ludom co nepozna.
      najprv skus hovorit o bikoch s nim lol

      co za picovinu sa to tu deje
    effects: { trust_nina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Demanovske Jaskyne. A Slovak mountain
      village built around a cave system. A cave guide who was exposing
      quarry damage. A disappearance nobody believes is an accident.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Petra (Lukas's girlfriend) -> petra_q1
      - Talk to Marek (Lukas's best friend) -> marek_q1
      - Check what Zuzana (Lukas's sister) is saying -> zuzana_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Petra Q1 ---

  petra_q1:
    type: tweet
    from: petra
    text: >
      ak ma niekto spravy o @lukas_novak zavolajte mi prosim. jeho
      veci su v byte. jeho jaskyniarska vystroj je tam. nikdy by
      neodisiel bez nej.
    effects: { trust_petra: "+5", contacts_followed: "+1" }
    choices:
      - DM Petra -> petra_q1_talk

  petra_q1_talk:
    type: message
    text: >
      PETRA: Dakujem ze si napisal ale nepoznam ta. Lukas ma vela
      priatelov tu. Urcite sa vrati.

      ...Stale to opakujem. Uz tomu neverim.

      [Petra is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_petra: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marek Q1 ---

  marek_q1:
    type: tweet
    from: marek
    text: >
      Lukas pozna kazdy meter tychto jaskyni. NESTRATI SA. Uz 15 rokov
      chodime spolu pod zem. Nieco sa stalo a ja to zistim.
    effects: { trust_marek: "+5", contacts_followed: "+1" }
    choices:
      - DM Marek -> marek_q1_talk

  marek_q1_talk:
    type: message
    text: >
      MAREK: Kto si? Dalsi clovek z dediny co mi bude hovorit nech
      sa ukludnim? Moj najlepsi kamarad mi volal noc predtym nez
      zmizol. Povedal ze ma nieco velke. Povedal "keby sa nieco
      stalo, pozri sa na LimeTatru." Potom zavesil.

      To je posledne co som od neho pocul. Kurva, to nemoze byt
      normalne.
    effects: { trust_marek: "+10" }
    choices:
      - What do you think happened? -> marek_theory
      - Move on -> quest1_hub

  marek_theory:
    type: message
    text: >
      MAREK: Myslim ze nasiel dokaz ze LimeTatra svojim odstrelovanim
      nicim jaskynny system a oni ho umlcali. Ale taky myslim ze
      ten creepy fotograf — Viktor — vie viac nez hovori. Sposob
      akym sa na Lukasa pozeral... to nebolo normalne. To nebolo
      len o fotografii.

      Lukas mi pred mesiacmi hovoril ze ho niekto sleduje v jaskyniach.
      Ze pocuva kroky za sebou. Ze vidi svetlo baterky za zatacikou.
      Myslel ze sa mu to zda. Ja si nemyslim ze sa mu to zdalo.
    effects: { trust_marek: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Zuzana Q1 ---

  zuzana_q1:
    type: tweet
    from: zuzana
    text: >
      moj brat ZMIZOL a policajti mi hovoria ze sa asi stratil na
      turistike??? ON SA NESTRATI. idem z liptaku. niekto mi
      vysvetli co sa tu deje.
    effects: { trust_zuzana: "+5", contacts_followed: "+1" }
    choices:
      - DM Zuzana -> zuzana_q1_talk

  zuzana_q1_talk:
    type: message
    text: >
      ZUZANA: Kto si ty? Dalsi co mi bude hovorit ze sa mam ukludnit?
      Moj brat mi volal noc predtym nez zmizol. Povedal ze ma nieco
      velke. Povedal "keby sa nieco stalo, pozri sa na LimeTatru."
      A potom povedal este nieco — "a on tam bol zase. Stale tam je."

      Nechcela povedat kto "on" je. Hlas sa mu trasol.
    effects: { trust_zuzana: "+10" }
    choices:
      - What do you think "he" means? -> zuzana_theory
      - Move on -> quest1_hub

  zuzana_theory:
    type: message
    text: >
      ZUZANA: Neviem presne. Ale Lukas mi pred dvoma mesiacmi
      hovoril o nejakom fotografovi co ho sleduje. Vsade kde isiel,
      ten chlap tam bol. V jaskyniach, na chodnikoch, aj v obci.
      S fotoaparatom namiernym na neho.

      Lukas mu povedal nech prestane. Neprestal. Lukas mu napisal
      spravu. Ziadna odpoved. Len dalsia fotka Lukasa zdialky.

      Do pice, to je stalkingovy spravanie. A policajti to ignoruju.
    effects: { trust_zuzana: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Lukas went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Dominik (was biking near the caves) -> dominik_interview
      - Find Tibor (pension owner, works late) -> tibor_interview
      - Find Roman (speleologist, early morning at the cave entrance) -> roman_interview
      - Find Eva (pharmacist, starts early, saw something) -> eva_interview

  # --- Dominik (saw someone at Lukas's car) ---

  dominik_interview:
    type: tweet
    from: dominik
    text: >
      dobra session dnes ale ta atmosfera pri jaskyniach je divna
      v poslednom case. kurva nieco je zle. neviem vysvetlit
    effects: { trust_dominik: "+5" }
    choices:
      - Ask Dominik about that evening -> dominik_talk

  dominik_talk:
    type: message
    text: >
      DOMINIK: vole ok ale nikomu to nehovor. bol som na bike pri
      jaskyniach okolo siedmej vecer. a videl som toho fotografa —
      viktora — pri lukasovom aute. vyzeral ze v nom nieco hlada
      alebo nieco tam dava. ked ma zbadal odisiel mega rychlo.

      ja som nic nepovedal lebo som nechcel problemy ale kurva
      teraz je to vazne. to nie je normalne jeho spravanie
    effects:
      trust_dominik: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
