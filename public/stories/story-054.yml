    text: >
      Viktor doesn't reply for a long time. Then:

      VIKTOR: Nerozumies. Chranil som ho. Bol v nebezpecenstve kvoli
      LimeTatre a nechcel prijat pomoc. Musel som vediet ze je v
      bezpeci. Vsetko co som robil bolo preto ze mi na nom zalezi.

      To nie je starostlivost. To je obsedsija.

      Dokazy si uz poslal Majorovi Horvathovi. A Stefanovi Halasovi.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Major Horvath reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the
      witness testimonies — Viktor is arrested for stalking and
      harassment. A GPS tracker is recovered from under Lukas's
      car at the old mountain cabin below the pass.

      Stefan Halas, finally in possession of Lukas's full evidence
      package, publishes the LimeTatra story in SME. The inspektorat
      zivotneho prostredia orders an unannounced inspection. The
      quarry is shut down pending environmental remediation. Andrej
      Kovac faces criminal charges for operating without proper EIA
      and damaging a protected natural monument.

      And Lukas Novak, reading the story from a friend's house in
      Martin, calls his sister for the first time in nine days.

      "Idem domov."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: lukas
    text: >
      jaskyne neklamou. a ludia z demanoviec tiez nie.
      dakujem ze ste to nevzdali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Andrej (Partial Ending) ---

  confront_andrej:
    type: message
    text: >
      You present the quarry evidence to Andrej Kovac:

      "I have photographs of cracks in the cave system correlating
      with your blasting schedule. I have vibration measurements
      ten times over legal limits. I have your original inspection
      reports showing the data was falsified. I have GPS coordinates
      of damage inside the protected zone."
    choices:
      - Send -> andrej_response

  andrej_response:
    type: message
    text: >
      ANDREJ: Tato konverzacia sa preposiela nasmu pravnemu
      oddeleniu. Akekolvek zverejnenie difamacnych materialov
      bude mat za nasledok okamzite pravne kroky. LimeTatra
      vzdy prevadzkovala v sulade s regulacnymi poziadavkami.

      Ale je neskoro. Dokazy si poslal Stefanovi, Strazcom
      Jaskyni aj na inspektorat.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The quarry story breaks. LimeTatra is ordered to halt all
      blasting pending investigation. The quarry may close
      permanently. Stopadesiat pracovnych miest visi na vazach.
      Obec je rozdelena.

      But Lukas?

      Without the stalking evidence, Viktor is never investigated.
      He continues to roam the caves with his camera. He creates a
      new anonymous account. He finds new ways to track.

      Three months later, Lukas reads about LimeTatra online. He
      returns quietly. He changes his routes. He stops going
      underground alone. He checks his car every morning.

      The corporation is exposed. But the person who terrorised
      Lukas walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: lukas
    text: "som spat. jaskyne su v bezpeci. zvysok... uvidime."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_jan:
    type: message
    text: >
      You confront Mayor Gaborik with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> jan_response

  jan_response:
    type: tweet
    from: daniela
    text: >
      Nas klient berie na vedomie vase obvinenia. Akekolvek verejne
      sirenie difamacnych vyrokov bude mat za nasledok okamzite
      pravne kroky. — Kancelaria Oravcova & Partneri, Banska Bystrica
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Gaborik and LimeTatra's blasting — and there
      isn't one beyond political protection — your evidence is
      insufficient.

      LimeTatra continues to operate. Viktor continues to follow.
      Lukas stays in hiding.

      Six months later, @brano_tichak creates a new account.
      It follows Lukas's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

