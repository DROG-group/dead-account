      The car that took Kasia — I checked the fleet records. That
      vehicle is not ours. It belongs to the Katowice regional
      command. Someone from above sent people to collect her.

      This was not local. Someone higher than Kaczmarek is involved.
      The videos Kasia had would embarrass people at the regional
