      The internal investigation interviewed none of the witnesses.
      They reviewed only the police body cameras — which conveniently
      "malfunctioned" during the three key incidents.

      Three body cameras failing simultaneously. What are the odds?

      Kasia was building a complaint to the prosecutor's office.
      She had the videos, my photos, witness statements from six
      protesters. She was two days from filing when she disappeared.

      The complaint would have named Komendant Kaczmarek personally.
      He gave the order to clear the square "by any means necessary."
