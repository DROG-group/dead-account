  protest_records:
    type: message
    text: >
      Kasia's original protest footage showed three specific incidents:

      1. An officer striking a seated protester with a baton
      2. An elderly man dragged 15 metres across cobblestones
      3. An officer removing his badge number before entering the crowd

      All three videos have been deleted from her account. But the
      videos were shared widely before deletion — cached copies exist
      on other platforms. And Bartosz's photographs corroborate every
      frame.

      The three officers identified in the footage have not been
      disciplined. The internal investigation found "conduct within
      guidelines."
    effects:
      misconduct_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to misconduct thread -> misconduct_hub

