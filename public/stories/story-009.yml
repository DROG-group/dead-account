  ending_a:
    type: message
    text: >
      ENDING A: THE TRUTH DOES NOT BLINK

      The national prosecutor opens an investigation. The Ombudsman
      issues an emergency intervention. National media arrives in
      Brzeziny within hours.

      Kasia is located at a regional police facility in Katowice.
      She has been held for nine days without charge, without access
      to a lawyer, without a court appearance. This is illegal under
      Polish law and the European Convention on Human Rights.

      She is released. Komendant Kaczmarek is suspended. The regional
      commander who ordered the operation is placed under investigation.
      Dorota Lewandowska resigns. The troll company contract is
      published on the front page of every newspaper in Poland.

      The protest videos are restored from Kasia's backup drives. All
      three officers face criminal charges.

      Kasia walks out of the police building in Katowice and calls
      her father.

      "Tata, I'm free. I didn't sign anything."
    choices:
