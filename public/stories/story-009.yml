  # --- Agnieszka Rights ---

  agnieszka_rights:
    type: message
    text: >
      AGNIESZKA: Under Polish law, a detention must be recorded. The
      detained person must be informed of the reason. They have the
      right to a lawyer. They must be brought before a court within
      48 hours.

      None of this happened. There is no record. There is no
      court appearance. This is not a detention — this is a
      disappearance.

      I have filed a complaint with the prosecutor's office in
      Katowice. I have filed a complaint with the Ombudsman. I have
      contacted the Helsinki Foundation for Human Rights.

      If you have the witness testimony and the video evidence, I can
      build a case that will reach the national level.
    effects:
