      them. Because I was cleverer than them.

      Kasia is cleverer than the komendant. She made copies. She
      always made copies. If her laptop is gone, there are copies
      somewhere. She told me "Babcia, the truth always has a backup."

      I think she gave something to her theater friends. The theater
      is full of hiding places. Zofia would know. Ask Zofia about
