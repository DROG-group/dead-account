entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN BRZEZINY
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to brzeziny.social — the community Mastodon instance for
      Brzeziny, a small town in Silesia, Poland. Industrial past, trying
      to find its future.

      The local feed is on fire. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      One name dominates everything: @kasia_dokumentuje.

      A theater student who became the town's most important independent
      journalist. She livestreamed protests, documented police conduct,
      and had 12,000 followers. She hasn't posted in nine days.

      Except — her account posted something three days ago.
    choices:
      - Look at her profile -> kasia_profile

  kasia_profile:
    type: tweet
    from: kasia
    text: "I want to apologize. Some of my previous posts contained inaccuracies. I have removed them. I'm taking a break to reflect."
    choices:
      - That doesn't sound like her... -> dead_post

  dead_post:
    type: message
    text: >
      Everyone who knows Kasia says the same thing: she did not write
      that retraction. Kasia does not apologize for documented facts.
      Kasia does not "reflect." Kasia films, edits, and publishes.

      Her father says her phone is off. Her grandmother hasn't heard
      from her. Twenty-three of her archived protest videos have been
      deleted from her account. Someone with access to her account is
      removing evidence.
    choices:
      - Read the police statement -> police_statement
      - See what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: policja
    text: >
      The Brzeziny police have received a report regarding a local
      resident. The individual posted on social media three days ago
      indicating she is taking personal time. There is no evidence
      of criminal activity.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The response is explosive. Kasia's friends are organizing search
      parties. Her father Marek is at the police station every day.
      Babcia Halina is posting in capital letters. The theater company
      hung a banner: "WHERE IS KASIA."

      And an anonymous account, @rafal, has been flooding the feed
      with posts attacking Kasia: "Liar." "Provocateur." "She got
      what she deserved."

      The same kind of language that filled Kasia's inbox for months.
    effects: { trust_marek: "+5", trust_halina: "+5" }
    choices:
      - Start following Kasia's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Brzeziny. A town where a protest journalist
      documented what the authorities wanted hidden. Follow her
      contacts and understand what she found.
    choices:
      - Talk to Kamil at the cafe -> kamil_intro
      - Talk to Babcia Halina -> halina_intro
      - Check what the teens are saying -> kuba_intro
      - Browse the feed -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is a battleground. Pro-Kasia hashtags vs troll accounts.
      Everyday posts about church schedules and market hours. And
      underneath it all, a deep unease about what happens when you
      challenge authority in a small Polish town.

      Key names: Marek (father, angry), Zofia (theater director,
      mentor), Tomasz (journalist, working the story), Agnieszka
      (lawyer, knows the legal side), Bartosz (photographer, was
      with Kasia at the protests).
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Kamil -> kamil_intro
      - Talk to Babcia Halina -> halina_intro
      - Check the teens -> kuba_intro

  # --- Kamil (social map) ---

  kamil_intro:
    type: tweet
    from: kamil
    text: >
      Kawiarnia is open. The table where Kasia always sat with her
      laptop is empty. Come in. We need to talk.
    effects: { trust_kamil: "+5", contacts_followed: "+1" }
    choices:
      - Talk to Kamil -> kamil_talk

  kamil_talk:
    type: message
    text: >
      KAMIL: You're new? Sit. Coffee is on the house.

      Kasia was the bravest person in this town. Two months ago there
      was a protest in the square — workers from the closed factory.
      The police response was... disproportionate. Kasia filmed
      everything. Baton strikes on people with their hands up. An
      elderly man dragged across the cobblestones. All of it on camera.

      She published the videos. They went viral. The komendant — Pawel
      Kaczmarek — called them "manipulated footage." But everyone who
      was there knows what happened.

      Then the threats started. Anonymous accounts. Coordinated. The
      same talking points, the same insults. Professional trolling.
    effects: { trust_kamil: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the komendant -> kamil_komendant
      - Ask about the troll accounts -> kamil_trolls
      - Move on -> quest1_hub

  kamil_komendant:
    type: message
    text: >
      KAMIL: Pawel Kaczmarek has been komendant for eight years. He
      runs the station like his private army. Before the protest, he
      was unremarkable. After Kasia's videos, he became defensive,
      aggressive. He gave a press conference calling the protesters
      "provocateurs" and Kasia a "threat to public order."

      Then Dorota Lewandowska — the vice-mayor — backed him publicly.
      Said the videos were "taken out of context." The context being:
      people being beaten by police.

      Kasia had evidence that the order to use force came directly
      from Kaczmarek. She had radio recordings from a scanner app.
    effects: { trust_kamil: "+5" }
    choices:
      - Ask about the trolls -> kamil_trolls
      - Move on -> quest1_hub

  kamil_trolls:
    type: message
    text: >
      KAMIL: After the protest videos went viral, Kasia's inbox
      exploded. Hundreds of messages. Death threats. Rape threats.
      Accounts calling her a "foreign agent," a "traitor."

      The accounts were coordinated. Same language, same timing,
      same hashtags. Not random trolls — organized harassment. Kasia
      documented the patterns. She was building a case that the troll
      campaign was connected to the police or the city administration.

      She found something. She told me she found the connection.
      Then she disappeared.
    effects: { trust_kamil: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Babcia Halina ---

  halina_intro:
    type: tweet
    from: halina
    text: >
      MY GRANDDAUGHTER IS MISSING. I AM 87 YEARS OLD AND I SURVIVED
      THE COMMUNISTS AND I WILL NOT BE SILENT. KASIA IF YOU CAN READ
      THIS BABCIA IS LOOKING FOR YOU.
    effects: { trust_halina: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Babcia Halina -> halina_talk

  halina_talk:
    type: message
    text: >
      HALINA: You want to help? Good. Because nobody else is helping.
      The police say she left voluntarily. The police are the ones
      she was investigating. Do you see the problem?

      Kasia is my heart. She visits every Sunday. She brings pierogis.
      She films my stories about the old times. She said "Babcia,
      someone has to remember."

      Last Sunday she did not come. She has NEVER missed a Sunday.
      Not in twenty-one years. Something is very wrong.
    effects: { trust_halina: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Kuba (teen witness) ---

  kuba_intro:
    type: tweet
    from: kuba
    text: >
      elo siema ktos wie co sie dzieje z kasia?? jest kozak i nikt
      nic nie robi. maja plakala caly dzien. olek ma jakies screeny.
      #JestesmyZKasia
    effects: { trust_kuba: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kuba -> kuba_talk

  kuba_talk:
    type: message
    text: >
      KUBA: siema! nara za nudna wiadomosc ale muszę gadac. kasia
      to mega spoko osoba. uczy nas w teatrze i na protestach.
      pokazala nam jak filmowac zeby bylo dowodem.

      maja ma cos waznego ale boi sie. mów z nia. olek ma screeny
      trolli — poznal jeden z kont bo typo uzywal tego samego nicka
      co w grach online xD taki ogar.

      i slyszalem od kolegi ze ktos widzial kasie wsiadajac do
      radiowozu tydzien temu. nie wiem czy to prawda ale luzik
      nie jest.
    effects: { trust_kuba: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      Brzeziny is a town where filming the truth makes you an enemy.
      Kasia documented police violence. Now she's gone and her account
      is posting retractions she didn't write.
    choices:
      - Talk to Marek (Kasia's father) -> marek_q1
      - Talk to Zofia (theater director) -> zofia_q1
      - Talk to Bartosz (protest photographer) -> bartosz_q1
      - I'm ready to investigate the night she vanished -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Marek Q1 ---

  marek_q1:
    type: tweet
    from: marek
    text: >
      9 days. My daughter is gone 9 days. The police who she
      investigated are "investigating" her disappearance. This is
      not justice. This is a joke.
    effects: { trust_marek: "+5", contacts_followed: "+1" }
    choices:
      - DM Marek -> marek_q1_talk

  marek_q1_talk:
    type: message
    text: >
      MAREK: You want to help? Everyone says they want to help. Then
      they meet the komendant and suddenly they're busy.

      My daughter was not afraid. She should have been but she wasn't.
      She filmed things that powerful people wanted hidden. She
      received death threats and kept filming.

      The night before she disappeared, she came to the workshop. She
      said "Tata, I found the link. I know who's behind the trolls."
      She was excited. Not scared — excited. Like she'd solved
      something big.

      I told her to be careful. She said "I'm always careful."

      That was the last time I saw her.
    effects: { trust_marek: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Zofia Q1 ---

  zofia_q1:
    type: tweet
    from: zofia
    text: >
      Teatr Maly cancels this week's performance. We cannot perform
      while our heart is missing. Kasia IS this theater. We are not
      moving on. We are waiting.
    effects: { trust_zofia: "+5", contacts_followed: "+1" }
    choices:
      - DM Zofia -> zofia_q1_talk

  zofia_q1_talk:
    type: message
    text: >
      ZOFIA: Kasia was the most talented student I've had in thirty
      years. But her real gift wasn't acting — it was seeing. She
      looked at things others turned away from.

      She used theater techniques for her journalism. Framing,
      perspective, the power of witness. She said the camera was
      her stage and the truth was her script.

      The retraction they posted from her account — I know her writing.
      Every sentence. That is not her voice. Those words were written
      by someone who thinks in legal disclaimers, not theater.
    effects: { trust_zofia: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Bartosz Q1 ---

  bartosz_q1:
    type: tweet
    from: bartosz
    text: >
      I was with Kasia at every protest. My photos, her video. We
      documented everything together. Now my photos are the only
      record left — they deleted all her videos.
    effects: { trust_bartosz: "+5", contacts_followed: "+1" }
    choices:
      - DM Bartosz -> bartosz_q1_talk

  bartosz_q1_talk:
    type: message
    text: >
      BARTOSZ: My press card is number 4477. I've covered protests
      across Silesia. What happened in Brzeziny two months ago was
      the worst police response I've ever seen.

      Kasia's videos showed three specific officers using excessive
      force. Badge numbers visible. Faces clear. That's why her
      videos had to disappear. Someone is destroying evidence of
      police brutality.

      I have my photographs, but video is harder to deny than photos.
      Kasia's originals were on her hard drive at home. If that
      drive still exists, it's the key to everything.
    effects: { trust_bartosz: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Kasia was last seen leaving Kawiarnia Pod Lipami at 22:00 on a
      Thursday. She was working on her laptop. She packed up, said
      goodbye to Kamil, and walked toward her apartment three blocks
      away. She never arrived.

      Collect witness accounts. You need at least 4.
    choices:
      - Find Maja (was texting Kasia that night) -> maja_interview
      - Find Olek (saw something from his window) -> olek_interview
      - Find Ewa (was leaving the school late) -> ewa_interview
      - Find Anna (librarian, closing up next door) -> anna_interview

  # --- Maja (texting) ---

  maja_interview:
    type: tweet
    from: maja
    text: >
      ja pisalam z kasia tamtej nocy. ostatnia wiadomosc o 22:17.
      napisala "ktos za mna idzie" i juz nic. nic nic nic.
    effects: { trust_maja: "+5" }
    choices:
      - Ask Maja about the messages -> maja_talk

  maja_talk:
    type: message
    text: >
      MAJA: pisalysmy normalnie. o teatrze, o nowym monologu co
      pisala. a potem nagle:

      22:15 — "wychodzę z kawiarni, jutro pogadamy"
      22:16 — "czekaj"
      22:17 — "ktos za mna idzie"

      i cisza. pisalam do niej 50 razy. nic. dzwonilam. telefon
      wylaczony.

      to nie jest tak ze kasia po prostu wyjechala. kasia by mi
      napisala. kasia pisze do mnie CODZIENNIE. od trzech lat.
      codziennie. i teraz nic.

      mam cos. kasia dala mi pendrive tydzien wczesniej. powiedziala
      "trzymaj to. jak mi sie cos stanie, daj tomaszowi z gazety."
      jeszcze go nie otwieram. boje sie.
    effects:
      trust_maja: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Olek (saw the car) ---

  olek_interview:
    type: tweet
    from: olek
    text: >
      elo mowie wam widzialem cos z okna. bialy fiat z policji
      stanal na ulicy kolo kawiarni o 10 wieczorem. gadzio wyglądal
      jakby czekal. potem odjechali z kims
    effects: { trust_olek: "+5" }
    choices:
      - Ask Olek what he saw -> olek_talk

  olek_talk:
    type: message
    text: >
      OLEK: siema. to tak bylo — siedze w oknie bo gram, i widze
      bialy fiat tipo na ulicy. oznakowany policyjny. stanal pod
      kawiarnia. dwoch gości w srodku. czekali.

      potem kasia wychodzi z kawiarni. idzie w strone domu. a ci
      z auta wychodzą i ida za nia. szybko. ona sie odwraca i mówi
      cos. oni ja biorą za rece. ona sie szarpie. wsadzaja ja do
      auta. odjezdzaja.

      to bylo szybkie. moze 30 sekund. zadnych swiatel. zadnych
      syren. po prostu wsadzili ja i odjechali.

      nagrałem na telefon ale slaba jakosc. ciemno. ale widac auto.
      widac numery rejestracyjne.
    effects:
      trust_olek: "+15"
      night_witnesses: "+1"
      misconduct_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Continue investigating -> quest2_hub

  # --- Ewa (heard the commotion) ---

  ewa_interview:
    type: tweet
    from: ewa
    text: >
      I was in the school until late, preparing exams. I heard
      something outside that I cannot stop thinking about.
    effects: { trust_ewa: "+5" }
    choices:
      - Ask Ewa what she heard -> ewa_talk

  ewa_talk:
    type: message
    text: >
      EWA: Around quarter past ten I heard a woman's voice on the
      street. Raised, angry. She said — and I remember this exactly —
      "You can't do this. I know my rights."

      Then a man's voice, calm and official: "Come with us. Don't
      make this difficult."

      Then car doors. An engine. Silence.

      I went to the window but the street was empty. I told myself
      it was nothing. A domestic dispute, perhaps. Now I know it
      was not nothing.

      The voice was Kasia's. I teach her. I know her voice.
    effects:
      trust_ewa: "+10"
      night_witnesses: "+1"
      misconduct_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Anna (saw the plates) ---

  anna_interview:
    type: tweet
    from: anna
    text: >
      I was closing the library. I saw the car. I noted the
      registration number. It is what librarians do — we record things.
    effects: { trust_anna: "+5" }
    choices:
      - Ask Anna what she recorded -> anna_talk

  anna_talk:
    type: message
    text: >
      ANNA: I was locking the library door at 22:10. A marked police
      car was parked on the street. I noted the registration because
      it was unusual — the plate format was from the Katowice district,
      not Brzeziny. Our local cars have different numbers.

      I saw two officers. Plain clothes but with police identification
      visible. They were waiting.

      When Kasia came out of the cafe, they approached her. She
      resisted. They put her in the car. It drove toward the police
      station but turned before reaching it — heading out of town
      on the Katowice road.

      I have the registration number. It does not belong to any
      vehicle in the Brzeziny police fleet.
    effects:
      trust_anna: "+15"
      night_witnesses: "+1"
      misconduct_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.

      Keep collecting testimonies.
    choices:
      - Find Maja -> maja_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Olek -> olek_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Ewa -> ewa_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Anna -> anna_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Talk to Agnieszka (the lawyer) -> agnieszka_early
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Agnieszka early ---

  agnieszka_early:
    type: message
    text: >
      AGNIESZKA: I have represented protest detainees in Brzeziny.
      Kasia's situation is different. She wasn't arrested — there's
      no arrest record. She wasn't detained — there's no detention
      record. She wasn't charged — there's no charge.

      According to every official database I can access, Kasia
      Kowalska has not had any interaction with the police since
      a traffic stop three years ago.

      But multiple witnesses saw police put her in a car. That means
      either those witnesses are lying — which I don't believe — or
      someone is erasing records.
    effects:
      trust_agnieszka: "+10"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Timeline Assembly ---

  quest2_timeline:
    type: message
