    text: >
      Dace doesn't reply for a long time. Then:

      DACE: Tu nesaproti. Es viņu aizsargāju. Viņa bija briesmās
      no būvfirmas un viņa neļāva man palīdzēt. Man vajadzēja
      zināt, ka viņa ir drošībā. Viss, ko es darīju, bija tāpēc,
