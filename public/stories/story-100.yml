  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The coastal destruction story breaks. BalticBuild is ordered
      to halt construction pending investigation. The resort may
      never be built. One hundred fifty promised jobs evaporate.
      The village is divided.

      But Aija?

      Without the stalking evidence, Dace is never investigated.
      She continues to walk the same beaches. She continues to
      monitor Aija's accounts. She creates a new anonymous profile.

      Three months later, Aija reads about BalticBuild online.
      She returns quietly. She changes her routes. She stops
      fishing alone. She checks her car every morning.

      The corporation is exposed. But the person who terrorised
      Aija walks free.
    choices:
