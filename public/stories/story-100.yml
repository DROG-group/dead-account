  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Inspektors Vanags reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the home intrusions, the
      witness testimonies — Dace is arrested for stalking and
      harassment. A GPS tracker is recovered from under Aija's car
      at the old fishing huts near Smilšukāpa.

      Zane Puriņa, finally in possession of Aija's full evidence
      package, publishes the BalticBuild story in Latvijas Avīze.
      The VARAM orders an unannounced inspection. The construction
      site is shut down pending environmental remediation. Normunds
      Lācis faces criminal charges for falsifying environmental
      impact assessments.

      And Aija Ozoliņa, reading the story from a friend's house in
      Cēsis, calls her sister for the first time in eight days.

      "Es braucu mājās."
    choices:
