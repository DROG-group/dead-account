entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN JŪRASKRASTI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Juraskrasti.social — the community Mastodon instance for
      the coastal village of Jūraskrasti, on the Vidzeme shore of Latvia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see one name repeated everywhere:
      @aija_ozolina.

      A fisherwoman. Coastal photographer. She documented the shoreline
      and the sea. People are worried. She hasn't posted in five days.
    choices:
      - Look at her profile -> aija_profile

  aija_profile:
    type: tweet
    from: aija
    text: "Jūraskrastu krasts sabrūk. Būvniecība iznīcina kāpas. Man ir pierādījumi."
    choices:
      - That's her last real post... -> grey_sea

  grey_sea:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a grey sea. Blurred, overexposed, shot from a strange angle.
      Posted at 3am. No caption.

      Her friends say that's not her style. The police say she probably
      went travelling. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: policija
    text: >
      Esam saņēmuši ziņojumu par Jūraskrastu iedzīvotāju. Šobrīd
      nekas neliecina par noziedzīgu nodarījumu. Visa noderīgā
      informācija var tikt ziņota pa tālruni 110 vai vietējā
      policijas iecirknī.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her sister @marta_ozolina is
      desperate. Her best friend @kristaps_berzins is posting furious
      messages. Her colleague @sandra_kalnina is asking for any
      information. The fisherman @janis_kalejs says she was right
      about the coastline.

      And the journalist @zane_purina is strangely silent.

      Nobody buys the police's line. Nobody thinks Aija just
      "went travelling."
    effects: { trust_marta: "+5", trust_kristaps: "+5" }
    choices:
      - Start following Aija's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Jūraskrasti. Follow Aija's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Biruta (café owner, knows everyone) -> biruta_intro
      - Talk to Jānis (fisherman, saw the coast change) -> janis_intro
      - Talk to Laima (teen, seems shaken) -> laima_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Aija with the rhythms of a small
      Vidzeme coastal village: weather warnings, fishing reports,
      mushroom season updates, sunset photos.

      Key names surface: Mārta (sister, paramedic), Kristaps (best
      friend, boat builder, furious), Sandra (marine biologist
      colleague, rattled), and the teens — Laima, Edgars, Elīna —
      who loved Aija's coastal nature courses.

      Also prominent: BalticBuild SIA, the construction company
      building a resort development on the dunes. Their posts are
      corporate PR. Aija's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Biruta -> biruta_intro
      - Talk to Jānis -> janis_intro
      - Talk to Laima -> laima_intro

  # --- Biruta (social map) ---

  biruta_intro:
    type: tweet
    from: biruta
    text: >
      Kafejnīca ir atvērta, bet sirds ir smaga. @aija_ozolina, tavs
      galdiņš gaida. Nāc mājās.
    effects: { trust_biruta: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Biruta -> biruta_talk

  biruta_talk:
    type: message
    text: >
      BIRUTA: Ak, tu esi jauns te? Laipni lūgti. Slikts laiks, lai
      ierastos. Visi ir nervozi par Aiju.

      Es tev pastāstīšu, kas ir kas. Mārta ir Aijas māsa — feldšere
      ambulancē. Laba meitene, tagad pilnīgi sagrauta. Kristaps
      Bērziņš ir Aijas labākais draugs, laivbūvētājs. Viņi pazīst
      viens otru kopš bērnības. Sandra Kalniņa strādā piekrastes
      stacijā ar Aiju. Gudra sieviete.

      Un tad ir šī Dace Skujiņa. Fotogrāfe no Rīgas. Ieradās te
      pirms pusgada. Nāk uz visām Aijas ekskursijām. Vienmēr tajā
      pašā galdiņā kafejnīcā. Aija man reiz teica: "tā sieviete
      man neļauj mierā."

      Un turi tālāk no BalticBuild reklāmām. Meli, kas iesaiņoti
      ISO sertifikātos.
    effects: { trust_biruta: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Dace -> biruta_dace
      - Ask about BalticBuild -> biruta_balticbuild
      - Thank her and move on -> quest1_hub

  biruta_dace:
    type: message
    text: >
      BIRUTA: Dace? Viņa ieradās pagājušajā pavasarī. Teica, ka
      ir dabas fotogrāfe, grib sadarboties ar Aiju. Aija bija
      pieklājīga, bet es redzēju, ka viņai bija neērti. Dace bija
      vienmēr tur, kur Aija. Tajā pašā pludmalē, tajā pašā takā.

      Reiz Aija ienāca kafejnīcā un teica "sūds, tā seko man
      visur." Es domāju, ka viņa pārspīlē. Tagad vairs neesmu
      pārliecināta.

      Un Daces profils — @dace_skujina — tur ir tikai Aija. Katrs
      attēls, katra ekskursija. Tas ir bļe creepy.
    effects: { trust_biruta: "+5" }
    choices:
      - Ask about BalticBuild -> biruta_balticbuild
      - Move on -> quest1_hub

  biruta_balticbuild:
    type: message
    text: >
      BIRUTA: BalticBuild SIA. Viņi ieradās pirms diviem gadiem.
      Grib būvēt kūrorta kompleksu kāpās. Teica, ka tas ir
      ilgtspējīgs — tūrisms, darbavietas, attīstība.

      Bet zvejnieki redzēja, kas notiek. Kāpas sabrūk. Krasts
      erodē. Pludmale pazūd. Būvniecības tehnika iznīcina dabisko
      aizsardzību.

      Aija bija pirmā, kas aizgāja tur ar kameru un mērījumiem.
      Viņai bija pierādījumi — reāli pierādījumi. Divas nedēļas
      vēlāk viņa pazuda.
    effects: { trust_biruta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jānis (the coast, witness tease) ---

  janis_intro:
    type: tweet
    from: janis
    text: >
      četrdesmit piecus gadus esmu zvejojis šajā krastā. krasts
      vairs nav tāds pats. @aija_ozolina bija taisnība. un tagad
      viņa ir pazudusi. domājiet paši.
    effects: { trust_janis: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jānis -> janis_talk

  janis_talk:
    type: message
    text: >
      JĀNIS: Es esmu zvejojis šo krastu kopš piecpadsmit gadu
      vecuma. Es zinu katru līci, katru straumi, katru smilšu
      krāsu. Un es tev saku — krasts pie būvlaukuma ir iznīcināts.
      Kāpas sabrūk. Pludmale pazūd katru vētru.

      Aija mērīja krastu katru mēnesi. Viņa dokumentēja eroziju.
      Viņa fotografēja visu. Viņa būvēja lietu. Un tad — puf —
      pazudusi.

      Tu domā, ka tā ir sakritība? Es neticu sakritībām uz jūras.
    effects: { trust_janis: "+10" }
    choices:
      - Did you see anything unusual recently? -> janis_night
      - Move on -> quest1_hub

  janis_night:
    type: message
    text: >
      JĀNIS: Tajā naktī, kad viņa pazuda — es atgriezos no nakts
      zvejas, ap vieniem naktī. Es redzēju gaismas pie Aijas mājas.
      Nav nekas neparasts, viņa bieži strādā vēlu. Bet tur bija
      divas mašīnas. Viena bija Aijas vecais Volkswagen. Otra bija
      melns BMW ar BalticBuild uzlīmēm.

      Vienos naktī. Pie zvejnieces mājas.

      Toreiz nedomāju neko. Tagad domāju par to katru nakti.
    effects: { trust_janis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Laima (teen, witness tease) ---

  laima_intro:
    type: tweet
    from: laima
    text: >
      sūds es tik ļoti uztraucos. @aija_ozolina iemācīja man zvejot
      un sērfot. viņa ir labākais cilvēks šajā ciematā. nav iespējams
      ka viņa vienkārši aizbrauca. ja kāds ko zina tad bļe sakiet
    effects: { trust_laima: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Laima -> laima_talk_early

  laima_talk_early:
    type: message
    text: >
      LAIMA: kas tu esi? jauns te? nu labi, laipni lūgti ellē.
      aija ir tipa labākā pieaugusī šajā ciematā. viņa mums
      mācīja zvejot, sērfot, fotografēt dabu. viņa patiešām
      rūpējās.

      un tagad es flipoju jo edgars redzēja kaut ko dīvainu tajā
      vakarā bet negrib par to runāt. saka ka nav nekas bet bļe...
      tas ir kaut kas
    effects: { trust_laima: "+10" }
    choices:
      - What did Edgars see? -> laima_edgars_hint
      - Move on -> quest1_hub

  laima_edgars_hint:
    type: message
    text: >
      LAIMA: precīzi nezinu. viņš braukāja ar moci pa pludmali
      vakarā un redzēja kādu pie aijas mājas. vai tipa viņas
      pagalmā. kādu sievieti. edgars flipoja bet negrib runāt ar
      svešiem. pamēģini vispirms parunāt par moci vai zveju tad
      varbūt atvērsies haha
    effects: { trust_laima: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Jūraskrasti. A Vidzeme coastal
      village built around the sea and the dunes. A fisherwoman who
      was exposing coastal destruction. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Mārta (Aija's sister) -> marta_q1
      - Talk to Kristaps (Aija's best friend) -> kristaps_q1
      - Check what Sandra (Aija's colleague) is saying -> sandra_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Mārta Q1 ---

  marta_q1:
    type: tweet
    from: marta
    text: >
      ja kādam ir informācija par @aija_ozolina zvaniet man uzreiz.
      viņas zvejnieku tērps ir mājās. viņas kamera ir tur. viņa
      nekad nebūtu aizbraukusi bez aprīkojuma.
    effects: { trust_marta: "+5", contacts_followed: "+1" }
    choices:
      - DM Mārta -> marta_q1_talk

  marta_q1_talk:
    type: message
    text: >
      MĀRTA: Paldies, ka uzrakstīji, bet es tevi nepazīstu. Aijai
      ir daudz draugu te. Es esmu pārliecināta, ka viņa atgriezīsies.

      ...es turpinu tā teikt. Vairs tam neticu.

      [Mārta is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_marta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kristaps Q1 ---

  kristaps_q1:
    type: tweet
    from: kristaps
    text: >
      mana labākā draudzene ir PAZUDUSI un policija saka ka viņa
      varbūt ceļo?? AIJA NECEĻO NEKO NEPASAKOT. piz*ec. kāds ko
      zina.
    effects: { trust_kristaps: "+5", contacts_followed: "+1" }
    choices:
      - DM Kristaps -> kristaps_q1_talk

  kristaps_q1_talk:
    type: message
    text: >
      KRISTAPS: Kas tu bļe esi? Vēl viens, kas teiks lai
      nomierinos? Aija man piezvanīja tajā vakarā. Viņa teica ka
      viņai ir kaut kas liels. Viņa teica "ja man kaut kas notiks,
      skaties uz BalticBuild." Tad nolika klausuli.

      Tas ir pēdējais, ko no viņas dzirdēju.
    effects: { trust_kristaps: "+10" }
    choices:
      - What do you think happened? -> kristaps_theory
      - Move on -> quest1_hub

  kristaps_theory:
    type: message
    text: >
      KRISTAPS: Es domāju, ka Aija atrada pierādījumus, ka
      BalticBuild iznīcina krastu, un viņi to apklusināja. Bet
      es arī domāju, ka tā Dace Skujiņa — fotogrāfe no Rīgas —
      zina vairāk nekā stāsta. Viņa seko Aijai visur. Kad vien
      es atnācu pie Aijas, Dace jau bija tur. Vai tikko aizgājusi.

      Aija man teica pirms mēnešiem, ka kāds bija viņas mājā,
      kad viņa nebija mājās. Lietas bija pārvietotas. Kamera bija
      citā vietā. Viņa domāja, ka iedomājas. Es nedomāju, ka viņa
      iedomājās.
    effects: { trust_kristaps: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sandra Q1 ---

  sandra_q1:
    type: tweet
    from: sandra
    text: >
      @aija_ozolina nav atbildējusi uz ziņām piecas dienas.
      mēs bijām kolēģes piekrastes stacijā. aijas dati par
      krastu eroziju ir neaizstājami. lūdzu, ja kāds zina ko,
      sazinieties.
    effects: { trust_sandra: "+5", contacts_followed: "+1" }
    choices:
      - DM Sandra -> sandra_q1_talk

  sandra_q1_talk:
    type: message
    text: >
      SANDRA: Aija un es strādājām kopā divus gadus. Viņa ir
      visveltītākā pētniece, ko pazīstu. Šī krastu erozijas
      izmeklēšana — tā bija viņas viss. Viņai bija dati, fotogrāfijas,
      mērījumi. Viņa bija tik tuvu, lai publicētu.

      Es piedāvāju palīdzēt. Daudzas reizes. Viņa teica, ka viss
      ir kontrolē. Viņa teica, ka strādā ar žurnālisti. Es tikai
      gribēju atbalstīt.

      [Sandra seems earnest. Or is there something more?]
    effects: { trust_sandra: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Aija went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Edgars (was riding his motorcycle on the beach) -> edgars_interview
      - Find Jānis (fisherman, was out at night) -> janis_interview
      - Find Aldis (hunter, early morning on the coast) -> aldis_interview
      - Find Vizma (community chair, heard a car) -> vizma_interview

  # --- Edgars (saw someone at Aija's house) ---

