      "I know @donkerbier is your account. I know you broke into the
      brewery and stole recipes. I know you were watching the building
      at night. I know you were inside the brewery the evening Emile
      died. I have witnesses and I have the writing analysis."
    choices:
      - Send -> jan_response

  jan_response:
    type: message
    text: >
      Jan doesn't reply for a long time. Then:

      JAN: Ge begrijpt het niet. Emile was de beste brouwer van
      Vlaanderen en hij verspilde het. Ik wilde hem helpen. Ik wilde
      samenwerken. Maar hij weigerde. Altijd weigeren. Ik wist dat
      ik het beter kon als hij mij de kans gaf.

      Ik ben die avond naar de brouwerij gegaan. Ik wilde met hem
      praten. Maar VlasChem was er ook. Ik heb me verstopt. Ik hoorde
      het dispuut. En toen ze weg waren... was het CO2-alarm al
      uitgeschakeld. Niet door mij. Door hen.

      Ik heb niks gedaan. Ik zweer het. Ik was er alleen maar.

      That's not an alibi. That's a confession of complicity. You've
      already sent the evidence to Commissaris Vandenberghe. And to
      Stijn Buysse.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Commissaris Vandenberghe reopens the case. With your evidence —
      the anonymous account, the break-ins, the stolen recipes, the
      witness testimonies — Jan Michiels is arrested for stalking,
      breaking and entering, and failure to render assistance. He was
      in the brewery when Emile was dying and did nothing.

      Stijn Buysse, finally in possession of Emile's full evidence
      package — found in the waterproof box Emile left with the
      Brouwgilde — publishes the VlasChem story in De Morgen. The
      province orders an unannounced inspection. The factory is shut
      down pending environmental remediation. Thibault Verbeke faces
      criminal charges for illegal dumping and falsifying discharge
      reports. The investigation into Emile's death is upgraded to
      a manslaughter inquiry.

      And Lies Vandenbroucke, standing in the brewery with Bram and
      Madelief, starts the next batch. Emile's last recipe. The
      water is clean now — they test it twice.

      "Voor Emile. De hop liegt nooit."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: lies
    text: >
      de brouwerij is weer open. het bier smaakt naar waarheid. en
      naar emile. bedankt dat ge niet hebt losgelaten.
    choices:
      - The End -> game_complete

  # --- ENDING B: Thibault (Partial Ending) ---

  confront_thibault:
    type: message
    text: >
      You present the contamination evidence to Thibault Verbeke:

      "I have water analyses showing heavy metal levels eight times
      the legal limit. I have photos of the illegal discharge pipe.
      I have soil samples. I have the original lab reports. And I have
      witnesses who saw your car at the brewery the night Emile died."
    choices:
      - Send -> thibault_response

  thibault_response:
    type: message
    text: >
      THIBAULT: Dit gesprek wordt doorgestuurd naar onze juridische
      dienst. Elke publicatie van lasterlijke beweringen zal leiden
      tot onmiddellijke gerechtelijke stappen. VlasChem heeft altijd
      binnen de wettelijke normen geopereerd.

      But it's too late. You've sent the evidence to Stijn, to the
      Brouwgilde, and to the province.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The contamination story breaks. VlasChem is ordered to halt all
      discharge pending investigation. The factory may close. A hundred
      and fifty jobs hang in the balance. The village is divided.

      But Emile's death?

      Without the stalking evidence, Jan Michiels is never investigated.
      He continues his blog. He starts writing about the next small
      brewery. He creates a new anonymous account. He begins visiting
      another brewer's premises at night.

      Six months later, Lies reads about VlasChem online. The water is
      clean. The brewery reopens. But she checks the locks three times
      every night. She installs cameras. She can't shake the feeling
      of being watched.

      The corporation is exposed. But the person who haunted Emile —
      who was in the brewery as he died and did nothing — walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: lies
    text: "de brouwerij is open. het water is schoon. de rest... we zullen zien."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_gerard:
    type: message
    text: >
      You confront Mayor Demeyere with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> gerard_response

  gerard_response:
    type: tweet
    from: cecile
    text: >
      Mon client prend acte de vos allégations. Toute diffusion
      publique de propos diffamatoires fera l'objet de poursuites
      immédiates. — Cabinet Fontaine & Partners, Bruxelles
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct link
      between Demeyere and VlasChem's dumping — and there isn't one
      beyond political protection — your evidence is insufficient.

      VlasChem continues to operate. Jan Michiels continues to watch.
      The brewery stays closed.

      Six months later, @donkerbier creates a new account. It starts
      following Madelief.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: VLAMERTINGE — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Emile's story explores themes of
      corporate environmental crime, obsessive behaviour, community
      solidarity, small-town power structures, and the courage to
      speak up even when it costs everything.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Hulplijn 1712 (geweld, misbruik, stalking): 1712
      Child Focus (cyberpesten): 116 000
