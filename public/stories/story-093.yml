entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN VLAMERTINGE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Vlamertinge.social — the community Mastodon instance for
      the village of Vlamertinge, West Flanders, Belgium.

      The local feed is buzzing with grief. Something terrible has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name dominates everything:
      @emile_peeters.

      A craft brewer. Owner of Brouwerij De Vlaamse Poort. Known across the
      Westhoek for his lambic and his tripel. Found dead in his brew house
      three days ago. The police say it was an accident — carbon dioxide
      asphyxiation from a faulty fermentation tank.

      Nobody in Vlamertinge believes that.
    choices:
      - Look at his profile -> emile_profile

  emile_profile:
    type: tweet
    from: emile
    text: "Het water uit de grond is niet meer zuiver. Ik brouw al 20 jaar met dat water. Nu smaakt het naar chemicaliën. Iemand vervuilt onze bronnen en ik heb bewijs."
    choices:
      - That's one of his last posts... -> grey_barrel

  grey_barrel:
    type: message
    text: >
      One day after that post, his account uploaded a single image:
      a blurred photo of a rusted barrel in a field. Posted at 2am.
      No caption. No hashtags.

      His wife says he never posted without a caption. His brewing
      assistant says his phone was found on the floor of the brew house,
      screen cracked. The CO2 alarm in the fermentation room was
      disconnected.

      A brewer of twenty years does not accidentally suffocate in his
      own brewery.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: commissaris
    text: >
      Betreffende het overlijden van een inwoner van Vlamertinge: het
      onderzoek wijst op een industrieel ongeval. Het CO2-alarm was
      defect. Er zijn op dit moment geen aanwijzingen voor kwaad opzet.
      Informatie kan gemeld worden op 101.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are a mix of fury and heartbreak. His wife
      @lies_vandenbroucke is posting through tears. His son
      @bram_peeters is driving down from Ghent. His assistant
      @madelief_claessens is in shock.

      The farmer @pieter_desmet says Emile was right about the water.
      The café owner @roger_decock says Emile was getting threats.
      And the beer blogger @jan_michiels, who wrote a savage review
      of the brewery last month, has gone very quiet.

      The journalist @stijn_buysse is asking questions nobody wants
      to answer.
    effects: { trust_lies: "+5", trust_bram: "+5" }
    choices:
      - Start following Emile's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Vlamertinge. Follow Emile's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Roger (café owner, knows everyone) -> roger_intro
      - Talk to Pieter (farmer, noticed the water) -> pieter_intro
      - Talk to Fien (teen, shaken up) -> fien_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes mourning for Emile with ordinary village life:
      market schedules, the bakery's morning pistolets, field reports
      from the farmers.

      Key names surface: Lies (wife, keeping the brewery going),
      Madelief (assistant brewer, rattled), Stijn (journalist, digging),
      and the teens — Fien, Wout, Noor — who saw Emile as a village
      hero.

      Also prominent: VlasChem NV, the chemical processing plant at the
      edge of the village. Their posts are slick corporate PR. Emile's
      posts were the opposite — raw, furious, accusing.

      And one name keeps surfacing in whispers: @jan_michiels, the beer
      blogger who seemed obsessed with destroying Emile's reputation.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Roger -> roger_intro
      - Talk to Pieter -> pieter_intro
      - Talk to Fien -> fien_intro

  # --- Roger (social map) ---

  roger_intro:
    type: tweet
    from: roger
    text: >
      Het café is open maar het hart is dicht. @emile_peeters, gij
      zijt veel te vroeg vertrokken manneke. Uw kruk staat er nog.
    effects: { trust_roger: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Roger -> roger_talk

  roger_talk:
    type: message
    text: >
      ROGER: Ah, ge zijt nieuw hier? Welkom. Slechte timing, vriend.
      Heel Vlamertinge is in rouw.

      Laat me u wat vertellen. Lies is Emile zijn vrouw — zij deed de
      boekhouding van de brouwerij. Sterke madam. Madelief Claessens is
      zijn assistente, zij kent het brouwproces op haar duimpje. Bram is
      hun zoon, hij studeert brouwtechnologie in Gent. Komt naar huis
      gereden.

      En dan hebt ge Jan Michiels — die bierblogger. Die gast heeft
      Emile maanden zitten treiteren online. Recensies die meer op
      persoonlijke aanvallen leken. Emile zei dat het stalking was.
      Niemand luisterde.

      Oh ja, en VlasChem — die chemische fabriek. Emile beweerde dat
      ze het grondwater aan het vergiftigen waren. Zijn bier smaakte
      anders. Hij liet het water testen. En toen...
    effects: { trust_roger: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Jan Michiels -> roger_jan
      - Ask about VlasChem -> roger_vlaschem
      - Thank him and move on -> quest1_hub

  roger_jan:
    type: message
    text: >
      ROGER: Jan Michiels. Amai zeg, die gast. Hij schrijft een
      bierblog — BeerBelgium.blog. Klinkt onschuldig hé? Maar die
      mens was bezeten van Emile. Elke batch die Emile brouwde, Jan
      schreef er een vernietigende recensie over. Niet gewoon kritiek
      — persoonlijke aanvallen. "Peeters verliest zijn touch." "De
      Vlaamse Poort is verleden tijd."

      Emile zei dat Jan hem volgde. Naar brouwersbeurzen, naar
      proeverijen. Altijd dezelfde gast op de eerste rij met zijn
      telefoon. En dan die DM's — tientallen berichten die Emile
      nooit beantwoordde.

      Het was meer dan een boze blogger. Het was obsessie.
    effects: { trust_roger: "+5" }
    choices:
      - Ask about VlasChem -> roger_vlaschem
      - Move on -> quest1_hub

  roger_vlaschem:
    type: message
    text: >
      ROGER: VlasChem zit hier al sinds de jaren negentig. Ze
      verwerken vlas met chemicaliën — bleking, ontvetting, dat soort
      dingen. De gemeente was blij met de jobs. Maar de boeren klagen
      al jaren over het water. Beesten die ziek worden. Gewassen die
      niet meer groeien rond de fabriek.

      Emile brouwde met lokaal bronwater — dat was zijn ding, hé.
      Terroir, noemde hij dat. Maar vorig jaar begon zijn bier anders
      te smaken. Hij liet het water testen in een onafhankelijk labo.
      De resultaten waren... niet goed.

      Twee weken later was hij dood.
    effects: { trust_roger: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Pieter (farmer, water witness tease) ---

  pieter_intro:
    type: tweet
    from: pieter
    text: >
      vier generaties boeren op dit land. het water is vergiftigd.
      @emile_peeters wist het. en nu is hij dood. maak de link.
    effects: { trust_pieter: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Pieter -> pieter_talk

  pieter_talk:
    type: message
    text: >
      PIETER: Ik boer al dertig jaar op deze grond. Mijn vader, mijn
      grootvader, mijn overgrootvader. En ik vertel u — het grondwater
      is kapot. Mijn koeien drinken het niet meer. De velden rond de
      VlasChem-fabriek zijn dood.

      Emile kwam bij mij zijn water halen toen zijn eigen bron vreemd
      begon te smaken. Hij liet alles testen. Zware metalen.
      Oplosmiddelen. Dingen die niet in grondwater horen. Hij had
      documenten, foto's, analyserapporten.

      En toen godverdomme — dood. In zijn eigen brouwerij. Door een
      "defect CO2-alarm." Dat alarm werkte twee weken geleden nog
      perfect. Ik heb het zelf gezien.
    effects: { trust_pieter: "+10" }
    choices:
      - Did you see anything unusual recently? -> pieter_night
      - Move on -> quest1_hub

  pieter_night:
    type: message
    text: >
      PIETER: De nacht voor ze hem vonden — ik was laat op de hoeve,
      kalveren aan het controleren. Rond middernacht zag ik licht in
      de brouwerij. Niet abnormaal, Emile werkte soms laat. Maar er
      stonden twee auto's. De bestelwagen van de brouwerij en een
      zwarte BMW met VlasChem-nummerplaten.

      Om middernacht. Bij de brouwerij.

      Ik heb het genoteerd in mijn logboek. Niemand heeft ernaar
      gevraagd.
    effects: { trust_pieter: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Fien (teen, witness tease) ---

  fien_intro:
    type: tweet
    from: fien
    text: >
      serieus nu ik kan niet stoppen met wenen. @emile_peeters was de
      beste mens van dit dorp. hij leerde ons over bier en cultuur en
      ge zijt zot als ge denkt dat dat een ongeval was. als iemand
      iets weet zeg het aub
    effects: { trust_fien: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Fien -> fien_talk_early

  fien_talk_early:
    type: message
    text: >
      FIEN: ge zijt nieuw? amai wat een timing. in echt emile was
      gewoon de max. hij deed rondleidingen voor de scholen, hij
      legde alles uit over hop en gist en fermentatie. wij mochten
      altijd komen kijken.

      en nu ben ik bang want wout heeft iets gezien de andere avond
      bij de brouwerij maar hij wilt er niet over praten. hij zegt
      dat het niks is maar da's bullshit serieus
    effects: { trust_fien: "+10" }
    choices:
      - What did Wout see? -> fien_wout_hint
      - Move on -> quest1_hub

  fien_wout_hint:
    type: message
    text: >
      FIEN: ik weet het niet exact. hij was met zijn mountainbike op
      het veldpad achter de brouwerij en hij zag iemand die rondhing
      bij de zijdeur. niet emile. iemand anders. met een rugzak.

      wout flipt echt hard hij wilt er niet over praten. ge moet hem
      eerst vertrouwen kweken ofzo. praat over veldrijden met hem
      ofzo lol
    effects: { trust_fien: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Vlamertinge. A West Flemish village
      built around agriculture and craft brewing. A brewer who was
      exposing water contamination. A death nobody believes was an
      accident.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Lies (Emile's wife) -> lies_q1
      - Talk to Madelief (Emile's assistant) -> madelief_q1
      - Check what Bram (Emile's son) is saying -> bram_q1
      - I'm ready to investigate the night he died -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lies Q1 ---

  lies_q1:
    type: tweet
    from: lies
    text: >
      de brouwerij is dicht vandaag. en morgen. en ik weet niet
      wanneer nog. @emile_peeters zijn laatste batch staat nog in de
      tanks. ik kan er niet naar kijken.
    effects: { trust_lies: "+5", contacts_followed: "+1" }
    choices:
      - DM Lies -> lies_q1_talk

  lies_q1_talk:
    type: message
    text: >
      LIES: Ik ken u niet. Maar bedankt voor uw medeleven. De hele
      wereld praat over Emile en niemand doet iets.

      ...Ik blijf zeggen dat het goed komt. Maar dat is niet waar.

      [Lies is op haar hoede. Je zult meer vertrouwen moeten opbouwen
      voordat ze zich openstelt.]
    effects: { trust_lies: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Madelief Q1 ---

  madelief_q1:
    type: tweet
    from: madelief
    text: >
      De gistingsruimte is afgesloten door de politie. Maar ik ken
      die ruimte. Het CO2-alarm is twee maanden geleden nog nagekeken.
      Het werkte perfect. @emile_peeters was de veiligste brouwer die
      ik kende.
    effects: { trust_madelief: "+5", contacts_followed: "+1" }
    choices:
      - DM Madelief -> madelief_q1_talk

  madelief_q1_talk:
    type: message
    text: >
      MADELIEF: Emile en ik werkten al vijf jaar samen. Hij was mijn
      mentor. Alles wat ik weet over brouwen komt van hem. Die man
      was geobsedeerd door veiligheid — dubbele checks, logboeken,
      alles.

      Het CO2-alarm was niet "defect." Iemand heeft het uitgeschakeld.
      Er zaten verse krasjes op de behuizing. Ik heb het aan de
      politie gezegd. Ze schreven het op. Dat was het.

      [Madelief lijkt oprecht. Of probeert ze zichzelf te beschermen?]
    effects: { trust_madelief: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Bram Q1 ---

  bram_q1:
    type: tweet
    from: bram
    text: >
      mijn pa is DOOD en de politie zegt "industrieel ongeval"???
      MIJN PA BROUWDE AL 20 JAAR HIJ WIST WAT HIJ DEED. godverdomme
      ik rij naar huis. iemand gaat mij uitleg geven.
    effects: { trust_bram: "+5", contacts_followed: "+1" }
    choices:
      - DM Bram -> bram_q1_talk

  bram_q1_talk:
    type: message
    text: >
      BRAM: Wie zijt gij? Nog iemand die gaat zeggen dat ik moet
      kalmeren? Mijn pa belde mij de avond voor hij stierf. Hij zei
      dat hij iets groots had ontdekt. Hij zei "als er iets gebeurt,
      kijk naar VlasChem." En dan zei hij nog iets — "die blogger
      weet meer dan hij laat uitschijnen."

      Dat is het laatste dat ik van hem gehoord heb.
    effects: { trust_bram: "+10" }
    choices:
      - What do you think happened? -> bram_theory
      - Move on -> quest1_hub

  bram_theory:
    type: message
    text: >
      BRAM: Ik denk dat mijn pa bewijs had dat VlasChem het grondwater
      vergiftigt. En dat ze hem het zwijgen hebben opgelegd. Maar ik
      denk ook dat die creep van een bierblogger — Jan Michiels — er
      iets mee te maken heeft. Die gast was bezeten van mijn pa. Niet
      op een goede manier.

      Pa vertelde mij maanden geleden dat iemand zijn brouwerij
      binnenkwam 's nachts. Spullen die verplaatst waren. Recepten die
      gekopieerd leken. Hij dacht dat het niks was. Ik denk dat het
      wél iets was.
    effects: { trust_bram: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Emile died. Multiple people saw or
      heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Wout (was mountain biking near the brewery) -> wout_interview
      - Find Sofie (baker, starts at 5am, heard something) -> sofie_interview
      - Find Lotte (vet, called out to a farm nearby) -> lotte_interview
      - Find Roger (was closing the café late) -> roger_interview

  # --- Wout (saw someone at the brewery) ---

  wout_interview:
    type: tweet
    from: wout
    text: >
      goede ride vandaag maar de sfeer rond de brouwerij is niet
      normaal. er hangt iets in de lucht. letterlijk en figuurlijk.
    effects: { trust_wout: "+5" }
    choices:
      - Ask Wout about that evening -> wout_talk

  wout_talk:
    type: message
    text: >
      WOUT: ok maar ge zegt het tegen niemand hé. ik was op het
      veldpad achter de brouwerij rond 21u, avondrit met mijn
      mountainbike. en ik zag iemand bij de zijdeur van de brouwerij.
      niet emile — iemand anders. kleiner. met een rugzak. hij deed
      iets aan de deur, alsof hij met het slot bezig was.

      toen hij mij hoorde is hij weggelopen richting het veld. ik heb
      zijn gezicht niet gezien maar hij liep raar. en die rugzak was
      zwaar.

      serieus nu wie gaat er om 21u met een rugzak aan de zijdeur van
      iemand zijn brouwerij staan foeteren
    effects:
      trust_wout: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Sofie (baker, heard argument) ---

  sofie_interview:
    type: tweet
    from: sofie
    text: >
      Om 5u aan het bakken zoals elke dag. Maar die nacht heb ik iets
      gehoord. Een discussie. Luide stemmen bij de brouwerij. Rond 1u.
    effects: { trust_sofie: "+5" }
    choices:
