      speedboat registered to a company called "Aegean Maritime
      Services." The company's registered address is the same as
      Andreas Stavridis's shop.

      Destinations listed: "fishing." But the boat has no fishing
      license and carries no nets.

      Cross-referencing with international customs alerts: Turkish
      customs flagged suspicious shipments from the same registration
      number three times in the past year. Each time, the shipment
      was cleared after "diplomatic intervention."

      This is a pipeline. Artifacts leave Thalassa by speedboat, enter
      Turkey, and from there reach collectors across Europe and the
      Gulf states.
