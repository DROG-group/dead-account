  # --- Andreas Investigation ---

  andreas_investigation:
    type: message
    text: >
      Aegean Treasures looks like a typical souvenir shop from the
      front. Ceramic replicas, postcards, olive wood carvings.

      But public records tell a different story. Andreas imports
      "decorative items" from suppliers in Athens. The shipping
      manifests list weights that don't match decorative ceramics.
      Too heavy. And the import declarations consistently undervalue
      the goods.

      Elena's walking tour TikTok from three months ago includes a
      shot panning past the shop window. In the background, clearly
      visible, is a red-figure kylix — a drinking cup. It matches
      an item reported stolen from the Thessaloniki museum two years
      ago.
    effects:
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to trafficking thread -> trafficking_hub

  # --- Harbour Records ---

