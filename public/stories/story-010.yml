entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN THALASSA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to thalassa.social — the community Mastodon instance for
      Thalassa, a small island in the Aegean Sea. White houses, blue
      domes, ancient ruins, and a secret nobody wants exposed.

      The local feed is troubled. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      One name is everywhere: @elena_papadopoulos.

      An archaeology student who ran historical walking tours and
      a popular TikTok about the island's 3,000-year history. She
      made the ancient world come alive for tourists and locals alike.

      She hasn't posted in eight days.
    choices:
      - Look at her profile -> elena_profile

  elena_profile:
    type: tweet
    from: elena
    text: "Found something extraordinary today. This changes everything we know about the Classical period on Thalassa. Full video coming tomorrow."
    choices:
      - Tomorrow never came... -> dead_post

  dead_post:
    type: message
    text: >
      The video never appeared. Two days later, her account posted:
      "Apologies for the delay. The find was less significant than
      initially thought. Taking a short break from content creation."

      Elena's father says those words are not hers. Elena does not
      say "content creation." She says "storytelling." Elena does
      not downplay finds. Elena gets excited and stays excited.

      Her room above the taverna is untouched. Her notebooks are
      gone. Her laptop is gone.
    choices:
      - Read the police statement -> police_statement
      - See what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: astynomia
    text: >
      The Hellenic Police Thalassa station has received a report
      regarding a local resident. The individual has communicated
      via social media. There is currently no indication of criminal
      activity. Contact the station with any information.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The island is buzzing. Nikos, her father, is going boat to
      boat asking fishermen if they've seen her. Maria at the taverna
      says Elena's room looks like someone searched it. Yiayia Eleni
      sits by the harbour crossing herself.

      And an anonymous account, @alexis, posts strange messages:
      "Some treasures are better left buried. She should have
      understood that."

      The mayor's office is suspiciously quiet. The mayor's son
      runs a souvenir shop that sells "antiques."
    effects: { trust_nikos: "+5", trust_maria: "+5" }
    choices:
      - Start following Elena's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Thalassa. A beautiful island with an ugly secret
      hiding beneath the whitewashed walls. Follow Elena's contacts
      and understand what she discovered.
    choices:
      - Talk to Maria at the taverna -> maria_intro
      - Talk to Yiayia Eleni -> yiayia_intro
      - Check what the teens are saying -> dimitris_intro
      - Browse the feed -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is a mix of sunset photos, ferry schedules, taverna
      specials, and worry about Elena. Tourism is the island's
      lifeblood. The walking tours were popular. Now they've stopped.

      Key names: Nikos (her father, desperate), Sophia (her professor
      in Athens, concerned), Petros (island journalist, investigating),
      Andreas (mayor's son, runs the antique shop), Katerina (academic
      rival from Thessaloniki).
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Maria -> maria_intro
      - Talk to Yiayia Eleni -> yiayia_intro
      - Check the teens -> dimitris_intro

  # --- Maria (social map) ---

  maria_intro:
    type: tweet
    from: maria
    text: >
      To Kyma is open but the heart is missing. Elena's chair at the
      corner table is empty. Her favourite frappe sits undrunk in my
      imagination. Come sit. We need to talk.
    effects: { trust_maria: "+5", contacts_followed: "+1" }
    choices:
      - Talk to Maria -> maria_talk

  maria_talk:
    type: message
    text: >
      MARIA: Ela, sit. You're new? Welcome to Thalassa. Bad timing,
      but sit.

      Elena lived above my taverna. She rented the room three years
      ago when she started her thesis research. Every morning she'd
      come down, drink her frappe, spread her maps on the table, and
      plan her walking tours.

      She made this island's history come alive. Tourists would cry
      listening to her tell the story of the Classical temple. She
      had a gift.

      Then she found something. She wouldn't tell me what, but she
      was excited. Poli excited. And scared. I'd never seen her
      scared before.
    effects: { trust_maria: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Andreas's shop -> maria_andreas
      - Ask about Elena's room -> maria_room
      - Move on -> quest1_hub

  maria_andreas:
    type: message
    text: >
      MARIA: Aegean Treasures. Andreas Stavridis. The mayor's son.
      He sells souvenirs to tourists — ceramics, jewellery, replicas.
      But in the back room... Elena told me she saw things that
      shouldn't be there.

      Ancient pottery. Real pottery. Not replicas. With museum
      catalogue numbers scratched off. She photographed them through
      the window at night.

      She said "Maria, the mayor's son is selling stolen antiquities."
      I told her to be careful. This is a small island. The Stavridis
      family owns half of it.
    effects: { trust_maria: "+10" }
    choices:
      - Ask about the room -> maria_room
      - Move on -> quest1_hub

  maria_room:
    type: message
    text: >
      MARIA: Someone went through Elena's room. The night she
      disappeared, I heard footsteps upstairs. I thought it was her
      coming home late. But in the morning the door was open and
      things were moved. Her notebooks — she kept three of them, full
      of sketches and measurements — all gone. Her laptop, gone.

      But they missed something. Under the floorboard by the window —
      Elena showed me once — there is a space. She kept her important
      things there. I haven't checked. I'm afraid to.
    effects: { trust_maria: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Yiayia Eleni ---

  yiayia_intro:
    type: tweet
    from: yiayia
    text: >
      My Elena. My koritsaki. Eighty-two years on this island and
      I have never been so afraid. God protect her.
    effects: { trust_yiayia: "+5", contacts_followed: "+1" }
    choices:
      - Talk to Yiayia -> yiayia_talk

  yiayia_talk:
    type: message
    text: >
      YIAYIA: Ela, paidi mou. Sit with an old woman.

      My granddaughter has the fire of her grandfather. He fought in
      the resistance. She fights with a camera and a notebook.

      She told me something last month. She said "Yiayia, they are
      selling our history. Piece by piece. Through the mayor's son's
      shop." I told her to be careful. The Stavridis family has been
      powerful on this island since before I was born.

      She said "Someone has to stop them." That is what her grandfather
      would have said. That is what worries me.
    effects: { trust_yiayia: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Dimitris (teen witness) ---

  dimitris_intro:
    type: tweet
    from: dimitris
    text: >
      re paidia ti ginetai. i elena afantisti kai kanenas den kanei
      tpt. oles oi tours stamataisan. o stefanos eide kati sto limani
      alla fovate na milisi. teleia
    effects: { trust_dimitris: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dimitris -> dimitris_talk

  dimitris_talk:
    type: message
    text: >
      DIMITRIS: re eisai neos? welcome. katalavaineis ti ginetai?
      i elena itan teleia. ekane ta tours kai oloi oi tourisites tin
      agapousan. kai emeis ta paidia tin agapousame giati mas empaize
      tin istoria tou nisiou san paramithi.

      i iro exei screenshots apo to kiniton tis elenas. i elena tis
      edeixe. kaneis anonimon tis esteile minima: "stamata na
      psaxneis. den tha sou aresei ti tha vreis."

      kai o stefanos eide ena skafo sto limani sta misanixta pou
      den itan apo do. exei kapoies fwtografies sto kiniton tou.

      re malaka kanenas den akoui paidia sta 15
    effects: { trust_dimitris: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      Thalassa is an island where beauty hides something dark. An
      archaeology student found evidence of antiquities trafficking.
      Now she's gone and her notebooks are missing.
    choices:
      - Talk to Nikos (Elena's father) -> nikos_q1
      - Talk to Dr. Sophia (her professor) -> sophia_q1
      - Talk to Petros (island journalist) -> petros_q1
      - I'm ready to investigate the night she vanished -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Nikos Q1 ---

  nikos_q1:
    type: tweet
    from: nikos
    text: >
      8 days. I have searched every beach, every cove, every chapel
      on this island. My daughter is not here. Someone took her and
      the police are doing NOTHING.
    effects: { trust_nikos: "+5", contacts_followed: "+1" }
    choices:
      - DM Nikos -> nikos_q1_talk

  nikos_q1_talk:
    type: message
    text: >
      NIKOS: You want to help? Then listen. My daughter found stolen
      antiquities being sold through the mayor's son's shop. She
      documented everything. And now she's gone and her evidence
      is gone.

      The police sergeant — Thanasis — says there's "no crime." The
      mayor says she's "traveling." She is not traveling. Her passport
      is in her drawer. I checked.

      Someone on this island made my daughter disappear. And I think
      the people who should be investigating are the same people who
      benefit from the traffic.
    effects: { trust_nikos: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Sophia Q1 ---

  sophia_q1:
    type: tweet
    from: sophia
    text: >
      I am deeply concerned about my student Elena Papadopoulos.
      Her thesis research was groundbreaking. She had identified
      artifacts that belong in a museum, not in a souvenir shop.
      I urge the authorities to act.
    effects: { trust_sophia: "+5", contacts_followed: "+1" }
    choices:
      - DM Sophia -> sophia_q1_talk

  sophia_q1_talk:
    type: message
    text: >
      SOPHIA: Elena's research was extraordinary. She identified a
      previously undocumented Classical-period sanctuary on Thalassa.
      The artifacts she found — pottery, figurines, inscriptions —
      are museum-quality pieces.

      But some of those artifacts are appearing on the black market.
      Elena traced several pieces from her site to Andreas Stavridis's
      shop and from there to collectors in Athens and abroad.

      She was documenting a trafficking pipeline. From the ground on
      Thalassa to private collections across Europe. And the pipeline
      runs through the mayor's family.

      I should add — another student, Katerina Nikolaou, is working
      on the same thesis topic. There has been... academic tension.
    effects: { trust_sophia: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Petros Q1 ---

  petros_q1:
    type: tweet
    from: petros
    text: >
      Nea Thalassa asks: where is Elena Papadopoulos? This newspaper
      will not stop asking until we have answers. The island deserves
      the truth.
    effects: { trust_petros: "+5", contacts_followed: "+1" }
    choices:
      - DM Petros -> petros_q1_talk

  petros_q1_talk:
    type: message
    text: >
      PETROS: I've been a journalist on this island for thirty years.
      I've seen the Stavridis family do many things. But this — if
      Elena's evidence is real — this is the biggest scandal in the
      island's modern history.

      Elena shared some of her findings with me two weeks before she
      disappeared. Photographs of artifacts in Andreas's shop. Catalog
      numbers that match items reported missing from regional museums.
      Shipping receipts from the harbour master's records.

      She was close to publishing everything. Her walking tour videos
      were going to include the trafficking story. That's when she
      disappeared.

      I need her full documentation to publish. Without it, I have
      allegations against the most powerful family on the island.
    effects: { trust_petros: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Elena was last seen at To Kyma taverna at 21:00. She was working
      on her laptop, editing video. She told Maria she was "going to
      check something at the site." She left on foot heading toward
      the ruins.

      Collect witness accounts. You need at least 4.
    choices:
      - Find Stefanos (was at the harbour) -> stefanos_interview
      - Find Manolis (boat captain, was out late) -> manolis_interview
      - Find Eleftheria (teacher, lives near the ruins) -> eleftheria_interview
      - Find Marina (pharmacist, was closing late) -> marina_interview

  # --- Stefanos (saw the boat) ---

  stefanos_interview:
    type: tweet
    from: stefanos
    text: >
      re ego eida ena skafo sto limani tetia wra pou den eprepe na
      einai ekei. den itan apo do. kai feugan me koutia
    effects: { trust_stefanos: "+5" }
    choices:
      - Ask Stefanos what he saw -> stefanos_talk

  stefanos_talk:
    type: message
    text: >
      STEFANOS: re eixa parei psari sto limani me ton patera mou
      kai vlepw ena skafo na mpainei. den itan apo do. megalo,
      taxyploo. tria atoma. kai evgazan koutia apo ena amaksi kai
      ta evasan sto skafo.

      ta koutia itan mikra alla varetia. san ta koutia pou exei o
      andreas sto magazi tou otan tou fernoun pragmata.

      to amaksi itan tou dimarchou. to anagnwrisa apo tis pinakides.

      to skafo efyge pros ta mesanixta. xwris fota. pros tin
      tourkiki akti.
    effects:
      trust_stefanos: "+10"
      night_witnesses: "+1"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Manolis (saw Elena near the ruins) ---

  manolis_interview:
    type: tweet
    from: manolis
    text: >
      I passed the ruins on my way back from a sunset cruise. I saw
      Elena. She was not alone.
    effects: { trust_manolis: "+5" }
    choices:
      - Ask Manolis what he saw -> manolis_talk

  manolis_talk:
    type: message
    text: >
      MANOLIS: Around ten o'clock I was walking back from the harbour.
      The path goes past the ruins. I saw Elena near the old temple
      with a torch. She was photographing something.

      Then I saw someone else. On the path above the ruins. Watching
      her. A woman. Dark hair, about Elena's age. She was taking
      photos too — but of Elena, not of the ruins.

      Elena didn't see her. The woman slipped away when I came close.
      I didn't think much of it. Maybe another researcher.

      But now I wonder: was she being watched?
    effects:
      trust_manolis: "+10"
      night_witnesses: "+1"
      rival_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Eleftheria (heard the argument) ---

  eleftheria_interview:
    type: tweet
    from: eleftheria
    text: >
      My house overlooks the path to the ruins. I heard voices that
      night. Raised voices. A man telling a woman to "forget what
      she saw."
    effects: { trust_eleftheria: "+5" }
    choices:
      - Ask Eleftheria what she heard -> eleftheria_talk

  eleftheria_talk:
    type: message
    text: >
      ELEFTHERIA: Around eleven I was reading on my terrace. I heard
      two people on the path below. A man and a woman.

      The man said: "You don't understand what you're doing. This
      involves people who will not tolerate interference."

      She said: "I don't care who they are. Those artifacts belong
      to Greece, not to some collector in Geneva."

      He said: "Walk away. This is your last warning."

      She said something I couldn't hear. Then footsteps, fast.
      Running. Then a car engine from the lower road.

      I recognised the man's voice. It was Andreas. The mayor's son.
    effects:
      trust_eleftheria: "+10"
      night_witnesses: "+1"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Marina (saw someone searching) ---

  marina_interview:
    type: tweet
    from: marina
    text: >
      I was closing the pharmacy late. I saw someone going into the
      taverna building through the back entrance. The one that leads
      to Elena's room.
    effects: { trust_marina: "+5" }
    choices:
      - Ask Marina what she saw -> marina_talk

  marina_talk:
    type: message
    text: >
      MARINA: Around midnight. I was doing inventory in the pharmacy.
      Through the back window I saw a figure go up the external stairs
      to Elena's room. Not Elena — a man. Taller, heavier.

      He was inside for maybe twenty minutes. When he came out, he
      was carrying a bag. Elena's laptop bag — the blue one she always
      carried. And something else, notebooks maybe.

      He got into a car on the back street. I couldn't see the plate
      clearly but the car was a black Range Rover. The mayor drives
      a black Range Rover.
    effects:
      trust_marina: "+10"
      night_witnesses: "+1"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.

      Keep collecting testimonies.
    choices:
      - Find Stefanos -> stefanos_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Manolis -> manolis_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Eleftheria -> eleftheria_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Marina -> marina_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Talk to Iro (has Elena's screenshots) -> iro_early
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Iro early ---

  iro_early:
    type: tweet
    from: iro
    text: >
      i elena mou edeixe to kiniton tis prin exafanistei. eixe
      minima pou elege "stamata na psaxneis i tha metaniwseis."
      kai alla apo mia kopela pou tin antagwnizotane
    effects: { trust_iro: "+5" }
    choices:
      - Ask Iro about the messages -> iro_messages
      - Come back later -> quest2_hub

  iro_messages:
    type: message
    text: >
      IRO: i elena mou edeixe duo tipou minimatwn. ta prota itan
      apo ton alexis — anwnimo account. pragmata opws "min anakateuesai"
      kai "den ksereis me poious ta vazeis."

      alla ta alla itan apo mia kopela. katerina nikolaou. apo
      thessaloniki. kai ta dikia tis itan diaforetika. tipo "i thesis
      einai diki mou" kai "tha kanw ta panta gia na se stamatiso" kai
      "i epistimoni tha mathoun ti ekanes."

      san na ligoura tin elena giati vrike prwti tin thesi.
      o fthonos itan... poli. ekei to prosopo mou.

