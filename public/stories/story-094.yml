entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN TOPLIČKA VAS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to toplickavas.social — the community Mastodon instance for
      Toplička Vas, a village nestled in the Zagorje castle hills of
      northern Croatia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @petra_novakovic.

      A young herbalist. She ran workshops at the thermal springs, made
      natural remedies from Zagorje wildflowers and thermal water. She
      documented the healing properties of every local plant. People
      adored her.

      She hasn't posted in six days.
    choices:
      - Look at her profile -> petra_profile

  petra_profile:
    type: tweet
    from: petra
    text: "GeoTerma bušotine su 200m od izvora. Termalna voda se mijenja — temperatura pada, minerali nestaju. Imam dokaze. Ovo moraju svi vidjeti."
    choices:
      - That's her last real post... -> grey_hills

  grey_hills:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurry photo of the Zagorje hills at night. Out of focus, shot
      at a strange angle. Posted at 2am. No caption, no hashtags.

      Her friends say that's not Petra. She always wrote long poetic
      captions about every plant, every spring. The police say she
      probably went to visit friends in Zagreb. Nobody believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: nacelnik_policija
    text: >
      Zaprimili smo prijavu nestanka stanovnice Topličke Vasi. U ovom
      trenutku nema elemenata koji bi upućivali na kazneno djelo. Svaka
      korisna informacija može se prijaviti na 192 ili osobno u postaji.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @mislav_horvat is posting
      desperately from the gostionica kitchen. Her sister @barbara_novakovic
      is driving up from Zagreb. Her colleague @lovro_simunic is sending
      worried messages about unfinished research.

      The old vinegrower @branko_vukovic says Petra was right about the
      water changing. The wellness centre owner @nikolina_bogdanovic is
      furious — half her clients came for Petra's herbal treatments.

      And the journalist @ana_matic has gone silent.

      Nobody buys the police line. Nobody thinks Petra just "went to
      Zagreb."
    effects: { trust_mislav: "+5", trust_barbara: "+5" }
    choices:
      - Start following Petra's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Toplička Vas. Follow Petra's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Ivan (gostionica owner, knows everyone) -> ivan_intro
      - Talk to Branko (vinegrower, noticed the water) -> branko_intro
      - Talk to Ema (teen, learned herbs from Petra) -> ema_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Petra with the rhythms of a Zagorje
      village: vineyard updates, thermal pool schedules, castle
      festival announcements, štrukli recipes.

      Key names surface: Mislav (best friend, cook at the gostionica),
      Lovro (biology researcher, seems agitated), Ana (journalist,
      oddly quiet), and the teens — Ema, Filip, Lucija — who looked
      up to Petra like an older sister.

      Also prominent: GeoTerma d.o.o., the geothermal energy company
      drilling near the springs. Their posts are corporate PR about
      "green transition." Petra's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Ivan -> ivan_intro
      - Talk to Branko -> branko_intro
      - Talk to Ema -> ema_intro

  # --- Ivan (social map) ---

  ivan_intro:
    type: tweet
    from: ivan
    text: >
      Gostionica je otvorena ali srce nije tu. @petra_novakovic, tvoj
      čaj od kadulje te čeka. Vrati se. 🌿
    effects: { trust_ivan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ivan -> ivan_talk

  ivan_talk:
    type: message
    text: >
      IVAN: A, ti si novi? Dobro došli, ali loš timing, buraz. Svi su
      na iglama zbog Petre.

      Da ti kažem tko je tko. Mislav je Petrin najbolji frend — kuhaju
      skupa u gostionici kad joj se zatraži, ona donese trave, on kuha.
      Lovro Šimunić je biolog, radi na istraživanju termalnih izvora.
      Pametan čovjek, ali... malo previše zainteresiran za nju, kužiš.
      Barbara je Petrina starija sestra, dolazi iz Zagreba.

      A Ana Matić — novinarka — ona i Petra su radile na nečemu skupa.
      Nešto oko vode i bušotina. Ana ni riječ otkad je Petra nestala.
      To joj nije u stilu, fakat.

      I nemoj se zamarati s GeoTerminim PR objavama. Laži u ISO
      certifikatima. Jebote, kakva sramota.
    effects: { trust_ivan: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Lovro -> ivan_lovro
      - Ask about GeoTerma -> ivan_geoterma
      - Thank him and move on -> quest1_hub

  ivan_lovro:
    type: message
    text: >
      IVAN: Lovro? Tu je dvije godine duže od Petre. Solidan biolog,
      moram priznat. Ali otkad je Petra došla... brate, tip je non-stop
      oko nje. U gostionici svaki put kad je ona tu. Nudi se za svaki
      projekt. Ona je bila pristojno oko toga, ali ja sam vidio — smetalo
      joj je.

      Kad je počela istraživat bušotine i termalne izvore, on je bio
      još gori. Htio je bit dio svega. Jednom mi je rekla: "Ne prihvaća
      ne kao odgovor." Ja sam mislio profesionalno. Sad više nisam siguran.
    effects: { trust_ivan: "+5" }
    choices:
      - Ask about GeoTerma -> ivan_geoterma
      - Move on -> quest1_hub

  ivan_geoterma:
    type: message
    text: >
      IVAN: GeoTerma je tu od prošle godine. Bušotine za geotermalnu
      energiju, kažu. EU fondovi, zelena tranzicija, pizdarije. Ali
      vinogradari i stari ljudi — svi kažu isto: termalna voda se
      mijenja. Temperatura pada, smrad se pojavio, neke trave uz izvor
      su počele umirat.

      Petra je bila prva koja je to dokumentirala. Mjerila temperaturu,
      uzimala uzorke, slikala biljke. Imala je dokaze, rekla je. Prave
      dokaze. Dva tjedna kasnije — nestala.

      Koji kurac, buraz. Poklopi se previše toga.
    effects: { trust_ivan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Branko (vinegrower, water witness) ---

  branko_intro:
    type: tweet
    from: branko
    text: >
      četrdeset let sam na ovom bregu. voda iz izvora je bila topla i
      čista cijeli moj život. sad smrdi na sumpor i pola trave je crno.
      @petra_novakovic je imala pravo. i sad je nema.
    effects: { trust_branko: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Branko -> branko_talk

  branko_talk:
    type: message
    text: >
      BRANKO: Četrdeset godina pijem tu vodu. Termalni izvor Svete
      Katarine — najljepša voda u cijelom Zagorju. Topla, mineralna,
      liječila je sve. Moja baka je s tom vodom liječila reumu, zglobove,
      kožu.

      Otkad je GeoTerma počela bušit — dvjesto metara od izvora, jebote
      — voda se promijenila. Temperatura je pala za tri stupnja. Pojavio
      se smrad. Trave koje su rasle uz izvor stotinama godina — mrtve.

      Petra je uzimala uzorke. Ronila u izvor s bočicama. Fotografirala
      sve. Gradila slučaj. I onda — puf. Nema je.

      Misliš da je to slučajnost? Ja ne vjerujem u slučajnosti kad se
      radi o vodi.
    effects: { trust_branko: "+10" }
    choices:
      - Did you see anything unusual recently? -> branko_night
      - Move on -> quest1_hub

  branko_night:
    type: message
    text: >
      BRANKO: Noć prije nego je nestala — kasno sam bio u vinogradu,
      branje je blizu. Oko ponoći sam vidio svjetla kod Petrine
      radionice. Ona ima malu kućicu uz izvor di radi s travama. Dva
      auta. Jedan Petrin mali Renault. Drugi crni SUV s GeoTerma
      naljepnicama.

      U ponoć. Kod radionice za trave.

      Nisam puno razmišljao tad. Sad razmišljam stalno.
    effects: { trust_branko: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ema (teen, Petra's student) ---

  ema_intro:
    type: tweet
    from: ema
    text: >
      fakat sam u kurcu ekipa @petra_novakovic je ona koja me naučila
      sve o travama i liječenju i to. nemoguće da je samo otišla. ak
      iko zna bilo šta molim vas javite se
    effects: { trust_ema: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ema -> ema_talk_early

  ema_talk_early:
    type: message
    text: >
      EMA: čekaj ti si novi tu? sranje timing fakat. u biti petra je
      najjača osoba u cijelom selu. naučila nas je sve o biljkama,
      vodila nas na izvor, pokazivala nam koje trave liječe šta. tipa
      fakat joj dugujemo sve.

      i sad sam prestrašena jer filip je vidio nešto čudno zadnje
      večeri kod dvorca ali neće pričat. kaže da je ništa ali fakat
      to nije ništa buraz
    effects: { trust_ema: "+10" }
    choices:
      - What did Filip see? -> ema_filip_hint
      - Move on -> quest1_hub

  ema_filip_hint:
    type: message
    text: >
      EMA: neznam točno. bio je na skateu kod starog dvorca i vidio je
      nekoga kako nešto stavlja u petrin auto?? il tak nekak. frka mu
      je previše i neće pričat. moraš ga pitat direktno ali ne
      vjeruje ljudima koje nezna. probaj prvo priča o muzici il skateu
      s njim lol

      jebote koji kurac se tu događa
    effects: { trust_ema: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Toplička Vas. A Zagorje village in
      the castle hills, built around thermal springs. A young herbalist
      who was exposing damage to the springs. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Mislav (Petra's best friend) -> mislav_q1
      - Talk to Lovro (Petra's colleague) -> lovro_q1
      - Check what Barbara (Petra's sister) is saying -> barbara_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Mislav Q1 ---

  mislav_q1:
    type: tweet
    from: mislav
    text: >
      ak iko ima vijesti o @petra_novakovic nazovite me molim vas.
      njena radionica je zatvorena. biljke se suše. ona nikad ne bi
      ostavila biljke da se osuše. nikad.
    effects: { trust_mislav: "+5", contacts_followed: "+1" }
    choices:
      - DM Mislav -> mislav_q1_talk

  mislav_q1_talk:
    type: message
    text: >
      MISLAV: Hvala ti šta si se javil ali ne poznajem te. Petra ima
      puno prijatelja tu. Sigurno će se vratit.

      ...Stalno to govorim. Više ne vjerujem u to.

      [Mislav is guarded. You'll need to build more trust before he
      opens up.]
    effects: { trust_mislav: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lovro Q1 ---

  lovro_q1:
    type: tweet
    from: lovro
    text: >
      Laboratorij je prazan bez @petra_novakovic. Njeni uzorci su još
      u hladnjaku. Njen dnevnik termalnih mjerenja je na stolu. Nikad
      ne bi napustila istraživanje u tijeku. Nešto se dogodilo.
    effects: { trust_lovro: "+5", contacts_followed: "+1" }
    choices:
      - DM Lovro -> lovro_q1_talk

  lovro_q1_talk:
    type: message
    text: >
      LOVRO: Petra i ja smo radili skupa više od godinu dana. Najposvećenija
      istraživačica koju poznajem. Ovo istraživanje o termalnim izvorima —
      to joj je bilo sve. Imala je podatke, fotografije, kemijske analize.
      Bila je tako blizu objavljivanju.

      Nudil sam joj pomoć. Mnogo puta. Rekla je da ima sve pod kontrolom.
      Rekla je da radi s novinarkom. Samo sam ju htio podržat.

      [Lovro seems earnest. Or obsessive?]
    effects: { trust_lovro: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Barbara Q1 ---

  barbara_q1:
    type: tweet
    from: barbara
    text: >
      moja sestra je NESTALA a policija mi govori da je možda otišla
      na put??? ONA NE IDE NIGDJE BEZ DA KAŽE. dolazim iz zagreba.
      neko mi mora objasnit šta se tu jebeno događa.
    effects: { trust_barbara: "+5", contacts_followed: "+1" }
    choices:
      - DM Barbara -> barbara_q1_talk

  barbara_q1_talk:
    type: message
    text: >
      BARBARA: Tko si ti? Još jedna osoba iz tog sela koja će mi reć
      da se smirim? Sestra me nazvala noć prije nego je nestala. Rekla
      je da ima nešto veliko. Rekla je "ako se išta dogodi, gledaj u
      GeoTermu." I prekinula.

      To je zadnje šta sam čula od nje. Pičku materinu.
    effects: { trust_barbara: "+10" }
    choices:
      - What do you think happened? -> barbara_theory
      - Move on -> quest1_hub

  barbara_theory:
    type: message
    text: >
      BARBARA: Mislim da je našla dokaz da GeoTerma uništava termalne
      izvore i da su ju ušutkali. Ali isto mislim da taj creepy kolega
      — Lovro — zna više nego šta govori. Način na koji priča o njoj...
      to nije samo profesionalna briga. To je nešto drugo, buraz.

      Petra mi je rekla prije mjesec dana da joj netko u labu prolazi
      po fajlovima. Mislila je da je bezveze. Ja mislim da nije
      bezveze. Fakat ne mislim da je bezveze.
    effects: { trust_barbara: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Petra went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Filip (was skating near the old castle) -> filip_interview
      - Find Goran (forester, patrols the hills at night) -> goran_interview
      - Find Nikolina (wellness centre, saw late meeting) -> nikolina_interview
      - Find Branko (vinegrower, saw vehicles at the workshop) -> branko_interview

  # --- Filip (saw someone at Petra's car) ---

  filip_interview:
    type: tweet
    from: filip
    text: >
      opet sam bio skateat kod dvorca i brate mili atmosfera u selu
      je pre čudna zadnjih dana. nekaj ne valja i svi to osjećaju
    effects: { trust_filip: "+5" }
    choices:
      - Ask Filip about that evening -> filip_talk

  filip_talk:
    type: message
    text: >
      FILIP: buraz ok ali fakat nikomu ne govori jel. bio sam kod
      dvorca oko 19h, sunset session. i vidim tog tipa iz laba —
