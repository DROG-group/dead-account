      podatke o temperaturi vode, kemijske analize, i Petrin detaljan
      izvještaj s dokazima o EU fondovima koje načelnik preusmjerava.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Inspektor Marković ---

  inspektor_interview:
    type: message
    text: >
      INSPEKTOR MARKOVIĆ: Neslužbeno — i mislim potpuno neslužbeno —
      htio sam istraživat GeoTermu. Šef mi je rekao da se maknem.
      Rekao je da županija ima "jurisdikciju." To je šifra za "ne
      diraj."

      Situacija s Lovrom je druga stvar. Za to nisam ni znao do sad.
      Ako imaš dokaze o uhođenju, mogu postupit. To je jasno u mojoj
      nadležnosti.

      Donesi mi nešto čvrsto i ponovno ću otvorit slučaj.
    effects:
      trust_nacelnik: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened to
      Petra than anyone in Toplička Vas. Who is responsible?
    choices:
      - Confront Lovro Šimunić (the obsessive colleague) -> confront_lovro
        when:
          state: obsession_evidence
          gte: 5
      - Confront Damir Požgaj (the GeoTerma director) -> confront_damir
        when:
          state: corporate_evidence
          gte: 3
      - Confront Načelnik Kramarić (political protection & EU kickbacks) -> confront_zdravko
      - I need more evidence -> investigation_hub

  # --- ENDING A: Lovro (Best Ending) ---

  confront_lovro:
    type: message
    text: >
      You present your evidence to Lovro:

      "Znam da je @tomislav_cehulic tvoj račun. Znam da si stavio GPS
      tracker na Petrin auto. Znam da si joj pristupao fajlovima u
      labu. Znam da si je promatrao iz auta ispred radionice. Imam
      svjedoke i pristupne logove."
    choices:
      - Send -> lovro_response

  lovro_response:
    type: message
    text: >
      Lovro doesn't reply for a long time. Then:

      LOVRO: Ne razumiješ. Štitio sam je. Bila je u opasnosti od
      GeoTerme i nije mi dala da joj pomognem. Morao sam znati da
      je sigurna. Sve šta sam napravio je jer mi je stalo do nje.

      That's not care. That's obsession.

      You've already sent the evidence to Inspektor Marković. And to
      Ana Matić.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Inspektor Marković reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the witness
      testimonies — Lovro is arrested for stalking and harassment. A
      GPS tracker is recovered from under Petra's Renault at the old
      house near Izvor Svete Katarine.

      Ana Matić, finally in possession of Petra's full evidence package,
      publishes the GeoTerma story in Jutarnji list. The county orders
      an immediate halt to all drilling operations. GeoTerma's permits
      are revoked pending environmental review. Damir Požgaj faces
      criminal charges for falsifying environmental impact assessments.
      Načelnik Kramarić is investigated for misuse of EU funds — the
      "consultancy fees" were kickbacks for approving GeoTerma's
      drilling permits.

      And Petra Novaković, reading the story from a friend's apartment
      in Varaždin, calls her sister for the first time in nine days.

      "Dolazim doma."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: petra
    text: >
      termalna voda ne laže. i ljudi topličke vasi ne lažu.
      hvala šta niste odustali. 🌿
    choices:
      - The End -> game_complete

  # --- ENDING B: Damir (Partial Ending) ---

  confront_damir:
    type: message
    text: >
      You present the drilling evidence to Damir Požgaj:

      "Imam fotografije neprijavljenih bušotina. Imam podatke koji
      pokazuju pad temperature izvora za 4 stupnja. Imam izvorne
      procjene utjecaja na okoliš koje su falsificirane. Imam dokaze
      o EU fondovima koji završavaju na načelnikovom računu."
    choices:
      - Send -> damir_response

  damir_response:
    type: message
    text: >
      DAMIR: Ovaj razgovor se prosljeđuje našem pravnom odjelu. Svako
      objavljivanje klevete će rezultirati trenutnim tužbama. GeoTerma
      je uvijek poslovala u skladu sa svim propisima.

      But it's too late. You've sent the evidence to Ana, to the
      Čuvari Izvora, and to the county administration.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The drilling story breaks. GeoTerma is ordered to halt all
      operations pending investigation. The company may leave the
      region. Eighty jobs hang in the balance. The village is divided.
      Načelnik Kramarić resigns amid the EU funds scandal.

      But Petra?

      Without the stalking evidence, Lovro is never investigated. He
      continues to work at the biology department. He continues to
      monitor her accounts. He creates a new anonymous profile.

      Three months later, Petra reads about GeoTerma online. She
      returns quietly. She changes her research location. She stops
      going to the springs alone. She checks her car every morning.

      The corporation is exposed. The springs begin to recover. But
      the person who terrorised Petra walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: petra
    text: "vratila sam se. izvori se oporavljaju. ostatak... vidjet ćemo."
    choices:
      - The End -> game_complete

  # --- ENDING C: Načelnik (Wrong Ending) ---

  confront_zdravko:
    type: message
    text: >
      You confront Načelnik Kramarić with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> zdravko_response

  zdravko_response:
    type: tweet
    from: vesna
    text: >
      Moj klijent prima na znanje vaše navode. Svako javno iznošenje
      klevete rezultirat će trenutnim pravnim postupkom.
      — Odvjetnički ured Kunić & partneri, Zagreb
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The načelnik's lawyer buries your accusation. Without a direct
      link between Kramarić and GeoTerma's drilling damage — and the
      EU fund trail is complex enough to stall for years — your
      evidence is insufficient to force immediate action.

      GeoTerma continues to drill. Lovro continues to watch. Petra
      stays in hiding. The springs grow colder week by week.

      Six months later, @tomislav_cehulic creates a new account. It
      follows Petra's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: TOPLIČKA VAS — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Petra's story explores themes of corporate
      greed, environmental destruction, EU fund corruption, obsessive
      behaviour, community solidarity, and the courage to protect what
      matters.

      If you or someone you know is experiencing stalking, harassment,
      or needs help:
      Plavi telefon: 0800 0551
      Hrabri telefon (za djecu i mlade): 116 111
      Policija: 192
