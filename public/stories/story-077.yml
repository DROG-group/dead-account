entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN VALEA VERDE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to ValeaVerde.social — the community Mastodon instance for
      the village of Valea Verde, Maramureș.

      The local feed is tense today. Something has happened in the
      mountains.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name keeps appearing:
      @ioana_popescu.

      A shepherd. Photographer of mountain landscapes. She documented
      the valleys and ridges above the village. People are worried.
      She hasn't posted in six days. Her flock came down the mountain
      alone.
    choices:
      - Look at her profile -> ioana_profile

  ioana_profile:
    type: tweet
    from: ioana
    text: "Apa din pârâul de sub Vârful Roșu e portocalie. Cineva toarnă chimicale de la sondaj. Am poze, am probe. Nu mai tac."
    choices:
      - That's her last real post... -> grey_mountain

  grey_mountain:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photo of fog over a mountain ridge. Posted at 2am.
      No caption.

      Her friends say that's not her style. Ioana always wrote long
      captions about the land. The police say she probably went to
      visit relatives. But her flock came back without her. A shepherd
      doesn't abandon her sheep.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: sergent
    text: >
      Am primit o sesizare privind o locuitoare din Valea Verde. La
      acest moment, nu există indicii care să confirme o faptă penală.
      Orice informație utilă poate fi comunicată la 112 sau la postul
      de poliție comunal.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @elena_lazar is
      desperate. Her brother @radu_popescu is driving down from Sighet.
      Her father @gheorghe_popescu hasn't said a word — just went up
      the mountain with the dogs. The vet @florin_ardelean says
      Ioana's sheep came back stressed, as if they'd been running.

      And the journalist @liviu_pintea, who was working with her on
      something, is strangely silent.

      Nobody buys the police's line. Nobody thinks Ioana just "went
      to visit relatives."
    effects: { trust_elena: "+5", trust_radu: "+5" }
    choices:
      - Start following Ioana's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Valea Verde. Follow Ioana's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Dana (bodega owner, knows everyone) -> dana_intro
      - Talk to Mihai (forester, knows the mountains) -> mihai_intro
      - Talk to Claudia (teen photographer, seems shaken) -> claudia_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Ioana with the slow rhythms of a
      Maramureș village: weather warnings for the peaks, the bakery's
      cozonac recipe, church announcements, someone's cow breaking
      through a fence.

      Key names surface: Elena (best friend, teacher), Petru Varga
      (mountain guide, oddly fixated on Ioana's routes), Liviu
      (journalist, gone quiet), and the teens — Claudia, Sergiu,
      Dorina — who loved Ioana's mountain photography.

      Also prominent: AuroCarp Mining SRL, the gold exploration
      company with drilling rigs above the village. Their posts are
      corporate PR. Ioana's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Dana -> dana_intro
      - Talk to Mihai -> mihai_intro
      - Talk to Claudia -> claudia_intro

  # --- Dana (social map) ---

  dana_intro:
    type: tweet
    from: dana
    text: >
      Bodega e deschisă da' nu-i chef de nimic. @ioana_popescu,
      masa ta te așteaptă. Hai acasă, fată.
    effects: { trust_dana: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dana -> dana_talk

  dana_talk:
    type: message
    text: >
      DANA: Ești nou pe aici? Bine ai venit, da' ai nimerit prost
      cu timing-ul. Toată lumea e pe jar din cauza Ioanei.

      Stai că-ți zic eu cine-i cine. Elena e cea mai bună prietenă
      a Ioanei — profesoară la școală, sufletul ei. Gheorghe e tac-su,
      cioban de o viață, nu vorbește mult da' suferă în tăcere. Radu
      e fratele ei, vine de la Sighet.

      Petru Varga — ghidul montan — ăla-i ciudat. Îl vedeam mereu
      pe urmele Ioanei pe munte. Zicea că-i studiază traseele pentru
      turiști, da' mie mi se părea altceva. Ioana s-a plâns odată
      că o urmărește.

      Și AuroCarp Mining — firma aia cu sondajele de aur. Ioana
      le-a găsit de cap. A zis că otrăvesc apa. Doi săptămâni mai
      târziu, a dispărut. Fă tu legătura.
    effects: { trust_dana: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Petru Varga -> dana_petru
      - Ask about AuroCarp -> dana_aurocarp
      - Thank her and move on -> quest1_hub

  dana_petru:
    type: message
    text: >
      DANA: Petru? E ghid montan de vreo cinci ani. Știe fiecare
      potecă, fiecare stână. Da' de când a venit Ioana cu turma pe
      traseele de sus, s-a lipit de ea. Venea la bodegă când era ea
      aici. Se oferea să o însoțească pe munte. Ea zicea nu, el tot
      insista.

      Odată mi-a zis: "Dana, ăla mă urmărește. Știe exact pe unde
      merg cu oile. E ca și cum ar avea GPS pe mine." Am zis că
      exagerează. Acum nu mai cred că exagera.
    effects: { trust_dana: "+5" }
    choices:
      - Ask about AuroCarp -> dana_aurocarp
      - Move on -> quest1_hub

  dana_aurocarp:
    type: message
    text: >
      DANA: AuroCarp Mining. Au venit acum doi ani cu promisiuni —
      locuri de muncă, dezvoltare, investiții. Primarul a semnat tot
      ce i-au pus în față. Au început sondaje explorative pe dealul
      de deasupra pârâului.

      De atunci, apa din pârâul de sub Vârful Roșu e portocalie.
      Oile nu mai beau de acolo. Peștii au murit. Copiii se îmbolnăveau
      de la apa din fântâni.

      Ioana a fost prima care a luat probe, a făcut poze, a trimis
      la laborator. Avea dovezi. Dovezi reale. Și acum a dispărut.
    effects: { trust_dana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mihai (forester, mountains, witness tease) ---

  mihai_intro:
    type: tweet
    from: mihai
    text: >
      35 de ani de pădure. apa din pâraie nu mai e cum era.
      @ioana_popescu avea dreptate. și acum nu mai e. gândiți-vă.
    effects: { trust_mihai: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Mihai -> mihai_talk

  mihai_talk:
    type: message
    text: >
      MIHAI: Eu sunt pădurar de când mă știu. Cunosc fiecare vale,
      fiecare izvor. Și-ți spun clar — apa de sub sondajele AuroCarp
      e otrăvită. Am văzut cu ochii mei cum iese portocalie din
      pământ lângă platformele lor.

      Ioana a luat probe. A coborât pe vale cu sticle de apă și le-a
      trimis la Cluj, la laborator. Rezultatele au arătat cianuri și
      metale grele de zece ori peste limită.

      Tu crezi că-i coincidență? Eu nu cred în coincidențe pe munte.
    effects: { trust_mihai: "+10" }
    choices:
      - Did you see anything unusual recently? -> mihai_night
      - Move on -> quest1_hub

  mihai_night:
    type: message
    text: >
      MIHAI: În noaptea dinainte să dispară — eu făceam tură de noapte,
      pe la 11 seara. Am văzut lumini sus la stâna Ioanei. Nu-i
      neobișnuit, ciobanii stau noaptea. Da' erau două mașini acolo.
      Una era Dacia ei veche. Cealaltă era un SUV negru cu numere de
      Cluj — am văzut sigla AuroCarp pe ușă.

      La 11 noaptea. La stâna din munte. Asta nu-i normal.

      Am notat în registru. Nimeni nu m-a întrebat.
    effects: { trust_mihai: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Claudia (teen photographer, witness tease) ---

  claudia_intro:
    type: tweet
    from: claudia
    text: >
      ce pula mea se întâmplă @ioana_popescu ea m-a învățat să fac
      poze pe munte gen nu e posibil să fi plecat așa. dacă știe
      cineva ceva ziceți vă rog
    effects: { trust_claudia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Claudia -> claudia_talk_early

  claudia_talk_early:
    type: message
    text: >
      CLAUDIA: ești nou? nasol timing frr. ioana e gen cea mai mișto
      persoană din sat. ne-a învățat să facem poze, ne ducea pe munte,
      ne arăta animalele. era ca o soră mai mare pt noi.

      și acum sunt flipată rău pcq sergiu a văzut ceva ciudat pe
      munte da' nu vrea să zică. zice că nu-i nimic da' gen... se
      vede pe el că-i speriat. bags pula dacă nu-i ceva nasol
    effects: { trust_claudia: "+10" }
    choices:
      - What did Sergiu see? -> claudia_sergiu_hint
      - Move on -> quest1_hub

  claudia_sergiu_hint:
    type: message
    text: >
      CLAUDIA: nu știu exact. el era pe bicicletă pe drumul forestier
      și a văzut gen pe cineva lângă stâna Ioanei care scotea chestii
      din mașina ei? sau punea ceva? nu știu. când l-a văzut Sergiu,
      ăla a fugit.

      sergiu e panicat, nu vrea probleme. trebuie să-i vorbești
      direct da' e méfiant cu oamenii noi. încearcă să-i vorbești
      despre mountain bike întâi lol
    effects: { trust_claudia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Valea Verde. A Maramureș mountain
      village built around shepherding and forest. A young shepherd
      who was exposing mining pollution. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Elena (Ioana's best friend) -> elena_q1
      - Talk to Petru Varga (mountain guide) -> petru_q1
      - Check what Radu (Ioana's brother) is saying -> radu_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Elena Q1 ---

  elena_q1:
    type: tweet
    from: elena
    text: >
      dacă cineva are vești de @ioana_popescu sunați-mă vă rog.
      camera ei e neatinsă. ciobănescul ei e aici. ea nu pleacă
      niciodată fără Rex.
    effects: { trust_elena: "+5", contacts_followed: "+1" }
    choices:
      - DM Elena -> elena_q1_talk

  elena_q1_talk:
    type: message
    text: >
      ELENA: Apreciez că scrii, da' nu te cunosc. Ioana are mulți
      prieteni aici. Sunt sigură că o să revină.

      ...tot repet asta. Nu mai cred.

      [Elena is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_elena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Petru Q1 ---

  petru_q1:
    type: tweet
    from: petru
    text: >
      Am bătut toate traseele de pe Vârful Roșu. Nici urmă de
      @ioana_popescu. Stâna e goală. Focul stins de zile. Cineva
      trebuie să facă ceva.
    effects: { trust_petru: "+5", contacts_followed: "+1" }
    choices:
      - DM Petru -> petru_q1_talk

  petru_q1_talk:
    type: message
    text: >
      PETRU: Ioana și cu mine suntem colegi de munte. Eu ghid, ea
      ciobăniță. Cunosc fiecare potecă pe care merge cu turma.
      Le-am cartografiat pe toate — pentru turiști, evident.

      Am fost sus și am căutat-o. Stâna e abandonată. Focul e stins
      de cel puțin patru zile. Lucrurile ei sunt acolo — sacul de
      dormit, lanterna, caietul. Dar ea nu e.

      Și ceva e ciudat — laptopul ei lipsește. De ce ar lua laptopul
      și ar lăsa totul?

      [Petru seems very knowledgeable about Ioana's movements. Almost
      too knowledgeable.]
    effects: { trust_petru: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Radu Q1 ---

  radu_q1:
    type: tweet
    from: radu
    text: >
      sora mea A DISPĂRUT și poliția îmi zice că poate a plecat la
      rude??? EA NU PLEACĂ FĂRĂ SĂ ZICĂ. vin de la sighet. cineva
      o să-mi explice ce dracu s-a întâmplat.
    effects: { trust_radu: "+5", contacts_followed: "+1" }
    choices:
      - DM Radu -> radu_q1_talk

  radu_q1_talk:
    type: message
    text: >
      RADU: Cine ești tu? Încă unul din sat care-mi zice să mă
      calmez? Sora mea m-a sunat în seara dinainte să dispară. A zis
      că are ceva mare. A zis "dacă se întâmplă ceva, uită-te la
      AuroCarp." Apoi a închis.

      Ăla e ultimul lucru pe care l-am auzit de la ea.
    effects: { trust_radu: "+10" }
    choices:
      - What do you think happened? -> radu_theory
      - Move on -> quest1_hub

  radu_theory:
    type: message
    text: >
      RADU: Eu cred că a găsit dovezi că AuroCarp otrăvește apa și
      ăia au făcut-o să tacă. Da' mai cred și altceva — ghidul ăla,
      Petru Varga, știe mai mult decât zice. Cum vorbește el despre
      ea... nu-i doar grijă de coleg. E altceva.

      Ioana mi-a zis acum câteva luni că cineva îi urmărește traseele.
      Găsea urme pe potecile ei, urme de bocanci care nu erau ale
      ciobănilor. Ea a crezut că-i nimic. Eu nu mai cred că-i nimic.
    effects: { trust_radu: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Ioana went silent. Multiple people
      saw or heard things in the mountains. Piece together the timeline
      from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Sergiu (was biking on the forest road) -> sergiu_interview
      - Find Mihai (forester, night patrol) -> mihai_interview
      - Find Cosmin (baker, starts at 4am) -> cosmin_interview
      - Find Florin (vet, called out that night) -> florin_interview

  # --- Sergiu (saw someone at Ioana's truck) ---

  sergiu_interview:
    type: tweet
    from: sergiu
    text: >
      am fost pe trail ieri da' vibe-ul pe munte e altfel acum.
      gen e un feeling nasol. la naiba nu știu cum să explic
    effects: { trust_sergiu: "+5" }
    choices:
      - Ask Sergiu about that evening -> sergiu_talk

  sergiu_talk:
    type: message
    text: >
      SERGIU: frr ok da' nu zici la nimeni. eram pe drumul forestier
      pe la 7 seara, trail session. și l-am văzut pe petru varga —
      ghidul — lângă Dacia Ioanei de la stână. părea că scotea ceva
      de sub mașină. sau punea ceva. nu știu.

      când m-a văzut, a plecat repede de acolo. futu-i ce ciudat
      era. gen tipul ăla e mereu pe munte da' nu la stâna ei la
      ora aia.

      eu n-am zis nimic pcq cine mă crede pe mine? un puști cu
      bicicletă. ce pula mea.
    effects:
      trust_sergiu: "+10"
      night_witnesses: "+1"
