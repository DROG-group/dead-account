      - Back to stalker thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened to
      Ioana than anyone in Valea Verde. Who is responsible?
    choices:
      - Confront Petru Varga (the obsessive hiker) -> confront_petru
        when:
          state: stalker_evidence
          gte: 5
      - Confront Bogdan Ionescu (the mining director) -> confront_bogdan
        when:
          state: mining_evidence
          gte: 3
      - Confront Mayor Moldovan (political protection) -> confront_maria
      - I need more evidence -> investigation_hub

  # --- ENDING A: Petru (Best Ending) ---

  confront_petru:
    type: message
    text: >
      You present your evidence to Petru:

      "I know @marius_neagu is your account. I know you put a GPS
      tracker on Ioana's truck. I know you followed her routes for
      months. I know you were watching her house from the hill. I
      have witnesses and I have the trail logs."
    choices:
      - Send -> petru_response

  petru_response:
    type: message
    text: >
      Petru doesn't reply for a long time. Then:

      PETRU: Nu înțelegi. O protejam. Era în pericol din cauza
      firmei și nu mă lăsa s-o ajut. Trebuia să știu că e în
      siguranță. Tot ce am făcut a fost pentru că-mi pasă de ea.

      Asta nu e grijă. E obsesie.

      Ai trimis deja dovezile la Sergent Stanciu. Și la Liviu
      Pintea.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Sergent Stanciu redeschide cazul. Cu dovezile tale — contul
      anonim, tracker-ul GPS, log-urile de traseu, mărturiile — Petru
      Varga e arestat pentru urmărire și hărțuire. Un tracker GPS e
      recuperat de sub Dacia Ioanei de la colibele vechi de la Vâlcea.

      Liviu Pintea, cu dosarul complet de dovezi, publică povestea
      AuroCarp în Libertatea. Prefectura ordonă inspecție neanunțată.
      Sondajele sunt oprite. Bogdan Ionescu e pus sub urmărire
      penală pentru falsificarea rapoartelor de mediu.

      Și Ioana Popescu, citind articolul dintr-o casă la Baia Mare,
      își sună fratele pentru prima dată în nouă zile.

      "Vin acasă."

      If you or someone you know is experiencing stalking or
      harassment, call:
      Telefonul Sufletului (copii și adolescenți): 116 111
      Linia verde anti-violență: 0800 500 333
      Urgențe mediu: 0800 888 677
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: ioana
    text: >
      muntele nu minte. și oamenii din valea verde nici atât.
      mulțumesc că nu ați renunțat.
    choices:
      - The End -> game_complete

  # --- ENDING B: Bogdan (Partial Ending) ---

  confront_bogdan:
    type: message
    text: >
      You present the pollution evidence to Bogdan Ionescu:

      "Am fotografii cu conducta nedeclarată de scurgere. Am probe de
      apă cu metale grele de zece ori peste limita legală. Am
      rapoartele originale care arată că datele au fost falsificate.
      Am butoiul cu numărul vostru de lot."
    choices:
      - Send -> bogdan_response

  bogdan_response:
    type: message
    text: >
      BOGDAN: Această conversație va fi transmisă departamentului
      juridic. Orice publicare de materiale defăimătoare va duce la
      acțiuni legale imediate. AuroCarp Mining a operat întotdeauna
      în limitele reglementărilor.

      Dar e prea târziu. Ai trimis dovezile la Liviu, la Munții
      Noștri, și la prefectură.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      Povestea poluării explodează. AuroCarp primește ordin de oprire
      a sondajelor. Firma s-ar putea închide. 50 de locuri de muncă
      atârnă în balanță. Satul e împărțit.

      Dar Ioana?

      Fără dovezile de urmărire, Petru nu e niciodată investigat.
      Continuă să ghideze pe munte. Continuă să-i monitorizeze
      conturile. Creează un nou profil anonim.

      Trei luni mai târziu, Ioana citește despre AuroCarp online.
      Se întoarce în liniște. Își schimbă traseele. Nu mai urcă pe
      munte singură. Verifică mașina în fiecare dimineață.

      Firma e expusă. Dar persoana care a terorizat-o pe Ioana umblă
      liberă.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: ioana
    text: "m-am întors. apa e mai curată. restul... vom vedea."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_maria:
    type: message
    text: >
      You confront Mayor Moldovan with your evidence.

      Within the hour, you receive a message from her office:
    choices:
      - Read the response -> maria_response

  maria_response:
    type: tweet
    from: nicoleta
    text: >
      Clienta mea ia act de acuzațiile dumneavoastră. Orice
      publicare de afirmații defăimătoare va face obiectul unor
      proceduri legale imediate. — Cabinet Dragomir & Asociații,
      Cluj-Napoca
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      Avocatul primarului îți îneacă acuzația. Fără o legătură
      directă între Moldovan și poluarea AuroCarp — și nu există
      una dincolo de protecție politică — dovezile tale sunt
      insuficiente.

      AuroCarp continuă să foreze. Petru continuă să urmărească.
      Ioana rămâne ascunsă.

      Șase luni mai târziu, @marius_neagu creează un cont nou. Îl
      urmărește pe fratele Ioanei.
    choices:
      - The End -> game_complete

