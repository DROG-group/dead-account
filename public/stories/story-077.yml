# DEAD ACCOUNT — Story 077: Valea Verde (Romania)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-077.yml
#
# Player investigates the disappearance of shepherd Ioana Popescu
# in the fictional Maramureș village of Valea Verde.

