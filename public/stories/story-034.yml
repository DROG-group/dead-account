          gte: 5
      - Confront Micheal Hennessy (salmon farm director) -> confront_hennessy
        when:
          state: corporate_evidence
          gte: 3
      - Confront Councillor Cotter (political cover-up) -> confront_cotter
      - I need more evidence -> investigation_hub

  # --- ENDING A: Stalker (Best Ending) ---

  confront_stalker:
    type: message
    text: >
      You compile everything: posting history, notebook, CCTV, forum
      bans, card number, ignored Garda report, Eoin's annotated
      timeline.

      You present it to Garda Buckley and post a public thread:
      "Someone has been stalking Eoin Kelleher for nine months.
      Online and in person. Here is the evidence."
    choices:
      - Post it -> stalker_response

  stalker_response:
    type: message
    text: >
      The community explodes. Three more people come forward — all
      saw the same man watching the workshop at different times.

      Garda Buckley traces the card number. A name emerges. Cork
      city. Previous conviction for harassment. His flat: hundreds
      of printed photos of Eoin's boats, a GPS tracker receipt,
      a map of Rosscarrig with Eoin's routes in red.

      You've also sent the salmon farm evidence to Deirdre.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE STALKER

      Garda Buckley arrests the man from Cork. With the evidence —
      notebook, CCTV, forum history, witnesses — he's charged with
      stalking, harassment, and criminal surveillance. A GPS tracker
      is found on Eoin's van.

      Deirdre publishes the salmon farm story. RTE picks it up. The
      EPA orders an unannounced inspection. The farm's licence is
      suspended. Hennessy faces criminal charges. Cotter resigns.

      And Eoin Kelleher, reading the news from a friend's house in
      Kenmare, calls his mam for the first time in nine days.

      "I'm coming home, Mam. Is the workshop okay?"
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: eoin
    text: >
      the bay is still here. the boats are still here. i'm still
      here. thanks for not giving up. there's a currach to finish.
    choices:
      - The End -> game_complete

  # --- ENDING B: Hennessy (Partial Ending) ---

  confront_hennessy:
    type: message
    text: >
      You present the evidence to Micheal Hennessy:

      "Underwater photos of the pipe. UCC lab results. Drums from
      the seabed with your batch numbers. Eoin's full report
      naming you personally."
    choices:
      - Send -> hennessy_response

  hennessy_response:
    type: message
    text: >
      HENNESSY: This communication has been forwarded to our legal
      team. Any publication of defamatory material will result in
      immediate legal proceedings. Atlantic Salmon Corp operates
      within all regulatory requirements.

      But it's too late. You've sent everything to Deirdre, to the
      heritage association, and directly to the EPA.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. Atlantic Salmon Corp's licence is
      suspended. The farm may close. Fifty jobs at stake.

      But without the stalking evidence, the man from Cork is never
      identified. New account. Finds Eoin's new location within a
      month. Messages start again.

      Three months later Eoin comes home. Changes the locks. Checks
      over his shoulder every time he walks to the pier. Stops
      working late.

      The corporation is exposed. The person who terrorised Eoin
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: eoin
    text: "i'm back. the bay is cleaner. but i still lock the door now. that's new."
    choices:
      - The End -> game_complete

  # --- ENDING C: Cotter (Wrong Ending) ---

  confront_cotter:
    type: message
    text: >
      You confront Councillor Cotter with your evidence.

      Within the hour, you receive a message from her solicitor:
    choices:
      - Read the response -> cotter_response

  cotter_response:
    type: tweet
    from: liam
    text: >
      My client notes your allegations with concern. Any public
      dissemination of defamatory statements will be met with
      immediate legal action. — Burke & Associates, Cork
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      Cotter's solicitor buries it. No direct link between her
      and the disappearance. Insufficient for charges.

      Atlantic Salmon Corp operates. The stalker watches. Eoin
      hides.

      Six months later, @CorkBoatFan89 creates a new account.
      It follows Eoin's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: ROSSCARRIG — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Stalker evidence: ${stalker_evidence}

      Thank you for playing. Eoin's story explores themes of
      corporate pollution, political negligence, online stalking,
      community solidarity, and the courage to speak up.

      If you or someone you know is experiencing stalking,
      harassment, or emotional distress, help is available:
      Samaritans Ireland: 116 123 (free, 24 hours)
      Women's Aid: 1800 341 900
      An Garda Siochana: 999 / 112
