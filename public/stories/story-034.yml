      Month 1: "Beautiful craftsmanship. Keeping the tradition alive."
      Month 3: "Why don't you reply? I just want to learn from you."
      Month 5: "I was in Rosscarrig. Your workshop is smaller than
      I imagined. The blue door is nice."
      Month 7: "I see you at the pub Fridays. Same corner. I was
      there too."
      Month 8: "You blocked me again. I'll always find my way back."

      No photos. No bio. Just Eoin. Only Eoin.
    effects:
