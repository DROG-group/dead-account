# DEAD ACCOUNT — Story 034: Rosscarrig (Ireland 2)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-034.yml
#
# Player investigates the disappearance of young traditional boat builder
# Eoin Kelleher in the fictional West Cork village of Rosscarrig.

