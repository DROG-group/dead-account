  # --- Water Test Data ---

  water_test_data:
    type: message
    text: >
      Eoin's public blog has water quality updates. Six sample points
      around the bay. Nearest the farm cages: emamectin thirty times
      the limit. Copper off the charts. Ammonia has created a dead
      zone on the seabed.

      His dive log: "Found the pipe. Pumping untreated waste straight
      into the bay. No settlement tank. Raw discharge."
    effects:
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue -> corruption_hub

  # --- Deirdre ---

  deirdre_interview:
    type: message
    text: >
      DEIRDRE: I don't discuss sources. Ever.
    effects: { trust_deirdre: "+5" }
    choices:
      - Show Deirdre the evidence you have -> deirdre_with_evidence
        when:
          state: corporate_evidence
          gte: 3
      - Back to corporate thread -> corruption_hub

  deirdre_with_evidence:
    type: message
    text: >
      DEIRDRE: ...Jesus. You've more than I expected.

      Eoin and I were working together. He had footage of the
      discharge pipe — raw waste into the bay. Lab results from
      UCC. Everything.

      We were going to publish and tip off RTE. Then he vanished.
      Two days later someone broke into my car and took my backup
      USB.

      Eoin is alive. Contacted me from a phone I didn't recognise.
      Said he's hiding. Said "they came to the workshop and someone
      else has been following me." Two separate threats.

      I can't say where he is. But with enough evidence I can
      publish and make it safe for him to come home.
    effects:
      trust_deirdre: "+25"
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Who threatened him? -> deirdre_hint
      - Back to investigation hub -> investigation_hub

  deirdre_hint:
    type: message
    text: >
      DEIRDRE: Hennessy — the operations director — came to his
      workshop that night with some solicitor fella from Cork.
      Told him to hand over everything or they'd sue him into
      oblivion. Intimidation dressed up as legal process.

      But Eoin also said something about a fella who'd been
      tracking him. Someone from the internet who'd found out where
      he lives. That's a different kettle of fish entirely.
    choices:
      - Back to investigation hub -> investigation_hub

