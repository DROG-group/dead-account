  title: "Dead Account"
  state:
    # Trust levels per NPC (0-100)
    trust_cian: 0
    trust_saoirse: 0
    trust_oisin: 0
    trust_niamh: 0
    trust_roisin: 0
    trust_cathal: 0
    trust_donal: 0
    trust_siobhan: 0
    trust_tommy: 0
    trust_aine: 0
    trust_finbar: 0
    trust_deirdre: 0
    trust_micheal: 0
    trust_grainne: 0
    trust_tadhg: 0
    trust_liam: 0
    trust_nora: 0
    trust_sean: 0
    trust_aoife: 0
    trust_garda: 0
    trust_anon: 0
    # Progress counters
    contacts_followed: 0
    night_witnesses: 0
    corporate_evidence: 0
    stalker_evidence: 0
