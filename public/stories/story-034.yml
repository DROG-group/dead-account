  player:
    name: New Resident
    bio: "just landed in rosscarrig. west cork is something else"
    avatar: avatars/default_citizen.png

  bot:
    display_name: "Rosscarrig.social"
    description: "Failte go Rosscarrig - West Cork community instance"
    avatar_url: /gamepatch/assets/dead-account/bot.png

  npcs:
    # === Eoin's Inner Circle ===
    eoin:
      name: "Eoin Kelleher"
      bio: "boat builder | naomhog & currachs | the bay is home | rosscarrig born & bred"
      avatar: avatars/eoin.jpg
    cian:
      name: "Cian Kelleher"
      bio: "eoin's brother | fisherman | rosscarrig harbour | i'll find him myself if i have to"
      avatar: avatars/cian.jpg
    saoirse:
      name: "Saoirse Driscoll"
      bio: "eoin's ex | primary teacher | rosscarrig NS | still care about him no matter what"
      avatar: avatars/saoirse.jpg
    roisin:
      name: "Roisin Kelleher"
      bio: "eoin's mam | runs the post office | 30 years in rosscarrig | my boy would never just leave"
      avatar: avatars/roisin.jpg

    # === Local Community ===
    niamh:
      name: "Niamh O'Driscoll"
      bio: "pub owner | The Anchor | trad sessions friday | the heart of rosscarrig"
      avatar: avatars/niamh.jpg
    donal:
      name: "Donal McCarthy"
      bio: "harbour master | rosscarrig pier | 6am-6pm | the bay is my office"
      avatar: avatars/donal.jpg
    siobhan:
      name: "Siobhan Crowley"
      bio: "pharmacist | rosscarrig | open 7 days | here if you need anything"
      avatar: avatars/siobhan.jpg
    tommy:
      name: "Tommy O'Brien"
      bio: "retired trawlerman | 45 years at sea | the salmon farms are killing this bay"
      avatar: avatars/tommy.jpg
    aine:
      name: "Aine Hurley"
      bio: "baker | Hurley's Bakery | soda bread & scones | 5am every morning rain or shine"
      avatar: avatars/aine.jpg
    finbar:
      name: "Finbar O'Sullivan"
      bio: "heritage officer | west cork | traditional boats are our culture"
      avatar: avatars/finbar.jpg
    nora:
      name: "Nora Healy"
      bio: "librarian | rosscarrig library | local history collection | book club thursdays"
      avatar: avatars/nora.jpg
    sean:
      name: "Sean Og Daly"
      bio: "sean-nos singer | rosscarrig | the old songs carry the truth"
      avatar: avatars/sean.jpg

    # === Teens ===
    oisin:
      name: "Oisin"
      bio: "16 | hurling & fishing | eoin taught me to build a currach | this is fucked"
      avatar: avatars/oisin.jpg
    aoife:
      name: "Aoife"
      bio: "17 | tiktok & trad | west cork girl | eoin is sound out he wouldn't just vanish"
      avatar: avatars/aoife.jpg
    tadhg:
      name: "Tadhg"
      bio: "15 | gamer | kayaking | rosscarrig is grand but there's feck all to do"
      avatar: avatars/tadhg.jpg

    # === Journalist ===
    deirdre:
      name: "Deirdre Linehan"
      bio: "journalist | Southern Star | environment & coast | tips: deirdre@southernstar.ie"
