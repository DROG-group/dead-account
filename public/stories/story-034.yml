    # === Media & Community ===
    actu_ross:
      name: "Rosscarrig News"
      bio: "Local news & events | Rosscarrig & West Cork | tips: news@rosscarrig.ie"
      avatar: avatars/actu_ross.jpg
    meteo_cork:
      name: "West Cork Weather"
      bio: "Forecasts & warnings | Mizen to Kinsale | updated hourly"
      avatar: avatars/meteo_cork.jpg
    heritage_assoc:
      name: "West Cork Heritage Boats"
      bio: "Preserving traditional boat building | naomhoga & currachs | est. 2003"
      avatar: avatars/heritage_assoc.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN ROSSCARRIG
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to rosscarrig.social — the community Mastodon instance for
      Rosscarrig, a small fishing village in West Cork, Ireland.

      The local feed is buzzing. Something has happened in the village.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling the feed, one name keeps coming up: @eoin_kelleher.

      A young boat builder. Currachs and naomhoga, traditional Irish
      boats. He had a workshop down by the harbour. People loved him.
      He hasn't posted in six days and nobody can find him.
    choices:
      - Look at his profile -> eoin_profile

  eoin_profile:
    type: tweet
    from: eoin
    text: "the bay is dying. dead fish in the nets again. the salmon farm discharge is poison and everyone in the council knows it. i have the water tests. going public."
    choices:
      - That's his last post... -> strange_post

  strange_post:
    type: message
    text: >
      Three days after that post, his account uploaded a single
      photo: blurry open water. No boat, no context. Posted at 4am.
      No caption.

      His friends say that's not him. Eoin always wrote long captions.
      The Gardai say he probably went travelling. His mam says his
      passport is in the drawer.
    choices:
      - Read the Garda statement -> garda_statement
      - Look at what people are saying -> community_reaction

  garda_statement:
    type: tweet
    from: garda
    text: >
      We have received a report regarding a Rosscarrig resident.
      At this stage there is no evidence of foul play. Mr Kelleher
      is an adult and is entitled to his privacy. Anyone with
      information can contact Rosscarrig Garda Station.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The village is losing its mind. His mam @roisin_kelleher posts
      every hour. His brother @cian_kelleher is searching the coast
      in his trawler. His ex @saoirse_driscoll is sharing his photo.

      Tommy O'Brien says Eoin was right about the salmon farm. The
      journalist @deirdre_linehan has gone quiet. And there's a
      strange account — @CorkBoatFan89 — commenting on everything.

      Nobody thinks Eoin just fecked off on holiday.
    effects: { trust_cian: "+5", trust_roisin: "+5" }
    choices:
      - Start following Eoin's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Rosscarrig. Follow Eoin's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Niamh (pub owner, knows everyone) -> niamh_intro
      - Talk to Tommy (retired fisherman, angry about the bay) -> tommy_intro
      - Talk to Oisin (teen, Eoin's apprentice) -> oisin_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Eoin with the rhythms of West Cork:
      tide times, GAA results, weather warnings off the Atlantic.

      Key names: Cian (brother, fisherman), Roisin (mam, post office),
      Saoirse (ex, teacher), Tommy (retired fisherman, furious about
      the salmon farm). The teens — Oisin, Aoife, Tadhg — sharing
      Eoin's photos everywhere.

      Also prominent: Atlantic Salmon Corp. Their posts are pure
      corporate shite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Niamh -> niamh_intro
      - Talk to Tommy -> tommy_intro
      - Talk to Oisin -> oisin_intro

  # --- Niamh (social map) ---

  niamh_intro:
    type: tweet
    from: niamh
    text: >
      The Anchor is open but it's not the same without Eoin in the
      corner with his pint. Come home love. Your seat is waiting.
    effects: { trust_niamh: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Niamh -> niamh_talk

  niamh_talk:
    type: message
    text: >
      NIAMH: Ah you're new? Welcome to Rosscarrig, desperate time
      to arrive though. The whole village is in bits over Eoin.

      Cian is his older brother, fisherman, demented with worry.
      Roisin — their mam — runs the post office. Saoirse was Eoin's
      girlfriend til about a year ago, still friends.

      Tommy O'Brien — old trawlerman — says the salmon farm is
      destroying the bay. Eoin backed him up with actual water tests.
      Then there's CorkBoatFan89 — been commenting on everything
      Eoin posts for months. Bit intense like.

      And Deirdre Linehan from the Southern Star — she and Eoin were
      working on something together. Gone fierce quiet since he
      vanished.
    effects: { trust_niamh: "+10", contacts_followed: "+2" }
    choices:
      - Ask about CorkBoatFan89 -> niamh_boatfan
      - Ask about Atlantic Salmon Corp -> niamh_salmon
      - Thank her and move on -> quest1_hub

  niamh_boatfan:
    type: message
    text: >
      NIAMH: CorkBoatFan89. Been around eight months? At first it
      was "deadly work" and "class craftsmanship" — grand like. But
      then it got much. Asking where his workshop was. Wanting to
      visit. DMs about meeting up. Eoin showed me some and said
      "this lad won't feck off."

      Blocked the account twice. Came back both times.
    effects: { trust_niamh: "+5" }
    choices:
      - Ask about Atlantic Salmon Corp -> niamh_salmon
      - Move on -> quest1_hub

  niamh_salmon:
    type: message
    text: >
      NIAMH: Atlantic Salmon Corp. Bollocks to them. Set up three
      years ago. Promised jobs, promised they'd be grand for the bay.
      Council fast-tracked the planning. Grainne Cotter pushed it
      through.

      Fishermen noticed straight away. Dead fish. Chemical smell.
      Tommy was shouting about it for years. Then Eoin started taking
      water samples and sending them to labs in Cork. Real numbers.
      Heavy metals, sea lice chemicals, the works.

      Two weeks after he said he was going public, he's gone.
    effects: { trust_niamh: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tommy (the water, witness tease) ---

  tommy_intro:
    type: tweet
    from: tommy
    text: >
      45 years fishing this bay. never seen it like this. dead crabs
      in the pots. fish with sores on them. @eoin_kelleher had the
      proof and now he's gone. connect the fecking dots.
    effects: { trust_tommy: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tommy -> tommy_talk

  tommy_talk:
    type: message
    text: >
      TOMMY: That salmon farm is poisoning the bay. The sea lice
      chemicals — emamectin, cypermethrin — killing everything. And
      the waste. Thousands of fish shitting into the bay with no
      treatment.

      Eoin actually did something. Took samples, sent them to UCC.
      The numbers were bad. Heavy metals ten times what they should
      be. And the council signed off on every fecking inspection.

      The night before he vanished — I was at the pier around
      midnight. Saw lights at his workshop. And a car I didn't
      recognise.
    effects: { trust_tommy: "+10" }
    choices:
      - What car? -> tommy_night
      - Move on -> quest1_hub

  tommy_night:
    type: message
    text: >
      TOMMY: Black SUV. Company car. Atlantic Salmon Corp sticker
      on the windscreen. Two fellas went to Eoin's workshop. There
      twenty minutes. When they left one was carrying something.
      Laptop bag.

      Told the Guards. Buckley wrote it down. Feck all happened.
    effects: { trust_tommy: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Oisin (teen, Eoin's apprentice) ---

  oisin_intro:
    type: tweet
    from: oisin
    text: >
      eoin is sound out like he taught me everything about building
      currachs and now he's just gone?? this is absolute bollocks
      someone knows something. if anyone has info ffs say it
    effects: { trust_oisin: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Oisin -> oisin_talk_early

  oisin_talk_early:
    type: message
    text: >
      OISIN: who are you?? ah right new here. deadly timing. look
      eoin is the soundest lad in rosscarrig. was teaching me and
      tadhg to build a proper currach. tarred canvas, lath frame.
      fecking class.

      now he's vanished and the guards say he's probably grand??
      he's NOT grand. his workshop is locked up and there's shite
      all over the floor like someone went through his stuff.

      also right. aoife told me something. not gas — creepy. she
      saw someone at the workshop the week before. just standing
      there watching. at night. she's too scared to say it online
    effects: { trust_oisin: "+10" }
    choices:
      - Who was watching? -> oisin_watcher_hint
      - Move on -> quest1_hub

  oisin_watcher_hint:
    type: message
    text: >
      OISIN: she didn't get a proper look like it was dark. but she
      said he was taking photos of the workshop with his phone. just
      standing by the wall across the road clicking away.

      she reckons it might be that CorkBoatFan89 weirdo from online.
      the one who's been commenting on everything eoin does for
      months. pure creepy shite.

      talk to aoife if you can but she's fierce nervous about it.
      she doesn't want drama like. tell her i sent you or whatever
    effects: { trust_oisin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Rosscarrig. A West Cork fishing
      village built around the harbour. A young boat builder who was
      exposing pollution from a salmon farm. A disappearance that
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Roisin (Eoin's mam) -> roisin_q1
      - Talk to Cian (Eoin's brother) -> cian_q1
      - Talk to Saoirse (Eoin's ex) -> saoirse_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Roisin Q1 ---

  roisin_q1:
    type: tweet
    from: roisin
    text: >
      Please if anyone has seen my son Eoin Kelleher please contact
      the Guards or message me here. His passport is at home. His
      tools are in the workshop. He did NOT go travelling. Please.
    effects: { trust_roisin: "+5", contacts_followed: "+1" }
    choices:
      - DM Roisin -> roisin_q1_talk

  roisin_q1_talk:
    type: message
    text: >
      ROISIN: I don't know you but I appreciate anyone who cares.
      Eoin is a good boy. He loves this village. He loves the sea.
      He would never leave without telling me.

      The Guards say give it time. I'm his mother. I know when
      something is wrong.

      [Roisin is distraught. She'll open up more as you build trust.]
    effects: { trust_roisin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Cian Q1 ---

  cian_q1:
    type: tweet
    from: cian
    text: >
      spent all day searching the coast in the trawler. nothing.
      i swear to god if someone has hurt eoin i'll tear this village
      apart. the guards are doing FUCK ALL.
    effects: { trust_cian: "+5", contacts_followed: "+1" }
    choices:
      - DM Cian -> cian_q1_talk

  cian_q1_talk:
    type: message
    text: >
      CIAN: Who are you? Right. My brother called me two nights
      before. Rattled. Said "the salmon crowd know I have the
      results" and "there's some lad online who knows where I live."

      Then nothing. Phone off. Account posts a blurry photo at 4am.
      That's not Eoin. Someone else did that.
    effects: { trust_cian: "+10" }
    choices:
      - Two threats? The company AND someone online? -> cian_theory
      - Move on -> quest1_hub

  cian_theory:
    type: message
    text: >
      CIAN: There's the salmon crowd who want his evidence gone.
      And there's this freak from the internet stalking him. One
      of them got to him.

      Eoin told me months ago someone was sending weird messages.
      His boats, his workshop, where he goes. Reported it to the
      Guards. "It's just the internet." Fuck sake.
    effects: { trust_cian: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Saoirse Q1 ---

  saoirse_q1:
    type: tweet
    from: saoirse
    text: >
      I know we broke up but Eoin is still one of my best friends.
      He's the kindest person I know. Please share his photo. Please
      help us find him.
    effects: { trust_saoirse: "+5", contacts_followed: "+1" }
    choices:
      - DM Saoirse -> saoirse_q1_talk

  saoirse_q1_talk:
    type: message
    text: >
      SAOIRSE: We were together two years. Broke up because he's
      married to the boats, not because of anything bad. Still
      friends.

      But lately he was different. Anxious. Checking over his
      shoulder. Someone from the boating forums found his real name
      and was sending him stuff. And people from the salmon farm
      came to his workshop and told him to drop it.

      He didn't drop it. That's Eoin. Stubborn as a mule.
    effects: { trust_saoirse: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Eoin went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Aoife (was near the workshop that evening) -> aoife_interview
      - Find Donal (harbour master, works late) -> donal_interview
      - Find Aine (baker, starts at 5am, heard something) -> aine_interview
      - Find Sean Og (singer, was walking the pier late) -> sean_interview

  # --- Aoife (saw someone at workshop) ---

  aoife_interview:
    type: tweet
    from: aoife
    text: >
      i keep thinking about what i saw last week but like i don't
      want to start drama. but also eoin is missing so fuck it
    effects: { trust_aoife: "+5" }
    choices:
      - Ask Aoife what she saw -> aoife_talk

  aoife_talk:
    type: message
    text: >
      AOIFE: ok so don't go mental. walking home from trad session
      around 11. someone outside eoin's workshop. not eoin. standing
      in the dark taking photos of the workshop with his phone.

      saw me and legged it. toward the pier. tallish, big jacket.
      creepy as fuck.

      oisin reckons it's CorkBoatFan89 but we've no proof. didn't
      want to say it online in case i'm wrong
    effects:
      trust_aoife: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Donal (harbour master, saw late-night visitors) ---

  donal_interview:
    type: tweet
    from: donal
    text: >
      Reminder: the harbour area is closed to public access between
      11pm and 5am. I've noticed unauthorised vehicles at the pier
      after hours recently.
    effects: { trust_donal: "+5" }
    choices:
      - Ask Donal what he saw -> donal_talk

  donal_talk:
    type: message
    text: >
      DONAL: Locking up the harbour office around 11:30. Eoin's van
      at the workshop — normal, he works late. But a black SUV beside
      it. Atlantic Salmon Corp sticker.

      Two men at Eoin's door. One I recognised — Micheal Hennessy,
      operations director. At half eleven at night.

      Logged it in the harbour record. Nobody's asked to see it.
    effects:
      trust_donal: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Aine (baker, heard argument) ---

  aine_interview:
    type: tweet
    from: aine
    text: >
      Up at 4:30 as usual for the ovens. But that morning wasn't
      usual. Heard shouting from down by the harbour around 5. Not
      normal for Rosscarrig.
    effects: { trust_aine: "+5" }
    choices:
      - Ask Aine what she heard -> aine_talk

  aine_talk:
    type: message
    text: >
      AINE: Start the bread at half four. That morning — voices from
      the harbour. Raised. An argument.

      Car engine, driving too fast for the pier road. Ten minutes
      later a second vehicle — Eoin's van, that rattle in the
      exhaust you can hear a mile away.

      Told Buckley. "Could have been anyone." Absolute bollocks.
    effects:
      trust_aine: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Sean Og (singer, late walk on pier) ---

  sean_interview:
    type: tweet
    from: sean
    text: >
      was out walking the pier late after the session. the bay was
      strange that night. lights where there shouldn't be lights.
    effects: { trust_sean: "+5" }
    choices:
      - Ask Sean Og what he saw -> sean_talk

  sean_talk:
    type: message
    text: >
      SEAN OG: Walk the pier after sessions. That night around
      midnight — lights on the water. Not fishing boats. A
      spotlight moving along the salmon farm cages. Someone out
      there at midnight.

      On the way back I passed Eoin's workshop. Light on. I could
      hear him talking to someone. Voice tight. Trying to keep calm.

      Knocked. Eoin opened a crack — "grand, Sean, all grand." He
      wasn't grand. Hands shaking.
    effects:
      trust_sean: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.

      You can keep collecting testimonies or talk to Roisin (his mam)
      and Tadhg (saw someone watching the workshop before).
    choices:
      - Talk to Roisin about that night -> roisin_interview
      - Talk to Tadhg -> tadhg_interview
      - Find Aoife -> aoife_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Donal -> donal_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Aine -> aine_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Sean Og -> sean_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Roisin (last to hear from Eoin) ---

  roisin_interview:
    type: tweet
    from: roisin
    text: >
      that photo on eoin's account is NOT him. eoin writes about
