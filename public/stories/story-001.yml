      - Keep them safe. I'll come back when I'm ready -> investigation_hub

  # --- Kuiper ---

  kuiper_interview:
    type: message
    text: >
      KUIPER: Something about the waterfront deal doesn't smell right.
      The valuation came from a firm I'd never heard of. The tender
      period was unusually short. De Vries abstained instead of
      recusing — there's an important legal difference.

      If you want to understand: find the council agenda, item 14b.
      Then find an independent valuation. Compare the numbers.
    effects:
      trust_kuiper: "+15"
      corruption_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to corruption thread -> corruption_hub

  # --- Mila (USB drive) ---

  mila_interview:
    type: message
    text: >
      MILA: ok so like two weeks before she disappeared, noor gave me
      something. she was like "hold onto this for me" and "don't tell
      anyone."

      it's a usb drive. she looked me dead in the eyes and said "if
      anything happens to me, give this to pim veldkamp. no one else."

      i haven't opened it. i'm too scared honestly. but if you think
      it can help her... if you actually think you're gonna bring her
      home...
    choices:
      - I'm going to bring her home. Let me take it to Pim -> mila_usb_yes
      - Keep it safe for now -> mila_usb_wait

  mila_usb_yes:
    type: message
    text: >
      Mila reaches into her bag with shaking hands and gives you a
      small USB drive.

      MILA: please be careful. and please bring her back.
    effects:
      corruption_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  mila_usb_wait:
    type: message
    text: >
      MILA: okay. but promise me — when you're ready, you'll come
      back for it. noor trusted me with this. i don't wanna let her
      down.
    effects: { trust_mila: "+10" }
    choices:
      - Back to corruption thread -> corruption_hub

  # --- Nina (Pim's envelope) ---

  nina_interview:
    type: message
    text: >
      NINA: Pim asked me to hold a sealed envelope. He said "if
      someone comes asking for this with the right question, give it
      to them." I asked what the right question was. He said "They'll
      ask about what Noor found at the art centre."
    effects: { trust_nina: "+10" }
    choices:
      - What did Noor find at the art centre? -> nina_envelope
      - Back to corruption thread -> corruption_hub

  nina_envelope:
    type: message
    text: >
      Nina goes quiet. Then reaches under the counter.

      NINA: Pim said you'd come. Here. Don't open it here.

      The envelope contains Pim's investigation notes: a summary of
      the corruption evidence, the connection between De Vries and
      Van Bergen, and which documents prove what.
    effects:
      corruption_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Pim ---

  pim_interview:
    type: message
    text: >
      PIM: I don't discuss ongoing matters with people I don't know.
    effects: { trust_pim: "+5" }
    choices:
      - Show Pim corruption evidence -> pim_with_evidence
        when:
          state: corruption_evidence
          gte: 3
      - Back to corruption thread -> corruption_hub

  pim_with_evidence:
    type: message
    text: >
      PIM: You have them. You actually have the documents.

      Listen carefully: Noor is alive. She's safe. I helped her get
      out of Zuidhaven because she was afraid — not of the council
      people, of someone closer.

      I can't tell you where she is. But with these documents, I can
      publish the story. And once it's published, it's safer for
      everyone.
    effects:
      trust_pim: "+25"
      evidence_total: "+1"
    choices:
      - Ask who she was afraid of -> pim_hint
      - Back to investigation hub -> investigation_hub

  pim_hint:
    type: message
    text: >
      PIM: I can't... look. She was afraid of someone she used to
      trust. Someone local. Someone who wouldn't let go.

      That's all I can say. Figure out who that is and you'll have
      the whole picture.
    choices:
      - Back to investigation hub -> investigation_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened to
      Noor than anyone in Zuidhaven. Who is responsible?
    choices:
      - Confront Thomas Groot (the ex-boyfriend) -> confront_thomas
        when:
          state: stalking_evidence
          gte: 5
      - Confront Hans de Vries (the alderman) -> confront_devries
        when:
          state: corruption_evidence
          gte: 3
      - Confront Marco van Bergen (the developer) -> confront_marco
      - I need more evidence -> investigation_hub

  # --- ENDING A: Thomas (Best Ending) ---

  confront_thomas:
    type: message
    text: >
      You present your evidence to Thomas:

      "I know @sportief_zh is your account. I know your car was at the
      art centre the night Noor disappeared. I know you took her phone
      and deleted her posts. I know you posted the black square.
      I have witnesses."
    choices:
      - Send -> thomas_response

  thomas_response:
    type: message
    text: >
      Thomas doesn't reply for a long time. Then:

      THOMAS: You don't know what you're talking about. She's my ex.
      I was worried about her. That's not a crime. I'm going to the
      police about this harassment.

      He blocks you.

      But you've already sent the evidence to Agent van Dijk. And to
      Pim Veldkamp.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE STALKER

      Three things happen in quick succession.

      Officer Van Dijk reopens the case. With your evidence — the alt
      account, the car sighting, the deleted posts, the witness
      testimonies — there's enough for an arrest warrant. Thomas is
      brought in. Noor's phone is recovered from his apartment.

      Pim Veldkamp, finally in possession of Noor's document photos,
      publishes the corruption story in a national newspaper. Alderman
      De Vries resigns. The land deal is referred to provincial
      authorities.

      And Noor El Amrani, reading about De Vries's resignation from
      Rotterdam, calls her sister for the first time in ten days.

      "I'm coming home."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: noor
    text: >
      i chose this place and i'd choose it again. thank you for not
      giving up.
    choices:
      - The End -> game_complete

  # --- ENDING B: De Vries (Partial Ending) ---

  confront_devries:
    type: message
    text: >
      You present the corruption evidence to De Vries:

      "The waterfront land was sold to your university friend for 40%
      below market value. The valuation was done by a firm with one
      client: the buyer. You abstained from a vote you should have
      recused yourself from. I have the documents."
    choices:
      - Send -> devries_response

  devries_response:
    type: message
    text: >
      DE VRIES: This conversation is being forwarded to my legal
      counsel. You will be hearing from Visser & Partners. These
      allegations are defamatory.

      But it's too late. You've sent the evidence to Pim, Kuiper,
      and the mayor.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE POLITICIAN

      The corruption story breaks. De Vries resigns "to spend time
      with family." Marco's project is suspended. The community
      council demands an audit.

      But Noor?

      Without the stalking evidence, Thomas is never investigated.
      He continues to live in Zuidhaven. He continues to carry
      Noor's phone.

      Three months later, Noor reads about De Vries online. She
      quietly returns. She changes the locks on her studio. She
      stops posting after dark.

      The corruption is exposed. But the person who hurt Noor
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: noor
    text: "i'm back. i'll explain one day. maybe."
    choices:
      - The End -> game_complete

  # --- ENDING C: Marco (Wrong Ending) ---

  confront_marco:
    type: message
    text: >
      You contact Marco van Bergen with your evidence.

      Within minutes, you receive a message from his lawyer:
    choices:
      - Read the response -> visser_response

  visser_response:
    type: tweet
    from: visser
    text: >
      My client is aware of your defamatory communications. Any
      repetition will result in immediate legal proceedings under
      Article 261 of the Dutch Criminal Code. Consider this your
      formal notice. — Visser & Partners Advocaten
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE DEVELOPER

      Marco's lawyer buries your accusation. Without proof of a
      direct connection to Noor — and there is none — your evidence
      crumbles.

      De Vries remains in office. Marco's project continues. Noor
      stays in hiding.

      Six months later, @sportief_zh creates a new account. It
      follows Noor's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Stalking evidence: ${stalking_evidence}
      Corruption evidence: ${corruption_evidence}

      Thank you for playing. Noor's story explores themes of stalking,
      corruption, community trust, and the power of paying attention.

      If you or someone you know is experiencing stalking or domestic
      violence, help is available:
      Veilig Thuis: 0800-2000
      Slachtofferhulp: 0900-0101
