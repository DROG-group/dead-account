entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN ZUIDHAVEN
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to zuidhaven.social — the community Mastodon instance for
      the town of Zuidhaven, South Holland.

      The local feed is busy today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice a pattern. A lot of posts
      mention the same name: @noor_creates.

      A local artist. People are worried. She hasn't posted in a week.
    choices:
      - Look at her profile -> noor_profile

  noor_profile:
    type: tweet
    from: noor
    text: "I think someone is watching me."
    choices:
      - That's her last real post... -> black_square

  black_square:
    type: message
    text: >
      Three days after that post, her account posted a single image:
      a solid black square. No caption. No alt text. Posted at 2am.

      Her friends say that's not her. The police say there's no crime.
      Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: politie
    text: >
      We have received a report regarding the wellbeing of a Zuidhaven
      resident. At this time there is no indication of a criminal matter.
      Anyone with information can contact us at 0800-8844.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The responses are all over the place. Her best friend @lisa_bakker
      is freaking out. Her ex @thomas_groot is posting worried messages.
      Her sister @yara_el_amrani is going off at the police.

      And someone called @wakker_nederland is ranting about a conspiracy.

      One thing's clear: nobody buys the police statement. Nobody
      thinks Noor just "needed space."
    effects: { trust_lisa: "+5", trust_yara: "+5" }
    choices:
      - Start following Noor's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Zuidhaven. Follow Noor's contacts and read their posts.
      The more you engage with the community, the more they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to the florist (Margriet seems friendly) -> margriet_intro
      - Talk to the barber (Ahmed knows everyone) -> ahmed_intro
      - Talk to the skateboarder (Jordy says he saw something) -> jordy_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is a mix of worried posts about Noor, everyday stuff,
      weather updates, and one very loud conspiracy account. Under all
      the worry, this is a tight community. People tag each other
      constantly. Everyone seems to know everyone.

      Some names keep coming up: Lisa (baker, Noor's best friend),
      Thomas (gym guy, Noor's ex), David (photographer, works next
      to Noor at the art centre), Pim (journalist, weirdly quiet).
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Margriet -> margriet_intro
      - Talk to Ahmed -> ahmed_intro
      - Talk to Jordy -> jordy_intro

  # --- Margriet (social map) ---

  margriet_intro:
    type: tweet
    from: margriet
    text: >
      if anyone needs me i'll be at the shop arranging flowers and
      worrying about @noor_creates. this town is not the same without her.
    effects: { trust_margriet: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Margriet -> margriet_talk

  margriet_talk:
    type: message
    text: >
      MARGRIET: Oh, you're new! Welcome to Zuidhaven. Terrible timing
      though. Everyone's upset about Noor.

      Let me give you the rundown. Lisa at the bakery is Noor's best
      friend — she's a mess right now. Thomas, the gym guy, is Noor's
      ex — they broke up about four months ago. David Chen is a
      photographer at the art centre where Noor has her studio. And Pim
      Veldkamp is a journalist who's being really quiet about the whole
      thing, which isn't like him at all.

      Oh, and just ignore @wakker_nederland. He means well but he sees
      conspiracies in his cornflakes.
    effects: { trust_margriet: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the breakup with Thomas -> margriet_thomas
      - Ask about the art centre -> margriet_artcentre
      - Thank her and move on -> quest1_hub

  margriet_thomas:
    type: message
    text: >
      MARGRIET: Thomas and Noor? They were together for about eight
      months. He seemed nice enough — charming, good-looking, always at
      the gym. But Lisa never liked him. Said he was "too much." I didn't
      think anything of it at the time. Noor seemed happy. Then suddenly
      they split and Noor threw herself into her work.

      Thomas was at the cafe after she disappeared, asking everyone if
      they'd heard from her. Very concerned. Almost... too concerned?
      No, I shouldn't say that. I'm sure he's just worried like everyone.
    effects: { trust_margriet: "+5" }
    choices:
      - Ask about the art centre -> margriet_artcentre
      - Move on -> quest1_hub

  margriet_artcentre:
    type: message
    text: >
      MARGRIET: The art centre is beautiful. Old building — the council
      owns it. Noor has a studio there, David has the one next door.
      I did the flowers for her last exhibition. "Local Voices." She
      sold two pieces!

      She loved that building. Said it had "layers." I think she meant
      the character, the history. It's been a lot of things over the
      years — council offices, a school, storage. Now it's mostly
      studios and exhibition space.
    effects: { trust_margriet: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ahmed (gossip, Thomas detail) ---

  ahmed_intro:
    type: tweet
    from: ahmed
    text: >
      thirty years behind this chair and i've never known the town like
      this. @noor_creates, wherever you are — we miss you.
    effects: { trust_ahmed: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ahmed -> ahmed_talk

  ahmed_talk:
    type: message
    text: >
      AHMED: You're new! Come in, sit down. Coffee? Let me tell you
      about this town.

      Everyone comes through my shop. I know everyone's story. And I
      know when something's off. This thing with Noor — something is
      very off.
    effects: { trust_ahmed: "+10" }
    choices:
      - Ask what he's noticed -> ahmed_noticed
      - Ask about Thomas -> ahmed_thomas_early

  ahmed_noticed:
    type: message
    text: >
      AHMED: People are scared. Not just worried — scared. Lisa's
      opening the bakery late, which she never does. Sophie upstairs
      hasn't left her apartment. Even the kids — Mila, Anouk — they're
      posting about Noor nonstop.

      And you know what bugs me? The police. One statement. One. That's
      not normal. When old Meneer Bakker wandered off last year, they
      had three updates in a day. For Noor? Nothing.
    effects: { trust_ahmed: "+5" }
    choices:
      - Ask about Thomas -> ahmed_thomas_early
      - Move on -> quest1_hub

  ahmed_thomas_early:
    type: message
    text: >
      AHMED: Thomas? He's a regular. Good tipper, talks a lot. After
      the breakup he was in here every week talking about the gym, his
      clients, the usual. But lately... I don't know. Something's
      shifted. He asks about Noor a lot. "Have you seen Noor?" "Does
      Noor still come in?" For someone who's "moved on," he's very
      interested.
    effects: { trust_ahmed: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Jordy (witness tease) ---

  jordy_intro:
    type: tweet
    from: jordy
    text: >
      ok so that @noor_creates thing... i might have seen smth the other
      night but idk if it even matters. should i go to the police?? they
      never take me seriously anyway lol
    effects: { trust_jordy: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jordy -> jordy_talk_early

  jordy_talk_early:
    type: message
    text: >
      JORDY: yo so i was skating near the harbour that night right?
      like 11ish? and i saw this car pull up to sophie's building. some
      dude got out, went to the door, and a woman came out and got in
      the car mad fast. like FAST fast. then they just drove off.

      i posted about it but literally nobody cared. now im thinking
      maybe it was relevant?? idk. the police would just tell me to
      stop skating at night tbh
    effects: { trust_jordy: "+10" }
    choices:
      - That could be important. Can you describe the car? -> jordy_car_early
      - Thanks Jordy, I might come back to this -> quest1_hub

  jordy_car_early:
    type: message
    text: >
      JORDY: dark hatchback. kinda beat up. dented bumper i think? the
      guy was like thirties or whatever. didn't get a good look ngl. the
      woman had something wrapped around her, like a big scarf or
      blanket. she practically ran to the car.

      honestly at the time i just thought it was some couple drama or
      smth. but now with noor missing and that being right where she
      lives...
    effects: { trust_jordy: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Zuidhaven. A small town where everyone
      knows everyone. An artist who was loved. A disappearance that
      doesn't make sense. A black square nobody believes is hers.

      You've made some contacts. Now dig deeper.
    choices:
      - Talk to Lisa (Noor's best friend) -> lisa_q1
      - Talk to Thomas (Noor's ex) -> thomas_q1
      - Check what Yara (Noor's sister) is saying -> yara_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lisa Q1 ---

  lisa_q1:
    type: tweet
    from: lisa
    text: >
      if anyone has seen or heard from @noor_creates please DM me.
      this is not like her. please. i'm begging.
    effects: { trust_lisa: "+5", contacts_followed: "+1" }
    choices:
      - DM Lisa -> lisa_q1_talk

  lisa_q1_talk:
    type: message
    text: >
      LISA: I appreciate you reaching out but I don't really know you.
      Noor has a lot of people who care about her. I'm sure she'll
      turn up. She just needs space sometimes.

      [Lisa is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_lisa: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Thomas Q1 ---

  thomas_q1:
    type: tweet
    from: thomas
    text: >
      anyone heard from @noor_creates? getting worried fr. she's not
      answering messages. if you see her lmk
    effects: { trust_thomas: "+5", contacts_followed: "+1" }
    choices:
      - DM Thomas -> thomas_q1_talk

  thomas_q1_talk:
    type: message
    text: >
      THOMAS: Hey! Yeah, Noor and I dated for a bit. We split up a
      few months ago, totally amicable. She's a great person. I hope
      she's okay, really. Let me know if you hear anything?

      We're all worried.

      [Thomas seems genuine. Or is he performing?]
    effects: { trust_thomas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Yara Q1 ---

  yara_q1:
    type: tweet
    from: yara
    text: >
      my sister has been MISSING for a WEEK and the police keep telling
      me there's "no indication of criminal activity" LIKE HELLO??
      she didn't just vanish into thin air. SOMEONE DO SOMETHING.
    effects: { trust_yara: "+5", contacts_followed: "+1" }
    choices:
      - DM Yara -> yara_q1_talk

  yara_q1_talk:
    type: message
    text: >
      YARA: who are you? another person from that town with "thoughts
      and prayers"? my sister is MISSING and nobody is doing ANYTHING.
      unless you have actual info, don't waste my time.
    effects: { trust_yara: "+5" }
    choices:
      - I want to help find out what happened -> yara_q1_soften
      - Move on -> quest1_hub

  yara_q1_soften:
    type: message
    text: >
      YARA: ...sorry. i'm not sleeping. i'm not eating. i've called
      the police four times. they keep saying the same thing.

      i never trusted that town. and that ex of hers — Thomas. i met
      him twice and both times he made my skin crawl.
    effects: { trust_yara: "+10" }
    choices:
      - What didn't you like about Thomas? -> yara_thomas
      - Move on -> quest1_hub

  yara_thomas:
    type: message
    text: >
      YARA: the way he'd answer questions FOR her. the way he'd check
      her phone when he thought nobody was looking. the way he always
      knew where she was. i told noor he was a walking red flag. she
      said i was overreacting.
    effects: { trust_yara: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Noor went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Bas (was at the cafe that night) -> bas_interview
      - Find Jan (bike mechanic, works late near art centre) -> jan_interview
      - Find David (photographer, studio next to Noor's) -> david_interview
      - Find Gerrit (butcher, shop window faces the street) -> gerrit_interview

  # --- Bas (saw Thomas leave cafe) ---

  bas_interview:
    type: tweet
    from: bas
    text: >
      open mic at the 'rood tonight, decent crowd. thomas from the gym
      just stormed out looking pissed lmao. some people cant handle
      thursdays i guess
    effects: { trust_bas: "+5" }
    choices:
      - Ask Bas about that night -> bas_talk

  bas_talk:
    type: message
    text: >
      BAS: yeah thomas was there, slammed his beer down and just
      bounced. thought he was having a bad day or whatever. this was
      around ten? maybe a bit before. he was on his phone the whole
      evening, looking stressed. then he just got up and left. didn't
      say bye to anyone.

      he was with henk earlier — the construction guy. but henk stayed.
      thomas just... left.
    effects:
      trust_bas: "+10"
      night_witnesses: "+1"
      stalking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Jan (saw Thomas's car) ---

  jan_interview:
    type: tweet
    from: jan
    text: >
      working late. someone's parked outside the art centre again.
      silver golf. mate, the car park is around the back.
    effects: { trust_jan: "+5" }
    choices:
      - Ask Jan about the car -> jan_talk

  jan_talk:
    type: message
    text: >
      JAN: Yeah, I saw Thomas's silver Golf parked outside the art
      centre that night. Thought it was weird. I'd fixed his bike the
      week before and we'd chatted about his car. Silver VW Golf, bit
      scratched up.

      The gym closes at nine. Thomas has no reason to be at the art
      centre at half ten at night. He doesn't make art. He doesn't
      have a studio there.

      I told the police but they said it was "noted."
    effects:
      trust_jan: "+10"
      night_witnesses: "+1"
      stalking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- David (heard shouting) ---

  david_interview:
    type: tweet
    from: david
    text: >
      i don't want to say things i can't take back. but something
      happened and i think people should be asking harder questions.
    effects: { trust_david: "+5" }
    choices:
      - DM David -> david_talk_low
        when:
          state: trust_david
          lt: 50
      - DM David -> david_talk_high
        when:
          state: trust_david
          gte: 50

  david_talk_low:
    type: message
    text: >
      DAVID: I don't really know what's going on with Noor. We're
      colleagues at the art centre. I hope she's okay.

