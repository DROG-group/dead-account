# DEAD ACCOUNT — Story 059: Borgo di Luna (Italy, Round 3)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-059.yml
#
# Player investigates the disappearance of truffle hunter Marco Bianchi
# in the fictional Umbrian hill town of Borgo di Luna.

meta:
  title: "Dead Account — Borgo di Luna"
  state:
    # Trust levels per NPC (0-100)
    trust_giulia: 0
    trust_luca: 0
    trust_nonna: 0
    trust_enzo: 0
    trust_chiara: 0
    trust_tommaso: 0
    trust_valentina: 0
    trust_piero: 0
    trust_agnese: 0
    trust_sergio: 0
    trust_elena: 0
    trust_massimo: 0
    trust_francesca: 0
    trust_dario: 0
    trust_ilaria: 0
    trust_matteo: 0
    trust_rosa: 0
    trust_filippo: 0
    trust_benedetta: 0
    trust_maresciallo: 0
    trust_anon: 0
    # Progress counters
    contacts_followed: 0
    night_witnesses: 0
    corporate_evidence: 0
    obsession_evidence: 0
    evidence_total: 0

  player:
    name: Nuovo Residente
    bio: "appena trasferito a borgo di luna. scopro l'umbria un tartufo alla volta"
    avatar: avatars/default_citizen.png

  bot:
    display_name: "BorgoDiLuna.social"
    description: "Benvenuti sull'istanza comunitaria di Borgo di Luna"
    avatar_url: /gamepatch/assets/dead-account/borgodiluna_bot.png

  npcs:
    # === Marco's Inner Circle ===
    marco:
      name: "Marco Bianchi"
      bio: "tartufaio | i boschi parlano se sai ascoltare | la terra non mente"
      avatar: avatars/marco.jpg
    giulia:
      name: "Giulia Bianchi"
      bio: "sorella di marco | insegnante elementare | borgo di luna | il silenzio non è una risposta"
      avatar: avatars/giulia.jpg
    luca:
      name: "Luca Conti"
      bio: "miglior amico di marco | meccanico | officina conti | birra e tartufi"
      avatar: avatars/luca.jpg
    nonna:
      name: "Nonna Adele"
      bio: "83 anni | marco è il mio nipote preferito (non ditelo agli altri) | i tartufi li trovavo prima di tutti voi"
      avatar: avatars/nonna.jpg

    # === Local Government ===
    piero:
      name: "Piero Castellani"
      bio: "Sindaco di Borgo di Luna | al servizio della comunità dal 2019 | #BorgoCresce"
      avatar: avatars/piero.jpg
    agnese:
      name: "Agnese Moretti"
      bio: "Assessora all'ambiente | Comune di Borgo di Luna | tutela del territorio"
      avatar: avatars/agnese.jpg
    comune:
      name: "Comune di Borgo di Luna"
      bio: "Account ufficiale | Notizie comunali | Orari: Lun-Ven 8:30-13:30"
      avatar: avatars/comune.jpg

    # === Local Business & Community ===
    valentina:
      name: "Valentina Rossi"
      bio: "Trattoria La Quercia | cucina umbra | tartufi e strangozzi | aperto dal 1974"
      avatar: avatars/valentina.jpg
    trattoria:
      name: "Trattoria La Quercia"
      bio: "Cucina tipica umbra | Tartufo fresco | Vino locale | Il cuore di Borgo di Luna"
      avatar: avatars/trattoria.jpg
    sergio:
      name: "Sergio Fabbri"
      bio: "tartufaio | 30 anni nei boschi | borgo di luna | il tartufo è mio e me lo gestisco io"
      avatar: avatars/sergio.jpg
    elena:
      name: "Elena Marchetti"
      bio: "farmacista | Borgo di Luna | consiglio e salute | aperta anche la domenica mattina"
      avatar: avatars/elena.jpg
    massimo:
      name: "Massimo Gentili"
      bio: "agricoltore | olio d'oliva | Borgo di Luna | la terra prima di tutto"
      avatar: avatars/massimo.jpg
    francesca:
      name: "Francesca Lombardi"
      bio: "fiorista | I Fiori di Borgo | bouquet e piante | colore per il borgo"
      avatar: avatars/francesca.jpg
    dario:
      name: "Dario Pellegrini"
      bio: "proprietario bar centrale | caffè e cornetti | aperitivi al tramonto"
      avatar: avatars/dario.jpg

    # === Journalist ===
    chiara:
      name: "Chiara De Luca"
      bio: "giornalista indipendente | ambiente e territorio | segnalazioni: chiara@delucastampa.it"
      avatar: avatars/chiara.jpg

    # === UmbriaVerde (corporate) ===
    umbriaverde:
      name: "UmbriaVerde Sviluppo S.r.l."
      bio: "Sviluppo sostenibile | Progetti energetici e territoriali | Certificazione ISO 14001"
      avatar: avatars/umbriaverde.jpg
    filippo:
      name: "Filippo Marini"
      bio: "direttore progetto UmbriaVerde | sviluppo e territorio | Perugia"
      avatar: avatars/filippo.jpg
    benedetta:
      name: "Avv. Benedetta Caruso"
      bio: "Avvocato | Studio Caruso & Associati | Diritto ambientale e societario | Perugia"
      avatar: avatars/benedetta.jpg

    # === Teens ===
    tommaso:
      name: "Tommaso"
      bio: "16 | skate e boschi | borgo di luna born | la natura è tutto fra"
      avatar: avatars/tommaso.jpg
    ilaria:
      name: "Ilaria"
      bio: "17 | foto e disegno | i tramonti di borgo di luna | marco mi ha insegnato i funghi"
      avatar: avatars/ilaria.jpg
    matteo:
      name: "Matteo"
      bio: "15 | mountain bike | sentieri e fango | il borgo è underrated"
      avatar: avatars/matteo.jpg

    # === Media & Community ===
    eco_borgo:
      name: "EcoBorgo"
      bio: "Notizie ambientali di Borgo di Luna e dintorni | Tips: redazione@ecoborgo.it"
      avatar: avatars/eco_borgo.jpg
    meteo_umbria:
      name: "Meteo Borgo di Luna"
      bio: "Previsioni e allerte | Stazione automatica | Aggiornamento ogni ora"
      avatar: avatars/meteo_umbria.jpg
    asso_boschi:
      name: "Associazione Sentinelle dei Boschi"
      bio: "Tutela dei boschi e del territorio umbro | Volontari | Segnalazioni disboscamento"
      avatar: avatars/asso_boschi.jpg

    # === Suspicious / Other ===
    rosa:
      name: "Rosa Ferretti"
      bio: "tecnica ambientale | UmbriaVerde | faccio il mio lavoro e basta"
      avatar: avatars/rosa.jpg
    ombra_tartufo:
      name: "L'Ombra del Tartufo"
      bio: "."
      avatar: avatars/anon.jpg
    maresciallo:
      name: "Maresciallo Ferrara"
      bio: "Carabinieri di Borgo di Luna | Stazione territoriale | emergenze: 112"
      avatar: avatars/maresciallo.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN BORGO DI LUNA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to BorgoDiLuna.social — the community Mastodon instance for
      the Umbrian hill town of Borgo di Luna.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @marco_bianchi.

      A truffle hunter. The best in the region. He knew every oak, every
      hazel, every secret hollow in the hills above Borgo di Luna. People
      are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> marco_profile

  marco_profile:
    type: tweet
    from: marco
    text: "Qualcuno sta tagliando i querceti sopra Colle Nero. Ho le foto. Ho le coordinate GPS. Questa roba non è legale."
    choices:
      - That's his last real post... -> grey_photo

  grey_photo:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurry photo of fog between oak trees. Shot from an odd angle.
      Posted at 4am. No caption.

      His friends say that is not his style. Marco always wrote long
      captions about the forest, the soil, the season. The Carabinieri
      say he probably went on a trip. Something does not add up.
    choices:
      - Read the Carabinieri statement -> carabinieri_statement
      - Look at what people are saying -> community_reaction

  carabinieri_statement:
    type: tweet
    from: maresciallo
    text: >
      Abbiamo ricevuto una segnalazione riguardante un residente di
      Borgo di Luna. Al momento non emergono elementi che configurino
      un reato. Chiunque abbia informazioni utili contatti il 112
      o si rechi presso la stazione.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @giulia_bianchi is desperate.
      His best friend @luca_conti is posting furious messages. His
      grandmother @nonna_adele is heartbroken. The rival truffle hunter
      @sergio_fabbri has gone suspiciously quiet.

      And the journalist @chiara_deluca is strangely silent.

      Nobody buys the Carabinieri's line. Nobody thinks Marco just
      "went on a trip."
    effects: { trust_giulia: "+5", trust_luca: "+5" }
    choices:
      - Start following Marco's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Borgo di Luna. Follow Marco's contacts and read their
      posts. The more you engage with the community, the more they will
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Valentina (trattoria owner, knows everyone) -> valentina_intro
      - Talk to Massimo (farmer, saw the deforestation) -> massimo_intro
      - Talk to Tommaso (teen, seems shaken) -> tommaso_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Marco with the rhythms of a small
      Umbrian hill town: olive harvest updates, the bar's aperitivo
      specials, weather warnings for the hills.

      Key names surface: Giulia (sister, teacher), Luca (best friend,
      seems furious), Chiara (journalist, oddly quiet), and the
      teens — Tommaso, Ilaria, Matteo — who idolised Marco's
      knowledge of the forest.

      Also prominent: UmbriaVerde Sviluppo S.r.l., the development
      company buying land around town. Their posts are slick PR.
      Marco's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Valentina -> valentina_intro
      - Talk to Massimo -> massimo_intro
      - Talk to Tommaso -> tommaso_intro

  # --- Valentina (social map) ---

  valentina_intro:
    type: tweet
    from: valentina
    text: >
      La trattoria è aperta ma il cuore no. @marco_bianchi, il tuo
      tavolo ti aspetta. I tuoi strangozzi al tartufo non li faccio
      per nessun altro.
    effects: { trust_valentina: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Valentina -> valentina_talk

  valentina_talk:
    type: message
    text: >
      VALENTINA: Ah, sei nuovo? Benvenuto. Brutto momento per arrivare.
      Sono tutti con i nervi a pezzi per Marco.

      Ti dico chi è chi. Giulia è la sorella — insegnante, una donna
      forte ma adesso è distrutta. Luca Conti è il migliore amico,
      meccanico, quei due sono cresciuti insieme. Nonna Adele ha 83
      anni e Marco è tutto per lei.

      Poi c'è Sergio Fabbri — l'altro tartufaio. Quei due si odiano
      da anni. Stesso bosco, stesse querce, e Sergio non sopporta che
      Marco trovi sempre i tartufi migliori. L'ossessione, ti dico.

      E Chiara De Luca — la giornalista — lei e Marco stavano
      lavorando insieme su qualcosa. Qualcosa sui disboscamenti. Da
      quando è sparito, Chiara non ha detto una parola. Non è da lei.

      Ah, e stai alla larga dai post di UmbriaVerde. Bugie con il
      bollino ISO.
    effects: { trust_valentina: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Sergio -> valentina_sergio
      - Ask about UmbriaVerde -> valentina_umbriaverde
      - Thank her and move on -> quest1_hub

  valentina_sergio:
    type: message
    text: >
      VALENTINA: Sergio? Madonna, quello è malato. Il tartufo per lui
      non è un lavoro, è una guerra. Da quando Marco ha trovato quel
      tartufo bianco da due etti l'anno scorso — venduto a Milano per
      quattromila euro — Sergio è impazzito. Lo seguiva nei boschi,
      cercava di capire le sue zone segrete.

      Marco mi ha detto una volta: "Quello non accetta un no. Se non
      può avere i miei tartufi, vuole distruggere i miei alberi."
      Pensavo parlasse in senso figurato. Adesso non ne sono più sicura.
    effects: { trust_valentina: "+5" }
    choices:
      - Ask about UmbriaVerde -> valentina_umbriaverde
      - Move on -> quest1_hub

  valentina_umbriaverde:
    type: message
    text: >
      VALENTINA: Quella società è arrivata due anni fa. Comprano
      terreni, parlano di "sviluppo sostenibile" e "parchi energetici."
      In pratica vogliono disboscare mezzo Colle Nero per metterci
      pannelli solari. Ma cazzo, quei querceti hanno trecento anni.
      Ci trovi il tartufo bianco pregiato.

      Marco era il primo a denunciare. Aveva foto dei camion che
      portavano via gli alberi di notte. Aveva coordinate GPS. Stava
      costruendo un caso. Due settimane dopo è sparito.
    effects: { trust_valentina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Massimo (farmer, witness tease) ---

  massimo_intro:
    type: tweet
    from: massimo
    text: >
      trent'anni che coltivo questa terra. i querceti sopra colle nero
      li stanno ammazzando. @marco_bianchi aveva ragione. e adesso è
      sparito. fate due più due.
    effects: { trust_massimo: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Massimo -> massimo_talk

  massimo_talk:
    type: message
    text: >
      MASSIMO: Conosco ogni sentiero di queste colline. E ti dico che
      qualcosa non va. Da mesi passano camion di notte sulla strada
      forestale verso Colle Nero. Io li sento dalla mia cascina. Motori
      pesanti, alle 2, alle 3 di notte.

      Marco è andato a controllare. Ha fotografato tutto — le piante
      tagliate, le radici strappate, il terreno preparato per qualcosa.
      Stava costruendo un dossier. E poi puf — sparito.

      Pensi sia una coincidenza? Io non credo nelle coincidenze
      in campagna.
    effects: { trust_massimo: "+10" }
    choices:
      - Did you see anything unusual recently? -> massimo_night
      - Move on -> quest1_hub

  massimo_night:
    type: message
    text: >
      MASSIMO: La notte prima che sparisse — ero sveglio per le olive,
      devo irrigare di notte in quel periodo. Verso l'una ho visto luci
      nel bosco sopra Colle Nero. Non una torcia da tartufaio, roba
      più grossa. Fari di macchina.

      E poi ho visto la macchina di Marco — quel Pandino verde che
      tutti conoscono — parcheggiata al bivio della forestale. E
      accanto c'era un SUV scuro con targa di Perugia.

      All'una di notte. Sulla forestale. Non è normale.
    effects: { trust_massimo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tommaso (teen, witness tease) ---

  tommaso_intro:
    type: tweet
    from: tommaso
    text: >
      raga sono sotto shock @marco_bianchi è tipo la persona più brava
      del borgo cioè mi ha insegnato a riconoscere i funghi madonna è
      impossibile che sia partito così. se qualcuno sa qualcosa parlate
      cazzo
    effects: { trust_tommaso: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tommaso -> tommaso_talk_early

  tommaso_talk_early:
    type: message
    text: >
      TOMMASO: ah sei nuovo? boh che palle come timing. comunque marco
      è tipo il più grande di sto borgo. ci portava nei boschi, ci
      insegnava i sentieri, i funghi, le tracce degli animali. uno
      della madonna.

      e la sono in fissa perché matteo ha visto una roba strana l'altra
      sera alla forestale ma non vuole parlarne. dice che non è niente
      ma cioè... non è niente un cazzo
    effects: { trust_tommaso: "+10" }
    choices:
      - What did Matteo see? -> tommaso_matteo_hint
      - Move on -> quest1_hub

  tommaso_matteo_hint:
    type: message
    text: >
      TOMMASO: boh non lo so esattamente. era in mountain bike sulla
      forestale al tramonto e ha visto tipo sergio — il tartufaio —
      che frugava nel Pandino di marco?? o qualcosa del genere. si è
      cagato addosso e non vuole parlarne. devi chiedergli tu ma è
      diffidente con quelli che non conosce. prova prima a parlargli
      di bici ahah
    effects: { trust_tommaso: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You are getting a picture of Borgo di Luna. An Umbrian hill town
      built around olive groves and truffle oaks. A truffle hunter who
      was exposing illegal deforestation. A disappearance nobody
      believes is voluntary.

      You have made contacts. Now dig deeper.
    choices:
      - Talk to Giulia (Marco's sister) -> giulia_q1
      - Talk to Luca (Marco's best friend) -> luca_q1
      - Check what Nonna Adele is saying -> nonna_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Giulia Q1 ---

  giulia_q1:
    type: tweet
    from: giulia
    text: >
      se qualcuno ha notizie di @marco_bianchi chiamatemi vi prego.
      casa sua è intatta. il suo cane Briciola è ancora qui. non
      sarebbe mai partito senza Briciola. mai.
    effects: { trust_giulia: "+5", contacts_followed: "+1" }
    choices:
      - DM Giulia -> giulia_q1_talk

  giulia_q1_talk:
    type: message
    text: >
      GIULIA: Grazie del messaggio ma non ti conosco. Marco ha tanti
      amici qui. Sono sicura che tornerà.

      ...Me lo ripeto da sei giorni. Non ci credo più.

      [Giulia is guarded. You will need to build more trust before she
      opens up.]
    effects: { trust_giulia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Luca Q1 ---

  luca_q1:
    type: tweet
    from: luca
    text: >
      marco non è "partito per un viaggio" minchia i carabinieri sono
      dei deficienti. il suo cane è a casa. le sue chiavi sono a casa.
      il suo tartufo è nel frigo. VI SEMBRA NORMALE???
    effects: { trust_luca: "+5", contacts_followed: "+1" }
    choices:
      - DM Luca -> luca_q1_talk

  luca_q1_talk:
    type: message
    text: >
      LUCA: Chi cazzo sei? Un altro che mi dice di calmarmi? Il mio
      migliore amico è sparito. Mi ha chiamato la sera prima. Ha detto
      che aveva qualcosa di grosso. Ha detto "se succede qualcosa,
      guarda UmbriaVerde." Poi ha riattaccato.

      È l'ultima volta che l'ho sentito.
    effects: { trust_luca: "+10" }
    choices:
      - What do you think happened? -> luca_theory
      - Move on -> quest1_hub

  luca_theory:
    type: message
    text: >
      LUCA: Penso che ha trovato le prove che UmbriaVerde sta
      disboscando illegalmente e quelli l'hanno fatto sparire. Ma
      penso anche che quel coglione di Sergio — il tartufaio rivale
      — sa più di quello che dice. Come parla di Marco... non è
      solo rivalità professionale. È un'ossessione cazzo.

      Marco mi aveva detto mesi fa che qualcuno gli rovinava le zone
      di raccolta. Tronchi segati, terreno scavato. Pensava fosse uno
      scherzo. Io non penso fosse uno scherzo per niente.
    effects: { trust_luca: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nonna Q1 ---

  nonna_q1:
    type: tweet
    from: nonna
    text: >
      il mio marco. 83 anni e non ho mai avuto tanta paura.
      @marco_bianchi torna a casa. la nonna ti aspetta. briciola
      ti aspetta. il tartufo ti aspetta.
    effects: { trust_nonna: "+5", contacts_followed: "+1" }
    choices:
      - DM Nonna Adele -> nonna_q1_talk

  nonna_q1_talk:
    type: message
    text: >
      NONNA ADELE: Ah, figlio mio. Sei buono a scrivermi. Sai, io
      facevo la tartufaia prima di Marco. Gli ho insegnato tutto io —
      i sentieri, le querce, come sentire il terreno con le mani.

      Marco è il migliore. E quel Sergio lo sa. Per anni ha cercato di
      rubargli i segreti, di seguirlo, di corrompere i suoi informatori.
      Una volta l'ho visto io — col binocolo — appostato sopra Colle
      Nero a spiare Marco col cane.

      Ho 83 anni ma non sono scema. Qualcosa di brutto è successo al
      mio nipote.
    effects: { trust_nonna: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Marco went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Matteo (was biking on the forest road) -> matteo_interview
      - Find Massimo (farmer, was up late irrigating) -> massimo_interview
      - Find Dario (bar owner, saw something after closing) -> dario_interview
      - Find Francesca (florist, early morning delivery) -> francesca_interview

  # --- Matteo (saw someone at Marco's car) ---

  matteo_interview:
    type: tweet
    from: matteo
    text: >
      giro in bici stasera ma l'atmosfera sulla forestale è strana
      raga. tipo che c'è qualcosa che non va. boh non so spiegare
    effects: { trust_matteo: "+5" }
    choices:
      - Ask Matteo about that evening -> matteo_talk

  matteo_talk:
    type: message
    text: >
      MATTEO: vabbè ok fra ma non dirlo a nessuno eh. ero sulla
      forestale verso le 19 tipo, giro al tramonto. e ho visto sergio
      — il tartufaio — vicino al Pandino di marco. stava tipo frugando
      dentro o mettendo qualcosa. quando mi ha visto è schizzato via
      che manco in downhill.

      cioè io non ho detto niente perché chi cazzo mi crede, ho 15
      anni. ma quella roba non era normale minchia
    effects:
      trust_matteo: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Massimo (saw late-night meeting) ---

  massimo_interview:
    type: tweet
    from: massimo
    text: >
      Promemoria: la forestale verso Colle Nero è chiusa al traffico
      dopo le 20. Negli ultimi giorni ci passano mezzi pesanti di
      notte. Qualcuno mi spiega?
    effects: { trust_massimo: "+5" }
    choices:
      - Ask Massimo what he saw -> massimo_talk_q2

  massimo_talk_q2:
    type: message
    text: >
      MASSIMO: Ero sveglio per l'irrigazione, verso le 23. Ho visto
      il Pandino di Marco ancora parcheggiato al bivio della forestale.
      E accanto c'era un SUV nero — targa di Perugia — con il logo
      UmbriaVerde sul fianco. Due uomini stavano vicino alla jeep.
