      photos, and the access logs."
    choices:
      - Send -> sergio_response

  sergio_response:
    type: message
    text: >
      Sergio does not reply for a long time. Then:

      SERGIO: Non capisci. Lo proteggevo. Era in pericolo con
      UmbriaVerde e non voleva il mio aiuto. Dovevo sapere che stava
      bene. Tutto quello che ho fatto era perché mi importa di quei
      boschi. Di lui.

      That is not care. That is obsession.

      You have already sent the evidence to Maresciallo Ferrara.
      And to Chiara De Luca.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Maresciallo Ferrara reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the camera trap photos, the
      witness testimonies — Sergio is arrested for stalking, harassment,
      and sabotage. A GPS tracker is recovered from under Marco's
      Pandino at the old farmhouses near Colle Nero.

      Chiara De Luca, finally in possession of Marco's full evidence
      package, publishes the UmbriaVerde story in La Repubblica. The
      Regione orders an unannounced inspection. The project is halted
      pending environmental remediation. Filippo Marini faces criminal
      charges for falsifying environmental impact assessments and
      illegal deforestation of protected species.

      And Marco Bianchi, reading the story from a friend's house in
      Spoleto, calls his sister for the first time in nine days.

      "Torno a casa."

      If you or someone you know is experiencing stalking, harassment,
      or intimidation, help is available:
      Telefono Amico: 02 2327 2327
      Numero Verde Antistalking: 800 014 009
      Emergenze: 112
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: marco
    text: >
      la terra non mente. e la gente di borgo di luna nemmeno.
      grazie di non aver mollato.
    choices:
      - The End -> game_complete

  # --- ENDING B: Filippo (Partial Ending) ---

  confront_filippo:
    type: message
    text: >
      You present the deforestation evidence to Filippo Marini:

      "I have photographs of the illegal clear-cutting at Colle Nero.
      I have GPS coordinates of 47 protected oaks that were felled.
      I have the original environmental impact assessments showing
      the data was falsified. I have satellite images month by month."
    choices:
      - Send -> filippo_response

  filippo_response:
    type: message
    text: >
      FILIPPO: Questa conversazione viene inoltrata al nostro ufficio
      legale. Qualsiasi pubblicazione di materiale diffamatorio
      risultera in procedimenti immediati. UmbriaVerde ha sempre
      operato nel rispetto delle normative vigenti.

      But it is too late. You have sent the evidence to Chiara, to
      the Sentinelle dei Boschi, and to the Regione.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The deforestation story breaks. UmbriaVerde is ordered to halt
      all activity pending investigation. The project may be cancelled.
      Jobs and investment hang in the balance. The town is divided.

      But Marco?

      Without the stalking evidence, Sergio is never investigated.
      He continues to hunt in the same woods. He continues to monitor
      Marco's movements. He creates a new anonymous profile.

      Three months later, Marco reads about UmbriaVerde online.
      He returns quietly. He changes his truffle zones. He stops
      going into the forest alone. He checks his car every morning.

      The corporation is exposed. But the person who terrorised
      Marco walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: marco
    text: "sono tornato. i boschi sono più sicuri. il resto... si vedrà."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_piero:
    type: message
    text: >
      You confront Mayor Castellani with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> piero_response

  piero_response:
    type: tweet
    from: benedetta
    text: >
      Il mio cliente prende atto delle Sue allegazioni. Qualsiasi
      diffusione pubblica di affermazioni diffamatorie sara oggetto
      di azione legale immediata. — Studio Caruso & Associati, Perugia
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Castellani and UmbriaVerde's deforestation — and
      there is not one beyond political protection — your evidence
      is insufficient.

      UmbriaVerde continues to operate. Sergio continues to watch.
      Marco stays in hiding.

      Six months later, @ombra_tartufo creates a new account. It
      follows Marco's sister.
    choices:
      - The End -> game_complete

