      in Pula told me to stand down. He said the county had
      "jurisdiction." Sranje. That's code for "the načelnik made a
      phone call."

      The Marko Radin situation is different. I didn't even know
      about that until now. If you have evidence of stalking and
      harassment, I can act on that. That's clearly my jurisdiction.

      Bring me something solid and I'll reopen the case.
    effects:
      trust_inspektor: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
