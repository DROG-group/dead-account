      Their satellite data shows clear deforestation: 3.2 hectares of
      protected oak forest cleared in the last six months. The
      clearing pattern matches IstraBuild's villa development plans
      published on their website.

      The timing is unmistakable. Trees are cut at night, between
      22h and 4am. Heavy equipment tracks appear overnight. By
      morning, the stumps are covered with brush.

      Matej was their most active volunteer. He provided most of
      the ground-level photography.
    effects:
