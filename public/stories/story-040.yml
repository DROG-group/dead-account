          gte: 30
      - Back to hub -> investigation_hub

  # --- Trail Cameras ---

  trail_cameras:
    type: message
    text: >
      Matej's public foraging blog includes a disturbing post from
      two months ago: "Found another camera on the north trail. That
      makes four. Someone is mapping my routes."

      He photographed each camera — commercial trail cameras, the
      kind used for wildlife monitoring. But these were pointed at
      paths, not animal crossings. And they were all on routes Matej
      used to reach his truffle patches.

      Cross-referencing: the cameras are a model sold by a hunting
      supply shop in Pazin. Purchase records are private. But the
      memory cards Matej recovered from two of them show his face,
      timestamped, on fifteen separate occasions.

      Someone was tracking his every movement in the forest.
    effects:
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

