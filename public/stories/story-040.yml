entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN VRANIĆI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to vranici.social — the community Mastodon instance for
      the Istrian hilltop village of Vranići.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @matej_baric.

      A truffle hunter. Forager. He mapped the ancient forests around
      Vranići, documented wild edibles, and supplied the best
      restaurants in Istria. People are worried. He hasn't posted
      in seven days.
    choices:
      - Look at his profile -> matej_profile

  matej_profile:
    type: tweet
    from: matej
    text: "Netko čisti šumu iznad sela. Strojevi. Noću. Ovo nije zakonito. Imam dokaze."
    choices:
      - That's his last real post... -> grey_truffle

  grey_truffle:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a muddy truffle, crushed, photographed on bare concrete under
      harsh light. Posted at 4am. No caption.

      His friends say that's not his style. Matej's photos were
      always of the forest floor — dappled light, careful
      compositions, the dog beside him. The policija says he probably
      went hiking and lost signal. Something doesn't add up.
    choices:
      - Read the policija statement -> policija_statement
      - Look at what people are saying -> community_reaction

  policija_statement:
    type: tweet
    from: inspektor
    text: >
      Zaprimili smo prijavu nestanka stanovnika Vranića. U ovom
      trenutku nema naznaka kaznenog djela. Informacije možete
      dostaviti policijskoj postaji ili na broj 192.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His brother @ivan_baric is driving
      down from Rijeka. His girlfriend @petra_kovacevic is barely
      holding it together. The konoba owner @josip_milic says
      Matej's truffle supply has gone silent. The old hunter
      @marko_radin says Matej was right about the forest.

      And the journalist @sanja_tomic is strangely silent.

      Nobody buys the policija's line. Nobody thinks Matej just
      "went hiking."
    effects: { trust_ivan: "+5", trust_petra: "+5" }
    choices:
      - Start following Matej's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Vranići. Follow Matej's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Josip (konoba owner, knows everyone) -> josip_intro
      - Talk to Marko (old truffle hunter, knows the forest) -> marko_intro
      - Talk to Tea (teen photographer, seems shaken) -> tea_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Matej with the rhythms of an Istrian
      hilltop village: olive harvest updates, the bakery's daily
      bread, weather warnings for the bura wind.

      Key names surface: Ivan (brother, in Rijeka), Petra (girlfriend,
      works at the konoba), Sanja (journalist, oddly quiet), and the
      teens — Tea, Luka, Nina — who Matej took foraging in the
      forest every weekend.

      Also prominent: IstraBuild d.o.o., a luxury property developer
      buying land around the village. Their posts are glossy renders
      of villas. Matej's posts were of ancient oak forests.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Josip -> josip_intro
      - Talk to Marko -> marko_intro
      - Talk to Tea -> tea_intro

  # --- Josip (social map) ---

  josip_intro:
    type: tweet
    from: josip
    text: >
      Konoba je otvorena ali kuhinja je tužna bez tartufa. @matej_baric,
      tvoj stol te čeka. Vrati se buraz.
    effects: { trust_josip: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Josip -> josip_talk

  josip_talk:
    type: message
    text: >
      JOSIP: You're new here? Welcome, buraz. Bad timing though.
      Everyone's losing it over Matej.

      Let me tell you who's who. Ivan is Matej's older brother — lives
      in Rijeka, works at the shipyard, driving down today. Petra is
      Matej's girlfriend — she waits tables here at the konoba, barely
      sleeping. Ana is their mother — she runs the family olive grove,
      tough woman, but this is breaking her.

      Marko Radin — the old truffle hunter — he taught Matej
      everything. Jebote, that man knows every tree in the forest.
      He says something bad is happening up there. Machines at night.

      And Sanja Tomić — the journalist — she and Matej were working
      on something together. Something about land sales. Sanja hasn't
      said a word since Matej vanished. That's not like her at all.

      Oh, and watch out for IstraBuild. Those Zagreb suits want to
      turn our forest into a villa resort. Matej was in their way.
    effects: { trust_josip: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Marko Radin -> josip_marko
      - Ask about IstraBuild -> josip_istrabuild
      - Thank him and move on -> quest1_hub

  josip_marko:
    type: message
    text: >
      JOSIP: Marko? He's the best tartufar in Istria. Has been for
      thirty years. But since Matej started finding spots Marko
      didn't know about — especially that white truffle patch in the
      old forest — things got... tense.

      Marko is possessive about his territory. He sees the forest as
      his. When Matej started selling directly to restaurants in
      Rovinj and Pula, skipping the middlemen Marko uses, Marko was
      furious. He said Matej was "stealing."

      Fakat, I thought it was just old-man jealousy. Now I'm not
      so sure.
    effects: { trust_josip: "+5" }
    choices:
      - Ask about IstraBuild -> josip_istrabuild
      - Move on -> quest1_hub

  josip_istrabuild:
    type: message
    text: >
      JOSIP: IstraBuild showed up two years ago. Some developer from
      Zagreb — Goran Krstić — buying up land around the village.
      Olive groves, vineyards, forest plots. Paying good money. Too
      good. Half the old farmers sold.

      But the forest above the village — that's public land. Protected,
      supposedly. Matej found machines up there. Clearing trees.
      At night, so nobody would see. He said there were survey stakes
      with IstraBuild markings on protected forest land.

      He had photos, GPS coordinates, everything. He said the
      načelnik — Tomislav Jurić — had signed off on a rezoning
      request. That's illegal if the land is protected.

      Jebote, someone needs to do something.
    effects: { trust_josip: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marko (the forest, witness tease) ---

  marko_intro:
    type: tweet
    from: marko
    text: >
      dvadeset pet godina lovim tartufe u ovoj šumi. netko je uništava.
      @matej_baric je imao pravo. a sad ga nema. razmislite.
    effects: { trust_marko: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Marko -> marko_talk

  marko_talk:
    type: message
    text: >
      MARKO: I've hunted truffles in this forest since before that
      boy was born. I know every oak root, every clearing, every
      truffle patch. And I'm telling you — the forest above the
      village is being destroyed. Trees cut at night. Heavy
      machinery tracks on protected trails.

      Matej documented everything. He had photos of the clearing,
      the stakes, the tracks. He was building a case against
      IstraBuild. And then — gone.

      You think that's a coincidence? Kurac. Nothing in this village
      is coincidence.
    effects: { trust_marko: "+10" }
    choices:
      - Did you see anything unusual recently? -> marko_night
      - Move on -> quest1_hub

  marko_night:
    type: message
    text: >
      MARKO: The night before he vanished — I was out checking my
      traps, around midnight. Truffle dogs need training at night.
      I saw lights in the forest. Not headlamps — proper floodlights.
      And I heard machines.

      When I got closer, I saw a 4x4 with IstraBuild plates parked
      at the forest access road. And another car — local plates,
      fancy Audi. That's the načelnik's car. Tomislav Jurić. At
      midnight. In the forest.

      I didn't think much of it then. Sranje. I should have.
    effects: { trust_marko: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tea (teen photographer, witness tease) ---

  tea_intro:
    type: tweet
    from: tea
    text: >
      buraz fakat ne mogu @matej_baric me naučio sve o šumama i
      gljivama. najbolji lik na svijetu. ak netko zna nešto molim
      vas javite se
    effects: { trust_tea: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tea -> tea_talk_early

  tea_talk_early:
    type: message
    text: >
      TEA: ti si nov ovdje? sranje timing buraz. matej je fakat
      najbolji čovjek u selu. vodio nas u šumu svaki vikend, učio
      nas o biljkama, gljivama, svemu. bolji od bilo kojeg profe.

      i sad sam u strahu jer luka je vidio nešto čudno onu noć kod
      šume ali neće pričati o tome. kaže da je ništa ali fakat...
      to nije ništa jebote
    effects: { trust_tea: "+10" }
    choices:
      - What did Luka see? -> tea_luka_hint
      - Move on -> quest1_hub

  tea_luka_hint:
    type: message
    text: >
      TEA: ne znam točno. bio je na trail runningu navečer i vidio
      nekoga tko je nešto stavljao u matejev auto?? ili nešto takvo.
      fakat se boji. ne želi pričati. trebaš mu se obratiti direktno
      ali je sumnjičav prema ljudima koje ne poznaje. probaj prvo
      pričati o mountainbikeu ili nešto haha
    effects: { trust_tea: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Vranići. An Istrian hilltop village
      built around ancient forests and truffle hunting. A young
      forager who was exposing illegal land clearing. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Ivan (Matej's brother) -> ivan_q1
      - Talk to Petra (Matej's girlfriend) -> petra_q1
      - Check what Ana (Matej's mother) is saying -> ana_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Ivan Q1 ---

  ivan_q1:
    type: tweet
    from: ivan
    text: >
      moj brat je NESTAO i policija mi kaže da je možda otišao na
      planinarenje??? ON NE IDE NIKAM BEZ DA SE JAVI. dolazim iz
      rijeke. netko će mi objasniti.
    effects: { trust_ivan: "+5", contacts_followed: "+1" }
    choices:
      - DM Ivan -> ivan_q1_talk

  ivan_q1_talk:
    type: message
    text: >
      IVAN: Who are you? Another person from this village who's going
      to tell me to calm down? My brother called me the night before
      he disappeared. He said he had something big. He said "if
      anything happens, look at IstraBuild." Then he hung up.

      Pičku materinu, that's the last I heard from him.
    effects: { trust_ivan: "+10" }
    choices:
      - What do you think happened? -> ivan_theory
      - Move on -> quest1_hub

  ivan_theory:
    type: message
    text: >
      IVAN: I think he found proof that IstraBuild is clearing
      protected forest with the načelnik's blessing and they shut
      him up. But I also think that old hunter — Marko Radin —
      has been losing his mind over Matej's success. The way he
      talks about Matej's truffle spots... like Matej stole
      something from him. Like those patches belong to Marko
      by divine right.

      Matej told me months ago that someone was following him in the
      forest. Setting up trail cameras on his paths. He thought it
      was poachers. Now I think it was Marko.

      Jebote, I should have come down sooner.
    effects: { trust_ivan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Petra Q1 ---

  petra_q1:
    type: tweet
    from: petra
    text: >
      ako itko ima vijesti o @matej_baric javite mi se. njegov pas
      čeka pred vratima. ne bi nikad ostavio rusa. nikad.
    effects: { trust_petra: "+5", contacts_followed: "+1" }
    choices:
      - DM Petra -> petra_q1_talk

  petra_q1_talk:
    type: message
    text: >
      PETRA: I appreciate you reaching out but I don't know you.
      Matej has a lot of friends here. I'm sure he'll come back.

      ...I keep saying that. I don't believe it anymore.

      His truffle dog Ruso hasn't eaten since he left. Dogs know.

      [Petra is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_petra: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ana Q1 ---

  ana_q1:
    type: tweet
    from: ana
    text: >
      Moj sin nije bjegunac. Moj sin je lovac na tartufe i poznavalac
      šume. Netko mi je uzeo sina i ja ću saznati tko.
    effects: { trust_ana: "+5", contacts_followed: "+1" }
    choices:
      - DM Ana -> ana_q1_talk

  ana_q1_talk:
    type: message
    text: >
      ANA: I am Matej's mother. I have run this olive grove for
      forty years. I know every person in this village. And I know
      my son did not "go hiking."

      He came home that evening. He was upset. He said the načelnik
      threatened him. Told him to stop posting about the forest or
      there would be consequences. My son doesn't scare easily but
      that night he was scared.

      Whoever took my son from me will answer for it. To the law
      or to me.
    effects: { trust_ana: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Matej went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Luka (was trail running near the forest) -> luka_interview
      - Find Dario (farmer, heard vehicles at night) -> dario_interview
      - Find Ante (baker, saw cars before dawn) -> ante_interview
      - Find Renata (pharmacist, heard an argument) -> renata_interview

  # --- Luka (saw someone at Matej's car) ---

  luka_interview:
    type: tweet
    from: luka
    text: >
      nisam spavao. čudna vibracija u selu. ne govorim ništa online
      ali ak me poznaješ znaš di sam
    effects: { trust_luka: "+5" }
    choices:
      - Ask Luka about that evening -> luka_talk

  luka_talk:
    type: message
    text: >
      LUKA: buraz ok al nikomu ne govoriš. bio sam na trail runu
      iznad sela oko 19h. i vidio sam marko radina kod matejevog
      auta. bio je na koljenima pored prednjeg kotača. nešto je
      radio ispod. kad me vidio ustao je i otišao brzo.

      fakat buraz mislim da je nešto stavio pod auto. tipa gps
      tracker ili takvo nešto. ko u filmovima jebote.

      nisam ništa rekao jer tko će mi vjerovati. tinejdžer koji
      optužuje starog lovca. kurac. nitko.
    effects:
      trust_luka: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Dario (farmer, heard vehicles) ---

  dario_interview:
    type: tweet
    from: dario
    text: >
      Šuma iznad sela. Noću. Strojevi. Svjetla. Ovo ne smije
      nastaviti. Ali nitko ne sluša farmere.
    effects: { trust_dario: "+5" }
    choices:
      - Ask Dario what he heard -> dario_talk

  dario_talk:
    type: message
    text: >
      DARIO: I was up late checking on the olive trees — bura wind
      was strong that night. Around 23h I heard heavy vehicles on
      the forest road. Trucks. Big ones. Not normal for a village
      road at that hour.

      Then floodlights in the forest. The sound of chainsaws. At
      23h. On protected land.

      Around midnight, I saw a 4x4 with IstraBuild markings drive
      past my farm. And behind it — the načelnik's Audi. Tomislav
      Jurić himself, driving toward the forest at midnight.

      I noted the time and the plates. Nobody's asked me for them.
    effects:
      trust_dario: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Ante (baker, saw chase at dawn) ---

  ante_interview:
    type: tweet
    from: ante
    text: >
      Svaki dan počinjem u 5h. To jutro nisam bio sam na cesti.
      Daleko od toga.
    effects: { trust_ante: "+5" }
    choices:
      - Ask Ante what he saw -> ante_talk

  ante_talk:
    type: message
    text: >
      ANTE: I start baking at 5am every day. That morning I was
      heating up the ovens and heard a car — fast, much too fast
      for the village road. A 4x4, dark, heading down the hill.
      Then maybe three minutes later, a smaller car. Matej's old
      Fiat. Heading the same direction but turning off toward the
      coast road.

      The 4x4 stopped, reversed, and went after the Fiat.

      Sranje. Someone was chasing him.

      I told the policija. They wrote it down. That was it.
