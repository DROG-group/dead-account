  # --- ENDING B: Goran Krstić (Partial Ending) ---

  confront_goran:
    type: message
    text: >
      You present the land grab evidence to Goran Krstić:

      "I have photographs of illegal clearing on protected forest
      land. I have GPS coordinates and timestamps. I have drone
      footage. I have the rezoning requests signed by the načelnik
      before county approval. I have your equipment serial numbers
      on protected land."
    choices:
      - Send -> goran_response

  goran_response:
    type: message
    text: >
      GORAN: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will
      result in immediate proceedings. IstraBuild operates within
      all applicable regulations.

      But it's too late. You've sent the evidence to Sanja, to the
      Čuvari Šume, and to the county environmental office.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The land grab story breaks. IstraBuild is ordered to halt all
      operations pending investigation. The villa project may be
      cancelled. Fifty promised jobs evaporate. The village is
      divided — half relieved, half furious.

      But Matej?

      Without the stalking evidence, Marko Radin is never
      investigated. He continues to hunt the forest. He continues
      to monitor Matej's routes. He sets new trail cameras. He
      creates a new anonymous profile.

      Three months later, Matej reads about IstraBuild online. He
      returns quietly. He hunts different patches. He varies his
      routes. He checks his car every morning.

      The land grab is exposed. But the person who terrorised Matej
      walks free in the same forest.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: matej
    text: "vratio sam se. šuma je sigurnija. ali nisam siguran da sam ja."
    choices:
      - The End -> game_complete

