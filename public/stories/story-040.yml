    text: >
      PETRA: He came to the konoba around 22h. I was closing up.
      He was pale, his hands were shaking. He said "they know what
      I found." He grabbed his laptop and his camera from his
      backpack.

      I asked who. He said "IstraBuild. They sent people to the
      forest. The načelnik was there." Then he said something else —
      "and he's been following me again. He's always in the forest
