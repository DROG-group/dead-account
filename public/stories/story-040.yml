  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The načelnik's lawyer buries your accusation. Without a direct
      link between Jurić and the illegal clearing — beyond signing
      rezoning requests, which he claims is "standard administrative
      procedure" — your evidence is insufficient for criminal charges.

      IstraBuild continues to clear. Marko continues to watch.
      Matej stays in hiding.

      Six months later, @dino_novak creates a new account. It
      follows Matej's girlfriend.
    choices:
      - The End -> game_complete

