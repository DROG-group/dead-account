      - Talk to Dario about the clearing -> dario_clearing
      - Back to hub -> investigation_hub

  # --- Land Records ---

  land_records:
    type: message
    text: >
      The municipal land registry is public. Cross-referencing
      IstraBuild's purchases with zoning maps reveals a pattern:
      twelve land parcels around Vranići purchased in the last
      eighteen months. All rezoned from agricultural to
      residential within weeks of purchase.

      But the forest above the village — parcel K-47 — is marked
      "Protected Forest Land." The zoning status shows an active
      amendment request: "Reclassification to Tourism-Residential."
      Filed by IstraBuild d.o.o. Signed by Načelnik Tomislav Jurić.

      The amendment hasn't been approved by the county yet. But
      the clearing has already started.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue -> corruption_hub

  # --- Sanja ---

  sanja_interview:
    type: message
    text: >
      SANJA: I don't talk about sources. Period.
    effects: { trust_sanja: "+5" }
    choices:
      - Show Sanja the evidence you have -> sanja_with_evidence
        when:
          state: corporate_evidence
          gte: 3
      - Back to corporate thread -> corruption_hub

  sanja_with_evidence:
    type: message
    text: >
      SANJA: ...you have more than I expected.

      Ok. Matej and I were working together. He had photos of the
      illegal clearing — GPS-tagged, dated, undeniable. Chainsaws on
      protected land. Survey stakes with IstraBuild logos. The
      načelnik's car at the site. He had drone footage too.

      We were going to publish together. Then he went dark. And the
      next day, someone broke into my apartment in Pula and stole my
      laptop.

      Matej is alive. He contacted me once, from a borrowed phone.
      He said he was hiding in the hills. He said "they threatened me
      and the old man won't let go of me."

      I can't tell you where he is. But with enough evidence, I can
      publish and make it safe for him to come back.
    effects:
      trust_sanja: "+25"
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Who threatened him? -> sanja_hint
      - Back to investigation hub -> investigation_hub

  sanja_hint:
    type: message
    text: >
      SANJA: IstraBuild sent their director — Krstić — and some
      thug to the forest that night. They found Matej at his
      observation point. They told him to hand over everything and
      stop posting or they'd make his family's life impossible.
      Threatened to buy the family olive grove out from under them.

      But he also said something about Marko Radin. The old hunter
      who's been in the forest for decades. Someone who always seems
      to know where Matej is, where he hunts. That's a different
      problem.
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Karlo (IstraBuild whistleblower) ---

  karlo_interview:
    type: message
    text: >
      KARLO: I work at IstraBuild. I'm a site technician. I drive
      equipment, I clear land.

      But the land I've been clearing lately... is not land we
      have permits for.
    effects: { trust_karlo: "+10" }
    choices:
      - What do you mean? -> karlo_detail

  karlo_detail:
    type: message
    text: >
      KARLO: My boss sends me coordinates. I drive the machinery
      there and clear. Simple. But last month I checked the
      coordinates against the zoning maps. Three of the four sites
      are on protected forest land. No permits exist.

      When I asked my supervisor, he said "the permits are coming."
      That means they're clearing first and filing paperwork after.
      That's illegal.

      Matej confronted me at one of the sites. He had a camera.
      He was calm, polite. He said "I don't blame you. But this
      has to stop." I agreed with him.

      I'm scared. I need this job. But I kept GPS logs of every
      clearing operation. If someone can protect me, I'll share them.
    effects:
      trust_karlo: "+15"
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
