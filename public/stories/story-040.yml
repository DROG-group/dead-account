      Marko started showing up at our table at the konoba. Asking
      where Matej hunted that day. What paths he used. Matej stopped
      answering and Marko got angry. Said Matej was "poaching his
      territory."

      A month ago Matej found that someone had poisoned one of his
      truffle patches — salted the earth around an oak so nothing
      would grow. He suspected Marko but couldn't prove it.

      Kurac. Who does that? Who destroys nature out of jealousy?
    effects:
