    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Matej than anyone in Vranići. Who is responsible?
    choices:
      - Confront Marko Radin (the obsessive rival hunter) -> confront_marko
        when:
          state: obsession_evidence
          gte: 5
      - Confront Goran Krstić (IstraBuild director) -> confront_goran
        when:
          state: corporate_evidence
          gte: 3
      - Confront Načelnik Tomislav Jurić (political corruption) -> confront_tomislav
      - I need more evidence -> investigation_hub

  # --- ENDING A: Marko Radin (Best Ending) ---

  confront_marko:
    type: message
    text: >
      You present your evidence to Marko Radin:

      "I know @dino_novak is your account. I know you put a GPS
      tracker on Matej's car. I know about the trail cameras. I know
      you poisoned his truffle patches. I know you confronted him
      outside the pharmacy at 1am. I have witnesses, access records,
      and the anonymous posts."
    choices:
      - Send -> marko_response

  marko_response:
    type: message
    text: >
      Marko doesn't reply for a long time. Then:

      MARKO: You don't understand. That forest is mine. Thirty years
      I've worked it. Every tree, every root, every truffle — I found
      them. I mapped them. That boy comes along with his smartphone
      and his drone and thinks he owns it.

      I was protecting the forest. Protecting what's mine. He should
      have stayed in his lane.

      That's not protection. That's obsession.

      You've already sent the evidence to Inspektor Horvat. And to
      Sanja Tomić.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Inspektor Horvat reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the trail cameras, the
      poisoned truffle patches, the midnight confrontation — Marko
      Radin is arrested for stalking, harassment, and destruction
      of property. A GPS tracker is recovered from under Matej's
      car, found abandoned near the coast.

      Sanja Tomić, finally in possession of Matej's full evidence
      package, publishes the IstraBuild story in Jutarnji List. The
      county orders an immediate halt to all clearing on protected
      land. IstraBuild is fined and their permits revoked. Goran
      Krstić faces criminal charges for unauthorized deforestation.
      Načelnik Tomislav Jurić is suspended pending investigation for
      corruption and accepting bribes.

      And Matej Barić, reading the story from a shepherd's hut in
      the mountains above Motovun, calls his brother for the first
      time in twelve days.

      "Dolazim kući."
    choices:
      - See the epilogue -> ending_a_epilogue

