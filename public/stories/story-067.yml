  title: "Dead Account — Podmorje"
  state:
    # Trust levels per NPC (0-100)
    trust_luka: 0
    trust_marina: 0
    trust_ivan: 0
    trust_tonka: 0
    trust_roko: 0
    trust_mia: 0
