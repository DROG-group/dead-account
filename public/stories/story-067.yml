      avatar: avatars/tonka.jpg
    konoba:
      name: "Konoba Lučica"
      bio: "Dalmatinska kuhinja | Domaće vino | Muzika petkom | Srce Podmorja"
      avatar: avatars/konoba.jpg
    ivan:
