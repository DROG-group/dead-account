entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PODMORJE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Podmorje.social — the community Mastodon instance for
      the Dalmatian coastal village of Podmorje, Croatia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @ana_kovacic.

      A diving instructor. Underwater photographer. She documented the
      reefs and the seabed. People are worried. She hasn't posted in
      six days.
    choices:
      - Look at her profile -> ana_profile

  ana_profile:
    type: tweet
    from: ana
    text: "Dno kod Rta Zmajeva nije kako treba. Netko kopa. Netko uništava koraljne grebene za betonsku marinu. Imam dokaze."
    choices:
      - That's her last real post... -> grey_wave

  grey_wave:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurry photo of dark water. Shot from an odd angle. Posted at
      4am. No caption.

      Her friends say that's not her style. Ana always wrote long
      captions about the sea. The police say she probably left for the
      mainland. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: inspektor
    text: >
      Zaprimljena je prijava nestanka stanovnice Podmorja. U ovom
      trenutku nema elemenata koji upućuju na kazneno djelo. Sve
      korisne informacije mogu se dojaviti na 192 ili u postaju.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her roommate @marina_juric is
      desperate. Her brother @luka_kovacic is driving down from Split.
      Her colleague @roko_peric is posting worried messages. The
      fisherman @ivan_tomic says she was right about the seabed.

      And the journalist @sanja_dragovic is strangely silent.

      Nobody buys the police line. Nobody thinks Ana just
      "left for the mainland."
    effects: { trust_marina: "+5", trust_luka: "+5" }
    choices:
      - Start following Ana's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Podmorje. Follow Ana's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Tonka (konoba owner, knows everyone) -> tonka_intro
      - Talk to Ivan (fisherman, saw the seabed) -> ivan_intro
      - Talk to Mia (teen diver, seems shaken) -> mia_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Ana with the rhythms of a small
      Dalmatian village: tide schedules, the bakery's daily specials,
      weather warnings for bura wind.

      Key names surface: Marina (roommate, waitress), Roko (diving
      colleague, seems rattled), Sanja (journalist, oddly quiet),
      and the teens — Mia, Dino, Borna — who worshipped Ana's
      underwater work.

      Also prominent: Dalmatia Riviera Development d.o.o., the
      company building a luxury marina at the edge of the village.
      Their posts are corporate PR. Ana's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Tonka -> tonka_intro
      - Talk to Ivan -> ivan_intro
      - Talk to Mia -> mia_intro

  # --- Tonka (social map) ---

  tonka_intro:
    type: tweet
    from: tonka
    text: >
      Konoba je otvorena al srce nije tu. @ana_kovacic, tvoj stol
      te čeka. Vrati se brzo.
    effects: { trust_tonka: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tonka -> tonka_talk

  tonka_talk:
    type: message
    text: >
      TONKA: A, ti si novi? Dobrodošao. Grozno vrijeme za doći.
      Svi su na iglama zbog Ane.

      Da ti kažem tko je tko. Marina je Anina cimerica — dijele stan
      iznad ljekarne. Dobra cura, slomljena sad. Roko Perić radi s
      Anom u ronilačkoj bazi. Pametan čovjek, ali... intenzivan oko
      nje. Luka je Anin stariji brat, dolazi iz Splita.

      I Sanja Dragović — novinarka — ona i Ana su radile na nečemu
      zajedno. Nešto o dnu mora. Sanja nije rekla ni riječ otkad je
      Ana nestala. To joj ne liči.

      Ah, i nemoj čitati PR objave od DRD-a. Laži umotane u
      "održivi turizam."
    effects: { trust_tonka: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Roko -> tonka_roko
      - Ask about the marina construction -> tonka_marina
      - Thank her and move on -> quest1_hub

  tonka_roko:
    type: message
    text: >
      TONKA: Roko? On je tu dvije godine duže od Ane. Odličan ronilac.
      Ali otkad je ona došla, on... kruži oko nje. U konobi svaki put
      kad je ona bila tu. Nudio se pomoći na svakom projektu. Ona je
      bila pristojna ali vidjela sam da joj smeta.

      Kad je počela istraživati dno kod Rta, on je bio još gori.
      Htio je biti dio svega. Rekla mi je jednom, "On ne prihvaća
      ne." Mislila sam da govori o poslu. Sad nisam sigurna.
    effects: { trust_tonka: "+5" }
    choices:
      - Ask about the marina -> tonka_marina
      - Move on -> quest1_hub

  tonka_marina:
    type: message
    text: >
      TONKA: Ta marina... Jebote, to je katastrofa. DRD je došao
      prije godinu dana s velikim planovima. Luksuzna marina, 200
      vezova, hotel, restorani. Načelnik Bašić im je dao zeleno
      svjetlo jer obećavaju radna mjesta.

      Ali Ana je zaronila tamo. Vidjela je što rade ispod vode.
      Bageri razbijaju koraljne grebene. Posidonia livade uništene.
      Dno izgleda kao ratna zona. A sve to bez pravih ekoloških
      dozvola.

      Ana je imala snimke, uzorke, sve. Dva tjedna kasnije —
      nestala.
    effects: { trust_tonka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ivan (the seabed, witness tease) ---

  ivan_intro:
    type: tweet
    from: ivan
    text: >
      trideset i pet godina pecam tu. dno više nije isto.
      @ana_kovacic je imala pravo. a sad je nestala.
      povežite stvari.
    effects: { trust_ivan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ivan -> ivan_talk

  ivan_talk:
    type: message
    text: >
      IVAN: Pecam ovu obalu otkad sam bio klinac. Znam svaku struju,
      svaku boju mora. I govorim ti — dno kod Rta Zmajeva je uništeno.
      Već mjesecima. Mreže mi dolaze pune mrtvih školjki. Morsko dno
      smrdi na cement i naftu.

      Ana je uzimala uzorke. Zaronila je do gradilišta. Fotografirala
      sve. Gradila je slučaj. I onda — puf — nestala.

      Misliš da je to slučajnost? Ja ne vjerujem u slučajnosti
      na moru.
    effects: { trust_ivan: "+10" }
    choices:
      - Did you see anything unusual recently? -> ivan_night
      - Move on -> quest1_hub

  ivan_night:
    type: message
    text: >
      IVAN: Noć prije nego je nestala — vraćao sam se s noćnog
      pecanja, oko 1 ujutro. Vidio sam svjetla kod ronilačke baze.
      Nije neobično, ronioci ponekad rade kasno. Ali bila su dva
      auta na parkingu. Jedan je bio Anin mali bijeli Fiat. Drugi
      je bio crni SUV s DRD logom na vratima.

      U 1 ujutro. Kod ronilačke baze.

      Nisam puno razmišljao o tome tada. Sad razmišljam
      neprestano.
    effects: { trust_ivan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mia (teen diver, witness tease) ---

  mia_intro:
    type: tweet
    from: mia
    text: >
      jebote ne mogu vjerovat @ana_kovacic ona me naučila ronit
      i poštovat more alo nije moguće da je otišla tek tako.
      ak neko zna nešto recite molim vas
    effects: { trust_mia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Mia -> mia_talk_early

  mia_talk_early:
    type: message
    text: >
      MIA: ej novi si tu? koji kurac od tajminga. al ozbiljno
      ana je tipa najbolja osoba u ovom selu. učila nas ronit,
      pokazivala nam podvodni svijet kamerom. predobro.

      i sad sam u strahu jer dino je vidio nešto čudno onu večer
      u luci al neće pričat o tome. kaže da je ništa al ono...
      majke mi nije ništa
    effects: { trust_mia: "+10" }
    choices:
      - What did Dino see? -> mia_dino_hint
      - Move on -> quest1_hub

  mia_dino_hint:
    type: message
    text: >
      MIA: nemam pojma točno. bio je na kajaku kod zalaska sunca
      u luci i vidio nekoga tipa kod aninog auta?? il tak nešto.
      on se previše boji da priča. moraš ga pitat direktno al
      je sumnjičav prema stranima. probaj pričat o surfanju
      s njim prvo haha
    effects: { trust_mia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Podmorje. A Dalmatian coastal
      village built around the sea. A diving instructor who was
      exposing illegal marina construction. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Marina (Ana's roommate) -> marina_q1
      - Talk to Roko (Ana's colleague) -> roko_q1
      - Check what Luka (Ana's brother) is saying -> luka_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Marina Q1 ---

  marina_q1:
    type: tweet
    from: marina
    text: >
      ako netko ima vijesti o @ana_kovacic nazovite me molim vas.
      soba joj je netaknuta. ronilačka oprema je tu. nikad ne bi
      otišla bez opreme.
    effects: { trust_marina: "+5", contacts_followed: "+1" }
    choices:
      - DM Marina -> marina_q1_talk

  marina_q1_talk:
    type: message
    text: >
      MARINA: Hvala ti što se javljaš ali te ne poznajem. Ana ima
      puno prijatelja tu. Sigurna sam da će se vratiti.

      ...To si stalno govorim. Više ne vjerujem u to.

      [Marina is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_marina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Roko Q1 ---

  roko_q1:
    type: tweet
    from: roko
    text: >
      Baza je prazna bez @ana_kovacic. Njeni uzorci su još u
      hladnjaku. Dnevnici ronjenja na stolu. Nikad ne bi
      napustila istraživanje u tijeku. Nešto se dogodilo.
    effects: { trust_roko: "+5", contacts_followed: "+1" }
    choices:
      - DM Roko -> roko_q1_talk

  roko_q1_talk:
    type: message
    text: >
      ROKO: Ana i ja radimo zajedno preko godinu dana. Ona je
      najposvećeniji ronilac kojeg znam. Ovo istraživanje
      uništavanja dna — bilo joj je sve. Imala je snimke, uzorke,
      kemijske analize. Bila je tako blizu da sve objavi.

      Nudio sam joj pomoć. Mnogo puta. Rekla je da ima sve pod
      kontrolom. Rekla je da radi s novinkom. Samo sam joj htio
      pomoći.

      [Roko seems earnest. Or obsessive?]
    effects: { trust_roko: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Luka Q1 ---

  luka_q1:
    type: tweet
    from: luka
    text: >
      sestra mi je NESTALA i policija mi govori da je možda otišla
      na odmor??? ONA NE IDE NA ODMOR BEZ DA JAVI. dolazim iz splita.
      netko će mi objasniti.
    effects: { trust_luka: "+5", contacts_followed: "+1" }
    choices:
      - DM Luka -> luka_q1_talk

  luka_q1_talk:
    type: message
    text: >
      LUKA: Tko si ti? Još jedan iz tog sela koji će mi reći da se
      smirim? Sestra me nazvala noć prije nego je nestala. Rekla je
      da ima nešto veliko. Rekla je "ako se nešto dogodi, gledaj
      DRD." Onda je prekinula.

      To je zadnje što sam čuo od nje.
    effects: { trust_luka: "+10" }
    choices:
      - What do you think happened? -> luka_theory
      - Move on -> quest1_hub

  luka_theory:
    type: message
    text: >
      LUKA: Mislim da je našla dokaze da DRD ilegalno uništava
      morsko dno za svoju marinu i da su je ušutkali. Ali mislim
      i da onaj jezivi kolega — Roko — zna više nego što govori.
      Način na koji priča o njoj... nije samo profesionalna briga.
      To je nešto drugo.

      Ana mi je rekla prije mjesec dana da joj netko u bazi
      pregledava datoteke. Mislila je da je ništa. Ja ne mislim
      da je ništa.
    effects: { trust_luka: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Ana went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Dino (was kayaking at sunset near the port) -> dino_interview
      - Find Zvonko (harbour master, works late) -> zvonko_interview
      - Find Niko (olive farmer, early morning at the shore) -> niko_interview
      - Find Petar (baker, starts at 4am, saw something) -> petar_interview

  # --- Dino (saw someone at Ana's car) ---

  dino_interview:
    type: tweet
    from: dino
    text: >
      dobra sesija danas al atmosfera u luci je čudna u zadnje
      vrijeme. tipa nešto ne štima. ne znam kak objasnit
    effects: { trust_dino: "+5" }
    choices:
      - Ask Dino about that evening -> dino_talk

  dino_talk:
    type: message
    text: >
      DINO: ej brate ok al ne govori nikom jel. bio sam u luci oko
      19h, kajak sesija. i vidio sam onog lika iz baze — roka —
      kod aninog auta. izgledalo je kao da pretražuje il tipa stavlja
      nešto unutra. kad me vidio otišo je prebrzo.

      ono ja nisam ništa reko jer nisam htio probleme al sad je
      u pičku materinu ozbiljno. nije normalno njegovo ponašanje
      majke mi
    effects:
      trust_dino: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Zvonko (harbour master, saw late-night meeting) ---

  zvonko_interview:
    type: tweet
    from: zvonko
    text: >
      Podsjetnik: luka je zabranjena za pristup između 22h i 6h.
      Primijećeni su neovlašteni prolasci posljednjih noći.
    effects: { trust_zvonko: "+5" }
    choices:
      - Ask Zvonko what he saw -> zvonko_talk

  zvonko_talk:
    type: message
    text: >
      ZVONKO: Zaključavao sam lučki ured oko 22:30. Vidio sam Anin
      auto još na parkingu baze. I crni SUV — s DRD logom — parkiran
      pokraj. Dva čovjeka su stajala kod ulaza u bazu. Jednog sam
      prepoznao: Darko Marinković, direktor projekta.

      U 22:30. Kod ronilačke baze. To nije normalno.

      Zapisao sam to u lučki dnevnik. Nitko nije tražio da ga
      vidi.
    effects:
      trust_zvonko: "+10"
      night_witnesses: "+1"
      marina_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

