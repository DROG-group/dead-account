      ROKO: Ne razumiješ. Štitio sam je. Bila je u opasnosti od
      DRD-a i nije me pustila da pomognem. Morao sam znati da je
      sigurna. Sve što sam napravio bilo je jer mi je stalo do nje.

      That's not care. That's obsession.

      You've already sent the evidence to Inspektor Babić. And to
      Sanja Dragović.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Inspektor Babić reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the
      witness testimonies — Roko is arrested for stalking and
      harassment. A GPS tracker is recovered from under Ana's car
      at the old fish farm buildings near Rt Zmajeva.

      Sanja Dragović, finally in possession of Ana's full evidence
      package, publishes the DRD story in Jutarnji list. The county
      orders an unannounced inspection. The marina construction is
      halted pending environmental remediation. Darko Marinković
      faces criminal charges for destruction of protected marine
      habitat and falsifying environmental permits.

      And Ana Kovačić, reading the story from a friend's house in
      Zadar, calls her brother for the first time in nine days.

      "Dolazim kući."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: ana
    text: >
      more ne laže. i ljudi podmorja ne lažu. hvala što niste
      odustali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Darko (Partial Ending) ---

  confront_darko:
    type: message
    text: >
      You present the construction evidence to Darko Marinković:

      "I have photographs of illegal seabed destruction. I have
      sediment samples showing concrete and diesel contamination.
      I have nighttime construction photos with timestamps proving
      you work outside permitted hours. I have the coral fragments
      in fishing nets."
    choices:
      - Send -> darko_response

  darko_response:
    type: message
    text: >
      DARKO: Ovaj razgovor se prosljeđuje našem pravnom odjelu.
      Svaka objava klevete rezultirat će trenutačnim postupkom.
      DRD je uvijek poslovao u skladu s dozvolama.

      But it's too late. You've sent the evidence to Sanja, to
      the Čuvari Obale, and to the county environmental office.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The construction story breaks. DRD is ordered to halt all
      works pending investigation. The marina project may be
      cancelled. The promised jobs evaporate. The village is
      divided.

      But Ana?

      Without the stalking evidence, Roko is never investigated.
      He continues to work at the base. He continues to monitor
      her accounts. He creates a new anonymous profile.

      Three months later, Ana reads about DRD online. She returns
      quietly. She changes diving bases. She stops diving alone.
      She checks her car every morning.

      The corporation is exposed. But the person who terrorised
      Ana walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: ana
    text: "vratila sam se. more je čistije. ostalo... vidjet ćemo."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_ante:
    type: message
    text: >
      You confront načelnik Bašić with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> ante_response

  ante_response:
    type: tweet
    from: elena
    text: >
      Moj klijent prima na znanje Vaše navode. Svaka javna objava
      klevete rezultirat će trenutačnim pravnim postupkom. —
      Ured Horvat & Partneri, Zagreb
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Bašić and DRD's destruction — and there isn't
      one beyond political protection — your evidence is
      insufficient.

      DRD continues to build. Roko continues to watch. Ana stays
      in hiding.

      Six months later, @maja_moric creates a new account. It
      follows Ana's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: PODMORJE — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${marina_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Ana's story explores themes of
