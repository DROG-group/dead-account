    luka:
      name: "Luka Kovačić"
      bio: "brat od ane | mehaničar brodova | split | ne nestaje ona tek tako"
      avatar: avatars/luka.jpg
    roko:
      name: "Roko Perić"
      bio: "biolog mora | ronilačka baza podmorje | kolega ane"
      avatar: avatars/roko.jpg

    # === Local Government ===
    ante:
      name: "Ante Bašić"
      bio: "Načelnik općine Podmorje | Za naše selo od 2017. | #PodmorjeNaprijed"
      avatar: avatars/ante.jpg
    jadranka:
