entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PORT-LUNEL
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to portlunel.social — the community Mastodon instance for
      the coastal town of Port-Lunel, Brittany.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @chloe_moreau.

      A marine biologist. Underwater photographer. She documented the
      coast. People are worried. She hasn't posted in five days.
    choices:
      - Look at her profile -> chloe_profile

  chloe_profile:
    type: tweet
    from: chloe
    text: "The water off Pointe de Kerbihan is not the right colour. Someone is dumping. I have proof."
    choices:
      - That's her last real post... -> grey_wave

  grey_wave:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a grey wave. Blurred, overexposed, shot from a strange angle.
      Posted at 3am. No caption.

      Her friends say that's not her style. The gendarmerie says she
      probably went travelling. Something doesn't add up.
    choices:
      - Read the gendarmerie statement -> gendarmerie_statement
      - Look at what people are saying -> community_reaction

  gendarmerie_statement:
    type: tweet
    from: capitaine
    text: >
      Nous avons reçu un signalement concernant une résidente de
      Port-Lunel. À ce stade, aucun élément ne permet de conclure à
      un acte délictueux. Toute information utile peut être communiquée
      au 17 ou à la brigade.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her roommate @manon_leclercq is
      desperate. Her brother @theo_moreau is driving down from Brest.
      Her colleague @corentin_jegou is posting worried messages.
      The fisherman @jeanpierre_guyader says she was right about the
      water.

      And the journalist @sylvie_tanguy is strangely silent.

      Nobody buys the gendarmerie's line. Nobody thinks Chloé just
      "went travelling."
    effects: { trust_manon: "+5", trust_theo: "+5" }
    choices:
      - Start following Chloé's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Port-Lunel. Follow Chloé's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Brigitte (café owner, knows everyone) -> brigitte_intro
      - Talk to Jean-Pierre (fisherman, saw the water) -> jeanpierre_intro
      - Talk to Léa (teen surfer, seems shaken) -> lea_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Chloé with the rhythms of a small
      coastal town: tide schedules, the bakery's daily specials,
      weather warnings.

      Key names surface: Manon (roommate, nurse), Corentin (lab
      colleague, seems rattled), Sylvie (journalist, oddly quiet),
      and the teens — Léa, Hugo, Océane — who worshipped Chloé's
      ocean work.

      Also prominent: ChimiBretagne SA, the chemical plant at the
      edge of town. Their posts are corporate PR. Chloé's posts
      were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Brigitte -> brigitte_intro
      - Talk to Jean-Pierre -> jeanpierre_intro
      - Talk to Léa -> lea_intro

  # --- Brigitte (social map) ---

  brigitte_intro:
    type: tweet
    from: brigitte
    text: >
      Le café est ouvert mais le cœur n'y est pas. @chloe_moreau,
      ta table t'attend. Reviens nous vite.
    effects: { trust_brigitte: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Brigitte -> brigitte_talk

  brigitte_talk:
    type: message
    text: >
      BRIGITTE: Ah, you're new? Welcome. Terrible time to arrive.
      Everyone's on edge about Chloé.

      Let me tell you who's who. Manon is Chloé's roommate — they
      share a flat above the pharmacy. Sweet girl, devastated right
      now. Corentin Jégou works at the marine lab with Chloé. Smart
      man, but... intense about her. Théo is Chloé's older brother,
      he's coming down from Brest.

      And Sylvie Tanguy — the journalist — she and Chloé were working
      on something together. Something about the water. Sylvie hasn't
      said a word since Chloé vanished. That's not like her at all.

      Oh, and steer clear of ChimiBretagne's PR posts. Lies wrapped
      in ISO certifications.
    effects: { trust_brigitte: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Corentin -> brigitte_corentin
      - Ask about ChimiBretagne -> brigitte_chimi
      - Thank her and move on -> quest1_hub

  brigitte_corentin:
    type: message
    text: >
      BRIGITTE: Corentin? He's been at the lab two years longer than
      Chloé. Brilliant researcher. But since she arrived, he's been...
      orbiting her. At the café every time she was there. Offered to
      help with every project. She was polite about it but I could
      tell it made her uncomfortable.

      After she started the pollution investigation, he got worse.
      Wanted to be part of everything. She told me once, "He doesn't
      take no for an answer." I thought she meant professionally.
      Now I'm not so sure.
    effects: { trust_brigitte: "+5" }
    choices:
      - Ask about ChimiBretagne -> brigitte_chimi
      - Move on -> quest1_hub

  brigitte_chimi:
    type: message
    text: >
      BRIGITTE: That factory has been there since the 80s. They make
      industrial solvents, cleaning agents, whatever. The town
      tolerated them because they brought jobs. But the fishermen
      have been complaining for years — strange colours in the water
      near the outfall pipe, dead fish washing up at Pointe de
      Kerbihan.

      Chloé was the first person to actually go down there with a
      camera and sample bottles. She had proof, she said. Real proof.
      Two weeks later she's gone.
    effects: { trust_brigitte: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jean-Pierre (the water, witness tease) ---

  jeanpierre_intro:
    type: tweet
    from: jeanpierre
    text: >
      quarante ans que je pêche ici. l'eau n'est plus la même.
      @chloe_moreau avait raison. et maintenant elle a disparu.
      faites le lien.
    effects: { trust_jeanpierre: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jean-Pierre -> jeanpierre_talk

  jeanpierre_talk:
    type: message
    text: >
      JEAN-PIERRE: I've been fishing this coast since I was fifteen.
      I know every current, every colour the sea makes. And I'm
      telling you — the water near Kerbihan is wrong. Has been for
      months. My nets come up with dead crabs. The seabed smells
      chemical.

      Chloé took water samples. She dove down to the outfall pipe.
      She photographed everything. She was building a case. And then
      poof — gone.

      You think that's a coincidence? I don't believe in coincidences
      at sea.
    effects: { trust_jeanpierre: "+10" }
    choices:
      - Did you see anything unusual recently? -> jeanpierre_night
      - Move on -> quest1_hub

  jeanpierre_night:
    type: message
    text: >
      JEAN-PIERRE: The night before she vanished — I was coming back
      from night fishing, around 1am. I saw lights at the lab.
      Not unusual, researchers work late. But there were two cars
      in the car park. One was Chloé's little blue Peugeot. The
      other was a black company car with ChimiBretagne plates.

      At 1am. At the marine research lab.

      I didn't think much of it then. Now I think about it
      constantly.
    effects: { trust_jeanpierre: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Léa (teen surfer, witness tease) ---

  lea_intro:
    type: tweet
    from: lea
    text: >
      jsuis deg la frr @chloe_moreau c elle qui m'a appris à
      respecter l'océan genre sah c'est pas possible qu'elle soit
      partie comme ça. si qqn sait qqch dites le svp
    effects: { trust_lea: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Léa -> lea_talk_early

  lea_talk_early:
    type: message
    text: >
      LÉA: mdr t'es nouveau ici? c chaud comme timing. en vrai
      chloé c'est genre la meilleure personne de cette ville. elle
      nous a appris à surfer safe, elle nous montrait les trucs sous
      l'eau avec sa caméra. trop stylé.

      et la jsuis flippée pcq hugo il a vu un truc bizarre l'autre
      soir au port mais il veut pas en parler. il dit que c rien
      mais genre... c'est pas rien sah
    effects: { trust_lea: "+10" }
    choices:
      - What did Hugo see? -> lea_hugo_hint
      - Move on -> quest1_hub

  lea_hugo_hint:
    type: message
    text: >
      LÉA: jsp exactement. il était en session sunset au port et
      il a vu genre qqn qui mettait des trucs dans la voiture de
      chloé?? ou qqch comme ça. il flippe trop il veut pas en
      parler. faut lui demander direct mais il est mefiant avec
      les gens qu'il connaît pas. essaie d'abord de parler surf
      avec lui ptdr
    effects: { trust_lea: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Port-Lunel. A Breton coastal town
      built around the sea. A marine biologist who was exposing
      pollution. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Manon (Chloé's roommate) -> manon_q1
      - Talk to Corentin (Chloé's colleague) -> corentin_q1
      - Check what Théo (Chloé's brother) is saying -> theo_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Manon Q1 ---

  manon_q1:
    type: tweet
    from: manon
    text: >
      si quelqu'un a des nouvelles de @chloe_moreau appelez moi svp.
      sa chambre est intacte. son sac de plongée est là. elle ne
      serait jamais partie sans son matériel.
    effects: { trust_manon: "+5", contacts_followed: "+1" }
    choices:
      - DM Manon -> manon_q1_talk

  manon_q1_talk:
    type: message
    text: >
      MANON: I appreciate you reaching out but I don't know you.
      Chloé has a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Manon is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_manon: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Corentin Q1 ---

  corentin_q1:
    type: tweet
    from: corentin
    text: >
      The lab is empty without @chloe_moreau. Her samples are still
      in the fridge. Her dive logs are on her desk. She would never
      abandon ongoing research. Something happened.
    effects: { trust_corentin: "+5", contacts_followed: "+1" }
    choices:
      - DM Corentin -> corentin_q1_talk

  corentin_q1_talk:
    type: message
    text: >
      CORENTIN: Chloé and I have worked together for over a year.
      She's the most dedicated researcher I know. This pollution
      investigation — it was everything to her. She had data, photos,
      chemical analysis. She was so close to going public.

      I offered to help her. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to support her.

      [Corentin seems earnest. Or obsessive?]
    effects: { trust_corentin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Théo Q1 ---

  theo_q1:
    type: tweet
    from: theo
    text: >
      ma sœur a DISPARU et la gendarmerie me dit qu'elle est
      peut-être partie en vacances??? ELLE NE PART PAS EN VACANCES
      SANS PRÉVENIR. j'arrive de brest. quelqu'un va m'expliquer.
    effects: { trust_theo: "+5", contacts_followed: "+1" }
    choices:
      - DM Théo -> theo_q1_talk

  theo_q1_talk:
    type: message
    text: >
      THÉO: Who are you? Another person from that town who's going to
      tell me to calm down? My sister called me the night before she
      disappeared. She said she had something big. She said "if
      anything happens, look at ChimiBretagne." Then she hung up.

      That's the last I heard from her.
    effects: { trust_theo: "+10" }
    choices:
      - What do you think happened? -> theo_theory
      - Move on -> quest1_hub

  theo_theory:
    type: message
    text: >
      THÉO: I think she found proof that ChimiBretagne is dumping
      toxic waste and they shut her up. But I also think that creepy
      colleague of hers — Corentin — knows more than he's saying.
      The way he talks about her... it's not just professional
      concern. It's something else.

      Chloé told me months ago that someone at the lab was going
      through her files. She thought it was nothing. I don't think
      it was nothing.
    effects: { trust_theo: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Chloé went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Hugo (was surfing at sunset near the port) -> hugo_interview
      - Find Yannick (harbour master, works late) -> yannick_interview
      - Find Loïc (oyster farmer, early morning at the shore) -> loic_interview
      - Find Armelle (baker, starts at 5am, saw something) -> armelle_interview

  # --- Hugo (saw someone at Chloé's car) ---

  hugo_interview:
    type: tweet
    from: hugo
    text: >
      bonne session ce soir mais l'ambiance au port c'est chelou en
      ce moment. genre y'a un truc qui va pas. jsp comment expliquer
    effects: { trust_hugo: "+5" }
    choices:
      - Ask Hugo about that evening -> hugo_talk

  hugo_talk:
    type: message
    text: >
      HUGO: wsh frr ok mais tu le dis à personne hein. j'étais au
      port vers 19h, session sunset. et j'ai vu le gars du labo —
      corentin — à côté de la voiture de chloé. il avait l'air de
      fouiller dedans ou genre mettre un truc. quand il m'a vu il
      est parti trop vite.

      genre moi j'ai rien dit pcq je voulais pas d'embrouilles mais
      la c'est chaud. c'est pas normal son comportement sah
    effects:
      trust_hugo: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Yannick (harbour master, saw late-night meeting) ---

  yannick_interview:
    type: tweet
    from: yannick
    text: >
      Rappel: le port est interdit d'accès entre 22h et 6h.
      J'ai constaté des passages non autorisés ces dernières nuits.
    effects: { trust_yannick: "+5" }
    choices:
      - Ask Yannick what he saw -> yannick_talk

  yannick_talk:
    type: message
    text: >
      YANNICK: I was closing up the harbour office around 22h30. I
      saw Chloé's car still in the lab car park. And a black sedan —
      ChimiBretagne plates — parked next to it. Two men were standing
      by the lab entrance. One of them I recognised: Fabien Hénaff,
      the plant director.

      At 22h30. At the marine lab. That's not normal.

      I noted it in my harbour log. Nobody's asked to see it.
    effects:
      trust_yannick: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Loïc (saw Chloé fleeing) ---

  loic_interview:
    type: tweet
    from: loic
    text: >
      debout à 4h pour les parcs. la grève était pas vide ce matin.
      y'avait quelqu'un qui courait sur le sentier côtier. dans le
      noir. pas un joggeur.
    effects: { trust_loic: "+5" }
    choices:
      - Ask Loïc what he saw -> loic_talk

  loic_talk:
    type: message
    text: >
      LOÏC: I get up at 4am for the oyster beds. That morning — the
      morning after Chloé's last post — I saw someone on the coastal
      path. Running. A woman, carrying a bag, heading toward the
      Pointe. It was still dark. She was moving fast, like she was
      afraid.

      I called out but she didn't stop. I figured it was a jogger
      but... who jogs at 4am carrying a messenger bag?

      When I heard about Chloé, I put it together. I think that was
      her. Running from something.
    effects:
      trust_loic: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Armelle (saw car chase) ---

  armelle_interview:
    type: tweet
    from: armelle
    text: >
      Fournée du jour à 5h comme d'habitude. Mais ce matin-là,
      un véhicule roulait beaucoup trop vite sur la route côtière.
    effects: { trust_armelle: "+5" }
    choices:
