entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN VIANDEN-LES-PRÉS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to ViandenLesPres.social — the community Mastodon instance for
      the village of Vianden-les-Prés, in Luxembourg's Our valley.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @lea_hoffmann.

      A beekeeper. Wildflower meadow keeper. She documented the valley's
      biodiversity. People are devastated. Her account went dark three
      days ago. Then a body was found near the quarry cliffs.
    choices:
      - Look at her profile -> lea_profile

  lea_profile:
    type: tweet
    from: lea
    text: "D'Wise bei der Carrière ass komplett zerstéiert. D'Beie fannen näischt méi. Ardennes Granit killt eist Tal. Ech hu Beweiser."
    choices:
      - That's her last real post... -> grey_hive

  grey_hive:
    type: message
    text: >
      The day after that post, her account uploaded a single image:
      a blurred photo of an empty beehive. Shot at an odd angle, posted
      at 2am. No caption.

      Her friends say that is not her style. The police say it looks
      like an accidental fall from the quarry cliffs. Something does
      not add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: brigadier
    text: >
      Mir hunn de Kierper vun enger Awunnerin vu Vianden-les-Prés
      an der Géigend vun der Carrière fonnt. Op dësem Stade weist
      näischt op eng Stroftat. All nëtzlech Informatioun kann un de
      Commissariat gemaach ginn: 113.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @claire_muller is
      shattered. Her brother @marc_hoffmann is driving down from
      Luxembourg City. The farmer @fernand_weber says she never went
      near those cliffs alone.

      And @patrick_faber, the journalist, has gone strangely quiet.

      Nobody buys the police's line. Nobody thinks Léa just slipped
      from a cliff in the dark.
    effects: { trust_marc: "+5", trust_claire: "+5" }
    choices:
      - Start following Léa's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Vianden-les-Prés. Follow Léa's contacts and read their
      posts. The more you engage with the community, the more they will
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Sophie (café owner, knows everyone) -> sophie_intro
      - Talk to Fernand (farmer, worked alongside Léa) -> fernand_intro
      - Talk to Lina (teen, loved the bees) -> lina_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes grief about Léa with the rhythms of a small
      valley village: hiking trail conditions, the bakery's Bamkuch of
      the day, weather warnings for the Our valley.

      Key names surface: Claire (best friend, physiotherapist), Marc
      (brother, furious from Luxembourg City), Fernand (farmer, her
      meadow neighbour), and the teens — Ben, Lina, Kevin — who
      helped Léa with her beehives every summer.

      Also prominent: Ardennes Granit SA, the quarry company expanding
      operations at the edge of the village. Their posts are corporate
      PR. Léa's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Sophie -> sophie_intro
      - Talk to Fernand -> fernand_intro
      - Talk to Lina -> lina_intro

  # --- Sophie (social map) ---

  sophie_intro:
    type: tweet
    from: sophie
    text: >
      De Café ass op mee d'Häerz ass schwéier. @lea_hoffmann, däin
      Dësch waart op dech. Komm séier zeréck... ach, waat soen ech do.
      Si kennt net méi zeréck.
    effects: { trust_sophie: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sophie -> sophie_talk

  sophie_talk:
    type: message
    text: >
      SOPHIE: Ah, you are new here? Bienvenue. A terrible moment to
      arrive. The whole village is upside down about Léa.

      Let me tell you who is who. Claire Muller is Léa's best friend —
      they have been inseparable since school. Fernand Weber farms the
      fields next to Léa's meadows, they helped each other constantly.
      Marc is her older brother, he works in IT in the city.

      And there is this man — Thierry Schmit, the hiking guide. He has
      been buying Léa's honey for three years. Not normal amounts. He
      would show up at her farm every week, sometimes twice. Always an
      excuse to be near her. She told me once he made her uncomfortable
      but she did not want to be rude — he was a good customer.

      Oh, and do not bother reading Ardennes Granit's posts. Lies
      wrapped in environmental certifications.
    effects: { trust_sophie: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Thierry -> sophie_thierry
      - Ask about Ardennes Granit -> sophie_quarry
      - Thank her and move on -> quest1_hub

  sophie_thierry:
    type: message
    text: >
      SOPHIE: Thierry? He moved here five years ago from Esch-sur-Alzette.
      Became the hiking guide for the nature park. Quiet man, lives alone
      in a cabin near the forest. But since he discovered Léa's honey,
      something changed.

      He would come to the café every time she was here. He started
      showing up at the beekeeping association meetings. He ordered
      thirty jars of honey last month — thirty! What does a single man
      do with thirty jars of honey?

      Léa told me, "He does not take hints." I thought it was funny
      then. Now it makes me sick.
    effects: { trust_sophie: "+5" }
    choices:
      - Ask about Ardennes Granit -> sophie_quarry
      - Move on -> quest1_hub

  sophie_quarry:
    type: message
    text: >
      SOPHIE: That quarry has been there since the 70s. Gravel, stone,
      construction material. The village tolerated it because it brought
      jobs. But last year they applied to expand — doubling the
      extraction zone. Right into the wildflower meadows where Léa
      kept her bees.

      Léa fought it. She went to every council meeting. She had data
      about biodiversity, bee populations, water table impact. She was
      the only person standing between Ardennes Granit and a valley
      full of crushed rock.

      Two weeks after her last public complaint, she is dead at the
      bottom of their cliffs. C'est quoi ce bordel.
    effects: { trust_sophie: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Fernand (farmer, witness tease) ---

  fernand_intro:
    type: tweet
    from: fernand
    text: >
      30 Joer schaffen ech dëst Land. D'Léa hir Beie waren de Séil vu
      menge Felder. Ouni si, keen Honig. Ouni d'Wise, keng Beien. An
      Ardennes Granit wëllt alles plattmaachen.
    effects: { trust_fernand: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Fernand -> fernand_talk

  fernand_talk:
    type: message
    text: >
      FERNAND: I have farmed this valley for thirty years. My orchards
      depend on Léa's bees for pollination. Without her meadows, without
      the wildflowers, the whole ecosystem collapses. She understood that
      better than anyone.

      She was fighting the quarry expansion with everything she had.
      Water table studies, bee colony surveys, biodiversity counts. She
      was building a case that would have stopped the expansion dead.

      And now she is dead at the bottom of those cliffs. The police say
      she fell. Léa knew every path around that quarry — she walked them
      in the dark checking on her hives. She did not fall.
    effects: { trust_fernand: "+10" }
    choices:
      - Did you see anything unusual recently? -> fernand_night
      - Move on -> quest1_hub

  fernand_night:
    type: message
    text: >
      FERNAND: The evening before they found her — I was bringing in
      the cows around 21h. I saw a car parked on the lane near Léa's
      apiary. Not her car. A white SUV. I know all the cars in this
      village, and this one had Ardennes Granit plates.

      At 21h. Near the beehives. On a road that goes nowhere except
      to the quarry cliffs.

      I wrote down the time. Nobody has asked me about it.
    effects: { trust_fernand: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lina (teen, witness tease) ---

  lina_intro:
    type: tweet
    from: lina
    text: >
      putain jsuis deg la frr @lea_hoffmann c elle qui m'a montré les
      abeilles genre c'est pas possible qu'elle soit tombée comme ça.
      Léa connaissait chaque centimètre de ces falaises. si qqn sait
      qqch dites le svp
    effects: { trust_lina: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Lina -> lina_talk_early

  lina_talk_early:
    type: message
    text: >
      LINA: mdr t'es nouveau ici? c chaud comme timing. en vrai Léa
      c'est genre la meilleure personne du village. elle nous apprenait
      à s'occuper des ruches, elle nous montrait les reines et tout.
      trop stylé.

      et la jsuis flippée pcq kevin il a vu un truc bizarre l'autre
      soir près de la carrière mais il veut pas en parler. il dit que
      c rien mais genre... c'est pas rien sah. Herrgottsack c'est
      chelou tout ça.
    effects: { trust_lina: "+10" }
    choices:
      - What did Kevin see? -> lina_kevin_hint
      - Move on -> quest1_hub

  lina_kevin_hint:
    type: message
    text: >
      LINA: jsp exactement. il était en kayak sur l'Our vers le soir
      et il a vu genre qqn qui suivait Léa sur le sentier de la
      carrière?? genre pas loin derrière elle. il flippe trop il veut
      pas en parler. faut lui demander direct mais il est méfiant
      avec les gens qu'il connaît pas. essaie d'abord de parler kayak
      avec lui ptdr. merde quoi c'est quoi ce bordel.
    effects: { trust_lina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You are getting a picture of Vianden-les-Prés. A Luxembourg valley
      village built around meadows, forests, and the Our river. A
      beekeeper who was fighting a quarry expansion. A death nobody
      believes is accidental.

      You have made contacts. Now dig deeper.
    choices:
      - Talk to Claire (Léa's best friend) -> claire_q1
      - Talk to Thierry (the hiking guide) -> thierry_q1
      - Check what Marc (Léa's brother) is saying -> marc_q1
      - I'm ready to investigate the night she died -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Claire Q1 ---

  claire_q1:
    type: tweet
    from: claire
    text: >
      wann iergendeen Informatiounen huet iwwer @lea_hoffmann rufft
      mech w.e.g. un. si hätt ni eleng bei der Carrière gaang ouni
      et ze soen. hiren Imkeranzug läit nach doheem. hir Beien
      brauchen si.
    effects: { trust_claire: "+5", contacts_followed: "+1" }
    choices:
      - DM Claire -> claire_q1_talk

  claire_q1_talk:
    type: message
    text: >
      CLAIRE: I appreciate you reaching out but I do not know you.
      Léa had many friends here. The whole village loved her.

      ...everyone keeps saying "she fell." She did not fall. She knew
      those paths better than anyone alive.

      [Claire is guarded. You will need to build more trust before she
      opens up.]
    effects: { trust_claire: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Thierry Q1 ---

  thierry_q1:
    type: tweet
    from: thierry
    text: >
      Les sentiers autour de la carrière sont dangereux la nuit. Je le
      dis depuis des années. Léa le savait pourtant. Je n'arrive pas à
      comprendre. Elle me manque déjà. Son miel me manque.
    effects: { trust_thierry: "+5", contacts_followed: "+1" }
    choices:
      - DM Thierry -> thierry_q1_talk

  thierry_q1_talk:
    type: message
    text: >
      THIERRY: Léa and I had a professional relationship. I buy her
      honey — the best in the Our valley, anyone will tell you that.
      I recommended it to all my hiking groups. We talked about nature,
      about the bees. She was passionate about her work.

      I cannot believe she is gone. I was just at her farm last week
      to pick up my order. She seemed worried about the quarry but
      otherwise fine. This is a tragedy.

      [Thierry seems calm. Maybe too calm for someone who saw her
      "just last week"?]
    effects: { trust_thierry: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marc Q1 ---

  marc_q1:
    type: tweet
    from: marc
    text: >
      meng Schwëster ass DOUT an d'Police seet mir si wier gefall???
      D'LÉA FÄLLT NET. SI KENNT ALL WEEËR DO UEWEN. ech kommen elo
      vun der Stad. iergendeen wäert mir erkläeren wat geschitt ass.
    effects: { trust_marc: "+5", contacts_followed: "+1" }
    choices:
      - DM Marc -> marc_q1_talk

  marc_q1_talk:
    type: message
    text: >
      MARC: Who are you? Another person from that village who is going to
      tell me to accept it? My sister called me two days before she died.
      She said the quarry people had threatened her. She said "if anything
      happens, look at Ardennes Granit." Then she said something else —
      "and that customer, he will not stop coming."

      That is the last I heard from her.
    effects: { trust_marc: "+10" }
    choices:
      - What do you think happened? -> marc_theory
      - Move on -> quest1_hub

  marc_theory:
    type: message
    text: >
      MARC: I think she found proof that the quarry expansion would
      destroy the water table and they shut her up. But I also think
      that hiking guide — Thierry — is not normal. The way he talks
      about her honey, about her... it is not just a customer thing.
      It is something else.

      Léa told me months ago that someone was leaving things at her
      apiary. Little gifts. Pressed flowers. Notes about her bees. She
      thought it was sweet at first. Then it got creepy — whoever it was
      knew her schedule. Knew when she would be alone at the hives.
    effects: { trust_marc: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Léa died. Multiple people saw or
      heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Kevin (was kayaking on the Our) -> kevin_interview
      - Find Georges (winemaker, was on the road late) -> georges_interview
      - Find Anne (baker, starts at 5am, heard something) -> anne_interview
      - Find Ben (BMX in the forest, saw lights) -> ben_interview

  # --- Kevin (saw someone following Léa) ---

  kevin_interview:
    type: tweet
    from: kevin
    text: >
      session kayak ce soir mais l'ambiance au village c chelou en ce
      moment. genre y'a un truc qui va pas. merde quoi.
    effects: { trust_kevin: "+5" }
    choices:
      - Ask Kevin about that evening -> kevin_talk

  kevin_talk:
    type: message
    text: >
      KEVIN: wsh frr ok mais tu le dis à personne hein. j'étais en
      kayak sur l'Our vers 20h, session sunset. et j'ai vu le gars —
      thierry le guide — sur le sentier de la carrière. il suivait
      quelqu'un. genre à 50 mètres derrière. et devant c'était Léa,
      j'ai reconnu sa veste orange.

      elle marchait vers les ruches du haut, celles près des falaises.
      et lui il la suivait putain. quand elle s'est retournée il s'est
      planqué derrière un arbre. Herrgottsack c'est pas normal sah.
    effects:
      trust_kevin: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Georges (saw quarry car at night) ---

  georges_interview:
    type: tweet
    from: georges
    text: >
      Ech war spéit um Wee heem vum Wäibau. Eng Camionnette vun
      Ardennes Granit op der Strooss bei der Carrière. Um 23h. Dat
      ass net normal.
    effects: { trust_georges: "+5" }
    choices:
      - Ask Georges what he saw -> georges_talk

  georges_talk:
    type: message
    text: >
      GEORGES: I was coming back from the vineyard around 23h — late
      harvest preparation. On the road near the quarry access, I saw
      the white Ardennes Granit SUV parked with its lights off. And next
      to it, a second vehicle — Yves Dumont's personal car. I know it
      because he has that ridiculous Mercedes with the vanity plates.

      At 23h. At the quarry access road. The quarry does not operate
      at night.

      I noted it in my head. I should have written it down. Now I
      wish I had called the police.
    effects:
      trust_georges: "+10"
      night_witnesses: "+1"
      quarry_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Anne (heard argument near cliffs) ---

  anne_interview:
    type: tweet
    from: anne
    text: >
      Fournée du jour à 5h wie gewinnt. Mais cette nuit-là, j'ai
      entendu des voix qui venaient de la carrière. Des cris. Vers 23h30.
    effects: { trust_anne: "+5" }
