    from: claire
    text: >
      d'Léa hat Recht. d'Beie sinn d'Séil vun dësem Tal. mir wäerten
      et net vergiessen. mir wäerten hir Wise schützen. fir si.
    choices:
      - The End -> game_complete

  # --- ENDING B: Yves (Partial Ending) ---

  confront_yves:
    type: message
    text: >
      You present the quarry evidence to Yves Dumont:

      "I have geological surveys proving the expansion will destroy
      the aquifer. I have photos of blasting outside the permitted
      zone. I have Léa's intercepted report to the Ministry. I have
      the falsified environmental impact assessment. I have your car
      at the quarry at 23h the night she died."
    choices:
      - Send -> yves_response

  yves_response:
    type: message
    text: >
      YVES: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. Ardennes Granit has always operated
      within regulatory and environmental requirements.

      But it is too late. You have sent the evidence to Patrick, to
      the Beien an Natur association, and to the Ministry.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE QUARRY

      The environmental story breaks. Ardennes Granit is ordered to
      halt all extraction pending investigation. The expansion permit
      is suspended. 150 jobs hang in the balance. The village is divided.

      But Léa's death?

      Without the stalking evidence, Thierry is never investigated. The
      pheromone on her jacket is never tested. Her death remains
      classified as an accidental fall. Thierry continues to hike the
      trails. He continues to visit the hives. He tends them now,
      claiming Léa "would have wanted" him to.

      He creates a new anonymous account. It follows Claire.

      The quarry is stopped. But the person whose obsession led to
      Léa's death walks free. And the truth of how she really died
      stays buried, like the limestone under the meadow.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: marc
    text: "d'Wise ass gerett. d'Beie bleiwen. mee d'Léa kennt net zeréck. an d'Wouerecht... och net."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_josy:
    type: message
    text: >
      You confront Mayor Kieffer with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> josy_response

  josy_response:
    type: tweet
    from: mireille
    text: >
      Mon client prend note de vos allégations. Toute diffusion publique
      de propos diffamatoires fera l'objet de poursuites immédiates.
      — Cabinet Hoffmann-Lacroix, Luxembourg-Ville
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct link
      between Kieffer and Léa's death — and there is not one beyond
      political complicity — your evidence is insufficient.

      Ardennes Granit continues to expand. Thierry continues to watch.
      The meadows shrink. The bees decline. The village loses its soul,
      one blast at a time.

      Six months later, @chantal_grosch creates a new account. It
      follows Marc Hoffmann.
    choices:
      - The End -> game_complete

