      mandibular pheromone are found on Léa's jacket. He had sprayed
      her equipment. The bees swarmed. She stepped back. He was there.
      He could have saved her. He watched.

      Patrick Faber, finally in possession of Léa's full evidence
      package, publishes the Ardennes Granit story in the Lëtzebuerger
      Journal and it goes national. The Ministry of the Environment
      orders an immediate halt to quarry operations. The expansion
      permit is revoked. Yves Dumont faces criminal charges for
      falsifying the geological survey and for threatening a citizen.

      Marc Hoffmann, reading the story from his flat in Luxembourg
      City, calls Claire for the first time since the funeral.

      "Ech verkafe keng Wis. D'Beie bleiwen."
      I am not selling the meadows. The bees stay.
