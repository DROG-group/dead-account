      evidence_total: "+1"
    choices:
      - Continue -> corruption_hub

  # --- Sanna ---

  sanna_interview:
    type: message
    text: >
      SANNA: I don't talk about sources. Ever.
    effects: { trust_sanna: "+5" }
    choices:
