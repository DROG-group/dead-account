      - I need more evidence -> investigation_hub

  # --- ENDING A: Tuomas (Best Ending) ---

  confront_tuomas:
    type: message
    text: >
      You present your evidence to Tuomas:

      "I know @niilo is your account. I know you put a GPS tracker on
      Aino's car. I know you were at her cabin window every night. I
      know you followed her on her tours. I have witnesses, booking
      records, and the anonymous posts."
    choices:
      - Send -> tuomas_response

  tuomas_response:
    type: message
    text: >
      Tuomas doesn't reply for a long time. Then:

      TUOMAS: You don't understand. I love the aurora. I love what she
      sees in the sky. I was protecting her. She was in danger from
      those mining people and she wouldn't let me help. I needed to
      know she was safe. Everything I did was out of love.

      That's not love. That's obsession.

      You've already sent the evidence to Ylikonstaapeli Repo. And to
      Sanna Järvinen.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Ylikonstaapeli Repo reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the booking records, the
      witness testimonies — Tuomas is arrested for stalking and
      harassment. A GPS tracker is recovered from under Aino's Hilux
      at a relative's farm south of Sodankylä.

      Sanna Järvinen, finally in possession of Aino's full evidence
      package, publishes the ArcticMine story in Helsingin Sanomat.
      The ministry orders an unannounced inspection. ArcticMine's
      permits are suspended pending a full environmental review.
      Harri Väisänen faces criminal charges for operating inside a
      protected Natura 2000 area.

      And Aino Korhonen, reading the story from a friend's cabin in
      Inari, calls her brother for the first time in nine days.

      "Mä tuun kotiin."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: aino
    text: >
      pohjoinen taivas ei koskaan valehtele. eikä revontulivaaran
      ihmiset. kiitos kun ette luovuttaneet.
    choices:
      - The End -> game_complete

  # --- ENDING B: Harri (Partial Ending) ---

  confront_harri:
    type: message
    text: >
