    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The illegal drilling story breaks. ArcticMine is ordered to halt
      all operations pending investigation. The permits may be revoked.
      Eighty promised jobs vanish. The village is divided.

      But Aino?

      Without the stalking evidence, Tuomas is never investigated. He
      continues to live in the village. He continues to book tours with
      other guides. He creates a new anonymous profile. He finds new
      windows to watch.

      Three months later, Aino reads about ArcticMine online. She
      returns quietly. She changes her cabin locks. She stops guiding
      alone at night. She checks under her car every morning.

      The corporation is exposed. But the person who terrorised Aino
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

