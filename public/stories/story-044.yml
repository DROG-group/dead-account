      Okay. Aino and I were working together. She had drone footage of
      ArcticMine drilling inside the Natura 2000 boundary — test holes,
      heavy machinery, core samples. She had GPS coordinates that prove
      they're operating where their permit explicitly forbids it.

      We were going to publish together in Pohjolan Sanomat. Then she
      went dark. And two days later someone broke into my car and stole
      my backup hard drive.

      Aino is alive. She contacted me once, from a prepaid number. She
      said she was hiding. She said "they threatened me at the station
      and someone else won't leave me alone."

      I can't tell you where she is. But with enough evidence, I can
      publish and make it safe for her to come home.
    effects:
      trust_sanna: "+25"
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
