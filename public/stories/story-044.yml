      - Talk to Pekka about the drilling -> pekka_drilling
      - Back to hub -> investigation_hub

  # --- Station Records ---

  station_records:
    type: message
    text: >
      The aurora observation station's shared drive shows Aino's recent
      work: GPS-logged survey routes across six sites near Karhunselkä
      ridge. The data for three sites inside the protected boundary is
      marked "UNDER REVIEW" — suspicious.

      Her activity log shows she made 14 field trips to the ArcticMine
      drilling zone in the past month. The last entry: "Drone footage
      of test drilling inside Natura 2000 boundary. Coordinates confirmed.
      Equipment bears ArcticMine serial numbers. This is illegal."
    effects:
