entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN REVONTULIVAARA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to revontulivaara.social — the community Mastodon instance
      for the arctic village of Revontulivaara, northern Finland.

      The local feed is uneasy. The polar night is ending but something
      darker has settled over the village.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name keeps coming up:
      @aino_korhonen.

      An aurora guide. Night sky photographer. She led tourists under the
      northern lights and documented the wilderness. People are panicking.
      She hasn't posted in six days.
    choices:
      - Look at her profile -> aino_profile

  aino_profile:
    type: tweet
    from: aino
    text: "ArcticMine on porannut koealueella joka on suojelualueen sisällä. Mulla on GPS-koordinaatit ja kuvat. Tää on laitonta."
    choices:
      - That's her last real post... -> strange_photo

  strange_photo:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photo of the night sky. Overexposed, shaky, shot from
      a weird angle. Posted at 4am. No caption.

      Her friends say that's not her style. Aino's aurora photos were
      art. This looked like someone grabbed her phone. The police say
      she probably went to Rovaniemi for a break. Nobody believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: poliisi
    text: >
      Olemme vastaanottaneet ilmoituksen Revontulivaaran asukkaasta.
      Tässä vaiheessa ei ole syytä epäillä rikosta. Kaikki tiedot
      voi ilmoittaa numeroon 112 tai poliisiasemalle.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are frantic. Her best friend @siiri_makela is
      losing it. Her brother @lauri_korhonen is driving up from
      Rovaniemi. Her colleague @eero_virtanen keeps posting worried
      messages. The reindeer herder @pekka_karjalainen says she was
      right about the drilling.

      And the journalist @sanna_jarvinen hasn't said a word.

      One guy — @tuomas_lindqvist — keeps posting about how much he
      misses "his guide." Something about his tone feels off.

      Nobody buys the police line. Nobody thinks Aino just left.
    effects: { trust_siiri: "+5", trust_lauri: "+5" }
    choices:
      - Start following Aino's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Revontulivaara. Follow Aino's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Marja (café owner, knows everyone) -> marja_intro
      - Talk to Pekka (reindeer herder, saw the drilling) -> pekka_intro
      - Talk to Viivi (teen aurora hunter, seems scared) -> viivi_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Aino with the rhythms of arctic life:
      aurora forecasts, reindeer sightings, ski trail conditions,
      the café's daily pulla specials.

      Key names surface: Siiri (best friend, nurse), Eero (colleague,
      rattled), Sanna (journalist, silent), and the teens — Viivi,
      Aleksi, Mikko — who idolised Aino's night sky work.

      Also prominent: ArcticMine Oy, the mining company with drilling
      permits at the edge of the protected area. Their posts are
      corporate greenwashing. Aino's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Marja -> marja_intro
      - Talk to Pekka -> pekka_intro
      - Talk to Viivi -> viivi_intro

  # --- Marja (social map) ---

  marja_intro:
    type: tweet
    from: marja
    text: >
      Kahvila on auki mutta sydän on raskas. @aino_korhonen, sun
      pöytä odottaa. Tule takas.
    effects: { trust_marja: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Marja -> marja_talk

  marja_talk:
    type: message
    text: >
      MARJA: You're new here? Tervetuloa. Bad timing though. Everyone's
      on edge about Aino.

      Let me tell you who's who. Siiri is Aino's best friend — they
      share a flat above the health centre. Sweet girl, completely
      wrecked right now. Eero Virtanen works with Aino doing wilderness
      guiding. Good man, but he's been strange since she vanished.
      Lauri is Aino's older brother, driving up from Rovaniemi.

      And Sanna Järvinen — the journalist — she and Aino were working
      on something together. Something about ArcticMine's drilling. Sanna
      hasn't said a word since Aino disappeared. That's not like her.

      Oh, and there's this tourist — Tuomas Lindqvist. He's been coming
      here for aurora tours for two years. Always requests Aino
      specifically. It's... a lot.
    effects: { trust_marja: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Tuomas -> marja_tuomas
      - Ask about ArcticMine -> marja_arcticmine
      - Thank her and move on -> quest1_hub

  marja_tuomas:
    type: message
    text: >
      MARJA: Tuomas? Hän on... siis, miten sen sanois. He's been
      visiting every month for two years. Always books Aino's tours.
      Started showing up at the café whenever she was here. Sits at the
      next table, stares. Offers to carry her camera equipment.

      Aino was polite about it, she always is, but I could see it was
      getting to her. Last month she told me "hän ei ymmärrä sanaa ei."
      He doesn't understand the word no.

      He moved into the holiday cabin six months ago. Full-time. That's
      when I started worrying.
    effects: { trust_marja: "+5" }
    choices:
      - Ask about ArcticMine -> marja_arcticmine
      - Move on -> quest1_hub

  marja_arcticmine:
    type: message
    text: >
      MARJA: Vittu se kaivos. They showed up two years ago with their
      "sustainable mining" bullshit. The kunnanjohtaja — Juhani Niskanen
      — rolled out the red carpet. Jobs, development, investment. The
      usual promises.

      But they've been drilling test holes inside the protected area.
      The reindeer herders noticed first — the animals won't go near
      the drilling sites. Pekka has been fighting them for months.

      Aino was the one who actually went out there with GPS and a camera
      and documented exactly where they were drilling. Inside the boundary.
      Illegal. Two weeks later she's gone.

      Sattumaa? Vittu ei oo sattumaa.
    effects: { trust_marja: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Pekka (reindeer herder, witness tease) ---

  pekka_intro:
    type: tweet
    from: pekka
    text: >
      neljäkymmentäviis vuotta porojen kanssa. maa ei oo enää sama.
      @aino_korhonen oli oikeessa. ja nyt se on poissa.
      yhdistäkää pisteet.
    effects: { trust_pekka: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Pekka -> pekka_talk

  pekka_talk:
    type: message
    text: >
      PEKKA: I've herded reindeer on this land since I was a boy. I
      know every hill, every river crossing, every place where the moss
      grows thick. And I'm telling you — something is wrong near
      Karhunselkä ridge.

      The reindeer won't go there anymore. The ground vibrates. There's
      machinery noise at night. I found drill holes with ArcticMine
      markers inside the Natura 2000 boundary. Inside. Where they have
      no permit.

      Aino mapped every hole. She had GPS coordinates, photographs,
      timestamps. She was building a case. And then — poissa. Gone.

      You think that's a coincidence? Perkele. I don't believe in
      coincidences in the tunturi.
    effects: { trust_pekka: "+10" }
    choices:
      - Did you see anything unusual recently? -> pekka_night
      - Move on -> quest1_hub

  pekka_night:
    type: message
    text: >
      PEKKA: The night before she disappeared — I was checking my
      reindeer fence, around midnight. I saw headlights up at the
      aurora observation point. Not unusual in tourist season, but
      this was a big vehicle. SUV. Dark. ArcticMine plates.

      At midnight. At Aino's observation point.

      And then maybe an hour later, another car. Smaller. Just sitting
      there with lights off. I thought it was strange but... you don't
      go investigating in the dark at minus twenty.
    effects: { trust_pekka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Viivi (teen aurora hunter, witness tease) ---

  viivi_intro:
    type: tweet
    from: viivi
    text: >
      siis mä en kestä tätä. @aino_korhonen opetti mulle kaiken
      revontulista ja tähtikuvauksesta. ei se vaan lähtis ilman
      sanomatta mitään. joku tietää jotain. puhukaa vittu.
    effects: { trust_viivi: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Viivi -> viivi_talk_early

  viivi_talk_early:
    type: message
    text: >
      VIIVI: ootsä uus täällä? huono ajoitus niinku tosissaan. siis
      aino on niinku paras ihminen tässä kylässä. se opetti meidät
      kuvaamaan revontulia, näytti meille kuinka lukee taivasta. tosi
      siistiä.

      ja nyt mua pelottaa koska aleksi näki jotain outoo ainon mökillä
      mut se ei haluu puhuu siitä. se sanoo et ei oo mitään mut siis...
      kyllähän sen näkee et se valehtelee saatana
    effects: { trust_viivi: "+10" }
    choices:
      - What did Aleksi see? -> viivi_aleksi_hint
      - Move on -> quest1_hub

  viivi_aleksi_hint:
    type: message
    text: >
      VIIVI: en mä tiiä tarkkaan. se oli kelkkailemassa illalla ja ajo
      ainon mökin ohi ja näki jonkun tyyppi joka oli niinku tirkistelemässä
      ikkunoista? tai jotain sellasta. se flipps ihan täysin. se ei haluu
      puhuu siitä ku se pelkää et kukaan ei usko sitä.

      yritä puhuu sille mut se on tosi varovainen tuntemattomien kaa.
      puhu ensin kelkoista tai jostain niin se rentoutuu lol
    effects: { trust_viivi: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Revontulivaara. An arctic village
      built around reindeer, aurora tourism, and the wilderness. A night
      sky guide who was exposing illegal mining. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Siiri (Aino's best friend) -> siiri_q1
      - Talk to Eero (Aino's colleague) -> eero_q1
      - Check what Lauri (Aino's brother) is saying -> lauri_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Siiri Q1 ---

  siiri_q1:
    type: tweet
    from: siiri
    text: >
      jos jollakin on tietoo @aino_korhonen soittakaa mulle. sen huone
      on koskematon. kaikki kamerat on paikallaan. se ei ois ikinä
      lähteny ilman kameroita.
    effects: { trust_siiri: "+5", contacts_followed: "+1" }
    choices:
      - DM Siiri -> siiri_q1_talk

  siiri_q1_talk:
    type: message
    text: >
      SIIRI: Thanks for reaching out but I don't know you. Aino has a
      lot of friends here. I'm sure she'll come back.

      ...I keep saying that. En mä enää usko sitä.

      [Siiri is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_siiri: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Eero Q1 ---

  eero_q1:
    type: tweet
    from: eero
    text: >
      The observation point is empty without @aino_korhonen. Her aurora
      forecast board is still on the wall. Her star maps are on the desk.
      She would never abandon a season mid-winter.
    effects: { trust_eero: "+5", contacts_followed: "+1" }
    choices:
      - DM Eero -> eero_q1_talk

  eero_q1_talk:
    type: message
    text: >
      EERO: Aino and I have worked together for three years. She's the
      best aurora guide in Lapland. This mining investigation — it was
      everything to her. She had GPS data, drone footage, soil samples.
      She was close to going public.

      I offered to help her. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to support her.

      [Eero seems sincere. But there's something he's not saying.]
    effects: { trust_eero: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lauri Q1 ---

  lauri_q1:
    type: tweet
    from: lauri
    text: >
      MUN SISKO ON KADONNU ja poliisi sanoo et se on ehkä lomalla???
      SE EI LÄHDE LOMALLE ILMAN SANOMATTA. mä ajan rovaniemeltä nyt.
      joku selittää mulle vittu.
    effects: { trust_lauri: "+5", contacts_followed: "+1" }
    choices:
      - DM Lauri -> lauri_q1_talk

  lauri_q1_talk:
    type: message
    text: >
      LAURI: Who the fuck are you? Another person from that village
      who's going to tell me to calm down? My sister called me the
      night before she disappeared. She said she had something big.
      She said "if anything happens, look at ArcticMine." Then the
      line went dead.

      That's the last I heard from her.
    effects: { trust_lauri: "+10" }
    choices:
      - What do you think happened? -> lauri_theory
      - Move on -> quest1_hub

  lauri_theory:
    type: message
    text: >
      LAURI: I think she found proof that ArcticMine is drilling
      illegally in a protected area and they shut her up. But I also
      think that weird tourist — Tuomas — knows more than he's saying.
      The way he talks about her... se ei oo normaalia. It's not
      just a fan thing. It's something else.

      Aino told me months ago that someone was following her on her
      night tours. She thought she was imagining it. I don't think
      she was imagining it.
    effects: { trust_lauri: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Aino went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Aleksi (was snowmobiling near Aino's cabin) -> aleksi_interview
      - Find Heikki (fishing guide, was out on the ice) -> heikki_interview
      - Find Olli (runs the petrol station, works late) -> olli_interview
      - Find Anneli (shopkeeper, early morning delivery) -> anneli_interview

  # --- Aleksi (saw someone at Aino's cabin) ---

  aleksi_interview:
    type: tweet
    from: aleksi
    text: >
      kelkkailu illalla on yleensä chillii mut viime aikoina kylässä
      on ollu joku outo fiilis. niinku jotain on pielessä. en osaa
      selittää
    effects: { trust_aleksi: "+5" }
    choices:
      - Ask Aleksi about that evening -> aleksi_talk

  aleksi_talk:
    type: message
    text: >
      ALEKSI: joo ok mut älä kerro kellekään. mä olin kelkkailemassa
      illalla, ehkä kymmeneltä. ja mä ajoin ainon mökin ohi ja näin
      sen tyypin — tuomaksen — ainon pihalla. se oli niinku ikkunan
      edessä. seiso vaan siinä ja katto sisään. vittu se oli creepy.

      ku se kuuli kelkan se lähti juoksemaan metsään. siis kuka
      tekee tollasta? mä en sanonu mitään ku en halunnu draamaa mut
      nyt se on aika saatanan vakavaa
    effects:
      trust_aleksi: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Heikki (fishing guide, saw late-night meeting) ---

  heikki_interview:
    type: tweet
    from: heikki
    text: >
      Muistutus: Karhunselkä-alue on suljettu yöaikaan. Olen havainnut
      luvatonta liikennettä viime öinä.
    effects: { trust_heikki: "+5" }
    choices:
      - Ask Heikki what he saw -> heikki_talk

  heikki_talk:
    type: message
    text: >
      HEIKKI: I was coming back from ice fishing around midnight. I
      saw a big SUV at the aurora observation point — ArcticMine plates.
      Two men were standing outside. One of them I recognised: Harri
      Väisänen, the project manager.

      At midnight. At Aino's observation point. In the dark.

      Then I saw Aino's old Hilux parked maybe 200 metres away, hidden
      behind the birch trees. Like she was watching them? Or they were
      waiting for her?

      I noted it in my fishing log. Nobody's asked to see it.
    effects:
      trust_heikki: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Olli (petrol station, saw Aino fleeing) ---

  olli_interview:
    type: tweet
    from: olli
    text: >
      huoltoasema on 24h hätätilanteissa. sinä yönä joku tankkasi
      kolmelta aamuyöllä. hätäinen. en nähnyt kunnolla.
    effects: { trust_olli: "+5" }
    choices:
