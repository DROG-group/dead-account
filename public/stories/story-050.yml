      The heritage destruction story breaks. BaltInvest is ordered to
      halt all construction pending investigation. The housing project
      may be cancelled. Local jobs and investment hang in the balance.
      The village is divided.

      But Tomas?

      Without the stalking evidence, Giedrė is never investigated. She
      continues to work the dig site. She continues to monitor his
      accounts. She creates a new anonymous profile.

      Three months later, Tomas reads about BaltInvest online. He
      returns quietly. He changes his phone number. He stops going to
      dig sites alone. He checks his car every morning.

      The corporation is exposed. But the person who terrorised Tomas
