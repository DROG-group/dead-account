entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN KERNAVĖ
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Kernave.social — the community Mastodon instance for
      the village of Kernavė, Lithuania, in the shadow of its ancient
      hillforts.

      The local feed is buzzing with worry today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @tomas_balciunas.

      An amateur archaeologist. Hillfort enthusiast. He mapped forgotten
      burial sites and documented medieval artefacts. People are worried.
      He hasn't posted in six days.
    choices:
      - Look at his profile -> tomas_profile

  tomas_profile:
    type: tweet
    from: tomas
    text: "Radau dar vieną kapavietę šalia BaltInvest statybų aikštelės. Jie stato ant mūsų protėvių kaulų. Turiu įrodymus."
    choices:
      - That's his last real post... -> strange_photo

  strange_photo:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurry photo of a hillfort silhouette at dusk. Posted at 4am.
      No caption. No hashtags.

      His friends say that's not his style. Tomas always wrote long
      captions about what he found, always tagged the location. The
      police say he probably went hiking in the forests. Something
      doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: pareigunas
    text: >
      Gavome pranešimą dėl Kernavės gyventojo. Šiuo metu nėra pagrindo
      įtarti nusikalstamą veiką. Bet kokią informaciją galite pranešti
      telefonu 112 arba atvykti į nuovadą.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @ruta_kazlauskaite is
      desperate. His brother @matas_balciunas is driving down from Vilnius.
      His colleague at the digs @giedre_navickiene is posting frantic
      messages. The farmer @valdas_jonaitis says Tomas was right about
      the construction site.

      And the journalist @simona_vaiciulyte is strangely silent.

      Nobody buys the police line. Nobody thinks Tomas just "went
      hiking."
    effects: { trust_ruta: "+5", trust_matas: "+5" }
    choices:
      - Start following Tomas's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Kernavė. Follow Tomas's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Birutė (café owner, knows everyone) -> birute_intro
      - Talk to Valdas (farmer, saw the construction) -> valdas_intro
      - Talk to Dovydas (teen BMXer, seems shaken) -> dovydas_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Tomas with the rhythms of a small
      Lithuanian village: market days, mushroom picking reports,
      weather warnings, hillfort festival planning.

      Key names surface: Rūta (girlfriend, teacher), Giedrė
      (archaeologist colleague, seems rattled), Simona (journalist,
      oddly quiet), and the teens — Dovydas, Ieva, Lukas — who loved
      Tomas's archaeology walks.

      Also prominent: BaltInvest Development, the construction company
      building a housing estate on the edge of the archaeological zone.
      Their posts are glossy PR. Tomas's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Birutė -> birute_intro
      - Talk to Valdas -> valdas_intro
      - Talk to Dovydas -> dovydas_intro

  # --- Birutė (social map) ---

  birute_intro:
    type: tweet
    from: birute
    text: >
      Kavinė atidaryta, bet širdis skauda. @tomas_balciunas, tavo
      stalas laukia. Grįžk greičiau.
    effects: { trust_birute: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Birutė -> birute_talk

  birute_talk:
    type: message
    text: >
      BIRUTĖ: Oh, you're new here? Welcome to Kernavė. Terrible time
      to arrive. Everyone's worried sick about Tomas.

      Let me tell you who's who. Rūta is Tomas's girlfriend — they've
      been together three years, she teaches at the village school.
      Sweet girl, devastated right now. Giedrė Navickienė is a real
      archaeologist from Vilnius University who works the summer digs
      here. She was close to Tomas. Too close, some say. Matas is
      Tomas's younger brother, he's coming from Vilnius.

      And Simona Vaičiulytė — the journalist — she and Tomas were
      working on something together. Something about the construction
      site. Simona hasn't said a word since Tomas vanished. That's not
      like her at all.

      Oh, and don't waste your time reading BaltInvest's PR posts.
      Lies wrapped in architectural renders.
    effects: { trust_birute: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Giedrė -> birute_giedre
      - Ask about BaltInvest -> birute_baltinvest
      - Thank her and move on -> quest1_hub

  birute_giedre:
    type: message
    text: >
      BIRUTĖ: Giedrė? She's been leading the university digs here for
      years. Brilliant woman. But since Tomas started volunteering at
      the excavation, she's been... orbiting him. At the café every
      time he was here. Offering to supervise every project. She's a
      professor, he's a self-taught amateur, but she treated him
      like... I don't know. Not a student.

      After he started documenting the burial sites near the
      construction zone, she got worse. Wanted access to everything he
      found. He told me once, "ji neatstoja nuo manęs." I thought he
      meant professionally. Now I'm not so sure.
    effects: { trust_birute: "+5" }
    choices:
      - Ask about BaltInvest -> birute_baltinvest
      - Move on -> quest1_hub

  birute_baltinvest:
    type: message
    text: >
      BIRUTĖ: That construction company showed up two years ago.
      BaltInvest. Big money from Vilnius. They bought farmland on the
      edge of the archaeological protection zone and started building
      a luxury housing estate. "Kernavės Dvaras" — Kernavė Manor.
      Sounds grand, right?

      Problem is, everyone local knows those fields are full of
      medieval remains. Tomas was the first person to actually go out
      there with a metal detector and a camera and document what was
      being bulldozed. He had photos of bones, pottery, iron tools —
      all being dumped into rubble piles by excavators.

      Two weeks later he's gone.
    effects: { trust_birute: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Valdas (the construction, witness tease) ---

  valdas_intro:
    type: tweet
    from: valdas
    text: >
      trisdešimt metų ūkininkauju čia. ta žemė ne statyboms. ten
      mūsų protėviai palaidoti. @tomas_balciunas turėjo teisę. o
      dabar jo nebėra. pagalvokit.
    effects: { trust_valdas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Valdas -> valdas_talk

  valdas_talk:
    type: message
    text: >
      VALDAS: I've been farming this land since my father died. I know
      every field, every slope, every stone. And I'm telling you — that
      land BaltInvest bought is sacred ground. My grandfather used to
      find arrowheads ploughing those fields. Iron age stuff.

      Tomas came to me with a metal detector. We spent three Sundays
      mapping what was there. He found a burial site — real medieval
      graves, right where they're pouring foundations. He photographed
      everything. He was building a case for the heritage inspectorate.
      And then poof — dingo.

      You think that's a coincidence? I don't believe in coincidences
      on this land.
    effects: { trust_valdas: "+10" }
    choices:
      - Did you see anything unusual recently? -> valdas_night
      - Move on -> quest1_hub

  valdas_night:
    type: message
    text: >
      VALDAS: The night before Tomas vanished — I was up late checking
      on my beehives, around midnight. I saw lights at the construction
      site. Not unusual, they sometimes run night shifts. But there was
      a car parked near Tomas's house. A black BMW with Vilnius plates.
      Expensive car. Not from around here.

      At midnight. Parked outside Tomas's house.

      I didn't think much of it then. Now I can't stop thinking
      about it.
    effects: { trust_valdas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Dovydas (teen BMXer, witness tease) ---

  dovydas_intro:
    type: tweet
    from: dovydas
    text: >
      blet nx @tomas_balciunas jis man pasakojo apie piliakalnių
      istoriją kai visi kiti sakė eik namo ir žaisk. jei kas nors
      žino kur jis rašykit po velnių
    effects: { trust_dovydas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dovydas -> dovydas_talk_early

  dovydas_talk_early:
    type: message
    text: >
      DOVYDAS: nx tu naujas čia? šūdas koks laikas atvažiuot. tomas
      tai geriausias žmogus šitam kaime. jis mus vesdavo prie
      piliakalnių, rodydavo kur vikinkai gyveno, kur rado kalavijų.
      mega gerai.

      o dabar aš biški bijau nes ieva matė keistą dalyką prie tomo
      namo bet ji nenori pasakot. sako kad tai niekis bet blet tai
      ne niekis nx
    effects: { trust_dovydas: "+10" }
    choices:
      - What did Ieva see? -> dovydas_ieva_hint
      - Move on -> quest1_hub

  dovydas_ieva_hint:
    type: message
    text: >
      DOVYDAS: nežinau tiksliai. ji važiavo pro tomo namą vakare
      dviračiu ir matė kažką šalia jo durų. kaip stovėjo ir žiūrėjo
      pro langą. ji sako kad tai ta profesorė iš vilniaus — giedrė.
      tiesiog stovėjo ir žiūrėjo.

      aš būčiau pasakęs bet blet kas patikės paaugliu prieš
      profesorę. pabandyk su ieva pakalbėt bet ji nepasitiki
      nepažįstamais. pirmiau pakalbėk apie fotografiją ar ką ptdr
    effects: { trust_dovydas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Kernavė. A Lithuanian village in the
      shadow of ancient hillforts. An amateur archaeologist who was
      exposing destruction of heritage sites. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Rūta (Tomas's girlfriend) -> ruta_q1
      - Talk to Giedrė (Tomas's colleague) -> giedre_q1
      - Check what Matas (Tomas's brother) is saying -> matas_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Rūta Q1 ---

  ruta_q1:
    type: tweet
    from: ruta
    text: >
      jei kas nors turi naujienų apie @tomas_balciunas skambinkit man.
      jo kambarys nepaliestas. jo metalo detektorius čia. jis niekada
      neišeitų be jo.
    effects: { trust_ruta: "+5", contacts_followed: "+1" }
    choices:
      - DM Rūta -> ruta_q1_talk

  ruta_q1_talk:
    type: message
    text: >
      RŪTA: I appreciate you writing but I don't know you. Tomas has
      many friends here. I'm sure he'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Rūta is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_ruta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Giedrė Q1 ---

  giedre_q1:
    type: tweet
    from: giedre
    text: >
      Kasinėjimų aikštelė tuščia be @tomas_balciunas. Jo užrašai ant
      stalo. Jo radiniai neregistruoti. Jis niekada nepaliktų
      nebaigto darbo. Kažkas atsitiko.
    effects: { trust_giedre: "+5", contacts_followed: "+1" }
    choices:
      - DM Giedrė -> giedre_q1_talk

  giedre_q1_talk:
    type: message
    text: >
      GIEDRĖ: Tomas and I have worked together on the digs for over
      two years. He's the most passionate amateur I've ever supervised.
      This burial site investigation — it was everything to him. He had
      photographs, GPS coordinates, pottery analysis. He was so close
      to filing a formal complaint with the heritage inspectorate.

      I offered to help him. Many times. He said he had it under
      control. He said he was working with a journalist. I just wanted
      to support his work.

      [Giedrė seems earnest. Or obsessive?]
    effects: { trust_giedre: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Matas Q1 ---

  matas_q1:
    type: tweet
    from: matas
    text: >
      mano brolis DINGO ir policija man sako kad gal nuėjo į miškus
      pasivaikščiot??? JIS NEINA BE PERSPĖJIMO. važiuoju iš vilniaus.
      kas nors man paaiškins.
    effects: { trust_matas: "+5", contacts_followed: "+1" }
    choices:
      - DM Matas -> matas_q1_talk

  matas_q1_talk:
    type: message
    text: >
      MATAS: Who are you? Another person from that village who's going
      to tell me to calm down? My brother called me the night before he
      disappeared. He said he had something big. He said "jei kas nors
      atsitiks, žiūrėk į BaltInvest." Then he hung up.

      That's the last I heard from him.
    effects: { trust_matas: "+10" }
    choices:
      - What do you think happened? -> matas_theory
      - Move on -> quest1_hub

  matas_theory:
    type: message
    text: >
      MATAS: I think he found proof that BaltInvest is building on
      protected burial sites and they shut him up. But I also think
      that professor — Giedrė — knows more than she's saying. The way
      she talks about him... it's not just professional concern. It's
      something else.

      Tomas told me months ago that someone was going through his field
      notebooks at the dig site. He thought it was nothing. I don't
      think it was nothing.
    effects: { trust_matas: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Tomas went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Ieva (was cycling past Tomas's house) -> ieva_interview
      - Find Žilvinas (museum warden, works late) -> zilvinas_interview
      - Find Petras (forester, early morning in the woods) -> petras_interview
      - Find Daina (pharmacist, saw something at dawn) -> daina_interview

  # --- Ieva (saw someone at Tomas's house) ---

  ieva_interview:
    type: tweet
    from: ieva
    text: >
      padariau naują piešinį piliakalnio. bet nuotaika šūdas. kažkas
      ne taip šitam kaime. nežinau kaip paaiškint
    effects: { trust_ieva: "+5" }
    choices:
      - Ask Ieva about that evening -> ieva_talk

  ieva_talk:
    type: message
    text: >
      IEVA: blet ok bet tu niekam nesakyk. aš važiavau dviračiu pro
      tomo namą apie septintą vakaro. ir mačiau tą profesorę — giedrę
      — šalia jo durų. ji tiesiog stovėjo ir žiūrėjo pro langą. kai
      mane pamatė — pabėgo tiesiai prie savo mašinos.

      nx aš nieko nesakiau nes kas patikės paauglei prieš universitetą
      bet šūdas tai nėra normalus elgesys
    effects:
      trust_ieva: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Žilvinas (museum warden, saw late-night meeting) ---

  zilvinas_interview:
    type: tweet
    from: zilvinas
    text: >
      Priminimas: archeologinė teritorija uždara nuo 22 iki 6 val.
      Pastebėjau neleistinų apsilankymų pastarosiomis naktimis.
    effects: { trust_zilvinas: "+5" }
    choices:
      - Ask Žilvinas what he saw -> zilvinas_talk

  zilvinas_talk:
    type: message
    text: >
      ŽILVINAS: I was locking up the museum around 22:30. I saw Tomas's
      old Volkswagen still parked by his house. And a black BMW — Vilnius
      plates — parked next to the construction site fence. Two men were
