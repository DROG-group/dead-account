# DEAD ACCOUNT — Story 080: Smilyan (Bulgaria 3)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-080.yml
#
# Player investigates the disappearance of young gaida (bagpipe) maker
# and musician Kaloyan Daskalov in the fictional Rhodope mountain village
# of Smilyan.

