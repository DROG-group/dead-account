  title: "Dead Account — Smilyan"
  state:
    # Trust levels per NPC (0-100)
    trust_nevena: 0
    trust_todor: 0
    trust_hristo: 0
    trust_elitsa: 0
    trust_boyana: 0
    trust_milena: 0
