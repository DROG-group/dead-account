      avatar: avatars/meteo_rhodope.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SMILYAN
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to smilyan.social — the community Mastodon instance for
      the Rhodope mountain village of Smilyan, Bulgaria.

      The local feed is full of worry today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name everywhere:
      @kaloyan_daskalov.

      A young gaida maker. Bagpipe musician. He was keeping the old
      Rhodope sound alive, building instruments in his father's
      workshop, playing at festivals across Bulgaria. People are
      panicking. He hasn't posted in six days.
    choices:
      - Look at his profile -> kaloyan_profile

  kaloyan_profile:
    type: tweet
    from: kaloyan
    text: "тая гайда е за планината, не за нечий частен колекция. отказах. пак ще откажа. родопският звук не се продава."
    choices:
      - That's his last real post... -> strange_post

  strange_post:
    type: message
    text: >
      Three days after that post, his account uploaded a single audio
      clip: a distorted, badly recorded drone note. No melody, no
      ornamentation — just a raw, ugly sound. Posted at 4am. No text.

      His friends say that's not him. Kaloyan would never post
      something that crude. The police in Smolyan say he probably
      went to a festival somewhere. Nobody buys it.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: inspector
    text: >
      Получен е сигнал за изчезнал жител на Смилян. Към момента няма
      данни за престъпление. Всяка полезна информация може да бъде
      подадена на телефон 166 или в РПУ Смолян.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @nevena_petrova is
      barely holding it together. His father @todor_daskalov hasn't
      left the workshop. His best friend @hristo_angelov is posting
      furious messages. The old shepherds say the mountain took him.

      The folklorist @rada_beleva says he was the last real gaida
      maker of his generation. The ecologist @gergana_hadzhieva links
      his disappearance to the ski resort controversy.

      And the journalist @zornitsa_dimova is asking questions nobody
      in the кметство wants to answer.
    effects: { trust_nevena: "+5", trust_todor: "+5" }
    choices:
      - Start following Kaloyan's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Smilyan. Follow Kaloyan's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Boyana (runs the local inn, knows everyone) -> boyana_intro
      - Talk to Vasil (shepherd, saw things in the mountain) -> vasil_intro
      - Talk to Elitsa (teen, Kaloyan taught her kavall) -> elitsa_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is a mix of panic about Kaloyan and the slow pulse of
      a mountain village: weather warnings for the high passes, the
      library's weekend hours, a recipe for Rhodope kachamak.

      Key names surface: Nevena (girlfriend, teacher), Hristo (best
      friend, bartender at the inn), Zornitsa (journalist, digging),
      and the teens — Elitsa, Petya, Nikola — who idolised Kaloyan's
      music.

      Also prominent: Alpine Rhodope Resort, some investment project
      planning a ski resort on the protected mountain slopes. Their
      posts are slick marketing. Kaloyan's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Boyana -> boyana_intro
      - Talk to Vasil -> vasil_intro
      - Talk to Elitsa -> elitsa_intro

  # --- Boyana (social map) ---

  boyana_intro:
    type: tweet
    from: boyana
    text: >
      Ханът е отворен, ама без музика. @kaloyan_daskalov, къде си бе
      момче? В петък няма кой да свири.
    effects: { trust_boyana: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Boyana -> boyana_talk

  boyana_talk:
    type: message
    text: >
      BOYANA: Oh, you're new? Welcome to Smilyan. Bad timing though.
      Everyone's nervous about Kaloyan.

      Let me tell you who's who. Nevena is his girlfriend — sweet
      girl, teaches at the village school, completely devastated.
      Hristo is his best friend, works the bar here at the inn.
      Todor is Kaloyan's father, master woodworker, taught Kalo
      everything about building gaidas.

      Zornitsa Dimova — the journalist — she's been poking around
      the кметство about the ski resort deal. Kaloyan was against
      it. Very publicly against it.

      And there's some foreigner who's been coming to the village.
      German or Austrian, I think. Kept asking about Kaloyan's
      instruments. Кало didn't like him one bit.
    effects: { trust_boyana: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the foreigner -> boyana_foreigner
      - Ask about the ski resort -> boyana_resort
      - Thank her and move on -> quest1_hub

  boyana_foreigner:
    type: message
    text: >
      BOYANA: Klaus something. Weidemann? He says he's an
      ethnomusicologist — studies traditional instruments. He's been
      to Smilyan three times this year. Always found Kaloyan at the
      workshop, always wanted to buy a gaida. Not just any gaida —
      Kaloyan's personal instrument. The one his grandfather made.

      Кало told him no. Politely the first time, firmly the second.
      The third time... Кало told me Klaus offered 15,000 euros. For
      a bagpipe. Who does that?

      The last time Klaus was here was about a week before Кало
      disappeared. He came to the inn, sat in the corner, drank
      rakia, watched Kaloyan play. Didn't say a word to anyone.
      Just... watched. Мамка му, creepy.
    effects: { trust_boyana: "+5" }
    choices:
      - Ask about the ski resort -> boyana_resort
      - Move on -> quest1_hub

  boyana_resort:
    type: message
    text: >
      BOYANA: Ебати тъпотията. Some company — Alpine Rhodope — wants
      to build a ski resort on Голям Перелик. Protected area. Ancient
      forests. Where the old shepherds still graze.

      The кмет — Dragomir — is all for it. Says it'll bring jobs and
      tourists. But half the village knows he's getting something from
      the deal. His brother-in-law Stefan runs the construction
      company that got the contract. Coincidence? Мамка му.

      Kaloyan was the loudest voice against it. He organised
      petitions, recorded protest songs, got the ecologists involved.
      He said the mountain is sacred, the forest is our lungs, the
      gaida wood comes from those trees.

      Two weeks later he's gone.
    effects: { trust_boyana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Vasil (shepherd, mountain witness) ---

  vasil_intro:
    type: tweet
    from: vasil
    text: >
      45 години с овцете в тая планина. водата не е същата. дърветата
      ги секат. @kaloyan_daskalov имаше право за всичко.
    effects: { trust_vasil: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Vasil -> vasil_talk

  vasil_talk:
    type: message
    text: >
      VASIL: I've been walking these mountains since before you were
      born. I know every path, every clearing, every spring. And
      things are changing. They've been surveying Голям Перелик for
      that cursed resort. Bulldozers on the logging road. Survey
      stakes where the old beech forest stands.

      Kaloyan came up to see me the week before he disappeared. He
      was agitated. Said he found something in the forest — markers,
      plans, things that showed the resort was going to be much
      bigger than what the кметство told people.

      He took photos. He said he was going to post them.
    effects: { trust_vasil: "+10" }
    choices:
      - Did you see anything unusual recently? -> vasil_night
      - Move on -> quest1_hub

  vasil_night:
    type: message
    text: >
      VASIL: The night he disappeared — I was up on the ridge with
      the flock. Around midnight I heard a vehicle on the old logging
      road. Nobody uses that road at night. Too steep, too dangerous.

      I saw headlights going up toward the old каменна колиба — the
      stone hut above the tree line. Then nothing. The lights went
      off.

      In the morning I went up there. Fresh tyre tracks in the mud.
      And something else — drag marks. Like someone pulled something
      heavy across the ground.

      I told the police. They wrote it down. That was it.
    effects: { trust_vasil: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Elitsa (teen, kavall student) ---

  elitsa_intro:
    type: tweet
    from: elitsa
    text: >
      яко ми е гадно брат @kaloyan_daskalov ме научи на кавал и сега
      го няма. сериозно ако някой знае нещо кажете де. путка му на
      тоя живот
    effects: { trust_elitsa: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Elitsa -> elitsa_talk_early

  elitsa_talk_early:
    type: message
    text: >
      ELITSA: ти нов ли си тука? яко timing бе. кало е най-якият
      човек в тва село. учеше ме на кавал, правеше гайди, свиреше
      на всеки събор. тва село без него е нищо брат.

      и сега съм флипната защото никола видя нещо strange горе в
      планината ама не иска да говори. казва "нищо де" ама очите му
      казват друго нещо ебати
    effects: { trust_elitsa: "+10" }
    choices:
      - What did Nikola see? -> elitsa_nikola_hint
      - Move on -> quest1_hub

  elitsa_nikola_hint:
    type: message
    text: >
      ELITSA: не знам точно. ходил на риба горе на езерото и видял
      някакъв чужденец с кола близо до работилницата на кало. поне
      тва ми каза. после се затвори и не каза повече.

      трябва да го питаш директно ама той е мнооого мнителен с нови
      хора. първо говори за риболов с него и после може да каже нещо
      lmao
    effects: { trust_elitsa: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Smilyan. A Rhodope mountain village
      built around traditions — music, woodcraft, sheep. A young gaida
      maker who was both keeping the old ways alive and fighting
      against a ski resort that would destroy the mountain.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Nevena (Kaloyan's girlfriend) -> nevena_q1
      - Talk to Hristo (Kaloyan's best friend) -> hristo_q1
      - Check what Todor (Kaloyan's father) is saying -> todor_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Nevena Q1 ---

  nevena_q1:
    type: tweet
    from: nevena
    text: >
      моля ви ако някой е виждал @kaloyan_daskalov обадете се.
      работилницата е заключена. гайдата му е там. той НИКОГА не
      тръгва без гайдата.
    effects: { trust_nevena: "+5", contacts_followed: "+1" }
    choices:
      - DM Nevena -> nevena_q1_talk

  nevena_q1_talk:
    type: message
    text: >
      NEVENA: I appreciate the concern but I don't know who you are.
      Kaloyan has many friends here. I'm sure he'll come back.

      ...I keep telling myself that. I don't believe it anymore.

      [Nevena is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_nevena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Hristo Q1 ---

  hristo_q1:
    type: tweet
    from: hristo
    text: >
      кало брат обади се бе. всички те търсим. ханът без теб е
      мъртъв. ако някой му е направил нещо да му еба майката ще
      го намеря
    effects: { trust_hristo: "+5", contacts_followed: "+1" }
    choices:
      - DM Hristo -> hristo_q1_talk

  hristo_q1_talk:
    type: message
    text: >
      HRISTO: Who are you? Another person who's going to tell me
      to calm down? My best friend is GONE. The police don't give a
      shit. The кмет pretends nothing happened.

      Кало called me the night before he disappeared. He was scared.
      He said "that German guy is back, he won't leave me alone."
      Then he said something about the resort — that he found
      documents that prove the кмет is taking money from the
      construction company.

      Then the line went dead.
    effects: { trust_hristo: "+10" }
    choices:
      - What do you think happened? -> hristo_theory
      - Move on -> quest1_hub

  hristo_theory:
    type: message
    text: >
      HRISTO: I think two things happened at once and they both
      fucked him. That collector — Klaus — is obsessed with Kaloyan's
      instruments. Not like a normal fan. Like a man who needs to
      possess things. I saw how he looked at the gaida. Like it was
      already his.

      And the кмет? Dragomir has been selling this village out to
      developers. The resort deal stinks. Kaloyan was the one person
      standing in the way, publicly, loudly.

      Мамка му, maybe both of them had reasons to want him gone.
    effects: { trust_hristo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Todor Q1 ---

  todor_q1:
    type: tweet
    from: todor
    text: >
      синът ми е ИЗЧЕЗНАЛ и полицията ми казва може да е отишъл на
      събор?? КАЛОЯН НЕ ТРЪГВА БЕЗ ДА КАЖЕ. Аз го познавам. Това
      не е нормално.
    effects: { trust_todor: "+5", contacts_followed: "+1" }
    choices:
      - DM Todor -> todor_q1_talk

  todor_q1_talk:
    type: message
    text: >
      TODOR: You're a stranger but at this point I'll talk to anyone
      who'll listen.

      My son built gaidas. Real ones — goatskin, cherry wood from
      our mountain, hand-tuned. Not factory shit. He said every
      instrument has the voice of the tree it came from. He was
      twenty-three and he had more skill than men twice his age.

      The night before he disappeared, he came to my workshop. He
      said "tate, someone is going to try to take the дядова гайда."
      His grandfather's bagpipe — the oldest instrument in our
      family, over a hundred years old.

      He hid it somewhere. He wouldn't tell me where. He said "if
      they can't find it, they'll have to come through me."

      Then he was gone.
    effects: { trust_todor: "+10" }
    choices:
      - Who wanted the gaida? -> todor_who
      - Move on -> quest1_hub

  todor_who:
    type: message
    text: >
      TODOR: That German. Klaus Weidemann. He came to my workshop
      too. Very polite, very professional. Said he was preserving
      European heritage. Offered money — more money than I've seen
      in my life.

      I said no. The gaida is not for sale. It's not a museum piece.
      It's a living instrument. Kaloyan plays it. His children will
      play it.

      Klaus smiled and said "everything has a price." I told him to
      get out.

      But it's not just Klaus. The кмет also visited. Said Kaloyan's
      opposition to the resort was "hurting the community." Said we
      should think about "what's best for Smilyan." Sounded like a
      threat.
    effects: { trust_todor: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Kaloyan went silent. Multiple
      people saw or heard things. Piece together the timeline from
      witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Nikola (was fishing near the workshop) -> nikola_interview
      - Find Yanko (forest ranger, patrols at night) -> yanko_interview
      - Find Milena (pharmacist, lives near the road) -> milena_interview
      - Find Dimitar (photographer, was flying his drone) -> dimitar_interview

  # --- Nikola (saw someone at the workshop) ---

  nikola_interview:
    type: tweet
