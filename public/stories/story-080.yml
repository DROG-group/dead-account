    rumen:
      name: "Румен Балабанов"
      bio: "Заместник-кмет | Инвестиции и инфраструктура | Смилян"
      avatar: avatars/rumen.jpg
    obshtina:
      name: "Община Смилян"
      bio: "Официален акаунт | Новини и обяви | Работно време: Пон-Пет 9-17ч"
      avatar: avatars/obshtina.jpg

    # === Local Community ===
    boyana:
      name: "Бояна Маринова"
      bio: "хан Родопска Среща | домашна кухня | ракия | живата музика е в петък"
      avatar: avatars/boyana.jpg
    milena:
      name: "Милена Стоянова"
      bio: "аптекарка | Смилян | здраве и билки | открито и в неделя сутрин"
      avatar: avatars/milena.jpg
    vasil:
      name: "Васил Гарджев"
      bio: "овчар | 45 години в планината | родопската природа не е за продан"
      avatar: avatars/vasil.jpg
    svetla:
      name: "Светла Чилингирова"
