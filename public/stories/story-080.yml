      avatar: avatars/kaloyan.jpg
    nevena:
      name: "Невена Петрова"
      bio: "гаджето на калоян | учителка в Смилян | родопска душа"
      avatar: avatars/nevena.jpg
    todor:
      name: "Тодор Даскалов"
      bio: "бащата на калоян | дърводелец | гайдата е в кръвта ни"
      avatar: avatars/todor.jpg
    hristo:
      name: "Христо Ангелов"
      bio: "най-добрият приятел на кало | барман в хана | планината лекува"
