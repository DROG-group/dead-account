    type: message
    text: >
      INSPECTOR MARKOV: Off the record — completely off the record —
      I wanted to investigate the resort connection. My superior in
      Smolyan told me to stand down. He said the кметство had
      "jurisdiction over planning matters." That's not how it works.
      Someone made a call.

      The collector angle is different. A foreign national harassing
      a Bulgarian citizen, possible involvement in a disappearance —
      that's clearly criminal. If you have evidence, I can act on
      that.

      Bring me something solid and I'll reopen the case.
    effects:
      trust_inspector: "+15"
      evidence_total: "+1"
    choices:
      - Back to investigation hub -> investigation_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Kaloyan than anyone in Smilyan. Who is responsible?
    choices:
      - Confront Klaus Weidemann (the obsessive collector) -> confront_klaus
        when:
          state: collector_evidence
          gte: 5
      - Confront кмет Dragomir (the corrupt mayor) -> confront_dragomir
        when:
          state: resort_evidence
          gte: 3
      - Confront Stefan Vargov (the construction boss) -> confront_stefan
      - I need more evidence -> investigation_hub

  # --- ENDING A: Klaus (Best Ending) ---

  confront_klaus:
    type: message
    text: >
      You present your evidence to Klaus Weidemann:

      "I know @RhodopeSoundHunter is your account. I know you were
      surveilling Kaloyan's workshop. I know you confronted him the
      evening he disappeared. I know your rental car was on the
      mountain road that night. I have drone footage and witnesses."
    choices:
      - Send -> klaus_response

  klaus_response:
    type: message
    text: >
      Klaus doesn't reply for a long time. Then:

      KLAUS: You don't understand. I am trying to SAVE these
      instruments. They belong in climate-controlled environments
      where they can be studied and preserved. Leaving a pre-1900
      gaida in a mountain workshop is cultural vandalism. Everything
      I did was for the preservation of heritage.

      That's not preservation. That's obsession. That's theft
      disguised as scholarship.

      You've already sent the evidence to Inspector Markov and to
      Zornitsa Dimova.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE COLLECTOR

      Three things happen in quick succession.

      Inspector Markov reopens the case. With your evidence — the
      anonymous account, the surveillance photos, the drone footage,
      the witness testimonies — Klaus Weidemann is detained at
      Sofia Airport attempting to leave the country. In his luggage:
      lockpicking tools and a GPS tracker registered to a Plovdiv
      rental company. His hotel room in Smolyan yields maps of
      Kaloyan's workshop with entry points marked.

      Under interrogation, Klaus reveals he followed Kaloyan up the
      mountain that night intending to find where he hid the gaida.
      He saw Kaloyan intercepted by Stefan Vargov's men and followed
      at a distance. He watched them take Kaloyan to the stone hut.
      He did nothing to help. He searched the area for the gaida
      while a man was being held captive.

      Stefan Vargov's truck is traced to an abandoned logging camp
      higher up the mountain. Kaloyan is found there — alive, dehydrated,
      his hands injured from trying to escape. He was held for six
      days.

      Zornitsa publishes everything: the resort corruption, the
      pre-dated permits, the кмет's bank deposits, the illegal
      logging. The Environment Ministry orders the resort project
      suspended. Dragomir Kehayov resigns. Stefan Vargov faces
      kidnapping and illegal logging charges.

      Klaus Weidemann is charged with stalking, breaking and
      entering, and failure to render assistance. His university
      suspends him. His instrument collection is investigated.

      Kaloyan comes home. The дядова гайда is recovered from a
      hollow tree above the workshop — exactly where lightning
      struck a century ago.
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: kaloyan
    text: >
      гайдата пее пак. планината е тука. смилян е тука.
      родопският звук не се продава и не се спира.
      благодаря на всички.
    choices:
      - The End -> game_complete

  # --- ENDING B: Dragomir (Partial Ending) ---

  confront_dragomir:
    type: message
    text: >
      You present the resort corruption evidence to кмет Dragomir:

      "I have photos of pre-dated construction permits signed by
      you. I have bank records showing payments from Alpine Rhodope
      to your accounts. I have evidence of illegal logging on
      protected land by your brother-in-law's company. And I have
      witnesses who saw his truck on the mountain the night Kaloyan
      disappeared."
    choices:
      - Send -> dragomir_response

  dragomir_response:
    type: message
    text: >
      DRAGOMIR: These are fabricated accusations designed to undermine
      the development of Smilyan. Any publication of defamatory
      material will result in legal action. The resort project has
      followed all proper procedures.

      But it's too late. You've sent the evidence to Zornitsa, to
      Gergana's environmental organisation, and to the prosecutors
      in Smolyan.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE RESORT

      The corruption story breaks. The resort project is suspended
      pending investigation. Dragomir is forced to resign. Stefan
      Vargov is arrested. Under pressure, Vargov reveals where
      Kaloyan is being held. He's found alive in the abandoned
      logging camp.

      The mountain is saved. The old forest stands.

      But Klaus Weidemann?

      Without the stalking evidence, he's never investigated. He
      returns to Germany. He continues collecting. He publishes a
      paper about "the Smilyan gaida tradition" that reads like a
      shopping catalogue.

      Six months later, Todor receives a letter from a "heritage
      foundation" offering to "safeguard" the family's instruments.
      The letterhead address traces back to Klaus's university.

      The resort is stopped. But the man who stalked Kaloyan, who
      watched him being taken and did nothing, who tried to steal
      from him while he was captive — walks free. And he's still
      looking.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: kaloyan
    text: "върнах се. планината е спасена. но някой все още гледа към работилницата."
    choices:
      - The End -> game_complete

  # --- ENDING C: Stefan (Wrong Ending) ---

  confront_stefan:
    type: message
    text: >
      You confront Stefan Vargov directly with your evidence.

      Within the hour, you receive a message:
    choices:
      - Read the response -> stefan_response

  stefan_response:
    type: message
    text: >
      STEFAN: Нямам представа за какво говориш. Аз съм строител.
      Строя неща. Ако имаш проблем, обърни се към адвоката ми.

      Stefan's lawyer sends a formal warning. Without a direct link
      between Stefan and Kaloyan's disappearance — and your evidence
      points to the кмет and Klaus more than to Stefan personally —
      the accusation doesn't stick.
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE CONTRACTOR

      Stefan Vargov's lawyer buries your accusation. He's the hired
      muscle, not the mastermind. Without targeting the people who
      gave the orders — the кмет who authorised everything, Klaus
      who was there that night — the evidence is misdirected.

      The resort project continues. The logging continues. Klaus
      continues to circle.

      Two months later, @RhodopeSoundHunter creates a new account.
      It follows Todor Daskalov.

      Six months later, a construction crew arrives at Голям Перелик
      with heavy machinery.

      Kaloyan is not found.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: SMILYAN — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Collector evidence: ${collector_evidence}
      Resort evidence: ${resort_evidence}

      Thank you for playing. Kaloyan's story explores themes of
      cultural exploitation, obsessive collecting, political
      corruption, environmental destruction, and the courage of
      small communities defending what matters.

      If you or someone you know is experiencing stalking,
      harassment, or threats, help is available:
      Национална линия: 0035 924 981 676
