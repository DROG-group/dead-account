      avatar: avatars/yanko.jpg

    # === Teens ===
    elitsa:
      name: "Елица"
      bio: "17 | кало ме научи на кавал | Смилян е boring ама е home | яко"
      avatar: avatars/elitsa.jpg
    petya:
      name: "Петя"
      bio: "16 | снимки от планината | калоян ми беше вдъхновение tbh"
      avatar: avatars/petya.jpg
    nikola:
