      situation.
    effects:
      contacts_followed: "+1"
    choices:
      - "Tell Eva about Hannah's disappearance" -> eva_about_hannah
      - "Ask about the legal case" -> eva_legal_case

  eva_about_hannah:
    type: message
    text: >
      Eva: "Hannah contacted me two months ago with one of the most clear-cut
      Natura 2000 violations I've ever seen. I was preparing a complaint to the
      European Commission. We had a meeting scheduled for the Monday after she
      disappeared. She never showed up. I tried calling, emailing, nothing.
      I've been sick with worry. I reported it to the Landespolizei myself but
      they said without evidence of a crime, there's nothing to investigate.
      The local police said she's just 'unreachable.' This is not normal."
    effects:
      trust_eva: "+15"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about the legal case" -> eva_legal_case
      - "Tell her about the evidence you've gathered" -> eva_share_evidence
      - "Continue investigating" -> investigation_hub

  eva_legal_case:
    type: message
    text: >
      Eva: "The case is iron-clad if we have the evidence. Illegal construction in
      a Natura 2000 zone, forged environmental assessment, corrupt permits, financial
      connections between the developer and the official who approved them. This is
      criminal. Not just administrative -- criminal. If Hannah's evidence files
      still exist, I can have the Landespolizei and EU enforcement involved within
      48 hours. The question is: do the files still exist?"
    effects:
      trust_eva: "+10"
    choices:
      - "Tell her about the cloud backup" -> eva_cloud_backup
      - "Tell her about Lena's USB" -> eva_lena_usb
      - "Continue investigating" -> investigation_hub

  eva_share_evidence:
    type: message
    text: >
      You share everything -- the IP trace, Lena's photos, Hofer's confession,
      the company records linking Fink and Kaltenbrunner, Rosa's witness testimony.
      Eva: "This is more than enough to open a criminal investigation. But we need
      Hannah's original files for the strongest case. And we need to find Hannah.
      I'm coming to Bergfeld tomorrow. Can you meet me?"
    effects:
      trust_eva: "+15"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Prepare for the final confrontation" -> pre_confrontation
      - "Gather last pieces of evidence" -> investigation_hub

  eva_cloud_backup:
    type: message
    text: >
      Eva: "A cloud backup with all the evidence? That changes everything. If we
      can access those files, I can file the complaint immediately. The Landespolizei
      will have to act. Get me access to those files and I promise you, the people
      responsible for this -- for the construction AND for whatever happened to
      Hannah -- will answer for it."
    effects:
      trust_eva: "+10"
    choices:
      - "Work on getting the password from Brigitte" -> brigitte_password
      - "Continue investigating" -> investigation_hub

  eva_lena_usb:
    type: message
    text: >
      Eva: "A copy on a USB stick held by a teenager. Brave girl. But that evidence
