        - { state: partner_evidence, gte: 3 }
        - { state: evidence_total, gte: 12 }

  ending_best_resolution:
    type: message
    text: >
      Hannah is found alive. Shaken, dehydrated, but alive. She was held in a
      basement room for twelve days. The first thing she says to the police is:
      "Did someone publish the evidence?" When they tell her about the Tageszeitung
      story, she cries. Kaltenbrunner and Fink face charges for kidnapping, false
      imprisonment, fraud, corruption, and environmental crimes. The Adlergrat resort
      project is permanently cancelled. The protected zone is restored.
      Tobias is not charged with a crime, but the investigation reveals the extent
      of his controlling behaviour. He voluntarily enters counselling. Franz visits
      Hannah every day in hospital. Lena posts the first photo of Hannah's homecoming
      on Bergfeld.social. It gets 500 boosts. Brigitte makes Apfelstrudel for the
      entire town.

      BEST ENDING: Justice for Hannah. The truth about Bergfeld's corruption is
      exposed. The mountains are saved.

