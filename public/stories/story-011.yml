      - "Ask about the black SUV" -> anneliese_suv
      - "Continue investigating" -> investigation_hub

  anneliese_argument:
    type: message
    text: >
      Anneliese: "The argument? That was earlier in the week. Tuesday. Hannah and
      Tobias at the trailhead car park. I was closing up the hut and I heard shouting.
      Hannah yelling: 'You have no right to follow me!' and Tobias: 'I'm worried
      about you!' Then Hannah: 'Being worried doesn't mean you own me!' He grabbed
      her arm. She pulled free. He walked away. She stood there shaking. I went
      down to check on her. She said 'I'm fine, Anneliese. Just Tobias being Tobias.'
      But she wasn't fine."
    effects:
      trust_anneliese: "+10"
      partner_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about the black SUV" -> anneliese_suv
      - "Continue investigating" -> investigation_hub

