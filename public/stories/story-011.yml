    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "This is very strong evidence" -> investigation_hub
      - "Ask about cloud backups" -> dm_christoph_cloud

  dm_christoph_cloud:
    type: message
    text: >
      Christoph: "Hannah asked me for advice on encrypted cloud storage. I recommended
      a Swiss service -- Tresorit. End-to-end encrypted, servers in Switzerland,
      outside Austrian jurisdiction. I helped her set it up. The data is safe there.
      Even if someone had her laptop, they couldn't access the cloud without her
      password and her phone for the two-factor code. Her phone is presumably with
      her -- wherever she is."
    effects:
      trust_christoph: "+10"
    choices:
      - "Can the two-factor be bypassed?" -> christoph_two_factor
      - "Continue investigating" -> investigation_hub

  christoph_two_factor:
    type: message
    text: >
      Christoph: "She set up backup codes in case she lost her phone. Ten one-time
      codes. She wrote them down and gave them to someone she trusted. Not me -- she
      was smart about compartmentalizing. Said different people had different pieces
      so no one person could be pressured into giving up everything. I think her
      mother has the password and someone else has the backup codes."
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Talk to Brigitte" -> brigitte_password
      - "Continue investigating" -> investigation_hub

  brigitte_post:
    type: tweet
    from: brigitte
    text: >
      My Hannah. Twelve days. If anyone knows where my daughter is, please. She
      would never leave without telling me. Something has happened to her. I feel it
      in my bones. The police say she is an adult and can choose to be alone. But she
      didn't choose this. A mother knows. Please help us find her. #WhereIsHannah
    choices:
      - "Follow Brigitte" -> follow_brigitte
      - "Continue investigating" -> investigation_hub

  follow_brigitte:
    type: message
    text: >
      You follow Brigitte Steiner. She follows back immediately. "Thank you for
      caring. Most people in this town are too afraid to even ask questions."
    effects:
      contacts_followed: "+1"
      trust_brigitte: "+10"
    choices:
      - "Ask about Hannah" -> brigitte_about_hannah
      - "Ask about the USB stick" -> brigitte_usb
      - "Ask about the cloud backup password" -> brigitte_password

  brigitte_about_hannah:
    type: message
    text: >
      Brigitte: "Hannah is my only child. She's strong, independent, fierce.
      She loves these mountains more than anything. When she found out about the
      construction, she was... driven. I told her to be careful. She said 'Mama,
      somebody has to stand up.' The last time I spoke to her was Thursday evening.
      She said she was going up to the ridge at dawn on Friday. She said 'I'll
      call you by lunch.' She never called."
    effects:
      trust_brigitte: "+10"
      partner_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about the USB stick" -> brigitte_usb
      - "Ask about the cloud password" -> brigitte_password
      - "Ask about Tobias" -> brigitte_about_tobias

  brigitte_about_tobias:
    type: message
    text: >
      Brigitte: "Tobias loved Hannah. Too much. He couldn't let go. She told me
      once -- 'Mama, he watches my location on his phone.' She changed her passwords
      after that. But he would still appear wherever she went. I liked the boy once.
      Now I don't know what to think. He keeps saying she told him she needed space.
      She didn't tell ME that. And Hannah tells her mother everything."
    effects:
      partner_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about the USB stick" -> brigitte_usb
      - "Ask about the cloud password" -> brigitte_password
      - "Continue investigating" -> investigation_hub

  brigitte_usb:
    type: message
    text: >
      Brigitte: "The USB stick? Yes, she gave me one. Told me to keep it in the
      safe with the important documents. Said it was her 'insurance.' I haven't
      looked at what's on it. Should I? Can it help find her?"
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Yes, that evidence is crucial" -> brigitte_usb_handover
      - "Ask about the cloud password first" -> brigitte_password

  brigitte_usb_handover:
    type: message
    text: >
      Brigitte: "I'll give it to you. Or to that journalist, Stefan. Or the police.
      Whoever can use it to find my Hannah. Just... promise me you'll find her.
      Promise me she's alive. I can't... I can't think about the alternative."
    effects:
      trust_brigitte: "+15"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about the cloud password" -> brigitte_password
      - "Coordinate evidence delivery" -> evidence_coordination

  brigitte_password:
    type: message
    text: >
      Brigitte: "The cloud password? Yes. She wrote it on a card and put it in
      a sealed envelope. Said 'Don't open this unless something happens to me.'
      I thought she was being dramatic. I have the envelope. The password is
      'Adlergrat-Edelweiss-2024-Wahrheit.' She chose it so I could remember it --
      the mountain, the flower, the year, and the German word for truth. My Hannah."
    effects:
      trust_brigitte: "+15"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "With the password, you can access all the evidence" -> evidence_coordination
      - "Continue investigating before accessing the files" -> investigation_hub

  follow_sepp:
    type: message
    text: >
      You follow Sepp Wallner, the retired Gendarmerie officer. He follows back
      and sends a knowing message. "You're the one poking around about Hannah.
      Be careful who you trust in this town."
    effects:
      contacts_followed: "+1"
      trust_sepp: "+10"
    choices:
      - "Ask Sepp about the police investigation" -> sepp_police
      - "Ask about Kaltenbrunner" -> sepp_kaltenbrunner
      - "Continue investigating" -> investigation_hub

  sepp_police:
    type: message
    text: >
      Sepp: "There IS no investigation. That's the problem. I spent 35 years in
      the Gendarmerie. I know a cover-up when I see one. The local officer filed
      Rosa's statement and then... nothing. No follow-up. No search. No forensics
      at Hannah's flat. Nothing. Someone is telling the local cops to stand down.
      And in Bergfeld, there's only one person with that kind of pull."
    effects:
      trust_sepp: "+10"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Kaltenbrunner?" -> sepp_kaltenbrunner
      - "Ask what should be done" -> sepp_advice
      - "Continue investigating" -> investigation_hub

  sepp_kaltenbrunner:
    type: message
    text: >
      Sepp: "When I was active, Kaltenbrunner tried to bribe me once. Wanted me to
      look the other way on a zoning violation. I refused. He went over my head.
      My report disappeared from the system. That was twenty years ago. He's only
      gotten more powerful since. If he's behind Hannah's disappearance -- and I
      believe he is -- you won't find justice in Bergfeld. You need to go to
      Innsbruck. The Landespolizei. Or higher."
    effects:
      trust_sepp: "+10"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask for advice" -> sepp_advice
      - "Continue investigating" -> investigation_hub

  sepp_advice:
    type: message
    text: >
      Sepp: "Get the evidence. Get witnesses willing to talk. Get the lawyer involved.
      And then go to the Landespolizei in Innsbruck directly. Don't tell anyone
      in Bergfeld what you're doing. Not until it's done. Once the Landespolizei
      opens a case, the local boys can't shut it down. That's your path. It's the
      only one."
    effects:
      trust_sepp: "+15"
    choices:
      - "Prepare the case" -> pre_confrontation
      - "Continue investigating" -> investigation_hub

  follow_ingrid:
    type: message
    text: >
      You follow Ingrid Mayr, the pharmacist. She follows back. "Grüß Gott. I've
      been worried about Hannah. She takes a daily medication and hasn't picked
      up her prescription in two weeks. That's not something you just forget."
    effects:
      contacts_followed: "+1"
