      but in the Tiroler Tageszeitung. The story goes regional.
    choices:
      - "What happens next?" -> ending_best_part2

  ending_best_part2:
    type: message
    text: >
      The Landespolizei arrives in Bergfeld within hours. They search the Adlergrat
      construction site and find something in a sealed drainage culvert -- Hannah's
      phone and rucksack, hidden there by whoever confronted her on the ridge that
      Friday morning. GPS data from her drone, which was found smashed, shows she
      was recording when someone approached her.
    choices:
      - "Continue" -> ending_best_part3

  ending_best_part3:
    type: message
    text: >
      Werner Kaltenbrunner is arrested at his office. Under questioning, his driver
      admits he drove Kaltenbrunner to the ridge that Friday morning. They confronted
      Hannah, destroyed her drone, took her phone and bag, and drove her to a
      property Kaltenbrunner owns near Mayrhofen. She's been held there -- alive
      but imprisoned. Markus Fink is arrested for corruption and conspiracy.
      Hofer turns state witness.
    choices:
      - "See the resolution" -> ending_best_resolution
    when:
