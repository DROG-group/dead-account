      - "Ask about Hannah's cloud setup" -> dm_christoph_cloud
      - "Continue investigating" -> investigation_hub

  dm_christoph_account:
    type: message
    text: >
      Christoph takes hours to reply. "I know what you're going to ask. The account
      that threatened Hannah. Yes, it was created from the Rathaus network. No, I
      didn't create it. But someone used my admin access. I leave my workstation
      unlocked when I go for lunch. Stupid, I know. Anyone in the building could
