      - "DM Hofer about the Adlergrat permits" -> dm_hofer_permits
      - "Ask about his early morning site visit" -> dm_hofer_dawn
      - "Continue investigating" -> investigation_hub

  dm_hofer_permits:
    type: message
    text: >
      Hofer: "The Adlergrat development has been processed through proper channels.
      My office inspects what is brought to our attention through official applications.
      I cannot comment on specific permit details due to administrative confidentiality.
      If you have concerns, please submit them in writing to the Bauamt."
      Textbook bureaucratic deflection.
    choices:
      - "Ask about his dawn visit to the site" -> dm_hofer_dawn
      - "Press him on the Natura 2000 violations" -> hofer_natura_press
      - "Continue investigating" -> investigation_hub

  dm_hofer_dawn:
    type: message
    text: >
      You mention that someone matching his description was photographed at the
      construction site at 5 AM. Very long pause. "I don't know what you're talking
      about. I conduct inspections during normal business hours. If someone resembled
      me at that location, it was a coincidence. Bergfeld is a small town. Many people
      have similar builds." He's rattled. You can tell by the sudden formality.
    effects:
      trust_hofer: "+5"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Press harder" -> hofer_pressure
      - "Back off and investigate from another angle" -> investigation_hub

  hofer_natura_press:
    type: message
    text: >
      You ask directly how a building permit was issued for a Natura 2000 protected
      zone. Hofer: "There are... provisions. Exemptions can be granted when the
      economic benefit outweighs the environmental impact and adequate mitigation
      measures are in place. The assessment was conducted by a qualified expert."
      You ask if he means Dr. Reinhold Brunner. Silence. He goes offline.
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "He's clearly involved" -> hofer_pressure
      - "Continue investigating" -> investigation_hub

  hofer_pressure:
    type: message
    text: >
      An hour later, Hofer sends you a DM. "Listen. I'm retiring in eight months.
      I have a pension. I have a family. I was told to approve the permits. I was
      told not to ask questions. I didn't know about the forged assessment until
      Hannah Steiner showed me. I told her to drop it. She wouldn't. The last thing
      I said to her was 'You don't know who you're dealing with.' I should have
      helped her instead. I live with that every day. But I can't help you either.
      They'll destroy me."
    effects:
      trust_hofer: "+15"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask who told him to approve the permits" -> hofer_who
      - "Promise to protect his identity" -> hofer_protect
      - "Continue investigating" -> investigation_hub

  hofer_who:
    type: message
    text: >
      Hofer: "Fink. Markus Fink. He called me into his office and said the permits
      needed to be processed 'without complications.' Said it was for the good of
      Bergfeld. Said the mayor was on board. When I raised concerns about the
      protected zone, he said 'That's what the assessment is for.' I didn't know
      the assessment was forged. Not then. But when Hannah showed me... I should
      have gone to the Landesregierung. I was a coward. I'm still a coward."
    effects:
      trust_hofer: "+10"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Would you testify?" -> hofer_testify
      - "Continue investigating" -> investigation_hub

  hofer_testify:
    type: message
    text: >
      Very long pause. "If you can guarantee my pension is protected... if you
      can get the Landespolizei involved so this doesn't stay in local hands...
      maybe. But only if others come forward too. I won't be the only one."
    effects:
      trust_hofer: "+15"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Note this - Hofer could be a key witness" -> investigation_hub

  hofer_protect:
    type: message
    text: >
      You promise discretion. Hofer seems marginally less tense. "Thank you. I'm
      not a bad man. I just... I was weak when it mattered. Please find out what
      happened to that girl. She deserved better than this town gave her."
    effects:
      trust_hofer: "+10"
    choices:
      - "Continue investigating" -> investigation_hub

  follow_rosa:
    type: message
    text: >
      You follow Rosa Thaler. She follows back and sends a voice-message-style DM
      full of warmth and directness. "So you're the new one asking questions about
      Hannah! Good. Someone should. Come up to the farm if you want, I'll tell
      you everything. These old bones don't fear Kaltenbrunner."
    effects:
      contacts_followed: "+1"
      trust_rosa: "+10"
    choices:
      - "Ask Rosa about Kaltenbrunner" -> rosa_kaltenbrunner
      - "Ask about Hannah" -> rosa_hannah
      - "Continue investigating" -> investigation_hub

  rosa_kaltenbrunner:
    type: message
    text: >
      Rosa: "Werner Kaltenbrunner. My neighbour for forty years. Used to be a decent
      man. His father built honest houses for honest people. But Werner got greedy.
      Started with the ski lift, then the hotel, now this resort madness. He tried
      to buy my land five years ago. I said no. Suddenly my water pipe 'broke.'
      Coincidence, they said. Took me six months and a lawyer to prove it was sabotage.
      That man does not accept the word no. And Hannah told him no. Loudly. Publicly."
    effects:
      trust_rosa: "+10"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask what she saw from her farm" -> rosa_witnessed
      - "Ask about Hannah" -> rosa_hannah
      - "Continue investigating" -> investigation_hub

  rosa_witnessed:
    type: message
    text: >
      Rosa: "My farm sits above the valley. I see everything. The trucks going up
      at 4 AM. The lights on the ridge at night. And the morning Hannah disappeared --
      a Friday it was -- I saw two things. First, Hannah's headlamp going up the
      trail at 5:30 AM. Alone. Then at 6:15, a black SUV driving up the construction
      access road. Fast. Werner Kaltenbrunner drives a black Range Rover. I didn't
      think about it then. Now I think about it every night."
    effects:
      trust_rosa: "+10"
      night_witnesses: "+1"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Did you tell the police?" -> rosa_police
      - "Could you identify the SUV?" -> rosa_suv
      - "Continue investigating" -> investigation_hub

  rosa_police:
    type: message
    text: >
      Rosa: "I told the Gendarmerie officer who came around asking. He wrote it
      down. Then nothing. A week later Sepp Wallner -- the retired officer, you know
      him -- Sepp told me the report was 'filed.' In Bergfeld, 'filed' means buried.
      The local police won't touch Kaltenbrunner. The Landespolizei needs to be
      involved but nobody has asked them. It's all being kept very quiet."
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "This needs to go higher - talk to Stefan" -> follow_stefan
      - "Talk to Eva Schuster the lawyer" -> follow_eva
      - "Continue investigating" -> investigation_hub

  rosa_suv:
    type: message
    text: >
      Rosa: "It was dark, barely dawn. I saw the shape -- big, boxy, like those
      expensive ones. Could have been Kaltenbrunner's Range Rover. Could have been
      someone else's. But who else drives up to an illegal construction site at
      6 AM? I can tell you one more thing -- it came back down at 7:30 AM. Fast.
      Like someone in a hurry."
    effects:
      night_witnesses: "+1"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "This is critical witness testimony" -> investigation_hub
      - "Talk to Stefan about publishing" -> share_with_stefan

  rosa_hannah:
    type: message
    text: >
      Rosa: "Hannah was a Bergfeld girl through and through. Loved these mountains
      like they were family. When she found out about the construction, she came to
      me first. Sat in my kitchen, drank my Schnaps, and cried. Not from fear --
      from anger. She said 'Tante Rosa, they're destroying our mountain and nobody
      cares.' I told her people do care but they're afraid. She said 'Then I'll be
      brave enough for all of them.' She was."
    effects:
      trust_rosa: "+10"
    choices:
      - "Ask about what Rosa witnessed" -> rosa_witnessed
      - "Continue investigating" -> investigation_hub

  kaltenbrunner_search:
    type: message
    text: >
      You look up Kaltenbrunner Bau GmbH on Bergfeld.social. The company account
      is professional and active -- project updates, community sponsorship, job
      postings. Werner Kaltenbrunner's personal account is sparse. A few posts
      about business awards and charity donations. Nothing about Adlergrat.
      Nothing about Hannah. Conspicuous silence.
    choices:
      - "DM Werner Kaltenbrunner" -> dm_werner
      - "Check the company's public records" -> kaltenbrunner_records
      - "Continue investigating" -> investigation_hub

  dm_werner:
    type: message
    text: >
      You message Werner Kaltenbrunner expressing interest in the Adlergrat project
      as a new resident. His reply is smooth. "Welcome to Bergfeld! The Adlergrat
      Wellness Resort will be a jewel of the Alps. Sustainable luxury in harmony
      with nature. Creating jobs and opportunities for the next generation. I'd be
      happy to show you the plans sometime. My office door is always open."
    effects:
      trust_werner: "+5"
    choices:
      - "Ask about Hannah" -> werner_about_hannah
      - "Ask about the protected zone" -> werner_protected_zone
      - "Continue investigating" -> investigation_hub

  werner_about_hannah:
    type: message
    text: >
      Werner: "Hannah Steiner? A passionate young woman. Misguided, perhaps, in her
      opposition to progress, but passionate. I hope she's safe wherever she is.
      I know people are talking, connecting her absence to the resort project. That's
      absurd. I'm a businessman, not a villain. I build things. I create jobs.
      If Hannah had concerns, my door was open to her too. She never came to talk
      to me. She preferred to shout on the internet."
    effects:
      trust_werner: "+5"
    choices:
      - "Ask about the threats" -> werner_threats
      - "Ask about the protected zone" -> werner_protected_zone
      - "Continue investigating" -> investigation_hub

  werner_threats:
    type: message
    text: >
      You mention the threatening anonymous account. Werner: "I don't know anything
      about that. I don't threaten people. I don't need to. My lawyers handle
      disputes. If someone threatened Ms. Steiner, I hope the police investigate.
      But don't look at me for that. I'm too busy running a company to play games
      on social media." His tone has shifted -- still polished but with an edge.
    choices:
      - "Press him about the Rathaus IP" -> werner_ip_confront
      - "Back off" -> investigation_hub

  werner_ip_confront:
    type: message
    text: >
      You tell him the threatening account was traced to the Rathaus network. Very
      long pause. "I have no connection to the Rathaus IT systems. You should ask
      the people who work there. Now I think this conversation has run its course.
      Good day." He blocks you. Interesting reaction for someone with "nothing to hide."
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Note: Werner blocked you after the IP mention" -> investigation_hub

  werner_protected_zone:
    type: message
    text: >
      Werner: "The Natura 2000 designation is complex. There are provisions for
      sustainable development that benefits the local economy while maintaining
      ecological balance. Our project meets all criteria. We have a full environmental
      impact assessment by a respected academic. I understand environmentalists are
      concerned, but progress and conservation can coexist. Our architects have
      designed the resort to blend with the landscape."
    choices:
      - "Mention Dr. Brunner" -> werner_brunner
      - "Continue investigating" -> investigation_hub

  werner_brunner:
    type: message
    text: >
      You casually mention that Dr. Brunner, who signed the assessment, passed away
      three years ago. The typing indicator appears and disappears three times.
      Finally: "Dr. Brunner's work was completed before his passing. The assessment
      is valid and on file. I suggest you verify your facts before making implications.
      I have lawyers who take defamation very seriously." He stops responding.
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Note his defensive reaction" -> investigation_hub

  kaltenbrunner_records:
    type: message
    text: >
      You search public business records. Kaltenbrunner Bau GmbH is a mid-size
      construction firm, registered in Bergfeld since 1987. Recent filings show
      a subsidiary -- Adlergrat Wellness GmbH -- registered six months ago.
      Directors: Werner Kaltenbrunner and, surprisingly, Markus Fink. The deputy
      mayor is a co-director of the company that's building in the protected zone
      he authorized permits for. This is a massive conflict of interest.
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "This links Fink and Kaltenbrunner directly" -> investigation_hub
      - "Share this with Stefan" -> share_with_stefan

  follow_eva:
    type: message
    text: >
      You find Eva Schuster on a federated Innsbruck instance. Environmental lawyer,
