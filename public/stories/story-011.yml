    effects:
      trust_christoph: "+15"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask who visits the Rathaus regularly" -> christoph_visitors
      - "Ask about the cloud backups" -> dm_christoph_cloud
      - "Continue investigating" -> investigation_hub

  christoph_visitors:
    type: message
    text: >
      Christoph: "Werner Kaltenbrunner comes in at least twice a week. Always goes
      straight to Fink's office. Sometimes they're in there for hours. The day
      the threatening account was created -- I checked the door log afterwards --
      Kaltenbrunner signed in at 11:30 AM and left at 2 PM. I was at lunch from
