  anneliese_last_sighting:
    type: message
    text: >
      Anneliese: "She came by the hut Thursday afternoon. Late, around 4 PM. She
      was checking the trail conditions for the next morning -- said she was going
      up to the ridge at dawn. She looked determined but also... nervous. She asked
      me if I'd seen any unusual vehicles on the access road. I told her a black
      SUV had been going up and down all week. She nodded like she expected that.
      Then she said something strange: 'Anneliese, if I don't come back by Saturday,
      call Franz Gruber.' I laughed and said 'Don't be dramatic.' I wish I hadn't
      laughed."
    effects:
      trust_anneliese: "+15"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
