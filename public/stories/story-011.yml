      told Kaltenbrunner, didn't he? I put her in danger. I was trying to protect
      her and I put her in danger."
    effects:
      partner_evidence: "+1"
      construction_evidence: "+1"
      evidence_total: "+2"
    choices:
      - "Tobias was the leak - but did he know?" -> tobias_aftermath
      - "Continue investigating" -> investigation_hub

  tobias_aftermath:
