meta:
  title: "Dead Account"
  subtitle: "Story 011 - Bergfeld"
  locale: AT
  state:
    trust_franz: 0
    trust_katharina: 0
    trust_stefan: 0
    trust_hofer: 0
    trust_lukas: 0
    trust_lena: 0
    trust_moritz: 0
    trust_brigitte: 0
    trust_werner: 0
    trust_anneliese: 0
    trust_tobias: 0
    trust_markus: 0
    trust_rosa: 0
    trust_sepp: 0
    trust_ingrid: 0
    trust_eva: 0
    trust_christoph: 0
    contacts_followed: 0
    night_witnesses: 0
    construction_evidence: 0
    partner_evidence: 0
    evidence_total: 0
  player:
    name: New Resident
    bio: "Recently moved to Bergfeld. Interested in mountain culture and local community."
    avatar: avatars/default_citizen.png
  bot:
    display_name: "Bergfeld.social"
    description: "Welcome to Bergfeld.social - the Alpine community instance for Bergfeld, Tyrol. Respect the mountains, respect each other."
    avatar_url: /gamepatch/assets/dead-account/bot.png
  npcs:
    franz:
      name: "Franz Gruber"
      bio: "Mountain rescue volunteer. 20 years in Bergfeld. Hannah's hiking partner. Knows every trail in the Zillertal."
      avatar: avatars/franz.jpg
    katharina:
      name: "Katharina Moser"
      bio: "Owner of Cafe Edelweiss. Community gossip hub. Been here since forever."
      avatar: avatars/katharina.jpg
    stefan:
      name: "Stefan Brandner"
      bio: "Local journalist at Bergfelder Kurier. Covers municipal politics and environment."
      avatar: avatars/stefan.jpg
    hofer:
      name: "Herr Johann Hofer"
      bio: "Municipal building inspector. 30 years of service. Chair of the Alpine preservation committee."
      avatar: avatars/hofer.jpg
    lukas:
      name: "Lukas Eder"
      bio: "16. Skateboarder. Hangs out at the Bahnhof. Knows things people think he doesn't."
      avatar: avatars/lukas.jpg
    lena:
      name: "Lena Wimmer"
      bio: "17. Photography student. Was learning nature photography from Hannah. Runs @bergfeld_shots."
      avatar: avatars/lena.jpg
    moritz:
      name: "Moritz Pichler"
      bio: "15. Gamer and tech kid. Built the school website. Noticed something weird about Hannah's account."
      avatar: avatars/moritz.jpg
    brigitte:
      name: "Brigitte Steiner"
      bio: "Hannah's mother. Retired schoolteacher. Worried sick but trying to stay strong."
      avatar: avatars/brigitte.jpg
    werner:
      name: "Werner Kaltenbrunner"
      bio: "Construction company owner. Kaltenbrunner Bau GmbH. Big donor to the Bergfeld tourism board."
      avatar: avatars/werner.jpg
    anneliese:
      name: "Anneliese Huber"
      bio: "Runs the Bergfeld Alpenverein hut. Saw Hannah the day before she disappeared."
      avatar: avatars/anneliese.jpg
    tobias:
      name: "Tobias Reiter"
      bio: "Hannah's ex-boyfriend and current hiking partner. Trail runner. Works at the outdoor shop."
      avatar: avatars/tobias.jpg
    markus:
      name: "Markus Fink"
      bio: "Deputy mayor. Ambitious. Wants to modernize Bergfeld with new resort development."
      avatar: avatars/markus.jpg
    rosa:
      name: "Rosa Thaler"
      bio: "Elderly farmer on the Sonnberg slope. Her land borders the protected zone."
      avatar: avatars/rosa.jpg
    sepp:
      name: "Sepp Wallner"
      bio: "Retired Gendarmerie officer. Knows everyone's secrets. Drinks at Cafe Edelweiss every afternoon."
      avatar: avatars/sepp.jpg
    ingrid:
      name: "Ingrid Mayr"
      bio: "Pharmacist. Bergfeld health committee. Noticed Hannah hadn't picked up her prescription."
      avatar: avatars/ingrid.jpg
    eva:
      name: "Eva Schuster"
      bio: "Environmental lawyer in Innsbruck. Hannah had been emailing her about the construction case."
      avatar: avatars/eva.jpg
    christoph:
      name: "Christoph Wenger"
      bio: "IT admin for the Bergfeld municipal servers. Quiet. Keeps to himself."
      avatar: avatars/christoph.jpg

entry: welcome

nodes:
  welcome:
    type: message
    text: >
      Welcome to Bergfeld.social, the community instance for our small Alpine town in Tyrol.
      You've just moved here, and the mountains are beautiful -- but something is wrong.
      Hannah Steiner, a beloved mountain guide and environmental blogger, hasn't posted in
      12 days. Her last post was about construction activity near the Adlergrat ridge
      in a protected Alpine zone. Her account shows no activity since. Some people say
      she just went on a long hike. Others whisper that she found something she shouldn't have.
      Your feed is filling up with worried messages. Maybe you should look into it.
    choices:
      - "Browse the local timeline" -> local_timeline
      - "Check Hannah's last post" -> hannah_last_post

  local_timeline:
    type: message
    text: >
      You scroll through the Bergfeld.social local timeline. The usual mix of mountain
      photos, event announcements, and cafe menus. But between the normal posts, you
      notice a pattern -- people asking about Hannah. Where is she? Has anyone heard
      from her? A few accounts seem particularly active in discussing her absence.
    choices:
      - "Read Katharina's post about Hannah" -> katharina_worried_post
      - "Check the teens' conversation" -> teen_thread_intro
      - "Look at Hannah's last post" -> hannah_last_post

  hannah_last_post:
    type: tweet
    from: hannah_steiner
    text: >
      Walked up to Adlergrat today. What I found there is unbelievable. Heavy machinery
      tracks in the PROTECTED ZONE. Fresh concrete foundations where there should be
      nothing but grass and marmots. I have photos. I have GPS coordinates. Someone
      is building illegally in our mountains and I will not stay silent about this.
      Thread coming tomorrow with all the evidence. #BergfeldNatur #Adlergrat
    choices:
      - "Look at the responses to this post" -> hannah_post_responses
      - "Check who follows Hannah" -> hannah_followers
      - "Search for the hashtag #Adlergrat" -> adlergrat_search

  hannah_post_responses:
    type: message
    text: >
      The post got 47 boosts and 89 replies. Most are supportive locals, but a few
      stand out. Franz Gruber replied: "Hannah, bitte sei vorsichtig. Call me before
      you go up there again." Stefan Brandner from the Kurier wrote: "Can we talk?
      This could be the story of the year." And one reply from a now-deleted account
      simply said: "Mind your own business if you know what's good for you."
    choices:
      - "Follow Franz Gruber" -> follow_franz
      - "Follow Stefan Brandner" -> follow_stefan
      - "Try to find the deleted account" -> deleted_account_search

  hannah_followers:
    type: message
    text: >
      Hannah had 312 followers on Bergfeld.social. Mostly locals, some hikers from
      other instances. You notice Franz Gruber, Lena Wimmer, Stefan Brandner, and
      Tobias Reiter all follow her. Interestingly, Herr Hofer from the building
      inspection office does NOT follow her, but he liked several of her older posts
      about mountain conservation.
    choices:
      - "Follow Franz Gruber" -> follow_franz
      - "Follow Lena Wimmer" -> follow_lena
      - "Follow Tobias Reiter" -> follow_tobias

  adlergrat_search:
    type: message
    text: >
      The #Adlergrat hashtag brings up Hannah's environmental posts going back months.
      She documented wildflower blooms, trail erosion, and ibex sightings. But in the
      last three weeks before she vanished, the tone shifted. More posts about vehicle
      tracks, noise complaints from hikers, and a mysterious access road being graded.
      One post from two weeks before her disappearance mentions "Kaltenbrunner trucks
      on the forest road at 5 AM."
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Search for Kaltenbrunner" -> kaltenbrunner_search
      - "Read Hannah's environmental thread" -> hannah_env_thread
      - "Go back to the timeline" -> local_timeline

  katharina_worried_post:
    type: tweet
    from: katharina
    text: >
      Has anyone seen Hannah? She hasn't been to the cafe in almost two weeks. This
      isn't like her -- she always comes in for her Melange on Tuesdays. I spoke to
      Brigitte and she's beside herself. If anyone knows anything, please speak up.
      This town looks after its own. #WhereIsHannah
    choices:
      - "Follow Katharina and reply" -> follow_katharina
      - "Check what Brigitte posted" -> brigitte_post
      - "Read the replies" -> katharina_post_replies

  katharina_post_replies:
    type: message
    text: >
      The replies are a mix of concern and deflection. Sepp Wallner wrote: "She probably
      just went on one of her solo treks. She'll turn up." Franz Gruber: "This isn't
      normal. I've called her 30 times." Tobias Reiter: "She told me she needed space.
      I'm respecting that." Markus Fink, the deputy mayor: "Let's not start rumours.
      I'm sure there's a simple explanation."
    choices:
      - "Follow Franz Gruber" -> follow_franz
      - "Follow Tobias Reiter" -> follow_tobias
      - "Follow Markus Fink" -> follow_markus

  follow_franz:
    type: message
    text: >
      You follow Franz Gruber. He follows you back almost immediately. His feed is
      full of mountain rescue updates, weather warnings, and photos of the Zillertal
      peaks. But his recent posts are all about Hannah. He seems genuinely distraught.
    effects:
      contacts_followed: "+1"
    choices:
      - "Send Franz a DM" -> dm_franz_intro
      - "Read Franz's recent posts" -> franz_posts
      - "Continue browsing" -> local_timeline

  dm_franz_intro:
    type: message
    text: >
      You send Franz a direct message introducing yourself as a new resident who
      noticed the posts about Hannah. He replies within minutes.
    choices:
      - "Ask about Hannah's disappearance" -> franz_about_hannah
      - "Ask about the Adlergrat construction" -> franz_about_construction

  franz_about_hannah:
    type: message
    text: >
      Franz: "I've known Hannah for fifteen years. We've hiked together hundreds of
      times. She would NEVER just disappear without telling anyone. Something happened
      to her up on that ridge, I'm sure of it. I wanted to go look for her but the
      Gendarmerie told me to stay out of it. They say she's an adult who can do what
      she wants. But her phone is off. Her car is still at her flat. Her rucksack
      and boots are gone. That tells me she went up the mountain and didn't come back."
    effects:
      trust_franz: "+10"
      partner_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about Tobias" -> franz_about_tobias
      - "Ask about the construction" -> franz_about_construction
      - "Ask about the deleted account threat" -> franz_about_threat

  franz_about_tobias:
    type: message
    text: >
      Franz pauses before typing. "Tobias. Ja. Look, he and Hannah dated for two
      years. She broke it off last spring. He didn't take it well. He kept showing
      up on her hikes, saying they were 'just friends hiking together.' But I saw
      how he looked at her. Possessive. She told me once she felt like she couldn't
      go anywhere without him appearing. And that last week before she vanished --
      they had a massive argument at the trailhead. Anneliese at the Alpenverein hut
      heard shouting."
    effects:
      trust_franz: "+10"
      partner_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about the construction" -> franz_about_construction
      - "Talk to Anneliese about the argument" -> follow_anneliese
      - "Talk to Tobias directly" -> follow_tobias

  franz_about_construction:
    type: message
    text: >
      Franz: "The construction on Adlergrat? That's Kaltenbrunner. Werner Kaltenbrunner.
      Everyone knows it but nobody says anything because he employs half the valley.
      Hannah had real evidence -- drone photos, dates, GPS data. She was building a
      case. She told me she'd contacted a lawyer in Innsbruck. But she also told me
      someone warned her to stop. Anonymous message. She laughed it off. Hannah was
      never afraid of anything. Maybe she should have been."
    effects:
      trust_franz: "+5"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about Werner Kaltenbrunner" -> franz_about_werner
      - "Ask about the anonymous threat" -> franz_about_threat
      - "Talk to the Innsbruck lawyer" -> follow_eva

  franz_about_werner:
    type: message
    text: >
      Franz: "Werner Kaltenbrunner has been building in this valley for 30 years.
      Started with barns and chalets, now he wants a luxury wellness resort up on
      the Adlergrat. Problem is, it's in the Natura 2000 protected zone. He needs
      permits that should be impossible to get. But somehow, the deputy mayor Markus
      Fink keeps finding 'exceptions' and 'special provisions.' Hannah found the
      paperwork. Fake environmental impact assessments. Forged signatures. The whole
      thing stinks."
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Investigate Werner Kaltenbrunner" -> kaltenbrunner_search
      - "Look into Markus Fink" -> follow_markus
      - "Ask about the forged documents" -> franz_forged_docs

  franz_about_threat:
    type: message
    text: >
      Franz: "About a week before she disappeared, Hannah got a DM from an account
      that was created that same day. No avatar, no bio, username was just random
      numbers. It said something like 'The mountains can be dangerous for people who
      don't watch their step.' She screenshotted it and showed me. I told her to
      go to the Polizei. She said she would, but I don't know if she did. The account
      was deleted by the next day. Moritz -- that kid who does the IT stuff -- he
      might be able to trace it."
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Talk to Moritz about the account" -> follow_moritz
      - "Check if Hannah filed a police report" -> police_report_check
      - "Go back to the timeline" -> local_timeline

  franz_forged_docs:
    type: message
    text: >
      Franz: "Hannah showed me copies. The environmental impact assessment for the
      Adlergrat site was signed by a Dr. Reinhold Brunner from the University of
      Innsbruck. Only problem? I looked him up. He's been dead for three years.
      Someone forged a dead professor's name on an official document. That's not
      just corruption -- that's criminal fraud. Hannah had the originals scanned
      and backed up somewhere safe, she said. But she wouldn't tell me where."
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Search for Dr. Brunner" -> brunner_search
      - "Ask about Hannah's backups" -> franz_backups
      - "Talk to Herr Hofer about the permits" -> follow_hofer

  franz_backups:
    type: message
    text: >
      Franz: "She was careful. Said she had copies in three places -- her laptop,
      a USB stick she kept at her mother's house, and somewhere online. She mentioned
      something about a 'cloud' but I'm not a tech person. Maybe Moritz or Christoph
      would know more about that. The laptop was in her flat. I don't know if it's
      still there."
    choices:
      - "Talk to Moritz about the cloud backup" -> follow_moritz
      - "Talk to Brigitte about the USB stick" -> brigitte_usb
      - "Talk to Christoph about online backups" -> follow_christoph

  franz_posts:
    type: tweet
    from: franz
    text: >
      Day 12 without word from Hannah. I've walked the Adlergrat trail three times
      this week. Found nothing. Mountain rescue says there's no official search
      because she's not officially missing -- "adults can choose to be unreachable."
      I don't accept this. Something is wrong. If you've seen Hannah Steiner anywhere
      in the Zillertal valley, please contact me or the Gendarmerie. Please.
    effects:
      trust_franz: "+5"
    choices:
      - "Send Franz a DM" -> dm_franz_intro
      - "Read responses to this post" -> franz_post_responses
      - "Continue investigating" -> local_timeline

  franz_post_responses:
    type: message
    text: >
      Most replies express sympathy. But Tobias Reiter's reply is defensive: "Franz,
      stop making this into a conspiracy. She told me she was going away for a while.
      You're scaring her mother." And Werner Kaltenbrunner's official company account
      posted: "Our thoughts are with the Steiner family. Kaltenbrunner Bau is offering
      a reward for information." Several people found that last one suspicious.
    choices:
      - "Follow Tobias Reiter" -> follow_tobias
      - "Look at the Kaltenbrunner company account" -> kaltenbrunner_search
      - "Talk to Brigitte" -> brigitte_post

  teen_thread_intro:
    type: message
    text: >
      You find a semi-private thread between three teens on the local timeline.
      They're using a mix of German and local slang, but you can follow most of it.
      They seem to know something.
    choices:
      - "Read the thread" -> teen_thread

  teen_thread:
    type: tweet
    from: lukas
    text: >
      oida heast habt ihr des gsehn? der kaltenbrunner lastwagen is scho wieder
      um 4 in da fruah durchgfahrn. i war no wach wegen zocken lol. des is jetzt
      schon des dritte mal diese woche @lena_w @moritz_p
    choices:
      - "Read Lena's reply" -> teen_thread_lena
      - "Read Moritz's reply" -> teen_thread_moritz

  teen_thread_lena:
    type: tweet
    from: lena
    text: >
      @lukas ja fix. i hab fotos von der baustelle oben gmacht letzte woche.
      ur creepy oida. da steht jetzt so a riesiger betonmischer und kein mensch
      weit und breit. und wissts was? i hab an tobias dort oben gsehn. allein.
      hat voi komisch gschaut als er mi gsehn hat. hat gsagt i soll da net
      umadum rennen weils gfährlich is. seit wann is wandern gfährlich??
    effects:
      partner_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Read Moritz's reply" -> teen_thread_moritz
      - "Follow Lena and ask about the photos" -> follow_lena

  teen_thread_moritz:
    type: tweet
    from: moritz
    text: >
      @lukas @lena_w oida passts auf. i hab mir den account angschaut der die
      hannah bedroht hat. also den der glöscht worden is. i hab no an screenshot
      vom server cache ghabt. die IP war vom rathaus-netzwerk. oida. VOM RATHAUS.
      des is heast net normal. sog des niemandem weiter bitte
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Follow Moritz and ask about the IP" -> follow_moritz
      - "Follow Lena and ask about the photos" -> follow_lena
      - "Investigate the Rathaus connection" -> rathaus_connection

  follow_lena:
    type: message
    text: >
      You follow Lena Wimmer. She's cautious but follows you back after checking
      your profile. Her feed is beautiful nature photography mixed with typical teen
      posts about school and friends. But recently, her photos have shifted -- she's
      been documenting the Adlergrat area, almost continuing Hannah's work.
    effects:
      contacts_followed: "+1"
    choices:
      - "DM Lena about her photos" -> dm_lena_photos
      - "DM Lena about seeing Tobias" -> dm_lena_tobias
      - "Look at Lena's photo gallery" -> lena_photos

  dm_lena_photos:
    type: message
    text: >
      Lena: "ja hallo. du bist der/die neue im ort oder? ok also. hannah hat mir
      fotografie beigebracht. landschaftsfotografie. sie war ur lieb und hat sich
      immer zeit gnommen. und jetzt is sie weg und alle tun so als wärs normal??
      i hab ihre arbeit weitergmacht. bin rauf zum adlergrat. da oben is jetzt
      a riesige baustelle. betonmischer, bagger, alles. mitten im naturschutzgebiet.
      i hab alles fotografiert. willst die fotos sehn?"
    effects:
      trust_lena: "+10"
    choices:
      - "Yes, show me the photos" -> lena_construction_photos
      - "Ask about Tobias on the ridge" -> dm_lena_tobias
      - "Ask if Hannah seemed scared before disappearing" -> lena_hannah_scared

  lena_construction_photos:
    type: message
    text: >
      Lena sends you a folder of photos. They're damning -- heavy machinery on
      pristine Alpine meadow, concrete foundations laid in what is clearly protected
      grassland, and most critically, close-up shots of the construction company
      logos: Kaltenbrunner Bau GmbH. Timestamps show activity at dawn, 4-6 AM,
      when nobody would normally be on the trail. One photo shows a figure in
      a high-vis vest that looks like it could be Herr Hofer, the building inspector.
    effects:
      trust_lena: "+10"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about the figure in the high-vis vest" -> lena_hofer_photo
      - "Ask about Tobias" -> dm_lena_tobias
      - "Share this with Stefan at the Kurier" -> share_with_stefan

  lena_hofer_photo:
    type: message
    text: >
      Lena: "ja des hab i a gsehn. schaut aus wie der hofer. der bauinspektor.
      was macht der um 5 in da fruah auf aner illegalen baustelle? der soll doch
      genau sowas VERHINDERN. i trau mi net des laut zu sagn weil mei mama
      arbeitet bei der gemeinde und i will ihr net schaden. aber des is net richtig."
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Ask about Tobias on the ridge" -> dm_lena_tobias
      - "Promise to keep her identity safe" -> lena_promise_safety
      - "Investigate Herr Hofer" -> follow_hofer

  lena_promise_safety:
    type: message
    text: >
      You assure Lena you won't reveal her as a source. She seems relieved.
      "danke. i mach mir echt sorgen. hannah hat a gmeint sie passt auf und
      schau was passiert is. bitte pass du a auf. die leut hier im ort die
      geld haben die san net zum spaßen."
    effects:
      trust_lena: "+15"
    choices:
      - "Ask about Tobias" -> dm_lena_tobias
      - "Continue investigating" -> investigation_hub

  dm_lena_tobias:
    type: message
    text: >
      Lena: "der tobias? oida der is so creepy. also er und hannah warn zam aber
      sie hat schluss gmacht. und er is trotzdem immer aufkreuzt. bei jeder
      wanderung, bei jedem stammtisch. sie hat zu mir gsagt 'der lena i werd
      den net los.' und letzte woche bevor sie verschwunden is hab i die zwei
      am parkplatz beim wanderweg gsehn. er hat sie am arm packt und sie hat
      gschrien 'lass mi los!' i wollt was sagn aber dann is er abghaut.
      des war am donnerstag. freitag war sie dann weg."
    effects:
      trust_lena: "+10"
      partner_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Follow Tobias" -> follow_tobias
      - "Tell Franz about this" -> tell_franz_tobias_incident
      - "Continue investigating" -> investigation_hub

  lena_hannah_scared:
    type: message
    text: >
      Lena: "ja. die letzte woche war sie anders. net angstlich genau, aber...
      vorsichtig. sie hat gsagt i soll aufhören zum adlergrat raufzugehen.
      hat gsagt es is gfährlich und sie meint net die berge. sie hat ihre
      ganzen fotos auf an usb stick kopiert und mir an zweiten gebn. hat
      gsagt 'wenn mir was passiert schick des an den stefan vom kurier.'
      i hab den stick no. soll i dir zeigen was drauf is?"
    effects:
      trust_lena: "+15"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "Yes, tell me what's on the USB stick" -> lena_usb_contents
      - "Keep it safe, we might need it as evidence" -> lena_keep_usb
      - "Send it to Stefan now" -> share_with_stefan

  lena_usb_contents:
    type: message
    text: >
      Lena describes the contents: drone footage of the construction site on three
      different dates, scanned copies of building permit applications with forged
      signatures, screenshots of bank transfers between Kaltenbrunner Bau and an
      account belonging to Markus Fink, and a scanned letter from Eva Schuster,
      the Innsbruck environmental lawyer, confirming the construction violates
      EU Natura 2000 regulations. This is a comprehensive evidence package.
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "This is critical evidence - investigate Markus Fink" -> follow_markus
      - "Contact the environmental lawyer Eva" -> follow_eva
      - "Share with Stefan at the Kurier" -> share_with_stefan

  lena_keep_usb:
    type: message
    text: >
      You tell Lena to keep the USB stick in a safe place and not tell anyone else
      about it. She agrees. "i habs in meinem schulspind. niemand schaut da rein.
      aber bitte find die hannah. sie is die einzige erwachsene die mich je
      ernst gnommen hat."
    effects:
      trust_lena: "+10"
    choices:
      - "Continue investigating" -> investigation_hub
      - "Follow Tobias" -> follow_tobias
      - "Investigate the construction permits" -> follow_hofer

  lena_photos:
    type: message
    text: >
      Lena's public photo gallery shows beautiful Alpine landscapes, sunsets over
      the Zillertal, close-ups of edelweiss and gentian. But the most recent uploads
      are different -- shot at dawn, showing construction equipment silhouetted
      against the morning sky. Concrete mixers. Excavators. Steel rebar poking out
      of the mountain meadow like bones. These photos tell a story of environmental
      destruction that Hannah started documenting.
    choices:
      - "DM Lena about her photos" -> dm_lena_photos
      - "Continue investigating" -> investigation_hub

  follow_moritz:
    type: message
    text: >
      You follow Moritz Pichler. He follows back immediately. His feed is a mix of
      gaming clips, tech memes, and surprisingly sharp observations about local
      politics for a fifteen-year-old.
    effects:
