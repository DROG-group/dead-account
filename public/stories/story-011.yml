      His publication list includes dozens of environmental impact assessments for
      Alpine regions. His name on the Adlergrat assessment would have seemed credible --
      if he weren't dead. Whoever forged it knew his work well enough to make it
      convincing.
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - "This confirms the forgery" -> investigation_hub
      - "Share this with Eva Schuster" -> follow_eva

  rathaus_connection:
    type: message
    text: >
      The Rathaus connection is explosive. The threatening account came from the
