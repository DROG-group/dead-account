entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN WIED IL-GĦASEL
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to wiedghasel.social — the community Mastodon instance for
      the village of Wied il-Għasel, Gozo.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name everywhere:
      @aaron_camilleri.

      A young beekeeper. Twenty-two years old. He kept hives on the
      limestone cliffs above the valley. Documented the bees, the honey,
      the wildflowers. People loved him. He hasn't posted in six days.
    choices:
      - Look at his profile -> aaron_profile

  aaron_profile:
    type: tweet
    from: aaron
    text: "The hives above tal-Mixta are dying. Not disease — poison. Someone is spraying the garrigue. I have samples and I'm going public."
    choices:
      - That's his last real post... -> grey_hive

  grey_hive:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurred photo of an empty beehive. No caption. Posted at 4am.

      His friends say that's not how Aaron posts. He always wrote long
      captions about the bees, the seasons, the land. The police say
      he probably went to the mainland. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: ispettur
    text: >
      Irċevejna rapport dwar resident ta' Wied il-Għasel. S'issa
      m'hemm l-ebda evidenza ta' att kriminali. Kull informazzjoni
      tista tintbagħat lill-pulizija fuq 112.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @christiana_vella hasn't
      slept in days. His brother @nathan_camilleri is threatening to
      search every abandoned farmhouse on the island. His best friend
      @jade_borg keeps posting old photos of them together.

      The farmer @stefan_calleja says Aaron was right about the poison.
      The journalist @daphne_spiteri hasn't published a word.

      And in the background, the Seabreeze Hospitality Group just got
      planning permission for a 300-room resort on agricultural land.
      Aaron's land.

      Nobody buys the police line. Nobody thinks Aaron just left.
    effects: { trust_christiana: "+5", trust_nathan: "+5" }
    choices:
      - Start following Aaron's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Wied il-Għasel. Follow Aaron's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Miriam (bar owner, knows everyone) -> miriam_intro
      - Talk to Stefan (farmer, knows the land) -> stefan_intro
      - Talk to Kevin (teen skater, seems shaken) -> kevin_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Aaron with the rhythms of a small
      Gozitan village: festa preparations, pastizzi reviews, ferry
      delays, weather warnings.

      Key names surface: Christiana (girlfriend, pharmacy student),
      Nathan (brother, fisherman, furious), Jade (best friend, posting
      through grief), and the teens — Kevin, Katrina, Marlene — who
      Aaron taught about beekeeping.

      Also prominent: Seabreeze Hospitality Group, the hotel chain
      with a massive development planned on the valley's edge. Their
      posts are all CGI renders of infinity pools. Aaron's posts were
      dead bees and poisoned soil.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Miriam -> miriam_intro
      - Talk to Stefan -> stefan_intro
      - Talk to Kevin -> kevin_intro

  # --- Miriam (social map) ---

  miriam_intro:
    type: tweet
    from: miriam
    text: >
      Il-bar miftuħ imma l-qalb mhux fiha. @aaron_camilleri, il-kafè
      tiegħek qed jistenniek. Ejja lura.
    effects: { trust_miriam: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Miriam -> miriam_talk

  miriam_talk:
    type: message
    text: >
      MIRIAM: Aw, you're new? Mela welcome. Bad time to arrive, ħabib.
      Everyone is going mad about Aaron.

      Let me tell you who is who. Christiana is Aaron's girlfriend —
      she studies pharmacy in Valletta, takes the ferry every day.
      Sweet girl, can't stop crying. Nathan is Aaron's older brother,
      fisherman, strong man but he's losing it. Jade has been Aaron's
      best friend since they were five. She designed all the labels
      for his honey jars.

      And then there's Luca Buttigieg. Another beekeeper. Mela, he
      hated Aaron. Jealous of everything — the prizes, the social
      media following, the organic certification. Aaron's honey won
      best in Gozo two years running. Luca couldn't handle it.

      Oh, and Seabreeze Hotels? Madonna. Don't get me started. They
      want to build a monster on the valley. Aaron was the loudest
      voice against it. Now he's gone. You do the maths.
    effects: { trust_miriam: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Luca -> miriam_luca
      - Ask about Seabreeze -> miriam_seabreeze
      - Thank her and move on -> quest1_hub

  miriam_luca:
    type: message
    text: >
      MIRIAM: Luca? Ostja, that man. He's been keeping bees for
      fifteen years but Aaron comes along at twenty and suddenly
      everyone wants Aaron's honey. Luca's business dropped. He
      started bad-mouthing Aaron everywhere — saying his organic
      certification was fake, saying he was stealing hive locations.

      Last month at the festa, Luca got drunk and told Aaron to his
      face: "I'll destroy your hives before I let you destroy my
      business." Everyone heard it. Aaron just walked away. That's
      the kind of person Aaron is. Was. Is. Madonna, I don't even
      know what tense to use anymore.
    effects: { trust_miriam: "+5" }
    choices:
      - Ask about Seabreeze -> miriam_seabreeze
      - Move on -> quest1_hub

  miriam_seabreeze:
    type: message
    text: >
      MIRIAM: The hotel chain. Three hundred rooms on agricultural
      land. Mela, it's not even controversial — it's criminal. That
      land has been farmed for centuries. Aaron's grandfather kept
      hives there. Stefan's family grows grapes there.

      But someone on the council approved it. The sindku, Pawlu Grech,
      suddenly has a new car. A BMW. On a sindku salary? Aw, come on.

      Aaron had evidence. He found documents — internal Seabreeze
      emails — showing payments to someone in local government. He
      was going to give them to Daphne Spiteri, the journalist. Two
      weeks later, gone.
    effects: { trust_miriam: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Stefan (the land, witness tease) ---

  stefan_intro:
    type: tweet
    from: stefan
    text: >
      twenty years I farmed this valley. now they want to pour concrete
      on it. @aaron_camilleri was right about everything. and now he
      is not here.
    effects: { trust_stefan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Stefan -> stefan_talk

  stefan_talk:
    type: message
    text: >
      STEFAN: Mela, I've been farming the Wied il-Għasel valley my
      whole life. Ġbejniet, wine, capers. The soil here is special —
      the limestone filters the water, the garrigue gives the bees
      their flowers. Aaron understood this. He was the only young
      person who cared about the land.

      Then the poison started. Someone was spraying herbicide on the
      garrigue above his hives. Killing the wildflowers the bees
      need. Aaron took soil samples. He found industrial-grade
      herbicide — not the stuff farmers use. Professional.

      He said someone was deliberately killing his bees to force him
      off the land. And mela, guess who just bought the development
      rights to the plots next to his?
    effects: { trust_stefan: "+10" }
    choices:
      - Who bought the rights? -> stefan_rights
      - Move on -> quest1_hub

  stefan_rights:
    type: message
    text: >
      STEFAN: A shell company called Sunset Valley Holdings. I looked
      it up — the registered agent is the same law firm that represents
      Seabreeze Hotels. Mifsud & Partners, Valletta.

      Aaron found out. He told me the night before he disappeared. He
      said "they're killing my bees to clear the land." He was going
      to the press.

      Ostja, and that night — I was coming back from the fields late,
      around midnight. I saw headlights on the dirt road above the
      hives. Two cars. Nobody drives up there at night. Nobody.
    effects: { trust_stefan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kevin (teen skater, witness tease) ---

  kevin_intro:
    type: tweet
    from: kevin
    text: >
      mela x'sar bro?? @aaron_camilleri literally taught us everything
      about the valley and bees and shit and now he's just gone??
      f'ommok this isn't right someone knows something SAY IT
    effects: { trust_kevin: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kevin -> kevin_talk_early

  kevin_talk_early:
    type: message
    text: >
      KEVIN: aw you're new here? mela shit timing bro. aaron is like
      the best person in this village no cap. he used to let us hang
      at the hives and he'd show us the bees and explain everything.
      katrina took photos of the whole thing, marlene drew the bees.
      he was teaching us about the land and shit.

      and now he's gone and everyone's pretending it's fine and it's
      NOT fine. mela katrina saw something weird the night before he
      disappeared but she's scared to talk about it. she says luca
      buttigieg was up near the hives at like 10pm with a backpack
      sprayer. who the fuck sprays at 10pm bro??
    effects: { trust_kevin: "+10" }
    choices:
      - What did Katrina see exactly? -> kevin_katrina_hint
      - Move on -> quest1_hub

  kevin_katrina_hint:
    type: message
    text: >
      KEVIN: she was doing sunset photos up on the ridge — she goes
      there every evening. she saw luca walking up from the valley
      with one of those pump sprayer things on his back. it was dark
      already, like 10pm. he was spraying the garrigue around aaron's
      hive sites.

      she took photos but she's scared because luca is friends with
      her dad and mela... you know how it is in a small village. but
      fuck that honestly. someone needs to see those photos.

      talk to katrina but be chill about it yeah? she gets nervous
      around new people
    effects: { trust_kevin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Wied il-Għasel. A Gozitan village
      built around the valley and the bees. A young beekeeper who was
      fighting a hotel development and exposing bee poisoning. A
      disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Christiana (Aaron's girlfriend) -> christiana_q1
      - Talk to Jade (Aaron's best friend) -> jade_q1
      - Check what Nathan (Aaron's brother) is saying -> nathan_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Christiana Q1 ---

  christiana_q1:
    type: tweet
    from: christiana
    text: >
      please if anyone has seen @aaron_camilleri contact me. his room
      is the same. his beekeeping suit is still here. his smoker is
      on the table. he would NEVER leave his bees. never ever ever.
    effects: { trust_christiana: "+5", contacts_followed: "+1" }
    choices:
      - DM Christiana -> christiana_q1_talk

  christiana_q1_talk:
    type: message
    text: >
      CHRISTIANA: I appreciate you reaching out but I don't know you.
      Aaron has a lot of people who care about him. I'm sure he'll
      come back.

      ...mela I keep saying that. I don't believe it anymore.

      [Christiana is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_christiana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jade Q1 ---

  jade_q1:
    type: tweet
    from: jade
    text: >
      designed this label 3 months ago for aaron's new wildflower
      honey. "Għasel tal-Wied" — Valley Honey. he was so proud. the
      first batch was supposed to be ready this week. he should be
      here for it.
    effects: { trust_jade: "+5", contacts_followed: "+1" }
    choices:
      - DM Jade -> jade_q1_talk

  jade_q1_talk:
    type: message
    text: >
      JADE: Mela, Aaron and I go back to reception class. He's my
      best friend. He's the most genuine person I know. Everything
      he does with the bees — it's not business, it's love. Real
      love for the land, for Gozo, for what we're losing.

      And that's why people wanted him gone. He was inconvenient.
      He was standing in the way of a lot of money. The hotel people,
      the sindku, Luca... everyone had a reason to want Aaron to
      shut up.

      But Aaron doesn't shut up. That's why I love him.

      [Jade seems open. She might know more.]
    effects: { trust_jade: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nathan Q1 ---

  nathan_q1:
    type: tweet
    from: nathan
    text: >
      MY BROTHER HAS BEEN MISSING FOR SIX DAYS AND THE POLICE TELL
      ME HE'S "PROBABLY IN MALTA"??? HE DOESN'T GO TO MALTA WITHOUT
      TELLING ME. ostja I'M GOING TO FIND HIM MYSELF IF NOBODY HELPS
    effects: { trust_nathan: "+5", contacts_followed: "+1" }
    choices:
      - DM Nathan -> nathan_q1_talk

  nathan_q1_talk:
    type: message
    text: >
      NATHAN: Who are you? Another person who's going to tell me to
      stay calm? Mela, my brother called me the night before he
      disappeared. He said he had proof — actual documents — that
      Seabreeze was bribing the sindku to approve the hotel on
      agricultural land. He said "if anything happens to me, it's
      the hotel people."

      That's the last thing he said to me.
    effects: { trust_nathan: "+10" }
    choices:
      - What do you think happened? -> nathan_theory
      - Move on -> quest1_hub

  nathan_theory:
    type: message
    text: >
      NATHAN: I think the hotel people got to him. They have money,
      lawyers, connections. They could make anyone disappear.

      But I also think that bastard Luca knows something. Mela,
      everyone saw him threaten Aaron at the festa. "I'll destroy
      your hives." And someone HAS been destroying his hives — the
      poison, the dead bees. Luca has the knowledge and the motive.

      Aaron told me weeks ago that someone was following him. He
      found footprints around his hives at night. He found his
      equipment moved. He thought it was Luca but couldn't prove it.
    effects: { trust_nathan: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Aaron went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Katrina (was taking sunset photos near the hives) -> katrina_interview
      - Find Beppe (diver, was out on the water that night) -> beppe_interview
      - Find Stefan (farmer, saw headlights on the dirt road) -> stefan_interview
      - Find Rita (teacher, heard shouting near the valley) -> rita_interview

  # --- Katrina (saw Luca spraying at night) ---

  katrina_interview:
    type: tweet
    from: katrina
    text: >
      can't sleep. keep looking at the photos I took that evening.
      the sunset was so beautiful and then everything went wrong.
    effects: { trust_katrina: "+5" }
    choices:
      - Ask Katrina about that evening -> katrina_talk

  katrina_talk:
    type: message
    text: >
      KATRINA: mela ok but you can't tell my dad please. I was up on
      the ridge above the valley doing sunset photos around 9pm. the
      light was fading but I saw someone on the path below — luca
      buttigieg. he had a backpack sprayer and he was going along the
      garrigue near aaron's hive sites. spraying everything.

      I took photos. you can see his face in one of them. the
      headlamp he was wearing lit him up.

      then around 10pm I heard a car — actually two cars — drive up
      the dirt track toward the cliff edge. that road goes nowhere
      except aaron's hives. nobody drives there at night. I got
      scared and went home.
    effects:
      trust_katrina: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Beppe (saw boat near cliffs at night) ---

  beppe_interview:
    type: tweet
    from: beppe
    text: >
      Something wrong off the north cliffs last night. Lights where
      lights shouldn't be. Not fishermen. Not divers. Something else.
    effects: { trust_beppe: "+5" }
    choices:
      - Ask Beppe what he saw -> beppe_talk

  beppe_talk:
    type: message
    text: >
      BEPPE: I was bringing my boat back from Comino late — around
      midnight. Passing under the cliffs below the valley, I saw
      lights. A vehicle up on the cliff edge, headlights pointing
      out to sea. And below, at the water line, a small inflatable
      — a RIB — moored at the rocks.

      Mela nobody moors there. It's too dangerous. The rocks will
      tear a boat apart. You'd only go there if you had a reason
      nobody should know about.

      There were voices — men shouting — but the wind carried the
      words away. By the time I circled back, the RIB was gone and
      the headlights were off.
    effects:
      trust_beppe: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Stefan (saw headlights on the dirt road) ---

  stefan_interview:
    type: tweet
    from: stefan
    text: >
      Headlights on the dirt road at midnight. Nobody drives there
      at night. I told the police. They wrote it down. That was it.
    effects: { trust_stefan: "+5" }
    choices:
      - Ask Stefan what he saw -> stefan_talk_night

