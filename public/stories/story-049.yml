      You present the bribery evidence to Daniel Fenech:

      "I have screenshots of internal Seabreeze emails showing
      €85,000 paid to a shell consulting company owned by the
      sindku. I have property records showing Seabreeze subsidiaries
      buying up the valley through shell companies. I have evidence
      of a Seabreeze boat at the cliffs the night Aaron disappeared."
    choices:
