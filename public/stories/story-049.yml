  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The bribery story breaks. Seabreeze's development is frozen
      pending investigation. The sindku resigns. The valley is saved,
      for now.

      But Aaron?

      Without the obsession evidence, Luca is never investigated.
      He continues to keep bees in Wied il-Għasel. He continues to
      monitor Aaron's remaining hives. He creates a new anonymous
      account.

      Three months later, Aaron reads about Seabreeze online. He
      returns quietly. He rebuilds his hives. But every morning he
      checks for poison. Every night he wonders if someone is out
      there in the dark. He stops selling at the village market. He
      installs cameras.

      The corporation is exposed. But the person who terrorised
      Aaron walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

