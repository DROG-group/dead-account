entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN MODŘANSKÉ SADY
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to ModranskeSady.social — the community Mastodon instance for
      the South Bohemian village of Modřanské Sady.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @petra_novakova.

      A beekeeper. Nature photographer. She documented the meadows, the
      hives, the health of the local ecosystem. People are worried.
      She hasn't posted in six days.
    choices:
      - Look at her profile -> petra_profile

  petra_profile:
    type: tweet
    from: petra
    text: "Včely u sadového rybníka umírají. Někdo postřikuje pole za noci. Mám důkazy a nedám pokoj."
    choices:
      - That's her last real post... -> dead_bees

  dead_bees:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photo of an empty beehive. Shot at night, overexposed,
      no caption. Posted at 2am.

      Her friends say that's not how Petra posts. She always wrote long
      captions about the bees and the land. The police say she probably
      "went to Prague for a few days." Nobody in Modřanské Sady
      believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: nadporucik
    text: >
      Obdrželi jsme oznámení o pohřešované obyvatelce Modřanských Sadů.
      V tuto chvíli nemáme důvod k podezření na trestný čin. Případné
      informace předávejte na linku 158 nebo na obvodní oddělení.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her partner @tomas_dvorak hasn't slept.
      Her sister @lenka_novakova is driving down from Český Krumlov.
      Her friend @mirka_prochazkova keeps posting photos of Petra's
      empty hives. The farmer @karel_novotny says Petra was right
      about the spraying.

      And the journalist @tereza_markova is strangely silent.

      Nobody buys the police line. Nobody thinks Petra just "went to
      Prague."
    effects: { trust_tomas: "+5", trust_lenka: "+5" }
    choices:
      - Start following Petra's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Modřanské Sady. Follow Petra's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Božena (pub owner, knows everyone) -> bozena_intro
      - Talk to Karel (farmer, knows about the spraying) -> karel_intro
      - Talk to Zuzana (teen, seems shaken) -> zuzana_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Petra with the rhythms of a small
      South Bohemian village: mushroom season updates, the bakery's
      fresh koláče, weather warnings for frost.

      Key names surface: Tomáš (partner, carpenter), Mirka (friend,
      herbalist, seems terrified), Tereza (journalist, oddly quiet),
      and the teens — Zuzana, Jakub, Marek — who loved Petra's
      nature work.

      Also prominent: AgroChem Šumava s.r.o., the agrochemical plant
      at the edge of the village. Their posts are corporate PR.
      Petra's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Božena -> bozena_intro
      - Talk to Karel -> karel_intro
      - Talk to Zuzana -> zuzana_intro

  # --- Božena (social map) ---

  bozena_intro:
    type: tweet
    from: bozena
    text: >
      Hospoda je otevřená ale nálada je pod psa. @petra_novakova, tvůj
      stůl čeká. Vrať se nám.
    effects: { trust_bozena: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Božena -> bozena_talk

  bozena_talk:
    type: message
    text: >
      BOŽENA: Jo, seš novej? Vítej. Hrozný načasování. Celá ves je
      z toho vedle kvůli Petře.

      Řeknu ti, kdo je kdo. Tomáš je petřin chlap — truhlář, bydlí
      s ní v tom domku u rybníka. Hodnej kluk, teď je zničenej. Mirka
      Procházková je její nejlepší kamarádka, dělá bylinky a masti.
      Lenka je Petřina sestra, ta jede z Krumlova.

      A Tereza Marková — novinářka — s Petrou na něčem dělaly. Na
      něčem o tý chemičce. Tereza neřekla ani slovo, co Petra zmizela.
      To vůbec není normální.

      Jo, a na příspěvky AgroChem Šumava se vyser. Lži zabalený
      v certifikátech.
    effects: { trust_bozena: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Radek Jelínek -> bozena_radek
      - Ask about AgroChem -> bozena_agrochem
      - Thank her and move on -> quest1_hub

  bozena_radek:
    type: message
    text: >
      BOŽENA: Radek? Lesák. Celej život v lese, zná tady každej strom.
      Ale taky zná Petru. Moc dobře. Až moc dobře, jestli mi rozumíš.
      Bývalej soused, předtim než se přestěhovala k Tomášovi. Vždycky
      se na ni díval... jinak. Jako by mu patřila.

      Petra mi jednou řekla — "Radek nechápe, že ne znamená ne." Myslela
      jsem, že mluví o sousedskejch sporech. Teď si nejsem jistá.

      A co je divný — od tý doby, co Petra zmizela, Radek chodí do
      hospody každej večer a ptá se, jestli už se někdo něco dozvěděl.
      Starostlivej nebo nervózní? Posuď sám.
    effects: { trust_bozena: "+5" }
    choices:
      - Ask about AgroChem -> bozena_agrochem
      - Move on -> quest1_hub

  bozena_agrochem:
    type: message
    text: >
      BOŽENA: Ta fabrika tu stojí od devadesátek. Dělaj pesticidy,
      herbicidy, co já vím. Obec to tolerovala, protože dávali práci.
      Ale sedláci si stěžujou léta — mrtvý včely u polí, ryby v rybníce
      břichem nahoru, zvířata se chovaj divně.

      Petra byla první, kdo šel a natočil to. Šla s kamerou a odebírala
      vzorky z polí, z vody, od úlů. Říkala, že má důkazy. Pořádný
      důkazy. A za dva tejdny zmizela.
    effects: { trust_bozena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Karel (farmer, the spraying witness tease) ---

  karel_intro:
    type: tweet
    from: karel
    text: >
      třicet let na tomhle poli. pole jsou otrávený. @petra_novakova
      měla pravdu. a teď je pryč. spojte si to.
    effects: { trust_karel: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Karel -> karel_talk

  karel_talk:
    type: message
    text: >
      KAREL: Třicet let dělám na téhle půdě. Znám každou brázdu,
      každej záhon. A řeknu ti — ta půda umírá. Poslední rok nacházím
      mrtvý hmyz po celým poli. Včely, čmeláci, všechno. A vždycky
      po nocích, kdy je slyšet ty postřikovače.

      Petra odebírala vzorky z mejch polí. Ponořila ruce do hlíny a
      říkala "tady jsou rezidua, která tam nemaj co dělat." Stavěla
      případ. A pak — frnk — pryč.

      Náhoda? Na náhody já nevěřím.
    effects: { trust_karel: "+10" }
    choices:
      - Did you see anything unusual recently? -> karel_night
      - Move on -> quest1_hub

  karel_night:
    type: message
    text: >
      KAREL: Noc předtím, než zmizela — nemoh jsem spát, tak jsem šel
      podívat na pole. Kolem jedný v noci. U cesty k Petřiným úlům stál
      auto. Tmavý kombi s logem AgroChem Šumava. A někdo tam chodil
      s baterkou po louce.

      V jednu v noci. U včelích úlů.

      Tehdy jsem si nemyslel, že je to důležitý. Teď na to myslím
      pořád.
    effects: { trust_karel: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Zuzana (teen, witness tease) ---

  zuzana_intro:
    type: tweet
    from: zuzana
    text: >
      do prdele lidi @petra_novakova mě naučila fotit přírodu a teď
      jen tak zmizí?? kurva to snad není možný. prosím jestli někdo
      něco ví tak řekněte
    effects: { trust_zuzana: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Zuzana -> zuzana_talk_early

  zuzana_talk_early:
    type: message
    text: >
      ZUZANA: co seš novej tady? no teda to máš načasování vole. hele
      petra je fakt nejlepší člověk v celý vesnici. brala nás na výlety,
      ukazovala nám včely zblízka, učila nás jak fotit motýly a tak.
      mega.

      a teď jsem vyděšená protože jakub viděl něco divnýho u rybníka
      ale nechce o tom mluvit. říká že to nic nebylo ale vole... to
      nebylo nic sah
    effects: { trust_zuzana: "+10" }
    choices:
      - What did Jakub see? -> zuzana_jakub_hint
      - Move on -> quest1_hub

  zuzana_jakub_hint:
    type: message
    text: >
      ZUZANA: přesně nevím. byl večer u rybníka hrát na kytaru a viděl
      někoho jak se motá kolem petřina domku?? nebo jako u jejího auta.
      fakt nevím. ale on se z toho posral a nechce o tom mluvit. musíš
      ho zkusit oslovit sám ale je paranoidní na lidi co nezná. zkus
      nejdřív pokecovat o hudbě nebo o rybníku lol
    effects: { trust_zuzana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Modřanské Sady. A South Bohemian
      village built around meadows and fish ponds. A beekeeper who was
      exposing illegal pesticide spraying. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Tomáš (Petra's partner) -> tomas_q1
      - Talk to Mirka (Petra's best friend) -> mirka_q1
      - Check what Lenka (Petra's sister) is saying -> lenka_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Tomáš Q1 ---

  tomas_q1:
    type: tweet
    from: tomas
    text: >
      jestli někdo viděl @petra_novakova prosím zavolejte. její
      včelařský věci jsou doma. její boty jsou u dveří. nikam by
      neodešla bez svejch včel.
    effects: { trust_tomas: "+5", contacts_followed: "+1" }
    choices:
      - DM Tomáš -> tomas_q1_talk

  tomas_q1_talk:
    type: message
    text: >
      TOMÁŠ: Kdo jsi? Další, kdo mi řekne, ať se uklidním? Petra mi
      volala tu noc, než zmizela. Říkala, že má něco velkýho. Říkala,
      že "kdyby se něco stalo, koukej na AgroChem." Pak zavěsila.

      To je poslední, co jsem od ní slyšel.
    effects: { trust_tomas: "+10" }
    choices:
      - What do you think happened? -> tomas_theory
      - Move on -> quest1_hub

  tomas_theory:
    type: message
    text: >
      TOMÁŠ: Myslím, že našla důkaz, že AgroChem postřikuje ilegálně
      a oni ji umlčeli. Ale taky si myslím, že ten divnej soused —
      Radek — ví víc, než říká. Jak o ní mluvil... to nebylo normální.
      Jako by mu patřila.

      Petra mi před měsícema řekla, že jí někdo prohledává včelín.
      Že věci nejsou na svým místě. Myslela si, že je to zvíře. Já
      si to nemyslím.
    effects: { trust_tomas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mirka Q1 ---

  mirka_q1:
    type: tweet
    from: mirka
    text: >
      Petřiny úly jsou tichý. To nikdy předtím nebyly. @petra_novakova
      prosím ozvi se. komukoliv.
    effects: { trust_mirka: "+5", contacts_followed: "+1" }
    choices:
      - DM Mirka -> mirka_q1_talk

  mirka_q1_talk:
    type: message
    text: >
      MIRKA: Děkuju, že se zajímáš, ale neznám tě. Petra má spoustu
      přátel. Určitě se vrátí.

      ...Tohle si pořád říkám. Už tomu nevěřím.

      [Mirka is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_mirka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lenka Q1 ---

  lenka_q1:
    type: tweet
    from: lenka
    text: >
      moje sestra ZMIZELA a policie mi říká že si možná odjela na
      výlet??? ONA NIKAM NEJEZDÍ BEZ SLOVA. jedu z krumlova. někdo
      mi to vysvětlí.
    effects: { trust_lenka: "+5", contacts_followed: "+1" }
    choices:
      - DM Lenka -> lenka_q1_talk

  lenka_q1_talk:
    type: message
    text: >
      LENKA: Kdo jsi? Další z tý vesnice, kdo mi řekne, ať si dám
      kafíčko a počkám? Petra mi psala esemesku ten večer. Napsala
      "kdybys o mně neslyšela, podívej se na AgroChem a na toho,
      kdo mě sleduje." To je všechno. Pak ticho.

      Co to je za píčovinu? Kdo ji sleduje?
    effects: { trust_lenka: "+10" }
    choices:
      - Who do you think is following her? -> lenka_theory
      - Move on -> quest1_hub

  lenka_theory:
    type: message
    text: >
      LENKA: Petra mi říkala, že Radek Jelínek — ten lesák, její
      bývalej soused — se chová divně. Že ho potkává na místech,
      kde nemá co dělat. U jejích úlů, u rybníka, u jejich domu
      v noci. Říkala, že to bude náhoda. Ale dvacet náhod za měsíc
      už náhoda není.

      A k tomu ta fabrika. Dva problémy najednou. Proto zmizela.
    effects: { trust_lenka: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Petra went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Jakub (was at the pond at sunset) -> jakub_interview
      - Find Milan (fish farmer, works late at the pond) -> milan_interview
      - Find Eva (baker, starts at 4am, saw something) -> eva_interview
