      - Back to obsession thread -> stalker_hub

  # --- Ondřej ---

  ondrej_interview:
    type: message
    text: >
      ONDŘEJ: Petra mi tu nechala něco. Zalepený vodotěsný pouzdro.
      Řekla "až se někdo bude ptát na to, co se děje na polích,
      dej mu tohle."

      Vypadala vyděšeně. Říkala, že si udělala kopie všeho, ale
      potřebuje jednu sadu někde, kde by to nikoho nenapadlo hledat.
      Knihkupectví se zdálo ideální.
    effects: { trust_ondrej: "+10" }
    choices:
      - What's happening on the fields? -> ondrej_case

  ondrej_case:
    type: message
    text: >
      Ondřej sahá pod pult a vytáhne vodotěsné pouzdro Pelican.

      ONDŘEJ: Říkala, že přijdeš. Vezmi si to.

      Inside: a USB drive and printed photographs. The photos show
      drone sprayers operating at night over fields — AgroChem
      equipment with visible company logos — and dead bees in rows
      by the hives. The USB drive contains soil samples, chemical
      analysis, and Petra's detailed report documenting months of
      illegal neonicotinoid application.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Nadporučík Beneš ---

  nadporucik_interview:
    type: message
    text: >
      NADPORUČÍK BENEŠ: Mimo záznam — a myslím úplně mimo záznam —
      chtěl jsem AgroChem prošetřit. Nadřízený mi řekl, ať to
      nechám být. Prý to "řeší kraj." To je kód pro "nesahej na to."

      Případ Jelínka je jiná věc. O tom jsem do teď nevěděl. Pokud
      máte důkazy o stalkingu, s tím můžu pracovat. To je jasně
      moje jurisdikce.

      Přineste mi něco pevnýho a případ otevřu znovu.
    effects:
      trust_nadporucik: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Petra than anyone in Modřanské Sady. Who is responsible?
    choices:
      - Confront Radek Jelínek (the obsessive neighbour) -> confront_radek
        when:
          state: obsession_evidence
          gte: 5
      - Confront Vladislav Horák (the plant director) -> confront_vladislav
        when:
          state: corporate_evidence
          gte: 3
      - Confront Starosta Pokorný (political protection) -> confront_frantisek
      - I need more evidence -> investigation_hub

  # --- ENDING A: Radek (Best Ending) ---

  confront_radek:
    type: message
    text: >
      You present your evidence to Radek:

      "I know @lukas_cerny is your account. I know you put a GPS
      tracker on Petra's car. I know you deviated your patrol routes
      to pass her house every night. I know you went through her
      beehives. I have witnesses and I have the GPS logs."
    choices:
      - Send -> radek_response

  radek_response:
    type: message
    text: >
      Radek doesn't reply for a long time. Then:

      RADEK: Ty nechápeš. Chránil jsem ji. Byla v nebezpečí kvůli
      AgroChemu a nechtěla přijmout pomoc. Musel jsem vědět, že je
      v bezpečí. Všechno, co jsem dělal, bylo protože mi na ní záleží.

      That's not care. That's obsession.

      You've already sent the evidence to Nadporučík Beneš. And to
      Tereza Marková.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Nadporučík Beneš reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the patrol logs, the
      witness testimonies — Radek is arrested for stalking and
      harassment. A GPS tracker is recovered from under Petra's
      Fabia at the chaty near Černý rybník.

      Tereza Marková, finally in possession of Petra's full evidence
      package, publishes the AgroChem story in Respekt magazine. The
      ČIŽP orders an unannounced inspection. The plant is shut down
      pending environmental remediation. Vladislav Horák faces
      criminal charges for falsifying pesticide reports and illegal
      application of banned substances.

      And Petra Nováková, reading the story from a friend's house
      in Tábor, calls her sister for the first time in nine days.

      "Jedu domů."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Bílý kruh bezpečí (oběti trestných činů): 116 006
      Linka bezpečí (děti a mladiství): 116 111
      Česká inspekce životního prostředí: 800 100 554
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: petra
    text: >
      včely nelžou. a lidi z modřanských sadů taky ne. díky, že jste
      to nevzdali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Vladislav (Partial Ending) ---

  confront_vladislav:
    type: message
    text: >
      You present the pesticide evidence to Vladislav Horák:

      "I have photographs of the illegal night spraying. I have soil
      samples showing neonicotinoid levels ten times the legal limit.
      I have your original lab reports showing the data was falsified.
      I have the canister with your batch number."
    choices:
      - Send -> vladislav_response

  vladislav_response:
    type: message
    text: >
      VLADISLAV: Tato konverzace bude předána našemu právnímu
      oddělení. Jakékoli zveřejnění pomlouvačných materiálů
      povede k okamžitému právnímu řízení. AgroChem Šumava vždy
      jednal v souladu s regulatorními požadavky.

      But it's too late. You've sent the evidence to Tereza, to the
      Spolek Za živou krajinu, and to the ČIŽP.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pesticide story breaks. AgroChem Šumava is ordered to halt
      all spraying pending investigation. The factory may close. A
      hundred and fifty jobs hang in the balance. The village is
      divided.

      But Petra?

      Without the stalking evidence, Radek is never investigated. He
      continues to work in the forest. He continues to monitor her
      movements. He creates a new anonymous account.

      Three months later, Petra reads about AgroChem online. She
      returns quietly. She moves her hives to a different location.
      She stops walking alone at dusk. She checks under her car
      every morning.

      The corporation is exposed. But the person who terrorised
      Petra walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: petra
    text: "jsem zpátky. vzduch je čistší. zbytek... uvidíme."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_frantisek:
    type: message
    text: >
      You confront Starosta Pokorný with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> frantisek_response

  frantisek_response:
    type: tweet
    from: simona
    text: >
      Můj klient bere vaše tvrzení na vědomí. Jakékoli veřejné
      šíření pomlouvačného obsahu bude mít okamžité právní následky.
      — Kancelář Říhová & partneři, České Budějovice
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Pokorný and AgroChem's spraying — and there isn't
      one beyond political protection — your evidence is insufficient.

      AgroChem continues to operate. Radek continues to watch. Petra
      stays in hiding.

      Six months later, @lukas_cerny creates a new account. It
      follows Petra's sister.
    choices:
      - The End -> game_complete

