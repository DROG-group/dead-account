      Valentina Rigoni, finally in possession of Matteo's full
      evidence package, publishes the DoloCable story in Corriere
      della Sera. The Provincia di Bolzano orders an immediate halt
      to all construction on the Croda Rossa. Marco Tessari faces
      criminal charges for building in a Natura 2000 zone without
      permits. The sindaco's "development fund" is investigated by
      the Guardia di Finanza.

      And Matteo Zeni, reading the story from a bivacco above the
      tree line, calls his sister for the first time in nine days.

      "Torno a casa."
