    from: marta
    text: >
      Il mio cliente prende atto delle sue accuse. Qualsiasi
      diffusione pubblica di affermazioni diffamatorie sarà oggetto
      di immediata azione legale. — Studio Legale Fabbri & Partners,
      Bolzano
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The sindaco's lawyer buries your accusation. Without a direct
      link between Hofer and DoloCable's illegal construction — and
      the "development fund" is technically legal — your evidence is
      insufficient to prove corruption.

      DoloCable continues to build. Sofia continues to watch. Matteo
      stays in hiding.

      Six months later, @thomas_brenner creates a new account. It
      follows Matteo's sister.
    choices:
      - The End -> game_complete

