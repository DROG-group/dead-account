    text: >
      ENDING B: THE CORPORATION

      The development story breaks. DoloCable is ordered to halt all
      work pending investigation. The cable car project may be dead.
      The promised 150 jobs evaporate. The valley is divided between
      relief and fury.

      But Matteo?

      Without the stalking evidence, Sofia is never investigated.
      She continues to visit the valley. She creates a new anonymous
      account. She buys new cameras.

      Three months later, Matteo reads about DoloCable online. He
      returns quietly. He reopens the rifugio. He installs locks on
      every window. He stops hiking alone. He checks the trees around
      the rifugio every morning.

      The corporation is stopped. But the person who terrorised
      Matteo walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: matteo
    text: "sono tornato. la croda rossa è salva. il resto... si vedrà."
    choices:
      - The End -> game_complete

  # --- ENDING C: Sindaco (Wrong Ending) ---

  confront_andreas:
    type: message
    text: >
      You confront Sindaco Hofer with your evidence.

      Within the hour, you receive a message from his office:
    choices:
