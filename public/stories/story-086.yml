# DEAD ACCOUNT — Story 086: Val di Ferro (Italy — Dolomites)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-086.yml
#
# Player investigates the disappearance of young rifugista Matteo Zeni
# in the fictional South Tyrolean mountain village of Val di Ferro.

meta:
  title: "Dead Account — Val di Ferro"
  state:
    # Trust levels per NPC (0-100)
    trust_elisa: 0
    trust_lorenzo: 0
    trust_francesca: 0
    trust_andreas: 0
    trust_giulia: 0
    trust_marco: 0
    trust_sofia: 0
    trust_hans: 0
    trust_pietro: 0
    trust_chiara: 0
    trust_luca: 0
    trust_nina: 0
    trust_thomas: 0
    trust_rosa: 0
    trust_stefan: 0
    trust_valentina: 0
    trust_bruno: 0
    trust_marta: 0
    trust_maresciallo: 0
    trust_anon: 0
    # Progress counters
    contacts_followed: 0
    night_witnesses: 0
    corporate_evidence: 0
    obsession_evidence: 0
    evidence_total: 0

  player:
    name: New Hiker
    bio: "appena arrivato a val di ferro. discovering the dolomites one trail at a time"
    avatar: avatars/default_citizen.png

  bot:
    display_name: "ValDiFerro.social"
    description: "Benvenuti sull'istanza comunitaria di Val di Ferro, Dolomiti"
    avatar_url: /gamepatch/assets/dead-account/valdiferro_bot.png

  npcs:
    # === Matteo's Inner Circle ===
    matteo:
      name: "Matteo Zeni"
      bio: "rifugista al rifugio stella alpina | 2.450m | la montagna non tradisce mai"
      avatar: avatars/matteo.jpg
    elisa:
      name: "Elisa Zeni"
      bio: "sorella di matteo | infermiera a bolzano | se non lo trovate voi lo trovo io"
      avatar: avatars/elisa.jpg
    lorenzo:
      name: "Lorenzo Bianchi"
      bio: "guida alpina | val di ferro | compagno di cordata di matteo | le cime non dimenticano"
      avatar: avatars/lorenzo.jpg
    francesca:
      name: "Francesca Moretti"
      bio: "la ragazza di matteo | studentessa geologia a trento | mi manca da morire"
      avatar: avatars/francesca.jpg

    # === Local Government ===
    andreas:
      name: "Andreas Hofer"
      bio: "Sindaco di Val di Ferro | Turismo e tradizione | #ValDiFerroCresce"
      avatar: avatars/andreas.jpg
    giulia:
      name: "Giulia Dellamonica"
      bio: "Assessore all'ambiente | Comune di Val di Ferro | tutela del territorio"
      avatar: avatars/giulia.jpg
    comune:
      name: "Comune di Val di Ferro"
      bio: "Profilo ufficiale | Notizie comunali | Orari: Lun-Ven 8:30-12:30"
      avatar: avatars/comune.jpg

    # === Local Business & Community ===
    hans:
      name: "Hans Platter"
      bio: "Gasthof Platter | stube tirolese | strudel della nonna | dal 1953"
      avatar: avatars/hans.jpg
    gasthof:
      name: "Gasthof Platter"
      bio: "Cucina tirolese | Knödel | Speck | Aperitivo con vista Dolomiti"
      avatar: avatars/gasthof.jpg
    pietro:
      name: "Pietro Dallavalle"
      bio: "pastore | 300 pecore | questi sentieri li conosco da 50 anni"
      avatar: avatars/pietro.jpg
    rosa:
      name: "Rosa Winkler"
      bio: "farmacia val di ferro | salute & montagna | aperto anche sabato mattina"
      avatar: avatars/rosa.jpg
    stefan:
      name: "Stefan Gruber"
      bio: "soccorso alpino | val di ferro | ogni chiamata conta"
      avatar: avatars/stefan.jpg
    bruno:
      name: "Bruno Tessadri"
      bio: "gestore funivia vecchia | la montagna va rispettata non sfruttata"
      avatar: avatars/bruno.jpg

    # === Journalist ===
    valentina:
      name: "Valentina Rigoni"
      bio: "giornalista freelance | ambiente & montagna | segnalazioni: v.rigoni@altoadigenews.it"
      avatar: avatars/valentina.jpg

    # === DoloCable (corporate) ===
    dolocable:
      name: "DoloCable SpA"
      bio: "Impianti a fune | Sviluppo turistico sostenibile | Progetto Croda Rossa"
      avatar: avatars/dolocable.jpg
    marco:
      name: "Marco Tessari"
      bio: "CEO DoloCable SpA | innovazione turistica | le Dolomiti meritano il meglio"
      avatar: avatars/marco.jpg
    marta:
      name: "Marta Fabbri"
      bio: "Avvocato | Studio Legale Fabbri & Partners | Diritto ambientale | Bolzano"
      avatar: avatars/marta.jpg

    # === Teens ===
    chiara:
      name: "Chiara"
      bio: "16 | arrampicata & trail | val di ferro nata | la roccia è vita fra"
      avatar: avatars/chiara.jpg
    luca:
      name: "Luca"
      bio: "17 | freeride & mtb | sessione alba | la montagna cura tutto"
      avatar: avatars/luca.jpg
    nina:
      name: "Nina"
      bio: "15 | foto & natura | le dolomiti in bianco e nero | matteo è il mio mito"
      avatar: avatars/nina.jpg

    # === Media & Community ===
    actu_ferro:
      name: "Notizie Val di Ferro"
      bio: "Attualità della valle e delle Dolomiti | Tips: redazione@notizievaldiferro.it"
      avatar: avatars/actu_ferro.jpg
    meteo_dolomiti:
      name: "Meteo Val di Ferro"
      bio: "Previsioni e allerte | Stazione automatica | Aggiornamento ogni ora"
      avatar: avatars/meteo_dolomiti.jpg
    asso_montagna:
      name: "Associazione Sentinelle delle Dolomiti"
      bio: "Protezione del territorio dolomitico | Volontari | Segnalazioni ambientali"
      avatar: avatars/asso_montagna.jpg

    # === Suspicious / Other ===
    sofia:
      name: "Sofia Keller"
      bio: "turista | amo le dolomiti | ci torno sempre"
      avatar: avatars/sofia.jpg
    thomas:
      name: "Thomas Brenner"
      bio: "."
      avatar: avatars/anon.jpg
    maresciallo:
      name: "Maresciallo De Luca"
      bio: "Carabinieri Stazione di Val di Ferro | Emergenze: 112"
      avatar: avatars/maresciallo.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN VAL DI FERRO
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to valdiferro.social — the community Mastodon instance for
      the Dolomite mountain village of Val di Ferro, South Tyrol.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @matteo_zeni.

      A young rifugista — keeper of the Rifugio Stella Alpina at 2,450
      metres. He knew every trail, every rock face, every weather pattern.
      People are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> matteo_profile

  matteo_profile:
    type: tweet
    from: matteo
    text: "Hanno iniziato a scavare sotto la Croda Rossa. La via ferrata è compromessa. Ho le foto. Qualcuno deve fermarli."
    choices:
      - That's his last real post... -> grey_peak

  grey_peak:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a grey mountain peak. Blurred, overexposed, taken from a strange
      angle. Posted at 4am. No caption.

      His friends say that's not his style. The Carabinieri say he
      probably went on a solo hike. Something doesn't add up.
    choices:
      - Read the Carabinieri statement -> carabinieri_statement
      - Look at what people are saying -> community_reaction

  carabinieri_statement:
    type: tweet
    from: maresciallo
    text: >
      Abbiamo ricevuto una segnalazione riguardante un residente di
      Val di Ferro. Allo stato attuale non risultano elementi che
      facciano pensare a un atto criminoso. Chiunque abbia informazioni
      utili è pregato di contattare il 112 o la Stazione.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @elisa_zeni is furious. His
      climbing partner @lorenzo_bianchi is organising search parties. His
      girlfriend @francesca_moretti is posting desperate messages. The
      old shepherd @pietro_dallavalle says the mountain doesn't lie.

      And the journalist @valentina_rigoni is strangely silent.

      Nobody buys the Carabinieri's line. Nobody thinks Matteo just
      "went hiking."
    effects: { trust_elisa: "+5", trust_lorenzo: "+5" }
    choices:
      - Start following Matteo's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Val di Ferro. Follow Matteo's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Hans (Gasthof owner, knows everyone) -> hans_intro
      - Talk to Pietro (shepherd, saw the construction) -> pietro_intro
      - Talk to Chiara (teen climber, seems shaken) -> chiara_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Matteo with the rhythms of a small
      mountain village: weather warnings, trail conditions, the Gasthof's
      daily specials, Alpine rescue updates.

      Key names surface: Elisa (sister, nurse in Bolzano), Lorenzo
      (climbing partner, seems wrecked), Francesca (girlfriend, studying
      geology in Trento), and the teens — Chiara, Luca, Nina — who
      looked up to Matteo.

      Also prominent: DoloCable SpA, the cable car company building a
      new lift through protected Dolomite territory. Their posts are
      corporate PR. Matteo's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Hans -> hans_intro
      - Talk to Pietro -> pietro_intro
      - Talk to Chiara -> chiara_intro

  # --- Hans (social map) ---

  hans_intro:
    type: tweet
    from: hans
    text: >
      La Stube è aperta ma senza @matteo_zeni non è lo stesso. Quel
      ragazzo passava sempre dopo la discesa. Matteo, il tuo tavolo
      ti aspetta.
    effects: { trust_hans: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Hans -> hans_talk

  hans_talk:
    type: message
    text: >
      HANS: Ah, you're new? Willkommen. Bad time to arrive. The whole
      valley is on edge about Matteo.

      Let me tell you who's who. Elisa is his sister — a nurse up in
      Bolzano. Strong woman, she'll tear the mountain apart looking for
      him. Lorenzo Bianchi is his climbing partner, a guide. Those two
      were like brothers. Francesca is his girlfriend, studies geology
      in Trento. Comes up every weekend.

      And then there's Sofia Keller. Tourist from Munich. Came here
      three summers in a row. Always at the rifugio. Always with
      Matteo. Started coming more often. Then every week. Francesca
      didn't like it but Matteo said she was harmless.

      Oh, and DoloCable — don't get me started. They want to build a
      cable car through the Croda Rossa. Matteo was the loudest voice
      against it. The sindaco is in their pocket.
    effects: { trust_hans: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Sofia -> hans_sofia
      - Ask about DoloCable -> hans_dolocable
      - Thank him and move on -> quest1_hub

  hans_sofia:
    type: message
    text: >
      HANS: Sofia? Boh, how do I put this. She came for the mountains
      at first. Then she came for Matteo. You could see it — the way
      she looked at him, the way she'd find excuses to stay at the
      rifugio longer.

      Matteo was kind to everyone. Too kind, maybe. She'd sit at the
      bar for hours just watching him work. He told Francesca it was
      nothing. But I run a Gasthof — I know when someone is drinking
      at my bar for the food, and when they're drinking for something
      else.

      After he told her he had a girlfriend, she got... strange. Quiet.
      But she didn't stop coming. If anything she came more.
    effects: { trust_hans: "+5" }
    choices:
      - Ask about DoloCable -> hans_dolocable
      - Move on -> quest1_hub

  hans_dolocable:
    type: message
    text: >
      HANS: DoloCable wants to build a cable car from the valley floor
      to the Croda Rossa ridge. Right through protected Natura 2000
      territory. UNESCO Dolomites buffer zone. They say it'll bring
      tourists and jobs.

      The sindaco — Andreas — he's all for it. Porco dio, the man sees
      euro signs where the rest of us see chamois and edelweiss. Matteo
      found out DoloCable was already doing test drilling up there
      before the permits were approved. He had photos. Raga, the kid
      was brave.

      Two weeks after he posted those photos, he's gone.
    effects: { trust_hans: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Pietro (the mountain, witness tease) ---

  pietro_intro:
    type: tweet
    from: pietro
    text: >
      cinquant'anni che porto le pecore su questi sentieri. la
      montagna non è più la stessa. @matteo_zeni lo sapeva. e adesso
      è sparito. fate voi il collegamento.
    effects: { trust_pietro: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Pietro -> pietro_talk

  pietro_talk:
    type: message
    text: >
      PIETRO: I've been herding sheep on these paths since I was
      fifteen. I know every rock, every stream, every sound the wind
      makes through the pass. And I'm telling you — something is wrong
      up at the Croda Rossa.

      They've been bringing heavy equipment up the old mule track at
      night. Drilling rigs, concrete mixers. Before any permit. Before
      any approval. Matteo hiked up there and photographed everything.
      He was building a case.

      Then poof — sparito.

      You think that's a coincidence? In these mountains, nothing is
      a coincidence.
    effects: { trust_pietro: "+10" }
    choices:
      - Did you see anything unusual recently? -> pietro_night
      - Move on -> quest1_hub

  pietro_night:
    type: message
    text: >
      PIETRO: The night before he vanished — I was coming down from
      the high pasture around midnight. I saw lights at the rifugio.
      Not unusual, Matteo works late. But there were headlights on
      the access road. A big SUV, the kind with the DoloCable logo.
      Black. Expensive.

      At midnight. On a mountain road that's normally closed after
      dark.

      I didn't think much of it then. Madonna, I think about it
      every night now.
    effects: { trust_pietro: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Chiara (teen climber, witness tease) ---

  chiara_intro:
    type: tweet
    from: chiara
    text: >
      cazzo raga @matteo_zeni è lui che mi ha insegnato ad
      arrampicare tipo sul serio non è possibile che sia partito
      così. se qualcuno sa qualcosa per favore dite qualcosa
    effects: { trust_chiara: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Chiara -> chiara_talk_early

  chiara_talk_early:
    type: message
    text: >
      CHIARA: fra sei nuovo? boh che timing di merda. comunque
      matteo è tipo la persona migliore di questa valle. ci ha
      insegnato ad arrampicare, ci portava sui sentieri, ci
      raccontava le storie delle montagne. troppo forte.

      e adesso sono in para perché luca ha visto una roba strana
      l'altra sera vicino al rifugio ma non ne vuole parlare. dice
      che non è niente ma fra... non è niente un cazzo
    effects: { trust_chiara: "+10" }
    choices:
      - What did Luca see? -> chiara_luca_hint
      - Move on -> quest1_hub

  chiara_luca_hint:
    type: message
    text: >
      CHIARA: boh non so di preciso. era in sessione trail running
      e ha visto tipo una tipa vicino al rifugio che guardava dentro
      dalle finestre?? o qualcosa del genere. lui flippa troppo non
      vuole parlarne. devi chiedergli te ma è diffidente con la gente
      che non conosce. prova prima a parlare di mtb con lui lol
    effects: { trust_chiara: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Val di Ferro. A Dolomite village
      between Italian and Tyrolean cultures. A young rifugista who
      was fighting a cable car development. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Francesca (Matteo's girlfriend) -> francesca_q1
      - Talk to Lorenzo (Matteo's climbing partner) -> lorenzo_q1
      - Check what Elisa (Matteo's sister) is saying -> elisa_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Francesca Q1 ---

  francesca_q1:
    type: tweet
    from: francesca
    text: >
      se qualcuno ha notizie di @matteo_zeni chiamatemi vi prego.
      il rifugio è chiuso. la sua attrezzatura è ancora lì. non
      sarebbe mai partito senza i suoi ramponi.
    effects: { trust_francesca: "+5", contacts_followed: "+1" }
    choices:
      - DM Francesca -> francesca_q1_talk

  francesca_q1_talk:
    type: message
    text: >
      FRANCESCA: I appreciate you reaching out but I don't know you.
      Matteo has a lot of friends here. I'm sure he'll come back.

      ...I keep telling myself that. Non ci credo più.

      [Francesca is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_francesca: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lorenzo Q1 ---

  lorenzo_q1:
    type: tweet
    from: lorenzo
    text: >
      Squadra di ricerca domani alle 6. Partenza dal parcheggio
      della funivia. Portate corda, lampade frontali, radio.
      @matteo_zeni lo troviamo noi se i carabinieri non si muovono.
    effects: { trust_lorenzo: "+5", contacts_followed: "+1" }
    choices:
      - DM Lorenzo -> lorenzo_q1_talk

  lorenzo_q1_talk:
    type: message
    text: >
      LORENZO: Matteo and I have climbed together for five years.
      Every via ferrata, every parete, every winter route. He knows
      these mountains like his hands. He doesn't just disappear.

      The last thing he told me was about DoloCable. He said they'd
      started drilling at night, up on the Croda Rossa. Said he had
      photos that would stop the whole project. Then he went quiet.

      I've searched every trail, every bivacco, every crevasse I know.
      Nothing. He's not lost in the mountains. Something happened to
      him at the rifugio.
    effects: { trust_lorenzo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Elisa Q1 ---

  elisa_q1:
    type: tweet
    from: elisa
    text: >
      mio fratello è SPARITO e i carabinieri mi dicono che forse è
      andato a fare un'escursione??? MA CHE CAZZO. NON PARTE SENZA
      AVVISARE. arrivo da bolzano. qualcuno mi deve spiegare.
    effects: { trust_elisa: "+5", contacts_followed: "+1" }
    choices:
      - DM Elisa -> elisa_q1_talk

  elisa_q1_talk:
    type: message
    text: >
      ELISA: Who are you? Another one from this valley who's going
      to tell me to calm down? My brother called me the night before
      he disappeared. He said he had something big. He said "se
      succede qualcosa, guarda DoloCable." Then he hung up.

      That's the last I heard from him.
    effects: { trust_elisa: "+10" }
    choices:
      - What do you think happened? -> elisa_theory
      - Move on -> quest1_hub

  elisa_theory:
    type: message
    text: >
      ELISA: I think he found proof that DoloCable is building
      illegally in a protected zone and they shut him up. The
      sindaco is in on it — everyone knows Andreas gets kickbacks
      from the tourism revenue.

      But there's something else. Matteo told me months ago about
      this woman — a tourist — who kept coming to the rifugio.
      Sofia, something. She was always there. Following him on the
      trails. He said it was nothing but I could hear it in his
      voice. He was creeped out.

      Cazzo, I should have listened.
    effects: { trust_elisa: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Matteo went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Luca (was trail running near the rifugio) -> luca_interview
      - Find Bruno (old cable car operator, works early) -> bruno_interview
      - Find Stefan (mountain rescue, got a strange call) -> stefan_interview
      - Find Rosa (pharmacist, opens early, saw something) -> rosa_interview

  # --- Luca (saw someone at the rifugio) ---

  luca_interview:
    type: tweet
    from: luca
    text: >
      bella sessione oggi ma l'atmosfera in valle è strana tipo.
      c'è qualcosa che non va. boh non so spiegare
    effects: { trust_luca: "+5" }
    choices:
      - Ask Luca about that evening -> luca_talk

  luca_talk:
    type: message
    text: >
      LUCA: fra ok ma non dirlo a nessuno eh. ero su al sentiero
      verso le 18 tipo sessione sunset. e ho visto una tipa vicino
      al rifugio. la bionda — quella tedesca che viene sempre — la
      sofia. stava tipo a guardare dentro dalle finestre. quando mi
      ha visto è scappata via velocissima giù per il sentiero.

      tipo io non ho detto niente perché non volevo casini ma fra
      adesso è pesante. non è normale sto comportamento dio cane
    effects:
      trust_luca: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Bruno (old cable car, saw late-night vehicles) ---

  bruno_interview:
    type: tweet
    from: bruno
    text: >
      Promemoria: la strada di accesso alla Croda Rossa è chiusa
      al traffico dopo le 20. Ho notato passaggi non autorizzati
      queste ultime notti.
    effects: { trust_bruno: "+5" }
    choices:
      - Ask Bruno what he saw -> bruno_talk

  bruno_talk:
    type: message
    text: >
      BRUNO: I was closing the old cable car station around 22h. I
      saw headlights going up the mountain road — the one that leads
      past the rifugio to the Croda Rossa. A big black SUV. DoloCable
      plates. And behind it, a truck with drilling equipment covered
      by tarps.

      At 22h. On a road that's supposed to be closed.

      Then around midnight, I heard the SUV come back down. Fast.
      Too fast for that road. I noted it in the station log. Nobody's
      asked to see it.
    effects:
      trust_bruno: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Stefan (mountain rescue, got a call) ---

  stefan_interview:
    type: tweet
    from: stefan
    text: >
      soccorso alpino: nessuna chiamata di emergenza registrata
      riguardo matteo zeni. il che è strano. in queste montagne
      se qualcuno è disperso, qualcuno chiama.
    effects: { trust_stefan: "+5" }
    choices:
      - Ask Stefan what he knows -> stefan_talk

  stefan_talk:
    type: message
    text: >
      STEFAN: Here's what's strange. Around 2am that night, I got
      a call on the rescue line. A woman's voice — foreign accent,
      maybe German — saying someone was hurt near the rifugio. I
      asked for details. She hung up.

      I dispatched a team at first light. We found nothing. No
      injured hiker. But the rifugio door was open, lights still
      on, Matteo's dinner half-eaten on the table. His emergency
      radio was still charging. His rucksack was packed by the door
      like he was about to leave.

      Whoever called either made a mistake or wanted us to find
      something. Or not find someone.
    effects:
      trust_stefan: "+10"
      night_witnesses: "+1"
