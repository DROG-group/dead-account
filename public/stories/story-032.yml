  paola_interview:
    type: message
    text: >
      PAOLA: As assessore all'urbanistica, I can assure you that all
      permits for the Punta Azzurra project were issued in full
      compliance with regional regulations. EdilMare is a reputable
      company. The archaeological impact assessment was conducted and
      no significant finds were reported.

      Off the record? Minchia, I signed what they put in front of me.
      The sindaco said to sign. The prefetto said to sign. Everyone
      said to sign. Do you know what it's like to say no to the
      Ferrara family in this town? My surname is Ferrara too.
      Everyone's is. That doesn't mean I had a choice.

      Lucia had the real impact assessment. The one the
      sovraintendenza buried. With that document, this whole project
      collapses.
    effects:
      trust_paola: "+10"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
