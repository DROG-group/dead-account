  # --- Workshop Search ---

  workshop_search:
    type: message
    text: >
      Lucia's workshop is locked but you can see through the windows.
      The shelves are half-empty — the men took her files and photos.
      But they missed things. On the wall, a map of Punta Azzurra
      with red circles marking archaeological sites. On her desk,
      a ceramic maquette of the promontory showing where the ancient
      foundations are.

      Under a cloth, you can see the edges of printed photographs.
      One shows concrete being poured directly over what appears to
      be a tessellated floor — Roman or Greek mosaic work.
    effects:
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue -> corruption_hub

  # --- Irene (journalist) ---

  irene_interview:
    type: message
    text: >
      IRENE: I don't discuss sources. Ever.
    effects: { trust_irene: "+5" }
    choices:
      - Show Irene the evidence you have -> irene_with_evidence
        when:
          state: construction_evidence
          gte: 3
      - Back to construction thread -> corruption_hub

  irene_with_evidence:
    type: message
    text: >
      IRENE: ...you have more than I expected.

      Okay. Lucia and I were working together. She had photos of
      an undeclared archaeological site being destroyed — a Greek
      temple foundation, 5th century BC. The sovraintendenza ignored
      her reports. She had documents showing the permits were signed
      by Paola Ferrara, whose brother-in-law is Donato Ferrara, the
      site director. The whole thing is a family operation.

      We were going to publish together in La Repubblica's Sicilia
      section. Then she went dark. And two days later, someone broke
      into my car and stole my backup drive.

      Lucia is alive. She contacted me once, from a different phone.
      She said she was hiding in the countryside. She said "they
      threatened me and someone else won't leave me alone."

      I can't tell you where she is. But with enough evidence, I
      can publish and make it safe for her to come back.
    effects:
      trust_irene: "+25"
      construction_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Who threatened her? -> irene_hint
      - Back to investigation hub -> investigation_hub

  irene_hint:
    type: message
    text: >
      IRENE: Donato came to her workshop with a man I later
      identified as Fabio Ferrara — the family's lawyer. They told
      her to hand over everything or face "consequences." In Sicily,
      from people like that, "consequences" means something specific.

      But she also mentioned someone else. Someone who always knew
      where she was. Someone who'd been inside her workshop when she
      wasn't there. That's a different kind of threat.
    choices:
      - Back to investigation hub -> investigation_hub

