    text: >
      ENDING C: THE POLITICIAN

      The family lawyer buries your accusation. Without a direct,
      prosecutable link between the sindaco and the destruction of
      archaeological remains — and the family has layers of
      insulation between them and the dirty work — your evidence is
      not enough for the procura.

      EdilMare continues to build. Raimondo continues to watch.
      Lucia stays in hiding.

      Six months later, the Punta Azzurra luxury apartments go on
      sale. The tessellated floor is under the parking garage. The
      temple foundations are in the sea.

      And @argilla_viva creates a new account. It follows Lucia's
