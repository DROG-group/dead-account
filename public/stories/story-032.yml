        when:
          state: collector_evidence
          gte: 5
      - Confront Donato Ferrara (the construction director) -> confront_donato
        when:
          state: construction_evidence
          gte: 3
      - Confront Sindaco Carmelo Ferrara (political protection) -> confront_carmelo
      - I need more evidence -> investigation_hub

  # --- ENDING A: Raimondo (Best Ending) ---

  confront_raimondo:
    type: message
    text: >
      You present your evidence to Raimondo:

      "I know @argilla_viva is your account. I know you had a key to
      Lucia's workshop. I know you were watching her house. I know you
      followed her schedule and photographed her without consent. I
      have witnesses and I have the post history."
    choices:
      - Send -> raimondo_response

  raimondo_response:
    type: message
    text: >
      Raimondo doesn't reply for hours. Then:

      RAIMONDO: You don't understand. Her art IS her. To understand
      her ceramics, I needed to understand her process, her life,
      her rhythms. Every great collector must understand the artist
      at a fundamental level. I was appreciating her. Protecting her
      from people who don't see what I see.

      That's not appreciation. That's obsession.

      You've already sent the evidence to Maresciallo Ferrara. And
      to Irene Ferraro.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE COLLECTOR

      Three things happen in quick succession.

      The maresciallo reopens the case. With your evidence — the
      anonymous account, the workshop key, the surveillance photos,
      the witness testimonies — Raimondo Vella is arrested for
      stalking and harassment. A copy of Lucia's workshop key is
      found in his Catania apartment, along with 14 stolen ceramic
      pieces and a wall covered in photographs of her.

      Irene Ferraro, with Lucia's full evidence package and Marco's
      400 photographs, publishes the EdilMare story in La Repubblica.
      The procura orders an immediate inspection of Punta Azzurra.
      Construction is halted. Donato Ferrara and the sindaco face
      criminal charges for destruction of archaeological heritage,
      fraud, and corruption. The sovraintendenza is investigated for
      complicity.

      And Lucia Ferrante, reading the article from a friend's house
      in the hills above Cefalù, calls her brother for the first
      time in nine days.

      "Salvo, torno a casa."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: lucia
    text: >
      il fuoco e l'argilla non mentono. e neanche la gente di
      porticello. grazie di non aver mollato.
    choices:
      - The End -> game_complete

  # --- ENDING B: Donato (Partial Ending) ---

  confront_donato:
    type: message
    text: >
      You present the construction evidence to Donato Ferrara:

      "I have photographs of Greek temple foundations being destroyed.
      I have the real archaeological survey. I have the forged permits.
      I have financial records linking EdilMare to the sindaco's
      personal accounts. I have satellite imagery."
    choices:
      - Send -> donato_response

  donato_response:
    type: message
    text: >
      DONATO: Questa conversazione sarà inoltrata al nostro
      dipartimento legale. Qualsiasi pubblicazione di materiale
      diffamatorio comporterà procedimenti immediati. EdilMare ha
      sempre operato nel pieno rispetto della normativa vigente.

      But it's too late. You've sent the evidence to Irene, to
      Proteggi la Costa, and to the procura in Palermo.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CONSTRUCTION

      The story breaks. EdilMare is ordered to halt all work at
      Punta Azzurra pending investigation. The syndicated Ferrara
      family empire begins to crack. Criminal charges are filed for
      destruction of cultural heritage. The sindaco resigns. The town
      is in shock.

      But Lucia?

      Without the stalking evidence, Raimondo is never investigated.
      He continues to collect Sicilian ceramics. He finds new artists.
      He creates a new anonymous account. He develops new obsessions.

      Three months later, Lucia reads about the construction scandal
      online. She returns quietly. She changes the locks on her
      workshop. She installs cameras. She stops working alone at night.
      She checks behind her every time she walks home.

      The corruption is exposed. But the person who terrorised Lucia
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

