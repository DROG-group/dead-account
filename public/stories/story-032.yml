entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PORTICELLO
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to porticello.social — the community Mastodon instance for
      the coastal town of Porticello, Sicily.

      The local feed is in chaos today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @lucia_ferrante.

      A young ceramics artist. Known for her tiles, her sculptures, her
      murals along the harbour wall. She documented the coast through clay.
      People are worried. She hasn't posted in six days.
    choices:
      - Look at her profile -> lucia_profile

  lucia_profile:
    type: tweet
    from: lucia
    text: "stanno costruendo sul promontorio. zona protetta. ho le foto. ho i documenti. non mi fermo."
    choices:
      - That's her last real post... -> grey_tile

  grey_tile:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a cracked ceramic tile, grey and broken, photographed on wet rocks.
      Posted at 4am. No caption.

      Her friends say that's not her work. Lucia would never post a
      broken piece. The carabinieri say she probably left for a trip.
      Something doesn't add up.
    choices:
      - Read the carabinieri statement -> carabinieri_statement
      - Look at what people are saying -> community_reaction

  carabinieri_statement:
    type: tweet
    from: maresciallo
    text: >
      Abbiamo ricevuto una segnalazione riguardante una residente di
      Porticello. Allo stato attuale, non vi sono elementi che facciano
      pensare a fatti di natura criminale. Qualsiasi informazione utile
      può essere comunicata al 112 o alla stazione.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are frantic. Her flatmate @francesca is desperate.
      Her brother @salvatore is searching the coastline every morning.
      Her sister @valentina is driving down from Palermo. The old
      fisherman @giuseppe says she was right about the construction.

      And the journalist @irene_ferraro hasn't posted a single word
      since Lucia vanished.

      Nobody buys the carabinieri's theory. Nobody thinks Lucia just
      "went on a trip."
    effects: { trust_salvatore: "+5", trust_valentina: "+5" }
    choices:
      - Start following Lucia's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Porticello. Follow Lucia's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Rosa (café owner, knows everyone) -> rosa_intro
      - Talk to Giuseppe (fisherman, saw the construction) -> giuseppe_intro
      - Talk to Alessia (teen, learned ceramics from Lucia) -> alessia_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Lucia with the rhythms of a small
      Sicilian coastal town: fish market schedules, the pasticceria's
      daily specials, weather warnings for the strait.

      Key names surface: Francesca (flatmate, waitress), Marco (ex-
      boyfriend, photographer in Palermo, seems worried), Irene
      (journalist, oddly silent), and the teens — Alessia, Tommaso,
      Nina — who adored Lucia's ceramics workshops.

      Also prominent: EdilMare Costruzioni, a construction company
      with a major project on the promontory. Their posts are corporate
      polish. Lucia's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Rosa -> rosa_intro
      - Talk to Giuseppe -> giuseppe_intro
      - Talk to Alessia -> alessia_intro

  # --- Rosa (social map) ---

  rosa_intro:
    type: tweet
    from: rosa
    text: >
      Il bar è aperto ma il cuore no. @lucia_ferrante, il tuo
      tavolo ti aspetta. Torna a casa.
    effects: { trust_rosa: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Rosa -> rosa_talk

  rosa_talk:
    type: message
    text: >
      ROSA: Ah, sei nuovo qui? Benvenuto. Brutto momento per arrivare.
      Tutti quanti sono in pensiero per Lucia.

      Let me tell you who's who. Francesca is Lucia's flatmate — they
      share a house near the old church. Sweet girl, destroyed right now.
      Salvatore is Lucia's brother, fisherman, goes out looking every
      morning. Valentina is the sister, teaches in Palermo.

      Then there's that man. Raimondo Vella. Rich collector from
      Catania. He showed up eight months ago and started buying every
      piece Lucia made. At first she was flattered. Then... boh, it
      got weird. He wanted private commissions, private viewings, private
      everything. She said no and he didn't take it well.

      And EdilMare — minchia, don't get me started. They're building
      on the promontory. Protected land. Lucia was the only one brave
      enough to document it.
    effects: { trust_rosa: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Raimondo -> rosa_raimondo
      - Ask about EdilMare -> rosa_edilmare
      - Thank her and move on -> quest1_hub

  rosa_raimondo:
    type: message
    text: >
      ROSA: Raimondo? Tipo, the first time he came here he seemed
      normal. Bought a coffee, asked about local art. I sent him to
      Lucia's workshop. He bought three pieces that day. Three.

      Then he kept coming back. Every weekend from Catania. He'd sit
      in my bar for hours watching her workshop across the piazza.
      When she stopped selling to him — she said he made her
      uncomfortable — he started buying through intermediaries. She'd
      find out and refuse those too.

      Last month she told me: "Rosa, he follows my location. He
      always shows up where I am." Minchia, that's not a collector.
      That's something else.
    effects: { trust_rosa: "+5" }
    choices:
      - Ask about EdilMare -> rosa_edilmare
      - Move on -> quest1_hub

  rosa_edilmare:
    type: message
    text: >
      ROSA: EdilMare started the project six months ago. Luxury
      apartments on the promontory — Punta Azzurra, the most beautiful
      spot on this coast. It's zona protetta. Vincolo paesaggistico.
      You can't build there. But they got permits. From the comune.
      From the sovraintendenza. From everyone.

      How? Because the sindaco's surname is Ferrara. The assessore's
      surname is Ferrara. The avvocato's surname is Ferrara. The
      direttore del cantiere's surname is Ferrara. Minchia, they're
      all Ferrara. All family. All connected.

      Lucia had photos of the construction destroying ancient ruins.
      Greek ruins. Under the dirt they're pouring concrete over. She
      went to the sovraintendenza. Nothing. She went to the prefettura.
      Nothing. She started posting online. And then she disappeared.
    effects: { trust_rosa: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Giuseppe (fisherman, saw things) ---

  giuseppe_intro:
    type: tweet
    from: giuseppe
    text: >
      cinquant'anni di mare e non ho mai visto il promontorio così.
      lo stanno distruggendo. @lucia_ferrante aveva ragione. e adesso
      è sparita. fate voi il collegamento.
    effects: { trust_giuseppe: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Giuseppe -> giuseppe_talk

  giuseppe_talk:
    type: message
    text: >
      GIUSEPPE: I've fished this coast since I was twelve. I know
      every rock, every current, every colour the water makes at
      sunset. And I'm telling you — what they're doing to Punta
      Azzurra is criminal. Concrete dust in the sea. Ancient stones
      smashed to rubble. The fish are gone from that area.

      Lucia dove down there with her camera. She found Greek amphorae
      fragments in the rubble. Pieces of a temple floor. Two thousand
      years of history and they're burying it under a parking garage
      for luxury apartments.

      She documented everything. Then poof — gone.
    effects: { trust_giuseppe: "+10" }
    choices:
      - Did you see anything unusual recently? -> giuseppe_night
      - Move on -> quest1_hub

  giuseppe_night:
    type: message
    text: >
      GIUSEPPE: The night before she vanished — I was bringing in my
      boat, around midnight. I saw lights at her workshop. Not
      unusual, she works late. But there was a car parked outside. A
      black SUV. Tinted windows. EdilMare plates. I recognised it
      from the construction site.

      At midnight. In front of a ceramista's workshop.

      I wrote down the plate number. Nobody has asked me for it.
    effects: { trust_giuseppe: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Alessia (teen, ceramics student) ---

  alessia_intro:
    type: tweet
    from: alessia
    text: >
      minchia fra non ce la faccio più. @lucia_ferrante è tipo la
      persona più importante di questo paese per me. mi ha insegnato
      tutto. non se ne è andata così. qualcuno sa qualcosa? parlate
      cazzo
    effects: { trust_alessia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Alessia -> alessia_talk_early

  alessia_talk_early:
    type: message
    text: >
      ALESSIA: ma chi sei? boh va bene comunque. guarda, lucia tipo
      è una persona incredibile. mi ha insegnato a lavorare l'argilla
      quando avevo dodici anni. ogni sabato al laboratorio. era più
      di una maestra fra, era tipo una sorella maggiore.

      e adesso ho il cazzo di paura perché tommaso ha visto una roba
      strana al porto l'altra sera ma non vuole parlarne. dice che
      è niente ma minchia, non è niente per niente sah
    effects: { trust_alessia: "+10" }
    choices:
      - What did Tommaso see? -> alessia_tommaso_hint
      - Move on -> quest1_hub

  alessia_tommaso_hint:
    type: message
    text: >
      ALESSIA: boh non so esattamente. tipo era in giro la sera
      tardi e ha visto qualcuno al laboratorio di lucia. che tipo
      metteva delle cose in una macchina. non so chi era ma tommaso
      si è cagato sotto e non vuole dire niente.

      devi parlarci tu però, lui tipo è diffidente con chi non
      conosce. inizia a parlare di pesca o di skate e magari si
      apre minchia
    effects: { trust_alessia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Porticello. A Sicilian coastal town
      built around the sea and the old harbour. A ceramics artist who
      was documenting illegal construction. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Francesca (Lucia's flatmate) -> francesca_q1
      - Talk to Salvatore (Lucia's brother) -> salvatore_q1
      - Check what Valentina (Lucia's sister) is saying -> valentina_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Francesca Q1 ---

  francesca_q1:
    type: tweet
    from: francesca
    text: >
      se qualcuno ha notizie di @lucia_ferrante vi prego chiamatemi.
      la sua stanza è intatta. le sue mani sono ancora sporche di
      argilla sul tavolo. non è uscita preparandosi per un viaggio.
    effects: { trust_francesca: "+5", contacts_followed: "+1" }
    choices:
      - DM Francesca -> francesca_q1_talk

  francesca_q1_talk:
    type: message
    text: >
      FRANCESCA: I appreciate you writing but I don't know you.
      Lucia has a lot of friends here. I'm sure she'll come back.

      ...I keep telling myself that. I don't believe it anymore.

      [Francesca is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_francesca: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Salvatore Q1 ---

  salvatore_q1:
    type: tweet
    from: salvatore
    text: >
      mia sorella È SPARITA e i carabinieri mi dicono che forse è
      partita per un viaggio??? MA CHE CAZZO VUOI. lei non parte
      senza avvisare. esco ogni mattina con la barca a cercarla
      lungo la costa. qualcuno mi deve spiegare.
    effects: { trust_salvatore: "+5", contacts_followed: "+1" }
    choices:
      - DM Salvatore -> salvatore_q1_talk

  salvatore_q1_talk:
    type: message
    text: >
      SALVATORE: Chi sei? Un altro stronzo che mi dice di stare
      calmo? Mia sorella mi ha chiamato la notte prima di sparire.
      Ha detto che aveva qualcosa di grosso. Ha detto "se mi succede
      qualcosa, guarda EdilMare." Poi ha riattaccato.

      È l'ultima volta che l'ho sentita.
    effects: { trust_salvatore: "+10" }
    choices:
      - What do you think happened? -> salvatore_theory
      - Move on -> quest1_hub

  salvatore_theory:
    type: message
    text: >
      SALVATORE: I think she found proof that EdilMare is destroying
      protected land and they shut her up. But I also think that
      stronzo of a collector — Raimondo — knows more than he says.
      The way he talks about her art... minchia, it's not about art.
      It's about her.

      Lucia told me months ago that someone was following her. She
      found her workshop door open twice when she'd locked it. She
      thought it was nothing. I don't think it was nothing.
    effects: { trust_salvatore: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Valentina Q1 ---

  valentina_q1:
    type: tweet
    from: valentina
    text: >
      sto arrivando da palermo. lucia non rispondeva da tre giorni
      e nessuno mi ha avvisato. com'è possibile che un'intera città
      non sappia dov'è una ragazza di venticinque anni?
    effects: { trust_valentina: "+5", contacts_followed: "+1" }
    choices:
      - DM Valentina -> valentina_q1_talk

  valentina_q1_talk:
    type: message
    text: >
      VALENTINA: You're investigating? Good. Because nobody else
      seems to give a damn. The carabinieri are useless. The sindaco
      won't take my calls. This town closes ranks when it suits them.

      Lucia was the bravest person I know. She moved here from
      Palermo to make ceramics by the sea and instead she found
      corruption and she couldn't look away. That's who she is.

      Find her. Please.
    effects: { trust_valentina: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Lucia went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Tommaso (was out late, saw someone at the workshop) -> tommaso_interview
      - Find Enzo (harbour master, works late) -> enzo_interview
      - Find Giuseppe (fisherman, saw the SUV) -> giuseppe_interview_q2
      - Find Agata (pharmacist, opens early, saw something) -> agata_interview

  # --- Tommaso (saw someone at Lucia's workshop) ---

  tommaso_interview:
    type: tweet
    from: tommaso
    text: >
      sessione al porto tipo assurda oggi ma l'atmosfera è strana
      fra. tipo c'è qualcosa che non va in questo paese. boh non so
      come spiegarlo
    effects: { trust_tommaso: "+5" }
    choices:
      - Ask Tommaso about that evening -> tommaso_talk

  tommaso_talk:
    type: message
    text: >
      TOMMASO: fra ok ma giurami che non lo dici a nessuno. tipo ero
      al porto verso le 21 a fare skate e ho visto quel tizio — il
      collezionista, raimondo — davanti al laboratorio di lucia. stava
      tipo provando la porta. quando ha visto che era chiusa ha
      guardato dalle finestre. poi si è messo a scattare foto tipo
      dell'interno.

      quando mi ha visto è partito di corsa verso la macchina. fra
      minchia era troppo strano. tipo io non ho detto niente perché
      chi mi crede? sono un ragazzino con lo skate. merda.
    effects:
      trust_tommaso: "+10"
      night_witnesses: "+1"
      collector_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Enzo (harbour master, late-night activity) ---

  enzo_interview:
    type: tweet
    from: enzo
    text: >
      Promemoria: il porto è interdetto tra le 22 e le 6.
      Ho riscontrato passaggi non autorizzati nelle ultime notti.
    effects: { trust_enzo: "+5" }
    choices:
      - Ask Enzo what he saw -> enzo_talk

  enzo_talk:
    type: message
    text: >
      ENZO: I was locking up the harbour office around 23h. I saw
      Lucia's Fiat Panda still parked near her workshop. And a black
      SUV — EdilMare plates — pulled up. Two men got out. One of them
      I recognised: Donato Ferrara, the site director.

      They went into the workshop. They were inside for maybe twenty
      minutes. When they came out, they were carrying boxes. I couldn't
      see what was in them from that distance but they loaded them
      into the SUV.

      At 23h. At a ceramista's workshop. That's not normal.

      I noted it in my harbour log. Nobody has asked to see it.
    effects:
      trust_enzo: "+10"
      night_witnesses: "+1"
      construction_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Giuseppe Q2 (saw Lucia leaving) ---

  giuseppe_interview_q2:
    type: tweet
    from: giuseppe
    text: >
      non dormo più bene. quella notte ho visto troppo e detto troppo
      poco.
    effects: { trust_giuseppe: "+5" }
    choices:
      - Ask Giuseppe about that night -> giuseppe_talk_q2

  giuseppe_talk_q2:
    type: message
    text: >
      GIUSEPPE: I told you about the SUV. But there's more. After the
      men left — maybe an hour later, so around midnight — I saw
      Lucia. She came running out of the house she shares with
      Francesca. She had a bag, a laptop, something wrapped in cloth
      — probably ceramics. She ran to her car.

      Before she drove off, she stopped. Looked around. Like she was
      terrified. Then she drove toward the old coastal road, the one
      that goes up to the promontory.

      Nobody drives to the promontory at midnight. Nobody.
    effects:
      trust_giuseppe: "+10"
