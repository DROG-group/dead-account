    text: >
      DataVõrk OÜ — public records in the Estonian Business Registry.

      Founded 3 years ago. Registered address: Rannaküla, Harju county.
      Listed purpose: "smart city infrastructure and data analytics."
      Revenue last year: €2.1 million. For a town of 3,000 people.
      That's a lot of money from traffic counters.

      Board members: Siim Paas (CEO), and two names registered in
      Cyprus. The Cyprus connection is typical of companies trying
      to obscure their ownership and data flows under EU law.

      Their privacy policy — buried on their website — says data
      is "processed in accordance with GDPR." But there's a clause:
      "anonymised aggregate data may be shared with third-party
      partners for research purposes." That "anonymised" is doing
      a lot of heavy lifting.
