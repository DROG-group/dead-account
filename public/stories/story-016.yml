entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN RANNAKÜLA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to rannakyla.social — the community Mastodon instance for
      the coastal town of Rannaküla, Estonia.

      The local feed is unsettled. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name everywhere:
      @marten_tamm.

      A programmer. Digital artist. Made glitch art from the Estonian
      coastline. People loved him. He hasn't posted in six days.
    choices:
      - Look at his profile -> marten_profile

  marten_profile:
    type: tweet
    from: marten
    text: "DataVõrk's 'smart city' sensors are harvesting way more than traffic data. I've cracked their API. uploading proof tonight."
    choices:
      - That's his last real post... -> static_post

  static_post:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a burst of digital static. Black and white noise. Posted at 4am.
      No caption.

      His friends say that's not his work. Marten was a pixel artist
      who spent hours on every piece. This is just garbage data. And
      Marten never posted at 4am — he was a morning person.

      The police say he probably went to Tallinn for a job. Nobody
      believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: komissar
    text: >
      Oleme saanud teate Rannaküla elaniku kohta. Praegusel hetkel
      puuduvad tõendid kuritegevusele viitamiseks. Igasugune
      informatsioon palun edastada telefonil 112 või jaoskonda.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are a mess. His best friend @rasmus_kask is
      furious. His sister @liina_tamm is driving down from Tartu.
      His ex @kadri_rebane is posting old photos of them together.
      The café owner @piret_aas says the town feels wrong without him.

      And the journalist @heli_rand hasn't said a word since
      Marten's last post about DataVõrk. That's suspicious.

      Nobody believes the police. Nobody thinks Marten just
      "went to Tallinn."
    effects: { trust_rasmus: "+5", trust_liina: "+5" }
    choices:
      - Start following Marten's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Rannaküla. Follow Marten's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Piret (café owner, knows everyone) -> piret_intro
      - Talk to Toomas (fisherman, old school) -> toomas_intro
      - Talk to Kertu (teen coder, looks up to Marten) -> kertu_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Marten with ordinary small-town life:
      harbour schedules, the café's daily specials, weather warnings
      for the coast.

      Key names: Rasmus (best friend, designer, furious), Kadri (ex,
      photographer, worried), Liina (sister, coming from Tartu),
      and the teens — Kertu, Rain, Anu — who Marten taught to code.

      Also prominent: DataVõrk OÜ, the data startup that set up in
      the old fish factory. Their posts are all "smart city" buzzwords.
      Marten's posts were the opposite — raw, critical, real.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Piret -> piret_intro
      - Talk to Toomas -> toomas_intro
      - Talk to Kertu -> kertu_intro

  # --- Piret (social map) ---

  piret_intro:
    type: tweet
    from: piret
    text: >
      Kohvik on lahti aga rõõmu pole. @marten_tamm, su koht ootab
      sind. Tule tagasi.
    effects: { trust_piret: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Piret -> piret_talk

  piret_talk:
    type: message
    text: >
      PIRET: Oh, you're new here? Welcome, though the timing is
      terrible. Everyone's worried about Marten.

      Let me give you the picture. Rasmus is Marten's best friend —
      they grew up together, do freelance design work. Kadri is his
      ex-girlfriend, a photographer. Still close, or at least she
      tried to be. Liina is his older sister, studying in Tartu.

      And then there's DataVõrk. Siim Paas moved his startup here
      two years ago with big promises — jobs, smart infrastructure,
      put Rannaküla on the map. The vald loved it. But Marten said
      their sensors were collecting personal data. Tracking where
      people walk, when they're home, who visits who.

      He was digging into their code. And now he's gone. You see
      the problem, right?
    effects: { trust_piret: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the anonymous admirer -> piret_admirer
      - Ask about DataVõrk -> piret_datavork
      - Thank her and move on -> quest1_hub

  piret_admirer:
    type: message
    text: >
      PIRET: There's something else. A few months ago, someone started
      leaving things for Marten at the café. Little gifts — a USB drive
      with fan art of his work, a printed screenshot of his code with
      annotations. No name. Always when he wasn't here.

      He thought it was cute at first. Then the gifts got... personal.
      A photo of him working at his usual table, taken from outside.
      A note that said "I understand your art better than anyone."

      He stopped laughing about it after that.
    effects: { trust_piret: "+5" }
    choices:
      - Ask about DataVõrk -> piret_datavork
      - Move on -> quest1_hub

  piret_datavork:
    type: message
    text: >
      PIRET: DataVõrk set up in the old fish processing plant by the
      harbour. Siim Paas — the CEO — walks around like he owns the
      town. The vald gave him tax breaks, free office space, even ran
      fibre optic cable at the town's expense. Andres Sepp, our
      vallavanem, acts like Siim is Estonia's Elon Musk.

      Marten saw through it. He found the sensors they installed —
      not just traffic counters. Cameras with facial recognition.
      Wi-Fi sniffers logging every phone that passes. All feeding
      into DataVõrk's servers.

      He said he cracked their API. Found the raw data. Then — poof.
      Gone.
    effects: { trust_piret: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Toomas (fisherman, old school) ---

  toomas_intro:
    type: tweet
    from: toomas
    text: >
      35 aastat merel. ma tean millal midagi on valesti. ja praegu on
      midagi väga valesti. @marten_tamm oli aus poiss. ta ei lähe
      kuhugi ilma ütlemata.
    effects: { trust_toomas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Toomas -> toomas_talk

  toomas_talk:
    type: message
    text: >
      TOOMAS: I've fished this coast my whole life. I don't understand
      computers but I understand people. Marten was a good kid. Came
      to the harbour every morning for sunrise — said the light was
      good for his art. Always polite. Always honest.

      He told me the cameras on the harbour wall were watching us.
      Not just boats — us. He showed me on his phone — the cameras
      track faces. Mine, yours, the old ladies walking their dogs.
      All going to some server in DataVõrk's building.

      The night before he disappeared, I saw him at the harbour.
      Late. Around midnight. He was sitting on the pier, laptop open.
      Looked agitated. I called out but he waved me off.

      Then I saw a car pull up. Dark car, tinted windows. He closed
      his laptop fast and walked toward it. That's the last I saw.
    effects: { trust_toomas: "+10" }
    choices:
      - Who was in the car? -> toomas_car
      - Move on -> quest1_hub

  toomas_car:
    type: message
    text: >
      TOOMAS: Couldn't see. Tinted windows, no lights. But the car
      had a sticker on the back window — DataVõrk logo. I know because
      they gave those stickers to everyone at the launch party. Most
      people threw them away. Whoever drives that car is connected to
      DataVõrk.

      I told the police. They wrote it down and that was it.
    effects: { trust_toomas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kertu (teen coder, witness tease) ---

  kertu_intro:
    type: tweet
    from: kertu
    text: >
      kurat. @marten_tamm õpetas mulle esimese koodi kirjutama. ta
      oli mingi parim inimene siin linnas tegelt. kui keegi midagi
      teab siis rääkige perse ometi
    effects: { trust_kertu: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kertu -> kertu_talk_early

  kertu_talk_early:
    type: message
    text: >
      KERTU: sa oled uus vä? mingi halb timing tegelt. marten on
      nagu... ta oli meile kõigile nagu suur vend. õpetas mulle
      pythonit, rainile muusikat tegema arvutiga, anule digitaalset
      kunsti. tõsiselt lahe tüüp.

      ja nüüd on ta kadunud ja keegi ei tee mitte midagi. politsei
      on mingi nii perse tegelt. "läks tallinna" vittu küll, marten
      vihkas tallinnat.

      ja rain nägi mingi veidi asju aga ta ei taha rääkida. ta on
      mingi hirmul tegelt
    effects: { trust_kertu: "+10" }
    choices:
      - What did Rain see? -> kertu_rain_hint
      - Move on -> quest1_hub

  kertu_rain_hint:
    type: message
    text: >
      KERTU: ma ei tea täpselt. rain oli mingi sadamas skeittimas ja
      nägi kedagi marteni korteri juures. mingi tüüp kes lihtsalt
      seisis seal pimedas ja vaatas aknaid. rain ütles et see oli
      mingi creepy perse tegelt.

      aga rain ei räägi kellelegi sest viimasel ajal on mingi kahtlane
      tüüp teda jälginud ka ja ta flipib täiega. proovi temaga enne
      skeidi teemadel rääkida vä, siis ta avaneb mingi rohkem
    effects: { trust_kertu: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Rannaküla. A small Estonian coastal
      town trying to be modern. A young programmer who exposed a data
      harvesting operation. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Rasmus (Marten's best friend) -> rasmus_q1
      - Talk to Kadri (Marten's ex) -> kadri_q1
      - Check what Liina (Marten's sister) is saying -> liina_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Rasmus Q1 ---

  rasmus_q1:
    type: tweet
    from: rasmus
    text: >
      @marten_tamm vend kus sa oled. helista mulle. kirjuta mulle.
      midagi. see ei ole naljakas enam. me olime neljapäeval koos ja
      kõik oli normaalne. keegi selgitage mis perse siin toimub
    effects: { trust_rasmus: "+5", contacts_followed: "+1" }
    choices:
      - DM Rasmus -> rasmus_q1_talk

  rasmus_q1_talk:
    type: message
    text: >
      RASMUS: Who are you? Another nosy person who wants gossip about
      my best friend? He's missing, not dead, not a story.

      ...sorry. I'm losing it. We were together Thursday evening at
      the kohvik. Normal stuff — he showed me some new pixel art.
      He mentioned DataVõrk again, said he'd found something big in
      their backend. Refused to tell me details. Said "the less you
      know the better."

      That's the last time I saw him.

      [Rasmus is angry. He'll open up more once he trusts you.]
    effects: { trust_rasmus: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kadri Q1 ---

  kadri_q1:
    type: tweet
    from: kadri
    text: >
      vanad pildid @marten_tamm'ist. suvi merel. ta naeris alati nii
      päriselt. kurat ma loodan et ta on kuskil turvaline.
    effects: { trust_kadri: "+5", contacts_followed: "+1" }
    choices:
      - DM Kadri -> kadri_q1_talk

  kadri_q1_talk:
    type: message
    text: >
      KADRI: We broke up six months ago. My decision. But we stayed
      friends. Or... we tried. Marten is intense. About his art,
      his code, everything. He doesn't do halfway.

      He called me two days before he vanished. Said someone was
      following him. Not DataVõrk — someone else. Someone who kept
      showing up wherever he was. He sounded scared. Marten never
      sounds scared.

      And there was this account — @eerik404 — sending him creepy
      messages. I told him to go to the police. He laughed and said
      the police in Rannaküla work for Andres Sepp and Andres Sepp
      works for DataVõrk.
    effects: { trust_kadri: "+10" }
    choices:
      - Tell me about eerik404 -> kadri_eerik
      - Move on -> quest1_hub

  kadri_eerik:
    type: message
    text: >
      KADRI: @eerik404. Anonymous account, created maybe four months
      ago. Comments on everything Marten posts. At first it was
      harmless — "love your work" type stuff. Then it got intense.
      Long messages about how Marten's art "speaks to their soul."
      Analysing every pixel of his work.

      Then it got dark. "I saw you at the harbour today." "The light
      on your face at the café was beautiful." "Why don't you
      respond? I'm the only one who really gets you."

      Marten blocked the account. It came back under a different
      name. He blocked that too. It kept coming back.
    effects: { trust_kadri: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Liina Q1 ---

  liina_q1:
    type: tweet
    from: liina
    text: >
      mu vend on KADUNUD ja politsei ütleb mingi "ilmselt läks
      tallinna"??? MARTEN EI LÄHE KUHUGI ILMA MULLE ÜTLEMATA.
      sõidan tartust alla. keegi hakkab rääkima.
    effects: { trust_liina: "+5", contacts_followed: "+1" }
    choices:
      - DM Liina -> liina_q1_talk

  liina_q1_talk:
    type: message
    text: >
      LIINA: You don't know me and I don't know you but I'm desperate.
      Marten called me the night before he disappeared. He said he'd
      found proof that DataVõrk was selling Rannaküla residents'
      personal data — locations, habits, daily routines — to third
      parties. Including, he said, some very sketchy companies.

      He said "if something happens, look at what's on the DataVõrk
      servers." Then the line went dead.

      I've been trying to reach the police but Komissar Tammsaare
      keeps saying there's "no evidence of wrongdoing." They won't
      even look at Marten's computer.
    effects: { trust_liina: "+10" }
    choices:
      - What do you think happened? -> liina_theory
      - Move on -> quest1_hub

  liina_theory:
    type: message
    text: >
      LIINA: I think DataVõrk found out Marten had cracked their
      system and they silenced him. Siim Paas has connections in
      Tallinn — investors, politicians. The vallavanem Andres Sepp
      practically kisses his shoes.

      But there's something else. Marten told me months ago that
      someone was obsessed with him. Online and offline. He said
      this person knew things about his daily routine that you'd
      only know if you were watching. And the creepiest part —
      Marten said this person seemed to have access to DataVõrk's
      tracking data. They always knew where he was.

      Two threats. The company. And someone using the company's
      tools to stalk him.
    effects: { trust_liina: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Marten went silent. Multiple
      people saw or heard things. Piece together the timeline from
      witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Rain (was skating at the harbour) -> rain_interview
      - Find Juhan (harbour master, works late) -> juhan_interview
      - Find Margus (electrician, was fixing a streetlight) -> margus_interview
      - Find Piret (closes the café late, saw something) -> piret_interview

  # --- Rain (saw someone watching Marten's flat) ---

  rain_interview:
    type: tweet
    from: rain
    text: >
      mingi vibe on praegu nii off siin rannakülas. ei tea kuidas
      seletada aga mingi kõik on valesti tegelt
    effects: { trust_rain: "+5" }
    choices:
      - Ask Rain about that evening -> rain_talk

  rain_talk:
    type: message
    text: >
      RAIN: ok vend aga sa ei räägi kellelegi vä. ma olin sadamas
      skeittimas mingi kella üheksa paiku õhtul. ja ma nägin seda
      tüüpi — seda DataVõrgi venda indrekit — marteni maja ees. ta
      lihtsalt seisis seal pimedas ja vaatas aknaid. mingi telefon
      käes, tegi pilte vä midagi.

      kui ta mind nägi siis ta kõndis minema tegelt kiirelt. aga
      see oli mingi nii creepy raisk. kes kurat seisab kellegi maja
      ees pimedas ja pildistab?

      ma oleks pidanud midagi ütlema aga ma olin mingi... vittu ma
      ei tea. ma olin hirmul tegelt
    effects:
      trust_rain: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Juhan (harbour master, saw late-night activity) ---

  juhan_interview:
    type: tweet
    from: juhan
    text: >
      Meeldetuletus: sadama territoorium suletud kell 22:00-06:00.
