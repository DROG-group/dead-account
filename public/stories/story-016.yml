      the record — I wanted to investigate DataVõrk. My superior at
      the Harju prefecture told me to stand down. He said the
      Andmekaitse Inspektsioon would "handle it through proper
      channels." That's code for "don't touch it."

      Vallavanem Sepp called me personally and said DataVõrk is
      "vital to Rannaküla's economic future." He made it clear my
      position depends on cooperation.

      The stalking — I didn't even know about that until now. If
      you have evidence of jälitamine, that's criminal. I can act
      on that regardless of what Sepp or anyone else says.

      Bring me something solid and I'll reopen the case.
    effects:
      trust_komissar: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Marten than anyone in Rannaküla. Who is responsible?
    choices:
      - Confront Indrek Saar (the obsessive stalker) -> confront_indrek
        when:
          state: obsession_evidence
          gte: 5
      - Confront Siim Paas (the DataVõrk CEO) -> confront_siim
        when:
          state: corporate_evidence
          gte: 3
      - Confront Vallavanem Andres Sepp (political protection) -> confront_andres
      - I need more evidence -> investigation_hub

  # --- ENDING A: Indrek (Best Ending) ---

  confront_indrek:
    type: message
    text: >
      You present your evidence to Indrek:

      "I know @eerik404 is your account. I know you used DataVõrk's
      surveillance system to track Marten's location 847 times. I
      know you watched his flat. I know you went through his rubbish.
      I know you sent him a keylogger. I have witnesses and I have
      the access logs."
    choices:
      - Send -> indrek_response

  indrek_response:
    type: message
    text: >
      Indrek doesn't reply for a long time. Then:

      INDREK: You don't understand. Marten's work is genius. His
      code, his art — nobody appreciates it like I do. I wasn't
      stalking him. I was studying him. Learning from him. I needed
      to understand how he thinks, how he moves, what inspires him.

      He wouldn't talk to me. I tried. I offered to collaborate.
      He said no. But I knew if I just understood him better, he'd
      see we're the same. We think the same way. We belong together
      — working together, I mean.

      That's not obsession. That's admiration.

      It's obsession. And it's criminal.

      You've already sent the evidence to Komissar Tammsaare. And
      to Heli Rand.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Komissar Tammsaare reopens the case. With your evidence — the
      anonymous account, the surveillance abuse, the access logs,
      the witness testimonies, the keylogger — Indrek is arrested
      for jälitamine and andmete kuritarvitamine. His flat is
      searched. They find a wall covered in printouts of Marten's
      art, photos of Marten taken from distances, and a notebook
      logging Marten's daily movements for four months.

      Heli Rand, armed with Marten's full evidence package,
      publishes the DataVõrk story in Postimees. The Andmekaitse
      Inspektsioon orders an emergency audit. DataVõrk's servers
      are seized. Siim Paas faces criminal charges for GDPR
      violations and selling personal data to foreign companies.
      Vallavanem Sepp resigns when the contract is made public.

      All 52 sensors are removed from Rannaküla within a week.

      And Marten Tamm, reading the story from a friend's summer
      house on Saaremaa, calls his sister for the first time in
      nine days.

      "Tulen koju."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: marten
    text: >
      avatud lähtekood igavesti. andmed peavad olema vabad — aga
      mitte meie omad ilma loata. rannaküla, ma tulen tagasi.
      aitäh et te ei loobunud.
    choices:
      - The End -> game_complete

  # --- ENDING B: Siim (Partial Ending) ---

  confront_siim:
    type: message
    text: >
      You present the surveillance evidence to Siim Paas:

      "I have DataVõrk's full internal database. Raw tracking data
      for every Rannaküla resident. Contracts with data brokers in
      the UK, Singapore, and Russia. Your own emails about
      'maintaining plausible deniability.' I have it all."
    choices:
      - Send -> siim_response

  siim_response:
    type: message
    text: >
      SIIM: This message has been forwarded to our legal counsel.
      Any publication of proprietary business information obtained
      through unauthorized system access will result in immediate
      legal proceedings. DataVõrk OÜ operates in full compliance
      with applicable data protection regulations.

      But it's too late. You've sent the evidence to Heli, to the
      Kodanikuühendus, and to the Andmekaitse Inspektsioon.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The data harvesting story breaks. DataVõrk is ordered to
      cease operations pending investigation. The sensors come down.
      Forty jobs in Rannaküla are lost. The town is divided — some
      are relieved, others blame the whistleblowers.

      But Marten?

      Without the stalking evidence, Indrek is never investigated.
      He moves to Tallinn and starts a new job at another tech
      company. He creates a new anonymous account. He finds Marten's
      new social media profiles within days.

      Six months later, Marten reads about DataVõrk's closure
      online. He returns to Rannaküla quietly. He changes his
      routines. He covers his webcam. He checks over his shoulder
      when he walks to the harbour.

      He knows someone is still watching.

      The corporation is exposed. But the person who terrorised
      Marten walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: marten
    text: "olen tagasi. sensorid on maas. aga keegi vaatab ikka. seda tunnet ei saa maha."
    choices:
      - The End -> game_complete

  # --- ENDING C: Vallavanem (Wrong Ending) ---

  confront_andres:
    type: message
    text: >
      You confront Vallavanem Andres Sepp with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> andres_response

  andres_response:
    type: tweet
    from: peeter
    text: >
      Minu klient on teadlik teie süüdistustest. Igasugune
      laimavate materjalide avalikustamine toob kaasa viivitamatu
      kohtumenetluse. — Veski & Partnerid, Tallinn
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The vallavanem's lawyer buries your accusation. Without a
      direct link between Sepp and DataVõrk's data sales — and
      there isn't one beyond political protection and a favourable
      contract — your evidence is insufficient to touch him.

      DataVõrk continues to operate. The sensors keep watching.
      Indrek keeps tracking. Marten stays in hiding.

      Three months later, @eerik404 creates a new account. It
      follows Marten's sister.

      Then his ex.

      Then his friends.
    choices:
      - The End -> game_complete

  # =====================================================================
