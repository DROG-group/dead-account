  # --- Water Investigation ---

  water_investigation:
    type: message
    text: >
      Astrid's published water quality data — what she shared before
      she disappeared — shows contamination at seven sampling points.
      The mine's official reports show the same points as clean.

      The discrepancy is not ambiguous. One set of data is correct
      and the other is fabricated. Independent lab analysis from
      Umea University confirms Astrid's readings.

      The mine's environmental reports were prepared by "Arctic
      Environmental Consulting AB." The company's registered address
      is the same building as Norrland Mineral's Stockholm office.

      They tested their own water and found it clean. Surprising
      nobody except the regulators.
    effects:
      pollution_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to pollution thread -> pollution_hub

  # --- Aslak reindeer ---

  aslak_reindeer:
    type: message
    text: >
      ASLAK: Last spring we lost four reindeer calves. They drank
      from the river. The vet — Karin — found heavy metal poisoning.
      We reported it. The mine said it was "natural mineral deposits."

      Our sameby has grazed these lands for generations. There were
      no "natural mineral deposits" before the mine.

      Astrid tested the water where the calves died. Cadmium at
      levels that would kill a human child. She cried when she saw
      the results. She said "I will make them answer for this."

      She was the first outsider who treated our knowledge as equal
      to their science. She listened to our elders. She walked the
      land with us.

      And now she is gone.
    effects:
      trust_aslak: "+15"
      pollution_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to pollution thread -> pollution_hub

  # --- Permit Investigation ---

  permit_investigation:
    type: message
    text: >
      The mine's environmental permit was renewed 18 months ago.
      The renewal required an independent environmental assessment.
      The assessment was done by Arctic Environmental Consulting — the
      mine's own consultancy.

      Condition 14 of the permit requires quarterly water sampling at
      downstream monitoring points. The mine self-certifies compliance.
      Nobody checks.

      Hanna Eriksson, the kommunalrad, signed the renewal. The kommun
      receives 3 million kronor annually in mining taxes. The renewal
      hearing had no public comment period — it was published in the
      kommun bulletin for 14 days during midsommar. Nobody noticed.
    effects:
      pollution_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to pollution thread -> pollution_hub

  # --- Sofia ---

  sofia_interview:
    type: message
    text: >
      SOFIA: I process environmental permits for Lansstyrelsen. The
      Norrland Mineral file has been on my desk twice. Both times I
      flagged concerns about the monitoring data. Both times I was
      told to "prioritize other cases."

      My supervisor has a meeting with Anders Bergman every quarter.
      He calls it "stakeholder engagement." I call it regulatory
      capture.

      Astrid sent me her data three weeks ago. Formally, through
      official channels. My supervisor acknowledged receipt and then
      it disappeared from our system. Literally — the file was deleted
      from our case management software.

      I have a personal backup. If you need it, I need a guarantee
      that my name stays out of it.
    effects:
      trust_sofia: "+20"
      pollution_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to pollution thread -> pollution_hub

  # --- Karin ---

  karin_interview:
    type: message
    text: >
      KARIN: I treated the reindeer calves. The blood work was clear:
      heavy metal toxicity. Cadmium and lead. I wrote a report for
      the sameby and filed one with the county vet office.

      Two weeks later I received a call from a lawyer representing
      Norrland Mineral. He suggested my findings were "premature" and
      that further analysis was needed. He offered to fund it — through
      a lab of their choosing.

      I declined. My report stands. Astrid used it in her research.
    effects:
      trust_karin: "+10"
      pollution_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to pollution thread -> pollution_hub

  # --- Niklas ---

  niklas_interview:
    type: message
    text: >
      NIKLAS: I manage the Silverby operation. Everything we do is
      within permit conditions. Our environmental monitoring meets all
      regulatory requirements.

      Astrid Lindqvist trespassed on company property multiple times.
      We filed complaints. The police issued warnings. She continued.

      Her disappearance is unfortunate but unrelated to our operations.
      We cooperate fully with authorities.
    effects: { trust_niklas: "+5" }
    choices:
      - Back to pollution thread -> pollution_hub

  # --- Hanna (kommunalrad) ---

  hanna_interview:
    type: message
    text: >
      HANNA: As kommunalrad I must balance environmental concerns
      with economic reality. The mine provides 300 jobs directly and
      supports another 500 through the supply chain. That is 40% of
      Silverby's employment.

      Astrid's concerns were noted and forwarded to the appropriate
      authorities. The environmental permit was renewed through proper
      channels. Public consultation was held as required.

      I am sorry she is missing. But suggesting that the kommun had
      any involvement in her disappearance is irresponsible and
