entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SILVERBY
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to silverby.social — the community Mastodon instance for
      Silverby, a small town in northern Sweden. Pine forests, frozen
      lakes, and the dark of the polar winter.

      The feed is troubled. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      One name keeps appearing: @astrid_lindqvist.

      A climate activist and nature photographer. She ran a clean water
      campaign called Rena Alven. She documented pollution from a
      mining company operating near Sami reindeer land.

      She hasn't posted in eleven days.
    choices:
      - Look at her profile -> astrid_profile

  astrid_profile:
    type: tweet
    from: astrid
    text: "The water samples don't lie. The company's reports do. I'm publishing everything on Friday."
    choices:
      - That was her last real post... -> dead_post

  dead_post:
    type: message
    text: >
      Friday came. Nothing was published. Three days later, her account
      posted a single image: a photo of the northern lights. Beautiful.
      Empty. Posted at 4am.

      Her brother says she would never post without a message. The
      police say she is "traveling voluntarily." Her car was found at
      the trailhead near Kungsleden.
    choices:
      - Read the police statement -> police_statement
      - See what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: polisen
    text: >
      Polisen has received a report regarding a Silverby resident. The
      individual's vehicle has been located. There is currently no
      indication of a criminal matter. Anyone with information is asked
      to contact Polisen on 114 14.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The feed is anxious. Erik, her brother, is posting daily
      demands for action. Linnea from the university is worried about
      the research data. Aslak from the Sami community says Astrid
      was the only outsider who listened.

      And an anonymous account, @sven, posts: "She should have left
      the mine alone. The north does not forgive interference."

      Birgitta at the konditori says she has never seen the town so
      divided.
    effects: { trust_erik: "+5", trust_linnea: "+5" }
    choices:
      - Start following Astrid's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Silverby. A northern town divided between the jobs
      the mine brings and the damage it causes. Follow Astrid's
      contacts and understand the conflict.
    choices:
      - Talk to Birgitta at the konditori -> birgitta_intro
      - Talk to Aslak (Sami herder) -> aslak_intro
      - Check what the teens are saying -> saga_intro
      - Browse the feed -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is a mix of northern life — aurora photos, hockey
      scores, weather complaints, moose sightings — and worry about
      Astrid. The mine divides everything: half the town works there,
      the other half fears what it's doing to the water and the land.

      Key names: Erik (her brother, ranger), Linnea (researcher, has
      data), Gustav (newspaper editor, cautious), Mattias (her ex,
      Stockholm photographer, posting worried selfies).
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Birgitta -> birgitta_intro
      - Talk to Aslak -> aslak_intro
      - Check the teens -> saga_intro

  # --- Birgitta (social map) ---

  birgitta_intro:
    type: tweet
    from: birgitta
    text: >
      Konditoriet is open as always. Kanelbullar are warm. But Astrid's
      table is empty. She always sat by the window. Always ordered
      lingonberry tea.
    effects: { trust_birgitta: "+5", contacts_followed: "+1" }
    choices:
      - Talk to Birgitta -> birgitta_talk

  birgitta_talk:
    type: message
    text: >
      BIRGITTA: You're new? Welcome to Silverby. Sit. Have a bulle.

      Let me tell you about this town. The mine is everything and
      nothing. Half the families here depend on it for work. The other
      half watched their reindeer grazing land and their fishing lakes
      get poisoned.

      Astrid tried to bridge that divide. She wasn't against mining.
      She was against lying about the environmental impact. She took
      water samples that showed heavy metal contamination in the river
      downstream from the mine. The company's own reports said the
      water was fine.

      She had the data. She had the photographs. And now she's gone.
    effects: { trust_birgitta: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the mine company -> birgitta_mine
      - Ask about Mattias -> birgitta_mattias
      - Move on -> quest1_hub

  birgitta_mine:
    type: message
    text: >
      BIRGITTA: Norrland Mineral AB. Anders Bergman runs it from
      Stockholm. Niklas Borg is the local site manager. They talk
      about "green mining" and "sustainable extraction" but the river
      tells a different story.

      The kommun depends on the tax revenue. Hanna Eriksson, the
      kommunalrad, approved the expansion permit last year. The
      environmental impact assessment was done by a consultancy
      Anders recommended. Surprise: they found no problems.

      Astrid got independent samples tested at the university in Umea.
      Cadmium, lead, arsenic — all above safe levels. She was going
      to publish everything.
    effects: { trust_birgitta: "+5" }
    choices:
      - Ask about Mattias -> birgitta_mattias
      - Move on -> quest1_hub

  birgitta_mattias:
    type: message
    text: >
      BIRGITTA: Mattias is her ex-boyfriend. Photographer from
      Stockholm. They were together for two years. He moved up here
      for her, then moved back when it ended. That was six months ago.

      He didn't take it well. He still posts about her — photos from
      when they were together, quotes from her posts. He's in Silverby
      now, supposedly "looking for her." But he knows her passwords
      from when they were together.

      He was always jealous of her work. She spent more time with the
      river than with him, he used to say. Not as a joke.
    effects: { trust_birgitta: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Aslak (Sami perspective) ---

  aslak_intro:
    type: tweet
    from: aslak
    text: >
      The reindeer will not drink from the river near the mine. Animals
      know what we pretend not to. Astrid understood this.
    effects: { trust_aslak: "+5", contacts_followed: "+1" }
    choices:
      - Talk to Aslak -> aslak_talk

  aslak_talk:
    type: message
    text: >
      ASLAK: Astrid was the first person from the town who came to us,
      sat in our tent, drank our coffee, and listened. Really listened.

      Our reindeer grazing land extends to the river. For three
      generations, they drank from that water. Now they refuse. They
      know. The mine's tailings pond leaks into the groundwater. We
      reported it to Lansstyrelsen. They sent an inspector who looked
      at the mine's own data and said everything was fine.

      Astrid took her own samples. She walked the river for sixty
      kilometres, sampling every tributary. She found contamination
      at seven points, all downstream from the mine's operations.

      If her data is published, the mine cannot continue to lie.
    effects: { trust_aslak: "+10", contacts_followed: "+1" }
    choices:
      - Move on -> quest1_hub

  # --- Saga (teen witness) ---

  saga_intro:
    type: tweet
    from: saga
    text: >
      asssa typ ingen fattar hur viktigt astrids jobb var?? hon
      dokumenterade allt. sicken hjaltinna. och nu ar hon borta och
      alla bara "ah hon reser val" NEJ typ ngt ar fel
    effects: { trust_saga: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Saga -> saga_talk

  saga_talk:
    type: message
    text: >
      SAGA: hej!! ar du ny har? fett. asssa astrid var typ den enda
      vuxna som brydde sig om miljon har. hon lat oss folja med pa
      faltarbete och allt. ba visade oss hur man tar vattenprover.

      albin sag ngt konstigt vid gruvan i helgen. typ nagon som
      grävde vid dammen pa natten. med lampor. skapskumt.

      och wilma har screenshots fran astrids telefon. astrid visade
      henne innan hon forsvann. typ nagon som skickade massa msgs
      fran en fake profil
    effects: { trust_saga: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      Silverby is a town caught between industry and nature. A mine
      that provides jobs but poisons water. A woman who had the
      evidence to prove it. And a silence that feels rehearsed.
    choices:
      - Talk to Erik (Astrid's brother) -> erik_q1
      - Talk to Linnea (research partner) -> linnea_q1
      - Talk to Gustav (newspaper editor) -> gustav_q1
      - I'm ready to investigate the night she vanished -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Erik Q1 ---

  erik_q1:
    type: tweet
    from: erik
    text: >
      11 days. My sister has been gone 11 days. Her car is at
      Kungsleden trailhead. She would NEVER leave her camera behind.
      It was in the car. Astrid does not go anywhere without her camera.
    effects: { trust_erik: "+5", contacts_followed: "+1" }
    choices:
      - DM Erik -> erik_q1_talk

  erik_q1_talk:
    type: message
    text: >
      ERIK: I'm a ranger. I know the forest. I've searched every trail
      within 30 kilometres of the trailhead. Nothing. No tracks, no
      campsite, no sign of her.

      She didn't go hiking. Someone left her car there to make it
      look like she did. And they left her camera in the car — Astrid's
      most valuable possession. That's not someone going for a walk.
      That's someone being taken.

      The police say there's no evidence of foul play. I say the
      evidence IS the foul play.
    effects: { trust_erik: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Linnea Q1 ---

  linnea_q1:
    type: tweet
    from: linnea
    text: >
      The water quality data Astrid collected is significant. Peer
      review is underway. The findings will be published with or
      without her. Science does not stop.
    effects: { trust_linnea: "+5", contacts_followed: "+1" }
    choices:
      - DM Linnea -> linnea_q1_talk

  linnea_q1_talk:
    type: message
    text: >
      LINNEA: Astrid and I co-authored a paper on heavy metal
      contamination in the Silverby river system. Her field data is
      devastating — cadmium at 40 times the safe level, arsenic at 15
      times. All downstream from the mine.

      The paper was accepted for review. Publication was scheduled for
      next month. Now Astrid is gone and the mine's lawyers are
      contacting the journal claiming the data is "unverified."

      I still have my copies of the analysis. But Astrid's raw field
      data — the original sample logs, GPS coordinates, photographs —
      was on her laptop. Which is missing.
    effects: { trust_linnea: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Gustav Q1 ---

  gustav_q1:
    type: tweet
    from: gustav
    text: >
      Silverby Tidning reports: local environmental researcher Astrid
      Lindqvist has not been in contact with family or colleagues for
      over a week. Police describe the situation as non-criminal.
    effects: { trust_gustav: "+5", contacts_followed: "+1" }
    choices:
      - DM Gustav -> gustav_q1_talk

  gustav_q1_talk:
    type: message
    text: >
      GUSTAV: I've run this paper for 20 years. I know when a story
      is being managed. This one is being managed.

      Astrid came to me with her findings three weeks ago. I was
      preparing a feature. Then she disappeared and my biggest
      advertiser — Norrland Mineral — reminded me of the value of
      "balanced reporting."

      I want to publish. I need evidence that will withstand the
      legal pressure they will bring. Give me that and I'll run it.
    effects: { trust_gustav: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Astrid was last seen at Konditori Birgitta at 19:00 on a
      Tuesday. She told Birgitta she was "going to the river for
      final samples." Her car was found the next morning at Kungsleden
      trailhead, 30 km away.

      Collect witness accounts. You need at least 4.
    choices:
      - Find Albin (was near the mine that night) -> albin_interview
      - Find Per (hiking club, was on the trail) -> per_interview
      - Find Oskar (mechanic, works late) -> oskar_interview
      - Find Ingrid (library, overlooking the road) -> ingrid_interview

  # --- Albin (saw activity at the mine) ---

  albin_interview:
    type: tweet
    from: albin
    text: >
      asssa jag vet att ingen lyssnar pa en 17aring men jag sag ngt
      vid gruvan den kvallen. typ lampor vid dammen. och en bil som
      jag kande igen
    effects: { trust_albin: "+5" }
    choices:
      - Ask Albin what he saw -> albin_talk

  albin_talk:
    type: message
    text: >
      ALBIN: ja typ jag var ute med hunden vid attan. gick forbi
      grusvägen mot gruvan. sag lampor vid tailings-dammen. typ
      nagon som jobbade dar. men det var efter arbetstid.

      och sen sag jag en bil komma ut fran gruvområdet. fett fort.
      en svart volvo suv. niklas borgs bil. varfor ar sitemanagern
      vid gruvan klockan 10 pa kvallen?

      och en annan grej. det luktade konstigt fran dammen. typ kemiskt.
      som nar dom gor utsläpp pa natten. astrid berattade for mig att
      dom gor det ibland. pumpar ut processvattnet nar ingen ser.
    effects:
      trust_albin: "+10"
      night_witnesses: "+1"
      pollution_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Per (saw Astrid at the river) ---

  per_interview:
    type: tweet
    from: per
    text: >
      I was on the northern trail that evening. I saw Astrid at the
      river bend near kilometre marker 7. She was collecting samples.
      She was not alone.
    effects: { trust_per: "+5" }
    choices:
      - Ask Per what he saw -> per_talk

  per_talk:
    type: message
    text: >
      PER: I saw Astrid at the river around 20:00. She had her
      sampling equipment. But there was someone on the other bank.
      Watching her. Not fishing, not hiking — just standing in the
      trees, looking at her.

      When Astrid noticed them, she packed up quickly and left. She
      drove north, away from town. The person on the other bank got
      into a car parked on the logging road. A dark car. They followed
      the same direction.

      I should have done something. I told myself it was nothing.
    effects:
      trust_per: "+10"
      night_witnesses: "+1"
      surveillance_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Oskar (heard the argument) ---

  oskar_interview:
    type: tweet
    from: oskar
    text: >
      I was in the workshop until midnight. I heard a car stop on the
      road outside. Voices. Not happy voices.
    effects: { trust_oskar: "+5" }
    choices:
      - Ask Oskar what happened -> oskar_talk

  oskar_talk:
    type: message
    text: >
      OSKAR: Around 22:00 a car pulled up outside the workshop. Then
      a second car. Two people got out and talked. A man and a woman.
      The woman was upset — I could hear her voice, sharp and angry.

      The man kept saying "Astrid, listen. Just listen."

      I recognised his voice. It was Mattias. Her ex-boyfriend from
      Stockholm. He was here in Silverby. That surprised me.

      They argued for maybe ten minutes. Then she got back in her car
      and drove off fast, heading north toward the trailhead. He stood
      there for a minute, then followed in his car.
    effects:
      trust_oskar: "+10"
      night_witnesses: "+1"
      surveillance_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Ingrid (saw Mattias earlier) ---

  ingrid_interview:
    type: tweet
    from: ingrid
    text: >
      I close the library at 19:00 on Tuesdays. That evening I saw
      someone I didn't expect. Sitting in a car outside, watching the
      konditori where Astrid was having fika.
    effects: { trust_ingrid: "+5" }
    choices:
      - Ask Ingrid what she saw -> ingrid_talk

  ingrid_talk:
    type: message
    text: >
      INGRID: It was Mattias. Astrid's ex-boyfriend. He was sitting
      in a rental car — I could see the Hertz sticker — watching the
      konditori through the window. He didn't go in. He just sat there.

      When Astrid left the konditori and drove toward the river, he
      waited a few minutes and then followed her.

      I know Mattias. He came to fika fridays at the library when he
      lived here. He was always intense. After the breakup, he called
      me twice asking where Astrid was staying, what she was working on.
      I told him to contact her directly. He said "She blocked me."
    effects:
      trust_ingrid: "+10"
      night_witnesses: "+1"
      surveillance_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.

      Keep collecting testimonies or talk to key contacts.
    choices:
      - Find Albin -> albin_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Per -> per_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Oskar -> oskar_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Ingrid -> ingrid_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Talk to Wilma (has screenshots) -> wilma_early
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Wilma early ---

  wilma_early:
    type: tweet
    from: wilma
    text: >
      typ astrid visade mig sin telefon veckan innan. hon hade fatt
      typ sjukt creepy msgs. nagon som visste var hon var hela tiden
    effects: { trust_wilma: "+5" }
    choices:
      - Ask Wilma about the messages -> wilma_messages
      - Come back later -> quest2_hub

  wilma_messages:
    type: message
    text: >
      WILMA: asssa astrid visade mig typ 10 meddelanden fran en
      anonym profil. saker som "jag sag dig vid alven idag" och
      "den dar jackan klär dig" och "varfor pratar du med aslak
      och inte med mig"

      typ nagon som foljer efter henne irl och skriver om det.
      skapskumt. astrid sa att hon visste vem det var. hon sa "det
      ar nagon jag brukade lita pa."

      jag tog screenshots. jag har dom pa min telefon. vill du se?

      dom ar typ... intima. som om personen tror att dom fortfarande
      ar tillsammans.
    effects:
      trust_wilma: "+10"
      surveillance_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Timeline Assembly ---

  quest2_timeline:
    type: message
    text: >
      TIMELINE ASSEMBLED

      19:00 — Astrid at Konditori Birgitta, says she's going to the river
      19:00 — Mattias seen watching the konditori from a rental car (Ingrid)
      20:00 — Astrid collecting samples at the river. Someone watching from far bank (Per)
      20:00 — Activity at mine tailings pond, Niklas's car leaving (Albin)
      22:00 — Astrid and Mattias argue on the road. She drives north. He follows. (Oskar)
      06:00 — Astrid's car found at Kungsleden trailhead, camera inside

      Two threads to pull:
      - Environmental cover-up: What is the mine hiding at the tailings pond?
      - Ex-partner surveillance: Why is Mattias following Astrid?
    choices:
      - Investigate the mine -> pollution_hub
      - Investigate Mattias -> surveillance_hub
      - Pursue both -> investigation_hub

