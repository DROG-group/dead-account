  # --- ENDING A: Both (Best Ending) ---

  confront_both:
    type: message
    text: >
      You compile everything. The USB stick goes to Gustav. The
      pollution data and permit fraud go to Lansstyrelsen with Sofia's
      backup. The surveillance evidence and rental car records go to
      polisen in Lulea — above the Silverby station.

      You send it all simultaneously.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE FULL PICTURE

      The pollution story breaks in Silverby Tidning and is picked up
      nationally. The Lansstyrelsen orders an immediate environmental
      audit. The mine's permit is suspended. Anders Bergman is
      summoned for questioning. Niklas Borg cooperates — he was @sven,
      the anonymous insider, trying to expose the discharge without
      losing his job.

      The polisen trace Mattias's movements. The rental car records,
      the anonymous messages, the surveillance pattern — enough for
      an arrest. He is charged with ofredande and stalking.

      And Astrid? She has been staying with Linnea in Umea. Mattias
      found her at the trailhead that night. She ran into the forest.
      She knows these woods better than anyone. She walked 40 kilometres
      through the night to a cabin on Aslak's land. The Sami community
      kept her safe.

      With Mattias arrested and the mine exposed, Astrid calls Erik.

      "I'm coming home. Tell Birgitta to put the kettle on."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: astrid
    text: >
      the river will be clean again. it will take time but it will
      heal. so will i. the paper is being published. the truth flows
      downhill. thank you.
    choices:
      - The End -> game_complete

