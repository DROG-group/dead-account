  ending_c:
    type: message
    text: >
      ENDING C: THE EX

      Mattias is arrested and charged. Astrid's immediate fear is
      addressed.

      But without the pollution evidence, the mine continues. The
      tailings pond keeps leaking. The river stays poisoned. Aslak's
