  # POLLUTION THREAD
  # =====================================================================

  pollution_hub:
    type: message
    text: >
      THE POLLUTION THREAD

      A mine contaminating water. Falsified environmental reports. Night
      discharges into the river. Who ordered the cover-up?

      Pollution evidence: ${pollution_evidence}
    choices:
      - Investigate the water samples -> water_investigation
      - Talk to Aslak about the reindeer -> aslak_reindeer
      - Check the environmental permits -> permit_investigation
      - Talk to Sofia at Lansstyrelsen -> sofia_interview
