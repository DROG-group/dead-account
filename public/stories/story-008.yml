  # --- Gustav (deeper investigation) ---

  gustav_evidence:
    type: message
    text: >
      GUSTAV: I have been an editor for twenty years. I have never
      been afraid to publish a story. Until now.

      Norrland Mineral is not just our biggest advertiser. They
      sponsor the hockey team, the midsommar festival, the school
      library. They fund the kommun's cultural programme. If I publish
      this story, every one of those sponsorships disappears.

      That is how they operate. Not with threats — with money. They
      make themselves indispensable. Then the truth becomes too
      expensive.

      But Astrid is missing. And if her data is real — and Linnea says
      it is — then children in this town are drinking contaminated
      water. That is bigger than advertising revenue.

      Give me the evidence. I will publish. Whatever it costs.
    effects:
      trust_gustav: "+15"
      pollution_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to pollution thread -> pollution_hub

