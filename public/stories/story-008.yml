  ending_b:
    type: message
    text: >
      ENDING B: THE MINE

      The mine's permit is revoked. Anders Bergman faces criminal
      charges for environmental fraud. The river will recover in time.

      But without the surveillance evidence, Mattias is never
      investigated. He remains in Silverby, posting concerned messages,
