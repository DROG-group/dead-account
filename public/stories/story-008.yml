  # --- Aslak (deeper testimony about the night) ---

  aslak_night:
    type: message
    text: >
      ASLAK: The night Astrid disappeared, one of our herders was
      on the ridge above the river. He saw headlights on the logging
      road — two cars, one following the other.

      The first car stopped at the river bend. A woman got out and
      walked toward the water with a torch. Sampling, probably.

      The second car stopped further back. A man got out and walked
      toward her. They talked. Then she got in her car and drove fast
      toward the north. He followed.

      Our herder knows the land. He knows Astrid's car. And he knows
      the rental car that has been appearing on our roads for months.

      When Astrid didn't come back the next day, we searched. We found
      her tracks on the Kungsleden trail. She went off-path at
      kilometre marker 12. Into the old forest. Toward our summer
      camp.

      We found her at the cabin. Exhausted. Frightened. But alive.
      We kept her safe. We owe her that.
    effects:
      trust_aslak: "+15"
      surveillance_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Linnea (deeper evidence) ---

  linnea_deeper:
    type: message
    text: >
      LINNEA: I want you to understand what Astrid's data means.

      The cadmium levels she found would cause kidney damage in
      children who drink the water regularly. Arsenic at those
      levels is a carcinogen. Lead affects neurological development.

      The town's drinking water comes from wells upstream of the
      worst contamination point. But the wells are not far upstream.
      A wet spring, a high water table, and the plume reaches them.

      This is not abstract environmental science. This is children
      getting sick. This is reindeer dying. This is a town being
      slowly poisoned for quarterly profit reports.

      Astrid understood the stakes. That's why she wouldn't stop.
      And that's why the mine needed her to stop.

      Our paper will be published. With or without the mine's consent.
      I need Astrid's raw data to make the peer review unassailable.
      Find her data and we win this.
    effects:
      trust_linnea: "+15"
      pollution_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to pollution thread -> pollution_hub

  # --- Per (deeper testimony) ---

  per_deeper:
    type: message
    text: >
      PER: I teach geography. I know this landscape better than anyone
      in Silverby except maybe the Sami herders.

      The mine's expansion plan covers an area that includes three
      tributaries feeding the main river. If those tributaries are
      contaminated — and Astrid's data suggests they already are —
      the entire downstream ecosystem is compromised. Fish, plants,
      drinking water for the town.

      Astrid brought her data to my hiking club presentation two
      months ago. She overlaid the contamination points on the
      topographic map. The pattern was undeniable — every contamination
      point was directly downstream from a mine operation.

      After that presentation, two parents withdrew their children
      from the hiking club. They said the mine management told them
      the club was "spreading misinformation." The mine called a
      teacher's after-school activity misinformation.

      That's the kind of pressure this community faces. Astrid faced
      it alone. She shouldn't have had to.
    effects:
      trust_per: "+10"
      pollution_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to pollution thread -> pollution_hub

  # --- Lars ---

  lars_interview:
    type: message
    text: >
      LARS: Off the record? This case was closed too fast. My
      superior received a call from the kommun about "managing
      community anxiety." That's code for stop investigating.

      Astrid reported harassment from an ex-partner twice. We couldn't
      act because she didn't have his name — just anonymous accounts.
      But the descriptions matched someone specific.

      I checked the rental car agencies. A Hertz rental in a Stockholm
      man's name — Mattias Ek — was returned the morning after Astrid
