entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN ŽVEJŪNAI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Zvejunai.social — the community Mastodon instance for
      the Curonian Spit fishing village of Žvejūnai, Lithuania.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @emilija_jonaitis.

      A folk singer. Voice of the dunes. She collected and performed
      traditional Curonian fishing songs. People are worried. She hasn't
      posted in six days.
    choices:
      - Look at her profile -> emilija_profile

  emilija_profile:
    type: tweet
    from: emilija
    text: "Kopos ties Juodųjų paukščių kyšuliu nebėra tos pačios. Kažkas kasa. Turiu įrodymus."
    choices:
      - That's her last real post... -> grey_dune

  grey_dune:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a grey dune. Blurred, overexposed, shot at a strange angle.
      Posted at 2am. No caption.

      Her friends say that's not her style. The police say she
      probably went travelling. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: komisaras
    text: >
      Gavome pranešimą dėl Žvejūnų gyventojos. Šiuo metu nėra
      pagrindo manyti, kad įvykdyta nusikalstama veika. Bet kokią
      naudingą informaciją prašome pateikti telefonu 112 arba
      komisariatui tiesiogiai.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @ruta_kazlauskaite is
      desperate. Her brother @matas_jonaitis is driving down from
      Klaipėda. Her colleague @darius_stankevicius is posting worried
      messages. The fisherman @kazys_vaitkus says she was right about
      the dunes.

      And the journalist @neringa_simkute is strangely silent.

      Nobody buys the police's line. Nobody thinks Emilija just
      "went travelling."
    effects: { trust_ruta: "+5", trust_matas: "+5" }
    choices:
      - Start following Emilija's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Žvejūnai. Follow Emilija's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Ona (tavern owner, knows everyone) -> ona_intro
      - Talk to Kazys (fisherman, saw the digging) -> kazys_intro
      - Talk to Giedrė (teen surfer, seems shaken) -> giedre_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Emilija with the rhythms of a small
      fishing village: tide schedules, the bakery's šakotis of the
      day, storm warnings off the Baltic.

      Key names surface: Rūta (best friend, teacher), Darius
      (ethnomusicology colleague, seems rattled), Neringa (journalist,
      oddly quiet), and the teens — Giedrė, Lukas, Agnė — who
      worshipped Emilija's folk songs.

      Also prominent: BalticPipe Energy UAB, the gas pipeline company
      with a construction site at the edge of the dunes. Their posts
      are corporate PR. Emilija's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Ona -> ona_intro
      - Talk to Kazys -> kazys_intro
      - Talk to Giedrė -> giedre_intro

  # --- Ona (social map) ---

  ona_intro:
    type: tweet
    from: ona
    text: >
      Užeiga atidaryta, bet širdis ne savo vietoj. @emilija_jonaitis,
      tavo vieta laukia. Grįžk greičiau.
    effects: { trust_ona: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ona -> ona_talk

  ona_talk:
    type: message
    text: >
      ONA: Ai, naujas žmogus? Sveiki. Blogas laikas atvažiuoti.
      Visi ant nervų dėl Emilijos.

      Let me tell you who's who. Rūta is Emilija's best friend — they
      share a flat above the pharmacy. Sweetest girl, devastated
      right now. Darius Stankevičius works with Emilija on field
      recordings — ethnomusicologist from Vilnius. Smart man, but...
      intense about her. Matas is Emilija's older brother, coming down
      from Klaipėda.

      And Neringa Šimkutė — the journalist — she and Emilija were
      working on something together. Something about the dunes. Neringa
      hasn't said a word since Emilija vanished. That's not like her
      at all.

      Oh, and ignore BalticPipe's PR posts. Lies wrapped in ISO
      certificates.
    effects: { trust_ona: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Darius -> ona_darius
      - Ask about BalticPipe -> ona_balticpipe
      - Thank her and move on -> quest1_hub

  ona_darius:
    type: message
    text: >
      ONA: Darius? He's been coming to Žvejūnai for three years for
      his research. Brilliant scholar. But since Emilija started
      singing with him, he's been... orbiting her. At the tavern every
      time she performed. Offered to co-produce every recording. She
      was polite about it but I could tell it made her uncomfortable.

      After she started investigating the dune damage, he got worse.
      Wanted to be part of everything. She told me once, "jis nesupranta
      žodžio ne." I thought she meant professionally. Now I'm not so sure.
    effects: { trust_ona: "+5" }
    choices:
      - Ask about BalticPipe -> ona_balticpipe
      - Move on -> quest1_hub

  ona_balticpipe:
    type: message
    text: >
      ONA: That pipeline project arrived two years ago. They said it
      would bring gas security, jobs, prosperity. The village tolerated
      them because of the money. But the fishermen have been complaining
      for years — strange machinery running at night near the protected
      dunes, sand displacement shifting the shoreline, nesting sites
      destroyed.

      Emilija was the first person to actually document it. She went
      out with a camera and a drone. She had proof, she said. Real
      proof that they were excavating inside the UNESCO buffer zone.
      Two weeks later she's gone.
    effects: { trust_ona: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kazys (the dunes, witness tease) ---

  kazys_intro:
    type: tweet
    from: kazys
    text: >
      keturiasdešimt penkerius metus žvejoju čia. kopos nebėra tokios.
      @emilija_jonaitis buvo teisi. ir dabar ji dingo. susidarykite
      vaizdą patys.
    effects: { trust_kazys: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kazys -> kazys_talk

  kazys_talk:
    type: message
    text: >
      KAZYS: I've fished this coast since I was fourteen. I know every
      dune, every current, every colour the sand makes. And I'm telling
      you — the dunes near Juodųjų paukščių kyšulys are wrong. Have
      been for months. The sand is shifting where it shouldn't. Heavy
      machinery tracks where only foxes should walk.

      Emilija documented it. She flew her drone over the construction
      zone at night. She photographed the excavation pits inside the
      protected area. She was building a case. And then poof — gone.

      You think that's a coincidence? Blet, I don't believe in
      coincidences on this spit.
    effects: { trust_kazys: "+10" }
    choices:
      - Did you see anything unusual recently? -> kazys_night
      - Move on -> quest1_hub

  kazys_night:
    type: message
    text: >
      KAZYS: The night before she vanished — I was coming back from
      night fishing, around 1am. I saw lights at the cultural centre
      where Emilija rehearses. Not unusual, she works late on
      recordings. But there were two vehicles in the lot. One was
      Emilija's old Škoda. The other was a black SUV with BalticPipe
      plates.

      At 1am. At the village cultural centre.

      I noted it in my fishing log. Nobody's asked to see it.
    effects: { trust_kazys: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Giedrė (teen surfer, witness tease) ---

  giedre_intro:
    type: tweet
    from: giedre
    text: >
      blet nu nx @emilija_jonaitis ji man išmokė mylėt šitą jūrą
      tipo sah nėra šansų kad ji tiesiog dingo. jei kas nors žino
      ką nors rašykit blet prašau
    effects: { trust_giedre: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Giedrė -> giedre_talk_early

  giedre_talk_early:
    type: message
    text: >
      GIEDRĖ: a tu naujas čia? šūdas koks laikas atvažiuot. realiai
      emilija tai tipo geriausia žmogus šitam kaime. ji mus mokė
      dainų, vedė ant kopų, pasakojo apie senuosius žvejus. toooop
      buvo.

      ir dabar aš flipinu nes lukas matė kažką keisto tą vakarą
      prie uosto bet jis nenori kalbėt. sako kad nx nieko bet
      tipo... tai ne nieko po velnių
    effects: { trust_giedre: "+10" }
    choices:
      - What did Lukas see? -> giedre_lukas_hint
      - Move on -> quest1_hub

  giedre_lukas_hint:
    type: message
    text: >
      GIEDRĖ: nžn tiksliai. jis buvo ant kopos saulėlydžio session
      ir tipo matė kažką prie emilijos mašinos?? ar kažką tokio.
      jis flipina per daug nenori kalbėt. reik jam tiesiai pasakyt
      bet jis nepasitiki žmonėm kurių nepažįsta. pabandyk pirma
      apie muziką pakalbėt su juo lol
    effects: { trust_giedre: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Žvejūnai. A Curonian Spit fishing
      village built around the sea and the dunes. A folk singer who
      was exposing illegal construction. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Rūta (Emilija's best friend) -> ruta_q1
      - Talk to Darius (Emilija's colleague) -> darius_q1
      - Check what Matas (Emilija's brother) is saying -> matas_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Rūta Q1 ---

  ruta_q1:
    type: tweet
    from: ruta
    text: >
      jei kas nors turi žinių apie @emilija_jonaitis skambinkit man
      prašau. jos kambarys nepaliestas. jos gitara čia. ji niekada
      neišeitų be gitaros.
    effects: { trust_ruta: "+5", contacts_followed: "+1" }
    choices:
      - DM Rūta -> ruta_q1_talk

  ruta_q1_talk:
    type: message
    text: >
      RŪTA: I appreciate you reaching out but I don't know you.
      Emilija has a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Rūta is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_ruta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Darius Q1 ---

  darius_q1:
    type: tweet
    from: darius
    text: >
      Kultūros centras tuščias be @emilija_jonaitis. Jos įrašai vis
      dar serveryje. Jos dainų sąsiuviniai ant stalo. Ji niekada
      nepaliktų nebaigto darbo.
    effects: { trust_darius: "+5", contacts_followed: "+1" }
    choices:
      - DM Darius -> darius_q1_talk

  darius_q1_talk:
    type: message
    text: >
      DARIUS: Emilija and I have worked together for over a year.
      She's the most dedicated folk musician I know. This dune
      investigation — it became everything to her. She had drone
      footage, photos, GPS coordinates of illegal excavation. She was
      so close to going public.

      I offered to help her. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to support her.

      [Darius seems earnest. Or obsessive?]
    effects: { trust_darius: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Matas Q1 ---

  matas_q1:
    type: tweet
    from: matas
    text: >
      mano sesuo DINGO ir policija sako kad ji gal išvažiavo
      atostogaut??? JI NEIŠVAŽIUOJA NEPERSPĖJUSI. aš važiuoju iš
      klaipėdos. kas nors man paaiškins.
    effects: { trust_matas: "+5", contacts_followed: "+1" }
    choices:
      - DM Matas -> matas_q1_talk

  matas_q1_talk:
    type: message
    text: >
      MATAS: Who are you? Another person from that village who's going
      to tell me to calm down? My sister called me the night before she
      disappeared. She said she had something big. She said "jei kas
      nors nutiks, žiūrėk į BalticPipe." Then she hung up.

      That's the last I heard from her.
    effects: { trust_matas: "+10" }
    choices:
      - What do you think happened? -> matas_theory
      - Move on -> quest1_hub

  matas_theory:
    type: message
    text: >
      MATAS: I think she found proof that BalticPipe is destroying
      protected dunes and they shut her up. But I also think that
      creepy colleague of hers — Darius — knows more than he's saying.
      The way he talks about her... it's not just professional concern.
      It's something else.

      Emilija told me months ago that someone was going through her
      recording files. She thought it was nothing. I don't think it
      was nothing.
    effects: { trust_matas: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Emilija went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Lukas (was on the dune at sunset near the port) -> lukas_interview
      - Find Vytautas (harbour master, works late) -> vytautas_interview
      - Find Tomas (amber craftsman, early morning on the shore) -> tomas_interview
      - Find Jurga (baker, starts at 5am, saw something) -> jurga_interview

  # --- Lukas (saw someone at Emilija's car) ---

  lukas_interview:
    type: tweet
    from: lukas
    text: >
      geras saulėlydis šįvakar bet atmosfera prie uosto tipo keista
      paskutiniais laikais. kažkas ne taip. nžn kaip paaiškint
    effects: { trust_lukas: "+5" }
    choices:
      - Ask Lukas about that evening -> lukas_talk

  lukas_talk:
    type: message
    text: >
      LUKAS: blet ok bet tu niekam nesakyk gerai. buvau ant kopos
      apie 19h, saulėlydžio session. ir mačiau tą tipą iš
      universiteto — darių — prie emilijos mašinos. jis tipo kažką
      darė viduj ar kažką dėjo. kai mane pamatė tai nupiso per greitai.

      tipo aš nieko nesakiau nes nenorėjau bėdų bet dabar tai šūdas.
      jo elgesys tai ne normalus po velnių
    effects:
      trust_lukas: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Vytautas (harbour master, saw late-night meeting) ---

  vytautas_interview:
    type: tweet
    from: vytautas
    text: >
      Priminimas: uostas draudžiamas tarp 22h ir 6h.
      Pastebėjau neleistinų praėjimų pastarosiomis naktimis.
    effects: { trust_vytautas: "+5" }
    choices:
      - Ask Vytautas what he saw -> vytautas_talk

  vytautas_talk:
    type: message
    text: >
      VYTAUTAS: I was closing the harbour office around 22h30. I saw
      Emilija's car still in the cultural centre car park. And a black
