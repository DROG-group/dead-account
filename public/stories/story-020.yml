  darius_response:
    type: message
    text: >
      Darius doesn't reply for a long time. Then:

      DARIUS: You don't understand. I was protecting her. She was
      in danger from BalticPipe and she wouldn't let me help. I
      needed to know she was safe. Everything I did was because I
      care about her.

      That's not care. That's obsession.

