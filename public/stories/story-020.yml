  valdas_response:
    type: tweet
    from: saulius
    text: >
      Mano klientas priima domėn jūsų pareiškimus. Bet koks
      šmeižiančios medžiagos viešinimas bus nedelsiant persekiojamas
      teismine tvarka. — Kontora Urbonas ir partneriai, Vilnius
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The seniūnas's lawyer buries your accusation. Without a direct
      link between Rimkus and BalticPipe's illegal construction — and
      there isn't one beyond political protection — your evidence is
      insufficient.

      BalticPipe continues to dig. Darius continues to watch. Emilija
      stays in hiding.

      Six months later, @egle_zukauskaite creates a new account. It
      follows Emilija's brother.
    choices:
      - The End -> game_complete

