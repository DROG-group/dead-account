  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Komisaras Butkus reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the witness
      testimonies — Darius is arrested for stalking and harassment.
      A GPS tracker is recovered from under Emilija's car at the old
      fisherman's huts near the south lagoon.

      Neringa Šimkutė, finally in possession of Emilija's full
      evidence package, publishes the BalticPipe story in Lietuvos
      rytas. The ministry orders an unannounced inspection. The
      construction site is shut down pending environmental remediation.
      The dunes at Juodųjų paukščių kyšulys are declared a strict
      no-access zone. Žilvinas Mockus faces criminal charges for
      falsifying environmental impact reports and destroying UNESCO
      heritage.

      And Emilija Jonaitis, reading the story from a friend's flat
      in Kaunas, calls her brother for the first time in nine days.

      "Grįžtu namo."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: emilija
    text: >
      kopos nemeluoja. ir žvejūnų žmonės irgi ne.
      ačiū kad nepaleidot.
    choices:
      - The End -> game_complete

  # --- ENDING B: Žilvinas (Partial Ending) ---

  confront_zilvinas:
    type: message
    text: >
      You present the dune destruction evidence to Žilvinas Mockus:

      "I have drone footage of illegal excavation inside the UNESCO
      core zone. I have GPS coordinates of bore holes in protected
      dunes. I have your original survey reports showing the data was
      falsified. I have photographs of machinery tracks on Holocene
      dune formations."
    choices:
      - Send -> zilvinas_response

  zilvinas_response:
    type: message
    text: >
      ŽILVINAS: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. BalticPipe Energy has always operated
      within regulatory requirements.

      But it's too late. You've sent the evidence to Neringa, to
      the Kopų sargai, and to the ministry.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The dune destruction story breaks. BalticPipe is ordered to
      halt construction pending investigation. The pipeline project
      may be cancelled. A hundred and fifty jobs hang in the balance.
      The village is divided.

      But Emilija?

      Without the stalking evidence, Darius is never investigated.
      He continues to visit the village. He continues to monitor her
      accounts. He creates a new anonymous profile.

      Three months later, Emilija reads about BalticPipe online.
      She returns quietly. She changes her rehearsal space. She stops
      walking the dunes alone. She checks her car every morning.

      The corporation is exposed. But the person who terrorised
      Emilija walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: emilija
    text: "grįžau. kopos saugesnės. likusi dalis... pažiūrėsim."
    choices:
      - The End -> game_complete

  # --- ENDING C: Seniūnas (Wrong Ending) ---

  confront_valdas:
    type: message
    text: >
      You confront Seniūnas Rimkus with your evidence.

      Within the hour, you receive a message from his office:
    choices:
