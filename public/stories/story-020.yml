  confront_darius:
    type: message
    text: >
      You present your evidence to Darius:

      "I know @egle_zukauskaite is your account. I know you put a GPS
      tracker on Emilija's car. I know you accessed her files at the
      cultural centre. I know you were watching her flat. I have
