entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN MOSSELKERKE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welkom op mosselkerke.social — de Mastodon-instance van het
      vissersdorp Mosselkerke, Zeeland.

      De lokale tijdlijn is onrustig. Er is iets gebeurd.
    choices:
      - Check de feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Als je door de feed scrollt, zie je overal dezelfde naam:
      @bram_willemse.

      Een jonge mosselkweker. 22 jaar. Hij documenteerde het water
      van de Westerschelde, filmde de mosselpercelen, deelde alles
      online. Mensen maken zich zorgen. Hij heeft zes dagen niet
      gepost.
    choices:
      - Bekijk z'n profiel -> bram_profile

  bram_profile:
    type: tweet
    from: bram
    text: "het water bij de oostdam is niet normaal. grijze troep. de mosselen gaan dood. iemand loost hier illegaal en ik ga het bewijzen."
    choices:
      - Dat is z'n laatste echte post... -> grey_water

  grey_water:
    type: message
    text: >
      Drie dagen na die post verscheen er een enkel beeld op z'n
      account: een wazig, overbelicht shot van de haven bij nacht.
      Gepost om 04:12. Geen tekst.

      Z'n vrienden zeggen dat dit niet z'n stijl is. De politie zegt
      dat hij waarschijnlijk een paar dagen weg is. Iets klopt niet.
    choices:
      - Lees het politiebericht -> politie_statement
      - Bekijk de reacties -> community_reaction

  politie_statement:
    type: tweet
    from: agent
    text: >
      Wij hebben een melding ontvangen betreffende een inwoner van
      Mosselkerke. Op dit moment is er geen aanleiding om uit te gaan
      van een misdrijf. Informatie kan worden gedeeld via 0900-8844
      of bij het wijkbureau.
    choices:
      - Wat zeggen mensen? -> community_reaction

  community_reaction:
    type: message
    text: >
      De reacties zijn chaotisch. Z'n vriendin @fleur_devries is
      wanhopig. Z'n broer @thijs_willemse komt uit Goes. Z'n
      buurman in de haven @sander_geschiere post vage berichten.
      De oude visser @henk_dekker zegt dat Bram gelijk had over
      het water.

      En de journaliste @sofie_tramper is verdacht stil.

      Niemand gelooft de politie. Niemand denkt dat Bram zomaar
      "even weg" is.
    effects: { trust_fleur: "+5", trust_thijs: "+5" }
    choices:
      - Begin met het volgen van Bram's contacten -> quest1_start

  # =====================================================================
  # QUEST 1: EERSTE INDRUKKEN
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: EERSTE INDRUKKEN

      Leer Mosselkerke kennen. Volg Bram's contacten en lees hun
      berichten. Hoe meer je met de gemeenschap praat, hoe meer
      ze je vertrouwen.

      Begin met de mensen die het meest bereid lijken om te praten.
    choices:
      - Praat met Els (cafe eigenaar, kent iedereen) -> els_intro
      - Praat met Henk (visser, zag het water) -> henk_intro
      - Praat met Joost (tiener zeiler, is van slag) -> joost_intro
      - Check eerst de lokale feed -> feed_browse

  feed_browse:
    type: message
    text: >
      De feed mixt paniek over Bram met het ritme van een klein
      vissersdorp: getijdentabellen, het dagmenu van de bakker,
      weerwaarschuwingen voor de kust.

      Belangrijke namen komen naar boven: Fleur (vriendin, viswinkel),
      Sander (buurman in de haven, gedraagt zich vreemd), Sofie
      (journaliste, vreemd stil), en de tieners — Joost, Daan,
      Anouk — die Bram's werk bewonderden.

      Ook opvallend: DeltaChem BV, de chemische fabriek aan de rand
      van het dorp. Hun posts zijn corporate PR. Bram's posts waren
      het tegenovergestelde.
    effects: { contacts_followed: "+3" }
    choices:
      - Praat met Els -> els_intro
      - Praat met Henk -> henk_intro
      - Praat met Joost -> joost_intro

  # --- Els (social map) ---

  els_intro:
    type: tweet
    from: els
    text: >
      het cafe is open maar het voelt leeg. @bram_willemse, je
      stamtafel staat klaar jongen. kom terug.
    effects: { trust_els: "+5", contacts_followed: "+1" }
    choices:
      - Reageer op Els -> els_talk

  els_talk:
    type: message
    text: >
      ELS: Ah, je bent nieuw hier? Welkom. Slecht moment om te
      komen. Iedereen is overstuur door Bram.

      Laat me je even op de hoogte brengen. Fleur is z'n vriendin —
      ze runt de viswinkel aan de haven. Lief meisje, helemaal kapot
      nu. Sander Geschiere heeft z'n boot naast Bram's kotter
      liggen. Enge vent als je 't mij vraagt. Altijd aan het
      gluren, altijd vragen stellen over Bram's routes.

      Thijs is Bram's oudere broer, komt uit Goes. En Sofie Tramper
      — de journaliste — zij en Bram werkten samen aan iets. Iets
      over het water. Sofie heeft geen woord gezegd sinds Bram weg
      is. Dat is niks voor haar.

      En geloof niks van DeltaChem's mooie praatjes. ISO-certificaten
      m'n reet.
    effects: { trust_els: "+10", contacts_followed: "+2" }
    choices:
      - Vraag over Sander -> els_sander
      - Vraag over DeltaChem -> els_deltachem
      - Bedank haar en ga verder -> quest1_hub

  els_sander:
    type: message
    text: >
      ELS: Sander? Die kerel heeft z'n boot naast Bram liggen
      sinds twee jaar. Eerst leek het normaal — twee buren in de
      haven. Maar het werd steeds vreemder. Hij stond altijd op
      de kade als Bram vertrok. Altijd vragen: waar ga je heen,
      welk perceel, wanneer ben je terug.

      Bram zei een keer tegen me: "die gozer volgt me op het
      water, Els. Ik zie z'n boot altijd in m'n kielzog." Ik
      dacht dat ie overdreef. Nu weet ik het niet meer.

      En 's avonds zit Sander op z'n boot met een verrekijker.
      Naar Bram's kotter te staren. Godverdomme, dat is toch
      niet normaal?
    effects: { trust_els: "+5" }
    choices:
      - Vraag over DeltaChem -> els_deltachem
      - Ga verder -> quest1_hub

  els_deltachem:
    type: message
    text: >
      ELS: Die fabriek staat er al sinds de jaren tachtig. Industriele
      oplosmiddelen, schoonmaakmiddelen, dat soort troep. Het dorp
      accepteerde het want het bracht banen. Maar de vissers klagen
      al jaren — raar kleuren in het water bij de uitlaatpijp, dode
      vissen bij de oostdam.

      Bram was de eerste die echt ging kijken. Met z'n camera en
      z'n flesjes. Hij had bewijs, zei ie. Echt bewijs. Twee weken
      later is ie weg.

      En die wethouder — Gert-Jan van den Berg — die heeft aandelen
      in DeltaChem. Dat weet het hele dorp. Maar niemand zegt er wat
      van want hij bepaalt wie subsidie krijgt voor de vissers.
    effects: { trust_els: "+5" }
    choices:
      - Ga verder -> quest1_hub

  # --- Henk (the water, witness tease) ---

  henk_intro:
    type: tweet
    from: henk
    text: >
      vijfendertig jaar vis ik hier. het water is niet meer hetzelfde.
      @bram_willemse had gelijk. en nu is ie weg. trek je eigen
      conclusie.
    effects: { trust_henk: "+5", contacts_followed: "+1" }
    choices:
      - Reageer op Henk -> henk_talk

  henk_talk:
    type: message
    text: >
      HENK: Ik vis op de Westerschelde sinds m'n vijftiende. Ik ken
      elke stroming, elke kleur die het water maakt. En ik zeg je —
      het water bij de oostdam klopt niet. Al maanden niet. M'n
      netten komen omhoog met dooie krabben. De bodem stinkt naar
      chemicalien.

      Bram nam watermonsters. Hij dook naar de uitlaatpijp. Hij
      filmde alles. Hij was een zaak aan het opbouwen. En toen —
      paf — weg.

      Denk je dat dat toeval is? Op zee geloof ik niet in toeval.
    effects: { trust_henk: "+10" }
    choices:
      - Heb je recent iets ongewoons gezien? -> henk_night
      - Ga verder -> quest1_hub

  henk_night:
    type: message
    text: >
      HENK: De nacht voordat ie verdween — ik kwam terug van nacht
      vissen, rond een uur of een. Ik zag licht bij Bram's kotter.
      Niet heel gek, soms werkt ie laat. Maar er stond iemand op de
      kade naast z'n boot. Geen Bram. Iemand groter. Stond daar
      maar gewoon te kijken.

      En er stond een busje bij het havenkantoor. DeltaChem logo
      op de zijkant. Om een uur 's nachts. Bij de haven.

      Ik dacht er toen niks van. Nu denk ik er de hele tijd aan.
    effects: { trust_henk: "+5" }
    choices:
      - Ga verder -> quest1_hub

  # --- Joost (teen sailor, witness tease) ---

  joost_intro:
    type: tweet
    from: joost
    text: >
      echt nie man @bram_willemse die gast heeft me gwn leren zeilen
      en alles over de schelde geleerd. kanker kut dat ie weg is.
      als iemand iets weet sws zeg het gewoon
    effects: { trust_joost: "+5", contacts_followed: "+1" }
    choices:
      - Reageer op Joost -> joost_talk_early

  joost_talk_early:
    type: message
    text: >
      JOOST: yo ben je nieuw hier ofzo? sws kut timing man. bram is
      echt de chillste gast van het hele dorp. hij leerde ons zeilen,
      nam ons mee op z'n kotter, liet ons zien wat er onder water
      leeft. echt held.

      en nu ben ik gwn bang want daan heeft iets raars gezien bij de
      haven maar hij wil er niet over praten. hij zegt dat t niks is
      maar het is sws wel iets man
    effects: { trust_joost: "+10" }
    choices:
      - Wat heeft Daan gezien? -> joost_daan_hint
      - Ga verder -> quest1_hub

  joost_daan_hint:
    type: message
    text: >
      JOOST: weet ik nie precies. hij was aan het skaten bij de haven
      en hij zag iemand die in bram z'n boot aan het zoeken was ofzo.
      niet bram zelf. iemand anders. hij flipte echt maar hij wil t
      niet zeggen want hij is bang dat niemand hem gelooft. probeer
      eerst een beetje normaal met hem te praten over skaten ofzo
      dan vertelt ie t misschien
    effects: { trust_joost: "+5" }
    choices:
      - Ga verder -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      Je krijgt een beeld van Mosselkerke. Een Zeeuws vissersdorp
      gebouwd rond het water. Een jonge mosselkweker die vervuiling
      aan het licht bracht. Een verdwijning die niemand gelooft.

      Je hebt contacten gelegd. Nu dieper graven.
    choices:
      - Praat met Fleur (Bram's vriendin) -> fleur_q1
      - Praat met Sander (Bram's buurman in de haven) -> sander_q1
      - Check wat Thijs (Bram's broer) zegt -> thijs_q1
      - Ik ben klaar om de nacht van z'n verdwijning te onderzoeken -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Fleur Q1 ---

  fleur_q1:
    type: tweet
    from: fleur
    text: >
      als iemand iets weet over @bram_willemse bel me alsjeblieft.
      z'n laarzen staan nog bij de deur. z'n regenjas hangt er nog.
      hij zou nooit weggaan zonder z'n spullen.
    effects: { trust_fleur: "+5", contacts_followed: "+1" }
    choices:
      - DM Fleur -> fleur_q1_talk

  fleur_q1_talk:
    type: message
    text: >
      FLEUR: Ik waardeer het maar ik ken je niet. Bram heeft veel
      vrienden hier. Hij komt wel terug.

      ...Ik blijf dat maar zeggen. Ik geloof het zelf niet meer.

      [Fleur is op haar hoede. Je moet meer vertrouwen opbouwen
      voordat ze openlijk praat.]
    effects: { trust_fleur: "+5" }
    choices:
      - Ga verder -> quest1_hub

  # --- Sander Q1 ---

  sander_q1:
    type: tweet
    from: sander
    text: >
      hoop dat bram snel terug is. rustig hier in de haven zonder
      hem. te rustig.
    effects: { trust_sander: "+5", contacts_followed: "+1" }
    choices:
      - DM Sander -> sander_q1_talk

  sander_q1_talk:
    type: message
    text: >
      SANDER: Bram en ik? Ja gewoon buren in de haven toch? M'n
      boot ligt naast de zijne. We klesten wel eens. Over het water,
      de mosselen, dat soort dingen. Verder niks bijzonders.

      Ik maak me zorgen. Net als iedereen.

      [Sander klinkt te kalm. Te neutraal. Alsof hij een script
      voorleest.]
    effects: { trust_sander: "+5" }
    choices:
      - Ga verder -> quest1_hub

  # --- Thijs Q1 ---

  thijs_q1:
    type: tweet
    from: thijs
    text: >
      m'n broer is VERDWENEN en de politie zegt dat ie misschien een
      paar dagen weg is??? HIJ GAAT NIET ZOMAAR WEG ZONDER HET TE
      ZEGGEN. ik kom eraan vanuit goes. iemand gaat me uitleggen wat
      er is gebeurd.
    effects: { trust_thijs: "+5", contacts_followed: "+1" }
    choices:
      - DM Thijs -> thijs_q1_talk

  thijs_q1_talk:
    type: message
    text: >
      THIJS: Wie ben jij? Weer iemand uit dat dorp die me gaat
      vertellen dat ik me niet druk moet maken? M'n broer belde me
      de avond voordat ie verdween. Hij zei dat ie iets groots had.
      Hij zei "als er iets gebeurt, kijk naar DeltaChem." Toen
      hing ie op.

      Dat is het laatste wat ik van hem gehoord heb.
    effects: { trust_thijs: "+10" }
    choices:
      - Wat denk je dat er is gebeurd? -> thijs_theory
      - Ga verder -> quest1_hub

  thijs_theory:
    type: message
    text: >
      THIJS: Ik denk dat ie bewijs heeft gevonden dat DeltaChem
      giftig afval in de Schelde dumpt en dat ze hem het zwijgen
      hebben opgelegd. Maar ik denk ook dat die enge buurman van
      hem — Sander — meer weet dan ie zegt. De manier waarop die
      gast over Bram praat... het is niet normaal. Het is iets
      anders.

      Bram vertelde me maanden geleden dat iemand z'n boot was
      binnengegaan terwijl ie er niet was. Spullen waren verplaatst.
      Z'n logboek was opengeslagen op een andere pagina. Hij dacht
      dat het niks was. Ik denk dat het wel iets was.
    effects: { trust_thijs: "+5" }
    choices:
      - Ga verder -> quest1_hub

  # =====================================================================
  # QUEST 2: DE LAATSTE NACHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: DE LAATSTE NACHT

      Er is iets gebeurd de nacht dat Bram verdween. Meerdere
      mensen hebben iets gezien of gehoord. Puzzel de tijdlijn
      in elkaar met getuigenissen.

      Je hebt minstens 4 getuigenissen nodig.
    choices:
      - Vind Daan (was aan het skaten bij de haven) -> daan_interview
      - Vind Piet (havenmeester, werkt laat) -> piet_interview
      - Vind Kees (oesterkweker, vroege ochtend aan het water) -> kees_interview
      - Vind Jaap (bakker, begint om 04:30, zag iets) -> jaap_interview

  # --- Daan (saw someone on Bram's boat) ---

  daan_interview:
    type: tweet
    from: daan
    text: >
      lekker gesessiond vandaag maar de vibe bij de haven is echt
      off. gwn een raar gevoel. lastig uit te leggen
    effects: { trust_daan: "+5" }
    choices:
      - Vraag Daan over die avond -> daan_talk

  daan_talk:
    type: message
    text: >
      DAAN: yo oke maar je zegt het tegen niemand he. ik was bij de
      haven rond een uur of zeven, skaten bij de kade. en ik zag die
      gast — sander — op bram z'n boot. niet z'n eigen boot. bram
      z'n boot. hij was gwn aan het rommelen met iets. toen ie mij
      zag ging ie kanker snel weg.

      ik heb niks gezegd want ik wou geen gedoe maar nu is het echt
      nie normaal meer sws. dat is gwn creepy man
    effects:
      trust_daan: "+10"
