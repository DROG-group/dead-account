      waar niemand zou zoeken. Een boekwinkel leek hem perfect.
    effects: { trust_lotte: "+10" }
    choices:
      - Wat ligt er onder water bij de oostdam? -> lotte_case

  lotte_case:
    type: message
    text: >
      Lotte reikt onder de toonbank en haalt een waterdichte
      Pelican-koffer tevoorschijn.

      LOTTE: Hij zei dat je zou komen. Neem het mee.

      Erin: een USB-stick en een set geprinte foto's. De foto's
      laten een onderwaterpijp zien — niet het officiele lozingspunt
      maar een tweede, verborgen uitlaat — en vaten op de bodem van
      de Schelde. De USB-stick bevat watermonsterdata, chemische
      analyses, en Bram's gedetailleerde rapport. Plus: screenshots
      van een financieel document waarop de aandelenportefeuille van
      wethouder Van den Berg staat. DeltaChem: €312.000.
    effects:
      dumping_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Terug naar investigation hub -> investigation_hub

  # --- Wijkagent Van Houten ---

  agent_interview:
    type: message
    text: >
      WIJKAGENT VAN HOUTEN: Off the record — en ik meen echt off the
      record — ik wilde DeltaChem onderzoeken. M'n leidinggevende
      zei dat ik moest stoppen. Hij zei dat de provincie
      "bevoegd" was. Dat is code voor "niet aankomen."

      De wethouder belde het bureau. Dat weet ik van een collega.
      Van den Berg zei dat het onderzoek "schadelijk was voor de
      lokale economie."

      De Sander-situatie is anders. Daar wist ik niks van tot nu.
      Als je bewijs hebt van stalking, kan ik daar wel mee aan de
      slag. Dat is duidelijk mijn bevoegdheid.

      Breng me iets stevigs en ik heropen de zaak.
    effects:
      trust_agent: "+15"
      evidence_total: "+1"
    choices:
      - Terug naar stalker draad -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      DE BESCHULDIGING

      Je hebt bewijs verzameld. Je weet meer over wat er met Bram
      is gebeurd dan wie dan ook in Mosselkerke. Wie is
      verantwoordelijk?
    choices:
      - Confronteer Sander Geschiere (de obsessieve buurman) -> confront_sander
        when:
          state: stalker_evidence
          gte: 5
      - Confronteer Wim Kaljee (de fabrieksdirecteur) -> confront_wim
        when:
          state: dumping_evidence
          gte: 3
      - Confronteer Wethouder Van den Berg (politieke bescherming) -> confront_gertjan
      - Ik heb meer bewijs nodig -> investigation_hub

  # --- ENDING A: Sander (Best Ending) ---

  confront_sander:
    type: message
    text: >
      Je presenteert je bewijs aan Sander:

      "Ik weet dat @marijn_poppe jouw account is. Ik weet dat je
      een GPS-tracker in Bram's stuurhut hebt geplaatst. Ik weet
      dat je z'n boot bent binnengegaan en z'n navigatie hebt
      gekopieerd. Ik weet dat je elke avond met een verrekijker
      naar z'n boot staarde. Ik heb getuigen en ik heb de
      havengegevens."
    choices:
      - Verstuur -> sander_response

  sander_response:
    type: message
    text: >
      Sander reageert lang niet. Dan:

      SANDER: Je snapt het niet. Ik beschermde hem. Hij was in
      gevaar door DeltaChem en hij wilde me niet laten helpen. Ik
      moest weten dat ie veilig was. Alles wat ik deed was omdat
      ik om hem geef.

      Dat is geen zorg. Dat is obsessie.

      Je hebt het bewijs al naar Wijkagent Van Houten gestuurd. En
      naar Sofie Tramper.
    choices:
      - Wacht op het resultaat -> ending_a

  ending_a:
    type: message
    text: >
      EINDE A: DE OBSESSIE

      Drie dingen gebeuren snel achter elkaar.

      Wijkagent Van Houten heropent de zaak. Met jouw bewijs — het
      anonieme account, de GPS-tracker, de havengegevens, de
      getuigenverklaringen — wordt Sander gearresteerd voor stalking
      en intimidatie. Een GPS-tracker wordt uit Bram's stuurhut
      verwijderd.

      Sofie Tramper, eindelijk in bezit van Bram's volledige
      bewijsmateriaal, publiceert het DeltaChem-verhaal in de PZC
      en het Algemeen Dagblad. De provincie gelast een
      onaangekondigde inspectie. De fabriek wordt stilgelegd in
      afwachting van milieusanering. Wim Kaljee wordt strafrechtelijk
      vervolgd voor het vervalsen van lozingsrapporten. Wethouder
      Van den Berg treedt af wanneer z'n aandelenbelang in DeltaChem
      openbaar wordt. Het OM onderzoekt belangenverstrengeling.

      En Bram Willemse, die het verhaal leest vanuit het huis van
      een vriend in Middelburg, belt z'n broer voor het eerst in
      negen dagen.

      "Ik kom naar huis."
    choices:
      - Bekijk de epiloog -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: bram
    text: >
      de schelde liegt niet. en de mensen van mosselkerke ook niet.
      bedankt dat jullie niet hebben opgegeven.
    choices:
      - Einde -> game_complete

  # --- ENDING B: Wim (Partial Ending) ---

  confront_wim:
    type: message
    text: >
      Je presenteert het vervuilingsbewijs aan Wim Kaljee:

      "Ik heb foto's van de niet-aangegeven uitlaatpijp. Ik heb
      watermonsters die zware metalen laten zien tien keer boven de
      wettelijke norm. Ik heb jullie originele labrapporten die
      laten zien dat de data is vervalst. Ik heb het vat met jullie
      batchnummer. En ik heb de aandelenportefeuille van de
      wethouder."
    choices:
      - Verstuur -> wim_response

  wim_response:
    type: message
    text: >
      WIM: Dit gesprek wordt doorgestuurd naar onze juridische
      afdeling. Elke publicatie van lasterlijk materiaal zal leiden
      tot onmiddellijke procedures. DeltaChem heeft altijd binnen
      de wettelijke kaders geopereerd.

      Maar het is te laat. Je hebt het bewijs naar Sofie gestuurd,
      naar Stichting Scheldebehoud, en naar de provincie.
    choices:
      - Wacht op het resultaat -> ending_b

  ending_b:
    type: message
    text: >
      EINDE B: DE FABRIEK

      Het vervuilingsverhaal breekt. DeltaChem wordt bevolen de
      lozingen te staken in afwachting van onderzoek. De fabriek
      sluit misschien definitief. Honderdtachtig banen hangen in
      de lucht. Het dorp is verdeeld. Wethouder Van den Berg treedt
      af onder druk.

      Maar Bram?

      Zonder het stalkingbewijs wordt Sander nooit onderzocht. Hij
      blijft in de haven. Hij blijft Bram's accounts volgen. Hij
      maakt een nieuw anoniem profiel aan.

      Drie maanden later leest Bram over DeltaChem online. Hij
      keert stilletjes terug. Hij verplaatst z'n boot naar een
      andere haven. Hij vaart niet meer alleen. Hij controleert z'n
      stuurhut elke ochtend.

      De fabriek is ontmaskerd. De wethouder is weg. Maar de
      persoon die Bram terroriseerde loopt vrij rond.
    choices:
      - Bekijk de epiloog -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: bram
    text: "ik ben terug. het water wordt schoner. de rest... we zien wel."
    choices:
      - Einde -> game_complete

  # --- ENDING C: Wethouder (Wrong Ending) ---

  confront_gertjan:
    type: message
    text: >
      Je confronteert wethouder Van den Berg met je bewijs.

      Binnen het uur ontvang je een bericht van z'n advocaat:
    choices:
      - Lees het antwoord -> gertjan_response

  gertjan_response:
    type: tweet
    from: bas
    text: >
      Mijn client neemt kennis van uw beschuldigingen. Elke
      openbare verspreiding van lasterlijke uitingen zal leiden tot
      onmiddellijke gerechtelijke stappen. — Vermue & Partners,
      Middelburg
    choices:
      - Wat gebeurt er nu? -> ending_c

  ending_c:
    type: message
    text: >
      EINDE C: DE POLITICUS

      De advocaat van de wethouder begraaft je beschuldiging. Zonder
      een direct verband tussen Van den Berg en de illegale lozing —
      en dat is er niet, buiten politieke bescherming — is je bewijs
      onvoldoende. De aandelen alleen zijn niet strafbaar; ze zijn
      "transparant gedeclareerd" in een register dat niemand leest.

      DeltaChem gaat door met lozen. Sander blijft kijken. Bram
      blijft zich verstoppen.

      Zes maanden later maakt @marijn_poppe een nieuw account. Het
      volgt Bram's broer.
    choices:
      - Einde -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: MOSSELKERKE — GAME VOLTOOID

      Bewijs verzameld: ${evidence_total}
      Dumpingbewijs: ${dumping_evidence}
      Stalkerbewijs: ${stalker_evidence}

      Bedankt voor het spelen. Bram's verhaal behandelt thema's van
      bedrijfsimpuniteit, milieucriminaliteit, obsessief gedrag,
      politieke corruptie, gemeenschapssolidariteit, en de moed om
      op te staan.

      Als jij of iemand die je kent te maken heeft met stalking,
      intimidatie, of suicidale gedachten, is hulp beschikbaar:
      113 Zelfmoordpreventie: 113 (bel of chat op 113.nl)
      Slachtofferhulp Nederland: 0900-0101
      Meldpunt milieucriminaliteit: 0900-8844
