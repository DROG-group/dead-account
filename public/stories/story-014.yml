entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SKELNÉ ÚDOLÍ
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to skelnoudoli.social — the community Mastodon instance for
      the Bohemian glassmaking town of Skelné Údolí, nestled in the
      Šumava hills.

      The local feed is full of anxiety today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name everywhere:
      @marek_dvorak.

      A young glassblower. An artist. He created stunning glass sculptures
      inspired by Šumava's forests and streams. People loved him.
      He hasn't posted in six days.
    choices:
      - Look at his profile -> marek_profile

  marek_profile:
    type: tweet
    from: marek
    text: "Potok za sklárnou smrdí chemikáliema. Barva vody je úplně špatná. Mám fotky. Mám vzorky. Tohle není normální."
    choices:
      - That's his last real post... -> strange_photo

  strange_photo:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurred photo of a glass furnace. Shot at a weird angle, posted
      at 2am. No caption. No hashtags.

      His friends say that's not how he posts. Marek always wrote long
      captions about his craft and the meaning behind each piece.
      The police say he probably left town. Nobody buys it.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: nadporucik
    text: >
      Přijali jsme oznámení o pohřešované osobě z obce Skelné Údolí.
      V tuto chvíli nemáme důvod se domnívat, že došlo k trestnému činu.
      Informace sdělte na lince 158 nebo na obvodním oddělení.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are all over the place. His roommate @tereza is
      panicking. His brother @jakub is driving down from Prague.
      His girlfriend @karolina is posting desperate messages from Liberec.
      The old master glassblower @pavel hasn't said a word — which is
      strange, because he and Marek were inseparable at the workshop.

      And the local journalist @jana is weirdly quiet.

      Nobody believes Marek just "left town." Not a guy who loved this
      place more than anything.
    effects: { trust_tereza: "+5", trust_jakub: "+5" }
    choices:
      - Start following Marek's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Skelné Údolí. Follow Marek's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Zuzana (pub owner, knows everyone) -> zuzana_intro
      - Talk to Libor (forester, saw the polluted stream) -> libor_intro
      - Talk to Tomáš (teen, seems upset) -> tomas_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is a mix of worry about Marek and the usual small-town
      rhythms: bus schedules, the bakery's weekend koláče specials,
      weather warnings about fog in the valley.

      Key names surface: Tereza (roommate, teacher), Pavel (master
      craftsman, mentor — conspicuously silent), Karolína (girlfriend
      in Liberec, frantic), and the teens — Tomáš, Filip, Lucie — who
      admired Marek's art.

      Also prominent: Bohemia Chemical s.r.o., the chemical plant
      upstream from the town. Their posts are bland corporate PR.
      Marek's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Zuzana -> zuzana_intro
      - Talk to Libor -> libor_intro
      - Talk to Tomáš -> tomas_intro

  # --- Zuzana (social map) ---

  zuzana_intro:
    type: tweet
    from: zuzana
    text: >
      Dneska je v hospodě ticho. @marek_dvorak, tvoje pivo čeká.
      Vrať se, vole.
    effects: { trust_zuzana: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Zuzana -> zuzana_talk

  zuzana_talk:
    type: message
    text: >
      ZUZANA: Ty seš novej? No, vítej. Horší timing jsi vybrat nemoh.
      Celý údolí je vzhůru nohama kvůli Markovi.

      Tak hele, řeknu ti kdo je kdo. Tereza je jeho spolubydlící, učí
      na základce, hrozně hodná holka, teď je z toho úplně na dně.
      Pavel Červenka — ten starý mistr sklář — ten Marka vedl od
      chvíle, kdy přišel do sklárny. Jako otec a syn. Ale v poslední
      době... nevím, něco mezi nima bylo. Pavel se choval divně.

      A pak je tu Jana Pokorná, novinářka. Ona a Marek na něčem
      spolupracovali. Něco ohledně tý chemičky nad městem. Od tý doby
      co Marek zmizel, Jana mlčí. To není jako ona.

      Jo, a Bohemia Chemical — těm nevěř ani slovo. Kurva, vím
      co říkám, smrdí to tu chemikáliema a oni tvrdí, že všechno je
      v normě.
    effects: { trust_zuzana: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Pavel -> zuzana_pavel
      - Ask about Bohemia Chemical -> zuzana_chemical
      - Thank her and move on -> quest1_hub

  zuzana_pavel:
    type: message
    text: >
      ZUZANA: Pavel? Vole, ten chlap je legenda. Třicet pět let
      u pece. Nejlepší sklář v celým kraji. Když Marek přišel před
      třema rokama, Pavel ho vzal pod křídla. Učil ho všechno.
      Marek říkal, že Pavel je nejlepší učitel, jakýho kdy měl.

      Jenže pak... Marek začal dělat vlastní věci. Moderní sklo,
      experimenty, sochy. Získal cenu v Praze. Začali o něm psát
      v novinách. A Pavel... hele, nevím přesně, ale vidím, jak se
      na Marka díval, když myslel, že ho nikdo nevidí. Fakt hustý
      pohled. Jako kdyby ho to žralo zevnitř.

      Marek mi jednou řekl: "Pavel mě nechce pustit." Myslela jsem,
      že mluví profesionálně. Teď si tím nejsem jistá.
    effects: { trust_zuzana: "+5" }
    choices:
      - Ask about Bohemia Chemical -> zuzana_chemical
      - Move on -> quest1_hub

  zuzana_chemical:
    type: message
    text: >
      ZUZANA: Ta fabrika tam stojí od devadesátek. Dělaj průmyslový
      chemikálie, rozpouštědla, hovno ví co přesně. Město to
      tolerovalo, protože dali lidem práci. Ale ten potok za
      sklárnou — ten, co teče z kopce od fabriky — ten smrdí čím
      dál víc. Ryby v něm nežijou už dva roky.

      Marek byl první, kdo tam fakt šel s foťákem a s lahvičkama
      na vzorky. Měl důkazy, říkal. Pořádný důkazy. A za dva týdny
      je pryč.

      Kurva, no řekni.
    effects: { trust_zuzana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Libor (forester, saw the stream) ---

  libor_intro:
    type: tweet
    from: libor
    text: >
      dvacet let hlídám tyhle lesy. potok od bohemia chemical je
      mrtvej. @marek_dvorak měl pravdu. a teď zmizel. zamyslete se.
    effects: { trust_libor: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Libor -> libor_talk

  libor_talk:
    type: message
    text: >
      LIBOR: Znám Šumavu jako vlastní dlaň. Každou pěšinu, každej
      potok, každýho jezevce. A říkám ti — voda z údolí nad fabrikou
      je čistá jako slza. Pod fabrikou? Oranžová. Smrdí po
      chemikáliích. Ryby tam chcípaly, žáby zmizely.

      Marek tam chodil, bral vzorky, fotil. Jednou jsem ho potkal
      v noci na stezce nad fabrikou. Měl foťák a čelovku. Říkal,
      že fotí, jak v noci pouštěj odpady do potoka.

      A pak — šups, pryč. Myslíš, že je to náhoda? Já na náhody
      v lese nevěřím.
    effects: { trust_libor: "+10" }
    choices:
      - Did you see anything unusual recently? -> libor_night
      - Move on -> quest1_hub

  libor_night:
    type: message
    text: >
      LIBOR: Noc předtím, než zmizel — byl jsem na obchůzce, kolem
      jedný ráno. Viděl jsem světlo v sklárně. To by nebylo divný,
      někdy pracujou pozdě. Ale bylo tam i auto, který tam normálně
      nestojí. Černý SUV. A u zadního vchodu stál chlap — Pavel
      Červenka.

      Ve dvě ráno. U sklárny. Sám. To není normální.

      Zapsal jsem si to do hlídkovýho deníku. Nikdo se na to
      neptal.
    effects: { trust_libor: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tomáš (teen, upset) ---

  tomas_intro:
    type: tweet
    from: tomas
    text: >
      do prdele lidi @marek_dvorak je jedinej kdo chápal umění v
      tomhle městě. ten by nikdy neodjel bez rozloučení. někdo
      nám něco neříká fakt
    effects: { trust_tomas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tomáš -> tomas_talk_early

  tomas_talk_early:
    type: message
    text: >
      TOMÁŠ: čus, ty seš novej? vole špatnej timing. hele marek
      je hustej člověk, naučil mě a filipa a lucii jak dělat
      se sklem, měli jsme u něj workshop každej pátek. taky nás
      nechal malovat graffiti na starý sklářský haly, říkal že
      umění patří všem.

      a teď jsem z toho v prdeli protože filip viděl něco divnýho
      tu noc ale nechce o tom mluvit. říká že to nic nebylo ale
      vole jasně že jo
    effects: { trust_tomas: "+10" }
    choices:
      - What did Filip see? -> tomas_filip_hint
      - Move on -> quest1_hub

  tomas_filip_hint:
    type: message
    text: >
      TOMÁŠ: nevím přesně. byl v noci venku na bmxku u sklárny a
      viděl jak někdo vynášel markovy věci z dílny. jeho sochy,
      foťák, ten velkej skleněnej kus co dělal na soutěž. filip
      říkal že ten chlap vypadal jako pavel ale nechce to říct
      nahlas protože se bojí. do prdele, vole, to je fakt hustý.

      zkus s ním promluvit ale pozor, je dost opatrnej s lidma
      co nezná
    effects: { trust_tomas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Skelné Údolí. A Bohemian town
      built around glassmaking for over a century. A young artist
      who was exposing pollution. A disappearance that makes no sense.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Tereza (Marek's roommate) -> tereza_q1
      - Talk to Karolína (Marek's girlfriend) -> karolina_q1
      - Check what Jakub (Marek's brother) is saying -> jakub_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Tereza Q1 ---

  tereza_q1:
    type: tweet
    from: tereza
    text: >
      prosím, jestli někdo viděl @marek_dvorak, ozvěte se.
      jeho pokoj je nedotčenej. foťák je pryč ale všechno ostatní
      je na místě. on by nikdy neodešel bez svýho nářadí.
    effects: { trust_tereza: "+5", contacts_followed: "+1" }
    choices:
      - DM Tereza -> tereza_q1_talk

  tereza_q1_talk:
    type: message
    text: >
      TEREZA: Díky, ale neznám tě. Marek má hodně přátel. Určitě
      se vrátí.

      ...To si říkám pořád dokola. Už tomu nevěřím.

      [Tereza is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_tereza: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Karolína Q1 ---

  karolina_q1:
    type: tweet
    from: karolina
    text: >
      @marek_dvorak lásko prosím tě ozvi se. jsem v liberci a
      nemůžu spát. tvůj telefon je mrtvej. tohle není jako ty.
      prosím. prosím.
    effects: { trust_karolina: "+5", contacts_followed: "+1" }
    choices:
      - DM Karolína -> karolina_q1_talk

  karolina_q1_talk:
    type: message
    text: >
      KAROLÍNA: Kdo jsi? Další člověk co chce drby? Marek prostě
      zmizel a nikdo nic nedělá. Policie říká, že si asi odjel.
      Kurva, kam by odjel? On miloval to město víc než cokoliv.
      Víc než mě, upřímně.

      Poslední co mi psal... napsal "mám problém s Pavlem, vysvětlím
      ti to o víkendu." Ten víkend nikdy nepřišel.
    effects: { trust_karolina: "+10" }
    choices:
      - What problem with Pavel? -> karolina_pavel
      - Move on -> quest1_hub

  karolina_pavel:
    type: message
    text: >
      KAROLÍNA: Nevím přesně. Marek mi říkal, že Pavel se chová
      divně. Že nechce, aby Marek dělal vlastní práci. Že mu
      sabotuje zakázky. Jednou Marek přišel do dílny a jeho
      rozpracovaná socha byla rozbitá. Pavel řekl, že spadla.
      Marek tomu nevěřil.

      A pak — asi měsíc zpátky — Marek říkal, že Pavel prochází
      jeho věci. Že někdo otevíral jeho skříňku v dílně. Že Pavel
      ví o jeho práci pro novinářku věci, který mu Marek nikdy
      neřekl.
    effects: { trust_karolina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jakub Q1 ---

  jakub_q1:
    type: tweet
    from: jakub
    text: >
      můj bratr ZMIZEL a policajti mi říkaj že si asi odjel???
      MAREK NEODJEDE BEZ TOHO ABY MĚ NEZAVOLAL. jedu z prahy.
      někdo mi to vysvětlí kurva.
    effects: { trust_jakub: "+5", contacts_followed: "+1" }
    choices:
      - DM Jakub -> jakub_q1_talk

  jakub_q1_talk:
    type: message
    text: >
      JAKUB: Kdo jsi? Další člověk z toho města, co mi řekne ať
      se uklidním? Marek mi volal tu noc. Poslední co řekl:
      "Jakube, mám průser. Pavel zjistil, že dělám s novinářkou.
      A ty lidi z chemičky — oni vědí, co mám."

      Pak se spojení přerušilo. To je poslední co jsem od něj
      slyšel.
    effects: { trust_jakub: "+10" }
    choices:
      - What do you think happened? -> jakub_theory
      - Move on -> quest1_hub

  jakub_theory:
    type: message
    text: >
      JAKUB: Myslím, že to má dvě vrstvy. Za prvý — Bohemia
