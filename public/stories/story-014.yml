  pavel_response:
    type: message
    text: >
      Pavel doesn't reply for a long time. Then:

      PAVEL: Nerozumíš tomu. Chránil jsem ho. On je talent jaký
      se rodí jednou za generaci. A ničil to tím svým vyšetřováním.
      Chtěl jsem jen, aby se soustředil na sklo. Všechno co jsem
      dělal bylo proto, že mi na něm záleží.

      That's not care. That's obsession.

      You've already sent the evidence to Nadporučík Krátký. And to
      Jana Pokorná.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Nadporučík Krátký reopens the case. With your evidence — the
      anonymous account, the workshop access logs, the removed
      sculptures, the witness testimonies — Pavel is arrested for
      stalking, harassment, and theft of Marek's artwork. A GPS
      tracker is recovered from under Marek's Škoda parked at
      the old fishing hut by Černý rybník.

      Jana Pokorná, finally in possession of Marek's full evidence
      package, publishes the Bohemia Chemical story in Respekt. The
      environmental inspectorate orders an unannounced inspection.
      The factory is shut down pending remediation. Ondřej Bartoš
      faces criminal charges for falsifying discharge data. Barrels
      of toxic waste are excavated from the forest.

      And Marek Dvořák, reading the story from a friend's cottage
      near Český Krumlov, calls his brother for the first time in
      nine days.

      "Jakube, jedu domů."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: marek
    text: >
      sklo nelže. voda nelže. a lidi ze skelného údolí taky ne.
      díky, že jste to nevzdali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Ondřej (Partial Ending) ---

  confront_ondrej:
    type: message
    text: >
      You present the pollution evidence to Ondřej Bartoš:

      "I have photographs of the undeclared discharge pipe. I have
