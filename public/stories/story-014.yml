      But it's too late. You've sent the evidence to Jana, to the
      Spolek Čistý Potok, and to the inspectorate.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. Bohemia Chemical is ordered to halt
      all discharge pending investigation. The factory may close
      permanently. 150 jobs hang in the balance. The town is divided.

      But Marek?

      Without the stalking evidence, Pavel is never investigated.
      He continues to work at the glassworks. He continues to monitor
      Marek's accounts. He creates a new anonymous profile.

      Three months later, Marek reads about Bohemia Chemical online.
      He returns quietly. He changes workshops. He stops working late
      alone. He checks his car every morning.

      The corporation is exposed. But the person who terrorised
      Marek walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: marek
    text: "vrátil jsem se. potok je čistší. zbytek... uvidíme."
    choices:
