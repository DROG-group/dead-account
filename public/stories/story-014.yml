  # --- ENDING A: Pavel (Best Ending) ---

  confront_pavel:
    type: message
    text: >
      You present your evidence to Pavel:

      "I know @SkelnyDuch is your account. I know you removed Marek's
      work from the workshop. I know you watched his flat at night.
      I know you went through his sketches and files. I have witnesses
      and I have the access logs."
    choices:
