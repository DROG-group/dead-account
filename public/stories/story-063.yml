entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN DOLINA ZIELONA
  # =====================================================================

  welcome:
    type: message
    text: >
      Witamy na DolinaZielona.social — instancji społeczności Doliny
      Zielonej, małej wsi w Bieszczadach.

      Na lokalnym feedzie dziś jest dziwny niepokój. Coś się stało.
    choices:
      - Sprawdź feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Przewijając feed, zauważasz jedno imię powtarzające się wszędzie:
      @zofia_mazur.

      Malarka ludowa. Ikonografka bieszczadzka. Dokumentowała piękno
      i ciemne strony doliny. Ludzie się martwią. Nie publikowała
      nic od pięciu dni.
    choices:
      - Popatrz na jej profil -> zofia_profile

  zofia_profile:
    type: tweet
    from: zofia
    text: "Woda w potoku za fabryką nie jest już przejrzysta. Ktoś zatruwa dolinę. Mam dowody. Namalowałam to wszystko."
    choices:
      - To jej ostatni post... -> grey_painting

  grey_painting:
    type: message
    text: >
      Dwa dni po tym poście na jej koncie pojawiło się jedno zdjęcie:
      szary obraz. Rozmazany, prześwietlony, namalowany z dziwnej
      perspektywy. Opublikowany o 3 w nocy. Bez podpisu.

      Jej przyjaciele mówią, że to nie jej styl. Policja mówi, że
      pewnie pojechała gdzieś na plener. Coś tu nie gra.
    choices:
      - Przeczytaj oświadczenie policji -> policja_statement
      - Zobacz, co mówią ludzie -> community_reaction

  policja_statement:
    type: tweet
    from: komendant
    text: >
      Otrzymaliśmy zgłoszenie dotyczące mieszkanki Doliny Zielonej.
      Na obecnym etapie brak przesłanek wskazujących na czyn
      zabroniony. Wszelkie informacje proszę kierować pod numer 112
      lub bezpośrednio na posterunek.
    choices:
      - Co mówią ludzie? -> community_reaction

  community_reaction:
    type: message
    text: >
      Reakcje są chaotyczne. Siostra Zofii @kasia_mazur jest
      zdesperowana. Brat @bartek_mazur jedzie z Rzeszowa. Kolega
      artysta @marek_witkowski pisze niespokojne wiadomości. Leśnik
      @janek_wozniak mówi, że Zofia miała rację co do wody.

      A dziennikarka @agata_zajac jest podejrzanie cicha.

      Nikt nie wierzy policji. Nikt nie wierzy, że Zofia po prostu
      pojechała na plener.
    effects: { trust_kasia: "+5", trust_bartek: "+5" }
    choices:
      - Zacznij śledzić kontakty Zofii -> quest1_start

  # =====================================================================
  # QUEST 1: PIERWSZE WRAŻENIA
  # =====================================================================

  quest1_start:
    type: message
    text: >
      ZADANIE: PIERWSZE WRAŻENIA

      Poznaj Dolinę Zieloną. Obserwuj kontakty Zofii i czytaj ich
      posty. Im więcej rozmawiasz ze społecznością, tym bardziej
      ci zaufają.

      Zacznij od osób, które wyglądają na najbardziej otwarte.
    choices:
      - Porozmawiaj z Heleną (gospoda, zna wszystkich) -> helena_intro
      - Porozmawiaj z Jankiem (leśnik, widział wodę) -> janek_intro
      - Porozmawiaj z Olą (nastolatka, jest wstrząśnięta) -> ola_intro
      - Sprawdź lokalny feed -> feed_browse

  feed_browse:
    type: message
    text: >
      Feed miesza panikę o Zofii z rytmem małej górskiej wsi:
      prognoza pogody, godziny otwarcia sklepu Gosi, ostrzeżenia
      o niedźwiedziach.

      Pojawiają się kluczowe nazwiska: Kasia (siostra, nauczycielka),
      Marek (ceramik, wydaje się rozbity), Agata (dziennikarka,
      dziwnie cicha) i nastolatki — Ola, Damian, Zuzia — które
      uwielbiały prace Zofii.

      Widoczna jest też firma BieszczadChem Sp. z o.o., zakład
      chemiczny na skraju wsi. Ich posty to korporacyjny PR.
      Posty Zofii były ich przeciwieństwem.
    effects: { contacts_followed: "+3" }
    choices:
      - Porozmawiaj z Heleną -> helena_intro
      - Porozmawiaj z Jankiem -> janek_intro
      - Porozmawiaj z Olą -> ola_intro

  # --- Helena (social map) ---

  helena_intro:
    type: tweet
    from: pani_helena
    text: >
      Gospoda otwarta, ale serce nie na miejscu. @zofia_mazur,
      twój stolik czeka. Wracaj do nas.
    effects: { trust_pani_helena: "+5", contacts_followed: "+1" }
    choices:
      - Odpowiedz Helenie -> helena_talk

  helena_talk:
    type: message
    text: >
      HELENA: O, nowy jesteś? Witaj. Kiepski moment na przyjazd.
      Wszyscy się denerwują przez Zofię.

      Powiem ci kto jest kto. Kasia to siostra Zofii — uczą w
      podstawówce, mieszka nad apteką. Złota dziewczyna, teraz
      załamana. Marek Witkowski to ceramik, pracuje z Zofią od lat.
      Dobry facet, ale... dziwnie się zachowuje od jakiegoś czasu.
      Bartek to brat Zofii, jedzie z Rzeszowa.

      A Agata Zając — dziennikarka — ona i Zofia nad czymś razem
      pracowały. Coś o wodzie. Agata od zniknięcia Zofii nie
      odezwała się ani słowem. To do niej niepodobne.

      A od BieszczadChemu trzymaj się z daleka. Kłamstwa opakowane
      w certyfikaty ISO.
    effects: { trust_pani_helena: "+10", contacts_followed: "+2" }
    choices:
      - Zapytaj o Marka -> helena_marek
      - Zapytaj o BieszczadChem -> helena_fabryka
      - Podziękuj i idź dalej -> quest1_hub

  helena_marek:
    type: message
    text: >
      HELENA: Marek? Był tu dłużej niż Zofia. Świetny ceramik.
      Ale od kiedy Zofia zaczęła wystawiać i zyskała rozgłos, on
      się zmienił. Przychodził do gospody kiedy ona tu była. Chciał
      pomagać przy każdym projekcie. Pilnował jej jak cień.

      Zofia mi kiedyś powiedziała: "On nie przyjmuje nie za
      odpowiedź." Myślałam, że chodzi o sztukę. Teraz nie jestem
      taka pewna.

      A ostatnio pojawił się jakiś kolekcjoner z Krakowa. Dziwny
      typ. Miał obsesję na punkcie ikon Zofii. Marek się wściekał,
      że ten gość ją nagabuje, ale cholera... czasem wyglądało to
      jak zazdrość, nie troska.
    effects: { trust_pani_helena: "+5" }
    choices:
      - Zapytaj o BieszczadChem -> helena_fabryka
      - Idź dalej -> quest1_hub

  helena_fabryka:
    type: message
    text: >
      HELENA: Ta fabryka stoi tu od lat dziewięćdziesiątych. Robią
      jakieś rozpuszczalniki, środki czyszczące, cholera wie co.
      Wioska tolerowała ich, bo dawali pracę. Ale leśnicy i
      pszczelarze narzekają od lat — dziwne kolory w potoku za
      fabryką, martwe ryby, pszczoły zdychają.

      Zofia pierwsza poszła tam z aparatem i próbówkami. Miała
      dowody, mówiła. Prawdziwe dowody. Namalowała serię obrazów
      o zatruciu — "Szara Dolina". Dwa tygodnie później jej nie ma.
    effects: { trust_pani_helena: "+5" }
    choices:
      - Idź dalej -> quest1_hub

  # --- Janek (the water, witness tease) ---

  janek_intro:
    type: tweet
    from: janek
    text: >
      trzydzieści lat chodzę po tych lasach. woda w potoku nie
      jest już taka sama. @zofia_mazur miała rację. a teraz jej
      nie ma. połączcie fakty.
    effects: { trust_janek: "+5", contacts_followed: "+1" }
    choices:
      - Odpowiedz Jankowi -> janek_talk

  janek_talk:
    type: message
    text: >
      JANEK: Chodzę po tych górach od trzydziestu lat. Znam każdy
      potok, każdy kolor wody. I mówię ci — woda za fabryką jest
      nie taka. Od miesięcy. Ryby zdychają. Trawa przy brzegu jest
      żółta. Pszczoły Wiesława uciekają z uli.

      Zofia brała próbki wody. Robiła zdjęcia rur odpływowych.
      Fotografowała wszystko. I malowała to — swoje obrazy były
      jak dokumenty. Budowała sprawę. A potem puf — nie ma jej.

      Myślisz, że to przypadek? Ja pierdolę, w tych górach nie
      ma przypadków.
    effects: { trust_janek: "+10" }
    choices:
      - Widziałeś coś dziwnego ostatnio? -> janek_night
      - Idź dalej -> quest1_hub

  janek_night:
    type: message
    text: >
      JANEK: Noc przed jej zniknięciem — wracałem z obchodu lasu,
      koło pierwszej w nocy. Widziałem światła w pracowni Zofii.
      To nie jest nienormalne, artyści pracują późno. Ale na
      parkingu stały dwa samochody. Jeden to był stary fiat Zofii.
      Drugi — czarne BMW z rejestracją RZ. Firmowy samochód
      BieszczadChemu.

      O pierwszej w nocy. Przy pracowni artystki.

      Nie myślałem o tym wtedy. Teraz myślę o tym bez przerwy.
    effects: { trust_janek: "+5" }
    choices:
      - Idź dalej -> quest1_hub

  # --- Ola (teen, witness tease) ---

  ola_intro:
    type: tweet
    from: ola
    text: >
      kurwa nie wierzę @zofia_mazur to ona mnie nauczyła patrzeć
      na te góry tak naprawdę. no nie, to jest niemożliwe żeby
      tak po prostu wyjechała. jeśli ktoś coś wie to piszcie
    effects: { trust_ola: "+5", contacts_followed: "+1" }
    choices:
      - Odpowiedz Oli -> ola_talk_early

  ola_talk_early:
    type: message
    text: >
      OLA: spoko, nowy jesteś? kiepski timing. w sumie zofia to
      jest najlepsza osoba w tej wsi. uczyła nas malować, brała
      nas na szlaki, pokazywała nam jak fotografować bieszczady.
      mega kobieta.

      i teraz się boję bo damian widział jakiś dziwny shit koło
      pracowni zofii ale nie chce gadać. mówi że to nic ale
      cholera... to nie jest nic
    effects: { trust_ola: "+10" }
    choices:
      - Co widział Damian? -> ola_damian_hint
      - Idź dalej -> quest1_hub

  ola_damian_hint:
    type: message
    text: >
      OLA: nie wiem dokładnie. był na rowerze wieczorem koło
      pracowni i widział jakiegoś gościa który grzebał w
      samochodzie zofii?? albo coś takiego. flipuje totalnie
      nie chce gadać. musisz z nim bezpośrednio pogadać ale
      jest mega nieufny do obcych. pogadaj z nim najpierw
      o rowerach albo górach xD
    effects: { trust_ola: "+5" }
    choices:
      - Idź dalej -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      Zaczynasz rozumieć Dolinę Zieloną. Bieszczadzka wioska
      zbudowana wokół gór i lasu. Malarka ludowa, która ujawniała
      zanieczyszczenia. Zniknięcie, w które nikt nie wierzy
      dobrowolnie.

      Nawiązałeś kontakty. Teraz kopaj głębiej.
    choices:
      - Porozmawiaj z Kasią (siostra Zofii) -> kasia_q1
      - Porozmawiaj z Markiem (kolega artysta Zofii) -> marek_q1
      - Sprawdź co mówi Bartek (brat Zofii) -> bartek_q1
      - Jestem gotowy zbadać noc jej zniknięcia -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Kasia Q1 ---

  kasia_q1:
    type: tweet
    from: kasia
    text: >
      jeśli ktoś ma wieści od @zofia_mazur niech zadzwoni.
      jej pracownia jest nietknięta. farby na stole. pędzle
      w wodzie. nigdy by nie wyjechała zostawiając tego.
    effects: { trust_kasia: "+5", contacts_followed: "+1" }
    choices:
      - Napisz do Kasi -> kasia_q1_talk

  kasia_q1_talk:
    type: message
    text: >
      KASIA: Dziękuję za zainteresowanie, ale cię nie znam.
      Zofia ma tu wielu przyjaciół. Na pewno wróci.

      ...ciągle to powtarzam. Sama już w to nie wierzę.

      [Kasia jest ostrożna. Musisz zbudować więcej zaufania,
      zanim się otworzy.]
    effects: { trust_kasia: "+5" }
    choices:
      - Idź dalej -> quest1_hub

  # --- Marek Q1 ---

  marek_q1:
    type: tweet
    from: marek
    text: >
      Pracownia pusta bez @zofia_mazur. Jej obrazy stoją na
      sztalugach. Seria "Szara Dolina" niedokończona. Nigdy
      by nie porzuciła niedokończonej pracy. Coś się stało.
    effects: { trust_marek: "+5", contacts_followed: "+1" }
    choices:
      - Napisz do Marka -> marek_q1_talk

  marek_q1_talk:
    type: message
    text: >
      MAREK: Z Zofią pracujemy razem od pięciu lat. Jest
      najbardziej oddaną artystką jaką znam. To dochodzenie
      w sprawie zanieczyszczeń — to było dla niej wszystko.
      Miała dane, zdjęcia, próbki. Była blisko ujawnienia
      tego publicznie.

      Proponowałem jej pomoc. Wiele razy. Mówiła, że ma to
      pod kontrolą. Że pracuje z dziennikarką. Chciałem
      ją tylko wspierać.

      [Marek wydaje się szczery. Albo obsesyjny?]
    effects: { trust_marek: "+5" }
    choices:
      - Idź dalej -> quest1_hub

  # --- Bartek Q1 ---

  bartek_q1:
    type: tweet
    from: bartek
    text: >
      moja siostra ZNIKNĘŁA a policja mi mówi że pewnie
      pojechała na plener??? ONA NIE WYJEŻDŻA BEZ
      UPRZEDZENIA. jadę z rzeszowa. ktoś mi to wytłumaczy.
    effects: { trust_bartek: "+5", contacts_followed: "+1" }
    choices:
      - Napisz do Bartka -> bartek_q1_talk

  bartek_q1_talk:
    type: message
    text: >
      BARTEK: Kim jesteś? Kolejna osoba z tej wsi, która
      powie mi, żebym się uspokoił? Moja siostra zadzwoniła
      do mnie noc przed zniknięciem. Powiedziała, że ma coś
      dużego. Powiedziała "jeśli coś mi się stanie, patrz
      na BieszczadChem." Potem się rozłączyła.

      To ostatnie co od niej słyszałem.
    effects: { trust_bartek: "+10" }
    choices:
      - Jak myślisz, co się stało? -> bartek_theory
      - Idź dalej -> quest1_hub

  bartek_theory:
