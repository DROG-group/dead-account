# DEAD ACCOUNT — Story 015: Thyborøn (Denmark)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-015.yml
#
# Player investigates the disappearance of wind energy engineer Mads Vestergaard
# in the fictional Jutland coastal town of Thyborøn.

