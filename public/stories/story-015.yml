      bio: "Hjemmebagt | Lokalt bryg | Livemusik fredag | Thyborøns stue"
      avatar: avatars/cafe_vest.jpg
    lars:
      name: "Lars Fisker"
      bio: "kutterfisker | 35 år på havet | vestkysten er mit liv"
      avatar: avatars/lars.jpg
    jens:
      name: "Jens Krogh"
      bio: "havnemester | Thyborøn havn | kontor tirs-lør"
      avatar: avatars/jens.jpg
    pernille:
