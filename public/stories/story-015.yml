    kasper:
      name: "Kasper Vestergaard"
      bio: "mads' storebror | fisker | limfjorden | han er sgu ikke bare taget af sted"
      avatar: avatars/kasper.jpg
    nikolaj:
      name: "Nikolaj Bech"
      bio: "ingeniør | NordVind Energy | kollega & ven af mads | noget er helt galt"
      avatar: avatars/nikolaj.jpg

    # === Local Government ===
    henrik:
      name: "Henrik Dahl"
      bio: "Borgmester i Thyborøn | Bæredygtig vækst til vestkysten | #ThyborønFremad"
      avatar: avatars/henrik.jpg
    birgitte:
