      - I need more evidence -> investigation_hub

  # --- ENDING A: Nikolaj (Best Ending) ---

  confront_nikolaj:
    type: message
    text: >
      You present your evidence to Nikolaj:

      "I know @storm_vest is your account. I know you put a GPS tracker
      on Mads' car. I know you accessed his files at the office. I know
      you were watching his flat. I have witnesses and I have the
      access logs."
    choices:
