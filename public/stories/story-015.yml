  nikolaj_response:
    type: message
    text: >
      Nikolaj doesn't reply for a long time. Then:

      NIKOLAJ: Du forstår det ikke. Jeg beskyttede ham. Han var i
      fare fra NordVind og han ville ikke lade mig hjælpe. Jeg var
      nødt til at vide han var okay. Alt hvad jeg gjorde var fordi
      jeg bekymrer mig om ham.

      That's not concern. That's obsession.

      You've already sent the evidence to Betjent Andersen. And to
      Camilla Nørgaard.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen fast.

      Betjent Andersen reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the
      witnesses — Nikolaj is arrested for stalking. A tracker is
      recovered from under Mads' car at the fishing huts near Agger.

      Camilla Nørgaard publishes the NordVind story in Politiken.
      Arbejdstilsynet orders an unannounced inspection. The park is
      shut down pending remediation. Erik Brandt faces criminal
      charges. Three injured workers file lawsuits.

      And Mads Vestergaard, reading the story from a friend's house
      in Aarhus, calls his brother for the first time in nine days.

      "Jeg kommer hjem."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: mads
    text: >
      vinden stopper aldrig. og folk i thyborøn heller ikke. tak
      fordi i ikke gav op.
    choices:
      - The End -> game_complete

  # --- ENDING B: Erik (Partial Ending) ---

  confront_erik:
    type: message
    text: >
      You present the safety evidence to Erik Brandt:

      "I have photographs of corroded foundations. I have maintenance
      reports showing critical failures reclassified as minor. I have
      your original safety inspections showing the data was falsified.
      I have the foundation plate with your serial number. I have
      three injured workers."
