    # === Suspicious / Other ===
    sanne:
      name: "Sanne Riis"
      bio: "sikkerhedsinspektør | NordVind Energy | jeg gør bare mit arbejde"
      avatar: avatars/sanne.jpg
    storm_vest:
      name: "StormVest"
      bio: "."
      avatar: avatars/anon.jpg
    betjent:
      name: "Betjent Andersen"
      bio: "Thyborøn Politi | Lokalpolitiet | nødsituation: 112"
      avatar: avatars/betjent.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN THYBORØN
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to thyborøn.social — the community Mastodon instance for
      the wind-battered coastal town of Thyborøn, Jutland.

      The local feed is restless today. The wind is howling but that's
      not what has people on edge.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @mads_vestergaard.

      A young wind energy engineer. He worked on the offshore turbines.
      He loved the sea. People are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> mads_profile

  mads_profile:
    type: tweet
    from: mads
    text: "Turbine 7 er stadig nede. Tredje 'uheld' denne måned. NordVind siger det er vejret. Bullshit. Jeg har set vedligeholdelsesrapporterne. Det her er bevidst nedprioritering."
    choices:
      - That's his last real post... -> grey_turbine

  grey_turbine:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a grey turbine blade, blurred, shot from a strange angle. Posted
      at 2am. No caption.

      His girlfriend says that's not how Mads posts. He always writes
      long captions about the engineering. The police say he probably
      went travelling. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: betjent
    text: >
      Vi har modtaget en anmeldelse vedrørende en beboer i Thyborøn.
      På nuværende tidspunkt er der intet der tyder på kriminel
      handling. Alle relevante oplysninger kan meddeles på 112 eller
      til lokalpolitiet.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @freja_holm is
      desperate. His brother @kasper_vestergaard is driving down from
      the Limfjord. His colleague @nikolaj_bech is posting frantic
      messages. The fisherman @lars_fisker says Mads was right about
      the turbines.

      And the journalist @camilla_noergaard is strangely silent.

      Nobody buys the police's line. Nobody thinks Mads just
      "went travelling."
    effects: { trust_freja: "+5", trust_kasper: "+5" }
    choices:
      - Start following Mads' contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Thyborøn. Follow Mads' contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Astrid (café owner, knows everyone) -> astrid_intro
      - Talk to Lars (fisherman, saw things at sea) -> lars_intro
      - Talk to Sofie (teen surfer, seems shaken) -> sofie_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Mads with small-town Jutland life:
      wind forecasts, fishing quotas, bakery specials, weather warnings.

      Key names surface: Freja (girlfriend, nurse), Nikolaj (colleague,
      seems rattled), Camilla (journalist, oddly quiet), and the
      teens — Sofie, Ida, Signe — who looked up to Mads and his
      fight for green energy.

      Also prominent: NordVind Energy A/S, the offshore wind company.
      Their posts are slick corporate PR. Mads' posts were the
      opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Astrid -> astrid_intro
      - Talk to Lars -> lars_intro
      - Talk to Sofie -> sofie_intro

  # --- Astrid (social map) ---

  astrid_intro:
    type: tweet
    from: astrid
    text: >
      Cafeen er åben men humøret er i bund. @mads_vestergaard, din
      plads ved vinduet står tom. Kom hjem.
    effects: { trust_astrid: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Astrid -> astrid_talk

  astrid_talk:
    type: message
    text: >
      ASTRID: Nå, du er ny? Velkommen. Satans dårlig timing. Hele
      byen er oppe at køre over Mads.

      Freja er Mads' kæreste — de bor over apoteket. Helt knust.
      Nikolaj Bech arbejder hos NordVind med Mads. Dygtig, men...
      lidt intens omkring ham. Kasper er Mads' storebror, kommer ned
      fra Limfjorden.

      Og Camilla Nørgaard — journalisten — hun og Mads arbejdede på
      noget om turbinerne. Camilla har ikke sagt et ord siden Mads
      forsvandt. Det er sgu ikke normalt.

      Hold dig fra NordVinds PR. Løgn pakket ind i certificeringer.
    effects: { trust_astrid: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Nikolaj -> astrid_nikolaj
      - Ask about NordVind -> astrid_nordvind
      - Thank her and move on -> quest1_hub

  astrid_nikolaj:
    type: message
    text: >
      ASTRID: Nikolaj? To år længere end Mads på NordVind. Dygtig.
      Men siden Mads startede har Nikolaj været... klæbende. I cafeen
      hver gang. Tilbød at hjælpe med alt. Mads var høflig men
      irriteret.

      Blev værre efter sikkerhedsundersøgelsen. Mads sagde til mig:
      "Han tager sgu ikke et nej." Jeg troede han mente fagligt.
      Nu er jeg ikke sikker.
    effects: { trust_astrid: "+5" }
    choices:
      - Ask about NordVind -> astrid_nordvind
      - Move on -> quest1_hub

  astrid_nordvind:
    type: message
    text: >
      ASTRID: NordVind har haft turbineparken i fem år. De lovede
      jobs og grøn energi. Men fiskerne har klaget — mærkelige
      ulykker, teknikere med skader NordVind kalder "mindre
      hændelser."

      Mads var den første der dokumenterede det. Rapporter, billeder
      af defekte komponenter. Han sagde de sparede penge ved at
      springe sikkerhedstjek over. To uger efter er han væk. For
      fanden.
    effects: { trust_astrid: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lars (fisherman, witness tease) ---

  lars_intro:
    type: tweet
    from: lars
    text: >
      35 år på havet. de vindmøller er ikke sikre. @mads_vestergaard
      havde ret. og nu er han forsvundet. tænk over det.
    effects: { trust_lars: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Lars -> lars_talk

  lars_talk:
    type: message
    text: >
      LARS: Jeg har fisket her siden jeg var femten. De turbiner er
      lortefarlige. Teknikere hejst op i vindstyrker hvor de aldrig
      burde arbejde.

      Mads tog billeder. Fotograferede fundamenterne der rustede
      igennem. Byggede en sag. Og så — puf — væk.

      Tilfældigt? Det gør jeg kraftedeme ikke.
    effects: { trust_lars: "+10" }
    choices:
      - Did you see anything unusual recently? -> lars_night
      - Move on -> quest1_hub

  lars_night:
    type: message
    text: >
      LARS: Natten før han forsvandt — jeg var ude at fiske, kom ind
      omkring klokken et. Jeg så lys på NordVind-kontoret nede ved
      havnen. Ikke unormalt, folk arbejder sent. Men der holdt to
      biler. Den ene var Mads' gamle Skoda. Den anden var en sort
      firmabil med NordVind-logo.

      Klokken et om natten. På vindmøllekontoret.

      Jeg tænkte ikke videre over det dengang. Nu tænker jeg sgu
      ikke på andet.
    effects: { trust_lars: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sofie (teen surfer, witness tease) ---

  sofie_intro:
    type: tweet
    from: sofie
    text: >
      er helt i chok seriøst @mads_vestergaard det var ham der lærte
      os om havet og vinden og alt det der. der er sgu noget galt.
      hvis nogen ved noget så sig det for fanden
    effects: { trust_sofie: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sofie -> sofie_talk_early

  sofie_talk_early:
    type: message
    text: >
      SOFIE: hvem er du? ny herude? sygt timing. altså mads er bare
      den fedeste person i byen. han lærte os at windsurfe safe, han
      viste os hvordan turbinerne fungerer. mega fedt.

      og nu flipper jeg fordi ida så noget vildt mærkeligt nede ved
      havnen den anden aften men hun vil ikke snakke om det. hun siger
      det er ingenting men det er sgu ikke ingenting altså
    effects: { trust_sofie: "+10" }
    choices:
      - What did Ida see? -> sofie_ida_hint
      - Move on -> quest1_hub

  sofie_ida_hint:
    type: message
    text: >
      SOFIE: ved ikke præcis. hun var nede og tage billeder ved
      solnedgang og hun så en eller anden rode rundt i mads' bil??
      eller noget i den stil. hun flipper totalt og vil ikke snakke.
      du skal nok spørge hende direkte men hun er lidt sky over for
      folk hun ikke kender. snak om fotografi med hende først haha
    effects: { trust_sofie: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Thyborøn. A Jutland coastal town
      shaped by wind and sea. A young engineer who was exposing safety
      failures. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Freja (Mads' girlfriend) -> freja_q1
      - Talk to Nikolaj (Mads' colleague) -> nikolaj_q1
      - Check what Kasper (Mads' brother) is saying -> kasper_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Freja Q1 ---

  freja_q1:
    type: tweet
    from: freja
    text: >
      hvis nogen har hørt fra @mads_vestergaard ring til mig. hans
      tøj er der stadig. hans dykkerudstyr er der. han ville aldrig
      tage af sted uden at sige noget.
    effects: { trust_freja: "+5", contacts_followed: "+1" }
    choices:
      - DM Freja -> freja_q1_talk

  freja_q1_talk:
    type: message
    text: >
      FREJA: Tak fordi du skriver, men jeg kender dig ikke. Mads har
      mange venner herude. Jeg er sikker på han kommer tilbage.

      ...Det siger jeg hele tiden. Jeg tror sgu ikke på det mere.

      [Freja is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_freja: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nikolaj Q1 ---

  nikolaj_q1:
    type: tweet
    from: nikolaj
    text: >
      Kontoret er tomt uden @mads_vestergaard. Hans rapporter ligger
      stadig på skrivebordet. Hans sikkerhedslog er åben. Han ville
      aldrig forlade igangværende arbejde. Der er sket noget.
    effects: { trust_nikolaj: "+5", contacts_followed: "+1" }
    choices:
      - DM Nikolaj -> nikolaj_q1_talk

  nikolaj_q1_talk:
    type: message
    text: >
      NIKOLAJ: Mads og jeg har arbejdet sammen i over et år. Han er
      den mest dedikerede ingeniør jeg kender. Den her
      sikkerhedsundersøgelse — det var alt for ham. Han havde data,
      billeder, vedligeholdelsesrapporter. Han var tæt på at gå til
      pressen.

      Jeg tilbød at hjælpe ham. Mange gange. Han sagde han havde styr
      på det. Han sagde han arbejdede med en journalist. Jeg ville
      bare støtte ham.

      [Nikolaj seems earnest. Or obsessive?]
    effects: { trust_nikolaj: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kasper Q1 ---

  kasper_q1:
    type: tweet
    from: kasper
    text: >
      min bror er FORSVUNDET og politiet siger han måske er taget
      på ferie??? HAN TAGER SGU IKKE PÅ FERIE UDEN AT SIGE DET.
      jeg kører til thyborøn nu. nogen skal satans forklare mig det.
    effects: { trust_kasper: "+5", contacts_followed: "+1" }
    choices:
      - DM Kasper -> kasper_q1_talk

  kasper_q1_talk:
    type: message
    text: >
      KASPER: Hvem fanden er du? Endnu en fra den by der vil have mig
      til at slappe af? Min bror ringede til mig aftenen før han
      forsvandt. Han sagde han havde noget stort. Han sagde "hvis der
      sker noget, så kig på NordVind." Så lagde han på.

      Det er det sidste jeg har hørt fra ham.
    effects: { trust_kasper: "+10" }
    choices:
      - What do you think happened? -> kasper_theory
      - Move on -> quest1_hub

  kasper_theory:
    type: message
    text: >
      KASPER: Jeg tror han fandt bevis for at NordVind fusker med
      sikkerheden og de har lukket munden på ham. Men jeg tror også
      den der mærkelige kollega — Nikolaj — ved mere end han siger.
      Måden han snakker om Mads... det er ikke bare kollegial
      bekymring. Det er noget andet.

      Mads fortalte mig for måneder siden at nogen på kontoret gik
      ind i hans filer. Han troede det var ingenting. Det tror jeg
      sgu ikke det var.
    effects: { trust_kasper: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Mads went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Ida (was taking photos near the harbour) -> ida_interview
      - Find Jens (harbour master, works late) -> jens_interview
      - Find Thomas (windsurfer, early morning at the beach) -> thomas_interview
      - Find Dorthe (baker, starts at 4am, saw something) -> dorthe_interview

  # --- Ida (saw someone at Mads' car) ---

  ida_interview:
    type: tweet
    from: ida
    text: >
      god session med kameraet i aften men stemningen nede ved havnen
      er bare off. der er noget der ikke passer. kan ikke forklare det
    effects: { trust_ida: "+5" }
    choices:
      - Ask Ida about that evening -> ida_talk

  ida_talk:
    type: message
    text: >
      IDA: ok men du siger det ikke til nogen ja? jeg var nede ved
      havnen ved syv-tiden, tog billeder af solnedgangen. og jeg så
      ham fra kontoret — nikolaj — ved siden af mads' bil. det så ud
      som om han rodede rundt i den eller lagde noget. da han så mig
      gik han mega hurtigt.

      altså jeg sagde ingenting fordi jeg gad ikke bøvl men det er
      sgu sygt. det er ikke normalt hans opførsel
    effects:
      trust_ida: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Jens (harbour master, saw late-night meeting) ---

  jens_interview:
    type: tweet
    from: jens
    text: >
      Påmindelse: havneområdet er lukket mellem kl 22 og 6. Jeg har
      konstateret uautoriseret adgang de seneste nætter.
    effects: { trust_jens: "+5" }
    choices:
      - Ask Jens what he saw -> jens_talk

  jens_talk:
    type: message
    text: >
      JENS: Jeg var ved at lukke havnekontoret omkring klokken halv
      elleve. Jeg så Mads' bil stadig holde på NordVind-parkeringen.
      Og en sort sedan med NordVind-nummerplader holdt ved siden af.
      To mænd stod ved kontorindgangen. Den ene genkendte jeg:
      Erik Brandt, driftsdirektøren.

      Klokken halv elleve. På vindmøllekontoret. Det er sgu ikke
      normalt.

      Jeg skrev det i havneloggen. Ingen har bedt om at se den.
    effects:
      trust_jens: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Thomas (saw Mads fleeing) ---

  thomas_interview:
    type: tweet
    from: thomas
    text: >
      oppe klokken fire for morgen-session. stranden var ikke tom.
      der var en der løb på stien langs kysten. i mørket. det var
      ikke en jogger.
    effects: { trust_thomas: "+5" }
    choices:
      - Ask Thomas what he saw -> thomas_talk

  thomas_talk:
    type: message
    text: >
      THOMAS: Jeg står op klokken fire til morgen-surf. Den morgen —
      morgenen efter Mads' sidste opslag — så jeg nogen på kyststien.
      Løb. En mand med en taske, på vej mod Agger Tangen. Det var
      stadig mørkt. Han bevægede sig hurtigt, som om han var bange.

