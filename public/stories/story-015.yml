  erik_response:
    type: message
    text: >
      ERIK: Denne samtale videresendes til vores juridiske afdeling.
      Enhver offentliggørelse af injurierende materiale vil medføre
      øjeblikkelig retsforfølgelse. NordVind Energy har altid opereret
      inden for gældende sikkerhedskrav.

      But it's too late. You've sent the evidence to Camilla, to
      Foreningen Sikker Vind, and to Arbejdstilsynet.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The safety story breaks. NordVind is ordered to halt operations
      pending investigation. The turbine park may close. A hundred
      and fifty jobs hang in the balance. The town is divided.

      But Mads? Without the stalking evidence, Nikolaj is never
      investigated. He continues at NordVind. He monitors Mads'
      accounts. He creates a new anonymous profile.

      Three months later, Mads reads about NordVind online. He
      returns quietly. Changes companies. Stops working alone. Checks
      his car every morning.

      The corporation is exposed. But the person who terrorised Mads
