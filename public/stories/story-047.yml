          gte: 3
      - Confront Meras Zaremba (political corruption) -> confront_meras
      - I need more evidence -> investigation_hub

  # --- ENDING A: Gintare (Best Ending) ---

  confront_gintare:
    type: message
    text: >
      You present your evidence to Gintare:


      "I know @juros.sirdis is your account. I know you put a GPS
      tracker on the Neringa. I know you were on the boat that night.
      I know you took documents from the navigation table. I know you
      threatened him: 'if I can't have you nobody can.' I have witnesses
      and I have the anonymous account timeline."


      You also send the evidence package to Komisaras Kavaliauskas and
      to Egle at Pajurio Zinios.
    choices:
      - Send -> gintare_response

  gintare_response:
    type: message
    text: >
      Gintare doesn't respond for hours. Then, at 2am:


      GINTARE: You think you understand but you don't. I loved him.
      Nobody else loved him like I did. I was protecting him. I needed
      to know where he was because the world is dangerous and he was
      too trusting.


      I went on the boat that night. I took the papers because I knew
      they'd get him in trouble. I was protecting him.


      But I didn't take him. I didn't do anything to him. When I left
      the boat at 21:30 he was alive and angry at me. Someone else came
      after me.


      Ask BalticPort what happened after midnight.


      She's lying about some things. But the timeline confirms she left
      before the engine started at 3am. Someone else was there after her.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE FULL PICTURE


      Three things happen in quick succession.


      Komisaras Kavaliauskas reopens the case. With your evidence —
      the anonymous account, the GPS tracker, the witnesses, the
      threatening messages — Gintare is arrested for stalking,
      harassment, and theft of documents. She confesses to being on
      the boat and taking Dovydas's documents about the meras. The
      documents are recovered from her apartment.


      With the documents recovered, Egle publishes the full story about
      Meras Zaremba's kickbacks from BalticPort Development. The story
      goes national. The meras resigns. BalticPort Development's permits
      are suspended pending investigation.


      And the boat. The police, now properly investigating, find
      something on the Neringa they missed before: marks on the gunwale
      consistent with a struggle. DNA that isn't Dovydas's or Gintare's.
      It matches a known associate of BalticPort Development's security
      contractor.


      Three weeks later, Dovydas is found. He's alive — barely.
      Hiding in an abandoned fisherman's hut on the Curonian Spit,
      injured, surviving on what he could catch. He'd been attacked on
      the boat, fought back, jumped into the sea, and swum to shore.
      He'd been too scared to come home.


      The BalticPort associate is arrested. Andrius Petrauskas faces
      criminal charges. The fishing harbor is saved.
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: dovydas
    text: >
      grizau namo. neringa laukia. jura nemirstam. aciu visiems kurie
      netylejo. gintaruostis yra musu.
    choices:
      - The End -> game_complete

  # --- ENDING B: Andrius / BalticPort (Partial Ending) ---

  confront_andrius:
    type: message
    text: >
      You present the port corruption evidence to Andrius Petrauskas:


      "I have the shell company records. The bank transfers to the
      meras. The falsified environmental assessment. The engineering
      plans showing the harbor wall demolition. The fishing cooperative's
      documentation of systematic intimidation."
    choices:
      - Send -> andrius_response

  andrius_response:
    type: message
    text: >
      ANDRIUS: BalticPort Development operates within all legal
      frameworks. Any allegations of improper payments are defamatory.
      Our legal counsel will be in contact.


      But it's too late. The evidence has already gone to Egle, to the
      fishing cooperative, and to the regional prosecutor.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION


      The port corruption story breaks. Meras Zaremba's kickbacks are
      exposed. He resigns in disgrace. The port expansion is halted.
      The fishing harbor is saved. Gintaruostis celebrates.


      But Dovydas?


      Without investigating Gintare's stalking, the full picture of
      that night remains incomplete. The police treat his disappearance
      as an unsolved accident. Gintare is never charged. She creates
      new accounts. She watches the Neringa from the seawall.


      Four months later, Dovydas returns quietly. He's been hiding,
      injured and afraid. He comes back to a saved harbor but a town
      that still doesn't understand what happened to him. He changes
      his locks. He sleeps on the boat with the cabin bolted. He checks
      over his shoulder when he walks to the pier.


      The harbor is saved. The man who saved it is still haunted.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: dovydas
    text: >
      grizau. uostas saugus. as... dirbam ties tuo.
    choices:
      - The End -> game_complete

  # --- ENDING C: Meras (Wrong Ending) ---

  confront_meras:
    type: message
    text: >
      You confront Meras Zaremba directly with your evidence.


      Within the hour, you receive a response — not from the meras,
      but from his lawyer:
    choices:
      - Read the response -> meras_response

  meras_response:
    type: tweet
    from: dalia
    text: >
      Mano klientas atkreipia demesį i jusu kaltinimus. Bet kokio
      šmeižikiško turinio platinimas bus persekiojamas teismine tvarka.
      — Advokate D. Navickiene, Klaipeda
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN


      The meras's lawyer buries your accusation. Without the original
      documents — which Gintare stole from the boat — your evidence
      is circumstantial. Not enough for a prosecution.


      BalticPort Development continues its push. The council votes in
      favor of the expansion. Construction begins within six months.
      The old harbor wall comes down.


      Gintare continues to watch. She creates new accounts. She follows
      Dovydas's brother Rokas. She follows his mother Ieva.


      Dovydas doesn't come back. The Neringa sits in the harbor,
      empty, rocking in the waves. One year later, it's towed away
      to make room for the container cranes.


      Nobody has seen Dovydas since.
    choices:
      - The End -> game_complete

