# Story 047: Lithuania 2 — Gintaruostis
# An investigation game on a simulated Mastodon instance
#
# Player investigates the disappearance of young fisherman/boat captain
# Dovydas Kazlauskas in the fictional coastal fishing town of Gintaruostis
# near Klaipeda, Lithuania.

