entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN GINTARUOSTIS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to gintaruostis.social — the community Mastodon instance for
      the coastal fishing town of Gintaruostis, near Klaipeda, Lithuania.


      The local feed is agitated. Something is wrong. Posts keep mentioning
      the same name. People are scared, angry, desperate.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name dominates everything:
      @dovydas_kazlauskas.


      A 24-year-old fisherman and boat captain. Born and raised in
      Gintaruostis. He ran his grandfather's fishing boat, the Neringa.
      People loved him. He taught kids to sail. He organized beach cleanups.
      He fought against the port expansion that threatens to destroy the
      fishing harbor.


      Six days ago, his boat was found drifting empty two kilometers off
      the coast. No sign of Dovydas. His phone, his jacket, his life
      vest — all still on the boat.
    choices:
      - Look at his profile -> dovydas_profile

  dovydas_profile:
    type: tweet
    from: dovydas
    text: >
      jie nori sunaikinti viska ka musu seneliai statė. uostas nėra
      korporacijų žaislą. šitas kaimelis gyvena iš juros ir jura
      gyvena iš musu. rytoj einu i tarybos posedi. turiu irodymu apie
      mero kyšius.
    choices:
      - That's his last post... -> grey_sea

  grey_sea:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a grey sea photograph. Blurred, taken at night from what looks
      like a boat deck. No caption. Posted at 4:17am.


      His friends say Dovydas never posted without a caption. He never
      posted at 4am. He always signed off with "Geros nakties, jura."


      The police say he probably fell overboard while night fishing.
      Nobody buys it. Dovydas could swim before he could walk.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: komisaras
    text: >
      Del Gintaruoscio gyventojo dingimo: tyrimas vyksta.
      Preliminariai vertinama kaip nelaimingas atsitikimas juoroje.
      Bet kokia informacija prašome pranešti tel. 112 arba atvykti
      i komisariata.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The feed is chaos. Dovydas's friend @vilte_stankeviciute is
      posting desperately. His brother @rokas_kazlauskas is driving down
      from Klaipeda threatening to "flip this town upside down." The old
      fisherman @jonas_simulis says he warned Dovydas to be careful. The
      teens — @matas, @ugne, @lukas — are furious.


      The fishing cooperative chair @ruta_jankauskiene is posting about
      the port expansion vote that was scheduled for the day after Dovydas
      disappeared.


      And @gintare_paulauskaite — Dovydas's ex-girlfriend — is posting
      cryptic, unsettling things about destiny and people who don't
      appreciate what they have.


      The journalist @egle_vaiciulyte is asking hard questions.


      Nobody believes Dovydas fell off his own boat.
    effects: { trust_matas: "+5", trust_rokas: "+5" }
    choices:
      - Start following Dovydas's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS


      Get to know Gintaruostis. Follow Dovydas's contacts and read their
      posts. The fishing community is tight — earn their trust and they
      will talk.


      Start with the people who seem most willing to open up.
    choices:
      - Talk to Birute (cafe owner, knows everyone) -> birute_intro
      - Talk to Jonas (old fisherman, knew Dovydas since birth) -> jonas_intro
      - Talk to Matas (teen, Dovydas's apprentice) -> matas_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes grief about Dovydas with the daily rhythms of
      a Lithuanian fishing town: weather warnings, catch reports, the
      cafe's daily soup, the church bell schedule.


      Key names keep appearing: Vilte (close friend, nurse), Rokas
      (brother, angry), Ruta (fishing cooperative, political), Jonas
      (veteran fisherman, deeply sad).


      Also prominent: BalticPort Development — the company behind the
      port expansion. Their posts are corporate polish. Dovydas's posts
      were raw truth.


      And then there's Gintare. The ex. Her posts are... strange.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Birute -> birute_intro
      - Talk to Jonas -> jonas_intro
      - Talk to Matas -> matas_intro

  # --- Birute (cafe owner, social map) ---

  birute_intro:
    type: tweet
    from: birute
    text: >
      Gintaro Puodas kavine atidaryta kaip visada. Dovydo staliukas
      laukia. Jo kava ant stalo. Grizk namo, vaikeli.
    effects: { trust_birute: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Birute -> birute_talk

  birute_talk:
    type: message
    text: >
      BIRUTE: Oh, you're new here? Nu, bad timing, bad timing. The
      whole town is falling apart over Dovydas.


      Let me tell you who's who. Vilte — she's a nurse, one of Dovydas's
      best friends since childhood. She's devastated. Rokas is his older
      brother from Klaipeda, tipo very angry, that one will punch walls
      before he cries. Jonas Simulis — oldest fisherman here, taught
      Dovydas's grandfather. He knows this sea better than anyone.


      Ruta Jankauskiene runs the fishing cooperative. She and Dovydas
      were fighting the port expansion together. The meras — Tomas
      Zaremba — he wants to sell our harbor to BalticPort Development.
      Dovydas had proof the meras was taking kickbacks.


      And then... nu, there's Gintare. His ex. That girl is not right
      in the head, I'm telling you. After they broke up she tipo just...
      didn't stop. You know what I mean.
    effects: { trust_birute: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Gintare -> birute_gintare
      - Ask about the port expansion -> birute_port
      - Thank her and move on -> quest1_hub

  birute_gintare:
    type: message
    text: >
      BIRUTE: Blet, where do I start. They dated for a year. Dovydas
      broke it off because she was ziauriai controlling. Checked his
      phone, showed up at the harbor unannounced, got angry when he
      talked to other women. Classic stuff.


      After the breakup she'd come to the cafe and just... sit there.
      Watching the door. Waiting for him. She'd order one coffee and
      nurse it for three hours. She posted stuff online too — weird
      poetry about the sea taking what it wants. She followed him
      everywhere.


      Dovydas told me once, "Birute, she scares me." A man who goes
      out to sea in storms said that about a 23-year-old girl.
    effects: { trust_birute: "+5" }
    choices:
      - Ask about the port -> birute_port
      - Move on -> quest1_hub

  birute_port:
    type: message
    text: >
      BIRUTE: The port expansion. Nu, it's simple. BalticPort Development
      wants to build a container terminal. Modern, big, international.
      Sounds great, right? Except it would destroy the fishing harbor.
      Our boats, our livelihoods, our history — nachui, gone.


      The meras supports it because — and everyone knows this — he's
      getting paid. Dovydas had documents. Contracts, bank transfers,
      something. He was going to present them at the council meeting.


      The council meeting that was supposed to happen the day after he
      disappeared.


      Coincidence? Sūdas. I don't believe in coincidences.
    effects: { trust_birute: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jonas (old fisherman, witness tease) ---

  jonas_intro:
    type: tweet
    from: jonas
    text: >
      45 metu ant šitos juros. Išauginau vaikus, palaidojau draugu.
      Dovydas buvo kaip sunus. Jis neiškrito iš savo laivo. Nebukit
      kvaili.
    effects: { trust_jonas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jonas -> jonas_talk

  jonas_talk:
    type: message
    text: >
      JONAS: I taught that boy's grandfather to mend nets. I watched
      Dovydas grow up on these docks. He could handle the Neringa in
      any weather. He's been captain since he was eighteen. Six years
      without a single incident.


      And now they want me to believe he fell overboard? At night? On
      a calm sea? Nx, that's shit and everyone knows it.


      The night before he disappeared, I saw something. I'm old, not
      blind. There was a car at the harbor at midnight. Not a fisherman's
      car. A new car. Dark windows. I wrote down the plate number out
      of habit. An old fisherman's paranoia.
    effects: { trust_jonas: "+10" }
    choices:
      - What was the plate number? -> jonas_plate
      - Move on -> quest1_hub

  jonas_plate:
    type: message
    text: >
      JONAS: The plate was registered in Klaipeda. I asked a friend —
      retired police — to check it quietly. It belongs to a leasing
      company. The leasing company's biggest client? BalticPort
      Development.


      I told the police this. Komisaras Kavaliauskas wrote it down.
      That was a week ago. Nobody's followed up.


      Something stinks worse than a three-day-old catch.
    effects: { trust_jonas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Matas (teen apprentice, witness tease) ---

  matas_intro:
    type: tweet
    from: matas
    text: >
      blet kas cia darosi. dovydas buvo tipo geriausias zmogus šitam
      kaimelyje ir visi tiesiog sedi ant subines ir nieko nedaro.
      policija sako nelaimingas atsitikimas?? nx koks atsitikimas blet
      jis geriausiai plaukioja is visu cia
    effects: { trust_matas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Matas -> matas_talk_early

  matas_talk_early:
    type: message
    text: >
      MATAS: tu kas? naujas cia? nu ok whatever. tipo dovydas ismooke
      mane visko apie zvejoklę. jis buvo kaip vyresnis brolis man.
      kiekviena savaitgali ant Neringos — mokino laivo daliu, mazgu,
      navigacijos. ziauriai kietas zmogus.


      ir tipo as maciau kazkoka suda pries jam dingstant bet visi sako
      kad as vaikiukas ir neismanau nieko. blet man 17 as nesu aklas.


      ta jo buvusi — gintare — ji sedejo savo masinoj prie uosto ta
      vakara. tiesiog sedejo tamsoj ir ziurejo i Neringą. tipo ziauriai
      creepy sudas
    effects: { trust_matas: "+10" }
    choices:
      - What else did you see? -> matas_hint
      - Move on -> quest1_hub

  matas_hint:
    type: message
    text: >
      MATAS: nu dar maciau tipo kazka ant laivo. buvo sutemę ir as
      ziurejau per telefono kamera su zoom tipo. ant Neringos denio
      kazkos judejo. ne dovydas — per mažas. ir paskui isejo ir
      nuejo i ta tamsia masina prie uosto.


      as nezinau ar tai gintare ar kas bet blet kazkos buvo ant to
      laivo prieš jam dingstant. ir niekas manęs neklauso nachui
    effects: { trust_matas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're building a picture of Gintaruostis. A Lithuanian coastal
      fishing town where generations have lived off the sea. A young
      boat captain who was fighting to protect his community. A
      disappearance nobody believes was an accident.


      Two shadows hang over this: a stalker ex-girlfriend and a corrupt
      port expansion deal.


      Keep building trust. More people will talk.
    choices:
      - Talk to Vilte (Dovydas's close friend) -> vilte_q1
      - Talk to Rokas (Dovydas's brother) -> rokas_q1
      - Talk to Ruta (fishing cooperative chair) -> ruta_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Vilte Q1 ---

  vilte_q1:
    type: tweet
    from: vilte
    text: >
      dovydai, jeigu tu kur nors skaitai šita — paskambink. bet kam.
      roka, mane, mama. mes visi laukiam. tavo laivas laukia.
    effects: { trust_vilte: "+5", contacts_followed: "+1" }
    choices:
      - DM Vilte -> vilte_q1_talk

  vilte_q1_talk:
    type: message
    text: >
      VILTE: I don't know you. Why should I talk to you?


      ...sorry. I'm exhausted. I've been working double shifts at the
      clinic and spending every free hour putting up posters. Nobody
      sleeps in this town anymore.


      [Vilte is guarded. Build more trust before she opens up.]
    effects: { trust_vilte: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Rokas Q1 ---

  rokas_q1:
    type: tweet
    from: rokas
    text: >
      MANO BROLIS DINGO IR POLICIJA SAKO KAD JIS TIKRIAUSIAI IŠKRITO
      IŠ LAIVO??? JIS PLAUKIOJA NUO 5 METU AMŽIAUS. ATVAŽIUOJU IŠ
      KLAIPEDOS IR KAŽKAS MAN PAAIŠKINS KAS CIA VYKSTA.
    effects: { trust_rokas: "+5", contacts_followed: "+1" }
    choices:
      - DM Rokas -> rokas_q1_talk

  rokas_q1_talk:
    type: message
    text: >
      ROKAS: Who the fuck are you? Another person who's going to tell
      me to calm down?


      My brother called me two nights before he vanished. He said he
      had proof the meras was taking money from BalticPort. Bank
      transfers, contracts, emails. He was going to blow it up at the
      council meeting.


      He also said... he said Gintare was getting worse. She was
      following him again. Showing up at the harbor, leaving stuff on
      his boat. He found flowers tied to the Neringa's wheel. She
      carved their initials into the hull. He was scared of her but
      felt stupid saying it because blet she's a girl and people don't
      take that shit seriously.
    effects: { trust_rokas: "+10" }
    choices:
      - What do you think happened? -> rokas_theory
      - Move on -> quest1_hub

  rokas_theory:
    type: message
    text: >
      ROKAS: I think two things happened at the same time and one of
      them got him. Either BalticPort's people did something because he
      was about to expose their dirty deal with the meras. Or Gintare
      finally crossed the line.


      Maybe both. I don't know. But I know my brother didn't fall off
      his own fucking boat. He practically slept on that boat. It was
      his life.


      Find out what happened. I'll help however I can.
    effects: { trust_rokas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ruta Q1 ---

  ruta_q1:
    type: tweet
    from: ruta
    text: >
      Tarybos posedis del uosto pletros atidetas "neribotam laikui."
      Dovydui dingus, jo irodymai taip pat dingo. Kaip patogu merai
      Zarembai.
    effects: { trust_ruta: "+5", contacts_followed: "+1" }
    choices:
      - DM Ruta -> ruta_q1_talk

  ruta_q1_talk:
    type: message
    text: >
      RUTA: The port expansion would destroy 40 fishing families. Our
      harbor, our boats, our tradition — everything sacrificed for a
      container terminal that benefits nobody in this town.


      Dovydas had documents proving the meras received payments from
      BalticPort Development through a shell company. He was going to
      present them at the council meeting. Now he's gone and nobody
      can find the documents.


      The council vote has been "postponed." Without Dovydas's evidence
      and without his voice, the opposition crumbles. The meras wins.


      Tell me that's a coincidence. I dare you.
    effects: { trust_ruta: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT


      Something happened the night Dovydas went out to sea and didn't
      come back. His boat was found drifting the next morning — engine
      off, nets untouched, his personal belongings still aboard.


      Multiple people saw or heard things that night. Piece together the
      timeline. You need accounts from at least 4 people.
    choices:
      - Find Lukas (teen, was skateboarding near the harbor) -> lukas_interview
      - Find Antanas (harbor master, works late) -> antanas_interview
      - Find Vytautas (retired fisherman, insomnia) -> vytautas_interview
      - Find Agne (teen artist, was sketching the sunset) -> agne_interview

  # --- Lukas (saw Gintare at the harbor) ---

  lukas_interview:
    type: tweet
    from: lukas
    text: >
      vakar buvau uoste seske bet kazkoks sudas vyksta naktimis
      tipo uostas nebeyra safe. kazkas vaiksto tamsoj
    effects: { trust_lukas: "+5" }
    choices:
      - Ask Lukas what he saw -> lukas_talk

  lukas_talk:
    type: message
    text: >
      LUKAS: blet ok bet niekam nesakyk. tipo as buvau uoste apie 21
      valanda skeitas sesija po sauleleydzia. ir maciau gintare —
      dovydo buvusia — ji slinko prie Neringos. tipo ne kaip normalus
      zmogus eina. slinko. kaip tipo žiurinejo ar kas nemato.


      ji uzlipo ant laivo ir ten buvo tipo 10 minuciu. paskui nulipo
      ir nubego prie savo masinos. blet as tiesiog stovejau tamsoj
      su skeitu ir ji manes nemateee.


      as turėjau kazkam pasakyt bet blet kas patiketų penkiolikmeciu
      su skeitu nachui
