      avatar: avatars/vasilis.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PETRA LOUTRA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to PetraLoutra.social — the community Mastodon instance for
      the village of Petra Loutra, Peloponnese.

      The local feed is dark today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @nikos_papadakis.

      An olive farmer. Fourth generation. He tended the oldest grove in
      the valley. People are in shock. His body was found at dawn in
      the irrigation channel that runs through his land.
    choices:
      - Look at his profile -> nikos_profile

  nikos_profile:
    type: tweet
    from: nikos
    text: "Αυτό το νερό δεν ανήκει σε καμία εταιρεία. Ανήκει στη γη. Και η γη ανήκει σε αυτούς που τη δουλεύουν. Έχω αποδείξεις."
    choices:
      - That's his last real post... -> grey_grove

  grey_grove:
    type: message
    text: >
      One day after that post, his account uploaded a single image:
      a blurred photo of olive trees in grey morning light. Shot from
      a strange angle. Posted at 4am. No caption.

      His wife Marina says that is not his style. Nikos never posted
      without a caption. The police say he slipped and drowned in the
      irrigation channel. Something does not add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: vasilis
    text: >
      Ενημερώνουμε ότι ο θάνατος κατοίκου της Πέτρας Λουτράς φαίνεται να
      οφείλεται σε ατύχημα. Η έρευνα είναι σε εξέλιξη. Οποιαδήποτε
      πληροφορία μπορεί να κοινοποιηθεί στο τμήμα. Τηλ: 100.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His wife @marina_papadaki is
      devastated. His cousin @stavros_papadakis is furious and posting
      constantly. His colleague @eleni_dimitriou at the olive cooperative
      is asking hard questions.

      The old fisherman turned farmer @kostas_vasiliou says Nikos was
      right about the water. The teens are losing their minds. And the
      journalist @petros_sotiriou has gone strangely silent.

      Nobody buys the police line. Nobody thinks Nikos just "slipped."
    effects: { trust_marina: "+5", trust_stavros: "+5" }
    choices:
      - Start following Nikos's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Petra Loutra. Follow Nikos's contacts and read their
      posts. The more you engage with the community, the more they will
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Yannis (kafeneio owner, knows everyone) -> yannis_intro
      - Talk to Panos (plumber, saw the water change) -> panos_intro
      - Talk to Despoina (teen, seems shaken) -> despoina_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes grief for Nikos with the rhythms of a Peloponnese
      village: olive harvest schedules, the bakery's daily specials,
      weather warnings for the valley.

      Key names surface: Marina (wife, teacher), Stavros (cousin,
      photographer, seems obsessive), Eleni (agronomist, seems rattled),
      and the teens — Despoina, Giorgos, Nefeli — who looked up to
      Nikos like an uncle.

      Also prominent: AquaPeloponnese AE, the water management company
      that has been buying up local water rights. Their posts are
      corporate PR. Nikos's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Yannis -> yannis_intro
      - Talk to Panos -> panos_intro
      - Talk to Despoina -> despoina_intro

  # --- Yannis (social map) ---

  yannis_intro:
    type: tweet
    from: yannis
    text: >
      Το καφενείο είναι ανοιχτό αλλά η πλατεία είναι άδεια. @nikos_papadakis,
      η θέση σου σε περιμένει. Δεν θα σε ξεχάσουμε ποτέ.
    effects: { trust_yannis: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Yannis -> yannis_talk

  yannis_talk:
    type: message
    text: >
      YANNIS: Ah, you are new here? Welcome. Terrible time to arrive.
      Everyone is broken about Nikos.

      Let me tell you who is who. Marina is Nikos's wife — she teaches
      at the village school. Sweet woman, destroyed right now. Stavros
      is Nikos's cousin — they grew up together, but things between
      them got strange the last year. Stavros became obsessed with the
      family land, kept saying it was his birthright too. Eleni works
      at the olive cooperative with Nikos. Smart woman.

      And Petros Sotiriou — the journalist — he and Nikos were working
      on something together. Something about the water. Petros has not
      said a word since Nikos died. That is not like him at all.

      Oh, and do not trust AquaPeloponnese's PR posts. Lies wrapped
      in ISO certifications. They want our water and they do not care
      who gets hurt.
    effects: { trust_yannis: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Stavros -> yannis_stavros
      - Ask about AquaPeloponnese -> yannis_aqua
      - Thank him and move on -> quest1_hub

  yannis_stavros:
    type: message
    text: >
      YANNIS: Stavros? He is family but... listen, I have seen things.
      Since old Papadakis died — that is Nikos's father — the land
      inheritance has been a war. Nikos got the main grove because he
      was the son. Stavros got nothing. His mother was Nikos's father's
      sister. He felt cheated.

      The last year, Stavros has been at the kafeneio every night,
      drinking too much, talking about how the land should be his. He
      said Nikos was wasting it. He said "that grove needs someone who
      appreciates it." He followed Nikos around with his camera,
      documenting everything, saying he was making a photo project. But
      it felt like surveillance, ρε.

      Nikos told me once, "Stavros does not take no for an answer."
    effects: { trust_yannis: "+5" }
    choices:
      - Ask about AquaPeloponnese -> yannis_aqua
      - Move on -> quest1_hub

  yannis_aqua:
    type: message
    text: >
      YANNIS: AquaPeloponnese has been here two years. They bought the
      old municipal water rights in a deal nobody understood. Now they
      control the irrigation channels, the wells, everything. They want
      to build a bottling plant in the valley.

      The farmers fought back. Nikos led the resistance. He had
      documents showing the privatization deal was corrupt — the mayor
      sold the rights for nothing. He had water quality tests showing
      the company was diverting water from the farmers to sell
      commercially.

      Two weeks before he died, he posted those documents publicly. Then
      someone found him face down in the irrigation channel. Γαμώτο.
    effects: { trust_yannis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Panos (the water, witness tease) ---

  panos_intro:
    type: tweet
    from: panos
    text: >
      τριάντα χρόνια δουλεύω με σωλήνες. το νερό στην κοιλάδα δεν είναι
      το ίδιο. @nikos_papadakis είχε δίκιο. και τώρα είναι νεκρός.
      κάντε τη σύνδεση.
    effects: { trust_panos: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Panos -> panos_talk

  panos_talk:
    type: message
    text: >
      PANOS: I have been the plumber in this village since I was twenty.
      I know every pipe, every well, every spring. And I am telling you
      — the water has changed. AquaPeloponnese installed new valves on
      the main irrigation channel six months ago. Since then, the flow
      to the olive groves has dropped by half.

      Nikos measured it. He documented everything. He showed the water
      was being diverted to the new bottling plant construction site.
      The farmers' trees are dying of thirst while AquaPeloponnese
      fills tanker trucks.

      You think that is a coincidence? Μαλάκα, I do not believe in
      coincidences.
    effects: { trust_panos: "+10" }
    choices:
      - Did you see anything unusual recently? -> panos_night
      - Move on -> quest1_hub

  panos_night:
    type: message
    text: >
      PANOS: The night before they found Nikos — I was up late fixing
      a pipe at Kostas's farm. Around midnight. I saw lights at the
      irrigation channel near Nikos's grove. Not a flashlight — car
      headlights. Two cars. One was Nikos's old pickup truck. The other
      was a dark SUV with AquaPeloponnese company plates.

      At midnight. At the irrigation channel.

      I noted it mentally. Nobody has asked me about it until now.
    effects: { trust_panos: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Despoina (teen, witness tease) ---

  despoina_intro:
    type: tweet
    from: despoina
    text: >
      ρε τι σκατά γίνεται. ο @nikos_papadakis μας μάθαινε για τις ελιές
      κάθε καλοκαίρι. ήταν σαν θείος μου. δεν γίνεται να γλίστρησε
      και να πνίγηκε ρε. αν κάποιος ξέρει κάτι πείτε το επιτέλους
    effects: { trust_despoina: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Despoina -> despoina_talk_early

  despoina_talk_early:
    type: message
    text: >
      DESPOINA: ρε εσύ ποιος είσαι; νέος εδώ; σκατά timing. τέλος
      πάντων, ο Νίκος ήταν ο καλύτερος άνθρωπος σε αυτό το χωριό.
      μας μάθαινε πώς να μαζεύουμε ελιές, πώς να φτιάχνουμε λάδι.
      ο Γιώργος τον βοηθούσε κάθε Σαββατοκύριακο.

      και τώρα φρικάρω γιατί ο Γιώργος είδε κάτι περίεργο εκείνο
      το βράδυ αλλά δεν θέλει να μιλήσει. λέει ότι δεν είναι τίποτα
      αλλά ρε... δεν είναι τίποτα σα;
    effects: { trust_despoina: "+10" }
    choices:
      - What did Giorgos see? -> despoina_giorgos_hint
      - Move on -> quest1_hub

  despoina_giorgos_hint:
    type: message
    text: >
      DESPOINA: δεν ξέρω ακριβώς. ήταν με το μηχανάκι στον δρόμο
      για τη κοιλάδα και είδε κάποιον κοντά στο κανάλι του Νίκου.
      σαν να τσακωνόταν κάποιος;; ή κάτι τέτοιο. φρικάρει τελείως
      και δεν θέλει να μιλήσει. πρέπει να του μιλήσεις αλλά δεν
      εμπιστεύεται τους ξένους. πες του ότι αγαπάς τις ελιές ή κάτι
      τέτοιο χαχα
    effects: { trust_despoina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You are getting a picture of Petra Loutra. A Peloponnese village
      built around olive groves and water. A farmer who was exposing
      water privatization. A death nobody believes was an accident.

      You have made contacts. Now dig deeper.
    choices:
      - Talk to Marina (Nikos's wife) -> marina_q1
      - Talk to Stavros (Nikos's cousin) -> stavros_q1
      - Check what Eleni (Nikos's colleague) is saying -> eleni_q1
      - I'm ready to investigate the night he died -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Marina Q1 ---

  marina_q1:
    type: tweet
    from: marina
    text: >
      αν κάποιος έχει νέα για το τι συνέβη στον @nikos_papadakis
      καλέστε με. τα ρούχα του ήταν στεγνά στην κρεμάστρα. τα
      παπούτσια του στο σπίτι. δεν πήγε στο κανάλι με τα καλά του.
    effects: { trust_marina: "+5", contacts_followed: "+1" }
    choices:
      - DM Marina -> marina_q1_talk

  marina_q1_talk:
    type: message
    text: >
      MARINA: I appreciate you reaching out but I do not know you.
      Nikos had many friends here. The funeral is tomorrow.

      ...I keep telling myself to be strong for the children. I am
      not strong.

      [Marina is guarded. You will need to build more trust before
      she opens up.]
    effects: { trust_marina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Stavros Q1 ---

  stavros_q1:
    type: tweet
    from: stavros
    text: >
      Ο @nikos_papadakis ήταν αίμα μου. Ξάδελφος. Αδελφός. Φωτογραφίζω
      κάθε ελαιόδεντρο που φύτεψε. Αυτό το κτήμα πρέπει να ζήσει.
      Ό,τι χρειαστεί.
    effects: { trust_stavros: "+5", contacts_followed: "+1" }
    choices:
      - DM Stavros -> stavros_q1_talk

  stavros_q1_talk:
    type: message
    text: >
      STAVROS: You are interested in Nikos's story? Good. Someone needs
      to care. I have been documenting the grove for two years — photos,
      drone footage, every tree. This land is the Papadakis legacy. It
      is in our blood.

      Nikos and I had our disagreements, sure. What family doesn't? But
      at the end of the day, the grove matters more than any argument.

      I offered to help him fight AquaPeloponnese. Many times. He said
      he had it under control. He said he was working with a journalist.
      He just did not want my help.

      [Stavros seems earnest. Or obsessive?]
    effects: { trust_stavros: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Eleni Q1 ---

  eleni_q1:
    type: tweet
    from: eleni
    text: >
      ο @nikos_papadakis ήταν ο καλύτερος ελαιοπαραγωγός στο συνεταιρισμό.
      τα δείγματα νερού του είναι ακόμα στο γραφείο. η έρευνά του για
      την AquaPeloponnese δεν τελείωσε. κάποιος πρέπει να τη συνεχίσει.
    effects: { trust_eleni: "+5", contacts_followed: "+1" }
    choices:
      - DM Eleni -> eleni_q1_talk

  eleni_q1_talk:
    type: message
    text: >
      ELENI: Nikos and I worked together at the cooperative for five
      years. He was the most dedicated farmer I have ever known. This
      water privatization fight — it consumed him. He had data, documents,
      water measurements. He was building a case that AquaPeloponnese
      was systematically diverting irrigation water.

      He called me the night before he died. He said "they know what
      I have." He said "if anything happens, look at AquaPeloponnese."
      Then he said something strange — "and keep Stavros away from the
      grove."

