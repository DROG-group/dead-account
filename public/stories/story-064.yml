      @chrysa_notari: account created 10 months ago. Posts are all
      about the Papadakis grove and Nikos's olive work. Comments on
      every harvest photo, every oil pressing update, every grove
      maintenance post. The tone shifts over time:

      Month 1: "Beautiful trees. This grove is a treasure."
      Month 3: "Why won't you let family help? This is our heritage
      too."
      Month 6: "I watch the grove at night. The trees are not being
      cared for properly. I could do better."
      Month 8: "I have measured every tree. I know this land better
      than you do. You do not deserve it."

      The account has no personal photos. Just the grove. Only the
      grove.
    effects:
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Check the writing style -> chrysa_style

  chrysa_style:
    type: message
    text: >
      Comparing @chrysa_notari with @stavros_papadakis:

      Same use of agricultural terminology. Same Greek dialect markers
      — the Peloponnese way of shortening certain words. Same knowledge
      of the grove's layout that only a family member would have.

      And one post from @chrysa_notari: "The third row from the stone
      wall needs pruning." That is a detail only someone who walks the
      grove regularly would know. Not public information.

      It is Stavros. The anonymous account is Stavros.
    effects:
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # --- Angeliki ---

  angeliki_interview:
    type: message
    text: >
      ANGELIKI: Nikos left something with me. A sealed plastic bag with
      a USB drive inside. He said "if someone comes asking about the
      water in the valley, give them this."

      He looked frightened. He said he had made copies of everything
      but needed one set off-site, somewhere nobody would think to
      look. A bookshop in a village seemed perfect.
    effects: { trust_angeliki: "+10" }
    choices:
      - What is in the valley? -> angeliki_case

  angeliki_case:
    type: message
    text: >
      Angeliki reaches under the counter and produces a zip-lock bag
      with a USB drive.

      ANGELIKI: He said you would come. Take it.

      The USB drive contains water flow measurements, photographs of
      the hidden underground pipe, the original municipal contract
      showing the corrupt sale of water rights, and Nikos's detailed
      report on AquaPeloponnese's illegal diversion. There is also a
      folder labeled "STAVROS" containing photos of footprints in the
      grove, a log of nighttime visits, and a copy of the inheritance
      challenge filing.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Vasilis (police officer) ---

  vasilis_interview:
    type: message
    text: >
      VASILIS: Off the record — and I mean completely off the record —
      I wanted to investigate AquaPeloponnese. My superior told me to
      stand down. He said the prefecture had "jurisdiction." That is
      code for "do not touch it."

      The Stavros situation is different. I did not even know about the
      nighttime visits, the anonymous account, the argument at the
      channel. If you have evidence of threats and suspicious presence
      at a death scene, I can act on that. That is clearly my
      jurisdiction.

      Bring me something solid and I will reopen the case as a
      homicide investigation.
    effects:
      trust_vasilis: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You have gathered evidence. You know more about what happened
      to Nikos than anyone in Petra Loutra. Who is responsible?
    choices:
      - Confront Stavros Papadakis (the obsessive cousin) -> confront_stavros
        when:
          state: obsession_evidence
          gte: 5
      - Confront Ioanna Roussopoulou (the company director) -> confront_ioanna
        when:
          state: corporate_evidence
          gte: 3
      - Confront Mayor Antonopoulos (political protection) -> confront_dimitris
      - I need more evidence -> investigation_hub

  # --- ENDING A: Stavros (Best Ending) ---

  confront_stavros:
    type: message
    text: >
      You present your evidence to Stavros:

      "I know @chrysa_notari is your account. I know you were at the
      grove every night. I know you filed inheritance challenges. I
      know you were at the irrigation channel the night Nikos died.
      I have a witness who heard you threaten him and heard someone
      fall. I have the audio recording."
    choices:
      - Send -> stavros_response

  stavros_response:
    type: message
    text: >
      Stavros does not reply for a long time. Then:

      STAVROS: You do not understand. That grove is my family too.
      My blood. Nikos was going to lose it all fighting AquaPeloponnese.
      I was trying to save it. Everything I did was because I love
      that land.

      I went there that night to talk sense into him. We argued. I
      pushed him. He fell into the channel. I did not mean... I called
      for help but he... the current... γαμώτο.

      I panicked. I cleaned up. I posted the photo from his phone.
      I thought if it looked like an accident, nobody would ask
      questions. I was wrong about everything.

      You have already sent the evidence to Vasilis. And to Petros
      Sotiriou.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Vasilis reopens the case as a homicide investigation. With your
      evidence — the anonymous account, the nighttime visits, the land
      registry searches, the witness testimonies, and the audio
      recording — Stavros is arrested for involuntary manslaughter. He
      confesses fully. The irrigation channel is drained and forensic
      evidence confirms the struggle.

      Petros Sotiriou, finally in possession of Nikos's full evidence
      package, publishes the AquaPeloponnese story in Kathimerini. The
      prefecture orders an emergency audit. The water privatization
      contract is declared void due to corruption. AquaPeloponnese's
      license is revoked. Ioanna Roussopoulou faces criminal charges
      for falsifying water distribution reports and intimidation.

      And Marina Papadaki, reading the story at her kitchen table while
      the children sleep, calls Eleni at the cooperative.

      "Ο Νίκος νίκησε. Το νερό επιστρέφει στη γη."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: marina
    text: >
      η γη δεν ψεύδεται. και οι άνθρωποι της Πέτρας Λουτράς δεν
      ξεχνάνε. ευχαριστούμε που δεν τα παρατήσατε. #ΓιαΤονΝίκο
    choices:
      - The End -> game_complete

  # --- ENDING B: Ioanna (Partial Ending) ---

  confront_ioanna:
    type: message
    text: >
      You present the water diversion evidence to Ioanna Roussopoulou:

      "I have photographs of the hidden underground pipe. I have water
      flow measurements showing diversion four times the licensed
      amount. I have your original technician reports showing the data
      was falsified. I have the corrupt municipal contract."
    choices:
      - Send -> ioanna_response

  ioanna_response:
    type: message
    text: >
      IOANNA: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. AquaPeloponnese has always operated
      within its licensing agreements.

      But it is too late. You have sent the evidence to Petros, to
      the olive cooperative, and to the prefecture.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The water privatization story breaks. AquaPeloponnese is ordered
      to halt construction on the bottling plant. The contract is
      under review. Water begins flowing back to the farms. The valley
      starts to recover.

      But Nikos?

      Without the evidence of Stavros's obsession and presence that
      night, the death remains classified as an accident. Stavros
      inherits his share of the grove through the pending legal
      challenge. He walks the rows every morning. He photographs
      every tree.

      Marina moves to Tripoli with the children. She cannot bear to
      see Stavros tending the trees her husband planted.

      The corporation is exposed. But the person who killed Nikos
      walks free among the olives.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: marina
    text: "το νερό επέστρεψε. αλλά ο Νίκος δεν θα επιστρέψει ποτέ. η αλήθεια είναι μισή."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_dimitris:
    type: message
    text: >
      You confront Mayor Antonopoulos with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> dimitris_response

  dimitris_response:
    type: tweet
    from: michalis
    text: >
      Ο πελάτης μου λαμβάνει γνώση των ισχυρισμών σας. Οποιαδήποτε
      δημόσια διάδοση συκοφαντικού υλικού θα οδηγήσει σε άμεσες
      νομικές ενέργειες. — Γραφείο Τσαούση & Συνεργάτες, Τρίπολη
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct link
      between Antonopoulos and AquaPeloponnese's illegal diversion —
      and there is not one beyond political protection — your evidence
      is insufficient.

      AquaPeloponnese continues to operate. Stavros continues to walk
      the grove. Nikos's death remains an accident.

      Six months later, @chrysa_notari creates a new account. It
      follows Marina's children.
    choices:
      - The End -> game_complete

