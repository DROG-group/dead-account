    text: >
      ENDING B: THE QUARRY

      The contamination story breaks. GranAlp is ordered to halt all
      blasting pending investigation. The quarry may close permanently.
      One hundred and fifty jobs hang in the balance. The village is
      divided.

      But Maria?

      Without the stalking evidence, Max Reiter is never investigated.
      He moves on from Alpenrose but creates new accounts. He finds
      Maria's new location within weeks. He begins hiking the trails
      near her friend's house in Innsbruck.

      Three months later, Maria reads about GranAlp online. She
      returns quietly. She repairs her cheese cellar. She stops
      working alone on the Alm. She checks her car every morning.

      The quarry is exposed. But the person who terrorised Maria
      walks free.
