    type: message
    text: >
      PETRA: ...you have more than I expected.

      Ok. Maria and I were working together. She had water analysis
      from Uni Innsbruck — heavy metals at twelve times the legal
      limit in the Hochalm spring. She had photos of quarry runoff
      going directly into the watershed. She had blast schedules
      that showed illegal midnight operations.

      We were going to publish together. Then she went dark. And two
      days later, someone broke into my car in Innsbruck and stole
      my backup drive.

      Maria is alive. She contacted me once, from a burner phone.
      She said she is hiding. She said "they threatened me at the
      Alm and someone else will not leave me alone."

      I cannot tell you where she is. But with enough evidence, I
      can publish and make it safe for her to come back.
    effects:
      trust_petra: "+25"
      quarry_evidence: "+1"
      evidence_total: "+2"
    choices:
