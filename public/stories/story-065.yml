  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Brandner and GranAlp's illegal operations — and
      there is not one beyond political protection — your evidence is
      insufficient.

      GranAlp continues to blast. Max continues to watch. Maria stays
      in hiding.

      Six months later, @lisa creates a new account. It follows
      Maria's sister.
