  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Inspektor Griesser reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the hut logs, the witness
      testimonies — Max Reiter is arrested for Stalking and
      harassment. A GPS tracker is recovered from under Maria's
      Suzuki at the Klamm gorge parking area.

      Petra Kirchner, finally in possession of Maria's full evidence
      package, publishes the GranAlp story in the Tiroler
      Tageszeitung and it gets picked up nationally. The
      Bezirkshauptmannschaft orders an unannounced inspection. The
      quarry is shut down pending environmental remediation. Stefan
      Kratzer faces criminal charges for falsifying blast distance
      reports and illegal watershed contamination.

      And Maria Huber, reading the story from a friend's house in
      Innsbruck, calls her sister for the first time in nine days.

      "I kimm hoam."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Frauenhelpline gegen Gewalt: 0800 222 555 (kostenlos, 24h)
      Opfernotruf: 0800 112 112
      Umweltbundesamt Beschwerdelinie: +43 1 31304
    choices:
      - See the epilogue -> ending_a_epilogue

