entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN ALPENROSE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Alpenrose.social — the community Mastodon instance for
      the mountain village of Alpenrose, Tyrol.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @maria_huber.

      A Sennerin — a traditional alpine cheese maker. She ran a small
      mountain dairy on the Hochalm above the village. People loved her.
      She documented the alpine meadows, the cheese-making, the wildflowers.

      She hasn't posted in six days. Her cabin on the Hochalm is empty.
    choices:
      - Look at her profile -> maria_profile

  maria_profile:
    type: tweet
    from: maria
    text: "Die Sprengungen vom Steinbruch rücken näher an die Alm. Die Kühe sind nervös. Das Wasser schmeckt nach Staub. Irgendwann reichts."
    choices:
      - That's her last real post... -> grey_mountain

  grey_mountain:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a grey mountain slope. Blurred, taken at a strange angle. Posted
      at 2am. No caption.

      Her friends say that is not her style. Maria always wrote long
      captions about herbs and cheese and the seasons. The police say
      she probably went hiking and lost signal. Something does not add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: inspektor
    text: >
      Wir haben eine Vermisstenanzeige betreffend eine Bewohnerin von
      Alpenrose aufgenommen. Derzeit liegen keine Hinweise auf ein
      Verbrechen vor. Sachdienliche Hinweise bitte an die PI Alpenrose
      oder den Notruf 133.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her sister @lena_huber is desperate.
      Her partner @thomas_auer is furious. Her mentor @sepp_gruber says
      the mountains do not just swallow people. The herb guide
      @anna_leitner says Maria knew every path blindfolded.

      And the journalist @petra_kirchner is strangely silent.

      Nobody buys the police line. Nobody thinks Maria just
      "went hiking."
    effects: { trust_lena: "+5", trust_thomas: "+5" }
    choices:
      - Start following Maria's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Alpenrose. Follow Maria's contacts and read their
      posts. The more you engage with the community, the more they will
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Irene (innkeeper, knows everyone) -> irene_intro
      - Talk to Sepp (old Senner, Maria's mentor) -> sepp_intro
      - Talk to Niki (teen snowboarder, seems shaken) -> niki_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Maria with the rhythms of a small
      mountain village: weather warnings, the bakery's Mohnstriezel
      schedule, hiking trail closures from the quarry blasting.

      Key names surface: Lena (sister, teacher), Thomas (partner,
      carpenter, angry), Sepp (old Senner, devastated), and the
      teens — Niki, Felix, Sophie — who idolised Maria's mountain life.

      Also prominent: GranAlp Steinbruch GmbH, the quarry company
      expanding into the valley. Their posts are corporate PR. Maria's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Irene -> irene_intro
      - Talk to Sepp -> sepp_intro
      - Talk to Niki -> niki_intro

  # --- Irene (social map) ---

  irene_intro:
    type: tweet
    from: irene
    text: >
      Heut gibts kan Almkäs. @maria_huber, dei Platz beim Stammtisch
      is leer. Kumm zruck.
    effects: { trust_irene: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Irene -> irene_talk

  irene_talk:
    type: message
    text: >
      IRENE: Ah, du bist neu? Servus. Schlecht Timing. Alle drehn
      durch wegen Maria.

      I'll tell you who is who. Lena is Maria's younger sister — she
      teaches at the primary school. Devastated. Thomas is Maria's
      partner, a carpenter. Big man, quiet normally, but right now he
      is ready to punch walls. Sepp Gruber is the old Senner who
      taught Maria everything about cheese making.

      Anna Leitner — the herb guide — she and Maria were working on
      something together. Something about the water on the Hochalm.
      Anna has not posted since Maria vanished. That is not like her.

      Oh, and do not bother reading GranAlp's corporate posts. Lies
      wrapped in ISO certificates.
    effects: { trust_irene: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the quarry -> irene_quarry
      - Ask about the hiker, Max -> irene_max
      - Thank her and move on -> quest1_hub

  irene_quarry:
    type: message
    text: >
      IRENE: The quarry has been there since the seventies. Gravel,
      stone, construction material. The village tolerated it because
      of the jobs. But last year GranAlp applied for expansion — they
      want to blast closer to the Hochalm. Maria's alm.

      The blasting shakes the cheese cellar. Cracks in the walls. The
      cows are stressed, the milk is off. And the spring that feeds her
      dairy — she said it started tasting like rock dust.

      Maria was the only one who stood up at the Gemeinderat meeting
      and said no. Two weeks later she is gone.
    effects: { trust_irene: "+5" }
    choices:
      - Ask about the hiker -> irene_max
      - Move on -> quest1_hub

  irene_max:
    type: message
    text: >
      IRENE: There is a man — Max Reiter, he calls himself. Been
      coming to Alpenrose for months. Says he is a nature photographer,
      a long-distance hiker. Stays at the Gasthof sometimes, sometimes
      camps above the treeline.

      But he is always on the paths near the Hochalm. Always near
      Maria's alm. She mentioned him once — said he kept showing up,
      asking to photograph her cheese making. She said no. He kept
      coming back.

      Hansi the mountain guide has seen him too. On trails that go
      nowhere except past Maria's cabin.
    effects: { trust_irene: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sepp (the old Senner, witness tease) ---

  sepp_intro:
    type: tweet
    from: sepp
    text: >
      40 johr auf der alm. die berg verschlucken kane leut. die
      @maria_huber is ned verlorn gangen. do is wos passiert.
    effects: { trust_sepp: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sepp -> sepp_talk

  sepp_talk:
    type: message
    text: >
      SEPP: I have been a Senner for forty years. I know every ridge,
      every ravine, every weather change. Maria knew them too — I taught
      her myself. She does not get lost. She does not fall. The police
      are talking nonsense.

      The spring water on the Hochalm has been bad for months. Turbid,
      strange taste. Maria took samples. She sent them to a lab in
      Innsbruck. She was building a case against the quarry.

      And then — gone. Like the morning mist.

      You think that is a coincidence? On the mountain, there are no
      coincidences.
    effects: { trust_sepp: "+10" }
    choices:
      - Did you see anything unusual recently? -> sepp_night
      - Move on -> quest1_hub

  sepp_night:
    type: message
    text: >
      SEPP: The night before she vanished — I was up early, around
      4 in the morning, checking the weather from my hut. I saw lights
      on the Almweg. Not headlamps — vehicle lights. Two sets. Going
      up toward the Hochalm.

      At 4am. On the Almweg. That road is for tractors and dairy
      transport. Nobody drives up there at night.

      One vehicle was big — like a company pickup. The other was
      smaller. Maria's old Suzuki maybe.

      I did not think much of it then. Now I think about it every day.
    effects: { trust_sepp: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Niki (teen, witness tease) ---

  niki_intro:
    type: tweet
    from: niki
    text: >
      oida des is so scheiße @maria_huber is die einzige die sich
      um de alm kümmert hat und jetzt is sie weg?? wer woaß wos
      sagt es bitte
    effects: { trust_niki: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Niki -> niki_talk_early

  niki_talk_early:
    type: message
    text: >
      NIKI: oida du bist neu hier? ur schlechtes timing. also maria
      is halt ur leiwand, die coolste person im ganzen dorf. hat uns
      gezeigt wie man käs macht, hat uns auf die alm mitgnommen,
      hat uns alles über die blumen und so erklärt.

      und jetzt bin i ur gstresst weil da felix hat wos gsehen am
      steinbruch aber er will ned drüber reden. er sagt is nix aber
      oida... des is sicher ned nix
    effects: { trust_niki: "+10" }
    choices:
      - What did Felix see? -> niki_felix_hint
      - Move on -> quest1_hub

  niki_felix_hint:
    type: message
    text: >
      NIKI: weiß ned genau. er war klettern am steinbruch — da is
      eigentlich verboten aber da geht jeder hin — und hat irgendeinen
      typ gsehen der wos bei marias auto gmacht hat?? oder so ähnlich.
      er flippt ur aus und will ned reden.

      musst ihn selber fragen aber er is voll misstrauisch bei leuten
      die er ned kennt. red zuerst übers klettern mit ihm oida
    effects: { trust_niki: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You are getting a picture of Alpenrose. A Tyrolean mountain
      village built around the Alps. A cheese maker who was fighting a
      quarry expansion. A disappearance nobody believes is accidental.

      You have made contacts. Now dig deeper.
    choices:
      - Talk to Lena (Maria's sister) -> lena_q1
      - Talk to Thomas (Maria's partner) -> thomas_q1
      - Check what Anna (herb guide, Maria's friend) is saying -> anna_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lena Q1 ---

  lena_q1:
    type: tweet
    from: lena
    text: >
      wer infos über @maria_huber hat bitte meldet euch. ihr zimmer
      schaut normal aus. ihr käse-equipment is oben auf der alm.
      sie wär nie ohne ihre werkzeuge gangen.
    effects: { trust_lena: "+5", contacts_followed: "+1" }
    choices:
      - DM Lena -> lena_q1_talk

  lena_q1_talk:
    type: message
    text: >
      LENA: Danke dass du schreibst aber ich kenn dich ned. Maria hat
      viele Freunde hier. Sie kommt sicher zurück.

      ...das sag ich immer. Ich glaubs selber nimmer.

      [Lena is guarded. You will need to build more trust before she
      opens up.]
    effects: { trust_lena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Thomas Q1 ---

  thomas_q1:
    type: tweet
    from: thomas
    text: >
      MEINE PARTNERIN IS VERSCHWUNDEN UND DE POLIZEI SAGT MIR SIE
      IS WANDERN GANGEN??? MARIA GEHT NED WANDERN OHNE MIR BESCHEID
      ZU SAGEN. WACHT AUF OIDA.
    effects: { trust_thomas: "+5", contacts_followed: "+1" }
    choices:
      - DM Thomas -> thomas_q1_talk

  thomas_q1_talk:
    type: message
    text: >
      THOMAS: Wer bist du? Noch jemand der mir sagt ich soll mich
      beruhigen? Maria hat mich am Abend vorher angerufen. Sie hat
      gesagt sie hat was Großes. Sie hat gesagt "wenn irgendwas
      passiert, schau dir GranAlp an." Dann hat sie aufgelegt.

      Das war das Letzte was ich von ihr gehört hab.
    effects: { trust_thomas: "+10" }
    choices:
      - What do you think happened? -> thomas_theory
      - Move on -> quest1_hub

  thomas_theory:
    type: message
    text: >
      THOMAS: Ich glaub sie hat Beweise gfunden dass GranAlp illegal
      sprengt und die ham sie zum Schweigen gebracht. Aber ich glaub
      auch dass dieser gschissene Wanderer — der Max — mehr weiß als
      er zugibt. Wie der Maria immer nachgstiegen is... des war ned
      normal.

      Maria hat mir vor Wochen gsagt dass jemand ihre Sachen am Alm
      durchgsucht hat. Ihre Proben, ihre Fotos. Sie hat dacht es war
      nix. Ich glaub des war ned nix.
    effects: { trust_thomas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Anna Q1 ---

  anna_q1:
    type: tweet
    from: anna
    text: >
      Die Kräuter auf der Hochalm blühn weiter. Aber die Sennerin
      is ned da. @maria_huber, die Berg warten auf di.
    effects: { trust_anna: "+5", contacts_followed: "+1" }
    choices:
      - DM Anna -> anna_q1_talk

  anna_q1_talk:
    type: message
    text: >
      ANNA: Maria and I have been friends since school. We were working
      together — she on the water, I on the soil. The quarry blasting
      is changing everything up there. The herbs taste different, the
      spring water is turbid, the ground vibrates.

      We were documenting it. We had samples, photos, measurements.
      We were going to present it at the next Gemeinderat meeting.

      Then she went silent. And two days later, someone broke into
      my garden shed and took my sample case.

      [Anna seems genuinely frightened.]
    effects: { trust_anna: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Maria went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Felix (was climbing near the quarry) -> felix_interview
      - Find Hansi (mountain guide, patrols early) -> hansi_interview
      - Find Werner (dairy farmer, heard explosions) -> werner_interview
      - Find Rudi (baker, starts at 5am, saw something) -> rudi_interview

  # --- Felix (saw someone at Maria's car) ---

  felix_interview:
    type: tweet
    from: felix
    text: >
      geile session am fels heut aber irgendwos stimmt ned im dorf.
      die stimmung is oasch. kann des ned erklären oida
    effects: { trust_felix: "+5" }
    choices:
      - Ask Felix about that evening -> felix_talk

  felix_talk:
    type: message
    text: >
      FELIX: oida ok aber du sagst des niemandem. i war am steinbruch
      klettern, so gegen 19 uhr. und i hab den typen gsehen — den
      max, den wanderer — bei marias auto am parkplatz. er hat
      irgendwos unterm auto gmacht. als er mi gsehen hat is er ur
      schnell abghaut.

      wos zum fick oida. i hab nix gsagt weil i ned wollt dass wer
      weiß dass i am steinbruch kletter — is ja verboten. aber jetzt
      is des schon heftig
    effects:
      trust_felix: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Hansi (mountain guide, saw late-night activity) ---

  hansi_interview:
    type: tweet
    from: hansi
    text: >
      Erinnerung: Der Almweg ist ab 20 Uhr gesperrt. In den letzten
      Nächten sind unautorisierte Fahrzeuge gesichtet worden.
    effects: { trust_hansi: "+5" }
    choices:
      - Ask Hansi what he saw -> hansi_talk

  hansi_talk:
    type: message
    text: >
      HANSI: I was doing my evening round at the Alpenverein hut,
      around 22 Uhr. I saw lights on the Almweg — two vehicles going
      up toward the Hochalm. The first was a GranAlp pickup, I know
      the logo. The second I could not identify.

      At 22 Uhr. On the Almweg. That is not normal.

      I noted it in my patrol log. Nobody has asked to see it.
    effects:
      trust_hansi: "+10"
      night_witnesses: "+1"
      quarry_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Werner (heard late-night blasting) ---

  werner_interview:
    type: tweet
    from: werner
    text: >
      die kühe san scho wieder narrisch gwordn letzte nacht. des
      rumsen vom steinbruch isch zu jeder zeit jetzt. a um mitternacht.
    effects: { trust_werner: "+5" }
    choices:
      - Ask Werner what he heard -> werner_talk

  werner_talk:
    type: message
    text: >
      WERNER: I have sixty cows. They know the rhythm of the mountain.
      And that night — the night before Maria vanished — there was a
      blast. Not the usual daytime blasting. This was at midnight.
      Maybe 1am. A deep rumble.

      My cows panicked. Broke through a fence. It took me an hour
      to get them back.

      GranAlp says they never blast at night. My cows say different.
      And a midnight blast near the Hochalm? That is where Maria's
      spring comes from. That is where her cheese cellar is.
    effects:
      trust_werner: "+10"
      night_witnesses: "+1"
      quarry_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Rudi (baker, saw vehicle chase) ---

