      love him. He'll understand. He has to understand.

      That's not love. That's obsession.

      You've already sent the evidence to Sarxento Valcárcel. And to
      Iria Bouzas.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Sarxento Valcárcel reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the break-ins, the witness
      testimonies — Nerea is arrested for stalking and harassment.
      A GPS tracker is recovered from under Brais's Citroën at the
      old percebeiro huts near Punta Lobeira.

      Iria Bouzas, finally in possession of Brais's full evidence
      package, publishes the CelGalicia story in El País. She includes
      the payment records to Alcalde Feijóo's private account. The
      Xunta orders an unannounced inspection. The mill is shut down
      pending environmental remediation. Suso Barreiro faces criminal
      charges for falsifying discharge reports. Moncho Feijóo is
      arrested for corruption.

      And Brais Oubiña, reading the story from a shepherd's cottage
      in the Serra do Courel, calls his brother for the first time
      in nine days.

      "Volvo á casa."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: brais
    text: >
      a ría non mente. e a xente de areira tampouco. grazas por non
      deixar de buscar.
    choices:
      - The End -> game_complete

  # --- ENDING B: Suso (Partial Ending) ---

  confront_suso:
    type: message
    text: >
      You present the pollution evidence to Suso Barreiro:

      "I have photographs of the undeclared outfall pipe. I have water
      samples showing contamination levels fifteen times the legal
      limit. I have your original lab reports showing the data was
      falsified. I have the barrels with your batch numbers. And I
      have the payment records to the alcalde."
    choices:
      - Send -> suso_response

  suso_response:
    type: message
    text: >
      SUSO: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. CelGalicia has always operated within
      regulatory requirements and maintains the highest environmental
      standards.

      But it's too late. You've sent the evidence to Iria, to the
      Gardas da Ría, and to the Xunta.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. CelGalicia is ordered to halt
      discharge pending investigation. The mill may close permanently.
      Three hundred jobs hang in the balance. The village is divided.
      Alcalde Feijóo resigns before the corruption charges land.

      But Brais?

      Without the stalking evidence, Nerea is never investigated.
      She continues to work at the café on the port. She continues
      to monitor his accounts. She creates a new anonymous profile.
      She waits.

      Three months later, Brais reads about CelGalicia online. He
      returns quietly. He moves to a different boarding house. He
      stops harvesting alone. He checks his car every morning. He
      changes his locks twice.

      The corporation is exposed. The alcalde falls. But the person
      who terrorised Brais walks free. And she's still watching.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: brais
    text: "volvín. a ría está máis limpa. o resto... xa veremos."
    choices:
      - The End -> game_complete

  # --- ENDING C: Alcalde (Wrong Ending) ---

  confront_moncho:
    type: message
    text: >
      You confront Alcalde Feijóo with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> moncho_response

  moncho_response:
    type: tweet
    from: marta
    text: >
      O meu cliente toma nota das súas acusacións. Calquera difusión
      pública de afirmacións difamatorias dará lugar a procedementos
      legais inmediatos. — Despacho Pazos & Asociados, Santiago
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The alcalde's lawyer buries your accusation. Without a direct
      link between Feijóo and CelGalicia's dumping — and the payment
      records alone aren't enough without Brais's full evidence
      package — your case is insufficient.

      CelGalicia continues to operate. The ría continues to die.
      Nerea continues to watch. Brais stays in hiding.

      Six months later, @costa_escura creates a new account. It
      follows Brais's brother. The first post: "Tell him I'm still
      here."
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: AREIRA DE MAR — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Brais's story explores themes of
      corporate impunity, environmental crime, political corruption,
      obsessive behaviour after a breakup, community solidarity,
      and the courage to speak up when powerful interests want
      silence.

      If you or someone you know is experiencing stalking,
