entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN AREIRA DE MAR
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to areira.social — the community Mastodon instance for
      the coastal village of Areira de Mar, Galicia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @brais_oubina.

      A percebeiro — barnacle harvester. Youngest in the cofradía. He
      documented the ría, the cliffs, the tides. People are worried.
      He hasn't posted in six days.
    choices:
      - Look at his profile -> brais_profile

  brais_profile:
    type: tweet
    from: brais
    text: "a auga da ría xa non cheira a sal. cheira a cloro e a morte. a fábrica está vertendo e teño probas. #CelGaliciaContamina"
    choices:
      - That's his last real post... -> grey_cliff

  grey_cliff:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a grey cliff face. Blurred, shot from a strange angle. Posted
      at 4am. No caption.

      His friends say that's not his style. Brais always wrote
      captions in Galician, always tagged the location. The Garda
      Civil says he probably went to work in another port. Something
      doesn't add up.
    choices:
      - Read the Garda Civil statement -> guardia_statement
      - Look at what people are saying -> community_reaction

  guardia_statement:
    type: tweet
    from: sargento
    text: >
      Recibimos unha denuncia relativa a un residente de Areira de Mar.
      Neste momento non existen indicios de acto delituoso. Calquera
      información útil pode comunicarse ao 062 ou ao posto.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His ex-girlfriend @nerea_toimil is
      posting frantic messages. His brother @uxio_oubina is driving
      down from Vigo. His friend @sabela_doval says the ría samples
      prove he was right. The patrón maior @xoan_carballo says the
      cofradía is terrified.

      And the journalist @iria_bouzas is strangely silent.

      Nobody buys the Garda Civil's line. Nobody thinks Brais just
      "went to work in another port." A percebeiro doesn't leave
      his coast. The cliffs are his life.
    effects: { trust_nerea: "+5", trust_uxio: "+5" }
    choices:
      - Start following Brais's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Areira de Mar. Follow Brais's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Carmela (taberna owner, knows everyone) -> carmela_intro
      - Talk to Xoán (patrón maior, head of the cofradía) -> xoan_intro
      - Talk to Antía (teen bodyboarder, seems shaken) -> antia_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Brais with the rhythms of a small
      fishing village: tide tables, lonja prices, weather warnings,
      festa schedules.

      Key names surface: Nerea (ex-girlfriend, barista, can't stop
      posting about him), Sabela (marine biologist, seems rattled),
      Iria (journalist, oddly quiet), and the teens — Antía, Roi,
      Mariña — who idolised Brais for teaching them the cliffs.

      Also prominent: CelGalicia S.A., the paper mill up the ría.
      Their posts are corporate PR. Brais's posts were accusations.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Carmela -> carmela_intro
      - Talk to Xoán -> xoan_intro
      - Talk to Antía -> antia_intro

  # --- Carmela (social map) ---

  carmela_intro:
    type: tweet
    from: carmela
    text: >
      A taberna está aberta pero o corazón non. @brais_oubina, a túa
      mesa está aquí. Volta, rapaz.
    effects: { trust_carmela: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Carmela -> carmela_talk

  carmela_talk:
    type: message
    text: >
      CARMELA: Ay, you're new? Welcome. Bad time to arrive, the whole
      village is upside down about Brais.

      Let me tell you who's who. Nerea is his ex — they broke up four
      months ago but she's still... around. Always around. Sweet girl
      but hostia, she cannot let go. Sabela Doval works at the marine
      station with Brais, she helped him with the water samples. Uxío
      is Brais's older brother, he's coming from Vigo.

      And Iria Bouzas — the journalist — she and Brais were working
      on something together. Something about the fábrica. Iria hasn't
      said a word since Brais vanished. That's not like her at all.

      Oh, and don't bother reading CelGalicia's posts. Lies wrapped
      in corporate certificates, tío. That mill has been killing the
      ría for years.
    effects: { trust_carmela: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Nerea -> carmela_nerea
      - Ask about CelGalicia -> carmela_celgalicia
      - Thank her and move on -> quest1_hub

  carmela_nerea:
    type: message
    text: >
      CARMELA: Nerea? Mira, she's a good girl, but coño... since Brais
      broke up with her, she's been impossible. At the café every time
      he was here. Walking past the docks when he was working. Commenting
      on every photo he posted. He was polite about it but I could see
      it bothered him.

      After he started the pollution investigation, she got worse.
      Said she was worried about him, that the cliffs were dangerous,
      that he needed someone watching his back. He told me once, "she
      doesn't accept that it's over." I thought he meant the usual
      heartbreak. Now I wonder if it was something more.
    effects: { trust_carmela: "+5" }
    choices:
      - Ask about CelGalicia -> carmela_celgalicia
      - Move on -> quest1_hub

  carmela_celgalicia:
    type: message
    text: >
      CARMELA: That paper mill has been there since the 70s. Cellulose,
      bleaching, chemical processing — the whole ría stinks of chlorine
      when the wind turns. The village tolerated them because they
      brought jobs. But the mariscadores have been complaining for
      years — the shellfish beds are dying, the water is brown near
      the discharge pipe, dead fish float in every morning.

      Brais was the first person to actually climb down to the outfall
      with a camera and sample bottles. Joder, the boy had balls. He
      had proof, he said. Real proof. Water samples, photos, chemical
      data. Three weeks later he's gone.

      You tell me that's a coincidence. Me cago en dios.
    effects: { trust_carmela: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Xoán (patrón maior, witness tease) ---

  xoan_intro:
    type: tweet
    from: xoan
    text: >
      trinta e cinco anos traballando esta costa. a ría xa non é a
      mesma. @brais_oubina tiña razón. e agora desapareceu. facede
      a conta vós.
    effects: { trust_xoan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Xoán -> xoan_talk

  xoan_talk:
    type: message
    text: >
      XOÁN: I've been working this coast since I was a rapaz of
      fifteen. I know every rock, every current, every colour the ría
      makes. And I'm telling you — the water near the mill outfall
      is wrong. Has been for months. The percebes are dying. The
      barnacle beds at Punta Lobeira that fed three generations of
      percebeiros are empty.

      Brais took water samples. He climbed down cliffs that would
      kill most men to photograph the discharge pipe. He was building
      a case against CelGalicia. And then — gone.

      You think that's a coincidence? A percebeiro doesn't leave
      his coast, tío. The cliffs are in our blood.
    effects: { trust_xoan: "+10" }
    choices:
      - Did you see anything unusual recently? -> xoan_night
      - Move on -> quest1_hub

  xoan_night:
    type: message
    text: >
      XOÁN: The night before he vanished — I was coming back from
      checking the crab traps, around midnight. I saw lights at the
      marine station. Not unusual, researchers work late. But there
      were two vehicles in the car park. One was Brais's old Citroën.
      The other was a black SUV with CelGalicia plates.

      At midnight. At the marine station.

      I noted it in my cofradía log. Nobody's asked to see it.
    effects: { trust_xoan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Antía (teen bodyboarder, witness tease) ---

  antia_intro:
    type: tweet
    from: antia
    text: >
      joder tío estoy flipando @brais_oubina fue el que nos enseñó
      a respetar el mar y los cantiles. no es posible que se haya
      ido así. si alguien sabe algo que lo diga coño
    effects: { trust_antia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Antía -> antia_talk_early

  antia_talk_early:
    type: message
    text: >
      ANTÍA: tío eres nuevo aquí?? menudo timing de mierda. en plan
      brais es lo mejor que tiene este pueblo. nos enseñó a bajar los
      cantiles, nos enseñaba los percebes, nos contaba historias del
      mar. mola mazo el rapaz.

      y ahora estoy flipando porque roi vio algo raro la otra noche
      en el puerto pero no quiere hablar. dice que no es nada pero
      hostia puta que sí es algo. se le nota en la cara tío
    effects: { trust_antia: "+10" }
    choices:
      - What did Roi see? -> antia_roi_hint
      - Move on -> quest1_hub

  antia_roi_hint:
    type: message
    text: >
      ANTÍA: no sé exactamente. estaba haciendo skate por el puerto
      y vio a alguien toqueteando el coche de brais?? o algo así. está
      cagado y no quiere hablar del tema. tienes que hablar con él
      directamente pero es desconfiado con la gente que no conoce.
      intenta hablarle de surf o de grafiti primero jajaja. es buen
      tío pero tímido de cojones
    effects: { trust_antia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Areira de Mar. A Galician fishing
      village built around the ría and the cliffs. A young percebeiro
      who was exposing pollution. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Nerea (Brais's ex-girlfriend) -> nerea_q1
      - Talk to Sabela (Brais's friend at the marine station) -> sabela_q1
      - Check what Uxío (Brais's brother) is saying -> uxio_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Nerea Q1 ---

  nerea_q1:
    type: tweet
    from: nerea
    text: >
      se alguien ten noticias de @brais_oubina chamádeme por favor.
      o seu cuarto está igual. as súas cordas de escalada están aí.
      el non se iría sen o seu material. non pode ser.
    effects: { trust_nerea: "+5", contacts_followed: "+1" }
    choices:
      - DM Nerea -> nerea_q1_talk

  nerea_q1_talk:
    type: message
    text: >
      NEREA: Who are you? Another person from outside who's going to
      tell me to calm down? Brais and I... we were together for two
      years. I know him better than anyone. He wouldn't just leave.

      ...I keep saying that. I keep saying he'll come back.

      [Nerea seems emotionally raw. She's guarded but desperate.
      You'll need to build more trust before she opens up fully.]
    effects: { trust_nerea: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sabela Q1 ---

  sabela_q1:
    type: tweet
    from: sabela
    text: >
      A estación está baleira sen @brais_oubina. As súas mostras de
      auga seguen na neveira. Os seus datos de campo están no seu
      escritorio. El nunca abandonaría unha investigación aberta.
      Algo pasou.
    effects: { trust_sabela: "+5", contacts_followed: "+1" }
    choices:
      - DM Sabela -> sabela_q1_talk

  sabela_q1_talk:
    type: message
    text: >
      SABELA: Brais and I have worked together at the station for
      over a year. He's a percebeiro but he understood marine biology
      better than half the scientists. This pollution investigation —
      it was everything to him. He had data, photos, chemical analysis.
      He was so close to going public with the journalist.

      I helped him with the lab work. The water samples from the
      outfall — the heavy metals are off the charts. Cadmium, mercury.
      The ría is dying and CelGalicia is killing it.

      I just want him to come back, tío. This village needs him.
    effects: { trust_sabela: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Uxío Q1 ---

  uxio_q1:
    type: tweet
    from: uxio
    text: >
      meu irmán DESAPARECEU e a garda civil dime que se foi a outro
      porto??? EL NON SE VAI SEN AVISAR. veño de Vigo. alguén vai
      explicarme que coño pasou.
    effects: { trust_uxio: "+5", contacts_followed: "+1" }
    choices:
      - DM Uxío -> uxio_q1_talk

  uxio_q1_talk:
    type: message
    text: >
      UXÍO: Who are you? Another gilipollas who's going to tell me
      everything's fine? My brother called me the night before he
      disappeared. He said he had something big. He said "if anything
      happens to me, look at CelGalicia." Then he hung up.

      That's the last I heard from him. Hostia puta, tío. He sounded
      scared. Brais doesn't get scared. He hangs off cliffs over the
      Atlantic for a living.
    effects: { trust_uxio: "+10" }
    choices:
      - What do you think happened? -> uxio_theory
      - Move on -> quest1_hub

  uxio_theory:
    type: message
    text: >
      UXÍO: I think he found proof that CelGalicia is dumping toxic
      waste in the ría and they shut him up. But I also think his
      ex — Nerea — knows more than she's saying. The way she talks
      about him... joder, tío, they broke up four months ago and
      she's acting like they're still together.

      Brais told me weeks ago that someone was following him. He'd
      see the same car parked near the cliffs when he was working.
      He'd find stuff moved in his room. He thought it was nothing.
      I don't think it was nothing.
    effects: { trust_uxio: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Brais went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Roi (was skating at the port at sunset) -> roi_interview
      - Find Bieito (lonxista, works late at the lonja) -> bieito_interview
      - Find Loís (mariscador, early morning at the shore) -> lois_interview
      - Find Amaro (boat carpenter, workshop near the dock) -> amaro_interview

  # --- Roi (saw someone at Brais's car) ---

  roi_interview:
    type: tweet
    from: roi
    text: >
      buena sesión esta tarde pero el rollo en el puerto está raro
      últimamente. hay algo que no cuadra tío. no sé cómo explicarlo
    effects: { trust_roi: "+5" }
    choices:
      - Ask Roi about that evening -> roi_talk

  roi_talk:
    type: message
    text: >
      ROI: tío vale pero no se lo digas a nadie eh. estaba en el
      puerto sobre las 7 de la tarde haciendo skate y vi a la nerea
      al lado del coche de brais. estaba como buscando algo dentro o
      metiendo algo, no sé. cuando me vio se fue corriendo.

      o sea yo no dije nada porque no quería movidas pero hostia
      puta tío ahora es diferente. no es normal eso. me cago en
      dios que no es normal
    effects:
      trust_roi: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Bieito (lonxista, saw late-night meeting) ---

  bieito_interview:
    type: tweet
    from: bieito
    text: >
      Lembrade: a lonxa pecha ás 22h. Últimamente hai movemento raro
      no peirao despois da hora. Coches que non son de aquí.
    effects: { trust_bieito: "+5" }
    choices:
      - Ask Bieito what he saw -> bieito_talk

  bieito_talk:
    type: message
    text: >
      BIEITO: I was closing the lonja around 22h30. I saw Brais's
      Citroën still parked at the marine station. And a black SUV —
      CelGalicia plates — right next to it. Two men in suits standing
      by the station entrance. One I recognised: Suso Barreiro, the
      mill director.

      At 22h30. At the marine station. Suits don't come to Areira at
      night, tío. Something was wrong.

      I noted it in the lonja log. Nobody's asked to see it.
    effects:
      trust_bieito: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Loís (saw Brais fleeing) ---

  lois_interview:
    type: tweet
    from: lois
    text: >
      ás 4 da mañá na praia. a marea baixa non estaba baleira. había
      alguén correndo polo sendeiro do cantil. no escuro. non era un
      corredor.
    effects: { trust_lois: "+5" }
    choices:
