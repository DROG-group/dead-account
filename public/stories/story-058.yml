      bio: "ex de brais | barista no porto | non podo deixar de pensar nel"
      avatar: avatars/nerea.jpg
    uxio:
      name: "Uxío Oubiña"
      bio: "irmán maior de brais | mariscador | vigo | vai aparecer, ten que aparecer"
      avatar: avatars/uxio.jpg
    sabela:
      name: "Sabela Doval"
      bio: "amiga de brais | bióloga mariña | estación de areira | a ría está morrendo"
      avatar: avatars/sabela.jpg

    # === Local Government ===
    moncho:
      name: "Moncho Feijóo"
      bio: "Alcalde de Areira de Mar | Ao servizo do concello desde 2011 | #AreiraAvanza"
      avatar: avatars/moncho.jpg
    aldara:
