# DEAD ACCOUNT — Story 058: Areira de Mar (Spain 3 — Galicia)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-058.yml
#
# Player investigates the disappearance of young percebeiro Brais Oubiña
# in the fictional Galician fishing village of Areira de Mar.

meta:
  title: "Dead Account"
  state:
    # Trust levels per NPC (0-100)
    trust_nerea: 0
    trust_uxio: 0
    trust_sabela: 0
    trust_xoan: 0
    trust_antia: 0
