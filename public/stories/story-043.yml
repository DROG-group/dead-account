  ending_a:
    type: message
    text: >
      ENDING A: THE ENFORCER

      The Tallinn prosecutor opens a criminal investigation. TuuleTech's
      site is raided. Kalev Rand is arrested for intimidation, breaking
      and entering, destruction of evidence, and assault.

      Andres Luik is charged with issuing fraudulent environmental
      permits and accepting bribes. The Natura 2000 boundary fraud is
      referred to the EU Environment Directorate. Every turbine on the
      north ridge is ordered shut down.

      And Marten Kask? He's found alive. He'd been hiding in a
      fisherman's cabin on Vilsandi island since that night. Urmas had
      taken him there by boat in the dark. Marten had been too scared to
      surface — the construction crew had chased him to the cliff edge,
      and he'd only escaped by scrambling down the rocks to Juhan's
      fishing boat below.

      ERR broadcasts the full story. "The Eagles of Saaremaa" becomes
      an EU-wide investigation into wind farm permits across the Baltic.
      The eagle colony is placed under enhanced protection.

      Marten returns to Saarekyula. His first post:
    choices:
      - See the epilogue -> ending_a_epilogue

