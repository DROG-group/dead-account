entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SAAREKYULA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to saarekyula.social — the community Mastodon instance
      for the village of Saarekyula on Saaremaa island, Estonia.

      The local feed is buzzing with alarm. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name dominates: @marten_wildlife.

      A local wildlife biologist and drone photographer. He documented
      the island's eagle populations and coastal ecosystems. Thousands
      of followers loved his aerial footage. He hasn't posted in nine
      days.
    choices:
      - Look at his profile -> marten_profile

  marten_profile:
    type: tweet
    from: marten
    text: "Three nesting sites destroyed. Permits signed by a man who's never visited the site. This stops now."
    choices:
      - That's his last real post... -> black_square

  black_square:
    type: message
    text: >
      Two days after that post, his account shared a single image:
      a solid black square. No caption. Posted at 2am.

      His friends say that's not Marten. The police say there's no
      evidence of a crime. But a biologist doesn't vanish after
      exposing destroyed eagle nests.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: politsei
    text: >
      Oleme saanud teate Saareküla elaniku kohta. Hetkel puuduvad
      tõendid kuriteo kohta. Info: 612 3000.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The feed is divided. Marten's girlfriend @katrin_bio is posting
      desperate pleas. His research partner @priit_orni is posting
      cryptic references to "corrupted environmental permits." His
      sister @marika_kask is threatening to involve EU authorities.

      Vanaema Aino says the eagles have lived on these cliffs for
      hundreds of years and "those windmill people are killing them
      all."

      Nobody believes Marten just left. He was exposing something
      dangerous.
    effects: { trust_katrin: "+5", trust_marika: "+5" }
    choices:
      - Start following Marten's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Saarekyula. Follow Marten's contacts and read their
      posts. The more you engage, the more islanders will trust you.
    choices:
      - Talk to Vanaema Aino (island elder) -> aino_intro
      - Talk to Juhan the fisherman (knows the coast) -> juhan_intro
      - Talk to Markus (teen skater, saw something) -> markus_intro
      - Browse the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Marten with everyday island life.
      Ferry schedules, weather, fishing reports. And a growing debate
      about TuuleTech — the wind energy company building turbines on
      the island's northwest coast.

      Key names: Katrin (marine biologist, Marten's girlfriend), Priit
      (ornithologist, research partner), Urmas (forester, local
      knowledge), Sirje (journalist, strangely quiet about all this).

      TuuleTech's corporate account keeps posting about "green energy"
      and "sustainable development." The locals seem split — some want
      the jobs, others want the eagles.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Vanaema Aino -> aino_intro
      - Talk to Juhan -> juhan_intro
      - Talk to Markus -> markus_intro

  # --- Vanaema Aino (elder, history) ---

  aino_intro:
    type: tweet
    from: aino
    text: >
      kotkad on elanud neil kaljudel sada aastat. nüüd tuulikud
      tapavad neid. marten teadis. marten rääkis. nüüd on marten
      kadunud.
    effects: { trust_aino: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Vanaema Aino -> aino_talk

  aino_talk:
    type: message
    text: >
      AINO: Come, sit. Have some bread and honey.

      The northwest cliffs have been eagle territory forever. White-
      tailed eagles. Magnificent birds. Marten counted twelve nesting
      pairs — one of the largest colonies in the Baltic.

      Then TuuleTech got permits to build turbines on those very cliffs.
      The environmental assessment said "no significant impact on
      wildlife." Marten said that assessment was fraudulent. He had
      drone footage of dead eagles under the turbine towers.

      The permits were signed by Andres Luik — the municipal
      environmental specialist. Andres has never visited the site. Not
      once. Marten checked the visitor logs.
    effects: { trust_aino: "+10", contacts_followed: "+2" }
    choices:
      - Ask about TuuleTech -> aino_tuuletech
      - Ask about the town leadership -> aino_politics
      - Thank her and move on -> quest1_hub

  aino_tuuletech:
    type: message
    text: >
      AINO: TuuleTech came two years ago. They promised jobs, money,
      "green energy." The municipal elder Toomas Oja welcomed them with
      open arms. Signed a partnership agreement. TuuleTech "donated"
      money for the village hall renovation.

      Then the construction started. On the eagle cliffs. Nobody voted
      for that specific location. The permits appeared. Andres Luik
      signed them. The turbines went up.

      Marten started documenting everything. Drone flights. Dead birds.
      Destroyed nests. He posted it all online. And then Kalev Rand —
      TuuleTech's site manager — started "visiting" him.
    effects: { trust_aino: "+5" }
    choices:
      - Ask about the town leadership -> aino_politics
      - Move on -> quest1_hub

  aino_politics:
    type: message
    text: >
      AINO: Toomas Oja is the municipal elder. He's not a bad man, just
      a weak one. He wants the village to survive. Young people leave.
      TuuleTech promised to keep them here.

      Andres Luik is supposed to protect the environment. Instead he
      rubber-stamps whatever TuuleTech asks for. Marten said Andres
      gets "consulting fees" from TuuleTech on the side. Off the books.

      And Kalev Rand — the construction boss. A big man. Loud. He came
      to Marten's house. Katrin told me. He "suggested" Marten should
      "focus on other species." That was a threat.
    effects: { trust_aino: "+10", contacts_followed: "+2" }
    choices:
      - Move on -> quest1_hub

  # --- Juhan (fisherman, coastal knowledge) ---

  juhan_intro:
    type: tweet
    from: juhan
    text: >
      kotkad ei lenda enam ranniku kohal. tuulikud on nende teel.
      kolmkümmend aastat olen vaadanud neid lendamas. nüüd ainult
      tuulikud.
    effects: { trust_juhan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Juhan -> juhan_talk

  juhan_talk:
    type: message
    text: >
      JUHAN: I fish these waters every day. I used to watch the eagles
      hunt from my boat. Now I find them dead on the rocks below the
      turbines.

      Marten asked me to document what I found. I photographed seven
      dead eagles over three months. He said the official count was
      "zero wildlife fatalities." Zero. When I had photographs of seven
      dead birds.

      The environmental reports are lies. Someone is signing off on
      false data. Marten knew who. And now Marten is gone.
    effects: { trust_juhan: "+10", contacts_followed: "+1" }
    choices:
      - Ask about the dead eagles -> juhan_eagles
      - Move on -> quest1_hub

  juhan_eagles:
    type: message
    text: >
      JUHAN: White-tailed eagles are protected under EU law. Natura
      2000. The cliffs are supposed to be a protected zone. TuuleTech's
      permits specifically exclude that area — but they built there
      anyway.

      The construction crew moved the boundary markers. Literally picked
      up the Natura 2000 signs and moved them 500 metres south. Marten
      photographed it. He had GPS coordinates showing the original
      boundary versus the current one.

      That's not a paperwork error. That's deliberate environmental
      fraud.
    effects: { trust_juhan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Markus (teen witness) ---

  markus_intro:
    type: tweet
    from: markus
    text: >
      okei nii ma nägin midagi marteni maja juures sel ööl. peaks
      ma politseile ütlema?? nad ei võta mind kunagi tõsiselt lol
    effects: { trust_markus: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Markus -> markus_talk_early

  markus_talk_early:
    type: message
    text: >
      MARKUS: jou nii ma olin sadamas ja skeitimas umbes kell 11
      öösel ja nägin kuidas marteni maja juurde sõitis kaubik.
      TuuleTech logo küljel. kaks tüüpi läksid sisse. nad olid
      seal umbes pool tundi. tulid välja kastidega. nagu karbid
      ja kõvakettad ja asju.

      marten polnud kodus. tema auto polnud seal. kes käib kellegi
      teise majas kell 11 öösel krt?
    effects: { trust_markus: "+10" }
    choices:
      - Can you describe the men? -> markus_describe
      - Thanks Markus, I'll come back -> quest1_hub

  markus_describe:
    type: message
    text: >
      MARKUS: üks oli normaalne suur tüüp. ehitustöölise moodi.
      teine oli noorem, kiire. neil olid võtmed — nad ei murdnud
      sisse. neil olid päriselt võtmed marteni majja.

      ja see kaubik... TuuleTech logo. sama kaubik mis ehitusplatsil
      sõidab. tbh see on chill pole see on üsna kahtlane.
    effects: { trust_markus: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're building a picture. A small island village. A biologist
      who documented eagles being killed by illegally-placed wind
      turbines. A corrupt environmental official signing false permits.
      And now the whistleblower is gone.
    choices:
      - Talk to Katrin (Marten's girlfriend) -> katrin_q1
      - Talk to Priit (ornithologist, research partner) -> priit_q1
      - Talk to Urmas (forester) -> urmas_q1
      - Investigate the night Marten disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Katrin Q1 ---

  katrin_q1:
    type: tweet
    from: katrin
    text: >
      palun kui keegi teab midagi @marten_wildlife kohta, kirjutage
      mulle. see ei ole tema moodi. palun.
    effects: { trust_katrin: "+5", contacts_followed: "+1" }
    choices:
      - DM Katrin -> katrin_q1_talk

  katrin_q1_talk:
    type: message
    text: >
      KATRIN: I don't know you. But I'll talk to anyone now. Marten
      wouldn't just disappear. We've been together five years. He tells
      me everything.

      The last two weeks he was different. Sleeping badly. Checking
      the windows. He said the construction crew had been "watching"
      his house. He found boot prints in the garden that weren't his.

      The night he disappeared, he said he was going to check the
      eagle nests. He took his drone. He didn't come back.
    effects: { trust_katrin: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Priit Q1 ---

  priit_q1:
    type: tweet
    from: priit
    text: >
      ma ei ütle veel mida marten leidis. aga kui keegi
      vallavalitsusest seda loeb — te teate mis nendes lubades on.
      te olete alati teadnud.
    effects: { trust_priit: "+5", contacts_followed: "+1" }
    choices:
      - DM Priit -> priit_q1_talk

  priit_q1_talk:
    type: message
    text: >
      PRIIT: Who are you? Another internet person? Marten and I spent
      two years documenting those eagles. Real science. Peer-reviewed
      methodology. And now he's gone and I'm getting messages from
      strangers.

      Unless you have something useful to offer, leave me alone.

      [Priit is scared. Build more trust.]
    effects: { trust_priit: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Urmas Q1 ---

  urmas_q1:
    type: tweet
    from: urmas
    text: >
      metsas on vaiksem nüüd. kotkad ei häälitse enam. tuulikute
      müra on kõik muutnud. marten teadis mida see tähendab.
    effects: { trust_urmas: "+5", contacts_followed: "+1" }
    choices:
      - DM Urmas -> urmas_q1_talk

  urmas_q1_talk:
    type: message
    text: >
      URMAS: I manage the forests on the northwest side. Where the
      turbines are. The construction destroyed three hectares of
      nesting habitat. Marten documented everything — GPS coordinates,
      drone footage, dead bird counts.

      He filed a complaint with the Environment Board in Tallinn. They
      said they'd investigate. That was six months ago. Nothing
      happened. Marten said someone was blocking his complaint from
      inside the system.
    effects: { trust_urmas: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Marten went silent. Piece together
      the timeline from at least 4 witnesses.
    choices:
      - Find Katrin (was waiting at home) -> katrin_interview
      - Find Helgi (mechanic, saw vehicles on the coast road) -> helgi_interview
      - Find Juhan (fisherman, was on the water that night) -> juhan_interview
      - Find Urmas (forester, heard something in the woods) -> urmas_interview

  # --- Katrin (waiting at home) ---

  katrin_interview:
    type: message
    text: >
      KATRIN: He left around 20:00. Said he was going to check the
      nesting sites — he'd gotten a report of a new dead eagle. He
      took his drone, his camera, and a folder of documents he'd been
      carrying everywhere.

      He didn't come home. By 23:00 I drove to the cliffs. His car was
      parked at the trailhead but he wasn't there. His drone case was
      on the passenger seat — open, drone missing. I called the police
      at midnight.
    effects:
      trust_katrin: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Helgi (mechanic, saw vehicles) ---

  helgi_interview:
    type: tweet
    from: helgi
    text: >
      töötasin hilja eile. rannatee peal sõitis kaks TuuleTech
      kaubikut. kell 21 paiku. kiirelt. kuhu nad nii hilja lähevad?
    effects: { trust_helgi: "+5" }
    choices:
      - Ask Helgi what he saw -> helgi_talk

  helgi_talk:
    type: message
    text: >
      HELGI: I was in the workshop. Around 21:00 two TuuleTech vans
      drove past on the coast road. Fast. Lights off. That's the road
      to the turbine site and the eagle cliffs.

      I service TuuleTech's vehicles. Those were crew vans — the
      ones with tool storage in the back. No reason for them to be
      driving to the site at night. Construction stops at 18:00.

      An hour later they came back. Same direction. Same speed. Still
      no lights. Something was wrong about that.
    effects:
      trust_helgi: "+10"
      night_witnesses: "+1"
      threats_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Juhan (fisherman, on the water) ---

  juhan_interview:
    type: message
    text: >
      JUHAN: I was night fishing below the cliffs. Around 22:00 I
      heard voices above — at the turbine site. Men shouting. Then a
      buzzing sound — a drone. Someone was flying a drone in the dark.

      Then I heard a crash. Like something hitting metal. The drone
      sound stopped. More shouting. Someone said "Get that camera."

      Then a scream. Not a shout — a scream. Like someone was hurt. I
      pulled up anchor and left. I'm not proud of that.

      The next morning I went back. Found a broken drone on the rocks.
      Marten's drone. The memory card was gone.
    effects:
      trust_juhan: "+15"
      night_witnesses: "+1"
      threats_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Continue investigating -> quest2_hub

  # --- Urmas (forester, heard something) ---

  urmas_interview:
    type: message
    text: >
      URMAS: I was doing a late patrol in the forest near the turbine
      site. Around 22:30 I heard vehicles at the construction access
      road. Doors slamming. Then men walking through the forest — not
      on the path, through the undergrowth. Like they were searching
      for someone.

      I heard someone call out: "He went toward the coast path."
      Another voice: "Cut him off at the lookout."

      They were hunting someone. In the dark. In the forest. I stayed
      hidden. I'm ashamed to say it but I was afraid.

      By morning, Marten's car was at the trailhead and Marten was
      gone.
    effects:
      trust_urmas: "+15"
      night_witnesses: "+1"
      threats_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.
    choices:
      - Talk to Liisa (teen activist, saved Marten's posts) -> liisa_interview
      - Talk to Henri (teen, has drone footage) -> henri_interview
      - Find Katrin -> katrin_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Helgi the mechanic -> helgi_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Juhan the fisherman -> juhan_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Urmas the forester -> urmas_interview
        when:
          state: night_witnesses
          lt: 4
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Liisa (saved posts) ---

  liisa_interview:
    type: tweet
    from: liisa
    text: >
      okei nii ma salvestasin kõik marteni postitused kotkaste kohta
      ja mõned on KUSTUTATUD tema kontolt?? kes kustutab kellegi
      teise postitusi krt??
    effects: { trust_liisa: "+5" }
    choices:
      - Ask Liisa for the saved posts -> liisa_posts

  liisa_posts:
    type: message
    text: >
      LIISA: siin on mis mul on:

      Day -1: "Fourth dead eagle this month. All within 200m of
      Turbine 7. The official count remains 'zero.' Someone is
      falsifying data."
      Day -3: "Construction crew 'visited' me at home again. Big guy.
      Said I should find a new hobby. I said eagles aren't a hobby."
