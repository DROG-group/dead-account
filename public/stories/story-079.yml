      The environmental story breaks. AlpTransit is ordered to halt
      construction pending investigation. The highway route may be
      rerouted. A hundred and fifty jobs hang in the balance. The
      village is divided.

      But Maja?

      Without the stalking evidence, Nik is never investigated. He
      continues his "fieldwork." He continues to visit her apiaries.
      He creates a new anonymous account. He starts publishing papers
      about "the beekeeper of the Julian Alps."

      Three months later, Maja reads about AlpTransit online. She
      returns quietly. She moves her apiaries. She installs cameras.
      She checks her shed every morning before opening.

      The highway company is exposed. But the person who terrorised
      Maja walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

