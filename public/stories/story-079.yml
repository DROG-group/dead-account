entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN TRIGLAVSKI KOT
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to TriglavskiKot.social — the community Mastodon instance
      for the village of Triglavski Kot, Julian Alps.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @maja_horvat.

      A beekeeper. Keeper of the Carniolan bee. She documented the
      alpine meadows and the old apiaries. People are worried. She
      hasn't posted in six days.
    choices:
      - Look at her profile -> maja_profile

  maja_profile:
    type: tweet
    from: maja
    text: "They want to build the highway through Medvedji gozd. Through the oldest bee forest in the valley. I have the environmental survey that proves it will destroy everything."
    choices:
      - That's her last real post... -> grey_hive

  grey_hive:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a blurred photo of an empty beehive. Harsh flash, shot at a
      strange angle. Posted at 3am. No caption.

      Her friends say that's not her style. Maja photographed her bees
      in golden morning light, always with a story about the colony.
      The police say she probably went hiking. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: insp
    text: >
      Prejeli smo prijavo glede prebivalke Triglavskega Kota. V tej
      fazi ni elementov, ki bi nakazovali na kaznivo dejanje.
      Koristne informacije sporočite na postajo ali na 113.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her sister @anja_horvat is desperate.
      Her father @bostjan_horvat is searching the mountain trails. Her
      best friend @vida_kos says Maja would never leave during swarming
      season.

      The forester @franc_sustar says something is wrong with the
      forest since AlpTransit started surveying. And the journalist
      @tina_kavcic has gone strangely quiet.

      There's also a researcher — @nik_bertoncelj — who's been on
      the instance for months. He seemed to be around Maja constantly.

      Nobody buys the police line. Nobody thinks Maja just "went
      hiking."
    effects: { trust_anja: "+5", trust_bostjan: "+5" }
    choices:
      - Start following Maja's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Triglavski Kot. Follow Maja's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Jože (gostilna owner, knows everyone) -> joze_intro
      - Talk to Franc (forester, worried about the forest) -> franc_intro
      - Talk to Zala (teen climber, seems shaken) -> zala_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Maja with the rhythms of a small
      alpine village: weather warnings, trail conditions, the bakery's
      daily potica, mountain rescue updates.

      Key names surface: Anja (sister, nurse), Vida (best friend,
      fellow beekeeper), Tina (journalist, oddly silent), and the
      teens — Zala, Jan, Lara — who loved Maja's bee workshops.

      Also prominent: AlpTransit Slovenija d.o.o., the company building
      a highway through the valley. Their posts are infrastructure PR.
      Maja's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Jože -> joze_intro
      - Talk to Franc -> franc_intro
      - Talk to Zala -> zala_intro

  # --- Jože (social map) ---

  joze_intro:
    type: tweet
    from: joze
    text: >
      Gostilna odprta ampak srce ni zraven. @maja_horvat, tvoja miza
      te čaka. Vrni se nam.
    effects: { trust_joze: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jože -> joze_talk

  joze_talk:
    type: message
    text: >
      JOŽE: Ah, you're new? Dobrodošli. Bad timing to arrive. Everyone
      is on edge about Maja.

      Let me tell you who's who. Anja is Maja's younger sister — she's
      a nurse at the health centre. Good girl, terrified right now.
      Boštjan is their father, retired forester, tough man but he's
      falling apart. Vida Kos is Maja's best friend, they keep bees
      together and sell honey at the Saturday market.

      And there's this researcher — Dr. Nik Bertoncelj. From Ljubljana.
      Been here eight months studying Carniolan bee genetics. He zeroed
      in on Maja's apiaries straight away. She told me once it was
      getting intense. He doesn't understand boundaries.

      Oh, and stay away from AlpTransit's PR posts. Laži wrapped in
      infrastructure promises.
    effects: { trust_joze: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Nik -> joze_nik
      - Ask about AlpTransit -> joze_alptransit
      - Thank him and move on -> quest1_hub

  joze_nik:
    type: message
    text: >
      JOŽE: Nik? He showed up eight months ago from the university.
      Said he was studying Carniolan bee genetics. Maja was excited at
      first — ej no, someone from the university interested in her
      bees! But then it got weird.

      He'd be at her apiary every morning. He'd sit in my gostilna
      waiting for her. He'd walk past her house three, four times a day.
      She told him she needed space. He said he was just "being thorough
      with fieldwork."

      Kaj za vraga. That's not fieldwork. That's something else.
    effects: { trust_joze: "+5" }
    choices:
      - Ask about AlpTransit -> joze_alptransit
      - Move on -> quest1_hub

  joze_alptransit:
    type: message
    text: >
      JOŽE: AlpTransit. Where do I start. They want to build a highway
      section through Medvedji gozd — the Bear Forest. That's the oldest
      forest in the valley. It's where Maja keeps her mountain apiaries.
      It's where the wild Carniolan bees nest.

      The highway would cut straight through. Destroy the forest. Kill
      the bee colonies. Maja had an environmental survey — independent,
      not the one AlpTransit commissioned — proving the damage would be
      irreversible.

      Two weeks after she started fighting them publicly, she's gone.
      You do the maths.
    effects: { trust_joze: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Franc (the forest, witness tease) ---

  franc_intro:
    type: tweet
    from: franc
    text: >
      30 let v tem gozdu. drevesa so drugačna. @maja_horvat je imela
      prav. in zdaj je izginila. naredite povezavo.
    effects: { trust_franc: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Franc -> franc_talk

  franc_talk:
    type: message
    text: >
      FRANC: I've been a forester here for 30 years. I know every tree,
      every path in Medvedji gozd. And I'm telling you — something is
      happening. AlpTransit has been doing "survey work" — cutting
      access roads, drilling test holes. They're preparing construction
      before the permits are approved.

      Maja documented everything. She had photos of the illegal survey
      roads, the drill cores, the disturbed bee colonies. She was
      building a case with that journalist, Tina. And then — izginila.

      You think that's a coincidence? Jaz ne verjamem v naključja v
      gozdu.
    effects: { trust_franc: "+10" }
    choices:
      - Did you see anything unusual recently? -> franc_night
      - Move on -> quest1_hub

  franc_night:
    type: message
    text: >
      FRANC: The night before she vanished — I was checking the deer
      fences on the eastern ridge, around 11pm. I saw lights at Maja's
      apiary shed in Medvedji gozd. Not unusual, she sometimes checks
      the hives at night during swarming season. But there was a company
      SUV parked on the forest road. AlpTransit plates.

      At 11pm. At a bee apiary in the forest.

      I noted it in my forest log. Nobody's asked to see it.
    effects: { trust_franc: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Zala (teen climber, witness tease) ---

  zala_intro:
    type: tweet
    from: zala
    text: >
      jebemti sej @maja_horvat ona me je naučila spoštovat naravo tuki.
      ni možno da je kar šla. če kdo ve kej pls povejte
    effects: { trust_zala: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Zala -> zala_talk_early

  zala_talk_early:
    type: message
    text: >
      ZALA: ej no si nov tuki? u pičku kakšen timing. sej maja je
      najboljša oseba v tej vasi. ona nas je naučila za čebele, za
      gozd, za vse te stare stvari. ful hudo.

      in zdej sm prestrašena ker jan je vidu nek čuden tip zravn
      majinega čebelnjaka ampak noče govort o tem. pravi da ni nč
      ampak ej no... ni nč sej ja
    effects: { trust_zala: "+10" }
    choices:
      - What did Jan see? -> zala_jan_hint
      - Move on -> quest1_hub

  zala_jan_hint:
    type: message
    text: >
      ZALA: ne vem točno. bil je na trail runningu zravn gozda in je
      vidu tistga raziskovalca — nika — zravn majinih panjev. je kar
      tam sedel in pisal nekaj v zvezek. ko ga je jan vidu je fajn
      hitro zbrisu.

      dej nehaj kdo to dela?? zala je prestrašena govort ker je nik
      taki odrasel tip od univerze in kdo bo njej verjel. dej probej
      ti govort z janom ampak bodi kul ja
    effects: { trust_zala: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Triglavski Kot. A Julian Alps village
      built around forest and bees. A beekeeper who was fighting a
      highway project. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Anja (Maja's sister) -> anja_q1
      - Talk to Vida (Maja's best friend) -> vida_q1
      - Check what Boštjan (Maja's father) is saying -> bostjan_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Anja Q1 ---

  anja_q1:
    type: tweet
    from: anja
    text: >
      če kdo ima novice o @maja_horvat prosim pokličite. njena soba je
      nedotaknjena. njena čebelarska oprema je tukaj. nikoli ne bi šla
      brez svoje opreme.
    effects: { trust_anja: "+5", contacts_followed: "+1" }
    choices:
      - DM Anja -> anja_q1_talk

  anja_q1_talk:
    type: message
    text: >
      ANJA: I appreciate you reaching out but I don't know you. Maja
      has many friends here. I'm sure she'll come back.

      ...I keep saying that. Ne verjamem več.

      [Anja is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_anja: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Vida Q1 ---

  vida_q1:
    type: tweet
    from: vida
    text: >
      sobotna tržnica brez @maja_horvat. njena miza prazna. med je še
      na pol v kozarcih. ona nikoli ne pusti dela na pol.
    effects: { trust_vida: "+5", contacts_followed: "+1" }
    choices:
      - DM Vida -> vida_q1_talk

  vida_q1_talk:
    type: message
    text: >
      VIDA: Maja and I have kept bees together for twelve years. I know
      her better than anyone. She would NEVER leave during swarming
      season. Never. That's how I know something happened.

      And she was scared, the last week. She told me someone was
      following her to the apiaries. And she told me AlpTransit sent
      people to threaten her.

      [Vida seems willing to talk more later.]
    effects: { trust_vida: "+10" }
    choices:
      - Who was following her? -> vida_follower
      - Move on -> quest1_hub

  vida_follower:
    type: message
    text: >
      VIDA: That researcher. Nik Bertoncelj. He started as a
      colleague — interested in her bees, asked about queen genetics.
      Fine. But then he kept coming back. Every day. Sitting at her
      apiary taking notes even when she wasn't there. Setting up
      cameras near her hives.

      She told him to coordinate with her. He said he "needed
      uncontaminated data." Kaj za vraga. Uncontaminated? She's the
      beekeeper. They're her bees.

      The last week before she disappeared, she found him inside her
      apiary shed. He said the door was unlocked. It wasn't.
    effects: { trust_vida: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Boštjan Q1 ---

  bostjan_q1:
    type: tweet
    from: bostjan
    text: >
      MOJA HČERKA JE IZGINILA in policija mi pravi da je mogoče šla
      na pohod??? NIKOLI NE GRE BREZ BESEDE. pridem na postajo.
      nekdo mi bo razložil.
    effects: { trust_bostjan: "+5", contacts_followed: "+1" }
    choices:
      - DM Boštjan -> bostjan_q1_talk

  bostjan_q1_talk:
    type: message
    text: >
      BOŠTJAN: Who are you? Another person from this village who's going
      to tell me to calm down? My daughter called me the night before
      she disappeared. She said she had something big. She said "če se
      kaj zgodi, poglej AlpTransit." Then she hung up.

      To je zadnje kar sem slišal od nje.
    effects: { trust_bostjan: "+10" }
    choices:
      - What do you think happened? -> bostjan_theory
      - Move on -> quest1_hub

  bostjan_theory:
    type: message
    text: >
      BOŠTJAN: I think she found proof that AlpTransit is destroying the
      forest illegally and they shut her up. But I also think that
      researcher — Nik — knows more than he's saying. The way he talks
      about her bees... it's not just science. It's something else.

      Maja told me weeks ago that someone was accessing her apiary shed
      at night. She found her hive frames rearranged. She thought it
      was an animal. I don't think it was an animal.
    effects: { trust_bostjan: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Maja went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Jan (was trail running near the forest) -> jan_interview
      - Find Franc (forester, was checking fences late) -> franc_interview
      - Find Lucija (baker, starts at 4am, saw something) -> lucija_interview
      - Find Gašper (mountain guide, was descending at dusk) -> gasper_interview

  # --- Jan (saw Nik at the apiary) ---

  jan_interview:
    type: tweet
    from: jan
    text: >
      dober trening danes ampak atmosfera zravn gozda je čudna.
      nek filing da nekaj ni ok. ne znam razložit
    effects: { trust_jan: "+5" }
    choices:
      - Ask Jan about that evening -> jan_talk

  jan_talk:
    type: message
    text: >
      JAN: ej no ok ampak nikomur ne povej ja. bil sem na trail
      runningu zravn medvedjega gozda okol 7ih zvečer. in sem vidu
      nika — tistga raziskovalca — zravn majinega čebelnjaka. je
      nekaj premetavu po njenem orodju. ko me je vidu je fajn hitro
      zbrisu.

      jebemti sej jaz nism nč reku ker nisem hotu problemov ampak
      zdej je pa hudo. to ni normalno kif int pogleda
    effects:
      trust_jan: "+10"
      night_witnesses: "+1"
      researcher_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Franc (saw late-night meeting at apiary) ---

  franc_interview:
    type: tweet
    from: franc
    text: >
      Opomnik: Medvedji gozd je zaprt ponoči. Opazil sem nedovoljen
      promet na gozdni cesti te zadnje noči.
    effects: { trust_franc: "+5" }
    choices:
      - Ask Franc what he saw -> franc_talk_night

  franc_talk_night:
    type: message
    text: >
      FRANC: I was checking the deer fences on the eastern ridge around
      11pm. I saw Maja's shed light on. And a black company SUV —
      AlpTransit plates — parked on the forest road. Two men were
      standing by the shed entrance. One of them I recognised: Roman
      Kranjc, the AlpTransit project director.

      At 11pm. At a bee apiary in the forest. That's not normal.

      I noted it in my forest log. Nobody's asked to see it.
    effects:
      trust_franc: "+10"
      night_witnesses: "+1"
      highway_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Lucija (saw car at dawn) ---

  lucija_interview:
    type: tweet
    from: lucija
    text: >
      pekarna odprta od 4h kot vedno. ampak tisto jutro je avto šel
      mimo preveč hitro za vaško cesto. ni normalno.
    effects: { trust_lucija: "+5" }
    choices:
      - Ask Lucija what she saw -> lucija_talk

  lucija_talk:
    type: message
    text: >
      LUCIJA: I start baking at 4am every day. That morning I was
      opening the shutters and a car went past — fast, much too fast
