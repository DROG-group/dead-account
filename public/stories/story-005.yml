      avatar: avatars/terra_viva.jpg

    # === Suspicious / Other ===
    alessandro:
      name: "Alessandro Ferro"
      bio: "artista | pittore | gallerie a siena e firenze | l'arte vera si fa in studio"
      avatar: avatars/alessandro.jpg
    alba:
      name: "ombra_sui_muri"
      bio: "."
      avatar: avatars/anon.jpg
    maresciallo:
      name: "Maresciallo De Luca"
      bio: "Stazione Carabinieri di Colleverdi | Emergenze: 112"
      avatar: avatars/maresciallo.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN COLLEVERDI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to colleverdi.social — the community Mastodon instance for
      the Tuscan hill town of Colleverdi.

      The local feed is restless. The walls of the town are covered in
      murals by a local artist. But the artist himself has gone silent.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name keeps coming up:
      @davide_ferraro.

      A young street artist. Muralist. He painted the walls of Colleverdi
      with scenes of the landscape, the people, the vineyards. Everyone
      loved his work. He hasn't posted in six days.
    choices:
      - Look at his profile -> davide_profile

  davide_profile:
    type: tweet
    from: davide
    text: "stanotte ho visto le ruspe dietro la vigna vecchia di Galli. scavano di notte. nessuno ne parla. io ne parlo. con i muri."
    choices:
      - That's his last real post... -> grey_wall

  grey_wall:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a photo of a blank grey wall. No tags, no colours, no art.
      Posted at 4am. No caption.

      His friends say that's the opposite of everything Davide stands
      for. The Carabinieri say he probably went to travel for
      inspiration. Something doesn't add up.
    choices:
      - Read the Carabinieri statement -> carabinieri_statement
      - Look at what people are saying -> community_reaction

  carabinieri_statement:
    type: tweet
    from: maresciallo
    text: >
      È stato ricevuto un esposto relativo a un residente di Colleverdi.
      Al momento non emergono elementi di natura delittuosa. Chiunque
      disponga di informazioni utili è pregato di contattare la Stazione
      al 112 o presentarsi in caserma.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are a mess. His sister @giulia_ferraro is begging
      for information. His best friend @marco_vitali is furious at the
      Carabinieri. His ex @chiara_bianchi is posting worried messages.
      The old winemaker @lorenzo_galli says Davide was right about the
      digging.

      And the journalist @francesca_longo has gone completely quiet.

      Nobody buys the Carabinieri's line. Nobody thinks Davide just
      "went travelling for inspiration."
    effects: { trust_giulia: "+5", trust_marco: "+5" }
    choices:
      - Start following Davide's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Colleverdi. Follow Davide's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Elena (bar owner, knows everyone) -> elena_intro
      - Talk to Lorenzo (winemaker, saw the digging) -> lorenzo_intro
      - Talk to Tommaso (teen skater, looks shaken) -> tommaso_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Davide with the rhythms of a small
      Tuscan hill town: harvest schedules, the bar's aperitivo specials,
      announcements about the sagra della bistecca.

      Key names surface: Giulia (sister, law student in Siena), Marco
      (best friend, musician), Chiara (ex-girlfriend, works at Bar
      Stella), and the teens — Tommaso, Beatrice, Matteo — who
      worshipped Davide's street art.

      Also prominent: AgriToscana SpA, the agribusiness company buying
      up land around the town. Their posts are polished corporate PR.
      Davide's murals were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Elena -> elena_intro
      - Talk to Lorenzo -> lorenzo_intro
      - Talk to Tommaso -> tommaso_intro

  # --- Elena (social map) ---

  elena_intro:
    type: tweet
    from: elena
    text: >
      Il bar è aperto ma non è la stessa cosa senza @davide_ferraro
      che passa a prendere il caffè alle 7. Torna a casa, ragazzo.
    effects: { trust_elena: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Elena -> elena_talk

  elena_talk:
    type: message
    text: >
      ELENA: Ah, sei nuovo? Benvenuto. Brutto momento per arrivare.
      Sono tutti nervosi per Davide.

      Ti spiego come funziona qui. Giulia è la sorella di Davide —
      studia giurisprudenza a Siena, sta impazzendo. Marco Vitali è il
      migliore amico, suonano insieme, tipo inseparabili. Chiara Bianchi
      è l'ex di Davide — lo ha lasciato tre mesi fa ma è ancora
      attaccata a lui. Lavora qui al bar.

      Poi c'è Alessandro Ferro — un pittore, tipo artista serio, gallerie
      e tutto. Lui e Davide non si sopportano. Alessandro dice che la
      street art non è arte vera. Davide gli ha risposto con un murale
      davanti alla sua galleria preferita. Immagina il casino.

      E poi la AgriToscana — quelli stanno comprando tutto il terreno
      intorno a Colleverdi. Davide ha dipinto un murale enorme contro
      di loro. Non gli è piaciuto per niente.
    effects: { trust_elena: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Alessandro -> elena_alessandro
      - Ask about AgriToscana -> elena_agritoscana
      - Thank her and move on -> quest1_hub

  elena_alessandro:
    type: message
    text: >
      ELENA: Alessandro? Madonna, quello è un pezzo di merda, scusa il
      francese. Si crede un genio perché espone a Firenze. Quando Davide
      ha iniziato a farsi un nome con i murales — tipo articoli sui
      giornali, gente che veniva apposta a Colleverdi per vederli — lui
      è diventato verde dall'invidia.

      Ha scritto una lettera al sindaco per far rimuovere i murales.
      Ha detto che "deturpano il centro storico." Minchia, la gente
      viene qui PER quei murales. Ma Alessandro non sopporta che uno
      con le bombolette spray abbia più fama di lui con i pennelli.

      L'ho sentito una volta al bar che diceva: "prima o poi qualcuno
      gli insegnerà a stare al suo posto." Mi ha fatto venire i brividi.
    effects: { trust_elena: "+5" }
    choices:
      - Ask about AgriToscana -> elena_agritoscana
      - Move on -> quest1_hub

  elena_agritoscana:
    type: message
    text: >
      ELENA: Quelli dell'AgriToscana stanno comprando tutto. Vigne,
      oliveti, terreni agricoli. Pagano bene, troppo bene. Metà dei
      vecchi contadini hanno venduto. Ma Lorenzo Galli — il viticoltore
      — non vende. E la sua vigna vecchia è esattamente dove loro
      vogliono espandersi.

      Davide ha scoperto qualcosa. Diceva che di notte le ruspe
      scavavano dietro la vigna di Lorenzo. Che interravano roba.
      Ha dipinto un murale enorme sul muro del vecchio frantoio —
      tipo teschi e barili tossici tra i filari di viti. Bellissimo
      ma inquietante.

      Due settimane dopo, sparito.
    effects: { trust_elena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lorenzo (the land, witness tease) ---

  lorenzo_intro:
    type: tweet
    from: lorenzo
    text: >
      cinquant'anni su questa terra. la conosco come il palmo della
      mia mano. e vi dico che qualcosa non va. @davide_ferraro aveva
      ragione. fate il collegamento.
    effects: { trust_lorenzo: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Lorenzo -> lorenzo_talk

  lorenzo_talk:
    type: message
    text: >
      LORENZO: Io faccio vino da quando avevo quindici anni. Questa
      terra me l'ha lasciata mio nonno. Conosco ogni metro, ogni sasso,
      ogni radice.

      E ti dico una cosa: di notte, dietro la mia vigna vecchia, quelli
      dell'AgriToscana scavano. Ho sentito le ruspe. Ho visto i camion.
      Di notte, quando pensano che nessuno guardi.

      Davide è venuto da me. Voleva capire. Ha fatto foto, disegni,
      appunti. Ha dipinto quel murale incredibile. E poi — puf —
      sparito.

      Tu credi alle coincidenze? Io no. La terra non mente.
    effects: { trust_lorenzo: "+10" }
    choices:
      - Did you see anything unusual recently? -> lorenzo_night
      - Move on -> quest1_hub

  lorenzo_night:
    type: message
    text: >
      LORENZO: La notte prima che sparisse — ero sveglio, non dormivo
      bene, verso l'una. Ho sentito un'auto che risaliva la strada
      sterrata dietro la vigna. Non è una strada dove passa nessuno
      di notte.

      Mi sono affacciato. Due fari nella polvere. Un SUV scuro. Targa
      non ho visto, ma era grosso, tipo aziendale.

      All'una di notte. Sulla strada della mia vigna.

      Non ci ho pensato subito. Adesso ci penso sempre.
    effects: { trust_lorenzo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tommaso (teen skater, witness tease) ---

  tommaso_intro:
    type: tweet
    from: tommaso
    text: >
      fra giuro @davide_ferraro non se ne va così tipo boh non ha
      senso. è lui che ci ha insegnato a disegnare, a vedere i muri
      in modo diverso. se qualcuno sa qualcosa parlate cazzo
    effects: { trust_tommaso: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tommaso -> tommaso_talk_early

  tommaso_talk_early:
    type: message
    text: >
      TOMMASO: oh ma chi sei fra? sei nuovo? vabbè comunque davide
      è tipo il più grande di colleverdi. ci ha insegnato tutto —
      stencil, throw-up, wildstyle, tutto. tipo un fratello maggiore
      per tutti noi.

      e adesso sto in paranoia perché beatrice ha visto una roba
      strana l'altra sera al vecchio frantoio ma non vuole parlarne.
      dice che ha paura. tipo fra è assurdo sta situazione
    effects: { trust_tommaso: "+10" }
    choices:
      - What did Beatrice see? -> tommaso_beatrice_hint
      - Move on -> quest1_hub

  tommaso_beatrice_hint:
    type: message
    text: >
      TOMMASO: boh non so bene. lei era fuori a fare foto tipo per
      un progetto e ha visto qualcuno vicino al murale di davide —
      quello grande, quello dell'AgriToscana. tipo qualcuno che lo
      stava coprendo di vernice bianca. di notte fra. chi cazzo
      va a cancellare un murale di notte?

      e ha detto che ha riconosciuto la persona ma non vuole dire
      chi. è spaventata. tipo forse devi prima guadagnarti la sua
      fiducia, parlale di arte o roba così
    effects: { trust_tommaso: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Colleverdi. A Tuscan hill town built
      around olive groves and vineyards. A street artist who was
      exposing something. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Giulia (Davide's sister) -> giulia_q1
      - Talk to Marco (Davide's best friend) -> marco_q1
      - Check what Chiara (Davide's ex) is saying -> chiara_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Giulia Q1 ---

  giulia_q1:
    type: tweet
    from: giulia
    text: >
      mio fratello è SPARITO e i carabinieri mi dicono che forse è
      andato a farsi un viaggio??? MA DAVIDE NON PARTE SENZA DIRMI
      NIENTE. arrivo da siena. qualcuno mi spiegherà.
    effects: { trust_giulia: "+5", contacts_followed: "+1" }
    choices:
      - DM Giulia -> giulia_q1_talk

  giulia_q1_talk:
    type: message
    text: >
      GIULIA: Chi sei? Un altro che vuole gossip su mio fratello?
      Davide mi ha chiamato la sera prima di sparire. Era agitato.
      Ha detto che aveva trovato qualcosa di grosso dietro la vigna
      di Lorenzo. Ha detto "se mi succede qualcosa, guarda
      l'AgriToscana." Poi ha riattaccato.

      È l'ultima volta che ho sentito la sua voce.
    effects: { trust_giulia: "+10" }
    choices:
      - What do you think happened? -> giulia_theory
      - Move on -> quest1_hub

  giulia_theory:
    type: message
    text: >
      GIULIA: Io penso che Davide ha scoperto che l'AgriToscana
      interra rifiuti nei terreni che compra e loro l'hanno zittito.
      Ma c'è anche quella storia con Alessandro Ferro — il pittore.
      Quello non ha mai accettato il successo di Davide. Lo odia.

      E poi... Davide mi ha detto che qualcuno gli mandava messaggi
      strani. Tipo qualcuno che lo seguiva, che fotografava i suoi
      murales ogni giorno, che lo aspettava fuori dal bar. Pensava
      fosse un fan ossessivo ma non sapeva chi.

      Porco dio, avrei dovuto insistere per saperne di più.
    effects: { trust_giulia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marco Q1 ---

  marco_q1:
    type: tweet
    from: marco
    text: >
      davide non risponde. non risponde al telefono, ai messaggi, a
      niente. fra noi ci sentiamo OGNI GIORNO da quando avevamo 10
      anni. è successo qualcosa. ne sono sicuro.
    effects: { trust_marco: "+5", contacts_followed: "+1" }
    choices:
      - DM Marco -> marco_q1_talk

  marco_q1_talk:
    type: message
    text: >
      MARCO: Davide e io ci conosciamo da sempre. Suoniamo insieme,
      lui dipinge io suono la chitarra, tipo in piazza. E ti giuro
      fra — lui non sparisce così. Mai. Neanche quando stava di
      merda per la storia con Chiara.

      L'ultima sera l'ho visto in piazza. Era nervoso. Aveva lo zaino
      con le bombolette e la macchina fotografica. Ha detto che doveva
      andare a documentare una cosa "grossa" dietro la vigna vecchia.
      Ho detto "vengo con te" e lui ha detto no, troppo pericoloso.

      Cazzo, avrei dovuto seguirlo lo stesso.

      [Marco sembra sincero. Distrutto.]
    effects: { trust_marco: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Chiara Q1 ---

  chiara_q1:
    type: tweet
    from: chiara
    text: >
      lo so che ci siamo lasciati. lo so che non dovrebbe importarmi
      così tanto. ma @davide_ferraro merita che qualcuno lo cerchi.
      è una brava persona cazzo.
    effects: { trust_chiara: "+5", contacts_followed: "+1" }
    choices:
      - DM Chiara -> chiara_q1_talk

  chiara_q1_talk:
    type: message
    text: >
      CHIARA: Io e Davide ci siamo lasciati tre mesi fa. Motivi
      miei. Ma gli voglio ancora bene. E sto impazzendo.

      La cosa strana è che dopo che ci siamo lasciati, qualcuno
      ha iniziato a mandarmi messaggi anonimi. Tipo "sei libera adesso"
      e "lui non ti meritava." Roba che mi ha fatto accapponare la
      pelle. Ho pensato fosse uno scherzo ma...

      E poi Davide mi ha detto che anche lui riceveva messaggi
      strani. Qualcuno che gli mandava foto dei suoi murales con
      commenti tipo "il prossimo capolavoro sarà il mio." Boh. Che
      cazzo vuol dire?

      [Chiara è scossa. Qualcosa la preoccupa oltre la scomparsa.]
    effects: { trust_chiara: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Davide went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Beatrice (was near the old frantoio at night) -> beatrice_interview
      - Find Filippo (hardware store, stays late in the shop) -> filippo_interview
      - Find Rosa (herbalist, walks home late through the vicoli) -> rosa_interview
      - Find Lorenzo (winemaker, heard the car again) -> lorenzo_interview_q2

  # --- Beatrice (saw someone painting over the mural) ---

  beatrice_interview:
    type: tweet
    from: beatrice
    text: >
      tipo non sto bene. non dormo. ho visto una cosa che non dovevo
      vedere e adesso ho paura. boh non so che fare
    effects: { trust_beatrice: "+5" }
    choices:
      - Ask Beatrice about that evening -> beatrice_talk

  beatrice_talk:
    type: message
    text: >
      BEATRICE: ok ma giurami che non lo dici a nessuno fra. ero fuori
      al vecchio frantoio tipo verso le 22 a fare foto per un progetto.
      e ho visto uno che stava coprendo il murale grande di davide.
      quello con i teschi e i barili. tipo con vernice bianca e un
      rullo.

      e fra l'ho riconosciuto. era alessandro ferro. il pittore. quello
      con le gallerie. stava cancellando il murale di davide nel buio
      tipo con una torcia sul telefono. e rideva. rideva da solo.

      minchia mi ha fatto troppo paura. me ne sono andata subito.
    effects:
      trust_beatrice: "+10"
      night_witnesses: "+1"
      rival_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Filippo (saw argument) ---

