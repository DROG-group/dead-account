    # === Journalist ===
    francesca:
      name: "Francesca Longo"
      bio: "giornalista freelance | ambiente & territorio | tips: francesca@longo-stampa.it"
      avatar: avatars/francesca.jpg

    # === AgriToscana (corporate) ===
    agritoscana:
      name: "AgriToscana SpA"
      bio: "Agroalimentare | Viticoltura & olivicoltura | Sede: Colleverdi | ISO 22000"
      avatar: avatars/agritoscana.jpg
    dario:
      name: "Dario Santini"
