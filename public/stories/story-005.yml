      The Comune di Colleverdi's public land registry shows
      AgriToscana has purchased 47 hectares around the town in
      the past three years. All recorded as "agricultural conversion."
      But satellite images from before their purchase show these
      plots were healthy olive groves and vineyards.

      AgriToscana's environmental impact assessment — filed with the
      Regione — lists only "organic viticulture and olive cultivation."
      No mention of excavation. No mention of waste disposal. No
      mention of heavy machinery.

      The machinery Lorenzo heard at 2am doesn't match organic farming.
