      I went to the window. Lights behind the vineyard. Headlights,
      work lights. And then I heard shouting. Men's voices. And
      something else — a younger voice. Scared.

      Then everything stopped. Engines off. Lights off. Silence.

      In the morning, fresh tyre tracks all over the dirt road.
      And the soil behind my vineyard — disturbed. Freshly turned.
      Like they'd buried something in a hurry.
