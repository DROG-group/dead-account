      bio: "sorella di davide | studentessa di legge a siena | non smetterò di cercarlo"
      avatar: avatars/giulia.jpg
    marco:
      name: "Marco Vitali"
      bio: "migliore amico di davide | musicista | piazza san rocco ogni sera"
      avatar: avatars/marco.jpg
    chiara:
      name: "Chiara Bianchi"
      bio: "ex di davide | lavoro al bar stella | colleverdi nel cuore"
      avatar: avatars/chiara.jpg

    # === Local Government ===
    giuseppe:
      name: "Giuseppe Marchetti"
      bio: "Sindaco di Colleverdi | al servizio del territorio dal 2018 | #ColleverdiFiorisce"
      avatar: avatars/giuseppe.jpg
    paola:
      name: "Paola Rinaldi"
      bio: "Assessore alla cultura | Comune di Colleverdi | arte e tradizione"
      avatar: avatars/paola.jpg
    comune:
