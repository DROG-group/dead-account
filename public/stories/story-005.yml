      avatar: avatars/elena.jpg
    bar_stella:
      name: "Bar Stella"
      bio: "Caffè artigianale | Aperitivi | Musica dal vivo il venerdì | Piazza San Rocco"
      avatar: avatars/bar_stella.jpg
    lorenzo:
      name: "Lorenzo Galli"
      bio: "viticoltore | Tenuta Galli | sangiovese | la terra non tradisce"
      avatar: avatars/lorenzo.jpg
    rosa:
      name: "Rosa Martini"
      bio: "erboristeria La Salvia | piante officinali | colleverdi"
      avatar: avatars/rosa.jpg
    filippo:
      name: "Filippo Barbieri"
      bio: "ferramenta Barbieri | tutto per la casa | dal 1965 | piazza del mercato"
      avatar: avatars/filippo.jpg
