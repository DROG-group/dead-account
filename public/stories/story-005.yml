      - Confront Dario Santini (the AgriToscana director) -> confront_dario
        when:
          state: land_evidence
          gte: 3
      - Confront Mayor Marchetti (political protection) -> confront_giuseppe
      - I need more evidence -> investigation_hub

  # --- ENDING A: Alessandro (Best Ending) ---

  confront_alessandro:
    type: message
    text: >
      You present your evidence to Alessandro:

      "I know @ombra_sui_muri is your account. I know you destroyed
      Davide's mural the night he disappeared. I know you threatened
      a teenager who saw you. I know you sent threatening messages to
      Davide and his ex-girlfriend. I have witnesses and I have the
      account analysis."
    choices:
      - Send -> alessandro_response

  alessandro_response:
    type: message
    text: >
      Alessandro doesn't reply for hours. Then:

      ALESSANDRO: You don't understand anything about art. That boy
      was destroying the aesthetic soul of this town. His garish
      paint on these ancient walls — it was an insult to every real
      artist. I was protecting Colleverdi's heritage. Everything I
      did was for art.

      That's not art. That's obsession and jealousy twisted into
      something dangerous.

      You've already sent the evidence to Maresciallo De Luca.
      And to Francesca Longo.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Maresciallo De Luca reopens the case. With your evidence — the
      anonymous account, the mural destruction, the witness
      testimonies, the threatening messages — Alessandro Ferro is
      arrested for stalking, threatening behaviour, and destruction
      of property. In his studio, the Carabinieri find hundreds of
      photographs of Davide — working, walking, painting. A wall
      covered in printouts of Davide's social media posts with
      obsessive annotations. A journal detailing Davide's daily
      movements for months.

      Francesca Longo, finally in possession of Davide's full
      photographic evidence and Lorenzo's soil samples, publishes
      the AgriToscana story in La Repubblica. The Procura di Siena
      orders an immediate investigation. The contaminated sites
      are sealed. Dario Santini faces criminal charges for illegal
      waste disposal and environmental contamination.

      And Davide Ferraro, reading the story from a friend's apartment
      in Firenze, calls his sister for the first time in nine days.

      "Giulia, torno a casa."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: davide
    text: >
      i muri non si zittiscono. la terra non mente. e colleverdi
      non dimentica. grazie a chi non ha mollato.
    choices:
      - The End -> game_complete

  # --- ENDING B: Dario (Partial Ending) ---

  confront_dario:
    type: message
    text: >
      You present the contamination evidence to Dario Santini:

      "I have photographs of the illegal excavation and burial of
      industrial waste. I have soil samples showing contamination
      levels twenty times the legal limit. I have the land purchase
      records and the fraudulent environmental assessments. I have
      witness testimony of nighttime dumping operations."
    choices:
      - Send -> dario_response

  dario_response:
    type: message
    text: >
      DARIO: Questa conversazione verrà inoltrata al nostro ufficio
      legale. Qualsiasi diffusione di materiale diffamatorio sarà
      oggetto di azioni legali immediate. AgriToscana ha sempre
      operato nel rispetto delle normative vigenti.

      But it's too late. You've sent the evidence to Francesca, to
      Terra Viva, and to the Procura di Siena.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The contamination story breaks. AgriToscana's operations are
      suspended pending investigation. The remediation will take
      years. Dozens of jobs lost. The town is divided between those
      who sold their land and those who didn't.

      But Davide?

      Without the stalking evidence, Alessandro is never investigated.
      He continues to paint in his studio. He creates a new anonymous
      account. He starts watching the next young artist who gets too
      much attention.

      Three months later, Davide reads about AgriToscana online.
      He returns quietly. He paints a new mural. The next morning,
      it's covered in white paint.

      He stops painting outside. He moves to Firenze. The walls of
      Colleverdi slowly fade.

      The corporation is exposed. But the person who terrorised
      Davide walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: davide
    text: "sono tornato. la terra si pulirà. i muri... vediamo."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_giuseppe:
    type: message
    text: >
      You confront Mayor Marchetti with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> giuseppe_response

  giuseppe_response:
    type: tweet
    from: simone
    text: >
      Il mio cliente prende atto delle Vostre allegazioni. Qualsiasi
      diffusione pubblica di affermazioni diffamatorie sarà oggetto
      di immediato procedimento giudiziario. — Studio Pellegrini &
      Rossi, Firenze
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Marchetti and AgriToscana's dumping — and there
      isn't one beyond political facilitation — your evidence is
      insufficient.

      AgriToscana continues to operate. Alessandro continues to
      watch. Davide stays in hiding.

      Six months later, a new mural appears on a wall in Colleverdi.
      Anonymous, unsigned. It shows a young man with a backpack
      walking away from a town on a hill, looking back.

      By morning, it's painted white.
    choices:
      - The End -> game_complete

