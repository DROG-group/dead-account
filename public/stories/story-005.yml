  filippo_talk:
    type: message
    text: >
      FILIPPO: I close the shop late on Thursdays — inventory night.
      Around 23:00 I heard shouting in the piazza. I looked out the
      window. Two men. One was definitely Davide — I recognised his
      jacket, the one covered in paint stains.

      The other man was taller, dressed well. They were arguing. The
      tall one grabbed Davide by the collar and said something I
      couldn't quite hear, but it ended with "...mai più un murale
      in questa città." Never paint another mural in this town.

      Then a car pulled up — a big SUV, dark — and the tall man got
      in. Davide stood there for a moment, then walked off toward
      the old olive road. That's the direction of the vineyards.

      I told the Carabinieri. They wrote it down. That was it.
    effects:
      trust_filippo: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
