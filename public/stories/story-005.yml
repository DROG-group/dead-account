      road and the vineyards.

      He was moving fast, like he was determined. Not running from
      something — running toward something. But urgently.

      I called out "tutto bene?" and he turned for a second. It
      was Davide. He waved without stopping and disappeared through
      the gate.

      That was the last anyone saw of him. Going toward the
      vineyards. Alone. At midnight.
