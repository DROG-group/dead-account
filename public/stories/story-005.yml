# DEAD ACCOUNT — Story 005: Colleverdi (Italy)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-005.yml
#
# Player investigates the disappearance of young street artist Davide Ferraro
# in the fictional Tuscan hill town of Colleverdi.

meta:
  title: "Dead Account — Colleverdi"
  state:
    # Trust levels per NPC (0-100)
    trust_giulia: 0
    trust_marco: 0
    trust_chiara: 0
    trust_alessandro: 0
    trust_elena: 0
    trust_tommaso: 0
    trust_beatrice: 0
    trust_lorenzo: 0
    trust_rosa: 0
    trust_filippo: 0
    trust_valentina: 0
    trust_matteo: 0
    trust_paola: 0
    trust_giuseppe: 0
    trust_francesca: 0
    trust_dario: 0
    trust_simone: 0
    trust_alba: 0
    trust_maresciallo: 0
    trust_anon: 0
    # Progress counters
    contacts_followed: 0
    night_witnesses: 0
    land_evidence: 0
    rival_evidence: 0
    evidence_total: 0

  player:
