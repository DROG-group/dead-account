  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The sindku's lawyer buries your accusation. Without a direct link
      between Vella and GozoGold's threats — and there isn't one beyond
      political protection — your evidence is insufficient.

      GozoGold continues to build. Jake continues to watch. Maria stays
      in hiding.

      Six months later, @daniela_spiteri creates a new account. It
      follows Maria's sister.
    choices:
      - The End -> game_complete

