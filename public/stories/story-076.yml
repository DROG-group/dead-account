      You present the development evidence to Frankie Schembri:

      "I have the original heritage documents. I have the falsified
      planning boundaries. I have a recording of you saying Maria would
      'disappear.' I have the original land surveys showing you redrew
      the heritage buffer zone."
    choices:
      - Send -> frankie_response

  frankie_response:
    type: message
    text: >
      FRANKIE: This conversation is being forwarded to our legal team.
      Any publication of defamatory material will result in immediate
      proceedings. GozoGold has always operated within planning
      regulations.

      But it's too late. You've sent the evidence to Sandro, to Wirt
      Għawdex, and to the Superintendence.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE DEVELOPMENT

      The heritage story breaks. GozoGold is ordered to halt all
      construction pending review. The marina project may be cancelled.
      Eighty jobs hang in the balance. The village is divided.

      But Maria?

      Without the stalking evidence, Jake is never investigated. He
      continues to photograph. He continues to visit the village. He
      creates a new anonymous account. He starts writing about "the
      lace maker who fought back."

      Three months later, Maria reads about GozoGold online. She returns
      quietly. She moves her workshop. She installs new locks. She
      checks the windows every night before working.

      The developer is exposed. But the person who terrorised Maria
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: maria
    text: "ġejt lura. triq il-bizzilla salva. il-bqija... naraw."
    choices:
      - The End -> game_complete

