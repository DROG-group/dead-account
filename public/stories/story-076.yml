entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN XLENDI GARDENS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to XlendiGardens.social — the community Mastodon instance for
      the village of Xlendi Gardens, Gozo.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @maria_borg.

      A bizzilla lace maker. Heritage keeper. She documented the old craft
      traditions of the village. People are worried. She hasn't posted
      in six days.
    choices:
      - Look at her profile -> maria_profile

  maria_profile:
    type: tweet
    from: maria
    text: "They want to tear down Triq il-Bizzilla for a marina car park. Over my dead body. I have the heritage protection documents."
    choices:
      - That's her last real post... -> grey_lace

  grey_lace:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a close-up of tangled lace threads. Blurred, harsh flash, posted
      at 2am. No caption.

      Her friends say that's not her style. Maria photographed her lace
      in natural light, always with a story. The police say she probably
      went to visit relatives in Australia. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: ispettur
    text: >
      Irċivejna rapport dwar residenta ta' Xlendi Gardens. F'dan
      l-istadju, m'hemm l-ebda element li jissuġġerixxi att kriminali.
      Kull informazzjoni utli tista' tiġi kkomunikata lill-għassa jew
      fuq 112.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her sister @carmen_borg is begging for
      information. Her father @pawlu_borg is pacing the harbour. Her best
      friend @rita_camilleri says Maria would never leave without her
      lace frame.

      The fisherman @wenzu_farrugia says something is wrong with the
      village since GozoGold started buying property. And the journalist
      @sandro_cassar has gone very quiet.

      There's also a foreign photographer — @jake_thornton — who's been
      on the instance for months. He seemed to photograph Maria a lot.

      Nobody buys the police line. Nobody thinks Maria just "went to
      Australia."
    effects: { trust_carmen: "+5", trust_pawlu: "+5" }
    choices:
      - Start following Maria's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Xlendi Gardens. Follow Maria's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Leli (bar owner, knows everyone) -> leli_intro
      - Talk to Wenzu (fisherman, worried about the village) -> wenzu_intro
      - Talk to Kurt (teen diver, seems upset) -> kurt_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Maria with the rhythms of a small Gozo
      village: festa preparations, pastizzi reviews, weather warnings for
      the channel crossing.

      Key names surface: Carmen (sister, teacher), Rita (best friend,
      fellow lace maker), Sandro (journalist, oddly silent), and the
      teens — Kurt, Charlene, Ruben — who admired Maria's craft work.

      Also prominent: GozoGold Developments Ltd, the company building a
      luxury marina project. Their posts are glossy renders. Maria's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Leli -> leli_intro
      - Talk to Wenzu -> wenzu_intro
      - Talk to Kurt -> kurt_intro

  # --- Leli (social map) ---

  leli_intro:
    type: tweet
    from: leli
    text: >
      Il-bar miftuħ imma l-qalb mhux hemm. @maria_borg, il-mejda
      tiegħek qed tistenna. Ejja lura.
    effects: { trust_leli: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Leli -> leli_talk

  leli_talk:
    type: message
    text: >
      LELI: Ah, you're new? Merħba. Bad timing to arrive, ħabib.
      Everyone's on edge about Maria.

      Let me tell you who's who. Carmen is Maria's younger sister — she
      teaches at the primary school. Sweet girl, terrified right now.
      Pawlu is their father, retired fisherman, tough man but he's
      breaking. Rita Camilleri is Maria's best friend, they do the
      craft market together every Sunday.

      And there's this photographer — Jake Thornton. English. Been here
      six months writing some travel book. He's always around Maria.
      Always taking photos of her working the lace. She told me once
      it was getting qisek. Uncomfortable. He doesn't take hints.

      Oh, and stay away from GozoGold's PR posts. Gideb wrapped in
      fancy renders.
    effects: { trust_leli: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Jake -> leli_jake
      - Ask about GozoGold -> leli_gozogold
      - Thank him and move on -> quest1_hub

  leli_jake:
    type: message
    text: >
      LELI: Jake? He showed up maybe six months ago. Said he was writing
      a book about Mediterranean crafts. He zeroed in on Maria straight
      away. At first she was flattered — mela, someone interested in
      bizzilla, finally. But then it got weird.

      He'd be at the craft market every Sunday. He'd sit in my bar
      waiting for her. He'd walk past her workshop three, four times a
      day. She told him to give her space. He said he was just "being
      thorough with research."

      Xi ħmerija. That's not research. That's something else.
    effects: { trust_leli: "+5" }
    choices:
      - Ask about GozoGold -> leli_gozogold
      - Move on -> quest1_hub

  leli_gozogold:
    type: message
    text: >
      LELI: GozoGold. Mela, where do I start. They bought half of
      Triq il-Bizzilla — that's the old lace-makers' street, the heart
      of the village. They want to demolish the workshops and build a
      marina car park and luxury apartments.

      Maria was the last holdout. She owns her workshop. She has heritage
      protection documents going back to the British period. Without her
      signature, GozoGold can't complete the project.

      Two weeks after she started fighting them publicly, she's gone.
      You do the maths, ħabib.
    effects: { trust_leli: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Wenzu (the village, witness tease) ---

  wenzu_intro:
    type: tweet
    from: wenzu
    text: >
      35 sena sajjied hawn. ir-raħal qed jinbidel. @maria_borg kellha
      raġun. u issa sparixxiet. agħmlu l-konnessjoni.
    effects: { trust_wenzu: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Wenzu -> wenzu_talk

  wenzu_talk:
    type: message
    text: >
      WENZU: I've been fishing these waters since I was a boy. I know
      every rock, every current around Xlendi. And I'm telling you —
      this village is being eaten alive. GozoGold bought the old
      boathouse, the chandlery, three houses on Triq il-Bizzilla. They
      want to turn us into a parking lot for yachts.

      Maria was the only one fighting them properly. She had documents —
      heritage listings, old permits, legal protections. She was building
      a case with that journalist, Sandro. And then — spariet.

      You think that's a coincidence? Ma nemminx f'koinċidenzi fuq
      il-baħar.
    effects: { trust_wenzu: "+10" }
    choices:
      - Did you see anything unusual recently? -> wenzu_night
      - Move on -> quest1_hub

  wenzu_night:
    type: message
    text: >
      WENZU: The night before she vanished — I was coming back from
      night fishing, around midnight. I saw lights in Maria's workshop
      on Triq il-Bizzilla. Not unusual, she works late. But there was
      a rental car parked outside. White Hyundai, tourist plates.

      And there was a man sitting in it. Just sitting there in the
      dark, watching the workshop windows.

      I didn't think much of it then. Now I think about it constantly.
    effects: { trust_wenzu: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kurt (teen diver, witness tease) ---

  kurt_intro:
    type: tweet
    from: kurt
    text: >
      fuck sake mela @maria_borg hi li għallmitni napprezza l-heritage
      ta' hawn. mhux possibli li telqet hekk. jekk xi ħadd jaf xi ħaġa
      pls għidu
    effects: { trust_kurt: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kurt -> kurt_talk_early

  kurt_talk_early:
    type: message
    text: >
      KURT: mela int ġdid hawn? qisek timing. fil-verità maria hija
      l-aqwa persuna f'dan ir-raħal. hi għallmitna l-istorja tal-post,
      il-bizzilla, l-affarijiet antiki. wisq cool.

      u issa jien imbeżża' għax charlene rat xi ħaġa stramba l-oħra
      fil-għaxija ħdejn il-workshop imma ma tridx titkellem. tgħid li
      mhu xejn imma mela... mhux xejn sah
    effects: { trust_kurt: "+10" }
    choices:
      - What did Charlene see? -> kurt_charlene_hint
      - Move on -> quest1_hub

  kurt_charlene_hint:
    type: message
    text: >
      KURT: ma nafx eżatt. kienet qed tieħu ritratti fil-pjazza u rat
      dak il-photographer barrani — jake — qed jipprova jidħol fil-workshop
      ta' maria. jipprova l-bieb. meta raw li xi ħadd qed jarah, telaq
      malajr.

      mela min jagħmel hekk?? charlene tibża' titkellem għax jake dejjem
      iħares lejha meta tieħu ritratti u tħossha skomda. ipprova
      tkellimha int imma kun ġentili ħi
    effects: { trust_kurt: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Xlendi Gardens. A Gozo village built
      around limestone and lace. A heritage keeper who was fighting
      overdevelopment. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Carmen (Maria's sister) -> carmen_q1
      - Talk to Rita (Maria's best friend) -> rita_q1
      - Check what Pawlu (Maria's father) is saying -> pawlu_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Carmen Q1 ---

  carmen_q1:
    type: tweet
    from: carmen
    text: >
      jekk xi ħadd għandu aħbarijiet ta' @maria_borg ċemplu pls. il-kamra
      tagħha intatta. il-frame tal-bizzilla hemm. qatt ma kienet titlaq
      mingħajr il-frame tagħha.
    effects: { trust_carmen: "+5", contacts_followed: "+1" }
    choices:
      - DM Carmen -> carmen_q1_talk

  carmen_q1_talk:
    type: message
    text: >
      CARMEN: I appreciate you reaching out but I don't know you. Maria
      has a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. Ma nemminx aktar.

      [Carmen is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_carmen: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Rita Q1 ---

  rita_q1:
    type: tweet
    from: rita
    text: >
      il-craft market tal-ħadd mingħajr @maria_borg. il-mejda tagħha
      vojta. il-bizzilla tagħha nofsinhar lesta fuq il-frame. hi qatt
      ma tħalli xogħol nofsu lest.
    effects: { trust_rita: "+5", contacts_followed: "+1" }
    choices:
      - DM Rita -> rita_q1_talk

  rita_q1_talk:
    type: message
    text: >
      RITA: Maria u jien ilna naħdmu flimkien għaxar snin. I know her
      better than anyone. She would NEVER leave her lace unfinished.
      Never. That's how I know something happened.

      And she was scared, the last week. She told me someone was
      following her. And she told me GozoGold sent people to threaten
      her about the workshop.

      [Rita seems willing to talk more later.]
    effects: { trust_rita: "+10" }
    choices:
      - Who was following her? -> rita_follower
      - Move on -> quest1_hub

  rita_follower:
    type: message
    text: >
      RITA: That English photographer. Jake. He started as a customer —
      bought some lace, asked about techniques. Fine. But then he kept
      coming back. Every day. Taking photos of her without asking. Waiting
      outside the workshop.

      She told him to stop. He said she was "his muse" or some xi ħmerija
      like that. Muse? She's a lace maker, not a painting.

      The last week before she disappeared, she found him inside her
      workshop. He said the door was open. It wasn't.
    effects: { trust_rita: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Pawlu Q1 ---

  pawlu_q1:
    type: tweet
    from: pawlu
    text: >
      BINTI SPARIET u l-pulizija jgħiduli li forsi marret l-Awstralja???
      QATT MA TMUR MINGĦAJR MA TGĦID. qed niġi l-għassa. xi ħadd se
      jispjegali.
    effects: { trust_pawlu: "+5", contacts_followed: "+1" }
    choices:
      - DM Pawlu -> pawlu_q1_talk

  pawlu_q1_talk:
    type: message
    text: >
      PAWLU: Min int? Ieħor li se jgħidli nikkalma? Binti ċemplitni
      l-lejla ta' qabel ma spariet. Qalet li kellha xi ħaġa kbira.
      Qalet "jekk jiġri xi ħaġa, ħares lejn GozoGold." Imbagħad
      għalqet.

      Dik l-aħħar kelma li smajt mingħandha.
    effects: { trust_pawlu: "+10" }
    choices:
      - What do you think happened? -> pawlu_theory
      - Move on -> quest1_hub

  pawlu_theory:
    type: message
    text: >
      PAWLU: I think GozoGold wants her workshop and she said no. So
      they shut her up. But I also think that barrani — that foreigner,
      Jake — he knows something. The way he looks at her... it's not
      professional. It's something else.

      Maria told me weeks ago that someone was watching her workshop at
      night. She thought it was nothing. I don't think it was nothing.
    effects: { trust_pawlu: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Maria went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Charlene (was photographing in the square) -> charlene_interview
      - Find Wenzu (fisherman, was at the harbour late) -> wenzu_interview
      - Find Josette (baker, starts at 5am, saw something) -> josette_interview
      - Find Noel (stonemason, was working late nearby) -> noel_interview

  # --- Charlene (saw Jake at the workshop) ---

  charlene_interview:
    type: tweet
    from: charlene
    text: >
      kienet lejla sabiħa għar-ritratti imma l-atmosfera fil-pjazza
      kienet stramba. qisek xi ħaġa fl-arja. ma nafx kif nispjega
    effects: { trust_charlene: "+5" }
    choices:
      - Ask Charlene about that evening -> charlene_talk

  charlene_talk:
    type: message
    text: >
      CHARLENE: mela ok imma ma tgħid lil ħadd sah. kont fil-pjazza
      ħdejn is-7pm nieħu ritratti. u rajt lil jake — dak il-photographer
      ingliż — ħdejn il-workshop ta' maria. kien qed jipprova jiftaħ
      il-bieb. meta rani telaq malajr wisq.

      fuck sake mela jien xi ħmerija ma għidtx xejn qabel imma issa
      qed nibża'. dak ir-raġel mhux normali kif int tħares lejh
    effects:
      trust_charlene: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Wenzu (saw late-night meeting at workshop) ---

  wenzu_interview:
    type: tweet
    from: wenzu
    text: >
      Tfakkira: il-port magħluq bejn l-10pm u s-6am. Rajt moviment
      mhux normali dawn l-aħħar iljieli fuq Triq il-Bizzilla.
    effects: { trust_wenzu: "+5" }
    choices:
      - Ask Wenzu what he saw -> wenzu_talk_night

  wenzu_talk_night:
    type: message
    text: >
      WENZU: I was tying up the boat around 10:30pm. I saw Maria's
      workshop light still on. And a black BMW — GozoGold company plates
      — parked at the end of Triq il-Bizzilla. Two men were standing by
      the workshop door. One of them I recognised: Frankie Schembri,
      the GozoGold boss himself.

      At 10:30pm. At a lace workshop. That's not normal.

      I noted it in my fishing log. Nobody's asked to see it.
    effects:
      trust_wenzu: "+10"
      night_witnesses: "+1"
