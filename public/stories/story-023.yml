    text: >
      MIRCEA: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will
      result in immediate proceedings. CarpatLemn SRL has always
      operated within its cutting permits.

      But it's too late. You've sent the evidence to Nicoleta, to
      the Asociația Pădurea Bătrână, and to the regional forestry
      authority.
    choices:
