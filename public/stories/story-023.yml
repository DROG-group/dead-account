  # --- ENDING B: Mircea (Partial Ending) ---

  confront_mircea:
    type: message
    text: >
      You present the logging evidence to Mircea Ionescu:

      "I have photographs showing clear-cutting inside a virgin
      forest reserve. I have satellite images proving the cut area
      is more than double the permit. I have your original boundary
      plans showing the data was falsified. I have photos of
      500-year-old stumps inside the protected area."
