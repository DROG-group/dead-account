  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The logging story breaks. CarpatLemn is ordered to halt all
      cutting in the Sălașul de Sus area pending investigation. The
      company may lose its PEFC certification. Sixty jobs hang in
      the balance. The village is divided.

      But Andrei?

      Without the stalking evidence, Bogdan is never investigated.
      He returns to București but continues to monitor Andrei's
      accounts. He creates a new anonymous profile.

      Three months later, Andrei reads about CarpatLemn online. He
      returns quietly. He changes the lock on his workshop. He stops
      working with windows open. He checks his car every morning.

      The corporation is exposed. But the person who terrorised
      Andrei walks free.
    choices:
