entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SĂLAȘUL DE SUS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to SalasulDeSus.social — the community Mastodon instance
      for the village of Sălașul de Sus, Maramureș.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @andrei_mihailescu.

      A woodcarver. A craftsman who made Maramureș gates. He documented
      the old forests and the traditional woodworking. People are
      worried. He hasn't posted in seven days.
    choices:
      - Look at his profile -> andrei_profile

  andrei_profile:
    type: tweet
    from: andrei
    text: "Tăieri ilegale în pădurea seculară de la Vârful Pietros. Stejar de 500 de ani, tăiat. Am dovezi."
    choices:
      - That's his last real post... -> grey_forest

  grey_forest:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      grey fog over bare trees. Blurred, overexposed, shot from a
      strange angle. Posted at 3am. No caption.

      His friends say that's not his style. The police say he probably
      went to visit family. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: comisar
    text: >
      Am primit o sesizare privind un locuitor din Sălașul de Sus.
      În acest stadiu, niciun element nu indică o faptă penală.
      Orice informație utilă poate fi comunicată la 112 sau la
      postul de poliție.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His best friend @ioana_petrescu is
      desperate. His brother @dragos_mihailescu is driving up from
      Cluj. The old forester @vasile_pop says Andrei was right about
      the logging. His art collector client @bogdan_cristescu is
      posting frantic messages.

      And the journalist @nicoleta_ardelean is strangely silent.

      Nobody buys the police line. Nobody thinks Andrei just "went
      visiting."
    effects: { trust_ioana: "+5", trust_dragos: "+5" }
    choices:
      - Start following Andrei's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Sălașul de Sus. Follow Andrei's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Maria (inn owner, knows everyone) -> maria_intro
      - Talk to Vasile (forester, saw the clear-cuts) -> vasile_intro
      - Talk to Ana (teen photographer, seems shaken) -> ana_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Andrei with the rhythms of a small
      Maramureș village: market days, the inn's daily specials,
      weather warnings for the mountain passes.

      Key names surface: Ioana (best friend, teacher), Bogdan
      (art collector from București, seems rattled), Nicoleta
      (journalist, oddly quiet), and the teens — Ana, Radu,
      Cristina — who worshipped Andrei's woodcarving.

      Also prominent: CarpatLemn SRL, the logging company cutting
      on the mountainside above the village. Their posts are corporate
      PR. Andrei's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Maria -> maria_intro
      - Talk to Vasile -> vasile_intro
      - Talk to Ana -> ana_intro

  # --- Maria (social map) ---

  maria_intro:
    type: tweet
    from: maria
    text: >
      Hanul e deschis da' nu mai e aceeași voie bună. @andrei_mihailescu,
      masa ta te așteaptă. Vino înapoi.
    effects: { trust_maria: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Maria -> maria_talk

  maria_talk:
    type: message
    text: >
      MARIA: You're new? Welcome. Terrible time to arrive. Everyone's
      on edge about Andrei.

      Let me tell you who's who. Ioana is Andrei's best friend — they
      grew up together, her family's house is next to his workshop.
      Lovely woman, devastated right now. Bogdan Cristescu is this art
      collector from București who showed up a year ago saying he
      wanted to buy Andrei's gates. Rich man, but... intense about
      Andrei's work. Like obsessed. Dragoș is Andrei's brother,
      coming up from Cluj.

      And Nicoleta Ardelean — the journalist — she and Andrei were
      working on something together. Something about the forest.
      Nicoleta hasn't said a word since Andrei vanished. That's
      not like her.

      Oh, and don't believe CarpatLemn's "sustainable forestry"
      posts. La naiba, those people are destroying the forest.
    effects: { trust_maria: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Bogdan -> maria_bogdan
      - Ask about CarpatLemn -> maria_carpatlemn
      - Thank her and move on -> quest1_hub

  maria_bogdan:
    type: message
    text: >
      MARIA: Bogdan? He showed up about a year ago. Said he was a
      folk art collector, wanted to commission a Maramureș gate from
      Andrei. Fine, that's normal — Andrei gets commissions. But
      Bogdan didn't leave. He rented a room at Ciprian's pension
      and just... stayed. At the inn every time Andrei was there.
      Always offering to visit the workshop. Always wanting to
      watch him carve.

      Andrei was polite about it but I could see it was too much.
      He told me once, "omul ăsta nu înțelege cuvântul nu." He
      meant about the commissions. Now I think he meant more.
    effects: { trust_maria: "+5" }
    choices:
      - Ask about CarpatLemn -> maria_carpatlemn
      - Move on -> quest1_hub

  maria_carpatlemn:
    type: message
    text: >
      MARIA: That company's been logging here since the 2000s. They
      have permits for "selective cutting" but what they actually do
      is clear-cut. Whole mountainsides stripped. The old oaks and
      beeches that Andrei used for his carvings — gone. Ancient
      forest, 500 years old, cut down for particle board.

      Andrei was the first person to go up there with a camera and
      GPS and document what they actually do versus what the permits
      say. He had photos, coordinates, satellite images. Real proof
      that they're cutting in protected areas.

      Two weeks later he's gone. Ce pula mea.
    effects: { trust_maria: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Vasile (the forester, witness tease) ---

  vasile_intro:
    type: tweet
    from: vasile
    text: >
      patruzeci de ani am păzit pădurea asta. nu mai e aceeași.
      @andrei_mihailescu avea dreptate. și acum a dispărut.
      faceți legătura.
    effects: { trust_vasile: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Vasile -> vasile_talk

  vasile_talk:
    type: message
    text: >
      VASILE: I've guarded this forest since I was a young man. Forty
      years. I know every trail, every stream, every ancient oak. And
      I'm telling you — the mountain above Vârful Pietros is
      destroyed. CarpatLemn's "selective cutting" is a bad joke. They
      take everything.

      Andrei went up there with his camera. He photographed every
      stump, every cleared slope, every boundary marker they crossed.
      He was building a case. And then — gone.

      You think that's a coincidence? I've lived too long to believe
      in coincidences in these mountains.
    effects: { trust_vasile: "+10" }
    choices:
      - Did you see anything unusual recently? -> vasile_night
      - Move on -> quest1_hub

  vasile_night:
    type: message
    text: >
      VASILE: The night before he vanished — I was doing a night
      patrol, around midnight. Poachers, you know. I saw headlights
      on the logging road above the village. Two vehicles. One was
      Andrei's old Dacia Duster — I know that car, the exhaust is
      loud. The other was a company truck. White, CarpatLemn logo
      on the door.

      At midnight. On a mountain logging road.

      I didn't think much of it then. Andrei goes up at night
      sometimes for photographs. But that company truck — that's
      not normal.
    effects: { trust_vasile: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ana (teen photographer, witness tease) ---

  ana_intro:
    type: tweet
    from: ana
    text: >
      futu-i nu mai pot @andrei_mihailescu el m-a învățat tot despre
      lemn și natură nu ar fi plecat fără să spună ceva. dacă știe
      cineva ceva ziceți acum
    effects: { trust_ana: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ana -> ana_talk_early

  ana_talk_early:
    type: message
    text: >
      ANA: ești nou pe aici? timing nasol lol. da' serios andrei e
      cel mai tare om din sat. ne-a învățat să sculptăm, ne-a dus
      în pădure, ne-a arătat copacii bătrâni. genu super mișto.

      și acum mă sperii că radu a văzut ceva ciudat în seara aia
      da nu vrea să vorbească. zice că nu-i nimic da eu văd că
      minte bags pula
    effects: { trust_ana: "+10" }
    choices:
      - What did Radu see? -> ana_radu_hint
      - Move on -> quest1_hub

  ana_radu_hint:
    type: message
    text: >
      ANA: nu știu exact. era pe motocross prin sat seara târziu și
      a văzut pe cineva lângă atelierul lui andrei?? sau ceva de
      genul. freakează complet și nu vrea să zică. trebuie să
      vorbești cu el da e super precaut cu oameni pe care nu-i
      cunoaște. vorbește întâi de motoare sau de pescuit și se
      relaxează lol
    effects: { trust_ana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Sălașul de Sus. A Maramureș village
      built around ancient forests and traditional woodcarving. A
      craftsman who was exposing illegal logging. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Ioana (Andrei's best friend) -> ioana_q1
      - Talk to Bogdan (the art collector) -> bogdan_q1
      - Check what Dragoș (Andrei's brother) is saying -> dragos_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Ioana Q1 ---

  ioana_q1:
    type: tweet
    from: ioana
    text: >
      dacă cineva are vești despre @andrei_mihailescu sunați-mă vă
      rog. sculele sunt în atelier. lemnul e pe bancul de lucru.
      n-ar fi plecat fără să termine o lucrare. niciodată.
    effects: { trust_ioana: "+5", contacts_followed: "+1" }
    choices:
      - DM Ioana -> ioana_q1_talk

  ioana_q1_talk:
    type: message
    text: >
      IOANA: Thanks for reaching out but I don't know you. Andrei
      has a lot of friends here. I'm sure he'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Ioana is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_ioana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Bogdan Q1 ---

  bogdan_q1:
    type: tweet
    from: bogdan
    text: >
      The workshop is silent without @andrei_mihailescu. His tools
      are untouched. His half-finished gate is still on the bench.
      He would never abandon a commission. Something happened.
    effects: { trust_bogdan: "+5", contacts_followed: "+1" }
    choices:
      - DM Bogdan -> bogdan_q1_talk

  bogdan_q1_talk:
    type: message
    text: >
      BOGDAN: Andrei and I have been working together for almost a
      year. He's the greatest living woodcarver in Maramureș —
      perhaps in all Romania. The logging investigation — it was
      personal for him. The old-growth oaks are his material, his
      heritage. He had photos, GPS data, everything. He was so close
      to going public.

      I offered to help. I have connections in București, media
      contacts. He said he had it under control. He said he was
      working with a journalist. I just wanted to be part of
      preserving this tradition.

      [Bogdan seems earnest. Or obsessive?]
    effects: { trust_bogdan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Dragoș Q1 ---

  dragos_q1:
    type: tweet
    from: dragos
    text: >
      fratele meu a DISPĂRUT și poliția îmi zice că poate e plecat
      în vizită??? NU PLEACĂ ÎN VIZITĂ FĂRĂ SĂ SPUNĂ. vin de la
      cluj acum. cineva o să-mi explice.
    effects: { trust_dragos: "+5", contacts_followed: "+1" }
    choices:
      - DM Dragoș -> dragos_q1_talk

  dragos_q1_talk:
    type: message
    text: >
      DRAGOȘ: Who the hell are you? Another person from that village
      who's going to tell me to calm down? My brother called me the
      night before he disappeared. He said he had something huge.
      He said "dacă mi se întâmplă ceva, uită-te la CarpatLemn."
      Then he hung up.

      That's the last I heard from him.
    effects: { trust_dragos: "+10" }
    choices:
      - What do you think happened? -> dragos_theory
      - Move on -> quest1_hub

  dragos_theory:
    type: message
    text: >
      DRAGOȘ: I think he found proof that CarpatLemn is cutting
      illegally in the old-growth forest and they shut him up. But
      I also think that creepy collector — Bogdan — knows more than
      he's saying. The way he talks about Andrei... it's not normal
      interest in woodcarving. It's something else entirely.

      Andrei told me months ago someone was coming into his workshop
      when he wasn't there. Tools moved, wood samples rearranged,
      his notebook opened. He thought it was kids. I don't think it
      was kids.
    effects: { trust_dragos: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Andrei went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Radu (was out on his motocross bike late) -> radu_interview
      - Find Ciprian (pension owner, heard vehicles) -> ciprian_interview
      - Find Ștefan (shepherd, was on the hill at dawn) -> stefan_interview
      - Find Petru (blacksmith, starts early, saw something) -> petru_interview

  # --- Radu (saw someone at Andrei's workshop) ---

  radu_interview:
    type: tweet
    from: radu
    text: >
      tura bună cu motorul da atmosfera în sat e ciudată rău.
      ceva nu e în regulă. nu știu cum să explic
    effects: { trust_radu: "+5" }
    choices:
      - Ask Radu about that evening -> radu_talk

  radu_talk:
    type: message
    text: >
      RADU: bine da nu spui la nimeni ok. eram cu motorul pe la
      nouă seara și am trecut pe lângă atelierul lui andrei. și
      l-am văzut pe ăla — bogdan — la mașina lui andrei. căuta
      ceva sau punea ceva acolo. când a văzut farul meu a plecat
      nasol de repede.

      adică eu n-am zis nimic că cine m-ar fi crezut pe mine un
      puști vs un adult bogat din bucurești. da a fost super
      suspect futu-i
    effects:
      trust_radu: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Ciprian (pension owner, heard late-night meeting) ---

  ciprian_interview:
    type: tweet
    from: ciprian
    text: >
      Atenție: circulația pe drumul forestier este interzisă între
      22 și 6. Am constatat trafic neautorizat în ultimele nopți.
    effects: { trust_ciprian: "+5" }
    choices:
      - Ask Ciprian what he saw -> ciprian_talk

  ciprian_talk:
    type: message
    text: >
      CIPRIAN: I was at the pension, about 23h, cleaning up after
      the last guests. Two vehicles came down the forest road — one
      was that CarpatLemn company truck, the white one with the logo.
      The other was a dark BMW I didn't recognise, Cluj plates.

      They stopped at the gate to the logging zone above Vârful
      Pietros. Two men got out. One I recognised: Mircea Ionescu,
      the CarpatLemn director. At 23h. On a mountain road.

      I wrote it in my guest book — I log everything for insurance
      purposes. Nobody's asked to see it.
    effects:
      trust_ciprian: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
