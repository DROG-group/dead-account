  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Comisar Preda reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the workshop intrusions,
      the photo metadata, the witness testimonies — Bogdan is
      arrested for stalking and harassment. A GPS tracker is
      recovered from under Andrei's Dacia Duster, abandoned on the
      mountain road past the old logging camp.

      Nicoleta Ardelean, finally in possession of Andrei's full
      evidence package, publishes the CarpatLemn story on Recorder.
      The regional forestry authority orders an unannounced
      inspection. All cutting permits in the Sălașul de Sus area
      are suspended pending investigation. Mircea Ionescu faces
      criminal charges for permit fraud and destruction of a
      protected virgin forest reserve.

      And Andrei Mihailescu, reading the story from a friend's
      house in Sighetu Marmației, calls his brother for the first
      time in ten days.

