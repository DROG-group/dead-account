entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN ALDTSJERK
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to aldtsjerk.social — the community Mastodon instance for
      the village of Aldtsjerk, Friesland.

      It's winter. The canals are frozen. The village should be alive
      with skating. Instead, the local feed is full of worry.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name keeps coming back:
      @sjoerd_visser.

      A 22-year-old speed skater and youth coach. The village's pride.
      He hasn't posted in six days. His phone is off. His skates are
      still in his locker at the club.
    choices:
      - Look at his profile -> sjoerd_profile

  sjoerd_profile:
    type: tweet
    from: sjoerd
    text: "de veengronden bij het kanaal zinken steeds verder. straks is er geen ijs meer. iemand moet dit stoppen. ik heb foto's."
    choices:
      - That's his last real post... -> grey_ice

  grey_ice:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      grey ice. Cracked, shot from a strange low angle. Posted at 4am.
      No caption.

      His friends say Sjoerd never posts without some dumb joke in the
      caption. The politie says he probably went travelling. Nobody in
      Aldtsjerk buys that for a second.
    choices:
      - Read the politie statement -> politie_statement
      - Look at what people are saying -> community_reaction

  politie_statement:
    type: tweet
    from: rechercheur
    text: >
      De politie heeft een melding ontvangen betreffende een inwoner
      van Aldtsjerk. Op dit moment zijn er geen aanwijzingen voor een
      strafbaar feit. Informatie kan worden gedeeld via 0900-8844.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @femke_de_boer is driving
      up from Leeuwarden. His best friend @wiebe_hoekstra is furious.
      His skaters — @nienke_zijlstra, @thijs, @marrit — are posting
      panicked messages.

      The ice master @klaas_feenstra says Sjoerd was right about the
      sinking ground. The journalist @jildou_kamstra is asking
      uncomfortable questions about Veenstra Grondwerken.

      And @jelmer_terpstra — Sjoerd's training rival — hasn't said
      a word.
    effects: { trust_femke: "+5", trust_wiebe: "+5" }
    choices:
      - Start following Sjoerd's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Aldtsjerk. Follow Sjoerd's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Douwe (café owner, knows everyone) -> douwe_intro
      - Talk to Klaas (ice master, knows the land) -> klaas_intro
      - Talk to Nienke (teen skater, clearly upset) -> nienke_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Sjoerd with the rhythms of a Frisian
      village: ice conditions, skating routes, the café's stamppot
      menu, weather warnings for the weekend.

      Key names surface: Femke (sister, physio in Leeuwarden), Wiebe
      (best friend, seems angry), Jelmer (rival skater, suspiciously
      quiet), and the teens — Nienke, Thijs, Marrit — who trained with
      Sjoerd every day.

      Also prominent: Veenstra Grondwerken BV, the peat extraction
      company digging up the wetlands east of the village. Their posts
      are corporate greenwash. Sjoerd's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Douwe -> douwe_intro
      - Talk to Klaas -> klaas_intro
      - Talk to Nienke -> nienke_intro

  # --- Douwe (social map) ---

  douwe_intro:
    type: tweet
    from: douwe
    text: >
      café is open maar het is stil vandaag. sjoerd z'n stoel is leeg.
      jongen, kom terug. de erwtensoep staat klaar.
    effects: { trust_douwe: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Douwe -> douwe_talk

  douwe_talk:
    type: message
    text: >
      DOUWE: Ah, nieuw hier? Welkom. Klote timing, dat wel. Het hele
      dorp is in rep en roer om Sjoerd.

      Even wie wie is. Femke is z'n zus, fysiotherapeut in Leeuwarden.
      Goeie meid, helemaal kapot hiervan. Wiebe is z'n beste vriend
      sinds de basisschool. Nienke, Thijs, Marrit — dat zijn z'n
      schaatsertjes, die coacht hij. Hartstikke gek van die jongen.

      En dan heb je Jelmer Terpstra. Die schaatst ook, maar heel
      anders. Jelmer wil winnen. Sjoerd wil iedereen beter maken. Dat
      botst al jaren. De laatste maanden werd het erger. Jelmer was
      echt nie normaal bezig met die selectie.

      Oh ja — en Veenstra Grondwerken. Laat me niet beginnen over die
      klootzakken. Ze graven het veen weg en het hele land zakt. De
      ijsbaan scheurt. De kanalen worden onberijdbaar. Sjoerd was de
      enige die er iets van zei.
    effects: { trust_douwe: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Jelmer -> douwe_jelmer
      - Ask about Veenstra -> douwe_veenstra
      - Thank him and move on -> quest1_hub

  douwe_jelmer:
    type: message
    text: >
      DOUWE: Jelmer? Die jongen is geobsedeerd. Sjoerd werd vorig
      jaar geselecteerd voor het gewest, Jelmer niet. Sindsdien is het
      tering koud tussen die twee.

      Jelmer trainde twee keer zo veel. Was elke ochtend op de baan.
      Volgde Sjoerd op alle socials. Kopieerde z'n trainingsschema.
      En als Sjoerd op het ijs was met z'n leerlingen, stond Jelmer
      toe te kijken. Gwn staan. Kijken.

      Aukje van het bestuur heeft ze een keer uit elkaar moeten halen
      na een training. Jelmer zei dat Sjoerd z'n baan had gestolen.
      Sjoerd zei gwn niks. Dat is Sjoerd.
    effects: { trust_douwe: "+5" }
    choices:
      - Ask about Veenstra -> douwe_veenstra
      - Move on -> quest1_hub

  douwe_veenstra:
    type: message
    text: >
      DOUWE: Veenstra Grondwerken. Ze winnen turf ten oosten van het
      dorp. Al jaren. Maar de laatste twee jaar zijn ze flink
      uitgebreid. Nieuw terrein, nieuwe vergunningen, dieper graven.

      Het probleem: het veen houdt het water vast. Haal je het weg,
      dan zakt de grond. De sloten draineren. Het kanaal wordt
      ondieper. En als het vriest? Het ijs is niet meer te vertrouwen.
      Scheuren overal.

      Sjoerd fotografeerde het. Elke week nieuwe schade. Hij had een
      heel dossier opgebouwd. Twee weken later is hij weg.

      Godverdomme, reken maar uit.
    effects: { trust_douwe: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Klaas (ice master, the land) ---

  klaas_intro:
    type: tweet
    from: klaas
    text: >
      WAARSCHUWING: kanaal-oost is AFGESLOTEN. scheuren in het ijs ter
      hoogte van veenstra-terrein. te gevaarlijk. niet schaatsen.
      herhaal: NIET SCHAATSEN.
    effects: { trust_klaas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Klaas -> klaas_talk

  klaas_talk:
    type: message
    text: >
      KLAAS: Ik ben al veertig jaar ijsmeester. Ik ken elke
      centimeter van deze vaarten en kanalen. En ik zeg je: het ijs is
      kapot. Niet door het weer. Door de turfwinning.

      Het grondwaterpeil daalt. De oevers verschuiven. Het ijs
      scheurt waar het nooit scheurde. Vorige winter is een kind er
      bijna doorheen gezakt bij het bruggetje.

      Sjoerd begreep het. Hij mat het op. Elke week. Waterstanden,
      ijsdikte, bodemverzakking. Hij had alles op z'n laptop. En hij
      stuurde het naar de gemeente. Weet je wat de gemeente deed?
      Niks. Kut niks.
    effects: { trust_klaas: "+10" }
    choices:
      - Did you see anything unusual recently? -> klaas_night
      - Move on -> quest1_hub

  klaas_night:
    type: message
    text: >
      KLAAS: De avond voor z'n verdwijning. Ik was laat op het ijs,
      rond middernacht. Ik meet altijd 's nachts als het stil is.

      Er stond een auto bij de clubgebouw. Motor draaide. Lichten
      uit. Ik kon niet zien wie erin zat. Maar het was geen auto die
      ik kende — donkere SUV, groot ding. Toen ik dichterbij kwam,
      reed ie weg. Richting het Veenstra-terrein.

      Sjoerds fiets stond nog bij het hek. Om middernacht.
    effects: { trust_klaas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nienke (teen skater, witness tease) ---

  nienke_intro:
    type: tweet
    from: nienke
    text: >
      ik kan echt nie geloven dat sjoerd gwn weg is??? hij zou ons
      nooit zomaar laten zitten. hij had vandaag training met ons.
      hij mist NOOIT training. godverdomme dit klopt niet
    effects: { trust_nienke: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Nienke -> nienke_talk_early

  nienke_talk_early:
    type: message
    text: >
      NIENKE: ja hallo wie ben je? ok whatever. sjoerd is de beste
      coach die er is. hij traint ons elke dag na school. gratis. hij
      doet het omdat hij van schaatsen houdt en omdat hij wil dat wij
      beter worden.

      en nu is hij gwn weg?? echt nie. hij zou nooit weggaan zonder
      iets te zeggen. sws nie met de wedstrijden volgende week.

      en weet je wat kut is? jelmer stond gister weer bij de baan.
      gwn staan kijken naar ons. zonder sjoerd. creepy as fuck. thijs
      zag het ook.
    effects: { trust_nienke: "+10" }
    choices:
      - What was Jelmer doing? -> nienke_jelmer_hint
      - Move on -> quest1_hub

  nienke_jelmer_hint:
    type: message
    text: >
      NIENKE: ik weet niet precies. thijs zegt dat jelmer de laatste
      weken vaker bij de baan was als sjoerd er was. dan stond hij
      aan de kant. filmen op z'n telefoon. trainingen analyseren ofzo.
      maar het was meer dan dat. hij volgde sjoerd gwn overal.

      en die ene keer na de selectiewedstrijd? jelmer kwam naar
      sjoerd toe en zei iets van "dit is nog niet voorbij." tering
      eng. sjoerd deed alsof het niks was maar je zag dat hij het
      niet chill vond.

      praat met thijs. die weet meer.
    effects: { trust_nienke: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Aldtsjerk. A Frisian village built
      around ice and water. A young coach who was documenting
      environmental damage. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Femke (Sjoerd's sister) -> femke_q1
      - Talk to Wiebe (Sjoerd's best friend) -> wiebe_q1
      - Check what Jelmer (the rival) is posting -> jelmer_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Femke Q1 ---

  femke_q1:
    type: tweet
    from: femke
    text: >
      als iemand informatie heeft over @sjoerd_visser BEL ME. zijn
      kamer is onaangeroerd. zijn schaatsen staan er nog. mijn broer
      gaat niet weg zonder zijn schaatsen. NOOIT.
    effects: { trust_femke: "+5", contacts_followed: "+1" }
    choices:
      - DM Femke -> femke_q1_talk

  femke_q1_talk:
    type: message
    text: >
      FEMKE: Wie ben je? Sorry, ik ben een beetje... ik vertrouw nu
      even niemand. Sjoerd belde me elke avond. Elke. Avond. En toen
      ineens niet meer.

      De politie zegt dat hij misschien is gaan reizen. Mijn broer
      heeft in z'n hele leven nog nooit een vakantie genomen. Die
      jongen leeft voor het ijs.

      [Femke is op haar hoede. Je moet meer vertrouwen opbouwen
      voordat ze echt gaat praten.]
    effects: { trust_femke: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Wiebe Q1 ---

  wiebe_q1:
    type: tweet
    from: wiebe
    text: >
      ik zweer het als iemand sjoerd iets heeft aangedaan dan vind ik
      ze. de politie doet niks. de gemeente doet niks. dan doe IK het
      wel godverdomme.
    effects: { trust_wiebe: "+5", contacts_followed: "+1" }
    choices:
      - DM Wiebe -> wiebe_q1_talk

  wiebe_q1_talk:
    type: message
    text: >
      WIEBE: Sjoerd is mijn beste maat. Sinds groep 3. We hebben
      samen leren schaatsen op de sloot achter z'n huis.

      Hij belde me de avond voor hij verdween. Hij klonk gespannen.
      Hij zei: "als er iets gebeurt, kijk naar het Veenstra-terrein.
      Ik heb dingen gevonden die ze niet willen dat iemand ziet."

      Dat was het. Daarna niks meer. Telefoon uit. Weg.

      En die Jelmer? Die klootzak loopt nu rond alsof er niks aan
      de hand is. Terwijl hij Sjoerd al maanden stalkte. Iedereen
      weet het maar niemand zegt er iets van.
    effects: { trust_wiebe: "+10" }
    choices:
      - What do you think happened? -> wiebe_theory
      - Move on -> quest1_hub

  wiebe_theory:
    type: message
    text: >
      WIEBE: Twee opties. Eén: Veenstra Grondwerken heeft hem de
      mond gesnoerd. Die gasten sponsoren de halve gemeente. Als
      Sjoerd z'n dossier publiek had gemaakt, waren ze hun
      vergunningen kwijt. Miljoenen euro's.

      Twee: Jelmer is doorgedraaid. Die gast was echt nie normaal
      meer. Volgde Sjoerd overal. Filmde hem. Stond 's avonds bij
      z'n huis. Sjoerd vertelde me dat iemand z'n trainingsdata van
      z'n laptop had gekopieerd. Wie doet zoiets?

      Misschien allebei. Misschien heeft de een de ander de kans
      gegeven.
    effects: { trust_wiebe: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jelmer Q1 ---

  jelmer_q1:
    type: tweet
    from: jelmer
    text: >
      Goeie training vandaag. Tijden worden beter. Focus op de
      selectie in maart. #schaatsen #grind #noexcuses
    effects: { trust_jelmer: "+5", contacts_followed: "+1" }
    choices:
      - DM Jelmer -> jelmer_q1_talk

  jelmer_q1_talk:
    type: message
    text: >
      JELMER: Sjoerd? Ja, jammer dat hij weg is. Maar mensen
      verdwijnen soms even. Druk ofzo. Het is niet zo bijzonder als
      iedereen ervan maakt.

      Ik heb het druk met trainen. De selectiewedstrijden zijn over
      vijf weken. Nu Sjoerd er niet is, is er een plek vrij. Dat
      klinkt hard maar het is de realiteit.

      [Jelmer lijkt opmerkelijk onbezorgd.]
    effects: { trust_jelmer: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Sjoerd went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Thijs (was at the rink that evening) -> thijs_interview
      - Find Bram (farmer, early morning on the polder) -> bram_interview
      - Find Ids (materials manager, saw lights) -> ids_interview
      - Find Rixt (village doctor, was called out late) -> rixt_interview

  # --- Thijs (saw Jelmer following Sjoerd) ---

  thijs_interview:
    type: tweet
    from: thijs
    text: >
      ik zeg niks meer online. dm me als je echt wil weten wat er aan
      de hand is.
    effects: { trust_thijs: "+5" }
    choices:
      - DM Thijs -> thijs_talk

  thijs_talk:
    type: message
    text: >
      THIJS: oke man luister. die avond was ik bij de baan. sjoerd
      was er ook, solo training. rond een uur of acht zie ik jelmer
      aankomen. hij gaat niet het ijs op. hij staat gwn in het donker
      bij de kleedkamers. met z'n telefoon. filmt sjoerd.

      toen sjoerd klaar was en wegging op z'n fiets, stapte jelmer in
      z'n auto en reed achter hem aan. echt nie normaal man. ik dacht
      nog wtf maar ja. ik ben 16. wie luistert er naar mij.

      kanker eng was het. sws niet de eerste keer. marrit heeft het
      ook gezien.
    effects:
