      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # --- Rechercheur De Vries ---

  rechercheur_interview:
    type: message
    text: >
      RECHERCHEUR DE VRIES: Off the record — en ik meen het, helemaal
      off the record — ik wilde deze zaak onderzoeken. Mijn
      leidinggevende zei: laat het liggen. De gemeente wil geen
      gedoe met Veenstra Grondwerken. Te veel banen, te veel geld,
      te veel donaties aan de lokale politiek.

      De Jelmer-situatie is anders. Daar wist ik niks van. Als je
      bewijs hebt van stalking, kan ik daar wél iets mee. Dat valt
      onder mijn bevoegdheid.

      Breng me iets concreets en ik heropen de zaak.
    effects:
      trust_rechercheur: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Sjoerd than anyone in Aldtsjerk. Who is responsible?
    choices:
      - Confront Jelmer Terpstra (the obsessive rival) -> confront_jelmer
        when:
          state: obsession_evidence
          gte: 5
      - Confront Stijn Veenstra (the extraction director) -> confront_stijn
        when:
          state: corporate_evidence
          gte: 3
      - Confront Wethouder Hendrik Postma (political protection) -> confront_hendrik
      - I need more evidence -> investigation_hub

  # --- ENDING A: Jelmer (Best Ending) ---

  confront_jelmer:
    type: message
    text: >
      You present your evidence to Jelmer:

      "I know @ijs_en_bloed is your account. I know you followed
      Sjoerd home every night. I know you broke into his locker. I
      know you filmed his training. I know you went to the doctor at
      00:30 with injuries from a fight. I have witnesses, training
      logs, and the anonymous posts."
    choices:
      - Send -> jelmer_response

  jelmer_response:
    type: message
    text: >
      Jelmer doesn't reply for a long time. Then:

      JELMER: Je snapt het niet. Sjoerd is niet beter dan ik. Hij
      had gewoon geluk bij de selectie. Ik moest weten hoe hij
      trainde. Ik moest hem bestuderen. Het was geen stalking. Het
      was research.

      Die avond — ik volgde hem naar het Veenstra-terrein. Ik zag
      dat hij problemen kreeg met die mannen. Ik probeerde te helpen.
      We vochten. Daarna is hij weggerend. Ik weet niet waarheen.
      Ik zweer het.

      That's not research. That's obsession.

      You've already sent the evidence to Rechercheur De Vries. And
      to Jildou Kamstra.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Rechercheur De Vries heropent de zaak. With your evidence —
      the anonymous account, the training logs, the Strava data, the
      doctor's testimony, the witness statements — Jelmer is arrested
      for stalking and belaging. His phone contains hundreds of
      photos of Sjoerd. His car GPS confirms he followed Sjoerd every
      night for months.

      Jildou Kamstra, with Sjoerd's full evidence package, publishes
      the Veenstra story in the Friesch Dagblad and it gets picked
      up by NOS. The province orders an independent investigation.
      Veenstra Grondwerken's extraction permit is suspended. Stijn
      Veenstra faces criminal charges for illegal winning in a
      protected wetland. Wethouder Postma treedt af.

      And Sjoerd Visser, reading the article from a friend's attic
      in Sneek, calls his sister for the first time in nine days.

      "Ik kom naar huis, Femke."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: sjoerd
    text: >
      het ijs draagt weer. niet overal. maar genoeg. bedankt dat
      jullie niet opgaven. de polder vergeet niet.
    choices:
      - The End -> game_complete

  # --- ENDING B: Stijn Veenstra (Partial Ending) ---

  confront_stijn:
    type: message
    text: >
      You present the extraction evidence to Stijn Veenstra:

      "I have drone photos showing you digging outside your permitted
      area. I have groundwater data proving the damage is ten times
      what you report. I have audio from closed council meetings
      where Wethouder Postma pushed through your permits. I have
      the testimony of a farmer whose land is collapsing."
    choices:
      - Send -> stijn_response

  stijn_response:
    type: message
    text: >
      STIJN: Dit gesprek wordt doorgestuurd naar onze juridische
      afdeling. Elke publicatie van lasterlijke uitspraken zal leiden
      tot directe juridische stappen. Veenstra Grondwerken opereert
      volledig binnen de vergunningsvoorwaarden.

      But it's too late. You've sent everything to Jildou, to It
      Fryske Gea, and to the province.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The extraction story breaks. Veenstra Grondwerken is ordered to
      halt all operations pending investigation. The company may close.
      Eighty jobs in the balance. The village is divided.

      But Sjoerd?

      Without the stalking evidence, Jelmer is never investigated. He
      continues to train. He continues to follow Sjoerd's old routes
      on Strava. He gets Sjoerd's spot in the gewest selectie.

      Three months later, Sjoerd reads the Veenstra story online. He
      returns quietly. He stops coaching alone. He changes his
      training times to unpredictable schedules. He checks behind him
      constantly.

      The corporation is exposed. But the person who terrorised
      Sjoerd skates free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: sjoerd
    text: "ik ben terug. het veen herstelt. de rest... we zien wel."
    choices:
      - The End -> game_complete

  # --- ENDING C: Wethouder (Wrong Ending) ---

  confront_hendrik:
    type: message
    text: >
      You confront Wethouder Hendrik Postma with your evidence.

      Within the hour, you receive a message from his lawyer:
    choices:
      - Read the response -> hendrik_response

  hendrik_response:
    type: tweet
    from: taco
    text: >
      Mijn cliënt neemt kennis van uw beschuldigingen. Elke openbare
      verspreiding van lasterlijke beweringen zal leiden tot directe
      juridische stappen. — Kantoor Brouwer & Zn, Leeuwarden
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The wethouder's lawyer buries your accusation. Without a direct
      link between Postma and Veenstra's illegal extraction — and
      there isn't one beyond political favouritism — your evidence
      is insufficient for a criminal case.

      Veenstra continues to dig. Jelmer continues to watch. Sjoerd
      stays in hiding.

      Six months later, @ijs_en_bloed creates a new account. It
      follows Sjoerd's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: ALDTSJERK — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Sjoerd's story explores themes of
      environmental destruction, corporate impunity, obsessive
      rivalry, community silence, and the courage to stand up for
      the land you love.

      If you or someone you know is struggling with stalking,
      harassment, or dark thoughts, help is available:

      113 Zelfmoordpreventie: 113 (gratis, 24/7)
      Slachtofferhulp Nederland: 0900-0101
      Politie (niet-spoed): 0900-8844
