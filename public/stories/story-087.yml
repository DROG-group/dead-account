      operated within applicable EU regulations and holds all
      necessary permits.

      But it's too late. You've sent the evidence to Catarina, to
      the Guardiões do Atlântico, and to the Governo Regional.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The mining story breaks. OceanDeep is ordered to halt all
      drilling pending investigation. The EU funds are frozen. The
      jobs that were promised evaporate. The island is divided.

      But Diogo?

      Without the stalking evidence, Miguel is never investigated.
      He continues to visit the island. He creates a new anonymous
      account. He buys new binoculars. He rents a boat.

      Three months later, Diogo reads about OceanDeep online. He
      returns quietly. He reopens the whale watching tours. He
      changes his routes every day. He checks his boat every
      morning. He stops diving alone.

      The corporation is exposed. But the person who terrorised
      Diogo walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: diogo
    text: "voltei. o oceano está mais limpo. o resto... logo se vê."
    choices:
      - The End -> game_complete

  # --- ENDING C: Presidente (Wrong Ending) ---

  confront_ricardo:
    type: message
    text: >
      You confront Presidente Pacheco with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> ricardo_response

  ricardo_response:
    type: tweet
    from: teresa
    text: >
      O meu cliente toma nota das suas alegações. Qualquer
      divulgação pública de declarações difamatórias será objeto
      de ação judicial imediata. — Vasques & Associados, Lisboa
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The presidente's lawyer buries your accusation. Without a
      direct link between Pacheco and OceanDeep's illegal drilling
      — and the "development contribution" is technically routed
      through legal EU fund channels — your evidence is
      insufficient.

      OceanDeep continues to drill. Miguel continues to watch.
      Diogo stays in hiding on the islet.

      Six months later, @marta_vieira creates a new account. It
      follows Diogo's sister.
    choices:
      - The End -> game_complete

