# DEAD ACCOUNT — Story 087: Vila das Furnas (Portugal — Azores)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-087.yml
#
# Player investigates the disappearance of young whale watching guide
# Diogo Medeiros in the fictional Azorean volcanic island village of
# Vila das Furnas.

