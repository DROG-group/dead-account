      avatar: avatars/sargento.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN VILA DAS FURNAS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to viladasfurnas.social — the community Mastodon instance
      for the volcanic island village of Vila das Furnas, Azores.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @diogo_medeiros.

      A young whale watching guide. He knew every migration route,
      every dive pattern, every current around the island. People are
      worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> diogo_profile

  diogo_profile:
    type: tweet
    from: diogo
    text: "Encontrei equipamento de perfuração no fundo do mar a 3 milhas da costa. Dentro da zona protegida. Tenho as fotos. Alguém tem de parar isto."
    choices:
      - That's his last real post... -> grey_ocean

  grey_ocean:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a grey ocean surface. Blurred, overexposed, shot from a strange
      angle. Posted at 3am. No caption.

      His friends say that's not his style. The GNR say he probably
      went travelling to the mainland. Something doesn't add up.
    choices:
      - Read the GNR statement -> gnr_statement
      - Look at what people are saying -> community_reaction

  gnr_statement:
    type: tweet
    from: sargento
    text: >
      Recebemos uma participação relativa a um residente de Vila
      das Furnas. Nesta fase, não existem elementos que apontem
      para qualquer ato criminoso. Quem tenha informações úteis
      deve contactar o 112 ou o Posto.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @margarida_medeiros is
      furious. His colleague @afonso_tavares is posting worried
      messages. His girlfriend @carolina_sousa is desperate. The
      old fisherwoman @helena_raposo says Diogo was right about the
      ocean.

      And the journalist @catarina_amaral is strangely silent.

      Nobody buys the GNR's line. Nobody thinks Diogo just "went
      to the mainland."
    effects: { trust_margarida: "+5", trust_afonso: "+5" }
    choices:
      - Start following Diogo's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Vila das Furnas. Follow Diogo's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to João (tasca owner, knows everyone) -> joao_intro
      - Talk to Helena (fisherwoman, saw the drilling ships) -> helena_intro
      - Talk to Tiago (teen surfer, seems shaken) -> tiago_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Diogo with the rhythms of a small
      island village: whale sighting reports, ferry schedules, the
      padaria's bolo lêvedo specials, volcanic hot spring temperatures.

      Key names surface: Margarida (sister, nurse in Ponta Delgada),
      Afonso (marine biologist colleague, seems rattled), Carolina
      (girlfriend, biology student in Lisbon), and the teens — Tiago,
      Beatriz, Leonor — who worshipped Diogo's ocean work.

      Also prominent: OceanDeep Mining SA, the deep sea mining company
      doing "exploratory surveys" off the coast. Their posts are
      corporate PR. Diogo's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to João -> joao_intro
      - Talk to Helena -> helena_intro
      - Talk to Tiago -> tiago_intro

  # --- João (social map) ---

  joao_intro:
    type: tweet
    from: joao
    text: >
      A tasca está aberta mas sem o @diogo_medeiros não é a mesma
      coisa. Aquele rapaz passava sempre depois do mar. Diogo, a
      tua mesa está à tua espera.
    effects: { trust_joao: "+5", contacts_followed: "+1" }
    choices:
      - Reply to João -> joao_talk

  joao_talk:
    type: message
    text: >
      JOÃO: Ah, you're new? Bem-vindo. Terrible time to arrive.
      The whole island is worried about Diogo.

      Let me tell you who's who. Margarida is his sister — a nurse
      in Ponta Delgada. Tough woman, she'll tear the island apart.
      Afonso Tavares works at the oceanographic station with Diogo.
      Smart man, knows the ocean. Carolina is Diogo's girlfriend,
      studies biology in Lisbon. Comes back every chance she gets.

      And then there's this tourist — Miguel Andrade, from Lisbon.
      He started coming for the whale watching. Three trips in a
      row. Always booking with Diogo. Then he started showing up
      outside of tours. Carolina didn't like it but Diogo said he
      was just enthusiastic.

      Oh, and OceanDeep Mining — foda-se, don't get me started.
      They want to drill the seabed inside the marine protected
      area. Diogo was the loudest voice against it. The presidente
      da câmara is in their pocket.
    effects: { trust_joao: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Miguel -> joao_miguel
      - Ask about OceanDeep -> joao_oceandeep
      - Thank him and move on -> quest1_hub

  joao_miguel:
    type: message
    text: >
      JOÃO: Miguel? Bué estranho, that guy. Came for the whales
      at first. Then he came for Diogo. You could see it — the
      way he watched him, the way he'd find excuses to stay on the
      boat longer after the tours ended.

      Diogo was kind to everyone. Too kind. Miguel would sit at
      the harbour wall for hours just watching the boat. He told
      Carolina it was nothing. But I run a tasca — I know when
      someone is coming for the food, and when they're coming for
      something else.

      After Diogo told him the tour schedule was full, he got...
      strange. Quiet. But he didn't leave the island. If anything
      he stayed longer.
    effects: { trust_joao: "+5" }
    choices:
      - Ask about OceanDeep -> joao_oceandeep
      - Move on -> quest1_hub

  joao_oceandeep:
    type: message
    text: >
      JOÃO: OceanDeep Mining wants to do "test drills" three miles
      off the coast. Right in the middle of the marine protected
      area. Whale migration route. Dolphin feeding grounds. They
      say it's for "rare earth minerals" and it'll bring EU funds
      and jobs.

      The presidente da câmara — Ricardo — he's all for it. Caralho,
      the man sees euros where the rest of us see whales and tuna.
      Diogo found out OceanDeep was already running drill ships at
      night, before any EU environmental assessment was completed.
      He had underwater footage. That kid was fixe — brave as hell.

      Two weeks after he posted those photos, he's gone.
    effects: { trust_joao: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Helena (the ocean, witness tease) ---

  helena_intro:
    type: tweet
    from: helena
    text: >
      quarenta anos que pesco nesta costa. o mar não é o mesmo.
      @diogo_medeiros tinha razão. e agora desapareceu. façam
      vocês a ligação.
    effects: { trust_helena: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Helena -> helena_talk

  helena_talk:
    type: message
    text: >
      HELENA: I've been fishing these waters since I was fifteen.
      I know every current, every colour the Atlantic makes. And
      I'm telling you — the water off the south coast is wrong.
      Has been for months. My nets come up with dead fish near the
      drilling zone. The seabed smells like oil.

      Diogo dove down there with his camera. He filmed everything.
      Drill heads on the ocean floor. Sediment plumes. Dead coral.
      He was building a case against OceanDeep.

      Then poof — desapareceu.

      You think that's a coincidence? No mar não há coincidências.
    effects: { trust_helena: "+10" }
    choices:
      - Did you see anything unusual recently? -> helena_night
      - Move on -> quest1_hub

  helena_night:
    type: message
    text: >
      HELENA: The night before he vanished — I was coming back from
      night fishing, around 1am. I saw lights at the marina. Not
      unusual, boats come and go. But there was a large vessel
      anchored just outside the harbour. No fishing lights. No
      name visible. It looked like one of OceanDeep's survey ships.

      At 1am. Just sitting there in the dark.

      I didn't think much of it then. Merda, I think about it
      every night now.
    effects: { trust_helena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tiago (teen surfer, witness tease) ---

  tiago_intro:
    type: tweet
    from: tiago
    text: >
      foda-se mano @diogo_medeiros foi ele que me ensinou a
      respeitar o oceano tipo a sério não é possível que tenha
      ido embora assim. se alguém sabe alguma cena digam pf
    effects: { trust_tiago: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tiago -> tiago_talk_early

  tiago_talk_early:
    type: message
    text: >
      TIAGO: mano és novo aqui? bué mau timing. a sério o diogo
      é tipo a melhor pessoa desta ilha. ensinou-nos a fazer surf
      safe, levava-nos a ver as baleias, mostrava-nos as cenas
      debaixo de água com a câmara. bué fixe.

      e agora tou em pânico porque a beatriz viu uma cena estranha
      à noite no porto mas não quer falar disso. diz que não é nada
      mas tipo... não é nada um caralho
    effects: { trust_tiago: "+10" }
    choices:
      - What did Beatriz see? -> tiago_beatriz_hint
      - Move on -> quest1_hub

  tiago_beatriz_hint:
    type: message
    text: >
      TIAGO: não sei bem. ela tava a fazer kayak ao pôr do sol e
      viu tipo um gajo a mexer no barco do diogo?? ou qualquer cena
      assim. ela está bué assustada não quer falar. tens de lhe
      perguntar diretamente mas ela é desconfiada com gente que
      não conhece. tenta primeiro falar de mergulho com ela lol
    effects: { trust_tiago: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Vila das Furnas. A volcanic
      Azorean island village built around the ocean. A young whale
      watching guide who was fighting deep sea mining. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Carolina (Diogo's girlfriend) -> carolina_q1
      - Talk to Afonso (Diogo's colleague) -> afonso_q1
      - Check what Margarida (Diogo's sister) is saying -> margarida_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Carolina Q1 ---

  carolina_q1:
    type: tweet
    from: carolina
    text: >
      se alguém tiver notícias do @diogo_medeiros liguem-me por
      favor. o barco está no porto. o equipamento de mergulho está
      no armazém. ele nunca sairia sem o fato de neoprene.
    effects: { trust_carolina: "+5", contacts_followed: "+1" }
    choices:
      - DM Carolina -> carolina_q1_talk

  carolina_q1_talk:
    type: message
    text: >
      CAROLINA: I appreciate you reaching out but I don't know you.
      Diogo has a lot of friends here. I'm sure he'll come back.

      ...I keep saying that. Já não acredito.

      [Carolina is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_carolina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Afonso Q1 ---

  afonso_q1:
    type: tweet
    from: afonso
    text: >
      A estação está vazia sem o @diogo_medeiros. As amostras de
      água estão no frigorífico. Os registos de mergulho estão na
      secretária. Ele nunca abandonaria uma investigação em curso.
      Aconteceu alguma coisa.
    effects: { trust_afonso: "+5", contacts_followed: "+1" }
    choices:
      - DM Afonso -> afonso_q1_talk

  afonso_q1_talk:
    type: message
    text: >
      AFONSO: Diogo and I have worked together for two years at the
      oceanographic station. He's the most dedicated guide and
      researcher I know. This mining investigation — it was everything
      to him. He had underwater footage, sediment samples, dead coral
      photos. He was so close to going public.

      I offered to help him. Many times. He said he had it under
      control. He said he was working with a journalist. I just
      wanted to support the work.

      [Afonso seems earnest. Concerned.]
    effects: { trust_afonso: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Margarida Q1 ---

  margarida_q1:
    type: tweet
    from: margarida
    text: >
      o meu irmão DESAPARECEU e a GNR diz-me que se calhar foi
      para o continente??? ELE NÃO SAI SEM AVISAR. venho de ponta
      delgada. alguém me vai explicar.
    effects: { trust_margarida: "+5", contacts_followed: "+1" }
    choices:
      - DM Margarida -> margarida_q1_talk

  margarida_q1_talk:
    type: message
    text: >
      MARGARIDA: Who are you? Another person from this island who's
      going to tell me to calm down? My brother called me the night
      before he disappeared. He said he had something big. He said
      "se me acontecer alguma coisa, olha para a OceanDeep." Then
      he hung up.

      That's the last I heard from him.
    effects: { trust_margarida: "+10" }
    choices:
      - What do you think happened? -> margarida_theory
      - Move on -> quest1_hub

  margarida_theory:
    type: message
    text: >
      MARGARIDA: I think he found proof that OceanDeep is drilling
      illegally in the marine protected zone and they shut him up.
      The presidente da câmara is in on it — everyone knows Ricardo
      gets kickbacks from the EU funds.

      But there's something else too. Diogo told me months ago
      about this guy — a tourist from Lisbon — who kept booking
      whale watching trips. Miguel, something. He'd stay on the
      island for weeks. Following Diogo to the harbour at dawn.
      Diogo said it was nothing but I could hear in his voice — he
      was worried.

      Foda-se, I should have listened.
    effects: { trust_margarida: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Diogo went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Beatriz (was kayaking at sunset) -> beatriz_interview
      - Find Pedro (harbour master, works late) -> pedro_interview
      - Find Nuno (boat captain, early morning at the marina) -> nuno_interview
      - Find Manuel (baker, starts at 5am, saw something) -> manuel_interview

  # --- Beatriz (saw someone at Diogo's boat) ---

  beatriz_interview:
    type: tweet
    from: beatriz
    text: >
      boa sessão hoje mas o ambiente no porto está estranho tipo.
      há qualquer cena que não está bem. não sei explicar
    effects: { trust_beatriz: "+5" }
    choices:
      - Ask Beatriz about that evening -> beatriz_talk

  beatriz_talk:
    type: message
    text: >
      BEATRIZ: mano ok mas não digas a ninguém. tava no porto
      tipo às 19h a fazer kayak. e vi um gajo ao pé do barco do
      diogo — aquele turista de lisboa, o miguel. tava tipo a
      mexer em qualquer cena no barco. quando me viu foi-se
      embora bué rápido.

      tipo eu não disse nada porque não queria problemas mas agora
      é pesado. não é normal este comportamento puta que pariu
    effects:
      trust_beatriz: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Pedro (harbour master, saw late-night vessel) ---

  pedro_interview:
    type: tweet
    from: pedro
    text: >
      Aviso: o porto está encerrado entre as 23h e as 6h. Detetei
      movimentos não autorizados nestas últimas noites.
    effects: { trust_pedro: "+5" }
    choices:
      - Ask Pedro what he saw -> pedro_talk

  pedro_talk:
    type: message
    text: >
      PEDRO: I was closing the harbour office around 23h. I saw
      Diogo's boat still at the marina. And a large vessel — no
      name, no lights — anchored just outside the breakwater. A
      tender boat came from it to the dock. Two men got out. One
      of them I recognised: Filipe Mendonça, the OceanDeep CEO.

      At 23h. At a closed harbour. On a vessel with no
      identification.

      I noted it in the harbour log. Nobody's asked to see it.
    effects:
      trust_pedro: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Nuno (boat captain, saw Diogo leaving) ---

  nuno_interview:
    type: tweet
    from: nuno
    text: >
      de pé às 4h para preparar o barco. a marina não estava
      vazia esta manhã. havia alguém a desatracar no escuro.
      não era pescador.
    effects: { trust_nuno: "+5" }
    choices:
      - Ask Nuno what he saw -> nuno_talk

  nuno_talk:
    type: message
    text: >
      NUNO: I get up at 4am to prep the whale watching boat. That
      morning — the morning after Diogo's last post — I saw someone
      at the marina. A man, carrying a bag, untying a small boat.
      Diogo's inflatable. It was still dark. He pushed off and
      headed east, toward the volcanic islets.

      I called out but he didn't stop. I figured it was someone
      going early fishing but... who takes a research inflatable
