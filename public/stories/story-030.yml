entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN TANNHAUSEN
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to tannhausen.social — the community Mastodon instance
      for the Black Forest village of Tannhausen, Baden-Württemberg.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name appears everywhere:
      @florian_kessler.

      A young traditional clockmaker. He built handcrafted Black
      Forest clocks and sold them online to collectors worldwide.
      People are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> florian_profile

  florian_profile:
    type: tweet
    from: florian
    text: "Das Wasser im Tannenbach ist braun. Seit Wochen. Das kommt vom Steinbruch. Ich hab Proben genommen und die Werte sind krass. Scheiße, das muss öffentlich werden."
    choices:
      - That's his last real post... -> static_post

  static_post:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a blurred photo of a clock face. The hands point to midnight.
      No caption. Posted at 3am.

      His friends say that's not his style. Florian always captioned
      his work with details about the mechanism. The police say he
      probably went hiking. Nobody buys it.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: kommissar
    text: >
      Wir haben eine Vermisstenanzeige bezüglich eines Bewohners
      von Tannhausen aufgenommen. Derzeit liegen keine Hinweise auf
      eine Straftat vor. Hinweise bitte an das Polizeirevier: 110.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are everywhere. His housemate @lena_hartmann
      is desperate. His brother @nico_kessler is driving up from
      Freiburg. His girlfriend @hannah_vogt is posting old photos
      of them together. Old Otto, his clock master teacher, says
      Florian would never leave unfinished work.

      And the journalist @judith_kramer has gone silent since
      Florian disappeared. Strange.

      Nobody believes he went hiking. Florian had three commissions
      due this month. You don't walk away from a clockmaker's bench
      with unfinished pieces.
    effects: { trust_lena: "+5", trust_nico: "+5" }
    choices:
      - Start following Florian's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Tannhausen. Follow Florian's contacts and read
      their posts. The more you engage with the community, the
      more they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Greta (gasthaus owner, knows everyone) -> greta_intro
      - Talk to Otto (retired clockmaker, Florian's mentor) -> otto_intro
      - Talk to Yusuf (teen, seems rattled) -> yusuf_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Florian with Black Forest village
      life: hiking trail conditions, Greta's daily Kirschtorte
      specials, weather warnings about Schwarzwald storms.

      Key names surface: Lena (housemate, physio), Hannah (girlfriend,
      teacher), Otto (clock mentor), and the teens — Yusuf, Maja,
      Tim — who idolised Florian.

      Also prominent: GraniTec Schwarzwald GmbH, the quarry company
      at the edge of the forest. Their posts are corporate PR about
      "sustainable resource extraction." Florian's posts about brown
      water were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Greta -> greta_intro
      - Talk to Otto -> otto_intro
      - Talk to Yusuf -> yusuf_intro

  # --- Greta (social map) ---

  greta_intro:
    type: tweet
    from: greta
    text: >
      Florians Stammplatz ist leer. Sein Kaffee wird kalt. Komm
      zurück, @florian_kessler. Wir brauchen dich hier.
    effects: { trust_greta: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Greta -> greta_talk

  greta_talk:
    type: message
    text: >
      GRETA: New in town? Willkommen. Terrible timing though.
      Everyone's on edge about Florian.

      Let me tell you who's who. Lena is his housemate — she's
      devastated, hasn't eaten in days. Hannah is his girlfriend
      since Realschule — she's trying to stay strong but you can
      see she's breaking. Otto Brandt taught him clockmaking — he's
      been like a grandfather to Florian.

      And then there's this online buyer situation. Tobias runs
      Florian's webshop and he told me there's been this one
      customer who's been... intense. Ordering clocks, then
      returning them to get Florian to fix them personally. Sending
      messages at all hours. Showing up at the workshop. Krass
      creepy.

      Oh, and GraniTec? Boah alter, don't get me started. They're
      poisoning the Tannenbach and the Bürgermeister lets them.
    effects: { trust_greta: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the online buyer -> greta_buyer
      - Ask about GraniTec -> greta_granitec
      - Thank her and move on -> quest1_hub

  greta_buyer:
    type: message
    text: >
      GRETA: Tobias knows more about it. But I'll tell you what I
      saw. About a month ago, a man came into the gasthaus asking
      for Florian. He'd driven from Mannheim — four hours — without
      an appointment. He said he was a "collector" and needed to
      "discuss a commission in person."

      Florian was polite but uncomfortable. The man sat at the bar
      for three hours waiting. When Florian didn't come back, the
      man started asking everyone where Florian lived, where his
      workshop was, what his schedule looked like.

      I told him to leave. He said "I just want to talk to the
      artist." Scheiße, the way he said "artist" — like he owned
      Florian.
    effects: { trust_greta: "+5" }
    choices:
      - Ask about GraniTec -> greta_granitec
      - Move on -> quest1_hub

  greta_granitec:
    type: message
    text: >
      GRETA: GraniTec has been quarrying granite on the north slope
      for eight years. They blasted through the hillside, and now
      the groundwater is contaminated. The Tannenbach runs brown
      after every rain. The trout are gone. Werner the forester says
      the trees on the slope are dying.

      Florian was the first person to actually test the water. He
      sent samples to a lab in Freiburg. Heavy metals — cadmium,
      nickel. Way over legal limits. He was building a case.

      Two weeks later he's gone. Coincidence? Arschloch, no.
    effects: { trust_greta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Otto (retired clockmaker, mentor) ---

  otto_intro:
    type: tweet
    from: otto
    text: >
      fünfzig jahre uhrmacher. der junge ist der beste schüler den
      ich je hatte. @florian_kessler lässt keine uhr unfertig. nie.
      drei aufträge stehen offen. er ist nicht freiwillig gegangen.
    effects: { trust_otto: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Otto -> otto_talk

  otto_talk:
    type: message
    text: >
      OTTO: I taught Florian everything. He came to me when he was
      fourteen — said he wanted to learn Schwarzwalduhren. Real
      ones. Hand-carved, hand-assembled. Not the tourist crap from
      China.

      He's the most talented clockmaker I've seen in fifty years.
      His clocks sell for thousands online. Collectors from Japan,
      America, everywhere. He made Tannhausen famous.

      And I'm telling you — a clockmaker does not leave his bench
      with three commissions open. It goes against everything in
      his nature. Something happened.

      Also — I've been worried about this for months — someone has
      been sending him strange letters. Not emails. Paper letters.
      Handwritten. He showed me one. It said "Your work is an
      extension of your soul. I need to be closer to it."

      Wichser. That's not admiration. That's obsession.
    effects: { trust_otto: "+10" }
    choices:
      - Did you see anything unusual recently? -> otto_night
      - Move on -> quest1_hub

  otto_night:
    type: message
    text: >
      OTTO: The evening before he vanished — I was walking back from
      the Gasthaus around 22 Uhr. I passed Florian's workshop and
      the light was on. Normal — he works late. But there was a car
      parked on the Waldweg next to the workshop. Not a local car.
      Mannheim plates. Dark BMW. Parked in the trees where you
      wouldn't see it from the road.

      I didn't think much of it. A tourist, maybe. But now — Mannheim
      plates. Same city that buyer came from.

      Scheiße, I should have checked.
    effects: { trust_otto: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Yusuf (teen, witness) ---

  yusuf_intro:
    type: tweet
    from: yusuf
    text: >
      ey digga @florian_kessler hat mir beigebracht wie man ne uhr
      repariert. der typ ist ehrenmann. wenn qqn was weiß sagt
      bescheid alter ich dreh durch. krass dass keinen das
      interessiert scheiße
    effects: { trust_yusuf: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Yusuf -> yusuf_talk_early

  yusuf_talk_early:
    type: message
    text: >
      YUSUF: ey bist du neu hier? boah alter was ein timing. also
      florian ist der krasseste typ in tannhausen safe. der hat uns
      gezeigt wie man holz schnitzt, wie die zahnräder ineinander
      greifen, der ganze scheiß. hat uns sogar bezahlt für sachen
      schleifen und so.

      und jetzt bin ich am ausflippen weil maja hat was gesehen
      letzte woche am workshop aber sie will nicht drüber reden.
      sie sagt es war nix aber digga das war safe nicht nix
    effects: { trust_yusuf: "+10" }
    choices:
      - What did Maja see? -> yusuf_maja_hint
      - Move on -> quest1_hub

  yusuf_maja_hint:
    type: message
    text: >
      YUSUF: ich weiß nicht genau. sie war abends joggen und hat
      am workshop halt wen gesehen der da rumsteht. nicht florian.
      irgendein typ. stand einfach da und hat durch die fenster
      geguckt. und dann hat der angefangen fotos zu machen. vom
      workshop. von der tür. von allem.

      frag sie direkt aber sie ist vorsichtig mit leuten die sie
      nicht kennt. red erstmal übers fotografieren mit ihr oder
      so digga. die ist voll in dem thema
    effects: { trust_yusuf: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Tannhausen. A Black Forest village
      built around tradition and forest. A young clockmaker who was
      exposing water contamination. A disappearance nobody believes
      is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Lena (Florian's housemate) -> lena_q1
      - Talk to Hannah (Florian's girlfriend) -> hannah_q1
      - Check what Nico (Florian's brother) is saying -> nico_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lena Q1 ---

  lena_q1:
    type: tweet
    from: lena
    text: >
      wenn jemand was von @florian_kessler gehört hat meldet euch
      bitte. seine werkstatt ist auf. sein werkzeug ist da. drei
      uhren stehen halbfertig. er wäre NIE gegangen ohne das fertig
      zu machen. niemals.
    effects: { trust_lena: "+5", contacts_followed: "+1" }
    choices:
      - DM Lena -> lena_q1_talk

  lena_q1_talk:
    type: message
    text: >
      LENA: I appreciate you reaching out but I don't know you.
      Florian has a lot of friends in this village. I'm sure he'll
      come back.

      ...I keep telling myself that. I don't believe it anymore.

      [Lena is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_lena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Hannah Q1 ---

  hannah_q1:
    type: tweet
    from: hannah
    text: >
      Florian hat mir letzte Woche eine Uhr geschenkt. Handgeschnitzt.
      Er hat gesagt "Falls mal was ist, denk an mich wenn du die
      hörst." ICH WILL NICHT AN DICH DENKEN ICH WILL DASS DU DA BIST.
    effects: { trust_hannah: "+5", contacts_followed: "+1" }
    choices:
      - DM Hannah -> hannah_q1_talk

  hannah_q1_talk:
    type: message
    text: >
      HANNAH: Who are you? Another stranger who's going to tell me
      to stay calm? Fick dich, I won't stay calm.

      Florian called me the night before he disappeared. He said
      "Hannah, ich hab Beweise. Wenn mir was passiert, guck dir
      GraniTec an. Und diesen Typen aus Mannheim." Then he hung up.

      That's the last I heard from him.
    effects: { trust_hannah: "+10" }
    choices:
      - What do you think happened? -> hannah_theory
      - Move on -> quest1_hub

  hannah_theory:
    type: message
    text: >
      HANNAH: I think two things are happening. GraniTec found out
      he had water samples proving they're contaminating the
      Tannenbach. And some Hurensohn from Mannheim has been
      stalking him for months.

      Florian told me about the letters. Handwritten. Detailed.
      This person knew which clocks Florian was working on before
      he posted about them. Knew his schedule. Knew when he was
      alone in the workshop.

      He went to the police. They said "it's just a fan." A fan who
      drives four hours to stand outside your workshop at midnight.
      Ja klar. Just a fan.
    effects: { trust_hannah: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nico Q1 ---

  nico_q1:
    type: tweet
    from: nico
    text: >
      mein bruder ist VERSCHWUNDEN und die polizei sagt er ist
      vielleicht wandern??? ER WANDERT NICHT MITTEN IN DER
      AUFTRAGSZEIT. ich fahr hoch aus freiburg. scheiße mann.
    effects: { trust_nico: "+5", contacts_followed: "+1" }
    choices:
      - DM Nico -> nico_q1_talk

  nico_q1_talk:
    type: message
    text: >
      NICO: Who are you? Another person who's going to tell me
      everything is fine? Scheiße, nothing is fine.

      Florian sent me a message three days before he disappeared.
      A link to a cloud folder. He said "if something happens to
      me, send this to the Schwarzwälder Bote." I looked at it —
      water analysis reports, photos of brown water, GraniTec truck
      photos, some crazy letters from a buyer.

      The folder is still there. I haven't sent it yet because I
      keep thinking he'll come back.
    effects: { trust_nico: "+10" }
    choices:
      - What kind of letters? -> nico_letters
      - Move on -> quest1_hub

  nico_letters:
    type: message
    text: >
      NICO: Krass creepy letters. Handwritten, like old-fashioned.
      This person writes about Florian's clocks like they're
      religious artifacts. "Your Schwarzwalduhr Nr. 47 speaks to
      me on a level no one else understands." "I've built a room
      for your work. Everything is ready for you."

      And the latest one — from two weeks ago: "I know you feel
      the connection too. I've been watching you work. You're most
      beautiful at midnight, alone with the wood."

      Digga, that's not a customer. That's a stalker. And Florian
      didn't even know who it was — the letters had no return
      address. Just a Mannheim postmark.
    effects: { trust_nico: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Florian went silent. Multiple
      people saw or heard things. Piece together the timeline from
      witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Maja (was jogging near the workshop that evening) -> maja_interview
      - Find Werner (forester, patrols at dawn) -> werner_interview
      - Find Karl (baker, starts at 4am, saw something) -> karl_interview
      - Find Anke (bookshop, working late, heard something) -> anke_interview

  # --- Maja (saw someone at the workshop) ---

  maja_interview:
    type: tweet
    from: maja
    text: >
      ich war freitagabend joggen und am workshop von florian war
      irgendwer. nicht florian. ein anderer typ. ich hab mich nicht
      getraut was zu sagen. scheiße ich hätte was machen sollen
    effects: { trust_maja: "+5" }
    choices:
      - Ask Maja what she saw -> maja_talk

  maja_talk:
    type: message
    text: >
      MAJA: ok alter aber sag das keinem weiter. ich war so gegen
      21 uhr am workshop vorbei. und da stand ein typ. nicht aus
      tannhausen — der hatte ne jacke an die kein mensch hier
      trägt. so ne schicke lederjacke. und er hat durchs fenster
      geguckt. und dann hat er fotos gemacht. vom werkzeug. von
      den uhren die drin hängen. von allem.

      als er mich gesehen hat ist er zu seinem auto gerannt. dunkler
      BMW. und digga — er hatte mannheimer kennzeichen. ich hab das
      gesehen weil er direkt an mir vorbei ist.

      krass unheimlich alter. ich schwöre der war nicht zum ersten
      mal da
    effects:
      trust_maja: "+10"
      night_witnesses: "+1"
      stalking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Werner (forester, dawn patrol) ---

  werner_interview:
    type: tweet
    from: werner
    text: >
      Frühkontrolle heute Morgen. Der Tannenbach ist wieder braun.
      Und am Waldweg zum Steinbruch frische Reifenspuren. Schwere
      Fahrzeuge. In der Nacht.
    effects: { trust_werner: "+5" }
    choices:
      - Ask Werner what he saw -> werner_talk

  werner_talk:
    type: message
    text: >
      WERNER: I patrol the forest at dawn. That morning — the morning
      after Florian's last post — the Tannenbach was the colour of
      coffee. Brown water running down from the GraniTec quarry.
