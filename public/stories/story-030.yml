      I know about the BMW with plates MA-HB 417 parked outside the
      workshop at night. I know he was photographing through the
      windows. I have IP logs, witness testimonies, and the access
      records."
    choices:
      - Send -> stalker_response

  stalker_response:
    type: message
    text: >
      @SchwarzerZeiger doesn't reply. The account is deleted within
      minutes.

      But Tobias has already archived everything. And you've sent
      the evidence package to Kommissarin Neumann and to Judith
      Kramer.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE STALKER

      Three things happen in quick succession.

      Kommissarin Neumann traces the registration MA-HB 417 to
      Heinrich Brückner, 43, Mannheim-Neckarstadt. His apartment
      is searched. An entire room is filled with Florian's clocks,
      photographs of the workshop taken through windows, copies of
      Florian's social media posts printed and pinned to the walls,
      and a journal detailing every visit to Tannhausen over six
      months. Brückner is arrested under §238 StGB — Nachstellung.

      Judith Kramer, armed with Florian's complete water
      contamination dossier, publishes the GraniTec story in the
      Schwarzwälder Bote. It's picked up by SWR. The
      Regierungspräsidium orders an unannounced inspection. The
      buried barrels are found. GraniTec is shut down pending
      Umweltsanierung. Michael Roth faces criminal charges for
      illegal waste disposal. The Bürgermeister is questioned.

      And Florian Kessler, reading the news from a cabin near
      Titisee, calls his brother for the first time in ten days.

      "Ich komme nach Hause. Die Uhren warten."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: florian
    text: >
      die werkstatt ist offen. die uhren ticken. der tannenbach
      wird wieder klar. danke dass ihr nicht aufgegeben habt.
    choices:
      - The End -> game_complete

  # --- ENDING B: Michael Roth (Partial Ending) ---

  confront_michael:
    type: message
    text: >
      You present the contamination evidence to Michael Roth:

      "I have certified water analyses showing cadmium at 12 times
      the legal limit. I have GPS-tagged photos of your illegal
      drainage channel. I have photos of barrels with GraniTec batch
      numbers buried by the Tannenbach. I have four years of
      monitoring data from the Schwarzwaldwächter. I have it all."
    choices:
      - Send -> michael_response

  michael_response:
    type: message
    text: >
      MICHAEL: GraniTec Schwarzwald GmbH operates in full compliance
      with all environmental regulations. These allegations are
      geschäftsschädigend and will be addressed through our legal
      department. Any publication will result in immediate
      Unterlassungsklage.

      But it's too late. You've sent the evidence to Judith, to the
      Schwarzwaldwächter, and directly to the Regierungspräsidium.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The contamination story breaks. GraniTec is ordered to halt
      operations pending investigation. The quarry may close. Eighty
      jobs hang in the balance. The village is divided.

      But Florian?

      Without the stalking evidence, Brückner is never investigated.
      He continues to visit Tannhausen. He continues to watch the
      workshop. He creates new accounts, buys clocks from other
      makers, but always comes back to Florian's village.

      Two months later, Florian reads about GraniTec online. He
      returns quietly. He installs security cameras. He changes
      the workshop lock. He never works alone at night again.

      The corporation is exposed. But the person who terrorised
      Florian walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: florian
    text: "ich bin zurück. das wasser wird sauberer. die werkstatt hat jetzt kameras."
    choices:
      - The End -> game_complete

  # --- ENDING C: Bürgermeister (Wrong Ending) ---

  confront_norbert:
    type: message
    text: >
      You confront Bürgermeister Staufer with your evidence.

      Within hours, you receive a response from a Freiburg law firm:
    choices:
      - Read the response -> norbert_response

  norbert_response:
    type: tweet
    from: gemeinde
    text: >
      Die Gemeinde Tannhausen nimmt die Anschuldigungen zur
      Kenntnis. Jede öffentliche Verbreitung diffamierender
      Behauptungen wird rechtliche Konsequenzen nach sich ziehen.
      — Kanzlei Schreiber & Partner, Freiburg
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The Bürgermeister's lawyer buries your accusation. Without a
      direct link between Staufer and GraniTec's dumping — and there
      isn't one beyond political protection — your evidence is
      misdirected.

      GraniTec continues to dump. Brückner continues to watch.
      Florian stays in hiding.

      Six months later, @SchwarzerZeiger creates a new account. It
      follows Florian's brother.
    choices:
      - The End -> game_complete

