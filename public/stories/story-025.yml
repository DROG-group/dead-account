# DEAD ACCOUNT — Story 025: Rovtarje (Slovenia)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-025.yml
#
# Player investigates the disappearance of young caver/geologist Žan Kavčič
# in the fictional alpine village of Rovtarje, near the caves of the Julian Alps.

