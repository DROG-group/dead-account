  title: "Dead Account — Rovtarje"
  state:
    # Trust levels per NPC (0-100)
    trust_nina: 0
    trust_luka: 0
    trust_maja: 0
    trust_bor: 0
    trust_tilen: 0
    trust_anja: 0
    trust_jan: 0
    trust_rok: 0
    trust_meta: 0
