      INŠPEKTOR NOVAK: Neuradno — in mislim res neuradno — hotel
      sem preiskat Kamnolom Triglav. Nadrejeni so mi rekli naj se
      ustavim. Rekel je da ima okrožno tožilstvo "pristojnost."
      To je koda za "ne tiči se."

      Situacija z Zupanom je drugačna. Za to pa sploh nisem vedel
      do zdaj. Če imaš dokaze o zalezovanju, lahko ukrepam. To je
      jasno moja pristojnost.

      Prinesi mi nekaj trdnega in ponovno odprem primer.
    effects:
      trust_policist: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Žan than anyone in Rovtarje. Who is responsible?
    choices:
      - Confront Luka Zupan (the obsessive partner) -> confront_luka
        when:
          state: obsession_evidence
          gte: 5
      - Confront Igor Černič (the quarry director) -> confront_igor
        when:
          state: quarry_evidence
          gte: 3
      - Confront Mayor Kovač (political protection) -> confront_gregor
      - I need more evidence -> investigation_hub

  # --- ENDING A: Luka (Best Ending) ---

  confront_luka:
    type: message
    text: >
      You present your evidence to Luka:

      "I know @hana_podgornik is your account. I know you put a GPS
      tracker on Žan's car. I know you accessed his files at the
      university. I know you were watching his house. I have
      witnesses and I have the access logs."
    choices:
      - Send -> luka_response

  luka_response:
    type: message
    text: >
      Luka doesn't reply for a long time. Then:

      LUKA: Ne razumeš. Ščitil sem ga. V nevarnosti je bil od
      kamnoloma in ni pustil da mu pomagam. Moral sem vedet da je
      varen. Vse kar sem naredil je bilo ker mi je mar za njega.
      Za jame. Za najino delo.

      That's not care. That's obsession.

      You've already sent the evidence to Inšpektor Novak. And to
      Aleš Turk.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Inšpektor Novak reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the
      witness testimonies — Luka is arrested for stalking and
      harassment. A GPS tracker is recovered from under Žan's
      Renault at a mountain hut parking lot above the village.

      Aleš Turk, finally in possession of Žan's full evidence
      package, publishes the Kamnolom Triglav story in Delo and
      Dnevnik. The environmental agency orders an unannounced
      inspection. The quarry is shut down pending environmental
      remediation. Igor Černič faces criminal charges for illegal
      mining in a protected area, falsifying impact assessments,
      and bribing inspectors. The bribed inspector Marko Božič is
      suspended.

      And Žan Kavčič, reading the story from a friend's house in
      Bled, calls his sister for the first time in nine days.

      "Prihajam domov."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: zan
    text: >
      kras ne laže. in ljudje rovtarij tudi ne. hvala da niste
      odnehali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Igor (Partial Ending) ---

  confront_igor:
    type: message
    text: >
      You present the quarry evidence to Igor Černič:

      "I have photographs of blast damage inside Gallery C. I have
      geological surveys showing your quarry is mining inside a
      protected cave system. I have your original technician reports
      showing the data was falsified. I have evidence of bribed
      inspectors."
    choices:
      - Send -> igor_response

  igor_response:
    type: message
    text: >
      IGOR: Ta pogovor bo posredovan naši pravni službi. Vsaka
      objava obrekljivih materialov bo imela takojšnje pravne
      posledice. Kamnolom Triglav je vedno deloval v skladu z
      regulativnimi zahtevami.

      But it's too late. You've sent the evidence to Aleš, to the
      Jamarsko društvo, and to the environmental agency.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The quarry story breaks. Kamnolom Triglav is ordered to halt
      all blasting pending investigation. The quarry may close
      permanently. A hundred and fifty jobs hang in the balance.
      The village is divided.

      But Žan?

      Without the stalking evidence, Luka is never investigated.
      He continues to work at the university. He continues to
      monitor Žan's accounts. He creates a new anonymous profile.

      Three months later, Žan reads about Kamnolom Triglav online.
      He returns quietly. He changes research groups. He stops
      caving alone. He checks his car every morning.

      The corporation is exposed. But the person who terrorised
      Žan walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: zan
    text: "sem nazaj. jame so varnejše. ostalo... bomo vidli."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_gregor:
    type: message
    text: >
      You confront Mayor Kovač with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> gregor_response

  gregor_response:
    type: tweet
    from: vid
    text: >
      Naš klient je seznanjen z vašimi navedbami. Vsaka javna
      objava obrekljivih izjav bo predmet takojšnjega pravnega
      postopka. — Pisarna Bergant & Partnerji, Ljubljana
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Kovač and Kamnolom Triglav's illegal mining —
      and there isn't one beyond political protection — your
      evidence is insufficient.

      Kamnolom Triglav continues to blast. Luka continues to watch.
      Žan stays in hiding.

      Six months later, @hana_podgornik creates a new account. It
      follows Žan's sister.

      The stalactites in Gallery C, a hundred thousand years old,
      collapse from blasting vibrations. Nobody photographs them
      this time.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: ROVTARJE — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Quarry evidence: ${quarry_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Žan's story explores themes of
      corporate impunity, environmental destruction, obsessive
      behaviour, community solidarity, and the courage to speak up.

      If you or someone you know is experiencing stalking,
      harassment, or needs someone to talk to:
      Zaupni telefon: 116 123
      Policija: 113
      TOM telefon za otroke in mladostnike: 116 111
