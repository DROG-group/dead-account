      bio: "jamar | žanov ekspedicijski partner | skupaj sva odkrivala rove"
      avatar: avatars/luka.jpg
    maja:
      name: "Maja Horvat"
      bio: "žanova punca | biologinja | narava je vse | pogrešam te"
      avatar: avatars/maja.jpg

    # === Local Government ===
    gregor:
      name: "Gregor Kovač"
      bio: "Župan Rovtarij | Za razvoj naše skupnosti | #RovtarjeRaste"
      avatar: avatars/gregor.jpg
    petra:
      name: "Petra Vidmar"
      bio: "občinska svetnica za okolje | Rovtarje | narava je naša dediščina"
      avatar: avatars/petra.jpg
    obcina:
      name: "Občina Rovtarje"
      bio: "Uradni račun | Občinske novice | Pon-Pet 8:00-15:00"
      avatar: avatars/obcina.jpg

    # === Local Business & Community ===
    bor:
      name: "Bor Krajnc"
      bio: "Gostilna pri Medvedu | domača hrana | žganje | odprti od '92"
      avatar: avatars/bor.jpg
    gostilna:
      name: "Gostilna pri Medvedu"
      bio: "Domači štruklji | Jabolčni zavitek | Žganje iz Tolminca | Srce Rovtarij"
      avatar: avatars/gostilna.jpg
    rok:
      name: "Rok Šuštar"
      bio: "gorski vodnik | 30 let v alpah | te gore so moje življenje"
      avatar: avatars/rok.jpg
    meta_k:
      name: "Meta Kuhar"
