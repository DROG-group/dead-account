    # === Suspicious / Other ===
    zala:
      name: "Zala Kern"
      bio: "tehničarka | Kamnolom Triglav | delam svoje delo pa je to"
      avatar: avatars/zala.jpg
    hana:
      name: "Hana Podgornik"
      bio: "."
      avatar: avatars/anon.jpg
    policist:
