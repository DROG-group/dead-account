      bio: "Policijska postaja Rovtarje | Območna enota | nujni klici: 113"
      avatar: avatars/policist.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN ROVTARJE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to rovtarje.social — the community Mastodon instance for
      the alpine village of Rovtarje, nestled beneath the Julian Alps in
      northwestern Slovenia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @zan_kavcic.

      A young geologist. Caver. Underground photographer. He mapped
      the cave systems beneath the Alps. People are worried. He hasn't
      posted in six days.
    choices:
      - Look at his profile -> zan_profile

  zan_profile:
    type: tweet
    from: zan
    text: "Kamnolom se širi v jamski sistem. Videl sem razpoke v galeriji C. To ni naravno. Nekdo minira preblizu. Imam dokaze."
    choices:
      - That's his last real post... -> dark_photo

  dark_photo:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a pitch-black photograph. Blurred, shot from below. What might be
      a cave ceiling, or might be nothing at all. Posted at 2am. No
      caption.

      His friends say that's not his style. The police say he probably
      went on an unplanned expedition. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: policist
    text: >
      Prejeli smo prijavo o pogrešani osebi iz Rovtarij. Na tej
      stopnji ni dokazov o kaznivem dejanju. Oseba je izkušen jamar
      in se morda nahaja na terenu. Vse koristne informacije
      sporočite na 113.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @nina_oblak is desperate.
      His girlfriend @maja_horvat hasn't slept. His expedition partner
      @luka_zupan is posting frantic messages. The mountain guide
      @rok_sustar says the caves near the quarry have been unstable
      for months.

      And the journalist @ales_turk is strangely silent.

      Nobody buys the police's line. Nobody thinks Žan just went on
      an "unplanned expedition."
    effects: { trust_nina: "+5", trust_maja: "+5" }
    choices:
      - Start following Žan's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Rovtarje. Follow Žan's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Bor (gostilna owner, knows everyone) -> bor_intro
      - Talk to Rok (mountain guide, knows the caves) -> rok_intro
      - Talk to Tilen (teen climber, seems shaken) -> tilen_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Žan with the rhythms of a small
      alpine village: weather warnings for the mountains, the
      gostilna's daily menu, beekeeping updates, trail conditions.

      Key names surface: Nina (sister, teacher), Luka (expedition
      partner, seems rattled), Maja (girlfriend, biologist), and
      the teens — Tilen, Anja, Jan — who idolised Žan's
      underground photography.

      Also prominent: Kamnolom Triglav d.o.o., the quarry operation
      at the edge of the village. Their posts are corporate PR. Žan's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Bor -> bor_intro
      - Talk to Rok -> rok_intro
      - Talk to Tilen -> tilen_intro

  # --- Bor (social map) ---

  bor_intro:
    type: tweet
    from: bor
    text: >
      Gostilna je odprta ampak srce ni. @zan_kavcic, tvoja miza te
      čaka. Vrni se hitro, fant.
    effects: { trust_bor: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Bor -> bor_talk

  bor_talk:
    type: message
    text: >
      BOR: A, ti si nov tu? Dobrodošel. Slab čas za prihod, stari.
      Vsi so na trnih zaradi Žana.

      Povem ti kdo je kdo. Nina je Žanova sestra, učiteljica. Luka
      Zupan je Žanov ekspedicijski partner — ampak Luka je poseben
      tip. Ful intenziven glede Žana. Obseden s tistimi jamami.
      Maja je Žanova punca, biologinja. Žan je bil srečen z njo.

      Pa Aleš Turk — novinar — on in Žan sta delala na nečem skupaj.
      Neka zadeva z kamnolomom. Aleš ni spregovoril besede odkar je
      Žan izginil. To ni normalno.

      Ne zaupaj PR objavam od Kamnoloma Triglav. Laži zavite v ISO
      certifikate, jebenti.
    effects: { trust_bor: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Luka -> bor_luka
      - Ask about Kamnolom Triglav -> bor_kamnolom
      - Thank him and move on -> quest1_hub

  bor_luka:
    type: message
    text: >
      BOR: Luka? Žan ga je spoznal pred tremi leti na jamarskem
      tečaju. Luka je bil takoj obseden. Ne s Žanom kot osebo,
      razumeš — z jamami. Z odkritji. Hotel je bit prvi povsod.
      Najtežji rovi, najgloblji prehodi. Žan je bil bolj previden,
      Luka pa je tlačil naprej ne glede na tveganje.

      Žan mi je enkrat rekel: "Luka ne razume besede ne. Če rečem,
      da je preveč nevarno, gre sam." Mislil sem, da govori
      profesionalno. Zdaj pa nisem več prepričan.

      Po tistem ko je Žan začel raziskovat kamnolom, je Luka postal
      še hujši. Hotel je bit del vsega. Žan ga je poskusil izključit
      in Luka je ful popizdil.
    effects: { trust_bor: "+5" }
    choices:
      - Ask about Kamnolom Triglav -> bor_kamnolom
      - Move on -> quest1_hub

  bor_kamnolom:
    type: message
    text: >
      BOR: Kamnolom je tu od osemdesetih. Kopljejo apnenec, agregat,
      karkoli. Vas ga je tolerirala ker daje službe. Ampak zadnja
      leta se širijo. Kupili so novo koncesijo, bližje gori. In
      miniranja so postala hujša — tresljaji, razpoke v hišah.

      Žan je bil prvi ki je dejansko šel dol v jame z opremo in
      dokumentiral škodo. Imel je slike razpok v galeriji C —
      galeriji ki je na seznamu naravne dediščine. Imel je dokaze da
      minirajo preblizu zaščitenega sistema. Dva tedna pozneje je
      izginil.

      Naredi si sam sliko, stari.
    effects: { trust_bor: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Rok (the caves, witness tease) ---

  rok_intro:
    type: tweet
    from: rok
    text: >
      trideset let hodim po teh gorah. tresljaji od kamnoloma so
      vsako leto hujši. @zan_kavcic je imel prav. in zdaj ga ni.
      povezite si.
    effects: { trust_rok: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Rok -> rok_talk

  rok_talk:
    type: message
    text: >
      ROK: Na teh gorah sem od petnajstega leta. Poznam vsako pot,
      vsak vhod v jamo, vsak zvok ki ga gore naredijo. In povem ti —
      tresljaji od kamnoloma tresejo stene jam. Stalaktiti padajo.
      Prehodi se zapirajo.

      Žan je dokumentiral vse. Šel je dol s kamero in merilno opremo.
      Imel je dokaze da miniranja uničujejo jamski sistem, ki je star
      sto tisoč let. Gradil je primer. In potem — puf — ga ni.

      Misliš da je to naključje? Jaz ne verjamem v naključja v gorah.
    effects: { trust_rok: "+10" }
    choices:
      - Did you see anything unusual recently? -> rok_night
      - Move on -> quest1_hub

  rok_night:
    type: message
    text: >
      ROK: Noč preden je izginil — vračal sem se z nočnega obhoda,
      okoli enajstih. Videl sem luči pri vhodu v galerijo C. Ne
      naglavne svetilke — avtomobilske žaromete. Dva avtomobila
      parkirana pri gozdni cesti. Eden je bil Žanov stari Renault.
      Drug pa črn SUV s tablicami Kamnolom Triglav.

      Ob enajstih zvečer. Pri vhodu v jamo.

      Zapisal sem si. Nihče me ni vprašal po tem.
    effects: { trust_rok: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tilen (teen climber, witness tease) ---

  tilen_intro:
    type: tweet
    from: tilen
    text: >
      stari to je ful hudo @zan_kavcic on je tist ki me je naučil
      plezat varno in me pel v jame. ni šans da je sam odšel nekam
      brez da komu pove. če kdo ve kej povejte pls
    effects: { trust_tilen: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tilen -> tilen_talk_early

  tilen_talk_early:
    type: message
    text: >
      TILEN: lol a si nov tu? sranje timing stari. sej žan je
      res najboljši človek v tej vasi. nas je učil plezat, nas je
      peljal v jame, nam razlagal geologijo pa to. ful kul tip.

      pa zdej sm ful v bedu ker jan je videl nek čuden kurac zadnič
      pri kamnolomu ampak noče govort o tem. pravi da ni nič ampak
      sej ni nič stari, to ni normalno sah
    effects: { trust_tilen: "+10" }
    choices:
      - What did Jan see? -> tilen_jan_hint
      - Move on -> quest1_hub

  tilen_jan_hint:
    type: message
    text: >
      TILEN: ne vem natančno. bil je na bajku pri kamnolomu zvečer in
      je videl nekoga ki je prelagal zadeve iz žanovga avta?? al pa
      nekej tazga. ful se boji pa noče govort. probej mu najprej
      govort o bajkanju al pa plezanju lol pol se bo mogoče odprl.
      ampak je ful nezaupljiv do folka ki ga ne pozna, veš
    effects: { trust_tilen: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Rovtarje. A Slovenian alpine village
      built around the mountains and their caves. A young geologist who
      was exposing quarry damage. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Maja (Žan's girlfriend) -> maja_q1
      - Talk to Luka (Žan's expedition partner) -> luka_q1
      - Check what Nina (Žan's sister) is saying -> nina_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Maja Q1 ---

  maja_q1:
    type: tweet
    from: maja
    text: >
      če ima kdorkoli novice o @zan_kavcic me prosim pokličite.
      njegova oprema je doma. njegov nahrbtnik za jame je tu.
      nikoli ne bi šel brez opreme.
    effects: { trust_maja: "+5", contacts_followed: "+1" }
    choices:
      - DM Maja -> maja_q1_talk

  maja_q1_talk:
    type: message
    text: >
      MAJA: Hvala da se javljaš ampak te ne poznam. Žan ima
      veliko prijateljev tu. Prepričana sem da se bo vrnil.

      ...to si ponavljam. Ne verjamem več.

      [Maja is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_maja: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Luka Q1 ---

  luka_q1:
    type: tweet
    from: luka
    text: >
      Laboratorij je prazen brez @zan_kavcic. Njegovi vzorci kamnin
      so še na polici. Njegovi jamski dnevniki so na mizi. Nikoli ne
      bi zapustil tekoče raziskave. Nekaj se je zgodilo.
    effects: { trust_luka: "+5", contacts_followed: "+1" }
    choices:
      - DM Luka -> luka_q1_talk

  luka_q1_talk:
    type: message
    text: >
      LUKA: Žan in jaz delava skupaj že tri leta. On je najboljši
      jamar ki ga poznam. Ta zadeva s kamnolomom — vse mu je
      pomenila. Imel je podatke, slike, geološke analize. Bil je
      tako blizu da gre v javnost.

      Ponudil sem se da mu pomagam. Večkrat. Rekel je da ima pod
      kontrolo. Rekel je da dela z nekim novinarjem. Jaz sem samo
      hotel podpret.

      [Luka seems earnest. Or obsessive?]
    effects: { trust_luka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nina Q1 ---

  nina_q1:
    type: tweet
    from: nina
    text: >
      moj brat je IZGINIL in policija mi govori da je morda na
      terenu??? NE GERE NA TEREN BREZ DA POVE. prihajam iz šole
      takoj. nekdo mi bo razložil.
    effects: { trust_nina: "+5", contacts_followed: "+1" }
    choices:
      - DM Nina -> nina_q1_talk

  nina_q1_talk:
    type: message
    text: >
      NINA: Kdo si? Še en človek ki mi bo rekel naj se pomirim?
      Moj brat me je poklical tisto noč preden je izginil. Rekel
      je da ima nekaj velikega. Rekel je "če se karkoli zgodi,
      poglej Kamnolom Triglav." Potem je odložil.

      To je zadnje kar sem slišala od njega.
    effects: { trust_nina: "+10" }
    choices:
      - What do you think happened? -> nina_theory
      - Move on -> quest1_hub

  nina_theory:
    type: message
    text: >
      NINA: Mislim da je našel dokaze da Kamnolom Triglav uničuje
      zaščiten jamski sistem in so ga utišali. Ampak mislim tudi da
      tisti njegov partner — Luka — ve več kot govori. Način kako
      govori o njem... to ni samo profesionalna skrb. Je nekaj
      drugega.

      Žan mi je pred meseci povedal da nekdo vdira v njegove datoteke
      na univerzi. Mislil je da ni nič. Jaz mislim da je bilo.

      In zadnje čase je Luka postal čuden. Ljubosumen. Na Majo, na
      novinarja, na vse ki so imeli dostop do Žana ki ga Luka ni
      imel. To ni normalno vedenje, sranje.
    effects: { trust_nina: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Žan went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Jan (was biking near the quarry at dusk) -> jan_interview
      - Find Rok (mountain guide, was on night patrol) -> rok_interview
      - Find Urška (beekeeper, early morning in the hills) -> urska_interview
      - Find Matej (forester, heard explosions) -> matej_interview

  # --- Jan (saw someone at Žan's car) ---

  jan_interview:
    type: tweet
    from: jan
    text: >
      good session danes na bajku ampak vibes pri kamnolomu so ful
      čudni zadnje cajte. nek sranje se dogaja tam stari ne vem
      razložit
    effects: { trust_jan: "+5" }
    choices:
      - Ask Jan about that evening -> jan_talk

  jan_talk:
    type: message
    text: >
      JAN: ok stari ampak nikomur ne povej ja? bil sm na bajku pri
      kamnolomu okol sedmih zvečer. in sm videl tistga tipa — luko —
      pri žanovem avtu. gledal je noter al pa dajal nek kurac not.
      ko me je zagledal je odpizdil ful hitro.

      mislm sej jst nism nič reku ker nism hotu problemov ampak to
      je ful čudno sah. ni normalno to vedenje stari
    effects:
      trust_jan: "+10"
      cave_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Rok (saw late-night meeting at cave entrance) ---

  rok_interview:
    type: tweet
    from: rok
    text: >
      Opomnik: gozdne ceste so zaprte po 20. uri. V zadnjih nočeh
      sem opazil nedovoljen promet pri vhodu v galerijo C.
    effects: { trust_rok: "+5" }
    choices:
