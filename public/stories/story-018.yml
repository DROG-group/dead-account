    # === Local Business & Community ===
    feri:
      name: "Ferenc 'Feri' bácsi Horváth"
      bio: "a Meleg Forrás vendéglő | bográcsgulyás | házi pálinka | 1991 óta"
      avatar: avatars/feri.jpg
    vendeglo:
      name: "Meleg Forrás Vendéglő"
      bio: "Magyar konyha | Házi tészta | Élőzene pénteken | Hévízkút szíve"
      avatar: avatars/vendeglo.jpg
    janos:
