      Same writing patterns — the way she uses "..." at the
      end of sentences, the same Hungarian spelling habits,
      the same emotional escalation style. Same knowledge of
      Bence's daily routine that only someone intimately
      familiar with him would have.

      And one post from @hevizkuti_igazsag: "Your rendition
      of 'Tavaszi szél' at Thursday rehearsal was
      breathtaking." Thursday rehearsals are not public.
      Only people present — or watching from outside — would
      know.

      It's Réka. The anonymous account is Réka.
    effects:
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # --- Feri bácsi on the breakup ---

  feri_breakup:
    type: message
    text: >
      FERI BÁCSI: A Réka szép lány, de a kurva életbe,
      nem normális ahogy viselkedik. A Bence háromszor
      próbált szakítani vele. Háromszor! Az első kettőnél
      a Réka olyan jelenetet csinált a vendéglőben hogy
      mindenki látta.

      A harmadiknál Bence nem személyesen mondta, hanem
      üzenetben. A Réka bejött ide és két órán át sírt.
      Aztán kiment és leüllt a kocsijába Bence háza elé.

      Éjszaka. Sötétben. Három órán át.

      Mondtam a Bencének, figyelj már, ez nem normális.
      Azt mondta: "Tudom, Feri bácsi. De mit csináljak?
      A rendőrség azt mondja, amíg nem csinál semmit,
      nem tehetnek semmit."
    effects:
      trust_feri: "+10"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # --- Rendőr ---

  rendor_interview:
    type: message
    text: >
      FŐTÖRZSŐRMESTER FEKETE: Ez nem hivatalos — és úgy is
      értem, teljesen nem hivatalos. Az AquaTherm-ügyet nem
      vizsgálhatom. A felettesem azt mondta, a hatóságé a
      jogkör. Ez annyit tesz: ne nyúlj hozzá.

      A Réka-ügy más. Erről nem is tudtam eddig. Ha van
      bizonyítékod zaklatásra, azt tudom kezelni. Az
      egyértelműen az én hatásköröm.

      Hozz nekem valami szilárd dolgot és újranyitom az
      ügyet.
    effects:
      trust_rendor: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Bence than anyone in Hévízkút. Who is responsible?
    choices:
      - Confront Réka Varga (the obsessive ex) -> confront_reka
        when:
          state: obsession_evidence
          gte: 5
      - Confront Gergely Pintér (the AquaTherm director) -> confront_gergely
        when:
          state: corporate_evidence
          gte: 3
      - Confront Mayor Kovács (political corruption) -> confront_tibor
      - I need more evidence -> investigation_hub

  # --- ENDING A: Réka (Best Ending) ---

  confront_reka:
    type: message
    text: >
      You present your evidence to Réka:

      "I know @hevizkuti_igazsag is your account. I know you put a
      GPS tracker in Bence's backpack. I know you were watching
      his flat every night. I know you followed him the night he
      disappeared. I have witnesses and I have your posting history."
    choices:
      - Send -> reka_response

  reka_response:
    type: message
    text: >
      Réka doesn't reply for a long time. Then:

      RÉKA: Nem érted. Védtem őt. Veszélyben volt az AquaTherm
      miatt és nem hagyott segíteni. Tudnom kellett hogy
      biztonságban van. Mindent azért csináltam mert szeretem.

      That's not love. That's obsession.

      You've already sent the evidence to Főtörzsőrmester Fekete.
      And to Petra Lakatos.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Főtörzsőrmester Fekete reopens the case. With your evidence —
      the anonymous account, the GPS tracker, the surveillance, the
      witness testimonies — Réka is arrested for stalking and
      harassment. A GPS tracker is recovered from Bence's backpack,
      found in the old wine cellars behind the hill.

      Petra Lakatos, finally in possession of Bence's full evidence
      package, publishes the AquaTherm story in HVG. The authorities
      order an immediate halt to drilling. The illegal contract
      between Mayor Kovács and AquaTherm is exposed. Kovács resigns.
      Pintér Gergely faces criminal charges for environmental damage
      and data falsification.

      And Bence Szilágyi, reading the article from a friend's flat
      in Pécs, calls his brother for the first time in nine days.

      "Tesó, hazamegyek."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: bence
    text: >
      a víz a miénk. a zene a miénk. a forrás nem eladó.
      köszönöm hogy nem adtátok fel.
    choices:
      - The End -> game_complete

  # --- ENDING B: Gergely (Partial Ending) ---

  confront_gergely:
    type: message
    text: >
      You present the privatization evidence to Gergely Pintér:

      "I have water analysis proving your drilling is destroying
      the thermal spring. I have your falsified reports. I have
      the illegal contract with the mayor. I have witnesses who
      saw you at the community centre that night."
    choices:
      - Send -> gergely_response

  gergely_response:
    type: message
    text: >
      GERGELY: Ezt a beszélgetést a jogi osztályunkhoz
      továbbítom. Bármilyen rágalmazó anyag terjesztése
      azonnali jogi eljárást von maga után. Az AquaTherm
      minden jogszabályi előírásnak megfelel.

      But it's too late. You've sent the evidence to Petra, to
      the Forrásőrök, and to the environmental authority.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The privatization story breaks. AquaTherm is ordered to halt
      all drilling. Mayor Kovács faces a no-confidence vote. The
      town is divided — some feared losing jobs, but most are
      furious about the secret contract.

      But Réka?

      Without the stalking evidence, Réka is never investigated.
      She continues to watch Bence's empty flat. She continues
      to monitor his accounts. She creates a new anonymous profile.

      Three months later, Bence reads about AquaTherm online.
      He returns quietly. He changes his rehearsal schedule. He
      locks his backpack. He checks his belongings every morning.
      He doesn't play at the vendéglő anymore.

      The corporation is exposed. But the person who terrorized
      Bence walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: bence
    text: "hazajöttem. a víz megmenekült. a többi... majd meglátjuk."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_tibor:
    type: message
    text: >
      You confront Mayor Kovács with your evidence.

      Within the hour, you receive a message from his lawyer:
    choices:
      - Read the response -> tibor_response

  tibor_response:
    type: tweet
    from: boglarka
    text: >
      Ügyfelünk tudomásul veszi az Ön állításait. Bármilyen
      rágalmazó tartalom nyilvánosságra hozatala azonnali
      peres eljárást von maga után. — Mészáros & Társai
      Ügyvédi Iroda, Budapest
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Kovács and Bence's disappearance — and there
      isn't one beyond political protection — your evidence is
      insufficient.

      AquaTherm continues to drill. Réka continues to watch.
      Bence stays in hiding.

      Six months later, @hevizkuti_igazsag creates a new account.
      It follows Bence's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: HÉVÍZKÚT — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Bence's story explores themes of
      corporate greed, political corruption, obsessive behaviour,
      community solidarity, and the courage to protect what
      belongs to everyone.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
