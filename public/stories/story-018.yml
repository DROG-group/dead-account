# DEAD ACCOUNT — Story 018: Hévízkút (Hungary)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-018.yml
#
# Player investigates the disappearance of young folk musician Bence Szilágyi
# in the fictional Hungarian thermal spa town of Hévízkút.

