    forras_egylet:
      name: "Forrásőrök Egyesület"
      bio: "A hévízkúti termálvíz védelméért | Önkéntesek | Szennyezés-bejelentések"
      avatar: avatars/forras_egylet.jpg

    # === Suspicious / Other ===
    eszter:
      name: "Eszter Papp"
      bio: "laboráns | AquaTherm Kft. | dolgozom, ennyi"
      avatar: avatars/eszter.jpg
    anon_account:
      name: "Hévízkúti Igazság"
      bio: "."
      avatar: avatars/anon.jpg
    rendor:
      name: "Főtörzsőrmester Fekete"
      bio: "Hévízkút Rendőrőrs | Körzeti megbízott | Segélyhívó: 112"
      avatar: avatars/rendor.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN HÉVÍZKÚT
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to hévízkút.közösség — the community Mastodon instance for
      the thermal spa town of Hévízkút, Hungary.

      The local feed is buzzing with worry. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @bence_szilagyi.

      A young folk musician. Hurdy-gurdy player. He played at every
      festival, every wedding, every funeral. He documented the town's
      thermal springs through music. People are scared. He hasn't
      posted in six days.
    choices:
      - Look at his profile -> bence_profile

  bence_profile:
    type: tweet
    from: bence
    text: "A termálvíz a miénk. Nem eladó. Nem privatizálható. Akinek nem tetszik, az nézzen a szemembe."
    choices:
      - That's his last real post... -> grey_steam

  grey_steam:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      steam rising from dark water. Blurred, shot at a strange angle.
      Posted at 4am. No caption.

      His friends say that's not him. Bence always wrote long, poetic
      captions. The police say he probably went to Budapest. Something
      doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: rendor
    text: >
      Bejelentés érkezett egy hévízkúti lakos eltűnéséről.
      Jelenlegi ismereteink szerint bűncselekményre utaló
      nyom nem merült fel. Információval rendelkezők
      hívják a 112-es segélyhívót.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are a mess. His ex-girlfriend @reka_varga is posting
      frantic messages. His brother @zoltan_szilagyi is driving down
      from Győr. His student @lili_nemeth is begging for information.
      The old bath master @janos_molnar says Bence was right about the
      water.

      And the journalist @petra_lakatos has gone strangely quiet.

      Nobody buys the police line. Nobody thinks Bence just
      "went to Budapest."
    effects: { trust_reka: "+5", trust_zoltan: "+5" }
    choices:
      - Start following Bence's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Hévízkút. Follow Bence's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Feri bácsi (pub owner, knows everyone) -> feri_intro
      - Talk to János (bath master, worried about the water) -> janos_intro
      - Talk to Máté (teen, seems scared) -> mate_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Bence with the rhythms of a small
      Hungarian spa town: thermal bath schedules, market day
      announcements, weather warnings for the vineyards.

      Key names surface: Réka (ex-girlfriend, beautician at the spa),
      Zoltán (brother, trucker), Lili (student, shaken), and the teens
      — Máté, Dorina, Ádám — who worshipped Bence's music.

      Also prominent: AquaTherm Kft., the company trying to privatize
      the thermal springs. Their posts are corporate PR. Bence's posts
      were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Feri bácsi -> feri_intro
      - Talk to János -> janos_intro
      - Talk to Máté -> mate_intro

  # --- Feri bácsi (social map) ---

  feri_intro:
    type: tweet
    from: feri
    text: >
      Nyitva van a Meleg Forrás de nem ugyanaz nélküle.
      @bence_szilagyi, a te széked itt vár. A pálinka is.
      Gyere haza fiam.
    effects: { trust_feri: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Feri bácsi -> feri_talk

  feri_talk:
    type: message
    text: >
      FERI BÁCSI: Á, új vagy? Üdv, öcskös. Szar időben jössz.
      Mindenki ki van akadva a Bence miatt.

      Hadd mondjam el ki kicsoda. Réka a volt barátnője — a
      termálfürdőnél dolgozik, a kozmetikán. Szép lány, de amióta
      szakítottak, kicsit... gáz a helyzet. Nem engedte el a
      dolgot. Zoltán a bátyja, kamionos, jön le Győrből.
      Lili a tanítványa, furulyázni tanítja — tanította — a
      kis csajt.

      Petra Lakatos az újságíró — ő meg a Bence dolgoztak
      együtt valamin. A vízről. De amióta Bence eltűnt, Petra
      egy szót sem szól. Az nem normális.

      Ja, és az AquaTherm-es PR-hülyeségekre ne figyelj. Hazugság
      az egész, szép csomagolásban.
    effects: { trust_feri: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Réka -> feri_reka
      - Ask about AquaTherm -> feri_aquatherm
      - Thank him and move on -> quest1_hub

  feri_reka:
    type: message
    text: >
      FERI BÁCSI: Réka? Hát nézd, a lány odáig volt a Bencéért.
      Két évig voltak együtt. Aztán Bence szakított, valami
      olyasmit mondott, hogy "túl intenzív" neki a dolog.

      De a Réka nem bírta elengedni. Ide járt a vendéglőbe minden
      este, amikor Bence játszott. Ott ült az első sorban. Bence
      feszengett tőle, láttam rajta. Egyszer mondta nekem: "Feri
      bácsi, ez a lány nem hagy békén. Mindenhol ott van."

      Hát, akkor nem gondoltam bele. Most már igen.
    effects: { trust_feri: "+5" }
    choices:
      - Ask about AquaTherm -> feri_aquatherm
      - Move on -> quest1_hub

  feri_aquatherm:
    type: message
    text: >
      FERI BÁCSI: Az AquaTherm az a kurva életbe. Két éve
      jelentek meg, hogy "hasznosítani" akarják a termálvizet.
      Wellness szálloda, palackozott termálvíz, meg az anyám
      kínja. A polgármester, a Tibor, kezet fogott velük, mert
      pénzt ígértek.

      De a Bence nem hagyta annyiban. Összeszedte az öregeket,
      a Forrásőröket, kampányolt, hogy ne adják el a mi vizünket.
      A zene volt a fegyvere — írt egy dalt, "Nem eladó a forrás,"
      felment a netre, százezer megtekintés. A Tibor meg az
      AquaTherm bepánikolt.

      Két héttel később Bence eltűnt. Te húzd le a következtetést.
    effects: { trust_feri: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- János (bath master, the water) ---

  janos_intro:
    type: tweet
    from: janos
    text: >
      harminc éve mérem a vizet. tudom milyen színű, milyen
      szagú, milyen meleg. valami változott. @bence_szilagyi
      tudta. és most nincs itt.
    effects: { trust_janos: "+5", contacts_followed: "+1" }
    choices:
      - Reply to János -> janos_talk

  janos_talk:
    type: message
    text: >
      JÁNOS: Harminc éve vagyok itt a fürdőnél. Ismerem ezt a
      vizet, mint a tenyeremet. És mondom neked — valami
      változott. A hőmérséklet ingadozik. A víz néha zavaros.
      Nem normális.

      Amióta az AquaTherm elkezdte a próbafúrásokat a domb mögött,
      a forrás nem ugyanaz. Bence volt az egyetlen, aki nyíltan
      kimondta. Méréseket végzett, mintákat vett, dokumentálta
      az egészet.

      A polgármester azt mondta, hogy "természetes ingadozás."
      Bazmeg, harminc éve nem ingadozott soha.
    effects: { trust_janos: "+10" }
    choices:
      - Did you see anything unusual recently? -> janos_night
      - Move on -> quest1_hub

  janos_night:
    type: message
    text: >
      JÁNOS: Azon az éjszakán — mielőtt eltűnt — én zártam a
      fürdőt, este tíz körül. Láttam, hogy Bence kerékpárja ott
      áll a kultúrház előtt. Semmi különös, ott szokott próbálni.

      De volt egy fekete terepjáró is a parkolóban. Budapesti
      rendszám. AquaTherm logó az ajtón. Este tízkor.
      A kultúrháznál.

      Nem gondoltam bele, de most folyton ezen járatom az agyam.
    effects: { trust_janos: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Máté (teen, witness tease) ---

  mate_intro:
    type: tweet
    from: mate
    text: >
      basszus nem bírom @bence_szilagyi tanított meg bmx-ezni
      meg gitározni is ő a legkirályabb ember hévízkúton. ha
      vki tud vmit pls szóljatok
    effects: { trust_mate: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Máté -> mate_talk_early

  mate_talk_early:
    type: message
    text: >
      MÁTÉ: tesó ki vagy te? új vagy itt? gáz timing tbh.
      amúgy bence az a fajta ember aki mindenkivel foglalkozik.
      megtanított gitározni, bmx-ezni, még a házi feladatban
      is segített néha lol

      amúgy elmondom neked de ne szólj senkinek. az ádám
      látott vmi furát aznap este a forrásnál de nem akar
      beszélni róla. azt mondja semmiség de nézd meg az arcát
      amikor kérdezed. nem semmiség az tesó
    effects: { trust_mate: "+10" }
    choices:
      - What did Ádám see? -> mate_adam_hint
      - Move on -> quest1_hub

  mate_adam_hint:
    type: message
    text: >
      MÁTÉ: bazmeg nem tudom pontosan. ő a forrásnál volt
      este, valami streetwear fotózás meg ilyenek. és
      látta hogy valaki turkál bence hátizsákjában a
      kultúrház előtt?? vagy vmi ilyesmi.

      nem akarja mondani mert fél hogy nem hisznek egy
      17 éves gyereknek. próbálj meg vele beszélni de
      előbb nyerd meg a bizalmát, szeret gamerkedni meg
      ilyenek
    effects: { trust_mate: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Hévízkút. A Hungarian thermal spa
      town built around its springs. A young musician who was fighting
      privatization. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Réka (Bence's ex-girlfriend) -> reka_q1
      - Talk to Lili (Bence's student) -> lili_q1
      - Check what Zoltán (Bence's brother) is saying -> zoltan_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Réka Q1 ---

  reka_q1:
    type: tweet
    from: reka
    text: >
      @bence_szilagyi kérlek írj már. tudom h szakítottunk de
      ettől még aggódom. nem bírom ezt a bizonytalanságot.
      kérlek.
    effects: { trust_reka: "+5", contacts_followed: "+1" }
    choices:
      - DM Réka -> reka_q1_talk

  reka_q1_talk:
    type: message
    text: >
      RÉKA: Ki vagy te? Nem ismerlek. Nem akarok idegenekkel
      beszélni Bencéről. Ő az én dolgom.

      ...sajnálom. Ideges vagyok. Mindenki kérdez és senki
      nem csinál semmit.

      [Réka is defensive. You'll need to build more trust before
      she opens up.]
    effects: { trust_reka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lili Q1 ---

  lili_q1:
    type: tweet
    from: lili
    text: >
      a Bence tanár úr a legjobb ember akit ismerek. nem
      ment el sehova. ő soha nem hagyná itt a hangszereit.
      a tekerőlantja itt van a kultúrházban. ő soha. SOHA.
    effects: { trust_lili: "+5", contacts_followed: "+1" }
    choices:
      - DM Lili -> lili_q1_talk

  lili_q1_talk:
    type: message
    text: >
      LILI: Bence tanár úr mindig azt mondta, "a zene az
      igazság hangja." Ő nem futott volna el. Ő harcolt
      volna.

      Tudod mi a legfurább? A Réka... Bence exe... láttam
      egyszer a kultúrház előtt este. Csak állt ott. Nézte
      az ablakot. Bence bent próbált. Nem ment be. Csak
      állt. Kicsit creepy volt tbh.
    effects: { trust_lili: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Zoltán Q1 ---

  zoltan_q1:
    type: tweet
    from: zoltan
    text: >
      AZ ÖCSÉM ELTŰNT és a rendőrség azt mondja h talán
      felment pestre??? A FASZOM. bence UTÁLJA pestet.
      megyek le győrből. valaki fog nekem válaszolni.
    effects: { trust_zoltan: "+5", contacts_followed: "+1" }
    choices:
      - DM Zoltán -> zoltan_q1_talk

  zoltan_q1_talk:
    type: message
    text: >
      ZOLTÁN: Ki a fasz vagy te? Még egy ember aki
      mindent jobban tud? Az öcsém hívott aznap este.
      Azt mondta van valami nagy szar. Azt mondta "ha
      történik velem valami, nézd meg az AquaTherm-et."
      Aztán lerakta.

      Az volt az utolsó amit hallottam tőle.
    effects: { trust_zoltan: "+10" }
    choices:
      - What do you think happened? -> zoltan_theory
      - Move on -> quest1_hub

  zoltan_theory:
    type: message
    text: >
      ZOLTÁN: Szerintem a Bence rájött hogy az AquaTherm
      tönkreteszi a forrást és elhallgattatták. De az is
      lehet hogy a Réka csinált valamit. A kurva életbe,
      az a lány nem normális. Bence hónapok óta mondta
      hogy követi, figyeli, mindenhol felbukkan.

      Egyszer mondta nekem: "Tesó, a Réka mindent tud
      rólam. Hol vagyok, kivel vagyok. Nem normális ez."
      Akkor azt hittem túlzás. Most nem hiszem.
    effects: { trust_zoltan: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Bence went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Ádám (was at the springs, saw something) -> adam_interview
      - Find János (bath master, was closing up) -> janos_interview
      - Find Norbert (winemaker, early morning in the vineyards) -> norbert_interview
      - Find Csaba (butcher, starts at 4am, saw something) -> csaba_interview

  # --- Ádám (saw someone at Bence's bag) ---

  adam_interview:
    type: tweet
    from: adam
    text: >
      valami gáz van hévízkúton. este a forrásnál voltam
      fotózni és nem volt jó a vibe. nem tudom elmagyarázni
    effects: { trust_adam: "+5" }
    choices:
      - Ask Ádám about that evening -> adam_talk

  adam_talk:
