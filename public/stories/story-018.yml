    dorina:
      name: "Dorina"
      bio: "15 | fotó & tiktok | hévízkút élete képekben | bence zenéje király"
      avatar: avatars/dorina.jpg
    adam:
      name: "Ádám"
      bio: "17 | gamer & streetwear | hévízkút | bence megtanított gitározni"
      avatar: avatars/adam.jpg

    # === Media & Community ===
    naplo:
      name: "Hévízkúti Napló"
