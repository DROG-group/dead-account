      ASTYNOMIA OFFICER: Off the record — and I mean completely off
      the record — I wanted to investigate Trident. My superior told
      me to stand down. He said the Limassol district office had
      "jurisdiction." That is code for "do not touch it."

      The Marilena situation is different. I did not even know about
      the break-ins until now. If you have evidence of stalking and
      unlawful entry, I can act on that. That is clearly my
      jurisdiction.

      Bring me something solid and I will reopen the case.
    effects:
      trust_astynomia: "+15"
      evidence_total: "+1"
    choices:
      - Back to collector thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You have gathered evidence. You know more about what happened
      to Elena than anyone in Pano Lefkara. Who is responsible?
    choices:
      - Confront Marilena Stefanou (the obsessive collector) -> confront_marilena
        when:
          state: collector_evidence
          gte: 5
      - Confront Theodoros Fotiou (the Trident director) -> confront_theodoros
        when:
          state: resort_evidence
          gte: 3
      - Confront Koinarches Stavros (political protection) -> confront_stavros
      - I need more evidence -> investigation_hub

  # --- ENDING A: Marilena (Best Ending) ---

  confront_marilena:
    type: message
    text: >
      You present your evidence to Marilena:

      "I know @constantinos is your account. I know you made a copy
      of Elena's workshop key. I know you entered the workshop at
      night to photograph and steal patterns. I have the hidden
      camera footage, the access logs, and witnesses."
    choices:
      - Send -> marilena_response

  marilena_response:
    type: message
    text: >
      Marilena does not reply for a long time. Then:

      MARILENA: You do not understand. I was preserving her work.
      These patterns are too important to be locked in one woman's
      workshop. They belong to the world. I needed to document them.
      Everything I did was because I care about the craft.

      That is not preservation. That is obsession.

      You have already sent the evidence to the police. And to
      Anna Mavronikola.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      The police reopen the case. With your evidence — the anonymous
      account, the copied workshop key, the access logs, the hidden
      camera footage, the witness testimonies — Marilena is arrested
      for stalking, unlawful entry, and theft of cultural property.
      Androulla's original pattern book is recovered from Marilena's
      rented house, along with hundreds of photographs of Elena's
      private techniques.

      Anna Mavronikola, finally in possession of Elena's full evidence
      package, publishes the Trident story in Phileleftheros. The
      Antiquities Department orders an immediate halt to the land
      reclassification. Trident's Limassol offices are raided.
      Theodoros Fotiou faces criminal charges for forgery and bribery.
      The terraces are granted permanent heritage protection.

      And Elena Georgiou, reading the story from a friend's house in
      Platres, calls her brother for the first time in nine days.

      "Γυρίζω σπίτι."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: elena
    text: >
      η δαντέλα εν ψέματα λαλεί. τζιαι οι άνθρωποι του Λεύκαρα ούτε.
      ευχαριστώ που εν τ' αφήκατε.
    choices:
      - The End -> game_complete

  # --- ENDING B: Theodoros (Partial Ending) ---

  confront_theodoros:
    type: message
    text: >
      You present the development evidence to Theodoros Fotiou:

      "I have copies of the forged consent forms. I have the
      handwriting expert's report. I have your internal pitch deck
      showing the real 300-room resort plan. I have the business
      card found on the monastery path. I have the vehicle
      registration tracing to Trident."
    choices:
      - Send -> theodoros_response

  theodoros_response:
    type: message
    text: >
      THEODOROS: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. Trident Coastal Development has always
      operated within regulatory requirements.

      But it is too late. You have sent the evidence to Anna, to the
      Paradosi association, and to the Antiquities Department.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The development story breaks. Trident is ordered to halt all
      activity on the Lefkara terraces pending investigation. The
      resort plan collapses. The village council is divided — some
      wanted the investment.

      But Elena?

      Without the stalking evidence, Marilena is never investigated.
      She continues to visit the village. She continues to photograph
      and collect. She rents a new house closer to the workshop. She
      creates a new anonymous account.

      Three months later, Elena reads about Trident online. She
      returns quietly. She changes her workshop locks. She installs
      more cameras. She stops working alone at night.

      The development is stopped. But the person who terrorised Elena
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: elena
    text: "γύρισα. τα βουνά εν πιο ασφαλή. τα υπόλοιπα... θα δούμε."
    choices:
      - The End -> game_complete

  # --- ENDING C: Koinarches (Wrong Ending) ---

  confront_stavros:
    type: message
    text: >
      You confront Koinarches Stavros with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> stavros_response

  stavros_response:
    type: tweet
    from: andreas
    text: >
      Ο πελάτης μου λαμβάνει υπόψη τους ισχυρισμούς σας. Οποιαδήποτε
      δημόσια διάδοση δυσφημιστικού υλικού θα επισύρει άμεσες
      νομικές ενέργειες. — Γραφείο Παπαδόπουλου & Συνεργατών, Λεμεσός
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The koinarches' lawyer buries your accusation. Without a direct
      link between Stavros and Trident's forgeries — and there is not
      one beyond political protection — your evidence is insufficient.

      Trident continues its plans. Marilena continues to watch. Elena
      stays in hiding.

      Six months later, @constantinos creates a new account. It
      follows Elena's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: PANO LEFKARA — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Resort evidence: ${resort_evidence}
      Collector evidence: ${collector_evidence}

      Thank you for playing. Elena's story explores themes of cultural
      theft, heritage destruction, obsessive behaviour, community
      solidarity, and the courage to protect what matters.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Cyprus Police Emergency: 199 / 112
      Domestic Violence Helpline: 1440
      Association for the Prevention and Handling of Violence
      in the Family: 22 667 228
