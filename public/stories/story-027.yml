entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PANO LEFKARA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to PanoLefkara.social — the community Mastodon instance for
      the mountain village of Pano Lefkara, in the Troodos foothills of
      Cyprus.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @elena_georgiou.

      A lace embroiderer. Lefkaritika artisan. She documented the craft,
      taught workshops, fought to preserve the village's heritage. People
      are worried. She hasn't posted in six days.
    choices:
      - Look at her profile -> elena_profile

  elena_profile:
    type: tweet
    from: elena
    text: "Η δαντέλα του Πάνω Λεύκαρα εν πωλείται σε developers. Εν κληρονομιά, εν ακίνητο. Έσιω αποδείξεις τι σχεδιάζουν."
    choices:
      - That's her last real post... -> grey_lace

  grey_lace:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a piece of lace, photographed badly. Overexposed, blurred, posted
      at 4am. No caption. No hashtags.

      Her friends say that is not her style. Elena photographs every stitch
      with studio precision. The police say she probably went to Limassol
      to visit family. Something does not add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: astynomia
    text: >
      Λάβαμε αναφορά για κάτοικο του Πάνω Λεύκαρα. Σε τούτο το στάδιο,
      εν υπάρχουν στοιχεία αξιόποινης πράξης. Οποιαδήποτε χρήσιμη
      πληροφορία μπορεί να κοινοποιηθεί στο 199 ή στον σταθμό.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @marina_kyprianou is
      desperate. Her brother @nikos_georgiou is driving up from Limassol.
      Her lace teacher @androulla_pafiti is posting worried messages.
      The silversmith @petros_antoniou says she was right about the
      developers.

      And the journalist @anna_mavronikola is strangely silent.

      Nobody buys the police line. Nobody thinks Elena just "went to
      Limassol."
    effects: { trust_marina: "+5", trust_nikos: "+5" }
    choices:
      - Start following Elena's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Pano Lefkara. Follow Elena's contacts and read their
      posts. The more you engage with the community, the more they will
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Loukia (kafeneio owner, knows everyone) -> loukia_intro
      - Talk to Petros (silversmith, knew about the developers) -> petros_intro
      - Talk to Alexia (teen, Elena's student) -> alexia_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Elena with the rhythms of a mountain
      village: olive harvest schedules, the bakery's halloumi pies,
      weather warnings for the Troodos roads.

      Key names surface: Marina (best friend, teacher), Androulla (lace
      master, shattered), Anna (journalist, oddly quiet), and the teens
      — Alexia, Giorgos, Eleni K. — who idolised Elena's craft revival.

      Also prominent: Trident Coastal Development Ltd, the company
      proposing a luxury resort on the old terraces below the village.
      Their posts are slick PR. Elena's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Loukia -> loukia_intro
      - Talk to Petros -> petros_intro
      - Talk to Alexia -> alexia_intro

  # --- Loukia (social map) ---

  loukia_intro:
    type: tweet
    from: loukia
    text: >
      Το καφενείο ανοιχτό αλλά η καρδιά μου κλειστή. @elena_georgiou,
      το τραπέζι σου σε περιμένει κούκλα μου. Γύρνα πίσω.
    effects: { trust_loukia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Loukia -> loukia_talk

  loukia_talk:
    type: message
    text: >
      LOUKIA: Ah, you are new? Welcome. Bad time to come, my love.
      Everyone is sick with worry about Elena.

      Let me tell you who is who. Marina is Elena's best friend — they
      grew up together, thick as thieves. Androulla Pafiti is the old
      lace master, taught Elena everything since she was eight. Nikos
      is her older brother, coming up from Limassol.

      And Anna Mavronikola — the journalist — she and Elena were
      working on something together. Something about the village land.
      Anna has not said a word since Elena vanished. That is not like
      her at all.

      Oh, and do not believe a word from Trident Coastal Development.
      Lies dressed up as "sustainable tourism."
    effects: { trust_loukia: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the foreign woman -> loukia_marilena
      - Ask about Trident -> loukia_trident
      - Thank her and move on -> quest1_hub

  loukia_marilena:
    type: message
    text: >
      LOUKIA: There is a woman who has been visiting the village for
      months. Foreign. Says she is a collector. Marilena something.
      She sits in the kafeneio and watches Elena work. She buys
      pieces — lots of pieces — but it is not normal collecting.

      She photographs everything. She asks about techniques, about
      patterns nobody teaches outsiders. Elena said she felt watched.
      She said, "This woman does not want lace. She wants me."

      Elena told her to stop coming to the workshop. The woman kept
      coming anyway. Kept sitting at that table, right there, staring
      at the workshop across the street.
    effects: { trust_loukia: "+5" }
    choices:
      - Ask about Trident -> loukia_trident
      - Move on -> quest1_hub

  loukia_trident:
    type: message
    text: >
      LOUKIA: Trident Coastal Development. They want to build a resort
      on the old terraces below the village — the ones with the
      traditional stone walls, the lace-drying grounds, the old
      mulberry trees. They say it will bring tourists. We already
      have tourists. We do not need a concrete hotel with a swimming
      pool where the terraces used to be.

      Elena was the loudest voice against it. She had documents —
      something about the land titles, about bribes. Two weeks later
      she is gone.
    effects: { trust_loukia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Petros (silversmith, witness tease) ---

  petros_intro:
    type: tweet
    from: petros
    text: >
      30 χρόνια δουλεύκω ασήμι δίπλα σε δαντελούες. @elena_georgiou
      είχε δίκαιο για τα σχέδια τους. Τζιαι τωρά εξαφανίστηκεν.
      Κάμετε τη σύνδεση.
    effects: { trust_petros: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Petros -> petros_talk

  petros_talk:
    type: message
    text: >
      PETROS: I have been a silversmith in this village my whole life.
      My workshop is next to Elena's. I see everything that happens on
      this street.

      Elena was fighting the Trident people. She had proof that the
      land deal was dirty — forged signatures on heritage consent forms,
      bribes to officials. She was building a case with Anna the
      journalist.

      And then there is that woman. The collector. She came to my shop
      too, asked about silver techniques. But she always ended up across
      the street, watching Elena. Every single time.

      You think both things happening at once is a coincidence? I do not
      believe in coincidences in small villages.
    effects: { trust_petros: "+10" }
    choices:
      - Did you see anything unusual recently? -> petros_night
      - Move on -> quest1_hub

  petros_night:
    type: message
    text: >
      PETROS: The night before Elena vanished — I was finishing a late
      commission, working until midnight. I heard voices from Elena's
      workshop. Not shouting exactly, but intense. I looked out and
      saw a car parked outside. Black SUV, Limassol plates. Not a
      village car.

      Two men went into the workshop. They were inside maybe twenty
      minutes. Then they left. Fast.

      I did not think much of it then. Now I think about it every day.
    effects: { trust_petros: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Alexia (teen student, witness tease) ---

  alexia_intro:
    type: tweet
    from: alexia
    text: >
      ρε κουμπάρε εν τωρά σοβαρά?? η @elena_georgiou εν αυτή που
      μου μαθαίνει δαντέλα τζιαι τωρά εξαφανίστηκεν?? αν ξέρει
      κανένας τίποτε πέτε μας ρε
    effects: { trust_alexia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Alexia -> alexia_talk_early

  alexia_talk_early:
    type: message
    text: >
      ALEXIA: εν τωρά σοβαρά, είσαι νέος εδώ? τι timing ρε. η Ελένη
      εν η καλύτερη σε τούτο το χωρκό. μας μαθαίνει δαντέλα, μας
      δείχνει τα παλιά σχέδια, σιόρ τι γυναίκα.

      τζιαι τωρά φοούμαι γιατί ο Γιώργος είδε κάτι περίεργο τζείνο
      το βράδυ αλλά εν θέλει να μιλήσει. λαλεί ότι εν τίποτε αλλά
      γαμώ τα εν τίποτε σιόρ
    effects: { trust_alexia: "+10" }
    choices:
      - What did Giorgos see? -> alexia_giorgos_hint
      - Move on -> quest1_hub

  alexia_giorgos_hint:
    type: message
    text: >
      ALEXIA: εν ξέρω ακριβώς. ήταν με το ποδήλατο πάνω στον δρόμο
      τζιαι είδε κάποια να βάλλει πράματα μέσα στο εργαστήρι της
      Ελένης?? ή κάτι τέτοιο. φοάται πολλά εν θέλει να μιλήσει.
      δοκίμασε πρώτα να του μιλήσεις για ποδήλατα χαχα αλλιώς εν
      σε εμπιστεύκεται
    effects: { trust_alexia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You are getting a picture of Pano Lefkara. A Troodos mountain
      village built around lace and silver. An embroiderer who was
      fighting to protect the village's heritage. A disappearance
      nobody believes is voluntary.

      You have made contacts. Now dig deeper.
    choices:
      - Talk to Marina (Elena's best friend) -> marina_q1
      - Talk to Androulla (Elena's lace teacher) -> androulla_q1
      - Check what Nikos (Elena's brother) is saying -> nikos_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Marina Q1 ---

  marina_q1:
    type: tweet
    from: marina
    text: >
      αν κανένας έσιει νέα για @elena_georgiou τηλεφωνήστε μου. το
      σπίτι της εν ακριβώς όπως το άφηκεν. η δαντέλα της εν πάνω
      στο τελάρο. ποτέ εν θα φύει χωρίς τα εργαλεία της.
    effects: { trust_marina: "+5", contacts_followed: "+1" }
    choices:
      - DM Marina -> marina_q1_talk

  marina_q1_talk:
    type: message
    text: >
      MARINA: I appreciate you reaching out but I do not know you.
      Elena has many friends here. I am sure she will come back.

      ...I keep saying that. I do not believe it anymore.

      [Marina is guarded. You will need to build more trust before she
      opens up.]
    effects: { trust_marina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Androulla Q1 ---

  androulla_q1:
    type: tweet
    from: androulla
    text: >
      Η @elena_georgiou ήταν η καλύτερη μαθήτριά μου σε 40 χρόνια.
      Το εργαστήρι εν άδειο χωρίς αυτήν. Η δαντέλα εν τελειωμένη
      πάνω στο τελάρο. Ποτέ εν θα άφηνε δουλειά μισοτελειωμένη.
    effects: { trust_androulla: "+5", contacts_followed: "+1" }
    choices:
      - DM Androulla -> androulla_q1_talk

  androulla_q1_talk:
    type: message
    text: >
      ANDROULLA: Elena and I have worked side by side for twenty years.
      She learned every stitch from me. This craft — lefkaritika — she
      treated it like a sacred thing. She would never abandon a piece
      halfway through.

      She was also fighting those developers. And that foreign woman
      would not leave her alone. Elena said she felt like a specimen
      being studied.

      [Androulla seems heartbroken. There is more here when she trusts
      you.]
    effects: { trust_androulla: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nikos Q1 ---

  nikos_q1:
    type: tweet
    from: nikos
    text: >
      η αδερφή μου ΕΞΑΦΑΝΙΣΤΗΚΕΝ τζιαι η αστυνομία μου λαλεί πιθανόν
      πήε Λεμεσό?? ΕΝ ΠΑΕ ΛΕΜΕΣΟ ΧΩΡΙΣ ΝΑ ΠΕΙ. φτάννω Λεύκαρα.
      κάποιος θα μου εξηγήσει.
    effects: { trust_nikos: "+5", contacts_followed: "+1" }
    choices:
      - DM Nikos -> nikos_q1_talk

  nikos_q1_talk:
    type: message
    text: >
      NIKOS: Who are you? Another person from that village who is going
      to tell me to calm down? My sister called me the night before she
      disappeared. She said she had something big. She said "if anything
      happens, look at Trident Coastal." Then she hung up.

      That is the last I heard from her.
    effects: { trust_nikos: "+10" }
    choices:
      - What do you think happened? -> nikos_theory
      - Move on -> quest1_hub

  nikos_theory:
    type: message
    text: >
      NIKOS: I think she found proof that the Trident land deal is
      corrupt and they shut her up. But I also think that creepy
      collector woman — Marilena — knows more than she is saying.
      The way she talks about Elena... it is not just admiration for
      lace. It is something else.

      Elena told me months ago that someone was following her in the
      village. She thought it was nothing. I do not think it was
      nothing.
    effects: { trust_nikos: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Elena went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Giorgos (was cycling on the mountain road at dusk) -> giorgos_interview
      - Find Michalis (goatherd, out early in the hills) -> michalis_interview
      - Find Panayiota (shop owner, saw a car) -> panayiota_interview
      - Find Kyriakos (guide, was on the trail at dawn) -> kyriakos_interview

  # --- Giorgos (saw someone at Elena's workshop) ---

  giorgos_interview:
    type: tweet
    from: giorgos
    text: >
      καλό ride σήμερα αλλά η ατμόσφαιρα στο χωρκό εν ζόρικη ρε
      κουμπάρε. κάτι εν πάει καλά. εν ξέρω πώς να το εξηγήσω
