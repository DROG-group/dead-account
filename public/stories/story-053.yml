entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN BRAN VECHI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to BranVechi.social — the community Mastodon instance for
      the village of Bran Vechi, in the Carpathian Mountains of
      Transylvania.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @maria_ionescu.

      A folk weaver. Textile artist. She documented traditional
      Transylvanian patterns passed down through generations. People
      are worried. She hasn't posted in six days.
    choices:
      - Look at her profile -> maria_profile

  maria_profile:
    type: tweet
    from: maria
    text: "Cineva a fost din nou in atelierul meu noaptea. Lipsesc mostre. Lipsesc fotografii ale tiparelor vechi. Stiu cine e. Am dovezi."
    choices:
      - That's her last real post... -> loom_photo

  loom_photo:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photograph of an empty loom. Shot from a strange angle.
      Posted at 2am. No caption.

      Her friends say that's not her style. Maria always wrote long
      captions about the history of each pattern. The police say she
      probably went to visit relatives. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: comisar
    text: >
      Am primit un semnal referitor la o locuitorare din Bran Vechi.
      In acest moment, niciun element nu indica un act infractional.
      Orice informatie utila poate fi comunicata la 112 sau la sediul
      sectiei.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @anca_popescu is
      desperate. Her brother @radu_ionescu is coming from the mountain
      pastures. Her apprentice @elena_dragomir is posting frantic
      messages. The forester @vasile_rus says he saw strange vehicles
      on the forest road at night.

      And the journalist @doina_vasilescu is strangely silent.

      Nobody buys the police line. Nobody thinks Maria just "went
      to visit relatives."
    effects: { trust_anca: "+5", trust_radu: "+5" }
    choices:
      - Start following Maria's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Bran Vechi. Follow Maria's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Dana (pensiune owner, knows everyone) -> dana_intro
      - Talk to Vasile (forester, saw vehicles on the road) -> vasile_intro
      - Talk to Mihai (teen biker, seems shaken) -> mihai_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Maria with the rhythms of a small
      mountain village: weather warnings, the priest's Sunday service
      reminders, honey harvest updates from the beekeeper.

      Key names surface: Anca (best friend, teacher), Elena
      (apprentice, seems frightened), Doina (journalist, oddly quiet),
      and the teens — Mihai, Cristina, Adrian — who admired Maria's
      traditional art.

      Also prominent: CarpatiLemn SRL, the logging company at the
      edge of the forest. Their posts are corporate PR about
      "sustainable forestry." Maria's posts told a different story.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Dana -> dana_intro
      - Talk to Vasile -> vasile_intro
      - Talk to Mihai -> mihai_intro

  # --- Dana (social map) ---

  dana_intro:
    type: tweet
    from: dana
    text: >
      Pensiunea e deschisa dar nu am chef de nimic. @maria_ionescu,
      locul tau la masa te asteapta. Intoarce-te repede.
    effects: { trust_dana: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dana -> dana_talk

  dana_talk:
    type: message
    text: >
      DANA: Ah, esti nou pe-aici? Bine ai venit. Momentul e prost,
      toata lumea e pe jar din cauza Mariei.

      Let me tell you who's who. Anca is Maria's best friend — they
      grew up together, live two houses apart. Sweet woman, completely
      devastated. Elena Dragomir is Maria's apprentice at the loom.
      Only 22, learning the old patterns. Radu is Maria's brother, a
      shepherd up on the mountain pastures, he's coming down.

      And Doina Vasilescu — the journalist — she and Maria were working
      on something together. Something about the forest. Doina hasn't
      said a word since Maria vanished. That's not like her.

      Oh, and ignore CarpatiLemn's posts about "sustainable" this and
      "certified" that. They're cutting old-growth forest and everyone
      knows it.
    effects: { trust_dana: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Stefan Hartmann -> dana_stefan
      - Ask about CarpatiLemn -> dana_carpatilemn
      - Thank her and move on -> quest1_hub

  dana_stefan:
    type: message
    text: >
      DANA: Stefan Hartmann? The Austrian? He's been coming here for
      two years now. Says he's a collector of folk textiles. Stays at
      my pensiune every time. Polite man, always asking about Maria's
      work.

      But lately it's been... mai nasol. He showed up three times in
      the last month. Always wanted to see Maria. Offered to buy her
      oldest pieces — the ones her grandmother made. Maria said no.
      Every time, no. He didn't take it well.

      She told me once: "That man looks at my covoare like a wolf
      looks at sheep." I thought she was being dramatic. Now I'm not
      so sure.
    effects: { trust_dana: "+5" }
    choices:
      - Ask about CarpatiLemn -> dana_carpatilemn
      - Move on -> quest1_hub

  dana_carpatilemn:
    type: message
    text: >
      DANA: CarpatiLemn has been cutting in the forests above the
      village for three years. They have permits — or say they do.
      But the old forest behind the church? The one with trees that
      are 300 years old? They're eyeing that next.

      Maria was fighting them. She said the old forest was where the
      plants for natural dyes grew. Without that forest, the
      traditional colours of the textiles would be lost forever. She
      documented everything — the trees, the plants, the erosion on
      the slopes where they already cut.

      Two weeks later she's gone.
    effects: { trust_dana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Vasile (the forest, witness tease) ---

  vasile_intro:
    type: tweet
    from: vasile
    text: >
      35 de ani de padurit. padurea nu mai e ce era.
      @maria_ionescu avea dreptate. si acum a disparut.
      faceti legatura.
    effects: { trust_vasile: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Vasile -> vasile_talk

  vasile_talk:
    type: message
    text: >
      VASILE: I've walked these forests since I was a boy. I know
      every trail, every clearing, every sound. And I'm telling you —
      the cutting above the village is not what CarpatiLemn reports.
      They say "selective harvest." I see clear-cuts hidden behind
      buffer strips. Whole slopes stripped bare.

      Maria photographed everything. She hiked up there with her
      camera and mapped the damage. She found stumps of trees that
      were marked as "standing" in CarpatiLemn's inventory reports.
      Phantom trees. Hundreds of them.

      You think that's a coincidence? La naiba, nu exista
      coincidente in padure.
    effects: { trust_vasile: "+10" }
    choices:
      - Did you see anything unusual recently? -> vasile_night
      - Move on -> quest1_hub

  vasile_night:
    type: message
    text: >
      VASILE: The night before she vanished — I was on patrol, around
      midnight. I saw lights on the forest road above the village.
      Not unusual — poachers use that road sometimes. But there were
      two vehicles. One was a black SUV with CarpatiLemn markings.
      The other was a rental car with Brasov plates.

      At midnight. On the forest road above Maria's house.

      I noted it in my patrol log. Nobody's asked to see it.
    effects: { trust_vasile: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mihai (teen biker, witness tease) ---

  mihai_intro:
    type: tweet
    from: mihai
    text: >
      sunt terminat frate @maria_ionescu ea m-a invatat sa respect
      muntii gen ce pula mea nu e posibil sa fi plecat asa. daca stie
      cineva ceva ziceti va rog
    effects: { trust_mihai: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Mihai -> mihai_talk_early

  mihai_talk_early:
    type: message
    text: >
      MIHAI: mda esti nou pe-aici? e nasol ca timing. in real maria
      e gen cea mai tare persoana din sat. ne-a aratat plantele din
      padure, ne-a invatat de unde vin culorile din covoare. mega
      misto.

      si acum sunt stresat ca adrian a vazut un tip ciudat langa
      atelierul Mariei noaptea dar nu vrea sa zica nimic. zice ca
      nu-i nimic dar gen... nu e nimic futu-i
    effects: { trust_mihai: "+10" }
    choices:
      - What did Adrian see? -> mihai_adrian_hint
      - Move on -> quest1_hub

  mihai_adrian_hint:
    type: message
    text: >
      MIHAI: nu stiu exact. era pe bicicleta noaptea si a vazut gen
      pe cineva care intra in atelierul Mariei?? sau ceva de genul.
      se caca pe el de frica nu vrea sa vorbeasca. trebuie sa-l
      intrebi direct dar e mefiant cu strainii. incearca sa-i
      vorbesti de gaming mai intai bags pula
    effects: { trust_mihai: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Bran Vechi. A Transylvanian village
      nestled in the Carpathians. A folk weaver who was fighting to
      protect the old forest. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Anca (Maria's best friend) -> anca_q1
      - Talk to Elena (Maria's apprentice) -> elena_q1
      - Check what Radu (Maria's brother) is saying -> radu_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Anca Q1 ---

  anca_q1:
    type: tweet
    from: anca
    text: >
      daca cineva are vesti de @maria_ionescu sunati-ma va rog.
      razboiul ei e in atelier. sacul cu plante de vopsit e acolo.
      nu ar fi plecat niciodata fara materialele ei.
    effects: { trust_anca: "+5", contacts_followed: "+1" }
    choices:
      - DM Anca -> anca_q1_talk

  anca_q1_talk:
    type: message
    text: >
      ANCA: I appreciate your concern but I don't know you. Maria has
      many friends in the village. I'm sure she'll come back.

      ...I keep telling myself that. I don't believe it anymore.

      [Anca is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_anca: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Elena Q1 ---

  elena_q1:
    type: tweet
    from: elena
    text: >
      Atelierul e gol fara @maria_ionescu. Razboiul e neprins. Firele
      sunt inca intinse. Nu ar fi lasat niciodata o lucrare neterminata.
      S-a intamplat ceva.
    effects: { trust_elena: "+5", contacts_followed: "+1" }
    choices:
      - DM Elena -> elena_q1_talk

  elena_q1_talk:
    type: message
    text: >
      ELENA: Maria and I have worked together for two years. She's the
      most dedicated artist I know. This fight for the forest — it was
      everything to her. She had photographs, soil samples, maps of the
      illegal cuts. She was so close to going public.

      That Austrian man — Stefan Hartmann — he kept coming. Every time
      more insistent. She showed me the messages he sent. "Name your
      price." "Everything has a value." She said some things in this
      world have no price.

      [Elena seems earnest. She's frightened.]
    effects: { trust_elena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Radu Q1 ---

  radu_q1:
    type: tweet
    from: radu
    text: >
      sora mea a DISPARUT si politia imi spune ca poate a plecat la
      rude??? EA NU PLEACA FARA SA SPUNA. cobor de pe munte. cineva
      o sa-mi explice.
    effects: { trust_radu: "+5", contacts_followed: "+1" }
    choices:
      - DM Radu -> radu_q1_talk

  radu_q1_talk:
    type: message
    text: >
      RADU: Who are you? Another person from the village who's going to
      tell me to calm down? My sister called me the night before she
      disappeared. She said she had something big. She said "if anything
      happens, look at CarpatiLemn." Then she hung up.

      That's the last I heard from her.
    effects: { trust_radu: "+10" }
    choices:
      - What do you think happened? -> radu_theory
      - Move on -> quest1_hub

  radu_theory:
    type: message
    text: >
      RADU: I think she found proof that CarpatiLemn is doing illegal
      clear-cuts and they shut her up. But I also think that collector
      from Vienna — Stefan Hartmann — is mixed up in this. The way he
      talks about her textiles... it's not just appreciation. It's
      hunger. Obsession.

      Maria told me months ago that someone was breaking into her
      workshop at night. Samples disappearing. Photographs of old
      patterns gone. She thought it was kids at first. Now I don't
      think it was kids.
    effects: { trust_radu: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Maria went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Adrian (was biking at night near the workshop) -> adrian_interview
      - Find Vasile (forester, patrols at night) -> vasile_interview
      - Find Petru (beekeeper, tends hives at dawn) -> petru_interview
      - Find Bogdan (blacksmith, works late into the night) -> bogdan_interview

  # --- Adrian (saw someone at the workshop) ---

  adrian_interview:
    type: tweet
    from: adrian
    text: >
      am fost afara aseara dar vibe-u in sat e nasol rau. gen e ceva
      in neregula. nu stiu cum sa explic
    effects: { trust_adrian: "+5" }
    choices:
      - Ask Adrian about that evening -> adrian_talk

  adrian_talk:
    type: message
    text: >
      ADRIAN: ce pula mea ok dar sa nu zici la nimeni da? eram pe
      bicicleta pe la 21 si am vazut tipul ala strain — stefan cum
      ii zice — langa atelierul mariei. avea o geanta mare si un
      telefon cu lanterna. incerca usa. cand m-a vazut a fugit la
      masina lui de lux si a plecat.

      gen eu n-am zis nimic ca cine ma crede pe mine? un pusti care
      zice ca un strain bogat sparge ateliere. la naiba nimeni
    effects:
      trust_adrian: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Vasile (saw meeting on forest road) ---

  vasile_interview:
    type: tweet
    from: vasile
    text: >
      Reamintire: accesul pe drumul forestier este interzis intre 22
      si 6. Am constatat treceri neautorizate in ultimele nopti.
    effects: { trust_vasile: "+5" }
    choices:
      - Ask Vasile what he saw -> vasile_talk_q2

  vasile_talk_q2:
    type: message
    text: >
      VASILE: I was on patrol around midnight. I saw the CarpatiLemn
      SUV parked at the clearing above the village. And a rental car
      next to it — Brasov plates. Two men were standing by the
      forestry gate. One of them I recognised: Liviu Negru, the
      CarpatiLemn director.

      At midnight. On the forest road. That's not normal.

      I noted it in my patrol log. Nobody's asked to see it.
    effects:
      trust_vasile: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Petru (saw Maria fleeing) ---

  petru_interview:
    type: tweet
    from: petru
    text: >
      sculat la 4 pentru stupi. drumul din sat nu era gol in dimineata
      aia. alerga cineva pe poteca spre padure. in intuneric. nu era
      un alergator.
    effects: { trust_petru: "+5" }
    choices:
      - Ask Petru what he saw -> petru_talk

  petru_talk:
    type: message
    text: >
      PETRU: I get up at 4am for the hives. That morning — the morning
      after Maria's last post — I saw someone on the trail toward the
      old forest. Running. A woman, carrying a bag, heading toward the
      shepherd's cabin above the treeline. It was still dark. She was
      moving fast, like she was afraid.

      I called out but she didn't stop. I figured it was some hiker
      starting early but... who hikes at 4am with a woven shoulder
      bag?

      When I heard about Maria, I put it together. I think that was
      her. Running from something.
    effects:
      trust_petru: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Bogdan (heard car chase) ---

  bogdan_interview:
    type: tweet
    from: bogdan
    text: >
