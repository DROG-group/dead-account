  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Maria than anyone in Bran Vechi. Who is responsible?
    choices:
      - Confront Stefan Hartmann (the obsessive collector) -> confront_stefan
        when:
          state: obsession_evidence
          gte: 5
      - Confront Liviu Negru (the logging company director) -> confront_liviu
        when:
          state: corporate_evidence
          gte: 3
      - Confront Mayor Moldovan (political protection) -> confront_gheorghe
      - I need more evidence -> investigation_hub

  # --- ENDING A: Stefan (Best Ending) ---

  confront_stefan:
    type: message
    text: >
      You present your evidence to Stefan Hartmann:

      "I know @andrei_matei is your account. I know you installed a
      hidden camera at Maria's workshop. I know you broke in and
      stole thread samples and photographs. I know you were at the
      workshop the night she disappeared. I have witnesses and I have
      your travel records."
    choices:
      - Send -> stefan_response

  stefan_response:
    type: message
    text: >
      Stefan doesn't reply for a long time. Then:

      STEFAN: You don't understand. I was preserving her work. Those
      textiles are priceless cultural heritage and she was letting
      them rot in a village workshop. I catalogued everything because
      someone had to. Everything I did was because I care about the
      art. About HER art.

      That's not preservation. That's obsession.

      You've already sent the evidence to Comisar Dinu. And to Doina
      Vasilescu.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE COLLECTOR

      Three things happen in quick succession.

      Comisar Dinu reopens the case. With your evidence — the
      anonymous account, the hidden camera, the break-ins, the
      witness testimonies — Stefan Hartmann is arrested at the
      Brasov airport trying to leave the country. A hidden camera is
      recovered from Maria's workshop. His Vienna apartment contains
      an entire room dedicated to cataloguing Maria's textiles from
      the surveillance footage — patterns recreated, colours
      analysed, every piece documented without her knowledge or
      consent.

      Doina Vasilescu, finally in possession of Maria's full evidence
      package, publishes the CarpatiLemn story in Libertatea. The
      Inspectorat Silvic orders an unannounced inspection with drone
      surveys. The cutting permit for Parcela 47 is revoked. Liviu
      Negru faces criminal charges for falsifying forestry reports.

      And Maria Ionescu, reading the story from a shepherd's cabin
      high in the Carpathians, calls her brother for the first time
      in nine days.

      "Radu, cobor acasa."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: maria
    text: >
      padurea nu minte. si oamenii din bran vechi nici. multumesc ca
      nu ati renuntat.
    choices:
      - The End -> game_complete

  # --- ENDING B: Liviu (Partial Ending) ---

  confront_liviu:
    type: message
    text: >
      You present the deforestation evidence to Liviu Negru:

      "I have satellite images of the clear-cuts behind your buffer
      strips. I have GPS coordinates of 1,400 illegal stumps. I have
      your original inventory reports showing the data was falsified.
      I have the logging tag from a tree that's still listed as
      standing in your records."
    choices:
      - Send -> liviu_response

  liviu_response:
    type: message
    text: >
      LIVIU: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. CarpatiLemn has always operated within
      the terms of its forestry permits.

      But it's too late. You've sent the evidence to Doina, to the
      Pazitorii Padurii, and to the Inspectorat Silvic.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The deforestation story breaks. CarpatiLemn is ordered to halt
      all cutting pending investigation. Eighty jobs hang in the
      balance. The village is divided — some curse the company, others
      curse the investigation.

      But Maria?

      Without the stalking evidence, Stefan Hartmann is never
      investigated. He returns to Vienna. He continues to monitor
      Maria's accounts. He creates a new anonymous profile. He plans
      his next visit.

      Three months later, Maria reads about CarpatiLemn online. She
      returns quietly. She reinforces the workshop door. She covers
      the windows. She stops working alone. She checks the walls for
      cameras every morning.

      The corporation is exposed. But the man who terrorised Maria
      walks free.
    choices:
