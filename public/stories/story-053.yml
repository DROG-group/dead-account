  # --- Forest Records ---

  forest_records:
    type: message
    text: >
      CarpatiLemn's public forestry reports filed with the Inspectorat
      Silvic show "selective harvesting" in Parcela 47 — the old-growth
      forest above the village. The reports claim 200 cubic metres
      harvested per year, all within permit limits.

      Maria's documentation, shared with the Pazitorii Padurii
      association, tells a different story. Satellite images show
      clear-cut areas hidden behind thin strips of standing trees.
      Her ground-level photographs show hundreds of fresh stumps in
      areas marked as "unharvested" in CarpatiLemn's inventory.

      Her last field note: "Parcela 47 is gutted. They leave a mask
      of trees along the road so nobody sees. But behind the mask,
      there is nothing left."
    effects:
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue -> corruption_hub

  # --- Doina ---

  doina_interview:
    type: message
    text: >
      DOINA: I don't talk about sources. Period.
    effects: { trust_doina: "+5" }
    choices:
      - Show Doina the evidence you have -> doina_with_evidence
        when:
          state: corporate_evidence
          gte: 3
      - Back to corporate thread -> corruption_hub

  doina_with_evidence:
    type: message
    text: >
      DOINA: ...you have more than I expected.

      Okay. Maria and I were working together. She had satellite
      images, ground photography, GPS coordinates of every illegal
      stump. She documented 1,400 trees cut without permits in
      Parcela 47 alone. Old-growth beech and oak. Some over 300
      years old.

      We were going to publish together. Then she went dark. And
      two days later, someone broke into my office and stole my
      backup drive.

      Maria is alive. She contacted me once, from a neighbour's
      phone in another village. She said she was hiding in the
      mountains. She said "they threatened me and the collector
      won't stop."

      I can't tell you where she is. But with enough evidence, I
      can publish and make it safe for her to come back.
    effects:
      trust_doina: "+25"
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Who threatened her? -> doina_hint
      - Back to investigation hub -> investigation_hub

  doina_hint:
    type: message
    text: >
      DOINA: The logging company sent their director — Liviu Negru —
      and some lawyer to her house that evening. They told her to hand
      over all her documentation or face legal action for "trespassing
      on company land." Intimidation dressed up as legality.

      But she also said something about the Austrian collector.
      Someone who had been cataloguing her workshop's contents
      without permission. Someone who always knew which pieces
      she was working on. That's a different problem.
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Marta (CarpatiLemn whistleblower) ---

  marta_interview:
    type: message
    text: >
      MARTA: I work at CarpatiLemn. I'm just a technician. I process
      the harvest reports, I file the inventory.

      But the inventory I file... is not always the inventory that
      gets sent to the Inspectorat.
    effects: { trust_marta: "+10" }
    choices:
      - What do you mean? -> marta_detail

  marta_detail:
    type: message
    text: >
      MARTA: I count trees. Standing timber, harvested volume, replanted
      seedlings. My numbers go to my supervisor. Somewhere between my
      desk and the official filing, they change. Lower harvested
      volumes. More standing timber. Always.

      Maria's photographs from the field matched MY original numbers,
      not the ones in the official reports. She had independent proof
      that CarpatiLemn is falsifying their forestry inventory.

      I'm scared. I have children. But I kept copies of my original
      reports. If someone can protect me, I'll share them.
    effects:
      trust_marta: "+15"
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
