      colour, every pattern — like he was appraising her life's work
      for auction. He offered enormous sums. €5,000 for a single
      covor that Maria said was priceless.

      She told him no. Clearly, firmly. He said he understood. Then
      nothing changed. He just... kept coming. Always with a bigger
      offer. Always with that smile.

      A month ago she found that someone had entered the workshop at
      night. Thread samples were missing. Photographs she'd taken of
      grandmother's patterns — gone from the wall. She suspected
      Stefan but couldn't prove it.
    effects:
      trust_anca: "+10"
