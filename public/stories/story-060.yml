    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Tiago than anyone in Quinta do Rio. Who is responsible?
    choices:
      - Confront Filipa Vasconcelos (the obsessive dealer) -> confront_filipa
        when:
          state: dealer_evidence
          gte: 5
      - Confront Vasco Teixeira (the HidroDouro director) -> confront_vasco
        when:
          state: dam_evidence
          gte: 3
      - Confront Presidente Monteiro (political corruption) -> confront_henrique
      - I need more evidence -> investigation_hub

  # --- ENDING A: Filipa (Best Ending) ---

  confront_filipa:
    type: message
    text: >
      You present your evidence to Filipa:

      "I know @fantasma.do is your account. I know you put a GPS tracker
      in Tiago's van. I know you followed him to every painting site.
      I know you were photographing him at night. I have witnesses and
      I have the security camera footage."
    choices:
      - Send -> filipa_response

  filipa_response:
    type: message
    text: >
      Filipa doesn't reply for a long time. Then:

      FILIPA: You don't understand. I was trying to protect his career.
      He's the most talented artist I've ever seen and he was wasting
      it on walls that get painted over. Everything I did was because
      I believe in him. I wanted to give him the life he deserves.

      That's not belief. That's obsession.

      You've already sent the evidence to Sargento Carvalho. And to
      Joana Ribeiro.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Sargento Carvalho reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the security footage, the
      witness testimonies — Filipa Vasconcelos is arrested for
      stalking and harassment. A GPS tracker is recovered from under
      the seat of Tiago's van at the riverside viewpoint.

      Joana Ribeiro, finally in possession of Tiago's full evidence
      package, publishes the HidroDouro story in the Publico. The
      ministerio do ambiente orders a full review. The dam project is
      suspended pending investigation. Henrique Monteiro faces criminal
      charges for corruption. His cousin's construction company is
      under audit.

      And Tiago Ferreira, reading the story from a friend's house in
      Coimbra, calls his brother for the first time in nine days.

      "Eu volto para casa, mano."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: tiago
    text: >
      as paredes falam por nos. e o povo de quinta do rio tambem. obrigado
      por nao desistirem. vou pintar o mural de novo. maior.
    choices:
      - The End -> game_complete

  # --- ENDING B: Vasco (Partial Ending) ---

  confront_vasco:
    type: message
    text: >
      You present the dam evidence to Vasco Teixeira:

      "I have the original topographic maps showing 340 hectares, not
      200. I have the contracts between HidroDouro and Monteiro & Filhos.
      I have emails discussing bribes. I have the minutes of a secret
      council meeting."
    choices:
      - Send -> vasco_response

  vasco_response:
    type: message
    text: >
      VASCO: Esta conversa esta a ser reencaminhada para o nosso
      departamento juridico. Qualquer publicacao de material
      difamatorio resultara em acao judicial imediata. A HidroDouro
      opera sempre dentro dos requisitos regulamentares.

      But it's too late. You've sent the evidence to Joana, to the
      Terracos Vivos, and to the ministerio do ambiente.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE DAM

      The corruption story breaks. HidroDouro is ordered to suspend
      the project pending investigation. The dam may never be built.
      The terraces may be saved. The presidente faces criminal charges.

      But Tiago?

      Without the stalking evidence, Filipa is never investigated.
      She continues to visit Quinta do Rio. She continues to monitor
      his accounts. She creates a new anonymous profile.

      Three months later, Tiago reads about HidroDouro online. He
      returns quietly. He changes his painting spots. He locks his
      van every time. He checks for trackers every morning.

      The corruption is exposed. But the person who terrorised Tiago
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: tiago
    text: "voltei. os terracos estao salvos. o resto... veremos."
    choices:
      - The End -> game_complete

  # --- ENDING C: Presidente (Wrong Ending) ---

  confront_henrique:
    type: message
    text: >
      You confront Presidente Monteiro with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> henrique_response

  henrique_response:
    type: tweet
    from: bernardo
    text: >
      O meu cliente toma nota das suas alegacoes. Qualquer difusao
      publica de conteudo difamatorio sera objeto de processo judicial
      imediato. — Faria & Associados, Porto
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The presidente's lawyer buries your accusation. Without a direct
      link between Monteiro and the dam company's intimidation of Tiago
      — and there isn't one beyond political protection — your evidence
      is insufficient.

      HidroDouro continues the dam project. Filipa continues to watch.
      Tiago stays in hiding.

      Six months later, @fantasma.do creates a new account. It follows
      Tiago's girlfriend.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: QUINTA DO RIO — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Dam evidence: ${dam_evidence}
      Obsession evidence: ${dealer_evidence}

      Thank you for playing. Tiago's story explores themes of political
      corruption, environmental destruction, obsessive behaviour,
      community solidarity, and the courage to defend cultural heritage.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      SOS Voz Amiga: 213 544 545
      APAV (Apoio a Vitima): 116 006
      Queixa ambiental: IGAMAOT 213 223 500
