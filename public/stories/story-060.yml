# DEAD ACCOUNT — Story 060: Quinta do Rio (Portugal 3)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-060.yml
#
# Player investigates the disappearance of young street muralist Tiago Ferreira
# in the fictional Douro Valley wine village of Quinta do Rio.

meta:
  title: "Dead Account"
  state:
    # Trust levels per NPC (0-100)
    trust_beatriz: 0
    trust_miguel: 0
    trust_leonor: 0
    trust_diogo: 0
    trust_ines: 0
    trust_rui: 0
    trust_catarina: 0
    trust_manuel: 0
    trust_sofia: 0
    trust_henrique: 0
    trust_margarida: 0
    trust_andre: 0
    trust_joana: 0
    trust_vasco: 0
    trust_teresa: 0
    trust_bernardo: 0
    trust_filipa: 0
    trust_jorge: 0
    trust_gnr: 0
    trust_anon: 0
    # Progress counters
    contacts_followed: 0
    night_witnesses: 0
    dealer_evidence: 0
    dam_evidence: 0
    evidence_total: 0

  player:
    name: Novo Residente
    bio: "acabei de chegar a quinta do rio. a descobrir o douro aos poucos"
    avatar: avatars/default_citizen.png

  bot:
    display_name: "QuintaDoRio.social"
    description: "Bem-vindos a instancia comunitaria de Quinta do Rio, Vale do Douro"
    avatar_url: /gamepatch/assets/dead-account/quintadorio_bot.png

  npcs:
    # === Tiago's Inner Circle ===
    tiago:
      name: "Tiago Ferreira"
      bio: "muralista | a pintar o douro desde os 14 | as paredes falam por nos"
      avatar: avatars/tiago.jpg
    beatriz:
      name: "Beatriz Lopes"
      bio: "melhor amiga do tiago | trabalho na adega | vinho e arte e a mesma cena"
      avatar: avatars/beatriz.jpg
    miguel:
      name: "Miguel Ferreira"
      bio: "irmao do tiago | pescador no douro | brest | ele nao desaparece assim"
      avatar: avatars/miguel.jpg
    leonor:
      name: "Leonor Cardoso"
      bio: "namorada do tiago | enfermeira no centro de saude | volta para casa por favor"
      avatar: avatars/leonor.jpg

    # === Local Government ===
    henrique:
      name: "Henrique Monteiro"
      bio: "Presidente da Camara de Quinta do Rio | Ao servico do municipio desde 2017 | #QuintaAvanca"
      avatar: avatars/henrique.jpg
    margarida:
      name: "Margarida Sousa"
      bio: "Vereadora do Ambiente e Urbanismo | Camara de Quinta do Rio | sustentabilidade"
      avatar: avatars/margarida.jpg
    camara:
      name: "Camara Municipal de Quinta do Rio"
      bio: "Conta oficial | Noticias do municipio | Horario: Seg-Sex 9h-17h"
      avatar: avatars/camara.jpg

    # === Local Business & Community ===
    rui:
      name: "Rui Oliveira"
      bio: "Taberna do Rui | petiscos | vinho do douro | aberto desde 1993"
      avatar: avatars/rui.jpg
    catarina:
      name: "Catarina Mendes"
      bio: "dona da adega velha | vinho biologico | vinhas herdadas do avo"
      avatar: avatars/catarina.jpg
    manuel:
      name: "Manuel Braga"
      bio: "viticultor | 50 anos nas vinhas | os terracos sao a nossa alma"
      avatar: avatars/manuel.jpg
    teresa:
      name: "Teresa Figueiredo"
      bio: "farmacia central | Quinta do Rio | aberta ao domingo de manha"
      avatar: avatars/teresa.jpg
    jorge:
      name: "Jorge Pinto"
      bio: "barqueiro no douro | passeios turisticos | o rio e a minha estrada"
      avatar: avatars/jorge.jpg

    # === Journalist ===
    joana:
      name: "Joana Ribeiro"
      bio: "jornalista independente | ambiente e patrimonio | tips: joana@ribeiro-press.pt"
      avatar: avatars/joana.jpg

    # === Art Dealer / Outsider ===
    filipa:
      name: "Filipa Vasconcelos"
      bio: "Galeria Vasconcelos | Arte contemporanea | Lisboa-Porto-Douro | talentos emergentes"
      avatar: avatars/filipa.jpg
    bernardo:
      name: "Bernardo Faria"
      bio: "Advogado | Faria & Associados | Direito Imobiliario | Porto"
      avatar: avatars/bernardo.jpg

    # === Dam Project ===
    hidroduero:
      name: "HidroDouro SA"
      bio: "Gestao de recursos hidricos | Projeto Barragem do Douro Superior | ISO 9001"
      avatar: avatars/hidroduero.jpg
    vasco:
      name: "Vasco Teixeira"
      bio: "diretor de projeto | HidroDouro SA | infraestruturas hidricas"
      avatar: avatars/vasco.jpg

    # === Teens ===
    diogo:
      name: "Diogo"
      bio: "17 | graffiti e skate | quinta do rio born | o tiago e o meu mestre"
      avatar: avatars/diogo.jpg
    ines:
      name: "Ines"
      bio: "16 | fotografia | as cores do douro | tiago ensinou-me a ver"
      avatar: avatars/ines.jpg
    sofia:
      name: "Sofia"
      bio: "15 | musica e poesia | o vale e inspiracao | #voltaTiago"
      avatar: avatars/sofia.jpg

    # === Media & Community ===
    actu_douro:
      name: "Noticias do Douro"
      bio: "Noticias de Quinta do Rio e do Vale do Douro | tips: redacao@noticiasdouro.pt"
      avatar: avatars/actu_douro.jpg
    meteo_douro:
      name: "Meteo Douro"
      bio: "Previsoes e alertas | Estacao automatica | Atualizacao de hora a hora"
      avatar: avatars/meteo_douro.jpg
    asso_terracos:
      name: "Associacao Terracos Vivos"
      bio: "Protecao dos terracos vinhateiros do Douro | Património UNESCO | voluntarios"
      avatar: avatars/asso_terracos.jpg

    # === Suspicious / Other ===
    andre:
      name: "Andre Valente"
      bio: "tecnico de topografia | HidroDouro | faco o meu trabalho"
      avatar: avatars/andre.jpg
    fantasma_douro:
      name: "fantasma.do"
      bio: "."
      avatar: avatars/anon.jpg
    gnr:
      name: "Sargento Carvalho"
      bio: "GNR Quinta do Rio | Posto Territorial | urgencias: 112"
      avatar: avatars/gnr.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN QUINTA DO RIO
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to quintadorio.social — the community Mastodon instance for
      the wine village of Quinta do Rio, in the Douro Valley.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @tiago_ferreira.

      A street muralist. Graffiti artist. He painted the crumbling walls
      of Douro terraces into living stories. People are worried. He
      hasn't posted in six days.
    choices:
      - Look at his profile -> tiago_profile

  tiago_profile:
    type: tweet
    from: tiago
    text: "Estao a destruir os terracos para a barragem. As vinhas do Manuel vao ficar debaixo de agua. Eu vou pintar o que eles querem apagar."
    choices:
      - That's his last real post... -> grey_wall

  grey_wall:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a grey wall. No mural. No colour. Just concrete, shot at a strange
      angle. Posted at 4am. No caption.

      His friends say that's the opposite of everything Tiago is. The
      GNR says he probably left town to paint somewhere else. Something
      doesn't add up.
    choices:
      - Read the GNR statement -> gnr_statement
      - Look at what people are saying -> community_reaction

  gnr_statement:
    type: tweet
    from: gnr
    text: >
      Recebemos uma participacao relativa a um residente de Quinta do Rio.
      Nesta fase, nenhum elemento permite concluir por atividade criminosa.
      Qualquer informacao util pode ser comunicada ao 112 ou ao posto da GNR.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His best friend @beatriz_lopes is desperate.
      His brother @miguel_ferreira is driving down from Porto. His girlfriend
      @leonor_cardoso is posting tearful messages. The old viticultor
      @manuel_braga says Tiago was the only one who understood what the
      terraces mean.

      And the journalist @joana_ribeiro is strangely silent.

      Nobody buys the GNR's line. Nobody thinks Tiago just "left town
      to paint somewhere else."
    effects: { trust_beatriz: "+5", trust_miguel: "+5" }
    choices:
      - Start following Tiago's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Quinta do Rio. Follow Tiago's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Rui (taberna owner, knows everyone) -> rui_intro
      - Talk to Manuel (viticultor, saw what's happening to the terraces) -> manuel_intro
      - Talk to Diogo (teen graffiti kid, seems shaken) -> diogo_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Tiago with the rhythms of a small Douro
      village: harvest schedules, the taberna's daily specials, river
      level warnings.

      Key names surface: Beatriz (best friend, works at the adega),
      Leonor (girlfriend, nurse, devastated), Miguel (brother, coming
      from Porto), and the teens — Diogo, Ines, Sofia — who learned
      to paint and see the valley through Tiago's eyes.

      Also prominent: HidroDouro SA, the company behind the new dam
      project. Their posts are corporate PR about "sustainable water
      management." Tiago's posts were the opposite — murals of drowned
      vineyards and displaced families.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Rui -> rui_intro
      - Talk to Manuel -> manuel_intro
      - Talk to Diogo -> diogo_intro

  # --- Rui (social map) ---

  rui_intro:
    type: tweet
    from: rui
    text: >
      A taberna esta aberta mas falta-nos o Tiago. O canto dele esta
      vazio. @tiago_ferreira volta ca rapaz.
    effects: { trust_rui: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Rui -> rui_talk

  rui_talk:
    type: message
    text: >
      RUI: Ah, es novo aqui? Bem-vindo. Pessimo timing para chegares.
      A vila toda esta de rastos por causa do Tiago.

      Deixa-me explicar quem e quem. A Beatriz e a melhor amiga dele —
      trabalham juntos na adega da Catarina. Uma miuda fixe, esta
      destruida. A Leonor e a namorada, enfermeira. O Miguel e o irmao
      mais velho, vem de Porto.

      E a Joana Ribeiro — a jornalista — ela e o Tiago andavam a
      trabalhar juntos numa cena. Uma cena sobre a barragem e os
      contratos do presidente. A Joana nao abriu a boca desde que o
      Tiago desapareceu. Isso nao e normal.

      Ah, e cuidado com uma gaja de Lisboa chamada Filipa Vasconcelos.
      Dona de galeria. Andava atras do Tiago como louca. Ele nao
      queria nada com ela e a tipa nao aceitava um nao.
    effects: { trust_rui: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Filipa -> rui_filipa
      - Ask about the dam -> rui_dam
      - Thank him and move on -> quest1_hub

  rui_filipa:
    type: message
    text: >
      RUI: A Filipa? Foda-se, aquela mulher e uma obsessao ambulante.
      Apareceu aqui ha uns meses, dona de uma galeria em Lisboa. Viu
      os murais do Tiago e ficou maluca. Ofereceu-lhe contratos,
      exposicoes, dinheiro. Ele disse que nao, que a arte dele e da
      rua, nao de galerias.

      Ela nao aceitou. Continuou a aparecer. Na taberna, nos muros onde
      ele pintava, ate na casa dele. A Leonor ficou passada. O Tiago
      disse-me uma vez: "Aquela mulher nao aceita um nao, mano. E creepy."

      Depois do ultimo nao, ela comecou a ficar estranha. Tipo, a seguir
      os miudos que pintam com ele. A aparecer nos sitios onde ele ia
      estar. Tipo, a gaja sabia sempre onde ele estava.
    effects: { trust_rui: "+5" }
    choices:
      - Ask about the dam -> rui_dam
      - Move on -> quest1_hub

  rui_dam:
    type: message
    text: >
      RUI: A barragem? Merda, isso e a cena maior. A HidroDouro quer
      construir uma barragem a montante. Vai inundar terracos vinhateiros
      que tem duzentos anos. Patrimonio UNESCO, mano. Vinhas do Manuel,
      da Catarina, de metade da vila.

      E o presidente da camara — o Henrique Monteiro — esta todo
      contente. Dizem que tem contratos com a HidroDouro. A construtora
      que vai fazer a obra e da familia dele. O Tiago andava a pintar
      murais sobre isso. Murais enormes nos muros da vila. Vinhas
      debaixo de agua. Gente a chorar.

      A camara mandou apagar dois deles. Disseram que era "vandalismo."
      Foda-se, vandalismo. Era a verdade.
    effects: { trust_rui: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Manuel (the terraces, witness tease) ---

  manuel_intro:
    type: tweet
    from: manuel
    text: >
      cinquenta anos a cuidar destas vinhas. agora querem afoga-las.
      @tiago_ferreira era o unico que pintava a verdade. e agora
      desapareceu. facam as contas.
    effects: { trust_manuel: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Manuel -> manuel_talk

  manuel_talk:
    type: message
    text: >
      MANUEL: Eu cuido destas vinhas desde que era miudo. O meu avo
      construiu estes terracos a mao. Pedra sobre pedra. Agora querem
      encher isto tudo de agua para uma barragem que so serve para
      encher os bolsos do presidente.

      O Tiago era o unico jovem que percebia. Ele pintava os terracos
      como ninguem. Fez um mural enorme na parede da adega velha —
      as vinhas a desaparecer debaixo de agua. Lindo e triste.

      E agora ele desapareceu. A noite antes, eu vi-o a sair de casa
      a correr. Com a mochila e os sprays. As duas da manha. Nao e
      normal.
    effects: { trust_manuel: "+10" }
    choices:
      - Did you see anything else? -> manuel_night
      - Move on -> quest1_hub

  manuel_night:
    type: message
    text: >
      MANUEL: A noite antes de desaparecer — eu levanto-me as quatro
      para as vinhas, como sempre. Vi luzes na estrada de cima. Um
      carro grande, preto, com logotipo da HidroDouro. Parado ao pe
      do mural novo que o Tiago tinha pintado nessa noite.

      As quatro da manha. Um carro da empresa. Na estrada onde o
      Tiago tinha acabado de pintar.

      Eu nao pensei muito na altura. Agora nao paro de pensar nisso.
    effects: { trust_manuel: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Diogo (teen graffiti kid, witness tease) ---

  diogo_intro:
    type: tweet
    from: diogo
    text: >
      ya mano o tiago e tipo o maior. ensinou-me tudo sobre murais
      e graffiti. nao e possivel que se tenha ido embora assim. se
      alguem souber de alguma cena diga pfv caralho
    effects: { trust_diogo: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Diogo -> diogo_talk_early

  diogo_talk_early:
    type: message
    text: >
      DIOGO: ya mano es novo aqui? bue mau timing. o tiago e tipo a
      melhor pessoa desta vila. ensinou-nos a pintar, a ver as cenas
      de maneira diferente. tipo ele olhava para um muro velho e via
      uma historia.

      e agora to bue assustado porque a ines viu uma cena estranha
      no outro dia perto da galeria da filipa mas nao quer falar.
      diz que nao e nada mas tipo... e alguma cena ya
    effects: { trust_diogo: "+10" }
    choices:
      - What did Ines see? -> diogo_ines_hint
      - Move on -> quest1_hub

  diogo_ines_hint:
    type: message
    text: >
      DIOGO: nao sei bem. ela tava a tirar fotos perto da casa que
      a filipa alugou e viu tipo a filipa a meter cenas na carrinha
      do tiago?? ou alguma cena assim. ela ta bue assustada nao quer
      falar. tenta falar com ela mas tipo sem pressao, a miuda e
      timida. fala primeiro de fotografia que ela abre-se
    effects: { trust_diogo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Quinta do Rio. A Douro Valley village
      built around the terraces and the river. A muralist who was
      painting the truth about a dam project. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Beatriz (Tiago's best friend) -> beatriz_q1
      - Talk to Leonor (Tiago's girlfriend) -> leonor_q1
      - Check what Miguel (Tiago's brother) is saying -> miguel_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Beatriz Q1 ---

  beatriz_q1:
    type: tweet
    from: beatriz
    text: >
      se alguem tiver noticias do @tiago_ferreira por favor liguem-me.
      os sprays dele estao no atelier. o caderno de desenhos ta la.
      ele nunca iria embora sem o caderno. nunca.
    effects: { trust_beatriz: "+5", contacts_followed: "+1" }
    choices:
      - DM Beatriz -> beatriz_q1_talk

  beatriz_q1_talk:
    type: message
    text: >
      BEATRIZ: Agradeco a preocupacao mas nao te conheco. O Tiago tem
      muitos amigos aqui. Tenho a certeza que ele vai voltar.

      ...ando a dizer isto a mim propria. Ja nao acredito.

      [Beatriz is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_beatriz: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Leonor Q1 ---

  leonor_q1:
    type: tweet
    from: leonor
    text: >
      o meu namorado desapareceu e a gnr diz que se calhar foi pintar
      para outra terra. o tiago nao sai daqui sem me dizer. sem me
      abracar. sem o caderno dele. puta que pariu facam alguma coisa.
    effects: { trust_leonor: "+5", contacts_followed: "+1" }
    choices:
      - DM Leonor -> leonor_q1_talk

  leonor_q1_talk:
    type: message
    text: >
      LEONOR: Quem es tu? Mais uma pessoa que vai dizer para eu ter
      calma? O Tiago ligou-me naquela noite. Disse que tinha descoberto
      uma cena enorme sobre os contratos da barragem. Disse "se me
      acontecer alguma coisa, procura nos ficheiros do presidente."

      Depois desligou. Foi a ultima vez que ouvi a voz dele.
    effects: { trust_leonor: "+10" }
    choices:
      - What do you think happened? -> leonor_theory
      - Move on -> quest1_hub

  leonor_theory:
    type: message
    text: >
      LEONOR: Acho que ele descobriu que o Henrique Monteiro esta a
      lucrar com a barragem e eles calaram-no. Mas tambem acho que
      aquela gaja — a Filipa da galeria — sabe mais do que diz.
      A maneira como ela falava do Tiago... nao era so negocio.
      Era outra coisa.

      O Tiago disse-me ha meses que alguem andava a seguir o trabalho
      dele de uma forma estranha. Que aparecia sempre nos sitios onde
      ele ia pintar. Ele achou que era coincidencia. Eu acho que nao era.
    effects: { trust_leonor: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Miguel Q1 ---

  miguel_q1:
    type: tweet
    from: miguel
    text: >
      o meu irmao DESAPARECEU e a gnr diz-me que se calhar foi viajar???
      O TIAGO NAO VIAJA SEM AVISAR. venho de porto. alguem me vai
      explicar o que se passou caralho.
    effects: { trust_miguel: "+5", contacts_followed: "+1" }
    choices:
      - DM Miguel -> miguel_q1_talk

  miguel_q1_talk:
    type: message
    text: >
      MIGUEL: Quem es? Mais um da vila que me vai dizer para ter calma?
      O meu irmao nao desaparece assim. Ele ama esta terra. Ama as
      vinhas, o rio, os muros. Ele nunca ia embora sem avisar.

      E eu sei que ele andava metido numa cena grande. Andava a
      investigar os contratos da barragem. Disse-me que tinha encontrado
      documentos que provavam que a construtora era da familia do
      presidente. Filho da puta.
    effects: { trust_miguel: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Tiago went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Ines (was photographing near the gallery) -> ines_interview
      - Find Jorge (boatman, works early on the river) -> jorge_interview
      - Find Catarina (adega owner, heard something at night) -> catarina_interview
      - Find Teresa (pharmacist, saw something at dawn) -> teresa_interview

  # --- Ines (saw someone at Tiago's van) ---

  ines_interview:
    type: tweet
    from: ines
    text: >
      tava a tirar fotos ao por do sol e vi uma cena que nao devia
      ter visto. to com medo de falar. desculpem.
    effects: { trust_ines: "+5" }
    choices:
      - Ask Ines what she saw -> ines_talk

  ines_talk:
    type: message
    text: >
      INES: ya ok mas nao dizes a ninguem. eu tava perto da casa que
      a filipa alugou, a tirar fotos da luz no rio. e vi a filipa a
      mexer na carrinha do tiago. tipo, a porta de tras tava aberta e
      ela tava a meter alguma cena la dentro. tipo uma caixa pequena.

      quando me viu ficou bue estranha e disse que tava so a devolver
      uma cena ao tiago. mas tipo... as dez da noite? sozinha?

      eu fiquei bue assustada e fui-me embora. no dia seguinte o
      tiago desapareceu.
    effects:
      trust_ines: "+10"
      night_witnesses: "+1"
      dealer_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Jorge (boatman, saw late-night meeting) ---

  jorge_interview:
    type: tweet
    from: jorge
    text: >
      Lembrete: o cais esta fechado entre as 23h e as 6h. Tenho
      notado movimentos estranhos a noite no caminho do rio.
    effects: { trust_jorge: "+5" }
    choices:
      - Ask Jorge what he saw -> jorge_talk

  jorge_talk:
    type: message
    text: >
      JORGE: Eu tava a preparar o barco de madrugada, por volta das
      cinco. Vi dois homens no caminho de cima, perto do mural novo
      que o Tiago tinha acabado de pintar. Estavam a tapar o mural
      com tinta cinzenta. A apaga-lo.

      Um deles eu reconheci: o Vasco Teixeira, o diretor de projeto
      da HidroDouro. O outro nao sei.

      As cinco da manha. A apagar um mural. No dia em que o Tiago
      desapareceu. Escrevi no meu diario de bordo. Ninguem me
      perguntou nada.
    effects:
