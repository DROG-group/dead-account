entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN FERRIÈRES-LES-FORGES
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to ferrieres.social — the community Mastodon instance for
      the Wallonian industrial town of Ferrières-les-Forges.

      The local feed is agitated. Something is wrong.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name over and over:
      @noemie_claessens.

      A young chocolatier. She ran a tiny artisan workshop called La Forge
      Sucrée in an old converted forge building. She made pralines from
      single-origin cacao. The town adored her. She hasn't posted in six
      days.
    choices:
      - Look at her profile -> noemie_profile

  noemie_profile:
    type: tweet
    from: noemie
    text: "L'eau du robinet a un goût bizarre depuis des mois. J'ai fait analyser. Les résultats sont... je publie ça demain. SolvaChem va devoir répondre."
    choices:
      - That's her last real post... -> grey_photo

  grey_photo:
    type: message
    text: >
      Three days after that post, her account uploaded a single photo:
      a blurred shot of the terril — the old slag heap — at night. No
      caption. Posted at 2am. Overexposed, off-angle. Not her style
      at all.

      Noémie was known for careful, warm photos of her chocolates, her
      workshop, the old streets. This looked like someone else took it.
      Or she was running when she shot it.

      The police say she probably left town for personal reasons.
      Nobody in Ferrières believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: inspecteur
    text: >
      Nous avons été informés d'un signalement de disparition concernant
      une résidente de Ferrières-les-Forges. À ce stade, aucun élément
      ne permet de conclure à un acte criminel. Toute information utile
      peut être communiquée au 101 ou au commissariat.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are frantic. Her best friend @mathilde_dubois is
      panicking. Her brother @antoine_claessens is driving down from
      Charleroi. Her ex @liam_devos is posting old photos of her.
      The baker @baptiste_lejeune says her shop has been dark for days.

      And @maxime_vandenberghe — the rival chocolatier whose family
      business has been in Ferrières for three generations — posted
      a suspiciously sympathetic message. He and Noémie had been in a
      bitter business dispute for months.

      The journalist @sarah_fontaine hasn't said a word. That's
      unusual for someone who covers everything in this town.
    effects: { trust_mathilde: "+5", trust_antoine: "+5" }
    choices:
      - Start following Noémie's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Ferrières-les-Forges. Follow Noémie's contacts and
      read their posts. The more you engage with the community, the
      more they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Lucienne (brasserie owner, knows everyone) -> lucienne_intro
      - Talk to Julien (factory worker, angry about SolvaChem) -> julien_intro
      - Talk to Yasmina (teen, Noémie's apprentice) -> yasmina_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Noémie with the daily rhythms of a
      post-industrial Wallonian town: terril hike schedules, brasserie
      specials, complaints about the bus to Liège, weather alerts.

      Key names surface: Mathilde (best friend, chemistry student),
      Liam (ex-boyfriend, photographer), Maxime Vandenberghe (rival
      chocolatier, openly hostile), and the teens — Yasmina, Kévin,
      Amélie — who hung around Noémie's workshop after school.

      Also prominent: SolvaChem Industries, the chemical plant by the
      old canal. Their posts are corporate PR. Noémie's last post
      was the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Lucienne -> lucienne_intro
      - Talk to Julien -> julien_intro
      - Talk to Yasmina -> yasmina_intro

  # --- Lucienne (social map) ---

  lucienne_intro:
    type: tweet
    from: lucienne
    text: >
      La brasserie est ouverte mais j'ai pas le cœur à servir des
      frites. @noemie_claessens, ta place au comptoir est vide. Reviens
      nous petite.
    effects: { trust_lucienne: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Lucienne -> lucienne_talk

  lucienne_talk:
    type: message
    text: >
      LUCIENNE: Ah, you're new here? Welcome to Ferrières. Terrible
      timing though. Everyone's gutted about Noémie.

      Let me fill you in. Mathilde is Noémie's best friend — chemistry
      student at ULiège, they share everything. Antoine is her older
      brother, nurse in Charleroi, completely beside himself. Liam is
      her ex, a photographer, they split six months ago but stayed
      close. Maybe too close, some say.

      Then there's Maxime Vandenberghe. His family has had the chocolate
      shop here for three generations. When Noémie opened La Forge Sucrée
      two years ago with her artisan approach, his sales dropped. He's
      been furious. Threatening legal action, spreading rumours, the
      whole bit. Putain, that man has no shame.

      And SolvaChem — the factory by the canal — Noémie was onto
      something about their waste. She had water tested. She was going
      to go public. Then she vanished.
    effects: { trust_lucienne: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Maxime -> lucienne_maxime
      - Ask about SolvaChem -> lucienne_solvachem
      - Thank her and move on -> quest1_hub

  lucienne_maxime:
    type: message
    text: >
      LUCIENNE: Maxime? Bordel, where do I start. His grandfather
      founded Vandenberghe Chocolats in 1965. Maxime took over five
      years ago. Business was steady — tourist pralines, nothing
      special. Then Noémie arrived with her single-origin cacao,
      her bean-to-bar process, her Instagram-worthy workshop.

      The young people loved it. His sales tanked. He accused her of
      stealing recipes — merde, she doesn't even use the same
      techniques. He sent her a legal letter. He tried to get the
      commune to revoke her permit. He told everyone she was using the
      old forge building illegally.

      Last month someone smashed her shop window at night. No proof
      it was him. But everyone knows.
    effects: { trust_lucienne: "+5" }
    choices:
      - Ask about SolvaChem -> lucienne_solvachem
      - Move on -> quest1_hub

  lucienne_solvachem:
    type: message
    text: >
      LUCIENNE: SolvaChem has been here since the 80s. Industrial
      solvents, cleaning chemicals, that kind of thing. Two hundred
      jobs — half the town works there or knows someone who does.
      Nobody asks too many questions.

      But the water has been weird for months. Tastes metallic.
      Noémie noticed it because it affected her chocolate — she uses
      local water in her ganaches. She got it tested at ULiège through
      Mathilde. She said the results were "insane." Heavy metals way
      over the limit.

      She was going to publish everything. Then poof — gone.
    effects: { trust_lucienne: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Julien (factory worker, witness tease) ---

  julien_intro:
    type: tweet
    from: julien
    text: >
      20 ans que je bosse dans cette usine de merde. l'eau est dégueulasse
      et tout le monde s'en fout. @noemie_claessens avait raison. et
      maintenant elle a disparu. faites le calcul.
    effects: { trust_julien: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Julien -> julien_talk

  julien_talk:
    type: message
    text: >
      JULIEN: I've been a union delegate at SolvaChem for twelve years.
      I know every pipe, every tank, every discharge point. And I'm
      telling you — what comes out of that factory is not what they
      report.

      There's a drainage channel that runs from the old storage yard
      to the canal. It's not on any permit. At night, when the
      inspectors are sleeping, they open the valves. The water in the
      canal turns grey. The fish died years ago.

      Noémie took samples. She had the numbers. She was the first
      person brave enough to say it out loud. Now she's gone. Tu
      crois que c'est un hasard? Moi non.
    effects: { trust_julien: "+10" }
    choices:
      - Did you see anything unusual recently? -> julien_night
      - Move on -> quest1_hub

  julien_night:
    type: message
    text: >
      JULIEN: The night before she disappeared — I was on the late
      shift, finished at 23h. Walking to my car I saw a black BMW
      in the SolvaChem executive parking. Hugo Mertens' car — the
      plant director. At 23h on a Tuesday. He never stays past 18h.

      And there was another car there I didn't recognise. Nice car
      though. Dark blue Audi. Not a factory worker's car, I can
      tell you that.

      I didn't think much of it. Now I think about it a lot.
    effects: { trust_julien: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Yasmina (teen, Noémie's apprentice) ---

  yasmina_intro:
    type: tweet
    from: yasmina
    text: >
      wesh sah c'est pas possible que noémie soit partie comme ça.
      elle m'apprenait le tempérage du chocolat wallah c'était ouf
      comme personne. si qqn sait un truc dites le svp putain
    effects: { trust_yasmina: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Yasmina -> yasmina_talk_early

  yasmina_talk_early:
    type: message
    text: >
      YASMINA: mdr t'es nouveau ici? chelou comme timing. en vrai
      noémie c'est genre la meilleure meuf de cette ville. elle nous
      laissait venir à l'atelier après les cours, elle nous filait
      du chocolat, elle nous apprenait des trucs. c'était trop bien.

      et la jsuis trop flippée pcq kévin il a vu un truc ouf l'autre
      soir devant l'atelier mais il veut pas en parler. il dit que
      c'est rien mais bordel c'est chelou sah
    effects: { trust_yasmina: "+10" }
    choices:
      - What did Kévin see? -> yasmina_kevin_hint
      - Move on -> quest1_hub

  yasmina_kevin_hint:
    type: message
    text: >
      YASMINA: jsp exactement. il faisait du skate sur le parking du
      terril et il a vu genre qqn devant l'atelier de noémie. le
      gars il fouillait dans les poubelles?? ou il regardait par la
      fenêtre, un truc chelou comme ça. kévin dit que c'était
      vandenberghe — le chocolatier là — mais il flippe de le dire
      pcq le gars il est ouf, genre agressif.

      faut que tu parles à kévin direct mais wesh il fait pas
      confiance aux gens qu'il connaît pas. parle lui de skate
      d'abord ptdr
    effects: { trust_yasmina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Ferrières-les-Forges. A Wallonian town
      built on coal and industry, now struggling with decline. A young
      chocolatier who was exposing chemical pollution. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Mathilde (Noémie's best friend) -> mathilde_q1
      - Talk to Liam (Noémie's ex) -> liam_q1
      - Check what Antoine (Noémie's brother) is saying -> antoine_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Mathilde Q1 ---

  mathilde_q1:
    type: tweet
    from: mathilde
    text: >
      si quelqu'un a des nouvelles de @noemie_claessens appelez moi svp.
      son atelier est fermé. ses moules à chocolat sont encore sur la
      table. elle serait JAMAIS partie sans ranger son atelier. jamais.
    effects: { trust_mathilde: "+5", contacts_followed: "+1" }
    choices:
      - DM Mathilde -> mathilde_q1_talk

  mathilde_q1_talk:
    type: message
    text: >
      MATHILDE: I appreciate the concern but I don't know you. Noémie
      has lots of followers. I'm drowning in messages. I can't sort
      out who actually cares from who's just nosy.

      ...sorry. I'm losing it. She's my best friend and nobody's
      doing anything.

      [Mathilde is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_mathilde: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Liam Q1 ---

  liam_q1:
    type: tweet
    from: liam
    text: >
      throwback to noémie tempering chocolate at 6am, light coming
      through the forge windows. she made everything beautiful. she
      wouldn't just leave. [photo attached]
    effects: { trust_liam: "+5", contacts_followed: "+1" }
    choices:
      - DM Liam -> liam_q1_talk

  liam_q1_talk:
    type: message
    text: >
      LIAM: Yeah, I'm her ex. We broke up in January — my fault, I was
      never around, always on assignment. We stayed friends. Good friends.
      She called me the week before she vanished. She sounded scared.

      She said someone had been hanging around her atelier at night.
      She said she was getting threatening messages about dropping the
      water investigation. And she said Maxime Vandenberghe told her
      to her face that he'd "make her regret" opening La Forge Sucrée.

      I told her to go to the police. She said they wouldn't care.
      She was right.
    effects: { trust_liam: "+10" }
    choices:
      - Did she say who was threatening her? -> liam_threats
      - Move on -> quest1_hub

  liam_threats:
    type: message
    text: >
      LIAM: She wasn't sure. The messages came from anonymous accounts.
      But she thought there were two separate things happening — the
      chemical company wanting her to shut up about the water, and
      Vandenberghe wanting her to shut down her shop. Two different
      enemies, both closing in.

      She said "I'm stuck between a factory and a psychopath." She
      laughed when she said it. Noémie always laughed when she was
      terrified.
    effects: { trust_liam: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Antoine Q1 ---

  antoine_q1:
    type: tweet
    from: antoine
    text: >
      ma sœur a DISPARU et la police me dit qu'elle est peut-être
      partie en weekend??? ELLE DIRIGE UN ATELIER ELLE PART PAS
      COMME ÇA. j'arrive de charleroi. quelqu'un va m'expliquer
      bordel.
    effects: { trust_antoine: "+5", contacts_followed: "+1" }
    choices:
      - DM Antoine -> antoine_q1_talk

  antoine_q1_talk:
    type: message
    text: >
      ANTOINE: Who are you? Another stranger who's going to tell me
      to stay calm? My sister called me two nights before she went
      silent. She said "if something happens to me, look at
      Vandenberghe and look at SolvaChem." Both of them.

      She said Vandenberghe was obsessed with destroying her business
      and SolvaChem was panicking about what she found in the water.
      She said she had proof of everything but she was scared.

      That's the last I heard from her. Putain.
    effects: { trust_antoine: "+10" }
    choices:
      - What do you think happened? -> antoine_theory
      - Move on -> quest1_hub

  antoine_theory:
    type: message
    text: >
      ANTOINE: I think there are two things going on. SolvaChem is
      dumping chemicals and Noémie had the evidence to prove it. That's
      a corporate problem — they'd try to shut her up legally, maybe
      illegally.

      But Vandenberghe? That's personal. He's been harassing her for
      a year. Legal threats, smashed windows, showing up at the atelier
      at closing time. The man is unhinged. Noémie told me he stood
      outside her flat at 1am last month. Just standing there.

      I think one of them pushed too far. Maybe both. Merde.
    effects: { trust_antoine: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Noémie went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Kévin (was skating near the atelier) -> kevin_interview
      - Find Baptiste (baker, starts at 4am) -> baptiste_interview
      - Find Fatima (pharmacist, lives above the shop) -> fatima_interview
      - Find Julien (factory worker, late shift) -> julien_interview_q2

  # --- Kévin (saw Vandenberghe at the atelier) ---

  kevin_interview:
    type: tweet
    from: kevin
    text: >
      session skate au terril ce soir mais c chelou l'ambiance en ce
      moment. genre y'a un truc qui va pas dans cette ville. jsp
      comment dire
    effects: { trust_kevin: "+5" }
    choices:
      - Ask Kévin about that evening -> kevin_talk

  kevin_talk:
    type: message
    text: >
      KÉVIN: wesh frr ok mais tu le dis à personne hein. j'étais au
      parking du terril vers 20h, session skate. et j'ai vu
      vandenberghe — le chocolatier — devant l'atelier de noémie. il
      avait une lampe torche et il regardait par les fenêtres. genre
      il prenait des photos avec son tel.

      quand il m'a vu il est parti direct en mode stress. il avait
      l'air ouf sah genre possédé.

      moi j'ai rien dit pcq le gars il fait flipper mais la c'est
      trop chelou bordel
    effects:
      trust_kevin: "+10"
      night_witnesses: "+1"
      competitor_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Baptiste (baker, saw cars at night) ---

  baptiste_interview:
