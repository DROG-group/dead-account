  water_analysis:
    type: message
    text: >
      Mathilde, as a chemistry student, helped Noémie get the water
      tested at ULiège. The public health database shows Ferrières'
      municipal water reports — all within normal limits.

      But Noémie's independent samples, shared with Mathilde before
      she vanished, tell a different story: cadmium at 12x the EU
      limit. Mercury at 8x. Lead at 15x. All from taps within 500m
      of the SolvaChem drainage channel.

      The municipal reports are either wrong or falsified. The
      independent lab at ULiège is accredited. Someone is lying.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
