    text: >
      You present your evidence to Vandenberghe:

      "I know @nadia_vantour is your account. I know you were at her
      atelier with a crowbar. I know you've been watching her flat
      from your car. I know you smashed her window. I have witnesses,
      I have screenshots, and I have her own documentation of every
      threat you've made."
    choices:
      - Send -> vandenberghe_response

  vandenberghe_response:
    type: message
    text: >
      Vandenberghe doesn't reply for a long time. Then:

      MAXIME: You don't understand. She was destroying everything my
      family built. Three generations of chocolatiers, and some girl
      with an Instagram account takes it all away? I was protecting
      my heritage. My legacy. Everything I did was to defend what's
      mine.

      That's not defending a business. That's obsession.

      You've already sent the evidence to Inspecteur Delvaux. And
      to Sarah Fontaine.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Inspecteur Delvaux opens a full investigation. With your
      evidence — the anonymous account, the attempted break-in, the
      surveillance, the witness testimonies, Noémie's own documentation
      — Maxime Vandenberghe is arrested for stalking, harassment, and
      attempted burglary. His shop is closed pending trial.

      Sarah Fontaine, with Noémie's full evidence package and Margaux's
      original lab reports, publishes the SolvaChem story in Le Soir.
      The SPW Environnement orders an unannounced inspection. The
      factory's hidden drainage channel is discovered. Hugo Mertens
      faces criminal charges for falsifying discharge data and
      illegal dumping. Two hundred jobs hang in the balance, but the
      remediation creates new work.

      And Noémie Claessens, reading the story from a friend's
      apartment in Namur, calls her brother for the first time in
      nine days.

      "Je rentre à la maison. La forge sucrée rouvre lundi."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: noemie
    text: >
      le chocolat a besoin d'eau propre. ferrières a besoin de vérité.
      merci de ne pas avoir lâché. la prochaine fournée de pralines
      est pour vous.
    choices:
      - The End -> game_complete

  # --- ENDING B: Mertens (Partial Ending) ---

  confront_mertens:
    type: message
    text: >
      You present the pollution evidence to Hugo Mertens:

      "I have independent water analysis showing heavy metals at 15
      times the legal limit. I have photos of your hidden drainage
      channel. I have original lab reports from your own technician
      proving the data was falsified. I have the buried drums with
      your batch numbers."
    choices:
      - Send -> mertens_response

  mertens_response:
    type: message
    text: >
      HUGO: This conversation is being forwarded to our legal
      department. Any publication of defamatory material concerning
      SolvaChem Industries will result in immediate judicial action.
      We have always operated within the framework of our regulatory
      permits.

      But it's too late. You've sent the evidence to Sarah, to
      Terrils Vivants, and to the SPW Environnement.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. SolvaChem is ordered to halt all
      discharge pending investigation. The factory may close. Two
      hundred jobs are at risk. The town is bitterly divided — some
      blame Noémie for threatening their livelihoods.

      But Noémie?

      Without the stalking evidence, Vandenberghe is never investigated.
      He continues to operate his chocolate shop three streets from La
      Forge Sucrée. He creates a new anonymous account. He drives past
      her atelier every night.

      Four months later, Noémie reads about SolvaChem online. She
      returns quietly. She reopens the atelier but changes the locks,
      installs cameras, and never works alone after dark. She flinches
      when the door opens.

      The corporation is exposed. But the man who terrorised Noémie
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: noemie
    text: "je suis rentrée. l'eau sera propre un jour. le reste... on verra."
    choices:
      - The End -> game_complete

  # --- ENDING C: Bourgmestre (Wrong Ending) ---

  confront_philippe:
    type: message
    text: >
      You confront Bourgmestre Renard with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> philippe_response

  philippe_response:
    type: tweet
    from: commune
    text: >
      La commune prend note des allégations portées à notre attention.
      Toute diffusion de propos diffamatoires à l'encontre des élus
      ou des acteurs économiques de Ferrières fera l'objet de
      poursuites. — Service juridique, Commune de Ferrières-les-Forges
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The bourgmestre's legal team buries your accusation. Without a
      direct link between Renard and SolvaChem's dumping — and there
      isn't one beyond political complicity — your evidence is
      insufficient.

      SolvaChem continues to operate. Vandenberghe continues to watch.
      Noémie stays in hiding.

      Six months later, @nadia_vantour creates a new account. It
      follows Noémie's brother. And the water still tastes of metal.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: FERRIÈRES-LES-FORGES — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Competitor evidence: ${competitor_evidence}

      Thank you for playing. Noémie's story explores themes of
