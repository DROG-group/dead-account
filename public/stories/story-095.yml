      Always more.

      Healthy zones get reclassified as infested. My original surveys
      show maybe 15% beetle damage. The permits say 80%. That's how
      they get approval to clearcut.

      Jana's GPS data matched MY original survey numbers, not the
      ones in the official permits. She had independent proof that
      ŠumavaDřevo is falsifying their forest health assessments.

      Mám strach. I have a family. But I kept copies of my original
