      danger from ŠumavaDřevo and she wouldn't let me help. I needed
      to know she was safe. The forest is dangerous and she went
      alone. Everything I did was because I care about her work.
      About her.

      That's not care. That's obsession.

      You've already sent the evidence to Strážník Holub. And to
      Klára Veselá.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Strážník Holub reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the trail logs, the
      witness testimonies — Radek is arrested for stalking and
      harassment. A GPS tracker is recovered from under Jana's
      Škoda Fabia at the forest chapel near Mechový vrch.

      Klára Veselá, finally in possession of Jana's full evidence
      package, publishes the ŠumavaDřevo story in Šumavský deník
      and it's picked up by iDNES. The krajský úřad orders an
      unannounced inspection. The logging operation is halted pending
      environmental review. Libor Tůma faces criminal charges for
      falsifying forest health surveys.

      And Jana Procházková, reading the story from a friend's cottage
      in Sušice, calls her brother for the first time in nine days.

      "Vracím se domů."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: jana
    text: >
      příroda nelže. a lidi ze šumavských plání taky ne. díky že
      jste to nevzdali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Libor (Partial Ending) ---

  confront_libor:
    type: message
    text: >
      You present the logging evidence to Libor Tůma:

      "I have GPS coordinates of healthy trees felled as beetle
      salvage. I have photos of green stumps with no beetle damage.
      I have the original survey data showing the permits were
      falsified. I have the 218-year-old beech stump."
    choices:
      - Send -> libor_response

  libor_response:
    type: message
    text: >
      LIBOR: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. ŠumavaDřevo has always operated
      within forestry regulations.

      But it's too late. You've sent the evidence to Klára, to the
      Spolek Šumavský les, and to the krajský úřad.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The logging story breaks. ŠumavaDřevo is ordered to halt all
      felling pending investigation. The operation may shut down.
      A hundred and twenty jobs hang in the balance. The village is
      divided.

      But Jana?

      Without the stalking evidence, Radek is never investigated. He
      continues to roam the forest. He continues to monitor her
      accounts. He creates a new anonymous profile.

      Three months later, Jana reads about ŠumavaDřevo online. She
      returns quietly. She changes her foraging routes. She stops
      going into the forest alone. She checks under her car every
      morning.

      The corporation is exposed. But the person who terrorised Jana
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: jana
    text: "jsem zpátky. les se uzdravuje. zbytek... uvidíme."
    choices:
      - The End -> game_complete

  # --- ENDING C: Starosta (Wrong Ending) ---

  confront_miroslav:
