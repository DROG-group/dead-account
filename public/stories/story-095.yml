  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The starosta's lawyer buries your accusation. Without a direct
      link between Černý and ŠumavaDřevo's fraud — and there isn't
      one beyond political protection — your evidence is insufficient.

      ŠumavaDřevo continues to operate. Radek continues to watch.
      Jana stays in hiding.

      Six months later, @petra_nova creates a new account. It follows
