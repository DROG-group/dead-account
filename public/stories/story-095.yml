entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN ŠUMAVSKÉ PLÁNĚ
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to SumavskePlane.social — the community Mastodon instance
      for the highland village of Šumavské Pláně, Šumava, Czech Republic.

      The local feed is unsettled today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @jana_prochazkova.

      A mushroom forager. Herbalist. She documented the forests, the
      fungi, the old remedies. People are worried. She hasn't posted
      in six days.
    choices:
      - Look at her profile -> jana_profile

  jana_profile:
    type: tweet
    from: jana
    text: "Těžba u Jezerního hřbetu je mimo povolení. Kácejí zdravé stromy a vydávají to za kůrovcovou kalamitu. Mám důkazy."
    choices:
      - That's her last real post... -> strange_photo

  strange_photo:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurry photo of fog over a clearcut hillside. Posted at 2am.
      No caption. No hashtags.

      Her friends say that's not her style. Jana always wrote long
      captions about what she found in the forest. The police say she
      probably went hiking and lost signal. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: straznik
    text: >
      Obdrželi jsme oznámení o pohřešované obyvatelce Šumavských Plání.
      V současné chvíli nemáme důvod se domnívat, že došlo k trestnému
      činu. Případné informace sdělte na lince 158 nebo na obvodním
      oddělení.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her roommate @ludmila_sedlackova is
      desperate. Her brother @marek_prochazka is driving from Klatovy.
      Her colleague @pavel_hruby is posting worried messages. The
      forester @zdenek_kolar says she was right about the logging.

      And the journalist @klara_vesela is strangely silent.

      Nobody buys the police line. Nobody thinks Jana just "went
      hiking."
    effects: { trust_marek: "+5", trust_ludmila: "+5" }
    choices:
      - Start following Jana's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Šumavské Pláně. Follow Jana's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Božena (pub owner, knows everyone) -> bozena_intro
      - Talk to Zdeněk (forester, saw the logging) -> zdenek_intro
      - Talk to Tereza (teen photographer, seems shaken) -> tereza_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Jana with the rhythms of a small
      highland village: weather warnings, mushroom season updates,
      Jaromír's weekend sausage specials, trail conditions.

      Key names surface: Ludmila (roommate, teacher), Pavel (hiking
      guide, seems rattled), Klára (journalist, oddly quiet), and
      the teens — Tereza, Vojtěch, Adéla — who idolised Jana's
      forest knowledge.

      Also prominent: ŠumavaDřevo s.r.o., the logging company at
      the edge of the forest. Their posts are corporate greenwashing.
      Jana's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Božena -> bozena_intro
      - Talk to Zdeněk -> zdenek_intro
      - Talk to Tereza -> tereza_intro

  # --- Božena (social map) ---

  bozena_intro:
    type: tweet
    from: bozena
    text: >
      Hospoda je otevřená ale nálada je na hovno. @jana_prochazkova,
      tvůj guláš čeká. Vrať se nám.
    effects: { trust_bozena: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Božena -> bozena_talk

  bozena_talk:
    type: message
    text: >
      BOŽENA: Ty jsi nový? Vítej. Strašný čas přijít. Všichni jsou
      z Jany na nervy.

      Translated: You're new? Welcome. Terrible time to arrive.
      Everyone's on edge about Jana.

      Let me tell you who's who. Ludmila is Jana's roommate — they
      share a cottage near the church. Sweet woman, devastated right
      now. Pavel Hrubý is a hiking guide — he and Jana did forest
      tours together. Smart man, but... intense about her. Marek is
      Jana's older brother, coming from Klatovy.

      And Klára Veselá — the journalist — she and Jana were working
      on something together. Something about the logging. Klára hasn't
      said a word since Jana vanished. That's not like her at all.

      Oh, and don't bother reading ŠumavaDřevo's posts. Lži zabalený
      do FSC certifikátů. Lies wrapped in FSC certificates.
    effects: { trust_bozena: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Radek Novotný -> bozena_radek
      - Ask about ŠumavaDřevo -> bozena_drevo
      - Thank her and move on -> quest1_hub

  bozena_radek:
    type: message
    text: >
      BOŽENA: Radek? That mushroom guy? He showed up about two years
      ago. Started running competing foraging tours. He's obsessed with
      mushrooms — okay, lots of people are — but he's obsessed with
      Jana too. Sits in the pub every time she's here. Asks me which
      trails she's on that day.

      She told him to stop following her routes. He said he wasn't.
      But everybody saw him turning up at her spots ten minutes after
      her. Every time.

      Jana told me once, "Ten chlap mě děsí." That man scares me.
      I thought she was exaggerating. Now I'm not sure.
    effects: { trust_bozena: "+5" }
    choices:
      - Ask about ŠumavaDřevo -> bozena_drevo
      - Move on -> quest1_hub

  bozena_drevo:
    type: message
    text: >
      BOŽENA: That company has been here since the 90s. Logging, timber
      processing, whatever. The village tolerated them because they
      brought jobs. But the old foresters have been complaining for
      years — clearcuts where there should be selective felling,
      healthy trees marked as bark beetle damage, trucks running at
      night.

      Jana was the first person to actually go into the restricted
      zones with a camera and GPS. She had proof, she said. Real proof
      that they were logging healthy forest under cover of the bark
      beetle emergency. Two weeks later she's gone.

      Do prdele, use your brain. To přece není náhoda.
    effects: { trust_bozena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Zdeněk (the forest, witness tease) ---

  zdenek_intro:
    type: tweet
    from: zdenek
    text: >
      třicet let chodím do těhle lesů. stromy mizí. @jana_prochazkova
      měla pravdu. a teď zmizela i ona. spojte si to.
    effects: { trust_zdenek: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Zdeněk -> zdenek_talk

  zdenek_talk:
    type: message
    text: >
      ZDENĚK: I've been working these forests since I was eighteen.
      I know every ridge, every clearing, every stream. And I'm telling
      you — the logging at Jezerní hřbet is wrong. They're cutting
      healthy spruce and marking it as bark beetle salvage. The stumps
      are green inside. No beetle galleries. Nothing.

      Jana took GPS coordinates. She photographed the stumps, the
      permits, the truck plates. She was building a case. And then
      poof — gone.

      You think that's a coincidence? Ty vole, I don't believe in
      coincidences in the forest.
    effects: { trust_zdenek: "+10" }
    choices:
      - Did you see anything unusual recently? -> zdenek_night
      - Move on -> quest1_hub

  zdenek_night:
    type: message
    text: >
      ZDENĚK: The night before she vanished — I was coming back from
      checking a deer feeding station, around midnight. I saw lights
      on the forest road near Jezerní. Not the logging trucks — they
      run with headlights. This was a car, parked, lights off. Engine
      running.

      And another car nearby. Jana's old green Škoda Fabia. Parked at
      the trailhead.

      At midnight. At the restricted logging zone.

      I didn't think much of it then. Now I think about it constantly.
    effects: { trust_zdenek: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tereza (teen photographer, witness tease) ---

  tereza_intro:
    type: tweet
    from: tereza
    text: >
      to je v piči lidi @jana_prochazkova mě naučila poznávat houby
      a bylinky a teď je prostě pryč?? to jako fakt není možný.
      jestli někdo něco ví tak to řekněte kurva
    effects: { trust_tereza: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tereza -> tereza_talk_early

  tereza_talk_early:
    type: message
    text: >
      TEREZA: ty jsi novej? ty vole to je hustý timing. hele jana
      je jako nejlepší člověk v týhle vesnici. brala nás do lesa,
      ukazovala nám houby, učila nás rozeznávat jedlý od jedovatejch.
      mega.

      a teď jsem z toho v prdeli protože vojta viděl něco divnýho
      tu noc u hřbitova ale nechce o tom mluvit. říká že to nic
      nebylo ale jako... to nic nebylo jak prdel
    effects: { trust_tereza: "+10" }
    choices:
      - What did Vojta see? -> tereza_vojta_hint
      - Move on -> quest1_hub

  tereza_vojta_hint:
    type: message
    text: >
      TEREZA: nevim přesně. byl na noční vyjížďce na kole a viděl
      jak někdo něco dává do auta jany?? nebo tak něco. fakt se
      z toho posral a nechce o tom mluvit. musíš za nim jít přímo
      ale je opatrnej s lidma co nezná. zkus nejdřív mluvit o
      kolech a horách a tak lol
    effects: { trust_tereza: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Šumavské Pláně. A highland village
      in the Šumava forests. An herbalist who was exposing illegal
      logging. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Ludmila (Jana's roommate) -> ludmila_q1
      - Talk to Pavel (Jana's colleague) -> pavel_q1
      - Check what Marek (Jana's brother) is saying -> marek_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Ludmila Q1 ---

  ludmila_q1:
    type: tweet
    from: ludmila
    text: >
      prosím jestli máte nějaké zprávy o @jana_prochazkova zavolejte
      mi. její pokoj je nedotčený. bylinkový sušák je plný. nikdy
      by neodešla bez svých věcí.
    effects: { trust_ludmila: "+5", contacts_followed: "+1" }
    choices:
      - DM Ludmila -> ludmila_q1_talk

  ludmila_q1_talk:
    type: message
    text: >
      LUDMILA: I appreciate you reaching out but I don't know you.
      Jana has a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Ludmila is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_ludmila: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Pavel Q1 ---

  pavel_q1:
    type: tweet
    from: pavel
    text: >
      Les je prázdný bez @jana_prochazkova. Její mapy jsou na stole.
      Sušené houby v chatě. Nikdy by neopustila rozdělanou práci.
      Něco se stalo.
    effects: { trust_pavel: "+5", contacts_followed: "+1" }
    choices:
      - DM Pavel -> pavel_q1_talk

  pavel_q1_talk:
    type: message
    text: >
      PAVEL: Jana and I have worked together for over a year. She's
      the most knowledgeable forager I've ever met. This logging
      investigation — it was everything to her. She had GPS data,
      photos, permit numbers. She was so close to going public.

      I offered to help her. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to support her.

      [Pavel seems earnest. Or obsessive?]
    effects: { trust_pavel: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marek Q1 ---

  marek_q1:
    type: tweet
    from: marek
    text: >
      moje sestra ZMIZELA a policajti mi říkají že si možná šla na
      túru??? ONA NECHODÍ NA TÚRU BEZ TOHO ABY SE OZVALA. jedu
      z klatov. někdo mi to vysvětlí.
    effects: { trust_marek: "+5", contacts_followed: "+1" }
    choices:
      - DM Marek -> marek_q1_talk

  marek_q1_talk:
    type: message
    text: >
      MAREK: Who are you? Another person from that village who's going
      to tell me to calm down? My sister called me the night before
      she disappeared. She said she had something big. She said "jestli
      se mi něco stane, podívej se na ŠumavaDřevo." Then she hung up.

      That's the last I heard from her.
    effects: { trust_marek: "+10" }
    choices:
      - What do you think happened? -> marek_theory
      - Move on -> quest1_hub

  marek_theory:
    type: message
    text: >
      MAREK: I think she found proof that ŠumavaDřevo is illegally
      logging healthy forest and they shut her up. But I also think
      that creepy mushroom guy — Radek — knows more than he's saying.
      The way he talks about her... it's not just professional
      interest. It's something else.

      Jana told me months ago that someone was following her on her
      foraging routes. She thought it was nothing. Kurva, I don't
      think it was nothing.
    effects: { trust_marek: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Jana went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Vojta (was night cycling near the cemetery) -> vojta_interview
      - Find Ondřej (mountain hut warden, works late) -> ondrej_interview
      - Find Jaromír (butcher, early morning deliveries) -> jaromir_interview
      - Find Iva (pharmacist, insomnia, saw something from window) -> iva_interview

  # --- Vojta (saw someone at Jana's car) ---

  vojta_interview:
    type: tweet
    from: vojta
    text: >
      dobrá vyjížďka ale ta atmosféra v pláních je fakt divná. jako
      něco je špatně. neumim to popsat
    effects: { trust_vojta: "+5" }
    choices:
      - Ask Vojta about that evening -> vojta_talk

  vojta_talk:
    type: message
    text: >
      VOJTA: ty vole ok ale nikomu to neříkej jo. byl jsem na kole
      u hřbitova kolem sedmý večer. a viděl jsem toho týpka —
      radka — u auta jany. jako šmejdil kolem toho nebo něco
      dával dovnitř. když mě viděl tak zdrhnul mega rychle.

      jako já jsem nic neřek protože jsem nechtěl problémy ale
      teď je to fakt v piči. to není normální chování kurva
    effects:
      trust_vojta: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Ondřej (mountain hut warden, saw late-night meeting) ---

  ondrej_interview:
    type: tweet
    from: ondrej
    text: >
      Připomínám: lesní cesty po 22h jsou uzavřené. Zaznamenal jsem
