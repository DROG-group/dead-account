      the workshop break-in attempt, the witness testimonies — Edgars
      is arrested for stalking and harassment. A search of his rented
      house reveals a wall covered in photographs of Dace, a notebook
      detailing her daily movements for nine months, and a GPS tracker
      he ordered online.

      Santa Grīnberga, finally in possession of Dace's full botanical
      documentation, publishes the KurzemeMežs story in Kurzemes Vārds
      and Latvijas Avīze. The Vides pārraudzības birojs orders an
      unannounced inspection of Melnais purvs. The felling is halted.
      Agris Lācis faces criminal charges for environmental fraud and
      falsifying the impact assessment.

      And Dace Bērziņa, reading the story from a friend's kitchen in
      Talsi, calls her brother for the first time in nine days.

      "Es braucu mājās."
