entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PRIEŽKALNI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Priezkalns.social — the community Mastodon instance for
      the village of Priežkalni, deep in the forests of Kurzeme, Latvia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @dace_berzina.

      An herbalist. Forest healer. She documented the old medicine of
      Kurzeme's woods. People are worried. She hasn't posted in six days.
    choices:
      - Look at her profile -> dace_profile

  dace_profile:
    type: tweet
    from: dace
    text: "Izcirtums pie Melnā purva. Viņi grib iznīcināt 200 gadus vecu mežu. Man ir pierādījumi, ka atļauja ir viltota."
    choices:
      - That's her last real post... -> grey_forest

  grey_forest:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photo of pine bark. Shot at night, no focus. Posted
      at 2am. No caption.

      Her friends say that's not her style. Dace always wrote long,
      detailed posts about every plant she found. The police say she
      probably went to visit relatives. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: uldis
    text: >
      Saņemts iesniegums par Priežkalnu iedzīvotāju. Šobrīd nav
      pamata uzskatīt, ka noticis noziedzīgs nodarījums. Jebkura
      noderīga informācija var tikt paziņota pa tālruni 110 vai
      iecirknim.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @marta_liepina is
      desperate. Her brother @janis_berzins is driving from Liepāja.
      The doctor @raimonds_kalnins says it makes no sense. The hunter
      @valdis_mednis says the forest clearing is destroying everything.

      And the journalist @santa_grinberga has gone strangely silent.

      Nobody believes the police. Nobody thinks Dace just "went
      visiting relatives."
    effects: { trust_marta: "+5", trust_janis: "+5" }
    choices:
      - Start following Dace's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Priežkalni. Follow Dace's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Ilze (shop owner, knows everyone) -> ilze_intro
      - Talk to Valdis (hunter, saw the forest clearing) -> valdis_intro
      - Talk to Elīna (teen forager, seems shaken) -> elina_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Dace with the rhythms of a small
      forest village: mushroom season updates, the shop's daily
      specials, weather warnings about first frost.

      Key names surface: Marta (best friend, librarian), Raimonds
      (local doctor, seems uneasy), Santa (journalist, oddly quiet),
      and the teens — Elīna, Kristaps, Zane — who loved Dace's
      forest walks and herbal lessons.

      Also prominent: KurzemeMežs SIA, the forestry development
      company buying land around the village. Their posts are
      corporate PR. Dace's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Ilze -> ilze_intro
      - Talk to Valdis -> valdis_intro
      - Talk to Elīna -> elina_intro

  # --- Ilze (social map) ---

  ilze_intro:
    type: tweet
    from: ilze
    text: >
      Veikals atvērts, bet sirds nav vietā. @dace_berzina, tava tēja
      vēl stāv uz letes. Nāc mājās.
    effects: { trust_ilze: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ilze -> ilze_talk

  ilze_talk:
    type: message
    text: >
      ILZE: Ai, tu esi jauns? Laipni lūgti. Briesmīgs laiks, lai
      ierastos. Visi ir uz nerviem par Daci.

      Let me tell you who's who. Marta is Dace's best friend — they
      meet at the library every morning for tea. Raimonds Kalniņš is
      the village doctor, he and Dace used to argue about traditional
      versus modern medicine, but they respected each other. Jānis
      is Dace's older brother, he's coming from Liepāja.

      And Santa Grīnberga — the journalist — she and Dace were working
      on something together. Something about the forest clearing. Santa
      hasn't said a word since Dace vanished. That's not like her.

      Oh, and one more thing. There's this man — Edgars Sproģis. He
      was Dace's patient. Came to her with some chronic illness. She
      treated him with herbs and he got better. Since then he's been...
      devoted. Too devoted. Gives me the creeps.
    effects: { trust_ilze: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Edgars -> ilze_edgars
      - Ask about KurzemeMežs -> ilze_kurzeme
      - Thank her and move on -> quest1_hub

  ilze_edgars:
    type: message
    text: >
      ILZE: Edgars? He showed up about a year ago. Some city guy from
      Rīga with stomach problems and insomnia. Doctors couldn't help.
      He found Dace through some blog. She made him her teas, her
      tinctures. And he got better.

      After that, he moved here. Rented a house near the forest. Started
      coming to her workshop every day. He'd sit in her garden for hours.
      She told me once, "Viņš neredz robežas" — he doesn't see
      boundaries. She meant it as a joke. I don't think it was funny.

      The last month before she disappeared, he was sending her messages
      constantly. She showed me. Dozens a day. "Kā tu jūties? Kur tu
      esi? Vai tev vajag kaut ko?"
    effects: { trust_ilze: "+5" }
    choices:
      - Ask about KurzemeMežs -> ilze_kurzeme
      - Move on -> quest1_hub

  ilze_kurzeme:
    type: message
    text: >
      ILZE: KurzemeMežs has been buying forest land around Priežkalni
      for two years. They say it's "sustainable forestry management."
      What it actually means is clear-cutting ancient forest and selling
      the timber, then rezoning the land for holiday cabin development.

      The clearing at Melnais purvs — that's three hundred hectares of
      old-growth pine and birch. Home to orchids, medicinal plants,
      lynx. Dace documented every species there. She found that the
      environmental impact assessment was faked — they listed species
      that don't exist in Kurzeme and missed the ones actually there.

      Two weeks after she posted about it, she's gone.
    effects: { trust_ilze: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Valdis (the forest, witness tease) ---

  valdis_intro:
    type: tweet
    from: valdis
    text: >
      trīsdesmit pieci gadi šajos mežos. nekad neesmu redzējis tādu
      izciršanu kā pie melnā purva. @dace_berzina bija taisnība.
      un tagad viņa ir pazudusi. sakiet man ka tā ir sakritība.
    effects: { trust_valdis: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Valdis -> valdis_talk

  valdis_talk:
    type: message
    text: >
      VALDIS: I've walked these forests since I was a boy. I know every
      trail, every clearing, every animal path. And I'm telling you —
      what they're doing at Melnais purvs is a crime. Ancient trees
      marked for felling. Protected habitat ripped up. I found
      surveyor's stakes half a kilometre inside the nature reserve
      boundary.

      Dace was mapping the old medicinal plants there. She was building
      a case. Photographs, GPS coordinates, species lists. She was the
      only one who had the knowledge to prove the environmental
      assessment was fraud.

      You think that's a coincidence? Nu bļe, I don't believe in
      coincidences in the forest.
    effects: { trust_valdis: "+10" }
    choices:
      - Did you see anything unusual recently? -> valdis_night
      - Move on -> quest1_hub

  valdis_night:
    type: message
    text: >
      VALDIS: The night before she vanished — I was checking my hunting
      trail cameras near the clearing. Around midnight, I saw lights on
      the forest road. Not headlights — handheld flashlights. Two
      people walking toward Dace's workshop, which is at the edge of
      the forest.

      One of them I recognised by his walk: Agris Lācis, the KurzemeMežs
      director. The other was shorter, moved strangely. I couldn't
      identify him.

      At midnight. Walking to Dace's workshop. With no lights on their
      car. They didn't want to be seen.
    effects: { trust_valdis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Elīna (teen forager, witness tease) ---

  elina_intro:
    type: tweet
    from: elina
    text: >
      sūds man nav labi. @dace_berzina viņa man iemācīja atpazīt
      katru augu mežā. viņa nevar vienkārši pazust. ja kāds kaut ko
      zina lūdzu sakiet
    effects: { trust_elina: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Elīna -> elina_talk_early

  elina_talk_early:
    type: message
    text: >
      ELĪNA: tu esi jauns šeit? sūds nu kāds laiks lai ierastos. nu
      dace ir vienkārši labākais cilvēks šajā ciemā. viņa mums mācīja
      par augiem, par sēnēm, par visu. tāda kā meža skolotāja.

      un tagad es esmu nobijusies jo kristaps redzēja kaut ko dīvainu
      pie daces darbnīcas bet viņš negrib runāt. viņš saka ka tas ir
      nekas bet nu bļe... tas nav nekas
    effects: { trust_elina: "+10" }
    choices:
      - What did Kristaps see? -> elina_kristaps_hint
      - Move on -> quest1_hub

  elina_kristaps_hint:
    type: message
    text: >
      ELĪNA: es nezinu tieši. viņš bija ar bmx pie meža celiņa un
      redzēja kaut ko pie daces darbnīcas. viņš flipoja un aizbrauca.
      viņš saka ka kāds tur bija vidū naktī un kaut ko darīja pie
      durvīm. jārunā ar viņu bet viņš neuzticas svešiem. pamēģini
      vispirms parunāt par moto vai bmx lol
    effects: { trust_elina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Priežkalni. A Kurzeme forest village
      built around ancient woods. An herbalist who was exposing illegal
      forest clearing. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Marta (Dace's best friend) -> marta_q1
      - Talk to Raimonds (village doctor) -> raimonds_q1
      - Check what Jānis (Dace's brother) is saying -> janis_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Marta Q1 ---

  marta_q1:
    type: tweet
    from: marta
    text: >
      ja kādam ir ziņas par @dace_berzina lūdzu zvaniet. viņas
      darbnīca ir neaiztikta. viņas zāļu grāmata ir tur. viņa
      nekad neaiziet bez savas grāmatas.
    effects: { trust_marta: "+5", contacts_followed: "+1" }
    choices:
      - DM Marta -> marta_q1_talk

  marta_q1_talk:
    type: message
    text: >
      MARTA: I appreciate you reaching out but I don't know you.
      Dace has many friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Marta is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_marta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Raimonds Q1 ---

  raimonds_q1:
    type: tweet
    from: raimonds
    text: >
      @dace_berzina nav parādījusies uz konsultāciju. viņas pacienti
      zvana man. viņa nekad neatliek pacientus. kaut kas ir noticis.
    effects: { trust_raimonds: "+5", contacts_followed: "+1" }
    choices:
      - DM Raimonds -> raimonds_q1_talk

  raimonds_q1_talk:
    type: message
    text: >
      RAIMONDS: Dace and I didn't always agree — I'm a trained doctor,
      she's a traditional healer. But she was careful and knowledgeable.
      Her patients trusted her absolutely. She would never abandon them.

      There's one patient who concerns me — Edgars Sproģis. He came
      to Dace about a year ago. She helped him. But his attachment
      to her became... clinical. I've seen this before. It's called
      transference — the patient develops an obsessive emotional bond
      with the healer. He doesn't see Dace as a person. He sees her
      as salvation.

      That's dangerous.

      [Raimonds seems genuinely concerned.]
    effects: { trust_raimonds: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jānis Q1 ---

  janis_q1:
    type: tweet
    from: janis
    text: >
      mana māsa ir PAZUDUSI un policija man saka ka viņa varbūt
      aizbrauca pie radiem??? VIŅA NEBRAUC PIE RADIEM BEZ
      BRĪDINĀJUMA. es braucu no liepājas. kāds man paskaidros.
    effects: { trust_janis: "+5", contacts_followed: "+1" }
    choices:
      - DM Jānis -> janis_q1_talk

  janis_q1_talk:
    type: message
    text: >
      JĀNIS: Who are you? Another person from that village who's going
      to tell me to calm down? My sister called me the night before she
      disappeared. She said she had something big. She said "ja kaut
      kas notiek, skaties uz KurzemeMežs." Then she hung up.

      That's the last I heard from her.
    effects: { trust_janis: "+10" }
    choices:
      - What do you think happened? -> janis_theory
      - Move on -> quest1_hub

  janis_theory:
    type: message
    text: >
      JĀNIS: I think she found proof that KurzemeMežs falsified their
      environmental permits and they shut her up. But I also think
      that creepy patient of hers — Edgars — knows more than he's
      saying. The way he talks about her... piz*ec, it's not normal.
      It's like she's his whole world.

      Dace told me months ago that someone was leaving things at her
      workshop door. Herbs bundled the way she taught. Notes about
      her health. She thought it was sweet at first. Then it got
      darker. Notes about what she wore, where she walked.
    effects: { trust_janis: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Dace went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Kristaps (was biking near the workshop at night) -> kristaps_interview
      - Find Valdis (hunter, checks cameras at night) -> valdis_interview
      - Find Baiba (farmer, early morning at the fields) -> baiba_interview
      - Find Ārvīds (carpenter, workshop neighbour) -> arvids_interview

  # --- Kristaps (saw someone at Dace's door) ---

  kristaps_interview:
    type: tweet
    from: kristaps
    text: >
      bija laba bmx sesija bet atmosfēra pie meža ir dīvaina. kaut
      kas nav labi. ellē nesaprotu kas notiek
    effects: { trust_kristaps: "+5" }
    choices:
      - Ask Kristaps about that evening -> kristaps_talk

  kristaps_talk:
    type: message
    text: >
      KRISTAPS: nu bļe ok bet tu nevienam nesaki. es biju pie meža
      celiņa ar bmx ap 21 un redzēju to tipu — edgars — pie daces
      darbnīcas. viņš bija pie durvīm un kaut ko lika tur. tādu kā
      maisiņu. kad viņš mani pamanīja viņš aizgāja ātri af.

      nu es neko neteicu jo negribēju drāmu bet tagad tas ir sūds.
      tas nav normāli viņa uzvedība ej dirst
    effects:
      trust_kristaps: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Valdis (hunter, saw late-night visitors) ---

  valdis_interview:
    type: tweet
    from: valdis
    text: >
      Atgādinājums: meža ceļi naktī ir slēgti. Esmu konstatējis
      neatļautu pārvietošanos pēdējās naktīs.
    effects: { trust_valdis: "+5" }
    choices:
      - Ask Valdis what he saw -> valdis_talk_night

  valdis_talk_night:
    type: message
    text: >
      VALDIS: I was checking my trail cameras around 23:00. I saw a
      car on the forest road — no headlights, just parking lights.
      It stopped near the clearing at Melnais purvs. Two men got out.
      One was Agris Lācis from KurzemeMežs. The other I couldn't see
      well but he was carrying a briefcase.

