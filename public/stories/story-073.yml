  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The environmental fraud story breaks. KurzemeMežs is ordered
      to halt all operations at Melnais purvs pending investigation.
      The development project collapses. Forty jobs hang in the
      balance. The village is divided.

      But Dace?

      Without the stalking evidence, Edgars is never investigated.
      He continues to live in the village. He continues to watch
      her house. He creates a new anonymous account.

      Three months later, Dace reads about KurzemeMežs online.
      She returns quietly. She moves her workshop to Kuldīga. She
      stops leading forest walks alone. She checks the locks on her
      doors three times before sleeping.

      The forest is saved. But the person who terrorised Dace walks
      free.
