  # =====================================================================

  corruption_hub:
    type: message
    text: >
      THE CORPORATE THREAD

      SolVerde is hiding something. Miguel had proof. Now he's dead
      and his evidence is missing from the cabaña.

      Corporate evidence: ${corporate_evidence}
    choices:
      - Search the field records -> field_records
