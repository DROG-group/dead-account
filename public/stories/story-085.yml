    # === Journalist ===
    elena:
      name: "Elena Quirós"
      bio: "periodista independiente | medio ambiente y rural | tips: elena@quiros-prensa.es"
      avatar: avatars/elena.jpg

    # === SolVerde (corporate) ===
    solverde:
      name: "SolVerde Energía S.A."
      bio: "Energía solar fotovoltaica | Proyecto Peñablanca | Compromiso sostenible"
      avatar: avatars/solverde.jpg
    jorge:
      name: "Jorge Ibáñez"
      bio: "director de proyecto SolVerde Peñablanca | energía y territorio"
      avatar: avatars/jorge.jpg
