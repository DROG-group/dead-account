      avatar: avatars/aso_prados.jpg

    # === Suspicious / Other ===
    lucia:
      name: "Lucía Blanco"
      bio: "técnica de campo | SolVerde | yo solo hago mi trabajo"
      avatar: avatars/lucia.jpg
    anonimo:
      name: "AbejaOscura"
      bio: "."
      avatar: avatars/anon.jpg
    sargento:
      name: "Sargento Medina"
      bio: "Guardia Civil de Peñablanca | Puesto territorial | emergencias: 062"
      avatar: avatars/sargento.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PEÑABLANCA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Penablanca.social — the community Mastodon instance for
      the mountain village of Peñablanca, Asturias.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @miguel_torres.

      A beekeeper. Guardian of the mountain meadows. He documented the
      wildflowers and pollinators. People are devastated. He was found
      dead three days ago at the edge of his apiary.
    choices:
      - Look at his profile -> miguel_profile

  miguel_profile:
    type: tweet
    from: miguel
    text: "Los prados de la Collada de Valmonte están arrasados. Alguien ha pasado maquinaria pesada por encima de los asentamientos de abejas silvestres. Tengo fotos y muestras. Esto no queda así."
    choices:
      - That's his last real post... -> grey_meadow

  grey_meadow:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a grey hillside. Blurred, shot from a strange angle. Posted
      at 4am. No caption.

      His friends say that's not his style. The Guardia Civil says
      it was a fall near his hives — an accident. Something doesn't
      add up.
    choices:
      - Read the Guardia Civil statement -> guardia_statement
      - Look at what people are saying -> community_reaction

  guardia_statement:
    type: tweet
    from: sargento
    text: >
      Informamos del fallecimiento de un vecino de Peñablanca en las
      inmediaciones de su explotación apícola. Las primeras diligencias
      apuntan a un accidente. Cualquier información relevante puede
      comunicarse al 062.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @carmen_torres is furious.
      His best friend @dani_suarez says Miguel knew every rock on that
      mountain and would never fall. His colleague @raquel_vega is
      posting worried messages about his research.

      And the journalist @elena_quiros is strangely silent.

      Nobody buys the Guardia Civil's line. Nobody thinks Miguel just
      "fell."
    effects: { trust_carmen: "+5", trust_dani: "+5" }
    choices:
      - Start following Miguel's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Peñablanca. Follow Miguel's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Paco (bar owner, knows everyone) -> paco_intro
      - Talk to Dani (shepherd, saw the meadows) -> dani_intro
      - Talk to Lola (teen hiker, seems shaken) -> lola_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes grief about Miguel with the rhythms of a small
      mountain village: weather warnings, cheese market schedules,
      hiking trail conditions.

      Key names surface: Carmen (sister, vet), Raquel (biologist
      colleague, seems rattled), Elena (journalist, oddly quiet),
      and the teens — Lola, Iván, Pablo — who idolised Miguel's
      mountain work.

      Also prominent: SolVerde Energía S.A., the solar energy company
      clearing meadows at the edge of the village. Their posts are
      corporate greenwashing. Miguel's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Paco -> paco_intro
      - Talk to Dani -> dani_intro
      - Talk to Lola -> lola_intro

  # --- Paco (social map) ---

  paco_intro:
    type: tweet
    from: paco
    text: >
      El bar está abierto pero el alma no. @miguel_torres, tu mesa
      te espera. Hoy la sidra sabe a lágrimas.
    effects: { trust_paco: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Paco -> paco_talk

  paco_talk:
    type: message
    text: >
      PACO: Ah, you're new? Welcome. Terrible time to arrive. The
      whole village is in pieces over Miguel.

      Let me tell you who's who. Carmen is Miguel's younger sister —
      she's the vet, tough as nails, broken right now. Dani Suárez is
      his best friend since childhood, a goat herder up in the braña.
      Raquel Vega is a biologist from the university — she worked with
      Miguel on the pollinator study. Smart woman, but... she had a
      thing for him. Everyone could see it except Miguel.

      And Elena Quirós — the journalist — she and Miguel were building
      a case together. Something about the meadows being destroyed.
      Elena hasn't said a word since Miguel died. That's not like her.

      Oh, and don't waste your time with SolVerde's PR posts.
      Mentiras envueltas en paneles solares.
    effects: { trust_paco: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Raquel -> paco_raquel
      - Ask about SolVerde -> paco_solverde
      - Thank him and move on -> quest1_hub

  paco_raquel:
    type: message
    text: >
      PACO: Raquel? She's been coming up from Oviedo every weekend for
      two years. For the pollinators, she says. But she was here every
      time Miguel was at the bar. Sat at his table, laughed at his
      jokes, brought him books about bees from the university library.

      Miguel was oblivious. He loved his bees more than people, that
      man. She tried to make it obvious. He just talked about queen
      cells and varroa mites. I think it drove her mad.

      After he started the meadow investigation, she got worse. Wanted
      to be part of everything. He told me once, "She doesn't
      understand I need to do this alone." I thought he meant the
      research. Now I'm not sure.
    effects: { trust_paco: "+5" }
    choices:
      - Ask about SolVerde -> paco_solverde
      - Move on -> quest1_hub

  paco_solverde:
    type: message
    text: >
      PACO: SolVerde showed up last year with big promises. Solar farm,
      clean energy, jobs for the valley. The mayor was delighted. But
      the site they chose — the Collada de Valmonte — is the richest
      wildflower meadow in the comarca. Centuries-old pastureland.
      Miguel's bees depended on it. Everyone's bees depended on it.

      They started clearing with heavy machinery. Ripped up the turf,
      crushed the wild hives. Miguel was the first person to get in
      their way. He chained himself to a bulldozer. He collected
      samples of the soil. He had proof that the environmental impact
      assessment was falsified.

      Two weeks later he's dead in a ditch near his hives.
      Joder, qué casualidad.
    effects: { trust_paco: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Dani (the meadows, witness tease) ---

  dani_intro:
    type: tweet
    from: dani
    text: >
      cuarenta años subiendo a la braña. los prados ya no son los
      mismos. @miguel_torres tenía razón. y ahora está muerto. echad
      cuentas.
    effects: { trust_dani: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dani -> dani_talk

  dani_talk:
    type: message
    text: >
      DANI: I've been taking goats up this mountain since I was a
      kid. I know every path, every meadow, every rock. And I'm
      telling you — what they've done to Valmonte is a crime. The
      turf is torn up. The wild beehives are crushed. My goats won't
      graze there anymore because the soil stinks of diesel from
      the machinery.

      Miguel took soil samples. He photographed the destruction. He
      was building a case against SolVerde. And then — oh, what a
      coincidence — he falls off a path he's walked ten thousand
      times.

      Me cago en todo. Miguel didn't fall. Miguel was pushed.
    effects: { trust_dani: "+10" }
    choices:
      - Did you see anything unusual recently? -> dani_night
      - Move on -> quest1_hub

  dani_night:
    type: message
    text: >
      DANI: The night before they found him — I was bringing the
      goats down late, around midnight. I saw lights up at the
      Collada. Not unusual, SolVerde sometimes runs machinery at
      night to avoid attention. But there was also a car parked
      at the trailhead to Miguel's apiary. A black SUV with
      SolVerde plates.

      At midnight. At the path to Miguel's bees.

      I didn't think much of it then. Hostia puta, now I can't
      stop thinking about it.
    effects: { trust_dani: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lola (teen hiker, witness tease) ---

  lola_intro:
    type: tweet
    from: lola
    text: >
      estoy flipando tío @miguel_torres es el que me enseñó a
      respetar la montaña, no puede ser que se haya caído así.
      si alguien sabe algo que lo diga joder
    effects: { trust_lola: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Lola -> lola_talk_early

  lola_talk_early:
    type: message
    text: >
      LOLA: eres nuevo? vaya timing de mierda tío. en plan miguel
      era la mejor persona de este pueblo. nos enseñaba las plantas,
      las abejas, los senderos seguros. era un crack.

      y estoy flipando porque iván vio algo raro la otra noche cerca
      del apiario pero no quiere hablar. dice que no es nada pero
      tío... no es nada mis cojones
    effects: { trust_lola: "+10" }
    choices:
      - What did Iván see? -> lola_ivan_hint
      - Move on -> quest1_hub

  lola_ivan_hint:
    type: message
    text: >
      LOLA: no sé exactamente. estaba haciendo ruta en bici por la
      tarde y vio a alguien trasteando en el cobertizo de miguel.
      donde guarda los cuadros de miel y eso. pero no era miguel.
      era una tía, dice. le flipó bastante.

      tienes que hablar con él directamente pero es borde con la
      gente que no conoce. habla primero de rutas de mtb o algo
      jajaja
    effects: { trust_lola: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Peñablanca. An Asturian mountain
      village built around the meadows and the mountain. A beekeeper
      who was exposing the destruction of ancient pastureland. A death
      nobody believes was an accident.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Carmen (Miguel's sister) -> carmen_q1
      - Talk to Raquel (Miguel's colleague) -> raquel_q1
      - Check what Txema (the forest ranger) is saying -> txema_q1
      - I'm ready to investigate the night he died -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Carmen Q1 ---

  carmen_q1:
    type: tweet
    from: carmen
    text: >
      si alguien tiene información sobre @miguel_torres que me llame.
      su equipo de apicultura está intacto. sus botas están en la
      puerta. mi hermano no subió a la montaña sin sus botas.
    effects: { trust_carmen: "+5", contacts_followed: "+1" }
    choices:
      - DM Carmen -> carmen_q1_talk

  carmen_q1_talk:
    type: message
    text: >
      CARMEN: Who are you? Another person from outside who's going to
      tell me to accept it? My brother knew every centimetre of that
      path. He could walk it blindfolded.

      ...I keep telling myself there's an explanation. I don't believe
      it anymore.

      [Carmen is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_carmen: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Raquel Q1 ---

  raquel_q1:
    type: tweet
    from: raquel
    text: >
      El apiario está vacío sin @miguel_torres. Sus muestras de
      suelo siguen en la cabaña. Sus cuadernos de campo están en la
      mesa. Él nunca habría abandonado una investigación en curso.
      Algo pasó.
    effects: { trust_raquel: "+5", contacts_followed: "+1" }
    choices:
      - DM Raquel -> raquel_q1_talk

  raquel_q1_talk:
    type: message
    text: >
      RAQUEL: Miguel and I worked together for over a year. He was
      the most passionate field researcher I've ever known. This
      meadow investigation — it was everything to him. He had soil
      data, photographs, species counts showing the destruction.
      He was so close to going public.

      I offered to help him. Many times. He said he had it under
      control. He said he was working with a journalist. I just
      wanted to support him.

      [Raquel seems earnest. Or obsessive?]
    effects: { trust_raquel: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Txema Q1 ---

  txema_q1:
    type: tweet
    from: txema
    text: >
      mi compañero ha MUERTO y la Guardia Civil dice que se cayó???
      MIGUEL CONOCÍA CADA PIEDRA DE ESE CAMINO. soy guarda forestal
      y os digo que eso no fue un accidente. me cago en la leche.
    effects: { trust_txema: "+5", contacts_followed: "+1" }
    choices:
      - DM Txema -> txema_q1_talk

  txema_q1_talk:
    type: message
    text: >
      TXEMA: Who are you? Look, I know that mountain better than
      anyone except Miguel. He called me the night before he died.
      He said he had something big. He said "if anything happens,
      look at SolVerde." Then he hung up.

      That's the last I heard from him.
    effects: { trust_txema: "+10" }
    choices:
      - What do you think happened? -> txema_theory
      - Move on -> quest1_hub

  txema_theory:
    type: message
    text: >
      TXEMA: I think he found proof that SolVerde falsified the
      environmental impact assessment and they shut him up. But I
      also think that biologist — Raquel — knows more than she's
      saying. The way she talks about him... it's not just
      professional concern. It's something else.

      Miguel told me months ago that someone had been going through
      his field notebooks in the cabaña. Things moved. Pages
      photographed. He thought it was nothing. Joder, it wasn't
      nothing.
    effects: { trust_txema: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Miguel died. Multiple people saw
      or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Iván (was mountain biking near the apiary) -> ivan_interview
      - Find Txema (forest ranger, patrols at night) -> txema_interview
      - Find Begoña (cheesemaker, early morning at the braña) -> bego_interview
      - Find Marcos (carpenter, workshop near the trailhead) -> marcos_interview

  # --- Iván (saw someone at Miguel's shed) ---

  ivan_interview:
    type: tweet
    from: ivan
    text: >
      buena ruta hoy pero el ambiente en el monte está raro. hay
      algo que no mola tío. no sé cómo explicarlo
    effects: { trust_ivan: "+5" }
    choices:
      - Ask Iván about that evening -> ivan_talk

  ivan_talk:
    type: message
    text: >
      IVÁN: hostia puta tío vale pero no se lo digas a nadie eh.
      estaba en la ruta de mtb por la tarde, la que pasa por detrás
      del apiario de miguel. y vi a una tía en su cobertizo. estaba
      sacando fotos de sus cuadernos o algo así. cuando me vio se
      piró corriendo.

      era la del labo, la de oviedo. raquel. seguro que era ella,
      la reconocí por la mochila esa naranja que lleva siempre.

      mierda tío no dije nada porque no quería movidas pero es
      que ahora flipas
    effects:
      trust_ivan: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Txema (forest ranger, saw late-night meeting) ---

  txema_interview:
    type: tweet
    from: txema
    text: >
      Aviso: el sendero de la Collada de Valmonte sigue cerrado por
      obras de SolVerde. He detectado maquinaria no autorizada en
      horario nocturno.
    effects: { trust_txema: "+5" }
    choices:
      - Ask Txema what he saw -> txema_talk

  txema_talk:
    type: message
    text: >
      TXEMA: I was doing my night patrol around 23h. I saw lights at
      the SolVerde site — machinery running, which is against their
      permit. But more importantly, there was a black SUV parked at
      the trailhead near Miguel's apiary. Two men were standing by
      the gate. One of them I recognised: Jorge Ibáñez, the SolVerde
      project director.

      At 23h. At the trailhead to Miguel's bees. That is not normal.

      I logged it in my patrol report. Nobody has asked to see it.
    effects:
      trust_txema: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Begoña (saw figure fleeing at dawn) ---

  bego_interview:
    type: tweet
    from: bego
    text: >
      arriba a las 4 para el ordeño. la braña no estaba vacía esta
      mañana. alguien corría sendero abajo. en la oscuridad. no era
      un corredor de montaña.
    effects: { trust_bego: "+5" }
    choices:
      - Ask Begoña what she saw -> bego_talk

  bego_talk:
    type: message
    text: >
      BEGOÑA: I get up at 4am for the milking. That morning — the
      morning they found Miguel — I saw someone on the path down
      from the Collada. Running. A figure in dark clothes, heading
      toward the road. Moving fast, stumbling. Like they were afraid.

      I called out but they didn't stop. I figured it was a hiker
      who'd got lost but... who hikes at 4am wearing dark clothes
      and carrying nothing?

      When I heard about Miguel, I put it together. Someone was
      leaving the mountain. Leaving fast.
    effects:
      trust_bego: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Marcos (saw vehicles at night) ---

  marcos_interview:
    type: tweet
    from: marcos
    text: >
      Curro en el taller hasta tarde. Esa noche un vehículo pasó
