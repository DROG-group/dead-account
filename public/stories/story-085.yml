      My numbers go to my supervisor. Somewhere between my desk
      and the regulatory filing, they change. Lower. Always lower.

      Miguel's independent samples matched MY original numbers, not
      the ones in the official reports. He had proof that SolVerde
      is falsifying their environmental impact data.

      I'm scared. I have a family. But I kept copies of my original
      reports. If someone can protect me, I'll share them.
    effects:
