    miguel:
      name: "Miguel Torres"
      bio: "apicultor | los prados de peñablanca | la miel no miente"
      avatar: avatars/miguel.jpg
    carmen:
      name: "Carmen Torres"
      bio: "hermana de miguel | veterinaria rural | peñablanca | lo cuido todo menos a mí"
      avatar: avatars/carmen.jpg
    dani:
      name: "Dani Suárez"
      bio: "mejor amigo de miguel | pastor de cabras | sidra casera | la montaña manda"
      avatar: avatars/dani.jpg
    raquel:
      name: "Raquel Vega"
      bio: "bióloga | estudio de polinizadores | universidad de oviedo | colega de miguel"
      avatar: avatars/raquel.jpg

    # === Local Government ===
    alvaro:
      name: "Álvaro Menéndez"
      bio: "Alcalde de Peñablanca | Al servicio del concejo desde 2015 | #PeñablancaAvanza"
      avatar: avatars/alvaro.jpg
    yolanda:
      name: "Yolanda Castañón"
      bio: "Concejala de Medio Ambiente | Ayuntamiento de Peñablanca | transición verde"
      avatar: avatars/yolanda.jpg
    ayuntamiento:
