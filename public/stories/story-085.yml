# DEAD ACCOUNT — Story 085: Peñablanca (Spain)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-085.yml
#
# Player investigates the death of beekeeper Miguel Torres
# in the fictional Asturian mountain village of Peñablanca.

meta:
  title: "Dead Account — Peñablanca"
  state:
    # Trust levels per NPC (0-100)
    trust_carmen: 0
    trust_dani: 0
    trust_lola: 0
    trust_raquel: 0
    trust_pablo: 0
    trust_ivan: 0
    trust_elena: 0
    trust_paco: 0
    trust_bego: 0
    trust_txema: 0
    trust_rosa: 0
    trust_marcos: 0
    trust_yolanda: 0
    trust_alvaro: 0
    trust_lucia: 0
    trust_nuria: 0
    trust_jorge: 0
    trust_sargento: 0
    trust_anon: 0
    # Progress counters
    contacts_followed: 0
    night_witnesses: 0
    corporate_evidence: 0
    obsession_evidence: 0
    evidence_total: 0

  player:
    name: Nuevo Vecino
    bio: "recién llegado a peñablanca. descubriendo asturias paso a paso"
    avatar: avatars/default_citizen.png

  bot:
