    # === Teens ===
    lola:
      name: "Lola"
      bio: "16 | senderista | peñablanca born | la montaña es vida tío"
      avatar: avatars/lola.jpg
    ivan:
      name: "Iván"
      bio: "17 | mtb & escalada | ruta amanecer | el monte cura todo"
      avatar: avatars/ivan.jpg
    pablo:
      name: "Pablo"
      bio: "15 | foto & naturaleza | la sierra en blanco y negro | miguel era mi referente"
      avatar: avatars/pablo.jpg

    # === Media & Community ===
    actu_pena:
      name: "Noticias Peñablanca"
