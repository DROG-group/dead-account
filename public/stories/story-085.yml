      avatar: avatars/paco.jpg
    bar_hayedo:
      name: "Bar El Hayedo"
      bio: "Sidra natural | Cocina asturiana | Tertulia los viernes | El alma de Peñablanca"
      avatar: avatars/bar_hayedo.jpg
    bego:
      name: "Begoña Fernández"
      bio: "quesera | quesos artesanos de peñablanca | la vaca manda | mercado sábados"
      avatar: avatars/bego.jpg
    txema:
      name: "Txema Arregui"
      bio: "guarda forestal | parque natural de peñablanca | la montaña se respeta"
      avatar: avatars/txema.jpg
