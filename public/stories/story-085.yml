  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Miguel than anyone in Peñablanca. Who is responsible?
    choices:
      - Confront Raquel Vega (the obsessive colleague) -> confront_raquel
        when:
          state: obsession_evidence
          gte: 5
      - Confront Jorge Ibáñez (the project director) -> confront_jorge
        when:
          state: corporate_evidence
          gte: 3
      - Confront Mayor Menéndez (political protection) -> confront_alvaro
      - I need more evidence -> investigation_hub

  # --- ENDING A: Raquel (Best Ending) ---

  confront_raquel:
    type: message
    text: >
      You present your evidence to Raquel:

      "I know @AbejaOscura is your account. I know you put a GPS
      tracker in Miguel's shed. I know you went through his field
      notebooks. I know you were watching his apiary with binoculars.
      I have witnesses and I have the visit logs."
    choices:
      - Send -> raquel_response

  raquel_response:
    type: message
    text: >
      Raquel doesn't reply for a long time. Then:

      RAQUEL: You don't understand. I was protecting him. He was
      in danger from SolVerde and he wouldn't let me help. I
      needed to know he was safe. Everything I did was because I
      care about him. Cared. Care.

      That's not care. That's obsession.

      You've already sent the evidence to Sargento Medina. And to
      Elena Quirós.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Sargento Medina reopens the case as a homicide investigation.
      With your evidence — the anonymous account, the GPS tracker,
      the visit logs, the witness testimonies — Raquel is arrested
      for stalking and harassment. The Guardia Civil forensics team
      re-examines the death scene. They find bruising on Miguel's
      body inconsistent with a fall. They find Raquel's DNA on his
      jacket collar. She followed him up the mountain that night.
      She confronted him. There was a struggle.

      Elena Quirós, finally in possession of Miguel's full evidence
      package, publishes the SolVerde story in El País. The Junta
      de Asturias orders an unannounced inspection. The solar project
      is halted pending environmental restoration. Jorge Ibáñez
      faces criminal charges for falsifying the environmental impact
      assessment.

      And in the apiary at Peñablanca, Miguel's bees continue their
      work. Carmen takes over the hives. She talks to them, the way
      Miguel did.

      "Ya puedes descansar, hermano."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: carmen
    text: >
      los prados no mienten. y la gente de peñablanca tampoco.
      las abejas de miguel siguen volando. gracias por no rendiros.
    choices:
      - The End -> game_complete

  # --- ENDING B: Jorge (Partial Ending) ---

  confront_jorge:
    type: message
    text: >
      You present the environmental evidence to Jorge Ibáñez:

      "I have photographs of clearing beyond the permitted zone. I
      have soil samples showing diesel and herbicide contamination.
      I have your original field reports showing the data was
      falsified. I have the drums with your purchase order numbers."
    choices:
      - Send -> jorge_response

  jorge_response:
    type: message
    text: >
      JORGE: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will
      result in immediate proceedings. SolVerde has always operated
      within its environmental permit.

      But it's too late. You've sent the evidence to Elena, to
      the Defensores de los Prados, and to the Junta de Asturias.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The environmental story breaks. SolVerde is ordered to halt
      construction pending investigation. The solar project may be
      cancelled. Eighty promised jobs vanish. The village is divided.

      But Miguel?

      Without the stalking evidence, Raquel is never investigated.
      His death remains classified as an accident. She publishes a
      memorial paper about his pollinator work. She cites herself
      as co-author. She visits his apiary every month, alone.

      Carmen notices. She changes the padlock on the cabaña. She
      finds a new GPS tracker under the hive stand.

      The corporation is exposed. But the person who killed Miguel
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: carmen
    text: "los prados se recuperarán. la justicia para mi hermano... ya veremos."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_alvaro:
    type: message
    text: >
      You confront Mayor Menéndez with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> alvaro_response

  alvaro_response:
    type: tweet
    from: nuria
    text: >
      Mi cliente toma nota de sus alegaciones. Cualquier difusión
      pública de afirmaciones difamatorias será objeto de acciones
      legales inmediatas. — Bufete Santamaría & Asociados, Madrid
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Menéndez and SolVerde's destruction — and there
      isn't one beyond political protection — your evidence is
      insufficient.

      SolVerde continues clearing. Raquel continues watching. Miguel's
      death remains an "accident."

      Six months later, @AbejaOscura creates a new account. It
      follows Carmen.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: PEÑABLANCA — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Miguel's story explores themes of
      environmental destruction, corporate greed, obsessive behaviour,
      rural community solidarity, and the courage to defend the land.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Teléfono de atención a víctimas: 016 (gratuito)
      ANAR (acoso menores): 900 20 20 10
      Denuncia ambiental: 062 (Guardia Civil - SEPRONA)
