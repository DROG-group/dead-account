      I asked who. He said "the solar people. They sent men to the
      Collada." Then he said something else — "and she was there
      again. She's always there."

      He wouldn't say who "she" was. He hugged me, said "no te
      preocupes," and left with his rucksack. That was it. By
      morning he was dead at the bottom of the scree below his
      apiary.
