  marcos_talk:
    type: message
    text: >
      MARCOS: I work late in the carpentry shop — it's right by the
      trailhead to the Collada. That night, around midnight, a
      vehicle came down the forest track — fast, too fast for that
      road. Black SUV. Then maybe half an hour later, a second car.
      Smaller. I couldn't see the colour in the dark.

      The SUV turned onto the main road toward Oviedo. The smaller
      car went toward the old quarry.

      I told the Guardia Civil. They wrote it down. That was it.
      Mierda, they didn't even check the quarry.
    effects:
      trust_marcos: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
