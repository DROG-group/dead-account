      - Check the Defensores de los Prados association -> aso_investigation
      - Talk to Dani about the destruction -> dani_meadows
      - Back to hub -> investigation_hub

  # --- Field Records ---

  field_records:
    type: message
    text: >
      Miguel's pollinator study data is publicly shared on the
      university repository. His species counts show a catastrophic
      decline in wild bee populations at Valmonte since SolVerde began
      clearing. The data for the Collada site is marked "UNDER
      REVIEW" — the only site with that status.

      His field diary, shared with the Defensores for safety, shows
      he made 15 visits to the SolVerde construction zone in the
      past month. The last entry: "Photographed earthworks at sector
      norte. Undeclared clearing beyond permitted boundary. Soil
      contamination from machinery diesel. This is not what they
      reported in the EIA."
    effects:
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue -> corruption_hub

  # --- Elena ---

  elena_interview:
    type: message
    text: >
      ELENA: I don't talk about sources. Period.
    effects: { trust_elena: "+5" }
    choices:
      - Show Elena the evidence you have -> elena_with_evidence
        when:
          state: corporate_evidence
          gte: 3
      - Back to corporate thread -> corruption_hub

  elena_with_evidence:
    type: message
    text: >
      ELENA: ...you have more than I expected.

      Okay. Miguel and I were working together. He had photographs
      of unauthorised clearing — SolVerde expanded way beyond their
      permitted zone. He had soil samples showing diesel contamination.
      He had proof that the environmental impact assessment was
      written by a consultant firm owned by SolVerde's parent company.
      The whole thing was a rubber stamp.

      We were going to publish together. Then he died. And two days
      later, someone broke into my office and stole my backup drive.

      Miguel knew he was in danger. He told me he'd hidden copies.
      He said "if anything happens, find la caja de la reina." The
      queen's box. It's something to do with his bees.
    effects:
      trust_elena: "+25"
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Who threatened him? -> elena_hint
      - Back to investigation hub -> investigation_hub

  elena_hint:
    type: message
    text: >
      ELENA: SolVerde sent their project director — Ibáñez — and
      some lawyer to the Collada that evening. They told him to hand
      over everything or face legal consequences. Intimidation dressed
      up as land rights.

      But he also told me about someone else. Someone who kept
      appearing at his apiary. Someone who always seemed to know
      where he was going. That's a different problem.
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Lucía (SolVerde whistleblower) ---

  lucia_interview:
    type: message
    text: >
