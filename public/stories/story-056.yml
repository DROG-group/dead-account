entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN RIQUEWIHR-LES-VIGNES
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to riquewihr.social — the community Mastodon instance for
      the wine village of Riquewihr-les-Vignes, Alsace.

      The local feed is uneasy. Something has happened among the vines.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @aurelie_kessler.

      A young natural winemaker. She made wine without pesticides or
      sulfites on her family's small plot. People loved her riesling.
      She hasn't posted in six days.
    choices:
      - Look at her profile -> aurelie_profile

  aurelie_profile:
    type: tweet
    from: aurelie
    text: "Les vignes autour de mon domaine sont en train de crever. Quelqu'un balance des pesticides la nuit. J'ai des analyses de sol. Je vais tout balancer."
    choices:
      - That's her last real post... -> strange_photo

  strange_photo:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurry photo of grapevines at night. Shot at an odd angle.
      Posted at 4am. No caption. No hashtags.

      Her friends say she never posts without a tasting note or a
      caption about terroir. The gendarmerie says she probably left
      to visit family. Nobody buys it.
    choices:
      - Read the gendarmerie statement -> gendarmerie_statement
      - Look at what people are saying -> community_reaction

  gendarmerie_statement:
    type: tweet
    from: gendarme
    text: >
      Un signalement a été reçu concernant une résidente de
      Riquewihr-les-Vignes. À ce stade, aucun élément ne permet de
      conclure à un acte délictueux. Toute information utile peut être
      communiquée au 17 ou à la brigade.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her roommate @clemence_muller is
      posting desperate messages. Her brother @theo_kessler is driving
      down from Strasbourg. Her best friend @margaux_hoffmann is
      furious at the gendarmerie.

      The natural winemaker @baptiste_zimmermann says she was right
      about the pesticides. And the journalist @youssef_hamidi is
      strangely silent.

      Nobody believes Aurélie just "left to visit family."
    effects: { trust_margaux: "+5", trust_theo: "+5" }
    choices:
      - Start following Aurélie's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Riquewihr-les-Vignes. Follow Aurélie's contacts and
      read their posts. The more you engage with the community, the
      more they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Élise (weinstub owner, knows everyone) -> elise_intro
      - Talk to Baptiste (natural winemaker, saw the pesticides) -> baptiste_intro
      - Talk to Léa (teen, helps with vendanges) -> lea_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Aurélie with the rhythms of a wine
      village: harvest schedules, cooperative meetings, weather alerts
      for late frost.

      Key names surface: Clémence (roommate, aide-soignante), Quentin
      (oenology student, seems rattled), Youssef (journalist, oddly
      quiet), and the teens — Léa, Hugo, Manon — who adored Aurélie's
      natural wine work.

      Also prominent: VineProtect SA, the pesticide company that
      supplies most of the cooperative. Their posts are corporate
      greenwashing. Aurélie's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Élise -> elise_intro
      - Talk to Baptiste -> baptiste_intro
      - Talk to Léa -> lea_intro

  # --- Élise (social map) ---

  elise_intro:
    type: tweet
    from: elise
    text: >
      Le weinstub est ouvert mais le coeur n'y est pas. @aurelie_kessler,
      ta carafe de riesling t'attend. Reviens vite ma grande.
    effects: { trust_elise: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Élise -> elise_talk

  elise_talk:
    type: message
    text: >
      ÉLISE: Ah, you're new in the village? Bad timing. Everyone is on
      edge since Aurélie disappeared.

      Let me tell you who's who. Clémence is Aurélie's roommate — they
      share the flat above the old cooperage. Sweet girl, worried sick.
      Margaux is Aurélie's best friend, she's the sommelière here at
      the weinstub. Théo is Aurélie's brother in Strasbourg.

      And there's Quentin Frey — oenology student from Colmar. He's
      been around the village a lot. Says he's doing a thesis on
      natural wine. But he follows Aurélie around like a shadow. She
      was too polite to say anything but I could see it made her
      uncomfortable.

      Oh, and VineProtect? Putain, those people. They sell poison and
      call it progress.
    effects: { trust_elise: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Quentin -> elise_quentin
      - Ask about VineProtect -> elise_vineprotect
      - Thank her and move on -> quest1_hub

  elise_quentin:
    type: message
    text: >
      ÉLISE: Quentin? He arrived in the village about eight months
      ago. Said he was writing his master's thesis on vin nature. He
      attached himself to Aurélie immediately. Wanted to shadow her
      in the vineyard, taste every cuvée, attend every market with
      her. She let him at first — she loved sharing her work.

      But then it got weird. He'd show up unannounced at the weinstub
      when she was eating. He'd be at her plot at dawn before she
      arrived. She told me once, "Il me lâche pas, c'est grave
      flippant." I thought she meant he was annoying. Now I think she
      meant something else.
    effects: { trust_elise: "+5" }
    choices:
      - Ask about VineProtect -> elise_vineprotect
      - Move on -> quest1_hub

  elise_vineprotect:
    type: message
    text: >
      ÉLISE: VineProtect supplies pesticides to most of the
      cooperative vignerons. Big money. They've got contracts with
      Xavier Wenger, the cooperative president. The maire loves
      them because they sponsor the wine festival every year.

      But Aurélie was proving that their products were contaminating
      the organic plots around her vineyard. Drift from spraying. She
      had soil analyses, water tests from the stream below the
      coteaux. She was going to expose them.

      Two weeks later she vanishes. Bordel de merde, you don't need
      to be a detective to see the connection.
    effects: { trust_elise: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Baptiste (the pesticides, witness tease) ---

  baptiste_intro:
    type: tweet
    from: baptiste
    text: >
      trente ans que je fais du vin ici. la terre est empoisonnée
      autour de mes parcelles. @aurelie_kessler avait les preuves.
      et maintenant elle a disparu. réfléchissez deux secondes.
    effects: { trust_baptiste: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Baptiste -> baptiste_talk

  baptiste_talk:
    type: message
    text: >
      BAPTISTE: I've been making wine on these slopes since before
      you were born. I went organic twenty years ago, when everyone
      called me crazy. Aurélie was the new generation — she went
      further. No sulfites, no intervention, pure terroir.

      But the conventional vignerons around us spray their vines with
      VineProtect chemicals. The drift lands on our grapes. Our soil.
      Our water. Aurélie took soil samples from the border of her
      plot. Heavy pesticide residues — from products she never used.

      She confronted Xavier Wenger at the cooperative meeting. He
      told her to shut up or leave the cooperative. She said she'd
      go to the press. That was ten days before she disappeared.
    effects: { trust_baptiste: "+10" }
    choices:
      - Did you see anything unusual recently? -> baptiste_night
      - Move on -> quest1_hub

  baptiste_night:
    type: message
    text: >
      BAPTISTE: The night before she went silent — I was checking
      my vines late, around midnight. The moon was full, I like to
      walk the rows. I saw lights in Aurélie's cave — her cellar
      where she makes wine. And a vehicle parked on the chemin
      communal. Not her little Clio. A big SUV, dark. Looked like
      the kind VineProtect reps drive.

      At midnight. At a young woman's wine cellar. That's not
      normal. That's not a friendly visit.
    effects: { trust_baptiste: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Léa (teen, witness tease) ---

  lea_intro:
    type: tweet
    from: lea
    text: >
      wesh jsuis trop deg la @aurelie_kessler c elle qui m'a appris
      à faire les vendanges. sah c'est pas possible qu'elle soit
      partie sans rien dire. si qqn sait qqch dites le putain
    effects: { trust_lea: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Léa -> lea_talk_early

  lea_talk_early:
    type: message
    text: >
      LÉA: wesh t'es nouveau ici? c chaud comme timing frr. en vrai
      aurélie c'est genre la meilleure vigneronne du village. elle
      nous a appris la taille, les vendanges, tout. elle faisait
      goûter le moût aux gamins, trop stylé.

      et la jsuis grave flippée pcq hugo il a vu un truc chelou
      l'autre soir aux vignes mais il veut pas en parler. il dit
      que c rien mais genre... c'est pas rien sah
    effects: { trust_lea: "+10" }
    choices:
      - What did Hugo see? -> lea_hugo_hint
      - Move on -> quest1_hub

  lea_hugo_hint:
    type: message
    text: >
      LÉA: jsp exactement. il était en mode rando au coucher du
      soleil du côté de la parcelle d'aurélie et il a vu genre qqn
      qui fouillait dans sa cave?? le gars de l'oenologie là,
      quentin. il était tout seul dans la cave d'aurélie. genre
      sans elle. chelou non?

      hugo il flippe trop il veut pas en parler. faut lui demander
      direct mais il est méfiant avec les gens qu'il connaît pas.
      parle lui de vignes d'abord ptdr
    effects: { trust_lea: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Riquewihr-les-Vignes. An Alsatian
      wine village nestled in the Vosges foothills. A young natural
      winemaker who was exposing pesticide contamination. A
      disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Margaux (Aurélie's best friend) -> margaux_q1
      - Talk to Quentin (the oenology student) -> quentin_q1
      - Check what Théo (Aurélie's brother) is saying -> theo_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Margaux Q1 ---

  margaux_q1:
    type: tweet
    from: margaux
    text: >
      si quelqu'un a des nouvelles de @aurelie_kessler, appelez moi.
      son matériel de vinification est resté dans la cave. ses
      cuves fermentent encore. elle ne serait jamais partie en
      pleine fermentation. jamais.
    effects: { trust_margaux: "+5", contacts_followed: "+1" }
    choices:
      - DM Margaux -> margaux_q1_talk

  margaux_q1_talk:
    type: message
    text: >
      MARGAUX: I appreciate it but I don't know you. Aurélie has a
      lot of supporters. The whole village loves her wine.

      ...everyone keeps saying she'll come back. I don't believe
      that anymore. Something happened to her.

      [Margaux is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_margaux: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quentin Q1 ---

  quentin_q1:
    type: tweet
    from: quentin
    text: >
      Le terroir de Riquewihr sans @aurelie_kessler c'est pas
      pareil. Ses cuvées sont encore en cave. Elle n'abandonnerait
      jamais ses vins en pleine fermentation. Il s'est passé
      quelque chose.
    effects: { trust_quentin: "+5", contacts_followed: "+1" }
    choices:
      - DM Quentin -> quentin_q1_talk

  quentin_q1_talk:
    type: message
    text: >
      QUENTIN: Aurélie and I have worked closely for months. She's
      the most talented winemaker I've ever met. Her approach to
      terroir — it's revolutionary. No intervention, no sulfites,
      just pure expression of the grape.

      I was documenting her methods for my thesis. She was generous
      with her time. So generous. She let me taste everything, walk
      every row. I just wanted to learn from her.

      [Quentin seems passionate. Or obsessive?]
    effects: { trust_quentin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Théo Q1 ---

  theo_q1:
    type: tweet
    from: theo
    text: >
      ma soeur a DISPARU et la gendarmerie me dit qu'elle est
      peut-être partie chez des amis??? PUTAIN ELLE RÉPOND PLUS
      DEPUIS 6 JOURS. j'arrive de strasbourg. quelqu'un va
      m'expliquer bordel.
    effects: { trust_theo: "+5", contacts_followed: "+1" }
    choices:
      - DM Théo -> theo_q1_talk

  theo_q1_talk:
    type: message
    text: >
      THÉO: T'es qui toi? Encore qqn du village qui va me dire de
      me calmer? Ma soeur m'a appelé la veille de sa disparition.
      Elle m'a dit "j'ai des preuves contre VineProtect, c'est
      énorme." Puis elle a dit "si jamais il m'arrive un truc,
      regarde du côté de la coopérative." Et elle a raccroché.

      C'est la dernière fois que je l'ai entendue. Putain.
    effects: { trust_theo: "+10" }
    choices:
      - What do you think happened? -> theo_theory
      - Move on -> quest1_hub

  theo_theory:
    type: message
    text: >
      THÉO: Je pense qu'elle a trouvé des preuves que VineProtect
      empoisonne les sols et que la coopérative couvre tout. Ils
      l'ont fait taire. Mais y'a aussi ce mec — Quentin — qui me
      fait grave flipper. La façon dont il parle d'elle... c'est
      pas juste de l'admiration pour le vin. C'est autre chose.

      Aurélie m'a dit ya deux mois que quelqu'un entrait dans sa
      cave quand elle était pas là. Elle pensait que c'était rien.
      Moi je pense que c'était pas rien du tout.
    effects: { trust_theo: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Aurélie went silent. Multiple
      people saw or heard things among the vines. Piece together
      the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Hugo (was walking near her vineyard) -> hugo_interview
      - Find Romain (caviste, was closing late) -> romain_interview
      - Find Baptiste (natural winemaker, night walk in the vines) -> baptiste_interview
      - Find Sophie (pharmacist, early morning) -> sophie_interview

  # --- Hugo (saw Quentin in Aurélie's cave) ---

  hugo_interview:
    type: tweet
    from: hugo
    text: >
      bonne rando ce soir mais l'ambiance dans le village c'est
      chelou en ce moment. genre y'a un truc qui va pas entre les
      vignes. jsp comment dire
    effects: { trust_hugo: "+5" }
    choices:
      - Ask Hugo about that evening -> hugo_talk

  hugo_talk:
    type: message
    text: >
      HUGO: wesh frr ok mais tu le dis à personne hein. j'étais
      du côté de la parcelle d'aurélie vers 18h, rando sunset. et
      j'ai vu le gars de l'oenologie — quentin — dans la cave
      d'aurélie. tout seul. il avait son ordi branché sur le truc
      qui contrôle les températures des cuves. genre il faisait
      quoi la sah??

      quand il m'a vu il a flippé, il a fermé son ordi direct et
      il s'est barré. j'ai rien dit pcq je voulais pas
      d'embrouilles mais la c'est chaud. c'est pas normal son
      comportement fdp
    effects:
      trust_hugo: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Romain (caviste, saw late-night meeting) ---

  romain_interview:
    type: tweet
    from: romain
    text: >
      Rappel: la cave Le Foudre est ouverte jusqu'à 21h le vendredi.
      Ce soir-là j'ai fermé tard. Y'avait du mouvement sur le
      chemin des vignes. Pas normal.
    effects: { trust_romain: "+5" }
    choices:
      - Ask Romain what he saw -> romain_talk

  romain_talk:
    type: message
    text: >
      ROMAIN: I was closing the shop around 22h. Through the back
      window I can see the chemin communal that leads to the
      vineyards. I saw two vehicles going up — one SUV, dark, the
      kind VineProtect reps drive. The other was a black Audi. I
      recognised the Audi. It belongs to Xavier Wenger, the
      cooperative president.

      At 22h. Heading up to the vineyards. That's not normal.
      Nobody visits vines at night unless they're up to something.

      I wrote it in my sales log. Nobody's asked to see it.
    effects:
      trust_romain: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Baptiste (saw confrontation) ---

  baptiste_interview:
    type: tweet
    from: baptiste
    text: >
      j'étais dans mes vignes cette nuit-là. la pleine lune, c'est
      mon truc. j'ai entendu des voix du côté de la cave d'aurélie.
