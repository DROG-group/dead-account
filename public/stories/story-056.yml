    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Adjudant Kieffer reopens the case. With your evidence — the
      anonymous account, the listening device, the university
      records, the witness testimonies — Quentin is arrested for
      stalking and harassment. A recording device is recovered from
      Aurélie's cave, containing weeks of audio. A GPS tracker is
      found in her car, still parked at a farmhouse in the Vosges.

      Youssef Hamidi, finally in possession of Aurélie's full
      evidence package, publishes the VineProtect story in Le Monde.
      The préfecture orders an unannounced inspection. Soil samples
      confirm contamination ten times above legal limits. Xavier
      Wenger is charged with corruption. VineProtect faces criminal
      prosecution for environmental fraud. The maire is forced to
      resign.

      And Aurélie Kessler, reading the article from a friend's
      farmhouse in the Vallée de Munster, calls her brother for the
      first time in nine days.

      "Je rentre à la maison. Le riesling m'attend."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: aurelie
    text: >
      le terroir ne triche pas. et les gens de riquewihr non plus.
      merci de ne pas avoir lâché. la prochaine cuvée est pour vous.
    choices:
      - The End -> game_complete

  # --- ENDING B: Maxime (Partial Ending) ---

  confront_maxime:
    type: message
    text: >
      You present the contamination evidence to Maxime Erhardt:

      "I have soil analyses showing your pesticides at ten times
      the legal limit on organic plots. I have water samples from
      the stream. I have financial documents showing bribes to the
      cooperative. I have Aurélie's full report."
    choices:
      - Send -> maxime_response

  maxime_response:
    type: message
    text: >
      MAXIME: This conversation is being forwarded to our legal
      department. Any publication of defamatory material regarding
      VineProtect SA will result in immediate legal proceedings.
      Our products are certified and used in compliance with all
      regulations.

      But it's too late. You've sent the evidence to Youssef, to
      the Vignerons Libres, and to the préfecture.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The contamination story breaks. VineProtect is ordered to
      halt sales in Alsace pending investigation. The cooperative
      is audited. Xavier Wenger resigns. The maire faces questions
      about the sponsorship deal. Organic vignerons are vindicated.

      But Aurélie?

      Without the stalking evidence, Quentin is never investigated.
      He continues his thesis. He continues to visit the vineyards.
      He creates a new anonymous account — @terroir_secret.

      Three months later, Aurélie reads about VineProtect online.
      She returns quietly. She changes the locks on her cave. She
      installs cameras. She stops working alone at night. She checks
      her car every morning.

      The corporation is exposed. But the person who terrorised
      Aurélie walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: aurelie
    text: "je suis rentrée. le sol est plus propre. le reste... on verra."
    choices:
      - The End -> game_complete

  # --- ENDING C: Maire (Wrong Ending) ---

  confront_lucien:
    type: message
    text: >
      You confront Maire Braun with your evidence.

      Within the hour, you receive a message from his lawyer:
    choices:
      - Read the response -> lucien_response

  lucien_response:
    type: tweet
    from: avocat
    text: >
      Mon client prend note de vos allégations. Toute diffusion
      publique de propos diffamatoires fera l'objet de poursuites
      immédiates. — Cabinet Schaeffer & Partners, Strasbourg
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The maire's lawyer buries your accusation. Without a direct
      link between Braun and VineProtect's contamination — and
      there isn't one beyond political negligence — your evidence
      is insufficient.

      VineProtect continues to sell. The cooperative continues to
      spray. Quentin continues to watch. Aurélie stays in hiding.

      Six months later, @cepage_fantome creates a new account. It
      starts following Aurélie's brother.
    choices:
      - The End -> game_complete

