  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. AquaKerry is ordered to cease
      discharge pending investigation. The fish farm may close.
      Eighty jobs hang in the balance. The village is divided.

      But Niamh?

      Without the stalking evidence, Oisín is never investigated.
      He continues to work on the coast. He continues to monitor
      her accounts. He creates a new anonymous profile.

      Three months later, Niamh reads about AquaKerry online. She
      returns quietly. She changes her research area. She stops
      foraging alone. She checks under her car every morning.

      The corporation is exposed. But the person who terrorised
      Niamh walks free.
    choices:
