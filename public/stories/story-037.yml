# DEAD ACCOUNT — Story 037: Dunquin Bay (Ireland, Round 2)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-037.yml
#
# Player investigates the disappearance of seaweed forager Niamh Fitzgerald
# in the fictional west Kerry coastal village of Dunquin Bay.

