  # --- ENDING A: Oisín (Best Ending) ---

  confront_oisin:
    type: message
    text: >
      You present your evidence to Oisín:

      "I know @WildAtlanticWalker is your account. I know you put a
      GPS tracker on Niamh's car. I know you accessed her files in
      the research hut. I know you were watching her cottage. I have
      witnesses and I have the access logs."
    choices:
      - Send -> oisin_response

  oisin_response:
    type: message
    text: >
      Oisín doesn't reply for a long time. Then:

      OISÍN: You don't understand. I was protecting her. She was in
      danger from AquaKerry and she wouldn't let me help. I needed
      to know she was safe. I followed her routes because the cliff
      paths are dangerous and she went alone. Everything I did was
      because I care about her.

      That's not care. That's obsession.

      You've already sent the evidence to Sergeant Murphy. And to
      Donal Keane.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Sergeant Murphy reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the
      witness testimonies — Oisín is arrested for stalking and
      harassment. A GPS tracker is recovered from under Niamh's
      Micra, found abandoned near an old farmhouse past Clogher.

      Donal Keane, finally in possession of Niamh's full evidence
      package, publishes the AquaKerry story in the Irish Times.
      The EPA orders an unannounced inspection. The fish farm is
      shut down pending environmental remediation. Kieran Buckley
      faces criminal charges for falsifying discharge reports.

      And Niamh Fitzgerald, reading the story from a friend's
      kitchen in Kenmare, calls her brother for the first time
      in nine days.

      "I'm coming home, Cillian."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: niamh
    text: >
      the shore doesn't lie. and neither do the people of dunquin bay.
      thank you for not giving up.
    choices:
      - The End -> game_complete

  # --- ENDING B: Kieran (Partial Ending) ---

