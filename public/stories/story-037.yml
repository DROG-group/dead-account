entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN DUNQUIN BAY
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to DunquinBay.social — the community Mastodon instance for
      Dunquin Bay, a small village on the west Kerry coast.

      The local feed is thick with worry today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name everywhere:
      @niamh_fitzgerald.

      A seaweed forager. Wild food expert. She knew every rock pool and
      tidal shelf on this coast. People are frightened. She hasn't posted
      in six days.
    choices:
      - Look at her profile -> niamh_profile

  niamh_profile:
    type: tweet
    from: niamh
    text: "The kelp beds past Clogher are dead. Completely dead. Three months ago they were thriving. Something from the fish farm is killing the shore. I have samples."
    choices:
      - That's her last real post... -> grey_shore

  grey_shore:
    type: message
    text: >
      Three days after that post, her account uploaded a single photo:
      a grey shore. Rocks and foam, blurred, shot low to the ground.
      Posted at 2am. No caption. No hashtags.

      Her friends say Niamh never posts without a story. The Guards say
      she probably went hillwalking. Something doesn't add up.
    choices:
      - Read the Garda statement -> garda_statement
      - Look at what people are saying -> community_reaction

  garda_statement:
    type: tweet
    from: murphy
    text: >
      We have received a report regarding a Dunquin Bay resident.
      At this time there is no evidence of foul play. Ms Fitzgerald
      is an experienced outdoorsperson and may have travelled
      voluntarily. Any information can be reported to the station
      or by calling 999.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her housemate @saoirse_brennan is
      frantic. Her brother @cillian_fitzgerald is driving down from
      Galway. Her colleague @oisin_kavanagh is posting worried messages.
      The fisherman @tommy_daly says she was right about the water.

      And the journalist @donal_keane has gone strangely quiet.

      Nobody buys the Guards' line. Nobody thinks Niamh just went
      for a feckin walk.
    effects: { trust_saoirse: "+5", trust_cillian: "+5" }
    choices:
      - Start following Niamh's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Dunquin Bay. Follow Niamh's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Bridget (pub owner, knows everyone) -> bridget_intro
      - Talk to Tommy (fisherman, saw the water) -> tommy_intro
      - Talk to Aoife (teen kayaker, seems shaken) -> aoife_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Niamh with the rhythms of a small
      coastal village: tide tables, the bakery's bread of the day,
      storm warnings rolling in off the Atlantic.

      Key names surface: Saoirse (housemate, teacher), Oisín (research
      colleague, seems rattled), Donal (journalist, oddly silent),
      and the teens — Aoife, Róisín, Orla — who adored Niamh's
      foraging walks.

      Also prominent: AquaKerry Salmon Ltd, the fish farm in the bay.
      Their posts are glossy PR. Niamh's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Bridget -> bridget_intro
      - Talk to Tommy -> tommy_intro
      - Talk to Aoife -> aoife_intro

  # --- Bridget (social map) ---

  bridget_intro:
    type: tweet
    from: bridget
    text: >
      Pint pulled, fire lit, but the heart's not in it. @niamh_fitzgerald,
      your stool's waiting. Come home to us love.
    effects: { trust_bridget: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Bridget -> bridget_talk

  bridget_talk:
    type: message
    text: >
      BRIDGET: Ah, you're new? Welcome pet, terrible timing. The whole
      village is in bits over Niamh.

      Right, let me give you the lay of the land. Saoirse is Niamh's
      housemate — they share a cottage up past the church. Lovely girl,
      absolutely devastated. Oisín Kavanagh works on the marine research
      with Niamh. Smart lad, but he's been a bit... intense about her,
      if you know what I mean. Cillian is Niamh's older brother, he's
      coming down from Galway.

      And Donal Keane — the journalist — himself and Niamh were working
      on something together. Something about the fish farm. Donal hasn't
      said a word since she vanished. That's not like him at all.

      Oh, and don't be reading AquaKerry's shite about "sustainable
      aquaculture." The state of that water would make you sick.
    effects: { trust_bridget: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Oisín -> bridget_oisin
      - Ask about AquaKerry -> bridget_aquakerry
      - Thank her and move on -> quest1_hub

  bridget_oisin:
    type: message
    text: >
      BRIDGET: Oisín? He's been doing research on this coast longer
      than Niamh. Grand fella, brilliant with the science. But since
      she arrived, he's been... orbiting her, like. In the pub every
      time she was. Offering to carry her kelp baskets. Commenting on
      every feckin post she made.

      She was polite about it but I could see it wore on her. After
      she started investigating the fish farm, he got worse. Wanted
      to be involved in everything. She told me once, "He doesn't
      take a hint." I thought she meant about the work. Now I'm
      not so sure.
    effects: { trust_bridget: "+5" }
    choices:
      - Ask about AquaKerry -> bridget_aquakerry
      - Move on -> quest1_hub

  bridget_aquakerry:
    type: message
    text: >
      BRIDGET: That fish farm's been there since the early 2000s.
      Salmon pens, right out in the bay. The village tolerated them
      because they brought a few jobs. But the fishermen have been
      giving out for years — dead shellfish, chemical shite in the
      water, the kelp dying off.

      Niamh was the first person to actually go down to the shore
      with sample bottles and a proper plan. She had evidence, she
      said. Real evidence. Feck me, two weeks later she's gone.
    effects: { trust_bridget: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tommy (the water, witness tease) ---

  tommy_intro:
    type: tweet
    from: tommy
    text: >
      35 years fishing this coast. the water is not right. @niamh_fitzgerald
      was telling the truth. now she's gone. connect the feckin dots lads.
    effects: { trust_tommy: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tommy -> tommy_talk

  tommy_talk:
    type: message
    text: >
      TOMMY: I've fished out of this bay since I was a young fella.
      I know every current, every colour the sea makes at every time
      of year. And I'm telling you — the water past the salmon pens
      is wrong. Has been for months. My pots come up with dead
      lobsters. The seabed stinks of chemicals.

      Niamh took water samples. She went out at low tide and
      photographed the discharge pipes. She was building a case.
      And then poof — gone.

      You think that's a coincidence? Gobshite talk. I don't believe
      in coincidences on the sea.
    effects: { trust_tommy: "+10" }
    choices:
      - Did you see anything unusual recently? -> tommy_night
      - Move on -> quest1_hub

  tommy_night:
    type: message
    text: >
      TOMMY: The night before she vanished — I was coming in from
      night fishing, around midnight. I saw lights down at the
      research hut by the pier. Not unusual, scientists work late.
      But there were two vehicles in the car park. One was Niamh's
      little red Micra. The other was a white van with AquaKerry
      branding on the side.

      At midnight. At the marine research hut.

      I noted it in my catch log. Nobody's asked to see it.
    effects: { trust_tommy: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Aoife (teen kayaker, witness tease) ---

  aoife_intro:
    type: tweet
    from: aoife
    text: >
      i'm actually so scared like @niamh_fitzgerald is literally the
      nicest person in this village she taught us about the shore and
      the seaweed and everything. if anyone knows anything please say
      something. this is so fucked.
    effects: { trust_aoife: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Aoife -> aoife_talk_early

  aoife_talk_early:
    type: message
    text: >
      AOIFE: oh right you're new here? shite timing like. niamh is
      honestly the best person in this whole village. she took us
      foraging on the shore, showed us which seaweed you can eat,
      how to read the tides. she was class.

      and now i'm freaking out because roisin saw something weird
      the other night down by the pier but she won't talk about it.
      she says it's nothing but like... it's not nothing. you can
      tell she's scared.
    effects: { trust_aoife: "+10" }
    choices:
      - What did Róisín see? -> aoife_roisin_hint
      - Move on -> quest1_hub

  aoife_roisin_hint:
    type: message
    text: >
      AOIFE: i don't know exactly. she was coming back from trad
      practice at the hall and she saw someone messing around niamh's
      car?? or something like that. she's proper spooked. you'd have
      to ask her yourself but she's fierce wary of strangers. maybe
      talk about the music or swimming first, get her to relax like.
      she's sound once she trusts you.
    effects: { trust_aoife: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Dunquin Bay. A west Kerry village
      built around the sea. A forager who was exposing pollution from
      the fish farm. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Saoirse (Niamh's housemate) -> saoirse_q1
      - Talk to Oisín (Niamh's colleague) -> oisin_q1
      - Check what Cillian (Niamh's brother) is saying -> cillian_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Saoirse Q1 ---

  saoirse_q1:
    type: tweet
    from: saoirse
    text: >
      if anyone has news about @niamh_fitzgerald please ring me. her
      room is untouched. her foraging basket is here. her wellies are
      by the door. she would NEVER leave without her gear.
    effects: { trust_saoirse: "+5", contacts_followed: "+1" }
    choices:
      - DM Saoirse -> saoirse_q1_talk

  saoirse_q1_talk:
    type: message
    text: >
      SAOIRSE: I appreciate you reaching out but I don't know you
      from Adam. Niamh has loads of friends here. I'm sure she'll
      come back.

      ...I keep saying that. I don't believe it anymore, in fairness.

      [Saoirse is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_saoirse: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Oisín Q1 ---

  oisin_q1:
    type: tweet
    from: oisin
    text: >
      The research hut is empty without @niamh_fitzgerald. Her samples
      are still in the fridge. Her shore survey notes are on the desk.
      She would never abandon ongoing fieldwork. Something happened.
    effects: { trust_oisin: "+5", contacts_followed: "+1" }
    choices:
      - DM Oisín -> oisin_q1_talk

  oisin_q1_talk:
    type: message
    text: >
      OISÍN: Niamh and I have been working this coast together for
      over a year. She's the most passionate researcher I know. This
      fish farm investigation — it was everything to her. She had
      data, photos, chemical analysis. She was so close to going
      public with it.

      I offered to help her. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to support her.

      [Oisín seems earnest. Or obsessive?]
    effects: { trust_oisin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Cillian Q1 ---

  cillian_q1:
    type: tweet
    from: cillian
    text: >
      my sister has DISAPPEARED and the guards are telling me she
      probably went walking?? ARE YOU HAVING A FECKIN LAUGH. she
      doesn't just vanish without telling anyone. i'm driving down
      from galway. someone better have answers.
    effects: { trust_cillian: "+5", contacts_followed: "+1" }
    choices:
      - DM Cillian -> cillian_q1_talk

  cillian_q1_talk:
    type: message
    text: >
      CILLIAN: Who are you? Another person from that village who's
      going to tell me to calm down? My sister rang me the night
      before she disappeared. She said she had something big. She
      said "if anything happens to me, look at AquaKerry." Then
      she hung up.

      That's the last I heard from her.
    effects: { trust_cillian: "+10" }
    choices:
      - What do you think happened? -> cillian_theory
      - Move on -> quest1_hub

  cillian_theory:
    type: message
    text: >
      CILLIAN: I think she found proof that AquaKerry is poisoning
      the bay and they shut her up. But I also think that creepy
      colleague of hers — Oisín — knows more than he's letting on.
      The way he talks about her... it's not just professional
      concern. It's something else.

      Niamh told me months ago that someone was following her on
      her foraging routes. She'd see the same figure on the cliff
      paths, always at a distance. She thought it was a hiker. I
      don't think it was a hiker.
    effects: { trust_cillian: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Niamh went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Róisín (was at trad practice, saw something at the car) -> roisin_interview
      - Find Declan (harbour master, works late) -> declan_interview
      - Find Éamon (baker, starts at 4am, saw something) -> eamon_interview
      - Find Gráinne (post office, early riser, heard something) -> grainne_interview

  # --- Róisín (saw someone at Niamh's car) ---

  roisin_interview:
    type: tweet
    from: roisin
    text: >
      trad was grand tonight but the village feels wrong. like
      something bad is sitting in the air. can't explain it.
    effects: { trust_roisin: "+5" }
    choices:
      - Ask Róisín about that evening -> roisin_talk

  roisin_talk:
    type: message
    text: >
      RÓISÍN: right ok but you can't tell anyone yeah? i was walking
      home from trad practice at the hall, about half seven. and i
      saw that fella from the research — oisin — at niamh's car.
      like right beside it, crouched down by the driver's side. when
      he saw me he just stood up dead casual and walked off.

      what the actual fuck was he doing like? i said nothing because
      who'd believe me? a teenager saying a scientist is being a
      creep. they'd say i was making shite up.
    effects:
      trust_roisin: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Declan (harbour master, saw late-night visit) ---

  declan_interview:
    type: tweet
    from: declan
    text: >
      Reminder: the pier is closed between 10pm and 6am. Unauthorised
      vehicles noted in the car park after hours again. This is getting
      out of hand.
    effects: { trust_declan: "+5" }
    choices:
      - Ask Declan what he saw -> declan_talk

  declan_talk:
    type: message
    text: >
      DECLAN: I was locking up the harbour office around half ten.
      I saw Niamh's red Micra still parked by the research hut.
      And next to it — a white AquaKerry van. Two men standing
      at the hut door. One of them I recognised: Kieran Buckley,
      the fish farm manager.

      At half ten at night. At the marine research hut. That's not
      feckin normal.

      I logged it in the harbour book. Nobody from the Guards has
      asked to see it.
    effects:
      trust_declan: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Éamon (saw Niamh fleeing) ---

  eamon_interview:
    type: tweet
    from: eamon
    text: >
      up at 4 as usual. the coast road was not empty this morning.
      someone running on the cliff path in the dark. not a jogger.
    effects: { trust_eamon: "+5" }
    choices:
      - Ask Éamon what he saw -> eamon_talk

  eamon_talk:
    type: message
    text: >
      ÉAMON: I'm up at four every morning for the bread. That
      morning — the morning after Niamh's last post — I saw someone
      on the cliff path. Running. A woman, carrying a bag, heading
      west toward Clogher. It was pitch dark. She was moving like
      the devil was behind her.

      I called out but she didn't stop. I figured it was a runner
      but... who runs at 4am on a cliff path carrying a rucksack?

      When I heard about Niamh, it clicked. I think that was her.
      Running from something.
    effects:
      trust_eamon: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Gráinne (heard vehicles) ---

  grainne_interview:
    type: tweet
    from: grainne
    text: >
      Didn't sleep well last night. Vehicles tearing up the coast
      road at all hours. This village used to be quiet after dark.
    effects: { trust_grainne: "+5" }
    choices:
      - Ask Gráinne what she heard -> grainne_talk

  grainne_talk:
    type: message
    text: >
      GRÁINNE: I live above the post office, right on the coast road.
      That night I was woken at about half four by a vehicle going
      far too fast. Then maybe a minute later, a second one. Both
      heading west toward Clogher and Slea Head.

      The first sounded like a van — heavy engine, diesel. The second
      was smaller, lighter. Chasing? I don't know.

      I told the Guards. They wrote it down in their notebook. That
      was the height of it.
    effects:
      trust_grainne: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.

