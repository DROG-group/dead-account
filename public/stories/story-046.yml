  forest_search:
    type: message
    text: >
      Armed with Kārlis's coordinates and the knowledge of where to look,
      you organize a search party. Roberts, Elīza, and Daniels join you
      along with Kārlis himself and Dace. It takes two hours of hiking
      through the ancient forest -- past the fresh stumps that mark BTS's
      illegal harvest -- before Kārlis stops at a massive split-trunked oak.


      "Here. Vecais Jānis. This is the one."


      Elīza boosts Roberts up. He reaches into the hollow on the east face.
      His hand comes out holding a waterproof bag. Inside: a USB drive, a
      notebook full of GPS coordinates, photographs, and a handwritten letter
      from Māris.
    choices:
      - "Read the letter" -> maris_letter

  maris_letter:
    type: message
    text: >
      Māris's letter reads:


      "If you're reading this, something has happened to me. The evidence
      on this USB drive documents illegal clear-cutting of protected
      old-growth forest in Sector 7 by Baltic Timber Solutions. The
      permits were falsified -- GPS coordinates changed between application
      and approval. I believe Raimonds Krūmiņš bribed council member
      Līga Eglīte and that the regional forestry director Voldemārs
      Zālītis is complicit. Uldis Grīnbergs has been threatening me on
      Raimonds's orders. My workshop was burned to destroy my evidence.
      This backup is my insurance. Please get it to someone who can act.
      The trees can't speak for themselves. I tried to speak for them.
      - Māris"


      Dace is crying. Roberts puts his arm around her. The forest is silent
      except for wind through the canopy of the surviving ancient oaks.
    effects: { thread1_evidence: "+3", thread2_evidence: "+2", evidence_total: "+5" }
    choices:
      - "Take everything to Artūrs" -> confront_arturs
      - "Send everything to Zane for the State Environmental Service" -> confront_ses
      - "Confront Raimonds publicly with the evidence" -> confront_raimonds

  confront_raimonds:
    type: message
    text: >
      You decide to confront Raimonds publicly. At the memorial walk for
      Māris, with the whole town watching, you present the evidence. The
      GPS discrepancies. The bribery. The threats. The arson. Edgars steps
      forward and testifies about the phone call that drew him away the
      night Māris died. Guntis shows his truck logs proving the night runs
      into Sector 7.


      Raimonds tries to leave but the crowd blocks his car. He starts
      making phone calls, getting more and more frantic. Uldis tries to
      push through the crowd but Ivars and several fishermen hold him back.


      Artūrs arrives with two officers from Liepāja. He arrests Raimonds
      and Uldis on suspicion of arson, intimidation, and as persons of
      interest in the death of Māris Kalniņš.


      But the public confrontation also tips off Līga, who is already on
      a bus to Rīga with her laptop. And Zālītis at the regional office
      begins shredding documents.
    choices:
      - "Continue" -> ending_public

  ending_public:
    type: message
    text: >
      ENDING 1: THE PUBLIC RECKONING


      The public confrontation results in the immediate arrest of Raimonds
      and Uldis. Uldis eventually breaks under interrogation and confesses
      to both the arson and to confronting Māris in the forest that night.
      He claims Māris's death was an accident during a struggle, not
      premeditated murder. Raimonds is charged as an accessory.


      However, Līga escapes prosecution by cooperating with authorities and
      testifying against Zālītis. She receives a suspended sentence while
      the regional director faces corruption charges. Some in the community
      feel justice was incomplete.


      The logging in Sector 7 is permanently halted. The remaining old-growth
      oaks are given enhanced protection status. Māris's workshop is rebuilt
      as a community woodworking school in his name, run by Roberts and Dace.


      Elīza's photographs of the ancient stumps are exhibited in Rīga and
      spark a national conversation about forest protection.


      But some evidence was destroyed when Zālītis shredded documents. The
      full scope of the corruption may never be known.


      ---

      Māris Kalniņš spoke for the trees. The community found its voice.

      Justice was served -- imperfectly, as it often is. But the forest
      endures, and so does memory.
    choices:
      - "View credits and resources" -> credits

  confront_arturs:
    type: message
    text: >
      You bring everything to Artūrs -- the USB drives, the letter, the
      photographs, the witness statements, Aigars's GPS logs, Guntis's
      trip records, Ivars's fire debris sample. You also connect him with
      Zane in Rīga and her environmental law professor.


      Artūrs contacts the Criminal Investigation Division in Rīga directly,
      bypassing the compromised regional office. Within 48 hours, a team
      arrives in Dzintarkrasti. They execute simultaneous search warrants
      on BTS offices, Raimonds's home, Uldis's vehicle, Līga's bank
      records, and the regional forestry office.


      Edgars provides his testimony. Sandra provides her processing records.
      The net closes on everyone involved.
    choices:
      - "Continue" -> ending_legal

  ending_legal:
    type: message
    text: >
      ENDING 2: THE PROPER CHANNELS


      The methodical approach pays off. Raimonds is arrested for corruption,
      fraud, and conspiracy. Uldis is arrested for arson and murder after
      DNA evidence from the fire debris and trace evidence from the forest
      scene links him to both crimes. Forensic analysis of Uldis's SUV
      finds fibers matching Māris's clothing.


      Līga is arrested before she can flee, her bank records providing
      irrefutable proof of bribery. Regional director Zālītis is arrested
      at his office, where investigators recover the original unaltered
      permits from a locked drawer -- he kept them as insurance against
      Raimonds.


      The trial takes eight months. Uldis receives 18 years for
      manslaughter and arson. Raimonds receives 12 years for corruption
      and conspiracy. Līga receives 5 years. Zālītis receives 7 years.


      The old-growth forest receives national monument status. Māris's
      workshop becomes a museum of traditional Latvian woodcraft. His
      final carving -- unfinished, a great oak -- is displayed in the
      Latvian National Museum.


      ---

      Māris Kalniņš believed in the system, even when it failed him.

      In the end, the system worked. Not because it was perfect,

      but because people of conscience refused to let it stay broken.
    choices:
      - "View credits and resources" -> credits

  confront_ses:
    type: message
    text: >
      You send everything to Zane, who delivers it directly to the State
      Environmental Service and her professor's legal clinic. The evidence
      package is comprehensive: Māris's files, Kārlis's maps, Aigars's
      GPS logs, Daniels's Bluetooth tracking data, Edgars's testimony,
      Guntis's trip records, Ivars's fire sample, Sandra's processing
      records, Jānis's FOI documents, and the bank transfer evidence.


      The SES opens a formal investigation and coordinates with the
      Environmental Police. They notify the national police Anti-Corruption
      Bureau. Within a week, a joint task force descends on Kurzeme.


      Raimonds, Uldis, Līga, and Zālītis are all arrested in a coordinated
      early-morning operation. None of them have time to destroy evidence
      or flee.
    choices:
      - "Continue" -> ending_environmental

  ending_environmental:
    type: message
    text: >
      ENDING 3: THE FULL INVESTIGATION


      The State Environmental Service investigation expands far beyond
      Dzintarkrasti. It turns out BTS operated the same permit fraud scheme
      in three other Latvian districts. Raimonds's operation had been
      systematically destroying protected forests across the country for
      two years, enabled by a network of corrupted officials.


      Uldis confesses to Māris's murder in exchange for a reduced sentence
      of 15 years. He reveals that Raimonds gave a direct order to "deal
      with" Māris that night. Raimonds receives 20 years for organized
      crime, corruption, environmental destruction, and ordering murder.


      Līga cooperates and receives 4 years. Zālītis receives 10 years.
      Three other regional officials across Latvia are also charged.


      The case becomes a landmark in Latvian environmental law. New
      legislation requires independent GPS verification of all forestry
      permits. The "Māris Kalniņš Forest Protection Act" passes
      parliament unanimously.


      In Dzintarkrasti, the community plants new oaks in the cleared
      areas. They won't be old-growth for another 300 years, but they're
      a start. Roberts carves a memorial bench from salvaged timber and
      places it at the Sector 7 boundary marker, next to Vecais Jānis.


      The inscription reads: "Koks Runā -- The Wood Speaks."


      ---

      One man listened to the forest. A community amplified his voice.

      What was silenced became a chorus that changed a nation.
    choices:
      - "View credits and resources" -> credits

  credits:
    type: message
    text: >
      DEAD ACCOUNT - Story 046: The Silent Forest

      A TactCheck Gamepatch scenario.


      This story is fiction but the issues are real. Illegal logging of
      protected forests, permit fraud, intimidation of environmental
      defenders, and violence against activists are documented problems
      across Europe and the world.


      ---


      If you or someone you know is affected by the themes in this story:


      - If you are in immediate danger, call 112 (European emergency number)

      - Latvian Crisis Helpline: 116 123 (free, anonymous, 24/7)

      - Child and Teen Helpline (Latvia): 116 111

      - Environmental Crime Reporting (Latvia): State Environmental Service
        +371 67 770 818

      - Global Witness - protecting environmental defenders:
        www.globalwitness.org

      - EuroNatur - European nature conservation:
        www.euronatur.org


      You are not alone. Speaking up matters. Every voice counts.
    choices:
      - "Play again" -> welcome
