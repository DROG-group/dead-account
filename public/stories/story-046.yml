  ivars_details:
    type: tweet
    from: ivars
    text: >
      Multiple origin points. At least two separate ignition locations.
      Electrical fires have one origin -- the fault point. This fire started
      at the desk AND the filing cabinet simultaneously. And the smell. I've
      been around fires my whole life. This one smelled like diesel. Not
      electrical insulation. Diesel. I told the fire investigator and he
      wrote "probable electrical origin" anyway. I don't know why.
    effects: { trust_ivars: "+20", thread2_evidence: "+2", evidence_total: "+2" }
