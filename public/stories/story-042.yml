      "Thomas W. — second visit. Threatened my business. Recording
      saved to cloud + USB (with Alma)."
      "Lars V. — signed contracts before vote. Email proof pinned."
      "NordBau — Luxembourg shell. Architect = Lars's brother-in-law."
      "Mette has the background. I have the documents. Together = story."
      "Mikkel has cloud password. Alma has USB. Mette has context."

      Sofie was building an evidence chain. And she distributed the
