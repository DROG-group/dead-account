      Wellness Haven. Its registered address is a mailbox in Luxembourg.
      The beneficial owner is hidden behind a holding company.

      The architect listed on both the health centre application and
      the wellness retreat plans is the same person. Lars's brother-in-law.

      Sofie spent three days in this library going through company
      registries. She found things I hadn't thought to look for.
    effects:
      trust_anette: "+10"
      fraud_evidence: "+1"
      evidence_total: "+1"
    choices:
