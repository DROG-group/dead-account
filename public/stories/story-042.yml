  # --- EU Application ---

  eu_application:
    type: message
    text: >
      The EU Structural Fund application (filed 2021) is a public
      document. It clearly requests funding for "Havoe Sundhedscenter
      — integrated primary healthcare facility for island communities."

      The approved budget: 28 million DKK. Purpose: medical clinic,
      emergency room, dental practice, rehabilitation centre, and
      mental health services.

      The building that actually got built: Havoe Wellness Haven.
      Spa. Private suites. Restaurant. Helipad. No medical facilities
      whatsoever.

      The project modification was filed as an "addendum" to the
      original application. Signed by Lars Vestergaard.
    effects:
      fraud_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to fraud thread -> fraud_hub

  # --- Jorgen (construction timeline) ---

  jorgen_construction:
    type: message
    text: >
      JORGEN: I logged every ferry for forty years. It's a habit.
      I still do it.

      The first construction materials arrived on June 14th. The
      council vote to modify the project was September 3rd. The
      building permit was issued August 28th — five days before the
      vote.

      Everything was decided before the vote happened. The vote was
      theatre. Lars had the contracts signed in June.
    effects:
      trust_jorgen: "+10"
      fraud_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to fraud thread -> fraud_hub

  # --- Birthe (vote) ---

  birthe_vote:
    type: message
    text: >
      BIRTHE: I was at that council meeting. Lars presented the
      "modification" as a small change — "expanding the wellness
      component of the health centre." He made it sound like we'd
      still get the clinic plus a spa.

      Nobody read the actual documents. Frederik nodded along. The
      vote was unanimous. Only afterwards did we realise the clinic
      was gone entirely.

      Sofie got copies of the meeting minutes. She compared the
      original EU application with the modification. She said the
      numbers didn't match by millions.
    effects:
      trust_birthe: "+10"
      fraud_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to fraud thread -> fraud_hub

  # --- Tipster ---

  tipster_investigation:
    type: tweet
    from: tipster
    text: >
      EU-ansøgning 2021: sundhedscenter. Byggetilladelse 2022:
      wellness resort. Samme budget. Forskellige bygninger. Hvem
      tjente på forskellen?
    choices:
      - Look at this account's other posts -> tipster_posts

  tipster_posts:
    type: message
    text: >
      @anonym posts between 18:00 and 20:00 every few days:

      "Lars Vestergaard har en lejlighed i Wellness Haven. Gratis."
      "Byggefirmaet er registreret i Luxembourg. Ejeren er anonym."
      "Det originale projekt var 28 mio. Budgetoverskridelsen er 11 mio.
      Hvem betalte de 11 mio?"
      "Spørg Inger Dahl hvad hun har i den låste skuffe."

      This is someone who knows the kommune's internal workings.
      Posting hours suggest an employee posting after hours.
    choices:
      - Check Inger Dahl (the municipal secretary) -> inger_connection
      - Back to fraud thread -> fraud_hub

  inger_connection:
    type: message
    text: >
      Comparing @anonym with Inger Dahl's patterns: same posting hours,
      same knowledge of filing systems, same quiet frustration.

      Inger once posted: "Sometimes I wonder if anyone reads the
      documents they sign." The tipster's tone is identical.

      It's Inger. The municipal secretary is the anonymous leaker.
    choices:
      - Confront Inger -> inger_confront

  inger_confront:
    type: message
    text: >
      You DM Inger, mentioning "the locked drawer."

      INGER: ...how do you know about that?

      Long silence.

      INGER: Yes. I have copies of everything. The original EU
      application. The modification Lars wrote. The building contracts
      signed three months before the council vote. The invoices that
      don't match. And Lars's private agreement with the wellness
      company — he gets a free apartment and 2% of revenue.

      If Lars finds out it was me, I'm finished. But Sofie is
      missing and I can't stay quiet anymore.
    effects:
      trust_inger: "+30"
      fraud_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Keep them safe. I'll come back when ready -> investigation_hub

  # --- Mette (journalist) ---

  mette_investigation:
    type: message
    text: >
      METTE: I know what you're going to ask. Why haven't I written
      about this?

      My editor runs ads from Wellness Haven. Every story I pitch
      about the funding gets killed. "Not enough evidence." "We could
      get sued." "Think about the island's reputation."

      I've been building a file for two years. Sofie was working with
      me. She had the documents I couldn't get. If you can find what
      she gathered, I can get it published nationally. Fyns Avis won't
      touch it. But Politiken will.
    effects:
      trust_mette: "+15"
      fraud_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to fraud thread -> fraud_hub

