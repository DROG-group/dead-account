  ending_b:
    type: message
    text: >
      ENDING B: THE BUREAUCRAT

      The fraud story breaks. Lars resigns. The EU freezes the project
      funds. An audit begins. The wellness retreat closes pending
      investigation.

      But without the harassment evidence, Thomas Witt is never charged.
      He leaves the island quietly. Nobody is held accountable for what
      happened to Sofie personally.

      Sofie reads about Lars's downfall online. She returns to Havoe two
      months later. She reopens her studio but installs security cameras.
      She doesn't work late anymore.

      The health centre is eventually built — three years later.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: sofie
    text: "jeg er hjemme. det er nok for nu."
