  # --- ENDING A: Thomas (Best Ending) ---

  confront_thomas:
    type: message
    text: >
      You present your evidence publicly:

      "Thomas Witt visited Sofie Andersen's studio twice. The second
      time he threatened her business. He was at her studio the night
      she disappeared. His car was identified at the scene. He or
      someone he sent ransacked her workspace. I have witness
      statements, the recorded threat, and documents connecting
      the harassment to the wellness centre's interests."
    choices:
      - Post it -> thomas_response

  thomas_response:
    type: message
    text: >
      Thomas doesn't respond directly. His lawyer does:

      HENRIK: My client categorically denies all allegations and will
      pursue legal action for defamation.

      But you've already sent the evidence to Nils at the local
      police, the regional prosecutor, and a national journalist Mette
      connected you with. Sofie's cloud backup — the recordings, the
      threatening messages, the document photos — is the key.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE FIXER

      The regional prosecutor opens an investigation. Thomas Witt is
      arrested for harassment and breaking and entering. Under
      questioning, he cooperates — he was following Lars Vestergaard's
      orders to "neutralise the threat" from Sofie's posts.

      Lars Vestergaard is charged with EU fund fraud, abuse of office,
      and conspiracy. Inger Dahl's documents prove the full extent of
      the scheme. The wellness retreat is seized pending investigation.

      And Sofie Andersen? She's found alive. She'd been hiding at
      Jorgen's old cottage on the north end of the island since that
      night. Astrid had driven her there and brought supplies every
      few days. Sofie had been too scared to surface without knowing
      the evidence was secure.

      Politiken publishes the full story. "The Island's Stolen Health
      Centre" leads to an EU investigation into structural fund fraud
      across Denmark.

      Sofie returns to her studio. Her first post:
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: sofie
    text: >
      the kiln is back on. the clay is waiting. and this island is
      getting its health centre. tak for alt.
    choices:
      - The End -> game_complete

