entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING ON HAVOE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to havoe.social — the community Mastodon instance for
      the island of Havoe, off the coast of Funen.

      The local feed is frantic. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name keeps appearing: @sofie_keramik.

      A local ceramicist and craft influencer. She ran a studio on the
      harbour, made beautiful stoneware glazed with island clay. She had
      twenty thousand followers. Now she hasn't posted in ten days.
    choices:
      - Look at her profile -> sofie_profile

  sofie_profile:
    type: tweet
    from: sofie
    text: "Found the receipts. Literally. EU healthcare funds going to spa pools. This island deserves to know."
    choices:
      - That's her last real post... -> black_square

  black_square:
    type: message
    text: >
      Two days after that post, her account shared a single image:
      a solid black square. No caption. Posted at 4am.

      Her friends say that's not Sofie. The police say there's no crime.
      But a ceramicist doesn't vanish after posting about EU fund fraud.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: politi
    text: >
      Vi har modtaget en anmeldelse vedrørende en borger fra Havoe.
      Der er på nuværende tidspunkt ingen tegn på kriminalitet.
      Information: 114.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The feed is chaos. Her boyfriend @mikkel_fisker is posting
      desperate appeals. Her best friend @astrid_tekstil is calling out
      the police. Her sister @karen_andersen is threatening to come from
      Copenhagen with lawyers.

      And old Mormor Birthe keeps posting about how "that wellness place
      took the money meant for our health clinic."

      Nobody believes Sofie just left. She was exposing something.
    effects: { trust_mikkel: "+5", trust_karen: "+5" }
    choices:
      - Start following Sofie's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Havoe. Follow Sofie's contacts and read their posts.
      The more you engage, the more the islanders will trust you.
    choices:
      - Talk to Mormor Birthe (she knows everything) -> birthe_intro
      - Talk to Jorgen (retired harbour master) -> jorgen_intro
      - Talk to Noah (teen skater, says he saw something) -> noah_intro
      - Browse the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is split between worried posts about Sofie and everyday
      island life. Ferry schedules, fishing reports, weather.

      Key names: Mikkel (fisherman, Sofie's boyfriend), Astrid (textile
      designer, Sofie's best friend), Jorgen (retired harbour master,
      community elder), Mette (journalist, suspiciously quiet).

      And Havoe Wellness Haven — the luxury retreat that just opened.
      Their PR account posts about "sustainable luxury" and "island
      healing." Some islanders love it. Most seem... sceptical.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Mormor Birthe -> birthe_intro
      - Talk to Jorgen -> jorgen_intro
      - Talk to Noah -> noah_intro

  # --- Mormor Birthe (history, social map) ---

  birthe_intro:
    type: tweet
    from: birthe
    text: >
      vi skulle have et sundhedscenter. det var det vi stemte for.
      i stedet fik vi spa for rige turister og sofie forsvandt da hun
      sagde det højt. sgu ikke i orden.
    effects: { trust_birthe: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Mormor Birthe -> birthe_talk

  birthe_talk:
    type: message
    text: >
      BIRTHE: You're new! Welcome to the island. Terrible timing.

      Let me tell you what happened. Five years ago, the kommune applied
      for EU funds to build a public healthcare centre. Island people
      need healthcare too, you know. The nearest hospital is a ferry
      ride and an hour's drive away.

      We got the money. 28 million kroner. Then somehow a "wellness
      retreat" got built instead. Same plot of land. Same architect.
      Different purpose entirely. Rich people come for weekends. We
      still take the ferry when we're sick.

      Sofie found the paper trail. Now she's gone.
    effects: { trust_birthe: "+10", contacts_followed: "+2" }
    choices:
      - Who's behind the wellness retreat? -> birthe_retreat
      - Who runs things on the island? -> birthe_politics
      - Thank her and move on -> quest1_hub

  birthe_retreat:
    type: message
    text: >
      BIRTHE: Lars Vestergaard — the municipal director. He wrote the EU
      application for the health centre. Then he changed the project
      scope after the funding was approved. "Wellness and preventive
      health" he called it. Nobody on the council objected because Lars
      handles all the paperwork and nobody reads it.

      The retreat is run by a company from Copenhagen. Thomas Witt is
      their PR man here on the island. Smooth talker. Always at the
      borgmester's table at the kro.
    effects: { trust_birthe: "+5" }
    choices:
      - Who runs things on the island? -> birthe_politics
      - Move on -> quest1_hub

  birthe_politics:
    type: message
    text: >
      BIRTHE: Frederik Møller is the borgmester. Nice man. Weak man.
      Lars Vestergaard is the real power — he's been kommunaldirektør
      for fifteen years. Handles all the EU funding applications, all
      the contracts. Frederik signs whatever Lars puts in front of him.

      Thomas Witt is the PR manager for the wellness place. He's the
      one who came to Sofie's studio. Twice. Alma told me about it.
      First time he was "friendly." Second time he wasn't.

      And Mette at the newspaper? She knows everything but writes
      nothing. Her paper gets advertising from the wellness retreat.
    effects: { trust_birthe: "+10", contacts_followed: "+2" }
    choices:
      - Move on -> quest1_hub

  # --- Jorgen (retired harbour master) ---

  jorgen_intro:
    type: tweet
    from: jorgen
    text: >
      fyrre år på denne havn. jeg har set alt. men en ung kvinde der
      forsvinder efter hun siger sandheden? det har jeg aldrig set.
    effects: { trust_jorgen: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jorgen -> jorgen_talk

  jorgen_talk:
    type: message
    text: >
      JORGEN: I retired from the harbour five years ago. I watched them
      build that wellness place. They broke ground while we were still
      arguing about whether it should be a health centre or not.

      Lars had the contracts signed before the council voted. I saw the
      construction trucks on the ferry before the building permit was
      public. That's not how things are supposed to work.

      Sofie asked me about the timeline. I told her everything. Three
      days later she posted about "EU receipts" and then she was gone.
    effects: { trust_jorgen: "+10", contacts_followed: "+1" }
    choices:
      - Ask about the construction timeline -> jorgen_timeline
      - Move on -> quest1_hub

  jorgen_timeline:
    type: message
    text: >
      JORGEN: The EU fund approval came in March. The council vote on
      "project scope modification" was in September. But the construction
      company was on the ferry in June. Three months before the council
      approved the change.

      Someone ordered construction before the vote. That means someone
      knew the vote would pass. Or didn't care.
    effects: { trust_jorgen: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Noah (teen witness) ---

  noah_intro:
    type: tweet
    from: noah
    text: >
      sgu okay så jeg så noget ved sofies værksted den aften. skal
      jeg gå til politiet?? de tager mig bare aldrig seriøst altså
    effects: { trust_noah: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Noah -> noah_talk_early

  noah_talk_early:
    type: message
    text: >
      NOAH: okay så jeg var nede ved havnen og skate den aften ik?
      og der holder en bil ved sofies værksted. en fyr går ind. han
      var der i tyve minutter måske. da han kom ud bar han kasser.
      som arkivkasser. han smed dem i bilen og kørte mod færgen.

      sofie var der ikke. hendes bil var der ikke. men nogen var inde
      i hendes værksted midt om natten. det er sgu da vildt.
    effects: { trust_noah: "+10" }
    choices:
      - Can you describe the man? -> noah_describe
      - Thanks Noah, I'll come back to this -> quest1_hub

  noah_describe:
    type: message
    text: >
      NOAH: pænt tøj. sådan skjorte-type. ikke en fisker altså. han
      havde en nøgle — han låste op som om det var hans eget sted.
      mellembygning, mørkt hår, den der type der altid smiler for
      meget.

      og bilen var en af de der wellness-sted biler. med logoet på
      siden. det er bare mega sketchy.
    effects: { trust_noah: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Havoe. A small island community.
      A ceramicist who found out their health centre money went to a
      luxury spa. An EU funding scheme that doesn't add up. And now
      the whistleblower is gone.
    choices:
      - Talk to Mikkel (Sofie's boyfriend) -> mikkel_q1
      - Talk to Astrid (Sofie's best friend) -> astrid_q1
      - Check what Karen (Sofie's sister) is saying -> karen_q1
      - I'm ready to investigate the night Sofie disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Mikkel Q1 ---

  mikkel_q1:
    type: tweet
    from: mikkel
    text: >
      sofie har ikke ringet. har ikke skrevet. hun ville aldrig bare
      forsvinde. noget er galt. virkelig galt. hjælp os.
    effects: { trust_mikkel: "+5", contacts_followed: "+1" }
    choices:
      - DM Mikkel -> mikkel_q1_talk

  mikkel_q1_talk:
    type: message
    text: >
      MIKKEL: I don't know you. But I'll talk to anyone at this point.
      Sofie wouldn't just leave without telling me. We've been together
      for three years. We tell each other everything.

      Except... the last few weeks, she was pulling away. Working late.
      Meeting someone she wouldn't name. She said "the less you know,
      the safer you are." That terrified me more than anything.
    effects: { trust_mikkel: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Astrid Q1 ---

  astrid_q1:
    type: tweet
    from: astrid
    text: >
      min bedste veninde er væk og politiet siger "ingen tegn på
      kriminalitet." hvad skal der til?? et lig?? undskyld sproget
      men jeg er SÅ vred.
    effects: { trust_astrid: "+5", contacts_followed: "+1" }
    choices:
      - DM Astrid -> astrid_q1_talk

  astrid_q1_talk:
    type: message
    text: >
      ASTRID: Sofie was scared the last two weeks. She told me someone
      had been "visiting" her studio. A man from the wellness place.
      First time he brought her flowers and talked about "partnership
      opportunities." Second time he came without flowers and told her
      she was "making a mistake she couldn't undo."

      She didn't report it because what do you report? A man with
      flowers? A vague warning? The police would laugh.
    effects: { trust_astrid: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Karen Q1 ---

  karen_q1:
    type: tweet
    from: karen
    text: >
      min søster er FORSVUNDET fra den ø og politiet gør INGENTING.
      jeg kører til havoe i morgen med en advokat. nogen skal svare.
    effects: { trust_karen: "+5", contacts_followed: "+1" }
    choices:
      - DM Karen -> karen_q1_talk

  karen_q1_talk:
    type: message
    text: >
      KAREN: Who are you? Another island person with "thoughts and
      prayers"? My sister told me last week she was worried. She said
      someone was pressuring her to delete posts. She wouldn't say who.

      She called me from a number I didn't recognise. A landline. She
      said "if anything happens, look at the wellness centre funding."
      Then the call dropped and I haven't heard from her since.
    effects: { trust_karen: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Sofie went silent. Piece together
      the timeline from at least 4 witnesses.
    choices:
      - Find Mikkel (was at home waiting for Sofie) -> mikkel_interview
      - Find Jakob (mechanic, works late at the harbour) -> jakob_interview
      - Find Viggo (baker, starts early, saw something) -> viggo_interview
      - Find Peter (carpenter, lives near the studio) -> peter_interview

  # --- Mikkel (waited all night) ---

  mikkel_interview:
    type: message
    text: >
      MIKKEL: She said she was going to the studio after dinner. Around
      20:00. Said she needed to "sort something out." She took her
      laptop and a folder she'd been carrying everywhere for two weeks.
      The folder had a red elastic band around it.

      She didn't come home. By midnight I walked to the studio. It was
      dark. Locked. Her car was gone. I called her — straight to
      voicemail. I called the police at 2am.
    effects:
      trust_mikkel: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Jakob (saw someone at the studio) ---

  jakob_interview:
    type: tweet
    from: jakob
    text: >
      arbejdede sent på en motor i går. der var lys i sofies værksted
      kl 22. og en bil jeg ikke genkendte. ikke hendes.
    effects: { trust_jakob: "+5" }
    choices:
      - Ask Jakob what he saw -> jakob_talk

  jakob_talk:
    type: message
    text: >
      JAKOB: I was in the workshop until late. Around 22:00 I saw light
      in Sofie's studio. And a car parked outside — not her Volvo. A
      dark Audi. The wellness centre people drive dark Audis. I've
      serviced their boats enough times to know their vehicles.

      Thirty minutes later the light went off. The Audi left toward
      the ferry terminal. Then another car — Sofie's Volvo — went the
      other direction. Toward the north end of the island. Fast.

      Why would Sofie drive north at half ten at night? There's nothing
      there but the lighthouse and Jorgen's old cottage.
    effects:
      trust_jakob: "+10"
      night_witnesses: "+1"
      harassment_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Viggo (baker, early morning) ---

  viggo_interview:
    type: message
    text: >
      VIGGO: I start baking at 4am. That morning, walking to the
      bakery, I passed Sofie's studio. The door was ajar. I looked in —
      the place was a mess. Shelves pulled down. Her glazing station
      overturned. Papers everywhere.

      But the strange thing: her kiln was still on. Sofie would never
      leave the kiln running. She treats that kiln like a child. That's
      when I knew something was wrong.

      I called Mikkel. He hadn't slept.
    effects:
      trust_viggo: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Peter (heard an argument) ---

  peter_interview:
    type: message
    text: >
      PETER: I live two doors from Sofie's studio. Around 21:30 I heard
      voices. A man and a woman. The man was doing most of the talking.
      Not shouting exactly — more like... controlled aggression. That
      voice you use when you want someone to know you're serious.

      He said something like "You have no idea what you're playing with."
      She said "I know exactly what I'm doing." Then a door slammed.

      Twenty minutes later, silence. Then a car started and drove off
      fast.
    effects:
      trust_peter: "+15"
      night_witnesses: "+1"
      harassment_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.
    choices:
      - Talk to Alma (Sofie's student, has information) -> alma_interview
      - Talk to Oscar (teen, drone footage of the wellness site) -> oscar_interview
      - Find Mikkel -> mikkel_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Jakob the mechanic -> jakob_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Viggo the baker -> viggo_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Peter the carpenter -> peter_interview
        when:
          state: night_witnesses
          lt: 4
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Alma (student, extra info) ---

  alma_interview:
    type: tweet
    from: alma
    text: >
      sofie gav mig noget dagen før hun forsvandt. hun sagde "gem
      det" og "giv det kun til nogen du stoler på." jeg er bare mega
      bange altså.
    effects: { trust_alma: "+5" }
    choices:
      - Ask Alma what Sofie gave her -> alma_item
        when:
          state: trust_alma
          gte: 5

  alma_item:
    type: message
    text: >
      ALMA: det er et USB-stik. sofie så mig ind i øjnene og sagde
      "der er dokumenter på det der som viser hvad de har gjort med
      sundhedspengene. hvis noget sker med mig, giv det til mette
      nørgaard. kun hende."

      jeg har ikke åbnet det. jeg er sygt bange. men hvis du tror du
      kan hjælpe sofie...
    effects:
      trust_alma: "+15"
      fraud_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Continue investigating -> quest2_hub

  # --- Oscar (drone footage) ---

  oscar_interview:
    type: tweet
    from: oscar
    text: >
      fløj min drone over wellness stedet i weekenden. det er vildt
      hvad de bygger dernede. det ligner slet ikke et sundhedscenter
    effects: { trust_oscar: "+5" }
    choices:
      - Ask Oscar about the footage -> oscar_footage

  oscar_footage:
    type: message
    text: >
