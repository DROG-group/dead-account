      The kiln is cold now. Her apron hangs on a hook. A mug of tea
      sits cold and untouched on the workbench.

      On the wall: a corkboard with photos and notes. Most have been
      torn down, but one remains — a photo of the wellness centre
      construction site with "June 2022" written on it. Three months
      before the council vote.
