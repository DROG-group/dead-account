entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN VALENSOLE-SUR-LAYE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to valensole.social — the community Mastodon instance for
      the village of Valensole-sur-Laye, Provence.

      The local feed is agitated today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice one name everywhere:
      @aurelien_roux.

      A young organic lavender farmer and beekeeper. He documented
      the plateau, the bees, the soil. People are worried. He hasn't
      posted in six days.
    choices:
      - Look at his profile -> aurelien_profile

  aurelien_profile:
    type: tweet
    from: aurelien
    text: "Les abeilles crèvent par centaines sur la parcelle nord. Quelqu'un épand un truc interdit la nuit. J'ai des photos et des prélèvements. C'est terminé le silence."
    choices:
      - That's his last real post... -> dead_bees

  dead_bees:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurry photo of an empty lavender field at dawn. No caption.
      Posted at 4am. The colours are wrong — washed out, almost grey.

      His friends say that's not his style. Aurélien always captioned
      everything. The gendarmerie says he probably went hiking in the
      Luberon. Nobody buys it.
    choices:
      - Read the gendarmerie statement -> gendarmerie_statement
      - Look at what people are saying -> community_reaction

  gendarmerie_statement:
    type: tweet
    from: adjudant
    text: >
      Nous avons reçu un signalement concernant un résident de
      Valensole-sur-Laye. À ce stade, aucun élément ne permet de
      conclure à un acte délictueux. L'intéressé est majeur et libre
      de ses déplacements. Toute information utile: 17 ou brigade.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His housemate @camille_blanc is
      desperate. His brother @bastien_roux is driving up from Marseille.
      His friend @nadia_ferhat is asking everyone to share his photo.
      Old Marcel the retired lavender farmer says Aurélien was right
      about the pesticides.

      And the journalist @helene_caron hasn't posted since Aurélien
      vanished. Strange.

      Nobody believes he went hiking. Aurélien was in the middle of
      harvest prep. You don't walk away from lavender in June.
    effects: { trust_camille: "+5", trust_bastien: "+5" }
    choices:
      - Start following Aurélien's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Valensole-sur-Laye. Follow Aurélien's contacts and
      read their posts. The more you engage with the community, the
      more they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Sandrine (café owner, knows everyone) -> sandrine_intro
      - Talk to Marcel (retired farmer, knows the land) -> marcel_intro
      - Talk to Kévin (teen, seems rattled) -> kevin_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Aurélien with village life: lavender
      harvest forecasts, complaints about the mistral, Yasmina's
      grocery specials, the fête de la lavande planning.

      Key names surface: Camille (housemate, aide-soignante), Nadia
      (friend, biology teacher), Rémi Delorme (neighbour, wanted
      Aurélien's land), and the teens — Kévin, Luna, Enzo — who
      looked up to Aurélien.

      Also prominent: AgroSynth Provence, the agro-chemical company
      that's been pushing into the region. Their posts are glossy
      corporate PR. Aurélien's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Sandrine -> sandrine_intro
      - Talk to Marcel -> marcel_intro
      - Talk to Kévin -> kevin_intro

  # --- Sandrine (social map) ---

  sandrine_intro:
    type: tweet
    from: sandrine
    text: >
      Le café est ouvert mais c'est pas pareil sans @aurelien_roux
      au comptoir le matin. Son pastis l'attend. Reviens mon petit.
    effects: { trust_sandrine: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sandrine -> sandrine_talk

  sandrine_talk:
    type: message
    text: >
      SANDRINE: Ah, you're new? Bienvenue. Putain, what a time to
      arrive. Everyone's on edge about Aurélien.

      Let me tell you who's who. Camille is his housemate — she's
      devastated, she can't eat, she can't sleep. Nadia Ferhat is
      his friend, the biology teacher at the collège — smart woman,
      they worked together on soil samples. Bastien is his older
      brother, coming up from Marseille.

      And then there's Rémi Delorme. His neighbour. The one who's
      been trying to buy Aurélien's land for two years. Offered him
      good money, then bad money, then threats. Aurélien wouldn't
      sell. Rémi took it personally.

      Oh, and AgroSynth? Don't get me started. Bordel de merde,
      those people are poisoning the plateau and the mayor lets them.
    effects: { trust_sandrine: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Rémi -> sandrine_remi
      - Ask about AgroSynth -> sandrine_agrosynth
      - Thank her and move on -> quest1_hub

  sandrine_remi:
    type: message
    text: >
      SANDRINE: Rémi Delorme. He inherited the big property next to
      Aurélien's three years ago. He's not a farmer — he's a property
      speculator from Aix. He wants to combine the parcels and sell
      to a developer for holiday gîtes. Aurélien's organic farm was
      in the way.

      The offers kept coming. Then the fence disputes started. Then
      Aurélien's irrigation was cut — "accidentally." Then his beehives
      were knocked over one night. Always deniable. Always escalating.

      Aurélien told me once: "Ce fdp me lâchera jamais." He was scared,
      but he wouldn't give up the land. It was his grandmother's.
    effects: { trust_sandrine: "+5" }
    choices:
      - Ask about AgroSynth -> sandrine_agrosynth
      - Move on -> quest1_hub

  sandrine_agrosynth:
    type: message
    text: >
      SANDRINE: AgroSynth Provence moved into the region five years
      ago. They sell pesticides, herbicides, "phytosanitaires" — putain,
      fancy words for poison. Half the conventional farmers on the
      plateau use their products now.

      The problem? Aurélien's bees were dying. His organic certification
      depends on zero pesticide exposure. He found residues on his
      lavender — neonicotinoids, banned substances. Someone was
      spraying at night, and the drift was killing his bees.

      He started documenting. Soil samples, dead bee counts, photos
      of trucks at 2am. He was building a dossier. Two weeks later
      he's gone.
    effects: { trust_sandrine: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marcel (retired farmer, the land) ---

  marcel_intro:
    type: tweet
    from: marcel
    text: >
      quarante-cinq ans que je cultive cette terre. les abeilles
      crevaient pas comme ça avant. @aurelien_roux avait raison.
      et maintenant il a disparu. faites le lien.
    effects: { trust_marcel: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Marcel -> marcel_talk

  marcel_talk:
    type: message
    text: >
      MARCEL: I've farmed lavender on this plateau since I was
      seventeen. I know every parcelle, every source, every mistral
      current. And I'm telling you — something is wrong with the soil.

      The bees know first. Always. When the bees die, the land
      is sick. Aurélien understood that. He was the only young farmer
      who gave a shit about the old ways. Organic, natural, patient.

      He found dead bees by the hundreds. He sent samples to the lab
      in Marseille. Neonicotinoids. Banned since 2018. Someone is
      using them anyway, at night, when nobody's watching.

      And then he disappears? Putain, I wasn't born yesterday.
    effects: { trust_marcel: "+10" }
    choices:
      - Did you see anything unusual recently? -> marcel_night
      - Move on -> quest1_hub

  marcel_night:
    type: message
    text: >
      MARCEL: The night before he vanished — I couldn't sleep, the
      mistral was blowing. Around 1am I went outside. I saw headlights
      on the chemin des Romarins — that's the dirt road between
      Aurélien's farm and the parcelles north. A truck. Big one. No
      markings visible in the dark, but the shape... it looked like
      the AgroSynth delivery trucks I've seen at the coopérative.

      Coming from Aurélien's direction. At 1am.

      I told the gendarmes. They said "noted." Enculés.
    effects: { trust_marcel: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kévin (teen, witness tease) ---

  kevin_intro:
    type: tweet
    from: kevin
    text: >
      wesh frr @aurelien_roux c'est lui qui m'a appris à respecter
      les abeilles genre avant jpensais que c'était des insectes de
      merde et en vrai c'est incroyable. si qqn sait qqch dites svp
      jpeux pas accepter ça
    effects: { trust_kevin: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kévin -> kevin_talk_early

  kevin_talk_early:
    type: message
    text: >
      KÉVIN: wesh t'es nouveau ici? c chaud comme timing genre.
      en vrai aurélien c'est le goat de ce village. il nous apprenait
      des trucs sur les abeilles, il nous laissait conduire son
      tracteur, il nous payait pour l'aider à la récolte. un gars
      en or frr.

      et la jsuis flippé pcq luna elle a vu un truc chelou l'autre
      soir chez rémi mais elle veut pas en parler. elle dit que
      c rien mais genre... c'est clairement pas rien sah
    effects: { trust_kevin: "+10" }
    choices:
      - What did Luna see? -> kevin_luna_hint
      - Move on -> quest1_hub

  kevin_luna_hint:
    type: message
    text: >
      KÉVIN: jsp exactement. elle prenait des photos de nuit pour
      son projet et elle a vu genre qqn dans les champs d'aurélien??
      à genre minuit. et elle a flippé et elle est partie. mais elle
      m'a dit que c'était pas aurélien. c'était qqn d'autre.

      faut lui demander direct mais elle est méfiante avec les gens
      qu'elle connaît pas. essaie de lui parler nature et photo
      d'abord ptdr. genre elle est passionnée par ça
    effects: { trust_kevin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Valensole-sur-Laye. A Provençal
      village built around lavender and honey. A young organic farmer
      who was exposing illegal pesticide spraying. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Camille (Aurélien's housemate) -> camille_q1
      - Talk to Nadia (Aurélien's friend, bio teacher) -> nadia_q1
      - Check what Bastien (Aurélien's brother) is saying -> bastien_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Camille Q1 ---

  camille_q1:
    type: tweet
    from: camille
    text: >
      si quelqu'un a des nouvelles de @aurelien_roux appelez moi svp.
      ses ruches sont là. ses outils sont là. son chien est là. il
      serait JAMAIS parti sans son chien. jamais.
    effects: { trust_camille: "+5", contacts_followed: "+1" }
    choices:
      - DM Camille -> camille_q1_talk

  camille_q1_talk:
    type: message
    text: >
      CAMILLE: I appreciate you reaching out but I don't know you.
      Aurélien has a lot of friends here. I'm sure he'll come back.

      ...putain, I keep saying that. I don't believe it anymore.

      [Camille is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_camille: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nadia Q1 ---

  nadia_q1:
    type: tweet
    from: nadia
    text: >
      Les résultats du labo de Marseille sont arrivés. Les
      prélèvements d'@aurelien_roux montrent des néonicotinoïdes
      à des taux 15 fois supérieurs au seuil légal. QUINZE FOIS.
      Où sont les autorités?
    effects: { trust_nadia: "+5", contacts_followed: "+1" }
    choices:
      - DM Nadia -> nadia_q1_talk

  nadia_q1_talk:
    type: message
    text: >
      NADIA: I'm a biology teacher. Aurélien and I worked together
      on soil analysis. He'd bring me samples, I'd help him
      understand the chemistry. What we found was terrifying.

      Neonicotinoids — banned in France since 2018. Someone is still
      using them on the plateau. At night. The drift kills Aurélien's
      bees and contaminates his organic lavender.

      He was building a case. Methodical, rigorous. Soil samples,
      water tests, dead bee counts, GPS-tagged photos with timestamps.
      He had everything. And now he's gone and his laptop is missing
      from the farm.

      [Nadia seems genuinely frightened.]
    effects: { trust_nadia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Bastien Q1 ---

  bastien_q1:
    type: tweet
    from: bastien
    text: >
      mon frère a DISPARU et la gendarmerie me dit qu'il fait
      peut-être une rando??? PUTAIN MAIS VOUS ÊTES SÉRIEUX???
      il avait de la lavande à récolter dans 3 semaines. il part
      pas en rando. j'arrive de marseille. qqn va m'expliquer.
    effects: { trust_bastien: "+5", contacts_followed: "+1" }
    choices:
      - DM Bastien -> bastien_q1_talk

  bastien_q1_talk:
    type: message
    text: >
      BASTIEN: Who are you? Another person from that village who's
      going to tell me to calm down? Nique ta mère to anyone who
      says "calm down."

      My brother called me two nights before he disappeared. He said
      "Bastien, j'ai des preuves de ouf. Si il m'arrive un truc,
      regarde du côté d'AgroSynth. Et de Rémi." Then he hung up.

      That's the last I heard from him.
    effects: { trust_bastien: "+10" }
    choices:
      - What do you think happened? -> bastien_theory
      - Move on -> quest1_hub

  bastien_theory:
    type: message
    text: >
      BASTIEN: I think he found proof that AgroSynth is spraying
      banned shit and the mayor is covering it up. And I think that
      enculé de Rémi saw an opportunity in the chaos. The guy wants
      the land. He's always wanted the land.

      Aurélien told me months ago that someone had been coming onto
      his property at night. Moving things. Opening gates. Letting
      his goats out. Cutting fence wire. He thought it was Rémi
      trying to push him out. Harassment campagne style.

      Genre the guy is obsessed with that land. It's not normal.
    effects: { trust_bastien: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Aurélien went silent. Multiple
      people saw or heard things. Piece together the timeline from
      witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Luna (was photographing at night near the farms) -> luna_interview
      - Find Vincent (beekeeper, checks hives at dawn) -> vincent_interview
      - Find Claire (baker, starts at 4am, saw something) -> claire_interview
      - Find Thierry (plumber, was on a late emergency call) -> thierry_interview

  # --- Luna (saw someone on Aurélien's land) ---

  luna_interview:
    type: tweet
    from: luna
    text: >
      jsuis sortie faire des photos de nuit l'autre soir et genre
      l'ambiance dans les champs c'était pas normal. y'avait des
      lumières là où y'en a jamais. jpeux pas expliquer
    effects: { trust_luna: "+5" }
    choices:
      - Ask Luna about that evening -> luna_talk

  luna_talk:
    type: message
    text: >
      LUNA: wesh ok mais tu le dis à personne stp. j'étais dans les
      champs vers 23h, je faisais des photos de la voie lactée
      au-dessus de la lavande. et j'ai vu genre une silhouette sur
      la parcelle d'aurélien. pas aurélien — qqn de plus grand, plus
      costaud. il marchait entre les rangées de lavande avec une
      lampe torche.

      et genre le pire c'est que quand il est reparti, il est allé
      vers chez rémi. direct. par le chemin entre les deux
      propriétés. genre c'était clairement rémi ou qqn de chez rémi.

      jpeux pas frr j'ai trop flippé j'ai couru. putain j'aurais
      dû filmer
    effects:
      trust_luna: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Vincent (beekeeper, dawn witness) ---

  vincent_interview:
    type: tweet
    from: vincent
    text: >
      Levé à 4h30 pour les ruches de transhumance. Le chemin des
      Romarins puait le produit chimique. Pas normal. Pas du tout.
    effects: { trust_vincent: "+5" }
    choices:
      - Ask Vincent what he saw -> vincent_talk

  vincent_talk:
    type: message
    text: >
      VINCENT: I was heading to my hives at 4h30 — before dawn, when
      it's cool enough to move the frames. The chemin des Romarins
      stank. Chemical smell. Strong. Like industrial pesticide, not
      the usual agricultural stuff.

