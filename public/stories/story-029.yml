      - Confront Mayor Auriol (political protection) -> confront_philippe
      - I need more evidence -> investigation_hub

  # --- ENDING A: Rémi (Best Ending) ---

  confront_remi:
    type: message
    text: >
      You present your evidence to Rémi Delorme:

      "I know @LavandeSauvage is your account. I know you were on
      Aurélien's land the night he disappeared. I know you poisoned
      his beehives. I know you asked the notaire about acquiring
      land from an absent owner — before he was even missing. I have
      witnesses, photos, and property records."
    choices:
      - Send -> remi_response

  remi_response:
    type: message
    text: >
      Rémi doesn't reply for a long time. Then:

      RÉMI: You don't understand anything about land. That property
      is wasted on him. Organic lavender — putain, what a joke. I
      offered him fair value. More than fair. He refused out of
      sentiment. The land needs development, investment, a future.
      Everything I did was for the good of this village.

      That's not community spirit. That's obsession.

      You've already sent the evidence to Adjudant Martel. And to
      Hélène Caron.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Adjudant Martel reopens the case. With your evidence — the
      anonymous account, the beehive sabotage, the trespassing,
      the property records, the notaire's testimony — Rémi Delorme
      is arrested for harassment, property destruction, and animal
      cruelty. His planning application for Provence Horizons SARL
      is suspended.

      Hélène Caron, armed with Aurélien's complete pesticide
      dossier, publishes the AgroSynth story in Mediapart. The
      DRAAF orders an unannounced inspection of the depot. Banned
      neonicotinoids are found in the warehouse. Marius Estienne
      faces criminal charges for trafficking in prohibited
      substances. The mayor is questioned about his role in
      blocking inspections.

      And Aurélien Roux, reading the story from a friend's mas
      in the Luberon hills, calls his brother for the first time
      in nine days.

      "Je rentre à la maison. Les abeilles m'attendent."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: aurelien
    text: >
      la terre ne ment pas. les abeilles non plus. merci de ne
      pas avoir lâché. la lavande va refleurir.
    choices:
      - The End -> game_complete

  # --- ENDING B: Marius (Partial Ending) ---

  confront_marius:
    type: message
    text: >
      You present the pesticide evidence to Marius Estienne:

      "I have lab results showing banned neonicotinoids at 15 times
      the legal threshold. I have GPS-tagged photos of your trucks
      on the chemin des Romarins at night. I have soil samples,
      bee mortality data, and a witness who smelled the chemicals
      at dawn. I have the association's five-year dataset showing
      the contamination started when your depot opened."
    choices:
      - Send -> marius_response

  marius_response:
    type: message
    text: >
      MARIUS: AgroSynth Provence operates in full compliance with
      all phytosanitary regulations. These allegations are defamatory
      and will be addressed through appropriate legal channels. Our
      counsel has been notified.

      But it's too late. You've sent the evidence to Hélène, to
      Terre de Lavande, and to the DRAAF directly.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pesticide story breaks. AgroSynth's depot is raided. Banned
      products are seized. The conventional farmers who bought them
      face fines. The plateau's reputation as an organic lavender
      region is damaged. The village is divided.

      But Aurélien?

      Without the harassment evidence, Rémi Delorme is never
      investigated. He continues to live next door. He continues
      to walk Aurélien's land at night. He creates a new anonymous
      account. He files a fourth offer to purchase.

      Two months later, Aurélien reads about AgroSynth online. He
      returns quietly. He repairs his beehives. He installs cameras.
      He locks his gates every night. He sleeps with his dog in the
      barn.

      The corporation is exposed. But the man who terrorised
      Aurélien walks free next door.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: aurelien
    text: "je suis rentré. les abeilles reviennent. le reste... on verra."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_philippe:
    type: message
    text: >
      You confront Mayor Auriol with your evidence.

      Within the hour, you receive a message from a Manosque
      law firm:
    choices:
      - Read the response -> philippe_response

  philippe_response:
    type: tweet
    from: mairie_valensole
    text: >
      La Mairie de Valensole-sur-Laye prend note des allégations
      portées à la connaissance de M. le Maire. Toute diffusion
      publique de propos diffamatoires fera l'objet de poursuites.
      — Cabinet juridique Gontard & Associés, Manosque
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Auriol and AgroSynth's illegal activities — and
      there isn't one beyond political protection — your evidence
      is misdirected.

      AgroSynth continues to spray. Rémi continues to harass.
      Aurélien stays in hiding.

      Six months later, @LavandeSauvage creates a new account.
      It follows Aurélien's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: VALENSOLE-SUR-LAYE — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Aurélien's story explores themes of
      corporate impunity, environmental crime, obsessive harassment,
      land disputes, community solidarity, and the courage to
      protect the earth.

      If you or someone you know is experiencing harassment or
      is in distress, help is available:
      SOS Amitié: 09 72 39 40 50
      Violences Femmes Info: 3919 (appel gratuit)
      Signalement environnemental: 0 800 130 000
