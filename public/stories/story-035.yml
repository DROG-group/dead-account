  # --- ENDING B: Filippo (Partial Ending) ---

  confront_filippo:
    type: message
    text: >
      You present the pollution evidence to Filippo Marchetti:

      "I have photographs of the undeclared drainage channels. I have
      soil samples showing pesticide levels ten times the legal
      limit. I have your original lab reports showing the data was
      falsified. I have the barrels with your batch numbers."
    choices:
