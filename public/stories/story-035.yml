    text: >
      FILIPPO: Questa conversazione viene inoltrata al nostro ufficio
      legale. Qualsiasi pubblicazione di materiale diffamatorio sarà
      oggetto di procedimenti immediati. AgroVerde ha sempre operato
      nel rispetto dei requisiti normativi.

      But it's too late. You've sent the evidence to Betta, to
      Terra Nostra, and to the provincia.
    choices:
