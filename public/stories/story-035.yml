      avatar: avatars/maresciallo.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN MEZZOCORONA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Mezzocorona.social — the community Mastodon instance for
      the hill village of Mezzocorona, Abruzzo.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @giulia_conti.

      A vineyard worker. Natural winemaker. She documented the land, the
      soil, the old vines. People are worried. She hasn't posted in six
      days.
    choices:
      - Look at her profile -> giulia_profile

  giulia_profile:
    type: tweet
    from: giulia
    text: "Il terreno dietro Vigna Vecchia puzza di chimico. Qualcuno sta scaricando pesticidi. Ho le prove."
    choices:
      - That's her last real post... -> grey_vine

  grey_vine:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a blurred photo of dead vines. Overexposed, shot from a strange
      angle. Posted at 4am. No caption.

      Her friends say that's not her style. The carabinieri say she
      probably went to visit relatives. Something doesn't add up.
    choices:
      - Read the carabinieri statement -> carabinieri_statement
      - Look at what people are saying -> community_reaction

  carabinieri_statement:
    type: tweet
    from: maresciallo
    text: >
      Abbiamo ricevuto una segnalazione riguardante una residente di
      Mezzocorona. Al momento non emergono elementi che facciano
      ipotizzare un reato. Eventuali informazioni utili possono essere
      comunicate al 112 o alla stazione.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her flatmate @elena_ferrante is
      desperate. Her brother @marco_conti is driving down from Pescara.
      Her colleague @valentina_deluca is posting worried messages.
      The farmer @carlo_marinelli says she was right about the
      chemicals.

      And the journalist @betta_mancini is strangely silent.

      Nobody buys the carabinieri's line. Nobody thinks Giulia just
      "went to visit relatives."
    effects: { trust_elena: "+5", trust_marco: "+5" }
    choices:
      - Start following Giulia's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Mezzocorona. Follow Giulia's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Rosaria (café owner, knows everyone) -> rosaria_intro
      - Talk to Carlo (farmer, saw the chemicals) -> carlo_intro
      - Talk to Chiara (teen climber, seems shaken) -> chiara_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Giulia with the rhythms of a small
      hill village: harvest schedules, the bakery's daily specials,
      weather warnings for the valley.

      Key names surface: Elena (flatmate, midwife), Valentina (winery
      colleague, seems rattled), Betta (journalist, oddly quiet),
      and the teens — Chiara, Davide, Tommaso — who worshipped
      Giulia's work with the vines.

      Also prominent: AgroVerde S.p.A., the agrochemical plant at the
      edge of the valley. Their posts are corporate PR. Giulia's posts
      were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Rosaria -> rosaria_intro
      - Talk to Carlo -> carlo_intro
      - Talk to Chiara -> chiara_intro

  # --- Rosaria (social map) ---

  rosaria_intro:
    type: tweet
    from: rosaria
    text: >
      Il bar è aperto ma il cuore non c'è. @giulia_conti, il tuo
      tavolo ti aspetta. Torna presto.
    effects: { trust_rosaria: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Rosaria -> rosaria_talk

  rosaria_talk:
    type: message
    text: >
      ROSARIA: Ah, sei nuovo? Benvenuto. Brutto momento per arrivare.
      Sono tutti in ansia per Giulia.

      Ti dico chi è chi. Elena è la coinquilina di Giulia — dividono
      un appartamento sopra la farmacia. Brava ragazza, distrutta in
      questo momento. Valentina De Luca lavora alla cantina sociale
      con Giulia. In gamba, ma... strana quando parla di lei. Marco è
      il fratello maggiore di Giulia, sta arrivando da Pescara.

      E Betta Mancini — la giornalista — lei e Giulia stavano
      lavorando insieme su qualcosa. Qualcosa sulla terra. Betta non
      ha detto una parola da quando Giulia è sparita. Non è da lei.

      Ah, e lascia perdere i post di AgroVerde. Bugie incartate in
      certificazioni ISO.
    effects: { trust_rosaria: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Luca Ferretti -> rosaria_luca
      - Ask about AgroVerde -> rosaria_agroverde
      - Thank her and move on -> quest1_hub

  rosaria_luca:
    type: message
    text: >
      ROSARIA: Luca Ferretti? Il geometra. Possiede mezza Mezzocorona
      a questo punto. Affitta case ai braccianti, agli stagionali. Giulia
      gli pagava l'affitto per il suo appartamento e per il magazzino
      dove teneva le botti.

      Da quando Giulia ha piantato le vigne vecchie su quel terreno
      in collina, Luca è diventato... insistente. Voleva quel terreno
      indietro, diceva che il contratto era scaduto. Lei gli ha mostrato
      le carte, tutto in regola. Ma lui non mollava.

      Passava sotto l'appartamento di Giulia a qualsiasi ora. Le mandava
      messaggi. "Dobbiamo parlare del terreno." Madonna, che palle.
      Giulia mi ha detto una volta: "Quello non capisce il no."
    effects: { trust_rosaria: "+5" }
    choices:
      - Ask about AgroVerde -> rosaria_agroverde
      - Move on -> quest1_hub

  rosaria_agroverde:
    type: message
    text: >
      ROSARIA: Quello stabilimento è lì dagli anni '90. Producono
      pesticidi, diserbanti, roba chimica per l'agricoltura. Il paese
      li ha tollerati perché portavano lavoro. Ma i contadini si
      lamentano da anni — odori chimici di notte, terra bruciata
      vicino ai canali di scolo, viti che muoiono senza motivo.

      Giulia è stata la prima a prendere campioni del terreno con le
      provette e portarli al laboratorio. Aveva prove, diceva. Prove
      vere. Due settimane dopo è sparita.
    effects: { trust_rosaria: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Carlo (the chemicals, witness tease) ---

  carlo_intro:
    type: tweet
    from: carlo
    text: >
      quarantacinque anni che lavoro sta collina. la terra non è più la
      stessa. @giulia_conti aveva ragione. e adesso è sparita. fate voi
      il collegamento.
    effects: { trust_carlo: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Carlo -> carlo_talk

  carlo_talk:
    type: message
    text: >
      CARLO: Io questa collina la lavoro da quando avevo quindici anni.
      Conosco ogni filare, ogni colore che fa la terra. E ti dico — il
      terreno vicino al canale di AgroVerde è sbagliato. Da mesi. Le viti
      muoiono, le radici escono nere. La terra puzza di chimico.

      Giulia ha preso campioni del suolo. È andata a controllare lo
      scarico di notte. Ha fotografato tutto. Stava costruendo un caso.
      E poi puf — sparita.

      Tu pensi che sia una coincidenza? Io alle coincidenze in collina
      non ci credo.
    effects: { trust_carlo: "+10" }
    choices:
      - Did you see anything unusual recently? -> carlo_night
      - Move on -> quest1_hub

  carlo_night:
    type: message
    text: >
      CARLO: La notte prima che sparisse — stavo tornando dalla vigna,
      saranno state le 23. Ho visto le luci accese alla cantina sociale.
      Non è strano, a volte si lavora fino a tardi per le fermentazioni.
      Ma c'erano due macchine nel parcheggio. Una era la vecchia Panda
      di Giulia. L'altra era una berlina nera con le targhe AgroVerde.

      Alle 23. Alla cantina sociale.

      Non ci ho pensato troppo allora. Adesso ci penso in continuazione.
    effects: { trust_carlo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Chiara (teen climber, witness tease) ---

  chiara_intro:
    type: tweet
    from: chiara
    text: >
      minchia sono distrutta fra @giulia_conti è lei che mi ha insegnato
      a rispettare la terra tipo non è possibile che sia partita così.
      se qualcuno sa qualcosa parlate per favore
    effects: { trust_chiara: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Chiara -> chiara_talk_early

  chiara_talk_early:
    type: message
    text: >
      CHIARA: ahah sei nuovo? che timing di merda. comunque giulia è tipo
      la persona migliore di sto paese. ci ha insegnato a riconoscere le
      piante, ci portava in vigna a vedere la vendemmia. troppo forte.

      e adesso sono in paranoia perché davide ha visto una roba strana
      l'altra sera al magazzino ma non vuole parlarne. dice che non è
      niente ma tipo... non è niente sto cazzo
    effects: { trust_chiara: "+10" }
    choices:
      - What did Davide see? -> chiara_davide_hint
      - Move on -> quest1_hub

  chiara_davide_hint:
    type: message
    text: >
      CHIARA: boh non so esattamente. era al sentiero vicino al magazzino
      di giulia e ha visto tipo uno che frugava nel furgone di giulia??
      o qualcosa del genere. si è cagato sotto e non ne vuole parlare.
      devi chiedergli diretto ma è diffidente con quelli che non conosce.
      prova prima a parlare di mtb con lui ahah
    effects: { trust_chiara: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Mezzocorona. An Abruzzo hill village
      built around wine and olive oil. A vineyard worker who was exposing
      pesticide dumping. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Elena (Giulia's flatmate) -> elena_q1
      - Talk to Valentina (Giulia's colleague) -> valentina_q1
      - Check what Marco (Giulia's brother) is saying -> marco_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Elena Q1 ---

  elena_q1:
    type: tweet
    from: elena
    text: >
      se qualcuno ha notizie di @giulia_conti chiamatemi per favore.
      la sua stanza è intatta. le sue botti sono lì. non sarebbe mai
      partita senza controllare la fermentazione.
    effects: { trust_elena: "+5", contacts_followed: "+1" }
    choices:
      - DM Elena -> elena_q1_talk

  elena_q1_talk:
    type: message
    text: >
      ELENA: Grazie per il pensiero ma non ti conosco. Giulia ha tanti
      amici qui. Sono sicura che tornerà.

      ...continuo a ripetermelo. Non ci credo più.

      [Elena is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_elena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Valentina Q1 ---

  valentina_q1:
    type: tweet
    from: valentina
    text: >
      La cantina è vuota senza @giulia_conti. I suoi campioni sono
      ancora in laboratorio. I suoi appunti di vigna sono sulla
      scrivania. Non avrebbe mai abbandonato una fermentazione in
      corso. Qualcosa è successo.
    effects: { trust_valentina: "+5", contacts_followed: "+1" }
    choices:
      - DM Valentina -> valentina_q1_talk

  valentina_q1_talk:
    type: message
    text: >
      VALENTINA: Giulia e io lavoriamo insieme da più di un anno.
      È la vignaiola più appassionata che conosco. Questa indagine
      sui pesticidi — era tutto per lei. Aveva dati, foto, analisi
      chimiche del terreno. Era vicinissima a rendere tutto pubblico.

      Mi ha chiesto di aiutarla. Tante volte ho provato. Lei diceva
      che aveva tutto sotto controllo. Diceva che stava lavorando con
      una giornalista. Io volevo solo supportarla.

      [Valentina seems earnest. Almost too earnest.]
    effects: { trust_valentina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marco Q1 ---

  marco_q1:
    type: tweet
    from: marco
    text: >
      mia sorella è SPARITA e i carabinieri mi dicono che forse è
      andata a trovare dei parenti??? MA NON PARTE SENZA AVVISARE
      CAZZO. arrivo da pescara. qualcuno mi spiega.
    effects: { trust_marco: "+5", contacts_followed: "+1" }
    choices:
      - DM Marco -> marco_q1_talk

  marco_q1_talk:
    type: message
    text: >
      MARCO: E tu chi cazzo sei? Un altro di quel paese che mi dice di
      stare calmo? Mia sorella mi ha chiamato la sera prima di sparire.
      Ha detto che aveva qualcosa di grosso. Ha detto "se succede
      qualcosa, guarda AgroVerde." Poi ha riattaccato.

      È l'ultima volta che l'ho sentita.
    effects: { trust_marco: "+10" }
    choices:
      - What do you think happened? -> marco_theory
      - Move on -> quest1_hub

  marco_theory:
    type: message
    text: >
      MARCO: Io penso che ha trovato le prove che AgroVerde scarica
      pesticidi illegali e quelli l'hanno fatta sparire. Ma penso anche
      che quel coglione del padrone di casa — Luca Ferretti — sa più di
      quello che dice. Il modo in cui parla di lei... non è solo interesse
      professionale. È qualcos'altro.

      Giulia mi ha detto mesi fa che qualcuno entrava nel suo magazzino
      di notte. Pensava fosse niente. Io non penso che fosse niente.
    effects: { trust_marco: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Giulia went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Davide (was on the trail near the warehouse) -> davide_interview
      - Find Enzo (municipal guard, works late) -> enzo_interview
      - Find Luciano (olive farmer, early morning in the groves) -> luciano_interview
      - Find Don Renzo (parish priest, insomnia, saw something) -> don_renzo_interview

  # --- Davide (saw someone at Giulia's van) ---

  davide_interview:
    type: tweet
    from: davide
    text: >
      uscita in mtb stasera ma l'atmosfera al magazzino è strana tipo.
      c'è qualcosa che non va. non so come spiegarlo
    effects: { trust_davide: "+5" }
    choices:
      - Ask Davide about that evening -> davide_talk

  davide_talk:
    type: message
    text: >
      DAVIDE: fra ok ma non lo dici a nessuno eh. ero al sentiero vicino
      al magazzino di giulia verso le 19. e ho visto il geometra — luca
      ferretti — vicino al furgone di giulia. aveva l'aria di frugare
      dentro o tipo mettere qualcosa. quando mi ha visto è partito
      troppo veloce.

      tipo io non ho detto niente perché non volevo casini ma adesso
      è grave. non è normale il suo comportamento madonna
    effects:
      trust_davide: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Enzo (municipal guard, saw late-night meeting) ---

  enzo_interview:
    type: tweet
    from: enzo
    text: >
      Ricordo: il magazzino comunale è vietato l'accesso tra le 22 e
      le 6. Ho notato passaggi non autorizzati nelle ultime notti.
    effects: { trust_enzo: "+5" }
    choices:
      - Ask Enzo what he saw -> enzo_talk

  enzo_talk:
    type: message
    text: >
      ENZO: Stavo chiudendo l'ufficio verso le 22:30. Ho visto il
      furgone di Giulia ancora parcheggiato alla cantina sociale.
      E una berlina nera — targhe AgroVerde — parcheggiata di fianco.
      Due uomini stavano all'ingresso della cantina. Uno l'ho
      riconosciuto: Filippo Marchetti, il direttore dello stabilimento.

      Alle 22:30. Alla cantina sociale. Non è normale.

      L'ho segnato nel registro di ronda. Nessuno me l'ha chiesto.
    effects:
      trust_enzo: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

