  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. AgroVerde is ordered to halt
      production pending investigation. The plant may close. One
      hundred and fifty jobs hang in the balance. The village is
      divided.

      But Giulia?

      Without the stalking evidence, Luca is never investigated.
      He continues to own the properties. He continues to monitor
      her movements. He creates a new anonymous profile.

      Three months later, Giulia reads about AgroVerde online.
      She returns quietly. She changes wineries. She stops working
      the vines alone. She checks her van every morning.

      The corporation is exposed. But the person who terrorised
      Giulia walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

