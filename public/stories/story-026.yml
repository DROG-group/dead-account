      She started coming to my garden in the evenings. Sitting on the bench, watching Villa Zarya through my binoculars. She said she was "birdwatching." At midnight. Birdwatching.


      She was brave. Too brave. I told her -- "Desi, mila, some things are bigger than us." She said, "That's exactly why someone has to fight."
