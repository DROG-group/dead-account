      bio: "82 years old. Seen everything. Forgot nothing. My garden has the best domati in town."
      avatar: avatars/babayordanka.jpg
    kaloyan:
      name: "Kaloyan Georgiev"
      bio: "16 | morska born & raised | skater | desi's yoga class was qko | #justicefordesi"
      avatar: avatars/kaloyan.jpg
    viktoria:
      name: "Viktoria Stoyanova"
      bio: "17 | photographer | beach life | desi taught me to breathe | something is wrong in this town"
      avatar: avatars/viktoria.jpg
    boyan:
