  ending_public:
    type: message
    text: >
      ENDING 2: THE BROADCAST


      Rositsa publishes the story simultaneously through bTV national news and Capital magazine online. The headline: "Black Sea Village Conceals International Trafficking Network."


      The evidence package is devastating: photos, video, financial records, eyewitness testimony, the Romanian diary, Desi's journal. Names are named. Plamen Draganov. Martin Cole. Sunrise Horizons Ltd.


      Within hours, the story goes viral. Bulgarian social media erupts. Politicians issue statements. The Interior Minister orders an immediate investigation.


      But the publicity has consequences. By the time GDBOP arrives in Morska Polyana the next morning, Villa Zarya is empty. Zhivko disappeared overnight. The basement has been hastily cleaned. The women are gone -- moved to another location before dawn.


      Plamen is arrested at the border trying to flee to Turkey. His phone and documents provide crucial intelligence. Over the following month, most of the network is dismantled through international cooperation.


      But Desi is not found at the villa. The search extends across the country. For two agonizing weeks, there is no trace.


      Then: a tip from Romanian police. A woman matching Desi's description was dropped at a hospital in Constanta, Romania, disoriented and dehydrated. She had been moved when the villa was evacuated.


      Desi is alive. She's brought home to Bulgaria. Recovery is slow.


      Petya never leaves her side. "We found you," she whispers. "We didn't stop looking."


      Seven of the eleven women held at the villa are eventually located and rescued through the ongoing investigation. Four remain missing. Their cases stay open.


      The story wins Rositsa a national journalism award. She dedicates it to Desi and to the women still unfound.


      Kaloyan, Viktoria, and Boyan become local heroes. "abe brat," Kaloyan posts, "never let them tell you kids cant change things."


      Nikolay resigns from the police. He testifies against Plamen in exchange for reduced charges.


      Morska Polyana begins to heal. But the empty beds in the villa's basement haunt the town. Not everyone was saved. Not this time.


      ---


