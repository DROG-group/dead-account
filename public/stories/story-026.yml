  ending_rescue:
    type: message
    text: >
      ENDING 3: THE LONG NIGHT


      You can't wait for bureaucracy. Every hour that passes puts Desi and the other women at risk. You rally the community for a direct intervention.


      Dimitar provides his Navy experience and tactical planning. Stefan and three fishermen agree to block the cove with their boats, cutting off the sea escape route. Georgi mobilizes trusted locals to form a watch around the villa's perimeter. Milena, Petya, and Rositsa coordinate from the cafe. The teens -- against everyone's wishes -- set up a live stream from the hill above the villa.


      At 2 AM, as a boat approaches Zalivcheto on schedule, the fishermen block the cove with spotlights blazing. The boat turns back.


      Simultaneously, Nikolay -- his conscience finally overwhelming his fear -- approaches Villa Zarya's front door with his badge and a legal welfare check order. When Zhivko refuses entry, Nikolay radios for the Burgas emergency response unit he secretly contacted.


      What follows is chaotic. Zhivko tries to flee through the back garden. Dimitar and Stefan are waiting. The Burgas team breaches the front door. The teens' live stream captures everything -- thousands of viewers in real-time.


      In the basement, behind a locked reinforced door: nine women and Desi. They are alive. Desi is barely conscious, dehydrated, but when she sees Milena's face, she whispers: "You found the safe."


      "We found you," Milena replies. "That's what matters."


      The rescue is messy. It's not a clean operation. One of the fishermen is hurt when Zhivko fights back. The live stream means the network is instantly alerted -- cells across the country begin to scatter.


      But in the following days, the public outrage from the live-streamed rescue forces a massive national response. GDBOP, Interpol, and Romanian police coordinate the largest anti-trafficking operation in Bulgarian history.


      Not all the perpetrators are caught. Martin Cole disappears. The network's higher levels remain partially intact. But the Morska Polyana route is destroyed forever.


      Desi's recovery is long. She has nightmares. She flinches at loud sounds. But she goes back to teaching yoga within three months.


      Her first class back is standing room only. Baba Yordanka is in the front row. "I told you," the old woman says. "My eyes are sharp."


      The nine women are connected with support services through Ivayla's foundation. Three choose to stay in Bulgaria. The others return home. All of them carry scars.


      Morska Polyana's community action becomes a case study in citizen intervention. It inspires. It also warns -- of how close a small town came to looking the other way.


      On the one-year anniversary, Desi posts on MorskaPolyana.social: "A year ago I saw something I couldn't unsee. Today I teach people to breathe, to be present, to notice the world around them. Notice everything. Even the things that scare you. Especially those."


