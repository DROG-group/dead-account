      Villa Zarya appears to be a transit house. Women stay briefly -- days, maybe a week -- before being moved to their final destination. Probably Western Europe. Germany, Netherlands, UK.


      The organization is sophisticated. Shell companies, corrupt officials, professional logistics. Plamen Draganov is the local facilitator, but the people above him are international.
