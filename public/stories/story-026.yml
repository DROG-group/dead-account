      They dock at Zalivcheto because the cove has no surveillance. No cameras, no harbor master. Just rocks and a dirt path that leads up to the coast road.


      From there, it's a five-minute drive to Villa Zarya.


      I mapped the arrivals. In three months: fourteen boat landings. Each time, between two and seven people are moved. Always at the new moon, when it's darkest.


