  ending_raid:
    type: message
    text: >
      ENDING 1: THE RAID


      Through Ivayla's contacts and Petya's legal connections, you deliver the complete evidence package to GDBOP Inspector Petrov in Sofia. The dossier includes: Desi's journal and photographs, Boyan's video, Viktoria's surveillance photos, Dimitar's boat logs, Stefan's physical evidence, Baba Yordanka's eyewitness testimony, Nikolay's CCTV footage, Rositsa's financial analysis, and Plamen's recorded threats.


      Inspector Petrov mobilizes a joint operation. GDBOP, coast guard special operations, and the national police anti-trafficking unit converge on Morska Polyana at dawn, five days after you arrived.


      At 5:47 AM, teams simultaneously raid Villa Zarya, Plamen's office, and Zalivcheto cove.


      In the villa's basement, they find eleven women from Romania, Moldova, and Ukraine. Some have been held for weeks. They are malnourished, frightened, but alive.


      In a locked room behind the wine cellar, they find Desi Ivanova. She is weak, dehydrated, and has been held in near-darkness for twelve days. But she is alive.


      Zhivko is arrested at the villa. Plamen is arrested at his home trying to destroy documents. The British man, Martin Cole, is arrested at the Burgas Marriott through Interpol coordination.


      Nikolay turns himself in voluntarily. His cooperation is noted. Commander Todorov in Burgas is suspended pending investigation.


      Over the following weeks, the network is dismantled across three countries. Twenty-three arrests in Bulgaria, Turkey, and the UK. Forty-seven trafficking victims are identified and connected with support services.


      Desi recovers in a Burgas hospital. Petya stays by her side. Milena reopens the yoga studio with a banner: "She saw. She spoke. She survived."


      The teens -- Kaloyan, Viktoria, and Boyan -- are recognized by the Open Door Foundation for their bravery. Boyan gets a new phone.


      Morska Polyana will never be the same. But for the first time in months, the town feels like it can breathe.


