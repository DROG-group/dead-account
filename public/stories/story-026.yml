      name: "Milena Todorova"
      bio: "Desi's best friend. Co-instructor at Morska Yoga. I won't stop asking questions until I get answers."
      avatar: avatars/milena.jpg
    plamen:
      name: "Plamen Draganov"
      bio: "Real estate developer. Investing in Morska Polyana's future. Progress requires vision."
      avatar: avatars/plamen.jpg
    rositsa:
      name: "Rositsa Marinova"
      bio: "Reporter for Chernomorski Vestnik. The coast deserves honest journalism."
      avatar: avatars/rositsa.jpg
    nikolay:
      name: "Nikolay Borisov"
      bio: "Local police sergeant. Keeping Morska Polyana safe. My door is always open."
      avatar: avatars/nikolay.jpg
    ivayla:
      name: "Ivayla Zheleva"
      bio: "NGO worker with Open Door Foundation. Helping vulnerable people on the coast."
      avatar: avatars/ivayla.jpg
    stefan:
      name: "Stefan Krastev"
      bio: "Fisherman. Third generation. The sea gives and the sea takes."
      avatar: avatars/stefan.jpg
    petya:
      name: "Petya Ivanova"
      bio: "Desi's older sister. Came from Sofia when she disappeared. I need the truth."
      avatar: avatars/petya.jpg
    zhivko:
      name: "Zhivko Metodiev"
      bio: "Security guard at Villa Zarya. Just doing my job. Nothing to see."
      avatar: avatars/zhivko.jpg

entry: welcome

nodes:
  welcome:
    type: message
    text: >
      Welcome to MorskaPolyana.social, the local Mastodon instance for our small Black Sea community.


      You've just arrived in Morska Polyana -- a quiet coastal town known for its beaches, fishing boats, and laid-back atmosphere.


      But something is wrong. A popular local yoga instructor named Desislava "Desi" Ivanova has gone missing. Her account @desi_yoga has been silent for nine days. Her last post was a cryptic message about "seeing too much."


      The local police say she probably left town voluntarily. Her friends and family say otherwise.


      You've been added to the instance. Start exploring.
    choices:
      - Look at Desi's last posts -> desi_last_posts
      - Check the local timeline -> local_timeline
      - Read your welcome DMs -> welcome_dms

  desi_last_posts:
    type: tweet
    from: milena
    text: >
      I pinned Desi's last few posts before they get buried. Everyone needs to see these.


      @desi_yoga [9 days ago]: "Something is happening at the villa next door. Lights at 3am. Vans. Voices. I'm not imagining this."


      @desi_yoga [10 days ago]: "Got approached by two men outside the studio today. They didn't speak Bulgarian. They told me in English to 'mind my own business.' I'm shaking."


      @desi_yoga [12 days ago]: "My retreat center shares a wall with Villa Zarya. The new tenants are... unsettling. Who are these people?"
    effects:
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Follow Milena and ask about Desi -> follow_milena
      - Look into Villa Zarya -> villa_zarya_intro
      - Check the local timeline -> local_timeline

  local_timeline:
    type: tweet
    from: georgi
    text: >
      Morning everyone. Coffee is brewing at Korali. The usual crowd is quiet today. Still no word about Desi.


      If anyone has information, please speak up. This town is too small for silence.
    choices:
      - Follow Georgi -> follow_georgi
      - Check other posts on the timeline -> timeline_more
      - Go back and look at Desi's posts -> desi_last_posts

  welcome_dms:
    type: message
    text: >
      You have two direct messages waiting.


      One is from @tsvetana_pharm: "Welcome to Morska Polyana. I noticed you're new. Be careful who you talk to about Desi. Not everyone here wants the truth found."


      The other is from @kaloyan_sk8: "abe brat, you the new person right? if you want to know what happened to desi, hit me up. i know stuff but cant post it public. seriozno."
    choices:
      - Reply to Tsvetana -> reply_tsvetana
      - Reply to Kaloyan -> reply_kaloyan
      - Check the local timeline first -> local_timeline

  reply_tsvetana:
    type: tweet
    from: tsvetana
    text: >
      I'm glad you reached out. Desi was my neighbor -- our houses share the street behind the yoga center.


      The week before she disappeared, she came to my pharmacy three times. Not for medicine. She was scared. She said men were watching the yoga center. She said she heard crying at night from Villa Zarya.


      I told her to go to the police. She said she did. Nikolay told her she was "stressed and imagining things."


      I don't think she imagined anything.
    effects:
      trust_tsvetana: "+10"
      threat_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Ask Tsvetana about Villa Zarya -> tsvetana_villa
      - Ask about the police response -> tsvetana_police
      - Follow up with Kaloyan instead -> reply_kaloyan

  tsvetana_villa:
    type: tweet
    from: tsvetana
    text: >
      Villa Zarya has been empty for years. Old holiday property. Then about three months ago, someone rented it.


      A company called "Sunrise Horizons Ltd." -- sounds fake, right? Plamen Draganov handled the rental. He handles most property in town.


      The villa has blacked-out windows now. A security guard sits outside day and night. That's Zhivko -- he used to be a bouncer in Burgas. Not the kind of man you want as a neighbor.


      Desi's yoga retreat shares the back garden wall. She could see and hear everything.
    effects:
      trust_tsvetana: "+5"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Ask about Plamen Draganov -> plamen_intro
      - Ask about the security guard Zhivko -> zhivko_intro
      - Talk to someone else -> hub_contacts

  tsvetana_police:
    type: tweet
    from: tsvetana
    text: >
      Nikolay is not a bad man. But he is a lazy man. And maybe a scared man.


      When Desi reported the men who threatened her, he wrote it down. But nothing happened. No investigation. No patrol of the area.


      When she disappeared, he filed a missing persons report after three days -- Petya had to scream at him to do even that.


      I think someone told him to leave Villa Zarya alone. I don't know who. But Nikolay suddenly bought a new car last month. A sergeant's salary doesn't buy a Skoda Octavia.
    effects:
      trust_tsvetana: "+5"
      threat_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Confront Nikolay about this -> nikolay_confront
      - Ask about Plamen Draganov -> plamen_intro
      - Talk to other contacts -> hub_contacts

  reply_kaloyan:
    type: tweet
    from: kaloyan
    text: >
      abe finally someone who listens. ok so look -- me and boyan, we skate at night near the harbor yeah? last month we saw a van pull up to villa zarya at like 2am.


      people got out. not tourists brat. they looked scared. women mostly. someone was leading them inside.


      boyan got his phone out and recorded some of it. then zhivko that security dude spotted us and chased us. we ran. boyan dropped his phone. zhivko picked it up.


      boyan's been scared to talk about it since. but i saw what i saw. daj da ti kazha -- desi saw it too. thats why shes gone.
    effects:
      trust_kaloyan: "+15"
      trafficking_evidence: "+2"
      night_witnesses: "+1"
      evidence_total: "+2"
    choices:
      - Ask Kaloyan to introduce you to Boyan -> meet_boyan
      - Ask what else Kaloyan noticed -> kaloyan_more
      - Follow up on the van -> van_investigation

  meet_boyan:
    type: tweet
    from: boyan
    text: >
      kaloyan said you're cool so ok. but im not putting this on public timeline.


      that night was messed up. the van had no plates. the people inside -- they werent speaking bulgarian. sounded like romanian maybe? or russian? idk.


      zhivko grabbed my phone and said if i told anyone hed find me. and abe, he knows where i live. my mom works at the hotel, she cant afford trouble.


      but desi... desi was nice to us. she let us use the yoga studio courtyard to skate when it was raining. she doesnt deserve what happened.


      i want to help. but i need to know youre not gonna get me killed brat.
    effects:
      trust_boyan: "+10"
      trafficking_evidence: "+1"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Promise to protect Boyan's identity -> boyan_promise
      - Ask Boyan to describe the people he saw -> boyan_details
      - Ask about the phone Zhivko took -> boyan_phone

  boyan_promise:
    type: tweet
    from: boyan
    text: >
      ok... ok fine. look the video i took before zhivko grabbed my phone -- i backed it up to cloud. im not stupid. i just didnt know who to send it to.


      it shows three women being walked from the van into villa zarya. one of them was crying. there was a man in a suit directing everything. not zhivko, someone else. someone important looking.


      kaloyan thinks the man looked like that developer dude. plamen. but it was dark so nz honestly.


      if you can find someone safe to give this to -- not nikolay, he's useless -- ill send you the link.
    effects:
      trust_boyan: "+10"
      trafficking_evidence: "+2"
      evidence_total: "+2"
    choices:
      - Ask Boyan to send the video -> boyan_video
      - Find Rositsa the journalist -> rositsa_intro
      - Contact Ivayla from the NGO -> ivayla_intro

  boyan_details:
    type: tweet
    from: boyan
    text: >
      there were like 5 or 6 women. young. maybe 20s? one looked even younger, like our age tbh. they had bags like theyd been traveling.


      the man leading them was tall, suit, short hair. spoke english to zhivko. zhivko was nodding and opening doors.


      one woman tried to pull away and the suit guy grabbed her arm hard. thats when i started recording.


      abe seriozno this is trafficking isnt it? like the stuff they teach us about in school? desi figured it out and they took her.
    effects:
      trust_boyan: "+5"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Promise to protect Boyan's identity -> boyan_promise
      - Ask about the phone Zhivko took -> boyan_phone
      - Talk to someone else about this -> hub_contacts

  boyan_phone:
    type: tweet
    from: boyan
    text: >
      the phone is gone. zhivko probably smashed it or threw it in the sea.


      but like i told kaloyan -- i had cloud backup turned on. the video uploaded before he took it. its only like 40 seconds but you can see the van, the women, and the suit guy.


      im scared to share it tho. what if they trace it back to me? my IP or whatever?


      if you find someone who knows how to handle this stuff safely, ill share it. not the police tho. nikolay is compromised for sure.
    effects:
      trust_boyan: "+5"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Promise to protect Boyan's identity -> boyan_promise
      - Find Rositsa the journalist -> rositsa_intro
      - Contact Ivayla from the NGO -> ivayla_intro

  boyan_video:
    type: message
    text: >
      Boyan sends you a cloud link. The video is 43 seconds of shaky nighttime footage. You can make out a white van with no plates, Villa Zarya's side entrance, and several women being ushered inside by a tall man in dark clothing.


      At 0:31, the man turns briefly toward the light. The face is partially visible. It could be Plamen Draganov. It could be someone else. The quality is too poor to be certain.


      This is significant evidence. But it needs context to be useful.
    effects:
      trafficking_evidence: "+3"
      evidence_total: "+3"
    choices:
      - Show the video to Rositsa -> rositsa_video
      - Show the video to Ivayla -> ivayla_video
      - Investigate Plamen first -> plamen_intro

  kaloyan_more:
    type: tweet
    from: kaloyan
    text: >
      brat theres more. after desi disappeared, viktoria -- you know her right? she takes photos at the beach -- she said she saw zhivko near desi's apartment. like the day after desi stopped posting.


      and get this. desi's studio is locked now. milena cant get in. someone changed the locks. who does that? who has the keys?


      also plamen draganov posted on the town council page saying villa zarya is a "private rehabilitation clinic" now. kef, right? a rehab clinic with blacked out windows and no patients walking around.


      nz brat but this whole thing stinks. desi was onto something mnogo serious.
    effects:
      trust_kaloyan: "+5"
      trafficking_evidence: "+1"
      threat_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Meet Boyan about the video -> meet_boyan
      - Talk to Viktoria about what she saw -> viktoria_intro
      - Investigate Plamen -> plamen_intro

  follow_milena:
    type: tweet
    from: milena
    text: >
      Thank you for caring. Most people here have gone quiet since Desi disappeared.


      Desi and I built Morska Yoga together. She was the face, I was the organizer. She was fearless -- always speaking up, always questioning.


      Two weeks before she vanished, she told me she was going to document what was happening at Villa Zarya. She was taking photos from the garden wall at night. I told her it was dangerous. She said someone had to do it.


      Her last message to me was: "Milena, if anything happens, check the studio safe. The combination is our first class date."


      I haven't been able to get into the studio. The locks were changed.
    effects:
      trust_milena: "+15"
      trafficking_evidence: "+1"
      threat_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Ask about getting into the studio -> studio_access
      - Ask who changed the locks -> locks_question
      - Ask about Villa Zarya from Milena's perspective -> milena_villa

  studio_access:
    type: tweet
    from: milena
    text: >
      I've tried everything. The landlord says someone from Sunrise Horizons Ltd requested the lock change for "safety reasons." That's the same company renting Villa Zarya.


      Plamen Draganov signed the paperwork. He's the property manager for half the town. When I confronted him, he said it was standard procedure when a tenant goes missing.


      Standard procedure? Since when does a neighboring tenant get to change your locks?


      Petya -- Desi's sister from Sofia -- is trying to get a court order. But you know how slow Bulgarian courts are.


      If we could get into that safe, I think we'd find everything Desi collected. Photos. Notes. Maybe even names.
    effects:
      trust_milena: "+5"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Talk to Petya about the court order -> petya_intro
      - Confront Plamen about the locks -> plamen_locks
      - Ask Georgi if he knows another way in -> georgi_studio

  locks_question:
    type: tweet
    from: milena
    text: >
      The locksmith was Hristo from Burgas. He told me Plamen Draganov called him directly. Paid cash. Said the studio needed "new security."


      The landlord -- old Todor, he lives in Varna now -- confirmed he authorized it by phone. But when I called Todor myself, he sounded confused. He said he didn't remember authorizing anything. He's 79 and trusts whoever calls him.


      Plamen basically conned an old man into signing off on locking us out of our own studio. That's not a coincidence. Whatever Desi had in that safe, someone doesn't want it found.
    effects:
      trust_milena: "+5"
      threat_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Talk to Petya about legal options -> petya_intro
      - Confront Plamen -> plamen_intro
      - Check other leads -> hub_contacts

  milena_villa:
    type: tweet
    from: milena
    text: >
      I could hear things through the garden wall too. Desi wasn't making it up.


      Voices at night. Sometimes crying. The sound of vehicle doors. Always late -- after midnight.


      One morning I came to the studio early and saw Zhivko dumping trash bags behind the wall. The bags had clothes in them. Women's clothes. Cheap stuff, like travel clothes.


      I told Nikolay. He said Zhivko probably donated clothes and was dumping the leftovers. That's the level of investigation we're dealing with.
    effects:
      trust_milena: "+5"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Ask about the clothes specifically -> milena_clothes
      - Talk to Ivayla from the NGO -> ivayla_intro
      - Check other leads -> hub_contacts

  milena_clothes:
    type: tweet
    from: milena
    text: >
      I picked up one of the bags before Zhivko came back for the rest. Inside: two cheap dresses, a pair of worn shoes, and a small notebook.


      The notebook had writing in Romanian. I couldn't read it, but I photographed every page. Ivayla from the Open Door Foundation translated some of it for me.


      It was a diary. A young woman writing about being promised a hotel job in Greece. Instead she was taken to a house by the sea in Bulgaria. She wrote about men controlling her movement. About having her phone taken away.


      The last entry said: "They are moving us again tomorrow. I don't know where."


      That's when I knew. This isn't about property disputes or noise complaints. This is trafficking.
    effects:
      trust_milena: "+10"
      trafficking_evidence: "+3"
      evidence_total: "+3"
    choices:
      - Talk to Ivayla about the diary -> ivayla_diary
      - Find Rositsa the journalist -> rositsa_intro
      - Confront Plamen -> plamen_intro

  follow_georgi:
    type: tweet
    from: georgi
    text: >
      Welcome to Morska Polyana. I wish it were under better circumstances.


      I've run Cafe Korali for twenty years. Everyone comes through here. Desi used to have her morning smoothie at my counter every single day. When she stopped coming, I knew something was wrong before anyone filed a report.


      This town runs on relationships. If you want to understand what happened, you need to talk to people. Not just online -- come sit at the cafe, have a coffee, let the stories come to you.


      I know things. But I need to know I can trust you first. This town has ears everywhere.
    effects:
      trust_georgi: "+10"
      contacts_followed: "+1"
    choices:
      - Ask Georgi what he knows -> georgi_knows
      - Ask who to trust in town -> georgi_trust
      - Visit someone else first -> hub_contacts

  georgi_knows:
    type: tweet
    from: georgi
    text: >
      Plamen Draganov came into my cafe the day after Desi disappeared. He was on the phone. He thought I was in the kitchen, but I was restocking behind the bar.


      He said -- and I remember the exact words because they chilled me -- "The yoga woman has been handled. The property will be clear by the weekend."


      Handled. Like she was a problem to be solved, not a person.


      He was talking to someone in English. Not Bulgarian. The person on the other end had an accent I couldn't place.


      I didn't tell the police because Nikolay and Plamen play cards together every Thursday. You think that's a coincidence?
    effects:
      trust_georgi: "+15"
      threat_evidence: "+2"
      trafficking_evidence: "+1"
      evidence_total: "+3"
    choices:
      - Ask about Plamen and Nikolay's relationship -> georgi_plamen_nikolay
      - Ask if anyone else heard the call -> georgi_witnesses
      - Confront Plamen directly -> plamen_intro

  georgi_trust:
    type: tweet
    from: georgi
    text: >
      Trust Milena -- she was Desi's rock. Trust Petya -- she's Desi's sister and she's fierce. Trust Baba Yordanka -- she may be old but she sees everything from her garden.


      Be careful with Nikolay. He's police, but his loyalty is flexible.


      The kids -- Kaloyan, Viktoria, Boyan -- they know more than you'd think. This generation lives online. They've been investigating on their own, which frankly terrifies me.


      Don't trust Plamen. And definitely don't trust Zhivko.


      Rositsa the journalist is good. But she's been threatened too. Last month someone slashed her tires.
    effects:
      trust_georgi: "+5"
    choices:
      - Ask about Baba Yordanka -> babayordanka_intro
      - Talk to the teens -> reply_kaloyan
      - Find Rositsa -> rositsa_intro

  georgi_plamen_nikolay:
    type: tweet
    from: georgi
    text: >
      They've been close for years. Plamen helps Nikolay with "property consultations" -- basically Nikolay tells Plamen when properties come up for sale before they're listed, and Plamen gives him a cut.


      Small-town corruption. Nobody talked about it because it wasn't hurting anyone. But now?


      Plamen rented Villa Zarya to Sunrise Horizons. Nikolay made sure no one investigated the villa. Desi asked questions and now she's gone.


      Connect the dots. I'm just a cafe owner. I can't say these things officially. But you can.
    effects:
      trust_georgi: "+5"
      threat_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Ask who else might know about this corruption -> georgi_witnesses
      - Confront Nikolay -> nikolay_confront
      - Talk to Dimitar the retired navy officer -> dimitar_intro

  georgi_witnesses:
    type: tweet
    from: georgi
    text: >
      Old Dimitar sits at my terrace every afternoon. Ex-Navy. Sharp eyes. He told me he's seen boats coming to the small cove east of town at night. Not fishing boats -- faster ones. Rigid inflatables.


      Baba Yordanka lives on the hill above the harbor. She says her dog barks at 2 AM every few nights. Always in the same direction -- toward Villa Zarya.


      Stefan the fisherman told me his nets got cut twice near the east cove. Someone doesn't want fishermen in that water.


      Everyone has a piece. Nobody has the whole picture. Maybe you can put it together.
    effects:
      trust_georgi: "+5"
      trafficking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Talk to Dimitar about the boats -> dimitar_intro
      - Visit Baba Yordanka -> babayordanka_intro
      - Find Stefan the fisherman -> stefan_intro

  georgi_studio:
    type: tweet
    from: georgi
    text: >
      The studio... listen, the building is old. I helped Desi renovate it when she first opened. There's a back window in the storage room that never locked properly. We always joked about it.


      If the new locks are only on the main doors, that window might still be accessible from the alley.


      But I didn't tell you that. And if anyone asks, we were talking about banitsa recipes.
    effects:
      trust_georgi: "+5"
      threat_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Use this information to access the studio -> studio_break_in
      - Too risky, find another way -> petya_intro
      - Check other leads -> hub_contacts

  studio_break_in:
    type: message
    text: >
      Under cover of darkness, you approach the yoga studio from the back alley. The storage room window is exactly as Georgi described -- the latch is broken.


      Inside, the studio is untouched. Mats still rolled, incense still on the shelf. But the office door is ajar, and the safe sits behind the desk.


      Milena told you the combination is "their first class date." You check Desi's old posts -- her first yoga class was announced on March 15, 2019. You try 1-5-0-3-1-9.


      The safe clicks open.


      Inside: a USB drive, a printed stack of photographs, and a handwritten journal. The photographs show the van at Villa Zarya, people being led inside, and a clear shot of Plamen Draganov standing with an unidentified man in a suit.


      The journal documents dates, times, and descriptions of everything Desi witnessed over six weeks.
    effects:
      trafficking_evidence: "+5"
      threat_evidence: "+2"
      evidence_total: "+7"
    choices:
      - Read the journal entries -> desi_journal
      - Take everything to Rositsa -> rositsa_evidence
      - Contact Ivayla at the NGO -> ivayla_evidence

  desi_journal:
    type: message
    text: >
      Desi's journal is meticulous. Selected entries:


      "April 3 -- Third van this month. At least 4 women this time. One looked barely 18. Zhivko opened the gate. The suit man was there again."


      "April 8 -- Photographed license plate on the van: CB 4517 AX. Traced to a rental company in Sofia. Company listed at the same address as Sunrise Horizons Ltd."


      "April 12 -- Two men came to the studio. Not Zhivko. Foreigners. They said 'We know you watch. Stop watching or you will be sorry.' I filmed them leaving with the security camera."


      "April 15 -- Told Nikolay about the threats. He said he would 'look into it.' His face went white. He knows."


      "April 18 -- Plamen came to the studio offering to buy the lease. Offered three times what it's worth. I said no. He said 'You'll regret this.'"


      "April 20 -- I'm scared. But I can't stop. These women need someone to see them."


      The journal ends there. Desi disappeared on April 21.
    effects:
