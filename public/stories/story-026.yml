    text: >
      Two months ago, men came to Villa Zarya. Not Bulgarians. They painted the windows black. Who paints windows black? Even during communism, we didn't paint windows black.


      Then the security man arrived. Big man. Zhivko. He sits outside like a dog guarding bones. But what bones?


      Vans come at night. White vans. Sometimes from the coast road, sometimes from the harbor direction. People go in. Fewer people come out. Where do they go?


      And lights. Lights in the basement. I can see the glow from the basement windows -- small windows at ground level. There are people down there. Living down there. In 2026, in a European country, people are living in a basement.


      Desi saw it too. She was a good girl. She couldn't pretend she didn't see.
