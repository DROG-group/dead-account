      The night Desi disappeared. April 21st. I will never forget it.


      Sharo went mad barking around 1 AM. I looked out my window. A black car was parked outside Desi's apartment -- not on the street, in the alley behind. No lights.


      Two men went to her door. I couldn't see faces. After maybe ten minutes, they came out. Desi was between them. She wasn't fighting, but she wasn't walking freely either. One man had her arm.


      They put her in the car and drove toward the coast road. Not toward the highway. Toward the villa.


      I called Nikolay at 1:30 AM. He answered on the fifth ring. I told him what I saw. He said, "Baba, go back to sleep. You're seeing things."


      I am 82. My knees are bad. But my eyes and my mind are sharp. I know what I saw.
