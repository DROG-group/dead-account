  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: KUUSIJÄRVI — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Mining evidence: ${mining_evidence}
