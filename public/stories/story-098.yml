entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN KUUSIJÄRVI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Kuusijarvi.social — the community Mastodon instance for
      the village of Kuusijärvi, deep in the Kainuu wilderness of Finland.

      The local feed is unusually active today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see one name repeated everywhere:
      @elias_korhonen.

      A wilderness guide. Nature photographer. He led groups through the
      Kainuu old-growth forests and documented the pristine lake. People
      are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> elias_profile

  elias_profile:
    type: tweet
    from: elias
    text: "Kuusijärven pohjavesi on pilaantumassa. Koeporaukset ovat vuotaneet. Mulla on todisteet."
    choices:
      - That's his last real post... -> grey_forest

  grey_forest:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a grey forest. Blurred, overexposed, shot from a strange angle.
      Posted at 4am. No caption.

      His friends say that's not his style. The police say he probably
      went on a hiking trip. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: ylikonstaapeli
    text: >
      Olemme vastaanottaneet ilmoituksen Kuusijärven asukkaasta. Tässä
      vaiheessa mikään ei viittaa rikokseen. Kaikki hyödylliset tiedot
      voi ilmoittaa numeroon 112 tai Kuusijärven poliisiasemalle.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @sanna_korhonen is
      desperate. His best friend @mikko_laine is posting angry
      messages. His colleague @henna_virtanen is asking for information.
      The fisherman @tapani_karjalainen says Elias was right about
      the water.

      And the journalist @antti_rautio is strangely silent.

      Nobody buys the police's line. Nobody thinks Elias just
      "went hiking."
    effects: { trust_sanna: "+5", trust_mikko: "+5" }
    choices:
      - Start following Elias's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Kuusijärvi. Follow Elias's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Ritva (café owner, knows everyone) -> ritva_intro
      - Talk to Tapani (fisherman, saw the water change) -> tapani_intro
      - Talk to Noora (teen, seems shaken) -> noora_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Elias with the rhythms of a remote
      Kainuu village: weather warnings, the shop's stock updates,
      mushroom sightings, aurora forecasts.

      Key names surface: Sanna (sister, nurse), Mikko (best friend,
      furious), Henna (ex-girlfriend, photographer), and the teens —
      Noora, Veeti, Aino — who loved Elias's wilderness courses.

      Also prominent: NorthRock Mining Oy, the company pushing a
      mining permit on the lake's watershed. Their posts are
      corporate PR. Elias's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Ritva -> ritva_intro
      - Talk to Tapani -> tapani_intro
      - Talk to Noora -> noora_intro

  # --- Ritva (social map) ---

  ritva_intro:
    type: tweet
    from: ritva
    text: >
      Erätupa on auki mutta tunnelma on paskana. @elias_korhonen,
      sun kahvi odottaa. Tuu takas.
    effects: { trust_ritva: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ritva -> ritva_talk

  ritva_talk:
    type: message
    text: >
      RITVA: Ai, sä oot uus täällä? Tervetuloa. Huono aika muuttaa.
      Kaikki on ihan sekaisin Eliaksen takia.

      Kerron sulle kuka on kuka. Sanna on Eliaksen sisko — hoitaja
      terveyskeskuksessa. Hyvä tyttö, ihan rikki nyt. Mikko Laine on
      Eliaksen paras kaveri, puuseppä. Ne on tunteneet lapsuudesta.
      Henna Virtanen on Eliaksen ex, mutta ne jäi kavereiksi — molemmat
      luontokuvaajia.

      Ja sitte on tää Jenni Aaltonen. Retkeilyopas jostain Oulusta.
      Tuli tänne puol vuotta sitten. Käy kaikilla Eliaksen retkillä.
      Aina samassa pöydässä kahvilassa. Elias sano mulle kerran: "toi
      muija ei anna olla rauhassa."

      Ja pysy kaukana NorthRockin mainospuheista. Valheita ISO-
      sertifikaateilla päällystettyinä.
    effects: { trust_ritva: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Jenni -> ritva_jenni
      - Ask about NorthRock -> ritva_northrock
      - Thank her and move on -> quest1_hub

  ritva_jenni:
    type: message
    text: >
      RITVA: Jenni? Se ilmesty tänne viime keväänä. Sano olevansa
      retkeilyopas, haluu yhteistyötä Eliaksen kanssa. Elias oli
      kohtelias, mutta mä näin et se oli epämukava. Jenni oli aina
      siellä missä Eliaskin. Samalla polulla, samassa laavulla.

      Kerran Elias tuli tänne kahville ja sano "vittu toi seuraa mua
      joka paikkaan." Mä luulin et se liioitteli. Nyt en oo enää varma.

      Ja se Jennin sometili — @jenni_aaltonen — siel on pelkkää Eliasta.
      Joka ikinen kuva, joka ikinen reissu. Se on vähän creepy.
    effects: { trust_ritva: "+5" }
    choices:
      - Ask about NorthRock -> ritva_northrock
      - Move on -> quest1_hub

  ritva_northrock:
    type: message
    text: >
      RITVA: NorthRock Mining Oy. Ne tuli tänne kaks vuotta sitten
      tekemään "tutkimuksia." Koeporauksia järven valuma-alueella.
      Sano et se on nikkeliä — arvokasta, tarpeellista, vihreän
      siirtymän metalli.

      Mutta kalastajat huomas et vesi muuttu. Pohjamudat nousi.
      Tapani löysi kuolleita kaloja. Elias otti näytteitä ja sukelsi
      porauspaikkoihin. Sillä oli todisteita et koeporaukset vuotaa
      raskasmetalleja suoraan järveen.

      Kaks viikkoa myöhemmin se katosi.
    effects: { trust_ritva: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tapani (the water, witness tease) ---

  tapani_intro:
    type: tweet
    from: tapani
    text: >
      kuuskyt vuotta oon kalastanu tätä järvee. vesi ei oo enää sama.
      @elias_korhonen oli oikeessa. ja nyt se on kadonnu. miettikää
      ite.
    effects: { trust_tapani: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tapani -> tapani_talk

  tapani_talk:
    type: message
    text: >
      TAPANI: Mä oon kalastanu tätä järvee siitä asti ku olin viistoista.
      Mä tiiän joka lahden, joka virran, joka värin minkä se vesi tekee.
      Ja mä sanon sulle — se vesi porapaikkojen lähellä on vääränlaista.
      Samea. Haisee metallille.

      Verkot tulee ylös kuolleitten kalojen kanssa. Pohjaeläimet on
      kuollu. Jotain valuu sinne porarei'istä.

      Elias otti vesinäytteitä. Sukelsi sinne. Kuvasi kaiken. Se oli
      rakentamassa juttuu. Ja sitte — puff — kadonnu.

      Sä luulet et se on sattuma? Mä en usko sattumiin järvellä.
    effects: { trust_tapani: "+10" }
    choices:
      - Did you see anything unusual recently? -> tapani_night
      - Move on -> quest1_hub

  tapani_night:
    type: message
    text: >
      TAPANI: Sen yönä ku se katosi — mä olin verkoilla, yökalastelee.
      Noin yks yöllä. Mä näin valoja Eliaksen mökillä. Ei ihmeellistä,
      sehän on yökyöpeli. Mutta sitte näin auton. Mustan maasturin.
      NorthRockin logo kyljessä.

      Yöllä yheltä. Eräoppaan mökillä.

      En ajatellu silloin mitään. Nyt mä ajattelen sitä joka yö.
    effects: { trust_tapani: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Noora (teen, witness tease) ---

  noora_intro:
    type: tweet
    from: noora
    text: >
      vittu mä oon niin huolissani. @elias_korhonen opetti mut
      kalastamaan ja retkeilee. se on paras ihminen tässä kylässä.
      ei se oo lähteny mihinkään ite. jos joku tietää jotain niin
      kertokaa vittu
    effects: { trust_noora: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Noora -> noora_talk_early

  noora_talk_early:
    type: message
    text: >
      NOORA: kuka sä oot? uus täällä? no tervetuloa helvettiin.
      siis elias on niinku paras aikuinen tässä kylässä. se opetti
      meille eräjuttuja, kalastusta, kuvaamista. se välitti oikeesti.

      ja nyt mä oon ihan flippaa koska veeti näki jotain outoa sinä
      iltana mutta se ei suostu puhuu siitä. se sanoo et se ei oo
      mitään mutta siis... kyllä se on jotain vittu
    effects: { trust_noora: "+10" }
    choices:
      - What did Veeti see? -> noora_veeti_hint
      - Move on -> quest1_hub

  noora_veeti_hint:
    type: message
    text: >
      NOORA: en mä tiiä tarkkaan. se oli kelkkailemassa illalla ja
      näki jonkun eliaksen mökillä. tai niinku eliaksen pihalla.
      joku nainen. veeti flippaili siitä mutta ei haluu puhuu
      tuntemattomille. yritä jutella sille ensin kelkkailusta tai
      metsäjutuista niin se ehkä avautuu haha
    effects: { trust_noora: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Kuusijärvi. A remote Kainuu village
      built around a pristine lake. A wilderness guide who was exposing
      mining pollution. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Sanna (Elias's sister) -> sanna_q1
      - Talk to Mikko (Elias's best friend) -> mikko_q1
      - Check what Henna (Elias's ex) is saying -> henna_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Sanna Q1 ---

  sanna_q1:
    type: tweet
    from: sanna
    text: >
      jos kellään on tietoa @elias_korhonen soittakaa mulle heti.
      sen sukelluskamppeet on mökillä. reppu on siellä. se ei olis
      ikinä lähteny ilman varusteita.
    effects: { trust_sanna: "+5", contacts_followed: "+1" }
    choices:
      - DM Sanna -> sanna_q1_talk

  sanna_q1_talk:
    type: message
    text: >
      SANNA: Kiitos et otat yhteyttä mutta mä en tunne sua. Eliaksella
      on paljon kavereita täällä. Se tulee varmaan takas.

      ...mä jatkan sanomista niin. En enää usko siihen.

      [Sanna is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_sanna: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mikko Q1 ---

  mikko_q1:
    type: tweet
    from: mikko
    text: >
      mun paras kaveri on KADONNU ja poliisi sanoo et se on ehkä
      vaeltamassa?? ELIAS EI LÄHDE VAELTAMAAN SANOMATTA MULLE.
      perkele. joku tietää jotain.
    effects: { trust_mikko: "+5", contacts_followed: "+1" }
    choices:
      - DM Mikko -> mikko_q1_talk

  mikko_q1_talk:
    type: message
    text: >
      MIKKO: Kuka vittu sä oot? Taas joku joka tulee kertomaan et
      pitää rauhoittua? Elias soitti mulle sinä iltana. Se sano et
      sillä on jotain isoa. Se sano "jos mulle tapahtuu jotain, kato
      NorthRockia." Sit se sulki puhelimen.

      Se on viimenen mitä mä kuulin siltä.
    effects: { trust_mikko: "+10" }
    choices:
      - What do you think happened? -> mikko_theory
      - Move on -> quest1_hub

  mikko_theory:
    type: message
    text: >
      MIKKO: Mä luulen et Elias löysi todisteita et NorthRock pilaa
      järven ja ne hiljensi sen. Mutta mä luulen kans et se Jenni
      Aaltonen — se retkeilyopas Oulusta — tietää enemmän ku se sanoo.
      Se seuraa Eliasta kaikkialle. Millon vaan mä tulin Eliaksen
      luo, Jenni oli jo siellä. Tai just lähteny.

      Elias sano mulle kuukausia sitten et joku käy sen mökillä ku
      se ei oo kotona. Tavaroita oli siirrelty. Kamera oli eri
      paikassa. Se luuli et se kuvittelee. Mä en luule et se kuvitteli.
    effects: { trust_mikko: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Henna Q1 ---

  henna_q1:
    type: tweet
    from: henna
    text: >
      @elias_korhonen ei oo vastannu viesteihin kuuteen päivään.
      me erottiin mutta oltiin silti kavereita. eliaksen kuvat on
      maailman parhaita. kukaan ei tunne tätä erämaat niinku se.
      pliis kerro jotain.
    effects: { trust_henna: "+5", contacts_followed: "+1" }
    choices:
      - DM Henna -> henna_q1_talk

  henna_q1_talk:
    type: message
    text: >
      HENNA: Me oltiin Eliaksen kanssa yhdessä kaks vuotta. Erottiin
      kavereina — me molemmat ollaan liian itsenäisiä suhteeseen. Mutta
      me pidettiin yhteyttä. Kuvattiin yhdessä. Hän oli mulle tärkee.

      Ja nyt tää Jenni... se ilmesty viime keväänä ja alkoi seurata
      Eliasta kaikkialle. Elias sano mulle et se tuntuu ahdistavalta.
      Se sano "se nainen tietää missä mä oon ennen ku mä ite tiiän."

      Mä sanoin et puhu poliisille. Se sano et ei oo mitään konkreettista.
      Nyt mä kadun etten painostanu enemmän.
    effects: { trust_henna: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Elias went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Veeti (was out snowmobiling that evening) -> veeti_interview
      - Find Tapani (fisherman, was on the lake at night) -> tapani_interview
      - Find Pekka (hunter, early morning in the forest) -> pekka_interview
      - Find Marjatta (community chair, heard a car) -> marjatta_interview

  # --- Veeti (saw someone at Elias's cabin) ---

  veeti_interview:
    type: tweet
    from: veeti
    text: >
      kelkkailin eilen illalla ja metsässä oli outoo liikettä. en
      tiiä miten selittää. joku ei kuulu sinne.
    effects: { trust_veeti: "+5" }
    choices:
      - Ask Veeti about that evening -> veeti_talk

  veeti_talk:
    type: message
    text: >
      VEETI: okei mut sä et kerro tätä kellekään. mä olin
      kelkkailemassa noin seitsemän aikaan illalla ja ajoin eliaksen
      mökin ohi. ja mä näin sen — jenni aaltosen — eliaksen pihalla.
      se teki jotain eliaksen autolla. niinku kumartu sen alle tai
      jotain.

      ku se näki mut se lähti vitun nopeesti. mä en sanonu mitään
      koska eihän kukaan usko teiniä joka syyttää aikuista. perkele.
      oisin pitäny sanoa.
    effects:
      trust_veeti: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
