      - Confront Jenni Aaltonen (the obsessive stalker) -> confront_jenni
        when:
          state: obsession_evidence
          gte: 5
      - Confront Tuomas Lehtonen (the project manager) -> confront_tuomas
        when:
          state: mining_evidence
          gte: 3
      - Confront Juhani Mäkelä (political protection) -> confront_juhani
      - I need more evidence -> investigation_hub

  # --- ENDING A: Jenni (Best Ending) ---

  confront_jenni:
    type: message
    text: >
      You present your evidence to Jenni:

      "I know @varjo_vaeltaja is your account. I know you put a GPS
      tracker on Elias's car. I know you entered his cabin when he
      wasn't home. I know you watched him from the road. I have
      witnesses and I have the access patterns."
    choices:
      - Send -> jenni_response

  jenni_response:
    type: message
    text: >
      Jenni doesn't reply for a long time. Then:

      JENNI: Sä et ymmärrä. Mä suojelin sitä. Se oli vaarassa
      kaivosyhtiön takia ja se ei antanu mun auttaa. Mun piti tietää
      et se on turvassa. Kaikki mitä mä tein oli koska mä välitän
      siitä.

      Se ei oo välittämistä. Se on pakkomielle.

      You've already sent the evidence to Ylikonstaapeli Kivinen.
      And to Antti Rautio.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Ylikonstaapeli Kivinen reopens the case. With your evidence —
      the anonymous account, the GPS tracker, the cabin intrusions,
      the witness testimonies — Jenni is arrested for stalking and
      harassment. A GPS tracker is recovered from under Elias's car
      at the old wilderness cabin in Petäjävaara.

      Antti Rautio, finally in possession of Elias's full evidence
      package, publishes the NorthRock story in Helsingin Sanomat.
      The ELY-keskus orders an unannounced inspection. The drilling
      operation is shut down pending environmental remediation.
      Tuomas Lehtonen faces criminal charges for falsifying
      environmental reports.

      And Elias Korhonen, reading the story from a friend's cabin
      in Suomussalmi, calls his sister for the first time in nine
      days.

      "Mä tuun kotiin."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: elias
    text: >
      luonto ei valehtele. eikä kuusijärven ihmiset. kiitos et ette
      antanu periksi.
    choices:
      - The End -> game_complete

  # --- ENDING B: Tuomas (Partial Ending) ---

  confront_tuomas:
    type: message
    text: >
      You present the mining evidence to Tuomas Lehtonen:

      "I have photographs of the failed borehole casing. I have water
      samples showing heavy metal levels ten times the legal limit.
      I have your original drilling reports showing the data was
      falsified. I have the waste containers with your batch numbers."
    choices:
      - Send -> tuomas_response

  tuomas_response:
    type: message
    text: >
      TUOMAS: Tämä keskustelu ohjataan lakiosastollemme. NorthRock
      Mining Oy on aina toiminut ympäristölupien mukaisesti.
      Kunnianloukkausmateriaalin levittäminen johtaa välittömiin
      oikeustoimiin.

      But it's too late. You've sent the evidence to Antti, to
      the Luonnonsuojeluyhdistys, and to the ELY-keskus.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The mining story breaks. NorthRock is ordered to halt drilling
      pending investigation. The mine project may be cancelled. Two
      hundred promised jobs evaporate. The village is divided.

      But Elias?

      Without the stalking evidence, Jenni is never investigated.
      She continues to hike the same trails. She continues to
      monitor his accounts. She creates a new anonymous profile.

      Three months later, Elias reads about NorthRock online.
      He returns quietly. He changes his routes. He stops guiding
      alone. He checks his car every morning.

      The corporation is exposed. But the person who terrorised
      Elias walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: elias
    text: "mä oon takas. vesi on puhtaampaa. muu... katotaan."
    choices:
      - The End -> game_complete

  # --- ENDING C: Juhani (Wrong Ending) ---

  confront_juhani:
    type: message
    text: >
      You confront Kunnanjohtaja Mäkelä with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> juhani_response

  juhani_response:
    type: tweet
    from: lakimies
    text: >
      Asiakkaamme on vastaanottanut väitteenne. Kunnianloukkaus-
      materiaalin julkinen levittäminen johtaa välittömiin oikeus-
      toimiin. — Asianajotoimisto Järvinen & Co, Helsinki
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The municipal manager's lawyers bury your accusation. Without
      a direct link between Mäkelä and NorthRock's contamination —
      and there isn't one beyond political protection — your evidence
      is insufficient.

      NorthRock continues to drill. Jenni continues to watch. Elias
      stays in hiding.

      Six months later, @varjo_vaeltaja creates a new account. It
      follows Elias's sister.
    choices:
      - The End -> game_complete

