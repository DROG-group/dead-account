    text: >
      LÁSZLÓ: Réka hagyott nálam valamit. Egy lezárt vízálló dobozt.
      Azt mondta, "ha valaki kérdezi, mi van az Öreg-foknál a víz
      alatt, add oda."

      Ijedt volt. Azt mondta, mindenről csinált másolatot, de kell egy
      készlet külső helyen, ahol senki nem gondolná. Egy könyvtár
      tökéletes.
    effects: { trust_laszlo: "+10" }
    choices:
      - What's under the water at Öreg-fok? -> laszlo_case

  laszlo_case:
    type: message
    text: >
      László lenyúl a pult alá és előhúz egy vízálló Pelican dobozt.

      LÁSZLÓ: Mondta, hogy jössz. Vidd.

      Inside: a USB drive and a set of printed photographs. The photos
      show an underwater concrete structure — not the official water
      management channel, but a second, hidden dam diverting flow away
      from the floodplains. The USB drive contains water level data,
      ecological surveys, and Réka's detailed report with woven pattern
      illustrations showing water flow changes.
    effects:
      damming_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Hadnagy Király ---

  hadnagy_interview:
    type: message
    text: >
      HADNAGY KIRÁLY: Nem hivatalosan — és ez teljesen nem hivatalos —
      nyomozni akartam a DunaCorp ellen. A felettesem megállított.
      Azt mondta, a vízügy "illetékes." Ez annyit jelent: ne nyúlj
      hozzá.

      A Katalin-ügyről nem is tudtam eddig. Ha van bizonyítékod
      zaklatásra, azzal foglalkozni tudok. Az egyértelműen az én
      hatásköröm.

      Hozz nekem valami szilárd bizonyítékot és újranyitom az ügyet.
    effects:
      trust_hadnagy: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened to
      Réka than anyone in Tiszavirág. Who is responsible?
    choices:
      - Confront Katalin Fekete (the obsessive mentor) -> confront_katalin
        when:
          state: obsession_evidence
          gte: 5
      - Confront Pál Szűcs (the site director) -> confront_pal
        when:
          state: damming_evidence
          gte: 3
      - Confront Mayor Varga (political protection) -> confront_istvan
      - I need more evidence -> investigation_hub

  # --- ENDING A: Katalin (Best Ending) ---

  confront_katalin:
    type: message
    text: >
      You present your evidence to Katalin:

      "I know @orsi_farkas is your account. I know you put a hidden
      camera in Réka's workshop. I know you went through her files
      at the workshop. I know you were watching the building at night.
      I have witnesses and I have the access records."
    choices:
      - Send -> katalin_response

  katalin_response:
    type: message
    text: >
      Katalin doesn't reply for a long time. Then:

      KATALIN: Nem érted. Védtem őt. A DunaCorp veszélyeztette és nem
      engedett segíteni. Tudnom kellett, hogy biztonságban van. Mindent
      azért tettem, mert törődöm vele. Ő a tanítványom. Ő a legjobb.

      That's not care. That's obsession.

      You've already sent the evidence to Hadnagy Király. And to
      Nóra Balogh.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Hadnagy Király reopens the case. With your evidence — the
      anonymous account, the hidden camera, the access records, the
      witness testimonies — Katalin is arrested for stalking and
      harassment. A hidden camera is recovered from Réka's loom at
      the workshop.

      Nóra Balogh, finally in possession of Réka's full evidence
      package, publishes the DunaCorp story in HVG. The vízügy orders
      an unannounced inspection. The illegal dam is ordered demolished
      pending environmental remediation. Pál Szűcs faces criminal
      charges for falsifying water management reports and illegal
      construction.

      And Réka Szabó, reading the story from a friend's house in
      Szeged, calls her brother for the first time in nine days.

      "Hazamegyek."

      If you or someone you know is experiencing stalking or harassment,
      help is available:
      NANE Segélyvonal (nők elleni erőszak): 06-80-505-101 (ingyenes)
      Kék Vonal (gyerekek, fiatalok): 116 111
      Környezetvédelmi bejelentés: 06-80-201-301
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: reka
    text: >
      a szál nem hazudik. és tiszavirág emberei sem. köszi, hogy nem
      adtátok fel.
    choices:
      - The End -> game_complete

  # --- ENDING B: Pál (Partial Ending) ---

  confront_pal:
    type: message
    text: >
      You present the damming evidence to Pál Szűcs:

      "I have photographs of the undeclared dam construction. I have
      water level measurements proving illegal diversion. I have your
      original reports showing the data was falsified. I have the
      concrete fragments with your batch numbers."
    choices:
      - Send -> pal_response

  pal_response:
    type: message
    text: >
      PÁL: Ezt a beszélgetést továbbítom a jogi osztályunknak. Bármilyen
      rágalmazó anyag közzététele azonnali jogi eljárást von maga után.
      A DunaCorp mindig a jogszabályi előírásoknak megfelelően működött.

      But it's too late. You've sent the evidence to Nóra, to the
      Tiszaőrök, and to the vízügy.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The damming story breaks. DunaCorp is ordered to halt construction
      pending investigation. The illegal dam may be demolished. Two
      hundred jobs hang in the balance. The village is divided.

      But Réka?

      Without the stalking evidence, Katalin is never investigated. She
      continues to visit the workshop. She continues to monitor Réka's
      accounts. She creates a new anonymous profile.

      Three months later, Réka reads about DunaCorp online. She returns
      quietly. She changes workshops. She stops working alone at night.
      She checks her loom every morning for cameras.

      The corporation is exposed. But the person who terrorised Réka
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: reka
    text: "hazajöttem. a folyó szabadabb. a többi... majd meglátjuk."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_istvan:
    type: message
    text: >
      You confront Mayor Varga with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> istvan_response

  istvan_response:
    type: tweet
    from: jozsef
    text: >
      Ügyfelünk tudomásul veszi az Ön állításait. Bármilyen rágalmazó
      tartalom közzététele azonnali jogi eljárást von maga után.
      — Bodnár & Társai Iroda, Budapest
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct link
      between Varga and DunaCorp's damming — and there isn't one
      beyond political protection — your evidence is insufficient.

      DunaCorp continues to operate. Katalin continues to watch.
      Réka stays in hiding.

      Six months later, @orsi_farkas creates a new account. It follows
      Réka's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: TISZAVIRÁG — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Damming evidence: ${damming_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Réka's story explores themes of corporate
      impunity, environmental destruction, obsessive behaviour, rural
      community solidarity, and the courage to speak up.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      NANE Segélyvonal (nők elleni erőszak): 06-80-505-101 (ingyenes)
      Kék Vonal (gyerekek, fiatalok): 116 111
      Környezetvédelmi bejelentés: 06-80-201-301
