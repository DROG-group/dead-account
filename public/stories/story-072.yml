entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN TISZAVIRÁG
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Tiszavirag.social — the community Mastodon instance for
      the Tisza river village of Tiszavirág.

      The local feed is unsettled today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @reka_szabo.

      A weaver. Traditional Tisza patterns. She documented the old crafts
      and the river ecology. People are worried. She hasn't posted in
      six days.
    choices:
      - Look at her profile -> reka_profile

  reka_profile:
    type: tweet
    from: reka
    text: "A Tisza-parti réteket elárasztják. Valaki gátat épít az Öreg-foknál. Van bizonyítékom. Ez nem vízügy — ez üzlet."
    choices:
      - That's her last real post... -> grey_thread

  grey_thread:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photo of river reeds, overexposed, shot at a strange
      angle. Posted at 2am. No caption.

      Her friends say that's not her style. Réka always wrote long
      poetic captions about her weaving and the river. The police say
      she probably went to visit family. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: hadnagy
    text: >
      Bejelentés érkezett tiszavirági lakos eltűnéséről. Jelenlegi
      ismereteink szerint bűncselekmény gyanúja nem áll fenn. Minden
      hasznos információt a 107-es számon vagy az őrsön fogadunk.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @eszter_kis is
      desperate. Her brother @tamas_szabo is driving down from Debrecen.
      Her weaving master @katalin_fekete is posting worried messages.
      The fisherman @gabor_molnar says she was right about the water
      levels.

      And the journalist @nora_balogh is strangely silent.

      Nobody buys the police line. Nobody thinks Réka just "went to
      visit family."
    effects: { trust_eszter: "+5", trust_tamas: "+5" }
    choices:
      - Start following Réka's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Tiszavirág. Follow Réka's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Margit (csárda owner, knows everyone) -> margit_intro
      - Talk to Gábor (fisherman, saw the water change) -> gabor_intro
      - Talk to Petra (teen photographer, seems shaken) -> petra_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Réka with the rhythms of a small
      river village: water level reports, the bakery's lángos specials,
      fishing conditions, ferry schedules.

      Key names surface: Eszter (best friend, kindergarten teacher),
      Katalin (weaving master, rattled), Nóra (journalist, oddly quiet),
      and the teens — Petra, Zoltán, Virág — who adored Réka's craft
      and river photography.

      Also prominent: DunaCorp Kft., the water engineering company with
      a site at the edge of the village. Their posts are corporate PR.
      Réka's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Margit -> margit_intro
      - Talk to Gábor -> gabor_intro
      - Talk to Petra -> petra_intro

  # --- Margit (social map) ---

  margit_intro:
    type: tweet
    from: margit
    text: >
      Nyitva a csárda, de a szívem nehéz. @reka_szabo, a törzsasztalod
      vár. Gyere haza, kislányom.
    effects: { trust_margit: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Margit -> margit_talk

  margit_talk:
    type: message
    text: >
      MARGIT: Új vagy itt? Isten hozott. Szörnyű időben érkeztél.
      Mindenki kiakad Réka miatt.

      Hadd meséljek, ki kicsoda. Eszter a legjobb barátnője — együtt
      nőttek fel, mint két nővér. Katalin néni tanította szőni, az ő
      műhelyében dolgozott. Tamás a bátyja, Debrecenből jön le.

      És Nóra Balogh — az újságírónő — ő és Réka együtt dolgoztak
      valamin. A Tiszáról, a vízszintekről. Nóra egy szót sem szólt,
      mióta Réka eltűnt. Ez nem rá vall.

      Ja, és a DunaCorp-os PR posztokat felejtsd el. Hazugság az
      egész, ISO papírba csomagolva.
    effects: { trust_margit: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Katalin -> margit_katalin
      - Ask about DunaCorp -> margit_dunacorp
      - Thank her and move on -> quest1_hub

  margit_katalin:
    type: message
    text: >
      MARGIT: Katalin? Réka mestere volt. Ötven éve szövi a tiszai
      mintákat. Réka volt az egyetlen fiatal, aki megtanulta. De az
      utóbbi hónapokban Katalin furcsán viselkedett. Mindenhol ott volt,
      ahol Réka. A csárdában, a piacon, a folyóparton. Mindig fényképezte
      Rékát munka közben. Réka udvarias volt, de láttam rajta, hogy
      zavarja.

      Réka egyszer mondta nekem: "Katalin néni a szövést figyeli, nem
      engem." De nem hangzott úgy, mintha ő maga hinné.
    effects: { trust_margit: "+5" }
    choices:
      - Ask about DunaCorp -> margit_dunacorp
      - Move on -> quest1_hub

  margit_dunacorp:
    type: message
    text: >
      MARGIT: Az a cég két éve van itt. Vízügyi munkákat csinálnak,
      gátakat, csatornákat, nem tudom pontosan. A falu eltűrte, mert
      munkát adtak. De a halászok már régóta panaszkodnak — a víz
      szintje változik, a halak eltűnnek, a rétek kiszáradnak.

      Réka volt az első, aki kiment a fényképezőgépével és a
      mintavevőjével. Azt mondta, bizonyítéka van, hogy a DunaCorp
      illegálisan gátat épít, eltereli a vizet. Két héttel később
      eltűnt.
    effects: { trust_margit: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Gábor (the river, witness tease) ---

  gabor_intro:
    type: tweet
    from: gabor
    text: >
      harmincöt éve halászok ezen a folyón. a víz nem az, ami volt.
      @reka_szabo igazat mondott. és most eltűnt. gondolkodjatok el.
    effects: { trust_gabor: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Gábor -> gabor_talk

  gabor_talk:
    type: message
    text: >
      GÁBOR: Tizenöt éves korom óta halászok itt. Ismerem a Tisza
      minden áramlatát, minden színét. És mondom neked — a víz az
      Öreg-foknál nincs rendben. Hónapok óta. A hálóm üres, a
      halak eltűntek. A mederben valami megváltozott.

      Réka mintákat vett. Lemerült a fokhoz. Lefényképezett mindent.
      Ügyet épített. Aztán egyszer csak — nincs.

      Véletlennek gondolod? Én nem hiszek a véletlenekben, ha a
      Tiszáról van szó.
    effects: { trust_gabor: "+10" }
    choices:
      - Did you see anything unusual recently? -> gabor_night
      - Move on -> quest1_hub

  gabor_night:
    type: message
    text: >
      GÁBOR: Az éjjel, mielőtt eltűnt — éjszakai horgászatról jöttem
      haza, éjfél körül. Lámpákat láttam a műhely felé. Nem szokatlan,
      a szövők néha későn dolgoznak. De két kocsi állt a közelben. Az
      egyik Réka kis Suzukija. A másik egy fekete furgon DunaCorp
      matricával.

      Éjfélkor. A szövőműhely mellett.

      Akkor nem gondoltam bele. Most állandóan ezen gondolkodom.
    effects: { trust_gabor: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Petra (teen photographer, witness tease) ---

  petra_intro:
    type: tweet
    from: petra
    text: >
      a kurva életbe @reka_szabo ő tanított meg fotózni a folyóparton
      komolyan nem lehet h csak úgy eltűnt. ha vki tud vmit pls írjatok
    effects: { trust_petra: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Petra -> petra_talk_early

  petra_talk_early:
    type: message
    text: >
      PETRA: új vagy? bazmeg szar időben jöttél ide. amúgy réka a
      legjobb ember ezen a falun. ő tanította meg a tinédzsereket
      fotózni, szőni, tisztelni a folyót. geci cool volt.

      és most kiakadok mert zoli látott vmi furát a kompnál de nem
      akar beszélni róla. mondja h semmi de nem semmi bazmeg
    effects: { trust_petra: "+10" }
    choices:
      - What did Zoltán see? -> petra_zoltan_hint
      - Move on -> quest1_hub

  petra_zoltan_hint:
    type: message
    text: >
      PETRA: nem tudom pontosan. horgászott az estében a kompnál és
      látott valakit aki a réka műhelyében szarakodott. vagy a
      kocsijánál. baszd meg nem tudom. zoli fél, nem akar beszélni.
      kérdezd meg direktbe de előbb beszélj horgászatról vele mert
      gyanakszik az ismeretlenekre lol
    effects: { trust_petra: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Tiszavirág. A small Tisza river village
      built around the water and old crafts. A weaver who was exposing
      illegal river damming. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Eszter (Réka's best friend) -> eszter_q1
      - Talk to Katalin (Réka's weaving master) -> katalin_q1
      - Check what Tamás (Réka's brother) is saying -> tamas_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Eszter Q1 ---

  eszter_q1:
    type: tweet
    from: eszter
    text: >
      ha valaki tud bármit @reka_szabo-ról, hívjatok kérlek. a szobája
      érintetlen. a szövőszéke ott áll. soha nem hagyta volna ott a
      munkát befejezés nélkül.
    effects: { trust_eszter: "+5", contacts_followed: "+1" }
    choices:
      - DM Eszter -> eszter_q1_talk

  eszter_q1_talk:
    type: message
    text: >
      ESZTER: Köszi, hogy írsz, de nem ismerlek. Rékának sok barátja
      van itt. Biztos vagyok benne, hogy visszajön.

      ...ezt mondom mindenkinek. Magamnak már nem hiszem el.

      [Eszter óvatos. Több bizalomra lesz szükség, mielőtt megnyílik.]
    effects: { trust_eszter: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Katalin Q1 ---

  katalin_q1:
    type: tweet
    from: katalin
    text: >
      A műhely üres @reka_szabo nélkül. A szövőszéken félig kész a
      minta. A fonalai az asztalon. Soha nem hagyta volna abba a
      munkát félúton. Valami történt.
    effects: { trust_katalin: "+5", contacts_followed: "+1" }
    choices:
      - DM Katalin -> katalin_q1_talk

  katalin_q1_talk:
    type: message
    text: >
      KATALIN: Réka a legjobb tanítványom volt. Öt éve tanítom szőni.
      Egyedülálló tehetség. Ez a szennyezés-vizsgálat — mindent beleadott.
      Fotókat, mintákat, elemzéseket készített. Közel járt ahhoz, hogy
      nyilvánosságra hozza.

      Felajánlottam a segítségemet. Többször is. Azt mondta, kézben
      tartja. Azt mondta, egy újságíróval dolgozik. Én csak támogatni
      akartam.

      [Katalin őszintének tűnik. Vagy megszállottnak?]
    effects: { trust_katalin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tamás Q1 ---

  tamas_q1:
    type: tweet
    from: tamas
    text: >
      A HÚGOM ELTŰNT és a rendőrség azt mondja talán elment a
      rokonokhoz??? NEM MEGY EL SZÓLÁS NÉLKÜL. debrecenből megyek.
      valaki el fogja mondani mi történt.
    effects: { trust_tamas: "+5", contacts_followed: "+1" }
    choices:
      - DM Tamás -> tamas_q1_talk

  tamas_q1_talk:
    type: message
    text: >
      TAMÁS: Ki vagy te? Még egy ember abból a faluból, aki azt mondja
      nyugodjak le? A húgom hívott az éjjel, mielőtt eltűnt. Azt mondta,
      van valami nagy dolog. Azt mondta, "ha bármi történik, nézd meg
      a DunaCorp-ot." Aztán letette.

      Ez az utolsó, amit hallottam tőle.
    effects: { trust_tamas: "+10" }
    choices:
      - What do you think happened? -> tamas_theory
      - Move on -> quest1_hub

  tamas_theory:
    type: message
    text: >
      TAMÁS: Szerintem kiderítette, hogy a DunaCorp illegálisan gátol
      és eltüntették a bizonyítékait. De az is lehet, hogy az a fura
      szövőmester — Katalin — többet tud, mint amennyit mond. Ahogy
      Rékáról beszél... az nem csak szakmai aggódás. Az valami más.

      Réka hónapokkal ezelőtt mondta, hogy valaki járkál a műhely
      körül éjszaka. Fényképezi őt. Azt hitte, semmiség. Szerintem
      nem semmiség.
    effects: { trust_tamas: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Réka went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Zoltán (was fishing at sunset near the ferry) -> zoltan_interview
      - Find Béla (ferryman, works late) -> bela_interview
      - Find Gábor (fisherman, early morning on the river) -> gabor_interview
      - Find Dóra (baker, starts at 4am, saw something) -> dora_interview

  # --- Zoltán (saw someone at Réka's workshop) ---

  zoltan_interview:
    type: tweet
    from: zoltan
    text: >
      jó session volt az estés horgászat de a kompnál fura a hangulat
      mostanában. vmi nem stimmel. nem tudom megmagyarázni
    effects: { trust_zoltan: "+5" }
    choices:
      - Ask Zoltán about that evening -> zoltan_talk

  zoltan_talk:
    type: message
    text: >
      ZOLTÁN: faszom oké de ne mondd el senkinek. a kompnál voltam
      este hét körül, horgásztam. és láttam katalin nénit réka
      műhelyénél. kurvára furcsa volt, bent volt egyedül, az asztalnál
      babrált. mikor meglátott engem, rohant ki mint akit kergetnek.

