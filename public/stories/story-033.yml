entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PONTA DO FALCÃO
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to pontadofalcao.social — the community Mastodon instance
      for the clifftop village of Ponta do Falcão, Algarve.

      It's summer. The cliffs glow orange at sunset. The surf should
      be perfect. But the local feed is anything but calm.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name keeps coming back:
      @goncalo_ferreira.

      A 23-year-old surf instructor. The village's favourite son.
      He hasn't posted in seven days. His phone is off. His board
      is still at the surf school. His wetsuit is hanging to dry.
    choices:
      - Look at his profile -> goncalo_profile

  goncalo_profile:
    type: tweet
    from: goncalo
    text: "as máquinas da golden cliff estão a destruir a falésia protegida. zona ICNF. tenho vídeos. isto tem de parar. foda-se."
    choices:
      - That's his last real post... -> grey_wave

  grey_wave:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a grey wave. Murky, shot from a strange angle against the
      cliffs. Posted at 3am. No caption.

      His friends say Gonçalo always writes something. A joke, a
      line about the ocean. Never just an image. The GNR says he
      probably went travelling. The whole village knows that's
      bullshit.
    choices:
      - Read the GNR statement -> gnr_statement
      - Look at what people are saying -> community_reaction

  gnr_statement:
    type: tweet
    from: sargento
    text: >
      A GNR recebeu uma comunicação relativa a um residente de
      Ponta do Falcão. Nesta fase, não existem indícios de prática
      criminosa. Qualquer informação relevante pode ser comunicada
      ao posto territorial ou através do 112.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @ines_ferreira is driving
      down from Faro. His best friend @tiago_oliveira is losing it.
      His surf students — @diogo, @leonor, @filipa — are posting
      panicked messages.

      The fisherman @andre_baptista says Gonçalo was right about the
      cliffs. The journalist @catarina_lopes is asking why the câmara
      approved Golden Cliff's construction permit.

      And @rafael_werner — a German tourist who kept coming back for
      Gonçalo's lessons — has gone very quiet.
    effects: { trust_ines: "+5", trust_tiago: "+5" }
    choices:
      - Start following Gonçalo's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Ponta do Falcão. Follow Gonçalo's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to João (tasca owner, knows everyone) -> joao_intro
      - Talk to André (fisherman, knows the coast) -> andre_intro
      - Talk to Diogo (teen surfer, clearly shaken) -> diogo_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Gonçalo with the rhythms of an
      Algarve village: surf conditions, fish market times, the
      tasca's daily specials, sunset photos from the cliffs.

      Key names surface: Inês (sister, marine biologist in Faro),
      Tiago (best friend, fisherman, furious), Rafael (German tourist,
      suspiciously present), and the teens — Diogo, Leonor, Filipa
      — who lived for Gonçalo's surf lessons.

      Also prominent: Golden Cliff Resorts SA, the luxury hotel
      company building on the protected cliffs east of the village.
      Their posts are glossy PR. Gonçalo's posts were dynamite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to João -> joao_intro
      - Talk to André -> andre_intro
      - Talk to Diogo -> diogo_intro

  # --- João (social map) ---

  joao_intro:
    type: tweet
    from: joao
    text: >
      a tasca está aberta mas falta aqui alguém. @goncalo_ferreira,
      a tua imperial está à espera. volta pá.
    effects: { trust_joao: "+5", contacts_followed: "+1" }
    choices:
      - Reply to João -> joao_talk

  joao_talk:
    type: message
    text: >
      JOÃO: Ah, és novo por aqui? Bem-vindo. Má altura para chegar,
      isso é. A aldeia toda está às avessas por causa do Gonçalo.

      Olha, vou-te explicar quem é quem. A Inês é a irmã dele,
      bióloga marinha em Faro. Miúda espetacular, está destroçada.
      O Tiago é o melhor amigo, desde putos. Pescador. Está a ficar
      maluco com isto.

      A Mariana trabalha com ele na escola de surf. A Beatriz é a
      dona. E depois tens aquele alemão — Rafael. Werner ou lá o que
      é. Vem cá todos os verões. Aulas com o Gonçalo. Mas ya, aquilo
      não é só aulas. Aquele gajo é bué estranho. Sempre atrás do
      Gonçalo. Sempre.

      E a Golden Cliff? Caralho, nem me fales nisso. Estão a
      destruir a falésia protegida para fazer um resort de luxo. O
      Gonçalo era o único que tinha tomates para denunciar aquilo.
    effects: { trust_joao: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Rafael -> joao_rafael
      - Ask about Golden Cliff -> joao_golden_cliff
      - Thank him and move on -> quest1_hub

  joao_rafael:
    type: message
    text: >
      JOÃO: O Rafael? Olha, aquele gajo vem cá há três verões. No
      início parecia normal — turista, quer aprender surf, fixe.
      Mas depois começou a ficar o verão todo. Depois voltava no
      inverno. Marcava aulas só com o Gonçalo. Recusava outros
      instrutores.

      Começou a aparecer na tasca quando o Gonçalo cá estava. Sentava-
      se perto. Ficava a olhar. O Gonçalo é um puto simpático, não diz
      nada. Mas eu vi que ele ficava desconfortável.

      A última vez que o Rafael esteve cá, fez uma cena porque o
      Gonçalo cancelou uma aula. Ficou vermelho, começou a gritar que
      ele tinha prometido. O Gonçalo foi-se embora. O Rafael ficou na
      tasca duas horas a beber sozinho.

      Bué creepy. Sws.
    effects: { trust_joao: "+5" }
    choices:
      - Ask about Golden Cliff -> joao_golden_cliff
      - Move on -> quest1_hub

  joao_golden_cliff:
    type: message
    text: >
      JOÃO: A Golden Cliff Resorts comprou terreno a leste da aldeia.
      Zona protegida pelo ICNF. Falésias. Habitat natural. Nidificação
      de aves. E agora estão lá com máquinas a escavar.

      O problema é que a câmara aprovou o projeto. O Carlos Machado —
      vereador do urbanismo — assinou aquilo tudo. E a Golden Cliff
      patrocina metade das festas da aldeia. O torneio de surf. O
      festival de verão. Tudo.

      O Gonçalo filmou as obras. Pôs online. Mostrou que estavam a
      escavar dentro da zona protegida. Duas semanas depois, desapareceu.

      Foda-se, faz as contas.
    effects: { trust_joao: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- André (fisherman, the coast) ---

  andre_intro:
    type: tweet
    from: andre
    text: >
      trinta e cinco anos no mar. esta costa está a mudar. as
      falésias estão a cair. @goncalo_ferreira tinha razão. e agora
      desapareceu. coincidência? puta que pariu.
    effects: { trust_andre: "+5", contacts_followed: "+1" }
    choices:
      - Reply to André -> andre_talk

  andre_talk:
    type: message
    text: >
      ANDRÉ: Eu pesco nesta costa desde miúdo. Conheço cada rocha,
      cada corrente, cada recanto das falésias. E digo-te: o que a
      Golden Cliff está a fazer é criminoso.

      Estão a escavar a base das falésias. A rocha está a ceder. Já
      houve dois desabamentos este ano. A praia onde o Gonçalo dava
      aulas está a ficar mais estreita. As ondas batem mais perto.

      O Gonçalo mergulhou lá. Filmou debaixo de água. Mostrou que as
      fundações do resort estão a drenar a rocha. A falésia está a
      colapsar. E eles continuam a construir.

      Queres saber quem tem medo da verdade? Quem mandou calar o
      Gonçalo.
    effects: { trust_andre: "+10" }
    choices:
      - Did you see anything unusual recently? -> andre_night
      - Move on -> quest1_hub

  andre_night:
    type: message
    text: >
      ANDRÉ: A noite antes de ele desaparecer. Eu estava a voltar da
      pesca, por volta da uma da manhã. Vi uma carrinha da Golden
      Cliff no caminho das falésias. Sem luzes. À uma da manhã.

      E vi uma figura no trilho da costa. A correr. Parecia o
      Gonçalo — mesma altura, mesmo cabelo. Mas estava escuro, não
      tenho a certeza.

      Disse à GNR. Escreveram num papel. Pronto. Mais nada.
    effects: { trust_andre: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Diogo (teen surfer, witness tease) ---

  diogo_intro:
    type: tweet
    from: diogo
    text: >
      o gonçalo ensinou-me a surfar. ensinou-me a respeitar o mar.
      era bué fixe. não acredito que foi embora. foda-se se alguém
      sabe de alguma cena diga please
    effects: { trust_diogo: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Diogo -> diogo_talk_early

  diogo_talk_early:
    type: message
    text: >
      DIOGO: ya quem és? ok whatever. olha o gonçalo é a melhor
      pessoa desta aldeia. dava-nos aulas de borla ao fim de semana.
      ensinava os miúdos todos. nunca recusava ninguém.

      e agora desapareceu?? isso não faz sentido nenhum. ele nunca
      faltava a uma aula. NUNCA. e o campeonato é para a semana.

      e sabes o que é bué creepy? aquele alemão — o rafael — apareceu
      na praia ontem. sem o gonçalo. estava lá sentado a olhar para o
      mar. sozinho. durante horas. a leonor viu e tirou foto.
    effects: { trust_diogo: "+10" }
    choices:
      - What else do you know about Rafael? -> diogo_rafael_hint
      - Move on -> quest1_hub

  diogo_rafael_hint:
    type: message
    text: >
      DIOGO: aquele gajo é bué estranho mano. está sempre atrás do
      gonçalo. uma vez vi-o a seguir o gonçalo depois da aula. tipo
      no carro. o gonçalo foi de mota para casa e o rafael foi atrás
      de carro.

      e na outra semana a filipa disse que viu o rafael à noite perto
      da casa do gonçalo. tipo sentado no carro. luzes apagadas.
      merda, isso é creepy ya.

      fala com a filipa. ela sabe mais.
    effects: { trust_diogo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Ponta do Falcão. An Algarve clifftop
      village built around the ocean. A surf instructor who was
      exposing illegal construction. A disappearance nobody believes
      is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Inês (Gonçalo's sister) -> ines_q1
      - Talk to Tiago (Gonçalo's best friend) -> tiago_q1
      - Check what Rafael (the tourist) is posting -> rafael_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Inês Q1 ---

  ines_q1:
    type: tweet
    from: ines
    text: >
      se alguém tem informação sobre o @goncalo_ferreira LIGUEM-ME.
      o quarto dele está igual. a prancha está na escola. o meu irmão
      não vai a lado nenhum sem a prancha. NUNCA.
    effects: { trust_ines: "+5", contacts_followed: "+1" }
    choices:
      - DM Inês -> ines_q1_talk

  ines_q1_talk:
    type: message
    text: >
      INÊS: Quem és tu? Desculpa, eu... não confio em ninguém agora.
      O Gonçalo ligava-me todos os dias. Todos. E de repente parou.

      A GNR diz que se calhar foi viajar. O meu irmão nunca saiu de
      Ponta do Falcão na vida. Aquele rapaz vive para o mar.

      [A Inês está desconfiada. Precisas de construir mais confiança
      antes de ela se abrir.]
    effects: { trust_ines: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tiago Q1 ---

  tiago_q1:
    type: tweet
    from: tiago
    text: >
      eu juro que se alguém fez mal ao gonçalo eu descubro. a gnr
      não faz nada. a câmara não faz nada. caralho então faço eu.
    effects: { trust_tiago: "+5", contacts_followed: "+1" }
    choices:
      - DM Tiago -> tiago_q1_talk

  tiago_q1_talk:
    type: message
    text: >
      TIAGO: O Gonçalo é o meu melhor amigo. Desde putos. Aprendemos
      a nadar juntos na praia do Falcão.

      Ele ligou-me na noite antes de desaparecer. Estava tenso.
      Disse: "se me acontecer alguma coisa, olha para o estaleiro da
      Golden Cliff. Encontrei uma cena que eles não querem que
      ninguém saiba."

      Mais nada. Telefone desligado. Desapareceu.

      E aquele Rafael? Aquele klootz— desculpa, aquele gajo. Anda
      atrás do Gonçalo há meses. Toda a gente vê. O Gonçalo dizia
      que era só um turista chato. Mas não é só isso. É uma cena
      doentia.
    effects: { trust_tiago: "+10" }
    choices:
      - What do you think happened? -> tiago_theory
      - Move on -> quest1_hub

  tiago_theory:
    type: message
    text: >
      TIAGO: Duas hipóteses. Uma: a Golden Cliff mandou calá-lo. O
      Gonçalo tinha vídeos a mostrar que estavam a construir dentro
      da zona protegida do ICNF. Se aquilo fosse público, perdiam a
      licença. Milhões.

      Duas: o Rafael pirou de vez. Aquele gajo seguia o Gonçalo
      para todo o lado. Aparecia na praia, na tasca, no trilho das
      falésias. O Gonçalo contou-me que alguém lhe mexeu no cacifo
      da escola de surf. Quem faz uma cena dessas?

      Se calhar as duas coisas. Se calhar uma abriu a porta à outra.
    effects: { trust_tiago: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Rafael Q1 ---

  rafael_q1:
    type: tweet
    from: rafael
    text: >
      Amazing sunset at Ponta do Falcão. Missing my surf sessions.
      Hope to see @goncalo_ferreira back soon. Best instructor
      in the Algarve. 🌊
    effects: { trust_rafael: "+5", contacts_followed: "+1" }
    choices:
      - DM Rafael -> rafael_q1_talk

  rafael_q1_talk:
    type: message
    text: >
      RAFAEL: Gonçalo? Yes, very sad he's gone. But people need
      breaks sometimes, you know? The pressure of teaching, the
      environmental activism... it's a lot.

      I come here every year for surf lessons. He's the best
      instructor. I'm sure he'll be back. I'm waiting for him.

      [Rafael seems remarkably calm. Almost rehearsed.]
    effects: { trust_rafael: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Gonçalo went silent. Multiple
      people saw or heard things. Piece together the timeline from
      witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Filipa (was near Gonçalo's house that evening) -> filipa_interview
      - Find André (fisherman, was at sea) -> andre_interview
      - Find Duarte (photographer, was on the cliffs) -> duarte_interview
      - Find Rosa (pharmacist, got a late call) -> rosa_interview

  # --- Filipa (saw Rafael near Gonçalo's house) ---

  filipa_interview:
    type: tweet
    from: filipa
    text: >
      eu sei coisas que devia ter dito antes. mas tinha medo. agora
      já não tenho.
    effects: { trust_filipa: "+5" }
    choices:
      - DM Filipa -> filipa_talk

  filipa_talk:
    type: message
    text: >
      FILIPA: ok olha eu vou dizer. naquela noite eu estava a voltar
      da casa da leonor. passámos pela casa do gonçalo tipo às dez
      da noite. e sabes quem estava lá? o rafael. no carro dele.
      luzes apagadas. a olhar para a casa do gonçalo.

      eu e a leonor ficámos tipo merda, que é isto. ficámos a ver
      durante uns cinco minutos. ele não se mexeu. só estava lá
      sentado. a olhar.

      quando o gonçalo saiu de casa com uma mochila, o rafael ligou
      o carro e foi atrás dele. sem luzes. eu fiquei tipo puta que
      pariu isto é bué doentio.

      devia ter feito alguma coisa. merda.
    effects:
