# DEAD ACCOUNT — Story 033: Ponta do Falcão (Portugal 2)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-033.yml
#
# Player investigates the disappearance of young surf instructor
# Gonçalo Ferreira in the fictional Algarve clifftop village of
# Ponta do Falcão.

