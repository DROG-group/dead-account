    choices:
      - Confront Rafael Werner (the obsessive tourist) -> confront_rafael
        when:
          state: obsession_evidence
          gte: 5
      - Confront Miguel Esteves (the resort CEO) -> confront_miguel
        when:
          state: corporate_evidence
          gte: 3
      - Confront Vereador Carlos Machado (political protection) -> confront_carlos
      - I need more evidence -> investigation_hub

  # --- ENDING A: Rafael (Best Ending) ---

  confront_rafael:
    type: message
    text: >
      You present your evidence to Rafael:

      "I know @onda_eterna is your account. I know you parked outside
      Gonçalo's house for months. I know you followed him the night
      he disappeared. I know you went to the pharmacy at 2am with
      bloody knuckles. I have witnesses, booking records, and the
      anonymous posts."
    choices:
      - Send -> rafael_response

  rafael_response:
    type: message
    text: >
      Rafael doesn't reply for a long time. Then:

      RAFAEL: You don't understand. Gonçalo is special. He's not just
      an instructor. He understands the ocean like nobody else. I came
      back for him. I stayed for him. I just wanted to be close to
      him. To learn from him. To be part of his world.

      That night — I followed him to the cliffs. I saw those men
      threatening him. I tried to help. We fought. He ran. I don't
      know where. I swear.

      That's not appreciation. That's obsession.

      You've already sent the evidence to Sargento Almeida. And to
      Catarina Lopes.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Sargento Almeida reopens the case. With your evidence — the
      anonymous account, the booking pattern, the nightly surveillance,
      the pharmacy visit, the witness testimonies — Rafael is arrested
      for stalking and harassment. A GPS tracker is recovered from
      under Gonçalo's motorbike. Rafael's rental apartment contains
      hundreds of photographs of Gonçalo taken without his knowledge.

      Catarina Lopes, with Gonçalo's full evidence package, publishes
      the Golden Cliff story in the Barlavento and it gets picked up
      by Público and RTP. The ICNF orders an immediate halt to all
      construction. The APA opens a criminal investigation. Miguel
      Esteves faces charges for destruction of protected habitat.
      Vereador Carlos Machado demite-se.

      And Gonçalo Ferreira, reading the article from a friend's house
      in Tavira, calls his sister for the first time in ten days.

      "Vou para casa, Inês."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: goncalo
    text: >
      o mar não se vende. as falésias não se compram. e as pessoas
      de ponta do falcão não se calam. obrigado.
    choices:
      - The End -> game_complete

  # --- ENDING B: Miguel Esteves (Partial Ending) ---

  confront_miguel:
    type: message
    text: >
      You present the construction evidence to Miguel Esteves:

      "I have drone footage of construction inside the Rede Natura
      2000 zone. I have satellite images showing cliff erosion of
      three meters in six months. I have video of night construction.
      I have testimony from the ICNF and the assembleia municipal.
      I have the SOS Costa Algarvia's five-year dataset."
    choices:
      - Send -> miguel_response

  miguel_response:
    type: message
    text: >
      MIGUEL: Esta conversa está a ser reencaminhada para o nosso
      departamento jurídico. Qualquer publicação de material
      difamatório resultará em procedimento imediato. A Golden Cliff
      Resorts opera dentro de todos os enquadramentos legais.

      But it's too late. You've sent everything to Catarina, to SOS
      Costa Algarvia, and to the ICNF.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The construction story breaks. Golden Cliff Resorts is ordered
      to halt all operations. The resort may never be completed.
      Fifty local jobs disappear. The village is divided between those
      who wanted the resort's money and those who wanted the cliffs.

      But Gonçalo?

      Without the stalking evidence, Rafael is never investigated.
      He returns to Berlin. He creates a new Instagram account. He
      follows Gonçalo's surf school page. He books a flight back to
      Faro for the winter.

      Four months later, Gonçalo reads about Golden Cliff online. He
      comes home. He stops giving lessons after sunset. He changes
      the lock on his house. He never surfs alone anymore.

      The corporation is exposed. But the person who terrorised
      Gonçalo walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: goncalo
    text: "voltei. as falésias estão a salvo. o resto... logo se vê."
    choices:
      - The End -> game_complete

  # --- ENDING C: Vereador (Wrong Ending) ---

  confront_carlos:
    type: message
    text: >
      You confront Vereador Carlos Machado with your evidence.

      Within the hour, you receive a message from his lawyer:
    choices:
      - Read the response -> carlos_response

  carlos_response:
    type: tweet
    from: vera
    text: >
      O meu cliente toma nota das suas alegações. Qualquer difusão
      pública de declarações difamatórias será objeto de procedimento
      judicial imediato. — Escritório Magalhães & Associados, Lisboa
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The vereador's lawyer buries your accusation. Without a direct
      link between Machado and Golden Cliff's illegal construction —
      beyond political favouritism — your evidence isn't enough for
      criminal charges.

      Golden Cliff continues to build. Rafael continues to watch.
      Gonçalo stays in hiding.

      Six months later, @onda_eterna creates a new account. It
      follows Gonçalo's sister.
    choices:
      - The End -> game_complete

