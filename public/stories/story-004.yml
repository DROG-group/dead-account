# DEAD ACCOUNT — Story 004: Caleta del Faro (Spain)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-004.yml
#
# Player investigates the disappearance of flamenco teacher Carmen Ruiz
# in the fictional Andalusian coastal town of Caleta del Faro.

meta:
  title: "Dead Account — Caleta del Faro"
  state:
    # Trust levels per NPC (0-100)
    trust_lucia: 0
    trust_pablo: 0
    trust_dolores: 0
    trust_rafael: 0
    trust_alejandro: 0
    trust_ines: 0
    trust_mari: 0
    trust_pepe: 0
    trust_concepcion: 0
    trust_javier: 0
    trust_rocio: 0
    trust_antonio: 0
    trust_miguel: 0
    trust_pilar: 0
    trust_nuria: 0
    trust_alba: 0
    trust_dani: 0
    trust_zara: 0
    trust_sargento: 0
    trust_sombra: 0
    # Progress counters
    contacts_followed: 0
    night_witnesses: 0
    corruption_evidence: 0
    stalker_evidence: 0
    evidence_total: 0

  player:
    name: New Resident
    bio: "recién llegado a caleta del faro. descubriendo andalucía paso a paso"
