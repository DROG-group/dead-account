      avatar: avatars/carmen.jpg
    lucia:
      name: "Lucía Navarro"
      bio: "mejor amiga de carmen | fisioterapeuta | café con leche y olas | caleta del faro"
      avatar: avatars/lucia.jpg
    pablo:
      name: "Pablo Ruiz"
      bio: "hermano de carmen | mecánico en cádiz | si le ha pasado algo alguien lo va a pagar"
      avatar: avatars/pablo.jpg
    rocio:
      name: "Rocío Vega"
      bio: "guitarrista flamenca | acompaño a carmen desde los 15 | el arte es resistencia"
      avatar: avatars/rocio.jpg

    # === Local Government ===
    concepcion:
      name: "Concepción Márquez"
      bio: "Alcaldesa de Caleta del Faro | Transformando nuestro pueblo | #CaletaAvanza"
      avatar: avatars/concepcion.jpg
    javier:
      name: "Javier Ortega"
      bio: "Concejal de Cultura | Ayuntamiento de Caleta del Faro | patrimonio y tradición"
      avatar: avatars/javier.jpg
    ayuntamiento:
      name: "Ayuntamiento de Caleta del Faro"
      bio: "Cuenta oficial | Noticias municipales | Horarios: Lun-Vie 9h-14h"
      avatar: avatars/ayuntamiento.jpg

    # === Local Business & Community ===
    dolores:
      name: "Dolores Heredia"
      bio: "Bar La Peña | tapas | fino | cante jondo los viernes | desde 1978"
      avatar: avatars/dolores.jpg
    pepe:
      name: "Pepe Camacho"
      bio: "pescador | 45 años en la mar | esta costa es mi vida"
      avatar: avatars/pepe.jpg
    mari:
      name: "Mari Carmen Díaz"
      bio: "farmacéutica | Caleta del Faro | salud y consejo | guardia los domingos"
      avatar: avatars/mari.jpg
    antonio:
      name: "Antonio Reyes"
      bio: "panadería Reyes | pan cateto | tortas de aceite | desde las 4 de la mañana"
      avatar: avatars/antonio.jpg
    miguel:
      name: "Miguel Ángel Torres"
      bio: "librería El Faro | libros nuevos y usados | tertulias los miércoles"
      avatar: avatars/miguel.jpg

    # === Journalist ===
    pilar:
      name: "Pilar Mendoza"
      bio: "periodista independiente | medio ambiente y costa | contacto: pilar@mendoza-prensa.es"
      avatar: avatars/pilar.jpg

    # === Costa Dorada Resorts (corporate antagonist) ===
    costadorada:
      name: "Costa Dorada Resorts S.L."
      bio: "Turismo premium | Proyecto Caleta Beach Resort | Compromiso con el desarrollo sostenible"
      avatar: avatars/costadorada.jpg
    rafael:
      name: "Rafael Montero"
      bio: "director de desarrollo | Costa Dorada Resorts | turismo y territorio"
      avatar: avatars/rafael.jpg
    nuria:
      name: "Nuria Salazar"
      bio: "Abogada | Bufete Salazar & Vega | Derecho urbanístico | Sevilla"
      avatar: avatars/nuria.jpg

    # === Teens ===
    alba:
      name: "Alba"
      bio: "16 | baile y playa | caleta born | carmen es la reina tío"
      avatar: avatars/alba.jpg
    dani:
      name: "Dani"
      bio: "17 | skate & surf | atardeceres desde el faro | aquí no hay nada pero mola"
      avatar: avatars/dani.jpg
    zara:
      name: "Zara"
      bio: "15 | fotos & poesía | la costa en blanco y negro | carmen me enseñó a sentir"
      avatar: avatars/zara.jpg

    # === Media & Community ===
    actu_caleta:
      name: "Caleta Noticias"
      bio: "Noticias de Caleta del Faro y la costa | contacto: redaccion@caletanoticias.es"
      avatar: avatars/actu_caleta.jpg
    meteo_caleta:
      name: "Meteo Caleta"
      bio: "Previsiones y alertas | Estación automática | Actualización cada hora"
      avatar: avatars/meteo_caleta.jpg
    asso_costa:
      name: "Plataforma Salvemos la Costa"
      bio: "Protección del litoral | Contra la especulación urbanística | Voluntarios bienvenidos"
      avatar: avatars/asso_costa.jpg

    # === Suspicious / Other ===
    ines:
      name: "Inés Carrillo"
      bio: "relaciones públicas | Costa Dorada Resorts | hago mi trabajo y punto"
      avatar: avatars/ines.jpg
    sombra:
      name: "El Farero"
      bio: "."
      avatar: avatars/anon.jpg
    sargento:
      name: "Sargento Delgado"
      bio: "Guardia Civil de Caleta del Faro | Puesto principal | urgencias: 062"
      avatar: avatars/sargento.jpg
    alejandro:
      name: "Alejandro Vidal"
      bio: "fotógrafo | ex de carmen | 'todavía pienso en ella' | cádiz"
      avatar: avatars/alejandro.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN CALETA DEL FARO
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to caletadelfaro.social — the community Mastodon instance
      for the coastal town of Caleta del Faro, Andalusia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @carmen_ruiz.

      A flamenco teacher. Performer. She taught half the town to dance.
      People are worried. She hasn't posted in six days.
    choices:
      - Look at her profile -> carmen_profile

  carmen_profile:
    type: tweet
    from: carmen
    text: "Van a arrasar con el barrio de los pescadores para hacer otro hotel de mierda. Tengo documentos. Esto no lo callo."
    choices:
      - That's her last real post... -> broken_seguiriya

  broken_seguiriya:
    type: message
    text: >
      Three days after that post, her account uploaded a single video:
      a blurry clip of someone dancing seguiriyas in the dark. No sound.
      Shot from a strange angle. Posted at 4am. No caption.

      Her friends say that's not her style. Carmen always posts with
      the compás, with sound, with fire. The Guardia Civil says she
      probably went to visit family. Something doesn't add up.
    choices:
      - Read the Guardia Civil statement -> guardia_statement
      - Look at what people are saying -> community_reaction

  guardia_statement:
    type: tweet
    from: sargento
    text: >
      Se ha recibido una denuncia relativa a una vecina de Caleta del
      Faro. En este momento no existen indicios de actividad delictiva.
      Cualquier información relevante puede comunicarse al 062 o al
      puesto de la Guardia Civil.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @lucia_navarro is
      desperate. Her brother @pablo_ruiz is driving down from Cádiz.
      Her guitarist @rocio_vega is posting worried messages. The
      fisherman @pepe_camacho says she was right about the developers.

      And the journalist @pilar_mendoza is strangely silent.

      Nobody buys the Guardia Civil's line. Nobody thinks Carmen just
      "went to visit family."
    effects: { trust_lucia: "+5", trust_pablo: "+5" }
    choices:
      - Start following Carmen's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Caleta del Faro. Follow Carmen's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Dolores (bar owner, knows everyone) -> dolores_intro
      - Talk to Pepe (fisherman, saw the developers) -> pepe_intro
      - Talk to Alba (teen dancer, seems shaken) -> alba_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Carmen with the rhythms of a small
      Andalusian coastal town: fishing schedules, the bakery's daily
      specials, weather warnings, feria planning.

      Key names surface: Lucía (best friend, physio), Rocío (guitarist,
      seems rattled), Pilar (journalist, oddly quiet), and the teens
      — Alba, Dani, Zara — who worshipped Carmen's flamenco classes.

      Also prominent: Costa Dorada Resorts S.L., the tourism developer
      buying up the coast. Their posts are glossy PR. Carmen's posts
      were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Dolores -> dolores_intro
      - Talk to Pepe -> pepe_intro
      - Talk to Alba -> alba_intro

  # --- Dolores (social map) ---

  dolores_intro:
    type: tweet
    from: dolores
    text: >
      El bar está abierto pero hoy no hay alegría. @carmen_ruiz, tu
      silla te espera. Vuelve ya, niña.
    effects: { trust_dolores: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dolores -> dolores_talk

  dolores_talk:
    type: message
    text: >
      DOLORES: Ay, you're new? Welcome. Joder, terrible time to arrive.
      Everyone's on edge about Carmen.

      Let me tell you who's who. Lucía is her best friend — they share
      a flat above the pharmacy. Rocío plays guitar for her — together
      since kids. Pablo is her brother, coming from Cádiz.

      Pilar Mendoza — the journalist — was working on something with
      Carmen. About the hotel project. Pilar hasn't said a word since
      Carmen vanished. Not like her.

      And Alejandro — her ex — showed up two weeks ago. Nobody invited
      him. Carmen broke up with him a year ago and he can't accept it.
    effects: { trust_dolores: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Alejandro -> dolores_alejandro
      - Ask about Costa Dorada -> dolores_costa
      - Thank her and move on -> quest1_hub

  dolores_alejandro:
    type: message
    text: >
      DOLORES: Alejandro Vidal. Photographer from Cádiz. Together two
      years. Obsessive — always photographing her. Said it was "art."
      Carmen said it was control.

      She broke it off, he didn't take it well. But two weeks ago he
      was back, sitting on the malecón with his camera pointed at the
      dance school. Hostia, that man gives me escalofríos.
    effects: { trust_dolores: "+5" }
    choices:
      - Ask about Costa Dorada -> dolores_costa
      - Move on -> quest1_hub

  dolores_costa:
    type: message
    text: >
      DOLORES: Puta madre, don't get me started. They want to build a
      mega-resort on Punta del Faro. Already bought three houses in
      the barrio. The alcaldesa says "progress." We say soulless hotel
      for guiris.

      Carmen was the loudest voice against it. She had documents —
      dodgy permits, money changing hands. Two weeks later she's gone.
    effects: { trust_dolores: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Pepe (fisherman, witness tease) ---

  pepe_intro:
    type: tweet
    from: pepe
    text: >
      cuarenta y cinco años pescando aquí. quieren tirar nuestras casas
      para hacer un hotel. @carmen_ruiz tenía razón. y ahora ha
      desaparecido. echadle cuentas.
    effects: { trust_pepe: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Pepe -> pepe_talk

  pepe_talk:
    type: message
    text: >
      PEPE: I've fished this coast since I was a boy. Now they want to
      tear down the barrio de los pescadores — my grandfather's house —
      to build a resort for tourists who don't give a damn.

      Carmen had proof. Documents showing Costa Dorada got permits
      through bribes. She was going to publish. Then — poof — gone.

      You think that's a coincidence? Coño, I'm not stupid.
    effects: { trust_pepe: "+10" }
    choices:
      - Did you see anything unusual recently? -> pepe_night
      - Move on -> quest1_hub

  pepe_night:
    type: message
    text: >
      PEPE: The night before she vanished — I was coming back from
      night fishing, around 2am. I saw a car parked outside Carmen's
      dance school. Engine off, lights off. Just sitting there. And
      I could see someone inside, watching the building.

      It wasn't a Costa Dorada car. It was a rental — you can tell by
      the plates. Cádiz rental plates.

      I didn't think much of it then. Joder, now I can't stop thinking
      about it.
    effects: { trust_pepe: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Alba (teen dancer, witness tease) ---

  alba_intro:
    type: tweet
    from: alba
    text: >
      tío no puedo con esto @carmen_ruiz es la persona más guay de
      este pueblo, me enseñó a bailar, a sentir, a todo. no se ha ido
      por las buenas, es imposible. si alguien sabe algo q lo diga ya joder
    effects: { trust_alba: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Alba -> alba_talk_early

  alba_talk_early:
    type: message
    text: >
      ALBA: eres nuevo? mazo mal timing tío. en plan carmen es lo mejor
      que tiene este pueblo. nos enseñaba a bailar en la escuela, hacía
      clases gratis pa los niños, tío era increíble.

      y ahora estoy flipando porque dani vio algo raro la otra noche
      en el puerto pero no quiere hablar. dice q no es nada pero tío
      es q no es nada sah
    effects: { trust_alba: "+10" }
    choices:
      - What did Dani see? -> alba_dani_hint
      - Move on -> quest1_hub

  alba_dani_hint:
    type: message
    text: >
      ALBA: ni idea exactamente. estaba con el skate por el malecón y
      vio a un tío sacando fotos de la escuela de baile por la noche??
      o algo así. dice q flipó mazo pero no quiere decir nada. tienes
      q hablar con él directo pero es borde con la gente q no conoce.
      háblale de surf o skate y se abre jajaja
    effects: { trust_alba: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Caleta del Faro. An Andalusian
      coastal town built around fishing and flamenco. A teacher who
      was fighting developers. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Lucía (Carmen's best friend) -> lucia_q1
      - Talk to Rocío (Carmen's guitarist) -> rocio_q1
      - Check what Pablo (Carmen's brother) is saying -> pablo_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lucía Q1 ---

  lucia_q1:
    type: tweet
    from: lucia
    text: >
      si alguien tiene noticias de @carmen_ruiz por favor llamadme.
      su ropa está aquí. sus zapatos de baile están aquí. no se habría
      ido sin sus zapatos de baile jamás.
    effects: { trust_lucia: "+5", contacts_followed: "+1" }
    choices:
      - DM Lucía -> lucia_q1_talk

  lucia_q1_talk:
    type: message
    text: >
      LUCÍA: Thanks for reaching out but I don't know you. Carmen has
      a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Lucía is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_lucia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Rocío Q1 ---

  rocio_q1:
    type: tweet
    from: rocio
    text: >
      El viernes no hubo cante en el bar. La silla de @carmen_ruiz
      vacía. Mi guitarra no suena igual sin ella. Esto no es normal.
    effects: { trust_rocio: "+5", contacts_followed: "+1" }
    choices:
      - DM Rocío -> rocio_q1_talk

  rocio_q1_talk:
    type: message
    text: >
      ROCÍO: Carmen and I have been playing together since we were
      fifteen. She's fire when she dances. You can't fake that and
      you can't contain it. She would never just leave.

      Something scared her. She told me two weeks ago — "tengo miedo,
      Rocío. Someone's watching me and someone wants to shut me up.
      I don't know which is worse."

      I should have done something. Joder, I should have done
      something.
    effects: { trust_rocio: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Pablo Q1 ---

  pablo_q1:
    type: tweet
    from: pablo
    text: >
      mi hermana ha DESAPARECIDO y la guardia civil me dice que se
      habrá ido de viaje??? PERO EN QUÉ MUNDO VIVE ESTA GENTE. voy
      desde cádiz ahora mismo. como no me den respuestas la lío.
    effects: { trust_pablo: "+5", contacts_followed: "+1" }
    choices:
      - DM Pablo -> pablo_q1_talk

  pablo_q1_talk:
    type: message
    text: >
      PABLO: Who are you? Another person from that town who's going to
      tell me to calm down? My sister called me the night before she
      disappeared. She said she had something big. She said "if anything
      happens, look at Costa Dorada." Then she hung up.

      And one more thing — she said "he's back." I asked who. She said
      "Alejandro." She sounded scared. Not angry. Scared.

      That's the last I heard from her.
    effects: { trust_pablo: "+10" }
    choices:
      - What do you think happened? -> pablo_theory
      - Move on -> quest1_hub

  pablo_theory:
    type: message
    text: >
      PABLO: I think there are two things going on. Costa Dorada wants
      her evidence destroyed — she had proof of corruption with the
      building permits. And that hijo de puta Alejandro is back being
      a psycho. He never accepted the breakup. He used to show up at
      her flat at 3am. She got a restraining order but it expired.

      Carmen told me months ago that someone was following her. She
      thought it was the developers. But now I think it was him.
      Joder, it was him.
    effects: { trust_pablo: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Carmen went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Dani (was skating near the port at sunset) -> dani_interview
      - Find Pepe (fisherman, coming back late at night) -> pepe_interview
      - Find Antonio (baker, starts at 4am, saw something) -> antonio_interview
      - Find Rocío (was at the bar late, heard something) -> rocio_interview

  # --- Dani (saw someone photographing the school) ---

  dani_interview:
    type: tweet
    from: dani
    text: >
      buena sesión hoy pero el ambiente en el pueblo está raro. mola
      cero tío. hay algo q no va bien y nadie dice nada
    effects: { trust_dani: "+5" }
    choices:
      - Ask Dani about that evening -> dani_talk

  dani_talk:
    type: message
    text: >
      DANI: tío ok pero no le digas a nadie vale. estaba con el skate
      por el malecón tipo a las 20h y vi a un pavo con una cámara
      delante de la escuela de baile de carmen. y no era un turista
      tío, estaba ahí parado sacando fotos de las ventanas. cuando me
      vio se fue mazo rápido.

      le vi la cara. era ese tío — alejandro — el ex de carmen. seguro
      tío. le he visto en fotos. qué asco de persona joder
    effects:
      trust_dani: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Pepe (fisherman, saw confrontation at school) ---

  pepe_interview:
    type: tweet
    from: pepe
    text: >
      Aviso: el puerto está cerrado de noche. He visto gente rara por
      la zona estas últimas noches. Esto no me gusta nada.
    effects: { trust_pepe: "+5" }
    choices:
      - Ask Pepe what he saw -> pepe_talk_night

  pepe_talk_night:
    type: message
    text: >
      PEPE: I was coming back from night fishing, around 1am. I saw
      two cars parked outside Carmen's dance school. One was a big
      black SUV — I've seen it before, it's the Costa Dorada company
      car. The other was Carmen's old Seat Ibiza.

      There were people inside the school. I could see lights moving
      around. Then two men came out — suits, even at that hour. One
      of them I recognised: Rafael Montero, the development director.

      At 1am. At a dance school. Coño, that's not a business meeting.
    effects:
      trust_pepe: "+10"
      night_witnesses: "+1"
      corruption_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Antonio (baker, saw car chase) ---

  antonio_interview:
    type: tweet
    from: antonio
    text: >
      Horno encendido a las 4 como siempre. Pero esta mañana un coche
      pasó volando por la carretera de la costa. Demasiado rápido.
    effects: { trust_antonio: "+5" }
    choices:
      - Ask Antonio what he saw -> antonio_talk

  antonio_talk:
    type: message
    text: >
      ANTONIO: I start baking at 4am every day. That morning I was
      opening the shutters and a car went past — flying, way too fast
      for the coast road. Carmen's old Seat, I know that car. Then
      maybe a minute later, a second car. Black SUV. Chasing? I
      don't know.

      Carmen's car turned off toward the old lighthouse at Punta del
      Faro. The SUV kept going toward the highway.

      I told the Guardia Civil. They wrote it down. That was it. Joder.
    effects:
      trust_antonio: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Rocío (heard argument at the school) ---

  rocio_interview:
    type: tweet
    from: rocio
    text: >
      No he podido dormir. Aquella noche oí algo y no hice nada.
      Me odio por eso.
    effects: { trust_rocio: "+5" }
    choices:
      - Ask Rocío what she heard -> rocio_talk_night

  rocio_talk_night:
    type: message
    text: >
      ROCÍO: I live two streets from the dance school. That night,
      around midnight, I heard shouting. Men's voices. And then
      Carmen — I know her voice anywhere — screaming "no me toquéis
      los documentos, son míos!"

      Then a car door slammed. Then silence.

      I went to my window but I couldn't see anything. I should have
      gone down. Joder, I should have gone down. I called her phone.
      No answer. I called again at 6am. Nothing. That's when I knew.
    effects:
      trust_rocio: "+10"
      night_witnesses: "+1"
      corruption_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
