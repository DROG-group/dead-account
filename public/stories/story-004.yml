    type: message
    text: >
      ENDING B: THE CORPORATION

      The corruption story breaks. Costa Dorada is ordered to halt
      construction. The alcaldesa is investigated. The fishermen's
      quarter is saved.

      But Carmen?

      Without the stalking evidence, Alejandro is never investigated.
      He stays in his rented apartment. He keeps photographing the
      dance school. He creates a new anonymous account.

      Three months later, Carmen reads about Costa Dorada online. She
      returns quietly. She changes the locks. She stops walking alone
      at night. She checks her mirrors constantly.

      The corporation is exposed. But the person who terrorised
      Carmen walks free.
    choices:
