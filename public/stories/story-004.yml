      - I need more evidence -> investigation_hub

  # --- ENDING A: Alejandro (Best Ending) ---

  confront_alejandro:
    type: message
    text: >
      You present your evidence to Alejandro:

      "I know @el_farero is your account. I know you planted a
      listening device at the school. I know you've been photographing
      Carmen for months. I know you were watching her flat. I have
      witnesses and I have the photos."
    choices:
      - Send -> alejandro_response

  alejandro_response:
    type: message
    text: >
      Alejandro doesn't reply for a long time. Then:

      ALEJANDRO: You don't understand. She's my muse. Everything I
      create is because of her. I was protecting her — she was in
      danger from those developers and she wouldn't let me help. I
      needed to be close. Everything I did was out of love.

      That's not love. That's obsession.

      You've already sent the evidence to Sargento Delgado. And to
      Pilar Mendoza.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Sargento Delgado reopens the case. With your evidence — the
      anonymous account, the listening device, the surveillance photos,
      the witness testimonies — Alejandro is arrested for stalking and
      violation of the expired restraining order. A GPS tracker is
      found on Carmen's car near the old lighthouse.

      Pilar Mendoza, with Carmen's full evidence package, publishes
      the Costa Dorada story in El País. The Junta orders a halt to
      all construction at Punta del Faro. The environmental fraud is
      exposed. Alcaldesa Márquez faces criminal charges for corruption.
      Rafael Montero is arrested for bribery and intimidation.

      And Carmen Ruiz, reading the story from a friend's house in
      Jerez, calls her brother for the first time in nine days.

      "Pablo, me vuelvo a casa."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: carmen
    text: >
      el compás no miente. y la gente de caleta del faro tampoco.
      gracias por no rendiros.
    choices:
      - The End -> game_complete

