entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN GRÜNWALD
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to gruenwald.social — the community Mastodon instance
      for the university town of Grünwald, Saxony.

      The local feed is agitated today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name dominates: @lena_hoffmann.

      A music student and producer who ran an underground club night
      called Kellernacht. People are worried. She hasn't posted in
      six days.
    choices:
      - Look at her profile -> lena_profile

  lena_profile:
    type: tweet
    from: lena
    text: "I have proof that half the papers coming out of this department are not original work. Screenshots coming."
    choices:
      - That's her last real post... -> static_post

  static_post:
    type: message
    text: >
      Two days after that post, her account uploaded a single audio
      clip: 30 seconds of static. No caption. Posted at 4am.

      Her friends say that's not her. The police say she probably
      took a break from social media. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: becker
    text: >
      Wir haben eine Vermisstenanzeige bezüglich einer Studentin
      der Universität Grünwald aufgenommen. Derzeit liegen keine
      Hinweise auf eine Straftat vor. Hinweise bitte an die
      Polizeiinspektion: 110.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are everywhere. Her best friend @fatima_alrashid
      is panicking. Her DJ partner @niklas_berger is trying to stay
      calm but failing. The student union president @jonas_richter
      is demanding the university respond.

      And an account called @kai_drescher — an ex-collaborator from
      Kellernacht — is posting cryptic, bitter messages.

      Nobody buys the police line. Nobody thinks Lena just "took a
      break."
    effects: { trust_fatima: "+5", trust_niklas: "+5" }
    choices:
      - Start following Lena's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Grünwald. Follow Lena's contacts and read their
      posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Stefan (café owner, knows everyone) -> stefan_intro
      - Talk to Dieter (caretaker, sees everything) -> dieter_intro
      - Talk to Emre (teen fan, saw something) -> emre_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Lena with university gossip,
      café specials, and weather complaints. Grünwald is a small
      university town — the campus and town are inseparable.

      Key names surface: Fatima (best friend, med student), Niklas
      (DJ partner, Kellernacht co-founder), Professor Hartmann
      (musicology chair, Lena accused him of something), and Kai
      Drescher (ex-collaborator, removed from Kellernacht, angry).
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Stefan -> stefan_intro
      - Talk to Dieter -> dieter_intro
      - Talk to Emre -> emre_intro

  # --- Stefan (social map) ---

  stefan_intro:
    type: tweet
    from: stefan
    text: >
      Lenas Stammplatz ist leer. Der Cappuccino wird kalt. Komm
      zurück, @lena_hoffmann. Wir brauchen die Musik.
    effects: { trust_stefan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Stefan -> stefan_talk

  stefan_talk:
    type: message
    text: >
      STEFAN: New in town? Welcome to Grünwald. Bad timing though.
      Everyone's upset about Lena.

      Let me tell you the landscape. Fatima is Lena's best friend —
      they're inseparable, or were. Niklas is her DJ partner at
      Kellernacht — he's keeping it together but barely. Professor
      Hartmann runs the musicology department and Lena was about to
      blow up his career. And then there's Kai Drescher.

      Kai was part of Kellernacht until Lena kicked him out six
      months ago. Creative differences, she said. He didn't take it
      well. He's been posting nasty stuff ever since. Some of it...
      honestly, some of it's threatening.
    effects: { trust_stefan: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Kai -> stefan_kai
      - Ask about Professor Hartmann -> stefan_hartmann
      - Thank him and move on -> quest1_hub

  stefan_kai:
    type: message
    text: >
      STEFAN: Kai is talented but unstable. When Lena told him to
      leave Kellernacht, he showed up here at the café screaming
      at her. I had to ask him to leave. He stood outside for an
      hour staring through the window.

      Since then he's been posting about her constantly. Passive-
      aggressive stuff. "She stole my sound." "She'll regret this."
      And he's been showing up at Kellernacht events even though
      he's not welcome.
    effects: { trust_stefan: "+5" }
    choices:
      - Ask about Professor Hartmann -> stefan_hartmann
      - Move on -> quest1_hub

  stefan_hartmann:
    type: message
    text: >
      STEFAN: Hartmann is old school. Respected, powerful in the
      department. Lena was his student until she started making
      accusations. Said he was running a plagiarism ring — taking
      student work, publishing it under his name or his favourites'
      names. She had evidence, she said.

      The university didn't want to hear it. Hartmann has brought
      in millions in grants. He's untouchable. Or he was, until
      Lena started posting.
    effects: { trust_stefan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Dieter (caretaker, sees everything) ---

  dieter_intro:
    type: tweet
    from: dieter
    text: >
      25 jahre in diesem gebäude. ich seh alles. ich sag nix. aber
      wegen @lena_hoffmann... vielleicht sollte ich mal was sagen.
    effects: { trust_dieter: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dieter -> dieter_talk

  dieter_talk:
    type: message
    text: >
      DIETER: I'm the caretaker at the music building. I've been
      here since before Hartmann arrived. I see who comes, who goes,
      who stays late.

      Lena was in her practice room every night until midnight.
      Working on music, yes, but also going through papers. The
      recycling from Hartmann's office — she was pulling documents
      out of it. Shredded stuff too. She had tape and patience.

      And the last week before she disappeared? Someone was in the
      building after hours who shouldn't have been. I found the side
      door propped open twice. Not students — they use their cards.
    effects: { trust_dieter: "+10" }
    choices:
      - Who was it? -> dieter_suspect
      - Move on -> quest1_hub

  dieter_suspect:
    type: message
    text: >
      DIETER: I didn't see a face. But I found a lighter in the
      stairwell. Black Zippo with a scratched skull design. I know
      that lighter. Kai Drescher used to sit on the fire escape
      smoking with that exact lighter when he was still part of
      Kellernacht.

      He has no reason to be in the music building at 2am. His
      student access was revoked.
    effects: { trust_dieter: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Emre (teen fan, witness) ---

  emre_intro:
    type: tweet
    from: emre
    text: >
      ey alter @lena_hoffmann ist weg und keinen interessierts??
      die hat mir erst letzte woche noch nen set beigebracht. sowas
      macht man nicht einfach und verschwindet digga. safe ist da
      was passiert
    effects: { trust_emre: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Emre -> emre_talk_early

  emre_talk_early:
    type: message
    text: >
      EMRE: ey jo ich war am freitagabend am kellernacht-eingang
      weil ich dachte es gibt ne session oder so. war aber nix. und
      dann seh ich den kai drescher da stehen. der steht einfach da
      und glotzt aufs gebäude. ich schwöre der typ ist creepy alter.

      hab ich mich nicht getraut was zu sagen ngl. der hat mich
      angeguckt und ich bin einfach weiter. krass unangenehm digga
    effects: { trust_emre: "+10" }
    choices:
      - Can you describe exactly when this was? -> emre_timing
      - Thanks Emre, I might come back to this -> quest1_hub

  emre_timing:
    type: message
    text: >
      EMRE: das war so gegen 22 uhr freitagabend. also der abend
      bevor lena weg war. safe. ich weiß das weil ich danach noch
      bei zoe war und die hat mir nen screenshot geschickt von
      lenas letztem post. der über die plagiate. das war noch
      online da. jetzt ist er weg. gelöscht.

      vallah wer löscht den post von jemand anderem?? das ist doch
      sus
    effects: { trust_emre: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Grünwald. A university town where
      the campus IS the town. A music student who was exposing
      academic fraud. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Fatima (Lena's best friend) -> fatima_q1
      - Talk to Niklas (DJ partner) -> niklas_q1
      - Check what Jonas (student union) is saying -> jonas_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Fatima Q1 ---

  fatima_q1:
    type: tweet
    from: fatima
    text: >
      lena ist nicht der typ mensch der einfach verschwindet. sie
      war mittendrin. sie hatte pläne. WER HAT IHR DAS ANGETAN.
      @polizei_gruenwald MACHT EUREN JOB
    effects: { trust_fatima: "+5", contacts_followed: "+1" }
    choices:
      - DM Fatima -> fatima_q1_talk

  fatima_q1_talk:
    type: message
    text: >
      FATIMA: I appreciate you reaching out but I don't know you.
      Lena has a lot of people who care about her. She wouldn't
      just vanish.

      [Fatima is guarded. You'll need to build more trust.]
    effects: { trust_fatima: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Niklas Q1 ---

  niklas_q1:
    type: tweet
    from: niklas
    text: >
      kellernacht ist auf eis bis lena zurück ist. ohne sie hat
      das keinen sinn. wer infos hat — meldet euch. bitte.
    effects: { trust_niklas: "+5", contacts_followed: "+1" }
    choices:
      - DM Niklas -> niklas_q1_talk

  niklas_q1_talk:
    type: message
    text: >
      NIKLAS: Lena and I built Kellernacht together. She's the
      heart of it. She's also my friend and I'm scared.

      She told me she had something on Hartmann. Something big.
      But she also told me someone was following her. She thought
      it was Kai at first, then she said "maybe it's not just Kai."

      I should have taken it more seriously.

      [Niklas seems genuinely worried.]
    effects: { trust_niklas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jonas Q1 ---

  jonas_q1:
    type: tweet
    from: jonas
    text: >
      Der AStA fordert die Universität auf, zur Situation von
      @lena_hoffmann Stellung zu nehmen. Eine Studentin ist
      verschwunden. Schweigen ist keine Option.
    effects: { trust_jonas: "+5", contacts_followed: "+1" }
    choices:
      - DM Jonas -> jonas_q1_talk

  jonas_q1_talk:
    type: message
    text: >
      JONAS: The university won't say a word. Hartmann's office
      referred us to the press department. The press department
      said "this is a police matter." The police said "there's no
      crime."

      The circle of silence is perfect.

      Lena came to the AStA three weeks ago with plagiarism
      allegations against Hartmann. We started an internal review.
      Then she disappeared. Coincidence? I don't believe in
      academic coincidences.
    effects: { trust_jonas: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Lena went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Zoe (was near the music building that night) -> zoe_interview
      - Find Finn (heard sounds from the practice room) -> finn_interview
      - Find Petra (pharmacist, saw someone outside her window) -> petra_interview
      - Find Annette (bookshop, working late, saw a confrontation) -> annette_interview

  # --- Zoe (saw Kai lurking) ---

  zoe_interview:
    type: tweet
    from: zoe
    text: >
      alter ich hab am freitag den kai drescher am musikgebäude
      gesehen. so gegen 23 uhr. der hat da nix verloren?? krass
      creepy safe
    effects: { trust_zoe: "+5" }
    choices:
      - Ask Zoe what she saw -> zoe_talk

  zoe_talk:
    type: message
    text: >
      ZOE: ich schwöre ich hab den kai um 23 uhr am musikgebäude
      gesehen. er stand an der seitentür. hatte nen hoodie an und
      hat sich umgeguckt als ob er nicht gesehen werden will. dann
      ist er rein. durch die seitentür die eigentlich zu sein
      sollte.

      der hat da kein zutritt mehr alter. das ist sus. ich hab nen
      screenshot von meiner uhr gemacht als beweis lol. 23:07.
    effects:
      trust_zoe: "+10"
      night_witnesses: "+1"
      stalking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Finn (heard sounds) ---

  finn_interview:
    type: tweet
    from: finn
    text: >
      ey war freitagabend im proberaum nebenan und hab krassen
      lärm gehört. nicht musik. eher streit. läuft nicht in dem
      gebäude gerade
    effects: { trust_finn: "+5" }
    choices:
      - Ask Finn what he heard -> finn_talk

  finn_talk:
    type: message
    text: >
      FINN: ich war so bis 23:30 im proberaum am üben. und dann
      hör ich nebenan — das ist lenas raum — jemanden schreien. ein
      typ. aggressiv. und dann lena die sagt "geh raus" oder so.
      dann ne tür die knallt.

      ich hab mich nicht rausgetraut ehrlich gesagt. als ich dann
      nach ner viertelstunde rausgeguckt hab war alles dunkel. ihr
      raum war leer. ihre tasche war noch da aber sie war weg.

      alter ich hätte was machen sollen. ich schwöre.
    effects:
      trust_finn: "+10"
      night_witnesses: "+1"
      stalking_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Petra (saw someone running) ---

  petra_interview:
    type: tweet
    from: petra
    text: >
      Freitagabend gegen Mitternacht: eine junge Frau ist an meiner
      Wohnung vorbeigerannt. In Richtung Bahnhof. Ohne Jacke.
    effects: { trust_petra: "+5" }
    choices:
      - Ask Petra what she saw -> petra_talk

  petra_talk:
    type: message
    text: >
      PETRA: I live above the pharmacy, overlooking Marktplatz.
      Around midnight I heard running. A young woman, dark hair,
      no jacket — it was 3 degrees that night. She was running
      toward the train station. Not jogging. Fleeing.

      A few minutes later, someone else walked the same direction.
      Slower, determined. A man in a dark hoodie.

      I nearly called the police. I should have. I told them
      afterwards. They said "noted."
    effects:
      trust_petra: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Annette (saw confrontation) ---

  annette_interview:
    type: tweet
    from: annette
    text: >
      Ich war Freitagabend spät im Laden. Vor dem Musikgebäude
      standen zwei Personen. Eine Diskussion. Laut. Unangenehm.
    effects: { trust_annette: "+5" }
    choices:
      - Ask Annette what she saw -> annette_talk

  annette_talk:
    type: message
    text: >
      ANNETTE: I was doing inventory until about 22:30. Through my
      window I saw two people outside the music building. A man and
      a woman. He was in her space — leaning in, pointing. She was
      backing up. She had papers or a folder in her hands.

      He grabbed at the folder. She pulled away. Then he raised his
      voice — I could hear it through the glass even though I
      couldn't make out words. She turned and went back inside.
      He stood there for a moment, then followed her in.

      The woman could have been Lena. The man — I couldn't tell.
    effects:
      trust_annette: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.

      You can keep collecting testimonies or talk to Fatima
      (best friend) and Niklas (DJ partner).
    choices:
      - Talk to Fatima about that night -> fatima_interview
      - Talk to Niklas about Kai -> niklas_interview
      - Find Zoe -> zoe_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Finn -> finn_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Petra -> petra_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Annette -> annette_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Fatima (last contact with Lena) ---

  fatima_interview:
    type: tweet
    from: fatima
    text: >
      lenas letzte nachricht an mich: "ich hab alles dokumentiert.
      wenn mir was passiert, guck in meinen cloud-ordner." DAS WAR
      VOR SECHS TAGEN.
    effects: { trust_fatima: "+5" }
    choices:
