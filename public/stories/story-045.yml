      bio: "ympäristötutkija | Lapin yliopisto | juhon kollega | vesistötutkimus"
      avatar: avatars/antti.jpg

    # === Local Government ===
    markku:
      name: "Markku Hautala"
      bio: "Kittilän kunnanjohtaja | kuntalaisten asialla vuodesta 2018 | #KittilänTulevaisuus"
      avatar: avatars/markku.jpg
    tuula:
