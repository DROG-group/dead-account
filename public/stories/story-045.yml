      name: "NorthernLightsChaser"
      bio: "."
      avatar: avatars/anon.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN KITTILÄ
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Kittila.social — the community Mastodon instance for
      Kittilä, a small village in Finnish Lapland.

      The local feed is heavy with worry today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name everywhere:
      @juho_lehtonen.

      An aurora photographer. Night sky artist. He knew every ridge
      and riverbank where the northern lights danced best. People
      are frightened. He hasn't posted in seven days.
    choices:
      - Look at his profile -> juho_profile

  juho_profile:
    type: tweet
    from: juho
    text: "Ounasjoen vesi on väärän väristä. Kaivoksen alapuolella joki on kuollut. Meillä on näytteet. The river below the mine is dead. I have proof."
    choices:
      - That's his last real post... -> grey_sky

  grey_sky:
    type: message
    text: >
      Two days after that post, his account uploaded a single image:
      a grey sky. Overcast, blurred, shot from an odd angle. Posted
      at 4am. No caption. No location tag.

      His friends say Juho never posts without coordinates and camera
      settings. The police say he probably went on a photography trip.
      Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: constable
    text: >
      Olemme vastaanottaneet ilmoituksen kittilälaisestä asukkaasta.
      Tässä vaiheessa ei ole viitteitä rikoksesta. Lehtonen on kokenut
      eräretkeilijä ja on voinut lähteä vapaaehtoisesti. Tiedot
      numeroon 112.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His housemate @elina_korhonen is
      desperate. His brother @ville_lehtonen is driving up from
      Rovaniemi. His colleague @antti_makela is posting worried
      messages. The fisherman @pekka_virtanen says Juho was right
      about the river.

      And the journalist @reetta_laine is strangely silent.

      Nobody buys the police line. Nobody thinks Juho just went
      on a vitun photography trip.
    effects: { trust_elina: "+5", trust_ville: "+5" }
    choices:
      - Start following Juho's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Kittilä. Follow Juho's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Liisa (bar owner, knows everyone) -> liisa_intro
      - Talk to Pekka (fisherman, saw the river) -> pekka_intro
      - Talk to Sanna (teen skier, seems shaken) -> sanna_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Juho with the rhythms of a Lapland
      village in kaamos: aurora forecasts, the bakery's daily pulla,
      snowmobile trail conditions, darkness and more darkness.

      Key names surface: Elina (housemate, nurse), Antti (research
      colleague, seems rattled), Reetta (journalist, oddly quiet),
      and the teens — Sanna, Aleksi, Tiina — who idolised Juho's
      aurora work.

      Also prominent: ArcticGold Mining Oy, the mine on the edge of
      town. Their posts are corporate PR. Juho's posts were the
      opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Liisa -> liisa_intro
      - Talk to Pekka -> pekka_intro
      - Talk to Sanna -> sanna_intro

  # --- Liisa (social map) ---

  liisa_intro:
    type: tweet
    from: liisa
    text: >
      Baari on auki mutta sydän ei ole mukana. @juho_lehtonen, sun
      paikka odottaa. Tule takas.
    effects: { trust_liisa: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Liisa -> liisa_talk

  liisa_talk:
    type: message
    text: >
      LIISA: Ai, sä oot uus täällä? Tervetuloa, huono ajoitus.
      Koko kylä on sekaisin Juhon takia.

      Let me tell you who's who. Elina is Juho's housemate — they
      share a flat above the old post office. Sweet girl, devastated.
      Antti Mäkelä does the water research with Juho. Smart man,
      but... intense about him. Ville is Juho's older brother, he's
      driving up from Rovaniemi.

      And Reetta Laine — the journalist — she and Juho were working
      on something together. Something about the mine. Reetta hasn't
      said a word since Juho vanished. Ei se oo normaalia.

      Oh, and don't read ArcticGold's paskaa about "responsible
      mining." Vittu, the river is orange downstream.
    effects: { trust_liisa: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Antti -> liisa_antti
      - Ask about ArcticGold -> liisa_arcticgold
      - Thank her and move on -> quest1_hub

  liisa_antti:
    type: message
    text: >
      LIISA: Antti? He's been doing research up here longer than
      Juho. Brilliant with the science. But since Juho arrived, he's
      been... orbiting him. In the bar every time Juho was there.
      Offering to carry his camera gear out to the shooting spots.
      Commenting on every single post.

      Juho was polite about it but I could see it annoyed him.
      After he started investigating the mine, Antti got worse.
      Wanted to be involved in everything. Juho told me once, "He
      doesn't understand boundaries." I thought he meant about
      the work. Nyt en oo enää niin varma.
    effects: { trust_liisa: "+5" }
    choices:
      - Ask about ArcticGold -> liisa_arcticgold
      - Move on -> quest1_hub

  liisa_arcticgold:
    type: message
    text: >
      LIISA: That mine's been there since the 90s. Gold extraction,
      open pit. The village tolerated it because it brought jobs.
      But the fishermen have been complaining for years — the river
      below the tailings dam is wrong. Orange water, dead fish,
      the grayling gone.

      Juho was the first person to actually go out there with sample
      bottles and a camera. He photographed the river at night when
      the discharge was worst — under the aurora, the poisoned water
      glowed. Saatana, he had proof. Real proof. Two weeks later
      he's gone.
    effects: { trust_liisa: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Pekka (the river, witness tease) ---

  pekka_intro:
    type: tweet
    from: pekka
    text: >
      30 vuotta kalastanu näillä joilla. vesi ei oo enää sama.
      @juho_lehtonen oli oikeessa. nyt se on kadonnu. laskekaa
      yks plus yks.
    effects: { trust_pekka: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Pekka -> pekka_talk

  pekka_talk:
    type: message
    text: >
      PEKKA: I've fished these rivers since I was a boy. I know
      every pool, every rapid, every colour the water makes in
      every season. And I'm telling you — the Ounasjoki below
      the mine is dead. Has been for months. My nets come up
      empty. The riverbed smells of chemicals.

      Juho took water samples. He went out at night and
      photographed the discharge — the mine dumps more when
      they think nobody's watching. He was building a case.
      And then poof — gone.

      You think that's a coincidence? Perkele, I don't believe
      in coincidences on the river.
    effects: { trust_pekka: "+10" }
    choices:
      - Did you see anything unusual recently? -> pekka_night
      - Move on -> quest1_hub

  pekka_night:
    type: message
    text: >
      PEKKA: The night before he vanished — I was coming back from
      ice fishing, around midnight. I saw lights at Juho's cabin
      studio down by the river. Not unusual, he works late editing
      photos. But there were two vehicles in the yard. One was
      Juho's old Hilux. The other was a black SUV with ArcticGold
      plates.

      At midnight. At Juho's studio.

      I noted it in my fishing diary. Nobody's asked to see it.
    effects: { trust_pekka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sanna (teen skier, witness tease) ---

  sanna_intro:
    type: tweet
    from: sanna
    text: >
      mitä helvettiä mä en voi uskoo tätä @juho_lehtonen on
      paras ihminen täs kylässä se opetti meidät kuvaamaan
      revontulia. jos joku tietää jotain nii kertokaa vittu.
    effects: { trust_sanna: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sanna -> sanna_talk_early

  sanna_talk_early:
    type: message
    text: >
      SANNA: ai sä oot uus? huono timing. siis juho on ihan
      oikeesti paras tyyppi tääl. se vei meidät kuvaamaan
      revontulia tunturille, opetti säädöt ja kaiken. ihan sika
      siisti.

      ja nyt mua pelottaa koska aleksi näki jotain outoo sinä
      iltana joen rannalla mut se ei haluu puhuu siitä. se sanoo
      et se on ei mitään mut siis... se EI oo ei mitään. sen
      näkee sen naamasta.
    effects: { trust_sanna: "+10" }
    choices:
      - What did Aleksi see? -> sanna_aleksi_hint
      - Move on -> quest1_hub

  sanna_aleksi_hint:
    type: message
    text: >
      SANNA: en mä tarkalleen tiiä. se oli tulossa
      moottorikelkkareissulta ja näki jonkun juhon auton
      luona?? tai jotain sellasta. se on ihan paniikissa
      eikä haluu puhuu. pitää kysyy siltä suoraan mut se
      ei luota tuntemattomiin. puhu sille ensin kelkoista
      tai kalastuksesta nii se rentoutuu.
    effects: { trust_sanna: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Kittilä. A Lapland village built
      around the mine, the river, and the dark season. A photographer
      who was exposing pollution. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Elina (Juho's housemate) -> elina_q1
      - Talk to Antti (Juho's colleague) -> antti_q1
      - Check what Ville (Juho's brother) is saying -> ville_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Elina Q1 ---

  elina_q1:
    type: tweet
    from: elina
    text: >
      jos jollain on tietoa @juho_lehtonen soittakaa mulle. sen huone
      on koskematon. kameralaukku on täällä. se ei ikinä lähtis ilman
      kameroitaan.
    effects: { trust_elina: "+5", contacts_followed: "+1" }
    choices:
      - DM Elina -> elina_q1_talk

  elina_q1_talk:
    type: message
    text: >
      ELINA: Thanks for reaching out but I don't know you. Juho has
      lots of friends here. I'm sure he'll come back.

      ...I keep saying that. En mä enää usko siihen.

      [Elina is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_elina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Antti Q1 ---

  antti_q1:
    type: tweet
    from: antti
    text: >
      The studio is empty without @juho_lehtonen. His hard drives are
      still on the desk. His sample logs are here. He would never
      abandon ongoing research. Something happened.
    effects: { trust_antti: "+5", contacts_followed: "+1" }
    choices:
      - DM Antti -> antti_q1_talk

  antti_q1_talk:
    type: message
    text: >
      ANTTI: Juho and I have worked together for over a year. He's
      the most dedicated person I know. This mining investigation —
      it was everything to him. He had data, photos, chemical
      analysis. He was so close to going public.

      I offered to help him. Many times. He said he had it under
      control. He said he was working with a journalist. I just
      wanted to support him.

      [Antti seems earnest. Or obsessive?]
    effects: { trust_antti: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ville Q1 ---

  ville_q1:
    type: tweet
    from: ville
    text: >
      mun veli on KADONNU ja poliisi sanoo et se ehkä lähti
      vaeltamaan??? JUMALAUTA SE EI LÄHDE VAELTAMAAN KERTOMATTA
      KENELLEKÄÄN. mä tuun rovaniemeltä. joku selittää mulle.
    effects: { trust_ville: "+5", contacts_followed: "+1" }
    choices:
      - DM Ville -> ville_q1_talk

  ville_q1_talk:
    type: message
    text: >
      VILLE: Who are you? Another person from that village who's
      going to tell me to calm down? My brother called me the night
      before he disappeared. He said he had something big. He said
      "if anything happens, look at ArcticGold." Then he hung up.

      Se oli viimenen kerta ku mä kuulin siitä.
    effects: { trust_ville: "+10" }
    choices:
      - What do you think happened? -> ville_theory
      - Move on -> quest1_hub

  ville_theory:
    type: message
    text: >
      VILLE: I think he found proof that ArcticGold is poisoning the
      river and they shut him up. But I also think that creepy
      colleague of his — Antti — knows more than he's saying. The
      way he talks about Juho... it's not just professional concern.
      It's something else.

      Juho told me months ago that someone was following him on his
      night shoots. He'd see the same figure on the ridges, always
      at a distance, always in the dark. He thought it was a tourist
      chasing the aurora. I don't think it was a tourist.
    effects: { trust_ville: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Juho went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Aleksi (was on a snowmobile trip, saw something) -> aleksi_interview
      - Find Jari (snowmobile mechanic, works late) -> jari_interview
      - Find Heikki (baker, starts at 4am, saw something) -> heikki_interview
      - Find Olli (reindeer herder, early morning on the fell) -> olli_interview

  # --- Aleksi (saw someone at Juho's truck) ---

  aleksi_interview:
    type: tweet
    from: aleksi
    text: >
      kelkkareissu oli kova mut tunnelma kylässä on outo.
      jotain on vialla. en osaa selittää.
    effects: { trust_aleksi: "+5" }
    choices:
      - Ask Aleksi about that evening -> aleksi_talk

  aleksi_talk:
    type: message
    text: >
      ALEKSI: okei mut sä et kerro tätä kellekään. mä olin tulossa
      kelkkareissulta joen vartta pitkin, joku seiskan maissa illalla.
      ja mä näin sen tutkijatyypin — antin — juhon auton vieressä.
      se oli kyykyssä kuljettajan puolella. ku se näki mut se lähti
      kävelee pois ihan ku ei mitään.

      siis vittu mitä se teki siellä? mä en sanonu mitään koska en
      halunnu ongelmia mut nyt tää on ihan sairasta. se ei oo
      normaalia.
    effects:
      trust_aleksi: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Jari (snowmobile mechanic, saw late-night visit) ---

  jari_interview:
    type: tweet
    from: jari
    text: >
      Muistutus: joen ranta-alue on suljettu klo 22 jälkeen.
      Luvattomia ajoneuvoja havaittu viime öinä. Asiaan puututaan.
    effects: { trust_jari: "+5" }
    choices:
      - Ask Jari what he saw -> jari_talk

  jari_talk:
    type: message
    text: >
      JARI: I was closing up the workshop around half ten. I saw
      Juho's Hilux still parked at his studio by the river. And
      next to it — a black SUV with ArcticGold plates. Two men
      standing at the studio door. One of them I recognised: Tero
      Salonen, the mine director.

      At half ten at night. At Juho's river studio. Ei se oo
      normaalia.

      I logged it in my workshop book. Nobody from the police
      has asked to see it.
    effects:
      trust_jari: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Heikki (saw Juho fleeing) ---

  heikki_interview:
    type: tweet
    from: heikki
    text: >
      ylhäällä klo 4 niinku aina. tie ei ollu tyhjä tänä aamuna.
      joku ajoi moottorikelkalla pimeässä kohti tunturia.
      ei ollu retkeilijä.
    effects: { trust_heikki: "+5" }
    choices:
      - Ask Heikki what he saw -> heikki_talk

  heikki_talk:
    type: message
    text: >
      HEIKKI: I'm up at four every morning for the bread. That
      morning — the morning after Juho's last post — I saw someone
      on a snowmobile heading north on the river trail. Fast,
      carrying a rucksack. In pitch darkness, no headlamp. Moving
      like someone being chased.

      I shouted but they didn't stop. I figured it was a tourist
      but... who rides a snowmobile at 4am with no lights carrying
