# DEAD ACCOUNT — Story 045: Kittilä (Finland, Round 2)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-045.yml
#
# Player investigates the disappearance of aurora photographer Juho Lehtonen
# in the fictional Lapland gold rush village of Kittilä.

