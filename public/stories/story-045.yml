  # --- ENDING A: Antti (Best Ending) ---

  confront_antti:
    type: message
    text: >
      You present your evidence to Antti:

      "I know @NorthernLightsChaser is your account. I know you
      put a GPS tracker on Juho's truck. I know you accessed his
      files in the studio. I know you were watching his flat. I
      have witnesses and I have the access logs."
    choices:
      - Send -> antti_response

  antti_response:
    type: message
    text: >
      Antti doesn't reply for a long time. Then:

      ANTTI: You don't understand. I was protecting him. He was
      in danger from ArcticGold and he wouldn't let me help.
      I needed to know he was safe. I followed him on the night
      shoots because the fells are dangerous in the dark. Everything
      I did was because I care about him.

      That's not care. That's obsession.

      You've already sent the evidence to Ylikonstaapeli Hämäläinen.
      And to Reetta Laine.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Ylikonstaapeli Hämäläinen reopens the case. With your evidence
      — the anonymous account, the GPS tracker, the access logs, the
      witness testimonies — Antti is arrested for stalking and
      harassment. A GPS tracker is recovered from under Juho's Hilux,
      found at an abandoned gold panner's cabin north of the village.

      Reetta Laine, finally in possession of Juho's full evidence
      package, publishes the ArcticGold story in Helsingin Sanomat.
      AVI orders an unannounced inspection. The mine is shut down
      pending environmental remediation. Tero Salonen faces criminal
      charges for falsifying discharge reports.

      And Juho Lehtonen, reading the story from a friend's cabin in
      Inari, calls his brother for the first time in ten days.

      "Mä tuun kotiin, Ville."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: juho
    text: >
      joki ei valehtele. eikä kittilän ihmiset. kiitos ettette
      luovuttanu.
    choices:
      - The End -> game_complete

  # --- ENDING B: Tero (Partial Ending) ---

  confront_tero:
    type: message
    text: >
      You present the pollution evidence to Tero Salonen:

      "I have photographs of the undeclared discharge channel. I
      have water samples showing arsenic and cyanide levels twenty
      times the legal limit. I have your original lab reports
      showing the data was falsified. I have the GPS coordinates
