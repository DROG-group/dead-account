  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. ArcticGold is ordered to halt
      discharge pending investigation. The mine may close. Three
      hundred jobs hang in the balance. The village is divided.

      But Juho?

      Without the stalking evidence, Antti is never investigated.
      He continues to work in the valley. He continues to monitor
      Juho's accounts. He creates a new anonymous profile.

      Three months later, Juho reads about ArcticGold online. He
      returns quietly. He changes his research area. He stops
      shooting alone at night. He checks under his truck every
      morning.

      The corporation is exposed. But the person who terrorised
      Juho walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
