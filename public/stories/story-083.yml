  confront_romain:
    type: message
    text: >
      You present your evidence to Romain:

      "I know @le_berger_noir is your account. I know you installed
      trail cameras at Margaux's farm. I know you photographed her
      through her windows. I know you were at the farm the night she
      died. I have witnesses, I have Margaux's own testimony, and
