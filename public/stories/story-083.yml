    type: message
    text: >
      Romain doesn't reply for a very long time. Then:

      ROMAIN: You don't understand. I loved her. I was the only one
      who truly understood her work, her connection to the land, to
      the animals. I was protecting her. She was in danger from
      AgriVal and she wouldn't let me help. I needed to be close.
      Everything I did was out of love.

      That's not love. That's obsession. And Margaux is dead.

      You've already sent the evidence to Adjudant Moreau. And to
      Marianne Vasseur.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Adjudant Moreau reopens the case as a criminal investigation.
      With your evidence — the anonymous account, the trail cameras,
      the photographs, the witness testimonies, Margaux's own letter
