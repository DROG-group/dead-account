      - Back to investigation hub -> investigation_hub

  marianne_hint:
    type: message
    text: >
      MARIANNE: The factory had motive. She was about to destroy
      them publicly. But I don't think Julien Marchand would kill
      someone. Intimidate, yes. Threaten legal action, yes. He sent
      people to the farm to warn her off.

      But there was something else Margaux mentioned — someone who
      was always around. Who made her uneasy. A man. She didn't
      name him to me. She said "it's a village thing, I'll handle
      it."

      She shouldn't have had to handle anything alone.
    choices:
      - Back to investigation hub -> investigation_hub

