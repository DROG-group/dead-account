entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN CLOS-DE-BRENNE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to ClosDeBrene.social — the community Mastodon instance for
      the village of Clos-de-Brenne, Berry, central France.

      The local feed is heavy today. Something has happened in the valley.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice one name in every other post:
      @margaux_dubois.

      A goat cheese maker. Ran the Ferme du Pré Vert. Her crottins won
      prizes. She was part of the landscape here. People are devastated.

      She was found dead two days ago. In the stream behind her farm.
      The gendarmerie says accidental drowning.
    choices:
      - Look at her profile -> margaux_profile

  margaux_profile:
    type: tweet
    from: margaux
    text: "Les chèvres ne boivent plus au ruisseau. L'eau sent le chimique depuis des semaines. J'ai fait des analyses. Les résultats sont là. Qui veut voir?"
    choices:
      - That's her last real post... -> grey_photo

  grey_photo:
    type: message
    text: >
      A day after that post, her account uploaded a single image:
      a blurry photo of her goats in the fog. Shot at dawn. No caption.
      No hashtags. Nothing like her usual posts.

      Her friends say she would never post without a story. The gendarmerie
      says she slipped on the muddy bank. Something doesn't add up.
    choices:
      - Read the gendarmerie statement -> gendarmerie_statement
      - Look at what people are saying -> community_reaction

  gendarmerie_statement:
    type: tweet
    from: gendarme
    text: >
      Nous avons constaté le décès d'une résidente de Clos-de-Brenne.
      Les premiers éléments indiquent une noyade accidentelle. L'enquête
      est en cours. Toute information peut être communiquée au 17 ou
      à la brigade.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are furious. Her brother @lucien_dubois is in shock.
      Her best friend @camille_bertrand is calling it murder. The old
      farmer @raymond_perrin says the stream has been poisoned for months.
      The beekeeper @agnes_fournier says her hives are dying too.

      And the photographer @romain_lefevre, who moved to the village
      two years ago, is posting tributes that feel... too intimate.

      Nobody buys the gendarmerie's accidental drowning line. Margaux
      knew that stream her whole life. She didn't slip.
    effects: { trust_lucien: "+5", trust_camille: "+5" }
    choices:
      - Start following Margaux's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Clos-de-Brenne. Follow Margaux's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Nadine (auberge owner, knows everyone) -> nadine_intro
      - Talk to Raymond (old farmer, knows the land) -> raymond_intro
      - Talk to Enzo (teen, seems angry) -> enzo_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes grief about Margaux with the rhythms of a rural
      village: market schedules, hunting season reminders, the bakery's
      daily specials, rain forecasts.

      Key names surface: Lucien (her brother, carpenter), Camille (best
      friend, schoolteacher), Baptiste (her ex, winemaker), and the
      teens — Enzo, Yasmine, Dylan — who loved visiting the farm.

      Also prominent: AgriVal Centre SA, the agrochemical company whose
      facility sits two kilometres upstream from Margaux's farm. Their
      posts are corporate PR about "sustainable agriculture." Margaux's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Nadine -> nadine_intro
      - Talk to Raymond -> raymond_intro
      - Talk to Enzo -> enzo_intro

  # --- Nadine (social map) ---

  nadine_intro:
    type: tweet
    from: nadine
    text: >
      L'auberge sera fermée ce soir. Je n'ai pas le cœur à cuisiner.
      @margaux_dubois, ton fromage sera toujours sur ma carte. Toujours.
    effects: { trust_nadine: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Nadine -> nadine_talk

  nadine_talk:
    type: message
    text: >
      NADINE: Ah, vous êtes nouveau? Welcome. Terrible timing. The
      whole village is in pieces over Margaux.

      Let me tell you who's who. Lucien is her brother — carpenter, lives
      on the other side of the valley. Sweet man, completely destroyed.
      Camille is her best friend, teaches at the school. They grew up
      together.

      Baptiste Morel — he's her ex. They split up a year ago but stayed
      friendly. He's a winemaker, organic, good guy. Margaux used to
      supply cheese for his wine tastings.

      Then there's Romain Lefèvre. A photographer. Moved here two years
      ago. He's been... very attentive to Margaux. Always at the farm
      taking pictures of the goats, he said. But Camille told me Margaux
      was getting uncomfortable with him.

      And AgriVal Centre — putain, don't get me started. That factory
      has been poisoning the valley and nobody does a thing.
    effects: { trust_nadine: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Romain -> nadine_romain
      - Ask about AgriVal -> nadine_agrival
      - Thank her and move on -> quest1_hub

  nadine_romain:
    type: message
    text: >
      NADINE: Romain? He turned up two years ago from Paris. Said he
      wanted to photograph wildlife. Fair enough — the Brenne is full
      of birds and deer. But pretty quickly he started spending all
      his time at Margaux's farm.

      Said the goats were photogenic. Maybe. But then it was showing
      up at the market when she had a stall. At the auberge when she
      was eating. At the fête du village right next to her.

      Margaux told me once, "He doesn't understand when I say I want
      to be alone." I said she should tell him more firmly. She said
      she had. Three times.
    effects: { trust_nadine: "+5" }
    choices:
      - Ask about AgriVal -> nadine_agrival
      - Move on -> quest1_hub

  nadine_agrival:
    type: message
    text: >
      NADINE: AgriVal Centre. They make pesticides, herbicides, all
      kinds of chemicals. Their factory is upstream from half the farms
      in the valley. For years, the farmers have complained — dead fish
      in the stream, strange smells, goats getting sick.

      Margaux's goats started refusing to drink from the stream six
      months ago. Animals know. She got the water tested privately.
      Heavy metals, pesticide residues — way above the norms.

      She was going to make it public. She had a meeting with a
      journalist from La Nouvelle République. Then she turned up dead
      in the stream.

      Noyade accidentelle, mon cul.
    effects: { trust_nadine: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Raymond (the land, witness tease) ---

  raymond_intro:
    type: tweet
    from: raymond
    text: >
      cinquante ans que je travaille cette terre. le ruisseau du pré
      vert a jamais tué personne. c'est pas l'eau qui l'a tuée.
      c'est ceux qui ont empoisonné l'eau.
    effects: { trust_raymond: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Raymond -> raymond_talk

  raymond_talk:
    type: message
    text: >
      RAYMOND: I've farmed this valley since I was fourteen. I know
      every field, every spring, every path. The stream behind
      Margaux's farm is shallow — knee-deep at most. You don't
      drown in that stream. You'd have to be held down.

      I've been telling the maire about the water for years. The
      fish died first. Then the frogs. Then the bees — ask Agnès,
      she's lost half her hives. The goats stopped drinking. Margaux
      measured it all. She was building a case.

      She called me the week before she died. Said she had proof
      that AgriVal was dumping at night, directly into the stream.
      Not through the official treatment system. Raw chemical waste.
    effects: { trust_raymond: "+10" }
    choices:
      - Did you see anything unusual recently? -> raymond_night
      - Move on -> quest1_hub

  raymond_night:
    type: message
    text: >
      RAYMOND: Two nights before they found her — I was out checking
      my fences around midnight, the deer have been getting in. And
      I saw headlights on the track that runs along the stream. A van.
      No markings. Heading toward the AgriVal outflow point.

      At midnight. On a farm track. That van had no business being
      there.

      I told the gendarmes. They wrote it down. That was it.
    effects: { trust_raymond: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Enzo (teen, angry) ---

  enzo_intro:
    type: tweet
    from: enzo
    text: >
      putain frr margaux elle est morte et les flics disent qu'elle
      s'est noyée?? dans 30cm d'eau?? c'est quoi ce délire.
      si qqn sait un truc faut parler bordel
    effects: { trust_enzo: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Enzo -> enzo_talk_early

  enzo_talk_early:
    type: message
    text: >
      ENZO: t'es qui toi? nouveau dans le bled? merde c pas le bon
      moment frr. margaux c'était genre la meuf la plus gentille du
      village. elle me laissait conduire le tracteur quand j'étais
      petit. ses fromages c'était les meilleurs putain.

      et la on vient me dire noyade accidentelle. nique sa mère.
      30cm d'eau. t'as déjà vu qqn se noyer dans 30cm d'eau??

      en vrai yasmine elle a vu un truc chelou mais elle flippe
      trop d'en parler. le gars là, le photographe, il était
      bizarre ces derniers temps
    effects: { trust_enzo: "+10" }
    choices:
      - What did Yasmine see? -> enzo_yasmine_hint
      - Move on -> quest1_hub

  enzo_yasmine_hint:
    type: message
    text: >
      ENZO: jsp exactement. elle était en rando vers la ferme de
      margaux et elle a vu le photographe — romain — genre planqué
      dans les buissons avec son appareil. pas en train de
      photographier les oiseaux hein. il matait la ferme.

      elle l'a dit à personne sauf à moi pcq tout le monde trouve
      romain trop sympa avec ses photos de nature ptdr. mais frr
      un mec qui se planque dans les buissons c'est pas normal sah.

      faut que tu parles à yasmine directement mais elle est méfiante
      avec les gens qu'elle connaît pas. montre-lui que t'es sérieux
    effects: { trust_enzo: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Clos-de-Brenne. A Berry village
      built around the land and the stream. A goat cheese maker who
      was exposing pollution. A death nobody believes is accidental.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Lucien (Margaux's brother) -> lucien_q1
      - Talk to Camille (Margaux's best friend) -> camille_q1
      - Check what Baptiste (Margaux's ex) is saying -> baptiste_q1
      - I'm ready to investigate the night she died -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lucien Q1 ---

  lucien_q1:
    type: tweet
    from: lucien
    text: >
      ma sœur avait peur. elle me l'a dit. elle avait peur et j'ai
      rien fait. si quelqu'un sait quelque chose dites-le. je vous
      en supplie.
    effects: { trust_lucien: "+5", contacts_followed: "+1" }
    choices:
      - DM Lucien -> lucien_q1_talk

  lucien_q1_talk:
    type: message
    text: >
      LUCIEN: Thank you for reaching out but I don't know you. Margaux
      had a lot of friends here. Good people. I'm... I can't think
      straight.

      She was my little sister. She made the best cheese in the Berry.
      She loved her goats more than most people love their children.

      [Lucien is devastated. You'll need to build more trust before
      he opens up.]
    effects: { trust_lucien: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Camille Q1 ---

  camille_q1:
    type: tweet
    from: camille
    text: >
      @margaux_dubois ne s'est pas noyée. c'est impossible. elle
      connaissait ce ruisseau par cœur. elle y allait tous les jours
      avec les chèvres. ON NE SE NOIE PAS DANS 30CM D'EAU.
    effects: { trust_camille: "+5", contacts_followed: "+1" }
    choices:
      - DM Camille -> camille_q1_talk

  camille_q1_talk:
    type: message
    text: >
      CAMILLE: You're new. Okay. Let me be clear: Margaux was murdered.
      I don't care what the gendarmes say. I grew up with her. She
      could cross that stream blindfolded.

      She called me the night before she died. She was scared. She said
      "they know I have the analyses" and "he won't stop coming to the
      farm." I asked who. She said "I'll tell you tomorrow."

      There was no tomorrow.
    effects: { trust_camille: "+10" }
    choices:
      - Who are "they" and "he"? -> camille_theory
      - Move on -> quest1_hub

  camille_theory:
    type: message
    text: >
      CAMILLE: "They" is AgriVal. Has to be. She had water analyses
      proving they were dumping pesticide waste directly into the
      stream. She was going public with a journalist.

      "He" — I think she meant Romain Lefèvre. That photographer.
      He's been obsessed with her since he arrived. She told him
      she wasn't interested. Multiple times. He just kept showing
      up at the farm. Always with an excuse — photographing wildlife,
      bringing a book, offering to fix something.

      Margaux told me last month: "Il me fait flipper." That's not
      something she says lightly.
    effects: { trust_camille: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Baptiste Q1 ---

  baptiste_q1:
    type: tweet
    from: baptiste
    text: >
      on s'était séparés mais margaux restait ma meilleure amie. son
      fromage sur ma table, ses rires dans ma cave pendant les
      vendanges. c'est fini. c'est fini et personne ne fait rien.
    effects: { trust_baptiste: "+5", contacts_followed: "+1" }
    choices:
      - DM Baptiste -> baptiste_q1_talk

  baptiste_q1_talk:
    type: message
    text: >
      BAPTISTE: Who are you? Another person who's going to tell me
      to be patient? My ex-girlfriend is dead and the gendarmerie
      says she fell in a stream.

      Margaux was the toughest person I know. She built that farm
      from nothing. She milked thirty goats every morning at 5am.
      She didn't slip on a muddy bank.

      She told me two weeks ago that someone from AgriVal had come
      to the farm. Threatened her. Said if she published those water
      analyses, they'd make sure her AOP certification was revoked.
      She laughed them off. She wasn't the laughing type.
    effects: { trust_baptiste: "+10" }
    choices:
      - Did she mention anyone else? -> baptiste_romain
      - Move on -> quest1_hub

  baptiste_romain:
    type: message
    text: >
      BAPTISTE: Yeah. That photographer. Romain. I ran into him at the
      farm once — I'd gone to drop off some wine bottles for Margaux.
      He was just sitting there, in his car, parked on the track
      overlooking the goat pasture. Engine off. Camera on the
      passenger seat.

      I asked what he was doing. He said "waiting for the light."
      At 8pm. In November. There was no light.

      Margaux asked me not to make a scene. She said she'd handle it.
      That was a month before she died.
    effects: { trust_baptiste: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Margaux died. Multiple people saw
      or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Yasmine (was near the farm that evening) -> yasmine_interview
      - Find Raymond (old farmer, checks fences at night) -> raymond_interview
      - Find Florence (baker, starts at 5am, saw something) -> florence_interview
      - Find Agnès (beekeeper, hives near the stream) -> agnes_interview

  # --- Yasmine (saw Romain hiding near the farm) ---

  yasmine_interview:
    type: tweet
    from: yasmine
    text: >
      j'arrive plus à dormir. j'aurais du dire quelque chose avant.
      maintenant c'est trop tard. margaux...
    effects: { trust_yasmine: "+5" }
    choices:
      - Ask Yasmine about that evening -> yasmine_talk

  yasmine_talk:
    type: message
    text: >
      YASMINE: ok mais stp tu le répètes pas comme ça hein. j'étais
      en rando photo vers la ferme de margaux genre vers 18h. et j'ai
      vu romain le photographe. il était pas sur le chemin. il était
      dans les fourrés, genre accroupi, avec un gros téléobjectif
      braqué sur la maison de margaux.

      quand il m'a vue il a fait genre il photographiait un oiseau
      mais putain y'avait aucun oiseau c'était le soir.

      c'est quoi ce délire. c'est pas normal son truc. et moi j'ai
      rien dit pcq c'est un adulte et tout le monde le trouve sympa.
      merde. j'aurais du parler.
    effects:
      trust_yasmine: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Raymond (saw van near outflow point at night) ---

  raymond_interview:
    type: tweet
    from: raymond
    text: >
      encore des traces de pneus sur le chemin du ruisseau ce matin.
      des pneus de camionnette. pas d'un tracteur. quelqu'un vient
      la nuit et c'est pas pour pêcher.
    effects: { trust_raymond: "+5" }
    choices:
      - Ask Raymond what he saw -> raymond_talk_night

  raymond_talk_night:
    type: message
    text: >
      RAYMOND: That night — the night Margaux died — I was out at
      midnight checking fences. I saw the same van I'd seen before.
      No markings. Heading down the track toward the stream, near
      the AgriVal discharge point.

      But this time I got closer. I saw two men unloading drums.
      Big plastic drums, the kind you store chemicals in. They were
      pouring them directly into the stream. At midnight.

