  # --- Farm Records ---

  farm_records:
    type: message
    text: >
      Margaux kept meticulous records. Her farm blog, still public,
      shows water quality data she'd collected over six months. pH
      levels, heavy metals, pesticide residues. All from the stream
      that runs past her goat pasture.

      The numbers tell a story: spikes in contamination that match
      AgriVal's production schedule. Higher on weekdays, lower on
      weekends. Higher at night — she'd installed an automatic
      sampler.

      Her last blog entry, two days before her death: "I have six
      months of data. The pattern is undeniable. Meeting with
      @marianne_vasseur on Thursday. This ends now."

      Thursday was the day after she died.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue -> corruption_hub

  # --- Marianne ---

  marianne_interview:
    type: message
    text: >
      MARIANNE: I don't discuss my sources.
    effects: { trust_marianne: "+5" }
    choices:
      - Show Marianne the evidence you have -> marianne_with_evidence
        when:
          state: corporate_evidence
          gte: 3
      - Back to corporate thread -> corruption_hub

  marianne_with_evidence:
    type: message
    text: >
      MARIANNE: ...you have more than the gendarmerie.

      Okay. Margaux and I were working on a story. She had six months
      of water data. She had photos of the illegal discharge point —
      AgriVal has a pipe that doesn't appear on any permit, hidden
      under a bridge two hundred metres from the official outflow.

      We were going to publish on Thursday. She died on Wednesday.

      The day after she died, someone broke into my car at the paper's
      parking lot in Châteauroux. Took my laptop bag. Which had my
      backup of her data.

      But Margaux was clever. She told me she'd hidden a second copy
      somewhere in the village. She didn't say where. She said "if
      something happens, someone will bring it to you."
    effects:
      trust_marianne: "+25"
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
