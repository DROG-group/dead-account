# DEAD ACCOUNT — Story 099: Paprikafalva (Hungary)
# A TactCheck Gamepatch Scenario
# Import: bin/gamepatch import story-099.yml
#
# Player investigates the disappearance of paprika farmer Zsófia Tóth
# in the fictional Southern Great Plain village of Paprikafalva.

