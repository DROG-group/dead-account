      evidence_total: "+1"
    choices:
      - Check the writing style -> zoltan_style

  zoltan_style:
    type: message
    text: >
      Comparing @zoltan_farkas with @tamas_varga:

      Same use of agricultural terminology. Same Hungarian spelling
      habits — the specific way he abbreviates technical terms.
      Same knowledge of Zsófia's field work that only a neighbouring
      farmer would have.

      And one post from @zoltan_farkas: "A 7-es parcellán gyönyörű
      volt a termés." Parcel 7 is an internal co-op designation.
      Not public.

      It's Tamás. The anonymous account is Tamás.
    effects:
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # --- Noémi ---

  noemi_interview:
    type: message
    text: >
      NOÉMI: Zsófi hagyott nálam valamit. Egy lezárt vízálló
      dobozt. Azt mondta, "ha valaki a Tisza-ág melletti
      szennyezésről kérdez, add oda nekik ezt."

      Ijedt volt. Mondta, hogy mindent lemásolt, de kell egy
      példány külső helyen, ahova senki nem gondolna. Egy
      könyvtár tökéletesnek tűnt.
    effects: { trust_noemi: "+10" }
    choices:
      - What's in the case? -> noemi_case

  noemi_case:
    type: message
    text: >
      Noémi a pult alól előhúz egy vízálló Pelican dobozt.

      NOÉMI: Mondta, hogy jössz. Vidd.

      Inside: a USB drive and a set of printed photographs. The
      photos show a discharge pipe — not the official outlet,
      but a second, hidden outfall — and barrels on the
      riverbed. The USB drive contains water sample data, chemical
      analysis, and Zsófia's detailed report.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Törzsőrmester Deák ---

  rendor_interview:
    type: message
    text: >
      TÖRZSŐRMESTER DEÁK: Nem hivatalosan — és úgy értem, teljesen
      nem hivatalosan — ki akartam vizsgálni a DunaAgrót. A
      felettesem azt mondta, álljak le. Azt mondta, a hatóságnak
      van "illetékessége." Ez annyit jelent: ne nyúlj hozzá.

      A Varga-ügyről nem is tudtam eddig. Ha van bizonyítékod
      zaklatásra, azzal foglalkozhatok. Az egyértelműen az én
      illetékességem.

      Hozz valami szilárdat és újranyitom az ügyet.
    effects:
      trust_rendor: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Zsófia than anyone in Paprikafalva. Who is responsible?
    choices:
      - Confront Tamás Varga (the obsessive neighbour) -> confront_tamas
        when:
          state: obsession_evidence
          gte: 5
      - Confront Attila Barna (the plant director) -> confront_attila
        when:
          state: corporate_evidence
          gte: 3
      - Confront Mayor Kovács (political protection) -> confront_laszlo
      - I need more evidence -> investigation_hub

  # --- ENDING A: Tamás (Best Ending) ---

  confront_tamas:
    type: message
    text: >
      You present your evidence to Tamás:

      "I know @zoltan_farkas is your account. I know you put a GPS
      tracker on Zsófia's car. I know you accessed her files at the
      co-op. I know you were watching her house. I have witnesses and
      I have the access logs."
    choices:
      - Send -> tamas_response

  tamas_response:
    type: message
    text: >
      Tamás doesn't reply for a long time. Then:

      TAMÁS: Nem érted. Megvédtem őt. Veszélyben volt a DunaAgro
      miatt, és nem hagyta, hogy segítsek. Tudnom kellett, hogy
      biztonságban van. Mindent azért tettem, mert törődöm vele.

      That's not caring. That's obsession.

      You've already sent the evidence to Törzsőrmester Deák. And to
      Csaba Kertész.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Törzsőrmester Deák reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the access logs, the
      witness testimonies — Tamás is arrested for stalking and
      harassment. A GPS tracker is recovered from under Zsófia's
      car at the old fishing huts by the river.

      Csaba Kertész, finally in possession of Zsófia's full evidence
      package, publishes the DunaAgro story in HVG. The authorities
      order an unannounced inspection. The plant is shut down
      pending environmental remediation. Attila Barna faces criminal
      charges for falsifying discharge reports.

      And Zsófia Tóth, reading the story from a friend's flat in
      Kecskemét, calls her brother for the first time in nine days.

      "Hazamegyek."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: zsofia
    text: >
      a föld nem hazudik. és paprikafalva emberei sem.
      köszönöm, hogy nem adtátok fel.
    choices:
      - The End -> game_complete

  # --- ENDING B: Attila (Partial Ending) ---

  confront_attila:
    type: message
    text: >
      You present the pollution evidence to Attila Barna:

      "I have photographs of the undeclared discharge pipe. I have
      water samples showing heavy metal levels ten times the legal
      limit. I have the original lab reports showing the data was
      falsified. I have the barrel with your batch number."
    choices:
      - Send -> attila_response

  attila_response:
    type: message
    text: >
      ATTILA: Ezt a beszélgetést továbbítom a jogi osztályunknak.
      Bármilyen rágalmazó anyag nyilvánosságra hozása azonnali
      jogi eljárást von maga után. A DunaAgro mindig a hatósági
      előírásoknak megfelelően működött.

      But it's too late. You've sent the evidence to Csaba, to
      the Gazdakör, and to the environmental authorities.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. DunaAgro is ordered to halt
      discharge pending investigation. The plant may close. Two
      hundred jobs hang in the balance. The village is divided.

      But Zsófia?

      Without the stalking evidence, Tamás is never investigated.
      He continues to work next to her fields. He continues to
      monitor her accounts. He creates a new anonymous profile.

      Three months later, Zsófia reads about DunaAgro online.
      She returns quietly. She changes her work schedule. She
      stops walking to the fields alone. She checks her car
      every morning.

      The corporation is exposed. But the person who terrorised
      Zsófia walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: zsofia
    text: "hazajöttem. a víz tisztább. a többi... majd meglátjuk."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_laszlo:
    type: message
    text: >
      You confront Mayor Kovács with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> laszlo_response

  laszlo_response:
    type: tweet
    from: agnes
    text: >
      Ügyfelünk tudomásul veszi az Ön állításait. Rágalmazó
      tartalmak bármilyen nyilvánosságra hozása azonnali jogi
      eljárást von maga után. — Lakatos & Társai Iroda, Budapest
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Kovács and DunaAgro's dumping — and there isn't
      one beyond political protection — your evidence is
      insufficient.

      DunaAgro continues to operate. Tamás continues to watch.
      Zsófia stays in hiding.

      Six months later, @zoltan_farkas creates a new account. It
      follows Zsófia's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: PAPRIKAFALVA — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Zsófia's story explores themes of
      corporate impunity, environmental crime, obsessive behaviour,
      community solidarity, and the courage to speak up.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      NANE Segélyvonal (nők elleni erőszak): 06-80-505-101
      Kék Vonal (gyermek- és ifjúságvédelem): 116-111
      Környezeti szennyezés bejelentése: 06-80-201-301
