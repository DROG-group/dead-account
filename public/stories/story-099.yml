entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN PAPRIKAFALVA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Paprikafalva.social — the community Mastodon instance for
      the Southern Great Plain village of Paprikafalva, Hungary.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @zsofia_toth.

      A paprika farmer. Photographer of the Alföld landscape. She
      documented the land and the water. People are worried. She
      hasn't posted in five days.
    choices:
      - Look at her profile -> zsofia_profile

  zsofia_profile:
    type: tweet
    from: zsofia
    text: "A Tisza-ág mellett a talajvíz bűzlik. Valaki szándékosan szennyez. Van bizonyítékom."
    choices:
      - That's her last real post... -> red_dust

  red_dust:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a blurry photo of a paprika field at dusk. Overexposed, tilted,
      shot from a strange angle. Posted at 2am. No caption.

      Her friends say that's not her style. The police say she probably
      went to visit relatives. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: rendor
    text: >
      Bejelentést kaptunk egy paprikafalvai lakos eltűnéséről.
      Jelenlegi ismereteink szerint bűncselekmény elkövetésére utaló
      jel nem merült fel. Információval rendelkezők hívják a 107-es
      számot vagy forduljanak az őrsre.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @reka_molnar is
      desperate. Her brother @bence_toth is driving down from Szeged.
      Her neighbour @tamas_varga is posting worried messages.
      The fisherman @janos_horvath says she was right about the water.

      And the journalist @csaba_kertesz is strangely silent.

      Nobody buys the police line. Nobody thinks Zsófia just
      "went to visit relatives."
    effects: { trust_reka: "+5", trust_bence: "+5" }
    choices:
      - Start following Zsófia's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Paprikafalva. Follow Zsófia's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Erzsébet (tavern owner, knows everyone) -> erzsebet_intro
      - Talk to János (fisherman, saw the water) -> janos_intro
      - Talk to Petra (teen rider, seems shaken) -> petra_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Zsófia with the rhythms of a small
      Alföld village: harvest schedules, the bakery's daily specials,
      weather warnings about the heat.

      Key names surface: Réka (best friend, nurse), Tamás (neighbour
      farmer, seems rattled), Csaba (journalist, oddly quiet),
      and the teens — Petra, Máté, Dorka — who loved Zsófia's
      paprika work and photography.

      Also prominent: DunaAgro Kft., the agribusiness plant at the
      edge of the village. Their posts are corporate PR. Zsófia's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Erzsébet -> erzsebet_intro
      - Talk to János -> janos_intro
      - Talk to Petra -> petra_intro

  # --- Erzsébet (social map) ---

  erzsebet_intro:
    type: tweet
    from: erzsebet
    text: >
      A csárda nyitva van, de az én szívem nem. @zsofia_toth,
      a te asztalod vár. Gyere haza.
    effects: { trust_erzsebet: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Erzsébet -> erzsebet_talk

  erzsebet_talk:
    type: message
    text: >
      ERZSÉBET: Új vagy itt? Isten hozott. Szörnyű időben érkeztél.
      Mindenki ki van akadva Zsófi miatt.

      Hadd meséljek, ki kicsoda. Réka a legjobb barátnője — a
      rendelőben dolgozik védőnőként. Édes lány, most össze van
      törve. Tamás Varga a szomszéd gazda, agrármérnök, zsófi
      földjei mellett dolgozik. Okos ember, de... túl sokat
      foglalkozik Zsófival. Bence a bátyja, Szegedről jön le.

      És Csaba Kertész — az újságíró — ő és Zsófi dolgoztak
      valamin együtt. Valami a vízzel kapcsolatban. Csaba egy szót
      sem szólt, mióta Zsófi eltűnt. Ez nem jellemző rá.

      Ja, és a DunaAgro PR-posztjait ne olvasd. Hazugság
      ISO-tanúsítványba csomagolva.
    effects: { trust_erzsebet: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Tamás -> erzsebet_tamas
      - Ask about DunaAgro -> erzsebet_dunaagro
      - Thank her and move on -> quest1_hub

  erzsebet_tamas:
    type: message
    text: >
      ERZSÉBET: Tamás? Két éve gazdálkodik Zsófi mellett. Ügyes
      mérnök. De mióta Zsófi ideköltözött, azóta... mintha
      keringene körülötte. A csárdában mindig ott volt, amikor ő
      is. Felajánlotta, hogy segít minden projektben. Zsófi
      udvarias volt, de láttam rajta, hogy kényelmetlenül érzi
      magát.

      Miután elkezdte a szennyezési vizsgálatot, Tamás még rosszabb
      lett. Mindenbe bele akart szólni. Zsófi egyszer mondta nekem:
      "Nem fogadja el a nemet." Azt hittem, szakmailag érti. Most
      már nem vagyok benne biztos.
    effects: { trust_erzsebet: "+5" }
    choices:
      - Ask about DunaAgro -> erzsebet_dunaagro
      - Move on -> quest1_hub

  erzsebet_dunaagro:
    type: message
    text: >
      ERZSÉBET: Az üzem a 90-es évek óta ott van. Műtrágyát
      gyártanak, növényvédő szereket, miegymást. A falu eltűrte,
      mert munkát adott. De a halászok évek óta panaszkodnak —
      furcsa szín a vízben a kifolyó csőnél, döglött halak a
      Tisza-ágban.

      Zsófi volt az első, aki tényleg lement oda mintákat venni
      és lefotózni. Volt bizonyítéka, azt mondta. Igazi bizonyítéka.
      Két hét múlva eltűnt.
    effects: { trust_erzsebet: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- János (the water, witness tease) ---

  janos_intro:
    type: tweet
    from: janos
    text: >
      harmincöt éve halászok itt. a víz nem az, ami volt.
      @zsofia_toth igazat mondott. és most eltűnt.
      kössétek össze a szálakat.
    effects: { trust_janos: "+5", contacts_followed: "+1" }
    choices:
      - Reply to János -> janos_talk

  janos_talk:
    type: message
    text: >
      JÁNOS: Tizenöt éves korom óta halászok ezen a Tisza-ágon.
      Ismerem minden áramlatát, minden színét. És mondom neked —
      a víz a kifolyó csőnél nem normális. Hónapok óta. A hálóm
      tele van döglött rákokkal. A meder vegyszer szagú.

      Zsófi vízmintákat vett. Lefényképezte a kifolyó csövet.
      Mindent dokumentált. Ügyet épített. Aztán bumm — eltűnt.

      Szerinted ez véletlen? Én nem hiszek a véletlenben a
      folyón.
    effects: { trust_janos: "+10" }
    choices:
      - Did you see anything unusual recently? -> janos_night
      - Move on -> quest1_hub

  janos_night:
    type: message
    text: >
      JÁNOS: Az éjjel, mielőtt eltűnt — éjszakai horgászatból
      jöttem haza, éjfél körül. Láttam, hogy világos van a
      gazdaszövetkezet irodájában. Ez nem szokatlan, a gazdák
      későn dolgoznak. De két autó állt a parkolóban. Az egyik
      Zsófi kis kék Suzukija. A másik egy fekete céges autó
      DunaAgro rendszámmal.

      Éjfélkor. A gazdaszövetkezet irodájában.

      Akkor nem gondoltam rá sokat. Most folyton ezen járt
      az eszem.
    effects: { trust_janos: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Petra (teen rider, witness tease) ---

  petra_intro:
    type: tweet
    from: petra
    text: >
      bazmeg mondjátok hogy nem igaz @zsofia_toth ő tanított meg
      a paprikáról meg az alföldről mindent. nem lehet hogy csak
      úgy eltűnt. ha valaki tud vmit szóljon már légyszi
    effects: { trust_petra: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Petra -> petra_talk_early

  petra_talk_early:
    type: message
    text: >
      PETRA: mi a fasz te új vagy itt? hát szar időben jöttél.
      amúgy zsófi tényleg a legkirályabb ember ebben a faluban.
      megtanított nekünk mindent a földről, a paprikáról, elvitt
      minket a Tiszához fotózni. nagyon menő volt.

      és most ki vagyok akadva mert máté látott vmi furát az
      este a szövetkezetnél de nem akar róla beszélni. azt mondja
      semmi de... nem semmi az bazmeg
    effects: { trust_petra: "+10" }
    choices:
      - What did Máté see? -> petra_mate_hint
      - Move on -> quest1_hub

  petra_mate_hint:
    type: message
    text: >
      PETRA: nemtom pontosan. motorozott a szövetkezet mellett
      és látta hogy vki turkált zsófi autójában?? vagy vmi
      ilyesmi. szarik az egésztől nem akar beszélni róla.
      kérdezd meg tőle direkt de ne gyere neki erősen mert
      besokallt. inkább horgászatról meg motorról dumálj
      vele előbb geci
    effects: { trust_petra: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Paprikafalva. A Southern Great Plain
      village built around paprika farming and the river. A farmer who
      was exposing pollution. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Réka (Zsófia's best friend) -> reka_q1
      - Talk to Tamás (Zsófia's neighbour) -> tamas_q1
      - Check what Bence (Zsófia's brother) is saying -> bence_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Réka Q1 ---

  reka_q1:
    type: tweet
    from: reka
    text: >
      ha vkinek van híre @zsofia_toth-ról hívjon légyszi.
      a szobája érintetlen. a fényképezőgépe itt van. soha nem
      ment volna el a gépe nélkül.
    effects: { trust_reka: "+5", contacts_followed: "+1" }
    choices:
      - DM Réka -> reka_q1_talk

  reka_q1_talk:
    type: message
    text: >
      RÉKA: Kösz, hogy írsz, de nem ismerlek. Zsófinak sok barátja
      van itt. Biztos vagyok benne, hogy visszajön.

      ...Ezt mondogatom. Már nem hiszem.

      [Réka zárkózott. Több bizalomra van szükséged, mielőtt
      megnyílna.]
    effects: { trust_reka: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tamás Q1 ---

  tamas_q1:
    type: tweet
    from: tamas
    text: >
      Az iroda üres @zsofia_toth nélkül. A talajmintái még a
      hűtőben vannak. A naplója az asztalán. Soha nem hagyná itt
      a folyamatban lévő munkáját. Történt valami.
    effects: { trust_tamas: "+5", contacts_followed: "+1" }
    choices:
      - DM Tamás -> tamas_q1_talk

  tamas_q1_talk:
    type: message
    text: >
      TAMÁS: Zsófival több mint egy éve dolgozunk egymás mellett.
      Ő a legelkötelezettebb gazda, akit ismerek. Ez a szennyezési
      vizsgálat — minden volt neki. Adatai voltak, fotói, vegyészeti
      elemzések. Közel állt ahhoz, hogy nyilvánosságra hozza.

      Felajánlottam, hogy segítek. Sokszor. Azt mondta, kézben
      tartja. Mondta, hogy egy újságíróval dolgozik együtt. Csak
      támogatni akartam.

      [Tamás őszintének tűnik. Vagy megszállottnak?]
    effects: { trust_tamas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Bence Q1 ---

  bence_q1:
    type: tweet
    from: bence
    text: >
      a húgom ELTŰNT és a rendőrség azt mondja talán elment
      rokonokhoz??? NEM MEGY EL SZÓLÁS NÉLKÜL SEHOVA. megyek le
      szegedről. valaki el fogja magyarázni mi a fasz történt.
    effects: { trust_bence: "+5", contacts_followed: "+1" }
    choices:
      - DM Bence -> bence_q1_talk

  bence_q1_talk:
    type: message
    text: >
      BENCE: Ki vagy te? Még egy ember abból a faluból, aki azt
      fogja mondani, hogy nyugodjak le? A húgom hívott az éjjel,
      mielőtt eltűnt. Azt mondta, van valami nagy dolog. Azt mondta,
      "ha történik valami, nézd meg a DunaAgrót." Aztán letette.

      Ez volt az utolsó, amit hallottam tőle.
    effects: { trust_bence: "+10" }
    choices:
      - What do you think happened? -> bence_theory
      - Move on -> quest1_hub

  bence_theory:
    type: message
    text: >
      BENCE: Szerintem bizonyítékot talált, hogy a DunaAgro mérgező
      hulladékot enged a folyóba, és elhallgattatták. De azt is
      gondolom, hogy az a fura szomszéd gazda — Tamás — többet
      tud, mint amennyit mond. Ahogy beszél róla... az nem csak
      szomszédi aggodalom. Az valami más.

      Zsófi hónapokkal ezelőtt mesélte, hogy valaki az irodájában
      turkált a fájljaiban. Azt hitte, semmiség. Én nem hiszem,
      hogy semmiség volt.
    effects: { trust_bence: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Zsófia went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Máté (was riding his motorbike near the co-op) -> mate_interview
      - Find Gábor (farm shop owner, works late) -> gabor_interview
