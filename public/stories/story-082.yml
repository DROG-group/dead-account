entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN KALKENBERG
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to kalkenberg.social — the community Mastodon instance for
      the hill village of Kalkenberg, South Limburg.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @jesse_vanhoof.

      A mural painter. Street artist. He turned Kalkenberg's old limestone
      walls into canvases — enormous, vivid murals that told the history
      of the village. People adored him. He hasn't posted in six days.
    choices:
      - Look at his profile -> jesse_profile

  jesse_profile:
    type: tweet
    from: jesse
    text: "nieuwe mural bijna af. de mergelgroeve vertelt zijn eigen verhaal. maar iemand wil dat verhaal stilhouden."
    choices:
      - That's his last real post... -> grey_wall

  grey_wall:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a grey wall. Blank limestone. No paint, no colour. Posted at 4am.
      No caption.

      His friends say that's not his style. Jesse never posted without a
      story. The politie says he probably went travelling. Something
      doesn't add up.
    choices:
      - Read the politie statement -> politie_statement
      - Look at what people are saying -> community_reaction

  politie_statement:
    type: tweet
    from: brigadier
    text: >
      Wij hebben een melding ontvangen betreffende een inwoner van
      Kalkenberg. Op dit moment zijn er geen aanwijzingen voor een
      misdrijf. Informatie kan worden gedeeld via 0900-8844 of het
      basisteam.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @lieke_willems is
      desperate. His brother @daan_vanhoof is driving down from Heerlen.
      His best friend @evi_coenen is posting worried messages. The old
      cave guide @joep_meertens says Jesse found something in the
      tunnels.

      And the journalist @roel_smeets is strangely silent.

      Nobody buys the politie's line. Nobody thinks Jesse just
      "went travelling."
    effects: { trust_lieke: "+5", trust_daan: "+5" }
    choices:
      - Start following Jesse's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Kalkenberg. Follow Jesse's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Bram (café owner, knows everyone) -> bram_intro
      - Talk to Wim (farmer, angry about the gravel mining) -> wim_intro
      - Talk to Noor (teen skater, seems upset) -> noor_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Jesse with the rhythms of a Limburg
      hill village: weather warnings, the bakery's vlaai of the day,
      cycling routes through the heuvels.

      Key names surface: Lieke (girlfriend, nurse), Evi (best friend,
      ceramicist, seems rattled), Roel (journalist, oddly quiet), and
      the teens — Noor, Thijs, Sanne — who idolised Jesse's street art.

      Also prominent: KalkGrind BV, the gravel mining company at the
      edge of town. Their posts are corporate PR. Jesse's murals were
      the opposite — one of them literally depicted a machine eating
      a hillside.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Bram -> bram_intro
      - Talk to Wim -> wim_intro
      - Talk to Noor -> noor_intro

  # --- Bram (social map) ---

  bram_intro:
    type: tweet
    from: bram
    text: >
      Café is open maar het voelt niet hetzelfde. @jesse_vanhoof, je
      kruk staat klaar jong. Kom terug.
    effects: { trust_bram: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Bram -> bram_talk

  bram_talk:
    type: message
    text: >
      BRAM: Ah, nieuw hier? Welkom. Kutmoment om aan te komen. Iedereen
      is gestrest over Jesse.

      Laat me je even bijpraten. Lieke is zijn vriendin — verpleegkundige
      in Maastricht, helemaal kapot nu. Evi Coenen is zijn beste vriendin,
      keramiste, heeft een atelier in de oude mergelgroeve. Daan is Jesse's
      oudere broer, komt uit Heerlen.

      En Roel Smeets — de journalist — hij en Jesse werkten ergens samen
      aan. Iets over de grindwinning. Roel heeft niks gezegd sinds Jesse
      weg is. Dat is niet normaal voor hem.

      Oh ja, en er was iemand die Jesse anoniem opdrachten gaf. Steeds
      grotere murals, steeds meer geld. Jesse vond het eerst vet maar de
      laatste weken werd het... raar. Dwingend.
    effects: { trust_bram: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the anonymous commissioner -> bram_commissioner
      - Ask about KalkGrind -> bram_kalkgrind
      - Thank him and move on -> quest1_hub

  bram_commissioner:
    type: message
    text: >
      BRAM: Ja man, dat was echt creepy. Jesse kreeg berichten via een
      anoniem account — @KunstPatron_LB — die hem opdrachten gaf. Eerst
      gewoon: "maak een mural van het dal," "schilder de oude mijn."
      Betaalde goed.

      Maar de laatste maanden werd het anders. Specifieke eisen. "Ik wil
      dat je dit gebouw schildert." "Ik wil dat je 's avonds werkt zodat
      niemand het ziet." En als Jesse nee zei, kwamen er dreigementen.
      Niet direct, meer zo van... "ik weet waar je atelier is."

      Jesse zei tegen me: "Die gast is niet goed in z'n hoofd." Maar hij
      bleef het geld aannemen. Kunstenaars moeten ook eten hè.
    effects: { trust_bram: "+5" }
    choices:
      - Ask about KalkGrind -> bram_kalkgrind
      - Move on -> quest1_hub

  bram_kalkgrind:
    type: message
    text: >
      BRAM: KalkGrind is al tien jaar bezig hier. Ze graven grind en
      kalksteen. Prima, banen zijn banen. Maar de laatste twee jaar
      graven ze steeds dieper. De mergelgrotten — die zijn eeuwen oud,
      cultureel erfgoed — worden aangetast. Scheuren in de wanden,
      gangen die instorten.

      Jesse schilderde een mural op de Oude Kerkstraat: een graafmachine
      die de heuvels opvrat, met de woorden "WIE GRAAFT ONS GRAF?"

      Twee weken later was de mural overgeschilderd. Door wie denk je?
      De gemeente. Wethouder Habets gaf de opdracht persoonlijk. En raad
      eens wie er in de Raad van Advies van KalkGrind zit? Stijn Habets.

      Godverdomme, het is zo doorzichtig.
    effects: { trust_bram: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Wim (farmer, witness tease) ---

  wim_intro:
    type: tweet
    from: wim
    text: >
      veertig jaar dat ik deze heuvels bewerk. de grond trilt nu van de
      machines. @jesse_vanhoof had gelijk. en nu is hij weg. trek je
      conclusies.
    effects: { trust_wim: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Wim -> wim_talk

  wim_talk:
    type: message
    text: >
      WIM: Ik boer hier al m'n hele leven. Appels, peren, kersen. Deze
      heuvels zijn vruchtbaar, altijd geweest. Maar sinds KalkGrind is
      begonnen met uitbreiden droogt de grond uit. Ze graven te diep.
      Het grondwater zakt.

      Jesse maakte foto's in de grotten. Scheuren die er vorig jaar nog
      niet waren. Hele gangen die zijn ingestort. Hij liet het me zien
      en ik zei: "Jong, dit is gevaarlijk, niet alleen voor de grotten
      maar voor het hele dorp."

      Hij zei dat hij bewijs aan het verzamelen was. Samen met die
      journalist. En toen — poef — weg.

      Denk je dat dat toeval is? Ik geloof niet in toeval.
    effects: { trust_wim: "+10" }
    choices:
      - Did you see anything unusual recently? -> wim_night
      - Move on -> quest1_hub

  wim_night:
    type: message
    text: >
      WIM: De avond voordat hij verdween — ik was laat op m'n land, de
      irrigatie checken. Rond middernacht. Ik zag licht in de oude
      mergelgroeve, bij Jesse's atelier. Niet raar, hij werkte vaak
      laat. Maar er stond een auto die ik niet kende. Donkere SUV.
      Geen nummerplaat die ik kon lezen.

      En er was nog iemand. Iemand die op de heuvel stond, richting
      het atelier keek. Gewoon stond. In het donker. Dat was pas echt
      tering eng.
    effects: { trust_wim: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Noor (teen skater, witness tease) ---

  noor_intro:
    type: tweet
    from: noor
    text: >
      ik ben echt nie oké rn. @jesse_vanhoof is gwn de beste persoon
      van dit hele kutkdorp en nu is ie weg?? als iemand iets weet
      sws dm me want dit kan echt nie
    effects: { trust_noor: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Noor -> noor_talk_early

  noor_talk_early:
    type: message
    text: >
      NOOR: lol wie ben jij? nieuw hier? kanker slecht moment om te
      komen. jesse is gwn de liefste gast ever. hij leerde ons spuiten
      — graffiti hè niet drugs lmao — en hij maakte van dit saaie dorp
      iets moois.

      en nu is ie weg en niemand doet er iets aan. de politie zegt
      "hij is vast op reis" maar echt nie man. jesse gaat niet zomaar
      weg zonder iets te zeggen.

      en thijs heeft iets gezien bij het atelier maar hij wil niet
      praten. hij zegt dat het niks is maar ik ken hem en het is sws
      niet niks.
    effects: { trust_noor: "+10" }
    choices:
      - What did Thijs see? -> noor_thijs_hint
      - Move on -> quest1_hub

  noor_thijs_hint:
    type: message
    text: >
      NOOR: weet ik niet precies. hij was aan het mountainbiken bij de
      groeve en hij zag iemand bij jesse's atelier die er niet hoorde.
      iemand die gwn fotos stond te maken van het atelier en van jesse's
      spullen. tering creepy.

      thijs flipte maar hij durft niks te zeggen want die persoon zag
      hem ook. probeer je eerst chill te doen over fietsen ofzo, anders
      klapt hij dicht. die gast vertrouwt niemand lol
    effects: { trust_noor: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Kalkenberg. A Limburg hill village
      built on limestone and old mining tunnels. A mural painter who
      was exposing the destruction of the caves. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Lieke (Jesse's girlfriend) -> lieke_q1
      - Talk to Evi (Jesse's best friend) -> evi_q1
      - Check what Daan (Jesse's brother) is saying -> daan_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lieke Q1 ---

  lieke_q1:
    type: tweet
    from: lieke
    text: >
      als iemand iets weet over @jesse_vanhoof bel me alsjeblieft. zijn
      atelier is onafgesloten. zijn verf staat er nog. zijn telefoon is
      uit. hij gaat NOOIT ergens heen zonder zijn telefoon.
    effects: { trust_lieke: "+5", contacts_followed: "+1" }
    choices:
      - DM Lieke -> lieke_q1_talk

  lieke_q1_talk:
    type: message
    text: >
      LIEKE: Ik waardeer het maar ik ken je niet. Jesse heeft veel
      vrienden hier. Ik weet zeker dat hij terugkomt.

      ...Ik blijf dat zeggen. Ik geloof het zelf niet meer.

      [Lieke is on guard. You'll need to build more trust before she
      opens up.]
    effects: { trust_lieke: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Evi Q1 ---

  evi_q1:
    type: tweet
    from: evi
    text: >
      Jesse's atelier in de groeve is leeg. Zijn schetsen liggen er
      nog. Zijn nieuwste ontwerp — half af — hangt aan de muur. Hij
      zou NOOIT een werk onafgemaakt achterlaten. Er is iets gebeurd.
    effects: { trust_evi: "+5", contacts_followed: "+1" }
    choices:
      - DM Evi -> evi_q1_talk

  evi_q1_talk:
    type: message
    text: >
      EVI: Jesse en ik delen dat atelier al drie jaar. Hij is er elke
      dag. ELKE dag. Ik ken niemand die zo gepassioneerd is.

      De laatste weken was hij gestrest. Die anonieme opdrachtgever
      stuurde steeds meer berichten. En hij had iets ontdekt in de
      grotten — scheuren, instortingen, bewijs dat KalkGrind te diep
      graaft. Hij was er samen met Roel mee bezig.

      Maar er was nog iets. Iemand volgde hem. Hij zei dat hij het
      gevoel had dat iemand hem in de gaten hield. Ik dacht dat hij
      paranoia was. Nu weet ik niet meer wat ik moet denken.

      [Evi seems genuine. Or is she hiding something?]
    effects: { trust_evi: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Daan Q1 ---

  daan_q1:
    type: tweet
    from: daan
    text: >
      mijn broer is VERDWENEN en de politie zegt dat hij misschien op
      vakantie is??? HIJ GAAT NIET OP VAKANTIE ZONDER HET TE ZEGGEN.
      ik kom uit heerlen. iemand gaat me uitleggen wat er is gebeurd.
    effects: { trust_daan: "+5", contacts_followed: "+1" }
    choices:
      - DM Daan -> daan_q1_talk

  daan_q1_talk:
    type: message
    text: >
      DAAN: Wie ben jij? Nog iemand die me gaat vertellen dat ik rustig
      moet blijven? Jesse belde me de avond voordat hij verdween. Hij
      zei dat hij iets groots had. Hij zei "als er iets gebeurt, kijk
      naar KalkGrind." En toen zei hij nog iets — "die opdrachtgever
      wordt steeds gekker."

      Dat is het laatste wat ik van hem gehoord heb.
    effects: { trust_daan: "+10" }
    choices:
      - What do you think happened? -> daan_theory
      - Move on -> quest1_hub

  daan_theory:
    type: message
    text: >
      DAAN: Ik denk twee dingen. Één: KalkGrind verwoest de grotten en
      Jesse had het bewijs. Die willen hem stil hebben. En twee: die
      anonieme opdrachtgever is een gestoord persoon die geobsedeerd is
      met Jesse's kunst.

      Jesse vertelde me maanden geleden dat die persoon wist waar hij
      woonde, waar hij werkte, welke routes hij fietste. Dat is geen
      normaal opdrachtgeverschap. Dat is stalking.

      En weet je wat me het meest bang maakt? Jesse zei: "Die gast kent
      details die ik nooit online heb gezet."
    effects: { trust_daan: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Jesse went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Thijs (was mountain biking near the quarry) -> thijs_interview
      - Find Joep (cave guide, heard something underground) -> joep_interview
      - Find Pieter (baker, starts at 5am, saw something) -> pieter_interview
      - Find Wim (farmer, was checking irrigation late) -> wim_interview_q2

  # --- Thijs (saw someone photographing the studio) ---

  thijs_interview:
    type: tweet
    from: thijs
    text: >
      tering goede session vandaag maar de vibe bij de groeve is gwn
      niet chill meer. idk man er klopt iets niet daar
    effects: { trust_thijs: "+5" }
    choices:
      - Ask Thijs about that evening -> thijs_talk

  thijs_talk:
    type: message
    text: >
      THIJS: oké maar je zegt dit tegen niemand hè. ik was aan het
      biken bij de groeve rond 18u en ik zag iemand bij jesse's
      atelier. niet jesse zelf, iemand anders. die persoon maakte
      foto's. van alles — de deur, de ramen, jesse's schetsen die
      buiten hingen.

      en toen pakte die gast een sleutel en ging NAAR BINNEN. alsof
      ie er gwn hoorde. ik schrok me kanker dood maar ik durfde niks
      te zeggen want die persoon keek mijn kant op.

      het was een vrouw. kort haar. ik kende haar niet maar ze leek
      echt nie normaal. wie doet dat sws. gwn iemands atelier
      binnenlopen.
    effects:
      trust_thijs: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Joep (cave guide, heard confrontation underground) ---

  joep_interview:
    type: tweet
