      Tessa Kuipers doesn't commission art. She latches onto artists.
      Studies them. Infiltrates their lives. And when they try to
      leave, she can't let go.

      She moved to Kalkenberg for Jesse. She built her life around
      his.
    effects:
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # --- Anke ---

  anke_interview:
    type: message
    text: >
      ANKE: Jesse heeft iets bij mij achtergelaten. Een waterdichte
      koffer. Hij zei: "als iemand vraagt naar de grotten, geef ze
      dit."

      Hij was bang. Hij zei dat hij kopieën had gemaakt van alles
      maar dat hij een set nodig had buiten zijn studio, ergens
      waar niemand zou zoeken. Een boekwinkel leek perfect.
    effects: { trust_anke: "+10" }
    choices:
      - What's in the caves? -> anke_case

  anke_case:
    type: message
    text: >
      Anke bukt achter de toonbank en haalt een waterdichte Pelican
      koffer tevoorschijn.

      ANKE: Hij zei dat je zou komen. Neem het mee.

      Erin: een USB-stick en een set geprinte foto's. De foto's tonen
      de schade aan de mergelgrotten — ingestorte gangen, gebarsten
      wanden, verwoeste middeleeuwse tekeningen. De USB bevat
      meetgegevens, geologische analyses, en Jesse's gedetailleerde
      rapport over illegale diepe winning door KalkGrind.

      En een document: de oorspronkelijke vergunning naast de
      werkelijke boordieptes. Het verschil is schokkend.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Brigadier de Graaf ---

  brigadier_interview:
    type: message
    text: >
      BRIGADIER DE GRAAF: Niet officieel — en ik meen het, volledig
      niet officieel — ik wilde KalkGrind onderzoeken. Mijn
      leidinggevende zei dat ik moest stoppen. Hij zei dat de provincie
      "jurisdictie" had. Dat is code voor "blijf ervanaf."

      De stalking-situatie is anders. Daar wist ik niks van tot nu.
      Als je bewijs hebt van stalking kan ik daar mee aan de slag.
      Dat is duidelijk mijn jurisdictie.

      Breng me iets stevigs en ik heropen de zaak.
    effects:
      trust_brigadier: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Jesse than anyone in Kalkenberg. Who is responsible?
    choices:
      - Confront Tessa Kuipers (the obsessive commissioner) -> confront_tessa
        when:
          state: obsession_evidence
          gte: 5
      - Confront Lars Vossen (the KalkGrind director) -> confront_lars
        when:
          state: corporate_evidence
          gte: 3
      - Confront Wethouder Habets (political protection) -> confront_habets
      - I need more evidence -> investigation_hub

  # --- ENDING A: Tessa (Best Ending) ---

  confront_tessa:
    type: message
    text: >
      You present your evidence to Tessa:

      "Ik weet dat @KunstPatron_LB jouw account is. Ik weet dat je
      een sleutel hebt laten namaken voor Jesse's atelier. Ik weet dat
      je een camera in zijn studio hebt verstopt. Ik weet dat je hem
      volgde, fotografeerde, zijn leven in kaart bracht. En ik weet
      dat je dit eerder hebt gedaan — in Nijmegen en in Groningen.

      Ik heb getuigen en ik heb het bewijs."
    choices:
      - Send -> tessa_response

  tessa_response:
    type: message
    text: >
      Tessa reageert niet meteen. Dan:

      TESSA: Je begrijpt het niet. Ik was zijn beschermheer. Zijn
      kunst heeft iemand nodig die het begrijpt, die het beschermt.
      Hij was in gevaar door KalkGrind en hij wilde mijn hulp niet
      aannemen. Ik moest dichtbij blijven. Alles wat ik deed was
      omdat ik om zijn kunst geef. Om hem.

      Dat is geen zorg. Dat is obsessie.

      Je hebt het bewijs al naar Brigadier de Graaf gestuurd. En
      naar Roel Smeets.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Brigadier de Graaf heropent de zaak. Met jouw bewijs — het
      anonieme account, de verborgen camera, de nagekaakte sleutel,
      de getuigenverklaringen, het patroon uit Nijmegen en Groningen
      — wordt Tessa Kuipers aangehouden voor stalking en bedreiging.
      In haar appartement vindt de politie een muur vol foto's van
      Jesse. Honderden. Sommige genomen door ramen.

      Roel Smeets publiceert het KalkGrind-verhaal in De Limburger.
      De provincie gelast een onaangekondigde inspectie. De groeve
      wordt gesloten hangende milieuonderzoek. Lars Vossen wordt
      vervolgd voor illegale winning. Wethouder Habets treedt af
      wanneer zijn financiële banden met KalkGrind openbaar worden.

      En Jesse van Hoof, die het artikel leest vanuit het huis van
      een vriend in Maastricht, belt zijn broer voor het eerst in
      negen dagen.

      "Ik kom naar huis."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: jesse
    text: >
      de heuvels staan er nog. de grotten ademen weer. en kalkenberg
      heeft zijn verhalen terug. dank voor het niet opgeven.
    choices:
      - The End -> game_complete

  # --- ENDING B: Lars Vossen (Partial Ending) ---

  confront_lars:
    type: message
    text: >
      You present the mining evidence to Lars Vossen:

      "Ik heb foto's van de schade aan de mergelgrotten. Ik heb
      metingen die bewijzen dat jullie 15 meter dieper graven dan
      de vergunning toestaat. Ik heb de originele inspectierapporten.
      Ik heb het document dat wethouder Habets de handhaving heeft
      tegengehouden."
    choices:
      - Send -> lars_response

  lars_response:
    type: message
    text: >
      LARS: Dit gesprek wordt doorgestuurd naar onze juridische
      afdeling. Elke publicatie van lasterlijk materiaal zal
      onmiddellijk juridisch worden beantwoord. KalkGrind BV
      opereert binnen alle geldende regelgeving.

      Maar het is te laat. Je hebt het bewijs naar Roel, naar de
      Stichting Heuvelland Erfgoed, en naar de provincie gestuurd.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      Het grindwinning-verhaal breekt. KalkGrind krijgt een bevel
      tot stillegging hangende onderzoek. De groeve sluit misschien
      voorgoed. Honderdvijftig banen hangen in de balans. Het dorp
      is verdeeld.

      Maar Jesse?

      Zonder het stalking-bewijs wordt Tessa nooit onderzocht. Ze
      verhuist stilletjes naar een ander dorp. Ze vindt een andere
      kunstenaar. Ze maakt een nieuw anoniem account. Het patroon
      herhaalt zich.

      Drie maanden later leest Jesse over KalkGrind online. Hij
      keert stil terug. Hij verhuist zijn atelier. Hij werkt niet
      meer 's avonds. Hij checkt elke ochtend of iemand hem volgt.

      De corporatie is ontmaskerd. Maar de persoon die Jesse
      terroriseerde loopt vrij rond.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: jesse
    text: "ik ben terug. de heuvels zijn veilig. de rest... we zien wel."
    choices:
      - The End -> game_complete

  # --- ENDING C: Wethouder Habets (Wrong Ending) ---

  confront_habets:
    type: message
    text: >
      You confront wethouder Habets with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> habets_response

  habets_response:
    type: tweet
    from: maud
    text: >
      Mijn cliënt neemt kennis van uw beschuldigingen. Elke publieke
      verspreiding van lasterlijke uitspraken zal onmiddellijk
      juridisch worden vervolgd. — Scholten & Partners, Maastricht
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      De advocaat van de wethouder begraaft je beschuldiging. Zonder
      direct bewijs van persoonlijke verrijking door Habets — en dat
      heb je niet los van de politieke bescherming — is je bewijs
      onvoldoende.

      KalkGrind blijft opereren. Tessa blijft kijken. Jesse blijft
      ondergedoken.

      Zes maanden later maakt @KunstPatron_LB een nieuw account aan.
      Het volgt Jesse's broer.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: KALKENBERG — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Jesse's story explores themes of
      corporate greed, environmental destruction, obsessive behaviour,
      the erasure of cultural heritage, and community solidarity.

      If you or someone you know is experiencing stalking,
      harassment, or mental health difficulties, help is available:
      113 Zelfmoordpreventie: 113
      Slachtofferhulp Nederland: 0900-0101
      Politie (niet-spoed): 0900-8844
