entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN METSAVÄLJA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Metsavalja.social — the community Mastodon instance
      for the island village of Metsavälja, Hiiumaa.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name everywhere:
      @liis_tamm.

      A textile artist. Natural dyes from the bog. Her woven pieces
      hung in galleries in Tallinn and Helsinki. She documented the
      peat bogs obsessively — photographing, sampling, defending them
      against industrial extraction. People are worried. She hasn't
      posted in seven days.
    choices:
      - Look at her profile -> liis_profile

  liis_profile:
    type: tweet
    from: liis
    text: "turbakaevandus hävitab Männiraba. TurbaEesti laiendab ilma loata. mul on tõendid, fotod, proovid. see lõpeb NÜÜD."
    choices:
      - That's her last real post... -> grey_bog

  grey_bog:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a grey landscape — fog on the bog. Blurred, overexposed, posted
      at 3am. No caption. No hashtags.

      Her friends say that's not her style. Liis always wrote long
      captions about the plants, the light, the texture of the peat.
      The police say she probably went to Tallinn. Nobody on this
      island believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: politsei
    text: >
      Saime teate Metsavälja elaniku kohta. Praegusel hetkel puudub
      alus arvata, et tegemist on kuriteoga. Info edastamiseks palume
      pöörduda konstaablijaoskonda või helistada 112.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her mother @marika_tamm is posting
      frantically. Her best friend @toomas_kask checked her studio —
      looms still threaded, dye pots still steeping. Her brother
      @margus_tamm is trying to get emergency leave from his ship.

      The collector @rein_aare from Tallinn is strangely active,
      posting concerned messages about "his artist." The fisherman
      @ants_rebane says the bog water has been wrong for months.

      And the journalist @maret_kivi is oddly silent.

      TurbaEesti OÜ, the peat extraction company destroying the
      bog next door, just posted about their "sustainable harvesting
      practices."

      Nobody thinks Liis just went to Tallinn.
    effects: { trust_marika: "+5", trust_toomas: "+5" }
    choices:
      - Start following Liis's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Metsavälja. Follow Liis's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Helgi (pub owner, knows everyone) -> helgi_intro
      - Talk to Ants (fisherman, knows the bog) -> ants_intro
      - Talk to Kertu (teen photographer, walks the bog) -> kertu_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Liis with island rhythms: ferry
      schedules, weather warnings, the pub's Friday karaoke, someone's
      sheep on the road, mushroom season.

      Key names surface: Marika (mother, retired, desperate), Toomas
      (best friend, carpenter, angry), Rein Aare (Tallinn art
      collector, obsessively interested in Liis's work), and the
      teens — Kertu, Rasmus, Hanna — who hung out at Liis's studio.

      Also prominent: TurbaEesti OÜ, the peat extraction company
      at the edge of the bog. Their posts are corporate PR. Liis's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Helgi -> helgi_intro
      - Talk to Ants -> ants_intro
      - Talk to Kertu -> kertu_intro

  # --- Helgi (social map) ---

  helgi_intro:
    type: tweet
    from: helgi
    text: >
      Pubi on lahti aga tuju on all. @liis_tamm, su koht leti ääres
      ootab. Tule tagasi.
    effects: { trust_helgi: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Helgi -> helgi_talk

  helgi_talk:
    type: message
    text: >
      HELGI: You're new here? Welcome to the island. Bad timing
      though. Everyone's on edge about Liis.

      Let me tell you who's who. Marika is her mother — lives alone
      now, worried sick. Toomas Kask is her best friend since
      childhood, a carpenter. Good man, furious right now.

      Rein Aare — that's the strange one. Rich art collector from
      Tallinn. He discovered Liis's work two years ago and became her
      biggest buyer. But he's... too interested. Flies to the island
      unannounced. Sends gifts. Shows up at her studio without
      warning. Liis told me he was becoming a problem.

      "Ta ei mõista, et ei tähendab ei."

      And then there's TurbaEesti. They're destroying the bog that
      gives Liis her dyes, her inspiration, her whole artistic life.
      She had evidence of illegal extraction. Now she's gone.
    effects: { trust_helgi: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Rein -> helgi_rein
      - Ask about TurbaEesti -> helgi_turba
      - Thank her and move on -> quest1_hub

  helgi_rein:
    type: message
    text: >
      HELGI: Rein? Kurat, that man has more money than sense. He
      bought everything Liis made. Full price, no haggling. At first
      she was thrilled — artists need patrons. But then he started
      wanting more. Private commissions. Exclusive rights. He wanted
      her to stop selling to anyone else.

      She said no. He didn't take it well. He started showing up on
      the island without telling her. She'd find him at the pub
      waiting for her. He'd walk by her studio at odd hours. She told
      me once "ta jälitab mind, Helgi. Mis pask see on?"

      Those were her words. Three weeks before she vanished.
    effects: { trust_helgi: "+5" }
    choices:
      - Ask about TurbaEesti -> helgi_turba
      - Move on -> quest1_hub

  helgi_turba:
    type: message
    text: >
      HELGI: TurbaEesti has been extracting peat from Männiraba for
      three years. Before that it was a pristine bog — cloudberries,
      sundew, cotton grass. Liis used everything from it for her dyes.
      The sphagnum moss gave her those deep browns and reds that made
      her famous.

      Now half the bog is scraped bare. The water table has dropped.
      Plants are dying. And Liis discovered they were extracting
      beyond their permitted boundary — cutting into protected habitat.

      She had drone photos, she had GPS coordinates, she had water
      samples. Two weeks after she confronted them, she's gone.
      Kurat, you don't need to be a detective.
    effects: { trust_helgi: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ants (fisherman, knows the bog water) ---

  ants_intro:
    type: tweet
    from: ants
    text: >
      35 aastat sellel rannikul. vesi pole enam sama. @liis_tamm
      teadis seda. ja nüüd on ta kadunud. tehke järeldused.
    effects: { trust_ants: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ants -> ants_talk

  ants_talk:
    type: message
    text: >
      ANTS: I've fished these waters my whole life. The streams that
      drain the bog flow into the bay. For thirty years the water was
      clear. Now it runs brown — not peat brown, chemical brown.
      Dissolved humics, iron oxide, things that shouldn't be there in
      those amounts.

      Liis tested the water. She took samples at six points around
      the extraction site. The numbers were terrible. She showed them
      to me — pH levels that kill fish, heavy metals from the deep
      peat layers TurbaEesti isn't supposed to be touching.

      She was building a case. Drone photos, water data, botanical
      surveys showing species decline. And then — gone.

      There are no coincidences on an island this small.
    effects: { trust_ants: "+10" }
    choices:
      - Did you see anything unusual recently? -> ants_night
      - Move on -> quest1_hub

  ants_night:
    type: message
    text: >
      ANTS: The night before she vanished — I was coming back from
      night fishing, around 1am. I saw lights near the extraction
      site. Not the usual security lights — car headlights. Two
      vehicles. One was the TurbaEesti company pickup. The other was
      a rental car — the kind you get off the ferry.

      At 1am. At the peat bog. On an island where nothing happens
      after dark.

      I made a note of it. Fisherman's habit. Nobody has asked to see
      my log book until now.
    effects: { trust_ants: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kertu (teen photographer, walks the bog) ---

  kertu_intro:
    type: tweet
    from: kertu
    text: >
      vittu @liis_tamm on ainus inimene sellel saarel kes pole
      täielik tont. ta stuudio oli parim koht. mis pask siin
      toimub??
    effects: { trust_kertu: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kertu -> kertu_talk_early

  kertu_talk_early:
    type: message
    text: >
      KERTU: kes sa oled?? ok whatever. liis on nkn parim. ta lasi
      meil stuudios pärast kooli käia, ta õpetas hannale kudumist,
      ta andis mulle oma vana kaamera. see kaamera millega ma rabas
      pilte teen.

      ja nüüd on ta lihtsalt ära?? perse mis lugu.

      rasmus nägi midagi imelikku sel õhtul btw aga ta ei julge
      rääkida. ta ütleb et pole midagi aga on kurat küll midagi.
    effects: { trust_kertu: "+10" }
    choices:
      - What did Rasmus see? -> kertu_rasmus_hint
      - Move on -> quest1_hub

  kertu_rasmus_hint:
    type: message
    text: >
      KERTU: ei tea täpselt. ta oli bmxiga sadamas ja nägi ühte tüüpi.
      meest. ta seisis liisi stuudio juures ja pildistas ust. pimedas.
      rasmus ütles et see meelditas reinile aga ta pole kindel.

      ta on sellest kurat närvis. proovi temaga rääkida aga ta on
      mega kahtlustav võõraste suhtes. räägi enne bmxist või
      millestki nkn
    effects: { trust_kertu: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Metsavälja. A Hiiumaa island village
      where the forest meets the bog. A textile artist who was
      exposing illegal peat extraction. A disappearance nobody
      believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Marika (Liis's mother) -> marika_q1
      - Talk to Rein (the Tallinn collector) -> rein_q1
      - Check what Toomas (Liis's best friend) is saying -> toomas_q1
      - Check what Margus (Liis's brother) is saying -> margus_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Marika Q1 ---

  marika_q1:
    type: tweet
    from: marika
    text: >
      kui kellelgi on uudiseid @liis_tamm kohta palun helistage mulle.
      ta telk on stuudios. ta värvid on potis. ta ei oleks kunagi
      ilma tööta lahkunud.
    effects: { trust_marika: "+5", contacts_followed: "+1" }
    choices:
      - DM Marika -> marika_q1_talk

  marika_q1_talk:
    type: message
    text: >
      MARIKA: Who are you? Another mainlander who thinks they know
      something? My daughter called me the evening before she went
      silent. She was frightened. She said "nad teavad, mis mul on,
      ema." They know what I have.

      I asked who. She said the peat company. Then she said something
      else — "ja tema ka. Ta on alati siin." And him too. He's always
      here.

      She wouldn't say who. She told me not to worry. That's the last
      I heard from my daughter.
    effects: { trust_marika: "+10" }
    choices:
      - What do you think happened? -> marika_theory
      - Move on -> quest1_hub

  marika_theory:
    type: message
    text: >
      MARIKA: I think TurbaEesti wanted her evidence destroyed. She
      had everything — drone footage, water samples, GPS coordinates
      showing extraction beyond the permitted zone. Lembit Vaher, the
      plant manager, screamed at her in the village shop. Everyone
      heard him: "Sa hävitad 200 inimese töökohad!"

      But Rein Aare... that's the other thing. He wouldn't stop
      contacting her. She blocked his number and he bought a new
      phone. She told him to stop coming to the island and he came
      anyway. He said he was her "biggest supporter." She said he
      was her biggest nightmare.

      The night she vanished, both threats were closing in.
    effects: { trust_marika: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Rein Q1 ---

  rein_q1:
    type: tweet
    from: rein
    text: >
      @liis_tamm on eesti üks suurimaid talente. tema tööd on
      hindamatud. ma olen mures. kui keegi teab midagi, palun
      kirjutage mulle otse.
    effects: { trust_rein: "+5", contacts_followed: "+1" }
    choices:
      - DM Rein -> rein_q1_talk

  rein_q1_talk:
    type: message
    text: >
      REIN: I'm Liis's most important patron. I've bought seventeen
      of her pieces. I was planning a solo exhibition for her in
      Tallinn — Kumu Museum was interested. She has extraordinary
      talent. This disappearance is devastating for Estonian art.

      People say I'm too involved. That's unfair. I invest in
      artists. I nurture them. Liis and I have a professional
      relationship built on mutual respect.

      [Rein speaks smoothly. But the concern feels possessive, not
      professional.]
    effects: { trust_rein: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Toomas Q1 ---

  toomas_q1:
    type: tweet
    from: toomas
    text: >
      käisin liisi stuudios. kangastelg on lõime peal. värvipotid
      keevad. tema saapad on ukse juures. SEE EI OLE INIMENE KES ON
      TALLINNASSE SÕITNUD KURAT
    effects: { trust_toomas: "+5", contacts_followed: "+1" }
    choices:
      - DM Toomas -> toomas_q1_talk

  toomas_q1_talk:
    type: message
    text: >
      TOOMAS: I've known Liis since we were children. She doesn't
      leave her loom. She doesn't leave her dye pots. The woman
      harvests moss at sunrise and weaves until midnight. You think
      she just packed a bag?

      Kurat, the police are useless. They took a statement and
      caught the next ferry. I checked the studio — nothing stolen,
      no sign of a break-in. But her laptop is gone. And the folder
      she kept — her TurbaEesti evidence file with all the drone
      photos and water data — that's gone too.

      Someone took her proof. And someone took her. Or made her run.
    effects: { trust_toomas: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Margus Q1 ---

  margus_q1:
    type: tweet
    from: margus
    text: >
      mu õde on KADUNUD ja politsei ütleb et ta vist sõitis tallinna??
      LIIS EI SÕIDA TALLINNA ILMA ETTE TEATAMATA. ta vihkab tallinna.
      ma tulen pärnust kohe kui saan.
    effects: { trust_margus: "+5", contacts_followed: "+1" }
    choices:
      - DM Margus -> margus_q1_talk

  margus_q1_talk:
    type: message
    text: >
      MARGUS: Who are you? Look, my sister called me two days before
      she went quiet. She was upset — not scared, angry. She said
      TurbaEesti sent people to her studio. And she said that Tallinn
      collector was on the island again. "Ta tuleb alati tagasi,
      Margus. Ma ütlesin ei aga ta ei kuula."

      He always comes back. She said no but he doesn't listen.

      I'm stuck on a ship near Pärnu. I can't get there for two days.
      If you're actually trying to help, find out what happened.
    effects: { trust_margus: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Liis went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Rasmus (was BMXing at the harbour) -> rasmus_interview
      - Find Ants (fisherman, was out late) -> ants_interview
      - Find Juhan (mechanic, heard vehicles) -> juhan_interview
      - Find Ene (librarian, early riser, saw something) -> ene_interview

  # --- Rasmus (saw man at Liis's studio) ---

  rasmus_interview:
    type: tweet
    from: rasmus
    text: >
      igav õhtu metsaväljal shocker. aga serikas on keegi näinud
      midagi imelikku viimasel ajal?? ainult mina??
    effects: { trust_rasmus: "+5" }
    choices:
      - Ask Rasmus about that evening -> rasmus_talk

  rasmus_talk:
    type: message
    text: >
      RASMUS: ok vittu sa ei räägi kellelegi. ma olin sadamas bmxiga
      sel õhtul ja ma nägin seda tallinna tüüpi — rein. sada protsenti
      tema. ta seisis liisi stuudio ukse juures ja pildistas telefoniga.
      kõike. ust, aknaid, numbrisilti.

      ja siis ta kõndis ümber maja ja vaatas aknast sisse. pimedas.
      kurat see on hull creepy.

      kui ta nägi mind läks ta minema hästi kiiresti. autorentaali
