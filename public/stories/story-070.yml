      You've gathered evidence. You know more about what happened to
      Liis than anyone on this island. Who is responsible?
    choices:
      - Confront Rein Aare (the obsessive buyer) -> confront_rein
        when:
          state: obsession_evidence
          gte: 5
      - Confront Lembit Vaher (the plant manager) -> confront_lembit
        when:
          state: corporate_evidence
          gte: 3
      - Confront Mayor Põld (political protection) -> confront_urmas
      - I need more evidence -> investigation_hub

  # --- ENDING A: Rein (Best Ending) ---

  confront_rein:
    type: message
    text: >
      You present your evidence to Rein:

      "I know @oliver_mets is your account. I know you put a GPS
      tracker on Liis's bicycle. I know you photographed her studio
      at night. I know you visited the island 23 times uninvited. I
      have witnesses, ferry records, and Ene's diary with dates and
      times."
    choices:
      - Send -> rein_response

  rein_response:
    type: message
    text: >
      Rein doesn't reply for a long time. Then:

      REIN: You don't understand. I was protecting her art. Her
      talent is too important to lose. She was in danger from
      TurbaEesti and she wouldn't accept my help. I needed to be
      close. Everything I did was out of devotion to her work.

      That's not devotion. That's obsession.

      You've already sent the evidence to Konstaabel Kuusk. And to
      Maret Kivi.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Konstaabel Kuusk reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the surveillance diary, the
      witness testimonies, the ferry records — Rein Aare is arrested
      for stalking and harassment when he steps off the Rohuküla
      ferry. A GPS tracker is recovered from Liis's bicycle, found
      leaning against the wall of an abandoned fisherman's hut on the
      north coast.

      Maret Kivi, armed with Liis's full evidence package plus
      Taavi's original field data, publishes the TurbaEesti story in
      Postimees. Keskkonnaamet orders an unannounced inspection. The
      extraction site is shut down pending environmental remediation.
      Lembit Vaher faces criminal charges for falsifying extraction
      reports and destroying protected habitat.

      And Liis Tamm, reading the story from a fisherman's cottage
      on the north shore, calls her mother for the first time in
      ten days.

      "Ma tulen koju, ema."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Ohvriabi: 116 006 (tasuta)
      Politsei: 112
      Keskkonnainspektsioon: 1313
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: liis
    text: >
      raba on alles. kangastelg ootab. aitäh, et ei loobunud.
    choices:
      - The End -> game_complete

  # --- ENDING B: Lembit (Partial Ending) ---

  confront_lembit:
    type: message
    text: >
      You present the extraction evidence to Lembit Vaher:

      "I have drone footage showing extraction 15 hectares beyond the
      permitted boundary. I have water samples showing contamination
      from deep peat layers you're not permitted to touch. I have
      your environmental inspector's original field data showing the
      boundary markers were moved. I have GPS coordinates."
    choices:
      - Send -> lembit_response

  lembit_response:
    type: message
    text: >
      LEMBIT: See vestlus edastatakse meie juriidilisele osakonnale.
      Laimava materjali avaldamine toob kaasa kohesed õiguslikud
      sammud. TurbaEesti tegutseb kõigi kehtivate lubade raames.

      But it's too late. You've sent the evidence to Maret, to the
      Looduskaitse Selts, and to Keskkonnaamet.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The extraction story breaks. TurbaEesti is ordered to halt
      operations pending investigation. The site may close permanently.
      Two hundred jobs on an island with few alternatives. The village
      is divided.

      But Liis?

      Without the stalking evidence, Rein is never investigated. He
      continues to visit the island. He creates a new anonymous
      account. He buys a new phone when she blocks the old one. He
      books the same ferry, rents the same car.

      Three months later, Liis reads about TurbaEesti in Postimees.
      She returns quietly. She changes her studio locks. She stops
      walking the bog alone. She checks the ferry schedule every
      morning.

      The corporation is exposed. But the person who terrorised Liis
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: liis
    text: "ma olen tagasi. raba taastub. ülejäänu... vaatame."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_urmas:
    type: message
    text: >
      You confront Mayor Põld with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> urmas_response

  urmas_response:
    type: tweet
    from: siiri
    text: >
      Mu klient võtab teie väited teadmiseks. Laimava materjali
      avalik levitamine toob kaasa kohesed õiguslikud sammud.
      — Ots & Partnerid, Tallinn
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Põld and TurbaEesti's illegal extraction — and
      there isn't one beyond political protection — your evidence
      is insufficient.

      TurbaEesti continues to operate. Rein continues to visit.
      Liis stays in hiding.

      Six months later, @oliver_mets creates a new account. It
      follows Liis's mother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: METSAVÄLJA — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Liis's story explores themes of
      corporate destruction of natural heritage, obsessive behaviour
      disguised as patronage, island solidarity, and the courage to
      defend what matters.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Ohvriabi kriisitelefon: 116 006 (tasuta, 24h)
      Politsei: 112
      Keskkonnainspektsioon: 1313
