  # --- ENDING A: Both (Best Ending) ---

  confront_both:
    type: message
    text: >
      You compile everything. Saoirse gives you the USB stick — Aoife's
      complete archive of photographs, documents, and recordings. You
      send the heritage evidence to Maeve at the Tribune and to the
      National Monuments Service. You send the stalker evidence, the
      BMW plate, and the DM screenshots to the Garda Siochana in Galway
      city — bypassing the local station.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE FULL PICTURE

      Two things happen.

      The National Monuments Service issues an emergency preservation
      order on Dun Carrig. An investigation is opened into Emerald
      Heritage Solutions. Hartigan's planning permission is revoked.
      Colm Regan is suspended from the county council subcommittee
      pending an ethics inquiry. Maeve publishes a front-page story
      in the Tribune.

      The Gardai in Galway trace the BMW rental to a Dublin man named
      Ronan Cassidy. A marketing executive who became obsessed with
      Aoife's podcast. He drove to Carrigmore twelve times in six months.
      He followed her to the headland that night. She ran. She made it
      to the cliffs and hid in a sea cave until dawn. Then she walked to
      the nearest village and called Siobhan, who drove her to Galway.

      Aoife has been staying with Siobhan, too frightened to return.
      Too afraid the man who followed her would find her again.

      With Cassidy identified and arrested for harassment and stalking,
      Aoife calls her father.

      "I'm coming home, Da. Tell Niamh to keep my chair warm."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: aoife
    text: >
      episode 47 is live. it's about what happened. about the ringfort,
      about the podcast, about all of it. the carrigmore sessions
      aren't going anywhere. neither am i.
    choices:
      - The End -> game_complete

  # --- ENDING B: Hartigan Only (Partial Ending) ---

  confront_hartigan:
    type: message
    text: >
      You present the heritage evidence to the National Monuments Service
      and to Maeve. The golf resort is stopped. Hartigan's company is
      investigated. Dun Carrig is saved.
    choices:
