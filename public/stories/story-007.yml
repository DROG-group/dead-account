entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN CARRIGMORE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to carrigmore.social — the community Mastodon instance for
      Carrigmore, a small town on the west coast of Ireland. Stone walls,
      green fields, Atlantic storms.

      The local feed is troubled. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      One name dominates the feed: @aoife_brennan.

      A traditional musician and the host of "The Carrigmore Sessions,"
      a podcast about local history, music, and culture. She hasn't
      posted in twelve days. Her last episode was never published.
    choices:
      - Look at her profile -> aoife_profile

  aoife_profile:
    type: tweet
    from: aoife
    text: "The ringfort at Dun Carrig is 3,000 years old. Someone is about to destroy it for a golf course. Episode 47 drops Friday."
    choices:
      - That was her last real post... -> dead_post

  dead_post:
    type: message
    text: >
      Episode 47 never dropped. Four days after that post, her account
      published a brief message: "Taking a break from the podcast and
      social media. Need some time. Thanks for understanding."

      Her father says she would never write that. Aoife doesn't take
      breaks. The Guards say she's an adult who chose to step away.
    choices:
      - Read the Garda statement -> garda_statement
      - See what people are saying -> community_reaction

  garda_statement:
    type: tweet
    from: garda
    text: >
      An Garda Siochana has received a report regarding a Carrigmore
      resident. There is no evidence of criminal activity at this time.
      The individual is believed to have left the area voluntarily.
      Contact Carrigmore Station with any information.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The town is split. Her father Ciaran is beside himself. Siobhan,
      her archaeologist friend, is posting evidence about the ringfort
      destruction. Niamh at the pub says the trad session chair is
      empty.

      And an anonymous account called @ronan keeps posting: "She should
      have stayed in her lane. Music, not politics."

      An account that has been listening to her podcast for two years.
      Every episode. Every comment section. Every live show.
    effects: { trust_ciaran: "+5", trust_siobhan: "+5" }
    choices:
      - Start following Aoife's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Carrigmore. A town of stone walls and strong opinions.
      Follow Aoife's contacts and understand what she was working on.
    choices:
      - Talk to Niamh at the pub -> niamh_intro
      - Talk to Seamus the retired teacher -> seamus_intro
      - Check what the teens are saying -> oisin_intro
      - Browse the feed -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is a mix of GAA results, weather complaints, sheep
      photos, and worry about Aoife. Everyone knows everyone. People
      tag each other in photos of sunsets, pints, and stone walls.

      Key names: Ciaran (her da, furious), Siobhan (archaeologist,
      has evidence), Niamh (pub owner, community hub), Declan Hartigan
      (developer, suspiciously quiet), Maeve (journalist, digging).
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Niamh -> niamh_intro
      - Talk to Seamus -> seamus_intro
      - Check the teens -> oisin_intro

  # --- Niamh (social map) ---

  niamh_intro:
    type: tweet
    from: niamh
    text: >
      Wednesday session tonight as always. Aoife's chair will be there.
      It'll be empty but it'll be there. Come in and play. She'd want
      that.
    effects: { trust_niamh: "+5", contacts_followed: "+1" }
    choices:
      - Talk to Niamh -> niamh_talk

  niamh_talk:
    type: message
    text: >
      NIAMH: You're new? Grand, welcome. Sit down, I'll get you a tea
      or something stronger.

      Aoife is the soul of this place. Not just the music — though
      she's deadly on the fiddle — but the way she connected people.
      That podcast brought the whole parish together. Old people
      sharing stories, young ones listening.

      Then she started looking into the golf resort and things got
      fierce complicated. Declan Hartigan wants to build on the
      headland. Right where the ringfort is. Right where the ancient
      field systems are.

      Aoife found out the planning application left out the
      archaeological survey. She went on the podcast about it. That's
      when things changed.
    effects: { trust_niamh: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Declan Hartigan -> niamh_declan
      - Ask about the podcast listener -> niamh_listener
      - Thank her and move on -> quest1_hub

  niamh_declan:
    type: message
    text: >
      NIAMH: Declan Hartigan isn't from here. Dublin money. He bought
      200 acres on the headland three years ago. The planning
      application went through fierce fast — too fast, people say.

      His solicitor Colm Regan handled everything. Colm's been here
      years, does all the property work. Sound enough usually, but
      this deal... the heritage survey was supposed to happen before
      planning was approved. It didn't.

      Aoife got hold of the planning file. The archaeological assessment
      was done by a firm Hartigan hired himself. They found "nothing
      of significance." On a site with a visible ringfort. That's gas,
      that is.
    effects: { trust_niamh: "+5" }
    choices:
      - Ask about the listener -> niamh_listener
      - Move on -> quest1_hub

  niamh_listener:
    type: message
    text: >
      NIAMH: There was a fella — I never saw his face. He came to every
      live show Aoife did here. Sat in the back corner, never ordered
      more than a mineral. Always alone. Took photos on his phone.

      Aoife noticed him about six months ago. She said it was grand,
      probably just a fan. But then she started getting these long DMs
      after every episode. Not threatening exactly — more like... intense.
      Like someone who thought they knew her personally from listening
      to the show.

      She blocked the account. A new one appeared. She blocked that one
      too. Three times this happened.
    effects: { trust_niamh: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Seamus (the historian) ---

  seamus_intro:
    type: tweet
    from: seamus
    text: >
      Dun Carrig ringfort is a scheduled monument. Protected under
      the National Monuments Act. But paper protections mean nothing
      when there's money involved.
    effects: { trust_seamus: "+5", contacts_followed: "+1" }
    choices:
      - Talk to Seamus -> seamus_talk

  seamus_talk:
    type: message
    text: >
      SEAMUS: I taught history in Carrigmore for thirty-five years.
      Every child in this parish knows about Dun Carrig. It's Iron Age.
      The field systems around it could be even older.

      Aoife's podcast episode on the ringfort — episode 44 — got more
      downloads than anything she'd done. She interviewed me, she
      interviewed Siobhan from the university, she interviewed farmers
      whose families have worked that land for generations.

      After that episode, Hartigan's people tried to have it taken down.
      Copyright claim on some background music. Ridiculous. Aoife
      fought it and won. But it was a warning shot.
    effects: { trust_seamus: "+10", contacts_followed: "+1" }
    choices:
      - Move on -> quest1_hub

  # --- Oisin (teen witness) ---

  oisin_intro:
    type: tweet
    from: oisin
    text: >
      aoife's podcast was literally the only class thing about living
      here and now its gone. like this town is pure dead without her.
      someone needs to do something like
    effects: { trust_oisin: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Oisin -> oisin_talk

  oisin_talk:
    type: message
    text: >
      OISIN: ah here are ya new? grand so welcome. yeah aoife was
      deadly like. she taught me bodhran. she was going to have me
      on the podcast and all.

      saoirse is fierce upset about it. she was like aoife's biggest
      fan. she has every episode saved. and fionn says he saw something
      weird at the headland the other night but sure no one listens
      to fionn.

      yer man ronan though — that account gives me the creeps like.
      pure obsessive vibes. saoirse showed me some of the DMs he
      sent aoife and they were LONG. like essays. about what her
      music "meant to him." gas but also not gas at all like
    effects: { trust_oisin: "+10" }
    choices:
      - What did Fionn see? -> oisin_fionn
      - Move on -> quest1_hub

  oisin_fionn:
    type: message
    text: >
      OISIN: fionn was out the headland with his da checking sheep
      and he said there was a digger up there. like a JCB. at night.
      on the site where the ringfort is. who does construction work
      at night on a protected monument?

      he told his ma and she said dont be going up there. but like
      thats pure dodgy isnt it
    effects: { trust_oisin: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      Carrigmore is revealing itself. A tight community facing a
      developer with deep pockets. A woman who spoke up. An obsessive
      listener. A heritage site in danger.
    choices:
      - Talk to Ciaran (Aoife's father) -> ciaran_q1
      - Talk to Siobhan (archaeologist) -> siobhan_q1
      - Talk to Padraig (farmer, owns adjacent land) -> padraig_q1
      - I'm ready to investigate the night she vanished -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Ciaran Q1 ---

  ciaran_q1:
    type: tweet
    from: ciaran
    text: >
      My daughter does not "take breaks." She has played the fiddle
      every single day since she was nine years old. Someone wrote
      that post. It was not Aoife. THE GUARDS NEED TO LISTEN.
    effects: { trust_ciaran: "+5", contacts_followed: "+1" }
    choices:
      - DM Ciaran -> ciaran_q1_talk

  ciaran_q1_talk:
    type: message
    text: >
      CIARAN: Who are you? Are you another one of Hartigan's crowd?
      Because if you are, you can turn around and walk out.

      My daughter was investigating that man's resort. She found things
      he didn't want found. And now she's gone and the Guards say
      there's "no evidence."

      Her fiddle is still in her room. Aoife does not go anywhere
      without that fiddle. THAT is your evidence.
    effects: { trust_ciaran: "+10" }
    choices:
      - What did she find? -> ciaran_evidence
      - Move on -> quest1_hub

  ciaran_evidence:
    type: message
    text: >
      CIARAN: She found that the archaeological survey was a sham.
      The company that did it — Emerald Heritage Solutions — has done
      three surveys for Hartigan in the past five years. All three
      found "nothing of significance." On sites where there are clearly
      visible remains.

      She also found that Colm Regan, the solicitor who handled the
      planning, sits on a county council subcommittee that fast-tracked
      the application. Conflict of interest that nobody declared.

      She had documents. I don't know where they are now.
    effects: { trust_ciaran: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Siobhan Q1 ---

  siobhan_q1:
    type: tweet
    from: siobhan
    text: >
      I have conducted a preliminary survey of the Dun Carrig site.
      The ringfort is intact but there is fresh disturbance on the
      eastern perimeter. Someone has been digging. This needs immediate
      attention from the National Monuments Service.
    effects: { trust_siobhan: "+5", contacts_followed: "+1" }
    choices:
      - DM Siobhan -> siobhan_q1_talk

  siobhan_q1_talk:
    type: message
    text: >
      SIOBHAN: Aoife contacted me eight months ago when she first heard
      about the golf resort plan. I assessed the site. Dun Carrig is
      significant — Iron Age ringfort, possible early medieval reuse,
      surrounded by pre-famine field systems.

      The developer's survey missed all of this. Or rather, deliberately
      ignored it. The report is professionally negligent at best,
      fraudulent at worst.

      Aoife recorded two podcast episodes with me about it. She was
      also collecting evidence of unauthorized ground disturbance —
      someone was already preparing the site before planning approval.
    effects: { trust_siobhan: "+10" }
    choices:
      - Move on -> quest1_hub

  # --- Padraig Q1 ---

  padraig_q1:
    type: tweet
    from: padraig
    text: >
      Five generations my family has farmed this land. The ringfort
      was here before us and it should be here after us. Some things
      are more important than money.
    effects: { trust_padraig: "+5", contacts_followed: "+1" }
    choices:
      - DM Padraig -> padraig_q1_talk

  padraig_q1_talk:
    type: message
    text: >
      PADRAIG: Hartigan offered me three times the market value for
      my fields. I said no. He came back with four times. I said no
      again. Then the county council sent me a letter about
      "compulsory purchase" for a "strategic development."

      Aoife helped me fight it. She put me on the podcast. Episode 45.
      After that, Hartigan's solicitor sent me a cease and desist.
      For being on a podcast. For telling the truth about my own land.

      That's when I knew these people would do anything.
    effects: { trust_padraig: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Aoife was last seen at The Standing Stone pub on a Wednesday
      night, after the trad session. She left at 23:30. She never
      arrived home. Her car was found the next morning at the headland
      car park, near Dun Carrig.

      Collect witness accounts. You need at least 4.
    choices:
      - Find Daithi (was at the harbour that night) -> daithi_interview
      - Find Grainne (B&B overlooks the road) -> grainne_interview
      - Find Fionn (was at the headland) -> fionn_interview
      - Find Bridget (was closing the post office late) -> bridget_interview

  # --- Daithi (saw the car) ---

  daithi_interview:
    type: tweet
    from: daithi
    text: >
      was out checking the pots at dawn and saw aoife's car up at
      the headland. door open. no one around. that's not right.
    effects: { trust_daithi: "+5" }
    choices:
      - Ask Daithi what he saw -> daithi_talk

  daithi_talk:
    type: message
    text: >
      DAITHI: I was heading out to the harbour around half five in
      the morning. Passed the headland car park and saw her car.
      Green Yaris, everyone knows it. Driver door open, interior
      light on. Her bag was on the passenger seat. No Aoife.

      I called Ciaran straightaway. Then the Guards. They took three
      hours to come out. THREE HOURS.

      I've been fishing these waters thirty years. I know what it
      looks like when someone walks into the sea. That's what the
      Guards are hinting at. But Aoife Brennan did not walk into the
      sea. I'd stake my life on it.
    effects:
      trust_daithi: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Grainne (saw someone following) ---

  grainne_interview:
    type: tweet
    from: grainne
    text: >
      my B&B faces the coast road. i was up with a sick guest that
      night. i saw things i should have paid more attention to.
    effects: { trust_grainne: "+5" }
    choices:
      - Ask Grainne what she saw -> grainne_talk

  grainne_talk:
    type: message
    text: >
      GRAINNE: Around midnight I was in the front room getting hot
      water for a guest. I saw Aoife's car going past, heading toward
      the headland. Normal enough — she sometimes goes up there after
      sessions, says it clears her head.

      But then, maybe two minutes later, another car went the same way.
      No headlights. Just the parking lights. Following her.

      I didn't think anything of it at the time. Lord forgive me, I
      thought it was someone heading home. But who drives without
      headlights on the coast road at midnight?

      The car was dark. A big car. SUV type.
    effects:
      trust_grainne: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Fionn (heard something) ---

  fionn_interview:
    type: tweet
    from: fionn
    text: >
      ok so like i know no one takes me seriously but i was up at the
      headland that night. i heard stuff. its grand if ye dont believe
      me but im telling ye what happened
    effects: { trust_fionn: "+5" }
    choices:
      - Ask Fionn what happened -> fionn_talk

  fionn_talk:
    type: message
    text: >
      FIONN: right so me and oisin were up the headland. we go up
      there sometimes at night, dont tell me ma. we were near the
      ringfort like just messing about.

      around half twelve we heard a car pull up in the car park.
      then another one like 2 minutes later. then voices. a woman
      and a man. she sounded fierce angry. he was like trying to
      calm her down but she wasnt having it.

      then it went quiet for a bit. then we heard her say "leave me
      ALONE" dead loud. and running. footsteps on the path.

      we legged it. we were scared like. we ran back through
      padraig's fields. i feel pure sick about it now.
    effects:
      trust_fionn: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Bridget (saw the man) ---

  bridget_interview:
    type: tweet
    from: bridget
    text: >
      I was late closing up. I saw someone I didn't recognise going
      into the pub after the session. He didn't stay long.
    effects: { trust_bridget: "+5" }
    choices:
      - Ask Bridget what she saw -> bridget_talk

  bridget_talk:
    type: message
    text: >
      BRIDGET: I was sorting the last post at about eleven. A man I
      didn't recognise went into The Standing Stone. He wasn't from
      here. City clothes. He sat near the door, watching the session.
      Watching Aoife specifically.

      He left when she left. Went to a dark SUV parked on the street.
      Sat in it for a moment. Then drove off the same direction
      she did.

      I've been behind that counter thirty years. I notice people.
      That man was there for Aoife, not for the music.
    effects:
      trust_bridget: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.

      Keep collecting testimonies or talk to key contacts.
    choices:
      - Find Daithi -> daithi_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Grainne -> grainne_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Fionn -> fionn_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Find Bridget -> bridget_interview
        when:
          all:
            - { state: night_witnesses, lt: 4 }
      - Talk to Saoirse (Aoife's biggest fan) -> saoirse_early
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Saoirse early ---

  saoirse_early:
    type: tweet
    from: saoirse
    text: >
      i have literally every episode of the carrigmore sessions saved.
      episode 47 was going to be class. she told me what was in it.
      someone doesnt want people to hear it.
    effects: { trust_saoirse: "+5" }
    choices:
      - Ask Saoirse about episode 47 -> saoirse_episode
      - Come back later -> quest2_hub

  saoirse_episode:
    type: message
    text: >
