  # --- Padraig (heritage witness) ---

  padraig_heritage:
    type: message
    text: >
      PADRAIG: My grandfather told me stories about Dun Carrig. The
      fairy fort, he called it. You never disturb a fairy fort. Bad
      luck follows.

      That's superstition. But the principle is right. You don't
      destroy what others built before you. The field systems on my
      land — the lazy beds, the stone walls — they're pre-famine.
      They tell the story of people who lived and worked and died
      here. That matters.

      Aoife understood. She recorded my grandfather's stories on the
      podcast. Episode 32. My grandfather cried when he heard it.
      First time anyone had asked him about the old days in forty years.

      Hartigan offered me money. I told him the land isn't for sale.
      Because some things don't have a price. That's what Aoife taught
      this community. And that's why they wanted her gone.
    effects:
      trust_padraig: "+10"
      heritage_evidence: "+1"
      evidence_total: "+1"
    choices:
