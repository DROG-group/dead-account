  ending_b:
    type: message
    text: >
      ENDING B: THE MONUMENT

      The ringfort is saved. Hartigan's development is halted. The
      fraudulent survey company is shut down. The story makes national
      news.

      But the stalker is never identified. The BMW plate leads nowhere
      without a formal Garda investigation. Ronan Cassidy remains
      anonymous.

      Aoife reads about the ringfort being saved online. She is
      relieved. But she does not come home. Not yet. She is still
      afraid. She moves to Cork, changes her name online, stops
      making the podcast.

      Carrigmore saved its monument but lost its musician. The
      Wednesday sessions at The Standing Stone continue. The chair
      stays empty.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: aoife
    text: "glad about dun carrig. can't come back yet. maybe someday."
    choices:
      - The End -> game_complete

  # --- ENDING C: Stalker Only (Wrong Ending) ---

  confront_stalker:
    type: message
    text: >
      You present the stalker evidence to the Gardai. They investigate
      the BMW rental, trace it to Ronan Cassidy.
    choices:
      - Wait for the result -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE LISTENER

      Cassidy is arrested and charged. Aoife's immediate fear is
      addressed. She returns to Carrigmore.

      But without the heritage evidence being presented, Hartigan's
      resort proceeds. The ringfort is destroyed within months. The
      field systems are bulldozed. Three thousand years of history,
      gone for eighteen holes of golf.

      Aoife stands at the headland and watches the construction.
      She starts recording episode 47. Then she stops.

      "What's the point," she says. "It's gone."

      She never finishes the episode.
    choices:
      - The End -> game_complete

