  # --- Planning Investigation ---

  planning_investigation:
    type: message
    text: >
      The planning file for "Atlantic View Golf Resort" is a public
      document. The archaeological assessment is attached.

      "Emerald Heritage Solutions Ltd. — No features of archaeological
      significance were identified within the proposed development area."

      But the ringfort is clearly visible on satellite imagery. It's
      listed on the Record of Monuments and Places. It's a scheduled
      monument under the National Monuments Act.

      How did a heritage survey miss a listed monument?
    effects:
      heritage_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Check Emerald Heritage Solutions -> emerald_check
      - Back to heritage thread -> heritage_hub

  emerald_check:
    type: message
    text: >
      Emerald Heritage Solutions Ltd. Registered address: a serviced
      office in Dublin. One director: a name that appears on three other
      surveys, all for Hartigan developments, all finding "nothing of
      significance."

      The company has no published research, no academic affiliations,
      no accreditation with the Institute of Archaeologists of Ireland.

      It is a shell company producing fraudulent surveys to clear the
      way for development on protected sites.
    effects:
      heritage_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to heritage thread -> heritage_hub

  # --- Ringfort Visit ---

  ringfort_visit:
    type: message
    text: >
      DUN CARRIG

      The ringfort sits on the headland, overlooking the Atlantic.
      Stone walls, green grass, three thousand years of human presence.

      But the eastern side tells a different story. Fresh earth turned
      over. Tyre tracks from heavy machinery. A section of the outer
      bank has been cut through — not by time, but by a digger.

      Someone has already begun destroying the monument. Before
      planning approval. Before any legitimate survey.

      There are wooden stakes in the ground with surveyors' markings.
      They read: "AVR — Phase 1." Atlantic View Resorts.
    effects:
      heritage_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to heritage thread -> heritage_hub

  # --- Siobhan Survey ---

  siobhan_survey:
    type: message
    text: >
      SIOBHAN: The survey is fraudulent. I wrote to the National
      Monuments Service with a detailed rebuttal. Point by point,
      I showed how Emerald Heritage Solutions ignored visible features,
      misidentified soil types, and failed to conduct geophysical survey
      as required by the guidelines.

      Aoife helped me gather the evidence. She photographed the site
      weekly, documenting the unauthorized disturbance. She had photos
      of machinery operating at night.

      She was building the case that would stop the development. And
      someone decided that case should never be made.
    effects:
      trust_siobhan: "+15"
      heritage_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to heritage thread -> heritage_hub

  # --- Orla ---

  orla_interview:
    type: message
    text: >
      ORLA: As heritage officer, I flagged concerns about the Dun
      Carrig assessment eight months ago. My report was acknowledged
      and then... nothing. The planning application proceeded.

      I wrote to the Department. I wrote to the National Monuments
      Service. I was told my concerns would be "considered." The
      planning permission was granted anyway.

      Colm Regan sits on the county council subcommittee that approved
      it. He is also Hartigan's solicitor. I raised this conflict of
      interest formally. My letter was "received and noted."

      Aoife was the only person who made this story public. Her podcast
      reached more people than all my official reports combined.
    effects:
      trust_orla: "+15"
      heritage_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Back to heritage thread -> heritage_hub

  # --- Eamon ---

  eamon_interview:
    type: message
    text: >
      EAMON: I work for Hartigan. Or I did. I'm not proud of
      everything I've done on his sites.

      He had us up at the headland six weeks ago. Night work. "Clearance
      and preparation" he called it. We cut through the ringfort bank
