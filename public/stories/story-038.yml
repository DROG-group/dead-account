entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN STEINBACH AN DER DONAU
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to steinbach.social — the community Mastodon instance for
      the wine village of Steinbach an der Donau, Wachau Valley,
      Lower Austria.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @florian_lechner.

      A young organic winemaker. Third generation. Known for his natural
      wines and his fight to keep the Wachau chemical-free. People are
      worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> florian_profile

  florian_profile:
    type: tweet
    from: florian
    text: "das wasser in der donau bei der einleitung riecht nach chemie. jemand kippt scheiße in den fluss. ich hab beweise."
    choices:
      - That's his last real post... -> grey_vine

  grey_vine:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a blurred photo of dead grapevines. Shot at night. Overexposed.
      No caption. Posted at 2am.

      His friends say that's not his style. Florian documented every
      vintage with care. The Polizeiinspektion says he probably took
      off for a wine fair. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: inspektor
    text: >
      Wir haben eine Vermisstenanzeige bezüglich eines Bewohners von
      Steinbach aufgenommen. Zum jetzigen Zeitpunkt liegen keine
      Hinweise auf ein Verbrechen vor. Sachdienliche Hinweise bitte
      an die PI Steinbach oder unter 133.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @anna_berger is falling
      apart. His brother @lukas_lechner is taking the train from Vienna.
      His mother @elisabeth_lechner posts old photos of Florian in the
      vineyard. The Danube fisherman @josef_brandstaetter says Florian
      was right about the water.

      And the wine critic @maximilian_kronenberg is strangely silent.

      Nobody buys the police line. Nobody thinks Florian just went to
      some Weinmesse.
    effects: { trust_anna: "+5", trust_lukas: "+5" }
    choices:
      - Start following Florian's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Steinbach. Follow Florian's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Karl (Heuriger owner, knows everyone) -> karl_intro
      - Talk to Josef (fisherman, saw the water) -> josef_intro
      - Talk to Lena (teen photographer, seems shaken) -> lena_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Florian with the rhythms of a small
      Wachau village: harvest schedules, Heuriger opening times, Danube
      water levels, the bakery's daily Semmerl.

      Key names surface: Anna (girlfriend, waitress), Lukas (brother,
      student in Vienna), Elisabeth (mother, keeps the family Weingut
      running alone now), and the teens — Lena, Felix, Emma — who
      loved Florian's natural wine philosophy.

      Also prominent: DonauChem GmbH, the chemical plant at the edge
      of town. Their posts are corporate sustainability PR. Florian's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Karl -> karl_intro
      - Talk to Josef -> josef_intro
      - Talk to Lena -> lena_intro

  # --- Karl (social map) ---

  karl_intro:
    type: tweet
    from: karl
    text: >
      Heuriger is offen aber die Stimmung is am Oarsch. @florian_lechner,
      dei Tisch wartet auf di. Kumm zruck.
    effects: { trust_karl: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Karl -> karl_talk

  karl_talk:
    type: message
    text: >
      KARL: Ah, du bist neu? Servas. Schlechter Zeitpunkt zum
      Herziehen. Alle drehen durch wegen Florian.

      Let me tell you who's who. Anna is Florian's girlfriend — she
      works here at the Heuriger, she's barely holding it together.
      Elisabeth, his mother, runs the Lechner Weingut. It's been in
      the family since '62. Lukas is his younger brother, coming down
      from Vienna.

      And then there's Maximilian Kronenberg — the wine critic. He's
      written about every Wachau winery for twenty years. He and
      Florian had a... complicated relationship. Kronenberg was
      obsessed with Florian's wines. Like, beyond professional interest.
      Called them "the future of Austrian wine" and wouldn't leave the
      kid alone. Since Florian vanished, Kronenberg hasn't said a word.
      That's not like him at all.

      Oh, and DonauChem — that fucking chemical plant. Florian was the
      only one with the balls to say what everyone knows: they're
      poisoning the Donau.
    effects: { trust_karl: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Kronenberg -> karl_kronenberg
      - Ask about DonauChem -> karl_donauchem
      - Thank him and move on -> quest1_hub

  karl_kronenberg:
    type: message
    text: >
      KARL: Kronenberg? Oida, der Typ ist creepy. He's been reviewing
      Wachau wines since before Florian was born. But when Florian
      started making natural wines — unfiltered, wild yeast, the whole
      thing — Kronenberg went mental. Wrote a 5000-word essay calling
      Florian a genius. Started showing up at every Lese, every
      tasting. Wanted to co-author a book.

      Florian said no. Politely at first, then firmly. Kronenberg
      didn't take it well. He kept coming. Kept writing. Kept showing
      up at the Weingut unannounced. Florian told me once: "Der nimmt
      kein Nein an. Never."

      I thought he meant professionally. Now I'm not sure.
    effects: { trust_karl: "+5" }
    choices:
      - Ask about DonauChem -> karl_donauchem
      - Move on -> quest1_hub

  karl_donauchem:
    type: message
    text: >
      KARL: That plant has been here since the 90s. Agrochemicals,
      fertilisers, industrial solvents. The town tolerated them because
      of the jobs — 150 people work there. But the fishermen have been
      complaining for years. Dead fish near the outfall. Weird foam on
      the water. The vineyards closest to the Donau — including
      Florian's — started showing soil contamination.

      Florian was the first one to actually take water samples and send
      them to a real lab. He had results. Heavy metals, pesticide
      residues — Scheiße that shouldn't be in a river next to a UNESCO
      wine region. Two weeks later he's gone.

      Oida, ich sag dir, das ist kein Zufall.
    effects: { trust_karl: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Josef (the water, witness tease) ---

  josef_intro:
    type: tweet
    from: josef
    text: >
      35 jahr fisch ich in der donau. des wasser is nimmer wie früher.
      @florian_lechner hat recht ghabt. und jetzt is er weg.
      denkts euch euren teil.
    effects: { trust_josef: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Josef -> josef_talk

  josef_talk:
    type: message
    text: >
      JOSEF: I've fished the Donau since I was a boy. I know every
      current, every sandbank. And I'm telling you — the water near
      the DonauChem Einleitung is wrong. Has been for months. My nets
      come up with dead carp. The riverbed stinks of chemicals.

      Florian took water samples. He went down to the discharge pipe
      in a boat at night. Photographed everything. He was building a
      case. And then — weg. Gone.

      You think that's a coincidence? I don't believe in coincidences
      on the water. The Donau tells me everything, and right now she's
      saying something stinks worse than dead fish.
    effects: { trust_josef: "+10" }
    choices:
      - Did you see anything unusual recently? -> josef_night
      - Move on -> quest1_hub

  josef_night:
    type: message
    text: >
      JOSEF: The night before he vanished — I was checking my
      Fischreusen around midnight. I saw lights at Florian's Weingut.
      Not unusual, winemakers work late during vintage. But there was
      a car I didn't recognise. Black Mercedes. Parked right at the
      cellar door.

      At midnight. At a small family Weingut.

      I wrote it down in my fishing log. Nobody's asked to see it.
    effects: { trust_josef: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lena (teen photographer, witness tease) ---

  lena_intro:
    type: tweet
    from: lena
    text: >
      oida bitte @florian_lechner der is so a leiwander mensch der
      hat mir fotografie beigebracht in den weingärten. des kann ned
      sein dass er einfach weg is. wenn wer was weiß bitte sagts es
    effects: { trust_lena: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Lena -> lena_talk_early

  lena_talk_early:
    type: message
    text: >
      LENA: oida bist du neu hier? scheiß timing. egal, also florian
      is echt der beste mensch in dem ganzen kaff. er hat uns gezeigt
      wie man die weingärten fotografiert, hat uns erklärt warum
      bio-wein wichtig is. voll geil.

      und jetzt bin i voll am flippen weil der felix hat irgendwas
      gsehen am abend beim weingut aber er will nix sagen. er sagt
      es war nix aber oida... des war fix ned nix
    effects: { trust_lena: "+10" }
    choices:
      - What did Felix see? -> lena_felix_hint
      - Move on -> quest1_hub

  lena_felix_hint:
    type: message
    text: >
      LENA: ka ahnung genau. er war mit dem mountainbike am
      donauradweg und hat gesehen wie irgendwer bei florians auto
      herumtut?? oder so. er flippt voll aus und will ned drüber
      reden. musst ihn direkt fragen aber er is mega misstrauisch
      bei leit die er ned kennt. red zuerst übers biken mit ihm
      hahaha
    effects: { trust_lena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Steinbach. A Wachau wine village
      built along the Danube. A young organic winemaker who was
      exposing industrial pollution. A disappearance nobody believes
      is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Anna (Florian's girlfriend) -> anna_q1
      - Talk to Lukas (Florian's brother) -> lukas_q1
      - Check what Elisabeth (Florian's mother) is saying -> elisabeth_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Anna Q1 ---

  anna_q1:
    type: tweet
    from: anna
    text: >
      wenn irgendwer was von @florian_lechner weiß bitte rufts mi an.
      sein keller is noch offen. die fässer warten. er würde niemals
      mitten im ausbau einfach gehen. niemals.
    effects: { trust_anna: "+5", contacts_followed: "+1" }
    choices:
      - DM Anna -> anna_q1_talk

  anna_q1_talk:
    type: message
    text: >
      ANNA: I appreciate you writing but I don't know you. Florian
      has a lot of friends here. I'm sure he'll come back.

      ...I keep telling myself that. I don't believe it anymore.

      [Anna is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_anna: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Lukas Q1 ---

  lukas_q1:
    type: tweet
    from: lukas
    text: >
      mein bruder is VERSCHWUNDEN und die polizei sagt er is
      vielleicht auf einer weinmesse??? ER GEHT NICHT EINFACH OHNE
      BESCHEID ZU GEBEN. i kumm von wien. irgendwer wird mir des
      erklären.
    effects: { trust_lukas: "+5", contacts_followed: "+1" }
    choices:
      - DM Lukas -> lukas_q1_talk

  lukas_q1_talk:
    type: message
    text: >
      LUKAS: Who are you? Another person from this Kaff who's going
      to tell me to calm down? My brother called me the night before
      he disappeared. He said he had something big. He said "wenn
      irgendwas passiert, schau dir DonauChem an." Then he hung up.

      That's the last I heard from him.
    effects: { trust_lukas: "+10" }
    choices:
      - What do you think happened? -> lukas_theory
      - Move on -> quest1_hub

  lukas_theory:
    type: message
    text: >
      LUKAS: I think he found proof that DonauChem is dumping toxic
      shit in the Donau and they shut him up. But I also think that
      creepy wine critic — Kronenberg — knows more than he's saying.
      The way he talks about Florian... oida, that's not just
      professional admiration. That's something else.

      Florian told me months ago that someone was going through his
      cellar records. His tasting notes. Private stuff. He thought
      it was nothing. I don't think it was nothing.

      Scheiße, I should've listened to him.
    effects: { trust_lukas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Elisabeth Q1 ---

  elisabeth_q1:
    type: tweet
    from: elisabeth
    text: >
      Mein Florian. Dritte Generation Weingut Lechner. Er hat den
      besten Grünen Veltliner der Wachau gemacht. Er würde nie seine
      Reben allein lassen. Nie.
    effects: { trust_elisabeth: "+5", contacts_followed: "+1" }
    choices:
      - DM Elisabeth -> elisabeth_q1_talk

  elisabeth_q1_talk:
    type: message
    text: >
      ELISABETH: Thank you for your concern. Florian is a good boy.
      He loves this land, these vines. His grandfather planted them.
      He would never abandon them.

      That man — the journalist — he was here again two days before
      Florian disappeared. I saw him from the kitchen window. Standing
      in our vineyard, just... looking at the cellar. When I went out
      he drove away quickly. A silver Audi.

      I told the police. They wrote it down. That was it.
    effects: { trust_elisabeth: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Florian went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Felix (was biking at sunset near the Weingut) -> felix_interview
      - Find Josef (fisherman, works late on the river) -> josef_interview
      - Find Werner (baker, starts at 5am, saw something) -> werner_interview
      - Find Sophie (neighbouring winemaker, heard noises) -> sophie_interview

  # --- Felix (saw someone at Florian's car) ---

  felix_interview:
    type: tweet
    from: felix
    text: >
      war heute wieder am trail. irgendwie is die stimmung im ort
      komplett im oarsch seit florian weg is. kann des ned erklären
    effects: { trust_felix: "+5" }
    choices:
      - Ask Felix about that evening -> felix_talk

  felix_talk:
    type: message
    text: >
      FELIX: oida ok aber du sagst des niemandem ja. i war am
      donauradweg so gegen 19 uhr, letzte runde. und i hab den
      kronenberg — den weinkritiker — neben florians auto gsehen.
      der hat irgendwas gmacht, so in der tür herum oder so. wie er
      mi gsehen hat is er voll schnell weg.

      oida i hab nix gsagt weil i ka drama wollte aber jetzt is
      es echt heftig. des war ned normal sein verhalten, fix ned
    effects:
      trust_felix: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Josef (fisherman, saw late-night meeting) ---

  josef_interview:
    type: tweet
    from: josef
    text: >
      Erinnerung: Fischerei am Donauufer nach 22 Uhr nur mit
      Sondergenehmigung. Hab die letzten Nächte Aktivitäten bemerkt
      die ned normal sind.
    effects: { trust_josef: "+5" }
    choices:
      - Ask Josef what he saw -> josef_talk_night

  josef_talk_night:
    type: message
    text: >
      JOSEF: I was checking my nets around 23 Uhr. I saw lights at
      Florian's Weingut — the cellar door was open. And a black
      Mercedes was parked there. Two men were standing at the entrance.
      One of them I recognised: Thomas Reiter, the DonauChem
      Werksdirektor.

      At 23 Uhr. At a small family Weingut. That's not normal.

      I wrote it in my fishing log. Nobody's asked to see it yet.
    effects:
      trust_josef: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Werner (baker, saw car chase at dawn) ---

  werner_interview:
    type: tweet
    from: werner
    text: >
      Semmerl wie immer ab 5 Uhr. Aber an dem Morgen war ein Auto
      viel zu schnell auf der Donaustraße unterwegs. Viel zu schnell.
    effects: { trust_werner: "+5" }
    choices:
      - Ask Werner what he saw -> werner_talk

  werner_talk:
    type: message
    text: >
      WERNER: I start baking at 4:30 every morning. That morning I
      was opening the shutters and a car went past — fast, way too
      fast for the Donaustraße. Dark sedan. Then maybe three minutes
      later, a second car. Smaller, lighter coloured. Following?
      I don't know.

      The second car turned off toward the old Kellergasse — the
      abandoned wine cellars up the hill. The first kept going
      toward Krems.

      I told the police. They wrote it down. That was it.
    effects:
      trust_werner: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Sophie (neighbouring winemaker, heard argument) ---

