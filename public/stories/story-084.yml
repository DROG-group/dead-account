entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SCHWARZBACH
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Schwarzbach.social — the community Mastodon instance for
      the mountain village of Schwarzbach, Erzgebirge.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @annika_bauer.

      A potter. Artist. She documented the landscape and the traditions
      of the Erzgebirge through her craft. People are worried. She hasn't
      posted in six days.
    choices:
      - Look at her profile -> annika_profile

  annika_profile:
    type: tweet
    from: annika
    text: "Der Steinbruch frisst sich ins Tal. Der Bach ist trüb. Die alten Wanderwege verschwinden. Ich hab alles dokumentiert."
    choices:
      - That's her last real post... -> grey_clay

  grey_clay:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a grey, unfired lump of clay. Smashed. Shot from an odd angle.
      Posted at 4am. No caption.

      Her friends say that's not her. Annika never posted without a
      careful description of her work. The police say she probably
      needed time away. Something doesn't add up.
    choices:
      - Read the police statement -> polizei_statement
      - Look at what people are saying -> community_reaction

  polizei_statement:
    type: tweet
    from: kommissar
    text: >
      Wir haben eine Vermisstenanzeige bezüglich einer Bewohnerin von
      Schwarzbach aufgenommen. Derzeit liegen keine Hinweise auf eine
      Straftat vor. Sachdienliche Hinweise bitte an den Polizeiposten
      oder unter 110.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @lena_richter is
      desperate. Her brother @felix_bauer is driving down from Dresden.
      The photographer @jan_kessler who documented her work is posting
      worried messages. The hiking guide @thorsten_wendt says she was
      right about the quarry.

      And the journalist @katja_seidel is strangely silent.

      Nobody buys the police's line. Nobody thinks Annika just
      "needed some time off."
    effects: { trust_lena: "+5", trust_felix: "+5" }
    choices:
      - Start following Annika's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Schwarzbach. Follow Annika's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Bernd (Gasthaus owner, knows everyone) -> bernd_intro
      - Talk to Thorsten (hiking guide, saw the quarry damage) -> thorsten_intro
      - Talk to Mia (teen, seems upset) -> mia_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Annika with the rhythms of a small
      mountain village: weather warnings, bakery specials, hiking trail
      updates, woodcarving workshop schedules.

      Key names surface: Lena (best friend, kindergarten teacher), Jan
      (photographer, seems obsessed with her), Katja (journalist, oddly
      quiet), and the teens — Mia, Sophie, Niklas — who loved Annika's
      pottery workshops.

      Also prominent: Erzgebirge Kies GmbH, the gravel quarry eating
      into the valley. Their posts are corporate PR. Annika's posts
      were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Bernd -> bernd_intro
      - Talk to Thorsten -> thorsten_intro
      - Talk to Mia -> mia_intro

  # --- Bernd (social map) ---

  bernd_intro:
    type: tweet
    from: bernd
    text: >
      Gasthaus ist offen, aber das Herz ist schwer. @annika_bauer,
      dein Stammtisch wartet. Komm bald zurück.
    effects: { trust_bernd: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Bernd -> bernd_talk

  bernd_talk:
    type: message
    text: >
      BERND: Ach, du bist neu hier? Willkommen. Schlechter Zeitpunkt
      zum Ankommen. Alle sind wegen Annika total durch den Wind.

      Ich sag dir, wer hier wer ist. Lena ist Annikas beste Freundin —
      die beiden sind unzertrennlich. Jan Kessler, der Fotograf, hat
      ihre Keramik fotografiert, ihre Ausstellungen gemacht. Netter
      Kerl, aber... der hängt ziemlich an ihr. Felix ist Annikas
      großer Bruder, kommt gerade aus Dresden runtergefahren.

      Und Katja Seidel — die Journalistin — die hat mit Annika an
      was gearbeitet. An der Story über den Kiesabbau. Seit Annika weg
      ist, sagt Katja kein Wort. Das passt nicht zu ihr.

      Ach ja, und die Sprüche von Erzgebirge Kies kannst du vergessen.
      Greenwashing vom Feinsten.
    effects: { trust_bernd: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Jan -> bernd_jan
      - Ask about the quarry -> bernd_kies
      - Thank him and move on -> quest1_hub

  bernd_jan:
    type: message
    text: >
      BERND: Jan? Der ist seit zwei Jahren hier. Kam aus Leipzig,
      wollte Landschaftsfotografie machen. Hat Annika auf dem Töpfermarkt
      kennengelernt und danach war sie sein einziges Thema. Jedes
      Foto, jeder Blogpost — Annika hier, Annika da. Hunderte Bilder
      von ihr, von ihrer Werkstatt, von ihrem Ton.

      Sie fand's am Anfang schmeichelhaft. Dann wurde es ihr zu viel.
      Sie hat mir mal gesagt: "Der versteht nicht, dass nein auch nein
      heißt." Ich dachte, sie meint beruflich. Jetzt bin ich mir da
      nicht mehr so sicher.
    effects: { trust_bernd: "+5" }
    choices:
      - Ask about the quarry -> bernd_kies
      - Move on -> quest1_hub

  bernd_kies:
    type: message
    text: >
      BERND: Die Kiesgrube ist seit den Neunzigern da. Aber seit
      Krause der Chef ist, wird das immer schlimmer. Die sprengen sich
      durchs Tal, der Bach ist trüb, die alten Wanderwege werden
      gesperrt. Und jetzt wollen die erweitern — direkt bis an den
      Waldrand, wo die geschützten Quellen sind.

      Annika war die Erste, die das richtig dokumentiert hat. Fotos,
      Wasserproben, Lärmmessungen. Sie hatte Beweise, hat sie gesagt.
      Echte Beweise. Zwei Wochen später ist sie weg.
    effects: { trust_bernd: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Thorsten (the landscape, witness tease) ---

  thorsten_intro:
    type: tweet
    from: thorsten
    text: >
      dreißig jahre wandere ich diese wege. das tal stirbt. der bach
      ist grau. @annika_bauer hatte recht. und jetzt ist sie weg.
      denkt mal drüber nach.
    effects: { trust_thorsten: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Thorsten -> thorsten_talk

  thorsten_talk:
    type: message
    text: >
      THORSTEN: Ich kenne jeden Stein in diesem Tal. Und ich sage dir —
      was die Kiesgrube hier anrichtet, ist kriminell. Die Quellen
      oberhalb des Steinbruchs führen jetzt Sediment. Der Schwarzbach
      hat seinen Namen nicht von ungefähr, aber jetzt ist er grau statt
      klar. Die Fische sind weg.

      Annika hat Wasserproben genommen. Sie ist mit der Kamera in den
      Steinbruch rein, nachts, hat alles fotografiert. Sie hat eine
      Akte aufgebaut. Und dann — puff — weg.

      Zufall? Ich glaube nicht an Zufälle in den Bergen.
    effects: { trust_thorsten: "+10" }
    choices:
      - Have you seen anything unusual lately? -> thorsten_night
      - Move on -> quest1_hub

  thorsten_night:
    type: message
    text: >
      THORSTEN: Die Nacht bevor sie verschwand — ich war auf dem
      Kammweg, Sonnenaufgangstour für den nächsten Tag vorbereiten.
      Gegen Mitternacht. Ich hab Licht in Annikas Werkstatt gesehen.
      Normal, die arbeitet spät. Aber davor stand ein schwarzer
      Geländewagen. Erzgebirge Kies Logo auf der Tür.

      Um Mitternacht. Vor der Töpferwerkstatt.

      Ich hab mir damals nichts dabei gedacht. Jetzt denke ich
      ständig daran.
    effects: { trust_thorsten: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Mia (teen, witness tease) ---

  mia_intro:
    type: tweet
    from: mia
    text: >
      alter ich bin so fertig @annika_bauer hat mir töpfern beigebracht
      die ist wie ne große schwester für mich. sie verschwindet nicht
      einfach so. wenn wer was weiß dann sagt es bitte
    effects: { trust_mia: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Mia -> mia_talk_early

  mia_talk_early:
    type: message
    text: >
      MIA: ey bist du neu hier? boah ey krasses timing alter. also
      annika ist echt die beste person in diesem kaff. sie hat uns
      töpfern beigebracht, hat uns gezeigt wie man ton macht, wie man
      die glasur mischt. voll cool halt.

      und jetzt bin ich voll am ausrasten weil sophie was gesehen hat
      letzte woche am steinbruch aber die will nicht drüber reden. die
      sagt es ist nix aber alter das IST was sah
    effects: { trust_mia: "+10" }
    choices:
      - What did Sophie see? -> mia_sophie_hint
      - Move on -> quest1_hub

  mia_sophie_hint:
    type: message
    text: >
      MIA: keine ahnung genau. sie war mountainbiken mit niklas beim
      steinbruch und hat gesehen wie jan — der fotograf — irgendwas an
      annikas werkstatt gemacht hat. so am fenster oder so. total
      creepy digga. sophie hat schiss das ihr keiner glaubt. probier
      erst mal über fahrräder oder so mit ihr zu reden lol
    effects: { trust_mia: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Schwarzbach. An Erzgebirge mountain
      village built around craft and forest. A potter who was exposing
      quarry destruction. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Lena (Annika's best friend) -> lena_q1
      - Talk to Jan (photographer) -> jan_q1
      - Check what Felix (Annika's brother) is saying -> felix_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lena Q1 ---

  lena_q1:
    type: tweet
    from: lena
    text: >
      hat jemand was von @annika_bauer gehört? bitte meldet euch. ihre
      werkstatt steht offen. der ofen ist aus. ihr ton trocknet ein.
      sie würde niemals ihren ton eintrocknen lassen.
    effects: { trust_lena: "+5", contacts_followed: "+1" }
    choices:
      - DM Lena -> lena_q1_talk

  lena_q1_talk:
    type: message
    text: >
      LENA: Danke dass du schreibst, aber ich kenn dich nicht. Annika
      hat viele Freunde hier. Die kommt bestimmt wieder.

      ...Ich sag das die ganze Zeit. Ich glaub's nicht mehr.

      [Lena is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_lena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jan Q1 ---

  jan_q1:
    type: tweet
    from: jan
    text: >
      Die Werkstatt ist leer ohne @annika_bauer. Ihre letzten Stücke
      stehen noch auf dem Regal. Unglasiert. Sie würde nie unfertige
      Arbeit stehen lassen. Irgendetwas ist passiert.
    effects: { trust_jan: "+5", contacts_followed: "+1" }
    choices:
      - DM Jan -> jan_q1_talk

  jan_q1_talk:
    type: message
    text: >
      JAN: Annika und ich arbeiten seit über einem Jahr zusammen. Sie
      töpfert, ich fotografiere. Ihre Kunst festzuhalten, das ist mein
      Projekt. Dieses Umweltding — der Kiesabbau — das war ihr alles.
      Sie hatte Daten, Fotos, Analysen. Kurz vor der Veröffentlichung.

      Ich wollte ihr helfen. Immer wieder. Sie meinte, sie hat das im
      Griff. Sie hat mit einer Journalistin zusammengearbeitet. Ich
      wollte sie nur unterstützen.

      [Jan seems earnest. Or obsessive?]
    effects: { trust_jan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Felix Q1 ---

  felix_q1:
    type: tweet
    from: felix
    text: >
      meine schwester ist VERSCHWUNDEN und die polizei erzählt mir sie
      braucht vielleicht einfach ne auszeit??? SIE FÄHRT NICHT EINFACH
      WEG OHNE BESCHEID ZU SAGEN. ich fahr jetzt aus dresden runter.
      jemand wird mir das erklären.
    effects: { trust_felix: "+5", contacts_followed: "+1" }
    choices:
      - DM Felix -> felix_q1_talk

  felix_q1_talk:
    type: message
    text: >
      FELIX: Wer bist du? Noch so einer aus dem Dorf, der mir sagen
      will, ich soll mich beruhigen? Meine Schwester hat mich am
      Abend bevor sie verschwunden ist angerufen. Sie hat gesagt, sie
      hat was Großes. Sie hat gesagt: "Wenn was passiert, guck dir
      Erzgebirge Kies an." Dann hat sie aufgelegt.

      Das war das Letzte, was ich von ihr gehört hab.
    effects: { trust_felix: "+10" }
    choices:
      - What do you think happened? -> felix_theory
      - Move on -> quest1_hub

  felix_theory:
    type: message
    text: >
      FELIX: Ich glaube, sie hat Beweise gefunden, dass Erzgebirge Kies
      illegal abbaut und die haben sie mundtot gemacht. Aber ich denke
      auch, dass dieser Fotograf — Jan — mehr weiß als er sagt. Wie der
      über sie redet... das ist nicht nur Beruf. Das ist was anderes.

      Annika hat mir vor Monaten erzählt, dass jemand an ihren Sachen
      war in der Werkstatt. An ihrem Rechner. Sie meinte, ist bestimmt
      nichts. Ich glaube, es war was.
    effects: { trust_felix: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Annika went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Sophie (was mountain biking near the quarry) -> sophie_interview
      - Find Thorsten (hiking guide, was on the ridge) -> thorsten_interview
      - Find Erik (woodcarver, early morning at the workshop) -> erik_interview
      - Find Ines (baker, starts at 5am, saw something) -> ines_interview

  # --- Sophie (saw Jan at the workshop) ---

  sophie_interview:
    type: tweet
    from: sophie
    text: >
      war gestern mit dem rad unterwegs und die stimmung im tal ist
      einfach komisch. irgendwas stimmt hier nicht. kann das nicht
      erklären aber ich spürs
    effects: { trust_sophie: "+5" }
    choices:
      - Ask Sophie about that evening -> sophie_talk

  sophie_talk:
    type: message
    text: >
      SOPHIE: alter ok aber du sagst das keinem ja? ich war mit niklas
      am steinbruch, mountainbike halt. und ich hab jan gesehen — den
      fotografen — der war an annikas werkstatt. der hat durchs fenster
      geguckt und dann hat er irgendwas unter die fensterbank geklebt.
      als er mich gesehen hat, ist der voll schnell abgehauen.

      digga ich hab nix gesagt weil wer glaubt schon ner siebzehnjährigen
      die nen erwachsenen beschuldigt. scheiße alter das ist nicht normal
    effects:
      trust_sophie: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Thorsten (hiking guide, saw late-night meeting) ---

  thorsten_interview:
    type: tweet
    from: thorsten
    text: >
      Erinnerung: Der Steinbruchweg ist ab 18 Uhr gesperrt.
      Trotzdem waren gestern Nacht wieder Fahrzeuge unterwegs.
    effects: { trust_thorsten: "+5" }
    choices:
      - Ask Thorsten what he saw -> thorsten_talk_q2

  thorsten_talk_q2:
    type: message
    text: >
      THORSTEN: Ich war auf dem Kammweg, gegen 22 Uhr. Von oben siehst
      du ins ganze Tal. Vor Annikas Werkstatt standen zwei Fahrzeuge.
      Ihr kleiner roter Polo. Und ein schwarzer Geländewagen — mit
      Erzgebirge Kies Logo. Zwei Männer standen am Eingang. Einer
      davon war Detlef Krause, der Geschäftsführer. Ich kenn den.

      Um 22 Uhr. An der Töpferwerkstatt. Das ist nicht normal.

      Ich hab's in mein Tourenbuch eingetragen. Keiner hat mich
      danach gefragt.
    effects:
      trust_thorsten: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Erik (saw Annika fleeing) ---

  erik_interview:
