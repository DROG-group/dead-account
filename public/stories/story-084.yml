    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Kommissar Brandt reopens the case. With your evidence — the
      anonymous account, the hidden camera, the access logs, the
      witness testimonies — Jan is arrested for stalking and
      harassment. A miniature camera is recovered from Annika's
      workshop windowsill.

      Katja Seidel, finally in possession of Annika's full evidence
      package, publishes the Erzgebirge Kies story in the Freie Presse
      and it's picked up nationally. The Bergamt orders an unannounced
      inspection. The quarry expansion is halted and the illegal zone
      is ordered to be recultivated. Detlef Krause faces criminal
      charges for falsifying environmental reports and operating
      without permits.

      And Annika Bauer, reading the story from a friend's house in
      Annaberg-Buchholz, calls her brother for the first time in
      nine days.

      "Ich komm nach Hause."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: annika
    text: >
      der ton lügt nicht. und die leute von schwarzbach auch nicht.
      danke, dass ihr nicht aufgegeben habt.
    choices:
      - The End -> game_complete

  # --- ENDING B: Detlef (Partial Ending) ---

  confront_detlef:
    type: message
    text: >
      You present the quarry evidence to Detlef Krause:

      "I have photographs of the undeclared expansion zone. I have
      water samples showing sediment levels ten times the legal limit.
      I have your original lab reports showing the data was falsified.
      I have GPS coordinates of illegal blasting in protected
      watershed."
    choices:
      - Send -> detlef_response

  detlef_response:
    type: message
    text: >
      DETLEF: Dieses Gespräch wird an unsere Rechtsabteilung
      weitergeleitet. Jede Veröffentlichung verleumderischer
      Informationen wird unmittelbare rechtliche Schritte nach sich
      ziehen. Erzgebirge Kies hat stets innerhalb der behördlichen
      Vorgaben gearbeitet.

      But it's too late. You've sent the evidence to Katja, to the
      Bürgerinitiative, and to the Bergamt.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The quarry story breaks. Erzgebirge Kies is ordered to halt
      expansion pending investigation. The quarry may close entirely.
      One hundred and fifty jobs hang in the balance. The village
      is divided.

      But Annika?

      Without the stalking evidence, Jan is never investigated. He
      continues to photograph the village. He continues to monitor her
      accounts. He creates a new anonymous profile.

      Three months later, Annika reads about Erzgebirge Kies online.
      She returns quietly. She moves her workshop. She installs new
      locks. She checks her windows every morning.

      The corporation is exposed. But the person who terrorised
      Annika walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: annika
    text: "ich bin zurück. das tal erholt sich. der rest... mal sehen."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_ralf:
    type: message
    text: >
      You confront Mayor Zimmermann with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> ralf_response

  ralf_response:
    type: tweet
    from: uwe
    text: >
      Mein Mandant nimmt Ihre Anschuldigungen zur Kenntnis. Jede
      öffentliche Verbreitung verleumderischer Äußerungen wird
      unverzüglich rechtlich verfolgt. — Kanzlei Fischer & Partner,
      Chemnitz
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Zimmermann and Erzgebirge Kies's illegal quarrying —
      and there isn't one beyond political protection — your evidence
      is insufficient.

      Erzgebirge Kies continues to operate. Jan continues to watch.
      Annika stays in hiding.

      Six months later, @silke_meier creates a new account. It
      follows Annika's brother.
    choices:
      - The End -> game_complete

