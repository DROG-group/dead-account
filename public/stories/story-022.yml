      to Ras il-Bajja. MedBuild's construction permit is revoked.
      Steve Bonnici faces criminal charges for destruction of a
      heritage site. George Axiaq resigns.

      And Toni Camilleri, reading the story from a friend's boat
      in Gozo, calls his brother for the first time in nine days.

      "Ġej lura d-dar."
    choices:
      - See the epilogue -> ending_a_epilogue

