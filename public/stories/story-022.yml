  steve_response:
    type: message
    text: >
      STEVE: This communication has been forwarded to our legal team.
      MedBuild Construction operates within all applicable permits
      and regulations. Any publication of defamatory statements will
      result in immediate litigation.

      But it's too late. You've sent the evidence to Rachel, to
      Heritage Watch Malta, and to the Superintendence.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The heritage story breaks. MedBuild is ordered to halt
      construction pending investigation. The marina project may
      be dead. The mayor faces a corruption inquiry. The village
      is divided — some celebrate, others worry about lost jobs.

      But Toni?

      Without the stalking evidence, Daniela is never investigated.
      She continues to run the dive centre. She continues to shadow
      Toni's sites. She creates a new anonymous account.

      Three months later, Toni reads about MedBuild online. He
      returns quietly. He takes up his research again. But he stops
      diving alone. He changes his dive schedules without telling
      anyone. He checks his gear for trackers every morning.

      Some days, on deep dives, he sees bubbles in the distance.
      Following.

      The corporation is exposed. But the person who terrorised
      Toni walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: toni
    text: "lura marsaskala. il-bini waqaf. il-bqija... naraw."
    choices:
