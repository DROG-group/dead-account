  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without direct
      evidence linking Axiaq to Toni's disappearance — and there
      isn't any beyond the bribery — your case goes nowhere.

      MedBuild continues to build. Daniela continues to dive.
      Toni stays in hiding.

      Six months later, @ghostdiver99 creates a new account. It
      follows Toni's brother. And Maria.

      The rubble settles over the Phoenician harbour. Layer by
      layer, history disappears. Like Toni.
    choices:
      - The End -> game_complete

