entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN MARSASKALA BAY
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to marsaskalabay.social — the community Mastodon instance
      for the fishing village of Marsaskala Bay, Malta.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice one name everywhere:
      @toni_camilleri.

      A marine archaeologist. Freediver. He mapped the underwater ruins
      off the coast — ancient harbours, Roman anchors, Phoenician wrecks.
      People are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> toni_profile

  toni_profile:
    type: tweet
    from: toni
    text: "Found something massive at the Ras il-Bajja site. This changes everything we know about the harbour. They can't build on this. I won't let them."
    choices:
      - That's his last real post... -> grey_wave

  grey_wave:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a dark, blurry underwater shot. Nothing recognisable. Posted at
      4am. No caption.

      His friends say that's not his style. Toni always tagged his dive
      sites, always wrote long captions about what he found. The police
      say he probably went on a trip. Nobody believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: sgt
    text: >
      We have received a report regarding a Marsaskala Bay resident.
      At this stage, there is no evidence of foul play. Any relevant
      information can be communicated to the Marsaskala station or
      by calling 112.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His girlfriend @maria_vella is
      posting desperate messages. His brother @luke_camilleri is
      driving down from Birkirkara. His dive partner @daniela_borg
      has gone silent — people notice. The fisherman @pawlu_farrugia
      says Toni was right about the construction site.

      And the journalist @rachel_calleja seems to know more than
      she's saying.

      Nobody buys the police line. Toni didn't just go on a trip.
      His dive gear is still in his flat. His luzzu is still moored
      at the harbour.
    effects: { trust_maria: "+5", trust_luke: "+5" }
    choices:
      - Start following Toni's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Marsaskala Bay. Follow Toni's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Carmen (bar owner, knows everyone) -> carmen_intro
      - Talk to Pawlu (fisherman, saw the construction) -> pawlu_intro
      - Talk to Kyle (teen, looks up to Toni) -> kyle_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Toni with the rhythms of a small
      Maltese fishing village: festa preparations, luzzu repairs,
      fishing reports, complaints about parking.

      Key names surface: Maria (girlfriend, teacher), Daniela (dive
      partner, oddly quiet), Luke (brother, furious), and the teens
      — Kyle, Charlene, Lara — who Toni took on dives to show them
      the underwater ruins.

      Also prominent: MedBuild Construction Ltd, the company building
      a luxury marina complex on the headland. Toni's posts were a
      direct challenge to their project.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Carmen -> carmen_intro
      - Talk to Pawlu -> pawlu_intro
      - Talk to Kyle -> kyle_intro

  # --- Carmen (social map) ---

  carmen_intro:
    type: tweet
    from: carmen
    text: >
      il-bar miftuħ imma qalbi magħluqa. @toni_camilleri, il-mejda
      tiegħek qed tistenniek. ejja lura.
    effects: { trust_carmen: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Carmen -> carmen_talk

  carmen_talk:
    type: message
    text: >
      CARMEN: Aw, you're new here? Mela... bad timing. Everyone's on
      edge about Toni.

      Let me tell you who's who. Maria is his girlfriend — sweet girl,
      teaches at the primary school. She's a mess right now. Luke is
      Toni's older brother, coming down from Birkirkara, ready to flip
      tables. Daniela Borg is his dive partner. They've been diving
      together since they were teenagers. She's... intense about him.
      Always has been.

      And then there's MedBuild. Madonna, don't get me started. Steve
      Bonnici thinks he can buy this whole village and turn it into
      another Sliema. Toni was the only one standing in his way.

      Prosit to Toni for having the balls to fight them.
    effects: { trust_carmen: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Daniela -> carmen_daniela
      - Ask about MedBuild -> carmen_medbuild
      - Thank her and move on -> quest1_hub

  carmen_daniela:
    type: message
    text: >
      CARMEN: Daniela? Mela, how do I say this... She and Toni have
      been diving together since they were like fifteen. She's an
      amazing diver, runs the dive centre. But there's always been
      something... more, from her side. Everyone sees it except Toni.

      When he started dating Maria two years ago, Daniela took it
      hard. She was professional about it but... aw, I'd catch her
      watching them at the bar. And she started going on solo dives
      to the same sites Toni mapped, at weird hours. Night dives,
      alone. That's not safe and she knows it.

      She told me once, after too much Cisk, "Nobody understands the
      sea like we do. Maria doesn't deserve him." I thought she was
      just drunk. Now I'm not sure.
    effects: { trust_carmen: "+5" }
    choices:
      - Ask about MedBuild -> carmen_medbuild
      - Move on -> quest1_hub

  carmen_medbuild:
    type: message
    text: >
      CARMEN: MedBuild. Ostja, where do I start. Steve Bonnici bought
      the headland two years ago. Plans to build a luxury marina —
      apartments, yacht berths, a fucking hotel. On top of what Toni
      says is a Phoenician harbour site.

      Toni found artefacts there. Anchors, pottery, carved stone.
      He filed for heritage protection status. If that goes through,
      MedBuild can't build shit. We're talking millions down the
      drain.

      Bonnici's been cosying up to the mayor. George Axiaq suddenly
      has a new car and his house got renovated. Everyone knows but
      nobody says it out loud. Except Toni. Toni said it out loud.

      And now Toni's gone.
    effects: { trust_carmen: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Pawlu (fisherman, witness tease) ---

  pawlu_intro:
    type: tweet
    from: pawlu
    text: >
      erbgħin sena sajd f'dan il-baħar. @toni_camilleri kien jaf
      x'hemm taħt l-ilma. u issa sparixxa. aħsbu ftit.
    effects: { trust_pawlu: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Pawlu -> pawlu_talk

  pawlu_talk:
    type: message
    text: >
      PAWLU: I've been fishing these waters since before you were born.
      Forty-five years. I know every rock, every current, every mood
      the sea has.

      Toni was special. He'd dive down and come back with stories —
      Roman anchors, Phoenician carvings, things that had been under
      there for thousands of years. He mapped the whole seabed off
      Ras il-Bajja. And what he found there — mela, it should have
      stopped MedBuild dead.

      But money talks in Malta. Heritage doesn't. Not when someone
      like Bonnici is waving millions around.

      You think Toni just went on holiday? Madonna. That boy lived
      for this village. He wouldn't leave without his dive gear and
      his luzzu.
    effects: { trust_pawlu: "+10" }
    choices:
      - Did you see anything unusual recently? -> pawlu_night
      - Move on -> quest1_hub

  pawlu_night:
    type: message
    text: >
      PAWLU: The night before he vanished — I was coming back from
      night fishing, around midnight. I saw lights at the dive
      centre. Not unusual, Daniela works late sometimes. But then I
      saw a car I didn't recognise. Big SUV, dark. Not from the
      village. Parked right by the slipway.

      And I saw two people on the jetty. One of them was carrying
      something heavy, loading it onto a RIB. At midnight. In the
      dark.

      I called out but they cut the engine and the RIB disappeared
      around the headland. Toward the MedBuild site.

      I told the police. They wrote it down. That was it.
    effects: { trust_pawlu: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kyle (teen, witness tease) ---

  kyle_intro:
    type: tweet
    from: kyle
    text: >
      bro im so fucked up rn @toni_camilleri literally taught me how
      to dive he's like an older brother to me. mela if anyone knows
      anything SPEAK UP ffs this is bullshit
    effects: { trust_kyle: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Kyle -> kyle_talk_early

  kyle_talk_early:
    type: message
    text: >
      KYLE: aw you're new? mela welcome to the shitshow basically.
      toni is the best person in this whole village no cap. he took
      me diving, showed me the ruins, taught me to respect the sea
      and shit. he was gonna help me get my dive certification.

      and now he's just gone?? ostja that's not him bro. he wouldn't
      leave without telling anyone. his luzzu is still here. his
      gear is still at the flat.

      also like... charlene saw something weird with daniela the
      other night but she's scared to talk about it. you should
      ask her but like... be chill about it yeah?
    effects: { trust_kyle: "+10" }
    choices:
      - What did Charlene see? -> kyle_charlene_hint
      - Move on -> quest1_hub

  kyle_charlene_hint:
    type: message
    text: >
      KYLE: bro idk exactly she was walking home from her nanna's
      house and she saw daniela at the dive centre like super late.
      and daniela was loading toni's gear into her car. like HIS
      gear. his tanks, his cameras. at like 2am or some shit.

      charlene thought it was weird but she didn't say anything
      cos daniela's her dive instructor and she didn't wanna start
      drama. but now with toni missing... mela that's sus as fuck
      right??

      talk to her but don't say i told you. she'll kill me lol
    effects: { trust_kyle: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Marsaskala Bay. A Maltese fishing
      village built around the sea. A marine archaeologist who was
      blocking a construction project worth millions. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Maria (Toni's girlfriend) -> maria_q1
      - Talk to Daniela (Toni's dive partner) -> daniela_q1
      - Check what Luke (Toni's brother) is saying -> luke_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Maria Q1 ---

  maria_q1:
    type: tweet
    from: maria
    text: >
      jekk xi ħadd ra lil @toni_camilleri please ċemplu. l-affarijiet
      kollha tiegħu għadhom hawn. id-dive gear. il-luzzu. il-laptop.
      mhux se jitlaq mingħajr dawn l-affarijiet.
    effects: { trust_maria: "+5", contacts_followed: "+1" }
    choices:
      - DM Maria -> maria_q1_talk

  maria_q1_talk:
    type: message
    text: >
      MARIA: I appreciate you reaching out but I don't know you.
      Toni has a lot of friends in this village. I keep waiting for
      him to walk through the door.

      ...I know he's not going to. Something happened to him.

      [Maria is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_maria: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Daniela Q1 ---

  daniela_q1:
    type: tweet
    from: daniela
    text: >
      If anyone has information about @toni_camilleri, please contact
      the police or the dive centre. We're organising search dives
      along the coast. Volunteers welcome.
    effects: { trust_daniela: "+5", contacts_followed: "+1" }
    choices:
      - DM Daniela -> daniela_q1_talk

  daniela_q1_talk:
    type: message
    text: >
      DANIELA: Toni and I have been dive partners for twelve years.
      Since we were kids. I know every site he's mapped, every wreck
      he's documented. If anyone's going to find him, it's me.

      He was obsessed with the Ras il-Bajja site. He said it was the
      most important archaeological find in Malta in decades. He was
      right. And MedBuild was going to destroy it.

      I offered to help with the heritage filing. He said he had it
      handled. He said he was working with a journalist. He always
      had to do everything himself.

      [Daniela seems concerned. Dedicated. Or something else?]
    effects: { trust_daniela: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Luke Q1 ---

  luke_q1:
    type: tweet
    from: luke
    text: >
      ħija SPARIXXA u l-pulizija qed jgħiduli li forsi mar xi mkien??
      MADONNA HU MA JITLAQX MINGĦAJR MA JGĦID. qed niġi marsaskala.
      xi ħadd se jispjegali x'ġara.
    effects: { trust_luke: "+5", contacts_followed: "+1" }
    choices:
      - DM Luke -> luke_q1_talk

  luke_q1_talk:
    type: message
    text: >
      LUKE: Who are you? Another person who's gonna tell me to calm
      down? Ostja, my brother called me the night before he disappeared.
      He was excited AND scared. He said he found something huge at
      Ras il-Bajja — not just Phoenician, something older. He said
      "if they find out what's really there, they'll stop at nothing."

      I asked who. He said "Bonnici's people. And someone closer."
      Then the line went weird and he hung up.

      That's the last I heard from him.
    effects: { trust_luke: "+10" }
    choices:
      - What do you think happened? -> luke_theory
      - Move on -> quest1_hub

  luke_theory:
    type: message
    text: >
      LUKE: Mela, I think MedBuild found out about his heritage
      filing and sent people to shut him up. Millions of euros at
      stake — you think they won't get dirty? In Malta? Madonna,
      wake up.

      But there's something else. Toni told me months ago that
      someone was following him on dives. Going to the same sites
      after him. He'd find evidence that someone had been to his
      mapped locations — fin marks in the silt, things moved.

      He thought it was someone from MedBuild checking what he'd
      found. But the dive pattern was too skilled, too precise.
      Only a few people in Malta dive like that. Daniela's one of
      them.

      I'm not accusing anyone. But something's wrong.
    effects: { trust_luke: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Toni went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Charlene (was walking home, saw Daniela) -> charlene_interview
      - Find Noel (harbour master, works late) -> noel_interview
      - Find Kevin (boat mechanic, heard engines) -> kevin_interview
      - Find Joseph (parish priest, saw vehicles) -> joseph_interview

  # --- Charlene (saw Daniela at dive centre) ---

  charlene_interview:
    type: tweet
    from: charlene
    text: >
      can't sleep. keep thinking about toni. this village feels wrong
      rn. like something's broken underneath.
    effects: { trust_charlene: "+5" }
    choices:
      - Ask Charlene about that evening -> charlene_talk

  charlene_talk:
    type: message
    text: >
      CHARLENE: ok promise you won't tell anyone i said this right??
      cos daniela is my dive instructor and i don't want shit with
      her.

      i was walking home from nanna's house that night, around 2am
      cos we were watching a film and it went late. and i saw daniela
      at the dive centre. she was loading stuff into the back of her
      car. tanks, bags, camera equipment. i recognised toni's yellow
      dry bag — the one he always takes on big dives.

      she was alone and she was in a rush. when she saw me she froze.
      told me she was "organising gear for a morning dive." at 2am??
      mela come on.

      i didn't think much of it then but now... ostja, why did she
      have toni's gear?
    effects:
      trust_charlene: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Noel (harbour master, saw boat leave) ---

  noel_interview:
    type: tweet
    from: noel
    text: >
      Reminder: all vessel movements after 22:00 must be logged with
      the harbour office. I've noted two unlogged departures this
      week. This is a safety issue.
    effects: { trust_noel: "+5" }
    choices:
      - Ask Noel what he saw -> noel_talk

  noel_talk:
    type: message
    text: >
      NOEL: I was doing my evening round at around 23:00. I saw an
      SUV I didn't recognise parked at the slipway — dark, tinted
      windows, rental plates. Two men were loading equipment onto a
      RIB. Professional looking. Not fishermen, not divers I know.

      One of them had MedBuild hi-vis jackets in the back seat. I
      saw the logo when the door was open.

      They launched the RIB and headed around the headland. Toward
      Ras il-Bajja. Where Toni's been diving.

      I logged it. Nobody's asked to see my log.
    effects:
      trust_noel: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Kevin (heard engines, saw confrontation) ---

  kevin_interview:
    type: tweet
    from: kevin
    text: >
      kont qed naħdem fuq dgħajsa fil-garage u smajt magni weird
      barra l-port bil-lejl. mhux magni tas-sajd.
    effects: { trust_kevin: "+5" }
    choices:
      - Ask Kevin what he heard -> kevin_talk

  kevin_talk:
    type: message
    text: >
      KEVIN: I was in the boat shed working late — I had an engine
      rebuild to finish. Around 22:00 I heard voices at the slipway.
      Loud. Aggressive. I looked out and saw Toni arguing with two
