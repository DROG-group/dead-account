  # --- ENDING B: Steve Bonnici (Partial Ending) ---

  confront_steve:
    type: message
    text: >
      You present the construction evidence to Steve Bonnici:

      "I have photographs of MedBuild dumping rubble on the Ras
      il-Bajja site. I have work orders with your signature. I have
      financial records showing payments to Mayor Axiaq. I have
      Toni's complete archaeological survey proving what you tried
      to bury."
    choices:
