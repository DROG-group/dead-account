entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SIGULDAS MEŽI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to SiguldasMezi.social — the community Mastodon instance for
      the village of Siguldas Meži, nestled in the Gauja valley, Latvia.

      The local feed is uneasy today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @elina_kalnina.

      A folk dancer. Tradition keeper. She led the village dance group
      'Gauja' and fought to protect the old-growth forest clearing where
      they rehearsed. People are worried. She hasn't posted in six days.
    choices:
      - Look at her profile -> elina_profile

  elina_profile:
    type: tweet
    from: elina
    text: "Šī izcirtuma vieta ir svēta. Te dejoja mūsu vecvecāki. GreenValley nedrīkst to aizskart. Man ir pierādījumi."
    choices:
      - That's her last real post... -> grey_forest

  grey_forest:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photo of tree trunks in fog. Posted at 4am. No caption.

      Her friends say that's not her style. Elīna always wrote long
      captions about traditions and nature. The police say she probably
      went to Rīga. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: inspektors
    text: >
      Ir saņemts iesniegums par Siguldas Mežu iedzīvotāju. Šobrīd nav
      pamata uzskatīt, ka noticis noziedzīgs nodarījums. Jebkādu
      noderīgu informāciju lūdzam sniegt pa tālruni 110 vai iecirknī.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @marta_berzina is
      desperate. Her brother @edgars_kalnins is driving from Rīga.
      Her dance group leader @kristaps_liepins is posting worried
      messages but they feel oddly performative.

      The forestry guard @sandris_klavins says she was right about
      the clearing.

      And the journalist @zane_priede is strangely silent.

      Nobody buys the police line. Nobody thinks Elīna just "went
      to Rīga."
    effects: { trust_marta: "+5", trust_edgars: "+5" }
    choices:
      - Start following Elīna's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Siguldas Meži. Follow Elīna's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Ilze (café owner, knows everyone) -> ilze_intro
      - Talk to Sandris (forestry guard, knows the clearing) -> sandris_intro
      - Talk to Agnese (teen dancer, seems shaken) -> agnese_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Elīna with the rhythms of a small
      Gauja valley village: mushroom foraging schedules, Daina's pharmacy
      hours, weather warnings about early frost.

      Key names surface: Marta (best friend, nurse), Kristaps (dance
      group leader, seems rattled), Zane (journalist, oddly quiet),
      and the teens — Agnese, Laura, Roberts — who adored Elīna's
      dance classes.

      Also prominent: GreenValley Golf & Spa SIA, the development
      company planning to build a golf course on the old-growth forest
      clearing. Their posts are corporate PR. Elīna's posts were the
      opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Ilze -> ilze_intro
      - Talk to Sandris -> sandris_intro
      - Talk to Agnese -> agnese_intro

  # --- Ilze (social map) ---

  ilze_intro:
    type: tweet
    from: ilze
    text: >
      Kafejnīca atvērta, bet sirds nav priekā. @elina_kalnina, tavs
      galds tevi gaida. Atgriezies, mīļā.
    effects: { trust_ilze: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ilze -> ilze_talk

  ilze_talk:
    type: message
    text: >
      ILZE: Oh, you're new here? Welcome. Terrible timing though.
      Everyone's sick with worry about Elīna.

      Let me tell you who's who. Marta is Elīna's best friend — they
      share a flat above Daina's pharmacy. Kristaps Liepiņš runs the
      dance group with Elīna. Well... he runs it, she's the soul of
      it. He's been strange about her for years. Too close. She tried
      to set boundaries, but he's the choreographer, so...

      Edgars is Elīna's brother, he's driving from Rīga. And Zane
      Priede, the journalist — she and Elīna were working on something
      together. Something about the clearing and GreenValley. Zane has
      gone completely silent.

      Oh, and don't believe a word of GreenValley's "sustainable
      development" bullshit. Viņi grib visu nocirst.
    effects: { trust_ilze: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Kristaps -> ilze_kristaps
      - Ask about GreenValley -> ilze_greenvalley
      - Thank her and move on -> quest1_hub

  ilze_kristaps:
    type: message
    text: >
      ILZE: Kristaps? Nu bļe, where do I start. He founded the dance
      group fifteen years ago. It was his thing. Then Elīna joined five
      years back and suddenly she was the star. She's twenty-three, full
      of fire, the kids love her. He's forty-one and... didn't handle it
      well.

      He started wanting her at every rehearsal, every performance,
      every festival. If she danced with someone else, he'd rework the
      choreography to pair them together. She told me once, "Viņš
      neļauj man elpot." He doesn't let me breathe.

      After she started the fight against GreenValley, he got worse.
      Followed her to meetings, showed up at her flat uninvited. She
      tried to leave the group twice. Both times he begged her back.
    effects: { trust_ilze: "+5" }
    choices:
      - Ask about GreenValley -> ilze_greenvalley
      - Move on -> quest1_hub

  ilze_greenvalley:
    type: message
    text: >
      ILZE: GreenValley Golf & Spa. Rīga money. They want to build an
      eighteen-hole golf course in the old-growth clearing by the Gauja.
      That clearing has been there for hundreds of years — it's where
      the village has held midsummer celebrations, where the dance group
      rehearses, where the old oaks stand.

      The pagasts council approved the environmental impact assessment
      last month. But Elīna found problems. She said the assessment was
      faked — they used data from a different site. She had documents.
      Photos of protected species in the clearing that weren't in the
      report.

      Two weeks later, she vanishes. Sūds, it makes you think.
    effects: { trust_ilze: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sandris (forestry guard, witness tease) ---

  sandris_intro:
    type: tweet
    from: sandris
    text: >
      trīsdesmit gadus sargāju šo mežu. @elina_kalnina bija vienīgā
      kas saprata ko šī vieta nozīmē. un tagad viņas nav. padomājiet.
    effects: { trust_sandris: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sandris -> sandris_talk

  sandris_talk:
    type: message
    text: >
      SANDRIS: I've guarded this forest for thirty years. I know every
      trail, every clearing, every old oak. And I'm telling you — the
      clearing where Elīna danced, where we celebrate Jāņi, that's
      irreplaceable. There are trees there older than the Latvian state.

      Elīna documented everything. She found great crested newts and
      Eurasian lynx tracks in the clearing — both protected species.
      That should have killed the GreenValley project dead. She sent
      the evidence to the Vides pārvalde.

      Then — poof. Gone.

      You think that's a coincidence? I've spent my life in the forest.
      I know when something is being hunted.
    effects: { trust_sandris: "+10" }
    choices:
      - Did you see anything unusual recently? -> sandris_night
      - Move on -> quest1_hub

  sandris_night:
    type: message
    text: >
      SANDRIS: The night before she vanished — I was doing a late patrol,
      around midnight. I saw lights at the clearing. Not unusual, sometimes
      teenagers go there. But there were two vehicles on the forest road.
      One was Elīna's grey Volkswagen. The other was a black SUV with
      Rīga plates.

      At midnight. In the clearing.

      I didn't approach — I thought it was a meeting, maybe with
      environmentalists. Now I can't stop thinking about it.
    effects: { trust_sandris: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Agnese (teen dancer, witness tease) ---

  agnese_intro:
    type: tweet
    from: agnese
    text: >
      man ir tik sūdīgi nu bļe @elina_kalnina viņa mums iemācīja
      dejot no sirds nevis no galvas. viņa nekad tā vienkārši neaizietu.
      ja kāds kaut ko zina pls sakiet
    effects: { trust_agnese: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Agnese -> agnese_talk_early

  agnese_talk_early:
    type: message
    text: >
      AGNESE: tu esi jauns te? nu bļe slikts laiks ierasties. elīna ir
      literally labākais cilvēks šajā ciemā. viņa mums mācīja dejot,
      viņa stāstīja par vecajām tradīcijām, viņa bija kā vecākā māsa
      mums visiem.

      un tagad es esmu nobijusies jo laura redzēja kaut ko dīvainu
      tajā vakarā pie deju zāles bet viņa negrib runāt. saka ka nav
      nekas bet nu bļe... tas nav nekas sah
    effects: { trust_agnese: "+10" }
    choices:
      - What did Laura see? -> agnese_laura_hint
      - Move on -> quest1_hub

  agnese_laura_hint:
    type: message
    text: >
      AGNESE: nu tā es precīzi nezinu. viņa bija pie deju zāles vakarā
      un redzēja kādu pie elīnas auto?? vai kaut ko tādu. viņa ir
      nobijusies un negrib runāt ar svešiem. pamēģini vispirms
      parunāties par deju vai foto ar viņu lol
    effects: { trust_agnese: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Siguldas Meži. A Gauja valley village
      built around the forest. A folk dancer who was fighting to protect
      the old-growth clearing. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Marta (Elīna's best friend) -> marta_q1
      - Talk to Kristaps (dance group leader) -> kristaps_q1
      - Check what Edgars (Elīna's brother) is saying -> edgars_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Marta Q1 ---

  marta_q1:
    type: tweet
    from: marta
    text: >
      ja kādam ir ziņas par @elina_kalnina lūdzu zvaniet man. viņas
      istaba ir tāda kā bija. viņas deju kurpes ir te. viņa nekad
      nebūtu aizgājusi bez tām.
    effects: { trust_marta: "+5", contacts_followed: "+1" }
    choices:
      - DM Marta -> marta_q1_talk

  marta_q1_talk:
    type: message
    text: >
      MARTA: I appreciate you writing but I don't know you. Elīna has
      a lot of people who care about her. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Marta is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_marta: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kristaps Q1 ---

  kristaps_q1:
    type: tweet
    from: kristaps
    text: >
      Kolektīvs 'Gauja' bez @elina_kalnina nav iedomājams. Viņas
      horeogrāfija, viņas enerģija — mums viņa ir vajadzīga. Lūdzu
      atgriezies pie mums. Pie manis.
    effects: { trust_kristaps: "+5", contacts_followed: "+1" }
    choices:
      - DM Kristaps -> kristaps_q1_talk

  kristaps_q1_talk:
    type: message
    text: >
      KRISTAPS: Elīna and I have built this dance group together for
      five years. She's the most talented dancer I've worked with. This
      GreenValley fight — it consumed her. She was spending all her time
      on environmental documents instead of rehearsing.

      I tried to help her. Many times. I offered to go to meetings with
      her, to be there. She said she had it handled. She was working
      with some journalist. I just wanted to support her.

      [Kristaps seems earnest. Or obsessive?]
    effects: { trust_kristaps: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Edgars Q1 ---

  edgars_q1:
    type: tweet
    from: edgars
    text: >
      mana māsa ir PAZUDUSI un policija man saka ka viņa varbūt
      aizbrauca uz rīgu??? VIŅA NEBRAUC UZ RĪGU NEBRĪDINOT. es braucu
      no rīgas. kāds man paskaidros kas ellē notiek.
    effects: { trust_edgars: "+5", contacts_followed: "+1" }
    choices:
      - DM Edgars -> edgars_q1_talk

  edgars_q1_talk:
    type: message
    text: >
      EDGARS: Who are you? Another person from that village who's going
      to tell me to calm down? My sister called me the night before she
      disappeared. She said she had something big. She said "ja kaut
      kas notiek, skaties uz GreenValley." Then she hung up.

      That's the last I heard from her.
    effects: { trust_edgars: "+10" }
    choices:
      - What do you think happened? -> edgars_theory
      - Move on -> quest1_hub

  edgars_theory:
    type: message
    text: >
      EDGARS: I think she found proof that GreenValley's environmental
      assessment was fraudulent and they shut her up. But I also think
      that creepy dance leader — Kristaps — knows more than he's saying.
      The way he talks about her... that's not professional concern.
      That's something else.

      Elīna told me months ago that someone was going through her things
      at the dance studio. Her notes, her USB drives. She thought it
      was nothing. Piz*ec, I don't think it was nothing.
    effects: { trust_edgars: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Elīna went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Laura (was at the dance hall that evening) -> laura_interview
      - Find Guntis (farmer, passes the clearing early morning) -> guntis_interview
      - Find Andris (carpenter, starts at 6am, saw something) -> andris_interview
      - Find Sandris (forestry guard, late patrol) -> sandris_interview_q2

  # --- Laura (saw someone at Elīna's car) ---

  laura_interview:
    type: tweet
    from: laura
    text: >
      nu bļe es negribu filmēt tajā vakarā bet tagad es domāju ka
      vajadzēja. kaut kas bija ne tā pie deju zāles. ellē.
    effects: { trust_laura: "+5" }
    choices:
      - Ask Laura about that evening -> laura_talk

  laura_talk:
    type: message
    text: >
      LAURA: ok bet tu nesaki nevienam labi? es biju pie deju zāles
      ap 19 vakarā, gribēju uzfilmēt saulrietu. un es redzēju
      kristaps — deju vadītājs — pie elīnas auto. viņš kaut ko
      darīja tur, kā meklēja vai lika kaut ko iekšā. kad viņš mani
      ieraudzīja, aizgāja piz*ec ātri.

      nu bļe es neko neteicu jo kas man ticēs? pusaudze pret
      horeogrāfu. sūds.
    effects:
      trust_laura: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Guntis (farmer, saw car chase on forest road) ---

  guntis_interview:
    type: tweet
    from: guntis
    text: >
      Rīta agrumā uz parkiem kā vienmēr. Bet tajā rītā meža ceļš
      nebija tukšs. Kāds brauca pārāk ātri.
    effects: { trust_guntis: "+5" }
    choices:
      - Ask Guntis what he saw -> guntis_talk

  guntis_talk:
    type: message
