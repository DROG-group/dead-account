      She also had trail camera footage of the lynx den. Protected
      species, protected habitat — the whole project should have been
      blocked at EU level.

      We were going to publish together. Then she went dark. And two
      days later, someone broke into my car and stole my laptop bag.

      Elīna is alive. She contacted me once, from a burner phone.
      She said she was hiding. She said "viņi man draudēja izcirtumā
      un kāds cits mani neatlaiž."

      I can't tell you where she is. But with enough evidence, I can
      publish and make it safe for her to come back.
    effects:
