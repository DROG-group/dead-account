  eia_records:
    type: message
    text: >
      The pagasts council's public website hosts the GreenValley
      environmental impact assessment. It lists the clearing as
      "degraded secondary forest with no protected species." The
      biodiversity survey is dated six months ago.

      But Elīna's social media posts from the same period show photos
      of great crested newts, a lynx den, and orchids — all protected
      under EU Habitats Directive. She tagged the photos with GPS
      coordinates. They're in the clearing.

      The assessment either missed these species or deliberately
      omitted them.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue -> corruption_hub

