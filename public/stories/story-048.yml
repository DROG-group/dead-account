  zane_with_evidence:
    type: message
    text: >
      ZANE: ...you have more than I expected.

      Okay. Elīna and I were working together. She had documentation
      proving the environmental assessment was conducted at a different
      site — a degraded pine plantation 40 kilometers away. The GPS
      data in the assessment doesn't match the clearing. It's outright
