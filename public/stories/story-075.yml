entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN MULLERTHAL-LES-BAINS
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to MullerthalLesBains.social — the community Mastodon instance
      for the village of Mullerthal-les-Bains, nestled among the sandstone
      cliffs and forests of Luxembourg's Little Switzerland.

      The local feed is unsettled today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @sophie_muller.

      A potter. Ceramicist. She documented the landscape in clay and glaze.
      People are worried. She hasn't posted in six days.
    choices:
      - Look at her profile -> sophie_profile

  sophie_profile:
    type: tweet
    from: sophie
    text: "De Fiels hannert mengem Atelier ass gesprongen. D'Steinbroch spréngt d'Landschaft. Ech hunn Beweiser."
    choices:
      - That's her last real post... -> broken_shelf

  broken_shelf:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a photo of a cracked ceramic bowl on a dusty shelf. Shot at 2am.
      No caption. Overexposed, blurred.

      Her friends say that's not her style. Sophie documented her work
      meticulously. Every piece had a story, a caption, a location.
      The police say she probably went on holiday. Something doesn't
      add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: brigadier
    text: >
      Mir hu e Signalement kritt betreffend eng Awunnerin vu
      Mullerthal-les-Bains. Op dësem Stade weist näischt op eng
      Stroftat hin. All nëtzlech Informatiounen kënnt Dir un de
      Commissariat mellen oder den 113 uruffen.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @josy_kieffer is
      desperate. Her brother @marc_muller is driving down from the
      city. Her gallerist @thierry_lentz is posting obsessively.
      The trail guide @gilles_reding says she was right about
      the blasting damage.

      And the journalist @claude_reuter is strangely silent.

      Nobody buys the police line. Nobody thinks Sophie just
      "went on holiday."
    effects: { trust_josy: "+5", trust_marc: "+5" }
    choices:
      - Start following Sophie's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Mullerthal-les-Bains. Follow Sophie's contacts and read
      their posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Carine (bistro owner, knows everyone) -> carine_intro
      - Talk to Gilles (trail guide, saw the damage) -> gilles_intro
      - Talk to Laura (teen climber, seems shaken) -> laura_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Sophie with the rhythms of a small
      village in the sandstone gorge: trail conditions, bakery specials,
      weather warnings, crémant tastings.

      Key names surface: Josy (best friend, hairdresser), Thierry
      (gallerist, seems rattled), Claude (journalist, oddly quiet),
      and the teens — Laura, Sam, Ben, Liz — who loved Sophie's
      pottery workshops.

      Also prominent: Steinbroch Éislek SA, the quarry company at the
      edge of town. Their posts are corporate PR. Sophie's posts were
      the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Carine -> carine_intro
      - Talk to Gilles -> gilles_intro
      - Talk to Laura -> laura_intro

  # --- Carine (social map) ---

  carine_intro:
    type: tweet
    from: carine
    text: >
      De Bistro ass op mee d'Häerz ass net derbäi. @sophie_muller,
      däin Dësch waart op dech. Komm séier zréck.
    effects: { trust_carine: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Carine -> carine_talk

  carine_talk:
    type: message
    text: >
      CARINE: Ah, you're new? Wëllkomm. Terrible time to arrive.
      Everyone's on edge about Sophie.

      Let me tell you who's who. Josy is Sophie's best friend — they
      grew up together, Josy runs the hair salon on Rue de la Gorge.
      Sweet girl, devastated right now. Thierry Lentz is Sophie's
      gallerist from the city. Smart man, but... intense about her
      work. Very intense about her. Marc is Sophie's older brother,
      he's coming down from Luxembourg-Ville.

      And Claude Reuter — the journalist — he and Sophie were working
      on something together. Something about the quarry. Claude hasn't
      said a word since Sophie vanished. That's not like him at all.

      Oh, and ignore Steinbroch Éislek's PR posts. Lies wrapped in
      ISO certifications, as always.
    effects: { trust_carine: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Thierry -> carine_thierry
      - Ask about Steinbroch -> carine_steinbroch
      - Thank her and move on -> quest1_hub

  carine_thierry:
    type: message
    text: >
      CARINE: Thierry? He's represented Sophie's ceramics for five
      years. Built a gallery around her work. But since her pieces
      started selling internationally, he's been... orbiting her.
      At the bistro every time she was here. Called constantly. Wanted
      to be part of everything, not just the art.

      She told me once, "He thinks he owns me because he sells my
      pots." I thought she meant professionally. Now I'm not so sure.

      After she started the quarry investigation, he got worse.
      Wanted to control where she went, who she talked to. Said it
      was about "protecting the brand."
    effects: { trust_carine: "+5" }
    choices:
      - Ask about Steinbroch -> carine_steinbroch
      - Move on -> quest1_hub

  carine_steinbroch:
    type: message
    text: >
      CARINE: That quarry has been expanding since the 90s. They
      blast sandstone for construction aggregate. The cliffs are
      our heritage — the Mullerthal Trail, the rock formations, the
      grottos. Tourists come from all over Europe.

      But Steinbroch keeps getting permits to blast closer to the
      village. The vibrations crack foundations. The landscape is
      being destroyed. Sophie was the first person to actually
      document the damage with measurements and photos.

      She had proof, she said. Real proof that the blasting was
      destabilising the gorge. Two weeks later she's gone.
    effects: { trust_carine: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Gilles (the landscape, witness tease) ---

  gilles_intro:
    type: tweet
    from: gilles
    text: >
      30 joer op dësen trail. de fiels bréckelt. d'schluecht rëscht.
      @sophie_muller hat recht. an elo ass si fort.
      maacht de lien.
    effects: { trust_gilles: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Gilles -> gilles_talk

  gilles_talk:
    type: message
    text: >
      GILLES: I've been guiding people through this gorge since I was
      twenty. I know every cliff face, every overhang, every crack in
      the rock. And I'm telling you — the formations near the quarry
      boundary are fracturing. The blasting shakes the ground twice a
      week. New cracks appear after every detonation.

      Sophie measured it. She set up vibration sensors, photographed
      every new crack, mapped the damage with GPS coordinates. She
      was building a case. And then poof — gone.

      You think that's a coincidence? Herrgottsack, I don't believe
      in coincidences in these woods.
    effects: { trust_gilles: "+10" }
    choices:
      - Did you see anything unusual recently? -> gilles_night
      - Move on -> quest1_hub

  gilles_night:
    type: message
    text: >
      GILLES: The night before she vanished — I was coming back from
      a late patrol of the trail, around midnight. I saw lights at
      Sophie's atelier. Not unusual, she worked late with the kiln.
      But there were two vehicles in the lane. One was Sophie's old
      Citroën. The other was a black SUV with Steinbroch Éislek
      plates.

      At midnight. At a potter's studio in the gorge.

      I noted it in my trail log. Nobody's asked to see it.
    effects: { trust_gilles: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Laura (teen climber, witness tease) ---

  laura_intro:
    type: tweet
    from: laura
    text: >
      putain @sophie_muller c'est elle qui m'a appris à respecter
      de fiels genre c'est pas possible qu'elle soit partie comme
      ça. si qqn weess eppes dann sot et svp
    effects: { trust_laura: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Laura -> laura_talk_early

  laura_talk_early:
    type: message
    text: >
      LAURA: merde t'es nouveau ici? c chaud comme timing. en vrai
      sophie c'est genre la meilleure personne vu dësem duerf. si
      huet eis gewisen wéi ee klëmmt, si huet eis d'fiels gewisen
      mat hirer kamera. trop stylé.

      an la ech si geflippt well de sam huet eppes bizar gesinn
      deen owend beim atelier mee hie wëll net driwwer schwätzen.
      hie seet dat et näischt ass mee genre... c'est pas rien sah
    effects: { trust_laura: "+10" }
    choices:
      - What did Sam see? -> laura_sam_hint
      - Move on -> quest1_hub

  laura_sam_hint:
    type: message
    text: >
      LAURA: ech weess et net genee. hien war op engem trail run
      beim atelier an hien huet gesinn wéi iergendeen saachen an
      dem sophie säi auto geluecht huet?? oder sou eppes. hie
      flippt total, hie wëll net driwwer schwätzen. frot hien
      direkt mee hien ass mësstréinesch mat leit déi en net kennt.
      versich éischt iwwert klëmmen ze schwätzen ptdr
    effects: { trust_laura: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Mullerthal-les-Bains. A village
      carved into sandstone gorges. A potter who was documenting
      quarry damage. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Josy (Sophie's best friend) -> josy_q1
      - Talk to Thierry (Sophie's gallerist) -> thierry_q1
      - Check what Marc (Sophie's brother) is saying -> marc_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Josy Q1 ---

  josy_q1:
    type: tweet
    from: josy
    text: >
      wann iergendeen eppes vun @sophie_muller héiert rufft mech
      un svp. hir stuff ass ongeriicht. hir offenofen ass nach un.
      si wier ni ouni hir wierk fortgaang.
    effects: { trust_josy: "+5", contacts_followed: "+1" }
    choices:
      - DM Josy -> josy_q1_talk

  josy_q1_talk:
    type: message
    text: >
      JOSY: I appreciate you reaching out but I don't know you.
      Sophie has a lot of friends here. I'm sure she'll come back.

      ...I keep saying that. I don't believe it anymore.

      [Josy is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_josy: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Thierry Q1 ---

  thierry_q1:
    type: tweet
    from: thierry
    text: >
      L'atelier est vide sans @sophie_muller. Ses pièces sont encore
      dans le four. Ses carnets de croquis sur la table. Elle
      n'abandonnerait jamais une cuisson en cours. Something happened.
    effects: { trust_thierry: "+5", contacts_followed: "+1" }
    choices:
      - DM Thierry -> thierry_q1_talk

  thierry_q1_talk:
    type: message
    text: >
      THIERRY: Sophie and I have worked together for over five years.
      She's the most talented ceramicist in Luxembourg. This quarry
      investigation — it was putting her work at risk. The vibrations
      were cracking her pieces in the kiln. She had measurements,
      photos, vibration data.

      I offered to help her. Many times. She said she had it under
      control. She said she was working with a journalist. I just
      wanted to protect her. And her work.

      [Thierry seems earnest. Or obsessive?]
    effects: { trust_thierry: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marc Q1 ---

  marc_q1:
    type: tweet
    from: marc
    text: >
      meng schwëster ass VERSCHWONNEN an d'police seet mir si ass
      vläicht op vakanz??? SI GEET NET OP VAKANZ OUNI BESCHEED ZE
      SOEN. ech kommen elo vun der stad. iergendeen wäert mer
      erkläeren.
    effects: { trust_marc: "+5", contacts_followed: "+1" }
    choices:
      - DM Marc -> marc_q1_talk

  marc_q1_talk:
    type: message
    text: >
      MARC: Who are you? Another person from that village who's going
      to tell me to calm down? My sister called me the night before
      she disappeared. She said she had something big. She said "if
      anything happens, look at Steinbroch Éislek." Then she hung up.

      That's the last I heard from her.
    effects: { trust_marc: "+10" }
    choices:
      - What do you think happened? -> marc_theory
      - Move on -> quest1_hub

  marc_theory:
    type: message
    text: >
      MARC: I think she found proof that Steinbroch Éislek is blasting
      illegally and destabilising the gorge, and they shut her up. But
      I also think that creepy gallerist of hers — Thierry — knows more
      than he's saying. The way he talks about her... it's not just
      professional. It's something else. Possessive.

      Sophie told me months ago that someone had been going through her
      studio when she wasn't there. Things moved, sketches rearranged.
      She thought it was the wind through the door. I don't think it
      was the wind.
    effects: { trust_marc: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Sophie went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Sam (was trail running near the atelier) -> sam_interview
      - Find Gilles (trail guide, patrols late) -> gilles_interview
      - Find Patrick (forest ranger, early morning) -> patrick_interview
      - Find Annick (baker, starts at 5am, saw something) -> annick_interview

  # --- Sam (saw someone at Sophie's car) ---

  sam_interview:
    type: tweet
    from: sam
    text: >
      gudd session haut owend mee d'ambiance am duerf ass komësch.
      genre et ass eppes net an der rei. ech weess net wéi ech et
      soen soll
    effects: { trust_sam: "+5" }
    choices:
      - Ask Sam about that evening -> sam_talk

  sam_talk:
    type: message
    text: >
      SAM: wsh frr ok mee du sees et kengem hein. ech war beim
      atelier géint 19h, trail run. an ech hunn de gars vun der
      galerie — thierry — niewent dem sophie säi auto gesinn. hien
      hat d'air wéi wann en dra géif wullen oder eppes dra leeën.
      wéi en mech gesinn huet ass e vill ze séier fort.

      genre mech, ech hu näischt gesot well ech wollt keng
      embrouilles mee la c'est quoi ce bordel. dat ass net
      normal seng behuelen sah
    effects:
      trust_sam: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Gilles (trail guide, saw late-night meeting) ---

  gilles_interview:
    type: tweet
    from: gilles
    text: >
      Erënnerung: de Mullerthal Trail ass verbueden tëschent 22h an 6h.
      Ech hu fir d'lescht Nuets net autorisiert Passagen festgestallt.
    effects: { trust_gilles: "+5" }
    choices:
      - Ask Gilles what he saw -> gilles_talk_night

  gilles_talk_night:
    type: message
    text: >
      GILLES: I was finishing my last round of the trail around 22h30.
      I saw Sophie's Citroën still parked by the atelier. And a black
      SUV — Steinbroch Éislek plates — next to it. Two men were
      standing at the studio entrance. One of them I recognised:
      Jeff Meyers, the quarry director.

      At 22h30. At a potter's studio in the gorge. That's not normal.

      I noted it in my trail log. Nobody's asked to see it.
    effects:
      trust_gilles: "+10"
      night_witnesses: "+1"
      quarry_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Patrick (saw Sophie fleeing) ---

  patrick_interview:
    type: tweet
    from: patrick
    text: >
      um 4 auer moies am bësch. de pad war net eidel haut. do
      war een dee gelaf ass um klëmmpad. am däischteren. kee jogger.
    effects: { trust_patrick: "+5" }
    choices:
      - Ask Patrick what he saw -> patrick_talk

  patrick_talk:
