  ending_c:
    type: message
    text: >
      ENDING C: THE DEPUTY

      Hana is a bureaucrat, not a mastermind. She authorized the signs
      because Marek told her to. She doesn't have the full picture and
      can't meaningfully respond to your accusations.

      Without targeting the right people — Ivan for the intimidation,
      Marek for the cover-up — your evidence scatters. The town's lawyer
      buries the complaint. ChemBoh issues a statement about "baseless
      allegations." The local newspaper doesn't cover it.

      Filip stays hidden. The ponds stay poisoned. Six months later,
      the fishing association reports another mass fish die-off. Nobody
      investigates.
    choices:
      - The End -> game_complete

