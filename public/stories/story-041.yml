  confront_ivan:
    type: message
    text: >
      You present your evidence publicly:

      "Ivan Kubat sent ChemBoh security to Filip Cerny's brewery.
      They stole his water samples. They intimidated him with threats
      against his girlfriend. They broke into his brewery and destroyed
      his lab. I have witness statements, drone footage, vehicle
