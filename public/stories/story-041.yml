entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN RYBNIKOV
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to rybnikov.social — the community Mastodon instance for
      the town of Rybnikov, South Bohemia.

      The local feed is buzzing. Something is wrong.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, one name keeps appearing: @filip_pivo.

      A local craft brewer and food blogger. He ran a small brewery using
      water from the town's famous ponds. People are panicking. He hasn't
      posted in over a week.
    choices:
      - Look at his profile -> filip_profile

  filip_profile:
    type: tweet
    from: filip
    text: "The water tests came back. I need to tell someone. This is bigger than beer."
    choices:
      - That's his last real post... -> black_square

  black_square:
    type: message
    text: >
      Two days after that post, his account shared a single image:
      a solid black square. No caption. Posted at 3am.

      His friends say that's not Filip. The police say there's no crime.
      But a brewer doesn't just vanish after posting about water tests.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: policie
    text: >
      Obdrzeli jsme hlaseni tykajici se pohresovaneho obcana Rybnikova.
      V tuto chvili neni zadny dukaz trestneho cinu. Informace: 158.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The responses are chaotic. His girlfriend @lucie_foto is desperate.
      His biology teacher friend @vojtech_bio is posting cryptic warnings
      about water quality. His sister @jana_cerna is raging at the police
      from Prague.

      And old Babicka Bozena keeps posting about how "the factory
      poisoned the ponds thirty years ago and everyone pretended it
      didn't happen."

      Nobody believes Filip just "needed space." He was onto something.
    effects: { trust_lucie: "+5", trust_jana: "+5" }
    choices:
      - Start following Filip's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Rybnikov. Follow Filip's contacts and read their posts.
      The more you engage with the community, the more they'll trust you.

      Start with whoever seems most willing to talk.
    choices:
      - Talk to Babicka Bozena (she's been here forever) -> bozena_intro
      - Talk to Pavel the fisherman (works at the ponds) -> pavel_intro
      - Talk to Dominik (teen skater, says he saw something) -> dominik_intro
      - Browse the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed is a mix of worried posts about Filip, daily life, pond
      weather updates, and furious arguments about ChemBoh — the old
      chemical plant on the edge of town.

      Key names: Lucie (photographer, Filip's girlfriend), Vojtech
      (biology teacher, helped Filip with water tests), Radek (pub
      manager, Filip's best friend), Daniela (journalist, unusually
      quiet about the whole thing).

      And ChemBoh a.s. — their corporate account keeps posting about
      "responsible manufacturing" and "community partnership."
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Babicka Bozena -> bozena_intro
      - Talk to Pavel -> pavel_intro
      - Talk to Dominik -> dominik_intro

  # --- Babicka Bozena (history, social map) ---

  bozena_intro:
    type: tweet
    from: bozena
    text: >
      pamatuji kdy ryby v Cernem rybniku umiraly. 1987. nikdo nic
      nerekl. ted zase. filip mel pravdu. ten kluk mel pravdu.
    effects: { trust_bozena: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Babicka Bozena -> bozena_talk

  bozena_talk:
    type: message
    text: >
      BOZENA: Ach, ty jsi novy! Sit down, have some kolac.

      Let me tell you about this town. Rybnikov means "pond town."
      We've had fish ponds for five hundred years. The water was
      everything. Then in the sixties they built ChemBoh — the chemical
      plant. For thirty years it leaked into the groundwater. Everyone
      knew. Nobody said anything.

      After the revolution they "cleaned it up." Or so they told us.
      Filip didn't believe them. He tested the water. And now he's gone.
    effects: { trust_bozena: "+10", contacts_followed: "+2" }
    choices:
      - Ask about the chemical plant -> bozena_chemboh
      - Ask who runs things in town -> bozena_politics
      - Thank her and move on -> quest1_hub

  bozena_chemboh:
    type: message
    text: >
      BOZENA: ChemBoh was state-owned. After 1989 it was privatized.
      The new owners promised cleanup. They got EU funds for remediation.
      The mayor at the time — Marek Horak's father — signed off on the
      certificates. "All clean." Property values went up. Everyone was
      happy.

      But the old storage tanks are still there. Underground. I can see
      the pipes from my garden when the ground is wet. Nobody removed
      anything. They just buried it deeper.
    effects: { trust_bozena: "+5" }
    choices:
      - Ask who runs things -> bozena_politics
      - Move on -> quest1_hub

  bozena_politics:
    type: message
    text: >
      BOZENA: Marek Horak is the mayor. His father was mayor before him.
      The Horaks have run this town for forty years. Hana Stepankova is
      the deputy — she handles environment. She's supposed to protect the
      water. Instead she protects the property values.

      Ivan Kubat runs security at ChemBoh. A nasty man. Big, loud. He
      came to Filip's brewery two weeks ago. Filip told Lucie about it.
      Said Ivan "warned" him to stop testing the water.

      And Daniela at the newspaper? She knows everything but prints
      nothing. Her editor is Marek's cousin.
    effects: { trust_bozena: "+10", contacts_followed: "+2" }
    choices:
      - Move on -> quest1_hub

  # --- Pavel (fisherman, water quality) ---

  pavel_intro:
    type: tweet
    from: pavel
    text: >
      kapri v Cernem rybniku se chovaj divne. pomaly, tezce. za 30 let
      jsem tohle nevidel. @filip_pivo mel pravdu o ty vode.
    effects: { trust_pavel: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Pavel -> pavel_talk

  pavel_talk:
    type: message
    text: >
      PAVEL: The fish are dying. Not quickly — slowly. They stop eating.
      They drift. I've been fishing these ponds my whole life. Something
      is in the water.

      Filip came to me two months ago with test tubes. He said the water
      from the ponds near the old ChemBoh site had elevated heavy metals.
      Cadmium, lead. Way above safe limits. I let him take samples from
      my fishing spots.

      Then three weeks ago, the town put up new "No Swimming" signs
      around Cerny rybnik. They said it was for "construction safety."
      There's no construction.
    effects: { trust_pavel: "+10", contacts_followed: "+1" }
    choices:
      - Ask about the signs -> pavel_signs
      - Move on -> quest1_hub

  pavel_signs:
    type: message
    text: >
      PAVEL: The signs went up overnight. Official signs, with the town
      seal. Hana Stepankova authorized them. I asked her why and she said
      "routine maintenance of the pond infrastructure." The ponds haven't
      had maintenance in fifteen years.

      Filip photographed the signs. He said it proved the town knew about
      the contamination. You don't put up "no swimming" signs unless you
      know the water is bad.
    effects: { trust_pavel: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Dominik (teen witness) ---

  dominik_intro:
    type: tweet
    from: dominik
    text: >
      ty vole tak jsem videl neco u pivovaru tu noc a nevim jestli to
      neco znamena. mam jit na policii?? vole ti me nikdy neposlouchaj
    effects: { trust_dominik: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dominik -> dominik_talk_early

  dominik_talk_early:
    type: message
    text: >
      DOMINIK: cau tak jsem jezdil na skejtu u rybniku kolem jedenacty
      v noci jo? a videl jsem jak k pivovaru prijelo auto. takovy
      cerny SUV. vystoupili dva chlapy, sli dovnitr. pak je vidim jak
      vynasej krabice. jako hodne krabic. nacpali to do auta a odjeli.

      filip tam nebyl, jeho auto tam nebylo. kdo leze do cizyho
      pivovaru ve 11 v noci vole?
    effects: { trust_dominik: "+10" }
    choices:
      - Can you describe the men? -> dominik_describe
      - Thanks Dominik, I'll come back to this -> quest1_hub

  dominik_describe:
    type: message
    text: >
      DOMINIK: jeden byl fakt velkej. jako siroky. druhy normalka.
      ten velkej mel takovou bundu s napisem na zadech. nemoh jsem to
      precist ve tme ale vypadalo to jako firemni logo nebo neco.

      nj a to auto... cerny SUV, dost novej. na parkovisti u ChemBoh
      parkujou uplne stejny. jen rikam.
    effects: { trust_dominik: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Rybnikov. A small South Bohemian town
      built around fish ponds. A brewer who tested the water and found
      poison. A chemical plant that was supposed to be cleaned up. A town
      administration protecting property values.

      And now the brewer is gone.
    choices:
      - Talk to Lucie (Filip's girlfriend) -> lucie_q1
      - Talk to Vojtech (biology teacher, water testing) -> vojtech_q1
      - Talk to Radek (pub manager, Filip's best friend) -> radek_q1
      - I'm ready to investigate the night Filip disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lucie Q1 ---

  lucie_q1:
    type: tweet
    from: lucie
    text: >
      prosim kohokoliv kdo vi neco o @filip_pivo ozvete se mi. tohle
      neni normalni. prosim. je to uz tyden.
    effects: { trust_lucie: "+5", contacts_followed: "+1" }
    choices:
      - DM Lucie -> lucie_q1_talk

  lucie_q1_talk:
    type: message
    text: >
      LUCIE: I appreciate you reaching out but I don't know you. Filip
      has a lot of people who care about him. I'm sure he'll turn up.

      [Lucie is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_lucie: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Vojtech Q1 ---

  vojtech_q1:
    type: tweet
    from: vojtech
    text: >
      i am not going to say what filip found. not yet. but if anyone
      from the town administration is reading this — you know what's in
      that water. you've always known.
    effects: { trust_vojtech: "+5", contacts_followed: "+1" }
    choices:
      - DM Vojtech -> vojtech_q1_talk

  vojtech_q1_talk:
    type: message
    text: >
      VOJTECH: Who are you? Another person from the internet? Filip
      and I spent months on those water tests. Real science. Real data.
      And now he's gone and I'm getting messages from strangers.

      Unless you have something useful, leave me alone.

      [Vojtech is scared. Build more trust.]
    effects: { trust_vojtech: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Radek Q1 ---

  radek_q1:
    type: tweet
    from: radek
    text: >
      filip's stool at the bar is empty. he hasn't missed a friday in
      three years. somebody knows something. somebody always knows.
    effects: { trust_radek: "+5", contacts_followed: "+1" }
    choices:
      - DM Radek -> radek_q1_talk

  radek_q1_talk:
    type: message
    text: >
      RADEK: Yeah, I run the pub. Filip's my best mate. Last time I saw
      him was the night before he disappeared. He was at the bar, quiet.
      Nursing one beer instead of his usual three. He said "I might need
      to leave town for a bit." I thought he was joking.

      He wasn't joking.
    effects: { trust_radek: "+10" }
    choices:
      - Did he say why? -> radek_why
      - Move on -> quest1_hub

  radek_why:
    type: message
    text: >
      RADEK: He said someone came to the brewery. A "security guy." Told
      Filip to stop testing the water or there would be "consequences for
      his business." Filip laughed it off at first. But then he got quiet
      and said "They know where Lucie lives."

      That's when I knew he was actually scared.
    effects: { trust_radek: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Filip went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Radek (was at the pub that night) -> radek_interview
      - Find Jiri (mechanic, works late near the brewery) -> jiri_interview
      - Find Petra (pharmacist, saw Filip that afternoon) -> petra_interview
      - Find Pavel (fisherman, was at the ponds that night) -> pavel_interview

  # --- Radek (saw Filip leave the pub) ---

  radek_interview:
    type: tweet
    from: radek
    text: >
      filip left the pub around 21:30. he barely touched his beer. said
      he had to "check something at the brewery." that's the last time i
      saw him. i should have gone with him.
    effects: { trust_radek: "+5" }
    choices:
      - Ask Radek about that night -> radek_talk

  radek_talk:
    type: message
    text: >
      RADEK: He was on edge all evening. Kept checking his phone. At one
      point he went outside for ten minutes and came back pale. I asked
      what was wrong and he said "nothing." But his hands were shaking.

      He left around 21:30. Said he needed to check on a batch at the
      brewery. That's normal — fermentation needs monitoring. But the way
      he said it... like he was going to do something else entirely.

      I found out the next morning he never came home.
    effects:
      trust_radek: "+10"
      night_witnesses: "+1"
      intimidation_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Jiri (mechanic, saw vehicles at brewery) ---

  jiri_interview:
    type: tweet
    from: jiri
    text: >
      pracoval jsem do pozda vcera. kolem desety projelo cerny SUV
      smerem k pivovaru. pak dalsi. dva SUVcka u pivovaru v noci?
    effects: { trust_jiri: "+5" }
    choices:
      - Ask Jiri about the vehicles -> jiri_talk

  jiri_talk:
    type: message
    text: >
      JIRI: I was in the shop late — engine rebuild. Around 22:00 a
      black SUV drove past toward Filip's brewery. Twenty minutes later,
      a second one. Same model. Tinted windows.

      Those are company vehicles. ChemBoh has a fleet of them. I service
      two of them. I know the model. Same tires, same body kit.

      Why would ChemBoh security be driving to a brewery at ten at night?
      I told the police. They said "noted."
    effects:
      trust_jiri: "+10"
      night_witnesses: "+1"
      intimidation_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Petra (saw Filip that afternoon) ---

  petra_interview:
    type: tweet
    from: petra
    text: >
      filip was in the pharmacy that afternoon. he bought bandages and
      antiseptic. he had a cut on his hand. he said he "dropped a
      beaker." he looked terrified.
    effects: { trust_petra: "+5" }
    choices:
      - Ask Petra what she noticed -> petra_talk

  petra_talk:
    type: message
    text: >
      PETRA: Filip came in around 16:00. He had a deep cut on his left
      hand — glass, maybe. He said he broke a beaker in the lab. But
      brewers don't use beakers. Biology teachers do.

      He was pale. He kept looking out the window, like he was checking
      if someone followed him. He bought bandages, antiseptic, and — this
      was odd — a prepaid phone card. Who buys prepaid cards anymore?

      He paid cash for everything.
    effects:
      trust_petra: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Pavel (fisherman, heard something at the ponds) ---

  pavel_interview:
    type: message
    text: >
      PAVEL: I was night fishing at Cerny rybnik. Around 23:00 I heard
      a vehicle at the brewery — which is only 200 metres from my spot.
      Doors slamming. Men's voices. One was shouting: "Where are they?
      Give us the samples."

      Then a crash. Like something heavy being thrown. Then quiet. I
      packed up and went home. I'm not a brave man.

      The next morning, the brewery door was hanging open. Nobody inside.
      Filip's car was still parked there.
    effects:
      trust_pavel: "+15"
      night_witnesses: "+1"
      intimidation_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Continue investigating -> quest2_hub

  # --- Quest 2 Hub ---

  quest2_hub:
    type: message
    text: >
      Witnesses found: ${night_witnesses} of 4 needed.

      You can keep collecting testimonies or talk to other sources.
    choices:
      - Talk to Lenka (teacher, saw Filip at school that day) -> lenka_interview
      - Talk to Eliska (teen activist, has Filip's posts saved) -> eliska_interview
      - Find Radek at the pub -> radek_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Jiri the mechanic -> jiri_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Petra the pharmacist -> petra_interview
        when:
          state: night_witnesses
          lt: 4
      - Find Pavel the fisherman -> pavel_interview
        when:
          state: night_witnesses
          lt: 4
      - Assemble the timeline -> quest2_timeline
        when:
          state: night_witnesses
          gte: 4

  # --- Lenka (teacher, additional context) ---

  lenka_interview:
    type: message
    text: >
      LENKA: Filip came to the school that day. He was looking for
