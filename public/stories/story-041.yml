    type: message
    text: >
      ENDING A: THE ENFORCER

      The regional prosecutor opens an investigation. ChemBoh's premises
      are raided. The underground storage tanks — supposed to have been
      removed twenty years ago — are found intact and leaking. Ivan
      Kubat is arrested for intimidation, breaking and entering, and
      destruction of evidence. He cooperates with prosecutors.

      Mayor Marek Horak is charged with filing false remediation
      certificates and misuse of EU funds. Hana Stepankova resigns.

      And Filip Cerny? He's found alive. He'd been hiding at a friend's
      farm in Moravia since the night the security men came. Vojtech
      had driven him there at 4am. Filip had been too scared to surface
      without knowing the evidence was safe.

      Three weeks later, a national newspaper publishes the full story.
      "The Poisoned Ponds of Rybnikov" leads to an EU investigation
      into remediation fraud across three regions.

      Filip returns to Rybnikov. His first post:
    choices:
