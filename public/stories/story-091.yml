entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN AMPELAKIA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Ampelakia.social — the community Mastodon instance for
      the village of Ampelakia, nestled among the vineyards and hills
      of Thessaly, Greece.

      The local feed is unsettled. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling the feed, you see the same name everywhere:
      @stavros_economou.

      A winemaker. Third generation. He grew the village's most
      celebrated xinomavro. People are panicking. He was found dead
      this morning, collapsed among his vines.
    choices:
      - Look at his profile -> stavros_profile

  stavros_profile:
    type: tweet
    from: stavros
    text: "Τα αμπέλια στο Κτήμα Λιθάρι δεν πωλούνται. Ούτε σήμερα, ούτε αύριο, ούτε ποτέ. Αυτή η γη δεν είναι εμπόρευμα."
    choices:
      - That's one of his final posts... -> found_dead

  found_dead:
    type: message
    text: >
      Three days after that post, Stavros was found by his assistant
      Despina at dawn, face-down in the vineyard's oldest plot. The
      police say cardiac arrest. Natural causes.

      But his family says he had no heart condition. His wine barrels
      had been tampered with — contaminated with something chemical.
      And someone had been sending him threatening messages for weeks.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: astynomia
    text: >
      Ενημερώνουμε ότι ο θάνατος του κ. Οικονόμου αποδίδεται σε
      καρδιακό επεισόδιο σύμφωνα με την αρχική ιατροδικαστική εξέταση.
      Δεν υπάρχουν ενδείξεις εγκληματικής ενέργειας. Πληροφορίες
      στο 100.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are furious. His wife @eleni_economou is demanding
      a second autopsy. His son @nikos is driving down from Larissa.
      His assistant @despina_karagianni says the barrels were poisoned.
      The farmer @vasilis_tsioukas says Stavros had enemies.

      And the wine critic @dimitra_kontaxi, who had been publicly
      feuding with Stavros for months, has gone silent.

      Nobody believes "cardiac arrest." Not in a village where
      everyone knows everyone's heartbeat.
    effects: { trust_eleni: "+5", trust_nikos: "+5" }
    choices:
      - Start following Stavros's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Ampelakia. Follow Stavros's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people most willing to talk.
    choices:
      - Talk to Thanasis (café owner, knows everyone) -> thanasis_intro
      - Talk to Vasilis (farmer, knew Stavros well) -> vasilis_intro
      - Talk to Artemis (teen photographer, saw things) -> artemis_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes grief over Stavros with village life: harvest
      schedules, a church festival, weather warnings for the hills.

      Key names surface: Eleni (wife, teacher), Nikos (son, furious),
      Despina (assistant, loyal), Marina (journalist, digging), and the
      teens — Artemis, Lefteris, Chrysa — who adored Stavros's stories
      about the land.

      Also prominent: Helios Thessaly Resort SA, a development company
      that wants to build a luxury hotel on the hillside above the
      vineyards. Stavros was the loudest voice against them.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Thanasis -> thanasis_intro
      - Talk to Vasilis -> vasilis_intro
      - Talk to Artemis -> artemis_intro

  # --- Thanasis (social map) ---

  thanasis_intro:
    type: tweet
    from: thanasis
    text: >
      Σήμερα δεν παίζει μουσική στο καφενείο. Σταύρο μου, σου κρατάω
      το τραπέζι σου. Πάντα.
    effects: { trust_thanasis: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Thanasis -> thanasis_talk

  thanasis_talk:
    type: message
    text: >
      THANASIS: Ah, you're the new one? Welcome, but bad timing.
      Everyone's destroyed over Stavros.

      Let me tell you who's who. Eleni is Stavros's wife — she teaches
      at the primary school. Strong woman, holding it together for the
      boy. Nikos is their son, studying agronomy in Larissa, wants to
      take over the vineyard. Despina has been Stavros's right hand at
      the winery for fifteen years.

      And then there's Dimitra Kontaxi — the wine critic. She wrote a
      devastating review of Stavros's xinomavro last year. He fired
      back publicly. It escalated. She came to Ampelakia three months
      ago and has been... around. Too much around.

      Oh, and the Helios people. They want to build a hotel on the
      Lithari hillside. That's Stavros's land. Was. He said no. They
      didn't accept no.
    effects: { trust_thanasis: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Dimitra -> thanasis_dimitra
      - Ask about Helios Resort -> thanasis_helios
      - Thank him and move on -> quest1_hub

  thanasis_dimitra:
    type: message
    text: >
      THANASIS: Dimitra? She's famous online. Wine critic, big
      following. She reviewed Stavros's 2022 xinomavro and tore it
      apart. Said it was "a relic of amateur winemaking." Stavros was
      furious. He posted his chemical analysis showing it was clean,
      traditional, excellent.

      She doubled down. Wrote three more articles. It became personal.
      Then she showed up in person. Rented a room at the pension. She's
      been here three months. Photographing the vineyard. Posting about
      Stavros every day. Even after he asked her to stop.

      People in the kafeneio started calling her "the shadow." She was
      always where he was. Always watching. Thanasis pauses. That's not
      criticism. That's obsession.
    effects: { trust_thanasis: "+5" }
    choices:
      - Ask about Helios -> thanasis_helios
      - Move on -> quest1_hub

  thanasis_helios:
    type: message
    text: >
      THANASIS: Helios Thessaly Resort. Big company from Athens. They
      want to build a 200-room luxury hotel on the hillside above the
      vineyards. Problem is, that hillside is agricultural land AND
      there are ruins underneath — old Roman-era stuff, maybe older.

      The archaeologist Kostas says it's significant. Stavros said it
      was sacred. The mayor says it's "development."

      Stavros was the only landowner who refused to sell. He had the
      key parcel — without it, the access road can't be built. The
      project is dead without his land.

      Now Stavros is dead. And his land is in his wife's hands.
    effects: { trust_thanasis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Vasilis (the farmer, witness tease) ---

  vasilis_intro:
    type: tweet
    from: vasilis
    text: >
      σαράντα χρόνια γείτονας του Σταύρου. τα αμπέλια του δεν γερνούσαν
      ποτέ. αυτός γέρασε πρώτα. δεν πιστεύω σε καρδιακό. ΔΕΝ πιστεύω.
    effects: { trust_vasilis: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Vasilis -> vasilis_talk

  vasilis_talk:
    type: message
    text: >
      VASILIS: I've been Stavros's neighbour for forty years. Our land
      shares a border up on the Lithari slope. I know that man's health
      like I know my goats. He walked those hills every morning. No
      heart problems. Nothing.

      Two weeks before he died, his wine barrels — the ones aging in
      the cellar — were contaminated. Some chemical substance. Ruined
      the entire vintage. Stavros was devastated but he said, "Someone
      wants to break me. They won't."

      And the week before that, someone poisoned his oldest vine. The
      one his grandfather planted. You don't do that by accident. You
      do that to send a message.
    effects: { trust_vasilis: "+10" }
    choices:
      - Did you see anything unusual recently? -> vasilis_night
      - Move on -> quest1_hub

  vasilis_night:
    type: message
    text: >
      VASILIS: The night before they found him — I was up late with a
      sick goat. Around midnight, I saw car lights on the road to the
      Lithari vineyard. Two cars. One was small, maybe a rental. The
      other was a black SUV. Expensive.

      Nobody drives to the vineyard at midnight. Nobody.

      I thought maybe Stavros was checking something, but his truck
      was at his house. Those cars didn't belong.
    effects: { trust_vasilis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Artemis (teen photographer, witness tease) ---

  artemis_intro:
    type: tweet
    from: artemis
    text: >
      ρε φίλε δεν γίνεται αυτό. ο κύριος Σταύρος μας μάθαινε για τα
      αμπέλια, μας έδειχνε τα αστέρια. δεν πέθανε έτσι απλά. γαμώ τα
      ρε, κάποιος ξέρει κάτι
    effects: { trust_artemis: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Artemis -> artemis_talk_early

  artemis_talk_early:
    type: message
    text: >
      ARTEMIS: ρε φίλε είσαι νέος εδώ; τι σκατά timing μαλάκα.
      ο Σταύρος ήταν ο πιο σωστός άνθρωπος του χωριού. μας άφηνε
      να φωτογραφίζουμε τα αμπέλια, μας μιλούσε για την ιστορία της
      γης. legend.

      κι ο Λευτέρης είδε κάτι περίεργο πριν λίγες μέρες αλλά δεν
      θέλει να μιλήσει. λέει "άσ' τα ρε" αλλά εγώ ξέρω ότι φοβάται.
      τι σκατά γίνεται σ' αυτό το χωριό;
    effects: { trust_artemis: "+10" }
    choices:
      - What did Lefteris see? -> artemis_lefteris_hint
      - Move on -> quest1_hub

  artemis_lefteris_hint:
    type: message
    text: >
      ARTEMIS: δεν ξέρω ακριβώς. ήταν στο γήπεδο που κάνει μπάσκετ
      μόνος του τα βράδια, βλέπει κάτω στο οινοποιείο, κι είδε κάποιον
      να μπαίνει μέσα. νύχτα, χωρίς φώτα. ο Λευτέρης λέει ήταν
      γυναίκα αλλά σκοτεινά ήταν δεν είδε καλά.

      αν του μιλήσεις μη τον πιέσεις, θα κλείσει. πες του κάτι
      για μπάσκετ πρώτα χαχα
    effects: { trust_artemis: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Ampelakia. A Thessalian village
      built around wine and land. A winemaker who refused to sell.
      A death nobody believes was natural.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Eleni (Stavros's wife) -> eleni_q1
      - Talk to Despina (Stavros's assistant) -> despina_q1
      - Check what Nikos (Stavros's son) is saying -> nikos_q1
      - I'm ready to investigate the night he died -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Eleni Q1 ---

  eleni_q1:
    type: tweet
    from: eleni
    text: >
      ο Σταύρος δεν είχε καρδιακό πρόβλημα. ΠΟΤΕ. ζητάω δεύτερη
      νεκροψία. αν κάποιος ξέρει κάτι, ΜΙΛΗΣΤΕ.
    effects: { trust_eleni: "+5", contacts_followed: "+1" }
    choices:
      - DM Eleni -> eleni_q1_talk

  eleni_q1_talk:
    type: message
    text: >
      ELENI: I appreciate you reaching out but I'm cautious of
      strangers right now. Stavros had too many enemies at the end.

      ...but nobody in this village seems willing to ask the real
      questions.

      [Eleni is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_eleni: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Despina Q1 ---

  despina_q1:
    type: tweet
    from: despina
    text: >
      δεκαπέντε χρόνια στο πλάι του. τα βαρέλια ήταν μια χαρά τη
      Δευτέρα. την Τετάρτη κάτι βρόμαγε. κυριολεκτικά. κάποιος
      μπήκε στο κελάρι. ΚΆΠΟΙΟΣ.
    effects: { trust_despina: "+5", contacts_followed: "+1" }
    choices:
      - DM Despina -> despina_q1_talk

  despina_q1_talk:
    type: message
    text: >
      DESPINA: I've worked with Stavros since I was twenty-five.
      I know that winery like my own hands. The barrels were perfect
      on Monday. By Wednesday, the xinomavro smelled chemical. Not
      vinegar — chemical. Like solvent.

      Someone broke in and contaminated them. I told the police.
      They said "no signs of forced entry." Well, the cellar door
      hasn't had a proper lock since 2018. Everyone in the village
      knows that.

      [Despina seems trustworthy but rattled.]
    effects: { trust_despina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Nikos Q1 ---

  nikos_q1:
    type: tweet
    from: nikos
    text: >
      ο ΠΑΤΕΡΑΣ ΜΟΥ ΠΕΘΑΝΕ κι η αστυνομία μου λέει "φυσικά αίτια"???
      ΔΕΝ ΕΙΧΕ ΤΙΠΟΤΑ ΡΕ ΜΑΛΑΚΑ. ΤΟΝ ΣΚΟΤΩΣΑΝ. Έρχομαι από Λάρισα.
      κάποιος θα μου εξηγήσει.
    effects: { trust_nikos: "+5", contacts_followed: "+1" }
    choices:
      - DM Nikos -> nikos_q1_talk

  nikos_q1_talk:
    type: message
    text: >
      NIKOS: Who are you? Another person from this village who's going
      to tell me to calm down? My father called me two days before he
      died. He said "they're trying everything now." He said the
      Helios people sent someone to the house. He said "and that woman
      won't leave me alone."

      That's the last real conversation I had with him.
    effects: { trust_nikos: "+10" }
    choices:
      - Which woman? -> nikos_theory
      - Move on -> quest1_hub

  nikos_theory:
    type: message
    text: >
      NIKOS: Dimitra Kontaxi. The wine critic. She destroyed him
      online, then showed up in person. Dad said she was everywhere.
      At the vineyard, at the kafeneio, photographing his cellar. She
      said it was "research." It didn't feel like research.

      But honestly? I also think Helios killed him. Without his land,
      their hotel is finished. And dad wouldn't sell. He kept saying
      "over my dead body."

      Well. Here we are.
    effects: { trust_nikos: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Stavros died. Multiple people saw
      or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Lefteris (was playing basketball near the winery) -> lefteris_interview
      - Find Vasilis (farmer, was up late) -> vasilis_interview
      - Find Fotini (pharmacist, keeps late hours) -> fotini_interview
      - Find Yiannis (priest, early morning walk) -> yiannis_interview

  # --- Lefteris (saw someone at the winery) ---

  lefteris_interview:
    type: tweet
