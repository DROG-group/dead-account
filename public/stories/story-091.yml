  ending_b:
    type: message
    text: >
      ENDING B: THE DEVELOPMENT

      The hotel story breaks. Helios Thessaly is ordered to halt
      construction pending investigation. The archaeological survey
      is declared fraudulent. Roman ruins are confirmed on the site.
      The project collapses. Mayor Mavrogiannis faces corruption
      charges.

      But Stavros?

      Without the stalking and poisoning evidence, Dimitra is never
      investigated. The death remains "cardiac arrest." She writes a
      tribute article: "The Winemaker Who Refused to Change."

      She keeps her photographs. She moves to another village. She
      finds another winemaker to admire. The pattern continues.

      Six months later, @panagiotis creates a new account. It
      follows a young vintner in Nemea.

      The land is saved. But Stavros's killer walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: nikos
    text: "το κτήμα σώθηκε. ο πατέρας μου όχι. αυτό δεν είναι δικαιοσύνη."
    choices:
