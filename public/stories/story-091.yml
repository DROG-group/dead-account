  dimitra_response:
    type: message
    text: >
      Dimitra doesn't reply for a long time. Then:

      DIMITRA: You don't understand. He was wasting his gift. That
      xinomavro was extraordinary and he was hiding it in a village
      nobody's heard of. I wanted to make him famous. I wanted to
      help him. Everything I did was because his wine deserved
      better.

      That's not helping. That's obsession. That's murder.

      You've already sent the evidence to Astynomia Katsaros. And to
      Marina Alexiou.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Katsaros reopens the case. A second autopsy reveals traces of
      potassium cyanide in Stavros's blood — consistent with poisoned
      wine. The glass found beside him is recovered from the evidence
      locker and tested. Positive. Dimitra Kontaxi is arrested for
      murder, stalking, and criminal poisoning. Her rental room
      contains hundreds of photographs of Stavros and bottles of
      agricultural chemicals.

      Marina Alexiou, with the Helios evidence package, publishes
      in ThessPress. The fraudulent archaeological survey is exposed.
      The prefecture orders a proper excavation. Roman ruins are
      confirmed. The hotel project is cancelled. Alexandros Roussos
      faces fraud charges. Mayor Mavrogiannis resigns.

      Eleni stands in the vineyard where her husband died. Nikos
      is beside her. The oldest vine — the one Stavros's grandfather
      planted — is scarred but alive.

      "Θα συνεχίσουμε. Για αυτόν."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Γραμμή SOS 15900 (24ωρη, δωρεάν)
      Γραμμή Παιδιού 1056 (Χαμόγελο του Παιδιού)
      Ευρωπαϊκός αριθμός έκτακτης ανάγκης: 112
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: eleni
    text: >
      τα αμπέλια δεν πεθαίνουν. ούτε η μνήμη. ο Σταύρος είναι σε
      κάθε σταφύλι. σας ευχαριστώ που δεν τα παρατήσατε.
    choices:
      - The End -> game_complete

  # --- ENDING B: Alexandros (Partial Ending) ---

  confront_alexandros:
    type: message
    text: >
      You present the development evidence to Alexandros Roussos:

      "I have the real archaeological survey showing Roman ruins. I
