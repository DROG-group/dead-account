      in Larissa told me to close it. He said the coroner ruled
      natural causes and that was that.

      The Helios situation is political. I can't touch it without
      orders from above. But the stalking — the Dimitra situation —
      that I didn't even know about until now. If you have evidence,
      I can act on that. Harassment, breaking and entering, possible
      poisoning — that's clearly criminal.

      Bring me something solid and I'll reopen the case.
    effects:
      trust_astynomia: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

