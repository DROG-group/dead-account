  # --- ENDING A: Dimitra (Best Ending) ---

  confront_dimitra:
    type: message
    text: >
      You present your evidence to Dimitra:

      "I know @panagiotis is your account. I know you broke into the
      winery and contaminated the barrels. I know you were stalking
      Stavros — photographing his house, tracking his movements. I
      know you asked about undetectable chemicals. I have the
      notebook from the kafeneio. I have witnesses."
    choices:
