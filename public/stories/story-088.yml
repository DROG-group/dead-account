      We were going to publish together. Then she went dark. And
      two days later, someone broke into my car and took my backup
      drive.

      Róisín is alive. She contacted me once, from a burner phone.
      She said she was hiding. She said "they threatened me at the
      co-op and someone else won't leave me alone."

      I can't tell you where she is. But with enough evidence, I
