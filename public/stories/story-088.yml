entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN DÚN MARA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to DunMara.social — the community Mastodon instance for
      the coastal village of Dún Mara, West Cork, Ireland.

      The local feed is uneasy today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name over and over:
      @roisin_murphy.

      A seaweed harvester. Coastal photographer. She documented the
      shoreline and the bay's ecosystem for years. People are worried.
      She hasn't posted in six days.
    choices:
      - Look at her profile -> roisin_profile

  roisin_profile:
    type: tweet
    from: roisin
    text: "Dead fish washing up on Trá Bán again. Three days running now. The salmon farm discharge is killing the bay. I have the water samples to prove it."
    choices:
      - That's her last real post... -> grey_wave

  grey_wave:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a grey wave. Blurred, overexposed, shot at a strange angle.
      Posted at 2am. No caption.

      Her friends say that's not Róisín. She writes long captions
      about every tide, every strand, every harvest. The Guards say
      she probably went travelling. Nobody in Dún Mara believes that
      for a second.
    choices:
      - Read the Garda statement -> garda_statement
      - Look at what people are saying -> community_reaction

  garda_statement:
    type: tweet
    from: sergeant
    text: >
      We have received a report concerning a Dún Mara resident.
      At this stage, there is no evidence of foul play. The individual
      may have chosen to travel. Any information can be provided to
      the local station or by calling 999.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are pure chaos. Her best friend @siobhan is
      beside herself. Her brother @cillian is driving down from Cork
      city. Her business partner @fionnuala is posting desperate pleas.
      The fisherman @colm says she was right about the bay.

      And the journalist @aoife_kelleher hasn't said a word. Not one.
      That's not like her at all.

      Nobody buys the Guards' line. Nobody thinks Róisín just fecked
      off on holiday without telling a soul.
    effects: { trust_siobhan: "+5", trust_cillian: "+5" }
    choices:
      - Start following Róisín's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Dún Mara. Follow Róisín's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Bridie (pub owner, knows everyone) -> bridie_intro
      - Talk to Colm (fisherman, saw the dead fish) -> colm_intro
      - Talk to Saoirse (teen surfer, seems shaken) -> saoirse_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Róisín with the rhythms of a small
      coastal village: tide tables, trad session announcements, weather
      warnings, someone's dog on the strand.

      Key names surface: Siobhán (best friend, teacher), Fionnuala
      (business partner, rattled), Aoife (journalist, strangely quiet),
      and the teens — Saoirse, Oisín, Niamh — who idolised Róisín's
      coastal work.

      Also prominent: AtlanticHarvest Aquaculture, the salmon farm
      in the bay. Their posts are corporate PR. Róisín's posts were
      the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Bridie -> bridie_intro
      - Talk to Colm -> colm_intro
      - Talk to Saoirse -> saoirse_intro

  # --- Bridie (social map) ---

  bridie_intro:
    type: tweet
    from: bridie
    text: >
      The pub is open but the heart is gone out of it. @roisin_murphy,
      your stool is waiting for you love. Come home to us.
    effects: { trust_bridie: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Bridie -> bridie_talk

  bridie_talk:
    type: message
    text: >
      BRIDIE: Ah, you're new? Welcome to Dún Mara. Terrible time to
      land, I won't lie to you. The whole village is in bits over
      Róisín.

      Let me give you the lay of the land. Siobhán is Róisín's best
      friend since they were in nappies — primary school teacher, salt
      of the earth, absolutely destroyed right now. Fionnuala Brennan
      runs the seaweed co-op with Róisín. Cillian is Róisín's older
      brother, he's coming down from Cork.

      And Aoife Kelleher — the journalist — herself and Róisín were
      working on something together. Something about the bay. Aoife
      hasn't said a word since Róisín vanished. That's not right.

      Oh, and that new fella, Lorcan Reid. The surfer. Moved here
      six months ago. He's been hanging around Róisín something fierce.
      Friendly at first but she told me it was getting a bit much.
    effects: { trust_bridie: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Lorcan -> bridie_lorcan
      - Ask about AtlanticHarvest -> bridie_atlantic
      - Thank her and move on -> quest1_hub

  bridie_lorcan:
    type: message
    text: >
      BRIDIE: Lorcan? He landed in here about six months back.
      English fella, or half-English anyway. Surfer, instructor,
      that type. Good-looking and he knows it. Started chatting up
      Róisín from day one — asking about the coast, the tides, the
      best spots.

      She was polite about it at first. Showed him the strands. But
      then he started turning up everywhere she was. Down at the shore
      when she was harvesting. At the co-op when she was working. In
      the pub every time she came in.

      She said to me one night, "Bridie, that fella doesn't take a
      hint." I thought she meant he was a bit keen. Now I'm not so
      sure it was just that.
    effects: { trust_bridie: "+5" }
    choices:
      - Ask about AtlanticHarvest -> bridie_atlantic
      - Move on -> quest1_hub

  bridie_atlantic:
    type: message
    text: >
      BRIDIE: That salmon farm has been in the bay three years now.
      AtlanticHarvest. Big operation — pens out past the headland.
      The village tolerated them because they brought jobs. But the
      fishermen have been giving out for ages — dead fish on the
      strand, the water going murky, sea lice everywhere.

      Róisín was the first to actually do something about it. Took
      water samples, photographed the discharge, documented everything.
      She had proof, she said. Real proof that they were dumping
      chemical treatments straight into the bay.

      Two weeks later she's gone. You do the maths.
    effects: { trust_bridie: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Colm (the water, witness tease) ---

  colm_intro:
    type: tweet
    from: colm
    text: >
      tríocha cúig bliain ag iascaireacht anseo. tá an fharraige
      athraithe. bhí an ceart ag @roisin_murphy. agus anois tá sí
      imithe. déan an ceangal.
    effects: { trust_colm: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Colm -> colm_talk

  colm_talk:
    type: message
    text: >
      COLM: I've been fishing this bay since I was a young fella.
      I know every current, every rock, every colour the water makes.
      And I'm telling you — the bay is fucked. Pardon the language
      but there's no other word for it.

      Dead crabs in my pots. Sea lice on everything. The seabed near
      those pens smells like a chemical plant. Róisín took water
      samples. She dove down near the discharge pipes. She photographed
      everything. She was building a case.

      And then poof — gone. Like a mackerel off a line.

      You think that's a coincidence? There's no such thing as a
      coincidence in a village this size.
    effects: { trust_colm: "+10" }
    choices:
      - Did you see anything unusual recently? -> colm_night
      - Move on -> quest1_hub

  colm_night:
    type: message
    text: >
      COLM: The night before she vanished — I was coming in from
      night fishing, around half twelve. I saw lights at the co-op
      shed. Not unusual, Róisín works late sometimes. But there was
      a jeep parked outside that I didn't recognise. Big thing,
      black, with an AtlanticHarvest sticker on the door.

      Half twelve at night. At Róisín's co-op shed. That's not
      normal.

      I noted it in my log. Nobody's asked to see it.
    effects: { trust_colm: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Saoirse (teen surfer, witness tease) ---

  saoirse_intro:
    type: tweet
    from: saoirse
    text: >
      i'm actually so upset rn like @roisin_murphy is literally
      the nicest person in this village?? she taught me everything
      about the shore. if anyone knows anything PLEASE say it
    effects: { trust_saoirse: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Saoirse -> saoirse_talk_early

  saoirse_talk_early:
    type: message
    text: >
      SAOIRSE: oh you're new here? mad timing like. róisín is
      honestly the best person in dún mara no word of a lie. she
      showed us all the rockpools, taught us about the seaweed,
      took us kayaking. absolute legend.

      and now i'm actually bricking it because oisín saw something
      weird the other night down at the pier but he won't talk
      about it. says it's nothing but like... it's clearly not
      nothing. he's acting well sketchy about the whole thing
    effects: { trust_saoirse: "+10" }
    choices:
      - What did Oisín see? -> saoirse_oisin_hint
      - Move on -> quest1_hub

  saoirse_oisin_hint:
    type: message
    text: >
      SAOIRSE: i don't know exactly like. he was down at the pier
      doing a sunset session and he saw someone messing around
      róisín's van?? or something like that. he's being well cagey.

      you'd have to ask him yourself but he's mad suspicious of
      people he doesn't know. try talking about surfing first or
      something lol. he's sound once he trusts you but like... good
      luck with that
    effects: { trust_saoirse: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Dún Mara. A West Cork fishing
      village built around the bay. A seaweed harvester who was
      exposing pollution. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Siobhán (Róisín's best friend) -> siobhan_q1
      - Talk to Fionnuala (Róisín's business partner) -> fionnuala_q1
      - Check what Cillian (Róisín's brother) is saying -> cillian_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Siobhán Q1 ---

  siobhan_q1:
    type: tweet
    from: siobhan
    text: >
      má tá nuacht ag aon duine faoi @roisin_murphy glaoigí orm
      le bhur dtoil. tá a seomra slán. tá a mála tumadóireachta
      ann. ní imeodh sí riamh gan a cuid trealaimh.
    effects: { trust_siobhan: "+5", contacts_followed: "+1" }
    choices:
      - DM Siobhán -> siobhan_q1_talk

  siobhan_q1_talk:
    type: message
    text: >
      SIOBHÁN: I appreciate you reaching out but I don't know you
      from Adam. Róisín has a lot of friends here. I'm sure she'll
      come home.

      ...I keep saying that. I don't believe it anymore.

      [Siobhán is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_siobhan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Fionnuala Q1 ---

  fionnuala_q1:
    type: tweet
    from: fionnuala
    text: >
      The co-op shed is empty without @roisin_murphy. Her samples
      are still drying on the racks. Her harvest log is on the desk.
      She would never abandon a harvest mid-season. Something happened.
    effects: { trust_fionnuala: "+5", contacts_followed: "+1" }
    choices:
      - DM Fionnuala -> fionnuala_q1_talk

  fionnuala_q1_talk:
    type: message
    text: >
      FIONNUALA: Myself and Róisín built this co-op from nothing.
      Five years of work. She knows every strand, every tide, every
      species of kelp on this coast. The harvest season is on and
      she just vanished? That's not her. That's not remotely her.

      She was working on something beyond the seaweed. The water
      quality investigation. She had data, photos, chemical analysis.
      She was so close to going public.

      I offered to help. She said she had it under control. She said
      she was working with a journalist.

      [Fionnuala seems earnest but exhausted.]
    effects: { trust_fionnuala: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Cillian Q1 ---

  cillian_q1:
    type: tweet
    from: cillian
    text: >
      my sister has DISAPPEARED and the Guards tell me she might
      have gone on holiday??? SHE DOESN'T GO ON FECKING HOLIDAY
      WITHOUT TELLING SOMEONE. i'm driving down from cork. someone
      better have answers.
    effects: { trust_cillian: "+5", contacts_followed: "+1" }
    choices:
      - DM Cillian -> cillian_q1_talk

  cillian_q1_talk:
    type: message
    text: >
      CILLIAN: Who are you? Another person from that village who's
      going to tell me to calm down? My sister rang me the night
      before she disappeared. She said she had something big. She
      said "if anything happens, look at AtlanticHarvest." Then the
      line went dead.

      That's the last I heard from her.
    effects: { trust_cillian: "+10" }
    choices:
      - What do you think happened? -> cillian_theory
      - Move on -> quest1_hub

  cillian_theory:
    type: message
    text: >
      CILLIAN: I think she found proof that AtlanticHarvest is
      dumping chemical shite into the bay and they shut her up. But
      I also think that surfer fella — Lorcan — knows more than he's
      letting on. The way he talks about her... it's not just friendly.
      It's something else. Something off.

      Róisín told me months ago that someone was following her on
      her morning harvests. She thought it was nothing. She laughed
      it off, said "sure he's just keen." I don't think it was
      nothing. Not anymore.
    effects: { trust_cillian: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Róisín went silent. Multiple
      people saw or heard things. Piece together the timeline from
      witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Oisín (was surfing at sunset near the pier) -> oisin_interview
      - Find Tadgh (harbour master, works late) -> tadgh_interview
      - Find Éamon (oyster farmer, early morning at the shore) -> eamon_interview
      - Find Maeve (shop owner, saw something at dawn) -> maeve_interview

  # --- Oisín (saw someone at Róisín's van) ---

  oisin_interview:
    type: tweet
    from: oisin
    text: >
      unreal session this evening but the vibes at the pier are
      so off lately. something's not right. can't explain it like
    effects: { trust_oisin: "+5" }
    choices:
      - Ask Oisín about that evening -> oisin_talk

  oisin_talk:
    type: message
    text: >
      OISÍN: right ok but you can't tell anyone yeah. i was at the
      pier around 7, sunset session. and i saw that surfer lad —
      lorcan — at róisín's van. like proper rooting around in it.
      he had the door open and he was putting something in or taking
      something out i couldn't tell.

      when he copped i was watching he just legged it. like sprinted
      off. what the actual fuck is that about.

      i said nothing cos like who's gonna believe me. i'm just some
      young fella. but that was well dodgy like
    effects:
      trust_oisin: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Tadgh (harbour master, saw late-night meeting) ---

  tadgh_interview:
    type: tweet
    from: tadgh
    text: >
      Meabhrúchán: tá an cé dúnta idir 10in agus 6rn.
      Tá gluaiseachtaí neamhúdaraithe feicthe agam na hoícheanta
      seo caite.
    effects: { trust_tadgh: "+5" }
    choices:
      - Ask Tadgh what he saw -> tadgh_talk

  tadgh_talk:
    type: message
    text: >
      TADGH: I was locking up the harbour office around half ten.
      I saw Róisín's van still at the co-op shed. And a black jeep —
      AtlanticHarvest branding on the side — parked right next to it.
      Two fellas were standing by the shed door. One of them I knew:
      Cathal Fitzgerald, the site director.

      At half ten at night. At the seaweed co-op. That's not right.

      I wrote it in my harbour log. Nobody's asked to see it. The
      Guards didn't even ring me.
    effects:
      trust_tadgh: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
