  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The Cathaoirleach's solicitor buries your accusation. Without
      a direct link between Ó Drisceoil and AtlanticHarvest's
      dumping — and there isn't one beyond political protection —
      your evidence is insufficient.

      AtlanticHarvest continues to operate. Lorcan continues to
      watch. Róisín stays in hiding.

      Six months later, @orla_dunne creates a new account. This
      time it follows Róisín's brother.
    choices:
