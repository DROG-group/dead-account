  lorcan_response:
    type: message
    text: >
      Lorcan doesn't reply for a long time. Then:

      LORCAN: You don't understand. I was looking out for her. She
      was in danger from that fish farm and she wouldn't let me
      help. I needed to know she was safe. Everything I did was
      because I care about her. I've never met anyone like her.

      That's not care. That's obsession. And it's the third time
      he's done it.

      You've already sent the evidence to Sergeant Brennan. And
      to Aoife Kelleher.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Sergeant Brennan reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the witness testimonies,
      the pattern from Lahinch and Bundoran — Lorcan is arrested
      for stalking and harassment. A GPS tracker is recovered from
      under Róisín's van at the old boathouses in Trá Bán. The
      women in Lahinch and Bundoran come forward. It's a serial
      pattern.

      Aoife Kelleher, finally in possession of Róisín's full
      evidence package, publishes the AtlanticHarvest story in
      The Irish Times. The EPA orders an unannounced inspection.
      The farm is shut down pending environmental remediation.
      Cathal Fitzgerald faces criminal charges for illegal
      discharge of chemical treatments.

      And Róisín Murphy, reading the story from a friend's house
      in Skibbereen, calls her brother for the first time in
      nine days.

      "I'm coming home, Cillian."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Women's Aid Freephone Helpline: 1800 341 900
      Gardaí: 999 / 112
      Cyber-bullying: Hotline.ie
    choices:
      - See the epilogue -> ending_a_epilogue

