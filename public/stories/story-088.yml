  # --- ENDING B: Cathal (Partial Ending) ---

  confront_cathal:
    type: message
    text: >
      You present the pollution evidence to Cathal Fitzgerald:

      "I have photographs of undeclared discharge pipes. I have
      water samples showing emamectin benzoate at fifty times the
      safe level. I have your original chemical logs showing the
      data was falsified. I have the drum with your batch number."
    choices:
      - Send -> cathal_response

  cathal_response:
    type: message
    text: >
      CATHAL: This conversation is being forwarded to our legal
      team. Any publication of defamatory material will result in
      immediate proceedings. AtlanticHarvest has always operated
      within regulatory requirements and holds full BIM
      certification.

      But it's too late. You've sent the evidence to Aoife, to
      Faire na Cósta, and to the EPA.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. AtlanticHarvest is ordered to
      cease all chemical treatments pending investigation. The farm
      may close permanently. Eighty jobs hang in the balance. The
      village is divided.

      But Róisín?

      Without the stalking evidence, Lorcan is never investigated.
      He stays in Dún Mara. He continues to monitor her accounts.
      He creates a new anonymous profile. He'll do what he always
      does — six months, then move on to the next village, the next
      woman.

      Three months later, Róisín reads about AtlanticHarvest online.
      She returns quietly. She changes her locks. She stops
      harvesting alone. She checks under her van every morning.

      The corporation is exposed. But the person who terrorised
      Róisín walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: roisin
    text: "i'm home. the bay is cleaner. the rest... we'll see."
    choices:
      - The End -> game_complete

