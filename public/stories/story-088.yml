  confront_lorcan:
    type: message
    text: >
      You present your evidence to Lorcan:

      "I know @orla_dunne is your account. I know you put a GPS
      tracker on Róisín's van. I know you went through her things.
      I know you were watching her cottage. I have witnesses and
      I have your post history from Lahinch and Bundoran."
    choices:
