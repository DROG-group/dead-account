          state: obsession_evidence
          gte: 5
      - Confront Filip Rogiers (VlaamsChem director) -> confront_rogiers
        when:
          state: corporate_evidence
          gte: 3
      - Confront Schepen Pieter Van Damme (political protection) -> confront_pieter
      - I need more evidence -> investigation_hub

  # --- ENDING A: Marc Desmet (Best Ending) ---

  confront_desmet:
    type: message
    text: >
      You present your evidence to Marc Desmet:

      "I know @tibo_geerts is your account. I know you put a GPS
      tracker in Lotte's bike bag. I know you had a key to her
      studio. I know you watched her from your car at night. I have
      witnesses, the anonymous posts, and the gallery records."
    choices:
      - Send -> desmet_response

  desmet_response:
    type: message
    text: >
      Desmet doesn't reply for a long time. Then:

      DESMET: You don't understand. I was her biggest supporter. I
      made her career. Without my purchases, nobody would know her
      name. I just wanted to be close to the art. Close to the
      process. She owes me that.

      That's not support. That's obsession.

      You've already sent the evidence to Commissaris Verbeke. And
      to Hilde Mertens.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Commissaris Verbeke reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the studio key, the witness
      testimonies — Marc Desmet is arrested for stalking and
      harassment. A second GPS tracker is recovered from under the
      seat of Lotte's bicycle.

      Hilde Mertens, finally in possession of Lotte's full evidence
      package, publishes the VlaamsChem story in De Standaard. The
      provincie orders an unannounced inspection. The factory is shut
      down pending environmental remediation. Filip Rogiers faces
      criminal charges for falsifying discharge reports. Schepen
      Pieter Van Damme resigns when his financial ties to VlaamsChem
      are revealed.

      And Lotte Vermeersch, reading the story from a friend's house
      in Brugge, calls her sister for the first time in ten days.

      "Ik kom naar huis."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: lotte
    text: >
      het kanaal liegt niet. en de mensen van spierevelde ook niet.
      merci om niet op te geven.
    choices:
      - The End -> game_complete

  # --- ENDING B: Filip Rogiers (Partial Ending) ---

  confront_rogiers:
    type: message
    text: >
      You present the pollution evidence to Filip Rogiers:

      "I have photographs of the undeclared discharge pipe. I have
      water samples showing heavy metal and dye concentrations ten
      times the legal limit. I have your original lab reports showing
      the data was falsified. I have the barrel with your batch
      number."
    choices:
      - Send -> rogiers_response

  rogiers_response:
    type: message
    text: >
      ROGIERS: Dit gesprek wordt doorgestuurd naar onze juridische
      dienst. Elke publicatie van lasterlijke beweringen zal leiden
      tot onmiddellijke gerechtelijke stappen. VlaamsChem heeft
      altijd binnen de wettelijke kaders geopereerd.

      Maar het is te laat. Je hebt het bewijs naar Hilde gestuurd,
      naar de Erfgoedvereniging Het Kanaal, en naar de provincie.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. VlaamsChem is ordered to halt all
      discharge pending investigation. The factory may close. A
      hundred and fifty jobs hang in the balance. The village is
      divided.

      But Lotte?

      Without the stalking evidence, Marc Desmet is never
      investigated. He continues to visit Spierevelde. He creates a
      new anonymous profile. He finds a new artist to "support."

      Three months later, Lotte reads about VlaamsChem online. She
      returns quietly. She moves her studio. She locks everything
      twice. She checks her bike every morning.

      The corporation is exposed. But the person who terrorised
      Lotte walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: lotte
    text: "ik ben terug. het water is proper. de rest... we zien wel."
    choices:
      - The End -> game_complete

  # --- ENDING C: Schepen Van Damme (Wrong Ending) ---

  confront_pieter:
    type: message
    text: >
      You confront Schepen Pieter Van Damme with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> pieter_response

  pieter_response:
    type: tweet
    from: dieter
    text: >
      Mijn cliënt neemt kennis van uw beschuldigingen. Elke publieke
      verspreiding van lasterlijke beweringen zal leiden tot
      onmiddellijke juridische stappen. — Kantoor Coppens & Partners,
      Brussel
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The schepen's lawyer buries your accusation. Without a direct
      link between Van Damme and VlaamsChem's dumping — and there
      isn't one beyond political protection — your evidence is
      insufficient.

      VlaamsChem continues to operate. Desmet continues to watch.
      Lotte stays in hiding.

      Six months later, @tibo_geerts creates a new account. It
      follows Lotte's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: SPIEREVELDE — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Lotte's story explores themes of
      corporate impunity, environmental crime, obsessive behaviour,
      artistic freedom, and the courage of small communities.

      If you or someone you know is experiencing stalking,
