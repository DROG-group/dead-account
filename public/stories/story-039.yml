entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SPIEREVELDE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to spierevelde.social — the community Mastodon instance for
      the Flemish canal village of Spierevelde.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @lotte_vermeersch.

      A lace maker. Textile artist. She turned ancient Flemish
      kloswerk into contemporary art. People are worried. She hasn't
      posted in six days.
    choices:
      - Look at her profile -> lotte_profile

  lotte_profile:
    type: tweet
    from: lotte
    text: "De kleur van het kanaal klopt niet meer. Iemand dumpt verf in het water. Ik heb foto's."
    choices:
      - That's her last real post... -> grey_lace

  grey_lace:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a tangled piece of lace, grey and stained, photographed under
      harsh fluorescent light. Posted at 2am. No caption.

      Her friends say that's not her style. Lotte's photos were always
      soft, natural light, carefully composed. The politie says she
      probably needed a break from social media. Something doesn't
      add up.
    choices:
      - Read the politie statement -> politie_statement
      - Look at what people are saying -> community_reaction

  politie_statement:
    type: tweet
    from: commissaris
    text: >
      We hebben een melding ontvangen over een inwoner van Spierevelde.
      Op dit moment zijn er geen aanwijzingen voor een misdrijf.
      Informatie kan worden doorgegeven aan het lokale commissariaat
      of via 101.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @wout_de_smedt is
      furious. Her sister @noor_peeters is on her way from Gent.
      The gallery owner @roos_de_wilde keeps posting her work.
      The fisherman @bram_wouters says she was right about the water.

      And the journalist @hilde_mertens is strangely silent.

      Nobody buys the politie's line. Nobody thinks Lotte just
      "needed a break."
    effects: { trust_wout: "+5", trust_noor: "+5" }
    choices:
      - Start following Lotte's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Spierevelde. Follow Lotte's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Lies (café owner, knows everyone) -> lies_intro
      - Talk to Bram (fisherman, saw the water) -> bram_intro
      - Talk to Fien (teen skater, seems shaken) -> fien_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Lotte with the rhythms of a small
      Flemish village: lock schedules for the canal, the bakery's
      daily specials, weather warnings for the polder.

      Key names surface: Wout (best friend, bike mechanic), Roos
      (gallery owner, showed Lotte's work), Hilde (journalist,
      oddly quiet), and the teens — Fien, Arne, Emma — who looked
      up to Lotte as a mentor.

      Also prominent: VlaamsChem NV, the textile dye factory at the
      edge of the village. Their posts are corporate PR. Lotte's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Lies -> lies_intro
      - Talk to Bram -> bram_intro
      - Talk to Fien -> fien_intro

  # --- Lies (social map) ---

  lies_intro:
    type: tweet
    from: lies
    text: >
      't Kanaaltje is open maar het voelt leeg. @lotte_vermeersch, uw
      vaste tafeltje staat klaar. Kom terug meisje.
    effects: { trust_lies: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Lies -> lies_talk

  lies_talk:
    type: message
    text: >
      LIES: Amai, ge zijt nieuw hier? Welkom, maar slechte timing.
      Iedereen is overstuur door Lotte.

      Ik zal u uitleggen wie wie is. Wout is Lottes beste vriend —
      ze zijn samen opgegroeid, hij heeft een fietsenzaak aan het
      kanaal. Roos De Wilde heeft de galerij waar Lottes werk hangt.
      Noor is Lottes jongere zus, studeert in Gent, is onderweg.
      En nonkel Jef — die is als een vader voor haar sinds haar
      ouders zijn gescheiden.

      En Hilde Mertens — de journaliste — zij en Lotte werkten samen
      aan iets. Iets over het water. Hilde heeft geen woord gezegd
      sinds Lotte weg is. Da's niet normaal.

      Ah ja, en negeer die posts van VlaamsChem. Leugens verpakt in
      ISO-certificaten.
    effects: { trust_lies: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Roos -> lies_roos
      - Ask about VlaamsChem -> lies_vlaamschem
      - Thank her and move on -> quest1_hub

  lies_roos:
    type: message
    text: >
      LIES: Roos? Die heeft de galerij drie jaar geleden geopend.
      Hedendaagse textielkunst, heel hip. Lotte was haar paradepaard —
      haar werk verkocht goed, vooral bij een bepaalde klant.

      Er was een man — ik ken zijn naam niet — die al zes stukken van
      Lotte had gekocht. Maar het ging verder dan kunst kopen. Hij
      begon speciale opdrachten te geven. Persoonlijke dingen.
      Portretten in kant. Haar gezicht geweven in stof. Lotte vond
      het eerst vleiend, daarna... niet meer.

      Ze zei me eens: "Die man wil geen kunst. Die wil mij." Dat
      klonk als een grap. Nu niet meer.
    effects: { trust_lies: "+5" }
    choices:
      - Ask about VlaamsChem -> lies_vlaamschem
      - Move on -> quest1_hub

  lies_vlaamschem:
    type: message
    text: >
      LIES: Die fabriek staat er al sinds de jaren 80. Textielverf,
      chemische solventen, gekleurde rommel. Het dorp tolereerde het
      voor de jobs. Maar de vissers klagen al jaren — vreemd gekleurde
      vlekken in het kanaal, dode vissen bij de sluis.

      Lotte was de eerste die effectief ging kijken met een camera en
      monsterpotten. Ze had bewijs, zei ze. Echt bewijs. Foto's van
      buizen die 's nachts lozen. Twee weken later is ze weg.

      Godverdomme, iemand moet iets doen.
    effects: { trust_lies: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Bram (the water, witness tease) ---

  bram_intro:
    type: tweet
    from: bram
    text: >
      dertig jaar dat ik hier vis. het kanaal is kapot. @lotte_vermeersch
      had gelijk. en nu is ze verdwenen. trek zelf uw conclusies.
    effects: { trust_bram: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Bram -> bram_talk

  bram_talk:
    type: message
    text: >
      BRAM: Ik vis dit kanaal al sinds ik een jongen was. Ik ken elke
      stroming, elke kleur die het water maakt. En ik zeg u — het
      kanaal bij de sluis is kapot. Al maanden. Mijn netten komen
      leeg boven. De bodem stinkt naar chemicaliën.

      Lotte nam watermonsters. Ze fotografeerde alles. Ze was een
      dossier aan het opbouwen. En toen — poef — weg.

      Denkt ge dat dit toeval is? Amai, ik geloof niet in toevallen
      op het water.
    effects: { trust_bram: "+10" }
    choices:
      - Did you see anything unusual recently? -> bram_night
      - Move on -> quest1_hub

  bram_night:
    type: message
    text: >
      BRAM: De nacht voor ze verdween — ik was terug van nachtvisserij,
      rond 1u. Ik zag licht in haar atelier aan het kanaal. Niet
      ongewoon, ze werkte laat. Maar er stond een auto geparkeerd die
      ik niet kende. Donkere BMW met Brusselse nummerplaat.

      Om 1u 's nachts. Bij het atelier van Lotte.

      Ik dacht er toen niks van. Nu denk ik er de hele tijd aan.
    effects: { trust_bram: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Fien (teen skater, witness tease) ---

  fien_intro:
    type: tweet
    from: fien
    text: >
      amai echt nie te geloven he @lotte_vermeersch die heeft mij leren
      kleuren mengen voor mijn graffiti. echt een toffe madame. als ge
      iets weet zegt het aub
    effects: { trust_fien: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Fien -> fien_talk_early

  fien_talk_early:
    type: message
    text: >
      FIEN: zenne ge zijt nieuw hier? kut timing. maar echt lotte is
      de max. ze leerde ons kleuren mengen, textielkunst, echt alles.
      ze was meer als een lerares, ze was gewoon echt cool.

      en nu ben ik bang want arne heeft iets gezien de andere avond
      bij het kanaal maar hij wilt er niet over praten. hij zegt dat
      het niks was maar amai... het was duidelijk niet niks zenne
    effects: { trust_fien: "+10" }
    choices:
      - What did Arne see? -> fien_arne_hint
      - Move on -> quest1_hub

  fien_arne_hint:
    type: message
    text: >
      FIEN: ik weet nie precies. hij was aan het bmxen bij het kanaal
      en hij zag iemand die dingen in lottes atelier aan het zetten
      was?? of zoiets. hij flipt er echt van. ge moet het hem zelf
      vragen maar hij vertrouwt nie zomaar mensen. probeer eerst over
      graffiti te praten ofzo lol
    effects: { trust_fien: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Spierevelde. A Flemish canal village
      built around water and textile heritage. A young lace maker who
      was exposing pollution. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Wout (Lotte's best friend) -> wout_q1
      - Talk to Roos (gallery owner) -> roos_q1
      - Check what Noor (Lotte's sister) is saying -> noor_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Wout Q1 ---

  wout_q1:
    type: tweet
    from: wout
    text: >
      als iemand iets weet over @lotte_vermeersch bel mij. haar
      atelier is dicht. haar fiets staat er nog. ze gaat godverdomme
      nergens naartoe zonder haar fiets.
    effects: { trust_wout: "+5", contacts_followed: "+1" }
    choices:
      - DM Wout -> wout_q1_talk

  wout_q1_talk:
    type: message
    text: >
      WOUT: Wie zijt gij? Nog iemand uit dat dorp die mij gaat
      vertellen da ik me moet kalmeren? Lotte belde mij de avond
      voor ze verdween. Ze zei dat ze iets groots had. Ze zei "als
      er iets gebeurt, kijk naar VlaamsChem." Dan hing ze op.

      Da's het laatste wat ik van haar gehoord heb.
    effects: { trust_wout: "+10" }
    choices:
      - What do you think happened? -> wout_theory
      - Move on -> quest1_hub

  wout_theory:
    type: message
    text: >
      WOUT: Ik denk dat ze bewijs had dat VlaamsChem illegaal loost
      en dat ze haar de mond gesnoerd hebben. Maar ik denk ook dat
      die klant van de galerij — die gast die al die speciale
      opdrachten gaf — meer weet dan hij zegt. De manier waarop hij
      over haar praatte... da's nie normaal. Da's tering creepy.

      Lotte vertelde mij maanden geleden dat iemand haar post
      opende voor ze thuiskwam. Ze dacht dat het niks was. Ik denk
      dat het niet niks was.
    effects: { trust_wout: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Roos Q1 ---

  roos_q1:
    type: tweet
    from: roos
    text: >
      De galerij is stil vandaag. @lotte_vermeersch haar nieuwste
      werk hangt klaar voor de expo. Zij niet. Kom terug Lotte.
    effects: { trust_roos: "+5", contacts_followed: "+1" }
    choices:
      - DM Roos -> roos_q1_talk

  roos_q1_talk:
    type: message
    text: >
      ROOS: Lotte is mijn beste kunstenares. Haar werk verkoopt als
      zoete broodjes, vooral bij één klant. Hij heet — ik mag eigenlijk
      geen namen noemen. Maar hij kocht zes stukken en gaf dan
      opdrachten. Steeds persoonlijker. Een portret van haarzelf in
      kant. Een stuk gebaseerd op haar handschrift. Foto's van haar
      handen terwijl ze werkt.

      Lotte begon zich ongemakkelijk te voelen. Ze wilde stoppen met
      de opdrachten. Hij werd... moeilijk.

      [Roos aarzelt. Ze wil meer zeggen maar vertrouwt je nog niet
      helemaal.]
    effects: { trust_roos: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Noor Q1 ---

  noor_q1:
    type: tweet
    from: noor
    text: >
      mijn zus is VERDWENEN en de politie zegt dat ze misschien
      gewoon op reis is??? ZE GAAT NIET OP REIS ZONDER IETS TE
      ZEGGEN. ik kom vanuit gent. iemand gaat mij uitleg geven.
    effects: { trust_noor: "+5", contacts_followed: "+1" }
    choices:
      - DM Noor -> noor_q1_talk

  noor_q1_talk:
    type: message
    text: >
      NOOR: Wie zijt gij? Weer iemand die gaat zeggen dat ik mij
      geen zorgen moet maken? Mijn zus heeft mij niet gebeld. Haar
      telefoon gaat naar voicemail. Haar atelier is op slot.

      Lottes kantwerk lag op tafel, halfaf. Ze laat nooit een stuk
      halfaf achter. Nooit. Dat is alsof een chirurg midden in een
      operatie opstaat en weggaat.

      ...ik ben bang.
    effects: { trust_noor: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Lotte went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Arne (was BMXing near the canal) -> arne_interview
      - Find Bram (fisherman, was out late) -> bram_interview
      - Find Koen (baker, starts at 5am, saw something) -> koen_interview
      - Find Mieke (pharmacist, late-night call) -> mieke_interview

  # --- Arne (saw someone at Lotte's studio) ---

  arne_interview:
    type: tweet
    from: arne
    text: >
      heb vanacht nie geslapen. rare sfeer in het dorp. ik zeg niks
      meer online maar als ge mij kent weet ge waar ge mij vindt
    effects: { trust_arne: "+5" }
    choices:
      - Ask Arne about that evening -> arne_talk

  arne_talk:
    type: message
    text: >
      ARNE: amai ok maar ge zegt het aan niemand he. ik was bij het
      kanaal rond 19u, bmx sessie. en ik zag die gast — ge weet wel
      die van de galerij, die rijke klant — bij lottes atelier. hij
      stond door het raam te kijken. toen hij mij zag liep hij weg
      naar zijn auto. donkere bmw.

      tering man ik heb niks gezegd want wie gaat mij geloven. een
      tiener die een rijke gast beschuldigt. kut.
    effects:
      trust_arne: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Bram (saw late-night activity at VlaamsChem) ---

  bram_interview:
    type: tweet
    from: bram
    text: >
      Herinnering: nachtvisserij op het kanaal is toegestaan met
      vergunning. Maar wat ik de laatste nachten zie heeft niks met
      vissen te maken.
    effects: { trust_bram: "+5" }
    choices:
      - Ask Bram what he saw -> bram_talk_night

  bram_talk_night:
    type: message
    text: >
      BRAM: Ik was aan het vissen, rond 23u. Ik zag het licht aangaan
      in Lottes atelier. Ze was nog aan het werk. En dan, rond
      middernacht, kwam er een bestelwagen van VlaamsChem langs het
      kanaal gereden. Twee mannen stapten uit en gingen naar de
      zijingang van de fabriek. Ze droegen iets — bakken, gesloten.

      Om middernacht. Aan het kanaal. En twintig minuten later was
      het water bij de sluis paars. Paars.

      Ik heb foto's gemaakt met mijn telefoon. De kwaliteit is niet
      geweldig maar ge kunt de kleur duidelijk zien.
    effects:
      trust_bram: "+10"
      night_witnesses: "+1"
      corporate_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Koen (baker, saw car chase at dawn) ---

  koen_interview:
