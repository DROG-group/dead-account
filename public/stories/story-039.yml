      Het was Lotte. Altijd Lotte. Hij wilde niet haar kunst. Hij
      wilde haar.

      De laatste opdracht weigerde ze. Het was een levensgrote
      figuur, haar lichaam, in kant. Ze zei nee. Hij werd kwaad.
      Zei dat ze ondankbaar was. Dat hij haar carrière had gemaakt.

      Een week later was ze weg.
