      Lotte leeft. Ze contacteerde mij een keer, van een
      wegwerp-telefoon. Ze zei dat ze zich verstopt. Ze zei "ze
      bedreigden mij bij het atelier en er is nog iemand die mij
      niet met rust laat."

      Ik kan u niet zeggen waar ze is. Maar met genoeg bewijs kan ik
