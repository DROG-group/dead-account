    type: message
    text: >
      Jozef vyťahuje spod baru plastovú vodotesnú krabicu.

      JOZEF: Vravel že prídeš. Ber to.

      Vnútri: USB kľúč a sada vytlačených fotografií. Fotky ukazujú
      potrubie — nie oficiálny výpust, ale druhé, skryté — a sudy v
      potoku. USB kľúč obsahuje dáta z rozborov vody, chemickú analýzu,
      a Markovu podrobnú správu.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Nadporučík Bača ---

  juraj_interview:
    type: message
    text: >
      NADPORUČÍK BAČA: Neoficiálne — a myslím úplne neoficiálne —
      chcel som vyšetrovať OravaDairy. Nadriadený mi povedal nech to
      nechám. Vravel že okres má "kompetenciu." To je kód pre "nechaj
      to tak."

      Situácia s Hrčekom je iná. O tej som nevedel až doteraz. Ak
      máš dôkazy o stalkingu, môžem konať. To je jasne moja
      kompetencia.

      Prines mi niečo solídne a prípad znova otvorím.
    effects:
      trust_juraj: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Marek than anyone in Oravská Lehota. Who is responsible?
    choices:
      - Confront Matúš Hrček (the obsessive blogger) -> confront_matus
        when:
          state: obsession_evidence
          gte: 5
      - Confront Tomáš Sedlák (the factory director) -> confront_tomas
        when:
          state: corporate_evidence
          gte: 3
      - Confront Starosta Vrábel (political protection) -> confront_starosta
      - I need more evidence -> investigation_hub

  # --- ENDING A: Matúš (Best Ending) ---

  confront_matus:
    type: message
    text: >
      You present your evidence to Matúš Hrček:

      "I know @lenka_durcova is your account. I know you installed a
      camera at Marek's salaš. I know you went through his recipes
      and notes. I know you were photographing his property. I have
      witnesses and I have the blog archives."
    choices:
      - Send -> matus_response

  matus_response:
    type: message
    text: >
      Matúš doesn't reply for a long time. Then:

      MATÚŠ: Ty nechápeš. Ja som ho chránil. Robil úžasnú prácu
      a nikto si to nevážil okrem mňa. Chcel som mu pomôcť zviditeľniť
      sa. Všetko čo som robil bolo preto lebo mi na jeho práci záleží.

      That's not care. That's obsession.

      You've already sent the evidence to Nadporučík Bača. And to
      Simona Kolarčíková.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Nadporučík Bača reopens the case. With your evidence — the
      anonymous account, the hidden camera, the blog archives, the
      witness testimonies — Matúš is arrested for stalking and
      harassment. A camera is recovered from Marek's salaš window.
      Matúš's phone contains hundreds of photos of Marek taken without
      his knowledge.

      Simona Kolarčíková, finally in possession of Marek's full
      evidence package, publishes the OravaDairy story in SME. The
      inšpekcia životného prostredia orders an unannounced inspection.
      The factory is shut down pending environmental remediation. Tomáš
      Sedlák faces criminal charges for falsifying discharge reports.
      Starosta Vrábel's contract with OravaDairy through his
      brother-in-law's company is exposed. He resigns.

      And Marek Hrdina, reading the story from a friend's house in
      Martin, calls his sister for the first time in nine days.

      "Idem domov."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: marek
    text: >
      hory neklamú. a ľudia z oravskej lehoty tiež nie. ďakujem že
      ste to nevzdali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Tomáš (Partial Ending) ---

  confront_tomas:
    type: message
    text: >
      You present the pollution evidence to Tomáš Sedlák:

      "I have photographs of the undeclared outfall pipe. I have water
      samples showing BSK levels five times the legal limit. I have
      your original lab reports showing the data was falsified. I have
      the barrel with your serial number."
    choices:
      - Send -> tomas_response

  tomas_response:
    type: message
    text: >
      TOMÁŠ: Táto konverzácia bude postúpená nášmu právnemu oddeleniu.
      Akákoľvek publikácia defamačných materiálov bude mať za následok
      okamžité právne kroky. OravaDairy vždy pôsobila v rámci
      regulačných požiadaviek.

      But it's too late. You've sent the evidence to Simona, to
      Čistá Orava, and to the regional inspectorate.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The pollution story breaks. OravaDairy is ordered to halt
      discharge pending investigation. The factory may close. A hundred
      and twenty jobs hang in the balance. The village is divided.

      But Marek?

      Without the stalking evidence, Matúš is never investigated.
      He continues his blog. He continues to monitor Marek's accounts.
      He creates a new anonymous profile.

      Three months later, Marek reads about OravaDairy online. He
      returns quietly. He changes his salaš locks. He stops working
      alone. He checks his windows every morning.

      The corporation is exposed. But the person who terrorised
      Marek walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: marek
    text: "som doma. voda je čistejšia. zvyšok... uvidíme."
    choices:
      - The End -> game_complete

  # --- ENDING C: Starosta (Wrong Ending) ---

  confront_starosta:
    type: message
    text: >
      You confront Starosta Vrábel with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> starosta_response

  starosta_response:
    type: tweet
    from: roman
    text: >
      Môj klient berie na vedomie vaše obvinenia. Akékoľvek verejné
      šírenie defamačných vyjadrení bude mať za následok okamžité
      právne konanie. — Kancelária Kováč & Partners, Žilina
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The starosta's lawyer buries your accusation. Without a direct
      link between Vrábel and OravaDairy's dumping — and there isn't
      one beyond political protection and a contract through his
      brother-in-law — your evidence is insufficient.

      OravaDairy continues to operate. Matúš continues to watch.
      Marek stays in hiding.

      Six months later, @lenka_durcova creates a new account. It
      follows Marek's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: ORAVSKÁ LEHOTA — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Marek's story explores themes of
      corporate impunity, environmental crime, obsessive behaviour,
      community solidarity, and the courage to speak up.

      If you or someone you know is experiencing stalking,
      harassment, or needs help:
      Linka dôvery: 0800 500 333
      Polícia SR: 158
      Slovenská inšpekcia životného prostredia: 02/58 10 81 11
