    # === Local Business & Community ===
    jozef:
      name: "Jozef Kubica"
      bio: "hostinec U Kubicu | halušky | žinčica | živá muzika v piatok | od 1994"
      avatar: avatars/jozef.jpg
    zuzana:
      name: "Zuzana Ondrejková"
      bio: "farmárka | kozy a ovce | oravská lehota | mlieko z pasienkov"
      avatar: avatars/zuzana.jpg
    peter:
