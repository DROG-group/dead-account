    lenka:
      name: "Lenka Ďurčová"
      bio: "."
      avatar: avatars/anon.jpg
    juraj:
      name: "Nadporučík Juraj Bača"
      bio: "Polícia SR | Obvodné oddelenie Oravská Lehota | tiesňové: 158"
      avatar: avatars/juraj.jpg

    # === Food Blogger (Thread A suspect) ===
    matus:
      name: "Matúš Hrček"
      bio: "food blogger | @zjedzslovensko | 85k followers | tradičné jedlá | DM pre spoluprácu"
      avatar: avatars/matus.jpg

entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN ORAVSKÁ LEHOTA
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to oravskalehota.social — the community Mastodon instance for
      the highland village of Oravská Lehota, Orava region, Slovakia.

      The local feed is agitated today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @marek_hrdina.

      A young bryndza maker. Traditional sheep cheese from his own salaš.
      He documented old Orava recipes, kept highland traditions alive.
      People are worried. He hasn't posted in six days.
    choices:
      - Look at his profile -> marek_profile

  marek_profile:
    type: tweet
    from: marek
    text: "potok za salašom smrdí. tá fabrika z OravaDairy tam púšťa srvátku a hovno vie čo ešte. mám vzorky. mám fotky. toto musí skončiť."
    choices:
      - That's his last real post... -> grey_mountain

  grey_mountain:
    type: message
    text: >
      Three days after that post, his account uploaded a single image:
      a grey mountainside. Foggy, blurred, shot from a strange angle.
      Posted at 2am. No caption.

      His friends say that's not his style. Marek always wrote long
      captions about every batch, every season, every sheep. The police
      say he probably went hiking. Something doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: juraj
    text: >
      Prijali sme oznámenie o nezvestnom obyvateľovi Oravskej Lehoty.
      V súčasnosti nie sú žiadne dôkazy nasvedčujúce trestnému činu.
      Akékoľvek informácie hlásťe na linku 158 alebo na obvodné
      oddelenie.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. His sister @barbora_kucerova is
      desperate. His father @adam_hrdina has gone silent, up in the
      hills searching alone. His girlfriend @kristina_poliakova is
      driving up from Dolný Kubín every day.

      The fisherman @milan_kavuljak says the streams are poisoned.
      And the journalist @simona_kolarcikova is asking questions nobody
      wants to answer.

      Nobody buys the police's line. Nobody thinks Marek just
      "went hiking."
    effects: { trust_barbora: "+5", trust_kristina: "+5" }
    choices:
      - Start following Marek's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Oravská Lehota. Follow Marek's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Jozef (pub owner, knows everyone) -> jozef_intro
      - Talk to Milan (fisherman, knows the streams) -> milan_intro
      - Talk to Dano (teen biker, seems shaken) -> dano_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Marek with the rhythms of a small
      highland village: weather warnings from the mountains, Eva's
      daily bread specials, sheep grazing updates.

      Key names surface: Barbora (sister, teacher), Kristína (girlfriend,
      seems frantic), Adam (father, out searching the hills), and the
      teens — Dano, Filip, Katarína — who loved Marek's bryndza workshops.

      Also prominent: OravaDairy a.s., the industrial dairy factory at
      the edge of the village. Their posts are corporate PR. Marek's
      posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Jozef -> jozef_intro
      - Talk to Milan -> milan_intro
      - Talk to Dano -> dano_intro

  # --- Jozef (social map) ---

  jozef_intro:
    type: tweet
    from: jozef
    text: >
      Hostinec je otvorený ale nálada je na hovno. @marek_hrdina, tvoje
      halušky s bryndzou tu chýbajú. Vráť sa, chlapče.
    effects: { trust_jozef: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jozef -> jozef_talk

  jozef_talk:
    type: message
    text: >
      JOZEF: Ty si nový? Vitaj. Zlý čas na príchod, vole. Všetci sú
      kvôli Marekovi v keli.

      Poviem ti kto je kto. Barbora je Markova sestra — učí na základke.
      Hustá baba, teraz je ale v piči. Kristína je Markova frajerka,
      veterinárka z Kubína. Adam je Markov foter — pastier, celý život
      v horách. Teraz chodí sám hore a hľadá ho.

      A ten food blogger — Matúš Hrček — @zjedzslovensko — ten sa okolo
      Marka motá už mesiace. Marek mi vravel že ho ten kokot sleduje
      na každý jarmok, na každú akciu. Že mu píše denne. Že je to úplný
      psycho.

      A pozor na OravaDairy. Ich posty sú čisté klamstvá, vole.
    effects: { trust_jozef: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Matúš the blogger -> jozef_matus
      - Ask about OravaDairy -> jozef_dairy
      - Thank him and move on -> quest1_hub

  jozef_matus:
    type: message
    text: >
      JOZEF: Matúš? Ten frajer s tým blogom — Zjedz Slovensko. Má
      85 tisíc followerov, robí videá o tradičnom jedle. Marek bol pre
      neho taká zlatá baňa, vole. Mladý syrár, hory, ovce, tradícia —
      to všetko.

      Ale Marek mu nechcel robiť reklamu. Vravel že ten chlap je fake,
      že mu ide len o lajky. Matúš to nezniesol. Začal chodiť na salaš
      bez pozvania. Fotil Markove recepty a dával si ich na blog akoby
      boli jeho.

      Marek mi vravel: "Ten kokot nerozumie slovu nie." Myslel som že
      profesionálne. Teraz si nie som istý.
    effects: { trust_jozef: "+5" }
    choices:
      - Ask about OravaDairy -> jozef_dairy
      - Move on -> quest1_hub

  jozef_dairy:
    type: message
    text: >
      JOZEF: Tá fabrika tu stojí od deväťdesiatych rokov. Robia
      priemyselnú bryndzu, jogurty, hovno vie čo. Dedina to tolerovala
      lebo dali prácu. Ale rybári sa sťažujú roky — potok pod fabrikou
      smrdí, ryby zdochli, voda je biela od srvátky.

      Marek bol prvý kto tam šiel s fľaškami a fotoaparátom. Mal dôkazy,
      vravel. Reálne dôkazy. Dva týždne na to je preč.

      A starosta Vrábel? Ten kokot má v OravaDairy nejakú zmluvu na
      odvoz odpadu. Jasné, úplne legálne. Kurva, jasné.
    effects: { trust_jozef: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Milan (fisherman, water, witness tease) ---

  milan_intro:
    type: tweet
    from: milan
    text: >
      tridsať rokov pri potoku. voda nie je tá istá. @marek_hrdina mal
      pravdu. a teraz je preč. urobte si záver.
    effects: { trust_milan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Milan -> milan_talk

  milan_talk:
    type: message
    text: >
      MILAN: Ryby v potoku pod fabrikou sú mŕtve. Pstruhy, čo tu boli
      generácie — preč. Voda je biela, smrdí po kyslom. To nie je
      normálne, vole.

      Marek odoberal vzorky. Nosil ich do Žiliny na rozbor. Mal čísla,
      mal fotky. Budoval prípad. A potom — kurva — zmizol.

      Myslíš že je to náhoda? Na Orave sa v náhody neverí.
    effects: { trust_milan: "+10" }
    choices:
      - Did you see anything unusual recently? -> milan_night
      - Move on -> quest1_hub

  milan_night:
    type: message
    text: >
      MILAN: Noc predtým ako zmizol — bol som na potoku, chytal som
      v noci, okolo jednej. Videl som svetlá pri salaši. Nie je to
      nezvyčajné, Marek pracoval aj v noci. Ale boli tam dve autá.
      Jedno Markova stará Škoda Felícia. Druhé čierne SUV so značkami
      OravaDairy.

      O jednej v noci. Pri salaši.

      Vtedy som nad tým nerozmýšľal. Teraz nad tým rozmýšľam furt.
    effects: { trust_milan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Dano (teen biker, witness tease) ---

  dano_intro:
    type: tweet
    from: dano
    text: >
      vole @marek_hrdina to je ten najlepší človek v dedine. naučil ma
      robiť oštiepky fakt hustý. nie je možné že len tak odišiel. ak
      niekto niečo vie tak napíšte kurva
    effects: { trust_dano: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Dano -> dano_talk_early

  dano_talk_early:
    type: message
    text: >
      DANO: čo vole ty si nový? hustý timing. fakt. marek je proste
      najlepší chlap v tejto dedine. učil nás robiť bryndzu po starom,
      brával nás na salaš, ukazoval nám hory.

      a teraz som v piči lebo filip videl niečo divné tú noc pri potoku
      ale nechce o tom hovoriť. vravel že to nič ale vole... to nič
      nebolo jasné
    effects: { trust_dano: "+10" }
    choices:
      - What did Filip see? -> dano_filip_hint
      - Move on -> quest1_hub

  dano_filip_hint:
    type: message
    text: >
      DANO: neviem presne. bol na nočnej jazde na bajku nad dedinou a
      videl niekoho pri markovom salaši. vravel že ten chlap fotil
      salaš? alebo niečo také. a keď ho zbadal tak zdrhol.

      filip sa bojí, vole. nechce hovoriť. skús mu najprv napísať
      o bikoch alebo o snehu, potom možno povolí haha
    effects: { trust_dano: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Oravská Lehota. A highland village
      built around sheep, streams, and mountains. A young bryndza maker
      who was exposing pollution. A disappearance nobody believes is
      voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Barbora (Marek's sister) -> barbora_q1
      - Talk to Kristína (Marek's girlfriend) -> kristina_q1
      - Check what Adam (Marek's father) is saying -> adam_q1
      - I'm ready to investigate the night he disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Barbora Q1 ---

  barbora_q1:
    type: tweet
    from: barbora
    text: >
      ak má niekto správy o @marek_hrdina volajte mi prosím. jeho salaš
      je zatvorený. ovce sú bez pastiera. nikdy by neodišiel bez toho
      aby sa o ne postaral.
    effects: { trust_barbora: "+5", contacts_followed: "+1" }
    choices:
      - DM Barbora -> barbora_q1_talk

  barbora_q1_talk:
    type: message
    text: >
      BARBORA: Ďakujem že píšeš ale nepoznám ťa. Marek má veľa
      kamarátov tu. Určite sa vráti.

      ...Stále si to opakujem. Už tomu neverím.

      [Barbora is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_barbora: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Kristína Q1 ---

  kristina_q1:
    type: tweet
    from: kristina
    text: >
      Marek mi volal v noci. Povedal že sa niečo deje. Povedal "ak sa
      mi niečo stane, pozri sa na fabriku." Potom zložil. Nikdy predtým
      takto nehovoril. @marek_hrdina prosím ozvi sa.
    effects: { trust_kristina: "+5", contacts_followed: "+1" }
    choices:
      - DM Kristína -> kristina_q1_talk

  kristina_q1_talk:
    type: message
    text: >
      KRISTÍNA: Kto si? Ďalší čo mi povie nech sa upokojím? Môj priateľ
      mi volal v noci, povedal "pozri sa na OravaDairy" a potom zmizol.

      Posledné čo som od neho počula.

      A ten food blogger — Matúš — ten mu posielal správy každý deň.
      Marek mu blokol číslo a on si kúpil nové. To je normálne?
    effects: { trust_kristina: "+10" }
    choices:
      - What do you think happened? -> kristina_theory
      - Move on -> quest1_hub

  kristina_theory:
    type: message
    text: >
      KRISTÍNA: Myslím že OravaDairy ho umlčala. Mal dôkazy že vypúšťajú
      odpad do potoka. Ale tiež myslím že ten blogger vie viac než
      hovorí. Matúš sa objavil na salaši neohlásený minimálne päťkrát.
      Fotil Markove veci. Marek mi vravel: "Ten chlap ma sleduje."

      Pred mesiacom Marek zistil že mu niekto prehrabáva záznamy v
      salaši. Myslel že to nič nie je. Ja si myslím že to niečo bolo.
    effects: { trust_kristina: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Adam Q1 ---

  adam_q1:
    type: tweet
    from: adam
    text: >
      hľadám syna. šesť dní. hory, doliny, salaše. nič. kto vie
      niečo nech sa ozve. otec hľadá syna.
    effects: { trust_adam: "+5", contacts_followed: "+1" }
    choices:
      - DM Adam -> adam_q1_talk

  adam_q1_talk:
    type: message
    text: >
      ADAM: Marek je môj syn. Naučil som ho robiť bryndzu, naučil som
      ho starať sa o ovce. Nikdy by neodišiel bez slova. Nikdy by
      nenechal ovce samé. To by neurobil.

      Niekto mu ublížil. A ja ho nájdem.
    effects: { trust_adam: "+10" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Marek went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Filip (was night-biking above the village) -> filip_interview
      - Find Peter (forester, patrols at night) -> peter_interview
      - Find Zuzana (goat farmer, early morning at the pasture) -> zuzana_interview
      - Find Eva (baker, starts at 4am, saw something) -> eva_interview

  # --- Filip (saw someone at the salaš) ---

  filip_interview:
    type: tweet
    from: filip
    text: >
      nočná jazda na bajku bola divná vole. hore nad dedinou je teraz
      taká hustá atmosféra. neviem čo sa deje ale niečo je zle
    effects: { trust_filip: "+5" }
    choices:
      - Ask Filip about that evening -> filip_talk

  filip_talk:
    type: message
    text: >
      FILIP: vole ok ale nikomu to nehovor jasné. bol som hore nad
      dedinou na bajku, taký nočný ride, okolo ôsmej večer. a videl
      som pri markovom salaši chlapa. mal foťák a fotil okná, dvere,
      zámky. keď ma zbadal tak zdrhol do auta.

      a vole to bol ten food blogger. matúš. poznám jeho auto — taký
      biely fiat s nálepkou zjedzslovensko. do piče.

      nepovedal som to lebo kto mi uverí? nejaký 17ročný na bajku
      v noci. jasné.
    effects:
      trust_filip: "+10"
      night_witnesses: "+1"
      obsession_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

