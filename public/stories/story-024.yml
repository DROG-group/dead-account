entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN BREZOVÁ POD TATRAMI
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to brezova.social — the community Mastodon instance for
      the mountain village of Brezová pod Tatrami, Slovakia.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @katarina_kovacova.

      A folk dancer. Performer. She documented village traditions and
      fought to protect the mountain forests. People are worried.
      She hasn't posted in six days.
    choices:
      - Look at her profile -> katarina_profile

  katarina_profile:
    type: tweet
    from: katarina
    text: "Bágre nad Kriváňom rúbu stromy. Chránený les. Mám fotky, mám dôkazy. Toto neprejde."
    choices:
      - That's her last real post... -> silent_forest

  silent_forest:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photo of a dark treeline at night. Posted at 2am.
      No caption. No hashtags.

      Her friends say that's not her style. Katarína always wrote long
      captions about the land, the trees, the traditions. The police
      say she probably went hiking alone and lost signal. Something
      doesn't add up.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: major
    text: >
      Prijali sme hlásenie o nezvestnej osobe z obce Brezová pod
      Tatrami. V súčasnosti nič nenasvedčuje trestnému činu.
      Akékoľvek informácie prosím hláste na číslo 158 alebo na
      obvodné oddelenie.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @zuzana_hruskova is
      desperate. Her brother @marek_novak is driving down from Žilina.
      The folk ensemble leader @simona_bakova says Katarína would never
      miss rehearsal. The mountain guide @jozef_poliak says the forest
      is being destroyed and Katarína was the only one documenting it.

      And the journalist @lucia_vlckova is strangely silent.

      Nobody buys the police line. Nobody thinks Katarína just
      "went hiking."
    effects: { trust_zuzana: "+5", trust_marek: "+5" }
    choices:
      - Start following Katarína's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Brezová pod Tatrami. Follow Katarína's contacts and
      read their posts. The more you engage with the community, the
      more they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Elena (koliba owner, knows everyone) -> elena_intro
      - Talk to Jozef (mountain guide, knows the forest) -> jozef_intro
      - Talk to Peter (teen snowboarder, seems shaken) -> peter_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Katarína with the rhythms of a small
      mountain village: weather warnings, the bakery's fresh bread,
      weekend hikes, folk ensemble rehearsal schedules.

      Key names surface: Zuzana (best friend, kindergarten teacher),
      Simona (ensemble leader, seems rattled), Lucia (journalist,
      oddly quiet), and the teens — Peter, Milan, Filip — who filmed
      Katarína's performances for social media.

      Also prominent: TatraResort Development a.s., the ski resort
      company building on the mountain above the village. Their posts
      are corporate PR. Katarína's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Elena -> elena_intro
      - Talk to Jozef -> jozef_intro
      - Talk to Peter -> peter_intro

  # --- Elena (social map) ---

  elena_intro:
    type: tweet
    from: elena
    text: >
      Koliba je otvorená ale srdce plače. @katarina_kovacova, tvoj
      stôl čaká. Vráť sa nám, dievča.
    effects: { trust_elena: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Elena -> elena_talk

  elena_talk:
    type: message
    text: >
      ELENA: Nový si tu? Vitaj. Hrozný čas na príchod. Celá dedina
      je hore nohami kvôli Katke.

      Poviem ti kto je kto. Zuzana je Katkina najlepšia kamoška —
      bývajú spolu v byte nad lekárňou. Zlaté dievča, zničená teraz.
      Jakub Sedláček — ten chlapec z Popradu — bol Katkin priateľ.
      Rozišli sa pred tromi mesiacmi ale on to nezvládol. Stále sa
      tu krútil. Simona vedie folklórny súbor, Katka bola ich hviezda.

      A Lucia Vlčková — novinárka — ona a Katka robili na niečom
      spolu. Niečo o tých stromoch hore. Lucia nepovedala ani slovo
      odkedy Katka zmizla. To nie je normálne.

      A pozor na TatraResort. Klamstvá zabalené do certifikátov.
    effects: { trust_elena: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Jakub -> elena_jakub
      - Ask about TatraResort -> elena_tatraresort
      - Thank her and move on -> quest1_hub

  elena_jakub:
    type: message
    text: >
      ELENA: Jakub? Pekný chlapec, z Popradu. Chodili spolu asi rok.
      Ale potom sa začal správať... divne. Žiarlil na každého kto sa
      s Katkou rozprával. Prišiel sem do koliby a robil scény keď
      videl že tancuje s niekým na skúške.

      Katka to ukončila. Jasne mu povedala že je koniec. On povedal
      že chápe. Ale nič sa nezmenilo. Stále bol všade. Stále sa
      pýtal ľudí kde je.

      Raz mi Katka povedala: "Teta Elena, on nepočúva keď hovorím
      nie." Myslela som že to berie príliš vážne. Teraz si nie som
      istá.
    effects: { trust_elena: "+5" }
    choices:
      - Ask about TatraResort -> elena_tatraresort
      - Move on -> quest1_hub

  elena_tatraresort:
    type: message
    text: >
      ELENA: Tá firma je tu od roku 2022. Kúpili pozemky hore na
      svahu a chcú stavať obrovské lyžiarske stredisko. Wellness,
      hotely, parkoviská. Problém je že polovica tých pozemkov je
      chránený les. NATURA 2000, chápete?

      Katka bola prvá kto išla hore s foťákom a dokumentovala čo
      tam robia. Výrub stromov v chránenej zóne. Bagre v potoku.
      Mala dôkazy. Skutočné dôkazy.

      Dva týždne na to zmizla.
    effects: { trust_elena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jozef (the forest, witness tease) ---

  jozef_intro:
    type: tweet
    from: jozef
    text: >
      tridsaťpäť rokov chodím po týchto horách. les hore nad
      sedlom nie je ten istý. @katarina_kovacova mala pravdu.
      a teraz je preč. spojte si to.
    effects: { trust_jozef: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jozef -> jozef_talk

  jozef_talk:
    type: message
    text: >
      JOZEF: Celý život chodím po Tatrách. Poznám každý strom,
      každý potok, každý chodník. A hovorím vám — les nad sedlom
      je zničený. Vyrúbali sto metrov chráneného porastu. Potok
      je zanesený hlinou z bagrov.

      Katka fotila všetko. Chodila hore s GPS a zaznamenávala
      každý vyrúbaný strom. Mala súradnice, fotky, dátumy. Stavala
      prípad. A potom — preč.

      Myslíte že je to náhoda? V horách sa náhody nestávajú.
    effects: { trust_jozef: "+10" }
    choices:
      - Did you see anything unusual recently? -> jozef_night
      - Move on -> quest1_hub

  jozef_night:
    type: message
    text: >
      JOZEF: Tú noc pred tým čo zmizla — vracal som sa z chaty,
      bolo okolo jednej v noci. Videl som svetlá pri kultúrnom dome.
      Nie je to nezvyčajné, niekedy tam cvičia. Ale boli tam dve
      autá. Jedno bolo Katkino červené Suzuki. Druhé bol čierny
      SUV s bratislavskými značkami. TatraResort ho používa.

      O jednej v noci. Pri kultúrnom dome. To nie je normálne.

      Zapísal som si to. Nikto sa ma na to nepýtal.
    effects: { trust_jozef: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Peter (teen snowboarder, witness tease) ---

  peter_intro:
    type: tweet
    from: peter
    text: >
      kurva vole @katarina_kovacova to nie je možné že len tak
      odišla. ona ma naučila milovať tieto hory. ak niekto niečo
      vie prosím napíšte
    effects: { trust_peter: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Peter -> peter_talk_early

  peter_talk_early:
    type: message
    text: >
      PETER: vole si tu nový? hustý timing fakt. Katka je proste
      najlepšia osoba v celej dedine. učila nás tancovať, brala
      nás do hôr, vysvetľovala nám prečo sú stromy dôležité. fakt
      hustá ženská.

      a teraz som v piči lebo Milan videl niečo divné pri parkovisku
      ale nechce o tom hovoriť. tvrdí že to bolo hovno ale... fakt
      to nebolo hovno vole
    effects: { trust_peter: "+10" }
    choices:
      - What did Milan see? -> peter_milan_hint
      - Move on -> quest1_hub

  peter_milan_hint:
    type: message
    text: >
      PETER: kurva presne neviem. bol na parkovisku pri kultúrnom
      dome, natáčal nejakú piču na tiktok, a videl nejakého typka
      pri Katkinom aute. niečo tam robil. Milan sa fakt boji o tom
      hovoriť.

      musíš s ním najprv pogadať o nejakej hovadine, o folklóre
      alebo o rape, potom sa možno otvorí. on nehovorí s ľuďmi
      čo nepozná vole
    effects: { trust_peter: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Brezová pod Tatrami. A Slovak
      mountain village built around folk traditions and the forest.
      A young dancer who was exposing illegal logging. A disappearance
      nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Zuzana (Katarína's best friend) -> zuzana_q1
      - Talk to Simona (folk ensemble leader) -> simona_q1
      - Check what Marek (Katarína's brother) is saying -> marek_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Zuzana Q1 ---

  zuzana_q1:
    type: tweet
    from: zuzana
    text: >
      prosím ak máte akékoľvek správy o @katarina_kovacova zavolajte
      mi. jej izba je nedotknutá. jej kroj visí v skrini. nikdy by
      neodišla bez neho.
    effects: { trust_zuzana: "+5", contacts_followed: "+1" }
    choices:
      - DM Zuzana -> zuzana_q1_talk

  zuzana_q1_talk:
    type: message
    text: >
      ZUZANA: Ďakujem za záujem ale nepoznám ťa. Katka má veľa
      priateľov tu. Určite sa vráti.

      ...stále to hovorím. Už tomu neverím.

      [Zuzana is guarded. You'll need to build more trust before
      she opens up.]
    effects: { trust_zuzana: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Simona Q1 ---

  simona_q1:
    type: tweet
    from: simona
    text: >
      Skúška súboru Javor dnes bez @katarina_kovacova. Jej miesto
      je prázdne. Dvadsať rokov vediem tento súbor. Nikto nikdy
      nechýbal bez slova. Niečo sa stalo.
    effects: { trust_simona: "+5", contacts_followed: "+1" }
    choices:
      - DM Simona -> simona_q1_talk

  simona_q1_talk:
    type: message
    text: >
      SIMONA: Katarína je duša tohto súboru. Devätnásť rokov a
      tancuje ako keby mala oheň v srdci. Toto vyšetrovanie o
      lese — bola v tom celá. Mala fotky, GPS záznamy, všetko.

      Ten jej ex — Jakub — ten ma znepokojuje. Po rozchode sa
      začal správať čudne. Prišiel na vystúpenie a sedel v
      poslednom rade. Len sa díval. Celé dve hodiny.

      [Simona seems genuinely worried.]
    effects: { trust_simona: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Marek Q1 ---

  marek_q1:
    type: tweet
    from: marek
    text: >
      moja sestra ZMIZLA a polícia mi hovorí že asi išla na
      turistiku??? ONA NECHODÍ NA TURISTIKU BEZ OZNÁMENIA.
      idem z žiliny. niekto mi to vysvetlí do piče.
    effects: { trust_marek: "+5", contacts_followed: "+1" }
    choices:
      - DM Marek -> marek_q1_talk

  marek_q1_talk:
    type: message
    text: >
      MAREK: Kto si? Ďalší čo mi povie aby som sa upokojil? Sestra
      mi volala v tú noc pred tým čo zmizla. Povedala že má niečo
      veľké. Povedala "keby sa niečo stalo, pozri sa na TatraResort."
      Potom zložila.

      To je posledné čo som od nej počul.
    effects: { trust_marek: "+10" }
    choices:
      - What do you think happened? -> marek_theory
      - Move on -> quest1_hub

  marek_theory:
    type: message
    text: >
      MAREK: Myslím si že našla dôkaz že TatraResort rúbe chránený
      les a oni ju umlčali. Ale tiež si myslím že ten jej kreténsky
      ex — Jakub — vie viac než hovorí. Spôsob akým o nej hovorí...
      to nie je normálna starosť. To je niečo iné.

      Katka mi pred mesiacmi povedala že niekto jej prehľadáva veci
      v šatni pri kultúrnom dome. Myslela si že to je blbosť. Ja si
      nemyslím že to bola blbosť.
    effects: { trust_marek: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Katarína went silent. Multiple
      people saw or heard things. Piece together the timeline from
      witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Milan (was filming near the cultural house) -> milan_interview
      - Find Jozef (mountain guide, saw lights at night) -> jozef_interview
      - Find Darina (baker, early morning) -> darina_interview
      - Find Roman (mountain hut warden, heard engines) -> roman_interview

  # --- Milan (saw someone at Katarína's car) ---

  milan_interview:
    type: tweet
    from: milan
    text: >
      vole dnes som mal natáčať nový klip ale nálada je v piči.
      divné veci sa dejú v tejto dedine fakt
    effects: { trust_milan: "+5" }
    choices:
      - Ask Milan about that evening -> milan_talk

  milan_talk:
    type: message
    text: >
      MILAN: vole ok ale nikomu to nehovor kurva. bol som pri
      kultúrnom dome okolo siedmej, natáčal som nejaké hovadiny
      na tiktok. a videl som toho typka — jakuba — pri Katkinom
      aute. niečo tam pichal alebo dával pod auto. keď ma zbadal
      tak zdrhol jak do piče.

      vole ja som nič nepovedal lebo som nechcel mať problémy
      ale toto je fakt hustý. to nie je normálne správanie kokot
    effects:
      trust_milan: "+10"
