      ukazujú vyrúbanú chránenú zónu — pne, bahno, stopy po
      ťažkej technike — a dokumenty o stavebných povoleniach
      vydaných spätne. USB disk obsahuje GPS súradnice, chemické
      analýzy vody z potoka, a podrobný Katkin report.
    effects:
      corporate_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Major Húska ---

  major_interview:
    type: message
    text: >
      MAJOR HÚSKA: Mimo záznamu — a myslím tým úplne mimo záznamu
      — chcel som vyšetriť TatraResort. Môj nadriadený mi povedal
      nech to nechám. Povedal že "krajský úrad má kompetenciu."
      To je kód pre "nechaj to na pokoji."

      Situácia so Sedláčkom je iná. O tej som nevedel. Ak máš
      dôkazy o stalkingu, môžem konať. To je jednoznačne moja
      kompetencia.

      Prines mi niečo konkrétne a prípad znova otvorím.
    effects:
      trust_major: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Katarína than anyone in Brezová. Who is responsible?
    choices:
      - Confront Jakub Sedláček (the obsessive ex) -> confront_jakub
        when:
          state: obsession_evidence
          gte: 5
      - Confront Andrej Beneš (the resort director) -> confront_andrej
        when:
          state: corporate_evidence
          gte: 3
      - Confront Mayor Kučera (political protection) -> confront_stefan
      - I need more evidence -> investigation_hub

  # --- ENDING A: Jakub (Best Ending) ---

  confront_jakub:
    type: message
    text: >
      You present your evidence to Jakub:

      "I know @nadezda_ticha is your account. I know you put a GPS
      tracker on Katarína's car. I know you went through her things
      in the dressing room. I know you watched her flat. I have
      witnesses and I have your posting history."
    choices:
      - Send -> jakub_response

  jakub_response:
    type: message
    text: >
      Jakub doesn't reply for a long time. Then:

      JAKUB: Ty nechápeš. Chránil som ju. Bola v nebezpečenstve
      kvôli tomu resortu a nechcela si dať pomôcť. Musel som
      vedieť že je v bezpečí. Všetko čo som robil bolo preto
      lebo mi na nej záleží.

      That's not care. That's obsession.

      You've already sent the evidence to Major Húska. And to
      Lucia Vlčková.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Major Húska reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the witnesses, the
      pattern of stalking — Jakub is arrested for stalking and
      harassment. A GPS tracker is recovered from under Katarína's
      car at the old mountain huts above the saddle.

      Lucia Vlčková, finally in possession of Katarína's full
      evidence package, publishes the TatraResort story in Denník N.
      The ministry orders an unannounced inspection. Construction
      is halted pending environmental investigation. Andrej Beneš
      faces criminal charges for falsifying building permits and
      destroying protected forest.

      And Katarína Kováčová, reading the story from a friend's
      house in Košice, calls her brother for the first time in
      nine days.

      "Idem domov."
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: katarina
    text: >
      les neklamne. a ľudia z brezovej tiež nie. ďakujem že ste
      to nevzdali.
    choices:
      - The End -> game_complete

  # --- ENDING B: Andrej (Partial Ending) ---

  confront_andrej:
    type: message
    text: >
      You present the environmental evidence to Andrej Beneš:

      "I have photographs of illegal logging in NATURA 2000 protected
      forest. I have GPS coordinates of every felled tree. I have
      building permits issued retroactively. I have original survey
      data showing your submissions were falsified."
    choices:
      - Send -> andrej_response

  andrej_response:
    type: message
    text: >
      ANDREJ: Tento rozhovor bude postúpený nášmu právnemu
      oddeleniu. Akékoľvek zverejnenie ohovárania bude mať
      okamžité právne následky. TatraResort Development vždy
      koná v súlade s platnými predpismi.

      But it's too late. You've sent the evidence to Lucia, to
      the Strážcovia Lesa, and to the ministry.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The logging story breaks. TatraResort is ordered to halt
      construction pending investigation. The resort project may
      be cancelled. Eighty jobs hang in the balance. The village
      is divided.

      But Katarína?

      Without the stalking evidence, Jakub is never investigated.
      He continues to monitor her social media. He continues to
      drive past her flat. He creates a new anonymous profile.

      Three months later, Katarína reads about TatraResort online.
      She returns quietly. She changes her rehearsal schedule. She
      stops hiking alone. She checks her car every morning.

      The corporation is exposed. But the person who terrorised
      Katarína walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: katarina
    text: "som doma. les je bezpečnejší. zvyšok... uvidíme."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_stefan:
    type: message
    text: >
      You confront Mayor Kučera with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> stefan_response

  stefan_response:
    type: tweet
    from: barbora
    text: >
      Môj klient berie na vedomie vaše obvinenia. Akékoľvek
      verejné šírenie ohovárania bude mať za následok okamžité
      právne kroky. — Kancelária Richter & Partners, Bratislava
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Kučera and TatraResort's illegal logging — and
      there isn't one beyond political protection — your evidence
      is insufficient.

      TatraResort continues to build. Jakub continues to watch.
      Katarína stays in hiding.

      Six months later, @nadezda_ticha creates a new account. It
      follows Katarína's brother.
    choices:
      - The End -> game_complete

  # =====================================================================
  # GAME COMPLETE
  # =====================================================================

  game_complete:
    type: message
    text: >
      DEAD ACCOUNT: BREZOVÁ POD TATRAMI — GAME COMPLETE

      Evidence collected: ${evidence_total}
      Corporate evidence: ${corporate_evidence}
      Obsession evidence: ${obsession_evidence}

      Thank you for playing. Katarína's story explores themes of
      environmental destruction, corporate corruption, obsessive
      behaviour, community solidarity, and the courage to speak up.

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Linka dôvery: 0800 500 333
      Národná linka pre ženy zažívajúce násilie: 0800 212 212
      Polícia SR: 158
