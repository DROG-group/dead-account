entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN WEILERSBACH
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Weilersbach.social — the community Mastodon instance for
      the village of Weilersbach, deep in the Black Forest.

      The local feed is heavy today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you see the same name over and over:
      @jonas_mueller.

      A craft woodworker. Traditional Schwarzwald joinery. He documented
      the forest, the old techniques, the trees. People are devastated.
      He was found dead in his workshop three days ago.
    choices:
      - Look at his profile -> jonas_profile

  jonas_profile:
    type: tweet
    from: jonas
    text: "Im Bannwald oben wird gefällt. Nachts. Ohne Genehmigung. Ich hab Fotos. Das geht nicht so weiter."
    choices:
      - That's his last real post... -> workshop_scene

  workshop_scene:
    type: message
    text: >
      Two days after that post, Jonas was found on the floor of his
      workshop. Head trauma. The police say he fell from a scaffolding
      while staining a ceiling beam. An accident, they say.

      His friends say Jonas never worked on scaffolding alone. His sister
      says tools are missing from the workshop. His apprentice hasn't
      spoken a word since it happened.

      Something doesn't add up.
    choices:
      - Read the police statement -> polizei_statement
      - Look at what people are saying -> community_reaction

  polizei_statement:
    type: tweet
    from: hauptkomm
    text: >
      Am Dienstag wurde ein 32-jähriger Mann leblos in seiner Werkstatt
      in Weilersbach aufgefunden. Nach ersten Erkenntnissen handelt es
      sich um einen Arbeitsunfall. Die Ermittlungen dauern an.
      Hinweise bitte an die Polizei unter 110.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are raw. His sister @lena_mueller is furious. His
      girlfriend @annika_weiss drove in from Freiburg, destroyed. His
      apprentice @felix_brenner has gone silent — no posts since
      the body was found.

      The retired forester @gerhard_ott says Jonas was right about the
      illegal logging. The sawmill owner @ralf_zimmermann looks nervous.
      And the journalist @nico_falk is asking questions nobody wants
      to answer.

      Nobody in Weilersbach believes this was an accident.
    effects: { trust_lena: "+5", trust_annika: "+5" }
    choices:
      - Start following Jonas's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Weilersbach. Follow Jonas's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Hilde (Gasthaus owner, knows everyone) -> hilde_intro
      - Talk to Gerhard (retired forester, saw the logging) -> gerhard_intro
      - Talk to Tim (teen mountain biker, seems upset) -> tim_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes grief for Jonas with the rhythms of a Black Forest
      village: hiking routes, bakery specials, weather warnings for
      the mountain passes.

      Key names surface: Lena (sister, schoolteacher), Felix (apprentice,
      eerily silent), Annika (girlfriend, devastated), and the teens —
      Tim, Sophie, Lisa — who loved Jonas's woodworking workshops for
      kids.

      Also prominent: Schwarzwald-Holz GmbH, the logging company at
      the edge of the forest. Their posts are corporate greenwash.
      Jonas's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Hilde -> hilde_intro
      - Talk to Gerhard -> gerhard_intro
      - Talk to Tim -> tim_intro

  # --- Hilde (social map) ---

  hilde_intro:
    type: tweet
    from: hilde
    text: >
      Das Gasthaus ist offen aber die Stimmung ist am Boden.
      @jonas_mueller, dein Stammplatz bleibt frei. Für immer.
    effects: { trust_hilde: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Hilde -> hilde_talk

  hilde_talk:
    type: message
    text: >
      HILDE: Ah, you're new here? Bad timing, Schätzle. The whole
      village is in mourning.

      Let me tell you who's who. Lena is Jonas's younger sister —
      teaches at the primary school, tough woman, completely wrecked
      right now. Annika is his girlfriend from Freiburg — they've been
      together two years, she's driving back and forth.

      Felix Brenner is — was — Jonas's apprentice. Three years now.
      That boy worshipped Jonas. I mean truly worshipped him. Since
      Jonas died, Felix hasn't come to the Gasthaus, hasn't answered
      anyone. It's like he shut down.

      And then there's the forest thing. Jonas was documenting illegal
      logging up in the Bannwald. Protected forest. Someone was cutting
      old-growth trees at night. Schwarzwald-Holz denies everything,
      but Gerhard Ott — the old forester — he backed Jonas up.
    effects: { trust_hilde: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Felix -> hilde_felix
      - Ask about Schwarzwald-Holz -> hilde_logging
      - Thank her and move on -> quest1_hub

  hilde_felix:
    type: message
    text: >
      HILDE: Felix? Ach, the boy is... intense. Jonas took him on when
      nobody else would. Felix had a rough time in school — angry kid,
      no friends, trouble at home. Jonas gave him a purpose. Taught him
      to carve, to join, to respect the wood.

      But it became everything to Felix. His whole identity. He wanted
      to be Jonas. He'd copy his clothes, his speech, even his
      handwriting. Jonas told me once: "The boy needs his own life,
      not mine."

      After Jonas started the logging investigation, Felix got
      possessive. Didn't want Jonas working with the journalist or
      the forester. Wanted Jonas all to himself in the workshop.
      Like sharing Jonas was a betrayal.
    effects: { trust_hilde: "+5" }
    choices:
      - Ask about Schwarzwald-Holz -> hilde_logging
      - Move on -> quest1_hub

  hilde_logging:
    type: message
    text: >
      HILDE: That company has been here twenty years. They have the
      logging contract for the municipal forest — legal, approved, all
      proper. But the Bannwald above the village? That's protected.
      Nobody is allowed to fell there.

      Jonas went hiking up there and found fresh stumps. Old oaks, two
      hundred years old, cut clean. No markings, no permits. He
      photographed everything. He said the stumps matched
      Schwarzwald-Holz cutting patterns.

      Dieter Krause — the company boss — laughed it off. "Conspiracy
      theories from a carpenter," he said. Two weeks later Jonas is
      dead on his workshop floor.

      Scheiße, I shouldn't have said that. Forget I said that.
    effects: { trust_hilde: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Gerhard (the forest, witness tease) ---

  gerhard_intro:
    type: tweet
    from: gerhard
    text: >
      38 jahre förster. ich kenne jeden baum im bannwald. und ich sage
      euch: da oben wird illegal geholzt. @jonas_mueller hatte recht.
      jetzt ist er tot. denkt drüber nach.
    effects: { trust_gerhard: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Gerhard -> gerhard_talk

  gerhard_talk:
    type: message
    text: >
      GERHARD: I walked every metre of that forest for nearly four
      decades. I know when a tree has been felled legally and when
      it hasn't. Up in the Bannwald there are stumps — fresh, clean
      cuts — where two-hundred-year-old oaks stood. No forestry
      markings. No permit numbers. Just stumps.

      Jonas and I went up together. He photographed them all, measured
      the rings, documented the species. He built a case. He said it
      was Schwarzwald-Holz — the cutting angle, the equipment marks,
      the truck tracks.

      They're selling protected old-growth timber. That wood is worth
      a fortune — veneer quality, musical instruments, specialty
      furniture. Tens of thousands per tree.

      Jonas threatened to go public. And now Jonas is dead.
    effects: { trust_gerhard: "+10" }
    choices:
      - Did you see anything unusual recently? -> gerhard_night
      - Move on -> quest1_hub

  gerhard_night:
    type: message
    text: >
      GERHARD: The night before they found him — I couldn't sleep,
      I went for a walk. Around midnight. I saw a truck on the
      forest road above the village. No lights. A Schwarzwald-Holz
      truck — I'd recognise that silhouette anywhere.

      It came down from the Bannwald direction, turned onto the
      logging road, and disappeared toward the sawmill. At midnight.
      With no lights.

      I noted the time. Old habit. A forester never stops being a
      forester.
    effects: { trust_gerhard: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Tim (teen mountain biker, witness tease) ---

  tim_intro:
    type: tweet
    from: tim
    text: >
      alter ich raff das nicht. @jonas_mueller hat mir holzschnitzen
      beigebracht. der war so ein ehrenmann digga. ein UNFALL?? ja ne
      is klar. wenn jemand was weiß bitte meldet euch
    effects: { trust_tim: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Tim -> tim_talk_early

  tim_talk_early:
    type: message
    text: >
      TIM: ey du bist neu hier oder? krasses timing alter. jonas war
      halt echt der beste mensch im ganzen dorf. hat workshops für uns
      gemacht, holzschnitzen, möbel bauen, alles. hat nie geld genommen
      dafür.

      und jetzt sagen die es war ein unfall. alter was zum fick. jonas
      ist nie allein aufs gerüst. das war seine regel nummer eins. das
      weiß jeder hier.

      und sophie hat was gesehen die nacht davor aber sie traut sich
      nicht das zu erzählen. irgendwas mit felix und der werkstatt.
      frag sie mal aber sei vorsichtig die ist mega schüchtern digga
    effects: { trust_tim: "+10" }
    choices:
      - What did Sophie see? -> tim_sophie_hint
      - Move on -> quest1_hub

  tim_sophie_hint:
    type: message
    text: >
      TIM: keine ahnung genau. sie war abends unterwegs mit der kamera
      — die knipst immer nachts am waldrand — und hat gesehen wie
      felix aus der werkstatt gerannt ist. so gegen 23 uhr oder so.
      sie sagt der sah aus als hätte er geheult. oder als wäre er
      mega wütend. beides vielleicht.

      sie will halt nicht petzen oder so. aber alter das ist nicht
      petzen wenn jemand tot ist. scheiße ey.
    effects: { trust_tim: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Weilersbach. A Black Forest village
      built around the forest. A woodworker who was exposing illegal
      logging. A death nobody believes was an accident.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Lena (Jonas's sister) -> lena_q1
      - Talk to Felix (Jonas's apprentice) -> felix_q1
      - Check what Annika (Jonas's girlfriend) is saying -> annika_q1
      - I'm ready to investigate the night he died -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lena Q1 ---

  lena_q1:
    type: tweet
    from: lena
    text: >
      mein bruder hatte KEIN gerüst aufgebaut. seine stempeluhr zeigt
      feierabend um 18 uhr. warum war er nachts in der werkstatt?
      @polizei_weilersbach macht euren JOB.
    effects: { trust_lena: "+5", contacts_followed: "+1" }
    choices:
      - DM Lena -> lena_q1_talk

  lena_q1_talk:
    type: message
    text: >
      LENA: I don't know you. But I'm desperate enough to talk to
      anyone who's actually listening.

      Jonas clocked out at 6pm that day. His routine was dinner at the
      Gasthaus, then home. He never worked at night. Never. So why
      was he in the workshop at — what, midnight? 1am? The police
      won't tell me the exact time of death.

      And his carving chisels are missing. His best set — the Japanese
      ones he imported himself. Gone. Nothing else was taken. Just
      the chisels.
    effects: { trust_lena: "+10" }
    choices:
      - Who would take the chisels? -> lena_chisels
      - Move on -> quest1_hub

  lena_chisels:
    type: message
    text: >
      LENA: Only someone who knows their value. Those chisels cost
      two thousand euros. Jonas kept them in a locked drawer. You'd
      have to know which drawer and where he kept the key.

      Felix knew. Felix used them every day. But that's — no. Felix
      loved Jonas. He wouldn't —

      I don't know what to think anymore.
    effects: { trust_lena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Felix Q1 ---

  felix_q1:
    type: tweet
    from: felix
    text: >
      ...
    effects: { trust_felix: "+5", contacts_followed: "+1" }
    choices:
      - DM Felix -> felix_q1_talk

  felix_q1_talk:
    type: message
    text: >
      FELIX: I don't want to talk. Jonas is dead. That's all there is.

      [Felix has completely shut down. His profile is empty — he's
      deleted every post since Jonas died. He's online but silent.
      You'll need to build more trust before he opens up.]
    effects: { trust_felix: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Annika Q1 ---

  annika_q1:
    type: tweet
    from: annika
    text: >
      ich bin 2 stunden hin und 2 stunden zurück gefahren jeden tag
      um bei jonas zu sein. und jetzt fahr ich hin um seine sachen
      einzupacken. das ist nicht real. das ist einfach nicht real.
    effects: { trust_annika: "+5", contacts_followed: "+1" }
    choices:
      - DM Annika -> annika_q1_talk

  annika_q1_talk:
    type: message
    text: >
      ANNIKA: Jonas called me that evening. Around 8pm. He sounded
      stressed. He said he'd had a fight with Felix — a bad one.
      Felix found out that Jonas was planning to take on a second
      apprentice. Felix lost it. Screamed at him, said Jonas was
      "replacing" him.

      Jonas said Felix stormed out. He said "I think I need to let
      him go." Those were his last words to me.

      And then at some point in the night, he went back to the
      workshop. Why?
    effects: { trust_annika: "+10" }
    choices:
      - What was the fight about exactly? -> annika_fight
      - Move on -> quest1_hub

  annika_fight:
    type: message
    text: >
      ANNIKA: Felix was obsessed with being Jonas's only student.
      He saw himself as the heir — the one who'd carry on Jonas's
      legacy. When Jonas mentioned a second apprentice, Felix
      took it as a personal betrayal.

      But it went deeper than that. Jonas told me Felix had been
      copying his designs and selling them online as his own. Jonas
      confronted him about it. That's when the real explosion
      happened.

      The logging thing too — Felix hated that Jonas spent time on
      the investigation instead of teaching him. He'd say things
      like "the forest is stealing you from the workshop."
    effects: { trust_annika: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Jonas died. Multiple people saw or
      heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Sophie (was out photographing, saw Felix) -> sophie_interview
      - Find Ralf (sawmill owner, heard the truck) -> ralf_interview
      - Find Sabine (baker, starts at 5am, saw lights) -> sabine_interview
      - Find Tobias (forester, found tracks) -> tobias_interview

  # --- Sophie (saw Felix at the workshop) ---

  sophie_interview:
    type: tweet
    from: sophie
    text: >
      ich war die nacht draußen mit meiner kamera. mondlicht über dem
      schwarzwald. es war so still. fast zu still.
    effects: { trust_sophie: "+5" }
    choices:
      - Ask Sophie about that evening -> sophie_talk

  sophie_talk:
    type: message
    text: >
      SOPHIE: ok alter bitte sag das nicht weiter. ich war auf dem
      waldweg mit meiner kamera, so gegen 23 uhr. und ich hab felix
      gesehen. er ist aus jonas' werkstatt gerannt. nicht normal
      gegangen — GERANNT. der sah scheiße aus, total aufgelöst,
      hat geheult oder geschrien, ich weiß nicht.

      und er hatte was in der hand. so ein beutel oder eine rolle.
      ich hab mich hinter einem baum versteckt weil ich angst hatte.
      er ist in richtung wald gelaufen. nicht nach hause. in den wald.

      am nächsten morgen war jonas tot. ich hab seitdem nicht geschlafen.
    effects:
      trust_sophie: "+10"
      night_witnesses: "+1"
      apprentice_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Ralf (sawmill owner, heard the truck) ---

  ralf_interview:
    type: tweet
    from: ralf
    text: >
      Das Sägewerk läuft normal weiter. Wir haben Aufträge. Punkt.
      Über den Rest rede ich nicht.
    effects: { trust_ralf: "+5" }
    choices:
      - Ask Ralf what he heard -> ralf_talk

  ralf_talk:
    type: message
    text: >
      RALF: Look, I run the sawmill. Schwarzwald-Holz is my biggest
      client. I process their timber. I don't ask where it comes from
      — that's their business, their permits, their problem.

      But that night — yes, a truck came in around 1am. Dropped off
      logs. No paperwork. The driver said Krause authorised it and to
      process them first thing in the morning. Before anyone could see.

      The logs were old-growth oak. No forestry stamps. No markings at
      all. I've been in timber my whole life — those trees were
      Bannwald quality. Protected.

      I processed them. God help me, I processed them.
    effects:
      trust_ralf: "+10"
      night_witnesses: "+1"
      logging_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

