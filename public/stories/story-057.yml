  # --- Jonas's Evidence ---

  jonas_evidence:
    type: message
    text: >
      Jonas's workshop has been released by the police. His laptop and
      backup drive are gone — Lena confirmed that. But his public posts
      on Weilersbach.social remain. Scrolling back through months of
      posts:

      GPS coordinates of fresh stumps in the Bannwald. Photos of
      illegally felled trees — massive oaks, some over 200 years old.
      Close-ups of chainsaw marks matching Schwarzwald-Holz equipment.
      Truck tire tracks matching their fleet. A spreadsheet estimating
      the volume of timber taken: over 300 cubic metres in six months.

      The last entry in his public log: "Hab die zweite Zufahrt
      gefunden. Sie benutzen den alten Kohlenmeilerweg. Fotos folgen."

      The photos never came.
    effects:
      logging_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue -> logging_hub

  # --- Nico ---

  nico_interview:
    type: message
    text: >
      NICO: I don't reveal sources. Ever.
    effects: { trust_nico: "+5" }
    choices:
      - Show Nico the evidence you have -> nico_with_evidence
        when:
          state: logging_evidence
          gte: 3
      - Back to logging thread -> logging_hub

  nico_with_evidence:
    type: message
    text: >
      NICO: ...you have more than I expected.

      Okay. Jonas and I were working together on a story. He had
      evidence that Schwarzwald-Holz was systematically harvesting
      the Bannwald — protected forest, old-growth trees, massive
      ecological value. The wood was being sold to specialty dealers
      in Switzerland and Austria for veneer and instrument-making.
      Premium prices. Hundreds of thousands of euros.

      Jonas had photos, GPS data, timber volume estimates. We were
      weeks from publishing. Then he died.

      And three days after his death, someone broke into my office
      and stole my notes. Just the Jonas file. Nothing else.

      Jonas is dead. But someone contacted me — anonymously — and
      said there's a second copy of everything. Jonas hid it
      somewhere in the village. He didn't trust digital storage alone.
    effects:
      trust_nico: "+25"
      logging_evidence: "+1"
      evidence_total: "+2"
    choices:
      - Who contacted you? -> nico_hint
      - Back to investigation hub -> investigation_hub

  nico_hint:
    type: message
    text: >
      NICO: I genuinely don't know. Anonymous message through the
      instance. But they knew details only someone close to Jonas
      would know. They said "Look where the wood talks." That's
      something Jonas used to say.

      And there's something else. The night Jonas died, Dieter
      Krause — the Schwarzwald-Holz boss — was not at home. His
      wife told a neighbour he was "handling a situation in the
      forest." At midnight.

      Jonas went up to the Bannwald that night with his camera. He
      caught them logging. And someone made sure he wouldn't talk.
    choices:
      - Back to investigation hub -> investigation_hub

  # --- Jens (Schwarzwald-Holz worker) ---

  jens_interview:
