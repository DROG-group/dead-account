  jens_detail:
    type: message
    text: >
      JENS: Twice a month Krause calls a crew — me, two others — for
      "special operations." Always at night. Always in the Bannwald.
      No headlights, no forestry stamps, no paperwork.

      We fell whatever he marks. Old trees, big ones. We load them
      on the truck and they go straight to the sawmill. Processed
      before dawn. By morning, those trees are planks with no
      traceable origin.

      I know it's illegal. I have a family. Krause pays triple for
      night work. I kept my mouth shut.

      Until Jonas died. Now I can't sleep. Because the night Jonas
      died, we were in the Bannwald. And Krause got a phone call.
      He left. Came back an hour later. Said "Problem solved." And
      we kept cutting.
