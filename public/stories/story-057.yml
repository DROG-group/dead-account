      You present your evidence to Felix:

      "I know @tanja_wolf is your account. I know you were in the
      workshop that night. I know you took the chisels. I know you
      ran into the forest at 23:00. I have witnesses and I have
      your deleted posts."
    choices:
      - Send -> felix_response

  felix_response:
    type: message
    text: >
      Felix doesn't reply for hours. Then:

      FELIX: Du verstehst das nicht. Jonas war alles für mich. ALLES.
      Er war der einzige Mensch der je an mich geglaubt hat. Und dann
      wollte er mich rauswerfen. Einen ZWEITEN Lehrling nehmen. Meine
      Entwürfe hat er "Diebstahl" genannt.

      Ich bin in die Werkstatt gegangen um zu reden. Es ist eskaliert.
      Er hat gesagt ich soll gehen. Ich hab das Gerüst geschoben. Ich
      wollte ihm Angst machen, nicht — ich wollte nicht dass er —

      Die Meißel hab ich mitgenommen. Weil er mir nie eigene gegeben
      hätte. Das war alles was ich hatte.

      That's not devotion. That's destruction.

      You've already sent the evidence to Hauptkommissar Wendt. And
      to Nico Falk.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE APPRENTICE

      Three things happen in quick succession.

      Hauptkommissar Wendt reopens the case. With your evidence — the
      anonymous account, the witness testimonies, the deleted posts,
      the pharmacist's statement — Felix Brenner is arrested for
      manslaughter. He confesses. The loosened scaffolding bolts were
      deliberate. He wanted the scaffolding to collapse when Jonas
      climbed it — to scare him, he says. Jonas fell. Felix panicked.
      He took the chisels, deleted his posts, and ran.

      Nico Falk, with the evidence from the hidden compartment in
      Jonas's cuckoo clock at the Gasthaus, publishes the
      Schwarzwald-Holz story in the Badische Zeitung. The Forstamt
      orders an immediate investigation. Dieter Krause faces criminal
      charges for illegal logging in a protected forest. The Bannwald
      is placed under emergency conservation.

      And Lena Müller, standing in her brother's empty workshop, opens
      the clock and finds the USB drive. She uploads everything to
      Weilersbach.social.

      Jonas's evidence speaks from beyond the workshop floor.
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: lena
    text: >
      jonas hat gesagt: holz lügt nicht. er hatte recht. der wald
      wird geschützt. der mörder meines bruders steht vor gericht.
      danke an alle die nicht aufgegeben haben.

      ruhe in frieden, großer bruder.
    choices:
      - The End -> game_complete

  # --- ENDING B: Dieter (Partial Ending) ---

  confront_dieter:
    type: message
    text: >
      You present the logging evidence to Dieter Krause:

      "I have photos of the Bannwald stumps. I have GPS coordinates.
      I have your worker's confession about night shifts. I have the
      sawmill records. I have Jonas's timber trace to Switzerland."
    choices:
      - Send -> dieter_response

  dieter_response:
    type: message
    text: >
      DIETER: This conversation is being forwarded to our legal
      department. Any publication of defamatory material will result
      in immediate proceedings. Schwarzwald-Holz operates within all
      applicable forestry regulations.

      But it's too late. You've sent the evidence to Nico, to the
      Schwarzwaldverein, and to the Forstamt.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE LOGGING BOSS

      The logging story breaks. Schwarzwald-Holz is ordered to halt
      all operations pending investigation. The Bannwald is placed
      under emergency protection. Dieter Krause faces criminal
      charges. The village is divided — jobs versus the forest.

      But Jonas?

      Without the apprentice evidence, Felix is never investigated.
      He leaves Weilersbach quietly. Moves to another town. Takes
      up woodworking under a different name. The chisels go with
      him. Jonas's death remains officially an accident.

      Six months later, Felix takes on an apprentice of his own.
      A young man, eager, devoted. Felix tells him: "I learned
      from the best. He gave me everything."

      The forest is saved. But the person who killed Jonas walks
      free, carrying his stolen legacy.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: lena
    text: "der wald ist sicher. aber mein bruder hat keine gerechtigkeit. noch nicht."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_klaus:
    type: message
    text: >
      You confront Bürgermeister Hartmann with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> klaus_response

  klaus_response:
    type: tweet
    from: uli
    text: >
      Mein Mandant nimmt Ihre Anschuldigungen zur Kenntnis. Jede
      öffentliche Verbreitung verleumderischer Aussagen wird
      unverzüglich rechtlich verfolgt. — Kanzlei Brandt & Partner,
      Freiburg
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Hartmann and the illegal logging — and there
      isn't one beyond political protection — your evidence targets
      the wrong person.

      Schwarzwald-Holz continues to operate. Felix remains free.
      The Bannwald continues to shrink, tree by tree, night by night.

      A year later, another old-growth oak falls in silence.
      Nobody photographs the stump. Nobody even notices.

      And in Jonas's empty workshop, sawdust settles on tools that
      will never be used again.
    choices:
      - The End -> game_complete

