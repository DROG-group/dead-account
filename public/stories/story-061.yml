entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN BALLYNURE
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Ballynure.social — the community Mastodon instance for
      the village of Ballynure, County Kerry, Ireland.

      The local feed is restless today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @siobhan_walsh.

      A sheep farmer. Fourth generation on the mountain. She documented
      everything — the land, the weather, the flock. People are worried.
      She hasn't posted in five days.
    choices:
      - Look at her profile -> siobhan_profile

  siobhan_profile:
    type: tweet
    from: siobhan
    text: "The access road they're building isn't on any planning document I can find. Forty-tonne trucks on a boreen that's been a sheep path for two hundred years. I have the photos and I have the county records. Something is very wrong."
    choices:
      - That's her last real post... -> dark_photo

  dark_photo:
    type: message
    text: >
      Two days after that post, her account uploaded a single image:
      a blurred photo of a green hillside. Overexposed, tilted, shot
      from a strange angle. Posted at 4am. No caption.

      Her friends say that's not her style. Siobhan always wrote long
      captions about the weather and the sheep. The Guards say she
      probably went walking and lost signal. Something doesn't add up.
    choices:
      - Read the Garda statement -> garda_statement
      - Look at what people are saying -> community_reaction

  garda_statement:
    type: tweet
    from: sergeant
    text: >
      We have received a report regarding a resident of Ballynure.
      At this time, there is no evidence to suggest foul play. Any
      information can be communicated to Ballynure Garda Station
      or by calling 999.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her best friend @aisling_brennan is
      desperate. Her brother @cormac_walsh is driving from Dingle.
      Her partner @padraig_osullivan is posting frantic messages.
      The farmer @brendan_healy says she was right about the road.

      And the journalist @fionnuala_obrien is strangely silent.

      Nobody buys the Guards' line. Nobody thinks Siobhan just
      "went walking."
    effects: { trust_cormac: "+5", trust_aisling: "+5" }
    choices:
      - Start following Siobhan's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Ballynure. Follow Siobhan's contacts and read
      their posts. The more you engage with the community, the more
      they'll trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Sean (pub owner, knows everyone) -> sean_intro
      - Talk to Brendan (farmer, saw the road) -> brendan_intro
      - Talk to Ciara (teen rider, seems shaken) -> ciara_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes panic about Siobhan with the rhythms of a small
      Kerry village: mart prices, weather warnings, the pub's trad
      session lineup, mass times.

      Key names surface: Aisling (best friend, nurse), Padraig
      (partner, teacher, destroyed), Fionnuala (journalist, oddly
      quiet), and the teens — Ciara, Tommy, Ryan — who looked up
      to Siobhan's farming work.

      Also prominent: AtlantiWind Energy Ltd, the wind farm company
      with a development on the ridge above the village. Their posts
      are corporate PR. Siobhan's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Sean -> sean_intro
      - Talk to Brendan -> brendan_intro
      - Talk to Ciara -> ciara_intro

  # --- Sean (social map) ---

  sean_intro:
    type: tweet
    from: sean
    text: >
      The pub is open but the heart isn't in it. @siobhan_walsh,
      your stool is waiting. Come back to us now.
    effects: { trust_sean: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sean -> sean_talk

  sean_talk:
    type: message
    text: >
      SEAN: Ah, you're new? Welcome to Ballynure. Shite timing to
      arrive, I'll tell you that much. The whole village is in bits
      over Siobhan.

      Let me tell you who's who. Aisling is Siobhan's best friend —
      they've been thick as thieves since school. Sweet girl, in an
      absolute state right now. Padraig is her partner, teaches at
      the national school. Lovely man, barely holding it together.
      Cormac is her brother, fisherman out of Dingle, driving over
      as we speak.

      And Fionnuala O'Brien — the journalist from the Herald — she
      and Siobhan were working on something together. Something
      about that wind farm. Fionnuala hasn't said a word since
      Siobhan vanished. That's not like her at all.

      Oh, and keep an eye on that neighbour. Dermot Lyons. There's
      a land dispute there that goes back years. Bitter stuff.
    effects: { trust_sean: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Dermot -> sean_dermot
      - Ask about AtlantiWind -> sean_atlantiwind
      - Thank him and move on -> quest1_hub

  sean_dermot:
    type: message
    text: >
      SEAN: Dermot Lyons? He farms the land next to Siobhan. Their
      families have been fighting over a boundary wall since before
      I was born. But it got worse — much worse — when the wind farm
      came along. AtlantiWind offered big money for access rights,
      and the proposed route goes right through disputed land.

      Dermot wanted to sign. Siobhan refused. Said the turbines
      would destroy the mountain. Dermot went mad. Started showing
      up at her gate at all hours, shouting about how she was
      costing him his retirement.

      I barred him from the pub last month after he had a few and
      started saying things about Siobhan that I won't repeat.
      Feck that carry-on in my house.
    effects: { trust_sean: "+5" }
    choices:
      - Ask about AtlantiWind -> sean_atlantiwind
      - Move on -> quest1_hub

  sean_atlantiwind:
    type: message
    text: >
      SEAN: AtlantiWind showed up two years ago with their plans.
      Thirty turbines on the ridge. They promised jobs, community
      fund, the whole lot. Half the village is for it — the money's
      massive. Half the village is against — the mountain would be
      destroyed.

      Siobhan was the loudest voice against. She had photos of
      the access road they started building without proper planning
      permission. She had drainage reports showing the turbine
      foundations would destroy the peat bog and poison the water
      table. She was building a case.

      Two weeks later she's gone. What the actual fuck like.
    effects: { trust_sean: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Brendan (farmer, saw the road) ---

  brendan_intro:
    type: tweet
    from: brendan
    text: >
      forty years on this mountain. never seen a road like that
      appear overnight. @siobhan_walsh was right. and now she's
      gone. join the dots.
    effects: { trust_brendan: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Brendan -> brendan_talk

  brendan_talk:
    type: message
    text: >
      BRENDAN: I've been farming this mountain since I was a lad.
      I know every field, every stream, every sheep path. And I'm
      telling you — that access road is not right. Heavy machinery
      on a boreen that hasn't seen more than a tractor in two
      centuries.

      Siobhan took photos. She went up to the county council offices
      in Tralee and checked the planning files. The road doesn't
      appear on any approved plan. It's being built without
      permission and nobody's saying a word.

      You think that's a coincidence? Sure look.
    effects: { trust_brendan: "+10" }
    choices:
      - Did you see anything unusual recently? -> brendan_night
      - Move on -> quest1_hub

  brendan_night:
    type: message
    text: >
      BRENDAN: The night before she went quiet — I was up with a
      sick ewe, around midnight. I saw lights on the mountain road.
      Not headlights — smaller, like torches. Moving up toward
      Siobhan's top fields. Two, maybe three people.

      And then I heard her dogs barking. Fierce barking, the kind
      they do for strangers. That was around half twelve.

      I didn't think much of it then. Foxes, maybe, I told myself.
      Now I think about it constantly. Should have gone up to check.
      Shite.
    effects: { trust_brendan: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Ciara (teen rider, witness tease) ---

  ciara_intro:
    type: tweet
    from: ciara
    text: >
      im so worried like @siobhan_walsh she literally taught me to
      ride she literally taught me how to look after lambs she's
      like the best person in this village if anyone knows anything
      please please say
    effects: { trust_ciara: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Ciara -> ciara_talk_early

  ciara_talk_early:
    type: message
    text: >
      CIARA: you're new here? shite timing. siobhan is like literally
      the best person in ballynure. she taught us everything about
      the mountain. lambing season she'd have us all up at four in
      the morning and she'd make it class somehow.

      and now im freaking out because tommy saw something weird at
      siobhan's gate the other night but he won't talk about it.
      says it was nothing but like... it wasn't nothing. the
      absolute state of him when he told me, he was white as a
      sheet.
    effects: { trust_ciara: "+10" }
    choices:
      - What did Tommy see? -> ciara_tommy_hint
      - Move on -> quest1_hub

  ciara_tommy_hint:
    type: message
    text: >
      CIARA: i don't know exactly. he was walking home from hurling
      and he saw someone at siobhan's gate like messing with something.
      or leaving something. he's scared out of his mind and won't
      talk about it. you'd need to ask him straight out but he's
      pure sus of anyone he doesn't know. maybe talk about hurling
      first haha

      what the actual fuck is going on in this village
    effects: { trust_ciara: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Ballynure. A Kerry mountain village
      built around farming and the land. A sheep farmer who was
      exposing wind farm corruption. A disappearance nobody believes
      is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Aisling (Siobhan's best friend) -> aisling_q1
      - Talk to Padraig (Siobhan's partner) -> padraig_q1
      - Check what Cormac (Siobhan's brother) is saying -> cormac_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Aisling Q1 ---

  aisling_q1:
    type: tweet
    from: aisling
    text: >
      if anyone has news of @siobhan_walsh please ring me. her
      wellies are by the door. her dogs are going mad. she wouldn't
      leave without her dogs. she just wouldn't.
    effects: { trust_aisling: "+5", contacts_followed: "+1" }
    choices:
      - DM Aisling -> aisling_q1_talk

  aisling_q1_talk:
    type: message
    text: >
      AISLING: Thanks for reaching out but I don't know you. Siobhan
      has a lot of friends here. I'm sure she'll be back.

      ...I keep saying that. I don't believe it anymore.

      [Aisling is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_aisling: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Padraig Q1 ---

  padraig_q1:
    type: tweet
    from: padraig
    text: >
      The sheep need feeding. The dogs need walking. I'm doing it
      all. But I can't do it without knowing where she is. @siobhan_walsh
      please just come home. Whatever it is we'll sort it.
    effects: { trust_padraig: "+5", contacts_followed: "+1" }
    choices:
      - DM Padraig -> padraig_q1_talk

  padraig_q1_talk:
    type: message
    text: >
      PADRAIG: Who are you? Another person from that crowd who's
      going to tell me to give it time? She rang me the night before
      she disappeared. She said she had something big. She said "if
      anything happens, look at AtlantiWind." Then she said something
      about the neighbour. About Dermot. Said he'd been at the gate
      again.

      That's the last I heard from her.
    effects: { trust_padraig: "+10" }
    choices:
      - What do you think happened? -> padraig_theory
      - Move on -> quest1_hub

  padraig_theory:
    type: message
    text: >
      PADRAIG: I think she found proof that AtlantiWind are building
      without permission and someone shut her up. But I also think
      that gobshite Dermot Lyons is involved. The way he talks about
      her land... it's not a normal boundary dispute. It's something
      darker.

      Siobhan told me weeks ago that someone had been on her property
      at night. Gates left open, sheep scattered. She thought it was
      foxes. I don't think it was foxes.

      The absolute state of this village. Everyone knows something
      and nobody's saying it.
    effects: { trust_padraig: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Cormac Q1 ---

  cormac_q1:
    type: tweet
    from: cormac
    text: >
      my sister has GONE and the Guards are telling me she probably
      went hillwalking and lost signal?? SHE KNOWS THAT MOUNTAIN
      BETTER THAN ANY GUARD IN KERRY. driving from dingle now.
      someone will explain this to me.
    effects: { trust_cormac: "+5", contacts_followed: "+1" }
    choices:
      - DM Cormac -> cormac_q1_talk

  cormac_q1_talk:
    type: message
    text: >
      CORMAC: Who are you? Another person from that village who's
      going to tell me to calm down? My sister rang me the night
      before she disappeared. She said she had evidence that would
      "blow the whole thing open." She said "if anything happens,
      look at the planning files."

      Then she said something else — "and he was at the gate
      again tonight. He's always there."

      She wouldn't say who. Her voice was shaking.
    effects: { trust_cormac: "+10" }
    choices:
      - What do you think "he" means? -> cormac_theory
      - Move on -> quest1_hub

  cormac_theory:
    type: message
    text: >
      CORMAC: I don't know exactly. But Siobhan told me months ago
      about Dermot Lyons. Not just the boundary dispute — the man
      is obsessed with her land. Watches her farm from the hill
      above. Counts her sheep. Keeps track of when she comes and
      goes.

      She told the Guards. They said it was a civil matter. A fecking
      civil matter. A man watching your farm from a hill with
      binoculars is a civil matter apparently.

      This isn't about a wall. This is about something sick.
    effects: { trust_cormac: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Siobhan went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Tommy (was walking home from hurling) -> tommy_interview
      - Find Noreen (post office, early morning) -> noreen_interview
      - Find Orla (walking guide, dawn patrol) -> orla_interview
      - Find Declan (vet, late night call) -> declan_interview

  # --- Tommy (saw someone at Siobhan's gate) ---

  tommy_interview:
    type: tweet
    from: tommy
    text: >
      good session tonight but the vibe around the village is pure
      off. something isn't right. can't explain it like
    effects: { trust_tommy: "+5" }
    choices:
      - Ask Tommy about that evening -> tommy_talk

  tommy_talk:
    type: message
    text: >
      TOMMY: right ok but you tell no one yeah. i was walking home
      from hurling around seven. and i saw dermot lyons at siobhan's
      gate. he was doing something to the lock like. or putting
      something on the gatepost. when he saw me he legged it back
      to his land.

      like i said nothing cos who'd believe me? a young fella
      ratting on a farmer. feck that. but now it's serious and
      i'm shitting it
    effects:
      trust_tommy: "+10"
      night_witnesses: "+1"
      neighbour_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Noreen (post office, saw late-night meeting) ---

  noreen_interview:
    type: tweet
    from: noreen
    text: >
      Up early as always for the deliveries. But that morning the
      road past the church had fresh tyre tracks. Big ones. Not
      from any local car.
    effects: { trust_noreen: "+5" }
    choices:
      - Ask Noreen what she saw -> noreen_talk

  noreen_talk:
    type: message
    text: >
      NOREEN: I was closing up the shop around half ten that night.
      I saw Siobhan's jeep still parked by the community hall. And
      next to it — a big black Range Rover. Dublin plates. Two men
      in suits standing by the hall door. One of them I recognised
      from the papers: Donal Cahill, the AtlantiWind project director.

      At half ten. At the community hall. In Ballynure. That's not
      normal now.

      I wrote it down in my diary. Nobody's asked to see it.
    effects:
      trust_noreen: "+10"
      night_witnesses: "+1"
      windfarm_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Orla (walking guide, saw Siobhan fleeing) ---

  orla_interview:
    type: tweet
    from: orla
    text: >
      up at five for the dawn walk. the mountain path wasn't empty.
      someone running on the sheep track. in the dark. that's not
      a walker.
    effects: { trust_orla: "+5" }
    choices:
      - Ask Orla what she saw -> orla_talk

  orla_talk:
    type: message
    text: >
      ORLA: I get up at five every morning for the dawn walks. That
      morning — the morning after Siobhan's last post — I saw someone
      on the sheep track above the village. Running. A woman, carrying
      a bag, heading up toward the pass. It was barely light. She
      was moving fast, like she was afraid.

      I called out but she didn't stop. I thought maybe someone out
      with the sheep early but... who runs up a mountain at five in
      the morning carrying a holdall?

      When I heard about Siobhan, I put it together. That was her.
      Running from something.
    effects:
      trust_orla: "+10"
      night_witnesses: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Declan (vet, late night call, saw car chase) ---

  declan_interview:
    type: tweet
    from: declan
    text: >
      Out on a call at half four this morning. Calving. But on the
      mountain road — a vehicle going far too fast for that road
      at that hour.
    effects: { trust_declan: "+5" }
    choices:
