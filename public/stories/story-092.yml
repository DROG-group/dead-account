      i hab wollen ermitteln wegen AlpinResort. Mei Vorgesetzter hat
      gsagt i soll des lassen. "Bezirkshauptmannschaft is zuständig."
      Des is Beamtendeutsch für "Finger weg."

      De Gschicht mit der Lisa is was anderes. Davon hab i bis jetzt
      nix gwusst. Wenn du Beweise für Stalking hast, dann kann i was
      machen. Des is eindeutig mei Zuständigkeit.

      Bring mir was Handfestes und i mach den Fall wieder auf.
    effects:
      trust_inspektor: "+15"
      evidence_total: "+1"
    choices:
      - Back to obsession thread -> stalker_hub

  # =====================================================================
  # QUEST 4: CONFRONTATION
  # =====================================================================

  quest4_start:
    type: message
    text: >
      THE ACCUSATION

      You've gathered evidence. You know more about what happened
      to Anna than anyone in Seebründl. Who is responsible?
    choices:
      - Confront Lisa Harmony (the obsessive influencer) -> confront_lisa
        when:
          state: stalker_evidence
          gte: 5
      - Confront Thomas Lechner (the resort director) -> confront_thomas
        when:
          state: resort_evidence
          gte: 3
      - Confront Mayor Wallner (political protection) -> confront_franz
      - I need more evidence -> investigation_hub

  # --- ENDING A: Lisa (Best Ending) ---

  confront_lisa:
    type: message
    text: >
      You present your evidence to Lisa Harmony:

      "I know @berggeist is your account. I know you put a tracker
      on Anna's boat. I know you broke into her herb hut. I know you
      were watching her flat. I have witnesses and I have the
      anonymous posts that match your writing style."
    choices:
      - Send -> lisa_response

  lisa_response:
    type: message
    text: >
      Lisa doesn't reply for a long time. Then:

      LISA: Du verstehst das nicht. Anna und ich — wir sind gleich.
      Wir gehören zusammen. Ich wollte sie nur beschützen. AlpinResort
      war gefährlich für sie und sie hat meine Hilfe nicht angenommen.
      Alles was ich getan habe, war aus Liebe.

      That's not love. That's obsession.

      You've already sent the evidence to Inspektor Brandner. And to
      Doris Steiner.
    choices:
      - Wait for the result -> ending_a

  ending_a:
    type: message
    text: >
      ENDING A: THE OBSESSION

      Three things happen in quick succession.

      Inspektor Brandner reopens the case. With your evidence — the
      anonymous account, the GPS tracker, the break-in at the hut,
      the witness testimonies — Lisa Harmony is arrested for stalking,
      Nötigung, and Hausfriedensbruch. A GPS tracker is recovered
      from Anna's boat at the old boathouse.

      Doris Steiner, in possession of Anna's full evidence package,
      publishes the AlpinResort story in Der Standard. The
      Bezirkshauptmannschaft orders an immediate stop of all
      construction on the Kirchsteig-Alm. Thomas Lechner faces
      criminal charges for illegal construction on protected land.

      And Anna Gruber, reading the story from a friend's house in
      Hallstatt, calls her sister for the first time in nine days.

      "I kumm ham."

      If you or someone you know is experiencing stalking or
      harassment, help is available:
      Frauenhelpline gegen Gewalt: 0800 222 555 (kostenlos, 24/7)
      Opfernotruf: 0800 112 112
      Onlineberatung: www.frauenhelpline.at
    choices:
      - See the epilogue -> ending_a_epilogue

  ending_a_epilogue:
    type: tweet
    from: anna
    text: >
      de almwiese blüht weiter. und de leit in seebründl a. danke
      dass es ned aufgeben habts.
    choices:
      - The End -> game_complete

  # --- ENDING B: Thomas (Partial Ending) ---

  confront_thomas:
    type: message
    text: >
      You present the environmental evidence to Thomas Lechner:

      "I have photographs of illegal construction on protected alpine
      meadow. I have the flora surveys proving endangered species on
      the site. I have the building permits that don't exist. I have
      your brother's excavators with your company name on them."
    choices:
      - Send -> thomas_response

  thomas_response:
    type: message
    text: >
      THOMAS: Dieses Gespräch wird an unsere Rechtsabteilung
      weitergeleitet. Jede Veröffentlichung von rufschädigenden
      Behauptungen wird rechtliche Konsequenzen haben. AlpinResort
      Seebründl hat stets im Einklang mit geltendem Recht gehandelt.

      But it's too late. You've sent the evidence to Doris, to the
      Naturschutzverein, and to the Bezirkshauptmannschaft.
    choices:
      - Wait for the result -> ending_b

  ending_b:
    type: message
    text: >
      ENDING B: THE CORPORATION

      The construction scandal breaks. AlpinResort is ordered to halt
      all work pending investigation. The project may be cancelled.
      Fifty promised jobs vanish. The village is divided.

      But Anna?

      Without the stalking evidence, Lisa is never investigated. She
      continues to live in Seebründl. She creates a new wellness brand.
      She creates a new anonymous account. She watches.

      Three months later, Anna reads about AlpinResort online. She
      returns quietly. She moves her herb hut to a different meadow.
      She installs a lock. She checks her boat every morning.

      The corporation is exposed. But the person who terrorised Anna
      walks free.
    choices:
      - See the epilogue -> ending_b_epilogue

  ending_b_epilogue:
    type: tweet
    from: anna
    text: "i bin wieder da. de wiesen san grettet. der rest... schauma moi."
    choices:
      - The End -> game_complete

  # --- ENDING C: Mayor (Wrong Ending) ---

  confront_franz:
    type: message
    text: >
      You confront Bürgermeister Wallner with your evidence.

      Within the hour, you receive a message from his office:
    choices:
      - Read the response -> franz_response

  franz_response:
    type: tweet
    from: rudi
    text: >
      Mein Mandant nimmt Ihre Anschuldigungen zur Kenntnis. Jede
      Verbreitung von ehrenrührigen Behauptungen wird unverzüglich
      gerichtlich verfolgt. — Kanzlei Maier & Partner, Salzburg
    choices:
      - What happens next? -> ending_c

  ending_c:
    type: message
    text: >
      ENDING C: THE POLITICIAN

      The mayor's lawyer buries your accusation. Without a direct
      link between Wallner and AlpinResort's illegal construction —
      and there isn't one beyond political protection — your evidence
      is insufficient.

      AlpinResort continues to build. Lisa continues to watch. Anna
      stays in hiding.

      Six months later, @berggeist creates a new account. It follows
      Anna's sister.
    choices:
      - The End -> game_complete

  # =====================================================================
