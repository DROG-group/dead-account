entry: welcome

nodes:

  # =====================================================================
  # PROLOGUE — ARRIVING IN SEEBRÜNDL
  # =====================================================================

  welcome:
    type: message
    text: >
      Welcome to Seebründl.social — the community Mastodon instance for
      the alpine village of Seebründl, nestled in the Salzkammergut
      between lake and mountain.

      The local feed is uneasy today. Something has happened.
    choices:
      - Check the feed -> feed_intro

  feed_intro:
    type: message
    text: >
      Scrolling through the feed, you notice the same name everywhere:
      @anna_gruber.

      A herb farmer. She cultivated alpine meadow plants. Ran workshops
      on traditional remedies. People loved her. She hasn't posted in
      six days.
    choices:
      - Look at her profile -> anna_profile

  anna_profile:
    type: tweet
    from: anna
    text: "Die Almwiese oberhalb vom Kirchsteig wird planiert. Bagger stehen schon da. Die Gemeinde hat das genehmigt ohne uns zu fragen. I hab Fotos und Dokumente. Des wird ned still bleiben."
    choices:
      - That's her last real post... -> grey_mountain

  grey_mountain:
    type: message
    text: >
      Three days after that post, her account uploaded a single image:
      a blurred photo of mountain fog. Grey, overexposed, shot from
      a strange angle. Posted at 2am. No caption.

      Her friends say that's not her style. Anna always wrote long
      captions about every plant, every season. The police say she
      probably went hiking and lost signal. Nobody believes that.
    choices:
      - Read the police statement -> police_statement
      - Look at what people are saying -> community_reaction

  police_statement:
    type: tweet
    from: inspektor
    text: >
      Bezüglich einer als vermisst gemeldeten Bewohnerin von Seebründl:
      Derzeit liegen keine Hinweise auf eine Straftat vor. Es wird von
      einem freiwilligen Fernbleiben ausgegangen. Hinweise bitte an die
      PI Seebründl oder unter 133.
    choices:
      - What are people saying? -> community_reaction

  community_reaction:
    type: message
    text: >
      The reactions are chaotic. Her sister @lena_gruber is desperate.
      Her partner @markus_hofer has been searching the mountain trails
      for days. Her student @sophie_eder is posting frantic messages.
      The alpine farmer @sepp_kirchner says she was right about the
      meadow.

      And the wellness influencer @lisa_harmony, who had been
      commenting obsessively on Anna's herb posts, has gone completely
      silent.

      Nobody buys the police line. Nobody thinks Anna just "went
      hiking."
    effects: { trust_lena: "+5", trust_markus: "+5" }
    choices:
      - Start following Anna's contacts -> quest1_start

  # =====================================================================
  # QUEST 1: FIRST IMPRESSIONS
  # =====================================================================

  quest1_start:
    type: message
    text: >
      QUEST: FIRST IMPRESSIONS

      Get to know Seebründl. Follow Anna's contacts and read their
      posts. The more you engage with the community, the more they'll
      trust you.

      Start with the people who seem most willing to talk.
    choices:
      - Talk to Hilde (Gasthof owner, knows everyone) -> hilde_intro
      - Talk to Sepp (alpine farmer, saw the bulldozers) -> sepp_intro
      - Talk to Jonas (teen mountainbiker, seems shaken) -> jonas_intro
      - Check the local feed first -> feed_browse

  feed_browse:
    type: message
    text: >
      The feed mixes worry about Anna with the rhythms of a small
      alpine village: weather warnings, cheese delivery schedules,
      mountain rescue updates, the Gasthof's daily specials.

      Key names surface: Lena (sister, teacher), Markus (partner,
      carpenter, out searching the mountains), Sophie (biology student
      and Anna's apprentice), and the teens — Jonas, Michi, Nina —
      who helped Anna on the meadows every summer.

      Also prominent: AlpinResort Seebründl GmbH, the ski resort
      developer. Their posts are glossy PR about "sustainable alpine
      tourism." Anna's posts were the opposite.
    effects: { contacts_followed: "+3" }
    choices:
      - Talk to Hilde -> hilde_intro
      - Talk to Sepp -> sepp_intro
      - Talk to Jonas -> jonas_intro

  # --- Hilde (social map) ---

  hilde_intro:
    type: tweet
    from: hilde
    text: >
      Der Gasthof is offen oba de Stimmung is ned guat. @anna_gruber,
      dei Kräuterteemischung steht nu am Tresen. Kumm zruck.
    effects: { trust_hilde: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Hilde -> hilde_talk

  hilde_talk:
    type: message
    text: >
      HILDE: Ah, du bist neu? Grüß di. Schlechter Zeitpunkt zum
      Herziehen. Alle san nervös wegen der Anna.

      I sag dir wer wer is. Die Lena is die Schwester, Volksschullehrerin,
      total fertig grad. Der Markus is Annas Partner, Tischler, rennt
      seit Tagen jeden Steig am Berg ab. Die Sophie studiert Biologie
      und hat bei Anna Kräuterkurse gmacht.

      Und dann is da die Lisa Harmony. Die is vor am Jahr hergezogen,
      macht so Wellness-Zeug im Internet. Hat si an die Anna rangschmeißt
      wie a Klette. Wollte unbedingt "kooperieren" mit den Kräutern.
      Anna hat höflich nein gsagt. Die Lisa hat ned aufghört.

      Ach ja, und AlpinResort — die wollen de halbe Alm zubetonieren
      für Schipisten. Annas Wiesen san genau dort oben.
    effects: { trust_hilde: "+10", contacts_followed: "+2" }
    choices:
      - Ask about Lisa -> hilde_lisa
      - Ask about AlpinResort -> hilde_resort
      - Thank her and move on -> quest1_hub

  hilde_lisa:
    type: message
    text: >
      HILDE: Die Lisa? Oida, die is a eigene Gschicht. Kam letztes
      Jahr her, hat si als "Wellness Coach" vorgestellt. Macht so
      Detox-Retreats und verkauft Kräutertees online für dreißig Euro
      die Packung. Nur — die Kräuter waren ned ihre.

      Sie hat Annas Rezepturen kopiert. Anna hat des rausgfundn und
      war stinksauer. Hat auf Seebründl.social gpostet, dass Lisa ihre
      Arbeit klaut. Seither is die Lisa... komisch. Schreibt Anna
      dauernd Nachrichten, mal nett, mal bedrohlich. "Wir könnten so
      gut zusammenarbeiten" und dann "Du wirst bereuen, dass du mich
      öffentlich bloßgestellt hast."

      Die Anna hat mir amoi gsagt: "Die schaut mi an als ghör i ihr."
    effects: { trust_hilde: "+5" }
    choices:
      - Ask about AlpinResort -> hilde_resort
      - Move on -> quest1_hub

  hilde_resort:
    type: message
    text: >
      HILDE: AlpinResort. Große Pläne, große Investoren, großes Mundwerk.
      Die wollen oben am Kirchsteig a Skigebiet bauen. Neue Lifte,
      Beschneiungsanlage, Après-Ski-Hütten. Klingt nach Geld für
      Seebründl, aber die Almwiesen oben — die san seit Hunderten von
      Jahren bewirtschaftet. Geschützte Pflanzen, seltene Kräuter.

      Anna hat als Erste gesagt: des geht ned. Sie hat die ganzen
      Naturschutz-Gutachten organisiert. Hat Fotos von den Baggern
      gmacht, die schon angfangen haben zu planieren, obwohl no ka
      Genehmigung da war.

      Zwei Wochen später is sie weg. Mach dir dein eigenes Bild.
    effects: { trust_hilde: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sepp (alpine farmer, witness tease) ---

  sepp_intro:
    type: tweet
    from: sepp
    text: >
      sechzig jahr auf der alm. und jetzt stehen bagger dort wo mei
      großvater nu gmäht hat. @anna_gruber hat recht ghabt. und jetzt
      is sie weg. des is ka zufall.
    effects: { trust_sepp: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Sepp -> sepp_talk

  sepp_talk:
    type: message
    text: >
      SEPP: I bin am Berg aufgwachsen. Mei Familie bewirtschaftet de
      Alm seit vier Generationen. De Wiesen oben — des san ka
      Baugrund. Des is Lebensraum. Enzian, Arnika, Silberdistel.
      Gschützte Arten.

      De Anna hat Bodenproben gnommen. Hat Pflanzen kartiert. Hat an
      ganzen Bericht gschriebn, der beweist, dass des Gebiet unter
      Naturschutz ghört. Und dann hat AlpinResort trotzdem angfangen
      zu baggern. Bei Nacht. Ohne Genehmigung.

      Glaubst du des is a Zufall, dass sie jetzt weg is? I glaub ned
      an Zufälle am Berg.
    effects: { trust_sepp: "+10" }
    choices:
      - Did you see anything unusual recently? -> sepp_night
      - Move on -> quest1_hub

  sepp_night:
    type: message
    text: >
      SEPP: In der Nacht bevor sie verschwundn is — i war oben beim
      Vieh, um halb zwölf. Hab Lichter gsehn beim Kräuterstadl, des
      is Annas Hütte oben auf der Alm. Ned ungewöhnlich, sie arbeitet
      oft spät.

      Oba dann hab i a zweites Auto gsehn. An schwarzen SUV. Ned aus
      der Gegend. Hat ka Kennzeichen ghabt, des i erkennen hab können
      im Dunkeln. Der is um Mitternacht abgfahrn, viel zu schnell
      für den Forstweg.

      Hab mir nix dabei dacht. Jetzt denk i dauernd dran.
    effects: { trust_sepp: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Jonas (teen mountainbiker, witness tease) ---

  jonas_intro:
    type: tweet
    from: jonas
    text: >
      oida @anna_gruber is de einzige person de mi überzeugt hat dass
      kräuter cool san und ned nur für omas. wenn wer was weiß bitte
      sagts es. des is ned normal dass einfach verschwindet
    effects: { trust_jonas: "+5", contacts_followed: "+1" }
    choices:
      - Reply to Jonas -> jonas_talk_early

  jonas_talk_early:
    type: message
    text: >
      JONAS: wos, du bist neu da? fix oida, voll da schlechte
      zeitpunkt. die anna is halt einfach de beste. hat uns allen
      gezeigt welche pflanzen man essen kann am berg, welche giftig
      san. hat sogar unser schulprojekt betreut.

      und jetzt is sie weg und de polizei sagt "wandern gegangen"??
      geh bitte. wer glaubt denn sowas.

      der michi hat übrigens was gsehn letzte woche am see. er will
      ned drüber reden. sagt es war nix. oba der lügt voll schlecht
      oida
    effects: { trust_jonas: "+10" }
    choices:
      - What did Michi see? -> jonas_michi_hint
      - Move on -> quest1_hub

  jonas_michi_hint:
    type: message
    text: >
      JONAS: weiß ned genau. er war abends beim see, so gegen
      sonnenuntergang, und hat gsehn wie wer bei annas boot war. hat
      irgendwas reinglegt oder rausgnommen, er war ned sicher. und
      dann is die person schnell weg.

      michi sagt er hat ned gsehn wer es war oba i glaub er lügt.
      er traut si nur ned. versuch mal mit ihm über skitouren zu reden,
      dann taut er auf haha
    effects: { trust_jonas: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Quest 1 Hub ---

  quest1_hub:
    type: message
    text: >
      You're getting a picture of Seebründl. A Salzkammergut village
      between lake and mountain. A herb farmer who was fighting a ski
      resort expansion. A disappearance nobody believes is voluntary.

      You've made contacts. Now dig deeper.
    choices:
      - Talk to Lena (Anna's sister) -> lena_q1
      - Talk to Sophie (Anna's student) -> sophie_q1
      - Check what Markus (Anna's partner) is saying -> markus_q1
      - I'm ready to investigate the night she disappeared -> quest2_start
        when:
          state: contacts_followed
          gte: 3

  # --- Lena Q1 ---

  lena_q1:
    type: tweet
    from: lena
    text: >
      bitte wenn wer @anna_gruber gsehn hat meldets euch. ihre
      kräuterhütte is offen. ihr rucksack is da. ihre wanderschuhe
      stehen beim eingang. sie is nirgends hingangen.
    effects: { trust_lena: "+5", contacts_followed: "+1" }
    choices:
      - DM Lena -> lena_q1_talk

  lena_q1_talk:
    type: message
    text: >
      LENA: I kenn di ned. I weiß ned warum i mit dir redn soll.
      Mei Schwester is weg und alle tuan so als wär nix.

      ...Entschuldigung. I bin fertig mit den Nerven.

      [Lena is guarded. You'll need to build more trust before she
      opens up.]
    effects: { trust_lena: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Sophie Q1 ---

  sophie_q1:
    type: tweet
    from: sophie
    text: >
      @anna_gruber hat die vollständigste Kartierung der Almflora
      im ganzen Salzkammergut. Ihre Proben stehen noch im Labor.
      Sie würde ihre Forschung niemals im Stich lassen.
    effects: { trust_sophie: "+5", contacts_followed: "+1" }
    choices:
      - DM Sophie -> sophie_q1_talk

  sophie_q1_talk:
    type: message
    text: >
      SOPHIE: Anna und ich haben seit über einem Jahr zusammengearbeitet.
      Sie hat mich alles über alpine Heilpflanzen gelehrt. Jede Pflanze,
      jede Wirkung, jede Jahreszeit. Ihre Arbeit auf der Almwiese war
      gleichzeitig ihr Naturschutz-Beweis gegen AlpinResort.

      Was mich beunruhigt: Anna hat letzte Woche gesagt, jemand war
      in ihrer Hütte. Sachen waren verschoben. Ihr Laptop stand offen,
      obwohl sie ihn immer zumacht. Und dann hat sie diesen Blick
      gekriegt — wie wenn du weißt, dass jemand dich beobachtet.

      [Sophie seems genuinely frightened.]
    effects: { trust_sophie: "+5" }
    choices:
      - Move on -> quest1_hub

  # --- Markus Q1 ---

  markus_q1:
    type: tweet
    from: markus
    text: >
      TAG VIER. Jeden Steig abgsucht. Jede Hütte. Jedes Ufer. De
      Polizei sogt "wandern". ANNA WANDERT NED OHNE MICH. Sie hätt
      ma gschrieben. Sie hätt angrufen. Irgendwas stimmt ned.
    effects: { trust_markus: "+5", contacts_followed: "+1" }
    choices:
      - DM Markus -> markus_q1_talk

  markus_q1_talk:
    type: message
    text: >
      MARKUS: Wer bist du? Noch wer der mir sagt i soll mi beruhigen?
      Mei Partnerin hat mi in der Nacht bevor sie verschwundn is
      angrufen. Sie hat gsagt sie hat Beweise. Sie hat gsagt "wenn
      irgendwas passiert, schau dir AlpinResort an." Und dann hat
      sie nu was gsagt — "und die Lisa, die lasst mi ned in Ruh."

      Des war des letzte was i von ihr ghört hab.
    effects: { trust_markus: "+10" }
    choices:
      - What do you think happened? -> markus_theory
      - Move on -> quest1_hub

  markus_theory:
    type: message
    text: >
      MARKUS: I glaub AlpinResort hat sie zum Schweigen bracht. Sie
      hatte Beweise, dass die illegal baggern auf gschütztem Gebiet.
      Fotos, Gutachten, alles. Des hätte das ganze Projekt gestoppt.

      Oba i glaub a, dass die Lisa Harmony da mit drin hängt. Ned
      wegen dem Resort — wegen irgendwas anderm. Die Art wie die
      Anna angschaut hat... des war ned normal. Anna hat mir erzählt,
      dass Lisa ihre Hütte ausspioniert. Dass sie nachts an der
      Almwiese war. Immer wieder.

      A Firmeninteresse und a Wahnsinnige. Anna hat gegen beides
      gleichzeitig kämpft.
    effects: { trust_markus: "+5" }
    choices:
      - Move on -> quest1_hub

  # =====================================================================
  # QUEST 2: THE LAST NIGHT
  # =====================================================================

  quest2_start:
    type: message
    text: >
      QUEST: THE LAST NIGHT

      Something happened the night Anna went silent. Multiple people
      saw or heard things. Piece together the timeline from witnesses.

      You need accounts from at least 4 people.
    choices:
      - Find Michi (was at the lake at sunset) -> michi_interview
      - Find Karl (fisherman, up before dawn) -> karl_interview
      - Find Hansi (mountain rescue, heard noises) -> hansi_interview
      - Find Barbara (pharmacist, saw headlights) -> barbara_interview

  # --- Michi (saw someone at Anna's boat) ---

  michi_interview:
    type: tweet
    from: michi
    text: >
      schene skitour heit oba de stimmung in seebründl is irgendwie
      oasch. fix oida i mag gar ned drüber nachdenken
    effects: { trust_michi: "+5" }
    choices:
      - Ask Michi about that evening -> michi_talk

  michi_talk:
    type: message
    text: >
      MICHI: oida ok oba du sagst des niemandem gö. i war am see
      gegen 18 uhr, wollte fotos machen vom sonnenuntergang. und da
      war wer bei annas ruderboot. hat irgendwas reingelegt oder
      dran rumgfummelt. als die person mi gsehn hat is sie abghaut
      richtung waldweg.

      und oida... i bin mir ned hundertpro sicher, oba es hat ausgsehen
      wie die lisa harmony. gleiche jacke, gleiche haare. oba es war
      scho dunkel.

      scheiß drauf, i hätt was sagen sollen oba wer glaubt an
      siebzehnjährigen
    effects:
      trust_michi: "+10"
      night_witnesses: "+1"
      stalker_evidence: "+1"
      evidence_total: "+1"
    choices:
      - Continue investigating -> quest2_hub

  # --- Karl (fisherman, saw late-night vehicle) ---

  karl_interview:
    type: tweet
    from: karl
    text: >
